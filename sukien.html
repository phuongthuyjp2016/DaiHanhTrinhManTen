  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, arrayUnion, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC84j3PM2_PInZbUm3IBCfQSessFndkSJ8",
    authDomain: "daihanhtrinhmanten.firebaseapp.com",
    projectId: "daihanhtrinhmanten",
    storageBucket: "daihanhtrinhmanten.firebasestorage.app",
    messagingSenderId: "30871212921",
    appId: "1:30871212921:web:2788a345640d7c8e6715a8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUid = null;

  window.skSync = {
    currentUid: () => currentUid,
    signIn: async () => {
      const result = await signInWithPopup(auth, new GoogleAuthProvider());
      currentUid = result.user.uid;
      return { uid: result.user.uid, name: result.user.displayName };
    },
    onAuthChanged: (cb) => onAuthStateChanged(auth, (user) => {
      currentUid = user ? user.uid : null;
      cb(user ? { uid: user.uid, name: user.displayName } : null);
    }),
    fetchGameEvents: async () => {
      try {
        const q = query(collection(db, 'game_events'), orderBy('createdAt', 'desc'), limit(30));
        const snap = await getDocs(q);
        return snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) { console.error('[skSync] fetchGameEvents failed', e); return []; }
    },
    fetchGameEventByCode: async (code) => {
      try {
        const snap = await getDoc(doc(db, 'game_events', code));
        return snap.exists() ? { id: snap.id, ...snap.data() } : null;
      } catch (e) { console.error('[skSync] fetchGameEventByCode failed', e); return null; }
    },
    createGameEvent: async (code, event) => {
      await setDoc(doc(db, 'game_events', code), event);
    },
    joinGameEvent: async (code, uid, name, avatarArt, shipArt) => {
      await updateDoc(doc(db, 'game_events', code), { participants: arrayUnion({ uid, name: name || 'Ẩn danh', avatarArt: avatarArt || '', shipArt: shipArt || '' }) });
    },
    updateEventState: async (code, patch) => {
      await updateDoc(doc(db, 'game_events', code), patch);
    },
    watchGameEvent: (code, cb) => onSnapshot(doc(db, 'game_events', code), (snap) => {
      cb(snap.exists() ? { id: snap.id, ...snap.data() } : null);
    })
  };
</script>

];

function stripTags(s) { return String(s == null ? '' : s).replace(/<[^>]*>/g, ''); }
// Bôi đen từ mục tiêu trong câu ví dụ (mảng ứng viên vì câu có thể chia động từ khác dạng
// từ điển — thử rút ngắn dần từng ứng viên để tìm phần thân từ dài nhất khớp trong câu).
function highlightWord(sentence, candidates) {
  let best = null;
  (candidates || []).filter(Boolean).forEach(word => {
    for (let len = word.length; len >= 2; len--) {
      const stem = word.slice(0, len);
      const idx = sentence.indexOf(stem);
      if (idx !== -1) { if (!best || len > best.len) best = { idx, len }; break; }
    }
  });
  if (!best) return escapeHtml(sentence);
  return escapeHtml(sentence.slice(0, best.idx))
    + '<b style="color:#c0392b; text-decoration:underline;">' + escapeHtml(sentence.slice(best.idx, best.idx + best.len)) + '</b>'
    + escapeHtml(sentence.slice(best.idx + best.len));
}
function formatSec(s) {
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Trích xuất literal JS (mảng/object) nằm ngay sau `marker` trong `text`, bằng cách quét
// dấu ngoặc có nhận diện string ('/"/`) và comment `//` — an toàn hơn eval cả file (các file
// đảo có gọi DOM ở cuối script, chạy cả file dễ throw lỗi không liên quan tới dữ liệu).
function jsLiteralAfter(text, marker) {
  const idx = text.indexOf(marker);
  if (idx === -1) return null;
  let i = idx + marker.length;
  while (i < text.length && /\s/.test(text[i])) i++;
  const start = i;
  let depth = 0, inStr = false, strChar = '', esc = false, inComment = false;
  for (; i < text.length; i++) {
    const c = text[i];
    if (inComment) { if (c === '\n') inComment = false; continue; }
    if (inStr) {
      if (esc) esc = false;
      else if (c === '\\') esc = true;
      else if (c === strChar) inStr = false;
      continue;
    }
    if (c === '/' && text[i + 1] === '/') { inComment = true; continue; }
    if (c === '"' || c === "'" || c === '`') { inStr = true; strChar = c; continue; }
    if (c === '{' || c === '[') { depth++; continue; }
    if (c === '}' || c === ']') {
      depth--;
      if (depth === 0) { i++; break; }
      continue;
    }
  }
  return text.slice(start, i);
}
function evalJsLiteral(text) { return new Function('return (' + text + ');')(); }

async function fetchSourceLiteral(source) {
  const res = await fetch(source.file);
  const text = await res.text();
  const literal = jsLiteralAfter(text, source.marker);
  if (!literal) throw new Error('Không tìm thấy dữ liệu ' + source.marker + ' trong ' + source.file);
  return evalJsLiteral(literal);
}

// Mỗi normalizer trả về mảng câu hỏi dạng chuẩn {text, choices, correct} (correct: index 0-based).
function normalizeTuVung(V) {
  return (V || []).filter(x => x && x.s && Array.isArray(x.op) && typeof x.a === 'number')
    .map(x => ({ text: x.s, choices: x.op, correct: x.a, html: highlightWord(x.s, [x.k, x.h]) }));
}
function normalizeNguPhap(QUIZ_DATA) {
  const out = [];
  ((QUIZ_DATA && QUIZ_DATA.rounds) || []).forEach((round, ri) => {
    (round.parts || []).forEach((part, pi) => {
      if (part.type === 'single' || part.type === 'order') {
        (part.items || []).forEach(it => {
          if (it && it.q && Array.isArray(it.o) && typeof it.a === 'number') {
            out.push({ text: it.q, choices: it.o, correct: it.a });
          }
        });
      } else if (part.type === 'reading' && part.passage) {
        const groupId = 'ngupap-' + ri + '-' + pi;
        (part.items || []).forEach(it => {
          if (it && Array.isArray(it.o) && typeof it.a === 'number') {
            out.push({
              passage: part.passage,
              text: '【' + it.label + '】 ' + (part.title || ''),
              choices: it.o,
              correct: it.a - 1, // items trong "reading" đánh số đáp án từ 1, khác với single/order (0-based)
              groupId
            });
          }
        });
      }
    });
  });
  return out;
}
function normalizeKanji(VOCAB) {
  return (VOCAB || []).filter(x => x && x.k && x.r && Array.isArray(x.wrong) && x.wrong.length === 3)
    .map(x => {
      const choices = shuffleArr([x.r].concat(x.wrong));
      return { text: '「' + x.k + '」の読み方として正しいものはどれか。', choices, correct: choices.indexOf(x.r) };
    });
}
function normalizeDoanVan(data) {
  return (data || []).filter(x => x && x.question && Array.isArray(x.choices) && typeof x.correct === 'number')
    .map(x => ({ text: x.question, passage: x.passage || '', choices: x.choices, correct: x.correct, durationSec: DOKKAI_DURATION_SEC }));
}
function normalizeTrungVan(baiList) {
  const out = [];
  (baiList || []).forEach((bai, bi) => {
    const passage = stripTags(bai.passageHTML || '');
    const groupId = 'trungvan-' + bi;
    (bai.questions || []).forEach(q => {
      if (q && q.q && Array.isArray(q.choices) && typeof q.correct === 'number') {
        out.push({ text: stripTags(q.q), passage, choices: q.choices.map(stripTags), correct: q.correct, durationSec: DOKKAI_DURATION_SEC, groupId });
      }
    });
  });
  return out;
}
function normalizeTruongVan(DATA) {
  const out = [];
  (DATA || []).forEach((bai, bi) => {
    const groupId = 'truongvan-' + bi;
    (bai.questions || []).forEach(q => {
      if (q && q.q && Array.isArray(q.options) && typeof q.answer === 'number') {
        out.push({ text: q.q, passage: bai.passage || '', choices: q.options, correct: q.answer, durationSec: DOKKAI_DURATION_SEC, groupId });
      }
    });
  });
  return out;
}
const TOPIC_NORMALIZERS = {
  tuvung: normalizeTuVung, ngupap: normalizeNguPhap, kanji: normalizeKanji,
  doanvan: normalizeDoanVan, trungvan: normalizeTrungVan, truongvan: normalizeTruongVan
};

// Tải kho đề thật từ các đảo cho những chủ đề đã chọn, gộp lại rồi random ra tối đa
// QUESTIONS_PER_EVENT câu. Được host gọi 1 lần lúc tạo sự kiện; kết quả ghi thẳng vào
// Firestore (ev.questions) để mọi người chơi cùng 1 bộ câu hỏi giống nhau.
async function buildQuestionPool(topicIds) {
  const topics = TOPICS.filter(t => topicIds.includes(t.id) && t.available && t.source);
  const lists = await Promise.all(topics.map(async t => {
    try {
      const raw = await fetchSourceLiteral(t.source);
      return TOPIC_NORMALIZERS[t.source.kind](raw);
    } catch (e) {
      console.error('[buildQuestionPool] failed for topic', t.id, e);
      return [];
    }
  }));
  const flat = [].concat(...lists).filter(q => q.text && Array.isArray(q.choices) && q.choices.length >= 2 && typeof q.correct === 'number' && q.correct >= 0 && q.correct < q.choices.length);

  // Gom các câu hỏi cùng 1 bài đọc (groupId) lại thành từng nhóm để random theo NHÓM chứ
  // không random từng câu riêng lẻ — tránh việc 1 bài trung/trường văn có 2-3 câu hỏi nhưng
  // chỉ 1 câu lọt vào bộ đề, còn các câu còn lại của bài đó bị rớt ngẫu nhiên.
  const groupsByKey = {};
  const groupOrder = [];
  flat.forEach((q, i) => {
    const key = q.groupId || ('__single_' + i);
    if (!groupsByKey[key]) { groupsByKey[key] = []; groupOrder.push(key); }
    groupsByKey[key].push(q);
  });
  const shuffledGroups = shuffleArr(groupOrder.map(k => groupsByKey[k]));
  const pool = [];
  for (const group of shuffledGroups) {
    pool.push(...group);
    if (pool.length >= QUESTIONS_PER_EVENT) break;
  }
  return pool;
}

function genEventCode() {

  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function enterLobby(code) {

    lobbyEvent = ev; render();

function startEventNow() {
  if (!lobbyCode || startingEvent) return;

  window.skSync.updateEventState(lobbyCode, {
    status: 'started', startedAt: Date.now(),
    currentQuestionIndex: 0, questionState: 'active', questionStartedAt: Date.now(), answers: []
  }).then(() => { startingEvent = false; render(); }).catch(() => { startingEvent = false; render(); });
}

function submitAnswer(choiceIdx) {
  const ev = lobbyEvent;
  if (!ev || ev.questionState !== 'active') return;
  const uid = window.skSync.currentUid();
  if (!uid) return;
  const qIndex = ev.currentQuestionIndex;
  const q = (ev.questions && ev.questions.length ? ev.questions : SAMPLE_QUESTIONS)[qIndex];
  const correct = choiceIdx === q.correct;
  // mục 9 đặc tả: 100 điểm cơ bản + bonus tốc độ 0~50 điểm theo % thời gian còn lại lúc trả lời
  // (rất nhanh ≈150, trung bình ≈125, gần hết giờ ≈105; sai luôn 0, không phạt điểm).
  const duration = q.durationSec || QUESTION_DURATION_SEC;
  const elapsedSec = (Date.now() - (ev.questionStartedAt || Date.now())) / 1000;
  const remainingFrac = Math.max(0, Math.min(1, (duration - elapsedSec) / duration));
  const speedBonus = correct ? Math.round(50 * remainingFrac) : 0;
  const points = correct ? 100 + speedBonus : 0;
  const record = { uid, name: hostDisplayName(), qIndex, choice: choiceIdx, correct, points, speedBonus, answeredAt: Date.now() };
  // Cho phép đổi đáp án khi còn thời gian: thay bản ghi cũ của uid+qIndex này thay vì chỉ append.
  const others = (ev.answers || []).filter(a => !(a.uid === uid && a.qIndex === qIndex));
  window.skSync.updateEventState(lobbyCode, { answers: others.concat([record]) });
}
function lockQuestion() {
  window.skSync.updateEventState(lobbyCode, { questionState: 'locked' });
}
function revealResult() {
  window.skSync.updateEventState(lobbyCode, { questionState: 'result' });
}
function nextQuestion() {
  const ev = lobbyEvent;
  if (!ev) return;
  if (boatAnimRaf) { cancelAnimationFrame(boatAnimRaf); boatAnimRaf = null; }
  boatAnim = null;
  const nextIdx = (ev.currentQuestionIndex || 0) + 1;
  const total = (ev.questions && ev.questions.length) ? ev.questions.length : SAMPLE_QUESTIONS.length;
  if (nextIdx >= total) {
    window.skSync.updateEventState(lobbyCode, { status: 'ended' });
  } else {
    window.skSync.updateEventState(lobbyCode, { currentQuestionIndex: nextIdx, questionState: 'active', questionStartedAt: Date.now() });
  }
}

function boatPlayers(ev) {
  const list = [{ uid: ev.hostUid, name: ev.hostName || 'Ẩn danh', avatarArt: ev.hostAvatarArt || '', shipArt: ev.hostShipArt || '', isHost: true }]
    .concat((ev.participants || []).map(p => ({ uid: p.uid, name: p.name || 'Ẩn danh', avatarArt: p.avatarArt || '', shipArt: p.shipArt || '', isHost: false })));
  const seen = {};
  return list.filter(p => (seen[p.uid] ? false : (seen[p.uid] = true)));
}
function computeScores(ev, excludeQIndex) {
  const scores = {};
  boatPlayers(ev).forEach(p => { scores[p.uid] = 0; });
  (ev.answers || []).forEach(a => {
    if (excludeQIndex !== undefined && a.qIndex === excludeQIndex) return;
    if (scores[a.uid] !== undefined) scores[a.uid] += (a.points || 0);
  });
  return scores;
}
function findOvertakes(fromScores, toScores, uids) {
  const beforeOrder = uids.slice().sort((a, b) => fromScores[b] - fromScores[a]);
  const afterOrder = uids.slice().sort((a, b) => toScores[b] - toScores[a]);
  const beforeRank = {}; beforeOrder.forEach((u, i) => { beforeRank[u] = i; });
  const afterRank = {}; afterOrder.forEach((u, i) => { afterRank[u] = i; });
  const overtakes = [];
  uids.forEach(u => {
    uids.forEach(v => {
      if (u === v) return;
      if (beforeRank[u] > beforeRank[v] && afterRank[u] < afterRank[v]) overtakes.push([u, v]);
    });
  });
  return overtakes;
}
function startBoatAnimation(prevEv, ev) {
  const qIndex = ev.currentQuestionIndex;
  const fromScores = computeScores(prevEv, qIndex);
  const toScores = computeScores(ev);
  const uids = Object.keys(toScores);
  const overtakes = findOvertakes(fromScores, toScores, uids);
  boatAnim = { qIndex, fromScores, toScores, overtakes, startedAt: Date.now(), duration: 1400 };
  if (boatAnimRaf) cancelAnimationFrame(boatAnimRaf);
  let lastFrame = 0;
  const tick = (t) => {
    if (!boatAnim) return;
    if (t - lastFrame >= 33) { lastFrame = t; render(); }
    if (Date.now() - boatAnim.startedAt < boatAnim.duration) {
      boatAnimRaf = requestAnimationFrame(tick);
    } else {
      boatAnim = null; boatAnimRaf = null; render();
    }
  };
  boatAnimRaf = requestAnimationFrame(tick);
}

function boatDisplayScores(ev, qIndex) {
  const players = boatPlayers(ev);
  const animating = boatAnim && boatAnim.qIndex === qIndex;
  const revealed = ev.questionState === 'result';
  const t = animating ? Math.min(1, (Date.now() - boatAnim.startedAt) / boatAnim.duration) : 1;
  const eased = 1 - Math.pow(1 - t, 3);
  const finalScores = computeScores(ev);
  // Chưa "Hiện đáp án" thì thuyền phải đứng yên ở điểm số TRƯỚC câu này — người chơi bấm chọn
  // đáp án (dù đã lưu answer để tính điểm) không được làm thuyền nhúc nhích ngay lập tức.
  const frozenScores = computeScores(ev, qIndex);
  const scores = {};
  players.forEach(p => {
    if (animating) {
      const from = boatAnim.fromScores[p.uid] || 0;
      const to = boatAnim.toScores[p.uid] != null ? boatAnim.toScores[p.uid] : (finalScores[p.uid] || 0);
      scores[p.uid] = Math.round(from + (to - from) * eased);
    } else if (revealed) {
      scores[p.uid] = finalScores[p.uid] || 0;
    } else {
      scores[p.uid] = frozenScores[p.uid] || 0;
    }
  });
  return { players, scores, animating };
}

  const myDelta = (me && animating) ? ((boatAnim.toScores[me.uid] || 0) - (boatAnim.fromScores[me.uid] || 0)) : 0;

        <span style="font-size:clamp(10px,2.1cqw,21px); font-weight:800; color:#fff;">${myScore} PT</span>
      </div>
      <div style="width:6px; height:6px; background:#173a63; border-left:1.5px solid #ffe27a; border-bottom:1.5px solid #ffe27a; transform:rotate(-45deg); margin-top:-4px;"></div>
      ${myDelta > 0 ? `<div style="font-size:clamp(9px,1.9cqw,19px); font-weight:800; color:#2e8b57; text-shadow:0 1px 2px rgba(255,255,255,.9); margin-top:1px;">+${myDelta}</div>` : ''}
      <div style="position:relative; width:clamp(30px,6cqw,60px); height:clamp(34px,6.9cqw,69px); margin-top:2px;">
        ${me.shipArt
          ? `<img src="${escapeHtml(me.shipArt)}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform:scaleX(-1); filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));"/>`
          : `<span style="position:absolute; inset:0; font-size:clamp(28px,5.6cqw,56px); line-height:1; display:flex; align-items:center; justify-content:center;">🚢</span>`}
        <div style="position:absolute; top:-4px; right:-6px; width:clamp(16px,3.2cqw,32px); height:clamp(16px,3.2cqw,32px); border-radius:50%; overflow:hidden; border:1.5px solid #fff; background:#7fb3d5;">${myAvatarHtml}</div>
      </div>
    </div>` : '';

  const overtakeHtml = (animating && boatAnim.overtakes.length)
    ? `<div style="position:absolute; top:29%; left:8%; right:8%; text-align:center;"><span style="display:inline-block; background:rgba(255,255,255,.85); border-radius:8px; padding:2px 10px; font-size:clamp(9px,1.9cqw,19px); font-weight:800; color:#c0392b;">${
        boatAnim.overtakes.slice(0, 2).map(([u, v]) => {
          const un = (players.find(p => p.uid === u) || {}).name || '?';
          const vn = (players.find(p => p.uid === v) || {}).name || '?';
          return `🚀 ${escapeHtml(un)} vượt qua ${escapeHtml(vn)}!`;
        }).join(' · ')
      }</span></div>`
    : '';

  return `
    <div style="position:absolute; top:35%; left:50%; transform:translateX(-50%); width:80%; text-align:center; font-size:clamp(7px,2.4cqw,17px); font-weight:700; color:#5a3b22;">✨ Càng nhiều điểm – Càng gần kho báu! ✨</div>
    <div style="position:absolute; inset:0;">
      ${overtakeHtml}
      <div style="position:absolute; left:${safeLeft}%; top:${lineTop}%; transform:translate(-50%,-100%); text-align:center;">
        <div style="font-size:clamp(13px,2.6cqw,26px);">⚓</div>
        <div style="font-size:clamp(7px,1.4cqw,14px); font-weight:800; color:#5a3b22; text-shadow:0 1px 2px rgba(255,255,255,.6); white-space:nowrap;">BẮT ĐẦU</div>
      </div>
      <div style="position:absolute; left:${safeLeft}%; right:${100 - safeRight}%; top:${lineTop}%; height:2px; background:repeating-linear-gradient(90deg,#8ecbe6 0,#8ecbe6 4px,transparent 4px,transparent 8px);"></div>
      ${islandsHtml}
      ${myShipHtml}
      <div style="position:absolute; left:0; right:0; top:87%; text-align:center; font-size:clamp(8px,2.6cqw,19px); font-weight:700; color:#5a3b22; text-shadow:0 1px 2px rgba(255,255,255,.6);">Tiếp tục tiến về phía trước, thuyền trưởng! 🔥</div>
    </div>
  `;
}
// "TOP THUYỀN TRƯỞNG": tách riêng khỏi khung đua sóng, nằm ngay dưới nó — giữ đúng kiểu thẻ
// gỗ tối màu của bản thiết kế gốc (trước khi ghép vào khung ảnh) vì giờ không còn bị gò trong
// dải giấy da hẹp của khung nữa.
function boatLeaderboardHtml(ev, isHost) {
  const uid = window.skSync.currentUid();
  const qIndex = ev.currentQuestionIndex;
  const { players, scores } = boatDisplayScores(ev, qIndex);
  // Luôn hiển thị, kể cả khi chỉ có 1 mình người xem — không loại chính họ ra khỏi bảng nữa
  // (trước đây bị ẩn hẳn khi test một mình vì bảng lọc bỏ chính người xem).
  const sorted = players.slice().sort((a, b) => scores[b.uid] - scores[a.uid]);
  const top4 = sorted.slice(0, 4);
  if (!top4.length) return '';
  const rankMedal = ['🥇', '🥈', '🥉'];
  const top4Html = top4.map((p, i) => {
    const isMe = p.uid === uid;
    const avHtml = p.avatarArt
      ? `<img src="${escapeHtml(p.avatarArt)}" style="width:100%; height:100%; object-fit:cover;"/>`
      : `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:13px;">${p.isHost ? '🦈' : '🐟'}</div>`;
    const shipHtml = p.shipArt
      ? `<img src="${escapeHtml(p.shipArt)}" style="width:100%; height:100%; object-fit:contain; transform:scaleX(-1);"/>`
      : `<span style="font-size:14px;">🚢</span>`;
    return `<div class="sk-game-leaderboard-card" ${isHost ? `onclick="showBoatDetail('${p.uid}')"` : ''} style="display:flex; align-items:center; gap:6px; background:linear-gradient(180deg,#6b4a2e,#4a3220); border:1.5px solid ${isMe ? '#ffe27a' : '#8b5e34'}; border-radius:10px; padding:6px 9px; ${isHost ? 'cursor:pointer;' : ''}">
      <div style="font-size:14px; width:18px; text-align:center; flex-shrink:0;">${rankMedal[i] || ('#' + (i + 1))}</div>
      <div style="width:26px; height:26px; border-radius:50%; overflow:hidden; border:1.5px solid #ffe27a; background:#7fb3d5; flex-shrink:0;">${avHtml}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-weight:800; color:#fff; font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(p.name)}${p.isHost ? ' 👑' : ''}${isMe ? ' (Bạn)' : ''}</div>
        <div style="font-weight:700; color:#ffe27a; font-size:9.5px;">${scores[p.uid] || 0} PT</div>
      </div>
      <div style="width:16px; height:19px; flex-shrink:0;">${shipHtml}</div>
    </div>`;
  }).join('');
  return `
    <div class="sk-game-leaderboard" style="margin-top:10px;">
      <div style="font-family:'Baloo 2',sans-serif; font-weight:800; color:#ffe9b0; font-size:17px; text-shadow:0 1px 3px rgba(0,0,0,.6); text-align:center;">🏆 TOP THUYỀN TRƯỞNG</div>
      <div class="sk-game-leaderboard-list">${top4Html}</div>
    </div>
  `;
}
function boatDetailModalHtml(ev, uid) {
  const players = boatPlayers(ev);
  const player = players.find(p => p.uid === uid);
  if (!player) return '';
  const scores = computeScores(ev);
  const sorted = players.slice().sort((a, b) => scores[b.uid] - scores[a.uid]);
  const rank = sorted.findIndex(p => p.uid === uid) + 1;
  const upto = (typeof ev.currentQuestionIndex === 'number') ? ev.currentQuestionIndex : 0;
  const myAnswers = (ev.answers || []).filter(a => a.uid === uid);
  let answeredCount = 0, correctCount = 0;
  const historyRows = [];
  for (let i = upto; i >= 0; i--) {
    const a = myAnswers.find(x => x.qIndex === i);
    if (a) { answeredCount++; if (a.correct) correctCount++; }
    historyRows.push(`<div style="display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed rgba(255,255,255,.15);">
      <span style="color:#cdeef2; font-size:11.5px;">Q${i + 1}</span>
      <span style="font-weight:700; font-size:11.5px; color:${a ? (a.correct ? '#7ee0a8' : '#ff9a8b') : '#8ea0ac'};">${a ? '+' + a.points : 'chưa trả lời'}</span>
    </div>`);
  }
  const accuracy = answeredCount ? Math.round((correctCount / answeredCount) * 100) : 0;
  const avatarHtml = player.avatarArt
    ? `<img src="${escapeHtml(player.avatarArt)}" style="width:100%; height:100%; object-fit:cover;"/>`
    : `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:18px;">${player.isHost ? '🦈' : '🐟'}</div>`;
  const shipIconHtml = player.shipArt
    ? `<img src="${escapeHtml(player.shipArt)}" style="width:20px; height:23px; object-fit:contain; transform:scaleX(-1); vertical-align:middle; margin-right:3px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));"/>`
    : '🚢 ';
  return `
    <div onclick="closeBoatDetail()" style="position:fixed; inset:0; z-index:60; background:rgba(3,26,45,.62); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px;">
      <div onclick="event.stopPropagation()" style="background:linear-gradient(180deg,rgba(13,42,74,.95),rgba(23,58,99,.95)); border:2.5px solid #ffe9b0; border-radius:18px; padding:20px; max-width:320px; width:100%; box-shadow:0 14px 30px rgba(0,0,0,.4);">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="width:44px; height:44px; border-radius:50%; overflow:hidden; border:2px solid #ffe9b0; background:#7fb3d5; flex-shrink:0;">${avatarHtml}</div>
          <div>
            <div style="font-family:'Baloo 2',sans-serif; font-weight:800; color:#fff; font-size:16px; display:flex; align-items:center;">${shipIconHtml}${escapeHtml(player.name)}${player.isHost ? ' 👑' : ''}</div>
            <div style="color:#ffe27a; font-size:11px; font-weight:700;">Rank #${rank}</div>
          </div>
          <div onclick="closeBoatDetail()" style="margin-left:auto; cursor:pointer; color:#cdeef2; font-size:18px; font-weight:800;">✕</div>
        </div>
        <div style="margin-top:12px; text-align:center; background:rgba(255,255,255,.08); border-radius:12px; padding:10px;">
          <div style="font-family:'Baloo 2',sans-serif; font-weight:800; color:#ffe27a; font-size:22px;">${scores[uid] || 0} <span style="font-size:12px; color:#cdeef2;">điểm</span></div>
          <div style="color:#cdeef2; font-size:11px; margin-top:2px;">Accuracy: ${accuracy}% (${correctCount}/${answeredCount} câu)</div>
        </div>
        <div style="margin-top:12px; max-height:200px; overflow-y:auto;">${historyRows.join('')}</div>
      </div>
    </div>
  `;
}

function renderGame() {
  const ev = lobbyEvent;
  const uid = window.skSync.currentUid();
  const isHost = !!(uid && ev.hostUid === uid);
  const qIndex = ev.currentQuestionIndex;
  const questions = (ev.questions && ev.questions.length) ? ev.questions : SAMPLE_QUESTIONS;
  const q = questions[qIndex];
  const total = questions.length;
  const state = ev.questionState || 'active';
  const answers = ev.answers || [];
  const answersForQ = answers.filter(a => a.qIndex === qIndex);
  const totalParticipants = (ev.participants || []).length + 1;
  const myAnswer = answersForQ.find(a => a.uid === uid);
  const duration = q.durationSec || QUESTION_DURATION_SEC;
  const elapsed = Math.floor((Date.now() - (ev.questionStartedAt || Date.now())) / 1000);
  const remaining = Math.max(0, duration - elapsed);
  const numerals = ['①', '②', '③', '④'];

  const choicesHtml = q.choices.map((c, i) => {
    let bg = 'rgba(255,250,240,.85)', border = '#d9cfb8';
    if (state === 'result') {
      if (i === q.correct) { bg = 'rgba(46,139,87,.28)'; border = '#2e8b57'; }
      else if (myAnswer && myAnswer.choice === i) { bg = 'rgba(192,57,43,.22)'; border = '#c0392b'; }
    } else if (myAnswer && myAnswer.choice === i) {
      bg = 'rgba(245,166,35,.28)'; border = '#f5a623';
    }
    const clickable = state === 'active';
    return `<div ${clickable ? `onclick="submitAnswer(${i})"` : ''} style="cursor:${clickable ? 'pointer' : 'default'}; background:${bg}; border:2px solid ${border}; border-radius:12px; padding:12px 14px; margin-top:8px; font-weight:700; color:#3a2a18; font-size:14px;">${numerals[i]} ${escapeHtml(c)}</div>`;
  }).join('');

  let statusLineHtml;
  if (state === 'active') {
    statusLineHtml = myAnswer
      ? `<div style="text-align:center; color:#2e8b57; font-weight:700; font-size:13px; margin-top:10px;">✓ Đã chọn ${numerals[myAnswer.choice]} · ⏱ Còn ${formatSec(remaining)} (có thể đổi đáp án)</div>`
      : `<div style="text-align:center; color:#8b5e34; font-weight:700; font-size:13px; margin-top:10px;">⏱ Còn ${formatSec(remaining)}</div>`;
  } else if (state === 'locked') {
    statusLineHtml = `<div style="text-align:center; color:#8b5e34; font-weight:700; font-size:13px; margin-top:10px;">🔒 Đã khoá câu trả lời, chờ Host công bố đáp án...</div>`;
  } else {
    statusLineHtml = myAnswer
      ? (myAnswer.correct
          ? `<div style="text-align:center; color:#2e8b57; font-weight:800; font-size:14px; margin-top:10px;">🎉 Chính xác! +${myAnswer.points} điểm${myAnswer.speedBonus ? ` <span style="font-weight:700; font-size:11.5px; color:#b9761a;">(100 + ⚡${myAnswer.speedBonus} tốc độ)</span>` : ''}</div>`
          : `<div style="text-align:center; color:#c0392b; font-weight:800; font-size:14px; margin-top:10px;">❌ Sai rồi, đáp án đúng là ${numerals[q.correct]}</div>`)
      : `<div style="text-align:center; color:#8b5e34; font-weight:700; font-size:13px; margin-top:10px;">Bạn chưa trả lời câu này.</div>`;
  }

  const hostControlHtml = isHost ? `
    <div style="margin-top:20px; border-top:2px dashed #b9a679; padding-top:14px;">
      <div style="font-family:'Baloo 2',sans-serif; font-weight:800; color:#5a3b22; font-size:13px; margin-bottom:8px;">🎛 HOST CONTROL</div>
      <div style="color:#8b5e34; font-size:12.5px; font-weight:700;">👥 ${answersForQ.length} / ${totalParticipants} đã trả lời &nbsp;·&nbsp; ⏱ ${state === 'active' ? formatSec(remaining) : '--'}</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;">
        ${state === 'active' ? `<div onclick="lockQuestion()" style="cursor:pointer; flex:1; text-align:center; background:linear-gradient(180deg,#e07a5f,#c0392b); border:2px solid #8c2c1e; border-radius:10px; padding:9px; font-weight:800; color:#fff; font-size:12.5px;">🔒 Đóng câu hỏi</div>` : ''}
        ${state === 'locked' ? `<div onclick="revealResult()" style="cursor:pointer; flex:1; text-align:center; background:linear-gradient(180deg,#5fa8e0,#2c6bb0); border:2px solid #1e4c8c; border-radius:10px; padding:9px; font-weight:800; color:#fff; font-size:12.5px;">👁 Hiện đáp án</div>` : ''}
        ${state === 'result' ? `<div onclick="nextQuestion()" style="cursor:pointer; flex:1; text-align:center; background:linear-gradient(180deg,#ffd25a,#f5a623); border:2px solid #b9761a; border-radius:10px; padding:9px; font-weight:800; color:#5a3b22; font-size:12.5px;">${qIndex + 1 >= total ? '🏁 Kết thúc sự kiện' : '➡ Câu tiếp theo'}</div>` : ''}
      </div>
    </div>
  ` : '';

  document.getElementById('app').innerHTML = `
    <div class="sk-page-wrap">
      <div onclick="leaveLobby()" style="position:relative; z-index:5; cursor:pointer; color:#ffe9b0; font-weight:700; font-size:13px; width:fit-content; background:rgba(9,45,66,.6); border:1.5px solid #ffe9b0; border-radius:12px; padding:6px 14px; display:inline-block;">← Thoát</div>
      <div class="sk-game-layout">
        <div class="sk-game-boat-column">
          <div class="sk-game-boat-card" style="position:relative; z-index:4; background:url('assets/khung_bang_dua_top.png') center / 100% 100% no-repeat; aspect-ratio:1622/969; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));">
            ${boatTrackHtml(ev, qIndex, isHost)}
          </div>
          ${boatLeaderboardHtml(ev, isHost)}
        </div>
        <div class="sk-game-question-card" style="position:relative; z-index:4; background:linear-gradient(180deg,rgba(253,246,232,.9),rgba(243,230,201,.9)); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); border:2.5px solid #b9761a; border-radius:20px; padding:22px; box-shadow:0 8px 0 rgba(0,0,0,.15), 0 14px 24px rgba(0,0,0,.25);">
          <div style="text-align:center; color:#8b5e34; font-weight:700; font-size:11.5px; letter-spacing:.5px;">${escapeHtml(ev.name)}</div>
          <div style="text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; color:#5a3b22; font-size:16px; margin-top:2px;">Question ${qIndex + 1} / ${total}</div>
          ${q.passage ? `<div style="margin-top:14px; background:rgba(255,255,255,.55); border-radius:12px; padding:14px; font-size:14px; font-weight:500; color:#3a3226; text-align:left; white-space:pre-wrap; line-height:1.6;">${escapeHtml(q.passage)}</div>` : ''}
          <div style="margin-top:${q.passage ? '10px' : '14px'}; background:${q.passage ? 'rgba(245,166,35,.16)' : 'rgba(255,255,255,.6)'}; border:${q.passage ? '1.5px solid #f5a623' : 'none'}; border-radius:12px; padding:14px; font-size:15px; font-weight:700; color:#2b2620; text-align:${!q.passage && q.text.length > 120 ? 'left' : 'center'}; white-space:pre-wrap;">${q.html || escapeHtml(q.text)}</div>
          ${choicesHtml}
          ${statusLineHtml}
          ${hostControlHtml}
        </div>
      </div>
    </div>
    ${isHost && selectedBoatUid ? boatDetailModalHtml(ev, selectedBoatUid) : ''}
  `;
}

function renderResults() {
  const ev = lobbyEvent;
  const scores = {};
  scores[ev.hostUid] = { name: ev.hostName || 'Ẩn danh', points: 0, isHost: true };
  (ev.participants || []).forEach(p => { scores[p.uid] = { name: p.name || 'Ẩn danh', points: 0, isHost: false }; });
  (ev.answers || []).forEach(a => { if (scores[a.uid]) scores[a.uid].points += (a.points || 0); });
  const ranked = Object.values(scores).sort((a, b) => b.points - a.points);
  const medal = ['🥇', '🥈', '🥉'];
  const rowsHtml = ranked.map((r, i) => `
    <div style="display:flex; align-items:center; gap:10px; background:rgba(255,250,240,.85); border:1px solid #e2d3ae; border-radius:10px; padding:9px 14px; margin-top:8px;">
      <span style="font-size:18px; width:26px; text-align:center;">${medal[i] || (i + 1)}</span>
      <span style="flex:1; font-weight:700; color:#3a2a18; font-size:13.5px;">${escapeHtml(r.name)}${r.isHost ? ' 👑' : ''}</span>
      <span style="font-family:'Baloo 2',sans-serif; font-weight:800; color:#b9761a; font-size:14px;">${r.points} pts</span>
    </div>
  `).join('');
  document.getElementById('app').innerHTML = `
    <div class="sk-page-wrap">
      <div onclick="leaveLobby()" style="position:relative; z-index:5; cursor:pointer; color:#ffe9b0; font-weight:700; font-size:13px; width:fit-content; background:rgba(9,45,66,.6); border:1.5px solid #ffe9b0; border-radius:12px; padding:6px 14px; display:inline-block;">← Rời sự kiện</div>
      <div style="position:relative; z-index:4; max-width:480px; margin:14px auto; background:linear-gradient(180deg,rgba(253,246,232,.9),rgba(243,230,201,.9)); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); border:2.5px solid #f5a623; border-radius:20px; padding:24px; text-align:center; box-shadow:0 8px 0 rgba(0,0,0,.15), 0 14px 24px rgba(0,0,0,.25);">
        <div style="font-size:34px;">🎉</div>
        <div style="font-family:'Baloo 2',sans-serif; font-weight:800; color:#5a3b22; font-size:18px; margin-top:4px;">SỰ KIỆN KẾT THÚC</div>
        <div style="color:#8b5e34; font-size:12.5px; margin-top:2px;">${escapeHtml(ev.name)}</div>
        <div style="margin-top:16px; text-align:left;">${rowsHtml}</div>
      </div>
    </div>
  `;
}

function render() {
  if (view === 'lobby') {
    const ev = lobbyEvent;
    if (ev && ev.status === 'ended') { renderResults(); return; }
    if (ev && ev.status === 'started' && typeof ev.currentQuestionIndex === 'number' && ev.currentQuestionIndex >= 0) { renderGame(); return; }
    renderLobby();
    return;
  }
  renderList();
}

function renderList() {
  const stepsHtml = EVENT_STEPS.map((st, i) => stepHtml(st, i < EVENT_STEPS.length - 1)).join('');

  let listHtml = '';
  if (eventsLoading) {
    listHtml = `<div style="text-align:center; color:#ffe9b0; font-weight:700; font-size:13px; padding:20px 0; text-shadow:0 1px 3px rgba(0,0,0,.5);">⏳ Đang tải danh sách sự kiện...</div>`;
  } else if (eventsError) {
    listHtml = `<div style="text-align:center; color:#ffb4a8; font-weight:700; font-size:12.5px; padding:6px 0 14px; text-shadow:0 1px 3px rgba(0,0,0,.5);">${escapeHtml(eventsError)}</div>`;
  } else if (!events.length) {
    listHtml = `<div style="text-align:center; color:#ffe9b0; font-weight:600; font-size:13px; padding:20px 0; text-shadow:0 1px 3px rgba(0,0,0,.5);">Chưa có sự kiện nào đang mở. Hãy là người đầu tiên tạo sự kiện!</div>`;
  } else {
    listHtml = `<div style="display:flex; flex-direction:column; gap:10px;">${events.map(eventRowHtml).join('')}</div>`;
  }

  const modeOptionsHtml = EVENT_MODES.map(m => {
    const selected = newEvent.mode === m.id;
    const style = selected
      ? 'cursor:pointer; text-align:center; padding:10px 6px; border-radius:10px; border:2px solid #f5a623; background:linear-gradient(180deg,rgba(255,243,214,.85),rgba(255,230,168,.85)); color:#3a2a18;'
      : 'cursor:pointer; text-align:center; padding:10px 6px; border-radius:10px; border:1.5px solid #d9cfb8; background:rgba(255,250,240,.75); color:#3a2a18;';
    return `<div onclick="selectMode('${m.id}')" style="${style}">
      <div style="font-size:18px;">${m.icon}</div>
      <div style="font-size:11px; font-weight:700; margin-top:2px;">${m.label}</div>
    </div>`;
  }).join('');

  const topicOptionsHtml = TOPICS.map(t => {
    const checked = newEvent.topics.includes(t.id);
    if (!t.available) {
      return `<div style="display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:8px; opacity:.55;">
        <span style="font-size:13px;">☐</span>
        <span style="font-size:12px; color:#8b5e34;">${escapeHtml(t.label)} <span style="font-size:9.5px;">(chưa có nội dung)</span></span>
      </div>`;
    }
    const style = checked
      ? 'cursor:pointer; display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:8px; background:rgba(245,166,35,.22); border:1.5px solid #f5a623;'
      : 'cursor:pointer; display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:8px; background:rgba(255,250,240,.6); border:1.5px solid #d9cfb8;';
    return `<div onclick="toggleTopic('${t.id}')" style="${style}">
      <span style="font-size:13px;">${checked ? '☑' : '☐'}</span>
      <span style="font-size:12.5px; font-weight:700; color:#3a2a18;">${escapeHtml(t.label)}</span>
    </div>`;
  }).join('');

  const createModalHtml = showCreateForm ? `
    <div onclick="closeCreateForm()" style="position:fixed; inset:0; z-index:60; background:rgba(3,26,45,.62); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px;">
      <div onclick="event.stopPropagation()" style="background:linear-gradient(180deg,rgba(253,246,232,.9),rgba(243,230,201,.9)); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); border:2.5px solid #b9761a; border-radius:20px; padding:22px; max-width:440px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 14px 30px rgba(0,0,0,.4);">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
          <div style="font-family:'Baloo 2',sans-serif; font-weight:800; color:#5a3b22; font-size:17px;">TẠO SỰ KIỆN MỚI</div>

        </div>
        <div style="color:#5a3b22; font-weight:700; font-size:12px; margin-bottom:4px;">Tên sự kiện</div>
        <input id="skName" value="${escapeHtml(newEvent.name)}" oninput="onNameInput(this.value)" placeholder="Nhập tên sự kiện của bạn..." style="width:100%; border:1.5px solid #b9761a; border-radius:10px; padding:9px 12px; font-size:13px; margin-bottom:12px;"/>
        <div style="color:#5a3b22; font-weight:700; font-size:12px; margin-bottom:6px;">Chế độ</div>
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px;">${modeOptionsHtml}</div>
        <div style="color:#5a3b22; font-weight:700; font-size:12px; margin-bottom:6px;">Chủ đề (câu hỏi sẽ lấy từ kho đề tương ứng trong các đảo)</div>
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:6px 10px; margin-bottom:12px;">${topicOptionsHtml}</div>
        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <div style="flex:1;">
            <div style="color:#5a3b22; font-weight:700; font-size:12px; margin-bottom:4px;">Thời gian</div>
            <input value="${escapeHtml(newEvent.time)}" oninput="onTimeInput(this.value)" placeholder="20:30" style="width:100%; border:1.5px solid #b9761a; border-radius:10px; padding:9px 12px; font-size:13px;"/>
          </div>
          <div style="flex:1;">
            <div style="color:#5a3b22; font-weight:700; font-size:12px; margin-bottom:4px;">Số người tối đa</div>
            <input type="number" value="${newEvent.maxPlayers}" oninput="onMaxInput(this.value)" style="width:100%; border:1.5px solid #b9761a; border-radius:10px; padding:9px 12px; font-size:13px;"/>
          </div>
        </div>
        ${formError ? `<div style="color:#c0392b; font-size:12px; font-weight:700; margin-bottom:10px;">${escapeHtml(formError)}</div>` : ''}
        <div onclick="submitCreateEvent()" style="margin-top:6px; text-align:center; cursor:${creating ? 'default' : 'pointer'}; background:${creating ? '#e2d3ae' : 'linear-gradient(180deg,#3d5a80,#173a63)'}; border:2px solid #0e2a4a; border-radius:14px; padding:12px; font-family:'Baloo 2',sans-serif; font-weight:800; color:${creating ? '#6b5a3a' : '#fff'}; font-size:15px;">${loadingQuestions ? 'Đang tải kho đề...' : (creating ? 'Đang tạo...' : '⚓ TẠO SỰ KIỆN')}</div>
      </div>
    </div>` : '';

  const joinModalHtml = showJoinForm ? `
    <div onclick="closeJoinForm()" style="position:fixed; inset:0; z-index:60; background:rgba(3,26,45,.62); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px;">
      <div onclick="event.stopPropagation()" style="background:linear-gradient(180deg,rgba(253,246,232,.9),rgba(243,230,201,.9)); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); border:2.5px solid #3d5a80; border-radius:20px; padding:24px; max-width:380px; width:100%; text-align:center; box-shadow:0 14px 30px rgba(0,0,0,.4);">
        <div style="font-size:30px;">🔑</div>
        <div style="font-family:'Baloo 2',sans-serif; font-weight:800; color:#5a3b22; font-size:16px; margin-top:4px;">Tham Gia Bằng Mã</div>
        <div style="color:#8b5e34; font-size:12px; margin-top:4px;">Nhập mã sự kiện host đã chia sẻ với bạn</div>
        <input value="${escapeHtml(joinCodeInput)}" oninput="onJoinCodeInput(this.value)" placeholder="VD: 8K4P2" maxlength="8" style="width:100%; margin-top:14px; text-align:center; letter-spacing:3px; text-transform:uppercase; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:20px; color:#0e5273; border:2px dashed #3d5a80; border-radius:12px; padding:12px;"/>
        ${joinError ? `<div style="color:#c0392b; font-size:12px; font-weight:700; margin-top:10px;">${escapeHtml(joinError)}</div>` : ''}
        <div onclick="submitJoinByCode()" style="margin-top:14px; cursor:${joining ? 'default' : 'pointer'}; background:${joining ? '#e2d3ae' : 'linear-gradient(180deg,#ffd25a,#f5a623)'}; border:2px solid #b9761a; border-radius:12px; padding:11px; font-family:'Baloo 2',sans-serif; font-weight:800; color:#5a3b22;">${joining ? 'Đang tham gia...' : 'Tham Gia'}</div>
        <div onclick="closeJoinForm()" style="margin-top:10px; cursor:pointer; color:#8b5e34; font-size:12px; font-weight:700;">Hủy</div>
      </div>
    </div>` : '';


  document.getElementById('app').innerHTML = `
    <div class="sk-page-wrap">
      <a href="DaiHaiTrinhManten.dc.html" style="position:relative; z-index:5; cursor:pointer; color:#ffe9b0; font-weight:700; font-size:13px; width:fit-content; display:inline-block; background:rgba(9,45,66,.6); border:1.5px solid #ffe9b0; border-radius:12px; padding:6px 14px;">← Bản Đồ</a>

      <div style="position:relative; z-index:4; max-width:900px; margin:14px auto 20px; background:linear-gradient(160deg,rgba(13,42,74,.78),rgba(23,58,99,.78)); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); border:2.5px solid #f5a623; border-radius:20px; padding:26px 22px; text-align:center; box-shadow:0 8px 0 rgba(0,0,0,.2), 0 14px 24px rgba(0,0,0,.3);">
        <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(20px,3.6vw,30px); color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.3); letter-spacing:.5px;">🏴‍☠️ TẠO SỰ KIỆN CÙNG MANTEN</div>
        <div style="margin-top:8px; display:inline-block; background:rgba(245,166,35,.18); border:1px solid #f5a623; border-radius:10px; padding:5px 14px; color:#ffe27a; font-weight:700; font-size:12.5px; letter-spacing:.5px;">HOST · THAM GIA · NHẬN THƯỞNG</div>
        <div class="sk-stats-grid">
          <div><div style="font-size:26px;">👥</div><div style="color:#dbe9ff; font-size:11.5px; font-weight:700; margin-top:4px;">Rủ bạn bè<br/>tham gia</div></div>
          <div><div style="font-size:26px;">⚔️</div><div style="color:#dbe9ff; font-size:11.5px; font-weight:700; margin-top:4px;">Chiến đấu<br/>kiến thức</div></div>
          <div><div style="font-size:26px;">🎁</div><div style="color:#dbe9ff; font-size:11.5px; font-weight:700; margin-top:4px;">Nhận EXP<br/>&amp; item</div></div>
          <div><div style="font-size:26px;">🏆</div><div style="color:#dbe9ff; font-size:11.5px; font-weight:700; margin-top:4px;">Leo rank<br/>cực đỉnh</div></div>
        </div>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:22px;">
          <div onclick="openCreateForm()" style="cursor:pointer; background:linear-gradient(180deg,#ffd25a,#f5a623); border:2px solid #b9761a; border-radius:14px; padding:12px 26px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:#5a3b22; box-shadow:0 4px 0 #9a5f14;">⚓ TẠO SỰ KIỆN NGAY!</div>
          <div onclick="openJoinForm()" style="cursor:pointer; background:rgba(255,255,255,.12); border:2px solid #dbe9ff; border-radius:14px; padding:12px 26px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:#dbe9ff;">🔑 THAM GIA BẰNG MÃ</div>
        </div>
      </div>

      <div style="position:relative; z-index:4; max-width:900px; margin:0 auto 20px; background:linear-gradient(180deg,rgba(253,246,232,.8),rgba(243,230,201,.8)); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); border:2.5px solid #b9761a; border-radius:18px; padding:18px; box-shadow:0 6px 0 rgba(0,0,0,.12);">
        <div style="text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; color:#5a3b22; font-size:15.5px; margin-bottom:14px;">QUY TRÌNH TẠO SỰ KIỆN</div>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;">${stepsHtml}</div>
      </div>

      <div style="position:relative; z-index:4; max-width:900px; margin:0 auto;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px; background:rgba(9,45,66,.55); border:1.5px solid #ffe9b0; border-radius:14px; padding:9px 16px;">
          <div style="font-family:'Baloo 2',sans-serif; font-weight:800; color:#ffe9b0; font-size:15.5px;">📋 DANH SÁCH SỰ KIỆN ĐANG MỞ</div>
          <div onclick="loadEvents()" style="cursor:pointer; color:#ffe9b0; font-size:12px; font-weight:700;">🔄 Làm mới</div>
        </div>
        ${listHtml}
      </div>
    </div>
    ${createModalHtml}
    ${joinModalHtml}
  `;
}

render();
function waitForSync() {
  if (!window.skSync) { setTimeout(waitForSync, 100); return; }
  window.skSync.onAuthChanged((u) => { currentUser = u; });
  loadEvents();
}
waitForSync();

// Ticks the visible countdown during an active question, and — if this browser is the
// host — auto-locks answers once time's up (mục 16: everyone reacts without a refresh).
setInterval(() => {
  if (view !== 'lobby' || !lobbyEvent || lobbyEvent.status !== 'started') return;
  const ev = lobbyEvent;
  if (ev.questionState === 'active') {
    const questions = (ev.questions && ev.questions.length) ? ev.questions : SAMPLE_QUESTIONS;
    const q = questions[ev.currentQuestionIndex];
    const duration = (q && q.durationSec) || QUESTION_DURATION_SEC;
    const elapsed = (Date.now() - (ev.questionStartedAt || Date.now())) / 1000;
    if (elapsed >= duration) {
      const uid = window.skSync && window.skSync.currentUid();
      if (uid && ev.hostUid === uid) lockQuestion();
    }
    render();
  }
}, 1000);
</script>
