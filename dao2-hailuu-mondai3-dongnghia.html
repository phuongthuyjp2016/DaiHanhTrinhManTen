.header{background:linear-gradient(135deg,#0f2e42,#1f5c8c 60%,#2f8fd1);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.header h1{font-size:17px;font-weight:500}
.home-link{color:#ffe9b0;text-decoration:none;font-size:.75rem;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:14px;white-space:nowrap;font-weight:700;font-family:'Baloo 2',sans-serif;}
.home-link:hover{background:rgba(255,255,255,.28);}
.sub{font-size:12px;color:#cdeef2;margin-bottom:2px}
.tabs{display:flex;background:#fdf6e8;border-bottom:1px solid #c9a769;padding:0 16px}
.tab{padding:12px 16px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;color:#888}
.tab.active{color:#1a1a1a;border-bottom-color:#f5a623;font-weight:500}
.container{max-width:900px;margin:0 auto;padding:16px}
body.nb-embed .header,body.nb-embed .tabs,body.nb-embed .ctrl,body.nb-embed .cnt{display:none}
body.nb-embed .container{padding-top:10px}
.ctrl{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.ctrl input,.ctrl select{padding:7px 10px;border:1px solid #ccc;border-radius:8px;font-size:14px;background:#fff}
.ctrl input{flex:1;min-width:140px}
.cnt{font-size:13px;color:#888}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
/* Each card's own look lives in dao2-hailuu-mondai3-dongnghia-card-template.html,
   fetched once and injected below — not duplicated here. The notebook-save
   toast's style/behavior is shared too, injected by dc-card-template-engine.js. */
.qsetup{background:#fdf6e8;border-radius:12px;border:1px solid #c9a769;padding:20px;margin-bottom:16px}
.qsetup h2{font-size:16px;font-weight:500;margin-bottom:14px}
.srow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.srow label{font-size:14px;color:#555;min-width:70px}
.srow select{padding:7px 10px;border:1px solid #ccc;border-radius:8px;font-size:14px}
.bstart{background:linear-gradient(180deg,#ffd25a,#f5a623);color:#5a3b22;border:none;border-radius:8px;padding:10px 24px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;width:100%}
.qa{display:none}.qa.active{display:block}
.pbi{display:flex;justify-content:space-between;font-size:13px;color:#888;margin-bottom:6px}
.pbw{background:#e6d9b8;border-radius:99px;height:5px;margin-bottom:16px}
.pb{background:linear-gradient(90deg,#f5a623,#ffd25a);height:5px;border-radius:99px;transition:width 0.3s}
.qcard{background:#fdf6e8;border-radius:12px;border:1px solid #c9a769;padding:18px;margin-bottom:12px}
.qwd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.qk{font-size:24px;font-weight:600;color:#534AB7}
.qh{font-size:13px;color:#7F77DD;background:#EEEDFE;padding:2px 8px;border-radius:6px}
.qs{font-size:16px;line-height:1.8;margin-bottom:4px}
.ul{text-decoration:underline;text-decoration-color:#534AB7;color:#534AB7;font-weight:500}
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ob{background:#fdf6e8;border:1px solid #ccc;border-radius:8px;padding:12px;font-size:14px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.ob .nm{font-size:12px;color:#aaa;min-width:14px}
.ob:hover:not(:disabled){border-color:#534AB7;background:#EEEDFE}
.ob.ok{background:#EAF3DE;border-color:#3B6D11;color:#173404}
.ob.ng{background:#FCEBEB;border-color:#A32D2D;color:#501313}
.ob.rv{background:#EAF3DE;border-color:#3B6D11;color:#173404}
.ob:disabled{cursor:default}
.exp{background:#fdf6e8;border:1px solid #CECBF6;border-radius:10px;padding:14px;font-size:13px;line-height:1.8;margin-bottom:12px;display:none}
.exp.show{display:block}
.ew{font-size:17px;font-weight:600;color:#534AB7}
.eh{font-size:12px;color:#7F77DD;background:#EEEDFE;padding:1px 6px;border-radius:5px;margin-left:6px}
.esyi{display:inline-block;font-size:12px;background:#EEEDFE;color:#3C3489;border-radius:6px;padding:2px 8px;margin:2px 2px 2px 0}
.esyi.pri{background:#534AB7;color:#fff}
.bnav{display:flex;justify-content:flex-end;margin-top:4px}
.bnext{background:linear-gradient(180deg,#ffd25a,#f5a623);color:#5a3b22;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;display:none;width:100%}
.bnext.show{display:block}
.res{background:#fdf6e8;border-radius:12px;border:1px solid #c9a769;padding:32px 20px;text-align:center;display:none}
.res.show{display:block}
.rs{font-size:48px;font-weight:600;color:#534AB7}
.rt{font-size:18px;color:#888;margin-bottom:10px}
.rm{font-size:14px;color:#444;margin-bottom:20px}
.br{background:linear-gradient(180deg,#ffd25a,#f5a623);color:#5a3b22;border:none;border-radius:8px;padding:10px 24px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
@media(max-width:500px){.og{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
.exp-toast{position:fixed;top:18%;left:50%;transform:translate(-50%,-10px);background:linear-gradient(180deg,#ffd25a,#f5a623);color:#5a3b22;font-family:'Baloo 2',sans-serif;font-weight:800;padding:10px 22px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:9999;text-align:center;pointer-events:none;animation:expPop .35s ease-out;}
.exp-toast-main{font-size:20px;line-height:1.2;}
.exp-toast-sub{font-size:12px;font-weight:700;margin-top:2px;opacity:.85;}
.exp-toast-big{background:linear-gradient(180deg,#ff9a56,#ff5b3a);color:#fff;box-shadow:0 8px 22px rgba(255,90,40,.5);}
.exp-toast-big .exp-toast-main{font-size:24px;}
.exp-toast-out{animation:expFade .5s ease-in forwards;}
@keyframes expPop{0%{transform:translate(-50%,10px) scale(.7);opacity:0;}60%{transform:translate(-50%,-14px) scale(1.08);opacity:1;}100%{transform:translate(-50%,-10px) scale(1);opacity:1;}}
@keyframes expFade{0%{opacity:1;transform:translate(-50%,-10px) scale(1);}100%{opacity:0;transform:translate(-50%,-30px) scale(.9);}}
.combo-toast{position:fixed;top:76px;right:20px;background:#fef3c7;color:#d97706;border:1px solid #fcd34d;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;z-index:9998;opacity:0;transform:translateY(-8px);transition:all .3s;pointer-events:none;}
.combo-toast.show{opacity:1;transform:translateY(0);}
.coin-burst-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.coin-burst-card{position:relative;background:linear-gradient(180deg,#fff6d9,#ffe9b0);border:3px solid #f5a623;border-radius:24px;padding:26px 40px;box-shadow:0 20px 60px rgba(0,0,0,.45), 0 0 40px rgba(255,210,90,.6);text-align:center;animation:coinPop .5s cubic-bezier(.34,1.56,.64,1);}
.coin-burst-icon{font-size:56px;animation:coinSpin .6s ease-out;}
.coin-burst-text{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;color:#8b5e34;margin-top:6px;text-shadow:0 2px 0 #fff8e6;}
.coin-burst-sub{font-size:13px;font-weight:700;color:#a3792a;margin-top:2px;}
.coin-burst-out{animation:coinFadeOut .4s ease-in forwards;}
.coin-particle{position:absolute;font-size:20px;left:50%;top:50%;animation:coinFly 900ms ease-out forwards;pointer-events:none;}
@keyframes coinPop{0%{transform:scale(.3);opacity:0;}60%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);opacity:1;}}
@keyframes coinSpin{0%{transform:rotateY(0deg) scale(.5);}100%{transform:rotateY(360deg) scale(1);}}
@keyframes coinFadeOut{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(.85);}}

const EXP_PER_CORRECT=5;
const COMBO_TARGET=10;
const COMBO_BONUS=50;
let comboCount=0;
const HYPE_MESSAGES=['Xuất sắc!','Đỉnh của chóp!','Cứ thế phát huy nhé!','Quá đỉnh!','N1 đang trong tầm tay!','Không gì cản được bạn!','Chuẩn không cần chỉnh!','Học vậy mới máu!'];
function loadLocalProfile(){
  try{const r=localStorage.getItem('dhtm_profile_v1');return r?JSON.parse(r):null;}catch(e){return null;}
}
function saveLocalProfile(p){
  try{localStorage.setItem('dhtm_profile_v1',JSON.stringify(p));}catch(e){}
}
function awardExp(amount){
  const profile=loadLocalProfile();
  if(!profile)return false;
  let exp=(profile.exp||0)+amount, level=profile.level||1, expToNext=profile.expToNext||100;
  let leveledUp=false;
  while(exp>=expToNext){exp-=expToNext;level+=1;expToNext=Math.round(expToNext*(level>=10?1.4:1.25));leveledUp=true;}
  profile.exp=exp;profile.level=level;profile.expToNext=expToNext;
  saveLocalProfile(profile);
  return leveledUp;
}
function pickHype(){return HYPE_MESSAGES[Math.floor(Math.random()*HYPE_MESSAGES.length)];}
function showCoinBurst(amount){
  const overlay=document.createElement('div');
  overlay.className='coin-burst-overlay';
  const card=document.createElement('div');
  card.className='coin-burst-card';
  const icon=document.createElement('div');
  icon.className='coin-burst-icon';
  icon.textContent='🪙';
  const text=document.createElement('div');
  text.className='coin-burst-text';
  text.textContent='+'+amount+' Xu!';
  const sub=document.createElement('div');
  sub.className='coin-burst-sub';
  sub.textContent='Nhặt được xu may mắn!';
  card.appendChild(icon);
  card.appendChild(text);
  card.appendChild(sub);
  overlay.appendChild(card);
  for(let i=0;i<14;i++){
    const pt=document.createElement('div');
    pt.className='coin-particle';
    pt.textContent='🪙';
    const angle=Math.random()*Math.PI*2;
    const dist=80+Math.random()*140;
    pt.style.setProperty('--dx',(Math.cos(angle)*dist)+'px');
    pt.style.setProperty('--dy',(Math.sin(angle)*dist)+'px');
    overlay.appendChild(pt);
  }
  document.body.appendChild(overlay);
  setTimeout(()=>{card.classList.add('coin-burst-out');},1200);
  setTimeout(()=>{overlay.remove();},1700);
}
function maybeDropCoins(){
  if(Math.random()>=0.35)return;
  const amount=5+Math.floor(Math.random()*21);
  const profile=loadLocalProfile();
  if(profile){
    profile.coins=(profile.coins||0)+amount;
    saveLocalProfile(profile);
  }
  showCoinBurst(amount);
}
function showExpToast(mainText,subText,big){
  document.querySelectorAll('.exp-toast').forEach(t=>t.remove());
  const wrap=document.createElement('div');
  wrap.className='exp-toast'+(big?' exp-toast-big':'');
  const line1=document.createElement('div');
  line1.className='exp-toast-main';
  line1.textContent=mainText;
  const line2=document.createElement('div');
  line2.className='exp-toast-sub';
  line2.textContent=subText;
  wrap.appendChild(line1);
  wrap.appendChild(line2);
  document.body.appendChild(wrap);
  setTimeout(()=>{wrap.classList.add('exp-toast-out');},900);
  setTimeout(()=>{wrap.remove();},1400);
}
function showComboToast(n){
  let el=document.getElementById('combo-toast');
  if(!el){
    el=document.createElement('div');
    el.id='combo-toast';
    el.className='combo-toast';
    document.body.appendChild(el);
  }
  el.textContent='🔥 Chuỗi '+n+' câu đúng';
  el.classList.add('show');
  clearTimeout(window._comboToastTimer);
  window._comboToastTimer=setTimeout(()=>{el.classList.remove('show');},1500);
}
function onCorrectAnswer(){
  comboCount++;
  let gained=EXP_PER_CORRECT;
  let big=false;
  let sub=pickHype();
  if(comboCount>=2)showComboToast(comboCount);
  if(comboCount>0 && comboCount%COMBO_TARGET===0){
    gained+=COMBO_BONUS;
    big=true;
    sub='Chuỗi '+comboCount+' câu đúng — Bùng nổ!';
  }
  const leveledUp=awardExp(gained);
  showExpToast('+'+gained+' EXP', leveledUp?'LÊN CẤP! 🎉':sub, big||leveledUp);
  maybeDropCoins();
}
function onWrongAnswer(){
  comboCount=0;
}

var NOTEBOOK_KEY='dhtm_notebook_v1';
function loadNotebookIds(){try{return new Set(JSON.parse(localStorage.getItem(NOTEBOOK_KEY)||'[]').map(function(x){return x.id;}));}catch(e){return new Set();}}
function toggleNotebook(id,btnEl){
  var list=[];
  try{list=JSON.parse(localStorage.getItem(NOTEBOOK_KEY)||'[]');}catch(e){}
  var idx=-1;
  for(var i=0;i<list.length;i++){if(list[i].id===id){idx=i;break;}}
  if(idx>=0){
    list.splice(idx,1);
    btnEl.classList.remove('active');
  }else{
    var data={};
    try{data=JSON.parse(btnEl.getAttribute('data-nb'));}catch(e){}
    data.id=id;data.addedAt=Date.now();
    list.push(data);
    btnEl.classList.add('active');
    dcShowNotebookToast('Đã lưu vào sổ tay!',btnEl);
  }
  try{localStorage.setItem(NOTEBOOK_KEY,JSON.stringify(list));}catch(e){}
}
function openFromNotebookParam(){
  var params=new URLSearchParams(location.search);
  if(params.get('embed')==='1') document.body.classList.add('nb-embed');
  var target=params.get('nb');
  if(!target)return;
  var card=document.querySelector('.dc-mondai3-card[data-nb-id="'+CSS.escape(target)+'"]');
  if(!card)return;
  card.classList.add('nb-highlight');
  card.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(function(){card.classList.remove('nb-highlight');},2200);
}

function startQ(){var rf=document.getElementById('qr').value;var cs=document.getElementById('qc').value;var pool=rf==='all'?V.slice():V.filter(function(v){return v.r===rf;});var cnt=cs==='all'?pool.length:Math.min(parseInt(cs),pool.length);qq=pool.slice(0,cnt);qi=0;sc=0;document.getElementById('qs').style.display='none';document.getElementById('qa').classList.add('active');document.getElementById('res').classList.remove('show');showQ();}
function showQ(){var q=qq[qi],tot=qq.length;document.getElementById('qn').textContent=(qi+1)+' / '+tot;document.getElementById('sm').textContent='正解: '+sc;document.getElementById('pb').style.width=((qi/tot)*100)+'%';document.getElementById('qk').textContent=q.k;document.getElementById('qhi').textContent=q.h;document.getElementById('qmt').textContent='第'+q.r+'回 · '+q.p;var s=q.s;if(s.indexOf(q.k)>=0){s=s.replace(q.k,'<span class="ul">'+q.k+'</span>');}else if(s.indexOf(q.h)>=0){s=s.replace(q.h,'<span class="ul">'+q.h+'</span>');}currentSentence=q.s;document.getElementById('qsen').innerHTML=s;document.getElementById('qqn').textContent=q.n||'';document.getElementById('qvt').textContent=q.vi||'';document.getElementById('qvi').style.display='none';document.getElementById('og').innerHTML=q.op.map(function(o,i){return '<button class="ob" onclick="sel('+i+')" id="o'+i+'"><span class="nm">'+(i+1)+'</span>'+o+'</button>';}).join('');document.getElementById('exp').classList.remove('show');document.getElementById('bn').classList.remove('show');ans=false;}
function sel(c){if(ans)return;ans=true;var q=qq[qi],co=q.a;if(c===co){sc++;if(allCorrect.indexOf(q.k)<0)allCorrect.push(q.k);onCorrectAnswer();}else{onWrongAnswer();}localStorage.setItem('dao2_mondai3_correct',JSON.stringify(allCorrect));reportToolProgress(allCorrect.length,V.length);for(var i=0;i<q.op.length;i++){var b=document.getElementById('o'+i);b.disabled=true;if(i===co)b.classList.add(c===co&&i===c?'ok':'rv');if(i===c&&c!==co)b.classList.add('ng');}var sh=q.sy.map(function(s,i){return '<span class="esyi'+(i===0?' pri':'')+'">'+ s+'</span>';}).join('');document.getElementById('exp').innerHTML='<div style="margin-bottom:8px"><span class="ew">'+q.k+'</span><span class="eh">'+q.h+'</span></div><div style="font-size:13px;color:#333;margin:4px 0">📖 '+q.m+'</div><div style="font-size:12px;color:#b45309;background:#FFFBEB;border-radius:6px;padding:3px 8px;margin:4px 0;display:inline-block">🇻🇳 '+(q.vi||'')+'</div><div style="margin:8px 0"><span style="font-size:11px;color:#7F77DD;font-weight:500">≒ 類義語：</span><br>'+sh+'</div><div style="font-size:11px;color:#888">📌 '+q.co.map(function(c){return '<span class="ct">'+c+'</span>';}).join('')+'</div>';if(q.vi){document.getElementById('qvi').style.display='inline-block';}document.getElementById('exp').classList.add('show');document.getElementById('sm').textContent='正解: '+sc;document.getElementById('bn').classList.add('show');}
function nextQ(){qi++;if(qi>=qq.length)showRes();else showQ();}
function showRes(){document.getElementById('qa').classList.remove('active');document.getElementById('res').classList.add('show');var tot=qq.length,pct=Math.round((sc/tot)*100);document.getElementById('rsc').textContent=sc;document.getElementById('rtl').textContent='/ '+tot+' 問';document.getElementById('rmsg').textContent=(pct>=90?'🎉 素晴らしい！N1合格レベルです！':pct>=70?'👍 よくできました！':pct>=50?'📚 復習が必要です。':'💪 もっと練習！')+'（正答率: '+pct+'%）';}
function resetQ(){document.getElementById('res').classList.remove('show');document.getElementById('qs').style.display='';document.getElementById('qa').classList.remove('active');}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function pickVoice(utt) {
  var vs = window.speechSynthesis.getVoices();
  for (var i = 0; i < vs.length; i++) {
    if (vs[i].lang === 'ja-JP' || vs[i].lang.indexOf('ja') === 0) {
      utt.voice = vs[i];
      break;
    }
  }
  window.speechSynthesis.speak(utt);
}
function speakJapanese(text) {
  if (!text) return;
  window.speechSynthesis.cancel();
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ja-JP';
  utt.rate = 0.9;
  utt.pitch = 1;
  utt.volume = 1;
  if (window.speechSynthesis.getVoices().length > 0) {
    pickVoice(utt);
  } else {
    window.speechSynthesis.onvoiceschanged = function() { pickVoice(utt); };
  }
}
