header{background:linear-gradient(135deg,#0f2e42,#1f5c8c 60%,#2f8fd1);color:#fff;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);gap:10px;flex-wrap:wrap;}
header h1{font-family:'Baloo 2','Noto Serif JP',serif;font-weight:800;color:#ffe9b0;font-size:.95rem;letter-spacing:.05em;}
.home-link{color:#ffe9b0;text-decoration:none;font-size:.75rem;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:14px;white-space:nowrap;font-weight:700;}
.home-link:hover{background:rgba(255,255,255,.28);}
.filter-bar{max-width:900px;margin:0 auto;padding:10px 16px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.search-bar{max-width:900px;margin:0 auto;padding:0 16px 10px;position:relative;}
.search-input-wrap{display:flex;gap:8px;}
.search-input{flex:1;padding:9px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.85rem;font-family:'Noto Sans JP',sans-serif;}
.search-input:focus{outline:none;border-color:var(--blue);}
.search-clear{background:#eee;border:none;border-radius:10px;padding:9px 14px;font-size:.8rem;cursor:pointer;color:var(--muted);}
.search-results{background:#fff;border:1.5px solid var(--border);border-radius:10px;margin-top:8px;max-height:340px;overflow-y:auto;}
.search-result-item{padding:10px 14px;border-bottom:1px solid #f0f0f8;cursor:pointer;display:flex;align-items:center;gap:10px;}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:#f0f4ff;}
.sr-round{font-size:.65rem;background:var(--blue);color:#fff;padding:2px 8px;border-radius:10px;flex-shrink:0;}
.sr-kanji{font-family:'Noto Serif JP',serif;font-weight:700;font-size:.95rem;}
.sr-kana{font-size:.72rem;color:var(--muted);}
.sr-sent{font-size:.72rem;color:#888;margin-left:auto;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.search-empty{padding:14px;text-align:center;color:#999;font-size:.8rem;}
.flabel{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;}
.fbtn{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:3px 11px;font-size:.74rem;cursor:pointer;color:var(--ink);font-weight:500;transition:all .15s;}
.fbtn:hover{border-color:var(--blue);}
.fbtn.active{background:linear-gradient(180deg,#ffd25a,#f5a623);color:#5a3b22;border-color:#f5a623;font-weight:700;}
.main{max-width:900px;margin:0 auto;padding:8px 16px 60px;}

.q-block{background:var(--card);border-radius:16px;border:2px solid var(--border);box-shadow:0 3px 14px rgba(0,0,0,.07);margin-bottom:18px;overflow:hidden;}
.q-block:nth-child(6n+1){border-top:4px solid #e53935;}
.q-block:nth-child(6n+2){border-top:4px solid #1565c0;}
.q-block:nth-child(6n+3){border-top:4px solid #2e7d32;}
.q-block:nth-child(6n+4){border-top:4px solid #6a1b9a;}
.q-block:nth-child(6n+5){border-top:4px solid #e65100;}
.q-block:nth-child(6n+6){border-top:4px solid #00695c;}
.q-head{padding:14px 16px 10px;}
.q-num{font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
.q-sent-wrap{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;}
.q-sent{flex:1;font-family:'Noto Serif JP',serif;font-size:1.1rem;line-height:1.9;color:#1a1a2e;background:#f8f9ff;border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:10px 14px;}
.blank{color:var(--blue);font-weight:700;}
.filled{color:var(--red);font-weight:700;text-decoration:underline;text-decoration-color:#ffb3b3;text-decoration-thickness:2px;}
.q-sv{font-size:.8rem;color:#555;background:#f0f4ff;border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:6px 12px;line-height:1.65;display:none;}
.q-sv.show{display:block;}
.q-sv-hint{font-size:.75rem;color:#8a8fa3;font-style:italic;padding:4px 2px;}
.q-sv-hint.hidden{display:none;}

.speak-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 6px;cursor:pointer;color:var(--muted);line-height:0;transition:all .15s;flex-shrink:0;}
.speak-btn:hover{border-color:var(--blue);color:var(--blue);}
.speak-btn.sp{border-color:var(--red);color:var(--red);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.choices-wrap{padding:10px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid #f0f0f8;}
.choice{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:11px 14px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:10px;}
.choice:hover:not(.disabled){border-color:var(--blue);background:#f0f4ff;}
.choice.correct{border-color:var(--green)!important;background:linear-gradient(135deg,#e8f5e9,#f1f8e9)!important;}
.choice.wrong-pick{border-color:var(--red)!important;background:linear-gradient(135deg,#fff3f3,#fce4ec)!important;}
.choice.reveal-correct{border-color:var(--green)!important;background:linear-gradient(135deg,#e8f5e9,#f1f8e9)!important;}
.choice.disabled{cursor:default;}
.c-num{width:26px;height:26px;border-radius:50%;background:#e8eaf6;color:#283593;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.choice.correct .c-num,.choice.reveal-correct .c-num{background:var(--green);color:#fff;}
.choice.wrong-pick .c-num{background:var(--red);color:#fff;}
.c-kanji{font-family:'Noto Serif JP',serif;font-size:1.05rem;font-weight:700;}
.c-kana{font-size:.75rem;color:var(--muted);font-family:'Noto Sans JP',sans-serif;display:block;}

.feedback{display:none;margin:0 16px 10px;border-radius:10px;padding:9px 13px;font-size:.85rem;font-weight:600;}
.feedback.correct{display:block;background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border:1.5px solid #2e7d32;color:#2e7d32;}
.feedback.wrong{display:block;background:linear-gradient(135deg,#fff3f3,#fce4ec);border:1.5px solid #e53935;color:#e53935;}
.fb-meaning{color:#333;font-size:.8rem;font-weight:400;display:block;margin-top:2px;font-family:'Noto Sans JP',sans-serif;}

.analysis-panel{display:none;border-top:2px solid #e8eaf6;}
.analysis-panel.show{display:block;}
.ans-card{padding:12px 16px;border-bottom:1px solid #f5f5fb;}
.ans-card:last-child{border-bottom:none;}
.ans-card.correct{background:linear-gradient(135deg,#f0fff4,#e8f5e9);}
.ans-card.wrong{background:#fafafa;}
.ans-title{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.ans-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex-shrink:0;}
.ans-card.correct .ans-num{background:var(--green);color:#fff;}
.ans-card.wrong .ans-num{background:#e8eaf6;color:#546e7a;}
.ans-kanji{font-family:'Noto Serif JP',serif;font-size:1.25rem;font-weight:700;}
.ans-card.correct .ans-kanji{color:var(--green);}
.ans-card.wrong .ans-kanji{color:var(--ink);}
.ans-kana{font-family:'Noto Sans JP',sans-serif;font-size:.82rem;color:var(--blue);font-weight:600;}
.ans-hv{font-size:.75rem;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:6px;}
.ans-card.correct .ans-hv{background:#c8e6c9;color:#1b5e20;}
.ans-card.wrong .ans-hv{background:#e8eaf6;color:#283593;}
.ans-badge{margin-left:auto;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:10px;}
.ans-card.correct .ans-badge{background:#2e7d32;color:#fff;}
.ans-card.wrong .ans-badge{display:none;}
.ans-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ans-section{background:rgba(255,255,255,.7);border-radius:8px;padding:6px 9px;}

ích（浪費する・時間の浪費）", "26_5": "💡 Mẹo phân biệt 無実・無断・無難・無敵:\n• 無実＝VÔ THẬT → không phạm tội（無実を訴える・無実の判決）\n• 無断＝VÔ ĐOÀN → tự ý làm không xin phép（無断で使う・無断欠勤）\n• 無難＝VÔ NAN → an toàn, không rắc rối（電車を利用したほうが無難・無難な選択）\n• 無敵＝VÔ ĐỊCH → không ai địch nổi（無敵の強さ・無敵艦隊）", "26_6": "💡 Mẹo phân biệt 補強・補給・補導・補欠:\n• 補強＝BỔ CƯỜNG → tăng cường phần yếu（チームを補強する・弱点を補強）\n• 補給＝BỔ CẤP → cung cấp bổ sung cái đang thiếu（ガソリンを補給する・補給ルート）\n• 補導＝BỔ ĐẠO → hướng dẫn thanh thiếu niên hư（補導される・補導少年）\n• 補欠＝BỔ KHUYẾT → người/cầu thủ dự bị（補欠選手・補欠人員）", "26_7": "💡 Mẹo phân biệt 模擬・模索・模倣・模範:\n• 模擬＝MÔ NGHĨ → giả lập giống thật（模擬試験・模擬戦）\n• 模索＝MÔ SÁCH → mò mẫm tìm cách（方法を模索する・解決策を模索）\n• 模倣＝MÔ PHỎNG → bắt chước, sao chép（デザインを模倣している・模倣品）\n• 模範＝MÔ PHẠM → tấm gương để noi theo（模範的・模範生）", "26_8": "💡 Mẹo phân biệt 不振・不調・不良・不順:\n• 不振＝BẤT CHẤN → sa sút (thành tích, sức ăn)（食欲不振・業績不振）\n• 不調＝BẤT ĐIỀU → cơ thể/tình trạng không ổn（体が不調・不調を訴える）\n• 不良＝BẤT LƯƠNG → chất lượng kém/hư hỏng（不良品・不良少年）\n• 不順＝BẤT THUẬN → thời tiết/diễn biến thất thường（天候不順・不順な天気）", "26_9": "💡 Mẹo phân biệt 未明・未遂・未練・未知:\n• 未明＝VỊ MINH → trước bình minh, còn tối（未明の零時・未明に出発）\n• 未遂＝VỊ TOẠI → mưu toan chưa thành (tội phạm)（自殺未遂・殺人未遂）\n• 未練＝VỊ LUYỆN → còn lưu luyến, chưa dứt được（未練が残る・未練を断ち切る）\n• 未知＝VỊ TRI → lĩnh vực chưa từng biết（未知の領域・未知数）", "26_10": "💡 Mẹo phân biệt 異動・異状・異例・異端:\n• 異動＝DỊ ĐỘNG → thay đổi vị trí công tác（人事の異動・異動辞令）\n• 異状＝DỊ TRẠNG → trạng thái khác thường（異状を訴える・体の異状）\n• 異例＝DỊ LỆ → trường hợp hiếm gặp（異例の恒重・異例処理）\n• 異端＝DỊ ĐOAN → tư tưởng lệch chuẩn mực（異端の考え・異端者）", "26_11": "💡 Mẹo phân biệt 下落・下流・投下・天下:\n• 下落＝HẠ LẠC → giá cả giảm xuống（株価の下落・価格が下落する）\n• 下流＝HẠ LƯU → phần cuối của sông/tầng lớp thấp（川の下流・下流階層）\n• 投下＝ĐẦU HẠ → đầu tư vốn（資本を投下する・投下金）\n• 天下＝THIÊN HẠ → toàn thế giới/số một（天下一・天下を取る）", "27_0": "💡 Mẹo phân biệt 受理・受給・受領・受容:\n• 受理＝THỤ LÝ → tiếp nhận và xử lý (đơn từ, hồ sơ)（書類を受理する(しょるい)）\n• 受給＝THỤ CẤP → nhận trợ cấp, nhận lương hưu（年金を受給する(ねんきん)）\n• 受領＝THỤ LÃNH → tiếp nhận chính thức (trang trọng)（代金を受領する(だいきん)）\n• 受容＝THỤ DUNG → tiếp nhận, chấp nhận, đón nhận（異質な文化も受容）", "27_1": "💡 Mẹo phân biệt 指針・指令・指摘・指揮:\n• 指針＝CHỈ CHÂM → phương châm, kim chỉ nam（指針を示す(しめす)）\n• 指令＝CHỈ LỆNH → lệnh, chỉ thị từ trên xuống（上司からの指令(じょうし)）\n• 指摘＝CHỈ TRÍCH → chỉ ra, vạch ra vấn đề（関鬺を指摘する(かんせん)）\n• 指揮＝CHỈ HUY → chỉ huy, lãnh đạo（現場を指揮する）", "27_2": "💡 Mẹo phân biệt 自立・自首・自覚・自負:\n• 自立＝TỰ LẬP → tự lập, độc lập（自立する）\n• 自首＝TỰ THỦ → đầu thú, ra đầu thú（警察に自首する）\n• 自覚＝TỰ GIÁC → tự nhận thức, ý thức về bản thân（自覚する）\n• 自負＝TỰ PHỤ → tự hào, tự tin về bản thân（自負する）", "27_3": "💡 Mẹo phân biệt 樹立・倒立・自立・成立:\n• 樹立＝THỤ LẬP → lập (kỷ lục), xây dựng thành tích（世界新記録を樹立する）\n• 倒立＝ĐẢO LẬP → đứng ngược, trồng chuối（倒立する）\n• 自立＝TỰ LẬP → tự lập（自立する）\n• 成立＝THÀNH LẬP → thành lập, hoàn thành, đạt được（口約が成立する(けいやく)）", "27_4": "💡 Mẹo phân biệt 時事・知事・人事・判事:\n• 時事＝THỜI SỰ → thời sự, sự kiện xã hội hiện tại（時事）\n• 知事＝TRI SỰ → thống đốc tỉnh（知事選挙(せんきょ)）\n• 人事＝NHÂN SỰ → nhân sự（社内の人事）\n• 判事＝PHÁN SỰ → thẩm phán（判事になる）", "27_5": "💡 Mẹo phân biệt 苦笑・苦悩・苦渋・苦情:\n• 苦笑＝KHỔ TIẾU → cười gượng, cười khổ（苦笑する）\n• 苦悩＝KHỔ NÃO → đau khổ, phiền não（苦悩する）\n• 苦渋＝KHỔ SÁP → khó khăn, cay đắng, quyết định đau đớn（苦渋の選択(せんたく)）\n• 苦情＝KHỔ TÌNH → khiếu nại, phàn nàn（複数の消費者から苦情）", "27_6": "💡 Mẹo phân biệt 清書・投書・書式・書記:\n• 清書＝THANH THƯ → chép sạch, viết bản sạch（清書する）\n• 投書＝ĐẦU THƯ → viết thư gửi tòa soạn, góp ý（新聞に投書する(しんぶん)）\n• 書式＝THƯ THỨC → định dạng văn bản, mẫu viết（書式を調べた(しらべた)）\n• 書記＝THƯ KÝ → thư ký (ghi chép)（会議の書記(かいぎ)）", "27_7": "💡 Mẹo phân biệt 機体・機関・機密・機種:\n• 機体＝CƠ THỂ → thân máy bay, thân phi cơ（航空機の機体(こうかん)）\n• 機関＝CƠ QUAN → cơ quan, tổ chức / động cơ（言語教育を研究する機関）\n• 機密＝CƠ MẬT → bí mật, cơ mật（機密情報(じょうほう)）\n• 機種＝CƠ CHỦNG → loại máy, model（航空機の機種(かん)）", "27_8": "💡 Mẹo phân biệt 伝記・登記・上記・暗記:\n• 伝記＝TRUYỀN KÝ → tiểu sử（伝記を書く(かく)）\n• 登記＝ĐĂNG KÝ → đăng ký (pháp lý, bất động sản)（不動産登記(ふどうさん)）\n• 上記＝THƯỢNG KÝ → nêu trên, đã ghi ở trên（上記のとおり(とおり)）\n• 暗記＝ÁM KÝ → học thuộc lòng, ghi nhớ（電話番号を暗記していた）", "27_9": "💡 Mẹo phân biệt 帰省・帰化・帰属・復帰:\n• 帰省＝QUY TỈNH → về quê, về nhà（実家に帰省する）\n• 帰化＝QUY HÓA → nhập tịch nước ngoài（日本に帰化する(にほん)）\n• 帰属＝QUY THUỘC → thuộc về（会社に帰属する(かいしゃ)）\n• 復帰＝PHỤC QUY → quay trở lại (vị trí/trạng thái cũ)（職場に復帰する(しょくば)）", "27_10": "💡 Mẹo phân biệt 資質・資本・資格・資産:\n• 資質＝TƯ CHẤT → chất lượng bẩm sinh, tư chất（教師の資質）\n• 資本＝TƯ BẢN → vốn, tư bản（資本を集める(つどめる)）\n• 資格＝TƯ CÁCH → bằng cấp, chứng chỉ, tư cách（教師の資格を得る）\n• 資産＝TƯ SẢN → tài sản（資産を持つ(もつ)）", "27_11": "💡 Mẹo phân biệt 偽造・偽装・偽善・偽名:\n• 偽造＝NGỤY TẠO → làm giả, giả mạo (tài liệu, hàng hóa)（遺書を偽造する(いしょ)）\n• 偽装＝NGỤY TRANG → ngụy trang, giả mạo (xuất xứ...)（出産地を偽装して販売）\n• 偽善＝NGỤY THIỆN → đạo đức giả（偽善者(しゃ)）\n• 偽名＝NGỤY DANH → tên giả（偽名を使う(つかう)）", "28_0": "💡 Mẹo phân biệt 所在・所定・所属・所用:\n• 所在＝SỞ TẠI → vị trí, nơi ở（所在地(ち)）\n• 所定＝SỞ ĐỊNH → quy định sẵn, theo quy định（所定の用紙）\n• 所属＝SỞ THUỘC → thuộc về, thành viên của（所属する）\n• 所用＝SỞ DỤNG → được quy định, dùng cho mục đích đó（所用の用紙(ようし)）", "28_1": "💡 Mẹo phân biệt 土木・土俵・土足・土壌:\n• 土木＝THỔ MỘC → xây dựng công trình hạ tầng（土木工事(こうじ)）\n• 土俵＝THỔ BÀO → sàn đấu sumo / địa bàn cạnh tranh（相撲の土俵(すもう)）\n• 土足＝THỔ TÚC → chân có giày (không bỏ giày)（土足進入禁止(しんにゅう)）\n• 土壌＝THỔ NHƯỠNG → đất trồng, thổ nhưỡng / nền tảng（この地域の土壌）", "28_2": "💡 Mẹo phân biệt 除外・除去・控除・排除:\n• 除外＝TRỪ NGOẠI → loại trừ, ngoại trừ khỏi đối tượng（料金の対象から除外される）\n• 除去＝TRỪ KHỬ → loại bỏ, khử bỏ（ゴミを除去する）\n• 控除＝KHỐNG TRỪ → khấu trừ (thuế)（税金を控除する(ぜいきん)）\n• 排除＝BÀI TRỪ → loại bỏ, trục xuất, bài trừ（邪魔なものを排除する(じゃま)）", "28_3": "💡 Mẹo phân biệt 序盤・序列・秩序・順序:\n• 序盤＝TỰ BÀN → giai đoạn đầu, mở đầu（試合の序盤）\n• 序列＝TỰ LIỆT → thứ bậc, thứ tự, xếp hạng（序列を付ける(つける)）\n• 秩序＝TRẬT TỰ → trật tự, kỷ cương（社会の秩序(しょうしゃ)）\n• 順序＝THUẬN TỰ → thứ tự（順序を守る(まもる)）", "28_4": "💡 Mẹo phân biệt 視野・分野・原野・広野:\n• 視野＝THỊ DÃ → tầm nhìn（視野が広い(ひろい)）\n• 分野＝PHÂN DÃ → lĩnh vực, ngành（この分野の研究）\n• 原野＝NGUYÊN DÃ → đồng hoang, vùng hoang dã（原野を靘める(ながめる)）\n• 広野＝QUẢNG DÃ → đồng rộng, bình nguyên（広野を望む(のぞむ)）", "28_5": "💡 Mẹo phân biệt 世代・世帯・世間・世相:\n• 世代＝THẾ ĐẠI → thế hệ（同世代(どう)）\n• 世帯＝THẾ ĐỚI → hộ gia đình（それぞれ世帯を構えて同居(かまえて)）\n• 世間＝THẾ GIAN → xã hội, thế giới xung quanh, dư luận（世間体(てい)）\n• 世相＝THẾ TƯỚNG → diện mạo xã hội, phong trào xã hội（世相を反映する(はんえい)）", "28_6": "💡 Mẹo phân biệt 打開・打倒・打破・打撃:\n• 打開＝ĐẢ KHAI → đột phá, mở ra con đường thoát（景気回復の打開策(さく)）\n• 打倒＝ĐẢ ĐẢO → đánh bại, lật đổ（打倒する）\n• 打破＝ĐẢ PHÁ → phá bỏ, đột phá (cái cũ kỹ)（難関を打破する(なんかん)）\n• 打撃＝ĐẢ KÍCH → đòn giáng, thiệt hại lớn（打撃を受ける(うける)）", "28_7": "💡 Mẹo phân biệt 予感・余地・猶予・残余:\n• 予感＝DỰ CẢM → linh cảm, dự cảm（悪い予感(わるい)）\n• 余地＝DƯ ĐỊA → khoảng trống, dư địa, khả năng（一刻の余地も許されない(いっこく)）\n• 猶予＝DO DỰ → hoãn lại, thời gian ân hạn（一刻の猶予も許されない）\n• 残余＝TÀN DƯ → phần còn lại, dư ra（残余をそうぜん(そうぜん)）", "28_8": "💡 Mẹo phân biệt 利潤・利息・利点・利子:\n• 利潤＝LỢI NHUẬN → lợi nhuận（利潤の追求のみ(ついきゅう)）\n• 利息＝LỢI TỨC → tiền lãi, lãi suất（利息がつく）\n• 利点＝LỢI ĐIỂM → ưu điểm, lợi thế（利点がある）\n• 利子＝LỢI TỬ → tiền lãi (từ cho vay)（利子が付く(つく)）", "28_9": "💡 Mẹo phân biệt 路面・路線・航路・岐路:\n• 路面＝LỘ DIỆN → mặt đường（路面電車(でんしゃ)）\n• 路線＝LỘ TUYẾN → tuyến đường / đường lối, phương hướng（路線バス(ばす)）\n• 航路＝HÀNG LỘ → tuyến hàng hải / hàng không（航路を変える(かえる)）\n• 岐路＝KỲ LỘ → ngã rẽ, bước ngoặt quan trọng（岐路に立たされている）", "28_10": "💡 Mẹo phân biệt 調和・緩和・飽和・温和:\n• 調和＝ĐIỀU HÒA → hài hòa（調和がとれる）\n• 緩和＝HOÃN HÒA → nới lỏng, giảm bớt（規制の緩和を要求(せいかい)）\n• 飽和＝BÃO HÒA → bão hòa（飽和状態(じょうたい)）\n• 温和＝ÔN HÒA → ôn hòa, hiền lành（温和な性格(せいかく)）", "28_11": "💡 Mẹo phân biệt 比例・比較・比重・対比:\n• 比例＝TỶ LỆ → tỉ lệ thuận（比例する）\n• 比較＝TỶ GIÁO → so sánh（比較する）\n• 比重＝TỶ TRỌNG → tỉ trọng, mức độ quan trọng（人件費の比重が大きくなる）\n• 対比＝ĐỐI TỶ → đối sánh, tương phản（対比をなす(なす)）", "29_0": "💡 Mẹo phân biệt 保持・維持・保身・維新:\n• 保持＝BẢO TRÌ → duy trì, giữ nguyên（体重を保持する(たいじゅう)）\n• 維持＝DUY TRÌ → duy trì, bảo trì（健康の維持）\n• 保身＝BẢO THÂN → tự bảo vệ bản thân (thường tiêu cực)（保身のため）\n• 維新＝DUY TÂN → duy tân, cải cách（明治維新(めいじ)）", "29_1": "💡 Mẹo phân biệt 委託・委任・依頼・依存:\n• 委託＝ỦY THÁC → ủy thác, giao phó（仕事を委託する(しごと)）\n• 委任＝ỦY NHIỆM → ủy quyền（委任する）\n• 依頼＝Y LẠI → nhờ vả, yêu cầu（依頼する）\n• 依存＝Y TỒN → lệ thuộc, phụ thuộc（薬剤に依存しない）", "29_2": "💡 Mẹo phân biệt 汚点・欠点・失点・濁点:\n• 汚点＝Ô ĐIỂM → vết nhơ, điểm xấu (danh dự)（歴史に汚点を残す(のこす)）\n• 欠点＝KHUYẾT ĐIỂM → nhược điểm, khuyết điểm（欠点がある）\n• 失点＝THẤT ĐIỂM → mất điểm, điểm trừ（失点をする）\n• 濁点＝TRỌC ĐIỂM → dấu đục (ký hiệu ゛trong tiếng Nhật)（濁点をつける(つける)）", "29_3": "💡 Mẹo phân biệt 趣旨・主要・真相・容体:\n• 趣旨＝THÚ CHỈ → mục đích, ý nghĩa, ý định（この会の趣旨を説明した）\n• 主要＝CHỦ YẾU → chủ yếu, chính（主要人物(じんぶつ)）\n• 真相＝CHÂN TƯỚNG → sự thật, sự thật đằng sau（真相を明らかにする(あかす)）\n• 容体＝DUNG THỂ → tình trạng bệnh（容体が悪い(わるい)）", "29_4": "💡 Mẹo phân biệt 寄付・寄贈・寄与・寄生:\n• 寄付＝KÝ PHÓ → quyên góp, đóng góp（寄付する）\n• 寄贈＝KÝ TẶNG → tặng, hiến tặng (vật phẩm)（本を寄贈する(ほん)）\n• 寄与＝KÝ DỮ → đóng góp, cống hiến（条約成立に寄与した）\n• 寄生＝KÝ SINH → ký sinh（寄生虫(もしし)）", "29_5": "💡 Mẹo phân biệt 謝礼・謝罪・謝絶・断絶:\n• 謝礼＝TẠ LỄ → thù lao, quà tạ ơn（謝礼をする）\n• 謝罪＝TẠ TỘI → xin lỗi, tạ lỗi（謝罪する）\n• 謝絶＝TẠ TUYỆT → từ chối lịch sự（面会は謝絶されております）\n• 断絶＝ĐOẠN TUYỆT → cắt đứt hoàn toàn（関係を断絶する(かんけい)）", "29_6": "💡 Mẹo phân biệt 多量・多数・多発・多角:\n• 多量＝ĐA LƯỢNG → lượng lớn, số lượng nhiều（多量の水(みず)）\n• 多数＝ĐA SỐ → số đông, nhiều người（多数決(けつ)）\n• 多発＝ĐA PHÁT → xảy ra nhiều lần, tái diễn thường xuyên（事故が多発している）\n• 多角＝ĐA GIÁC → đa chiều, đa góc độ（多角経営(けいえい)）", "29_7": "💡 Mẹo phân biệt 部下・部門・部署・部数:\n• 部下＝BỘ HẠ → cấp dưới（部下を持つ(もつ)）\n• 部門＝BỘ MÔN → bộ phận, hạng mục, phân khúc（3つの部門に分けられていた）\n• 部署＝BỘ THỰ → bộ phận (trong tổ chức), phòng ban（部署を設ける(もける)）\n• 部数＝BỘ SỐ → số lượng (xuất bản, in ấn)（発行部数(はっこう)）", "29_8": "💡 Mẹo phân biệt 固有・固定・個別・個性:\n• 固有＝CỐ HỮU → đặc trưng riêng, đặc hữu（日本固有の文化(ぶんか)）\n• 固定＝CỐ ĐỊNH → cố định（固定資産(しさん)）\n• 個別＝CÁ BIỆT → từng cá nhân riêng lẻ（個別に対応(たいんん)）\n• 個性＝CÁ TÍNH → cá tính, đặc tính riêng（生徒一人一人の個性を尊重すべき(そんちょう)）", "29_9": "💡 Mẹo phân biệt 作用・作動・特技・特殊:\n• 作用＝TÁC DỤNG → tác dụng, tác động（タンパク質を分解する作用）\n• 作動＝TÁC ĐỘNG → hoạt động, vận hành (máy móc)（機械が作動する）\n• 特技＝ĐẶC KỸ → sở trường, kỹ năng đặc biệt（特技を持つ(もつ)）\n• 特殊＝ĐẶC THÙ → đặc thù, đặc biệt, khác thường（特殊な能力(のうりょく)）", "29_10": "💡 Mẹo phân biệt 建設・施設・施行・設備:\n• 建設＝KIẾN THIẾT → xây dựng（ダムを建設する(だも)）\n• 施設＝THI THIẾT → cơ sở, trung tâm, cơ sở vật chất（老母を施設に入れる）\n• 施行＝THI HÀNH → thi hành, thực thi（法律が施行される(ほうりつ)）\n• 設備＝THIẾT BỊ → trang thiết bị（設備を整える(ととのえる)）", "29_11": "💡 Mẹo phân biệt 危機・危害・危惧・危篤:\n• 危機＝NGUY CƠ → nguy cơ, khủng hoảng（危機に陥る(おちいる)）\n• 危害＝NGUY HẠI → tổn hại, nguy hại cho cơ thể（人体に危害(じんたい)）\n• 危惧＝NGUY CỤ → lo lắng, e ngại, quan ngại（業績のさらなる悪化を危惧していた）\n• 危篤＝NGUY ĐỐC → hấp hối, nguy kịch (bệnh nặng)（危篤状態(じょうたい)）", "30_0": "💡 Mẹo phân biệt 安静・安易・安定・安楽:\n• 安静＝AN TĨNH → nghỉ ngơi, tĩnh dưỡng（安静にする）\n• 安易＝AN DỊ → dễ dàng thái quá, thiếu trách nhiệm（安易な考え(かんがえ)）\n• 安定＝AN ĐỊNH → ổn định（生活は安定していた）\n• 安楽＝AN LẠC → an nhàn, thoải mái, sung sướng（安楽に暑らせる(くらす)）", "30_1": "💡 Mẹo phân biệt 天性・天然・運勢・運命:\n• 天性＝THIÊN TÍNH → thiên tính, bẩm sinh（天性の才能(せいはん)）\n• 天然＝THIÊN NHIÊN → thiên nhiên, tự nhiên / ngây thơ tự nhiên（天然資源(しげん)）\n• 運勢＝VẬN THẾ → vận mệnh, số vận (bói toán)（運勢を見る(みる)）\n• 運命＝VẬN MỆNH → số phận, định mệnh（運命だったのかもしれない）", "30_2": "💡 Mẹo phân biệt 円満・一円・円盤・楕円:\n• 円満＝VIÊN MÃN → viên mãn, tốt đẹp, hòa thuận（円満に解決(かいけつ)）\n• 一円＝NHẤT VIÊN → toàn bộ khu vực đó, khắp nơi（関東一円に広がった）\n• 円盤＝VIÊN BÀN → đĩa tròn, đĩa bay (UFO)（円盤状(じょう)）\n• 楕円＝THỎA VIÊN → hình elip（楕円形(かい)）", "30_3": "💡 Mẹo phân biệt 完備・完璧・完結・補完:\n• 完備＝HOÀN BỊ → đầy đủ, hoàn bị（冷暖房を完備している）\n• 完璧＝HOÀN BÍCH → hoàn hảo（完璧な作品(さくひん)）\n• 完結＝HOÀN KẾT → hoàn kết, kết thúc（物語が完結する(ものがたり)）\n• 補完＝BỔ HOÀN → bổ sung, bù đắp để hoàn thiện（不足を補完する(ふそく)）", "30_4": "💡 Mẹo phân biệt 格闘・健闘・紛争・奮発:\n• 格闘＝CÁCH ĐẤU → đấu tay đôi, chiến đấu quyết liệt（格闘する）\n• 健闘＝KIỆN ĐẤU → chiến đấu dũng cảm, cố gắng hết sức（優勝候補を相手に健闘した(ゆうしょうこうほ)）\n• 紛争＝PHÂN TRANH → tranh chấp, xung đột（国際紛争(こくさい)）\n• 奮発＝PHẤN PHÁT → cố gắng phấn đấu / mạnh tay chi tiêu（奮発して買う(かう)）", "30_5": "💡 Mẹo phân biệt 主権・特権・権威・権限:\n• 主権＝CHỦ QUYỀN → chủ quyền（国家の主権(こっか)）\n• 特権＝ĐẶC QUYỀN → đặc quyền（特権階級(かいかひょう)）\n• 権威＝QUYỀN UY → quyền uy, chuyên gia có uy tín（生物学の権威である）\n• 権限＝QUYỀN HẠN → thẩm quyền, quyền hạn（人事の権限がなかった）", "30_6": "💡 Mẹo phân biệt 制限・際限・権限・極限:\n• 制限＝CHẾ HẠN → giới hạn, hạn chế（年齢制限(ねんれい)）\n• 際限＝TẾ HẠN → giới hạn, cùng tận（際限がない）\n• 権限＝QUYỀN HẠN → thẩm quyền, quyền hạn（人事の権限がなかった）\n• 極限＝CỰC HẠN → giới hạn tối đa, tột cùng（極限まで追い込む(おいこむ)）", "30_7": "💡 Mẹo phân biệt 進化・進展・昇進・推進:\n• 進化＝TIẾN HÓA → tiến hóa, phát triển（進化する）\n• 進展＝TIẾN TRIỂN → tiến triển, có tiến bộ（何の進展も見られなかった）\n• 昇進＝THĂNG TIẾN → thăng chức, lên chức（昇進する）\n• 推進＝SUY TIẾN → thúc đẩy, xúc tiến（計画を推進する(かく)）", "30_8": "💡 Mẹo phân biệt 選出・選抜・当選・抽選:\n• 選出＝TUYỂN XUẤT → bầu chọn, lựa chọn（代表を選出する(だいひょう)）\n• 選抜＝TUYỂN BẠT → tuyển chọn (kỹ càng)（代表を選抜する(だいひょう)）\n• 当選＝ĐƯƠNG TUYỂN → trúng cử / trúng thưởng（選挙に当選する(せんきょ)）\n• 抽選＝TRỪU TUYỂN → bốc thăm, rút thăm（代表を抽選で選ぶ）", "30_9": "💡 Mẹo phân biệt 断固・断言・断念・断絶:\n• 断固＝ĐOẠN CỐ → kiên quyết, dứt khoát（政府の案に断固として反対した(あん)）\n• 断言＝ĐOẠN NGÔN → khẳng định dứt khoát, quả quyết（断言する）\n• 断念＝ĐOẠN NIỆM → từ bỏ, không còn hy vọng（断念する）\n• 断絶＝ĐOẠN TUYỆT → cắt đứt hoàn toàn（関係を断絶する(かんけい)）", "30_10": "💡 Mẹo phân biệt 反乱・反面・反響・反射:\n• 反乱＝PHẢN LOẠN → nổi loạn, phản loạn（反乱を起こす(おこす)）\n• 反面＝PHẢN DIỆN → mặt khác, mặt trái（反面反教育(なんそく)）\n• 反響＝PHẢN HƯỞNG → tiếng vang, phản hồi, phản ứng（呼び掛けに大きな反響があった）\n• 反射＝PHẢN XẠ → phản xạ, phản chiếu（光が反射する）", "30_11": "💡 Mẹo phân biệt 返還・返却・返信・返済:\n• 返還＝PHẢN HOÀN → hoàn trả, trả lại（領土を返還する(りょど)）\n• 返却＝PHẢN KHƯỚC → trả lại (đồ vật đã mượn)（本を返却する）\n• 返信＝PHẢN TÍN → hồi âm, trả lời（返信を送る(おくる)）\n• 返済＝PHẢN TẾ → hoàn trả nợ, trả nợ（借金をすべて返済した）", "31_0": "💡 Mẹo phân biệt 連動・連携・連合・連鎖:\n• 連動＝LIÊN ĐỘNG → liên động, cùng chuyển động（連動して動く(うごく)）\n• 連携＝LIÊN HỆ → phối hợp, liên kết với nhau（企業連携(きぎょう)）\n• 連合＝LIÊN HỢP → liên hợp, liên minh（連合チーム(ちーも)）\n• 連鎖＝LIÊN TỎA → phản ứng dây chuyền, liên tiếp xảy ra（連鎖反応を起こし(おこし)）", "31_1": "💡 Mẹo phân biệt 丹念・執念・念願・念頭:\n• 丹念＝ĐAN NIỆM → tỉ mỉ, cẩn thận, chu đáo（丹念に調べる(しらべる)）\n• 執念＝CHẤP NIỆM → chấp niệm, kiên trì đến cùng（執念を持つ(もつ)）\n• 念願＝NIỆM NGUYỆN → tâm nguyện, điều mong mỏi bấy lâu（念願を求める(しゃかのうちせる)）\n• 念頭＝NIỆM ĐẦU → trong tâm trí, trong đầu（消費者の反応を念頭に置いて(おいて)）", "31_2": "💡 Mẹo phân biệt 一覧・閲覧・探索・探査:\n• 一覧＝NHẤT LÃM → danh sách, bảng tổng hợp（体育館を一覧にして）\n• 閲覧＝DUYỆT LÃM → xem, duyệt (tài liệu, web...)（サイトを閲覧する(さいと)）\n• 探索＝THÁM SÁCH → tìm kiếm, khám phá（道を探索する(ほうそく)）\n• 探査＝THÁM TRA → thăm dò, khảo sát (khoa học)（宇宙探査(うちゅう)）", "31_3": "💡 Mẹo phân biệt 念力・観念・暗号・暗示:\n• 念力＝NIỆM LỰC → sức mạnh tâm linh, năng lực đặc biệt（念力で動かす(うごかす)）\n• 観念＝QUAN NIỆM → chấp nhận, bỏ cuộc / khái niệm（観念する）\n• 暗号＝ÁM HIỆU → mật mã, ký hiệu bí mật（暗号を解く(とく)）\n• 暗示＝ÁM THỊ → ám thị, gợi ý ngầm（自分に暗示をかけた）", "31_4": "💡 Mẹo phân biệt 感度・感触・感知・感銘:\n• 感度＝CẢM ĐỘ → độ nhạy cảm（感度が高い(たかい)）\n• 感触＝CẢM XÚC → cảm giác khi chạm / ấn tượng, phản hồi（この件について良い感触を得た）\n• 感知＝CẢM TRI → cảm nhận, phát hiện (cảm biến)（危険を感知する(きけん)）\n• 感銘＝CẢM MINH → cảm kích sâu sắc, ấn tượng mạnh（感銘を受ける(うける)）", "31_5": "💡 Mẹo phân biệt 関知・関与・関節・関門:\n• 関知＝QUAN TRI → có liên quan và biết đến（関知しない(しない)）\n• 関与＝QUAN DỰ → liên quan, dính líu, tham gia（外部からの関与が認められた(みとめられた)）\n• 関節＝QUAN TIẾT → khớp xương（関節が痛い(いたい)）\n• 関門＝QUAN MÔN → cửa ải, thử thách phải vượt qua（関門を越える(こえる)）", "31_6": "💡 Mẹo phân biệt 近海・近隣・接近・付近:\n• 近海＝CẬN HẢI → vùng biển gần, biển cận duyên（近海漁業(ぎょう)）\n• 近隣＝CẬN LÂN → lân cận, xung quanh（近隣住民(じゅうみん)）\n• 接近＝TIẾP CẬN → tiếp cận, đến gần（台風が沖縄地方に接近している）\n• 付近＝PHỤ CẬN → gần đó, khu vực xung quanh（付近の店(てん)）", "31_7": "💡 Mẹo phân biệt 満場・満室・充満・円満:\n• 満場＝MÃN TRƯỜNG → chật ních người, đầy phòng（満場の拍手(はくしゅ)）\n• 満室＝MÃN THẤT → hết phòng, đầy phòng（ホテルが満室(ほてる)）\n• 充満＝SUNG MÃN → đầy ắp, tràn ngập (khí gas, cảm xúc...)（ガスが部屋に充満していた）\n• 円満＝VIÊN MÃN → viên mãn, hòa thuận（円満に解決(かいけつ)）", "31_8": "💡 Mẹo phân biệt 世論・議論・討論・反論:\n• 世論＝THẾ LUẬN → dư luận, ý kiến công chúng（世論調査(ちょうさ)）\n• 議論＝NGHỊ LUẬN → tranh luận, thảo luận（議論を重ねる(かさねる)）\n• 討論＝THẢO LUẬN → tranh luận, debate（討論会(かい)）\n• 反論＝PHẢN LUẬN → phản bác, bác lại ý kiến（別の観点から反論を述べた(のべた)）", "31_9": "💡 Mẹo phân biệt 原本・根本・手本・資本:\n• 原本＝NGUYÊN BẢN → bản gốc, tài liệu gốc（原本をコピーする(こぴー)）\n• 根本＝CĂN BẢN → căn bản, gốc rễ, cốt lõi（根本的な原因(てきな)）\n• 手本＝THỦ BẢN → mẫu, gương mẫu để học theo（漢字を手本にして）\n• 資本＝TƯ BẢN → vốn, tư bản（資本を集める(つどめる)）", "31_10": "💡 Mẹo phân biệt 音節・音符・音程・音色:\n• 音節＝ÂM TIẾT → âm tiết, syllable（音節を区切る(くぎる)）\n• 音符＝ÂM PHÙ → nốt nhạc（音符を読む(よむ)）\n• 音程＝ÂM TRÌNH → cao độ âm nhạc, pitch（音程がずれている）\n• 音色＝ÂM SẮC → âm sắc, chất âm（ピアノの音色(ぴあの)）", "31_11": "💡 Mẹo phân biệt 検定・検索・検閲・検討:\n• 検定＝KIỂM ĐỊNH → kiểm tra, thi chứng chỉ（英語検定(えいご)）\n• 検索＝KIỂM SÁCH → tìm kiếm (thông tin)（インターネットで検索する(いんたーねっと)）\n• 検閲＝KIỂM DUYỆT → kiểm duyệt, xét duyệt（検閲する）\n• 検討＝KIỂM THẢO → xem xét, cân nhắc, nghiên cứu（予算について社内で検討する）", "32_0": "💡 Mẹo phân biệt 厳守・厳禁・威厳・尊厳:\n• 厳守＝NGHIÊM THỦ → tuân thủ nghiêm ngặt（期限を厳守する(きげん)）\n• 厳禁＝NGHIÊM CẤM → nghiêm cấm（遅刻は厳禁だと注意された(ちこく)）\n• 威厳＝UY NGHIÊM → uy nghiêm, oai phong（威厳を保つ(たもつ)）\n• 尊厳＝TÔN NGHIÊM → nhân phẩm, sự tôn nghiêm（尊厳を守る(まもる)）", "32_1": "💡 Mẹo phân biệt 根底・根気・根性・根源:\n• 根底＝CĂN ĐỂ → nền tảng, gốc rễ sâu xa（根底から覆された(くかされた)）\n• 根気＝CĂN KHÍ → sự kiên nhẫn, bền bỉ（根気が要る(いる)）\n• 根性＝CĂN TÍNH → nghị lực, ý chí không khuất phục（根性を見せる(みせる)）\n• 根源＝CĂN NGUYÊN → căn nguyên, nguồn gốc, gốc rễ（根源に迭る(たどる)）", "32_2": "💡 Mẹo phân biệt 山脈・山岳・山腹・山積:\n• 山脈＝SƠN MẠCH → dãy núi（山脈の術り(つらなり)）\n• 山岳＝SƠN NHẠC → núi cao, vùng núi（山岳地帯(ちたい)）\n• 山腹＝SƠN PHÚC → sườn núi, lưng chừng núi（山腹に住む(すも)）\n• 山積＝SƠN TÍCH → chồng chất, tích lũy nhiều vấn đề（問題が山積している）", "32_3": "💡 Mẹo phân biệt 散策・散漫・散発・発散:\n• 散策＝TÁN SÁCH → dạo chơi, tản bộ（湖の周りを散策した）\n• 散漫＝TÁN MẠN → phân tán, thiếu tập trung（散漫な性格(せいかく)）\n• 散発＝TÁN PHÁT → rải rác, không đều đặn（散発的に(てきに)）\n• 発散＝PHÁT TÁN → xả (năng lượng, cảm xúc), toả ra（ストレスを発散する(すとれす)）", "32_4": "💡 Mẹo phân biệt 原案・原点・原形・原則:\n• 原案＝NGUYÊN ÁN → bản thảo gốc, đề án ban đầu（原案を作る(つくる)）\n• 原点＝NGUYÊN ĐIỂM → điểm xuất phát, điểm gốc（原点に戻る(もどる)）\n• 原形＝NGUYÊN HÌNH → hình dạng ban đầu, nguyên hình（原形を保つ(たもつ)）\n• 原則＝NGUYÊN TẮC → nguyên tắc, quy tắc cơ bản（一人5分までを原則とさせていただきます）", "32_5": "💡 Mẹo phân biệt 混迷・混戦・混同・混入:\n• 混迷＝HỖN MÊ → hỗn loạn, mơ hồ không biết phải làm gì（混迷した状況(じょうかん)）\n• 混戦＝HỖN CHIẾN → hỗn chiến, đấu tranh lộn xộn（混戦となる(となる)）\n• 混同＝HỖN ĐỒNG → nhầm lẫn, lẫn lộn（公私を混同してはいけない）\n• 混入＝HỖN NHẬP → lẫn vào, trộn vào（異物が混入する(いぶつ)）", "32_6": "💡 Mẹo phân biệt 真理・真偽・真相・真髄:\n• 真理＝CHÂN LÝ → chân lý, sự thật phổ quát（真理を追求する(ついきゅう)）\n• 真偽＝CHÂN NGỤY → thật giả, đúng sai（真偽を見極める(みきわめる)）\n• 真相＝CHÂN TƯỚNG → sự thật, sự thật đằng sau（事件の真相は闇に葬られた(やみにほうむられた)）\n• 真髄＝CHÂN TỦY → tinh túy, cốt lõi, bản chất sâu xa nhất（真髄を掴む(つかむ)）", "32_7": "💡 Mẹo phân biệt 先例・先行・率先・優先:\n• 先例＝TIÊN LỆ → tiền lệ, ví dụ trước đây（先例がない(ない)）\n• 先行＝TIÊN HÀNH → đi trước, tiên phong（先行する）\n• 率先＝SUẤT TIÊN → tiên phong, đi đầu（率先して行う(おこなう)）\n• 優先＝ƯU TIÊN → ưu tiên（この席は、お年寄りの方が優先です）", "32_8": "💡 Mẹo phân biệt 前途・前衛・前提・前例:\n• 前途＝TIỀN ĐỒ → tiền đồ, tương lai phía trước（前途に不安(ふあん)）\n• 前衛＝TIỀN VỆ → tiên phong, avant-garde（前衛的なアート(てきなあーと)）\n• 前提＝TIỀN ĐỀ → tiền đề, điều kiện tiên quyết（結婚を前提にお付き合いを始めた）\n• 前例＝TIỀN LỆ → tiền lệ, ví dụ trước đó（前例のない(ない)）", "32_9": "💡 Mẹo phân biệt 全盛・全快・全権・万全:\n• 全盛＝TOÀN THỊNH → thời hoàng kim, đỉnh cao（このチームの全盛のころは）\n• 全快＝TOÀN KHOÁI → khỏi bệnh hoàn toàn（全快する）\n• 全権＝TOÀN QUYỀN → toàn quyền（全権大使(たいし)）\n• 万全＝VẠN TOÀN → hoàn hảo, chu đáo toàn diện（万全の準備(じんび)）", "32_10": "💡 Mẹo phân biệt 幻滅・幻覚・幻想・幻影:\n• 幻滅＝HUYỄN DIỆT → vỡ mộng, thất vọng（東京での生活に幻滅することも多い）\n• 幻覚＝HUYỄN GIÁC → ảo giác（幻覚を見る(みる)）\n• 幻想＝HUYỄN TƯỞNG → ảo tưởng, ảo mộng（幻想を抱く(いだく)）\n• 幻影＝HUYỄN ẢNH → bóng ma, ảo ảnh（幻影のように(ように)）", "32_11": "💡 Mẹo phân biệt 新興・新人・新規・新緑:\n• 新興＝TÂN HƯNG → mới nổi, đang phát triển（新興企業(きぎょう)）\n• 新人＝TÂN NHÂN → người mới, tân binh（新人の社員教育を担当(たんとう)）\n• 新規＝TÂN QUY → mới, lần đầu tiên（新規作成(さくせい)）\n• 新緑＝TÂN LỤC → lá non mùa xuân, xanh tươi mới（新緑の季節(きせつ)）", "33_0": "💡 Mẹo phân biệt 大半・後半・半端・半減:\n• 大半＝ĐẠI BÁN → phần lớn, hầu hết（クラスの大半が欠席して）\n• 後半＝HẬU BÁN → nửa sau, hiệp sau（試合の後半(しあい)）\n• 半端＝BÁN ĐOAN → nửa vời, lửng lơ, dở dang（中途半端(ちゅうと)）\n• 半減＝BÁN GIẢM → giảm một nửa（売上が半減する(うりあげ)）", "33_1": "💡 Mẹo phân biệt 転移・転向・転回・転送:\n• 転移＝CHUYỂN DI → di căn, chuyển dịch（がんの転移(がん)）\n• 転向＝CHUYỂN HƯỚNG → chuyển hướng, thay đổi lập trường（転向する）\n• 転回＝CHUYỂN HỒI → quay vòng, chuyển hướng（Uターンして転回(して)）\n• 転送＝CHUYỂN TỐNG → chuyển tiếp (email, điện thoại...)（部下からのメールを上司に転送した）", "33_2": "💡 Mẹo phân biệt 難産・難航・難破・難問:\n• 難産＝NAN SẢN → sinh khó / việc khó thành（難産を乗り越える(のりこえる)）\n• 難航＝NAN HÀNG → gặp khó khăn, tiến triển chậm（両国間の和平交渉は難航している）\n• 難破＝NAN PHÁ → đắm tàu, vỡ tàu（難破船(せん)）\n• 難問＝NAN VẤN → câu hỏi khó, vấn đề nan giải（難問を解く(とく)）", "33_3": "💡 Mẹo phân biệt 親善・善意・善良・善処:\n• 親善＝THÂN THIỆN → thân thiện, giao hảo（親善試合(じあい)）\n• 善意＝THIỆN Ý → thiện chí, lòng tốt（善意を示す(しめす)）\n• 善良＝THIỆN LƯƠNG → hiền lành, tốt bụng（善良な市民(しめん)）\n• 善処＝THIỆN XỬ → xử lý tốt, giải quyết thích hợp（会社側は善処した）", "33_4": "💡 Mẹo phân biệt 点滅・点検・観点・重点:\n• 点滅＝ĐIỂM DIỆT → nhấp nháy, chớp tắt（点滅のため）\n• 点検＝ĐIỂM KIỂM → kiểm tra, bảo dưỡng（エスカレーターの点検のため階段を利用(かいだん)）\n• 観点＝QUAN ĐIỂM → quan điểm, góc nhìn（観点を変える(かえる)）\n• 重点＝TRỌNG ĐIỂM → trọng điểm, điểm quan trọng（重点を置く(おく)）", "33_5": "💡 Mẹo phân biệt 探究・探偵・探知・探索:\n• 探究＝THÁM CỨU → nghiên cứu sâu, tìm tòi（真理を探究する(しんり)）\n• 探偵＝THÁM TRINH → thám tử（探偵小説(しょうせつ)）\n• 探知＝THÁM TRI → phát hiện, dò tìm（点を探知することができる）\n• 探索＝THÁM SÁCH → tìm kiếm, khám phá（道を探索する(ほうそく)）", "33_6": "💡 Mẹo phân biệt 公認・黙認・認可・認証:\n• 公認＝CÔNG NHẬN → công nhận chính thức（公認会計士(かいけいし)）\n• 黙認＝MẶC NHẬN → mặc nhiên công nhận, ngầm chấp nhận（黙認する）\n• 認可＝NHẬN KHẢ → cho phép, phê duyệt (chính thức)（企業認可(きぎょう)）\n• 認証＝NHẬN CHỨNG → xác thực, chứng thực（指紋を認証できないと開かない）", "33_7": "💡 Mẹo phân biệt 伝説・伝達・伝統・伝聞:\n• 伝説＝TRUYỀN THUYẾT → truyền thuyết（蛇の霊が住みついているという伝説(へびのれい)）\n• 伝達＝TRUYỀN ĐẠT → truyền đạt, thông báo（意味を伝達する(いみ)）\n• 伝統＝TRUYỀN THỐNG → truyền thống（伝統文化(ぶんか)）\n• 伝聞＝TRUYỀN VĂN → nghe kể lại, thông tin gián tiếp（伝聞で聞く(きく)）", "33_8": "💡 Mẹo phân biệt 老年・中年・晩年・長年:\n• 老年＝LÃO NIÊN → tuổi già, cao niên（老年の楽しみ(たのしみ)）\n• 中年＝TRUNG NIÊN → trung niên (40-50 tuổi)（40代の中年男性と思われる）\n• 晩年＝VÃN NIÊN → cuối đời, tuổi xế chiều（晩年を迎える(みひかえる)）\n• 長年＝TRƯỜNG NIÊN → nhiều năm, lâu năm（長年の努力(どりょく)）", "33_9": "💡 Mẹo phân biệt 難関・難局・天災・天敵:\n• 難関＝NAN QUAN → cửa ải khó, thử thách khó vượt（難関を突破する(とっぱ)）\n• 難局＝NAN CỤC → tình huống khó khăn, cục diện nan giải（難局を乗り越える(のりこえる)）\n• 天災＝THIÊN TAI → thiên tai, thảm họa tự nhiên（地震や洪水などの天災は忘れたころにやってくる）\n• 天敵＝THIÊN ĐỊCH → thiên địch, kẻ thù tự nhiên（ザリガニの天敵(ざりがに)）", "33_10": "💡 Mẹo phân biệt 文書・文面・文語・文通:\n• 文書＝VĂN THƯ → văn bản, tài liệu（公式文書(こうしき)）\n• 文面＝VĂN DIỆN → nội dung văn bản, mặt chữ（手紙の文面(てがみ)）\n• 文語＝VĂN NGỮ → văn ngữ, ngôn ngữ viết (cổ)（文語体(たい)）\n• 文通＝VĂN THÔNG → trao đổi thư từ, pen pal（日本語で文通を始めた）", "33_11": "💡 Mẹo phân biệt 分配・分担・分析・分解:\n• 分配＝PHÂN PHỐI → phân phối, chia đều（利益を分配する(りえき)）\n• 分担＝PHÂN ĐẢM → phân công, chia nhau đảm nhiệm（仕事を分担する(しごと)）\n• 分析＝PHÂN TÍCH → phân tích（敗因を分析した(はいいん)）\n• 分解＝PHÂN GIẢI → phân giải, tháo rời, phân hủy（タンパク質を分解する(たんぱくしつ)）", "34_0": "💡 Mẹo phân biệt 感想・幻想・現象・印象:\n• 感想＝CẢM TƯỞNG → cảm tưởng, suy nghĩ sau khi trải nghiệm（感想を説べる(のべる)）\n• 幻想＝HUYỄN TƯỞNG → ảo tưởng, ảo mộng（幻想を抱く(いだく)）\n• 現象＝HIỆN TƯỢNG → hiện tượng（現象を説明する(せつめい)）\n• 印象＝ẤN TƯỢNG → ấn tượng（明るく朗らかで良い印象を受ける(あかるくほがらかで)）", "34_1": "💡 Mẹo phân biệt 引退・引率・強引・索引:\n• 引退＝DẪN THOÁI → giải nghệ, về hưu（現役を引退する(げんやく)）\n• 引率＝DẪN SUẤT → dẫn đoàn, hướng dẫn (đoàn người)（修学旅行では、引率の先生を中心に(しゅうがくりょこう)）\n• 強引＝CƯỜNG DẪN → cưỡng ép, bắt ép（強引に進める(すすめる)）\n• 索引＝SÁCH DẪN → mục lục chỉ mục, index（索引をつける(つける)）", "34_2": "💡 Mẹo phân biệt 注文・指揮・演出・監督:\n• 注文＝CHÚ VĂN → đặt hàng, gọi món（料理を注文する(りょうり)）\n• 指揮＝CHỈ HUY → chỉ huy, lãnh đạo（現場を指揮する(げんば)）\n• 演出＝DIỄN XUẤT → dàn dựng, biên đạo, tạo hiệu ứng（とても凝った演出で雰囲気も盛り上がった(いかった)）\n• 監督＝GIÁM ĐỐC → giám đốc, đạo diễn, huấn luyện viên（監督を務める(つとめる)）", "34_3": "💡 Mẹo phân biệt 延滞・渋滞・遅延・遅刻:\n• 延滞＝DIÊN TRỆ → trễ hạn, chậm trễ thanh toán（授業料は延滞のないように納入(のうにゅう)）\n• 渋滞＝SÁP TRỆ → tắc đường, ùn tắc（道路が渋滞する(どうろ)）\n• 遅延＝TRÌ DIÊN → chậm trễ, trì hoãn（電車の遅延(でんしゃ)）\n• 遅刻＝TRÌ KHẮC → đi trễ, đến muộn（遅刻する）", "34_4": "💡 Mẹo phân biệt 宣告・勧告・勧誘・誘惑:\n• 宣告＝TUYÊN CÁO → tuyên bố, tuyên án（有罪宣告(ゆうざい)）\n• 勧告＝KHUYẾN CÁO → khuyến cáo, khuyến nghị（勧告を受ける(うける)）\n• 勧誘＝KHUYẾN DỤ → mời chào, chiêu dụ（いろんな業者から勧誘の電話がかかってくる）\n• 誘惑＝DỤ HOẶC → cám dỗ, quyến rũ（誘惑に負ける(まける)）", "34_5": "💡 Mẹo phân biệt 肝心・肝要・幹事・幹部:\n• 肝心＝CAN TÂM → quan trọng nhất, cốt lõi（肝心なこと(こと)）\n• 肝要＝CAN YẾU → cực kỳ quan trọng, thiết yếu（肝要なことは(こと)）\n• 幹事＝CÁN SỰ → người tổ chức, thư ký (hội nhóm)（飲み会の幹事(のみかい)）\n• 幹部＝CÁN BỘ → cán bộ, ban lãnh đạo（不正に関わっていたのは幹部社員全員(しゃいんぜんいん)）", "34_6": "💡 Mẹo phân biệt 至急・緊急・緊迫・性急:\n• 至急＝CHÍ CẤP → khẩn cấp, gấp（至急連絡する(れんらく)）\n• 緊急＝KHẨN CẤP → khẩn cấp, cấp bách（災害時など緊急の連絡先を記入(れんらくさき)）\n• 緊迫＝KHẨN BÁCH → căng thẳng, nghiêm trọng（緊迫した状況(したじょうかん)）\n• 性急＝TÍNH CẤP → nóng vội, thiếu kiên nhẫn（性急な性格(せいかく)）", "34_7": "💡 Mẹo phân biệt 禁物・禁止・制止・抑制:\n• 禁物＝CẤM VẬT → điều cấm kỵ, tuyệt đối không được（成功したからといって、油断は禁物である）\n• 禁止＝CẤM CHỈ → cấm, cấm chỉ（驅車禁止(ちゅうしゃ)）\n• 制止＝CHẾ CHỈ → ngăn chặn, ngăn cản（出血を制止する(しゅっけつ)）\n• 抑制＝ỨC CHẾ → kìm chế, kiểm soát（感情を抑制する(かんじょう)）", "34_8": "💡 Mẹo phân biệt 要約・倹約・省略・簡略:\n• 要約＝YẾU ƯỚC → tóm tắt, rút gọn nội dung（内容を要約する(ないよう)）\n• 倹約＝KIỆM ƯỚC → tiết kiệm, tằn tiện（浪費を抑え、倹約に努めた(つとめた)）\n• 省略＝TỈNH LƯỢC → bỏ qua, lược bỏ, viết tắt（詳細を省略する(しょうさい)）\n• 簡略＝GIẢN LƯỢC → đơn giản hóa, lược giản（簡略に説明する(せつめい)）", "34_9": "💡 Mẹo phân biệt 口頭・口調・言及・言動:\n• 口頭＝KHẨU ĐẦU → bằng miệng, trực tiếp (không viết)（口頭で述べるより、文書で提出(のべるより)）\n• 口調＝KHẨU ĐIỆU → giọng điệu, cách nói（口調を変える(かえる)）\n• 言及＝NGÔN CẬP → đề cập, nhắc đến（プライベートな質問に対しては言及を避けた(しつもん、さけた)）\n• 言動＝NGÔN ĐỘNG → lời nói và hành động（言動に気をつける(きをつける)）", "34_10": "💡 Mẹo phân biệt 面目・面識・顔面・一面:\n• 面目＝DIỆN MỤC → thể diện, danh dự（何とか面目は保つことができた(たもつ)）\n• 面識＝DIỆN THỨC → quen mặt, biết nhau（面識がある(ある)）\n• 顔面＝NHAN DIỆN → mặt, khuôn mặt（顔面を合わせて(あわせて)）\n• 一面＝NHẤT DIỆN → một mặt, một khía cạnh / trang nhất（一面に載る(のる)）", "34_11": "💡 Mẹo phân biệt 反乱・散乱・騒乱・混乱:\n• 反乱＝PHẢN LOẠN → nổi loạn, phản loạn（反乱を起こす(おこす)）\n• 散乱＝TÁN LOẠN → bừa bãi, vương vãi khắp nơi（部屋が散乱する(している)）\n• 騒乱＝TAO LOẠN → náo loạn, bạo loạn（騒乱を起こす(おこす)）\n• 混乱＝HỖN LOẠN → hỗn loạn, rối loạn（あまりのショックに頭が混乱してしまった）", "35_0": "💡 Mẹo phân biệt 専攻・専用・専業・専念:\n• 専攻＝CHUYÊN CÔNG → chuyên ngành (học)（専攻する）\n• 専用＝CHUYÊN DỤNG → dành riêng, chuyên dụng（女性専用のトイレ）\n• 専業＝CHUYÊN NGHIỆP → chuyên nghiệp, làm một nghề duy nhất（専業主婦(しゅふ)）\n• 専念＝CHUYÊN NIỆM → chuyên tâm, tập trung một việc（専念する）", "35_1": "💡 Mẹo phân biệt 診断・審理・審査・考査:\n• 診断＝CHẨN ĐOÁN → chẩn đoán (y tế)（医師の診断(いし)）\n• 審理＝THẨM LÝ → xét xử, thẩm tra (tòa án)（裁判で審理する(さいばん)）\n• 審査＝THẨM TRA → thẩm định, xét duyệt, chấm thi（コンテストは審査により優勝者が決定(けってい)）\n• 考査＝KHẢO TRA → kiểm tra, thi (học kỳ)（期末考査(きまつ)）", "35_2": "💡 Mẹo phân biệt 集会・会談・談合・団結:\n• 集会＝TẬP HỘI → cuộc tụ họp, hội họp（抗議集会(こうぎ)）\n• 会談＝HỘI ĐÀM → hội đàm, cuộc gặp gỡ（首脳会談(しゅのう)）\n• 談合＝ĐÀM HỢP → thông đồng đấu thầu (bất hợp pháp)（公共事業を発注する際、談合が行われた(はっちゅう)）\n• 団結＝ĐOÀN KẾT → đoàn kết（団結を訴える(うったえる)）", "35_3": "💡 Mẹo phân biệt 開陳・陳列・展開・参列:\n• 開陳＝KHAI TRẦN → trình bày, nêu ra (ý kiến)（意見を開陳する(いけん)）\n• 陳列＝TRẦN LIỆT → trưng bày, bày ra（宝石がガラスケースの中に陳列されていた）\n• 展開＝TRIỂN KHAI → triển khai, mở rộng, diễn ra（議論を展開する(ぎろん)）\n• 参列＝THAM LIỆT → tham dự (lễ), có mặt（式に参列する(しかいに)）", "35_4": "💡 Mẹo phân biệt 添付・寄付・添加・増加:\n• 添付＝THIÊM PHỤ → đính kèm, gắn thêm（身分証明書の添付が必要(みぶんしょうめいしょ)）\n• 寄付＝KÝ PHÓ → quyên góp, đóng góp（寄付する）\n• 添加＝THIÊM GIA → phụ gia, thêm vào（食品添加物(しょくひん)）\n• 増加＝TĂNG GIA → tăng lên, gia tăng（人口が増加する(じんこう)）", "35_5": "💡 Mẹo phân biệt 放任・就任・任命・運命:\n• 放任＝PHÓNG NHIỆM → thả lỏng, mặc kệ（放任主義(しゅぎ)）\n• 就任＝TỰU NHIỆM → nhậm chức, bắt đầu đảm nhận chức vụ（就任する）\n• 任命＝NHIỆM MỆNH → bổ nhiệm, chỉ định（議会の議長に任命された）\n• 運命＝VẬN MỆNH → số phận, định mệnh（運命を感じる(かんじる)）", "35_6": "💡 Mẹo phân biệt 繁盛・繁殖・増大・膨大:\n• 繁盛＝PHỒN THỊNH → buôn bán phát đạt, làm ăn thịnh vượng（商売繁盛(しょうばい)）\n• 繁殖＝PHỒN THỰC → sinh sản, nhân giống（不潔な所にはカビや微生物が繁殖する(ふけつ)）\n• 増大＝TĂNG ĐẠI → tăng lớn, mở rộng（人口が増大する(じんこう)）\n• 膨大＝BÀNH ĐẠI → khổng lồ, rất nhiều（膨大な資金(しきん)）", "35_7": "💡 Mẹo phân biệt 名誉・誇大・雄弁・賛美:\n• 名誉＝DANH DỰ → danh dự, vinh dự（名誉を汚す(けがす)）\n• 誇大＝KHOA ĐẠI → phóng đại, cường điệu（誇大に言う(いう)）\n• 雄弁＝HÙNG BIỆN → hùng hồn, hùng biện（雄弁に経歴を説明した(けいれき)）\n• 賛美＝TÁN MỸ → ca ngợi, tán dương（スターの経歴を賛美した(けいれき)）", "35_8": "💡 Mẹo phân biệt 忘却・喪失・紛失・紛糾:\n• 忘却＝VONG KHƯỚC → quên lãng, lãng quên hoàn toàn（忘却する）\n• 喪失＝TANG THẤT → mất mát (quan trọng)（記憶を喪失する(きかく)）\n• 紛失＝PHÂN THẤT → mất đồ, thất lạc（大事な書類を紛失してしまい(だいじな)）\n• 紛糾＝PHÂN CỦ → rối loạn, rắc rối phức tạp（交渉が紛糾する(こうしょう)）", "35_9": "💡 Mẹo phân biệt 関与・仲裁・媒介・斡旋:\n• 関与＝QUAN DỰ → liên quan, dính líu, tham gia（外部からの関与(がいぶ)）\n• 仲裁＝TRỌNG TÀI → hòa giải, trung gian（ゴザを仲裁する(ござ)）\n• 媒介＝MÔI GIỚI → trung gian, môi giới（媒介する）\n• 斡旋＝ÁT TIẾN → môi giới, giới thiệu, dàn xếp（友人が甥の就職を斡旋してくれた(おい、しゅうしょく)）", "35_10": "💡 Mẹo phân biệt 占領・占拠・独占・独断:\n• 占領＝CHIẾM LĨNH → chiếm đóng, chiếm giữ（領土を占領する(りょど)）\n• 占拠＝CHIẾM CỨ → chiếm cứ, cố thủ（座席を占拠する(ざせき)）\n• 独占＝ĐỘC CHIẾM → độc quyền, chiếm hết（離婚問題が話題を独占している）\n• 独断＝ĐỘC ĐOÁN → độc đoán, tự quyết một mình（独断で決める(きめる)）", "35_11": "💡 Mẹo phân biệt 傾向・傾倒・偏向・偏見:\n• 傾向＝KHUYNH HƯỚNG → xu hướng, khuynh hướng（傾向がある(ある)）\n• 傾倒＝KHUYNH ĐẢO → nghiêng về, đắm mình vào（オウェス員に傾倒する(いん)）\n• 偏向＝THIÊN HƯỚNG → lệch lạc, thiên lệch（偏向した意見(いけん)）\n• 偏見＝THIÊN KIẾN → thành kiến, định kiến（外国人に対して偏見を持たない(もたない)）", "36_0": "💡 Mẹo phân biệt 愛想・愛用・愛護・愛着:\n• 愛想＝ÁI TƯỞNG → dễ mến, lịch sự thân thiện（愛想がいい(いい)）\n• 愛用＝ÁI DỤNG → dùng thường xuyên vì yêu thích（愛用品(ひん)）\n• 愛護＝ÁI HỘ → yêu quý và bảo vệ（愛護動物(どうぶつ)）\n• 愛着＝ÁI TRƯỚC → sự gắn bó, luyến lưu（30年も使い続けているこのペンには愛着を覚える(つづけている)）", "36_1": "💡 Mẹo phân biệt 改修・改定・改善・改革:\n• 改修＝CẢI TU → tu sửa, cải tạo (công trình)（住宅を改修する(じゅうたく)）\n• 改定＝CẢI ĐỊNH → sửa đổi, điều chỉnh (quy định, giá...)（料金を改定する(りょうきん)）\n• 改善＝CẢI THIỆN → cải thiện, cải thiện（待遇の改善を要求した(たいぐう)）\n• 改革＝CẢI CÁCH → cải cách (lớn)（改革を行う(おこなう)）", "36_2": "💡 Mẹo phân biệt 介入・介護・厄介・媒介:\n• 介入＝GIỚI NHẬP → can thiệp, xen vào（武力介入(ぶりょく)）\n• 介護＝GIỚI HỘ → chăm sóc (người già, người khuyết tật)（施設で老人の介護をしている）\n• 厄介＝ÁCH GIỚI → phiền phức, rắc rối（厄介な問題(もんだい)）\n• 媒介＝MÔI GIỚI → trung gian, môi giới, truyền bệnh（媒介する）", "36_3": "💡 Mẹo phân biệt 概要・概説・概論・大概:\n• 概要＝KHÁI YẾU → khái quát, tóm tắt tổng quan（新企画の概要を説明(しんきかく)）\n• 概説＝KHÁI THUYẾT → giải thích khái quát, tóm lược（日本史概説(にほんし)）\n• 概論＝KHÁI LUẬN → lý luận khái quát, nhập môn（法学概論(ほうがく)）\n• 大概＝ĐẠI KHÁI → đại khái, phần lớn, thông thường（大概わかる(わかる)）", "36_4": "💡 Mẹo phân biệt 形態・形勢・形跡・形式:\n• 形態＝HÌNH THÁI → hình thái, dạng thức（形態を保つ(たもつ)）\n• 形勢＝HÌNH THẾ → tình thế, cục diện（形勢が不利(ふり)）\n• 形跡＝HÌNH TÍCH → dấu vết, vết tích（何者かが侵入した形跡があった(しんにゅうした)）\n• 形式＝HÌNH THỨC → hình thức, mẫu, thể thức（形式的な(てきな)）", "36_5": "💡 Mẹo phân biệt 再現・再生・再発・再三:\n• 再現＝TÁI HIỆN → tái hiện, tái xuất hiện（事件を再現する(じけん)）\n• 再生＝TÁI SINH → tái sinh, phát lại (âm thanh/video)（動画を再生する(どうが)）\n• 再発＝TÁI PHÁT → tái phát, xảy ra lại（注意されたにもかかわらず、再発した(さいはつした)）\n• 再三＝TÁI TAM → nhiều lần, lặp đi lặp lại（再三注意する(ちゅうい)）", "36_6": "💡 Mẹo phân biệt 対照・対称・対面・対比:\n• 対照＝ĐỐI CHIẾU → đối chiếu, so sánh tương phản（対照をなす(なす)）\n• 対称＝ĐỐI XỨNG → đối xứng（シャツのデザインは左右対称になっていた）\n• 対面＝ĐỐI DIỆN → đối mặt, gặp mặt trực tiếp（対面する）\n• 対比＝ĐỐI TỶ → đối sánh, tương phản（対比をなす(なす)）", "36_7": "💡 Mẹo phân biệt 害悪・妨害・傷害・損害:\n• 害悪＝HẠI ÁC → điều có hại, tác hại（害悪を及ぼす(およぼす)）\n• 妨害＝PHƯƠNG HẠI → cản trở, gây trở ngại, phá hoại（電波を妨害されテレビが映らなくなった(でんぱ)）\n• 傷害＝THƯƠNG HẠI → thương tích, gây thương tích（傷害を与える(あたえる)）\n• 損害＝TỔN HẠI → thiệt hại, tổn thất（損害を与える(あたえる)）", "36_8": "💡 Mẹo phân biệt 体制・規制・強制・制御:\n• 体制＝THỂ CHẾ → thể chế, hệ thống tổ chức（中央集権の体制から地方分権へ(ちゅうおうしゅうけん)）\n• 規制＝QUY CHẾ → quy định hạn chế, kiểm soát（規制を緩和する(かんしゃ)）\n• 強制＝CƯỜNG CHẾ → cưỡng bức, ép buộc（強制的に(てきに)）\n• 制御＝CHẾ NGỰ → điều khiển, kiểm soát (kỹ thuật)（コントロールを制御する(こんとろーる)）", "36_9": "💡 Mẹo phân biệt 成立・形成・促成・作成:\n• 成立＝THÀNH LẬP → thành lập, hình thành（口約が成立する(けいやく)）\n• 形成＝HÌNH THÀNH → hình thành, tạo nên（家族を形成する動物）\n• 促成＝XÚC THÀNH → thúc đẩy phát triển nhanh（極の促成栄養(うちようばい)）\n• 作成＝TÁC THÀNH → tạo lập, soạn thảo (tài liệu)（資料を作成する(しりょう)）", "36_10": "💡 Mẹo phân biệt 属性・天性・性格・性能:\n• 属性＝THUỘC TÍNH → thuộc tính, đặc điểm vốn có（他社製品と属性を比較した(たし、ひかく)）\n• 天性＝THIÊN TÍNH → thiên tính, bẩm sinh（天性の才能(せいはん)）\n• 性格＝TÍNH CÁCH → tính cách, tính khí（性格がいい(いい)）\n• 性能＝TÍNH NĂNG → hiệu suất, tính năng (máy móc)（高性能(こう)）", "36_11": "💡 Mẹo phân biệt 開幕・開封・開発・開拓:\n• 開幕＝KHAI MẠC → khai mạc, mở màn（オリンピックが開幕する(かいまく)）\n• 開封＝KHAI PHONG → mở phong bì, bóc ra（手紙を開封する(てがみ)）\n• 開発＝KHAI PHÁT → phát triển, phát minh, khai thác（新製品の開発に力を注いだ(ちからをそそいだ)）\n• 開拓＝KHAI THÁC → khai hoang, khai phá, mở ra lĩnh vực mới（選手開拓(せんしゅ)）", "37_0": "💡 Mẹo phân biệt 配布・配分・配置・配当:\n• 配布＝PHỐI BỐ → phân phát, phát cho nhiều người（参加者に資料が配布された(しりょう)）\n• 配分＝PHỐI PHÂN → phân bổ, chia đều（利益を配分する(りえき)）\n• 配置＝PHỐI TRÍ → bố trí, phân công, sắp xếp（人員を配置する(じんいん)）\n• 配当＝PHỐI ĐƯƠNG → cổ tức, chia lợi nhuận cổ phiếu（株の配当(かぶ)）", "37_1": "💡 Mẹo phân biệt 名称・名目・名案・名声:\n• 名称＝DANH XƯNG → tên gọi, danh xưng（名称を変える(かえる)）\n• 名目＝DANH MỤC → danh nghĩa, lý do bề ngoài（経費削減という名目で給料を減らす(けいひさくげん)）\n• 名案＝DANH ÁN → ý kiến hay, kế sách hay（名案がある(ある)）\n• 名声＝DANH THANH → danh tiếng, tiếng tăm（名声を上げる(あげる)）", "37_2": "💡 Mẹo phân biệt 明記・明白・明細・明瞭:\n• 明記＝MINH KÝ → ghi rõ ràng, nêu rõ bằng văn bản（名前を明記する(なまえ)）\n• 明白＝MINH BẠCH → rõ ràng, hiển nhiên（明白な事実(じじつ)）\n• 明細＝MINH TẾ → chi tiết, bảng kê chi tiết（電話ご利用の明細につきましては別途書類で送付(ていそしよるいでそうふ)）\n• 明瞭＝MINH LIỄU → rõ ràng, minh bạch（明瞭に説明する(せつめい)）", "37_3": "💡 Mẹo phân biệt 同類・親類・類例・類似:\n• 同類＝ĐỒNG LOẠI → cùng loại, cùng nhóm（同類の人間(にんげん)）\n• 親類＝THÂN LOẠI → họ hàng, người thân（親類一同(いちどう)）\n• 類例＝LOẠI LỆ → ví dụ tương tự, trường hợp tương tự（類例がない(ない)）\n• 類似＝LOẠI TỰ → tương tự, giống nhau（この二つの商品は類似していて見分けがたい(わけがたい)）", "37_4": "💡 Mẹo phân biệt 回覧・回帰・回想・回避:\n• 回覧＝HỒI LÃM → luân chuyển để xem, chuyển tay nhau đọc（回覧板(ばん)）\n• 回帰＝HỒI QUY → quay trở lại, hồi quy（原点に回帰する(げんてん)）\n• 回想＝HỒI TƯỞNG → hồi tưởng, nhớ lại（20年前の回想にふけった）\n• 回避＝HỒI TỊ → né tránh, tránh khỏi（リスクを回避する(りすく)）", "37_5": "💡 Mẹo phân biệt 解除・解消・解明・解禁:\n• 解除＝GIẢI TRỪ → dỡ bỏ, giải trừ (lệnh, cảnh báo...)（警戒警報は1時間後に解除された(けいかいけいほう)）\n• 解消＝GIẢI TIÊU → giải quyết, xóa bỏ, hóa giải（誤解を解消する(ごかい)）\n• 解明＝GIẢI MINH → làm rõ, giải thích rõ ràng（原因を解明する(げんいん)）\n• 解禁＝GIẢI CẤM → dỡ lệnh cấm, cho phép trở lại（質区の解禁(しな)）", "37_6": "💡 Mẹo phân biệt 解約・曲解・分解・解剖:\n• 解約＝GIẢI ƯỚC → hủy hợp đồng, hủy đăng ký（保険を解約する(ほけん)）\n• 曲解＝KHÚC GIẢI → hiểu sai, cố tình hiểu méo mó（意味を曲解する(いみ)）\n• 分解＝PHÂN GIẢI → tháo rời, phân giải, phân hủy（故障したコンピュータを分解して、修理した(こしょうした、しゅうり)）\n• 解剖＝GIẢI PHẪU → mổ xẻ, giải phẫu（解剖する）", "37_7": "💡 Mẹo phân biệt 海抜・海上・海面・海路:\n• 海抜＝HẢI BẠT → độ cao so với mực nước biển（津波は海抜36メートル地点にまで到達した(つなみ、とうたつ)）\n• 海上＝HẢI THƯỢNG → trên biển, mặt biển（海上交通(こうつう)）\n• 海面＝HẢI DIỆN → mặt biển, bề mặt biển（海面が静か(しずか)）\n• 海路＝HẢI LỘ → đường biển, hải lộ（海路を進もう(すすもう)）", "37_8": "💡 Mẹo phân biệt 外見・外来・外交・外面:\n• 外見＝NGOẠI KIẾN → bề ngoài, vẻ ngoài（外見がよい(よい)）\n• 外来＝NGOẠI LAI → bệnh nhân ngoại trú, từ bên ngoài đến（外来の患者が日に3000名も訪れる(おとずれる)）\n• 外交＝NGOẠI GIAO → ngoại giao（外交関係(かんけい)）\n• 外面＝NGOẠI DIỆN → bề ngoài, mặt ngoài（外面を作る(つくる)）", "37_9": "💡 Mẹo phân biệt 脱退・引退・後退・撤退:\n• 脱退＝THOÁT THOÁI → rút lui, rời khỏi (tổ chức)（イエチを脱退する(だったい)）\n• 引退＝DẪN THOÁI → giải nghệ, về hưu（30歳で現役を引退した(げんやく)）\n• 後退＝HẬU THOÁI → lùi bước, thoái lui（一歩後退する(いっほ)）\n• 撤退＝TRIỆT THOÁI → rút quân, rút lui（軍を撤退する(ぐん)）", "37_10": "💡 Mẹo phân biệt 名言・名声・明言・明白:\n• 名言＝DANH NGÔN → danh ngôn, câu nói nổi tiếng（名言を残す(のこす)）\n• 名声＝DANH THANH → danh tiếng, tiếng tăm（名声を上げる(あげる)）\n• 明言＝MINH NGÔN → tuyên bố rõ ràng, khẳng định dứt khoát（進退について明言を避けた(しんたい、さけた)）\n• 明白＝MINH BẠCH → rõ ràng, hiển nhiên（明白な事実(じじつ)）", "37_11": "💡 Mẹo phân biệt 会長・会員・会費・司会:\n• 会長＝HỘI TRƯỞNG → chủ tịch (hội, tổ chức)（会長を務める(つとめる)）\n• 会員＝HỘI VIÊN → hội viên, thành viên（会員登録(とうろく)）\n• 会費＝HỘI PHÍ → hội phí, phí tham dự（会費を支払う(しはらう)）\n• 司会＝TƯ HỘI → người dẫn chương trình, MC（友人の結婚パーティーの司会を務める(つとめる)）", "38_0": "💡 Mẹo phân biệt 在留・在庫・在籍・在室:\n• 在留＝TẠI LƯU → lưu trú, cư trú (ở nước ngoài)（在留資格(しかく)）\n• 在庫＝TẠI KHỐ → hàng tồn kho, hàng trong kho（月に一度在庫の整理が行われる(つきにいちど)）\n• 在籍＝TẠI TỊCH → đang là thành viên, đang học/làm（学校に在籍する(がっこう)）\n• 在室＝TẠI THẤT → đang ở trong phòng（在室中(ちゅう)）", "38_1": "💡 Mẹo phân biệt 生計・生育・生息・生存:\n• 生計＝SINH KẾ → sinh kế, mưu sinh（インターネットビジネスで生計を立てている(たてている)）\n• 生育＝SINH DỤC → sinh trưởng, lớn lên（動植物の生育(どうしょくぶつ)）\n• 生息＝SINH TỨC → sinh sống, cư trú (động vật)（生息地(ち)）\n• 生存＝SINH TỒN → sinh tồn, sống sót（生存者(しゃ)）", "38_2": "💡 Mẹo phân biệt 仮定・一定・定形・定年:\n• 仮定＝GIẢ ĐỊNH → giả định, giả sử（仮定する）\n• 一定＝NHẤT ĐỊNH → nhất định, ổn định, cố định（一定の収入を得られるようになった(しゅうにゅう)）\n• 定形＝ĐỊNH HÌNH → dạng cố định, tiêu chuẩn（定形郵便(ゆうびん)）\n• 定年＝ĐỊNH NIÊN → tuổi về hưu, tuổi nghỉ hưu（定年退職(たいしょく)）", "38_3": "💡 Mẹo phân biệt 提案・提起・提携・提供:\n• 提案＝ĐỀ ÁN → đề xuất, đề nghị（新提案(しん)）\n• 提起＝ĐỀ KHỞI → đặt ra, khởi kiện（訴訟を提起する(そしょう)）\n• 提携＝ĐỀ HUỀ → hợp tác, liên kết（企業提携(きぎょう)）\n• 提供＝ĐỀ CUNG → cung cấp, đóng góp, hiến tặng（脳死時の臓器の提供をカードで意思表示(のうししじ、いしひょうじ)）", "38_4": "💡 Mẹo phân biệt 最良・最善・生気・生涯:\n• 最良＝TỐI LƯƠNG → tốt nhất（最良の選択(せんたく)）\n• 最善＝TỐI THIỆN → tốt nhất có thể, nỗ lực tối đa（良い結果を残せるよう、最善を尽くすしかない(よい、のこせる)）\n• 生気＝SINH KHÍ → sức sống, sinh khí（生気な表情(ひょうじょう)）\n• 生涯＝SINH NHAI → suốt đời, cả cuộc đời（生涯を通じて(つんじて)）", "38_5": "💡 Mẹo phân biệt 軽度・軽傷・軽蔑・軽減:\n• 軽度＝KHINH ĐỘ → mức độ nhẹ, nhẹ（軽度の障害(しょうがい)）\n• 軽傷＝KHINH THƯƠNG → thương nhẹ, vết thương nhẹ（軽傷を負う(おう)）\n• 軽蔑＝KHINH MIỆT → khinh thường, coi thường（下品な彼を軽蔑していた(げひん)）\n• 軽減＝KHINH GIẢM → giảm nhẹ, giảm bớt（負担を軽減する(ふたん)）", "38_6": "💡 Mẹo phân biệt 推進・推奨・推計・推測:\n• 推進＝SUY TIẾN → thúc đẩy, xúc tiến（計画を推進する(かく)）\n• 推奨＝SUY SƯỞNG → khuyến nghị, đề xuất（推奨する）\n• 推計＝SUY KẾ → ước tính, ước lượng（人口を推計する(じんこう)）\n• 推測＝SUY TRẮC → suy đoán, phỏng đoán（裁判は推測に頼ることは許されない(よること、ゆるされない)）", "38_7": "💡 Mẹo phân biệt 正規・正義・正常・正体:\n• 正規＝CHÍNH QUY → chính quy, chính thức（正規の大学院生(だいがくいんせい)）\n• 正義＝CHÍNH NGHĨA → công lý, chính nghĩa（正義感(かん)）\n• 正常＝CHÍNH THƯỜNG → bình thường, tình trạng bình thường（正常に動く(うごく)）\n• 正体＝CHÍNH THỂ → bộ mặt thật, danh tính thật（正体を明らかにする(あかす)）", "38_8": "💡 Mẹo phân biệt 作成・作製・制作・製造:\n• 作成＝TÁC THÀNH → tạo lập, soạn thảo（資料を作成する(しりょう)）\n• 作製＝TÁC CHẾ → chế tạo, sản xuất (vật phẩm)（製品を作製する(せいひん)）\n• 制作＝CHẾ TÁC → sản xuất (chương trình TV, tác phẩm nghệ thuật)（テレビ番組の制作に携わっている(ばんぐみ、たずさわっている)）\n• 製造＝CHẾ TẠO → sản xuất (công nghiệp, nhà máy)（製品を製造する(せいひん)）", "38_9": "💡 Mẹo phân biệt 体力・体質・体制・体格:\n• 体力＝THỂ LỰC → thể lực, sức khỏe thể chất（体力をつける(つける)）\n• 体質＝THỂ CHẤT → thể chất, cơ địa（体質が弱い(よわい)）\n• 体制＝THỂ CHẾ → thể chế, hệ thống tổ chức（中央集権の体制(しゅうかん)）\n• 体格＝THỂ CÁCH → vóc dáng, thể hình（柔道で鍛えた彼は体格がいい(じゅうどう、きたえた)）", "38_10": "💡 Mẹo phân biệt 代案・代用・代償・代弁:\n• 代案＝ĐẠI ÁN → phương án thay thế（代案を提示する(ていし)）\n• 代用＝ĐẠI DỤNG → thay thế, dùng thay（代用品(ひん)）\n• 代償＝ĐẠI THƯỜNG → bù đắp, đánh đổi, cái giá phải trả（代償を支払う(しはらう)）\n• 代弁＝ĐẠI BIỆN → phát ngôn thay, đại diện nói（動物たちを代弁して環境保護を訴えた(うったえた)）", "38_11": "💡 Mẹo phân biệt 経歴・経過・経費・経理:\n• 経歴＝KINH LỊCH → lý lịch, tiểu sử công việc（経歴書(しょ)）\n• 経過＝KINH QUÁ → quá trình trôi qua, diễn biến（時間の経過(じかん)）\n• 経費＝KINH PHÍ → chi phí hoạt động, kinh phí（経費を抱える(かかえる)）\n• 経理＝KINH LÝ → kế toán, quản lý tài chính（社内のお金の出入りについては経理の田中さんが詳しい(でいり、たなか)）", "39_0": "💡 Mẹo phân biệt 光栄・栄冠・栄養・繁栄:\n• 光栄＝QUANG VINH → vinh dự, hân hạnh（光栄に思う(おもう)）\n• 栄冠＝VINH QUAN → vòng nguyệt quế, danh hiệu vô địch（第1位の栄冠に輝いた(かがやいた)）\n• 栄養＝VINH DƯỠNG → dinh dưỡng（栄養を取る(とる)）\n• 繁栄＝PHỒN VINH → thịnh vượng, phồn vinh（繁栄する）", "39_1": "💡 Mẹo phân biệt 接待・待遇・待望・耐久:\n• 接待＝TIẾP ĐÃI → tiếp đãi khách, chiêu đãi（取引先を接待する(とりひきさき)）\n• 待遇＝ĐÃI NGỘ → đãi ngộ, đối xử（待遇のいい会社に就職したい(たいぐう)）\n• 待望＝ĐÃI VỌNG → mong đợi, chờ mong（待望の新人(しんじん)）\n• 耐久＝NẠI CỬU → bền bỉ, chịu đựng lâu dài（耐久性(せい)）", "39_2": "💡 Mẹo phân biệt 的確・合致・命中・最適:\n• 的確＝ĐÍCH XÁC → chính xác, đúng đắn（的確に説明する(せつめい)）\n• 合致＝HỢP TRÍ → phù hợp hoàn toàn, khớp với（意見が合致する(いけん)）\n• 命中＝MỆNH TRUNG → trúng đích, bắn trúng（放った矢は的に命中した(は、や、てき)）\n• 最適＝TỐI THÍCH → tối ưu, phù hợp nhất（最適な方法(ほんほう)）", "39_3": "💡 Mẹo phân biệt 形態・実力・勢力・態勢:\n• 形態＝HÌNH THÁI → hình thái, dạng thức（形態を保つ(たもつ)）\n• 実力＝THỰC LỰC → thực lực, năng lực thực sự（実力を見せる(みせる)）\n• 勢力＝THẾ LỰC → thế lực, sức mạnh, tầm ảnh hưởng（台風は勢力を弱めた(よわめた)）\n• 態勢＝THÁI THẾ → thế trận, tư thế, chuẩn bị（態勢を整える(ととのえる)）", "39_4": "💡 Mẹo phân biệt 排泄・排除・廃止・廃棄:\n• 排泄＝BÀI TIẾT → bài tiết (sinh lý)（排泄する）\n• 排除＝BÀI TRỪ → loại bỏ, trục xuất, bài trừ（不満分子は即刻排除される(ふまんぶんし、そっこく)）\n• 廃止＝PHẾ CHỈ → bãi bỏ, xóa bỏ（廃止する）\n• 廃棄＝PHẾ KHÍ → thải bỏ, vứt bỏ, hủy bỏ（廃棄する）", "39_5": "💡 Mẹo phân biệt 撤退・廃墟・撤廃・廃絶:\n• 撤退＝TRIỆT THOÁI → rút quân, rút lui（軍を撤退する(ぐん)）\n• 廃墟＝PHẾ HƯ → phế tích, đổ nát hoang tàn（廃墟となった町(まち)）\n• 撤廃＝TRIỆT PHẾ → xóa bỏ, dỡ bỏ hoàn toàn（規制を撤廃する(きせい)）\n• 廃絶＝PHẾ TUYỆT → tiêu diệt hoàn toàn, xóa sổ（核兵器の廃絶を訴える運動(かくへいき、うったえる)）", "39_6": "💡 Mẹo phân biệt 内心・内緒・内向・内臓:\n• 内心＝NỘI TÂM → trong lòng, tâm tư thực sự（言葉とは裏腹に、内心では焦っていた(うらはらに、あせっていた)）\n• 内緒＝NỘI THỰ → bí mật, giấu kín（内緒話(ばなし)）\n• 内向＝NỘI HƯỚNG → hướng nội（内向的な性格(てきなせいかく)）\n• 内臓＝NỘI TẠNG → nội tạng（内臓を傷つける(かんそう、きずつける)）", "39_7": "💡 Mẹo phân biệt 退廃・退治・敬愛・敬遠:\n• 退廃＝THOÁI PHẾ → suy đồi, thoái hóa（文化退廃(ぶんか)）\n• 退治＝THOÁI TRỊ → tiêu diệt, trừ khử（ゴキブリを退治する(ごきぶり)）\n• 敬愛＝KÍNH ÁI → kính yêu, kính mến（敬愛する生活作家(せいかつさくか)）\n• 敬遠＝KÍNH VIỄN → tránh né trong khi vẫn tỏ ra tôn trọng（知的なタイプが苦手で敬遠していた(ちてき、にがて)）", "39_8": "💡 Mẹo phân biệt 喪失・滅亡・衰退・墜落:\n• 喪失＝TANG THẤT → mất mát (quan trọng)（記憶を喪失する(きかく)）\n• 滅亡＝DIỆT VONG → diệt vong, tiêu diệt（国が滅亡する(くに)）\n• 衰退＝SUY THOÁI → suy tàn, suy giảm（賑わった駅前商店街も衰退する一方(にぎわった、いっぽう)）\n• 墜落＝TRỤY LẠC → rơi xuống, lao xuống（航空機が墜落する(こうくうき)）", "39_9": "💡 Mẹo phân biệt 低額・低級・低迷・低温:\n• 低額＝ĐÊ NGẠCH → giá thấp, số tiền ít（低額所得(しょとく)）\n• 低級＝ĐÊ CẤP → cấp thấp, kém chất lượng（低級品(ひん)）\n• 低迷＝ĐÊ MÊ → trì trệ, chìm đắm ở mức thấp（業績が低迷している(ぎょうせき)）\n• 低温＝ĐÊ ÔN → nhiệt độ thấp（低温保存(ほそん)）", "39_10": "💡 Mẹo phân biệt 抵抗・対抗・抵触・対立:\n• 抵抗＝ĐỂ KHÁNG → kháng cự, chống lại（皮肉な言い方に、抵抗を覚える(ひにく、おぼえる)）\n• 対抗＝ĐỐI KHÁNG → đối kháng, chống lại（対抗する）\n• 抵触＝ĐỂ XÚC → vi phạm, xung đột với quy định（規則に抵触する(きそく)）\n• 対立＝ĐỐI LẬP → đối lập, mâu thuẫn（対立する）", "39_11": "💡 Mẹo phân biệt 不運・不平・無実・無礼:\n• 不運＝BẤT VẬN → xui xẻo, vận đen（不運な出来事(できごと)）\n• 不平＝BẤT BÌNH → phàn nàn, bất bình（仕事中も不平ばかり言っている(しごとちゅう、いっている)）\n• 無実＝VÔ THẬT → vô tội, vô can（無実を訴える(うったえる)）\n• 無礼＝VÔ LỄ → vô lễ, mất lịch sự（無礼な人(ひと)）", "40_0": "💡 Mẹo phân biệt 動向・向学・意向・意義:\n• 動向＝ĐỘNG HƯỚNG → xu hướng, động thái（世界の動向(せかい)）\n• 向学＝HƯỚNG HỌC → ham học, tinh thần học hỏi（向学心(しん)）\n• 意向＝Ý HƯỚNG → ý định, ý muốn（本人の意向を尊重すべき(そんちょう)）\n• 意義＝Ý NGHĨA → ý nghĩa, giá trị（意義がある(ある)）", "40_1": "💡 Mẹo phân biệt 交易・交際・交錯・交互:\n• 交易＝GIAO DỊCH → giao thương, buôn bán（交易する）\n• 交際＝GIAO TẾ → giao tiếp, quan hệ, hẹn hò（交際する）\n• 交錯＝GIAO THỐ → đan xen, lẫn lộn, giao thoa（複雑に交錯する(ふくざつ)）\n• 交互＝GIAO HỖ → luân phiên, xen kẽ nhau（交互に意見を出し合った(いけんをだしあった)）", "40_2": "💡 Mẹo phân biệt 抗争・抗議・闘争・格闘:\n• 抗争＝KHÁNG TRANH → tranh giành, đấu tranh（抗争を起こす(おこす)）\n• 抗議＝KHÁNG NGHỊ → phản đối, kháng nghị（不公平なジャッジに抗議した(ふこうへい)）\n• 闘争＝ĐẤU TRANH → đấu tranh, chiến đấu（闘争する）\n• 格闘＝CÁCH ĐẤU → đấu tay đôi, vật lộn（格闘する）", "40_3": "💡 Mẹo phân biệt 考慮・考察・参考・思考:\n• 考慮＝KHẢO LỰ → cân nhắc, xem xét（考慮する）\n• 考察＝KHẢO SÁT → nghiên cứu, suy xét kỹ lưỡng（深く考察する(ふかく)）\n• 参考＝THAM KHẢO → tham khảo（先輩の志望理由書を参考にした(しぼうりゆうしょ)）\n• 思考＝TƯ KHẢO → tư duy, suy nghĩ（思考する）", "40_4": "💡 Mẹo phân biệt 同情・感心・同感・協調:\n• 同情＝ĐỒNG TÌNH → đồng cảm, thương cảm（身の上話を聞いて、同情を禁じえなかった(みのうえばなし、きんじえなかった)）\n• 感心＝CẢM TÂM → cảm phục, thán phục（感心する）\n• 同感＝ĐỒNG CẢM → đồng cảm, đồng ý（同感する）\n• 協調＝HIỆP ĐIỀU → hợp tác, phối hợp hài hòa（協調する）", "40_5": "💡 Mẹo phân biệt 応用・反応・相対・相応:\n• 応用＝ỨNG DỤNG → ứng dụng, áp dụng（応用する）\n• 反応＝PHẢN ỨNG → phản ứng（反応する）\n• 相対＝TƯƠNG ĐỐI → tương đối, so sánh tương quan（相対的(てき)）\n• 相応＝TƯƠNG ỨNG → tương xứng, phù hợp（能力に相応の給料が支払われている(しはらわれている)）", "40_6": "💡 Mẹo phân biệt 固有・所有・有望・有益:\n• 固有＝CỐ HỮU → đặc trưng riêng, đặc hữu（日本固有の文化(ぶんか)）\n• 所有＝SỞ HỮU → sở hữu（100ヘクタールの土地を所有している）\n• 有望＝HỮU VỌNG → triển vọng, đầy hứa hẹn（有望な選手(せんしゅ)）\n• 有益＝HỮU ÍCH → có ích, có lợi（有益な情報(じょうほう)）", "40_7": "💡 Mẹo phân biệt 養成・養殖・教養・扶養:\n• 養成＝DƯỠNG THÀNH → đào tạo, bồi dưỡng（人材養成(じんざい)）\n• 養殖＝DƯỠNG THỰC → nuôi trồng (thủy sản)（カキ養殖(かき)）\n• 教養＝GIÁO DƯỠNG → giáo dưỡng, học thức, văn hóa（豊かな教養が備わっている(とぼかな、そなわっている)）\n• 扶養＝PHÙ DƯỠNG → nuôi dưỡng, phụ dưỡng（家族を扶養する(かぞく)）", "40_8": "💡 Mẹo phân biệt 融合・統合・合作・合成:\n• 融合＝DUNG HỢP → hợp nhất, hòa tan thành một（文化の融合(ぶんか)）\n• 統合＝THỐNG HỢP → thống nhất, hợp nhất (có chủ đích)（組織を統合する(そしき)）\n• 合作＝HỢP TÁC → hợp tác sản xuất, cùng làm（日中合作(にちちゅう)）\n• 合成＝HỢP THÀNH → tổng hợp, ghép (ảnh, âm thanh...)（合成した写真を載せて、虚偽の報道を行った(しゃしん、のせて、きょぎ)）", "40_9": "💡 Mẹo phân biệt 通用・所用・用意・用件:\n• 通用＝THÔNG DỤNG → thông dụng, có hiệu lực rộng rãi（世界で通用する(せかい)）\n• 所用＝SỞ DỤNG → việc cần làm, công việc（所用の用紙(ようし)）\n• 用意＝DỤNG Ý → chuẩn bị（準備を用意する(じんび)）\n• 用件＝DỤNG KIỆN → việc cần nói, nội dung liên lạc（取り急ぎ、用件のみにて失礼いたします(とりいそぎ、しつれい)）", "40_10": "💡 Mẹo phân biệt 公式・公然・公約・公用:\n• 公式＝CÔNG THỨC → chính thức, công thức（公式発表(はっぴょう)）\n• 公然＝CÔNG NHIÊN → công khai, công nhiên（離婚歴があることは公然の秘密となっている(りこんれき、ひみつ)）\n• 公約＝CÔNG ƯỚC → cam kết trước công chúng, công ước（選挙公約(せんきょ)）\n• 公用＝CÔNG DỤNG → công vụ, sử dụng công cộng（公用車(しゃ)）", "40_11": "💡 Mẹo phân biệt 加工・人工・工程・工房:\n• 加工＝GIA CÔNG → chế biến, gia công（材料を加工して製品に仕上げる(しあげる)）\n• 人工＝NHÂN CÔNG → nhân tạo（人工石(いし)）\n• 工程＝CÔNG TRÌNH → công đoạn, quy trình sản xuất（工程表(ひょう)）\n• 工房＝CÔNG PHÒNG → xưởng thủ công, studio nghệ thuật（工房で作る(つくる)）", "41_0": "💡 Mẹo phân biệt 成立・傑作・創立・創作:\n• 成立＝THÀNH LẬP → thành lập, hình thành, đạt được（口約が成立する(けいやく)）\n• 傑作＝KIỆT TÁC → kiệt tác, tác phẩm xuất sắc（傑作と評される(ひょうされる)）\n• 創立＝SÁNG LẬP → thành lập (tổ chức, trường học)（会社を創立する(かいしゃ)）\n• 創作＝SÁNG TÁC → sáng tác, sáng tạo（全く新しい料理を創作した(りょうり)）", "41_1": "💡 Mẹo phân biệt 放送・回想・送付・送還:\n• 放送＝PHÓNG TỐNG → phát sóng, phát thanh, phát hình（テレビ放送(てれぴ)）\n• 回想＝HỒI TƯỞNG → hồi tưởng, nhớ lại（20年前の回想(にぶんまえ)）\n• 送付＝TỐNG PHÓ → gửi (tài liệu, thư từ...)（必要書類を送付した(ひつようしょるい)）\n• 送還＝TỐNG HOÀN → hồi hương, trục xuất, trả về（本国送還(ほんごく)）", "41_2": "💡 Mẹo phân biệt 結合・総合・決意・総意:\n• 結合＝KẾT HỢP → kết hợp, liên kết（二つが結合する(ちぶん)）\n• 総合＝TỔNG HỢP → tổng hợp, toàn diện（総合力ではこちらが上だ(うえだ)）\n• 決意＝QUYẾT Ý → quyết tâm, quyết định（決意する）\n• 総意＝TỔNG Ý → ý kiến tổng thể, ý chí chung（国民の総意(こくみん)）", "41_3": "💡 Mẹo phân biệt 増進・増強・増殖・増収:\n• 増進＝TĂNG TIẾN → tăng cường, thúc đẩy（定期検診で健康の増進を図る(ていきかんしん、はかる)）\n• 増強＝TĂNG CƯỜNG → tăng cường, mở rộng（軍備増強(ぐんび)）\n• 増殖＝TĂNG THỰC → nhân lên, sinh sôi nảy nở（細菌の増殖(さいきん)）\n• 増収＝TĂNG THU → tăng thu nhập, tăng doanh thu（販売増収(はんばい)）", "41_4": "💡 Mẹo phân biệt 通告・通達・通用・通報:\n• 通告＝THÔNG CÁO → thông báo chính thức, tuyên bố（取消を通告する(とりけし)）\n• 通達＝THÔNG ĐẠT → thông tri, thông báo chính thức (từ trên xuống)（上司の通達(じょうし)）\n• 通用＝THÔNG DỤNG → thông dụng, có hiệu lực（実際の日本人相手には通用しない(じっさい、あいて)）\n• 通報＝THÔNG BÁO → thông báo, báo cáo (sự cố)（事件を通報する(じけん)）", "41_5": "💡 Mẹo phân biệt 投機・投下・投資・投入:\n• 投機＝ĐẦU CƠ → đầu cơ, đánh bạc tài chính（投機的に(てきに)）\n• 投下＝ĐẦU HẠ → ném xuống / đầu tư（資本を投下する(しにほん)）\n• 投資＝ĐẦU TƯ → đầu tư（株に投資する(かぶ)）\n• 投入＝ĐẦU NHẬP → đưa vào, tung vào, đầu tư mạnh（新戦力を投入した(しんせんりょく)）", "41_6": "💡 Mẹo phân biệt 統率・統治・正統・系統:\n• 統率＝THỐNG SUẤT → thống suất, chỉ huy, dẫn đầu（集団を統率する(しゅうだん)）\n• 統治＝THỐNG TRỊ → thống trị, cai trị（国は政府によって統治されている(せいふ、されている)）\n• 正統＝CHÍNH THỐNG → chính thống, hợp pháp（正統を診る(つぶる)）\n• 系統＝HỆ THỐNG → hệ thống, dòng dõi, phả hệ（系統的(てき)）", "41_7": "💡 Mẹo phân biệt 付録・目録・登録・収録:\n• 付録＝PHỤ LỤC → phụ lục, tặng kèm（雑誌の付録(ざっし)）\n• 目録＝MỤC LỤC → danh mục, danh sách（目録を作る(つくる)）\n• 登録＝ĐĂNG LỤC → đăng ký, ghi danh（会員の登録をしていただきます(していただきます)）\n• 収録＝THU LỤC → thu âm, thu hình, bao gồm（番組を収録する(ばんぐみ)）", "41_8": "💡 Mẹo phân biệt 当面・当方・当選・当局:\n• 当面＝ĐƯƠNG DIỆN → trước mắt, hiện tại（彼にとって当面の課題は語彙力の向上だ(かだい、こうじょう)）\n• 当方＝ĐƯƠNG PHƯƠNG → phía chúng tôi, bên chúng tôi（当方としては(としては)）\n• 当選＝ĐƯƠNG TUYỂN → trúng cử / trúng thưởng（選挙に当選する(せんきょ)）\n• 当局＝ĐƯƠNG CỤC → nhà chức trách, cơ quan có thẩm quyền（規制当局(きせい)）", "41_9": "💡 Mẹo phân biệt 動脈・動静・動揺・動機:\n• 動脈＝ĐỘNG MẠCH → động mạch（動脈素化(こうか)）\n• 動静＝ĐỘNG TĨNH → động tĩnh, tình hình, động thái（人の動静をうかがう(ひと)）\n• 動揺＝ĐỘNG DAO → dao động, bất an, xúc động（動揺を隠せない(かくせない)）\n• 動機＝ĐỘNG CƠ → động cơ, lý do, nguyên nhân（犯行の動機について調べた(しらべた)）", "41_10": "💡 Mẹo phân biệt 風土・風流・風格・風刺:\n• 風土＝PHONG THỔ → phong thổ, khí hậu và văn hóa vùng đất（みそ汁は日本の風土から生まれた独特のスープ(にほんの、どくとく)）\n• 風流＝PHONG LƯU → thanh tao, phong lưu, tao nhã（風流な趣味(しゅみ)）\n• 風格＝PHONG CÁCH → phong cách, phẩm cách（風格のある人(あるひと)）\n• 風刺＝PHONG THÍCH → châm biếm, phê phán (xã hội)（風刺画(が)）", "41_11": "💡 Mẹo phân biệt 高額・高利・高騰・高架:\n• 高額＝CAO NGẠCH → số tiền lớn, giá trị cao（高額の資金(しきん)）\n• 高利＝CAO LỢI → lãi suất cao, cho vay nặng lãi（高利貪(かし)）\n• 高騰＝CAO ĐẰNG → tăng vọt, leo thang (giá cả)（物価が高騰し、貨幣の価値が著しく低下した(ぶっか、ちょしく)）\n• 高架＝CAO GIÁ → cầu cạn, đường trên cao（高架橋(きょう)）", "42_0": "💡 Mẹo phân biệt 放棄・放出・放射・放置:\n• 放棄＝PHÓNG KHÍ → từ bỏ, bỏ mặc（权利を放棄する(けんり)）\n• 放出＝PHÓNG XUẤT → phóng thích, tung ra（ストレスを放出する(すとれす)）\n• 放射＝PHÓNG XẠ → phóng xạ, bức xạ（放射線(せん)）\n• 放置＝PHÓNG TRÍ → bỏ mặc, để yên không xử lý（放置してあった自転車を集積所に移動(してあった、しゅうせきしょ)）", "42_1": "💡 Mẹo phân biệt 想像・構想・夢想・幻想:\n• 想像＝TƯỞNG TƯỢNG → tưởng tượng（想像する）\n• 構想＝CẤU TƯỞNG → ý tưởng tổng thể, cấu tứ, kế hoạch（小説を書くため構想を練った(ねった)）\n• 夢想＝MỘNG TƯỞNG → mơ tưởng, ảo mộng（夢想家(か)）\n• 幻想＝HUYỄN TƯỞNG → ảo tưởng, ảo mộng（幻想的な作品(てきな)）", "42_2": "💡 Mẹo phân biệt 拘束・強制・把握・抑圧:\n• 拘束＝CÂU THÚC → giam giữ, hạn chế tự do, bắt giữ（容疑者の身柄を拘束した(ようぎしゃ、みがら)）\n• 強制＝CƯỜNG CHẾ → cưỡng bức, ép buộc（強制的に(てきに)）\n• 把握＝BÁ ÁC → nắm bắt, nắm vững（状況を把握する(じょうかん)）\n• 抑圧＝ỨC ÁP → áp bức, đàn áp（感情を抑圧する(かんじょう)）", "42_3": "💡 Mẹo phân biệt 興行・興奮・活発・奮発:\n• 興行＝HƯNG HÀNH → tổ chức biểu diễn（興行主(しゅ)）\n• 興奮＝HƯNG PHẤN → hưng phấn, phấn khích（試合に勝った夜は興奮して眠れなかった(よる、ねむれなかった)）\n• 活発＝HOẠT PHÁT → sôi nổi, tích cực（活発な議論(ぎろん)）\n• 奮発＝PHẤN PHÁT → cố gắng phấn đấu / mạnh tay chi tiêu（奮発して買う(かう)）", "42_4": "💡 Mẹo phân biệt 投入・投資・融通・融資:\n• 投入＝ĐẦU NHẬP → đưa vào, tung vào（新戦力を投入する(しんせんりょく)）\n• 投資＝ĐẦU TƯ → đầu tư（株に投資する(かぶ)）\n• 融通＝DUNG THÔNG → linh hoạt, điều chỉnh / cho vay tạm thời（融通がつかない(つかない)）\n• 融資＝DUNG TƯ → cho vay (ngân hàng), cấp vốn（銀行から融資を受けた(うけた)）", "42_5": "💡 Mẹo phân biệt 誘導・主導・誘拐・勧誘:\n• 誘導＝DỤ ĐẠO → hướng dẫn, dẫn dắt（停車位置まで誘導してもらった(ていしゃいち、もらった)）\n• 主導＝CHỦ ĐẠO → chủ đạo, đứng đầu（主導する）\n• 誘拐＝DỤ QUẢI → bắt cóc, dẫn dụ đi（誘拐犯(はん)）\n• 勧誘＝KHUYẾN DỤ → mời chào, chiêu dụ（勧誘の電話(でんわ)）", "42_6": "💡 Mẹo phân biệt 好転・好況・好評・絶好:\n• 好転＝HẢO CHUYỂN → chuyển biến tốt, cải thiện（不景気な状態を脱し、好転に向かいたい(だし、ひはかいたい)）\n• 好況＝HẢO HUỐNG → kinh tế hưng thịnh, thời kỳ tốt（好況に乗る(のる)）\n• 好評＝HẢO BÌNH → được đánh giá cao, nổi tiếng tốt（好評を得る(える)）\n• 絶好＝TUYỆT HẢO → tuyệt vời, hoàn hảo nhất（絶好のチャンス(ちゃんす)）", "42_7": "💡 Mẹo phân biệt 防御・防衛・防戦・防止:\n• 防御＝PHÒNG NGỰ → phòng thủ, bảo vệ（攻撃を防御する(こうげき)）\n• 防衛＝PHÒNG VỆ → bảo vệ, phòng thủ (quốc gia, chức vị)（チャンピオンは3度目の防衛に成功した(さんどめの、せいこう)）\n• 防戦＝PHÒNG CHIẾN → phòng thủ trong khi chiến đấu（防戦する）\n• 防止＝PHÒNG CHỈ → phòng ngừa, ngăn chặn（事故防止(じこ)）", "42_8": "💡 Mẹo phân biệt 乱暴・凶暴・暴力・暴動:\n• 乱暴＝LOẠN BẠO → bạo lực, thô bạo（乱暴な運転(うんてん)）\n• 凶暴＝HUNG BẠO → hung hãn, tàn bạo（凶暴な犬(いぬ)）\n• 暴力＝BẠO LỰC → bạo lực（暴力を振るう(ふるう)）\n• 暴動＝BẠO ĐỘNG → bạo loạn, nổi loạn（政治の腐敗に怒った市民が暴動を起こした(せいじ、おこした)）", "42_9": "💡 Mẹo phân biệt 優位・優先・優遇・優越:\n• 優位＝ƯU VỊ → vị thế ưu thế, ưu thế（優位に立つ(たつ)）\n• 優先＝ƯU TIÊN → ưu tiên（優先的に(てきに)）\n• 優遇＝ƯU NGỘ → ưu đãi, đối xử đặc biệt（優遇する）\n• 優越＝ƯU VIỆT → ưu việt, vượt trội, hơn hẳn（試合に勝った彼はしばらく優越感に浸ることができた(かった、ひたる)）", "42_10": "💡 Mẹo phân biệt 要旨・要約・要点・要項:\n• 要旨＝YẾU CHỈ → ý chính, nội dung cốt lõi（要旨をつかむ(つかむ)）\n• 要約＝YẾU ƯỚC → tóm tắt, rút gọn nội dung（長い文章を200字に要約する(ぶんしょう)）\n• 要点＝YẾU ĐIỂM → điểm quan trọng, trọng tâm（要点をまとめる(まとめる)）\n• 要項＝YẾU HẠNG → điều khoản quan trọng, nội dung chính（受験要項(じゅけん)）", "42_11": "💡 Mẹo phân biệt 正式・様式・真相・様相:\n• 正式＝CHÍNH THỨC → chính thức, theo đúng thủ tục（正式に申請(しんせい)）\n• 様式＝DẠNG THỨC → mẫu đơn, biểu mẫu, định dạng（申請書の様式はサイトからダウンロード可能(しんせいしょ)）\n• 真相＝CHÂN TƯỚNG → sự thật, sự thật đằng sau（真相を明らかにする(あかす)）\n• 様相＝DẠNG TƯỚNG → diện mạo, bộ mặt, tình hình（様相を現会する(ひんかい)）", "43_0": "💡 Mẹo phân biệt 急速・急遽・緊急・至急:\n• 急速＝CẤP TỐC → nhanh chóng, tốc độ cao（急速に発展する(はってん)）\n• 急遽＝CẤP CỰ → đột ngột, gấp rút（急遽決定する(けってい)）\n• 緊急＝KHẨN CẤP → khẩn cấp, cấp bách（緊急に連絡を取るよう指示(れんらく、しじ)）\n• 至急＝CHÍ CẤP → hết sức khẩn cấp, ngay lập tức（至急連絡する(れんらく)）", "43_1": "💡 Mẹo phân biệt 収容・収納・収穫・収拾:\n• 収容＝THU DUNG → tiếp nhận, giam giữ（人を収容する(ひと)）\n• 収納＝THU NẠP → cất giữ, xếp vào（収納スブター(すぶたー)）\n• 収穫＝THU HOẠCH → thu hoạch, kết quả đạt được（仕事に失敗したが、個人的には大きな収穫があった(して、たい)）\n• 収拾＝THU THẬP → thu xếp, giải quyết hỗn loạn（収拾がつかない(つかない)）", "43_2": "💡 Mẹo phân biệt 集積・集中・集落・結集:\n• 集積＝TẬP TÍCH → tích lũy, tập hợp（データを集積する(だーた)）\n• 集中＝TẬP TRUNG → tập trung（漢字の暗記に集中した(かんじ、あんき)）\n• 集落＝TẬP LẠC → làng xóm, khu dân cư（山間の集落(さんかん)）\n• 結集＝KẾT TẬP → tập hợp, tụ họp lại（力を結集する(ちょく)）", "43_3": "💡 Mẹo phân biệt 入力・入籍・入手・記入:\n• 入力＝NHẬP LỰC → nhập liệu, nhập dữ liệu（論文をコンピュータに入力している最中(ろんぶん、さいちゅう)）\n• 入籍＝NHẬP TỊCH → đăng ký hộ khẩu, kết hôn chính thức（入籍する）\n• 入手＝NHẬP THỦ → có được, thu thập（情報を入手する(じょうほう)）\n• 記入＝KÝ NHẬP → điền vào, ghi vào (giấy tờ)（書類に記入する(しょるい)）", "43_4": "💡 Mẹo phân biệt 救急・救出・救済・救命:\n• 救急＝CỨU CẤP → cấp cứu（救急車(しゃ)）\n• 救出＝CỨU XUẤT → giải cứu, cứu thoát（人質を救出する(じんしつ)）\n• 救済＝CỨU TẾ → cứu tế, giúp đỡ người khổ nạn（困窮した人々を救済する策を講じるべき(こんきゅうした、こうじる)）\n• 救命＝CỨU MỆNH → cứu sống, cứu mạng（救命措置(そち)）", "43_5": "💡 Mẹo phân biệt 支給・供給・提供・贈与:\n• 支給＝CHI CẤP → cấp phát, trả (lương, trợ cấp)（給料を支給する(きょうりょう)）\n• 供給＝CUNG CẤP → cung cấp, cung（需要と供給のバランスが大事(じゅよう、だいじ)）\n• 提供＝ĐỀ CUNG → cung cấp, đóng góp（情報を提供する(じょうほう)）\n• 贈与＝TẶNG DỮ → tặng, tặng biếu (pháp lý)（財産を贈与する(ざいさん)）", "43_6": "💡 Mẹo phân biệt 最中・始末・終盤・終始:\n• 最中＝TỐI TRUNG → đang trong lúc, ngay giữa lúc（会見の最中、笑顔を竝やさなかった(かいけん、ちえやさな)）\n• 始末＝THỦY MẠT → đầu đuôi, xử lý, giải quyết（始末書(しょ)）\n• 終盤＝CHUNG BÀN → giai đoạn cuối, hiệp cuối（試合の終盤(しあい)）\n• 終始＝CHUNG THỦY → từ đầu đến cuối, suốt（終始一貫(いっかん)）", "43_7": "💡 Mẹo phân biệt 修正・改正・修繕・改善:\n• 修正＝TU CHÍNH → sửa chữa, chỉnh sửa（軌道を修正できる(きどう)）\n• 改正＝CẢI CHÍNH → sửa đổi (luật, quy định)（法律を改正する(ほうりつ)）\n• 修繕＝TU THIỆN → sửa chữa (vật phẩm hỏng)（家を修繕する(いえ)）\n• 改善＝CẢI THIỆN → cải thiện（現状を改善する(げんじょう)）", "43_8": "💡 Mẹo phân biệt 推進・昇進・就業・就任:\n• 推進＝SUY TIẾN → thúc đẩy, xúc tiến（計画を推進する(かく)）\n• 昇進＝THĂNG TIẾN → thăng chức（昇進する）\n• 就業＝TỰU NGHIỆP → đi làm, có việc làm（新たに就業する(あらた)）\n• 就任＝TỰU NHIỆM → nhậm chức, bắt đầu đảm nhận（外務相を辞した後、即座に経産相に就任した(がいむしょうをじした、けいさんしょう)）", "43_9": "💡 Mẹo phân biệt 重圧・重点・重要・重厚:\n• 重圧＝TRỌNG ÁP → áp lực nặng nề（重圧を感じる(かんじる)）\n• 重点＝TRỌNG ĐIỂM → trọng điểm, điểm quan trọng（雇用の促進に重点を置いている(こよう、おいて)）\n• 重要＝TRỌNG YẾU → quan trọng（重要な問題(もんだい)）\n• 重厚＝TRỌNG HẬU → dày dặn, trầm ổn, uy nghiêm（重厚な演技(えんぎ)）", "43_10": "💡 Mẹo phân biệt 充満・補充・充実・結実:\n• 充満＝SUNG MÃN → đầy ắp, tràn ngập（ガスが部屋に充満する(べや)）\n• 補充＝BỔ SUNG → bổ sung, bù đắp phần thiếu（不足を補充する(ふそく)）\n• 充実＝SUNG THỰC → phong phú, đầy đủ, viên mãn（学生生活を充実したものにしたい(せいかつ、したい)）\n• 結実＝KẾT THỰC → kết quả, đơm hoa kết trái（努力が結実する(どりょく)）", "43_11": "💡 Mẹo phân biệt 中継・中枢・仲介・媒介:\n• 中継＝TRUNG KẾ → phát trực tiếp, tiếp vận（事故の現場の様子をインターネットで実況中継していた(じこ、ようす、じっきょう)）\n• 中枢＝TRUNG KHU → trung tâm, bộ phận then chốt（神経中枢(しんけい)）\n• 仲介＝TRỌNG GIỚI → trung gian, môi giới（仲介する）\n• 媒介＝MÔI GIỚI → trung gian, môi giới, truyền bệnh（媒介する）", "44_0": "💡 Mẹo phân biệt 教訓・教習・布教・説教:\n• 教訓＝GIÁO HUẤN → bài học, bài học kinh nghiệm（教訓を得る(える)）\n• 教習＝GIÁO TẬP → dạy học, huấn luyện（教習所(しょ)）\n• 布教＝BỐ GIÁO → truyền giáo, truyền đạo（布教活動(かつどう)）\n• 説教＝THUYẾT GIÁO → thuyết giảng, giáo huấn, mắng mỏ（夜遅く帰宅して、よく父親に説教された(よるおそくきたく)）", "44_1": "💡 Mẹo phân biệt 聴衆・聴取・視聴・試聴:\n• 聴衆＝THÍNH CHÚNG → khán giả, thính giả（聴衆を前にする(まえ)）\n• 聴取＝THÍNH THỦ → lấy lời khai, thẩm vấn, nghe (tin tức)（関係者に事情を聴取した(かんけいしゃ、じじょう)）\n• 視聴＝THỊ THÍNH → xem và nghe (TV, radio)（視聴率(りつ)）\n• 試聴＝THÍ THÍNH → nghe thử（試聴する）", "44_2": "💡 Mẹo phân biệt 要領・本領・受領・領収:\n• 要領＝YẾU LĨNH → khéo léo, biết cách làm（口がうまく、要領の良い男(くちが、よいおとこ)）\n• 本領＝BẢN LĨNH → năng lực thực sự, bản lĩnh thực sự（本領を発揮する(はっか)）\n• 受領＝THỤ LĨNH → tiếp nhận chính thức（受領書(しょ)）\n• 領収＝LĨNH THU → nhận tiền, thu tiền（領収書(しょ)）", "44_3": "💡 Mẹo phân biệt 最上・最高・良好・善良:\n• 最上＝TỐI THƯỢNG → cao nhất, hạng nhất（最上級(きゅう)）\n• 最高＝TỐI CAO → tốt nhất, cao nhất（最高気温(きおん)）\n• 良好＝LƯƠNG HẢO → tốt, tình trạng tốt（健康状態はいたって良好(しょうたい)）\n• 善良＝THIỆN LƯƠNG → hiền lành, tốt bụng（善良な市民(しめん)）", "44_4": "💡 Mẹo phân biệt 照合・照会・対照・参照:\n• 照合＝CHIẾU HỢP → đối chiếu, so khớp（書類を照合する(しょるい)）\n• 照会＝CHIẾU HỘI → hỏi thăm, tra cứu（照会する）\n• 対照＝ĐỐI CHIẾU → đối chiếu, tương phản（姉妹はとても対照的である(しまい、てき)）\n• 参照＝THAM CHIẾU → tham khảo, tra cứu（参照する）", "44_5": "💡 Mẹo phân biệt 膨張・緊張・誇張・拡張:\n• 膨張＝BÀNH TRƯỚNG → phình to, giãn nở（ガスが膨張する(がす)）\n• 緊張＝KHẨN TRƯƠNG → căng thẳng, hồi hộp（手に汗を握り、緊張した(てにあせ)）\n• 誇張＝KHOA TRƯƠNG → phóng đại, cường điệu（誇張して話す(はす)）\n• 拡張＝KHUẾCH TRƯƠNG → mở rộng, mở to（道路を拡張する(どうろ)）", "44_6": "💡 Mẹo phân biệt 共同・共和・共存・共鳴:\n• 共同＝CỘNG ĐỒNG → cùng nhau, chung sức（共同作業(さぎょう)）\n• 共和＝CỘNG HÒA → cộng hòa（共和国(こく)）\n• 共存＝CỘNG TỒN → cùng tồn tại, cộng sinh（共存する）\n• 共鳴＝CỘNG MINH → đồng cảm, đồng điệu（訴えに共鳴し、公園を占拠する運動が起こった(うったえに、せんきょする)）", "44_7": "💡 Mẹo phân biệt 調和・協調・協定・妥協:\n• 調和＝ĐIỀU HÒA → hài hòa（調和がとれる）\n• 協調＝HIỆP ĐIỀU → hợp tác, phối hợp（協調する）\n• 協定＝HIỆP ĐỊNH → hiệp định, thỏa thuận（協定を結ぶ(もすぶ)）\n• 妥協＝THỎA HIỆP → nhượng bộ, thỏa hiệp（作品の制作過程で、一切の妥協を許さない(せいさくかてい、いっさい)）", "44_8": "💡 Mẹo phân biệt 業績・業界・業務・業種:\n• 業績＝NGHIỆP TÍCH → thành tích kinh doanh, kết quả（会社の業績がアップした(あっぷ)）\n• 業界＝NGHIỆP GIỚI → ngành, giới kinh doanh（IT業界(あいてい)）\n• 業務＝NGHIỆP VỤ → công việc, nghiệp vụ（業務を行う(おこなう)）\n• 業種＝NGHIỆP CHỦNG → ngành nghề, loại hình kinh doanh（業種を問わず(とわず)）", "44_9": "💡 Mẹo phân biệt 勝算・勝因・勝負・勝敗:\n• 勝算＝THẮNG TOÁN → cơ hội thắng, tính toán thắng（勝算がある(ある)）\n• 勝因＝THẮNG NHÂN → nguyên nhân thắng lợi（勝因を分析する(ぶんせき)）\n• 勝負＝THẮNG PHỤ → thi đấu, quyết thắng thua（どちらが上か、試験で勝負することにした(どちら、しけん、ことに)）\n• 勝敗＝THẮNG BẠI → thắng thua, kết quả（勝敗を決する(けする)）", "44_10": "💡 Mẹo phân biệt 上陸・上空・上位・上昇:\n• 上陸＝THƯỢNG LỤC → đổ bộ, lên đất liền（台風が上陸する(たいふう)）\n• 上空＝THƯỢNG KHÔNG → bầu trời phía trên, không phận（関東地方の上空を厚い雲が覆った(かんとう、あついくもがおおった)）\n• 上位＝THƯỢNG VỊ → thứ hạng cao, vị trí cao（上位に入る(はいる)）\n• 上昇＝THƯỢNG THĂNG → tăng lên, dâng lên（気温が上昇する(きおん)）", "44_11": "💡 Mẹo phân biệt 口調・強調・強行・強要:\n• 口調＝KHẨU ĐIỆU → giọng điệu, cách nói（口調を変える(かえる)）\n• 強調＝CƯỜNG ĐIỀU → nhấn mạnh, đề cao（声を大にして無実を強調した(こえをおおにして、むじつ)）\n• 強行＝CƯỜNG HÀNH → cưỡng hành, làm bằng được（強行する）\n• 強要＝CƯỜNG YẾU → cưỡng ép, buộc phải làm（強要する）", "45_0": "💡 Mẹo phân biệt 適当・適合・適応・適性:\n• 適当＝THÍCH ĐƯƠNG → phù hợp / cẩu thả, tùy tiện（適当に選ぶ(えらぶ)）\n• 適合＝THÍCH HỢP → phù hợp với điều kiện, đáp ứng（規格に適合する(きかく)）\n• 適応＝THÍCH ỨNG → thích nghi, thích ứng（环境に適応する(かんきょう)）\n• 適性＝THÍCH TÍNH → năng khiếu, tố chất phù hợp（適性検査を受けてみた(けんさ)）", "45_1": "💡 Mẹo phân biệt 領域・区域・区間・領土:\n• 領域＝LÃNH VỰC → lãnh vực, phạm vi, lãnh thổ（駅前が再開発領域に指定された(ざいかいはつ)）\n• 区域＝KHU VỰC → khu vực, vùng được phân chia（禁止区域(きんし)）\n• 区間＝KHU GIAN → khoảng cách giữa hai điểm, đoạn（この区間の運賃(うんん)）\n• 領土＝LÃNH THỔ → lãnh thổ（領土問題(もんだい)）", "45_2": "💡 Mẹo phân biệt 識別・面識・意識・見識:\n• 識別＝THỨC BIỆT → phân biệt, nhận dạng（色で識別する(いろ)）\n• 面識＝DIỆN THỨC → quen mặt, biết mặt（面識がある(ある)）\n• 意識＝Ý THỨC → ý thức, nhận thức, để ý（息子は中学生になり、異性を意識し始めた(むすこは、いせいを)）\n• 見識＝KIẾN THỨC → nhãn quan, kiến thức sâu rộng（見識がある(ある)）", "45_3": "💡 Mẹo phân biệt 魅力・引力・迫力・権力:\n• 魅力＝MỊ LỰC → sức hút, sức quyến rũ（魅力がある(ある)）\n• 引力＝DẪN LỰC → lực hút, trọng lực（引力が働く(はたらく)）\n• 迫力＝BÁCH LỰC → sức mạnh áp đảo, uy lực（せりふに震え上がらせるような迫力があった(ふるえあがらせるような)）\n• 権力＝QUYỀN LỰC → quyền lực（権力を握る(にぎる)）", "45_4": "💡 Mẹo phân biệt 抑止・抑圧・圧倒・制圧:\n• 抑止＝ỨC CHỈ → ngăn chặn, kìm hãm（犯罪を抑止する(はんざい)）\n• 抑圧＝ỨC ÁP → áp bức, đàn áp, kìm nén（感情を抑圧しすぎると神経症になる(かんじょうを、しんけいしょう)）\n• 圧倒＝ÁP ĐẢO → áp đảo, vượt trội hơn hẳn（圧倒する）\n• 制圧＝CHẾ ÁP → trấn áp, kiểm soát bằng vũ lực（制圧する）", "45_5": "💡 Mẹo phân biệt 結束・束縛・固定・放任:\n• 結束＝KẾT THÚC → đoàn kết, gắn bó（結束を訴える(うったえる)）\n• 束縛＝THÚC PHƯỢC → ràng buộc, hạn chế tự do（自由を愛する彼は束縛されることを嫌う(あいする、きらう)）\n• 固定＝CỐ ĐỊNH → cố định（固定資産(しさん)）\n• 放任＝PHÓNG NHIỆM → thả lỏng, mặc kệ（放任主義(しゅぎ)）", "45_6": "💡 Mẹo phân biệt 復活・復旧・修復・反覆:\n• 復活＝PHỤC HOẠT → phục hồi, trở lại（引退を決意した選手が見事に復活した(けつい、みごとに)）\n• 復旧＝PHỤC CỰU → khôi phục trạng thái cũ（復旧する）\n• 修復＝TU PHỤC → sửa chữa, phục hồi（関係を修復する(かんけい)）\n• 反覆＝PHẢN PHÚC → lặp đi lặp lại（反覆する）", "45_7": "💡 Mẹo phân biệt 変革・革新・斬新・新鮮:\n• 変革＝BIẾN CÁCH → cải cách lớn（保守政党と変革政党の一騎打ち(ひととうち)）\n• 革新＝CÁCH TÂN → cải cách, đổi mới（保守政党と革新政党の一騎打ち(いっきうち)）\n• 斬新＝TRẢM TÂN → mới lạ, độc đáo, tiên phong（斬新なアイデア(あいであ)）\n• 新鮮＝TÂN TIÊN → tươi mới, mới lạ（新鮮な野菜(やさい)）", "45_8": "💡 Mẹo phân biệt 確保・確実・確信・確定:\n• 確保＝XÁC BẢO → đảm bảo, duy trì（安全を確保する(あんぜん)）\n• 確実＝XÁC THỰC → chắc chắn（確実にやる(やる)）\n• 確信＝XÁC TÍN → tin chắc, xác tín（確信する）\n• 確定＝XÁC ĐỊNH → xác định, quyết định chính thức（被告の無罪が確定した(ひこく、むざい)）", "45_9": "💡 Mẹo phân biệt 参画・企画・参上・参考:\n• 参画＝THAM HOẠCH → tham gia vào kế hoạch, đóng góp（社会活動に参画できるような社会が望ましい(しゃかいがのぞましい)）\n• 企画＝XÍ HOẠCH → lập kế hoạch, dự án（企画する）\n• 参上＝THAM THƯỢNG → đến thăm bề trên (khiêm nhường)（参上する）\n• 参考＝THAM KHẢO → tham khảo（参考にする）", "45_10": "💡 Mẹo phân biệt 意欲・欲求・貪欲・欲望:\n• 意欲＝Ý DỤC → ý chí, tinh thần tích cực（意欲がある(ある)）\n• 欲求＝DỤC CẦU → nhu cầu, ham muốn（一歩も外に出られず、欲求不満に陥った(いっぽも、おちいった)）\n• 貪欲＝THAM DỤC → tham lam, ham muốn quá mức（貪欲に求める(もとめる)）\n• 欲望＝DỤC VỌNG → ham muốn, dục vọng（欲望を満たす(みたす)）", "45_11": "💡 Mẹo phân biệt 縮小・縮尺・恐縮・収縮:\n• 縮小＝SÚC TIỂU → thu nhỏ, co lại（予算の縮小(よせん)）\n• 縮尺＝SÚC XÍCH → tỉ lệ bản đồ（地図の縮尺(ちてん)）\n• 恐縮＝KHỦNG SÚC → hết sức xin lỗi, cảm kích mà ngại ngùng（ありがたいお電話をいただき、恐縮しております(ありがたい)）\n• 収縮＝THU SÚC → co rút, co lại（筋肉が収縮する(きんにく)）", "46_0": "💡 Mẹo phân biệt 匹敵・素敵・宿敵・無敵:\n• 匹敵＝THẤT ĐỊCH → ngang tầm, sánh ngang（プロに匹敵するほどの腕(うで)）\n• 素敵＝TỐ ĐÍCH → tuyệt vời, xuất sắc（素敵な人(ひと)）\n• 宿敵＝TÚC ĐỊCH → kẻ thù truyền kiếp, đối thủ lâu năm（宿敵と戦う(たたかう)）\n• 無敵＝VÔ ĐỊCH → vô địch（無敵の強さ(つよさ)）", "46_1": "💡 Mẹo phân biệt 敵視・敵対・摘発・指摘:\n• 敵視＝ĐỊCH THỊ → coi như kẻ thù, thù địch（敵視する）\n• 敵対＝ĐỊCH ĐỐI → đối địch, thù địch（敵対する）\n• 摘発＝TRÍCH PHÁT → vạch trần, phát giác (tội lỗi)（不正を摘発する(ふせい)）\n• 指摘＝CHỈ TRÍCH → chỉ ra, vạch ra vấn đề（部下に書類のミスを指摘され、恥をかいた(しょるい、はじをかいた)）", "46_2": "💡 Mẹo phân biệt 衝動・衝突・衝撃・攻撃:\n• 衝動＝XUNG ĐỘNG → xung động, bốc đồng（衝動買い(かい)）\n• 衝突＝XUNG ĐỘT → va chạm, xung đột（車が衝突する(くるま)）\n• 衝撃＝XUNG KÍCH → cú sốc, chấn động（ネットの記事で衝撃の事実が公表された(きじ、こうひょう)）\n• 攻撃＝CÔNG KÍCH → tấn công（攻撃する）", "46_3": "💡 Mẹo phân biệt 告白・告発・申告・上告:\n• 告白＝CÁO BẠCH → thú nhận, bày tỏ (tình cảm)（彼は彼女に自分の気持ちを告白した(かれはか、きもち)）\n• 告発＝CÁO PHÁT → tố cáo, vạch trần (tội phạm)（不正を告発する(ふせい)）\n• 申告＝THÂN CÁO → khai báo, kê khai（確定申告(かくてい)）\n• 上告＝THƯỢNG CÁO → kháng cáo lên tòa cấp trên（最高裁に上告する(さいこうせい)）", "46_4": "💡 Mẹo phân biệt 着服・着用・着目・着手:\n• 着服＝TRƯỚC PHỤC → tham ô, chiếm đoạt tiền bạc（着服する）\n• 着用＝TRƯỚC DỤNG → mặc, đeo, sử dụng (trang phục, thiết bị)（制服を着用する(せいふく)）\n• 着目＝TRƯỚC MỤC → chú ý đến, để ý đến（独身女性が増えていることに着目して開発(どくしんじょせい、かいはつ)）\n• 着手＝TRƯỚC THỦ → bắt tay vào, khởi đầu（着手する）", "46_5": "💡 Mẹo phân biệt 直立・直属・直面・直進:\n• 直立＝TRỰC LẬP → đứng thẳng（直立不動(ふどう)）\n• 直属＝TRỰC THUỘC → trực thuộc, trực tiếp（直属の上司(じょうし)）\n• 直面＝TRỰC DIỆN → đối mặt trực tiếp（今の日本は政治的な危機に直面している(せいじてきなきき)）\n• 直進＝TRỰC TIẾN → đi thẳng（直進する）", "46_6": "💡 Mẹo phân biệt 独力・独断・独占・独自:\n• 独力＝ĐỘC LỰC → tự mình, một mình（独力でやり遂げる(とげる)）\n• 独断＝ĐỘC ĐOÁN → độc đoán, tự quyết một mình（独断で決める(きめる)）\n• 独占＝ĐỘC CHIẾM → độc quyền, chiếm hết（独占する）\n• 独自＝ĐỘC TỰ → độc đáo, riêng, độc lập（田中部長独自の案に全員が賛成した(たなかぶちょう、さんせい)）", "46_7": "💡 Mẹo phân biệt 潔白・白紙・白熱・白状:\n• 潔白＝KHIẾT BẠCH → trong sạch, vô tội（潔白を証明する(しょうめい)）\n• 白紙＝BẠCH CHỈ → giấy trắng / trạng thái ban đầu（白紙に戻す(もどす)）\n• 白熱＝BẠCH NHIỆT → sôi nổi, gay cấn（白熱した議論(ぎろん)）\n• 白状＝BẠCH TRẠNG → thú nhận, khai ra（彼女にうそをついていたことを白状した(かのじょに、ついていた)）", "46_8": "💡 Mẹo phân biệt 感激・刺激・過激・急激:\n• 感激＝CẢM KÍCH → cảm kích, xúc động sâu sắc（感激する）\n• 刺激＝THÍCH KÍCH → kích thích（感情的になっている人を刺激しないほうがいい(かんじょうてきになっている)）\n• 過激＝QUÁ KÍCH → quá khích, cực đoan（過激な発言(はつげん)）\n• 急激＝CẤP KÍCH → đột ngột, mạnh và nhanh（急激な変化(へんか)）", "46_9": "💡 Mẹo phân biệt 破格・格段・格別・格差:\n• 破格＝PHÁ CÁCH → phá cách, cực kỳ rẻ, ngoài thông lệ（破格の値段(ねだん)）\n• 格段＝CÁCH ĐOẠN → rõ rệt, vượt trội hẳn（格段に上達(じょうたつ)）\n• 格別＝CÁCH BIỆT → đặc biệt, nổi bật hơn（格別においしい(おいしい)）\n• 格差＝CÁCH SAI → khoảng cách, sự chênh lệch（貧富の格差は広がる一方(ひんぷのかくさ)）", "46_10": "💡 Mẹo phân biệt 極度・極端・極限・際限:\n• 極度＝CỰC ĐỘ → cực độ, mức độ cực kỳ（極度に疲れる(つかれる)）\n• 極端＝CỰC ĐOAN → cực đoan, quá mức（極端な考え(かんがえ)）\n• 極限＝CỰC HẠN → giới hạn tối đa, tột cùng（経費を極限まで切り詰めた(けいひを、きりつめた)）\n• 際限＝TẾ HẠN → giới hạn, cùng tận（際限がない(ない)）", "46_11": "💡 Mẹo phân biệt 下落・落着・落札・楽勝:\n• 下落＝HẠ LẠC → giảm giá, sụt giảm（株価の下落(かぶか)）\n• 落着＝LẠC TRỚC → giải quyết xong, ổn định（事件が落着する(じけん)）\n• 落札＝LẠC TRÁT → trúng thầu, đấu giá thành công（競売で100年前の絵画を落札した(きょうばい、かいが)）\n• 楽勝＝LẠC THẮNG → thắng dễ dàng, ăn sẵn（楽勝する）", "47_0": "💡 Mẹo phân biệt 一連・一様・一同・一面:\n• 一連＝NHẤT LIÊN → một chuỗi, liên tiếp（一連の事件(じけん)）\n• 一様＝NHẤT DẠNG → đồng đều, như nhau（一様に(に)）\n• 一同＝NHẤT ĐỒNG → tất cả mọi người, toàn thể（結婚式を終え、親戚一同に挨拶状を送った(しんせきいちどう)）\n• 一面＝NHẤT DIỆN → một mặt, một khía cạnh / trang nhất（一面に載る(のる)）", "47_1": "💡 Mẹo phân biệt 単一・均一・逐一・随一:\n• 単一＝ĐƠN NHẤT → đơn lẻ, duy nhất（単一民族(みんぞく)）\n• 均一＝QUÂN NHẤT → đồng đều, đồng nhất（均一な品質(ひんしつ)）\n• 逐一＝TRỤC NHẤT → từng cái một, chi tiết từng bước（上司に進行状況を逐一報告している(しんこうじょうきょう)）\n• 随一＝TÙY NHẤT → đứng đầu, số một trong số đó（世界随一(せかい)）", "47_2": "💡 Mẹo phân biệt 一息・一際・一口・一声:\n• 一息＝NHẤT TỨC → một hơi thở, tạm dừng nghỉ ngơi（一息つく(つく)）\n• 一際＝NHẤT TẾ → đặc biệt, nổi bật hơn hẳn（にぎやかな連中の中でも一際大きい声で話していた(れんちゅう)）\n• 一口＝NHẤT KHẨU → một miếng / nói ngắn gọn（一口食べる(たべる)）\n• 一声＝NHẤT THANH → một tiếng, lên tiếng một lần（一声かける(かける)）", "47_3": "💡 Mẹo phân biệt 制圧・圧迫・権力・圧力:\n• 制圧＝CHẾ ÁP → trấn áp, kiểm soát bằng vũ lực（制圧する）\n• 圧迫＝ÁP BÁCH → áp lực, chèn ép（圧迫する）\n• 権力＝QUYỀN LỰC → quyền lực（権力を握る(にぎる)）\n• 圧力＝ÁP LỰC → áp lực（情報統制のためメディアに圧力をかけた(とうせい、かけた)）", "47_4": "💡 Mẹo phân biệt 誠実・確実・実質・実体:\n• 誠実＝THÀNH THỰC → thành thật, chân thành（誠実な人(ひと)）\n• 確実＝XÁC THỰC → chắc chắn（確実にやる(やる)）\n• 実質＝THỰC CHẤT → thực chất, nội dung thực tế（実質的に(てきに)）\n• 実体＝THỰC THỂ → thực thể, bản chất thực sự（その会社には実体がないことが判明した(ない、はんめい)）", "47_5": "💡 Mẹo phân biệt 出勤・出動・出現・出力:\n• 出勤＝XUẤT CẦN → đi làm, đến nơi làm việc（出勤する）\n• 出動＝XUẤT ĐỘNG → xuất động, điều động（自衛隊の出動を要請した(じえいたい、ようせい)）\n• 出現＝XUẤT HIỆN → xuất hiện（新種が出現する(しんしゅ)）\n• 出力＝XUẤT LỰC → công suất, xuất dữ liệu（出力する）", "47_6": "💡 Mẹo phân biệt 発生・発揮・発起・発芽:\n• 発生＝PHÁT SINH → phát sinh, xảy ra（問題が発生する(もんだい)）\n• 発揮＝PHÁT HUY → phát huy, thể hiện hết khả năng（試験で実力を発揮した(しけん、じつりょく)）\n• 発起＝PHÁT KHỞI → khởi xướng, đề xuất（発起人(にん)）\n• 発芽＝PHÁT NHA → nảy mầm（発芽する）", "47_7": "💡 Mẹo phân biệt 完結・団結・結晶・結成:\n• 完結＝HOÀN KẾT → hoàn kết, kết thúc（物語が完結する(ものがたり)）\n• 団結＝ĐOÀN KẾT → đoàn kết（団結を訴える(うったえる)）\n• 結晶＝KẾT TINH → kết tinh, tinh thể（作品は努力の結晶である）\n• 結成＝KẾT THÀNH → thành lập (nhóm, tổ chức)（チームを結成する(ちーも)）", "47_8": "💡 Mẹo phân biệt 概説・伝説・学説・力説:\n• 概説＝KHÁI THUYẾT → giải thích khái quát（日本史概説(にほんし)）\n• 伝説＝TRUYỀN THUYẾT → truyền thuyết（生きた伝説(いきた)）\n• 学説＝HỌC THUYẾT → học thuyết, luận thuyết（新しい学説(あたらしい)）\n• 力説＝LỰC THUYẾT → nhấn mạnh, thuyết phục mạnh mẽ（重要性を力説した(じゅうようせい)）", "47_9": "💡 Mẹo phân biệt 綿密・精密・密度・密集:\n• 綿密＝MIÊN MẬT → tỉ mỉ, chặt chẽ, kỹ lưỡng（綿密な計画(けいかく)）\n• 精密＝TINH MẬT → chính xác, tinh vi（精密機械(きかい)）\n• 密度＝MẬT ĐỘ → mật độ, độ đặc（彼の人生は短かったが、密度の濃いものだった(じんせいは、こいもの)）\n• 密集＝MẬT TẬP → tập trung dày đặc（密集する）", "47_10": "💡 Mẹo phân biệt 成立・起立・分立・両立:\n• 成立＝THÀNH LẬP → thành lập, hình thành（口約が成立する(けいやく)）\n• 起立＝KHỞI LẬP → đứng dậy, đứng nghiêm（起立する）\n• 分立＝PHÂN LẬP → tách biệt, phân lập（三権分立(さんけん)）\n• 両立＝LƯỠNG LẬP → hai mặt song song, dung hòa hai việc（女性にとって仕事と子育ての両立は負担が大きい(しごとと、ふたん)）", "47_11": "💡 Mẹo phân biệt 雑談・雑学・混雑・乱雑:\n• 雑談＝TẠP ĐÀM → nói chuyện phiếm, tán gẫu（夕食後みんなでロビーで雑談した(ゆうしょくご)）\n• 雑学＝TẠP HỌC → kiến thức tạp, kiến thức đa dạng（雑学が豊富(ほうふ)）\n• 混雑＝HỖN TẠP → đông đúc, chen chúc（電車が混雑する(でんしゃ)）\n• 乱雑＝LOẠN TẠP → bừa bộn, lộn xộn（乱雑な部屋(へや)）", "48_0": "💡 Mẹo phân biệt 固まっている・傾いている・極めている・偏っている:\n• 固まっている＝ → cứng đơ, cố chấp (không đổi)（頭が固まっている(あたま)）\n• 傾いている＝ → nghiêng, lệch về một phía（一方に傾いている(いっほう)）\n• 極めている＝ → đạt đến đỉnh cao, đỉnh cực（技術を極める(ぎじゅつ)）\n• 偏っている＝ → lệch lạc, thiên lệch, không cân bằng（偏った見方(みかた)）", "48_1": "💡 Mẹo phân biệt 巡り・関わり・通り・携わり:\n• 巡り＝ → xoay quanh, liên quan đến（遺産を巡り）\n• 関わり＝ → liên quan, mối quan hệ（深い関わり(ふかい)）\n• 通り＝ → đường, như vậy（予定通り(予定)）\n• 携わり＝ → tham gia, liên quan vào（仕事に携わる(しごと)）", "48_2": "💡 Mẹo phân biệt どなった・怒った・迫った・脅した:\n• どなった＝ → quát, hét lên (tức giận)（どなる）\n• 怒った＝ → tức giận, nổi giận（怒る(いかる)）\n• 迫った＝ → ép buộc, thúc ép, áp lực（迫る(せまる)）\n• 脅した＝ → đe dọa, hăm dọa（脅す）", "48_3": "💡 Mẹo phân biệt 呼んだ・募った・努めた・費やした:\n• 呼んだ＝ → gọi, kêu gọi（名前を呼んだ(なまえ)）\n• 募った＝ → kêu gọi, chiêu mộ, quyên góp（参加者を募る(さんかしゃ)）\n• 努めた＝ → cố gắng, nỗ lực（努力する(どりょく)）\n• 費やした＝ → tiêu tốn, sử dụng hết（時間を費やす(じかん)）", "48_4": "💡 Mẹo phân biệt 凝って・練って・追って・飾って:\n• 凝って＝ → say mê, đam mê, tỉ mỉ（料理に凝る(りょうり)）\n• 練って＝ → nhào nặn, suy nghĩ kỹ（計画を練る(けいかく)）\n• 追って＝ → đuổi theo / tiếp theo sau（追って連絡(れんらく)）\n• 飾って＝ → trang trí, trưng bày（部屋を飾る(へや)）", "48_5": "💡 Mẹo phân biệt たぐって・さぐって・もぐって・くぐって:\n• たぐって＝ → kéo vào, cuộn lại từng đoạn（ロープをたぐる）\n• さぐって＝ → thăm dò, tìm tòi（様子をさぐる）\n• もぐって＝ → chui vào, lặn（水にもぐる）\n• くぐって＝ → chui qua, lách qua（門をくぐる）", "48_6": "💡 Mẹo phân biệt いたり・および・すがり・たどり:\n• いたり＝ → đến tới, đạt được（最高にいたる）\n• および＝ → đạt tới, vươn đến（影響が及ぶ）\n• すがり＝ → nương tựa, bám víu（助けにすがる）\n• たどり＝ → lần mò, vất vả tiến đến（目的地にたどり着く）", "48_7": "💡 Mẹo phân biệt 装って・偽って・操って・嘆いて:\n• 装って＝ → giả vờ, giả trang（平静を装う(へいせい)）\n• 偽って＝ → giả dối, lừa dối（身分を偽る(みぶん)）\n• 操って＝ → điều khiển, thao túng（人を操る(ひと)）\n• 嘆いて＝ → than thở, than vãn（運命を嘆く）", "48_8": "💡 Mẹo phân biệt しぶる・とどこおる・立ち止まる・しりぞく:\n• しぶる＝ → do dự, chần chừ, không chịu（承諾をしぶる）\n• とどこおる＝ → trì trệ, ách tắc, bị gián đoạn（計画が滞る）\n• 立ち止まる＝ → dừng lại（歩みを止める(あもみ)）\n• しりぞく＝ → lui bước, rút lui（退く）", "48_9": "💡 Mẹo phân biệt 陥った・落ちぶれた・廃れた・没した:\n• 陥った＝ → rơi vào, lâm vào (tình huống xấu)（危機に陥る(おちいる)）\n• 落ちぶれた＝ → sa sút, suy sụp（落ちぶれる）\n• 廃れた＝ → lỗi thời, bị bỏ rơi（文化が廃れる(ぶんか)）\n• 没した＝ → mất tích, qua đời, chìm xuống（太陽が没する(たいよう)）", "48_10": "💡 Mẹo phân biệt くっつけて・つないで・つつんで・くくって:\n• くっつけて＝ → dán vào, gắn vào（くっつける）\n• つないで＝ → nối lại, kết nối（ロープをつなぐ）\n• つつんで＝ → bọc, gói（プレゼントを包む）\n• くくって＝ → buộc lại, trói lại（ひもでくくる）", "48_11": "💡 Mẹo phân biệt ねぎらう・いたわる・なぐさめる・くつろぐ:\n• ねぎらう＝ → ủi lạo, khích lệ, cảm ơn sự cố gắng（部下をねぎらう）\n• いたわる＝ → quan tâm, chăm sóc, thương yêu（体をいたわる）\n• なぐさめる＝ → an ủi, vỗ về（悲しみをなぐさめる）\n• くつろぐ＝ → nghỉ ngơi thư giãn, thoải mái（家でくつろぐ）", "49_0": "💡 Mẹo phân biệt 尽くした・極めた・努めた・力んだ:\n• 尽くした＝ → cố hết sức, dốc toàn lực（最善を尽くす）\n• 極めた＝ → đạt đến đỉnh cao, tột cùng（技を極める）\n• 努めた＝ → cố gắng, nỗ lực（維持に努める）\n• 力んだ＝ → cố rặn, căng thẳng quá mức（力む）", "49_1": "💡 Mẹo phân biệt 止まった・定まった・進んだ・起こった:\n• 止まった＝ → dừng lại（車が止まる）\n• 定まった＝ → được xác định, được quyết định（方針が定まる）\n• 進んだ＝ → tiến lên, tiến triển（計画が進む）\n• 起こった＝ → xảy ra, nổi lên（問題が起こる）", "49_2": "💡 Mẹo phân biệt 任せられる・頼れる・務まる・埋まる:\n• 任せられる＝ → được giao phó, được ủy thác（仕事を任せる）\n• 頼れる＝ → có thể nương tựa, đáng tin cậy（頼れる存在）\n• 務まる＝ → đủ khả năng đảm nhiệm, hoàn thành nhiệm vụ（この仕事が務まる）\n• 埋まる＝ → lấp đầy, điền vào（席が埋まる）", "49_3": "💡 Mẹo phân biệt とどめる・さだめる・固める・沈める:\n• とどめる＝ → giữ ở mức, hạn chế không cho lan ra（最小限にとどめる）\n• さだめる＝ → quyết định, xác định（目標を定める）\n• 固める＝ → củng cố, làm cứng, quyết tâm（決意を固める）\n• 沈める＝ → nhấn chìm, làm lắng xuống（船を沈める）", "49_4": "💡 Mẹo phân biệt 浮いた・沈んだ・秘めた・深めた:\n• 浮いた＝ → nổi lên, không trọng tâm（水に浮く）\n• 沈んだ＝ → chìm xuống, trầm uất（船が沈む）\n• 秘めた＝ → ấp ủ trong lòng, giữ kín（秘めた思い）\n• 深めた＝ → làm sâu sắc thêm（理解を深める）", "49_5": "💡 Mẹo phân biệt 用いる・率いる・省みる・試みる:\n• 用いる＝ → sử dụng, dùng（方法を用いる）\n• 率いる＝ → dẫn dắt, chỉ huy（チームを率いる）\n• 省みる＝ → nhìn lại, phản tỉnh（自分を省みる）\n• 試みる＝ → thử, thử nghiệm（新しい方法を試みる）", "49_6": "💡 Mẹo phân biệt まとめて・かぶって・浴びて・帯びて:\n• まとめて＝ → tổng hợp, gom lại（まとめて買う）\n• かぶって＝ → đội lên, trùm lên（帽子をかぶる）\n• 浴びて＝ → tắm, nhận (ánh sáng, chỉ trích)（シャワーを浴びる）\n• 帯びて＝ → mang theo, bắt đầu có (màu sắc, tính chất)（現実味を帯びる）", "49_7": "💡 Mẹo phân biệt こりて・なげいて・にくんで・とざして:\n• こりて＝ → chừa, sợ vì thất bại（懲りる）\n• なげいて＝ → than thở, than vãn（運命を嘆く）\n• にくんで＝ → ghét, căm thù（敵を憎む）\n• とざして＝ → đóng chặt, khép kín（心を閉ざす）", "49_8": "💡 Mẹo phân biệt 叫んだ・通った・しみた・ぬれた:\n• 叫んだ＝ → hét lên, la hét（助けを叫ぶ）\n• 通った＝ → đi qua, thấu đến（声が通る）\n• しみた＝ → thấm vào, thấm sâu vào lòng（胸にしみる）\n• ぬれた＝ → bị ướt（雨に濡れる）", "49_9": "💡 Mẹo phân biệt おさまった・ちぢめた・あやまった・わびた:\n• おさまった＝ → lắng xuống, ổn định（怒りが収まる）\n• ちぢめた＝ → rút ngắn, thu nhỏ（距離を縮める）\n• あやまった＝ → sai lầm, phạm lỗi（判断を誤る）\n• わびた＝ → xin lỗi, tạ lỗi（詫びる）", "49_10": "💡 Mẹo phân biệt 沿う・合わせる・返す・むくいる:\n• 沿う＝ → đi th
