eo, dọc theo（川に沿う）\n• 合わせる＝ → kết hợp, phù hợp với（タイミングを合わせる）\n• 返す＝ → trả lại（本を返す）\n• むくいる＝ → đền đáp, báo đáp（恩にむくいる）", "49_11": "💡 Mẹo phân biệt やぶれた・ほろびた・おちいった・しりぞいた:\n• やぶれた＝ → bị phá vỡ, thua（服が破れる）\n• ほろびた＝ → diệt vong, tiêu tan（文明が滅びる）\n• おちいった＝ → rơi vào tình huống xấu（危機に陥る）\n• しりぞいた＝ → rút lui, lui bước（一歩退く）", "50_0": "💡 Mẹo phân biệt 老いて・老けて・しおれて・しびれて:\n• 老いて＝ → già đi, lão hóa（年老いる）\n• 老けて＝ → trông già hơn tuổi（老けて見える）\n• しおれて＝ → héo, tàn úa (cây cối)（花がしおれる）\n• しびれて＝ → tê liệt, tê dại（足がしびれる）", "50_1": "💡 Mẹo phân biệt そむく・それる・はむかう・まぬがれる:\n• そむく＝ → phản bội, vi phạm（命令にそむく）\n• それる＝ → lạc hướng, lệch（話題がそれる）\n• はむかう＝ → chống lại, phản kháng（親にはむかう）\n• まぬがれる＝ → thoát khỏi, tránh được（責任をまぬがれる）", "50_2": "💡 Mẹo phân biệt 預けた・増した・供えた・添えた:\n• 預けた＝ → gửi để giữ hộ（荷物を預ける）\n• 増した＝ → tăng thêm（勢いが増す）\n• 供えた＝ → cúng, dâng lên（お供えする）\n• 添えた＝ → kèm theo, thêm vào bên cạnh（メッセージを添える）", "50_3": "💡 Mẹo phân biệt 控える・抑える・絶える・収める:\n• 控える＝ → kiêng, hạn chế（酒を控える）\n• 抑える＝ → kiềm chế, kìm nén（感情を抑える）\n• 絶える＝ → chấm dứt, không còn nữa（音信が絶える）\n• 収める＝ → thu vào, cất vào, giải quyết（成果を収める）", "50_4": "💡 Mẹo phân biệt 養った・称えた・肥えた・栄えた:\n• 養った＝ → nuôi dưỡng, bồi dưỡng（家族を養う）\n• 称えた＝ → ca ngợi, tán dương（功績を称える）\n• 肥えた＝ → béo, màu mỡ（土地が肥える）\n• 栄えた＝ → thịnh vượng, phồn vinh（町が栄える）", "50_5": "💡 Mẹo phân biệt 殺した・刻んだ・整えた・まとめた:\n• 殺した＝ → nín thở, nín lặng（息を殺す）\n• 刻んだ＝ → khắc, cắt nhỏ（野菜を刻む）\n• 整えた＝ → chỉnh đốn, sắp xếp gọn gàng（呼吸を整える）\n• まとめた＝ → tổng hợp lại（情報をまとめる）", "50_6": "💡 Mẹo phân biệt 唱える・叫ぶ・どなる・わめく:\n• 唱える＝ → xướng lên, đề xướng, phản đối（異議を唱える）\n• 叫ぶ＝ → hét lên, la to（助けを叫ぶ）\n• どなる＝ → quát tháo（どなる）\n• わめく＝ → la hét om sòm（わめき散らす）", "50_7": "💡 Mẹo phân biệt 溺れて・垂れて・敗れて・廃れて:\n• 溺れて＝ → chết đuối, đắm chìm（川で溺れる）\n• 垂れて＝ → rủ xuống, chảy xuống（雫が垂れる）\n• 敗れて＝ → thất bại, thua（試合に敗れる）\n• 廃れて＝ → lỗi thời, suy tàn（文化が廃れる）", "50_8": "💡 Mẹo phân biệt 焦がれて・蒸れて・腫れて・崩れて:\n• 焦がれて＝ → khao khát, tương tư（故郷に焦がれる）\n• 蒸れて＝ → bị hầm, bị hơi nóng ẩm（靴の中が蒸れる）\n• 腫れて＝ → sưng tấy, phồng lên（目が腫れる）\n• 崩れて＝ → sụp đổ, vỡ vụn（形が崩れる）", "50_9": "💡 Mẹo phân biệt 絶えて・断って・去って・衰えて:\n• 絶えて＝ → chấm dứt, không còn（音信が絶える）\n• 断って＝ → từ chối（依頼を断る）\n• 去って＝ → ra đi, rời đi（職場を去る）\n• 衰えて＝ → suy yếu, giảm sức（体力が衰える）", "50_10": "💡 Mẹo phân biệt 追われ・駆られ・恵まれ・逃れ:\n• 追われ＝ → bị đuổi theo, bị thúc ép（仕事に追われる）\n• 駆られ＝ → bị thôi thúc, bị thúc đẩy bởi cảm xúc（好奇心に駆られる）\n• 恵まれ＝ → được ban cho, may mắn có（才能に恵まれる）\n• 逃れ＝ → thoát khỏi, trốn thoát（責任から逃れる）", "50_11": "💡 Mẹo phân biệt 眺めた・握った・捕まえた・踏まえた:\n• 眺めた＝ → ngắm nhìn, nhìn ra xa（景色を眺める）\n• 握った＝ → nắm lấy, nắm chặt（手を握る）\n• 捕まえた＝ → bắt lấy, tóm lấy（犯人を捕まえる）\n• 踏まえた＝ → dựa trên, căn cứ vào（前例を踏まえる）", "51_0": "💡 Mẹo phân biệt かなう・終える・遂げる・尽きる:\n• かなう＝ → thành hiện thực, được thực hiện（夢がかなう）\n• 終える＝ → kết thúc, hoàn thành（仕事を終える）\n• 遂げる＝ → hoàn thành, đạt được（夢を遂げる）\n• 尽きる＝ → cạn kiệt, hết（力が尽きる）", "51_1": "💡 Mẹo phân biệt 設けた・届けた・施した・用いた:\n• 設けた＝ → tạo ra, thiết lập (cơ hội, địa điểm)（場を設ける）\n• 届けた＝ → giao, chuyển đến（荷物を届ける）\n• 施した＝ → thực hiện, ban cho（治療を施す）\n• 用いた＝ → sử dụng（方法を用いる）", "51_2": "💡 Mẹo phân biệt 企てる・画する・案じる・立ち上げる:\n• 企てる＝ → mưu tính, lên kế hoạch (xấu)（犯行を企てる）\n• 画する＝ → vạch ra (kế hoạch), phân chia（計画を画する）\n• 案じる＝ → lo lắng, quan tâm（身を案じる）\n• 立ち上げる＝ → khởi động, thành lập（会社を立ち上げる）", "51_3": "💡 Mẹo phân biệt 挙げて・掲げて・提げて・遂げて:\n• 挙げて＝ → liệt kê, đưa ra（例を挙げる）\n• 掲げて＝ → giương lên, đề ra (mục tiêu)（旗を掲げる）\n• 提げて＝ → xách, cầm tòng teng（バッグを提げる）\n• 遂げて＝ → hoàn thành, đạt được（目的を遂げる）", "51_4": "💡 Mẹo phân biệt 除いた・避けた・退けた・放した:\n• 除いた＝ → loại trừ, bỏ đi（例外を除く）\n• 避けた＝ → tránh né（危険を避ける）\n• 退けた＝ → đẩy lui, gạt bỏ（敵を退ける）\n• 放した＝ → thả ra, buông ra（手を放す）", "51_5": "💡 Mẹo phân biệt 傾けた・潤した・反った・そむけた:\n• 傾けた＝ → nghiêng（頭を傾ける）\n• 潤した＝ → làm ướt, làm tươi mát（喉を潤す）\n• 反った＝ → cong lại, uốn cong（板が反る）\n• そむけた＝ → quay đi, ngoảnh mặt đi（目をそむける）", "51_6": "💡 Mẹo phân biệt 断った・据えた・隔てた・そびえた:\n• 断った＝ → cắt đứt（連絡を断つ）\n• 据えた＝ → đặt vững, cố định（腰を据える）\n• 隔てた＝ → cách ngăn, ngăn cách（山を隔てる）\n• そびえた＝ → sừng sững, cao vút（山がそびえる）", "51_7": "💡 Mẹo phân biệt 捧げて・掲げて・傾げて・提げて:\n• 捧げて＝ → dâng lên, cống hiến（命を捧げる）\n• 掲げて＝ → giương lên, giơ cao（プラカードを掲げる）\n• 傾げて＝ → nghiêng đầu（首を傾げる）\n• 提げて＝ → xách tay, cầm tòng teng（バッグを提げる）", "51_8": "💡 Mẹo phân biệt 結んだ・構えた・捉えた・組んだ:\n• 結んだ＝ → buộc, ký kết（契約を結ぶ）\n• 構えた＝ → sẵn sàng, thiết lập, dựng lên（事務所を構える）\n• 捉えた＝ → bắt lấy, nắm bắt（チャンスを捉える）\n• 組んだ＝ → ghép, liên kết, lập (nhóm)（チームを組む）", "51_9": "💡 Mẹo phân biệt 照れる・あばれる・たわむれる・まぎれる:\n• 照れる＝ → xấu hổ, ngượng ngùng（照れる）\n• あばれる＝ → nổi loạn, đập phá（暴れる）\n• たわむれる＝ → đùa giỡn, nô đùa（子どもとたわむれる）\n• まぎれる＝ → khuây khỏa, quên đi（気がまぎれる）", "51_10": "💡 Mẹo phân biệt 引いて・おおって・かぶせて・ふせて:\n• 引いて＝ → rút lui, kéo, trừ đi（線を引く）\n• おおって＝ → che phủ, che lại（布でおおう）\n• かぶせて＝ → úp lên, chụp lên（鍋に蓋をかぶせる）\n• ふせて＝ → úp xuống, giấu đi（カードを伏せる）", "51_11": "💡 Mẹo phân biệt 与えられた・預けられた・合わされた・充てられた:\n• 与えられた＝ → được cho, được ban（機会を与える）\n• 預けられた＝ → được gửi giữ hộ（子どもを預ける）\n• 合わされた＝ → được kết hợp, được ghép（意見を合わせる）\n• 充てられた＝ → được dùng cho, được phân bổ vào（予算を充てる）", "52_0": "💡 Mẹo phân biệt うかがった・おがんだ・いただいた・うけたまわった:\n• うかがった＝ → thăm dò, dò xét (khiêm nhường)（機嫌をうかがう）\n• おがんだ＝ → lạy, cầu nguyện（神を拝む）\n• いただいた＝ → nhận được (khiêm nhường)（いただく）\n• うけたまわった＝ → kính thưa, kính tiếp nhận (rất khiêm nhường)（承る）", "52_1": "💡 Mẹo phân biệt 建てた・設けた・築いた・構えた:\n• 建てた＝ → xây dựng (nhà cửa)（家を建てる）\n• 設けた＝ → tạo ra, thiết lập（機会を設ける）\n• 築いた＝ → xây dựng (bằng nỗ lực), gây dựng（信頼を築く）\n• 構えた＝ → sẵn sàng, thiết lập（事務所を構える）", "52_2": "💡 Mẹo phân biệt 偽った・装った・欺いた・だました:\n• 偽った＝ → giả dối, giả mạo（身分を偽る）\n• 装った＝ → giả vờ, giả trang（平静を装う）\n• 欺いた＝ → lừa dối khéo léo（人を欺く）\n• だました＝ → lừa dối（人をだます）", "52_3": "💡 Mẹo phân biệt 招いた・誘った・運んだ・届けた:\n• 招いた＝ → gây ra, dẫn đến / mời（事故を招く）\n• 誘った＝ → rủ, mời（友人を誘う）\n• 運んだ＝ → chuyên chở, vận chuyển（荷物を運ぶ）\n• 届けた＝ → giao, chuyển đến（荷物を届ける）", "52_4": "💡 Mẹo phân biệt 用いた・費やした・儲けた・稼いだ:\n• 用いた＝ → sử dụng（方法を用いる）\n• 費やした＝ → tiêu tốn, sử dụng hết（時間を費やす）\n• 儲けた＝ → kiếm được, có lãi（お金を儲ける）\n• 稼いだ＝ → kiếm tiền (bằng lao động)（お金を稼ぐ）", "52_5": "💡 Mẹo phân biệt こすった・ぬぐった・にぎった・はじいた:\n• こすった＝ → chà, cọ xát（目をこする）\n• ぬぐった＝ → lau đi（汗をぬぐう）\n• にぎった＝ → nắm, cầm chặt（手を握る）\n• はじいた＝ → búng ra, bật ra（指ではじく）", "52_6": "💡 Mẹo phân biệt 背く・反る・異なる・疑う:\n• 背く＝ → phản bội, vi phạm, không tuân theo（命令に背く）\n• 反る＝ → cong lại, uốn cong（板が反る）\n• 異なる＝ → khác nhau, không giống（意見が異なる）\n• 疑う＝ → nghi ngờ（動機を疑う）", "52_7": "💡 Mẹo phân biệt ささやいた・つぶやいた・となえた・口ずさんだ:\n• ささやいた＝ → thì thầm, nói nhỏ（耳元でささやく）\n• つぶやいた＝ → lẩm bẩm, nói một mình（独り言をつぶやく）\n• となえた＝ → đọc to, xướng lên（スローガンを唱える）\n• 口ずさんだ＝ → ngân nga, hát nhẩm（歌を口ずさむ）", "52_8": "💡 Mẹo phân biệt とどろいた・かがやいた・ひらめいた・またたいた:\n• とどろいた＝ → vang rền, dội vang（雷がとどろく）\n• かがやいた＝ → tỏa sáng, rực rỡ（星が輝く）\n• ひらめいた＝ → nảy ra (ý tưởng)（アイデアがひらめく）\n• またたいた＝ → nhấp nháy, chớp mắt（星がまたたく）", "52_9": "💡 Mẹo phân biệt 承る・受ける・継ぐ・就く:\n• 承る＝ → kính tiếp nhận (khiêm nhường)（ご注文を承る）\n• 受ける＝ → nhận, đón nhận（試験を受ける）\n• 継ぐ＝ → kế thừa, tiếp nối（家業を継ぐ）\n• 就く＝ → đảm nhận chức vụ, bắt đầu làm（職に就く）", "52_10": "💡 Mẹo phân biệt 断った・欠いた・破った・奪った:\n• 断った＝ → cắt đứt（連絡を断つ）\n• 欠いた＝ → thiếu, không có đủ（バランスを欠く）\n• 破った＝ → phá vỡ, vi phạm（約束を破る）\n• 奪った＝ → cướp, tước đoạt（財産を奪う）", "52_11": "💡 Mẹo phân biệt 貫いた・徹した・突いた・刺した:\n• 貫いた＝ → giữ vững đến cùng, xuyên suốt（信念を貫く）\n• 徹した＝ → triệt để, thông suốt（節約に徹する）\n• 突いた＝ → đâm, chọc（弱点を突く）\n• 刺した＝ → đâm, chích（針で刺す）", "53_0": "💡 Mẹo phân biệt きそう・いどむ・せまる・たたかう:\n• きそう＝ → cạnh tranh, đua nhau（互いに競う）\n• いどむ＝ → thách thức, dám đương đầu（難関に挑む）\n• せまる＝ → áp sát, ép, đến gần（期限が迫る）\n• たたかう＝ → chiến đấu, đấu tranh（病気と戦う）", "53_1": "💡 Mẹo phân biệt はばんだ・こばんだ・くつがえした・とどめた:\n• はばんだ＝ → cản trở, ngăn chặn（前進をはばむ）\n• こばんだ＝ → từ chối, khước từ（要求を拒む）\n• くつがえした＝ → lật ngược, đảo lộn（判決を覆す）\n• とどめた＝ → dừng lại, giữ ở mức（最小限にとどめる）", "53_2": "💡 Mẹo phân biệt 富んだ・優れた・増した・勝った:\n• 富んだ＝ → giàu có, phong phú về（経験に富む）\n• 優れた＝ → xuất sắc, giỏi giang（優れた人材）\n• 増した＝ → tăng thêm（勢いが増す）\n• 勝った＝ → thắng, hơn（経験が勝る）", "53_3": "💡 Mẹo phân biệt もよおした・さそった・うながした・まねいた:\n• もよおした＝ → tổ chức / gây ra (cảm xúc)（涙をもよおす）\n• さそった＝ → rủ, mời, dụ dỗ（旅行に誘う）\n• うながした＝ → thúc đẩy, khuyến khích（発言を促す）\n• まねいた＝ → mời / gây ra（誤解を招く）", "53_4": "💡 Mẹo phân biệt 超えた・着いた・およんだ・ほろんだ:\n• 超えた＝ → vượt quá, vượt hơn（目標を超える）\n• 着いた＝ → đến nơi（目的地に着く）\n• およんだ＝ → lên đến, đạt đến (số lượng, phạm vi)（被害者が1万人に及ぶ）\n• ほろんだ＝ → diệt vong, tiêu tan（文明がほろびる）", "53_5": "💡 Mẹo phân biệt はがれた・やぶけた・ゆがんだ・つぶれた:\n• はがれた＝ → bong ra, tróc ra（シールがはがれる）\n• やぶけた＝ → bị rách, bị thủng（服が破ける）\n• ゆがんだ＝ → méo mó, bị biến dạng（顔がゆがむ）\n• つぶれた＝ → bẹp, bị nghiền / phá sản（缶がつぶれる）", "53_6": "💡 Mẹo phân biệt ぼやけ・くらみ・かすみ・けむり:\n• ぼやけ＝ → mờ nhạt, không rõ（視界がぼやける）\n• くらみ＝ → hoa mắt, bị mờ mắt (vì lòng tham)（目がくらむ）\n• かすみ＝ → mờ nhạt, bị che phủ（目がかすむ）\n• けむり＝ → khói（煙が上がる）", "53_7": "💡 Mẹo phân biệt とまっている・かげっている・しずんでいる・ひそんでいる:\n• とまっている＝ → đang dừng lại（車が止まる）\n• かげっている＝ → bị bóng che, âm u（日陰になる）\n• しずんでいる＝ → đang chìm, trầm（船が沈む）\n• ひそんでいる＝ → ẩn nấp, rình rập（危険が潜む）", "53_8": "💡 Mẹo phân biệt 通わせた・交わした・通した・交わらせた:\n• 通わせた＝ → trao đổi qua lại (cảm xúc, tín hiệu)（心を通わせる）\n• 交わした＝ → trao nhau, trao đổi（視線を交わす）\n• 通した＝ → cho đi qua, duy trì（信念を通す）\n• 交わらせた＝ → cho giao nhau, kết hợp（線を交わらせる）", "53_9": "💡 Mẹo phân biệt 逸らした・曲げた・紛らした・歪めた:\n• 逸らした＝ → lảng tránh, chuyển hướng（話題を逸らす）\n• 曲げた＝ → bẻ cong, thay đổi（信念を曲げる）\n• 紛らした＝ → đánh lạc hướng, làm nhầm lẫn（気を紛らす）\n• 歪めた＝ → làm méo mó, bóp méo（顔を歪める）", "53_10": "💡 Mẹo phân biệt 保つ・続ける・継ぐ・守る:\n• 保つ＝ → duy trì, giữ gìn（健康を保つ）\n• 続ける＝ → tiếp tục（努力を続ける）\n• 継ぐ＝ → kế thừa, tiếp nối（家業を継ぐ）\n• 守る＝ → bảo vệ, giữ gìn（約束を守る）", "53_11": "💡 Mẹo phân biệt あつかった・あじわった・もてなした・ごちそうした:\n• あつかった＝ → đối xử, xử lý（丁寧に扱う）\n• あじわった＝ → nếm thử, thưởng thức（料理を味わう）\n• もてなした＝ → tiếp đãi chu đáo, đón tiếp（客をもてなす）\n• ごちそうした＝ → đãi ăn, mời ăn（食事をごちそうする）", "54_0": "💡 Mẹo phân biệt 値する・達する・届する・徹する:\n• 値する＝ → xứng đáng, đáng giá（信頼に値する）\n• 達する＝ → đạt đến, đến được（目標に達する）\n• 届する＝ → (ít dùng độc lập)（※「届く」の方が一般的）\n• 徹する＝ → chuyên tâm vào, triệt để（聞き役に徹する）", "54_1": "💡 Mẹo phân biệt 即する・面する・瀕する・絶する:\n• 即する＝ → phù hợp với, căn cứ vào（実情に即する）\n• 面する＝ → đối diện, giáp với（海に面する）\n• 瀕する＝ → bên bờ vực, lâm vào nguy cơ（絶滅の危機に瀕する）\n• 絶する＝ → vượt xa, vô cùng（想像を絶する）", "54_2": "💡 Mẹo phân biệt 課す・画す・帰す・託す:\n• 課す＝ → áp đặt, giao (nhiệm vụ, phạt)（義務を課す）\n• 画す＝ → phân chia, vạch ra（一線を画す）\n• 帰す＝ → trở về, cho về（故郷に帰す）\n• 託す＝ → giao phó, ký thác（夢を託す）", "54_3": "💡 Mẹo phân biệt 脱して・逸して・書して・損して:\n• 脱して＝ → thoát ra khỏi（危機を脱する）\n• 逸して＝ → bỏ lỡ, đánh mất (cơ hội)（機会を逸する）\n• 書して＝ → viết（自筆で書する）\n• 損して＝ → thiệt hại, bị lỗ（損をする）", "54_4": "💡 Mẹo phân biệt 高じなかった・禁じなかった・動じなかった・転じなかった:\n• 高じなかった＝ → không leo thang, không tăng lên（趣味が高じる）\n• 禁じなかった＝ → không cấm（禁じる）\n• 動じなかった＝ → không dao động, không bị ảnh hưởng（動じない）\n• 転じなかった＝ → không chuyển hướng（話題を転じる）", "54_5": "💡 Mẹo phân biệt 絶する・呈する・要する・制する:\n• 絶する＝ → vượt xa, vô cùng（想像を絶する）\n• 呈する＝ → biểu hiện, trình bày（異様な光景を呈する）\n• 要する＝ → cần, đòi hỏi（時間を要する）\n• 制する＝ → kiểm soát, khống chế（感情を制する）", "54_6": "💡 Mẹo phân biệt 発して・化して・接して・介して:\n• 発して＝ → phát ra（命令を発する）\n• 化して＝ → biến thành, hóa thành（灰と化す）\n• 接して＝ → tiếp xúc（敵と接する）\n• 介して＝ → thông qua, qua trung gian（水を介して伝染）", "54_7": "💡 Mẹo phân biệt 案じる・念じる・演じる・講じる:\n• 案じる＝ → lo lắng, quan tâm（身を案じる）\n• 念じる＝ → cầu nguyện, tập trung tâm trí（成功を念じる）\n• 演じる＝ → diễn, đóng vai（主役を演じる）\n• 講じる＝ → thực hiện (biện pháp), đưa ra（対策を講じる）", "54_8": "💡 Mẹo phân biệt 準じる・投じる・興じる・先んじる:\n• 準じる＝ → tuân theo, chiếu theo（規則に準じる）\n• 投じる＝ → đầu tư, bỏ vào（資金を投じる）\n• 興じる＝ → thích thú, say mê（遊びに興じる）\n• 先んじる＝ → đi trước, tiên phong（競争相手に先んじる）", "54_9": "💡 Mẹo phân biệt 重んじる・準じる・徹する・熟する:\n• 重んじる＝ → coi trọng, tôn trọng（伝統を重んじる）\n• 準じる＝ → tuân theo, chiếu theo（規則に準じる）\n• 徹する＝ → triệt để, chuyên tâm（節約に徹する）\n• 熟する＝ → chín muồi, đúng thời điểm（果物が熟する）", "54_10": "💡 Mẹo phân biệt 有する・要する・得する・欲する:\n• 有する＝ → có, sở hữu（才能を有する）\n• 要する＝ → cần, đòi hỏi（時間を要する）\n• 得する＝ → có lợi, được lợi（お得）\n• 欲する＝ → mong muốn, khao khát（自由を欲する）", "54_11": "💡 Mẹo phân biệt 転じた・発した・報じた・題した:\n• 転じた＝ → chuyển hướng, đổi sang（話題を転じる）\n• 発した＝ → phát ra（命令を発する）\n• 報じた＝ → đưa tin, báo cáo（ニュースを報じる）\n• 題した＝ → đặt tên, đặt tiêu đề（「〜」と題した作品）", "55_0": "💡 Mẹo phân biệt ずさんな・ありがちな・ぼろぼろな・がむしゃらな:\n• ずさんな＝ → cẩu thả, bừa bãi（ずさんな管理）\n• ありがちな＝ → hay xảy ra（ありがちな失敗）\n• ぼろぼろな＝ → tơi tả, rách nát（ぼろぼろの服）\n• がむしゃらな＝ → liều lĩnh, xông xáo（がむしゃらに働く）", "55_1": "💡 Mẹo phân biệt ゆるやかな・すこやかな・あざやかな・かろやかな:\n• ゆるやかな＝ → nhẹ nhàng, từ từ（ゆるやかな傾斜）\n• すこやかな＝ → khỏe mạnh, lành mạnh（すこやかな成長）\n• あざやかな＝ → sặc sỡ, rực rỡ（あざやかな色）\n• かろやかな＝ → nhẹ nhàng, nhanh nhẹn（かろやかな足取り）", "55_2": "💡 Mẹo phân biệt ちっぽけな・もの欲しそうな・ほのかな・ほやほやな:\n• ちっぽけな＝ → nhỏ xíu, tầm thường（ちっぽけな存在）\n• もの欲しそうな＝ → ra vẻ thèm muốn（もの欲しそうな目）\n• ほのかな＝ → thoang thoảng, nhẹ nhàng（ほのかな香り）\n• ほやほやな＝ → còn nóng hổi, mới toanh（できたてほやほや）", "55_3": "💡 Mẹo phân biệt ささやかな・ひややかな・きよらかな・おごそかな:\n• ささやかな＝ → nhỏ bé, khiêm tốn（ささやかな贈り物）\n• ひややかな＝ → lạnh lùng, thờ ơ（ひややかな視線）\n• きよらかな＝ → trong sáng, thuần khiết（きよらかな心）\n• おごそかな＝ → trang nghiêm, uy nghi（おごそかな式典）", "55_4": "💡 Mẹo phân biệt しとやか・まばら・のどか・おろそか:\n• しとやか＝ → thanh lịch, dịu dàng（しとやかな女性）\n• まばら＝ → thưa thớt, rải rác（人がまばら）\n• のどか＝ → thư thái, yên bình（のどかな田舎）\n• おろそか＝ → sao nhãng, lơ là（おろそかにする）", "55_5": "💡 Mẹo phân biệt うららかな・やすらかな・にこやかな・なめらかな:\n• うららかな＝ → tươi sáng, ấm áp（うららかな春の日）\n• やすらかな＝ → bình yên, an lành（やすらかな眠り）\n• にこやかな＝ → tươi cười, vui vẻ（にこやかな笑顔）\n• なめらかな＝ → mịn màng, trơn nhẵn（なめらかな肌）", "55_6": "💡 Mẹo phân biệt まっぴら・こりごり・あらわ・目ざわり:\n• まっぴら＝ → kiên quyết không muốn（まっぴらごめん）\n• こりごり＝ → chán ngán（こりごりだ）\n• あらわ＝ → lộ ra, hiện ra, phơi bày（弱点があらわになる）\n• 目ざわり＝ → chướng mắt（目ざわりな存在）", "55_7": "💡 Mẹo phân biệt うかつ・おおげさ・ひそか・はるか:\n• うかつ＝ → sơ ý, bất cẩn（うかつだった）\n• おおげさ＝ → phóng đại, thổi phồng（おおげさに言う）\n• ひそか＝ → âm thầm, lặng lẽ（ひそかに思う）\n• はるか＝ → xa xôi, rất lâu（はるか遠く）", "55_8": "💡 Mẹo phân biệt つぶらな・うつろな・きよらかな・きざな:\n• つぶらな＝ → tròn xoe, đáng yêu（つぶらな瞳）\n• うつろな＝ → vô hồn, đờ đẫn（うつろな目）\n• きよらかな＝ → trong sáng（きよらかな心）\n• きざな＝ → kiểu cách, làm dáng（きざな態度）", "55_9": "💡 Mẹo phân biệt たからかな・おそまつな・さかんな・たくみな:\n• たからかな＝ → vang lên, hùng hồn（たからかに歌う）\n• おそまつな＝ → kém cỏi, thô sơ（おそまつな料理）\n• さかんな＝ → sôi nổi, mạnh mẽ（さかんに行われる）\n• たくみな＝ → khéo léo, tài tình, điêu luyện（たくみな技）", "55_10": "💡 Mẹo phân biệt いいかげん・ざっくばらん・ばらばら・むじゃき:\n• いいかげん＝ → cẩu thả, vô trách nhiệm（いいかげんな人）\n• ざっくばらん＝ → thẳng thắn, cởi mở（ざっくばらんに話す）\n• ばらばら＝ → rời rạc, lộn xộn（ばらばらになる）\n• むじゃき＝ → ngây thơ, hồn nhiên（むじゃきな子ども）", "55_11": "💡 Mẹo phân biệt しかるべき・最たる・もってのほかな・いかなる:\n• しかるべき＝ → thích hợp, đúng đắn（しかるべき処置）\n• 最たる＝ → tiêu biểu nhất（最たる例）\n• もってのほかな＝ → không thể chấp nhận, quá đáng（もってのほかだ）\n• いかなる＝ → dù là bất kỳ, dù thế nào（いかなる例外も）", "56_0": "💡 Mẹo phân biệt 不実な・不安な・不服な・不快な:\n• 不実な＝ → không thật（不実な行為）\n• 不安な＝ → lo lắng, bất an（不安な気持ち）\n• 不服な＝ → không chấp nhận, bất phục（不服を申し立てる）\n• 不快な＝ → khó chịu, bất mãn（不快な思い）", "56_1": "💡 Mẹo phân biệt 不信な・不当な・不全な・不遇な:\n• 不信な＝ → không tin tưởng（不信感を抱く）\n• 不当な＝ → không hợp lý, bất công（不当な判決）\n• 不全な＝ → không hoàn toàn（心不全）\n• 不遇な＝ → bất hạnh, không may mắn（不遇な境遇）", "56_2": "💡 Mẹo phân biệt 親密・厳密・精密・綿密:\n• 親密＝ → thân mật, gần gũi（親密な関係）\n• 厳密＝ → nghiêm ngặt, chặt chẽ（厳密に言うと）\n• 精密＝ → chính xác, tinh vi（精密機械）\n• 綿密＝ → tỉ mỉ, kỹ lưỡng, chu đáo（綿密な計画）", "56_3": "💡 Mẹo phân biệt 好調な・優良な・巧妙な・神妙な:\n• 好調な＝ → thuận lợi, tốt（好調な成績）\n• 優良な＝ → xuất sắc, tốt（優良企業）\n• 巧妙な＝ → khéo léo, tinh vi, xảo quyệt（巧妙な手口）\n• 神妙な＝ → ngoan ngoãn, phục tùng（神妙な顔）", "56_4": "💡 Mẹo phân biệt 明朗・簡明・切実・着実:\n• 明朗＝ → sáng sủa, vui vẻ（明朗な性格）\n• 簡明＝ → đơn giản rõ ràng（簡明な説明）\n• 切実＝ → thiết thực, cấp thiết（切実な問題）\n• 着実＝ → chắc chắn, từng bước vững chắc（着実に成長する）", "56_5": "💡 Mẹo phân biệt 大胆な・雄大な・過大な・盛大な:\n• 大胆な＝ → dũng cảm, táo bạo（大胆な決断）\n• 雄大な＝ → hùng tráng, hùng vĩ（雄大な自然）\n• 過大な＝ → quá mức, đánh giá quá cao（過大評価）\n• 盛大な＝ → linh đình, hoành tráng（盛大なパーティー）", "56_6": "💡 Mẹo phân biệt 観念・肝要・入念・肝心:\n• 観念＝ → chấp nhận / khái niệm（観念する）\n• 肝要＝ → cực kỳ quan trọng（肝要なことは）\n• 入念＝ → tỉ mỉ, kỹ lưỡng, chu đáo（入念に準備する）\n• 肝心＝ → quan trọng nhất, cốt lõi（肝心なことを忘れる）", "56_7": "💡 Mẹo phân biệt 丁重・貴重・重宝・濃厚:\n• 丁重＝ → lịch sự, trang  rỡ, huy hoàng（華々しい活躍）", "58_4": "💡 Mẹo phân biệt 厚かましい・つややかな・そそっかしい・けたたましい:\n• 厚かましい＝ → trơ trẽn, mặt dày（厚かましいお願い）\n• つややかな＝ → bóng mượt, óng ả（つややかな髪）\n• そそっかしい＝ → hấp tấp, vội vàng（そそっかしい性格）\n• けたたましい＝ → ầm ĩ, chói tai（けたたましい音）", "58_5": "💡 Mẹo phân biệt そそっかしい・あくどい・ややこしい・たわいない:\n• そそっかしい＝ → hấp tấp, vội vàng（そそっかしい性格）\n• あくどい＝ → gian xảo, độc ác（あくどい商法）\n• ややこしい＝ → phức tạp, rắc rối（ややこしい話）\n• たわいない＝ → vô hại, không đáng kể, ngây thơ（たわいない話）", "58_6": "💡 Mẹo phân biệt けむたい・おびただしい・うさんくさい・こころよい:\n• けむたい＝ → cay khói, khó chịu vì khói（煙たい）\n• おびただしい＝ → vô số, cực nhiều（おびただしい数）\n• うさんくさい＝ → khả nghi, đáng ngờ（うさんくさい話）\n• こころよい＝ → dễ chịu, thoải mái（快い返事）", "58_7": "💡 Mẹo phân biệt けたたましい・まわりくどい・そっけない・いさましい:\n• けたたましい＝ → ầm ĩ, chói tai（けたたましい音）\n• まわりくどい＝ → vòng vo, dài dòng（まわりくどい説明）\n• そっけない＝ → lãnh đạm（そっけない態度）\n• いさましい＝ → dũng cảm, hùng dũng（勇ましい姿）", "58_8": "💡 Mẹo phân biệt あくどい・香ばしい・喜ばしい・つややかな:\n• あくどい＝ → gian xảo, thâm độc（あくどい商法）\n• 香ばしい＝ → thơm phức（香ばしい匂い）\n• 喜ばしい＝ → đáng mừng（喜ばしいこと）\n• つややかな＝ → bóng mượt（つややかな髪）", "58_9": "💡 Mẹo phân biệt はなばなしい・たくましい・見苦しい・香ばしい:\n• はなばなしい＝ → rực rỡ, huy hoàng（華々しい活躍）\n• たくましい＝ → khỏe mạnh, cường tráng（たくましい体）\n• 見苦しい＝ → khó coi, xấu hổ（見苦しい言い訳）\n• 香ばしい＝ → thơm phức（香ばしい匂い）", "58_10": "💡 Mẹo phân biệt 喜び・悲しみ・喜ばしさ・驚き:\n• 喜び＝ → niềm vui（喜びを感じる）\n• 悲しみ＝ → nỗi buồn（悲しみに暮れる）\n• 喜ばしさ＝ → cảm giác đáng mừng（喜ばしさを感じる）\n• 驚き＝ → sự ngạc nhiên, kinh ngạc（驚きを隠せない）", "58_11": "💡 Mẹo phân biệt たわいない・そっけない・香ばしい・喜ばしい:\n• たわいない＝ → vô hại, không đáng kể（たわいない話）\n• そっけない＝ → lãnh đạm, lạnh nhạt（そっけない態度）\n• 香ばしい＝ → thơm phức（香ばしい匂い）\n• 喜ばしい＝ → đáng mừng（喜ばしいこと）", "59_0": "💡 Mẹo phân biệt しみじみ・うっとり・きょとん・げっそり:\n• しみじみ＝ → sâu lắng, thấm thía（しみじみ思う）\n• うっとり＝ → say mê, ngây ngất（うっとりする）\n• きょとん＝ → ngơ ngác, sững sờ（きょとんとする）\n• げっそり＝ → hốc hác, kiệt sức（げっそり痩せる）", "59_1": "💡 Mẹo phân biệt しんみり・躍り上がって・げっそり・びくびく:\n• しんみり＝ → trầm lắng, cảm động nhẹ nhàng（しんみりする）\n• 躍り上がって＝ → nhảy cẫng lên (vì vui)（躍り上がって喜ぶ）\n• げっそり＝ → hốc hác, kiệt sức（げっそり痩せる）\n• びくびく＝ → run sợ, lo lắng bất an（びくびくする）", "59_2": "💡 Mẹo phân biệt ほのぼの・うっとり・つくづく・ネチネチ:\n• ほのぼの＝ → ấm áp, dễ chịu（ほのぼのする）\n• うっとり＝ → say mê, ngây ngất（うっとりする）\n• つくづく＝ → thấm thía, sâu sắc（つくづく思う）\n• ネチネチ＝ → dai dẳng, lải nhải（ネチネチ言う）", "59_3": "💡 Mẹo phân biệt すやすや・げっそり・きょろきょろ・そわそわ:\n• すやすや＝ → ngủ say sưa, yên bình（すやすや眠る）\n• げっそり＝ → hốc hác, kiệt sức（げっそり痩せる）\n• きょろきょろ＝ → nhìn ngó lung tung, láo liên（きょろきょろする）\n• そわそわ＝ → bồn chồn, không yên（そわそわする）", "59_4": "💡 Mẹo phân biệt うきうき・のびのび・そわそわ・ほくほく:\n• うきうき＝ → hớn hở, phấn khởi（うきうきする）\n• のびのび＝ → thoải mái, tự do phát triển（のびのび育つ）\n• そわそわ＝ → bồn chồn, không yên（そわそわする）\n• ほくほく＝ → hài lòng mãn nguyện（ほくほく顔）", "59_5": "💡 Mẹo phân biệt はきはき・うようよ・もたもた・げっそり:\n• はきはき＝ → rành mạch, dứt khoát（はきはき話す）\n• うようよ＝ → lúc nhúc, đầy nhóc（虫がうようよ）\n• もたもた＝ → chậm chạp, lề mề（もたもたする）\n• げっそり＝ → hốc hác, kiệt sức（げっそり痩せる）", "59_6": "💡 Mẹo phân biệt しんみり・元気いっぱい・げっそり・しょんぼり:\n• しんみり＝ → trầm lắng（しんみりする）\n• 元気いっぱい＝ → tràn đầy năng lượng（元気いっぱいに遊ぶ）\n• げっそり＝ → hốc hác, kiệt sức（げっそり痩せる）\n• しょんぼり＝ → ủ rũ, buồn bã（しょんぼりする）", "59_7": "💡 Mẹo phân biệt うきうき・ほくほく・しょんぼり・のびのび:\n• うきうき＝ → hớn hở, phấn khởi（うきうきする）\n• ほくほく＝ → hài lòng mãn nguyện（ほくほく顔）\n• しょんぼり＝ → ủ rũ, buồn bã（しょんぼりする）\n• のびのび＝ → thoải mái, tự do（のびのび育つ）", "59_8": "💡 Mẹo phân biệt びくびく・うようよ・はきはき・もたもた:\n• びくびく＝ → run sợ, lo lắng bất an（びくびくする）\n• うようよ＝ → lúc nhúc, đầy nhóc（虫がうようよ）\n• はきはき＝ → rành mạch, dứt khoát（はきはき話す）\n• もたもた＝ → chậm chạp, lề mề（もたもたする）", "59_9": "💡 Mẹo phân biệt しょんぼり・そわそわ・うようよ・はきはき:\n• しょんぼり＝ → ủ rũ, buồn bã（しょんぼりする）\n• そわそわ＝ → bồn chồn, không yên（そわそわする）\n• うようよ＝ → lúc nhúc, đầy nhóc（虫がうようよ）\n• はきはき＝ → rành mạch, dứt khoát（はきはき話す）", "59_10": "💡 Mẹo phân biệt うきうき・うようよ・しんみり・ほくほく:\n• うきうき＝ → hớn hở, phấn khởi（うきうきする）\n• うようよ＝ → lúc nhúc, đầy nhóc（虫がうようよ）\n• しんみり＝ → trầm lắng（しんみりする）\n• ほくほく＝ → hài lòng mãn nguyện（ほくほく顔）", "59_11": "💡 Mẹo phân biệt げっそり・しょんぼり・ほくほく・びくびく:\n• げっそり＝ → hốc hác, kiệt sức（げっそり痩せる）\n• しょんぼり＝ → ủ rũ, buồn bã（しょんぼりする）\n• ほくほく＝ → hài lòng mãn nguyện, hớn hở（ほくほく顔）\n• びくびく＝ → run sợ, lo lắng bất an（びくびくする）", "60_0": "💡 Mẹo phân biệt だらだら・てきぱき・もたもた・ぐずぐず:\n• だらだら＝ → lê thê, kéo dài lê thê（だらだら話す）\n• てきぱき＝ → nhanh nhẹn, gọn gàng（てきぱき働く）\n• もたもた＝ → chậm chạp, lề mề（もたもたする）\n• ぐずぐず＝ → lần lữa, chần chừ（ぐずぐずする）", "60_1": "💡 Mẹo phân biệt てきぱき・きびきび・さっさと・だらだら:\n• てきぱき＝ → nhanh nhẹn, gọn gàng（てきぱき働く）\n• きびきび＝ → nhanh nhẹn, hoạt bát（きびきび動く）\n• さっさと＝ → nhanh chóng, mau lẹ（さっさと帰る）\n• だらだら＝ → lê thê, trì hoãn（だらだら先延ばし）", "60_2": "💡 Mẹo phân biệt てきぱき・ぐずぐず・だらだら・もたもた:\n• てきぱき＝ → nhanh nhẹn, gọn gàng（てきぱき働く）\n• ぐずぐず＝ → lần lữa, chần chừ（ぐずぐずする）\n• だらだら＝ → lê thê（だらだら話す）\n• もたもた＝ → chậm chạp, lề mề（もたもたする）", "60_3": "💡 Mẹo phân biệt さっさと・きびきび・のろのろ・てきぱき:\n• さっさと＝ → nhanh chóng, mau lẹ（さっさと帰る）\n• きびきび＝ → nhanh nhẹn, hoạt bát（きびきび動く）\n• のろのろ＝ → chậm chạp, ì ạch（のろのろ歩く）\n• てきぱき＝ → nhanh nhẹn, gọn gàng（てきぱき働く）", "60_4": "💡 Mẹo phân biệt きっぱり・すんなり・ぎっしり・うんざり:\n• きっぱり＝ → dứt khoát, rõ ràng（きっぱり断る）\n• すんなり＝ → suôn sẻ, thuận lợi không phản kháng（すんなり決まる）\n• ぎっしり＝ → chật ních, đầy ắp（ぎっしり詰まる）\n• うんざり＝ → chán ngán（うんざりする）", "60_5": "💡 Mẹo phân biệt きっぱり・すんなり・うっすら・ゆったり:\n• きっぱり＝ → dứt khoát, rõ ràng（きっぱり断る）\n• すんなり＝ → suôn sẻ（すんなり決まる）\n• うっすら＝ → mờ nhạt, thoang thoảng（うっすら覚える）\n• ゆったり＝ → thư thái, thoải mái, rộng rãi（ゆったり過ごす）", "60_6": "💡 Mẹo phân biệt うんざり・すんなり・ぎっしり・うっすら:\n• うんざり＝ → chán ngán（うんざりする）\n• すんなり＝ → suôn sẻ（すんなり決まる）\n• ぎっしり＝ → chật ních, đầy ắp（ぎっしり詰まる）\n• うっすら＝ → mờ nhạt, thoang thoảng（うっすら覚える）", "60_7": "💡 Mẹo phân biệt きっぱり・ゆったり・ぎっしり・うんざり:\n• きっぱり＝ → dứt khoát（きっぱり断る）\n• ゆったり＝ → thư thái, thoải mái（ゆったり過ごす）\n• ぎっしり＝ → chật ních（ぎっしり詰まる）\n• うんざり＝ → chán ngán, ngán ngẩm（うんざりする）", "60_8": "💡 Mẹo phân biệt ぎっしり・うっすら・きっぱり・すんなり:\n• ぎっしり＝ → chật ních（ぎっしり詰まる）\n• うっすら＝ → mờ nhạt, mỏng manh（うっすら覚える）\n• きっぱり＝ → dứt khoát（きっぱり断る）\n• すんなり＝ → suôn sẻ（すんなり決まる）", "60_9": "💡 Mẹo phân biệt うんざり・ぎっしり・ゆったり・うっすら:\n• うんざり＝ → chán ngán（うんざりする）\n• ぎっしり＝ → chật ních（ぎっしり詰まる）\n• ゆったり＝ → thư thái, thoải mái（ゆったり過ごす）\n• うっすら＝ → mờ nhạt（うっすら覚える）", "60_10": "💡 Mẹo phân biệt ぎっしり・うっすら・きっぱり・すんなり:\n• ぎっしり＝ → chật ních（ぎっしり詰まる）\n• うっすら＝ → mờ nhạt（うっすら覚える）\n• きっぱり＝ → dứt khoát（きっぱり断る）\n• すんなり＝ → suôn sẻ, thuận lợi（すんなり決まる）", "60_11": "💡 Mẹo phân biệt きっぱり・うんざり・ゆったり・ぎっしり:\n• きっぱり＝ → dứt khoát, rõ ràng（きっぱり断る）\n• うんざり＝ → chán ngán（うんざりする）\n• ゆったり＝ → thư thái（ゆったり過ごす）\n• ぎっしり＝ → chật ních（ぎっしり詰まる）", "61_0": "💡 Mẹo phân biệt 追跡・追求・追及・追放:\n• 追跡＝TRUY TRÍCH → truy đuổi, theo dõi（犯人を追跡する）\n• 追求＝TRUY CẦU → theo đuổi (mục tiêu, lợi ích)（利益を追求する）\n• 追及＝TRUY CẬP → truy cứu, chất vấn gắt gao（マスコミの追及が厳しさを増している）\n• 追放＝TRUY PHÓNG → trục xuất, loại bỏ（組織から追放する）", "61_1": "💡 Mẹo phân biệt 揺らぐ・揺さぶる・揺るがす・揺れる:\n• 揺らぐ＝ → lay động, dao động, không ổn định（信念が揺らぐ）\n• 揺さぶる＝ → lay động mạnh, làm rung chuyển (cảm xúc)（聴衆の心を揺さぶる力強い演説）\n• 揺るがす＝ → làm lung lay, chấn động（国家を揺るがす）\n• 揺れる＝ → lung lay, rung động（船が揺れる）", "61_2": "💡 Mẹo phân biệt 願望・展望・野望・憶測:\n• 願望＝ → nguyện vọng, mong muốn（願望を抱く）\n• 展望＝ → triển vọng, tầm nhìn（将来を展望する）\n• 野望＝ → tham vọng lớn（野望を抱く）\n• 憶測＝ → suy đoán không có căn cứ（根拠に乏しく、憶測に過ぎない）", "61_3": "💡 Mẹo phân biệt 低迷・低調・沈滞・衰微:\n• 低迷＝ → trì trệ, đình trệ（経済の低迷が続き、失業者が増加）\n• 低調＝ → trầm lắng, ảm đạm（景気が低調）\n• 沈滞＝ → trì trệ, ứ đọng（経済が沈滞する）\n• 衰微＝ → suy vi, suy yếu（国力が衰微する）", "61_4": "💡 Mẹo phân biệt 支障・変動・影響・波及:\n• 支障＝ → trở ngại, cản trở（支障をきたす）\n• 変動＝ → biến động, thay đổi（為替変動）\n• 影響＝ → ảnh hưởng（企業経営に大きな影響が生じた）\n• 波及＝ → lan tỏa, lan rộng ảnh hưởng（影響が波及する）", "61_5": "💡 Mẹo phân biệt 結果・成果・結末・帰結:\n• 結果＝ → kết quả（実験の結果）\n• 成果＝ → thành quả (của nỗ lực)（長年の研究の成果として発表した）\n• 結末＝ → kết cục, hồi kết（物語の結末）\n• 帰結＝ → kết luận cuối cùng, hệ quả tất yếu（当然の帰結）", "61_6": "💡 Mẹo phân biệt 反映・反応・反響・考慮:\n• 反映＝ → phản ánh（意見を反映する）\n• 反応＝ → phản ứng（反応する）\n• 反響＝ → tiếng vang, phản hồi từ xã hội（大きな反響を呼ぶ）\n• 考慮＝ → cân nhắc, xem xét（現場の意見を考慮せず、独断で進める）", "61_7": "💡 Mẹo phân biệt 賠償・補償・保障・保証:\n• 賠償＝ → bồi thường（被害者への賠償として慰謝料が支払われる）\n• 補償＝ → đền bù, bồi thường (thiệt hại)（損失を補償する）\n• 保障＝ → bảo đảm (an ninh, quyền lợi)（安全保障）\n• 保証＝ → bảo đảm, chứng nhận（品質を保証する）", "61_8": "💡 Mẹo phân biệt 貸して・取って・差し伸べて・挙げて:\n• 貸して＝ → cho mượn, giúp đỡ（力を貸す）\n• 取って＝ → lấy, cầm（手を取る）\n• 差し伸べて＝ → chìa tay ra (giúp đỡ)（困っている人を見ると手を差し伸べてしまう）\n• 挙げて＝ → giơ lên（手を挙げる）", "61_9": "💡 Mẹo phân biệt 危害・危険性・危機感・冒険:\n• 危害＝ → gây nguy hại（危害を加える）\n• 危険性＝ → tính nguy hiểm, mức độ rủi ro（自然災害の危険性が高いと指摘）\n• 危機感＝ → cảm giác khủng hoảng（危機感を持つ）\n• 冒険＝ → mạo hiểm, phiêu lưu（冒険する）", "61_10": "💡 Mẹo phân biệt はっきり・きっちり・漠然・整然:\n• はっきり＝ → rõ ràng（はっきり言う）\n• きっちり＝ → chính xác, khít khao（きっちり合う）\n• 漠然＝ → mơ hồ, mông lung（具体性に欠け、漠然とした印象しか残らない）\n• 整然＝ → trật tự, ngăn nắp（整然と並ぶ）", "61_11": "💡 Mẹo phân biệt 相応・該当・妥当・ふさわしい:\n• 相応＝ → tương xứng, phù hợp（能力に相応の給料）\n• 該当＝ → thuộc diện, đúng với điều kiện（該当する項目）\n• 妥当＝ → thỏa đáng, hợp lý（妥当な判断）\n• ふさわしい＝ → xứng đáng, thích hợp（組織のトップに立つにふさわしい人物）", "62_0": "💡 Mẹo phân biệt 気軽・果敢・軽率・円滑:\n• 気軽＝ → thoải mái, không câu nệ（気軽に頼む）\n• 果敢＝ → quả cảm, quyết đoán（困難な状況にも果敢に立ち向かった）\n• 軽率＝ → khinh suất, hấp tấp（軽率な発言）\n• 円滑＝ → suôn sẻ, trôi chảy（円滑に進める）", "62_1": "💡 Mẹo phân biệt 安堵・感銘・波紋・緊迫:\n• 安堵＝ → an tâm, nhẹ nhõm（安堵する）\n• 感銘＝ → cảm động sâu sắc, ấn tượng sâu đậm（感銘を受ける）\n• 波紋＝ → gợn sóng, ảnh hưởng lan tỏa（会議の場に波紋をもたらした）\n• 緊迫＝ → căng thẳng, nghiêm trọng（緊迫した状況）", "62_2": "💡 Mẹo phân biệt 教訓・口実・反省・うやむや:\n• 教訓＝ → bài học kinh nghiệm（教訓を得る）\n• 口実＝ → cái cớ, lý do biện minh（口実を作る）\n• 反省＝ → phản tỉnh, kiểm điểm（反省する）\n• うやむや＝ → mập mờ, không rõ ràng（失敗をうやむやにせず、素直に反省した）", "62_3": "💡 Mẹo phân biệt 通じ・応じ・準じ・投じ:\n• 通じ＝ → thông hiểu, truyền đạt được（言葉を交わさなくても気持ちが通じ合う）\n• 応じ＝ → đáp ứng, phản hồi（要望に応じる）\n• 準じ＝ → tuân theo tiêu chuẩn（規則に準じる）\n• 投じ＝ → đầu tư, bỏ vào（資金を投じる）", "62_4": "💡 Mẹo phân biệt きちんと・ちゃんと・絶妙に・適度に:\n• きちんと＝ → gọn gàng, chính xác（きちんと並べる）\n• ちゃんと＝ → đàng hoàng, đầy đủ（ちゃんとやる）\n• 絶妙に＝ → một cách tuyệt vời, tinh tế（コストと品質のバランスが絶妙にとれている）\n• 適度に＝ → ở mức vừa phải（適度に運動する）", "62_5": "💡 Mẹo phân biệt 見つめて・うかがって・眺めて・見比べて:\n• 見つめて＝ → nhìn chăm chăm（目をみつめる）\n• うかがって＝ → dò xét, thăm dò（上司の顔色をうかがってばかり）\n• 眺めて＝ → ngắm nhìn（景色を眺める）\n• 見比べて＝ → so sánh bằng mắt（二つを見比べる）", "62_6": "💡 Mẹo phân biệt 刺激・衝撃・感触・勇気:\n• 刺激＝ → kích thích（刺激を与える）\n• 衝撃＝ → cú sốc, chấn động（衝撃を受ける）\n• 感触＝ → cảm giác chạm vào, cảm nhận（感触を確かめる）\n• 勇気＝ → dũng khí, can đảm（多くの人々に勇気を与えた）", "62_7": "💡 Mẹo phân biệt 射た・打った・突いた・外した:\n• 射た＝ → bắn trúng (mục tiêu, trọng tâm)（いつも的を射たものだ）\n• 打った＝ → đánh, đập（ボールを打つ）\n• 突いた＝ → chọc, đâm vào (điểm yếu)（弱点を突く）\n• 外した＝ → trật, lệch khỏi mục tiêu（的を外す）", "62_8": "💡 Mẹo phân biệt 寛大・温厚・厳格・公正:\n• 寛大＝ → khoan dung, độ lượng（寛大な処分）\n• 温厚＝ → ôn hòa, hiền hậu（温厚な人柄）\n• 厳格＝ → nghiêm khắc, chặt chẽ（不正を働いた社員に厳格な処分を下した）\n• 公正＝ → công bằng, công chính（公正な判断）", "62_9": "💡 Mẹo phân biệt 反省・弁明・説明・証言:\n• 反省＝ → phản tỉnh（反省する）\n• 弁明＝ → biện minh, giải thích（間違いを認めず、なおも弁明を続けた）\n• 説明＝ → giải thích（詳しく説明する）\n• 証言＝ → làm chứng（法廷で証言する）", "62_10": "💡 Mẹo phân biệt 確実に・順調に・円満に・脈々と:\n• 確実に＝ → chắc chắn（確実に伝わる）\n• 順調に＝ → một cách thuận lợi（順調に進む）\n• 円満に＝ → êm đẹp, hòa thuận（円満に解決する）\n• 脈々と＝ → liên tục không ngừng, mạch lạc qua thời gian（祭りが今も脈々と受け継がれている）", "62_11": "💡 Mẹo phân biệt 屈折する・曲折する・屈する・服する:\n• 屈折する＝ → khúc xạ, bị lệch hướng（光が屈折する）\n• 曲折する＝ → khúc khuỷu, phức tạp（紆余曲折）\n• 屈する＝ → khuất phục, đầu hàng（どんな困難にも屈することなく前に進んだ）\n• 服する＝ → tuân theo, phục tùng（刑に服する）", "63_0": "💡 Mẹo phân biệt 一貫・貫通・連続・継続:\n• 一貫＝ → nhất quán, xuyên suốt（論理が一貫していて説得力があった）\n• 貫通＝ → xuyên qua, thông suốt（トンネルが貫通する）\n• 連続＝ → liên tục（連続する）\n• 継続＝ → tiếp tục, duy trì（契約を継続する）", "63_1": "💡 Mẹo phân biệt 着想・空論・理論・討論:\n• 着想＝ → nảy ra ý tưởng（着想を得る）\n• 空論＝ → lý luận suông, viển vông（単なる空論に終わりそうだ）\n• 理論＝ → lý thuyết（理論を学ぶ）\n• 討論＝ → tranh luận（討論会）", "63_2": "💡 Mẹo phân biệt 熟読・討議・熟慮・配慮:\n• 熟読＝ → đọc kỹ, nghiền ngẫm（資料を熟読する）\n• 討議＝ → thảo luận（討議する）\n• 熟慮＝ → cân nhắc kỹ lưỡng（会社の将来を熟慮した末、退職を決意した）\n• 配慮＝ → quan tâm, chú ý đến（配慮する）", "63_3": "💡 Mẹo phân biệt 如実に・画一的に・暗黙に・明確に:\n• 如実に＝ → đúng như thực tế（如実に表れる）\n• 画一的に＝ → một cách rập khuôn, đồng nhất（画一的な教育）\n• 暗黙に＝ → ngầm hiểu, không nói ra（暗黙の了解）\n• 明確に＝ → rõ ràng, minh bạch（仕事とプライベートを明確に区別している）", "63_4": "💡 Mẹo phân biệt 一致・分裂・統一・調整:\n• 一致＝ → nhất trí, trùng khớp（意見が一致する）\n• 分裂＝ → chia rẽ, phân liệt（専門家の間でも意見が分裂している）\n• 統一＝ → thống nhất（意見を統一する）\n• 調整＝ → điều chỉnh（日程を調整する）", "63_5": "💡 Mẹo phân biệt 理由・原因・せい・おかげ:\n• 理由＝ → lý do（理由を説明する）\n• 原因＝ → nguyên nhân（事故の原因）\n• せい＝ → đổ lỗi, do (nguyên nhân xấu)（失敗を他人のせいにする癖がある）\n• おかげ＝ → nhờ vào (điều tốt)（あなたのおかげ）", "63_6": "💡 Mẹo phân biệt 着々・続々・刻々・転々:\n• 着々＝ → từng bước vững chắc, đều đặn（着々と準備を進めている）\n• 続々＝ → liên tiếp, dồn dập（続々と集まる）\n• 刻々＝ → từng khoảnh khắc, dần dần theo thời gian（刻々と変化する）\n• 転々＝ → lang thang, chuyển hết chỗ này sang chỗ khác（転々とする）", "63_7": "💡 Mẹo phân biệt 几帳面な・几微な・曖昧な・胡散臭い:\n• 几帳面な＝ → tỉ mỉ, chỉn chu, kỹ tính（几帳面な性格）\n• 几微な＝ → (không phổ biến)（―）\n• 曖昧な＝ → mập mờ, mơ hồ（曖昧な返事）\n• 胡散臭い＝ → khả nghi, đáng ngờ（どこか胡散臭いところがあり信用できない）", "63_8": "💡 Mẹo phân biệt 案外・存外・依然として・案の定:\n• 案外＝ → ngoài dự đoán, bất ngờ（案外簡単だった）\n• 存外＝ → ngoài mong đợi, ngoài dự tính（存外うまくいった）\n• 依然として＝ → vẫn như cũ, vẫn tiếp diễn（支援物資が依然として不足している）\n• 案の定＝ → đúng như dự đoán（案の定失敗した）", "63_9": "💡 Mẹo phân biệt 重視して・度外視して・軽視して・凝視して:\n• 重視して＝ → coi trọng（安全を重視する）\n• 度外視して＝ → bỏ qua, không tính đến（自分の利益を度外視して行動した）\n• 軽視して＝ → xem nhẹ, coi thường（安全を軽視する）\n• 凝視して＝ → nhìn chằm chằm（画面を凝視する）", "63_10": "💡 Mẹo phân biệt 潜在・内在・偏在・基幹:\n• 潜在＝ → tiềm ẩn, ngấm ngầm（潜在能力）\n• 内在＝ → tồn tại bên trong, nội tại（内在する問題）\n• 偏在＝ → phân bố lệch, tập trung một chỗ（資源が偏在する）\n• 基幹＝ → cốt lõi, then chốt (ngành nghề)（農業が基幹産業として発展してきた）", "63_11": "💡 Mẹo phân biệt 実用・実質・実態・実施:\n• 実用＝ → thực dụng, thực tiễn ứng dụng（理想論であり、実用性に欠けている）\n• 実質＝ → thực chất（実質的に）\n• 実態＝ → thực trạng（実態を調査する）\n• 実施＝ → thực thi, tiến hành（計画を実施する）", "64_0": "💡 Mẹo phân biệt 評判・批評・評価・評論:\n• 評判＝ → danh tiếng, tiếng đồn（評判がいい）\n• 批評＝ → phê bình, bình luận（批評する）\n• 評価＝ → đánh giá（学界において高く評価されている）\n• 評論＝ → bình luận, đánh giá lý luận（評論家）", "64_1": "💡 Mẹo phân biệt 屈せ・怯ま・諦め・崩れ:\n• 屈せ＝ → khuất phục（どんな逆境にも屈せず努力を続けた）\n• 怯ま＝ → chùn bước, sợ hãi（どんな逆境にも怯まず努力を続けた）\n• 諦め＝ → từ bỏ（諦めない）\n• 崩れ＝ → sụp đổ, vỡ vụn（形が崩れる）", "64_2": "💡 Mẹo phân biệt 対立・反発・干渉・尊重:\n• 対立＝ → đối lập（対立する）\n• 反発＝ → phản đối, kháng cự（反発する）\n• 干渉＝ → can thiệp（内政干渉）\n• 尊重＝ → tôn trọng（互いの立場を尊重し合い、解決した）", "64_3": "💡 Mẹo phân biệt 上回・下回・見回・出回:\n• 上回＝ → vượt qua (mức dự tính)（当初の予想を大きく上回った）\n• 下回＝ → thấp hơn (mức dự tính)（予想を下回る）\n• 見回＝ → quan sát xung quanh（辺りを見回る）\n• 出回＝ → được bày bán trên thị trường（新製品が出回る）", "64_4": "💡 Mẹo phân biệt 支配・統治・左右・干渉:\n• 支配＝ → chi phối, thống trị（支配する）\n• 統治＝ → thống trị, cai trị（国を統治する）\n• 左右＝ → chi phối, ảnh hưởng quyết định（感情に左右されることがない）\n• 干渉＝ → can thiệp（内政干渉）", "64_5": "💡 Mẹo phân biệt 欠け・富み・劣り・満ち:\n• 欠け＝ → thiếu（バランスを欠く）\n• 富み＝ → giàu có, phong phú（独創性に富み、高い評価を受けた）\n• 劣り＝ → kém hơn（他社に劣る）\n• 満ち＝ → tràn đầy（希望に満ちる）", "64_6": "💡 Mẹo phân biệt 意向・意図・意地・意味:\n• 意向＝ → ý định, ý muốn（意向を示す）\n• 意図＝ → ý đồ, chủ ý（意図的に）\n• 意地＝ → cố chấp, sĩ diện（意地を張る）\n• 意味＝ → ý nghĩa（言葉には、深い意味が込められていた）", "64_7": "💡 Mẹo phân biệt 強引に・軽率に・客観的に・主観的に:\n• 強引に＝ → cưỡng ép（強引に進める）\n• 軽率に＝ → khinh suất（軽率な発言）\n• 客観的に＝ → một cách khách quan（原因を客観的に分析する必要がある）\n• 主観的に＝ → một cách chủ quan（主観的な意見）", "64_8": "💡 Mẹo phân biệt 巧みに・強気に・頑固に・強硬に:\n• 巧みに＝ → khéo léo, tài tình（困難な交渉を巧みにまとめ上げた）\n• 強気に＝ → mạnh mẽ, tự tin quyết đoán（強気に出る）\n• 頑固に＝ → cố chấp, ương ngạnh（頑固に主張する）\n• 強硬に＝ → cứng rắn, kiên quyết（強硬に反対する）", "64_9": "💡 Mẹo phân biệt ゆるく・薄く・軽く・しっかりと:\n• ゆるく＝ → lỏng lẻo（ゆるく結ぶ）\n• 薄く＝ → mỏng（薄く切る）\n• 軽く＝ → nhẹ nhàng（軽く挨拶する）\n• しっかりと＝ → vững chắc, chặt chẽ（観客の心をしっかりとつかんで離さなかった）", "64_10": "💡 Mẹo phân biệt 多い・いない・少ない・現れる:\n• 多い＝ → nhiều（人数が多い）\n• いない＝ → không có, không tồn tại（右に出る者がいないと言われている）\n• 少ない＝ → ít（人数が少ない）\n• 現れる＝ → xuất hiện（才能が現れる）", "65_0": "💡 Mẹo phân biệt 退屈・上品・熱心・冷淡:\n• 退屈＝ → buồn chán, nhàm chán（退屈な話）\n• 上品＝ → thanh lịch, sang trọng（上品な言葉遣い）\n• 熱心＝ → nhiệt tình, tận tâm（仕事のことになると人が変わったように熱心になる）\n• 冷淡＝ → lãnh đạm, thờ ơ（冷淡な態度）", "65_1": "💡 Mẹo phân biệt 適合・順応・対応・適応:\n• 適合＝ → phù hợp với điều kiện（規格に適合する）\n• 順応＝ → thích nghi, thích ứng（時代の変化に順応できていない）\n• 対応＝ → ứng phó, đối ứng（対応する）\n• 適応＝ → thích nghi, thích ứng（環境に適応する）", "65_2": "💡 Mẹo phân biệt 承知・了解・承諾・合意:\n• 承知＝ → biết, đồng ý（承知する）\n• 了解＝ → hiểu, đồng ý（了解する）\n• 承諾＝ → chấp thuận（承諾を得る）\n• 合意＝ → đồng thuận, thỏa thuận（参加者全員の合意によって決められた）", "65_3": "💡 Mẹo phân biệt 転嫁・転換・転落・転送:\n• 転嫁＝ → đổ lỗi, chuyển gánh nặng cho người khác（責任を他人に転嫁した）\n• 転換＝ → chuyển đổi, chuyển hướng（方針を転換する）\n• 転落＝ → rơi xuống, sa sút（崖から転落する）\n• 転送＝ → chuyển tiếp（メールを転送する）", "65_4": "💡 Mẹo phân biệt 現象・対象・波紋・余波:\n• 現象＝ → hiện tượng（自然現象）\n• 対象＝ → đối tượng（調査対象）\n• 波紋＝ → gợn sóng, dư luận xôn xao（大きな社会的波紋を巻き起こした）\n• 余波＝ → dư âm, ảnh hưởng còn sót lại（不況の余波）", "65_5": "💡 Mẹo phân biệt せいで・わりに・ところに・あげく:\n• せいで＝ → vì (nguyên nhân xấu)（雨のせいで）\n• わりに＝ → so với, tương đối so với（年齢のわりに、非常に体力がある）\n• ところに＝ → vào lúc, đúng khi（忙しいところに）\n• あげく＝ → cuối cùng, rốt cuộc (sau nhiều việc)（悩んだあげく）", "65_6": "💡 Mẹo phân biệt 利益・損失・成果・調和:\n• 利益＝ → lợi ích（利益を得る）\n• 損失＝ → tổn thất（損失を出す）\n• 成果＝ → thành quả（研究成果）\n• 調和＝ → hài hòa, cân bằng（常に全体の調和を考えて行動する）", "65_7": "💡 Mẹo phân biệt 応え・報い・答え・従い:\n• 応え＝ → đáp lại, đáp ứng（周囲の期待に応えようと努力している）\n• 報い＝ → báo đáp, đền đáp（恩に報いる）\n• 答え＝ → câu trả lời（問題の答え）\n• 従い＝ → tuân theo（指示に従う）", "65_8": "💡 Mẹo phân biệt 隠して・無視して・直視して・凝視して:\n• 隠して＝ → che giấu（本音を隠す）\n• 無視して＝ → phớt lờ, bỏ qua（警告を無視する）\n• 直視して＝ → nhìn thẳng vào, đối mặt trực tiếp（自分の弱さを直視して、克服しようと努力した）\n• 凝視して＝ → nhìn chằm chằm（画面を凝視する）", "65_9": "💡 Mẹo phân biệt 反対する・賛同する・否定する・拒否する:\n• 反対する＝ → phản đối（計画に反対する）\n• 賛同する＝ → tán đồng, đồng tình（全面的に賛同することはできない）\n• 否定する＝ → phủ định（事実を否定する）\n• 拒否する＝ → từ chối（要求を拒否する）", "65_10": "💡 Mẹo phân biệt 緩やかに・微妙に・わずかに・急激に:\n• 緩やかに＝ → một cách chậm rãi, từ từ（緩やかに増える）\n• 微妙に＝ → tinh tế, khó nói rõ（微妙に違う）\n• わずかに＝ → một chút, ít ỏi（わずかに増える）\n• 急激に＝ → đột ngột, mạnh mẽ và nhanh（ここ数年で急激に増加している）", "66_0": "💡 Mẹo phân biệt 円満・曖昧・婉曲・率直:\n• 円満＝ → êm đẹp, hòa thuận（円満に解決する）\n• 曖昧＝ → mập mờ, mơ hồ（曖昧な返事）\n• 婉曲＝ → vòng vo, tế nhị (nói tránh)（婉曲に断る）\n• 率直＝ → thẳng thắn, thành thật（包み隠さず率直に説明した）", "66_1": "💡 Mẹo phân biệt 散漫・整然・漠然・雑然:\n• 散漫＝ → tản mạn, thiếu tập trung（注意が散漫になる）\n• 整然＝ → trật tự, ngăn nắp（内容が整然としていて理解しやすい）\n• 漠然＝ → mơ hồ, mông lung（漠然とした不安）\n• 雑然＝ → lộn xộn, hỗn tạp（雑然とした部屋）", "66_2": "💡 Mẹo phân biệt 気楽・手軽・真摯・気軽:\n• 気楽＝ → thoải mái, không lo lắng（気楽に構える）\n• 手軽＝ → dễ dàng, tiện lợi（手軽にできる）\n• 真摯＝ → chân thành, nghiêm túc（患者一人一人に真摯に向き合っている）\n• 気軽＝ → thoải mái, không câu nệ（気軽に頼む）", "66_3": "💡 Mẹo phân biệt 障害・被害・損害・危害:\n• 障害＝ → trở ngại, chướng ngại（実行するには多くの障害が予想される）\n• 被害＝ → thiệt hại (bị nhận)（台風の被害）\n• 損害＝ → tổn thất, thiệt hại（損害を与える）\n• 危害＝ → gây nguy hại（危害を加える）", "66_4": "💡 Mẹo phân biệt 強引・頑固・誠心誠意・自暴自棄:\n• 強引＝ → cưỡng ép（強引に進める）\n• 頑固＝ → cố chấp, ương ngạnh（頑固な性格）\n• 誠心誠意＝ → một cách chân thành tận tâm（誠心誠意に謝罪した）\n• 自暴自棄＝ → tự bạo tự khí, tuyệt vọng buông xuôi（自暴自棄になる）", "66_5": "💡 Mẹo phân biệt 徐々に・着実に・次第に・一変:\n• 徐々に＝ → dần dần, từ từ（徐々に増える）\n• 着実に＝ → chắc chắn từng bước（着実に成長する）\n• 次第に＝ → dần dần（次第に暗くなる）\n• 一変＝ → thay đổi hoàn toàn, đột biến（経営方針が一変したため、社員が戸惑っている）", "66_6": "💡 Mẹo phân biệt 浮足立った・毅然・唖然・騒然:\n• 浮足立った＝ → lung lay, hoảng loạn muốn bỏ chạy（浮足立つ）\n• 毅然＝ → kiên định, cứng rắn（常に毅然とした態度を崩さない）\n• 唖然＝ → sững sờ, ngỡ ngàng（唖然とする）\n• 騒然＝ → ồn ào, náo động（会場が騒然となる）", "66_7": "💡 Mẹo phân biệt 厳格・温厚・寛大・柔軟:\n• 厳格＝ → nghiêm khắc, chặt chẽ（伝統行事が今も厳格と守られている）\n• 温厚＝ → ôn hòa, hiền hậu（温厚な人柄）\n• 寛大＝ → khoan dung, độ lượng（寛大な処分）\n• 柔軟＝ → linh hoạt, mềm dẻo（柔軟な考え方）", "66_8": "💡 Mẹo phân biệt 外した・見失った・押さえた・取り違えた:\n• 外した＝ → trật, lệch khỏi mục tiêu（的を外す）\n• 見失った＝ → lạc mất, không tìm thấy（目標を見失う）\n• 押さえた＝ → nắm bắt được (điểm chính)（要点を押さえたものだった）\n• 取り違えた＝ → nhầm lẫn, hiểu sai（意味を取り違える）", "66_9": "💡 Mẹo phân biệt 半ば・わずかに・一時的に・終始一貫:\n• 半ば＝ → một nửa, giữa chừng（半ばあきらめる）\n• わずかに＝ → một chút, ít ỏi（わずかに残る）\n• 一時的に＝ → tạm thời（一時的に休止）\n• 終始一貫＝ → nhất quán từ đầu đến cuối（信念を終始一貫持ち続けた）", "66_10": "💡 Mẹo phân biệt 満足・陶酔・興奮・感激:\n• 満足＝ → hài lòng, thỏa mãn（満足する）\n• 陶酔＝ → say mê, ngây ngất（聴く者すべてを陶酔させるほど素晴らしかった）\n• 興奮＝ → hưng phấn, phấn khích（興奮する）\n• 感激＝ → cảm kích, xúc động sâu sắc（感激する）", "64_11": "💡 Mẹo phân biệt 屈折せず・動じず・染まらず・屈せず:\n• 屈折せず＝ → không bị khúc xạ, không bị lệch（光が屈折する）\n• 動じず＝ → không dao động, không bị ảnh hưởng（プレッシャーに動じず、実力を発揮した）\n• 染まらず＝ → không bị nhuộm, không bị ảnh hưởng（悪に染まる）\n• 屈せず＝ → không khuất phục（圧力に屈する）", "65_11": "💡 Mẹo phân biệt 受けて・従って・押し切って・抑えて:\n• 受けて＝ → nhận lấy（反対を受ける）\n• 従って＝ → tuân theo（指示に従う）\n• 押し切って＝ → bất chấp, gạt bỏ phản đối để làm（周囲の反対を押し切って、自分の道を進んだ）\n• 抑えて＝ → kìm nén, kiềm chế（感情を抑える）", "66_11": "💡 Mẹo phân biệt 超過した・経過した・通過した・超えた:\n• 超過した＝ → vượt quá (số lượng, thời hạn)（予算を超過する）\n• 経過した＝ → trôi qua (thời gian)（時間が経過する）\n• 通過した＝ → đi qua, thông qua（審査を通過する）\n• 超えた＝ → vượt qua, vượt trên（時代を超えた名作として語り継がれている）", "ontap_0": "💡 Mẹo phân biệt 起立・起動・配置・措置:\n• 起立＝ → đứng dậy（起立する）\n• 起動＝ → khởi động (máy móc)（パソコンを起動する）\n• 配置＝ → bố trí nhân sự（人員を配置する必要がある）\n• 措置＝ → biện pháp xử lý（適切な措置）", "ontap_1": "💡 Mẹo phân biệt 移動・移植・転移・推移:\n• 移動＝ → di chuyển（移動する）\n• 移植＝ → cấy ghép（臓器移植）\n• 転移＝ → di căn, chuyển dịch（がんの転移）\n• 推移＝ → diễn biến theo thời gian（状況の推移を見守ることにした）", "ontap_2": "💡 Mẹo phân biệt 夜勤・夜分・日夜・深夜:\n• 夜勤＝ → làm ca đêm（夜勤をする）\n• 夜分＝ → ban đêm (cách nói lịch sự)（夜分遅く）\n• 日夜＝ → ngày đêm, không ngừng（ガンの治療のため日夜研究に励んでいる）\n• 深夜＝ → đêm khuya（深夜まで働く）", "ontap_3": "💡 Mẹo phân biệt 図示・図解・絵図・意図:\n• 図示＝ → chỉ ra bằng hình vẽ（図示する）\n• 図解＝ → giải thích bằng hình（図解する）\n• 絵図＝ → bản vẽ, sơ đồ（絵図を描く）\n• 意図＝ → ý đồ, chủ ý（彼の話は何を意図しているのかつかめなかった）", "ontap_4": "💡 Mẹo phân biệt 固執・固有・誇張・誇示:\n• 固執＝ → cố chấp, khăng khăng（あまり細かいことに固執すると全体が見えなくなる）\n• 固有＝ → đặc trưng riêng（固有の文化）\n• 誇張＝ → phóng đại（誇張して話す）\n• 誇示＝ → khoe khoang, phô trương（力を誇示する）", "ontap_5": "💡 Mẹo phân biệt 余地・余剰・余談・余白:\n• 余地＝ → chỗ trống, dư địa（余地がある）\n• 余剰＝ → dư thừa（余剰人員）\n• 余談＝ → chuyện ngoài lề（余談だが）\n• 余白＝ → khoảng trắng, lề giấy（ノートの余白にメモをしておいた）", "ontap_6": "💡 Mẹo phân biệt 協力・助長・支援・是正:\n• 協力＝ → hợp tác（協力する）\n• 助長＝ → thúc đẩy, làm trầm trọng thêm (điều xấu)（差別を助長することになりかねない）\n• 支援＝ → hỗ trợ（支援する）\n• 是正＝ → sửa chữa cho đúng（是正する）", "ontap_7": "💡 Mẹo phân biệt 損害・中止・阻害・阻止:\n• 損害＝ → thiệt hại（損害を与える）\n• 中止＝ → hủy bỏ, dừng lại（中止する）\n• 阻害＝ → cản trở（発展を阻害する）\n• 阻止＝ → ngăn chặn（法の改悪を阻止するため多くの人が署名した）", "ontap_8": "💡 Mẹo phân biệt 遮断・切断・屈折・曲折:\n• 遮断＝ → chặn đứng, cách ly（厚いカーテンで光を遮断した）\n• 切断＝ → cắt đứt（回線を切断する）\n• 屈折＝ → khúc xạ（光が屈折する）\n• 曲折＝ → khúc khuỷu, phức tạp（紆余曲折）", "ontap_9": "💡 Mẹo phân biệt 心労・心外・心中・心境:\n• 心労＝ → lo lắng mệt mỏi（心労がたたる）\n• 心外＝ → chua xót, bị xúc phạm ngoài ý muốn（同僚に疑われるとは心外だ）\n• 心中＝ → trong lòng / cùng chết（心中を明かす）\n• 心境＝ → tâm trạng（複雑な心境）", "ontap_10": "💡 Mẹo phân biệt 少数・一時・瞬間・若干:\n• 少数＝ → số ít（少数派）\n• 一時＝ → tạm thời, nhất thời（一時的に）\n• 瞬間＝ → khoảnh khắc（瞬間的に）\n• 若干＝ → một chút, hơi（正確な時計も若干遅れるようになった）", "ontap_11": "💡 Mẹo phân biệt 才能・本能・本気・本質:\n• 才能＝ → tài năng（才能がある）\n• 本能＝ → bản năng（生まれつきの本能が備わっている）\n• 本気＝ → nghiêm túc, thật lòng（本気で取り組む）\n• 本質＝ → bản chất（本質を見抜く）", "ontap_12": "💡 Mẹo phân biệt 参拝・参照・参上・降参:\n• 参拝＝ → đi lễ chùa/đền（神社に参拝する）\n• 参照＝ → tham khảo（資料を参照する）\n• 参上＝ → đến thăm bề trên (khiêm nhường)（参上する）\n• 降参＝ → chịu thua, đầu hàng（正解がわからなかったので降参して教えてもらった）", "ontap_13": "💡 Mẹo phân biệt 復旧・復元・旧来・元来:\n• 復旧＝ → khôi phục trạng thái cũ（道路が復旧する）\n• 復元＝ → phục dựng, phục hồi nguyên trạng（約1万年前の生活が復元された）\n• 旧来＝ → từ trước đến nay, cũ（旧来の方法）\n• 元来＝ → vốn dĩ, nguyên bản（元来の性格）", "ontap_14": "💡 Mẹo phân biệt 弁論・弁解・勘弁・詭弁:\n• 弁論＝ → biện luận（弁論大会）\n• 弁解＝ → biện hộ, bào chữa（約束が守れず、弁解ばかりしている）\n• 勘弁＝ → tha thứ, bỏ qua（勘弁してください）\n• 詭弁＝ → ngụy biện（詭弁を弄する）", "ontap_15": "💡 Mẹo phân biệt 変革・変装・変遷・変異:\n• 変革＝ → cải cách lớn（社会変革）\n• 変装＝ → cải trang（変装する）\n• 変遷＝ → biến thiên, thay đổi theo thời gian（時代の変遷とともに、流行も移り変わる）\n• 変異＝ → biến dị, đột biến（遺伝子変異）", "ontap_16": "💡 Mẹo phân biệt 判定・判明・判決・審判:\n• 判定＝ → phán định, phân xử（判定する）\n• 判明＝ → được làm rõ, sáng tỏ（事件の犯人であることが判明した）\n• 判決＝ → phán quyết (tòa án)（判決が下る）\n• 審判＝ → trọng tài, phán xét（審判を下す）", "ontap_17": "💡 Mẹo phân biệt 短縮・長短・担任・分担:\n• 短縮＝ → rút ngắn（残業時間を短縮できる）\n• 長短＝ → dài ngắn / ưu nhược điểm（長短を比べる）\n• 担任＝ → chủ nhiệm (lớp)（担任の先生）\n• 分担＝ → chia nhau đảm nhiệm（仕事を分担する）", "ontap_18": "💡 Mẹo phân biệt 追及・追放・追従・追突:\n• 追及＝ → truy cứu, chất vấn gắt gao（大企業の社会的責任を追及した）\n• 追放＝ → trục xuất, loại bỏ（組織から追放する）\n• 追従＝ → phụ họa, đi theo mù quáng（追従する）\n• 追突＝ → đâm từ phía sau (tai nạn)（追突事故）", "ontap_19": "💡 Mẹo phân biệt 適当・該当・合成・整形:\n• 適当＝ → phù hợp / cẩu thả（適当に選ぶ）\n• 該当＝ → thuộc diện, đúng với điều kiện（犯人の特徴に該当する人物は、捜査線上に挙がらなかった）\n• 合成＝ → tổng hợp, ghép（合成する）\n• 整形＝ → chỉnh hình, phẫu thuật thẩm mỹ（整形手術）", "ontap_20": "💡 Mẹo phân biệt 施行・現行・連行・運行:\n• 施行＝ → thi hành (luật)（法律が施行される）\n• 現行＝ → hiện hành（現行制度）\n• 連行＝ → áp giải, dẫn giải（警察に連行される）\n• 運行＝ → vận hành (tàu xe theo lịch trình)（中央線は通常通り運行しております）", "ontap_21": "💡 Mẹo phân biệt 流行・流用・流通・流出:\n• 流行＝ → thịnh hành, mốt（流行する）\n• 流用＝ → dùng sai mục đích, chuyển dùng（予算を流用する）\n• 流通＝ → lưu thông (hàng hóa)（日本全国に商品の流通網が敷かれている）\n• 流出＝ → rò rỉ, chảy ra ngoài（情報が流出する）", "ontap_22": "💡 Mẹo phân biệt 復帰・復旧・回復・重複:\n• 復帰＝ → trở lại (vị trí, trạng thái cũ)（職場に復帰する）\n• 復旧＝ → khôi phục (cơ sở hạ tầng)（通行止めになった道路の復旧が急がれる）\n• 回復＝ → hồi phục（体力を回復する）\n• 重複＝ → trùng lặp（重複する）", "ontap_23": "💡 Mẹo phân biệt 普及・普遍・追及・追放:\n• 普及＝ → phổ cập, phổ biến（太陽光発電の普及を推進している）\n• 普遍＝ → phổ quát, phổ biến (tính chất)（普遍的な真理）\n• 追及＝ → truy cứu（責任を追及する）\n• 追放＝ → trục xuất（組織から追放する）", "ontap_24": "💡 Mẹo phân biệt 調和・調合・調整・調停:\n• 調和＝ → hài hòa（自然環境と調和のとれた農業生産活動）\n• 調合＝ → pha chế, phối trộn（薬を調合する）\n• 調整＝ → điều chỉnh（日程を調整する）\n• 調停＝ → hòa giải, dàn xếp（調停する）", "ontap_25": "💡 Mẹo phân biệt 誠実・正気・真正・正体:\n• 誠実＝ → thành thật, chân thành（誠実な人）\n• 正気＝ → tỉnh táo, ý thức bình thường（正気に戻る）\n• 真正＝ → chân chính, thật sự（真正な品）\n• 正体＝ → bộ mặt thật, danh tính thật（ついに事件の黒幕が正体を現した）", "ontap_26": "💡 Mẹo phân biệt 抗戦・挑戦・攻撃・征服:\n• 抗戦＝ → kháng chiến（徹底抗戦）\n• 挑戦＝ → thử thách, thách thức（何にでも遠慮せず挑戦したいものだ）\n• 攻撃＝ → tấn công（攻撃する）\n• 征服＝ → chinh phục（山を征服する）", "ontap_27": "💡 Mẹo phân biệt 目録・収録・付録・登録:\n• 目録＝ → danh mục（目録を作る）\n• 収録＝ → thu âm, thu hình（このテレビ番組は10年前に収録されたものだ）\n• 付録＝ → phụ lục, tặng kèm（雑誌の付録）\n• 登録＝ → đăng ký（会員登録）", "ontap_28": "💡 Mẹo phân biệt 突如・突発・突破・突撃:\n• 突如＝ → bất thình lình, đột nhiên（若者に人気のバンドが突如解散を発表した）\n• 突発＝ → đột phát, xảy ra bất ngờ（突発事故）\n• 突破＝ → vượt qua, đột phá（難関を突破する）\n• 突撃＝ → xung kích, xông vào（突撃する）", "ontap_29": "💡 Mẹo phân biệt 気絶・謝絶・絶縁・絶望:\n• 気絶＝ → ngất xỉu（気絶する）\n• 謝絶＝ → khước từ lịch sự（面会謝絶）\n• 絶縁＝ → cắt đứt quan hệ / cách điện（絶縁状態）\n• 絶望＝ → tuyệt vọng（人生に絶望し自殺を図った）", "ontap_30": "💡 Mẹo phân biệt つかんだ・ひねった・めくった・つねった:\n• つかんだ＝ → nắm, cầm chặt（手をつかむ）\n• ひねった＝ → vặn, xoay（栓をひねる）\n• めくった＝ → lật (trang sách)（本を読みながら静かにページをめくった）\n• つねった＝ → véo, nhéo（腕をつねる）", "ontap_31": "💡 Mẹo phân biệt 廃れて・投げて・除いて・薄れて:\n• 廃れて＝ → lỗi thời, bị bỏ rơi（はやってもすぐに廃れてしまう）\n• 投げて＝ → ném（ボールを投げる）\n• 除いて＝ → loại trừ, bỏ đi（例外を除く）\n• 薄れて＝ → phai nhạt dần（記憶が薄れる）", "ontap_32": "💡 Mẹo phân biệt 増え・肥え・膨れ・腫れ:\n• 増え＝ → tăng lên（人口が増える）\n• 肥え＝ → béo, màu mỡ（土地が肥える）\n• 膨れ＝ → phình to, sưng lên（人口は急に膨れ上がった）\n• 腫れ＝ → sưng tấy（顔が腫れる）", "ontap_33": "💡 Mẹo phân biệt 落ちこむ・とまどう・うらやむ・あなどる:\n• 落ちこむ＝ → chán nản, buồn bã（落ちこむ）\n• とまどう＝ → bối rối, lúng túng（いきなり名前を呼ばれたら、とまどうのも無理はない）\n• うらやむ＝ → ghen tị, ganh tị（成功をうらやむ）\n• あなどる＝ → coi thường, khinh thường（相手をあなどる）", "ontap_34": "💡 Mẹo phân biệt 曲げて・伸ばして・据えて・掛けて:\n• 曲げて＝ → bẻ cong（腰を曲げる）\n• 伸ばして＝ → kéo dài, duỗi ra（手を伸ばす）\n• 据えて＝ → ổn định, tập trung vào (làm việc)（この問題には腰を据えて取り組むべきだ）\n• 掛けて＝ → ngồi xuống / móc vào（椅子に腰掛ける）", "ontap_35": "💡 Mẹo phân biệt しぼる・つのる・つちかう・きそう:\n• しぼる＝ → vắt, ép ra（タオルをしぼる）\n• つのる＝ → kêu gọi, chiêu mộ（参加者をつのる）\n• つちかう＝ → nuôi dưỡng, bồi đắp (theo thời gian)（協調性をつちかうためのものです）\n• きそう＝ → cạnh tranh, đua nhau（互いにきそう）", "ontap_36": "💡 Mẹo phân biệt 割って・割いて・分けて・切って:\n• 割って＝ → đập vỡ, chia (bằng cách đập)（皿を割る）\n• 割いて＝ → dành ra, trích ra (thời gian, tiền bạc)（わざわざ時間を割いてくれた）\n• 分けて＝ → chia ra（半分に分ける）\n• 切って＝ → cắt（紙を切る）", "ontap_37": "💡 Mẹo phân biệt うらぎる・いつわる・しいたげる・あざむく:\n• うらぎる＝ → phản bội（友人をうらぎる）\n• いつわる＝ → giả dối, nói dối（身分をいつわる）\n• しいたげる＝ → áp bức, ngược đãi（民衆をしいたげる）\n• あざむく＝ → lừa gạt khéo léo（敵をあざむくために、油断しているふうに装った）", "ontap_38": "💡 Mẹo phân biệt めぐっている・からんでいる・ねばっている・つらなっている:\n• めぐっている＝ → xoay quanh, luân chuyển（話題をめぐって）\n• からんでいる＝ → dính líu, liên quan phức tạp（闇の組織がからんでいるとうわさされている）\n• ねばっている＝ → kiên trì, bền bỉ（最後までねばる）\n• つらなっている＝ → nối tiếp thành hàng（山々がつらなる）", "ontap_39": "💡 Mẹo phân biệt こめる・とざす・つつしむ・つぐむ:\n• こめる＝ → gửi gắm (tâm tư)（気持ちをこめる）\n• とざす＝ → đóng chặt, khép kín（心をとざす）\n• つつしむ＝ → thận trọng, kiềm chế lời nói（失礼のないように、言葉をつつしむべきだ）\n• つぐむ＝ → im lặng, ngậm miệng（口をつぐむ）", "ontap_40": "💡 Mẹo phân biệt 下す・みだす・荒らす・けなす:\n• 下す＝ → đưa ra (quyết định, mệnh lệnh)（判断を下す）\n• みだす＝ → làm rối loạn（秩序をみだす）\n• 荒らす＝ → phá phách, tàn phá（畑を荒らす）\n• けなす＝ → chê bai, nói xấu（褒めることよりけなすことの方が得意）", "ontap_41": "💡 Mẹo phân biệt はんぱな・うやむやな・きちょうめんな・あやふやな:\n• はんぱな＝ → nửa vời, dở dang（はんぱな仕事）\n• うやむやな＝ → mập mờ, không rõ ràng（うやむやにする）\n• きちょうめんな＝ → tỉ mỉ, chỉn chu, kỹ tính（きちょうめんな彼は時間にも正確で、約束は必ず守る）\n• あやふやな＝ → mơ hồ, không chắc chắn（あやふやな返事）", "ontap_42": "💡 Mẹo phân biệt しとやかな・したたかな・しなやかな・太っ腹な:\n• しとやかな＝ → thanh lịch, dịu dàng (thường tả nữ)（しとやかな女性）\n• したたかな＝ → lì lợm, khôn khéo mưu mẹo, khó bị đánh bại（失敗を利用して成功に結び付ける、したたかな男だ）\n• しなやかな＝ → mềm mại, uyển chuyển（しなやかな体）\n• 太っ腹な＝ → hào phóng, rộng lượng（太っ腹な人）", "ontap_43": "💡 Mẹo phân biệt すみやか・ひたむき・ぺらぺら・せっかち:\n• すみやか＝ → nhanh chóng（すみやかに対応する）\n• ひたむき＝ → chuyên tâm, hết lòng（ひたむきな努力）\n• ぺらぺら＝ → lưu loát (ngoại ngữ) / mỏng manh（英語がぺらぺら）\n• せっかち＝ → nóng vội, thiếu kiên nhẫn（非常にせっかちで、他人の話を最後まで聞かない）", "ontap_44": "💡 Mẹo phân biệt 無差別な・無愛想な・不得意な・不本意な:\n• 無差別な＝ → vô phân biệt（無差別攻撃）\n• 無愛想な＝ → lạnh lùng, không thân thiện（無愛想な店員）\n• 不得意な＝ → không giỏi, kém（不得意な科目）\n• 不本意な＝ → trái ý muốn, không như mong đợi（転職という不本意な結果に至っても後悔はしなかった）", "ontap_45": "💡 Mẹo phân biệt 旺盛・繁盛・強大・壮大:\n• 旺盛＝ → sung mãn, mạnh mẽ（食欲が旺盛な彼は、一度に3杯もお代わりする）\n• 繁盛＝ → buôn bán phát đạt（商売繁盛）\n• 強大＝ → hùng mạnh（強大な国）\n• 壮大＝ → hùng vĩ, hoành tráng（壮大な計画）", "ontap_46": "💡 Mẹo phân biệt 無口な・月並みな・気軽な・内気な:\n• 無口な＝ → ít nói（無口な人）\n• 月並みな＝ → sáo rỗng, tầm thường（月並みなことしか言えませんが、頑張ってください）\n• 気軽な＝ → thoải mái, không câu nệ（気軽に頼む）\n• 内気な＝ → nhút nhát, rụt rè（内気な性格）", "ontap_47": "💡 Mẹo phân biệt くっきり・じっくり・きっぱり・さっぱり:\n• くっきり＝ → rõ nét（なぞの人影がくっきりと写っていた）\n• じっくり＝ → kỹ lưỡng, từ tốn（じっくり考える）\n• きっぱり＝ → dứt khoát（きっぱり断る）\n• さっぱり＝ → sảng khoái / hoàn toàn không（さっぱりした味）", "ontap_48": "💡 Mẹo phân biệt ほんのり・やんわり・すんなり・しんみり:\n• ほんのり＝ → nhè nhẹ, thoang thoảng（ほんのり甘い）\n• やんわり＝ → nhẹ nhàng, ôn hòa（やんわり断る）\n• すんなり＝ → suôn sẻ（意外にもすんなり進んで良かった）\n• しんみり＝ → trầm lắng（しんみりする）", "ontap_49": "💡 Mẹo phân biệt あきらめ・つぐない・ならわし・あやまち:\n• あきらめ＝ → sự từ bỏ（あきらめが悪い）\n• つぐない＝ → sự chuộc lỗi, đền bù（罪をつぐなう）\n• ならわし＝ → phong tục, tập quán（地域のならわし）\n• あやまち＝ → sai lầm, lỗi lầm（同じあやまちを二度と繰り返さぬように注意した）", "ontap_50": "💡 Mẹo phân biệt 甘え・支え・足し・借り:\n• 甘え＝ → sự nũng nịu, ỷ lại（甘えが出る）\n• 支え＝ → sự nâng đỡ, chỗ dựa（苦境に立たされた彼には家族の支えが必要だった）\n• 足し＝ → phần bù thêm（生活の足しにする）\n• 借り＝ → khoản vay / ơn nghĩa（借りを返す）", "ontap_51": "💡 Mẹo phân biệt やりくり・からくり・ふるまい・いきさつ:\n• やりくり＝ → xoay sở, thu xếp (tiền bạc, thời gian)（家計をやりくりする）\n• からくり＝ → cơ chế, mưu kế bên trong（からくり人形）\n• ふるまい＝ → hành vi, cử chỉ（上品なふるまい）\n• いきさつ＝ → diễn biến, đầu đuôi sự việc（二人が別れるに至ったいきさつを教えてもらった）", "ontap_52": "💡 Mẹo phân biệt 行い・扱い・切り・断り:\n• 行い＝ → hành động, việc làm（日頃の行い）\n• 扱い＝ → cách đối xử, xử lý（丁寧な扱い）\n• 切り＝ → chỗ ngắt, điểm dừng（仕事は切りのいいところで終わりにした）\n• 断り＝ → sự từ chối / xin phép（断りを入れる）", "ontap_53": "💡 Mẹo phân biệt まなざし・おなじみ・おざなり・おしまい:\n• まなざし＝ → ánh mắt, cái nhìn（優しいまなざし）\n• おなじみ＝ → quen thuộc（テレビでおなじみのアナウンサーが急死した）\n• おざなり＝ → qua loa, đối phó（おざなりな対応）\n• おしまい＝ → kết thúc, hết（これでおしまい）", "ontap_54": "💡 Mẹo phân biệt データ・フォーム・ブーム・ケース:\n• データ＝ → dữ liệu（データを集める）\n• フォーム＝ → biểu mẫu, hình thức（申込フォーム）\n• ブーム＝ → trào lưu, cơn sốt（ブームが起こる）\n• ケース＝ → trường hợp, ca（偶然が重なった非常にまれなケースである）", "ontap_55": "💡 Mẹo phân biệt ギャップ・ネック・ビッグ・ロング:\n• ギャップ＝ → khoảng cách, sự chênh lệch（理想と現実のギャップに驚き、悩む）\n• ネック＝ → trở ngại, nút thắt（コストがネックになる）\n• ビッグ＝ → to lớn（ビッグニュース）\n• ロング＝ → dài（ロングヘア）", "ontap_56": "💡 Mẹo phân biệt キャラクター・ガイダンス・コマーシャル・プロフィール:\n• キャラクター＝ → nhân vật, tính cách（キャラクターが濃い）\n• ガイダンス＝ → hướng dẫn, chỉ dẫn（新入生ガイダンス）\n• コマーシャル＝ → quảng cáo (TV)（テレビコマーシャル）\n• プロフィール＝ → hồ sơ cá nhân, tiểu sử（自己紹介として簡単なプロフィールを載せた）", "ontap_57": "💡 Mẹo phân biệt マネージャー・アプローチ・リハーサル・エピソード:\n• マネージャー＝ → quản lý（マネージャーを務める）\n• アプローチ＝ → tiếp cận, phương pháp（アプローチする）\n• リハーサル＝ → buổi tổng duyệt, tập dượt（本番前に入念なリハーサルが行われた）\n• エピソード＝ → giai thoại, câu chuyện nhỏ（面白いエピソード）", "ontap_58": "💡 Mẹo phân biệt 音・味・香・臭:\n• 音＝ → âm thanh（音楽）\n• 味＝ → vị, sắc thái, cảm giác thật（彼の話は真実味に欠けていた）\n• 香＝ → hương thơm（香水）\n• 臭＝ → mùi hôi（悪臭）", "ontap_59": "💡 Mẹo phân biệt 現ホテル・自ホテル・本ホテル・当ホテル:\n• 現ホテル＝ → khách sạn hiện tại（現時点）\n• 自ホテル＝ → khách sạn của mình (cách nói không tự nhiên)（自社）\n• 本ホテル＝ → khách sạn này (văn viết trang trọng)（本製品）\n• 当ホテル＝ → khách sạn chúng tôi (cách nói lịch sự, khiêm tốn)（お客様に当ホテルのご案内をさせていただきます）"};
/* ===== DATA_MARKER_END ===== */

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildRound(round){
  const qs = DATA[String(round)] || [];
  document.getElementById('hdr-round').textContent = round==='ontap' ? '📝 Ôn tập tổng hợp' : '第'+round+'回';
  if(qs.length===0){
    document.getElementById('main').innerHTML = '<div style="padding:40px;text-align:center;color:#888;">⚠️ Đợt này đang được cập nhật.</div>';
    return;
  }
  let html = '';
  qs.forEach((q, qi)=>{
    const ansIdx = q.a - 1;
    const qid = 'q'+round+'x'+qi;
    const sentBlank = esc(q.s).replace('（　）','<span class="blank" id="blank_'+qid+'">（　　）</span>');
    const choicesHtml = q.w.map((w,i)=>`
      <div class="choice" id="ch_${qid}_${i}" onclick="pick('${qid}',${i},${ansIdx},'${round}',${qi})">
        <div class="c-num">${i+1}</div>
        <div style="flex:1"><span class="c-kanji">${esc(w.k)}</span><span class="c-kana">${esc(w.r)}</span></div>
        <button class="speak-btn" onclick="event.stopPropagation();spk('${round}',${qi},${i},this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
      </div>`).join('');
    const order = [ansIdx, ...q.w.map((_,i)=>i).filter(i=>i!==ansIdx)];
    let analysisHtml = '';
    order.forEach(i=>{
      const w = q.w[i];
      const isC = i===ansIdx;
      const setJpParts = (w.set||'').split('・');
      const setvParts = (w.setv||'').split('·').map(s=>s.trim());
      const setRows = setJpParts.map((p,pi)=>`<div class="set-row"><span class="set-jp">${p}</span>${setvParts[pi]?'<span class="set-vn">— '+esc(setvParts[pi])+'</span>':''}</div>`).join('');
      analysisHtml += `<div class="ans-card ${isC?'correct':'wrong'}">
        <div class="ans-title">
          <div class="ans-num">${i+1}</div>
          <div class="ans-kanji">${esc(w.k)}</div>
          <div class="ans-kana">《${esc(w.r)}》</div>
          <div class="ans-hv">${esc(w.hv||'')}</div>
          ${isC?'<div class="ans-badge">✓ 正解</div>':''}
          <button class="speak-btn" onclick="spk(${round},${qi},${i},this)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
        </div>
        <div class="ans-body">
          <div class="ans-section"><div class="ans-lbl">意味（日本語）</div><div class="ans-val">${esc(w.j||'')}</div></div>
          <div class="ans-section"><div class="ans-lbl">Nghĩa tiếng Việt</div><div class="ans-val" style="color:var(--blue);font-weight:600;">${esc(w.v||'')}</div></div>
        </div>
        ${w.syn ? `<div class="syn-section"><div class="syn-lbl">🔄 Từ đồng nghĩa</div><div class="syn-val"><span class="syn-jp">${esc(w.syn)}</span>${w.synr?' 《'+esc(w.synr)+'》':''} <span class="syn-vn">— ${esc(w.synv||'')}</span></div></div>` : ''}
        <div class="set-label">🔗 Set cụm từ</div>
        ${setRows}
      </div>`;
    });

    const tipKey = round+'_'+qi;
    const tipText = TIPS[tipKey] || '';
    const tipHtml = tipText ? `<div class="tip-box" id="tip_${qid}">
        <div class="tip-title">💡 Mẹo phân biệt</div>
        <div class="tip-content">${esc(tipText)}</div>
      </div>` : '';

    html += `<div class="q-block" id="${qid}">
      <div class="q-head">
        <div class="q-num">問 ${qi+1} / ${qs.length}　[${round==='ontap'?'Ôn tập tổng hợp':'第'+round+'回'}]</div>
        <div class="q-sent-wrap">
          <div class="q-sent" id="sent_${qid}">${sentBlank}</div>
          <button class="speak-btn" onclick="spkSent('${round}',${qi},this)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </button>
        </div>
        <div class="q-sv-hint" id="hint_${qid}">🔒 Chọn đáp án để xem bản dịch câu và mẹo phân biệt</div>
        <div class="q-sv" id="sv_${qid}">${esc(q.sv||'')}</div>
      </div>
      <div class="choices-wrap" id="choices_${qid}">${choicesHtml}</div>
      <div class="feedback" id="fb_${qid}"></div>
      ${tipHtml}
      <div class="analysis-panel" id="analysis_${qid}">${analysisHtml}</div>
    </div>`;
  });
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
}

function pick(qid, chosen, ansIdx, round, qi){
  const choicesWrap = document.getElementById('choices_'+qid);
  choicesWrap.querySelectorAll('.choice').forEach(c=>{c.classList.add('disabled');c.onclick=null;});
  const isCorrect = chosen === ansIdx;
  const corrEl = document.getElementById('ch_'+qid+'_'+ansIdx);
  if(corrEl) corrEl.classList.add(isCorrect?'correct':'reveal-correct');
  if(!isCorrect){
    const wrongEl = document.getElementById('ch_'+qid+'_'+chosen);
    if(wrongEl) wrongEl.classList.add('wrong-pick');
  }
  const blankEl = document.getElementById('blank_'+qid);
  const q = DATA[String(round)][qi];
  const correctW = q.w[ansIdx];
  if(blankEl){ blankEl.outerHTML = '<span class="filled">（'+esc(correctW.k)+'）</span>'; }

  // Hiện bản dịch câu + mẹo phân biệt sau khi chọn đáp án
  const svEl = document.getElementById('sv_'+qid);
  const hintEl = document.getElementById('hint_'+qid);
  const tipEl = document.getElementById('tip_'+qid);
  if(svEl) svEl.classList.add('show');
  if(hintEl) hintEl.classList.add('hidden');
  if(tipEl) tipEl.classList.add('show');

  const fb = document.getElementById('fb_'+qid);
  if(isCorrect){
    fb.className='feedback correct';
    fb.innerHTML='✓ Chính xác！<span class="fb-meaning">📖 '+esc(correctW.v)+'</span>';
  } else {
    fb.className='feedback wrong';
    fb.innerHTML='✗ Sai rồi！Đáp án: <strong>'+esc(correctW.k)+'（'+esc(correctW.r)+'）</strong><span class="fb-meaning">📖 '+esc(correctW.v)+'</span>';
  }
  const ap = document.getElementById('analysis_'+qid);
  if(ap) ap.classList.add('show');
}

function doSearch(){
  const kw = document.getElementById('searchInput').value.trim();
  const resultsBox = document.getElementById('searchResults');
  if(!kw){ resultsBox.style.display='none'; return; }
  const kwLower = kw.toLowerCase();
  let results = [];
  Object.keys(DATA).forEach(round=>{
    DATA[round].forEach((q, qi)=>{
      q.w.forEach((w,wi)=>{
        if((w.k && w.k.includes(kw)) || (w.r && w.r.includes(kw)) || (w.v && w.v.toLowerCase().includes(kwLower))){
          results.push({round, qi, w, sent:q.s});
        }
      });
    });
  });
  if(results.length===0){
    resultsBox.innerHTML = '<div class="search-empty">Không tìm thấy「'+esc(kw)+'」trong các đợt đã có dữ liệu.</div>';
    resultsBox.style.display='block';
    return;
  }
  resultsBox.innerHTML = results.slice(0,30).map(r=>`
    <div class="search-result-item" onclick="jumpToQuestion('${r.round}',${r.qi})">
      <span class="sr-round">${r.round==='ontap'?'Ôn tập':'第'+r.round+'回'}</span>
      <span class="sr-kanji">${esc(r.w.k)}</span>
      <span class="sr-kana">${esc(r.w.r)}</span>
      <span class="sr-sent">${esc(r.sent.replace('（　）','（…）'))}</span>
    </div>`).join('');
  resultsBox.style.display='block';
}

function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').style.display='none';
}

function jumpToQuestion(round, qi){
  document.querySelectorAll('.fbtn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim()==='第'+round+'回');
  });
  buildRound(round);
  document.getElementById('searchResults').style.display='none';
  setTimeout(()=>{
    const el = document.getElementById('q'+round+'x'+qi);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.style.transition='box-shadow .3s';
      el.style.boxShadow='0 0 0 4px #ffca28';
      setTimeout(()=>{ el.style.boxShadow=''; }, 2000);
    }
  }, 80);
}

function setRound(r, btn){
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildRound(r);
}

function spk(round, qi, wi, btn){ doSpeak(DATA[String(round)][qi].w[wi].k, btn); }
function spkSent(round, qi, btn){ doSpeak(DATA[String(round)][qi].s.replace('（　）',''), btn); }
function doSpeak(text, btn){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b=>b.classList.remove('sp'));
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=.9;
  const v=window.speechSynthesis.getVoices();
  const jv=v.find(x=>x.lang==='ja-JP'||x.lang.startsWith('ja'));
  if(jv)u.voice=jv;
  if(btn) btn.classList.add('sp');
  u.onend=()=>{if(btn)btn.classList.remove('sp');};
  u.onerror=()=>{if(btn)btn.classList.remove('sp');};
  window.speechSynthesis.speak(u);
}
if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
}

buildRound(25);
</script>
