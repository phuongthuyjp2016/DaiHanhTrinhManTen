<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashcard Từ Vựng Đảo 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe0;--card:#fffaf0;--ink:#1a1a1a;--navy:#1f4e79;--line:#9dc0da;--soft:#eaf4fb;--red:#b3402f;--green:#2f7d55;--mut:#7a6a52}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP','Segoe UI',sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.15rem;margin:4px 0 12px;color:var(--navy)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,input,button{font:inherit;font-size:.9rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input{flex:1 1 140px;min-width:0}
button{cursor:pointer;font-weight:700}
button:hover{border-color:var(--navy)}
button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat{font-size:.85rem;color:var(--mut);margin:0 0 10px}
.scene{perspective:1400px}
.card{position:relative;height:min(74vh,560px);min-height:400px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08);overflow:auto}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.back{transform:rotateY(180deg);padding:18px}
.badge{font-size:.72rem;background:var(--soft);color:var(--navy);border:1px solid var(--line);padding:3px 10px;border-radius:20px;font-weight:700}
.big{font-family:'Noto Serif JP',serif;font-size:clamp(2.6rem,12vw,4.6rem);font-weight:700;text-align:center;padding:0 12px;overflow-wrap:anywhere}
.hint{font-size:.78rem;color:var(--mut)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:1px solid #e2d3ae;padding-bottom:10px;margin-bottom:12px}
.head .k{font-family:'Noto Serif JP',serif;font-size:1.7rem;font-weight:700}
.head .r{font-size:1.15rem;font-weight:700;color:var(--navy)}
.head .hv{font-size:.95rem;font-weight:800;color:#5a4bb5;background:#ede9fb;border-radius:6px;padding:2px 9px}
.mean{font-size:1rem;font-weight:600;margin-bottom:12px}
.lab{font-size:.72rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);margin:12px 0 6px}
ul{margin:0;padding:0;list-style:none}
.coll li{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:5px;font-size:.9rem}
.syn{background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.syn .sw{font-weight:700;font-size:1rem}
.syn .sm{font-size:.82rem;color:var(--mut);margin-left:6px}
.syn .sc{font-size:.86rem;margin-top:3px;color:var(--navy)}
.nav{display:flex;gap:8px;margin-top:12px;justify-content:space-between;flex-wrap:wrap}
.nav button{flex:1 1 90px}
.good{color:var(--green)}.bad{color:var(--red)}
.pos{text-align:center;font-size:.85rem;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Flashcard Từ Vựng Đảo 1 — Hán Tự (JLPT N1)</h1>
<div class="bar">
<select id="round"></select>
<input id="q" placeholder="Tìm từ / cách đọc / nghĩa…">
<button id="shuf">Xáo trộn</button>
<button id="unk">Chỉ thẻ chưa nhớ</button>
</div>
<p class="stat" id="stat"></p>
<div class="scene"><div class="card" id="card">
<div class="face front"><span class="badge" id="fb"></span><div class="big" id="fk"></div><div class="hint">Bấm hoặc Space để lật · ←/→ chuyển thẻ</div></div>
<div class="face back" id="back"></div>
</div></div>
<div class="nav">
<button id="prev">← Trước</button>
<button id="no" class="bad">✗ Chưa nhớ</button>
<button id="yes" class="good">✓ Đã nhớ</button>
<button id="next">Sau →</button>
</div>
<div class="pos" id="pos"></div>
</div>
<script>
const DATA=[{"id":0,"round":1,"k":"補助","r":"ほじょ","hv":"BỔ TRỢ","m":"hỗ trợ, trợ giúp","c":["補助金（ほじょきん）— tiền trợ cấp","補助する — hỗ trợ, giúp đỡ","補助輪（ほじょりん）— bánh phụ xe đạp"],"s":[{"h":"支援（しえん）","m":"","p":"支援を求める　／　資金を支援する"},{"h":"援助（えんじょ）","m":"","p":"援助を受ける　／　経済援助"},{"h":"助成（じょせい）","m":"","p":"助成金を申請する　／　研究に助成する"}]},{"id":1,"round":1,"k":"麻痺","r":"まひ","hv":"MA TÝ","m":"tê liệt, bại liệt","c":["神経麻痺（しんけいまひ）— liệt thần kinh","金銭感覚が麻痺する — mất cảm giác về tiền","交通が麻痺する — giao thông tê liệt"],"s":[{"h":"機能不全（きのうふぜん）","m":"","p":"機能不全に陥る　／　臓器の機能不全"},{"h":"停止（ていし）","m":"đình chỉ","p":"活動が停止する　／　運転を停止する"}]},{"id":2,"round":1,"k":"危惧","r":"きぐ","hv":"NGUY CỤ","m":"lo lắng, ngại ngùng","c":["危惧する — lo ngại","危惧の念を抱く — ôm mối lo ngại","懸念と危惧 — lo lắng và ngại ngùng"],"s":[{"h":"懸念（けねん）","m":"","p":"将来を懸念する　／　懸念が高まる"},{"h":"憂慮（ゆうりょ）","m":"","p":"事態を憂慮する　／　憂慮すべき状況"},{"h":"不安（ふあん）","m":"","p":"将来に不安を抱く　／　不安を感じる"}]},{"id":3,"round":1,"k":"起訴","r":"きそ","hv":"KHỞI TỐ","m":"khởi tố, truy tố","c":["～を起訴する — khởi tố ai đó","検察が起訴する — kiểm sát viên truy tố","起訴状（きそじょう）— bản cáo trạng","不起訴（ふきそ）— không truy tố"],"s":[{"h":"告訴（こくそ）","m":"tố cáo (cá nhân)","p":"告訴に踏み切る　／　告訴を取り下げる"},{"h":"訴追（そつい）","m":"truy tố","p":"訴追を受ける　／　訴追される"}]},{"id":4,"round":1,"k":"挙手","r":"きょしゅ","hv":"CỬ THỦ","m":"giơ tay","c":["挙手する — giơ tay","挙手をお願いします — xin hãy giơ tay","挙手で決める — quyết định bằng giơ tay biểu quyết"],"s":[{"h":"手を挙げる（てをあげる）","m":"giơ tay (dạng động từ)","p":"授業で手を挙げる　／　手を挙げて質問する"}]},{"id":5,"round":1,"k":"自負","r":"じふ","hv":"TỰ PHỤ","m":"tự hào về bản thân","c":["才能を自負する — tự hào về tài năng","実力を自負している — tự tin vào thực lực","自負心（じふしん）— lòng tự hào"],"s":[{"h":"自信（じしん）","m":"tự tin","p":"自信を持つ　／　自信を失う"},{"h":"プライド","m":"pride","p":"プライドが高い　／　プライドを傷つける"},{"h":"誇り（ほこり）","m":"niềm tự hào","p":"誇りを持つ　／　誇りに思う"}]},{"id":6,"round":1,"k":"治癒","r":"ちゆ","hv":"TRỊ DU","m":"chữa khỏi, hồi phục","c":["病気が治癒する — bệnh khỏi","自然治癒（しぜんちゆ）— tự khỏi tự nhiên","治癒力（ちゆりょく）— sức hồi phục","治癒率（ちゆりつ）— tỷ lệ chữa khỏi"],"s":[{"h":"回復（かいふく）","m":"hồi phục","p":"病気から回復する　／　景気が回復する"},{"h":"完治（かんち）","m":"chữa khỏi hoàn toàn","p":"完治を目指す　／　完治まで通院する"},{"h":"全快（ぜんかい）","m":"bình phục","p":"全快を祝う　／　全快する"}]},{"id":7,"round":1,"k":"誇示","r":"こじ","hv":"KHỬ THỊ","m":"phô trương, khoe khoang","c":["実力を誇示する — phô trương thực lực","武力を誇示する — phô trương sức mạnh quân sự","権威を誇示する — phô trương quyền lực"],"s":[{"h":"見せびらかす","m":"khoe khoang (khẩu ngữ)","p":"力を見せびらかす　／　新車を見せびらかす"},{"h":"披露（ひろう）する","m":"trình diễn","p":"才能を披露する　／　特技を披露する"},{"h":"アピールする","m":"appeal, khoe","p":"実力をアピールする　／　自己アピール"}]},{"id":8,"round":1,"k":"詐欺","r":"さぎ","hv":"TRÁ KGOẠCH","m":"lừa đảo","c":["詐欺にあう — bị lừa","詐欺を働く — thực hiện hành vi lừa đảo","振り込め詐欺（ふりこめさぎ）— lừa đảo chuyển khoản","詐欺師（さぎし）— kẻ lừa đảo","詐欺罪（さぎざい）— tội lừa đảo"],"s":[{"h":"騙す（だます）","m":"lừa dối","p":"人を騙す　／　騙される"},{"h":"横領（おうりょう）","m":"tham ô","p":"公金を横領する　／　横領の罪"},{"h":"不正（ふせい）","m":"gian lận","p":"不正を働く　／　不正が発覚する"}]},{"id":9,"round":1,"k":"著書","r":"ちょしょ","hv":"TRỨ THƯ","m":"tác phẩm, sách đã viết","c":["著書を出版する — xuất bản tác phẩm","著書多数（ちょしょたすう）— có nhiều tác phẩm","著書を寄贈する — tặng sách"],"s":[{"h":"著作（ちょさく）","m":"tác phẩm","p":"著作を発表する　／　著作権"},{"h":"作品（さくひん）","m":"tác phẩm","p":"作品を制作する　／　文学作品"},{"h":"出版物（しゅっぱんぶつ）","m":"ấn phẩm","p":"出版物を刊行する　／　定期出版物"}]},{"id":10,"round":1,"k":"虚偽","r":"きょぎ","hv":"HƯ NGỤY","m":"giả dối, không trung thực","c":["虚偽の証言 — lời khai giả mạo","虚偽申告（きょぎしんこく）— khai báo gian dối","虚偽であることが判明する — bị phát hiện là giả dối"],"s":[{"h":"嘘（うそ）","m":"lời nói dối","p":"嘘をつく　／　嘘がばれる"},{"h":"偽り（いつわり）","m":"sự giả dối","p":"偽りのない気持ち　／　偽りを述べる"},{"h":"でたらめ","m":"bịa đặt (khẩu ngữ)","p":"でたらめを言う　／　でたらめな話"}]},{"id":11,"round":1,"k":"路地","r":"ろじ","hv":"LỘ ĐỊA","m":"hẻm, ngõ nhỏ","c":["路地裏（ろじうら）— ngõ hẻm phía sau","入り組んだ路地 — ngõ ngoắt ngoéo","路地に入る — đi vào hẻm"],"s":[{"h":"細道（ほそみち）","m":"đường nhỏ hẹp","p":"細道を歩く　／　山の細道"},{"h":"横丁（よこちょう）","m":"hẻm nhỏ","p":"横丁に入る　／　横丁の店"}]},{"id":12,"round":2,"k":"寄贈","r":"きぞう","hv":"KÝ TẶNG","m":"tặng, hi const KEY="dao1_flashcard_known_v1";
let known={};try{known=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(known))}catch(e){}};
const $=id=>document.getElementById(id);
let deck=[],idx=0,onlyUnk=false;
const rs=[...new Set(DATA.map(d=>d.round))];
$("round").innerHTML='<option value="all">Tất cả ('+DATA.length+' từ)</option>'+rs.map(r=>'<option value="'+r+'">'+(r==25?'Bài 25 (ôn tổng hợp)':'Bài '+r)+'</option>').join("");
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function build(){
  const r=$("round").value,q=$("q").value.trim().toLowerCase();
  deck=DATA.filter(d=>(r=="all"||d.round==r)&&(!onlyUnk||known[d.id]!==true)&&(!q||(d.k+d.r+d.hv+d.m).toLowerCase().includes(q)));
  idx=0;render();
}
function render(){
  $("card").classList.remove("flip");
  const n=Object.values(known).filter(Boolean).length;
  $("stat").textContent="Đã nhớ "+n+"/"+DATA.length+" từ";
  if(!deck.length){$("fk").textContent="—";$("fb").textContent="";$("back").innerHTML="";$("pos").textContent="Không có thẻ nào";return}
  const d=deck[idx];
  $("fb").textContent=(d.round==25?'Ôn tổng hợp':'Bài '+d.round)+(known[d.id]===true?' · ✓ đã nhớ':'');
  $("fk").textContent=d.k;
  $("back").innerHTML=
   '<div class="head"><span class="k">'+esc(d.k)+'</span><span class="r">'+esc(d.r)+'</span><span class="hv">'+esc(d.hv)+'</span></div>'+
   '<div class="mean">'+esc(d.m)+'</div>'+
   '<div class="lab">Cụm fix của từ chính</div><ul class="coll">'+d.c.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>'+
   '<div class="lab">Từ đồng nghĩa &amp; cụm fix của từ đồng nghĩa</div>'+
   d.s.map(s=>'<div class="syn"><span class="sw">'+esc(s.h)+'</span>'+(s.m?'<span class="sm">'+esc(s.m)+'</span>':'')+'<div class="sc">'+esc(s.p)+'</div></div>').join("");
  $("pos").textContent=(idx+1)+" / "+deck.length;
}
const flip=()=>$("card").classList.toggle("flip");
const go=k=>{if(!deck.length)return;idx=(idx+k+deck.length)%deck.length;render()};
const mark=v=>{if(!deck.length)return;known[deck[idx].id]=v;save();if(onlyUnk&&v){deck.splice(idx,1);if(idx>=deck.length)idx=0;render()}else go(1)};
$("card").onclick=flip;$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("yes").onclick=()=>mark(true);$("no").onclick=()=>mark(false);
$("round").onchange=build;$("q").oninput=build;
$("shuf").onclick=()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;render()};
$("unk").onclick=()=>{onlyUnk=!onlyUnk;$("unk").classList.toggle("on",onlyUnk);build()};
document.addEventListener("keydown",e=>{if(e.target.tagName=="INPUT"||e.target.tagName=="SELECT")return;
 if(e.key==" "){e.preventDefault();flip()}else if(e.key=="ArrowRight")go(1);else if(e.key=="ArrowLeft")go(-1)});
build();
</script>
