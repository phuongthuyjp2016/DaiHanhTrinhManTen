使い方として、最もよいものを選びなさい。【コンスタント】","options":["この商品は発売以来、毎月50個程度コンスタントに売れている。","この映画を見るのは3度目だが、何度見てもコンスタントに感動する。","この公園の電灯は、防犯のためかひと晩中コンスタントについている。","石川先生は70歳を過ぎたそうだが、コンスタントに若々しい。"],"ans":1},{"no":25,"sec":"moji","stem":"次の言葉の使い方として、最もよいものを選びなさい。【ずばり】","options":["木村さんの一言を聞いて、あのときの出来事がずばりと脳裏によみがえってきた。","息子はずっと続けていた野球をずばりとやめ、勉強に専念した。","森さんはきちょうめんな人で、机の上の本はいつもずばりとそろえて置かれている。","友人に自分の欠点をずばりと指摘されて、しばらく落ち込んだ。"],"ans":4}]},{"id":"mon5","title":"問題5 — 文法","sec":"bunpo","instr":"次の文の（　）に入れるのに最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":26,"sec":"bunpo","stem":"机の引き出しを整理していたら、以前使っていた電卓が出てきた。まだ使え（　　）するが、使う機会がなさそうなので処分しようと思う。","options":["すら","さえ","は","も"],"ans":3},{"no":27,"sec":"bunpo","stem":"彼はわずか27歳（　　）市長となった。","options":["にして","にあって","に際して","に先立って"],"ans":1},{"no":28,"sec":"bunpo","stem":"（ホームページで）当センターの相談窓口に（　　）、事前にご連絡をお願いいたします。","options":["伺って以来","伺う際は","お越しになって以来","お越しになる際は"],"ans":4},{"no":29,"sec":"bunpo","stem":"6歳の息子は、将来私と同じ消防士になりたいと言っている。実際に（　　）、そんなことを言ってくれたことがうれしい。","options":["なるかどうかに限らず","なるかどうかはともかく","ならざるを得ないとしても","ならざるを得ないばかりか"],"ans":2},{"no":30,"sec":"bunpo","stem":"A大臣は、週刊誌の報道について、「事実ではないにもかかわらず、あたかも事実である（　　）報道されたことは遺憾である」と述べた。","options":["までもなく","がゆえに","からには","かのごとく"],"ans":4},{"no":31,"sec":"bunpo","stem":"今日はさんざんな一日だった。自転車はパンクするし、財布はなくすし、しまいには大雨に降られてずぶぬれになる（　　）。","options":["始末だった","最中だった","思いだった","限りだった"],"ans":1},{"no":32,"sec":"bunpo","stem":"森選手の予選敗退は、けがが原因だと言われているが、本人は「けがは関係ない。単に実力が足りなかった（　　）」とコメントしている。","options":["だけある","ものがある","だけのことだ","ようなものだ"],"ans":3},{"no":33,"sec":"bunpo","stem":"エアコンが故障してしまい、この1週間暑くて大変だったが、今日ようやく修理してもらえた。これでもう暑さに（　　）。","options":["悩まされかねない","悩まされることはない","悩ませかねない","悩ませることはない"],"ans":2},{"no":34,"sec":"bunpo","stem":"（天気予報で）「明日は低気圧の発達に伴い、西日本を中心に風雨が（　　）。」","options":["強めつつあります","強まりつつあります","強める見込みです","強まる見込みです"],"ans":4},{"no":35,"sec":"bunpo","stem":"（育児の本で）3歳前後の子供は、「なぜ?」「どうして?」と何でも（　　）。周囲の大人はめんどうくさがらずに、そういった質問に向き合ってあげましょう。","options":["知りたがるものです","知りたがることです","知りたそうなものです","知りたそうなことです"],"ans":1}]},{"id":"mon6","title":"問題6 — 並べ替え","sec":"bunpo","instr":"次の文の ★ に入る最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":36,"sec":"bunpo","stem":"息子が通っているピアノ教室の発表会で、緊張して弾けなくなってしまった子がいた。大人だって＿　＿　★　＿無理はないだろう。","options":["そうなるのも","緊張するのだから","大勢の前に何かをするのは","子供が"],"ans":4},{"no":37,"sec":"bunpo","stem":"（テレビ番組のナレーションで）「蚊といえば動物の血を吸うイメージがありますが、実は血を吸うのは雌だけです。しかも＿　＿　★　＿、専門家に詳しく聞いてみましょう。","options":["雌に限っての","とか","行動なのだ","産卵を控えた"],"ans":3},{"no":38,"sec":"bunpo","stem":"昨年度までは社内研修後のアンケートを記述式で行っていたが、まとめるのに時間がかかる＿　＿　★　＿、今年度は選択式で行うことにした。","options":["うえに","評判も良くなかった","ことを踏まえ","受講者からの"],"ans":2},{"no":39,"sec":"bunpo","stem":"枕を変えたら、今までよりよく眠れるようになった。自分に合った＿　＿　★　＿から、驚いた。","options":["睡眠の質が上がるなんて","枕に変えるだけで","思っていなかった","こんなにも"],"ans":1},{"no":40,"sec":"bunpo","stem":"人工知能をはじめとする先端技術を取り入れる＿　＿　★　＿。企業が多い。","options":["メリットは","導入に至っていない","理解しつつも","扱える人材の確保やコスト面での難しさから"],"ans":4}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、文章全体の内容を考えて、41から44の中に入る最もよいものを 1・2・3・4 から一つ選びなさい。","passage":"以下は、医師が脳と心の健康について書いた文章である。\n人には会いに行こう\n人に会いに行こうというと、当たり前だと思うでしょう。わざわざ人に会いに行こうとしたのは、電話や手紙（もしくはメール）ですませるのではなく、会うことに意味があるからです。\n会うのは、コミュニケーションとしてきわめて重要です。つまり、コミュニケーションには自分の持っている情報を伝えるだけでなく、相手との共感がありますが、自分自身の規制、相手の規制にもつながる場合もあります。会って [41] 、相手も変わり、自分も変わる可能性があるということです。\nコミュニケーションではお互いにわかりあう、つまり共感がたいへん重要です。相手の身になって何かを感じる、それは相手の感情かもしれないし、痛みかもしれません。こうした共感こそ、人間のコミュニケーションです。\n会わなくても電話や手紙(メール)でも、こうした共感は生まれますが、相手の身になることができるかというとむずかしいでしょう。やはり実際に [42] 本当の共感は生まれると思います。\n脳にとっても、刺激の度合いが違います。初恋の人とデートをしたときのことを [43] 。胸がどきどきして、たいへん緊張したでしょう。初恋の人でなくても、好きな人に会えば脳は活性化し、ときめき状態を維持しますし、反対に嫌いな人に会うとそれなりの負の感情が生まれてきます。感情の流れが生まれ、共感も発生します。当然、脳も喜びにあふれるでしょうし、反対に嫌悪の情が流れることもあるでしょう。それだけ活性化される [44] 。\nやはり人には会いに行きましょう。ときめきを求めて。","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["話したとしても","話そうものなら","話すことで","話さないかぎり"],"ans":3},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["会うよりも","会ってこそ","会うまでに","会っただけでも"],"ans":2},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["思い出したくてたまらないのです","思い出すのではないでしょうか","思い出すしかありません","思い出してください"],"ans":2},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["というわけです","という点です","とします","としています"],"ans":1}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"「練習ではできていなかったのに、試合では技を成功させられた」などという場合に「すごいね」とほめられると、「私は本番に強いから、練習はそこそこにして、本番で勝負をかければいい」と思ってしまいがちです。\n本番に強いのは悪いことではありませんが、練習でしっかりできていないことを「本番になればきっとできるだろう」と考えるのは、甘いと言わざるをえません。そのようなスタンスでは、トップクラスの結果を出すことはとうていできないでしょう。\n真の実力をつけるには、やはり練習でも常に全力投球する姿勢が必要です。","items":[{"no":45,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["本当に実力があれば、練習でできなかったことでも試合でできる。","全力で練習したから試合でも成功するというのは、甘い考えだ。","練習でしっかりできていても、試合で実力を発揮するのは難しい。","練習にも全力で取り組まなければ、試合でいい結果は出せない。"],"ans":4}]},{"passage":"感情とは、単純な生理的な反応のことではありません。電車のなかで足を踏まれても、踏んだ相手の自分への対応によって、怒りになったりならなかったりします。自分が痛い思いをしても、ときに(注)相手の方に同情しさえします。人が感じる怒りとは、自分が傷つけられたという実感に加えて、その傷つける振る舞いが不当であるという判断も含まれているのです。このように感情は、じつは価値判断に基づいているのであり、すでにそこには思考があるのです。","items":[{"no":46,"sec":"dokkai","stem":"感情について、筆者はどのように述べているか。","options":["感情は生理的な反応より思考の影響が大きい。","感情は相手の対応ではなく自分の実感で決まる。","感情は実感だけではなく価値判断も含む。","感情は思考より先に生まれるものである。"],"ans":3}]},{"passage":"科学者は、一般に疑り深い。原因と結果が単純に結ばれる場合はそうでもないが、複雑な経路でつながっている場合には、論理の道筋がちゃんとたどれない限り疑い続けるのが通例(注)である。だから、新聞のインタビューなどで意外な結果や思いがけない現象について意見を聞かれたとき、必ず「もしそれが事実とすれば」という前置きをしてから推測を述べることになっている。より重大な結果を主張した論に対しては、より確実でより強固な証拠を要求するのも、その理由からである。","items":[{"no":47,"sec":"dokkai","stem":"科学者について、筆者はどのように述べているか。","options":["原因と結果が単純に結ばれない限り、疑い続ける。","原因と結果が論理的に証明できなければ、受け入れない。","原因と結果の関係が複雑であるほど、より強固な証拠を要求する。","原因と結果の関係が意外な場合には、証拠がない限り推測を述べない。"],"ans":2}]},{"passage":"人間は一人では生きていけない。誰かと依存し合っている。かつては、自立ということを単純に考え、依存を少なくするほど自立すると考えられたこともあった。しかし、現在の心理学はそれほど単純に自立と依存を一直線上にある対立概念としては見ていない。適切に依存し、そのことについてよく自覚している者こそ自立しているのだ、と考える。依存をなくそうと努力するあまり、人間は孤立してしまい、そのために生じる障害によって、かえって自立性を奪われてしまう。","items":[{"no":48,"sec":"dokkai","stem":"筆者の説明によると、自立した人とはどのような人か。","options":["自立と依存が全く違うことだと認識している人。","依存を少なくしたうえで、他者と生きようとする人。","必要に応じて依存し、自身の依存をよく理解している人。","孤立することを恐れず、依存をなくそうと努力している人。"],"ans":3}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"私は、何を表現したくて漫画を描いているのか?マンガ家を目指したころから考えていた。\n(中略)古代から、似た物語はたくさんある。ドラマ(注1)作りで大事なのは、新しい筋立て(注2)やエピソードを無理やりひねり出すことより、作者独自の考え方を、ドラマにのせて表現することなのだろう。十代の私は、そう気づいた。しかし「自分の考え」をどうやって確立するのか?自分の考えのつもりでも、人の意見に引きずられているかもしれない。\nそこで新聞を使った「<span class=\"underline-q\"><span class=\"underline-q\">修業</span></span>」を思いついた。毎朝、新聞を適当に開き、目をつぶって紙面を指す。そして指先にふれたところに載っていた記事の中の人物になりきって「この後どうすればこの問題が解決するか?どう振舞うのがベストなのか?」を毎日、真剣に想像した。\nこれをくり返すうち、自分なりの考え方をきちんと言葉で表現する大切さが分かってきた。そして自分が何を表現したいのかも、おぼろげ(注3)ながら見えてきた。\n突き詰めると、私は「ヒロインが何を考えているか」を描きたかったのだ。\nそれまでの少女漫画には、主人公である少女が能動的に動く物語が少ないように感じていた。それよりヒロインの喜怒哀楽、感情が描かれることが多かった。でも私は、自ら考え決心して生き方を選ぶ少女を描きたかった。\nそのため私の作品では、何かを決意するまでのヒロインの試行錯誤が長い。第一読者である担当編集者には「理屈っぽい」と言われ続けている。「ヒロインが泣く時に読者が共感してくれるんだ」とアドバイスされても、泣く前に考える女性を描き続けた。\n(注1)ドラマ:ここでは、ストーリー\n(注2)筋立て:話の組み立て\n(注3)おぼろげながら:ぼんやりではあるが","items":[{"no":49,"sec":"dokkai","stem":"筆者は何のために新聞を使って「<span class=\"underline-q\">修業</span>」をしていたか。","options":["記事の人物について自分の考えを持つため。","記事を参考に、自分なりのストーリーを作り出すため。","自分自身の考えを持てるようにするため。","自分の考えを言葉で表現できるようになるため。"],"ans":3},{"no":50,"sec":"dokkai","stem":"筆者は、「<span class=\"underline-q\">修業</span>」を繰り返した後、漫画で何を表現したいと思ったか。","options":["ヒロインが自ら決断し人生を生きる姿。","ヒロインが自らの人生について悩む姿。","ヒロインが自ら選んだ人生で成功する過程。","ヒロインの感情や心が変化する過程。"],"ans":1}]},{"passage":"以下は、<span class=\"underline-q\">生物の進化</span>について書かれた文章である。\n世界中にさまざまな形の角を持つカブトムシ(注1)がいますが、その中のどれかが生き残りやすいということはありません。カブトムシとしての条件さえ整っていれば、角の形はどれでもいい。たまたま突然変異(注2)でいろいろな角のカブトムシが生まれ、そこには環境圧力がからなかったので、どれも生き残っただけの話です(もちろん、たとえば移動が困難なほど巨大な角など、生きるのに邪魔になる形質の個体は淘汰(注3)されたでしょう)。\nこうした形質は、進化のプロセスにおける「遊び」の部分だといえます。たとえば自動車なら、四角い車体にタイヤが四つあり、中にはエンジンやハンドルがあるといった基本形は、どのメーカーでも変わりません。しかしそれ以外の細かい部分――ヘッドライトの形やシートの色や材質など――は、自動車としての本質にあまり関係がないので、車種やメーカーによってかなり多様性がある。デザイン的に遊べるのです。\n生物の場合も、デザイン的な遊びを入れる余地がなく、多くの種に共通する基本形はあります。生きている環境が同じなら、体型が似てくるのは当然の成り行きで、これは「収斂進化」と呼ばれています。たとえば哺乳類であるイルカの体型が魚類と似ているのは収斂進化の結果のひとつです。(中略)突然変異は生物の多様性を拡大しますが、環境圧力にはその多様性を絞り込む役割があるといえるでしょう。生物の進化には、その両面があるのです。\n(注1)カブトムシ:昆虫の一種で、雄は角を持つ\n(注2)突然変異:親にはない生物的特徴が子に現れること\n(注3)淘汰される:ここでは、滅びる","items":[{"no":51,"sec":"dokkai","stem":"カブトムシの例を挙げて筆者が言おうとしていることは、何か。","options":["環境によって、個体が生き残るために必要な基本形も変化していく。","さまざまな形の個体が生まれても、時間がたてばひとつの形になっていく。","生存の条件に合う変化の生じた個体だけが生き残ることができる。","生存にかかわる本質的な部分の変化でなければ、どんな形の個体も生き残る。"],"ans":4},{"no":52,"sec":"dokkai","stem":"<span class=\"underline-q\">生物の進化</span>について、筆者はどのように述べているか。","options":["突然変異で生じた多様性は、環境次第で維持されたり縮小したりする。","突然変異が頻繁に起こることで、環境の影響を受けない個体が生まれる。","突然変異も環境からの圧力も、多様性を拡大したり縮小したりする役割がある。","多様性は、環境からの圧力で絞り込まれても、突然変異によって拡大し続けていく。"],"ans":1}]},{"passage":"不正に対して、腹の底からふつふつと怒りが湧き上がってくるのは、人間にとってとても大切なことです。そして、それが大きな共感となって社会全体に広がるとき、社会変革のうねり(注)が訪れます。\nしかし同時に私たちは、<span class=\"underline-q\">「正しい怒り」の罠</span>についても、きちんと知っておかなくてはなりません。「正しい怒り」で胸がいっぱいになると、「怒っている私こそが正しいのだ」というふうに、私を正義の側に置いてしまいがちになります。すると、私の正義を邪魔するものは「悪」である、という思考回路ができあがります。\nそれがさらにもう一歩進むと、「悪」である彼らに正義の裁きを加えて社会を良くするためならば、こっちだって少々の「小さな悪」を行なってもかまわないはずだ、となってしまうことすらあるのです。\n歴史を振り返ってみれば、このような行き過ぎが何度も繰り返されてきました。そして「正しい怒り」で胸がいっぱいだと、なかなかそのような罠の存在に気づけません。\nすなわち、ほんとうの意味で「<span class=\"underline-q\">正しく怒る</span>」とは、「不正は許せない!」という怒りによって動機づけられた自分の行為のひとつひとつが、客観的に見ても「正しい」と言えるのかどうかを、たえず冷静に自己点検しながら、その怒りのエネルギーを上手に正義へと結びつけていくことではないかと私は思うのです。それができてはじめて、私たちはより良い社会を作っていけるのです。\n(注)うねり:ここでは、大きな動き","items":[{"no":53,"sec":"dokkai","stem":"<span class=\"underline-q\">「正しい怒り」の罠</span>とはどういうことか。","options":["不正に対する怒りの感情が自分で制御できなくなってしまうこと。","不正に怒りを感じる自分の側に正義があると思い込んでしまうこと。","不正だけではなく正しいことに対しても怒りを抱いてしまうこと。","怒りによってしか不正を正すことができないと思い込んでしまうこと。"],"ans":2},{"no":54,"sec":"dokkai","stem":"「<span class=\"underline-q\">正しく怒る</span>」ことについて、筆者の考えに合うのはどれか。","options":["怒りに基づいた行為が正当かどうかを社会全体で考えるべきだ。","怒りから生じた行為が正当かどうかを常に客観視する必要がある。","怒りをどのようにして正義に結びつけたらいいか冷静に考えるべきだ。","一人一人が自分の怒りの行動に責任を持ち、冷静でいる必要がある"],"ans":2}]},{"passage":"経済学者のケインズは、「本を読むときは好意的に読まなければならない」と発言したことがあるが、それは、ケインズの論敵(注1)だったある経済学者(スージーだったと記憶している)が、最初から悪意に基づく批判的な態度でケインズの著書を読むために、肝心の論点を一向に理解しないこと(できないこと)を嘆いての発言であった。\nつまり、読む前から批判的な姿勢を持っていると、批判という意図的フィルターの介在によって、他者のつくった知的生産物との関わり方が、出発点から歪んでしまうのである。高名な著者になんとかして批判の一矢を浴びせてやろうと意気込んでいる人が書いた書評などを読むと、浅薄な(2)揚げ足取り(3)に終始している場合が実に多いのは、そのせいである。そんな読み方をしていては、「知」が血肉化する(24)ことなど到底ありえない。やはり最初は、好意的な読みからスタートした方が得だろう。\n好意的な読み方の先には、没入(195)して読むという世界があると私は考えている。好意も批判もなく、ただ夢中になって読む。徹底的に読む。そうやって読んだものこそ、無意識のうちに内在化(6)する。(中略)ただし、私は批判的な読み方が不要だと言っているのではない。没入しないと深く読めないと言う一方で、しかし、批判的に読まなければ、読みが鋭くならないとも実感している。\nでは、どうすれば良いのだろうか。バランスを取るにかぎる、と物知り顔(7)で言う人もいるかもしれない。しかし、ここで必要なのは、両者のバランスを取ろうとすることではない。そうではなくて、このふたつの読み方を意識的に往来することなのだ。\n(注1)論敵:論争の相手\n(注2)浅薄な:思慮が足りない\n(注3)揚げ足取り:重要でない部分を取り上げて批判すること\n(注4)血肉化する:ここでは、自分のものになる\n(注5)没入する:熱中する\n(注6)内在化する:ここでは、身につく\n(注7)物知り顔:よく知っているかのような顔","items":[{"no":55,"sec":"dokkai","stem":"筆者によると、最初から批判的に読むことの問題点は何か。","options":["論点だけでなく、重要でない点まで取り上げて批判するようになること。","著者の主張が正しいと分かっているのに、受け入れられなくなること。","批判することが目的になり、著者の主張を正確に理解できなくなること。","批判することしか頭になくなり、自分の考えが持てなくなること。"],"ans":3},{"no":56,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["批判的に読みながら徹底的な読みも加えることを意識するべきだ。","徹底的に読むことが必要だが、批判的な読みも忘れてはいけない。","徹底的に読むか批判的に読むかは内容によって決める必要がある。","徹底的に深く読めば、意識しなくても鋭く批判的に読むことができる。"],"ans":2}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"以下は、ある数学者が書いた文章である。\n数学というものは、解き方がわかってしまったあとで、力がつくことはない。解き方を身につける前の、まだ解き方のわからない間だけが、力をつけるチャンスである。解けるようになるのは同じでも、それまでのあり方で、力が身につくかどうかが、きまってくる。\nそれに、おもしろいのも、本当は、まだ解けないで、いろいろと考えている間である。解けなきゃつまらないようだが、それは早く解こうとあせるからで、楽しみは解けるまでのほうにある。解けるようになったあとは、むしろむなしい。だいたい、「答えのわかっている謎」なんて、意味がない。解き方がわからないからこそ、問題の名にあたいするのだ。\nもちろん、まったく手がつかない(注1)のでは、おもしろくもないが、案外に、多少はわからないでも、うまく頭のなかに飼っておくと、そのうちに馴れてくれて、わかってきたりする。その、だんだん少しずつ、わかりかけというのも、オツな(注2)ものだ。そのためには、それを飼っておく、頭の牧場がゆたかでなければならない。本当のところは、数学の力というのは、いろいろとわかったことをためこむより、わからないのを飼っておける、その牧場のゆたかさのほうにあるのかもしれない。\nとくに、公式などをおぼえるのには、ぼくは反対である。それは簡単すぎて、少しもおもしろくないし、おぼえたものは忘れるものだ。とくに、急いでおぼえたものは、早く忘れる。同じおぼえるにしても、なるべくなら時間をかけたほうが、長持ちする。\n(中略)\nこのごろは、テストでおどされる(注3)ことが多いので、わかること、解けることを急ぐ傾向にある。たしかに、テストなどでは、時間がかぎられているので、急ぐのも多少は仕方がない。しかしながら、時間を制限されたときに急いでできるためには、時間の制限されていないときに、時間を気にしないでやっておいたほうがよい。テストで急ぐためには、テスト以外では急がないほうがよいのである。\nどんなやり方でも、わかって、問題が解けるようになる、という結果は同じかもしれない。しかし、ゆったりとやると、そのわかり方にコク(注4)が出てくるものだ。そして、その結果に達するまでの道筋を楽しむことで、力がつく。\n勉強を楽しむなんて、と思うかもしれないが、それは目的ばかり見てあせるからで、楽しむ気になれば、なんだって楽しめるものだ。\n(注1)手がつかない。ここでは、できない(注2)オツな:ここでは、おもしろい(注3)おどされる:ここでは、早く問題を解かされる(注4)コク:深み","items":[{"no":57,"sec":"dokkai","stem":"数学の問題を解くことについて、筆者の考えに合うのはどれか。","options":["早く解けなくても、解き方を身につけることが大切だ。","解けても解けなくても、問題に取り組むことが大切だ。","解けなかった問題が解けるようになったらおもしろくなる。","解き方のわからない問題を解こうとすることに意味がある。"],"ans":4},{"no":58,"sec":"dokkai","stem":"頭のなかに飼っておくとはどういうことか。","options":["わかる問題を手がかりにして、わからない問題を考えること。","わかる問題とわからない問題を、頭のなかで区別しておくこと。","わからない問題をわかるまで解き続けていること。","わからない状態のまま、問題を頭のなかに残しておくこと。"],"ans":4},{"no":59,"sec":"dokkai","stem":"筆者によると、どのように勉強すればよいか。","options":["結果を急がずに、考えることを楽しむ。","結果に達することができれば、どんなやり方でもよい。","目的を忘れないで、あせらずに勉強を楽しめばよい。","自分に合ったやり方を探して、時間を気にせず取り組む。"],"ans":1}]},{"label":"Mon11","passage":"A\nまじめで責任感が強く、負けず嫌いな人は「あきらめない」傾向があります。「あきらめない」ことは、基本的にはもちろんいいことなのですが、しかし一方、あきらめたほうがよいことも、実はけっこうあるものです。\n一所懸命に取り組んでも、うまくいかない、成果が出ない、充足感や満足感が得られない。そうした場合は「あきらめる」というのも、十分よい選択肢になります。こうした場合の「あきらめる」とは、「やめてしまう」ということです。\nやめる際には、「うまくいかなかった。やめてよかったと思うのがコツでしょうね。うまくいかなかったことを悔やみつつやめるのは、避けたいものです。それでは、うまくいかなかったことが尾を引いてしまいます。「うまくいかなくてよかった」と思うくらいがちょうどいいでしょう。それができるようになると、一時的には落ち込んでも、立ち直りが早くなります。\nB\n最近は仕事で悩んでいる人に対して「無理をしないであきらめたほうがよい。」というアドバイスを目にすることがある。もちろん体調を崩してしまうような場合には途中でもやめるべきだ。\nしかしあきらめるということは、やれることはすべてやり尽くしたあとで考えるべきではないだろうか。困難な目標ほど簡単には達成できないものだ。だから、最初から、できなければあきらめてもいいんだという気持ちでいては、つらくなったときに頑張り続けることができない。\n仮にどうしてもうまくいかずにあきらめることになったとしても、精いっぱい努力した結果ならば納得できる。落ち込んだりくよくよしたりするのではなく気持ちを切り替えて、しっかり原因を考えて次に生かすことが重要だ。\n(注)尾を引く:ずっと残る","items":[{"no":60,"sec":"dokkai","stem":"あきらめることについて、AとBはどのように述べているか。","options":["AもBも、成果が出せる可能性が低い場合には、あきらめたほうがよいと述べている。","AもBも、つらくても、できるだけあきらめずに頑張ったほうがよいと述べている。","Aは状況によっては、あきらめたほうがよいこともあると述べ、Bはあきらめてもいいと思ったほうが、頑張り続けられる場合もあると述べている。","Aは努力しても結果に結びつかない場合は、あきらめたほうがよいと述べ、Bは十分にやってみるまでは、あきらめることを考えるべきではないと述べている。"],"ans":4},{"no":61,"sec":"dokkai","stem":"AとBの認識で共通していることは何か。","options":["あきらめることになった原因を考えるべきだ。","あきらめるのが早ければ、早く立ち直れる。","あきらめたことでも、再挑戦することはできる。","あきらめたことを後悔してはいけない。"],"ans":4}]},{"label":"Mon12","passage":"子育て(養育)にしろ、学校での教育にしろ、当事者(親・教師)が心がけなければならないのは、まず子どもは親(教師)の思うとおりにならないということである。あるいは、こちらの思うとおりになったら、かえって問題だということである。\n「子供は親(教師)の思う通りにならない」という意味は、甘やかして野放図(注1)にしていいということではない。反抗は望ましいから、大いに結構だとも違う。もともと、親も教師も言葉で説得できるようになる以前から、まず子ども(生徒)たちを家庭や学校の生活の枠組みに入れなければならない。絶対に放っておくわけにはいかないし、理屈抜きで生活の型や秩序を押しつけざるをえない。それが親や教・師の社会的役割であり、個人としてはどうかと思うようなことも、親や教師は、一律に画一的に身につけさせようとする。それは避けられない。望むと望まざるとにかかわらず、みんながやらなくてはならない。\n人間が社会的動物であるということは、そういうことであろう。動物が持って生まれてきた本能で自由に生きられるのに対して、ひとの子どもは動物的な本能を抑圧されて、社会的規範を生まれてから次々と覚え、身につけていかねばならない。これは、ほかの動物と比較すると、不自由なことである。親や教師は、そういうひとの宿命である不自由を子どもたちに身につけさせなければならない。\n(中略)\nそういう社会的規範は、今の社会のレベルや段階が必要としていることであり、本当にひとの幸福にとってふさわしいものかどうかはわからない。ましてや、生まれ育っていくその子どもにとって、絶対的に必要なものかどうかもわからない。ただ、わかっているのは、社会的に生きていくために今ある社会的規範やルール、考え方をひとまず受け入れなければならないということだけである。\nそして、そういうひとを規制し構成してきたもろもろの(注2)精神的な財産は、時代とともに変わってきたという事実である。だから、次の世代は、私たちと同じにはならない。したがって、子どもは親(教師)の思うとおりにはならないのだ。\nだから、次の世代は、私たちと同じにはならない。したがって、子どもは親(教師)の思うとおりにはならないのだ。\nもちろん、思うとおりにしようとすることは避けられないとしても、思うとおりにならないことを覚悟しているべきである。それが子ども(生徒)や、あとの世代の人たちへの尊敬であり、信頼であろう。\n「こちらの思うとおりになったら、かえって問題だ」も同じことだが、現在の人間や社会がすでに理想を実現した完璧な社会であるはずがないし、私たちが正しいと思い、子どもたちに押しつけている社会規範やルールも、あくまでも暫定的なものにすぎない。だから、私たちが予想した以上に、私たちの思いどおりになる子どもができてしまったら、大変なことになる。\nおとなと子どもとの誤差は、基本的にはいつでも歓迎していいことである。\n(注1)野放図にする:勝手にさせる(注2)もろもろの:さまざまな","items":[{"no":62,"sec":"dokkai","stem":"筆者によると、親や教師は子どもや生徒に対して何をしているか。","options":["反抗を容認しつつ、不自由な社会的規範に従わせている。","どの時代にも通用する社会的規範を身につけさせている。","社会的規範を教え、社会の枠組みに適応させている。","社会的規範を教えたうえで、自由に生きる方法を身につけさせている。"],"ans":3},{"no":63,"sec":"dokkai","stem":"精神的な財産とは何か。","options":["ひとが幸福になるために守ってきたもの。","ひとが本能を抑圧されずに生きるためのもの。","ひとが社会で生きていくために作られてきたもの。","これから生まれ育っていく子どもにとって必要なもの。"],"ans":3},{"no":64,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["社会的規範は時代によって変化するものであり、子どもはおとなの思うとおりにならな くて 当然である。","社会的規範は暫定的なものにすぎず、子どもが自身の考え方に合ったものを作って いく ことが望ましい。","時代の変化に適応できるように、おとなは子どもに社会的規範の背景となる考え方 を教え たほうがいい。","時代によって考え方は変化するものなので、それに合わせて次の世代が社会的規範 を変 えるべきだ。"],"ans":1}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある大学の図書館のホームページに載っている案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"秋川大学＞秋川大学図書館＞一般利用\n一般の方の図書館利用について\n秋川大学の学生以外の一般の方も、研究等の目的のために、秋川キャンパスにある中央図書館と文学部図書館の資料が利用できます。\n【入館方法】\n・図書館利用カードをお持ちの方は、自動入退館ゲートから入退館ができます。\n・お持ちでない方は、カウンターで一日入館証を発行いたします。\n【図書館利用カードについて】\n・図書館利用カードは、図書館資料の貸し出しの際に必要になります。\n・発行をご希望の方は、身分証明書をお持ちになり、中央図書館、または文学部図書館のカウンターにお越しください(文学部図書館では平日のみ受け付けています)。\n・平日の9時から17時までの間に申請を受け付けた場合、その日のうちにカードをお渡しします。平日の17時以降、および土日に受け付けた場合は、次の平日開館日以降にお渡しします。\n【貸し出しと返却】\n・貸し出し冊数は5冊まで、貸し出し期間は2週間です。\n・中央図書館の貸し出し受付時間は閉館30分前まで、文学部図書館は閉館15分前までです。\n・開館時の返却は、カウンターで受け付けています。閉館・休館時は、ブックポストに入れてください。\n【資料の複写】\n・館内の複写機で、図書館資料の複写ができます。\n・複写機は、中央図書館は閉館10分前まで、文学部図書館は閉館時間まで利用できます。\n【会館時間】\n中央図書館　授業期間　平日9:00〜22:00　土曜・日曜9:00〜17:00\n中央図書館　夏休み・春休み期間　平日9:00〜19:00　土曜・日曜休館\n文学部図書館　授業期間　平日9:00〜21:00　土曜・日曜9:00〜17:00\n文学部図書館　夏休み・春休み期間　平日9:00〜18:00　土曜・日曜休館\n※各期間の具体的な日程は、開館カレンダーのページをご覧ください。","items":[{"no":65,"sec":"dokkai","stem":"マリーさんは秋川大学で本を借りるために、図書館利用カードを作ろうと思っている。今日は金曜日である。明日の夜までに本を借りたいが、図書館利用カードは、どのように申請しなければならないか。","options":["今日、中央図書館か文学部図書館で9時から17時までの間に申請する。","今日、中央図書館で9時から17時までの間に申請する。文学部図書館では申請できない。","今日、中央図書館か文学部図書館で9時から17時までの間に申請するか、明日、中央図書館で9時から17時までの間に申請する。","今日か明日、中央図書館か文学部図書館で9時から17時までの間に申請する。"],"ans":1},{"no":66,"sec":"dokkai","stem":"カイさんは、研究のために資料を借りたり複写したりする必要があって、秋川大学の文学部図書館に来た。図書館利用カードは持っている。今日は、授業期間の火曜日である。貸し出しと複写は、何時まで可能か。","options":["貸し出しは18時の15分前まで、複写は18時まで可能である。","貸し出しは21時の15分前まで、複写は21時まで可能である。","貸し出しは21時の15分前まで、複写は21時の10分前まで可能である。","貸し出しは21時の30分前まで、複写は21時の10分前まで可能である。"],"ans":2}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t7-2024-nghe.mp3","items":[{"no":67,"sec":"nghe","stem":"1番：アルバイトの男の人はこの後まず、何をしなければなりませんか。","options":["夏用の商品を棚に並べる","倉庫に日焼け止めクリームを運ぶ","パンに値引きシールをはる","棚の商品を片付ける"],"a ptions":["森さんが","だけあって","勧める","料理が上手な"],"ans":3},{"no":38,"sec":"bunpo","stem":"最後に見た映画が（　　）（　　）（　*　）（　　）映画を見ていない。","options":["ほど","何だったのかも","思い出せない","久しく"],"ans":1},{"no":39,"sec":"bunpo","stem":"学生から提出された論文の中に面白いものがあった。私が（　　）（　　）（　*　）（　　）これまでにない。","options":["知る限りでは","論文は","分析している","このアプローチで"],"ans":3},{"no":40,"sec":"bunpo","stem":"このレシピ本は、ふだん料理をしない人でも（　　）（　　）（　*　）（　　）評判になっているそうだ。","options":["若い人の間で","調理するだけで","レシピに沿って","簡単に本格的な料理が作れると"],"ans":4}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、文章全体の内容を考えて、41から44の中に入る最もよいものを 1・2・3・4 から一つ選びなさい。","passage":"以下は、作家が書いたエッセイである。\nエッセイのネタのほとんどを、私は日常の中から探している。もちろん「エッセイに書いて面白いネタ」と「書いてもあまり面白くないネタ」とがある。面白いものを [41] 。\nつまり君は、自分が書くエッセイは全部面白いと言いたいのかね?という声が聞こえるので、さらに説明すると、面白いかどうかは、まずは「自分にとって」である。自分にとって面白いとはどういうことか。それは私の場合、「自分がそれまで知らなかったこと」を書く、 [42] 。\n知識というよりは感覚や感情であることが多い。今まで見えなかったものが見えたとき。同じ場所なのに違う場所のように感じられたとき。ずっと眠っていた記憶。思いがけない嬉しさや悲しさや淋しさ。不意に自分の中に生まれた、世界というものへのあらたな認識。\n春になったら暖かくなるとか、困っている人には親切にしたほうがいいとか、不倫はしないほうがいいとか、梅に鶯とか月に雁とか、すでに知っていることは、いくら上手に書いてもつまらない。このエッセイの、665文字という短さの中ですら、書いている途中で退屈になってきてしまう。\nエッセイにかぎらず、 [43] でもそうだ。理想を言えば、知らないことを「知った」という報告ではなくて、この世の謎、自分自身の謎に近づいていく過程を書いていきたいと思っているし、そのような書きかたをしているときが、結局、私は一番面白いのだ。あるいはこれは書くことにかぎらず、人生全般に対して採用したいと思っている [44] 。","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["選べそうだ","選び得るか","選べるとよかった","選ばなければならない"],"ans":4},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["というほとだ","というわけだ","ということだ","というときだ"],"ans":3},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["小説","ある小説","その小説","そういった小説"],"ans":1},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["アプローチだとか","アプローチかもしれない","アプローチにある","アプローチとされているのだ"],"ans":2}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"機械はどんどん精密化し、巨大に進化している。人間の介入を許さないかのような迫力さえ感じさせる。だが、どれほど機械が進化しようとも、本質は変わらない。熟練工(注1)が金槌やドライバーなどの道具を、自分の体の一部のように自在に使いこなすことで最大のパフォーマンスを発揮するように、精密機器や巨大な設備も、人間が活き活きと動かすことが必要である。機械も道具である、という当たり前のことを、私たちは忘れてはいないだろうか。人間が機械に使われたり、単なる番人(注2)になったりするようなことがあってはいけない。\n(注1) 熟練工：熟練した職人\n(注2) 番人：監視する人","items":[{"no":45,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["機械の進化に伴い、人間も技術や能力を向上させることが必要だ。","機械がどんなに進化しても、人間は機械に使われないようにすべきだ。","人間は機械も道具であるという認識を考え直したほうがいい。","人間はどこまで機械を進化させるべきかをよく考えたほうがいい。"],"ans":2}]},{"passage":"以下は、ある電気店から届いたメールである。\n宛て先：syo_yasuhara@kfy.co.jp\n件　名：イヤホン「AS-10」の件\n日　時：9月13日　13：30\n安原　正一様\nLM電気大木店をご利用いただき、ありがとうございます。\nご予約いただいたイヤホン「AS-10」ですが、メーカーの生産が遅れているため、発売日(9月20日)当日に、すべてのお客様にお渡しすることが困難な状況です。\n本日、当店で9月20日にお渡しできる数が確定し、安原様のご注文分は確保できないことが分かりました。大変申し訳ございません。\n安原様へのお渡しは10月以降になってしまうのですが、いかがいたしましょうか。ご注文のキャンセルも承っております。\nお忙しいところ恐縮ですが、ご返信お待ちしております。\nLM電気大木店\n担当：上田　映子","items":[{"no":46,"sec":"dokkai","stem":"イヤホン「AS-10」について、このメールで確認していることは何か。","options":["今から予約しても発売日には渡せないが、予約するかどうか。","発売日が10月以降になってしまうが、予約するかどうか。","発売日に渡せるかは分からないが、予約したままでいいかどうか。","発売日ではなく10月以降に渡すことになるが、予約したままでいいかどうか。"],"ans":4}]},{"passage":"消費者ニーズの多様化が進む今日、「あらゆる人のための商品」はありえない。経営資源が限られるひとつの企業が、すべての顧客を満足させることは不可能だ。今の時代、すべての顧客の要望に応えようとすると、結局、誰の要望にも応えないことになってしまう。「万人受け(注)」という言葉はすでに死語かもしれない。「誰に売らないか」を決めることによって、経営資源を最大限に有効に活用し「売るべき人」に集中することができる。\n(注) 万人受け：皆に受け入れられること","items":[{"no":47,"sec":"dokkai","stem":"筆者が最も言いたいことは何か。","options":["顧客を限定して、その要望に応えた商品を作るべきだ。","顧客の要望に応えるために、経営資源を増やすべきだ。","多様なニーズに応えて、多くの消費者を満足させるべきだ。","ひとつの商品に焦点を当てて、経営資源を最大限に活用すべきだ。"],"ans":1}]},{"passage":"「自分の悪い部分を露にすると、嫌われたり、敬遠されたりするのではないか」という不安は、もちろんあるだろう。見せ方がまずいと、実際にそうなる危険性もないとは言えない。しかし、世間からの評価や期待に対して神経質になりすぎ、そのせいで常に不安を抱えながら生きていくくらいなら、他人から嫌われるほうがよほどましである。\nそもそも他人は、あなたが思っているほどあなたに対して期待などしていない。誰もが皆、自分のことで頭がいっぱいで、他人のことなど気にかけてはいない。","items":[{"no":48,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["他人に嫌われることなく生きることは難しい。","世間の評価や期待を気にしながら生きる必要はない。","自分の悪い部分を見せなければ、他人に嫌われることはない。","自分の悪い部分を見せて他人から嫌われるほうが、楽に生きられる。"],"ans":2}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"中等教育で、生徒たちはいろいろな科目でさまざまな分野の知識に触れていきます。\nどのような知識でも必ず前提となる世界観や物事の枠組みがあり、そうした背景なくしては該当する理論や見識が成り立ちません。\n生徒たちは、それぞれの科目で分野ごとの専門知識に触れていくことによって、前提とされる世界観や物事の枠組みを、自分の世界観や考え方の一部として固定化させていきます。\nつまり、学習を進めて、専門知識を身につければつけるほど、前提とされる価値観や枠組みに縛られていくことになるのです。\n一方で、技術革新やグローバル化により、社会の仕組みや共通認識が、目まぐるしく変化する中、現在の自分の世界観から飛び出して、他の価値観を理解する力が必要とされています。\n哲学の営みの中核は、物事の根本や前提を問い直して、考察することにあります。\n哲学の営みに親しむことで、現在のものの見方や考える枠組みから自分を解き放ち、急速に変化する社会の中で、揺るぎない自分の価値観を模索していく力を身につけることができるのです。\nより深いレベルでの学習が始まる中等教育においてこそ、より柔軟な「<span class=\"underline-q\">哲学する力</span>」を養い始めることが必要とされているのです。\n(注1)中等教育:中学、高校での教育\n(注2)揺るぎない:強固な","items":[{"no":49,"sec":"dokkai","stem":"筆者によると、中学や高校でさまざまな知識に触れていくと、どうなるか。","options":["分野ごとに前提とされる世界観や物事の枠組みが違うことに気づく。","身についた世界観や物事の枠組みの中で思考するようになる。","新しい世界観や考え方にしか興味が持てなくなる。","自分の世界観や考え方がより明確になる。"],"ans":2},{"no":50,"sec":"dokkai","stem":"筆者によると、何のために「<span class=\"underline-q\">哲学する力</span>」が必要か。","options":["激しく変化する社会の中で、自分の価値観を探求できるようにするため","自分のものの見方や考える枠組みの間違いを修正できるようにするため","自分の価値観を問い直し、社会の仕組みを正しく理解するため","社会の共通認識を学び、より深いレベルでの学習を進めるため"],"ans":1}]},{"passage":"以下は、羽毛を持つ恐竜について述べられた文章である。\n恐竜には、鳥のように卵を温める習性があったことがわかっています。\n(中略)気になるのは、いつから卵を温めるようになったのかということですが、羽毛を持った時点で、卵を温める習性も持っていた可能性があります。\n羽毛を持つことで、体温が維持できるようになるので、その体温を使って卵の温度を一定に保つことができます。特に夜間は気温が下がるので、夜に親が卵の上に座って眠っていれば、卵の保温にはとても効果的です。卵が一定の温かさで保たれていれば、さまざまな環境で卵が孵る確率が高くなります。\n爬虫類は卵を温めません。爬虫類の卵は、放置されても、1日のうちある程度の時間、気温が30度を超えるなどの条件が整っていれば、自然と孵ります。その代わり、爬虫類は1年のうち気温の高い限られた時期にしか産卵しません。生息地域も限られます。\n羽毛のある恐竜が、鳥に近い体温を持っていたとすれば、夏以外の季節でも、寒冷地でも、安定して35~40度ほどの温度で卵を温めることが可能です。\n厳密に言うと、羽毛があると体の熱を逃がさないので、卵を温めるには不向きです。\n人間で言うと、衣服の上からでは温めにくいのと同じです。温めるなら、服の中に入れて直接体温が伝わるようにするはずです。\n卵を抱く時期の鳥も、卵と接する部分の羽毛がなくなり、皮膚がむき出しになります。\n恐竜が卵を温めていたとすれば、おそらく同じように、<span class=\"underline-q\">お腹のあたりの羽毛が抜けていたと思われます</span>。\n(注)生息地域:生活している地域","items":[{"no":51,"sec":"dokkai","stem":"筆者によると、羽毛を持つことにはどのような利点があるか。","options":["低温の環境でも、卵を一定の温かさで保つことができる。","低温の環境でも、卵の成長を促し早く孵すことができる。","環境にかかわらず体温が維持でき、卵が多く産める。","環境に合わせて卵の温度を調整でき、早くすことができる。"],"ans":1},{"no":52,"sec":"dokkai","stem":"<span class=\"underline-q\">お腹のあたりの羽毛が抜けていたと思われます</span>とあるが、筆者はなぜそう考えるのか。","options":["体の熱を逃がすことで、卵を温めすぎるのを防げるから","皮膚から卵に直接体温が伝わることで、効率的に卵を温められるから","卵に皮膚を直接当てることで、卵の温度を知ることができるから","卵と接する部分の皮膚がむき出しになることで、卵が抱きやすくなるから"],"ans":2}]},{"passage":"以下は、仕事でリーダーの立場にある人に向けて書かれた文章である。\n「君は何がやりたいの?」「どんな仕事が好きですか?」と聞いたとき、本人の口から出てくる答えが本当に「向いていること」とは限りません。なぜなら、どんな仕事をやりたいかについては、驚くほど多くの人がイメージに左右されています。特に若い人や新人であれば、その傾向は強くなります。本人の発言を鵜呑みに(注1)してはいけないのです仕事の実情を知らずに単純に「あの仕事が好きだ!」と思い込んでいたり、「商品開発のAさんは楽しそう。私も商品開発をやりたい」と憧れていたり。上司に何をやりたいか聞かれたから、<span class=\"underline-q\">それ</span>ほど強い興味があるわけではなくても「特にありません」と答えるのは気まずいので、「なんとなくやりたいもの」をとりあえず答えただけというケースもあります。\nそれを踏まえずに、「君、広報が好きなの?じゃあ、やってみなさい!自分で言うならモチベーションも高いからうまくいくだろう」というリーダーは、マネジメントという大切な仕事を放棄しているようなものです。(注3)本人も気づかない埋もれたスキルを引き出し、チームの勝利に貢献してもらうには、リーダーがメンバー自身よりも、その人の適性を把握していなければなりません。\n(中略)本当に適性があれば、新しいポジションで成果を出します。成果が出ると面白くなり、ますますスキルが上がります。やがて「自分が貢献できている、チームの役に立っている」と実感できるようになれば、それがそのメンバーのやりたい仕事になっていきます。\n(注1)鵜呑みにする:そのまま受け入れる\n(注2)モチベーション:意欲\n(注3)マネジメント:ここでは、チームのメンバーの管理","items":[{"no":53,"sec":"dokkai","stem":"<span class=\"underline-q\">それ</span>とあるが、どのようなことか。","options":["仕事を具体的な内容よりイメージで捉えて答えていること","よいイメージが持たれやすい仕事を選んで答えていること","できない仕事をできると思い込んで答えていること","本当にやりたい仕事を選ばずに答えていること"],"ans":1},{"no":54,"sec":"dokkai","stem":"部下への接し方について、筆者はどのように考えているか。","options":["希望と違う仕事に挑戦させて、本人の新しいスキルを引き出すことが大切だ。","適性を見極めて仕事を任せれば、本人は充実感を持って取り組むようになる。","本人のやりたい仕事に挑戦させれば、望ましい成果が出せるようになる。","個人の成果を望むより、チームに貢献する経験をさせることが大切だ。"],"ans":2}]},{"passage":"実験科学の世界では、仮説にぴたりと合致するような結果が得られることはまずないといってよい。その際、ほとんどの研究者はこう考える。自分の仮説は間違っていない。\nただ、実験の方法がよくないから、よいデータが出ないのだと。そこで条件を少しずつ変えて、繰り返し実験を行うことになる。しかし、ほとんどの場合、実験がうまくいかないのは、実は、仮説そのものが間違っているからなのだ。\nだが、研究者は頑迷なので自説に固執してしまう。かくして膨大な時間と試行錯誤が浪費される。なので、科学研究にほんとうに必要な才能は、天才性やひらめきというよりは、むしろ、自己懐疑、失望に対する耐性、潔い諦め、といったものとなる。\n逆に、実験科学の世界では、時として、思い描いたとおりの、いや、想像以上にすばらしい、見事な実験データが得られることがある。こんな時、研究者に求められることは何か。ぬか喜びしてはならぬ、ということである。実験の方法に穴があるから、見せかけだけの結果が出ているのかもしれない。つまりここでも自己懐疑、(希望に対する)耐性、諦め、が必要となる。\n英語にはこんな言い方がある。toogoodtobetrue(できすぎは、真実ではない)。もう少しだけ研究者に冷静さがあればあの「発見」はなかった。そんな誤謬はいくつでもある。\n(注1)頑迷:頑固\n(注2)~に対する耐性:ここでは、~に影響されない強さ\n(注3)ぬか喜び:あとでがっかりする結果になる一時的な喜び\n(注4)誤謬:誤り","items":[{"no":55,"sec":"dokkai","stem":"筆者によると、自分の仮説に合う実験結果が得られない場合、多くの研究者はどうするか。","options":["仮説と条件を少しずつ変えて、実験を繰り返す。","仮説の問題点を明らかにするために、実験の条件を変える。","仮説に合う結果を得るために、条件を変えて実験を繰り返す。","仮説に合う結果を求めて、条件を変えずに時間をかけて実験する。"],"ans":3},{"no":56,"sec":"dokkai","stem":"実験科学の分野の研究者について、筆者の考えに合うのはどれか。","options":["実験結果に振り回されず、常に仮説と結果を冷静に検証する必要がある。","実験に冷静に臨んでも、思いどおりのよい結果が得られるとは限らない。","「発見」のためには、膨大な時間と試行錯誤を覚悟しなければならない。","思い描いたとおりの結果を得るには、実験による検証を諦めてはならない。"],"ans":1}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"以下は、報道写真を撮る人が書いた文章である。\n写真の発表の場が減ったことで、その未来を懸念する声が多いが、私は、そうは思わない。音も動きもなく、数千分の一秒という高速で動きを止める写真は、テレビと比べると臨場感では劣り、「伝えるためのメディア」としては原始的なのかもしれない。しかし、テレビのように用意された答えを差し出し、「こうです」と押しつけるのとは違って、写真には、すべてが提示されていないからこそ、それを補うための想像力が必要となる。(中略)\n写真の一瞬に込められた意味を想像すること。その瞬間の前と後、あるいは、写っていないものにまで思いをめぐらせること。さらに写っているものに、どう自分を重ね合わせ、何を感じ取るかということ。想像力を伸びやかに働かせることで、私たちは周りに流されずに、「いまの時代」を自分なりに感じ取ることができるはずだ。\nしかし、想像力を呼び起こすためには、写真に「絵」としての力があることが必要条件となる。最初に「絵画」の構成力や力強さといったものがあってこそ、人を惹きつけることができるはずで、そこから何を感じてもらうかはその次のこととなる。\n写真を始めた頃、「名作」と呼ばれる写真をたくさん見るように努めた。ロバート・キャパの「倒れし兵士」、カルティエ・ブレッソンの「水たまりを飛ぶ男」、ユージン・スミスの「シュバイッツア博士」…………･･･。それらの写真を前に、「どうして名作なのか」と考えた。その時は、すぐには答えが見つからなかったが、いま思うのは、「名作とは見る人が、それぞれに感じ取れるものがある写真」ということだ。悲しい時、うれしい時、その時々の心のあり様によって、一枚の写真から感じるものは違ってくる。若い時に、私が感動した写真でも、いま見ると、さほど感じないというものもあるし、逆に、若い頃は何も感じなかった写真がいまになって心に迫ってくることもある。様々な人が、心のままに写真に向き合い、そこからいろいろなメッセージをくみとれる写真が、多くの人に支持され、時を越えて残っていく名作なのだと思う。\n写真の力が失われていると嘆く人もいるが、いまはカメラ付き携帯電話が普及し、多くの場所で写真を撮ることができる時代でもある。その意味では、一億総カメラマンの時代といえるのかもしれない。誰もが撮ることができる時代だからこそ、独自の視点で、他の人が見逃していたアングルで素晴らしい写真を撮ることができれば、多くの人たちによさが認めてもらえる環境が整ったといえるのではないだろうか。\n(注)アングル:角度","items":[{"no":57,"sec":"dokkai","stem":"写真とテレビの映像について、筆者の考えに合うのはどれか。","options":["想像力を働かせて写真を見れば、映像と同じような臨場感が得られる。","写真のほうが原始的だからこそ、見る人に簡潔に意味が伝わる。","写真は一瞬しか写し出されていないため、映像より見る人の想像力が必要だ。","写真は写っていないものがある分、見る人が自分を重ね合わせるのが難しい。"],"ans":3},{"no":58,"sec":"dokkai","stem":"「名作」と呼ばれる写真について、筆者はどのように考えているか。","options":["若い時に価値が分からなくても、年を取るとよさが分かるようになる。","多くのメッセージを含んでおり、見る人に様々な感情を呼び起こす。","明確な一つのメッセージが伝わるような構成力や力強さがある。","見る人や心の状態によって、受け取るメッセージが違う。"],"ans":4},{"no":59,"sec":"dokkai","stem":"写真について、筆者の考えに合うのはどれか。","options":["誰もがどこでも撮れる時代になり、心に迫るものを撮ることが難しくなっている。","想像力を生かせば、他の人が見逃していた視点で撮れる環境が整ってきている。","他の人にはない視点で想像力を呼び起こすものが撮れれば、力を持ち続ける。","技術の進歩 で誰でもよいものが撮れるようになり、力が再認識されている。"],"ans":3}]},{"label":"Mon11","passage":"A\n小説を書こうとしている人やすでに何作か書いたことのある人が、よく私にテクニック面での質問をしてくるけれど、そういうとき私は「あなたが技術や手法について誰かに訊くたびに小説はあなたから離れていく」と答えることにしている。\n（中略）\n自分の小説の行き詰まりをテクニック不足が原因だと考える人は「小説の書き方マニュアル」を信じる律儀さと同じで、たしかに真面目で素直ないい人ではあるのだろうが、本当に自分が書きたいことが何なのかをきちんと考えていないという意味で、怠けているということになる。小説の中身と表現・手法・技術の関係は何重にも重なり込まれたもので、厳密に論じだしたらキリがないが、まずはそんな面倒なことは考えずに、「本当に書きたいことだったらテクニックなんか関係ない」と、シンプルに考えてほしい。\nB\n小説を書くには想像以上の気力が必要である。書くことを決めて執筆に取りかかっても、自分には技術がないから下手な文章しか書けないと手を止めてしまう人が多い。\nしかし、そんなことで悩んでいるくらいなら、まずはどんどん書き進めてみるべきだ。テーマとジャンルを決める、構成と展開を考える、登場人物と舞台を決めるといった必要な手順を踏んだら、あとは書き始めること、そして完結させることが何より重要なのだ。\nいくら面白いストーリーでも、完結させないことには小説とはいえない。短編小説でも、納得できる出来栄えでなくてもかまわない。まずは自分の力で一つの作品を書き上げることだ。それができれば、自信が生まれ次の作品につながっていく。\n(注1)訊く：ここでは、質問する\n(注2)律儀さ：礼儀正しさ\n(注3)何重にも簋み込まれた：ここでは、複雑に絡み合った\n(注4)キリがない：際限がない","items":[{"no":60,"sec":"dokkai","stem":"小説を書くときの問題点として、AとBが共通して挙げていることは何か。","options":["うまく書けないのは技術が足りないからだと考えること","他者にアドバイスを求めて、自分で考えようとしないこと","本当の小説とはどのようなものかが理解できていないこと","書くのに必要な技術や手法を身につけていると過信すること"],"ans":1},{"no":61,"sec":"dokkai","stem":"小説を書くために必要なことについて、AとBはどのように述べているか。","options":["AもBも、本当に書きたいことかどうかを考えながら書くことだと述べている。","AもBも、うまく書けないと思っても、怠けずに書き続けることだと述べている。","Aは自分が書きたいことを明確にすることだと述べ、Bは最後まで書き上げること だと述べている。","Aは内容と表現の関係を考えて書くことだと述べ、Bは手順に沿って書き進めてい くことだと述べている。"],"ans":3}]},{"label":"Mon12","passage":"SNS (注1)を含むリアルタイムウェブ(注2)の本質は、時間と過程の消去にある。かつてコンテンツ(注3)の拡散には一定の時間がかかった。権威やメディアをすり抜ける必要もあった。けれどもいまや、それらの面倒をすべてすっとばし(注4)、無名の書き手が一晩で何百万もの支持者を集めることができる。それはSNSの良いところだ。\nけれども人生にはトラブルがつきもの(注5)である。どれだけ誠実に生きていても、誤解や中傷に曝されることが必ずある。そしてそういうとき、SNSの支持はほとんど役に立たない。匿名の支持者は、トラブルの話題自体すぐに忘れてしまう。あっというまに(注6)集まった人々は、同じくあっというまに離れる。そこで継続的に助けてくれるのは、結局は面倒な人間関係に支えられた家族や友人たちだったりする。\nSNSの人間関係には面倒がない。だからSNSの知人は面倒を背負ってくれない。そんなSNSでも、たしかに人生がうまく行っているときは大きな力になる。けれども、本当の困難を抱えたときは、助けにならないのだ。\nこれからの時代を生きるうえで、SNSのこの性格を知っておくことはとても重要なように思う。そもそも、人生の困難なるものは自分と世界のズレの表れである。自分はあることを正しいと信じるが、世界はそう思わない――そういう対立が生じたとき、困難が訪れる。だから困難そのものが悪いわけではない。むしろ、概念の発明や政治の変革は必ず困難とともに生じる。その困難を時間をかけて解消し昇華する(注７)ことで、はじめて自分も相手も社会も進歩するのだ。けれども、いまのSNSにはそのような熟成の余裕がほとんどない。\n困難な時期を支えるとは、言いかえれば、支える相手と世界の関係が変化する過程に時間をかけてつきあうということである。ひとりの人間が変わるというのはたいへんなことで、「いいね!」をつけるようにポンポン複製できるものではない。いわゆる「議論」で相手が変わると考えているひとは、人間の本質について無知である。ぼくが一生をかけて変えることができるのは、ごく少数の身の回りの人々だけであり、そしてぼくを変えることができるのもおそらくは彼らだけだ。その小さく面倒な人間関係をどれだけ濃密に作れるかで、人生の広がりが決まるのだと思う。\n家族も友人もあっというまには作れない。面倒な存在でもある。だからこそそれは変化の受け皿となる。面倒がないところに変化はない。情報技術は、面側のない人間関係の調達を可能にしたが、それはまた人間から変化の可能性を奪うものでもあった。そのことを忘れずにおきたいと思う。\n(注1) SNS:ウェブ上での情報のやり取りや交流の場を提供するサービス(注2)リアルタイムウェブ:情報更新が即時に行われるウェブ(注3)コンテンツ:ここでは、情報(注4)すっとばす:ここでは、省略する(注5)つきもの:必ず伴うもの(注6)あっというまに短い間に(注7)昇華する:ここでは、別の良いものに変える","items":[{"no":62,"sec":"dokkai","stem":"SNSの支持はほとんど役に立たないとあるが、なぜか。","options":["SNSの支持者の意見はさまざまで、すぐにはまとまらないから","SNSの支持者は無名で権威を持たないひとが多いから","SNSの支持者はトラブルの原因を誤解したまますぐに発信するから","SNSの支持者はすぐに興味をなくし、去ってしまうから"],"ans":4},{"no":63,"sec":"dokkai","stem":"困難な時期について、筆者はどのように述べているか。","options":["自分と世界の認識のズレに気づき自分が変わろうとすれば、乗り越えられる。","「議論」によって相手や自分を変化させることで、乗り越えられる。","少数の身の回りの人々から人間関係を広げていけば、乗り越えられる。","家族や友人のような存在との深い関係によって、乗り越えられる。"],"ans":4},{"no":64,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["情報技術の特徴を理解したうえで活用すれば、自分自身の変化につながる。","情報技術を活用すれば、面倒な人間関係を変えられる可能性がある。","情報技術によって作られた人間関係では、人間の変化は期待できない。","情報技術は人間の変化の可能性を奪うものであり、利用は控えるべきだ。"],"ans":3}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、不用品の買い取りをしている会社のホームページに載っている案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"マスダ買い取りサービス\n買い取りサービスのご利用について\n●買い取り可能な品物\n冷蔵庫などの家電、机などの家具、自転車、楽器を受け付けています。詳しくは、「買い取り可能な品物」のページをご確認ください。\n●買い取り方法と流れ\n【店頭買取】①店頭へお持ちください。②品物を確認し、買い取り金額をご提示します。③ご納得いただけた場合は、現金をお渡しします。\n【出張買取】①最寄りの店舗にお電話ください。②弊社スタッフがご自宅へ伺います。③ご自宅で品物を確認し、買い取り金額をご提示します。④ご納得いただけた場合は、現金をお渡しします。\n【宅配買取】①ホームページからご予約ください。②宅配業者が伺いますので、品物をお渡しください。③店舗への品物到着から3営業日以内に、買い取り金額をメールでご連絡します。ご納得いただけた場合は、銀行口座へお振り込みします。\n※買い取り金額にご納得いただけずキャンセルされる場合でも、出張料や返送料はかかりません。\n●受け付け可能な品数とサイズ\n店頭買取：1点から　サイズ制限なし\n出張買取：2点から　サイズ制限なし\n宅配買取：1点から　1点あたり25kg以下で、かつ三辺（縦・横・高さ）の合計が160cm以下のもの（自転車の場合、サイズ内でも宅配買取は利用できません）\n●ご本人確認について\n店頭買取、出張買取の場合、本人確認書類（運転免許証等）をご提示いただきます。宅配買取の場合は、品物と一緒にコピーをお送りいただきます。\n家電、家具、楽器の場合は、顔写真のない本人確認書類もご利用になれますが、自転車の場合は、顔写真付きのものをご用意ください。","items":[{"no":65,"sec":"dokkai","stem":"チョウさんは、机1台を買い取ってもらいたいと思っている。机は、重さが12kgで、三辺の合計が220cmである。チョウさんが利用できる方法はどれか。","options":["店頭買取か出張買取か宅配買取","店頭買取か出張買取","店頭買取か宅配買取","店頭買取"],"ans":4},{"no":66,"sec":"dokkai","stem":"森村さんは、ギター(重さ5kg、三辺の合計150cm)と自転車(重さ10kg、三辺の合計160cm)をまとめて買い取ってもらいたいと思っているが、店頭に自分で持っていかずに済む方法がいい。森村さんが利用できる方法はどれで、何を準備しなければならないか。","options":["宅配買取で、品物と顔写真付きの本人確認書類のコピーを準備する。","宅配買取で、品物と本人確認書類のコピーを準備する。本人確認書類は、顔写真付きでなくてもいい。","出張買取で、品物と顔写真付きの本人確認書類を準備する。","出張買取で、品物と本人確認書類を準備する。本人確認書類は、顔写真付きでなくてもいい。"],"ans":3}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t12-2023-nghe.mp3","items":[{"no":67,"sec":"nghe","stem":"1番：男の人はこの後まず、何をしなければなりませんか。","options":["けいやくしょを、かくにんする","山下食品に納品に行く","工場に納品日の変更を依頼する","山下食品と打ち合わせをする"],"ans":3,"blind":false},{"no":68,"sec":"nghe","stem":"2番：男の職員は来月号の表紙をどのように修正しますか。","options":["のせる写真を増やす","鳥の説明を加える","見出しの表現を変える","目次を入れる"],"ans":3,"blind":false},{"no":69,"sec":"nghe","stem":"3番：女の人はアルバイトの人を探すために何をしますか。","options":["大学時代の同級生に声をかける","大学院のこうはいに連絡を取る","大学の学生課に求人を出す","大学の先生に紹介を頼む"],"ans":2,"blind":false},{"no":70,"sec":"nghe","stem":"4番：受講生は今日の研修で地図に何を描かなければなりませんか。","options":["観光スポットの解説の要点","案内する道順","交通安全上、気を付ける場所","きゅうけいできる場所"],"ans":3,"blind":false},{"no":71,"sec":"nghe","stem":"5番：男の学生はこれからまず、何をしますか。","options":["食品の賞味期限を確かめる","箱の隙間に新聞紙を詰める","寄付するものの一覧を作成する","申し込みフォームに入力する"],"ans":4,"blind":false}]},{"id":"listen2","title":"聴解 問題2","sec":"nghe","instr":"問題 書いた文章です。\n一生の仕事\n自分の作品を読み返さぬ日はないと言っていい。\n書斎の手近な場所に全著作を収めた棚があり、読書や執筆に倦んだ(注1)ときには適当に一冊を抜き出して読み始める。退屈して寝てしまうときもあれば、仕事をそっちのけで読了してしまうこともある。\nまさかナルシストではない。復読に耐えるほどたいそうな [41] 。わが子はよその子よりもかわいいと思う親の情である。\n読みながら勝手に感心したり、あきれ果てたり、 [42] 。\n気に入らない点があるのなら書き直せば良さそうなものだが。どうしてもできない。単行本を文庫本にするときですら。校閲上の明らかな誤りの他にはまず筆を入れるということがない。横着なわけではなく、読めば読むほどその文章を書いていたころの自分を [43] のである。いくらか齢(注2)を食ったからといって、齢なりに懸命であったおのれの文章を滅ぼすことは忍びないし、その間に得たものも多いが喪ったもの(注3)もまた多かろうと思えば勇気も要る。\n出来栄えのいかんに関わらず、自分なりに全きをめざしていたのである。そうした過去の自分には敬意を払い続けねばならないし、また同時に現在の自分は、未来の自分に恥じぬ小説を書かねばなるまい。一生の仕事 [44] そうしたものであろうと思う。\nかにかくに、この短い文章もいつか読み返して愕然とするのであろうが。\n(注1)倦(あぐ)んだ：疲れた\n(注2)齢(よわい)：年齢\n(注3)喪(うしな)った：失った","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["小説であってもだ","小説でもあるまい","小説なのであろうか","小説なのではないか"],"ans":2},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["褒めたり叱ったりする","褒めたり叱ったりしたほうがいい","褒めたり叱ったりするようだ","褒めたり叱ったりしても仕方ない"],"ans":1},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["否定せずにいられなくなる","否定しがちになる","否定できなくなる","否定するようになる"],"ans":3},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["も含めて","でない限り","にしても","とは"],"ans":4}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"情報社会、あるいは情報化社会と言ってもいいですが、そこで懸命に生きていこうとすると、まず出てくる悲鳴があります。つまり、あまりにも多くの情報があって、その中のどれが本当なのか、何を選んだらいいかわからない。今、流行っているものの情報に熱心であればあるほど、世間で流行っていることを知らないと自分が遅れるんじゃないか、という焦りみたいなものが人間を突き動かすのが情報化社会の特徴です。","items":[{"no":45,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["情報を求める人ほど、知らない情報があることに不安を感じる。","情報を得ることに熱心な人は、世間で流行っていることしか知らない。","多くの情報から必要なものが選べなければ、世間から遅れてしまう。","流行っているものの情報に熱心なだけでは、情報化社会で生きられない。"],"ans":1}]},{"passage":"以下は、「書くこと」について述べたものである。\n「思ったこと」や「考えたこと」という抽象的な存在が文字という具体的な存在に変化した瞬間、その筆者は自分自身の「思ったこと」や「考えたこと」を、直接、自分の目で「見た」ことになる。つまり、客観的に「観察」することになるわけだ。「書くこと」は「読むこと」。自分の文章を読みながら書き進めるのが、「書く」という作業なのである。観察はほとんど必然的に「批判」のこころを呼び起こす。「思ったこと」や「考えたこと」の浅さや甘さを、書いた瞬間に思い知らされるのである。","items":[{"no":46,"sec":"dokkai","stem":"筆者によると、「書くこと」によってどうなるか。","options":["自身の新しい考え方に気づく。","自身の意見を具体的に伝えられる。","自身の意見を批判的に見ることができる。","自身のこころの変化を観察することができる。"],"ans":3}]},{"passage":"昔と比べてモノが売れなくなり、広告の働きも悪くなっていることから、表現の面白さや新奇性ばかりに走ってしまう…要は、本来、最も大切であるはずの消費者心理のツボを十分に突ききれていない、分析しきれていない、いわば表面上の、表現にこだわった広告が増えているように感じます。\n消費者心理は「本質」、表現は「伝え方」とも言い換えられますが、最も大切な本質を重視せず、表面上の伝え方ばかりに重きが置かれるようになっている状況は、いかがなものでしょうか？本質なきところに良い伝え方など存在するはずがないのです。","items":[{"no":47,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["消費者心理を捉えた広告作りは、昔より難しくなっている。","消費者心理を捉えていないのは、良い広告とは言えない。","消費者心理を捉えていれば、広告は表現にこだわる必要はない。","消費者心理を捉えているだけでは、効き目のある広告にはならない。"],"ans":2}]},{"passage":"語り合えば語り合うほど他人と自分との違いがより繊細にわかるようになること。それが対話だ。「わかりあえない」「伝わらない」という戸惑いや痛みから出発すること。それは、不可欠なものに心を開くことである。そのことで、ひとはより熱い対話をすることができるようになる。対話のなかでみずからの思考をも鍛えていく。よくよく考えたうえで口にされる他人の異なる思いや考えに、これまたよく耳を澄ますことで、じぶんの考えを再点検しはじめるからだ。","items":[{"no":48,"sec":"dokkai","stem":"対話について、筆者はどのように述べているか。","options":["他人とじぶんの違いが大きいほど、熱い対話ができる。","他人との思考の違いを把握することで、自身の思考が深められる。","わかりあえないという戸惑いや痛みが克服でき、他人と共感できる。","思いや考えを表現する能力が鍛えられ、他人に理解してもらいやすくなる。"],"ans":2}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"「常識を疑ってみる」ということ、実はそれが学問の始まりでもあります。勉強が「強いて勉める」という受動的な側面を持つものであるならば、学問は「問うで学ぶ」ことであり、極めて能動的な行為です。自ら主体的な行為として問うことを通して、常識とされてきたものの見方を疑い、それを少しずらすなどして、別の見方を見出そうとしていきます。学問の「正解」はひとつとは限りません。学ぶこととは、単純に知識を増やすということではなく、ましてやテストで覚えたことを吐き出すことでもなく、それを自分のものとして再編成していくことであり、さらに言えば自分の物差しが変わり、自分自身が変わっていくことなのです。そして、思いがけない大発見や、独創的なアイデアが生まれるかもしれません。\n「<span class=\"underline-q\">疑う</span>」という言葉は、通常は否定的な意味で使われます。「人を疑う」と言えば、普通はその人を信用しないというのと同義なわけです。私も、人を疑って生きるよりも、できるだけ人を信じて生きていたいと思っています。しかし、世の中で当たり前とされている事柄を「疑う」ことが必要な時もあります。「常識だから」という一言で目を閉ざし、それに安易に取り込まれてしまうことなく、そこを少しずらしたところに面白いことを見出していくために。それは、何事も信用しないというような厭世的な生き方に繋がるのでなく、むしろ創造的で豊かな世界を紡ぎだしていくための、積極的な営みなのです。","items":[{"no":49,"sec":"dokkai","stem":"筆者によると、学問とはどのような行為か。","options":["「正解」を求めて、自ら主体的に問い続けていく行為である。","独創的なアイデアを生み出すために、自らのものの見方を変える行為だ。","自ら問いながら、ものの見方を模索しながら自分自身が変わっていく行為だ。","新しい知識を積極的に取り入れることで、自分自身を変えていく行為だ。"],"ans":3},{"no":50,"sec":"dokkai","stem":"学問で「<span class=\"underline-q\">疑う</span>」ことについて、筆者の考えに合うのはどれか。","options":["何を信じればいいのかを理解するのに欠かせない行為だ。","豊かに生きるために、新しい常識を作りだす積極的な行為だ。","常識に安易に取り込まれないために必要だが、否定的な行為だ。","常識に縛られずに、これまでと異なる考え方を生み出す行為だ。"],"ans":4}]},{"passage":"春に美しい花をさかせるカタクリは、アリに種まきをさせるという驚くべき戦略を持っている。\nカタクリの種は熟すのは花が咲いてから、およそ2ヶ月後だ。はじけて地面に落ちた種は、すぐにアリがやってきて巣に運んでいってしまう。薄茶色の種の先に白い部分がある。これが脂肪分に富んだエライオゾームと呼ばれるものだ。アリはこの部分に惹かれる(注1)ことが分かっている。エライオゾームはアリにとってそれほど魅力的な物質であるらしい。\n運ばれた種はアリの巣に貯蔵されることになるが、アリは二日もすると、せっかく運び込んだ種を巣から運び出してしまう。種は巣の中深いところに持ち込まれても発芽できないから、これはカタクリにとって好都合だ。どうしてアリはせっかく集めた種を棄ててしまうのだろうか。\n実は熟して地上に落ちたばかりのカタクリの種についているエライオゾームは、アリの幼虫が共通して持つにおいに近い物質を持っているのだという。アリは種を食べ物として集めるわけではなく、自分の幼虫と思って巣に持ち帰るらしいというわけだ。ところが種がはじけてから24時間もすると、アリの死んだ幼虫のにおいに変わるのだそうだ。それで今度はアリは種を巣の外に捨てに行くのだというから恐れ入ってしまう。\n(注1)惹かれる:心が引きつけられる","items":[{"no":51,"sec":"dokkai","stem":"筆者によると、アリはなぜカタクリの種を巣に運ぶのか。","options":["種についている脂肪分がアリの好物だから。","種はアリの成長に欠かせない栄養分だから。。","種がアリの餌になる幼虫に似ているから。","種をアリの生きた幼虫だと思うから。"],"ans":4},{"no":52,"sec":"dokkai","stem":"筆者によると、アリはなぜ集めた種を捨てるのか。","options":["種のにおいで、アリの幼虫が死んでしまうから。","種からアリの死んだ幼虫のにおいがするから。","種がアリの死んだ幼虫と同じ色に変わるから。","種がはじけて、アリの嫌うにおいを出すから。"],"ans":2}]},{"passage":"子は親の鏡と言われる。こどもを見れば親が分かるということだが、こどもは親のしぐさ、もの言いを実によく見ている。三つにもなれば如何にも(注1)生意気で反論などをするものだが、<span class=\"underline-q\">「そんな言い方をするもんじゃない」と言ったら負けだ</span>。「あら、あなたの言い方とそっくりよ」と横からチクリと揶揄される(注2)のがオチだから。全くこどもは物真似の名人なのである。\nアイドル歌手からくまのプーさんの喋り方まで、見境なく(注3)貪欲にコピーしてしまう。コピーすることによってこどもたちはすべてを獲得してゆく。こどもたちは個性的であろうなどと少しも考えない。みんなと同じじょうにできることが嬉しくてたまらないのだ。\nだが、こどもの再現のありさまを少し注意深く観察していると、この性能の良い複写機の、本当の性能の良さが見えてくる。大人たちの考えるコピーとはいささか違うのである。こどもたちの身体的能力、言語的能力は未熟なのでオリジナルなものの完璧なコピーはできない。\n従ってこどもはオリジナルなものを自由に改変する。切り捨て、誇張する。それはオリジナルなものからの絶妙な逸脱なのである。この模倣行為は、むしろ、一人のこどもの生きる生活全体のなかで、今全く新しく意味付けられた別のオリジナルなものが生成していると言ってもいいものなのだ。\nこどもが模倣をしながらも、とりわけ個性的であるのは、このような模倣モデルからの自由な逸脱があるからだ。私たちがこどもを見て楽しむのも、その逸脱のほほえましさなのではないか。\n(注1)如何(いか)にも:見るからに\n(注2)揶揄(やゆ)される:からかわれる\n(注3)見境(みさかい)なく:区別なく、何でも","items":[{"no":53,"sec":"dokkai","stem":"<span class=\"underline-q\">「そんな言い方をするもんじゃない」と言ったら負けだ</span>とあるが、なぜか。","options":["こどもの成長を否定しているようなものだから。","こどもの反論が正しいと認めるようなものだから。","自分で自分を注意しているようなものだから。","自分がこどもと同じレベルで答えるようなものだから。"],"ans":3},{"no":54,"sec":"dokkai","stem":"こどもの模倣について、筆者はどのように考えているか。","options":["完璧にはコピーできないことが、個性につながっている。","完璧にコピーしようとしているが、本質は捉えられていない。","オリジナルなものを自由に変えて、おとなを楽しませようとしている。","オリジナルからの逸脱を気にせず、自分の個性を表現しようとしている。"],"ans":1}]},{"passage":"人々の肉体には、実は大きな幅がある。生まれ持った個性があり、成長の段階で著しく改変するこうした人間が使用するものを作る際の方向性には、二つの選択肢がある。一つは、異なる体格や身体能力を持つ多数の人々が同じものや環境を平等に使えるようにする方法。もう一つは、それぞれの体格や能力に合わせて、いくつかのサイズや機能を用意する方法である。前者は経済的に有利な試みだが、その効果に限界があるケースが多い。後者は多様なユーザーに対応できるが、開発に時間がかかり、しかも作られたもののコストが上昇してしまうという問題性を孕んでいる(注1)。\nユニバーサルデザイン(UD)では、使い手の様々な問題負担を抑えつつ、個人に不平等感を抱かせないデザインやものづくりを求められている。デザインに平等という意識を上手に反映させていくために、多様な使い手とできるだけ接触し対話を行い、使い手に対する知識と体験を広げることが効果的だ。私たちは平等という感覚をどのようなときに感じ、考えるのかという点を、見つめ直したい。\n私たちが平等かどうかを意識するのは、確かな不平等の予感や印象を持つときであることは間違いない。平等がきちんと保証されている場合、その状況は私たちにとって自然なことであり、問題意識が芽生える(注2)ことはない。しかしデザインやものづくりに当たっては、問題が発生してから平等について考えるのではなく、ものやサービスに常に必要な普通の意識であるととらえたい。\n(注1)孕む:含む\n(注2)芽生える:生まれる","items":[{"no":55,"sec":"dokkai","stem":"人間が使用するものを作る際の問題点について、筆者が述べていることはどれか。","options":["同じもので多様な使い手に対応すると、そのものの効果に限界が生じる。","同じものを多様な使い手に対応させるには、開発に時間がかかりすぎる。","個別の使い手に対応すると、そのものの効果が見えにくくなる。","個別の使い手に対応すると、平等にものが使えなくなる。"],"ans":1},{"no":56,"sec":"dokkai","stem":"ユニバーサルデザインにおけるデザインやものづくりについて、筆者が最も言いたいことはなにか。","options":["多様な使い手が、平等だという感覚が持てるものを作り出すべきだ。","使い手が不平等だと感じたら、原因を究明しなければならない。","すべての使い手にとって平等であるものにすることは難しい。","常に使い手にとっての平等について考えなければならない。"],"ans":4}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"以下は、筆者がほかの研究員とともに開発したロボットについて書かれた文章である。\n通常、ロボットに対するプログラミングは、センサから取得した情報に応じてロボットが何らかの反応をするようなものを作っていく。たとえば「障害物を察知したら避ける」といった具合のものである。しかし、・僕はロボピーがもっと適当に、意味のない動きも含めてさまざまな行動を取るようにしたのだ。\n300以上の動作プログラムをし、動作パターンが次々にどういう順番で発現するかというルールを700以上プログラムした。その結果複雑に、多様に動くロボットが実現された。ここまでやると、自分たちでもプログラムがどう作用するかわからなくなる。何に反応して、どんな行動をするか予測不能になった。\nそんなプログラミングをしておいたロボピーを研究室に置いていたら、何が起こったか。僕らがミーティングをしているとき、突然ロボピーは僕らの音声を認識し、「そうではないよ」と言って手をぶらぶらさせながらどこかへ向かって歩きだしたのだ。それを見て僕らは呆気にとられながらも、ロボピーに意思を感じてしまった。僕らの話を聞いていて、彼は思うところがあり、だからどこかへ行ってしまったのだろう、と。\nもちろんそれは、ロボピーの中のあるプログラムが、何かをきっかけに作動しただけのことだ。だがなにか首尾一貫したひとつの意思決定機構から生み出された行動であるかのように見えたのだ。\n僕はそのとき確信した。「心とは、観察する側の問題である」と。\n非常に単純な機械の動きに「心を感じますか」と問えば、感じると言う人は少ない。多少複雑でも、原理を知っていれば「それは心ではない」と言う。しかし、人間は複雑である。いや、虫程度でもいい。動きが相当以上に複雑なものに対しては、相手のことを一から、すべては理解しきれない。自分の頭の中で完全に再現しきれない、解釈しきれない、理解しきれないほど複雑なもの、仕組みがよくわからないくらい入りくんだものが目の前にあると、「こいつは、私の知らないところで勝手に独立して考え、動いているのだろう」という想像が働く。その浮かんできた想像に名前をつけずにはいられなくなる。それを「心」と呼んでいるのだ。\n心とは、複雑に動くモノに現実的にあるというより、その動きを見ている側が想像しているものなのだ。\nそしてその心は、見ている側の自分にもないと都合が悪い。とくに人間同士であればお互いに「心がある」と感じてしまっている。だからひとはみな「自分には心がある」と思う。しかし心は、実は自分の中にいくら問い合わせ、内省してみてもしょうがない。相手を観察し、想像することでしかわからないものなのだ。","items":[{"no":57,"sec":"dokkai","stem":"ロボピーが、ほかのロボットと異なる点は何か。","options":["動作パターンが限られているので、ある程度動きが予測できる。","与えられた情報の一部を自分で判断して動くので、動きが予測できない。","どう動くかというプログラムを多数組み込んだので、動きが予測できない。","多様で複雑な動作をプログラムしたので、人間のように自然な動きができる。"],"ans":3},{"no":58,"sec":"dokkai","stem":"どこかへ向かって歩きだしたとあるが、その時筆者にはどのように思えたか。","options":["プログラムに間違いがあり、ロボピーに意思が生まれて動いた","プログラムが作動したのではなく、ロボピー自身が考えて動いた。","プログラムが作動して、意思があるかのようにロボピーが動いた。","プログラムが誤作動して、制作者の意図に反してロボピーが動いた。"],"ans":3},{"no":59,"sec":"dokkai","stem":"「心」について、筆者はどのように考えているか。","options":["あると思って観察すれば、複雑な動きの意図が理解できる。","実体がないので、あるとかないとか想像しても意味がない。","仕組みが複雑すぎるため、人間同士であっても想像できない。","理解しきれない複雑な動きを見たときに、人間が想像するものだ。"],"ans":4}]},{"label":"Mon11","passage":"A\n私は普段からメモ魔（注）ですが、人の講演に行くと、必死にメモを取りながら話を聞きます。せっかくその場にいるのだから、最大限吸収して帰ろうと考えます。あるいは友達とくだらない話をしている時でも、「あれ？」と思ったことや、「いい話だ」と思ったことは、何でもその場でメモを取るようにしています。そこで感じた何かや、新しく知り得たものは、別の機会に自分の役に立つかもしれないからです。\n新しい発想や考え方のヒントを得たいといつも問題意識を持っていれば、何気ない人の発言のなかにも発見があるはずです。メモを取らなければ忘れてしまいますので、必然的にメモを取ることになります。手を動かして、記録を取る結果、記憶にも残りやすくなります。こうして意識化・可視化することが大切なのです。\nB\n話を聞いている時に、視線も上げずにただひたすらメモを取っている人がいる。熱心さは伝わるが、質問もされないと興味や関心を持って聞いてもらえているのか不安になる。このような人は、メモを取ることが目的になってしまっているのではないか。多くの情報を正確に書きとることに集中してしまい、肝心な内容が頭に入っていないのだ。\nしかしどんなに正確にメモを取ったとしても、内容が理解できていなければ、あとでメモを活かすこともできない。受け身ではなく、自分に必要な情報は何か、自分だったらどうするかというように自分と関連付けて、主体的に考えながら聞くことが必要だ。メモは、あとで話を整理する際の手がかりになれば十分である。\n(注)メモ魔:何でもメモを取る人","items":[{"no":60,"sec":"dokkai","stem":"メモを取ることについて、AとBはどのように述べているか。","options":["AもBも、量よりも書きとる内容を意識して取ることが重要だと述べている。","AもBも、できるだけ多くの情報を正確に書き取ったほうがいいと述べている。","Aは内容を活用するために必要だと述べ、Bは取ることに集中し過ぎては意味がないと述べている。","Aは問題点や感想なども一緒に記入したほうがいいと述べ、Bは話の内容を理解していなければ正確には取れないと述べている。"],"ans":3},{"no":61,"sec":"dokkai","stem":"話の聞き方について、AとBの認識で共通していることは何か。","options":["何かを得ようという姿勢で聞くことが重要だ。","その場ですべてを理解しようとしなくてもいい。","手を動かしながら聞いたほうが、記憶に残りやすい。","興味や関心を示し、話し手に安心感を与えることが大切だ。"],"ans":1}]},{"label":"Mon12","passage":"企業にとっても、人々にとっても、さきのみえない不安な時代である、そしてそんな不安な時代を生きる子供たちに、「生きる力」をつけさせたいという「親心」は、わからないではない。また企業の経営者が、少しでも優秀な人材を取り込みたいと考えるのは、必然ではあるだろう。地域の衰退や産業の空洞化を食い止められる人間が現れてくれれば、わたしたちの不安な気持ちも、いくぶんなりとも和らぐというものである。\nしかし、まがりなりにも教育学を専門とする者として、ここは言わせてほしい。現代日本社会の問題を、なんでもかんでも教育で解決しようというのはいただけない。\n確かに教育は、人間を育てることを通じて、人々の人生や社会の未来に対して、一定の貢献を為すことができる。しかしわたしに言わせれば、そのような教育の役立ちの度合いは、決して大きいものではない。教育には不確定性がつきものである。これはもう、教員養成のテキストでも論じられる「教育学の基本のキ」だ。教えたからといって、その分だけ子どもが育つというわけではないし、教えたつもりがないのに、子供の方が勝手に学んでいるということもある。もちろん教師も教育学者も、その確率論的な育ちをどうにかして望ましい方向に向ける努力はするが、なんと言っても育つのは子どもなのだから、「最小限のコストで最大限のメリットを達成しなさい」「必要な人材をきっちりきっかり、耳をそろえて(注1)社会に納品しなさい」などという注文を、そうそう請け負うことはできない。\nそれにそもそも教育は、経済のためだけのものでも、共同体の維持のためだけのものでも、家族のためだけのものでもない。市場も、国家も、地域共同体も、そして家族も、もっと役に立つ教育をしろ、意味のある教育をしろと言うけれど、それぞれ注文はバラバラなのである。もちろん教育は、それぞれの要求に(確率論的に)少しずつ貢献はする。しかしそれをもって推し進めて、どれかの目的のためだけに合理化・効率化しようとすれば、教育はずいぶんと歪な(注2)ものになる。まして、みんながみんな教育からそれぞれの利益を引き出そうと躍起になっても(注3)、そんな過剰な期待に引き裂かれた教育がうまく機能するとは思えない。\n(中略)\n停滞の続くこの社会で、誰もが不安に押しつぶされ、ちょうどその分だけ教育に過剰な期待や希望を託そうとしている。その結果、教育、なかでも学校教育が、改革の波に呑まれ、余裕をなくしそうになっている。教育に多くをもとめすぎると警報を鳴らすことは、結果的に、この社会と教育を持続させるためにいま一番必要なことなのではないだろうか。\n(注1)耳をそろえて：不足なく(注2)歪な：ゆがんだ(注3)躍起になっても：必死になって","items":[{"no":62,"sec":"dokkai","stem":"決して大きいものではないと考える理由として、筆者が述べているのはどれか。","options":["企業や社会が望む人材と、教育学で目標とする人材は異なるから。","「生きる力」をつけるために必要なことは、明確ではないから。","子ども一人一人に併せて、教育の内容を変えられないから。","子どもは、教えたとおりに育つとはかぎらないから。"],"ans":4},{"no":63,"sec":"dokkai","stem":"教育について、筆者の考えに合うのはどれか。","options":["それぞれの目的に合わせて合理化・効率化しなければ、機能しない。","みんなで一つの目的を共有しなければ、効果は上がらない。","特定の目的を果たすために存在するものではない","役に立つかどうかという観点で評価されるべきだ。"],"ans":3},{"no":64,"sec":"dokkai","stem":"筆者が最も言いたいことは何か。","options":["多様な社会の要求に応えられるように、教育のあり方を考え直すべきだ。","社会の不安を取り除くためには、教育を合理化・効率化すべきではない。","教育の改革によって、安定した社会を持続させていくことが必要だろう。","現代社会の問題のすべてが、教育で解決できると思ってはいけない。"],"ans":4}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"木原市健康づくりセンター　いきいき運動教室のご案内\n健康のために、楽しく運動しませんか。健康づくりセンターでは、三つのクラスを毎週開講しています（通年開講）。1回ごとの予約制なので、ご自分のペースで受講ができます。\n【対象】\n下の①、②両方に当てはまる方\n① 市内在住、もしくは市内で勤務している、18歳以上の方\n② 健康づくりセンターの健康度測定を、受講日から過去1年以内に受けた方\n※健康度測定の内容や予約方法等の詳細は、ホームページでご確認ください。\n水曜日　ダンスA　初心者でもできるゆっくりしたダンスをします。\n木曜日　ダンスB　リズムに合わせて速く動くダンスをします。\n金曜日　体操　全身を使った体操をします。\n〈時間〉10:40-11:00　〈会場〉第一運動室　〈料金〉1回500円\n【利用方法】\n◆予約の仕組み\n・申し込みは各クラス毎回必要で、先着順です（各クラス定員20名）。\n・予約の種類は、基本予約と追加予約があります。\n　基本予約：すべてのクラスの中から週に1回分だけ予約できます。基本予約は、受講日の前の週から可能です。\n　追加予約：実施日の2日前に定員に達していないクラスに限り、基本予約1回分のほかに追加予約ができます。追加予約が可能な回数は週1回のみです。\n　空きは2日前から、健康づくりセンター窓口か電話で確認できます。\n◆予約方法\n・いきいき運動教室の予約が初めての方は、健康度測定の結果票をお持ちになり、窓口で予約してください。受講者カードを作ります。\n・予約が2回目以降の方は、健康づくりセンターにある予約機か電話でしてください。\n◆料金の支払い\n・受講日当日に、自動受付支払機で料金を支払ってください（受講者カードが必要です。忘れた方は窓口で対応します）。\n木原市健康づくりセンター　電話：02-1124-45","items":[{"no":65,"sec":"dokkai","stem":"次の4人は今年の4月に、運動教室を受講したいと考えている。この中で、この教室を受講できる人は誰か。\n\n【ダニエルさん】54歳／住んでいる所：木原市内／勤務地：木原市外／健康度測定：去年の1月に受けた\n【木村さん】34歳／住んでいる所：木原市外／勤務地：木原市内／健康度測定：去年の10月に受けた\n【大川さん】16歳／住んでいる所：木原市内／勤務地：なし／健康度測定：今年の2月に受けた\n【チンさん】27歳／住んでいる所：木原市内／勤務地：木原市内／健康度測定：今年の5月に受ける予定","options":["ダニエルさん","木村さん","大川さん","チンさん"],"ans":2},{"no":66,"sec":"dokkai","stem":"シャヒンさんは、来週の「ダンスA」を予約したが、空きがあれば来週の「体操」も追加予約したいと考えている。どうすればいいか。","options":["来週の月曜日以降に窓口か電話で空きを確認し、空きがあれば、窓口で予約する。","来週の月曜日以降に窓口か電話で空きを確認し、空きがあれば、予約機か電話で予約する。","来週の水曜日以降に窓口か電話で空きを確認し、空きがあれば、窓口で予約する。","来週の水曜日以降に窓口か電話で空きを確認し、空きがあれば、予約機か電話で予約する。"],"ans":4 替え","sec":"bunpo","instr":"次の文の ★ に入る最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":36,"sec":"bunpo","stem":"秋の初めてのこの時期は、真夏の戻った（　　）（　*　）（　　）（　　）、気温の差が大きくて体調を崩しやすいので、注意が必要だ。","options":["日もあり","日もあれば","ひんやりとした","かのような"],"ans":2},{"no":37,"sec":"bunpo","stem":"歴史的価値が高いとされる旧日本小学校の校舎を始めて見たが、とても（　　）（　　）（　*　）（　　）驚いた。","options":["100年前に","現代的なデザインに","建てられたものとは","思えないほどの"],"ans":4},{"no":38,"sec":"bunpo","stem":"くしゃみや鼻水といった症状が現れる花粉症は、風邪と（　　）（　　）（　*　）（　　）ケースもあるそうだ。","options":["自覚がない","自分は花粉症だという","症状が似ている","こともあって"],"ans":2},{"no":39,"sec":"bunpo","stem":"高校卒業後の進路について両親に反対されたが、誰に何と（　　）（　　）（　*　）（　　）思う。","options":["思える道を","信じて進みたいと","言われようとも","自分がこれだと"],"ans":1},{"no":40,"sec":"bunpo","stem":"企業の海外進出が成功するかどうかは、（　　）（　　）（　*　）（　　）といってもいいだろう。","options":["優秀な人材を確保できる","にかかっている","か否か","その国の事情をよく知る"],"ans":3}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、「41」から「44」の中に入る最もよいものを 1・2・3・4 から一つ選びなさい。","passage":"以下は、新聞のコラムである。\n昔に比べてレストランのメニューに修飾語が増えたと感じる。「プリプリ海老の○○パスタ」「とろ〜りチーズ入りのハンバーグ」「××県産のやわらか若鶏の△△」といった感じだ。付加価値や希少価値をアピールして、商品の差別化を図りたいのだろう。\nこれらの修飾語は [41] 食欲を刺激し期待感を高める。でもよくよく考えると、差別化の中身は実にあいまいだ。プリプリ海老の定義は？チーズはみな、とろ〜りするのでは？××県産が品質保証になるのか？\n実質的な中身を伴った新商品の開発が困難になっていく高度消費社会では、見せかけの新しさで消費を刺激しようとする傾向が強まる。商品のパッケージを新しくしたり、商品名の変更が頻繁に行われたりするのも [42] 。消費社会とは、商品の差別化戦略によって中身の空虚な(注1)ネーミング(注2)が氾濫し、消費者がそれに踊らされる世界ではないのか。\nそのような社会は、私たちの言語感覚 [43] 変えてしまう可能性がある。商品の差別化競争に終わりがないなら、修飾語こそが肝要になる。つまり、修飾語を伴った呼称がデフォルト(注3)となり、裸の名詞が空虚に感じられるようになるかもしれない。\n何十年かすれば、生物としての海老という記号は空洞化して、おいしそうな食材としての修飾語が不可欠な要素となり、「海老」は「プリプリ海老」、「海老のチリソース」は「プリプリ海老のチリソース」と呼ばれているのだろうか。\n私たちは、増殖する見せかけの新しさに囲まれながら、空虚な記号と戯れ続ける(注4)しかないのか？メニューに並ぶ修飾語は、消費社会の遠い未来からの [44] 。\n(注1)空虚な：実質的な意味がない\n(注2)ネーミング：名前を付けること\n(注3)デフォルト：標準\n(注4)戯れ続ける：ここでは、付き合い続ける","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["むしろ","かえって","たしかに","ようやく"],"ans":3},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["それ以来だ","それだけだ","そのままだ","そのためだ"],"ans":4},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["が","すら","なら","でもって"],"ans":2},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["使者のようでもある","使者とのことである","使者だとは言えない","使者にもなり得まい"],"ans":1}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"「嫌い」はネガティブな(注)感情で、まさに嫌悪感をもってしまいがちですが、自分の中に芽生えてきた大切な感情であり、大事な機能でもあります。何より根絶できません。\n「嫌い」はとてもパワーを必要とする感情ですから、それだけに反動も大きい。振り回されないための第一歩は、嫌いを認めることです。ネガティブな感情でも、もつことは自然なことであり、生きる上でメリットになる、そして周囲の人にもメリットがあると捉えてみてください。\n(注) ネガティブな：否定的","items":[{"no":45,"sec":"dokkai","stem":"「嫌い」の感情について、筆者の考えに合うのはどれか。","options":["否定的で強い感情であり、振り回されても仕方がない。","なくせない感情であり、受け入れたほうがいい。","認めることで、その感情を抑えることができる。","理由を考えれば、振り回されることはない。"],"ans":2}]},{"passage":"安く売るべきか、品質にこだわるべきか。事はそんなに単純ではない。どんなに良い商品であったとしても、できるだけ価格を抑えるための努力は必要だ。品質にこだわる戦略というのは、品質さえ良ければどんなに高くても買ってもらえるという短絡的な戦略ではない。\nできるだけ価格を抑える努力はしているけれども、それでも品質にこだわるとこれ以上は安くできない。他社の商品よりも高いのだけれども、それだけの価値はある。だからその差額を許容してほしい。そう訴えることが、品質にこだわった正しい戦略である。","items":[{"no":46,"sec":"dokkai","stem":"品質にこだわる戦略とは、どういうことか。","options":["品質に見合った価格であると主張する。","品質の良さと価格の低さを主張する。","価格に合わせた品質であると主張する。","価格よりも、品質の良さを主張する。"],"ans":1}]},{"passage":"時には、自らに「素朴な質問」を投げかけてみてはどうだろうか。子どもが親に尋ねるような「素朴な質問」というものは、意外にも人生や生きることの本質にかかわることであり、人生論や哲学の課題であることが少なくない。そうした質問を真正面から投げかけられたとき、はっと何か気づかされるところがあって、自分の日常を反省するような反応を示さないとしたら、その人の感性は相当に(注)枯れていると考えたほうがよい。\n(注) 相当に：かなり","items":[{"no":47,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["素朴な質問に向き合って、日常を省みることが必要だ。","親が子どもから人生の本当の意味を教わることもある。","大人になると、子どもが尋ねるような質問をすることは難しい。","感性を磨くには、子どもが投げかけた素朴な質問に答えるとよい。"],"ans":1}]},{"passage":"科学とは、知れば知るほどわからないことが増えてくるものである。自分は何も知らなかったと思い知らされるのが科学者の日常と言える。\nつまり、科学者は研究を極めれば極めるほど謙虚になる。自分の無知さを知って謙虚にならざるを得ないのだ。\nその観点から言えば、知ったかぶりをする(注)科学者はもはや研究をストップしており、それまでに得た知識を誇っているに過ぎないと言うことができる。もはや過去の人であり、その知識は時代遅れになっている可能性が高いのだ。\n(注) 知ったかぶりをする：知っているふりをする","items":[{"no":48,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["科学者は時代に合った知識を持つべきだ。","科学者は研究を続けることでより謙虚になるものだ。","謙虚であれば、よい科学者として認められるものだ。","どんな科学者であっても、自分の無知を自覚しているものだ。"],"ans":2}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"ともすると私たち大人は、自分たちの子ども時代の遊びはよくて、今の子どもの遊びは好ましくないと考えがちです。(中略)今はダメで昔はよかったというような感覚をもって、今の子どもの遊びについて考えると、<span class=\"underline-q\">とんでもないことになります</span>。子どもたちが嬉々として(注)遊んでいるものを取り上げて、今の時代ではおもしろくないような遊びを、無理に押しつけることになってしまいます。そうなると遊びが遊びでなくなってしまいかねません。\nまた、私たちが考える好ましい遊び環境となると、なぜかとても整理された空間になりがちです。たとえば画一化された公園を見ると、ムダなく機能を重視したオフィスを連想させさえします。限られたスペースで、しかも安全性や管理の問題を考えればそうならざるをえないのかもしれませんが、それでは子どもが遊びたいと思わなくなるのです。\n子どもたちの遊び空間には、もしかしたら不自由さや不便さ、大人がムダだと思えるようなものも必要かもしれません。配慮の行き届きすぎた場所は、遊園地という商業施設は別として、子どもたちが自由に遊べる環境としては好ましくないのではないでしょうか。\n子どもたちの遊び環境について考えるときに大切なのは、私たち大人の側にあるそのような先入観です。自分は子どものころにこんな遊びをした。今の子どもはそれをしていない。だから今の子どもは遊んでいない。こんな単純な考え方では、決して子どものためになる遊び環境など考えることはできません。\n(注)嬉々として:喜んで","items":[{"no":49,"sec":"dokkai","stem":"<span class=\"underline-q\">とんでもないことになります</span>とあるが、どうなるのか","options":["子どもが子ども同士で遊べなくなる。","子どもが自由に遊びを楽しめなくなる。","子どもが今の時代の遊びに興味をもたなくなる。","子どもが安全に管理された場所でしか遊べなくなる。"],"ans":2},{"no":50,"sec":"dokkai","stem":"筆者が言いたいことは何か","options":["大人は子どもの遊びに干渉するべきではない。","大人は安全性を考えて、遊び環境を整えなければならない。・","大人は先入観をもたずに、子どもの遊び環境を考えるべきだ。","大人の先入観が遊び環境を考えるうえで役に立つこともある。"],"ans":3}]},{"passage":"私たち人間は、いろいろなものを食べる雑食性動物です。それに対し、基本的にパンダはササだけを食べ、コアラ(注1)はユーカリの葉だけを食べます。動物の生き残り戦略を考えると、雑食性動物の方が、慣れ親しんだ食べものが入手困難な状況になったとしても、それ以外の食べられるものへと嗜好をシフトすることによって飢餓を脱し、生存する確率を高めることができます。雑食性動物は環境適応性に優れた生きものといえます。\nしかしその一方で、新たに見つけ出した食べものが毒性をもっていたり、栄養バランスが悪いものであれば、健康を損ね、最悪死に至る可能性があります。そのため、雑食性動物は、新しい食べものを食べるときには、必ずそのリスクと対峙(注2)しなければなりません。\nすなわち雑食性動物は、食べたことのないものを食べるのを躊躇する「食物新奇性恐怖」と、積極的に食べようとする「食物新奇性嗜好」という相矛盾(注3)する行動傾向を、生まれながらに合わせもっているといえます。(中略)雑食性動物がもつ食べものの新奇性恐怖と新奇性嗜好のジレンマを解消してきたもののひとつが、人の「調理」という行為です。食べたことのない食材、たとえば昆虫をそのままの“原型”で出されると、拒否感を抱く人が多いですが、粉にしてチップスなど、見慣れたお菓子のかたちで提供されれば、食べる人は確実に増えます。さらに慣れ親しんだ調味料で味付けしたものなどてあれば、「あっ、意外とおいしい」と好評価を得るかもしれません。この調理という操作が、新奇なものを食べるという恐怖を緩和させるのに一役(注4)買っています。\n(注1)コアラ:動物の一種\n(注2)対峙する:ここでは、向き合う\n(注3)相~:互いに~\n(注4)一役買う:ここでは、役立つ","items":[{"no":51,"sec":"dokkai","stem":"筆者によると、雑食性動物の特徴は何か。","options":["慣れ親しんだものを食べたいという気持ちよりも、新しい食べものへの好奇心の方が強い。","新しい食べものに対して、恐怖心をもちながらも、挑戦する性質をもっている。","いろいろなものを食べるので、栄養バランスが偏らず、生存する確率が高い。","目の前に食べものがあれば、躊躇せずに積極的に食べようとする。"],"ans":2},{"no":52,"sec":"dokkai","stem":"筆者によると、調理することでどうなるか。","options":["食材が限られていても、人間の欲求を満たすことができる。","新しい食材への好奇心は薄れるが、恐怖は解消できる。","慣れ親しんでいないものへの好奇心を高めることができる。","食べたことのないものへの抵抗感を減らすことができる。"],"ans":4}]},{"passage":"私は、自分の研究をおもしろいと思えるのと同じ程度に、他人の研究をおもしろいと思えるかどうかが、研究者に向いているか否かの判断の基準であると思っている。いくらいいデータを出す人であっても、他人のデータを自分の仕事と同じだけの熱量を持っておもしろがれなければ、研究者としてははっきり不向きであると思わざるを得ない。学者としては失格であろう。\nこれがもっとも端的にあらわれるのが、研究発表の際に見られる質問の量である。\n(中略)発表された内容を、当事者として自分ならこういうアイデアで実験をし、結果をこう解釈することもできる、明確な結論を得るためにはこの部分に不備があり、次にはこんな実験を計画すれば、もっとはっきりした結論に到達することができるのではないか、などなど、考え始めれば、おのずから尋ねたいことは次から次へ出てくるはずなのである。\n私はこれを「能動的に聞く」と言っている。人の話は、能動的に聞いてこそ、自らの身につくものである。話された内容をただひたすら覚えようとしたり、吸収しようとしているだけでは、却ってその知識は自分のものとならない。\n「能動的に聞く」とは、話された内容を、自らのこれまでの知の体系のなかに位置づけることであり、位置づけるためには、聞きつつ常に自分の知の体系を確認し、照合する作業を伴うはずである。外部からインプットされてくる内容と、既存の自らの知識の箱とのあいだに軋轢が生じるのは当然であり、その軋轢こそが質間を促す力になる筈なのだ。","items":[{"no":53,"sec":"dokkai","stem":"筆者によると、研究者として不向きな人とはどのような人か。","options":["他人の研究に、自分の研究ほどの関心を持てない人。","他人よりいいデータを出すことができない人。","自分の研究も他人の研究もおもしろがれない人。","自分の研究に、他人の研究成果を生かせない人。"],"ans":1},{"no":54,"sec":"dokkai","stem":"筆者によると、どのようにすれば質間の量が増えるか","options":["既存の知識に聞いた内容を加えて、知の体系を豊かにする。","聞いた内容と自分の知の体系を照合し、違いを意識する。","新しい知の体系のなかに、既存の自分の知識を組み込む。","自分の既存の知識に、常に疑問を持つ。"],"ans":2}]},{"passage":"企業Aと企業Bがあり、ある契約をそのどちらと取り交わすべきか考えるときに、A社は資本金1000万円、B社は資本金1億円であるという情報は、おそらく重要な情報の一つであると想定されるが、すべてではない。従業員数、年商(注)、営業継続年数、支社数・支店数、などなどのうちから、意思決定者が、意思決定の方針に基づいて重要な情報を取捨選択しなければならないだろう。そのとき、ことさらにいくつかの情報に力点を置く報告書があげられたときに、意思決定者(経営者)はそこに存在する<span class=\"underline-q\">「意図」を充分に嗅ぎ取らなくてはならない</span>。つまり、汚染されている可能性があるということである。ここで、報告された情報がすべて確実な事実であったとしても汚染は生じている可能性があるという点に注意が必要である。\nしたがって、情報汚染とは、ある情報に、本来想定しているもの以外の何かが付随していて、それによってその情報の理解が歪むことをいう。その何かとは、その情報をもたらした側の意図である。この世界に「データのみで構成されていて、そこに意図の混入が認められない」という意味での無色透明な情報など存在しない。どのような情報であっても、意図という色で染められている。そして、重要なのはそれが必ずしも汚染ではないという点である。意図が混入するのは当然のことであり、すべての情報には意図が混入しているのであるから、それだけでもってそれを汚染とまでは呼べない。\nそれが汚染となるのは、その情報に含まれる「意図」によって、その情報の本質部分である「データ」の理解が深められるからである。\n(注)年商:一年間の売り上げ額","items":[{"no":55,"sec":"dokkai","stem":"<span class=\"underline-q\">「意図」を充分に嗅ぎ取らなくてはならない</span>とあるが、なぜか。","options":["事実ではない情報が意図的に混入されているかもしれないから。","意思決定者に有利な情報が取り除かれているかもしれないから。","情報には意図が含まれていて、理解が歪められるかもしれないから。","情報をもたらす側の意図が、歪められて理解されるかもしれないから。"],"ans":3},{"no":56,"sec":"dokkai","stem":"情報の汚染について、筆者はどのように述べているか。","options":["情報が汚染されているかどうかを見抜くことは難しい。","情報が汚染されていても、受け取る側の理解に影響はない。","情報に意図含まれていても、汚染されているとは限らない。","すべての情報には意図が含まれているので、汚染されているといえる。"],"ans":3}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"以下は、森林を守るボランティア活軌をしている人が書いた文章である。\n世界的に森林や自然の維持、復元に対する関心が高まってきたとき、この気運(注1)を支えた初期の理論は、人間中心主義的な森林・自然維持論、つまり人間の生存や未来にとって森林や自然の維持は不可欠であるという理論であった。いわばそれは、人間のための森林・自然維持論であった。ところが、この考え方は、たちまち暗礁に乗り上げる(注2)。\n第一に、人間のための森林・自然維持論であるかぎり、人間のための森林・自然の開発論を否定できなくなる。なぜなら、どちらも「人間のための」という共通の基盤の上にたっている以上、その違いは価値観の違いにすぎず、人間の価値観を統一することなどできないばかりでなく、すべきでもないからである。\n第二に、「人間のための」といっても、その内容はさまざまである。農山村に暮らす人びとと都市の市民とでは、その感じ方は同じではないし、たとえば同じ山村に暮らす者でも、林業経営をしている者とそうでない者とでは、考え方が異なってくる。人と森の関係は多様である以上、どうすることが人間のための森林・自然の維持なのかと問われれば、その答えはさまざまである。\n第三に、「人間のための」という発想にたつかぎり、「人間のためにならない」自然は破壊してもよいということになりかねない。\nこうした問題点があったために、「人間のための」論は、つまり人間中心的な森林・自然維持論は、たちまち破綻してしまった。自然保護思想の流れをみるなら、それに代わって生まれた理論は、自然中心主義的な考え方であった。それは、人間のためになろうとも、ならなかったとしても、自然はそれ自身のうちに生存権をもっており、その生存権は保障されなければならないというものであった。\nところが、この考え方にも問題点があった。なぜならこの理論では、原生林や原生的な自然を維持する理論としては有効でも、たとえば日本のような、長い歴史のなかで自然と人間とが相互に影響を与えながら、それぞれが暮らしてきた地域の森林・自然の問題をよく説明できないからである。\n一例をあげれば、かつて農山村の人びとは、自分たちの暮らしを守るために、人家の近くに里山天然林をつくりだした。それは、徹底的に人間の手を加えた天然林である。(中略)\n森林ボランティアとは、自発的に森の中で仕事をする人びとである。そうである以上、私たちは、人間中心主義的な立場にたっことも、自然中心的な立場にたつこともできない。\nとすれば、どうすればよいのだろうか。この問いに対して、私たちは、森林・自然と人間の関係を持続的に維持していくことこそが重要だと考える。単純に人間の未来を守ることでも、森を守ることでもない。森林と人間の関係を維持することによって、森と人とが相互的な依存関係をもっている日本の森と人の営みを守っていくことである。\n(注1)気運:ここでは、意識の高まり(注2)暗礁に乗り上げる:ここでは、進められなくなる","items":[{"no":57,"sec":"dokkai","stem":"「人間のための論」の問題点として、筆者の考えに合うのはどれか。","options":["人間のための森林・自然の維持に、結びついていないこと。","人間がいなければ、森林・自然は維持できないと考えていること。","農山村に暮らす人間の考え方が優先されすぎていること。","森林・自然の維持に対する考え方は、立場によって異なること。"],"ans":4},{"no":58,"sec":"dokkai","stem":"筆者によると、日本に関して、自然中心主義的な考え方が問題なのはなぜか。","options":["人間の介入によって、維持されてきた森林・自然もあるから。","人間が手を加えずに、原生林や原生的な自然を維持するのは難しいから。","自然の維持よりも人間の暮らしを守ることが優先されているから。","自然の生存権を保障することについて、人間の理解が得られないから。"],"ans":1},{"no":59,"sec":"dokkai","stem":"筆者によると、森林ボランティアの役割とは何か。","options":["人間を中心として、森林・自然との関係を維持していくこと。","人間の営みを制限して、森林・自然との新たな関係を見付け出すこと。","森林・自然と人間が共存できる関係を維持していくこと。","森林・自然が持続できるように、できるだけ自然に任せること。"],"ans":3}]},{"label":"Mon11","passage":"A\n勉強やスポーツなど何かに取り組んでいる時にスランプはつきもの（注）だ。いつもどおりしているのに、全く成果が上がらない。そんな時間が続くと、自分には能力が足りないのではないか、これ以上は上達しないのではないかと自信を失ってしまう。\nしかし、スランプとは一時的に調子が悪くなっている状態にすぎない。誰にでも調子の良い時と悪い時があり、それは波のようにやってくる。悪い時にはそれを乗り越えようともがくのではなく、波に身を任せるようにするといい。現状をすなおに受け止め、これまでと同じことをやり続けるのだ。そうして自然に波を乗り越えれば、またやる気も自信も戻ってくる。そうすれば、自然に次にやるべきことも見えてくるものだ。\nB\nスランプの状態になると、調子が良かった過去と比べてしまいます。だから、その差にショックを受けてしまって、自信を無くしてしまうわけですね。調子の波があることは普通なので、良い時と比べるのは止めましょう。\nそれよりも、今に集中することの方が大切です。今の自分を受け入れて、「これからどうするべきか」ということを考えてください。こういう考え方ができれば、前向きに物事を捉えることができるはずです。\nいつまでも過去に捉われている人は、後悔や焦りといった感情しか出てきません。しかし、今を見ている人だと、「どうすればいいか」という生産的な考え方ができるわけですね。\n(注)つきもの：当然あるもの","items":[{"no":60,"sec":"dokkai","stem":"スランプの時に落ち込んでしまう原因について、AとBはどのように述べているか。","options":["AもBも、成果が上がらない原因を考えすぎてしまうからだと述べている。","AもBも、過去の状態と比較して、焦ってしまうからだと述べている。","Aは何が悪いのかが分からないからだと述べ、Bは調子が良い人と比較してしまうからだと述べている。","Aは能力の限界だと思ってしまうからだと述べ、Bは良かった時と比較してしまうからだと述べている。"],"ans":4},{"no":61,"sec":"dokkai","stem":"AとBは、スランプの時はどのようにするのがいいと述べているか。","options":["AもBも、現状を維持しながら、調子が良くなるのを待てばいいと述べている。","AもBも、成果を上げるための方法を考えたほうがいいと述べている。","Aはやる気や自信を取り戻すまで待ったほうがいいと述べ、Bは今の状態を受け入れて、自然に任せていればいいと述べている。","Aは特別なことは何もしなくてもいいと述べ、Bは現状を認めて、今後どうするべきかを考えたほうがいいと述べている。"],"ans":4}]},{"label":"Mon12","passage":"以下は、十代の若者に向けて書かれた文章である。\n　だれでも、自分が自分であることを望み、個性的であろうと願っている。そしてその一方では、自分が他のみんなと違った、自分であることを恐れている。\n　本当は、「個性的」であろうと思って、個性的になれるものでもない。それはたいてい、「個性的」といわれる一つの型に、自分をあてはめていることだったりする。人間にとっては、「個性的であれ」などと言われても、どうしてよいかわからないものであって、「個性的」とよばれる型を持ったほうが楽なのだ。しかしそれは、本当に個性的なわけではない。\n　それでも、青年期に向けて、個性的であろうと試みることは、よいことだ。かりにそれが、一つの型にすぎなくても、あるいは、個性的であろうとして挫折し、個性的であることから逃避することも含めて、自分にとって個性とはと、考えるのはよいことだ。それは、自分が自分であることの、あかしでもある。\n　そこでは、ときに悩むことがあったり、どうしたら個性的な人間になれるかと、模索することもあるかもしれない。それはじつは、「個性的」であること以上に、自分というものを意識していく、一つの過程である。そうした意味では、「個性的」であるかどうかなんて、本当はたいしたことではなくて、自分というものが確立していくことが、大事なことも言える。\n　そしてじつは、個性というものは、人間のひとりひとりに備わったもので、その個性がありのままに出ていることが、本当の意味で個性的である。むしろ、本当の自分が出せないから、没個性的にもなるのだ。もちろん、人間はまわりの社会を気にするものであって、自分をよそおうことも含めてしか、社会のなかで存在できない。無理に「個性的」かどうかを、自分のよそおいを捨てようとしても、捨てられるものではない。そうした、社会とのかかわりも含めて、自分というものはある。\n　たいていの場合、つっぱったり、いじけたりしていては、自分の個性は発揮できない。つっぱるまいとするのが一種のつっぱりだったり、いじけまいとしてそのことにいじけたり、なんてことまで問題にしだすと、ちょっと言葉の遊びみたいになるが、ま、そうしたことまで含めて、気楽に自分であるようにしなくては、本当の意味で個性的にはなれないものだ。\n　そして、ありのままの自分を出すことへの不安が、「個性的」を一つの型にしたり、あるいはそうした型から逃れる道へ向かわせたりもする。\n　それでも結局、自分とはありのままの自分しかない。それを自覚したとき、きみは個性的なきみになる。","items":[{"no":62,"sec":"dokkai","stem":"よいことだとあるが、なぜか。","options":["個性的である必要はないと気づくから。","挫折したり悩んだりする経験が個性を作るから。","自分という人間を意識することになるから。","自分にあてはまる個性の型を見付けられるから。"],"ans":3},{"no":63,"sec":"dokkai","stem":"個性について、筆者はどのように考えているか。","options":["自分から社会とかかわることで、意識できるものだ。","他人と比較しなければ、自然に発揮できるものだ。","なりたい自分を意識すれば、自然に身につくものだ。","求めて得るものではなく、初めから持っているものだ。"],"ans":4},{"no":64,"sec":"dokkai","stem":"筆者が最も言いたいことは何か","options":["自分の個性を模索すべきだ。","自分自身であることが大事だ。","ありのままの自分を出せなくてもいい。","型に縛られない生き方をしたほうがいい。"],"ans":2}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある大学の研究活動助成の案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"星川大学　2022年度「グローバル研究活動助成」募集要項\n1. 応募資格（以下の条件を満たす者）\n2022年度に星川大学の大学院に在学していて、2021年度に本助成に採択されていない者\n2. 対象となる研究活動（以下の①または②に当てはまる活動）\n① 渡航期間10日間以上で、海外において調査を行う。\n② 海外での研究会議、シンポジウム等で研究発表を行う（渡航期間は問わない）。\n3. 対象となる研究活動の実施期間\n①②ともに2022年8月1日から2023年3月31日までに行うもの\n4. 助成金額等\n一人あたりの助成金額の上限は20万円とします。応募は一人1件のみ可能です。助成対象の費目の詳細は別紙を参照してください。\n5. 選考　書類による選考\n6. スケジュール\n募集期間：2022年5月10日（火）〜6月10日（金）　結果通知：2022年7月中旬\n7. 応募手続き\n以下のA〜Cを研究推進課窓口へまとめて提出してください。\nA 申請書（様式1）\nB 推薦書（様式2）…指導教員が作成したものを学生本人が提出すること。作成依頼は余裕をもってするようにしてください。\nC 発表申し込みの写し（②の場合のみ）…申し込みの開始が募集期間後になる場合は、準備ができ次第提出すること。\n●AとBの記入用紙は4月26日から募集期間の最終日まで研究推進課窓口で配布します。研究推進課のウェブページからダウンロードもできます。\n●②で発表が確定していない場合でも応募することができます。その旨をAに記入のうえ、必ず募集期間内にAとBを提出してください。また、実際に発表するかどうかが決まり次第、速やかに連絡してください。\n8. 採択後の注意事項\n報告書と経費の領収書を帰国後2週間以内に提出してもらいます。未提出の書類があった場合は採択を取り消す可能性があります。\n問い合わせ先：研究推進課　電話：061-625-9398　Eメール：graduate-research@hoshikawa.ac.jp","items":[{"no":65,"sec":"dokkai","stem":"次の4人は、星川大学の大学院に在学中で、以下の研究活動を行いたいと思っている。「グローバル研究活動助成」に応募できるのは誰か。\n\n【西田さん】海外のシンポジウムで講演を開く／渡航時期：2022年8月24日から3日間／この助成の採択歴：なし\n【ダリアさん】海外に渡航し、資料の収集や調査を行う／渡航時期：2022年1月18日から3日間／この助成の採択歴：なし\n【ラワンさん】海外で研究発表を行う／渡航時期：2022年2月20日から5日間／この助成の採択歴：2020年度にあり\n【山本さん】海外に渡航し、調査を行う／渡航時期：2022年8月20日から12日間／この助成の採択歴：2021年度にあり","options":["西田さん","ダリアさん","ラワンさん","山本さん"],"ans":3},{"no":66,"sec":"dokkai","stem":"応募に関して、留意しなければならないことは何か。","options":["指導教員から研究推進課窓口に提出してもらわなければならない書類がある。","研究活動が発表か調査かによって、提出しなければならない書類の種類が異なる。","記入用紙は、5月10日までに研究推進課窓口に取りに行かなければならない。","研究発表の場合、発表を行うことが確定していないと応募ができない。"],"ans":2}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t12-2022-nghe.mp3","items":[{"no":67,"sec":"nghe","stem":"1番：男の学生はこの後、まず何をしなければなりませんか？","options":["応募書類の用紙を取りに行く","指導教員の許可を得る","説明会に参加する","経験者に話を聞く"],"ans":2,"blind":false},{"no":68,"sec":"nghe","stem":"2番：女の人はこの後、昇格のために最初に何をしなければなりませんか？","options":["部長と面談する","筆記試験を受ける","プレゼンテーションをする","研修を受ける"],"ans":4,"blind":false},{"no":69,"sec":"nghe","stem":"3番：部員は何をしなければなりませんか？","options":["代わりの会場を探す","ポスターを張る場所を探す","ちらしを配る","招待券を配る"],"ans":3,"blind":false},{"no":70,"sec":"nghe","stem":"4番：男の店員は今日、何をしなければなりませんか？","options":["新刊の紹介文を書き直す","新刊を並べる場所を変える","料理本の在庫を確認する","料理本を注文する"],"ans":2,"blind":false},{"no":71,"sec":"nghe","stem":"5番：女の職員はこれからまず何をしなければなりませんか？","options":["卒業生に講演会についてのメールを送る","ホームページに講演会の情報をのせる","講演会の会場の予約を変更する","食事会
