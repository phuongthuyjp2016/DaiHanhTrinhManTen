、おいしい。 [43] わたしの大雑把な「おいしい」は、丹精してねぎを育てる義父（ねぎはおもにちち担当）を喜ばせないだろう。なぜと云って、ちちにすれば、育てたねぎにはその都度、「上出来」、「普通出来」、「甘みもうちょっと」、「おいしいが細い」など、その評価に細かいランク付けがあり、ときには「いまひとつだったんよお」と云いながら、またあるときには「これは、よくできた」と顔をほころばせながら、手渡してくれる。だから、どのねぎに向けても、等しく「おいしい」と云うのなんかは。。。。\nこのあいだもらってきたばかりなのに、また [44] 送ってくれたところを見ると、よほどの自信作なのだろう。\n箱入りの長ねぎの花束である。","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["思うようだ","思うからだ","思ったそうだ","思ったのである"],"ans":4},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["も","なら","さえ","だけ"],"ans":2},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["確かに","むしろ","とはいえ","とすると"],"ans":3},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["こうして","そんな","あのように","どれも"],"ans":1}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"ファッションなど、流行は模倣を前提にしている。真似られなければ、ファッションなど成立しない。ミニスカートをデザインしたとしても、特定のデザイナーのものだけが売れるのでは、流行にはならない。多くの者が模倣してはじめて流行は成立するため、ファッションなどには、模倣を誘発させようとする意図が最初から織り込みずみだ。","items":[{"no":45,"sec":"dokkai","stem":"流行について、筆者はどのように考えているか。","options":["多くの者に購買意欲を誘発させるものである。","多くの者に真似られることなしには始まらない。","特定のデザイナーによる誘発が欠かせない。","特定のデザイナーのものが真似られなければならない。"],"ans":2}]},{"passage":"吉川美知子様\nこの度は、ブックネットA書店にて、以下の商品をご注文いただき誠にありがとうございました。\n注文番号：731-5777427-2785468\nご注文商品：「S先生との対話」\n在庫の確認をいたしましたところ、ご注文いただきましたこの商品は、絶版（注）になっていることがわかりました。\nつきましては、誠に勝手ではございますが、すでにクレジットカードでお支払いいただいた上記ご注文の代金を全額お返しするよう処理させていただきます。何卒ご了承くださいますようお願い申し上げます。\nなお、この件につきましてご不明な点がございましたら、以下のアドレス宛にお問い合わせくださいますようお願いいたします。\n■ブックネットA書店■\n注文管理担当　武田博\nお問い合わせメールアドレス：tyuumon@bukkunetto-a-syoten.jp","items":[{"no":46,"sec":"dokkai","stem":"このメールの用件は何か。","options":["カードでの支払いは取り扱っていないことを了承してほしい。","当店に在庫はないが、他店に確認するので待ってもらいたい。","返金方法について当店担当者のアドレス宛に知らせてほしい。","注文を受けた書籍がないので、支払われたお金を返金したい。"],"ans":4}]},{"passage":"「自分は間違ってない」と思うことから始まる怒りは、妥当な怒りです。少しも後ろめたくありません。むしろ、「間違ってない」と思いながら怒りをごまかしてしまったときのほうが後味は悪いのです。「なんで怒らなかったんだろう」という後悔は、惨めな気持ちになって長く続きます。\n怒りを抑えてばかりいると、この惨めな気持ちにも慣れてしまいます。敗北感に慣らされてしまうのです。わたしはこれがいちばん怖いと思っています。","items":[{"no":47,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["怒りの原因を明らかにしたいなら、怒りをごまかさないほうがいい。","怒りを抑えていると、ますます怒りが増してしまう。","自分が間違っていないと思うなら、怒りを抑えなくていい。","自分が間違っていると気づけば、怒りは長く続かない。"],"ans":3}]},{"passage":"専門家研究者やマスコミには、ごみ問題や斜面林や里山（注）などの破壊といった身近な環境問題を注視せず、いくつかの代表的な環境問題ばかりを取り扱う傾向が強い。マスコミなどが注目する環境問題に取り組んでいることが、専門家の専門性を誇示し、専門家としてのステータスを維持させることにつながっているかのように見える。環境問題が話題性の高いものに特化されることは、日常的な環境問題が大部分の専門家研究者から無視され、放置されることになる。","items":[{"no":48,"sec":"dokkai","stem":"筆者は、専門家研究者の環境問題への取り組みをどのようにとらえているか。","options":["専門性を生かして日常的な環境問題の解決を図っている。","マスコミが注目している問題に特化して研究を進めている。","社会的に注目されている身近な課題に積極的に取り組んでいる。","マスコミと連携してあまり注目されない問題を取り上げている。"],"ans":2}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"蝶の雄は、雌の翅の色を目じるしにして、配偶者たる相手を探す。モンシロチョウの雌の翅の裏の、黄色と紫外線のまざった色――この色を指示する特定の単語をわれわれ人間はもっていない――は、モンシロチョウの雄にとっては、モンシロチョウの雌であることの記号である。\n（中略）\nさて、この記号は光による記号である。光は直進するから、目によってそれを見た雄は、それにむかって直進すれば、雌のところにゆきつける。匂いのようにそこらじゅうに拡散するものを記号に使う場合より、よほど①かんたんである。\nけれど、それなりに不便なこともある。光が直進するからには、その光の進路を一枚の葉がさえぎっても、もう雌の記号は見えなくなってしまう。ということは、雌の存在を見出すことはできないということだ。\nこれに対処するにはどうしたらよいか？ ひらひらと舞いながら、すこし上から見たり、ななめから見たりすることだ。もし蝶が蜂のようにプーンとまっすぐ飛んだとしたら、②雌をみつけだすチャンスはぐっと減ってしまうにちがいない。\nそれと同時に、翅が雌の記号である蝶にとっては、翅は大きいほうが好ましい。そのため彼らは、「二つ折りのラブレター」となって、航空力学的にもひらひら飛ぶほかはなくなった。けれど③それは、ひらひら飛ばねば雌が発見できないという要請と、まったく矛盾していなかったのである。","items":[{"no":49,"sec":"dokkai","stem":"①かんたんであるのはなぜか。","options":["雌の翅の色は光であり直進するから。","雌の翅の色は光によって明るくなるから。","雌の翅の色は匂いと同じように拡散するから。","雌の翅の色は匂いや光とちがって変化しないから。"],"ans":1},{"no":50,"sec":"dokkai","stem":"②雌をみつけだすチャンスはぐっと減ってしまうとあるが、なぜか。","options":["翅の色は上から見ないと見えないから。","雌の記号は速く飛ぶと認識できないから。","光の進路がさえぎられることがあるから。","速度が速くなり、視点を固定することが難しいから。"],"ans":3},{"no":51,"sec":"dokkai","stem":"③それとは何か。","options":["雌の翅が誰より目立つこと。","雌の翅は表より裏が見やすいこと。","雌が翅を記号として利用していること。","雌は翅が大きくひらひら飛ぶしかないこと。"],"ans":4}]},{"passage":"私には、「わからない」と思うことがいくらでもある。そういうことを一つ一つつぶして行くのが人生だと思っているから、やることはいくらでもある。つまりは、人生とは「わからないの迷路」である。だから、そのさまざまに存在する「わからない」を、まず整理しなければならない。「木を見て森を見ず」とは言うが、「わからないの迷路」に圧倒されているだけの人間は、その逆の、①「森を見て木を見ず」なのである。\n巨大なる「わからないの森」は、その実、「わかりうる一本の木」の集大成なのである。だからとりあえず、「わかりうるもの」を探す。手をつけるべきは、「こんなくだらないものの答が全体像の解明につながるはずはない」と思えるようなところである。\n「くだらない」――だから「どうでもいい」と思って放り投げてしまうのは、それを「わかりきっている」と思うからである。つまりそれは、「わかる」のである。「わかる」は、「わからない」を解明するためのヒントである。つまりは、（②）ということである。とりあえず「わかる」――どうでもいいようなことでも、とりあえず「わかる」と思えるようなことを確保する。それであなたは、「わかっている」のである。なにかが「わかる」になれば、「「わかる」とはどのようなことか」という理解が訪れる。それがつまりは、「方向の発見」である。","items":[{"no":52,"sec":"dokkai","stem":"①「森を見て木を見ず」とはどういう意味か。","options":["「わからないこと」の多さに驚いてどうすればよいか困ること。","「わかること」だけに気を取られて他に目が行かないこと。","人生にどれだけ「わからないこと」があるのか気にしないこと。","人生の中でやらなければならないことにのみ注目すること。"],"ans":1},{"no":53,"sec":"dokkai","stem":"（②）に入るのはどれか。","options":["本当に「わかる」ためには、「わかる」ように見えることから「くだらない」ものを選び出す必要がある。","私達は「わかりきっている」と思って放り出してしまうが、よく見ると実は本当に「わかっている」とは言えない。","「どうでもいい」と思ったことをすっきり捨て去ってしまうことが、「わかる」ことを解明するヒントとなる。","「くだらない」とか「どうでもいい」と思われるものには、「わかる」へ至るためのヒントが隠されている。"],"ans":4},{"no":54,"sec":"dokkai","stem":"「わからない」と「わかる」について、筆者が述べていることはどんなことか。","options":["「わからない」ように見えることは、実は小さな「わかりうる」ことの集まりである。","「わからない」こともとりあえず放っておけば、後で見直して「わかる」ようになる。","「わからない」ことと「わかる」ことの間には越えられない壁のようなものが存在している。","「わかりきっている」とか「くだらない」と思っても、実は「わかっていない」のである。"],"ans":1}]},{"passage":"書を読むという行為が、人間の成長や知的能力の向上に必須のものであることを、かつての社会は経験法則的に理解していたのではないだろうか。素読（注1）などは強制的、修養的（注2）なものではあるが、読書習慣の形成を何よりも重視する教育メソッド（注3）であったことは確かである。しかし、①私たちの世代はどうであろうか。書物というものが映像や音響メディアなどと単純に比較することを許さない必需品であり、読書は基本的な能力であるという確信をいだいてきたものの、近年の社会経済のあり方によって自信を喪いかけていたことは否めないのではなかろうか。\n活字以外の表現手段が大きな影響力をもつようになったことを②「時代の流れ」と呼ぶのはいいが、文化の変容があまりにも急激なこと、あるいは一つの有力な文化が別のものに置き換えられることには予測しがたい弊害を伴う。活字にもいろいろあるが、書物に特有の楽しみを与えてくれる本、思索の喜びをもたらしてくれる本、人生の支えになるような本が相対的に少なくなったのは、1980年代の半ばごろからで、書店の棚には情報的な本や、映像文化の書籍化をねらった寿命の短いものばかりが目立つようになった。家庭からはスペースの狭さをいいわけに、本棚が姿を消してしまった。\nちょうどそのころから映像文化や活字文化の本質を考えるメディア論が盛んになったが、いまから思えば従来の活字文化が衰弱した場合にどうなるかという洞察力において、いささか欠けるところがなかっただろうか。\n（注1）素読（そどく）：ここでは、意味を考えずに、声を出して読むこと\n（注2）修養（しゅうよう）：学問を修め人格を高めること\n（注3）メソッド：方法","items":[{"no":55,"sec":"dokkai","stem":"①私たちの世代とあるが、筆者の世代にとっての読書はどのようなものであったか。","options":["社会生活を営む上で必須であると信じられていた。","近年の社会経済のあり方には合わないものとされていた。","映像や音響メディアと同列に扱われるようになってきていた。","人間の成長に不可欠だと自信をもって言えなくなってきていた。"],"ans":4},{"no":56,"sec":"dokkai","stem":"②「時代の流れ」は、書物にどのような変化をもたらしたか。","options":["映像化することを目的として書かれた本が増えた。","情報を提供する本やすぐに読まれなくなる本が増えた。","楽しみや喜びが与えられ心の支えになるような本が増えた。","教育的に望ましくない本や悪影響を与えるような本が増えた。"],"ans":2},{"no":57,"sec":"dokkai","stem":"1980年代半ば以降のメディア論について、筆者はどのように述べているか。","options":["活字文化を急激に変容させた要因を把握していなかった。","活字文化が衰弱していく時期を予測していなかった。","活字文化の衰退後の状況を見通していなかった。","活字文化と映像文化の本質を明らかにしていなかった。"],"ans":3}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"そもそも私は、組織内の人間の目標を無理やり一致させる必要はないと思っている。要は、それぞれの目標を達成することが、結果として組織としての目標達成につながればいいのだ。そのために大切なのは、組織の目標と個人の目的に接点を持たせ、双方が最大限の利益を得られるような柔軟性を持った仕組みをつくることである。\nラグビーでいえば、チームの目標はもちろん「勝つこと」である。しかし、チームを構成する選手には、それとは別に、それぞれの目的があるかもしれない。「自分のスキルを向上させたい」「日本代表に入るため」「プロ契約をしてもらうため」「ただ、好きだから」というように……。\nこうした個人の目的を無視し、ただ「勝つ」というチームの目標だけのためにプレーを強要してしまっては、チームから活力が失われてしまうだろう。\n（中略）\nたとえば、職場を選ぶ際に「やりたいことをできるかどうか」「自分の資質や可能性を活かせるかどうか」を第一義に（注1）考えるのは当然であるが、最近の若い人の中には「仕事がおもしろくないのなら、嫌な仕事をするくらいなら、さっさと別の企業に転職したほうがいい」と考える人間が増えているという。自分に関係のあること以外にはまったく興味を示さず、会社全体としての目標達成よりも個人の目的や利益を優先させる人間も少なくないようだ。\n①こうした傾向について「最近の若い奴は我慢が足りない」とか「自己中心的だ」と結論づけてしまうのは簡単だ。\nだが、私はむしろこう考える――会社に対する「価値観」やそこに所属するための「目的」が多様化しているのだと。つまり、かつてのように組織の中で目標が一元化されえなくなったのが「今」という時代なのである。これはよい悪いとか、正しいか正しくないかという以前に、現実なのだ。\nであるならば、そうした状況を②嘆いてもしかたがない。むしろ組織にとって重要なのは彼らをいかに活かしていくかということだろう。「そんな考え方は通用しない」とか「おれの言うことが正しい」と、指導者が旧来の（注2）価値観を押しつけたりしていては、若い人たちはついてこない。離れていくだけである。結果として組織の力は低下してしまう。\nそれならば、まずはそれぞれの目的を「許容」してはどうか。そのうえで、「共有」すべきはチームの目標であると全員の意志を統一させ、各自の役割を責任を持って果たさせるのである。そうすれば、個人のモチベーション（注3）を下げることなく、チームとしての目標達成につながっていくはずである。それは、これからの組織運営に欠かせないことだと思う。\n（注1）第一義に：最も重要なこととして\n（注2）旧来の：昔からの\n（注3）モチベーション：意欲","items":[{"no":58,"sec":"dokkai","stem":"ラグビーの例で筆者が述べていることは何か。","options":["高い目標を持った選手が集まらなければ、チームの力は伸びない。","勝つことだけをチームの目標にしても、個人のスキルは向上しない。","一人一人の目的を考えず勝つことだけを求めたら、チームは強くならない。","一人一人の目的とチームの目標が一致しないと、チームの活力が失われる。"],"ans":3},{"no":59,"sec":"dokkai","stem":"①こうした傾向とはどのようなことか。","options":["やりたくない仕事をしようとしない。","転職することがよいことだと考えている。","自身の興味や関心が変わりやすい。","自身の資質や可能性を活かす努力をしない。"],"ans":1},{"no":60,"sec":"dokkai","stem":"②嘆いてもしかたがないと筆者が考えるのはなぜか。","options":["個人の「目的」と組織の「目的」が一致することはありえないから。","個人の「価値観」や「目的」のよい悪いを考えても、意味がないから。","組織によって「価値観」や「目的」が異なっている時代だから。","組織の中に多様な「価値観」や「目的」を持った人がいる時代だから。"],"ans":4},{"no":61,"sec":"dokkai","stem":"筆者によると、組織運営のために必要なことは何か。","options":["目標達成のために、意志が統一しやすい組織をつくること。","チームで価値観を共有し、仕事に対する全員の意欲を高めること。","個人の目的を認めて、チームの目標のために役割を果たさせること。","個人の目的と組織の目標を一致させて、各自に責任を持たせること。"],"ans":3}]},{"label":"Mon11","passage":"A\n企業の採用試験では、必ず志望動機を書いて提出する。もちろん仕事を希望する理由を書くのだが、大切な点が抜けている場合がある。「なぜ、その会社でなければならないのか」が明確に書かれていない場合だ。例えば、出版社への応募書類で、志望動機として「感動させる本が作りたい」としか書かれていなかったら、この人は出版社に入りたいだけで、その出版社に入りたいわけではないと思われてしまうだろう。他社ではなく、どうしてもその会社に入りたいという強い意志を相手に伝えることが重要だ。そのためには、まずは情報収集が欠かせない。特徴や経営方針を正しく理解したうえで、自分がその会社でどのような仕事ができるかという視点でまとめていく。そうすれば、なぜその会社なのかが明確な志望動機が書けるだろう。\nB\n就職試験において、志望動機はどのように書けばいいのか。自分の能力や経験を最大限にアピールすることが重要だと思うかもしれないが、それらを入社後にどのように生かせるかを書かなければ、説得力のある志望動機だとは言えない。\n特に、規模や製品、経営者など、企業の特徴のようなホームページを見れば分かる情報を、ただ並べて書くだけでは、意欲は伝わらない。具体的な業務の内容に触れながら、自分の能力や経験と結びつけて説明することが必要だ。業務の内容をよく調べ、その企業で求められている能力や技術を分析して、それらの要求に自分が応じられるということをアピールするべきだ。","items":[{"no":62,"sec":"dokkai","stem":"よくない志望動機の問題点について、AとBはどのように述べているか。","options":["AもBも、誰でも容易に調べられる企業や製品の情報しか書かれていないことだと述べている。","AもBも、入りたいという希望だけが書かれていて、その企業の特徴が分析されていないことだと述べている。","Aはその企業でなければならない理由が書かれていないことだと述べ、Bはその企業の業務内容について書かれていないことだと述べている。","Aはその企業に入りたいという意志が感じられないことだと述べ、Bは自分のしたい業務しか書かれていないことだと述べている。"],"ans":3},{"no":63,"sec":"dokkai","stem":"志望動機を書く際に、AとBが共通して重要だと述べていることは何か。","options":["企業の経営方針や製品などを批判しないこと。","他の企業の情報も集めて、比較しながら書くこと。","自分の能力や経験を正確に書くこと。","自分がその企業にどう貢献できるかを考えて書くこと。"],"ans":4}]},{"label":"Mon12","passage":"人間の生存に不可欠なのは衣食住ですが、人間というのは、それだけでは生きていけない生きものです。衣食住に加えて何が必要かというと、それは自尊心です。自尊心というと、高慢さを連想して、悪いイメージを持っている人が多いようですが、私がここで言う自尊心とは、「自分には生きていくだけの価値がある」と思うこと、極端に言えば、「この世界のなかでいくらかの場所を占領し、食べものを食べ、水を飲み、空気を吸って生きていてもかまわないのだ」と思うことです。そう信じられなくなったとき、私たちは生きつづけるために必要な気力を失い、ときには命を絶つことさえあります。\nじつは、人間のさまざまな行動は、この自尊心の働きに支配されているのだと考えると、とてもよく理解できます。私たちに、一生にわたる自尊心の①基盤を与えてくれるのは、言うまでもなく、幼いときに育ててくれる親や、それにかわる人たちの、無条件の愛情です。幼い子どもにとっては、自分の家族が全世界ですから、そのなかで大切にしてもらえば、自分の価値を信じるのはたやすいことです。しかし、そこで与えられるのは基盤にすぎず、保育園、幼稚園などの集団に入ると親の愛の上に築いた自尊心はもろくも崩れてしまいます。自分にとっては絶対であった親が、世の中のたくさんの人たちの一人にすぎないのなら、その親に保証してもらった自分の値打ちも、ちっぽけなものにすぎないことになるからです。\nそこから、子ども自身による、自尊心回復のための戦いがはじまります。幼い子どもというのは、無邪気な会話をしているかと思うと、親の持ちものの自慢をしたり、何かを持っていない子をのけものにしたり（注1）といった、「子どもらしくない」と言いたくなるようなふるまいをはじめるものです。しかしこれらは、子どもなりの自尊心回復の手段なのであって、その意味ではきわめて②「子どもらしい」のです。不幸にして家庭の愛情がじゅうぶんでなかったり、「いい子」でいないと愛してもらえなかったりする子どもたちは、すべてを自力で獲得しないといけませんから、とりわけ競争での勝ち負けにこだわることになりがちです。子どもたちのそんな様子に、大人はつい眉をひそめ（注2）たくなりますが、生きるために自尊心がどれほど必要かを考えれば、無理のないことだと理解できます。\n（注1）のけものにする：仲間はずれにする\n（注2）眉（まゆ）をひそめる：不愉快な気持ちを表す","items":[{"no":64,"sec":"dokkai","stem":"筆者は、①基盤は何によって築かれると言っているか。","options":["食べ物と水がじゅうぶんに与えられることによって。","子どものころに親や周囲の人に愛されることによって。","幼いときに自分の家族が一番だと信じることによって。","生きていくために必要な気力を持ち続けることによって。"],"ans":2},{"no":65,"sec":"dokkai","stem":"筆者は、子どもが集団に入ると、なぜ自尊心が崩れると考えているのか。","options":["幼い時に受けた無条件の愛情は幼稚園や保育園では必要がないから。","親から愛されなかったために、他の人たちとはうまくいかないから。","幼稚園や保育園では親の愛情ではなく、他の人の愛情を受けるから。","親に保証してもらっていた自分の価値が小さいものだと感じるから。"],"ans":4},{"no":66,"sec":"dokkai","stem":"②「子どもらしい」とあるが、著者は、何が子どもらしいと言っているのか。","options":["愛情がじゅうぶん与えられていていい子でいられること。","親の自慢などはしないで、無邪気な会話をしていること。","競争での勝ち負けにこだわらない子どもらしいふるまい。","自尊心を回復するための子どもらしく見えないふるまい。"],"ans":4},{"no":67,"sec":"dokkai","stem":"筆者は、子どもが成長するためにはどんなことが大事だと言っているか。","options":["親の愛情によって保証してもらった自分の価値を、自分の力でもう一度獲得すること。","自分の行動が自尊心の働きに支配されていることを理解して、ふるまいに気をつけること。","保育園などの集団生活の中で決められる自分の値打ちを、子ども自身が受け入れる。","友だちをのけものにしたり親の自慢をしたりしないで、他の人の価値も尊重すること。"],"ans":1}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある楽団の年間セット券の案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"東月オーケストラ　年間セット券のご案内\n東月オーケストラでは、お得に公演をお楽しみいただける年間セット券を販売しております。\n■年間セット券の特典\n・一般販売に比べ30%お得な料金です。・一般販売前に1シリーズの全チケットをセットで購入可能です。\n■年間セット券の料金表（席種別の料金／公演数）\n① 定期公演A：S席49,000円／A席38,500円／B席31,500円／学生席10,500円（4,900円・3,850円・3,150円・1,050円×10公演）　公演数10\n② 定期公演B：S席49,000円／A席38,500円／B席31,500円／学生席10,500円　公演数10\n③ 名曲集公演：S席39,200円／A席30,800円／B席25,200円／学生席8,400円　公演数8\n④ 特別公演：S席24,500円／A席19,250円／B席15,750円／学生席5,250円　公演数5\n・①、③の会場は東ホール、②、④の会場は星山ホール。\n・①〜④の日程、公演内容等の詳細はホームページをご覧ください。\n・各席種の（　）中の金額は、1公演当たりの料金となっています。\n■チケットの振替\n・ご希望の公演に、同ランクの席種の空席がない場合、異なる席種への振替になります。\n　＊上のランクの席種に変更の場合は、1公演当たりの料金の差額をお支払いいただきます。\n　＊下のランクの席種に変更の場合は差額の返金はいたしません。\n〈振替の方法〉\n1. お電話で振替元と振替先の公演をチケットオフィスにお伝えください。お電話は振替元の公演の10日前までにお願いします。その場で空席を確認いたします。\n2. お席が確保できた場合、振替元の公演の前日必着で振替元のチケットをチケットオフィスにご郵送ください。\n3. 振替先のチケットは公演当日に窓口でお渡しいたします。席種の変更により差額が生じる場合は、お支払いも同時にお願いします。\n■お申し込み方法\n・下記ホームページ、郵送、FAXでお申し込みください。\n・東月オーケストラチケットオフィス　〒155-8547 東月市星山3-16-5　電話・FAX 081-566-2257　https://www.togetsu-orchestra.jp/ticket/","items":[{"no":68,"sec":"dokkai","stem":"会社員のイリヤさんは年間セット券を購入することにした。星山ホールで行われるシリーズで、40,000円以内のものがいい。そして公演数ができるだけ多く、席種はランクが高いものがいいが、ランクより公演数を優先したい。イリヤさんはどの年間セット券を購入するか。","options":["①のA席。","②のA席。","③のS席。","④のS席。"],"ans":2},{"no":69,"sec":"dokkai","stem":"スマンさんは「④特別公演」の年間セット券（A席）を持っている。来月10月23日の公演のチケットを「③名曲集公演」の10月30日の公演（A席）に振り替えたい。いつまでにチケットオフィスに電話しなければならない。また、席が確保された場合、電話のあとどうしなければならないか。","options":["10月13日までに電話し、10月22日必着で振替元のチケットを郵送する。","10月13日までに電話し、10月22日必着で振替元のチケットを郵送し、当日窓口で支払いをする。","10月20日までに電話し、10月22日必着で振替のチケットを郵送する。","10月20日までに電話し、10月22日必着で振替元のチケットを郵送し、当日窓口で支払いをする。"],"ans":1}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t7-2021-nghe.mp3","items":[{"no":70,"sec":"nghe","stem":"1番：男の人はチケットをどのように受け取りますか？","options":["前日までに郵便で","前日までに劇場の窓口で","当日、劇場の券売機で","当日、劇場の窓口で"],"ans":3,"blind":false},{"no":71,"sec":"nghe","stem":"2番：女の人はこの後、まず何をしますか？","options":["健康保険証を取ってくる","ふんしつとどけに記入する","予約していた本を受け取る","カード再発行の申込書に記入する"],"ans":1,"blind":false},{"no":72,"sec":"nghe","stem":"3番：男の学生はこれから何をしなければなりませんか？","options":["学内のゴミを拾う","ポスターを張る場所を増やす","ゴミを捨てないように呼び ,"さし上げます"],"ans":2},{"no":34,"sec":"bunpo","stem":"夕べは、せっかく北山まで夜景を見に行ったのに、ものすごい強風と寒さで、夜景を（　　）。","options":["楽しまずにはいられなかった","楽しめないことはなかった","楽しむどころではなかった","楽しむつもりはなかった"],"ans":3},{"no":35,"sec":"bunpo","stem":"(会社で)A「知っています?部長が、売り上げを半年で5倍にするって言っているらしいですよ。」B「5倍?ありえないよ。どう考えてもさすがに（　　）。」\nA「そうですよね。無理ですよね。」","options":["無理するもんだ","無理するもんか","無理ってもんだ","無理なもんか"],"ans":3}]},{"id":"mon6","title":"問題6 — 並べ替え","sec":"bunpo","instr":"次の文の ★ に入る最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":36,"sec":"bunpo","stem":"この花火大会は、日本の夏を語る（　　）（　　）（　*　）（　　）有名だ。","options":["うえで","として","欠かせない","イベント"],"ans":4},{"no":37,"sec":"bunpo","stem":"子供にいろいろなことを習わせたいという親の気持ちはよくわかるが、子供の遊ぶ時間を奪って（　　）（　　）（　*　）（　　）ないと思う。","options":["必要は","やらせる","まで","無理に"],"ans":2},{"no":38,"sec":"bunpo","stem":"A「おとといは大雨、昨日は車のパンク。旅行に来てからトラブル続きで嫌になるよね。」 \nB「本当だよ。最終日の（　　）（　　）（　*　）（　　）。」","options":["何も","今日こそ","ように","起きません"],"ans":4},{"no":39,"sec":"bunpo","stem":"2025年には介護を必要とする高齢者が著しく増加することから、多くの専門家が「介護施設員の給与を引き上げる（　　）（　　）（　*　）（　　）」と指摘する。","options":["などして","緊急の課題","人材を確保することが","介護に携わる"],"ans":3},{"no":40,"sec":"bunpo","stem":"川北市出身の画家平一明の（　　）（　　）（　*　）（　　）、先週20日に完成した。","options":["建設を進めていた","川北市が","記念美術館が","業績を後世に伝えようと"],"ans":1}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、（41）から（44）の中に入る最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"文芸の毒\n「事実は小説よりも奇なり」と言われるのは、たいていの場合、事実は平凡で小説が奇であるからこそ、いや、そうでないこともあるのだぞ、という警告を込めてのことであろう。\n実物よりもそれを写した写真や絵の方が美しく、実在の悪党よりもそれを主人公として描いた小説や映画の中に出てくるそいつの方が、ずっと、悪辣残虐な印象を与えるということがある。芸術の力、言葉の [41] 。\n私は永井荷風の小品「春のおとずれ」（明治42年作）を読んだとき、かるい衝撃を受けた。生まれてこのかた、何十回もの春の訪れを実験（実際に体験）してきたにもかかわらず、荷風がたった七、八ページの文章の中で描写した春の息吹き、鼓動の一万分の一すらも私は実感したことがないということに気づいたのである。\n私は荷風の文章——庭の土の色の変化や庭先に生動する楓や野菊の様子、流れ渡る日の光、風ともつかぬゆるやかな大気の動き、鶯や雀の声、それらの仔細を美しい言葉にのせて綴った文章を読んで、はじめて、訪れる春の本質というものを感じ、かつ知ったような気がした。大自然を凌駕する文芸の力がそこにあった。\n私の敬愛する知人の一人が [42] 言った。「昔、文学をやろうと思ったこともあったが、永井荷風がいるんでやめたよ。荷風があれだけのことをやっているんだもの。おれが何か書いたってかないっこないし、またその必要もないしね。」\nはじめ、冗談半分のつくりごとか、照れかくしのための大げさな言い回しかと思っていた。この言葉を聞いて二十年たち、その間、この人と文学談めいた話は二度と交わしたことはないが、このごろ、あれはホンネだったのだと [43] 。\n文筆の才があり、今も若い人たちに慕われている人である。表立ったところには一切ものを書こうとはしない。著書なんかとんでもないという人である。私はこの人は荷風の毒にあたったのではないかと思う。あまりにもすぐれた文芸は、そのつよい毒であとに来る人の意気を阻喪(注2)してしまうことがあるのではないか。 [44] 明治四十二年以来、有名作家の筆になるもので、春の訪れそのものを描いた作品はほとんど見当らないではないか。\n(注1)永井荷風：20世紀初めから半ばにかけて活躍した小説家\n(注2)意気を阻喪する：やる気を失わせる","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["力でもいい","力である","力にしよう","力にすぎない"],"ans":2},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["あるとき","このとき","そのとき","あのとき"],"ans":1},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["思うそうだ","思えてきた","思わせつつある","思っているだろう"],"ans":2},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["もっとも","とはいえ","そういえば","それどころか"],"ans":3}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"昨今の雑誌はあまりにもレイアウトに凝りすぎる。最初に倉庫をこまかく仕切っておいて、それに合わせて原稿を作るから、読んでいても書いていても息苦しい。デザイナーは設計図に合わせて材料に手を加える。足りなければ増やし、はみ出せば切りちぢめる。でも編集者はちがう。編集とは本来、すでにある材料をそのまま組み合わせ、そのことによって新しい意味の深さやひろがりを作り出す作業なのだ。私はデザイナーではなく編集者がつくった雑誌が読みたい。","items":[{"no":45,"sec":"dokkai","stem":"筆者が読みたい雑誌はどのようなものか。","options":["凝ったレイアウトによって読みやすい誌面になったもの","材料の組み合わせによって新しい意味を持たせたもの","材料が加工されて内容に深み増やしたもの","レイアウトに合わせて内容が調整されたもの"],"ans":2}]},{"passage":"並木は四季折々に変化する自然の壁である。葉を落として列柱のような状態にあったり、花を咲かせて賑やかなトンネル状の壁を作ったり、葉を繁らせて密な緑陰の壁になったりする。この連続、柔らかな透けた壁が、どれほど街並みの一体化に役立っているか、まとまりがなく不揃いな街路も、並木によってまとめられ、緩やかな連結を成功させている例など、数え上げればきりがないのである。","items":[{"no":46,"sec":"dokkai","stem":"筆者は、並木の効果は何だと述べているか。","options":["緑があることで、街全体が賑やかに感じられること","緑を求めて集まることで、住民のつながりが強まること","木々の壁があることで、街が一つに整った状態になること","自然の壁がその色を変えることで、季節の変化を楽しめること"],"ans":3}]},{"passage":"わたしが幼児期から青年期までを過ごした半世紀前の「日本」は現在の「日本」から見れば「外国」である。あるいはわたしにとっての「母国」はすでにどこかに消え去って、今のわたしは馴れない「外国暮らし」をしているのかもしれぬ。国名だけはかわってはいないが、一つの「時代」は「外国」で有り、そこにあるのはあきらかに「異文化」なのである。","items":[{"no":47,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["「時代」が変わると文化がかわりに、自国も外国のように感じられる。","半世紀前より、外国の文化に接することが増えたように感じられる。","昔の文化が「時代｣とともに消え去っていくのは、惜しいと感じられる。","外国で暮らしているのに、まるで半世紀前の母国にいるように感じられる。"],"ans":1}]},{"passage":"筆者がレコード会社の宣伝担当者から聞いた言葉に「流行っていると思わせれば、本当に流行る」というのがある。こうした宣伝の場面において音楽産業が力を注ぐのは「事実」ではなく「買い手にそう思わせること｣、つまり｢認識の形成」である。こうした手法を音楽産業は「夢を売る」とよく呼ぶ。つまり音楽産業は買い手がほしがる｢ファンタジー」を先んじてキャッチし、商品化し、売ることに長けている。","items":[{"no":48,"sec":"dokkai","stem":"「夢を売る」とはどういうことか。","options":["買い手に買いたいとおもわせるようにする。","買い手の好む宣伝手法を取り入れる。","買い手の希望を聞いて具体的な形にする。","買い手より先に流行をつかむようにする。"],"ans":1}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"近年、わが国では、物事を解説したり、考え方や視点を明確に伝えたりする際に、難解な言葉や文章を使うことは敬遠され、よりわかりやすい言葉や文章、語りが求められる傾向が顕著である。テレビの番組などでニュース解説を担当するキャスターの中には、そのわかりやすい解説で人気を博す者もある。わかりやすさは確かに重要であり、学校の授業でもよい授業、子供たちの効果のよい学習活動が展開される授業における指導者の言葉や解説は、わかりやすく的確である。さらに各種の映像装置を駆使するなど、わかりやすさを実現するための技術も進歩している。そこでは、言葉が思考と伝達のための主たる役目を担うことになるが､そのわかりやすさはときとして、受け取る側の思考の多様性や広がり、深まりを妨害することがある。\nわかりにくいものとわかりやすいものがあれば、人は当然わかりやすい方を選択する。わかりやすく的確な言葉は、そのまま学習者の中に蓄えられる。そして、多くの人はその時点で学習が終了したと考えるのである。わからなかったことがわかった、新しい知識を得た、これが学習の最終段階だと思ってしまうのである。しかしそれは、自身の中にその解説を発した人の言葉や考えを取り入れたにすぎない。「学びの真正性」とは、そこから自身の新たな思考を広げ､それらが表現される段階まで進むことである。そして、その多くは自分一人で行われるものではなく、他者との関係性の中で成立することが多い。\n（注1）博す：得る\n（注2）学びの真正性：ここでは、本物の学び","items":[{"no":49,"sec":"dokkai","stem":"近年の物事や思考の伝達について、筆者はどのように述べているか。","options":["言葉だけでわかりやすく伝えることが求められている。","明確に伝えることができるようになっている。","わかりやすく解説できない物事は避けられている。","わかりやすく伝えることが重視されている。"],"ans":4},{"no":50,"sec":"dokkai","stem":"受け取る側の思考の多様性や広がり、深まりを妨害することがある。とあるが、なぜか。","options":["わかったと思い、それ以上考えようとしなくなるから","わかりにくいものを理解しようとしなくなるから","わかりやすい言葉だけでは表現できない知識があるから","わかりやすいものは選択されやすいが､知識として定着しないから"],"ans":1},{"no":51,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["わかりにくいものでも、他者にわかりやすく伝える姿勢を持つべきだ。","得た知識を踏まえて、思考を深め表現できるようになることが重要だ。","他者の言葉や考えを正確に理解することで、本当の学びにつながる。","他者との関係性を築くには、わかりやすく的確な言葉を使うことが求められる。"],"ans":2}]},{"passage":"ある行動を何度も繰り返せば、それが自動化され、あまりそのことに思考を向けないようになっていくことが多いが､いつもそうなるとは限らない。例えば、人との雑談の中で、自分の考えを率直に述べるということをいつもやっていれば、確かにそのことは自動化され、自分の考えを述べようと特に意識しないでも、気楽に自分の考えを話すような習慣ができる。（中略）\nしかし、もし、率直に自分の考えを述べたときに、周囲の人から非難されたり、拒否されたりするということが繰り返されると、多くの場合、率直に話す自分にマイナスになるという考えが起こって、率直に話すという行動に自分でブレーキをかけるようになる。何回もブレーキをかけていると、ブレーキをかけること自体が自動化して、自分では行動の結果を取り立てて予期することなしに、なんとなく、率直に発言することが少なくなり、おとなしくなるといった変化が起こってくる。このような現象を行動の抑制の自動化という。\n行動の抑制の場合も、それが自動化すればするほど、思考の果たす役割は少なくなるのだが、思考の仕方や内容によって抑制の度合いは変わってくる。例えば、自分の述べようとする意見について、何回もくりかえし考えていると、だんだん抑制が弱まってきて、気楽に発言できるようになることもあり、逆に、考えれば考えるほど、発言後の嫌な予想と結びつき、抑制が強まったりもする。このように、行動の抑制に対しても、暗示とまではいかないが、思考が影響を及ぼすのである。","items":[{"no":52,"sec":"dokkai","stem":"そのこととは何か。","options":["あることを何度も繰り返すこと","ある行動に思考を向けなくなること","自分の考えを率直に述べること","自分の考えを述べようと意識しなくなること"],"ans":3},{"no":53,"sec":"dokkai","stem":"このような現象とあるが、どのようなことか。","options":["無意識のうちに率直に話すことが減ってくる。","無意識のうちに行動の結果を予測しなくなる。","率直に話すことを避け、周囲の反応に敏感になる。","率直に話すことを求められても、拒否するようになる。"],"ans":1},{"no":54,"sec":"dokkai","stem":"行動の抑制について、筆者はどのように述べているか。","options":["行動の抑制が強まると、思考が消極的になる。","行動の抑制が強まると、思考の果たす役割は少なくなる。","行動の抑制の程度は、思考の仕方や内容によって変わる。","行動の抑制の自動化は、否定的な思考が直接な原因となる。"],"ans":3}]},{"passage":"「教師と生徒」「師と弟子」は、位相は似ているがまったく質の異なるものだ。弟子は師を選べるが、生徒は教師を選べない。師も弟子を選べるが、教師は生徒を選べない。師はいわば固有の独りの人だが、教師はたくさんいるなかの偶然的な独りである。「師と弟子」は「教師と生徒」の煮つめられた模範ではない「教師と生徒」は近代のものだが､「師と弟子」は思想(宗教)や武術や技能や芸術の世界には昔からあったもので、「特別に卓越した人」からその「優れたもの」を真摯に学ぼうとするごく特殊な個別的なつながりである。「師と弟子の場合」、弟子は何を学ぼうとしているかははっきりと意識している。生徒の場合は、自分が学ぶことになる近代の膨大な知や生活や技術についてほとんど認知していない。（中略）「教師と生徒」は私（個人）と私（個人）のつながりではなく、公(社会的役割)と公(社会的役割)の関係であり、心的つながりは二次元的なものである。個人と個人が求めあって結びついたものではなく、社会システムに媒介されたつながりである。それに対して、「師と弟子｣はもともと個人的なつながりであり、「求めるもの」「到達すべきもの」「語るべきもの」を共有している。かなりの心的部分が同志的につながっていると考えられよう。「教師と生徒」のつながりの目的は、子ども（生徒）の市民（個人）形成に還元されるものであり、「師と弟子」というような濃い密度のつながりに昇華することは通常考えられない。\n（注1）位相：ここでは、関係性\n（注2）煮詰められた：ここでは、究極的な\n（注3）昇華する：ここでは、高まる","items":[{"no":55,"sec":"dokkai","stem":"「師と弟子」について、筆者はどのように述べているか。","options":["弟子が師から優れたものを学ぶ個別なつながりである。","弟子が師に選ばれれば、師の決定に従うことになる。","個人的なつながりと、社会的なつながりの両面を持っている。","同じ志を持つ者同士が偶然出会って結びついている。"],"ans":1},{"no":56,"sec":"dokkai","stem":"弟子と生徒について、筆者はどのようなものだと述べているか。","options":["弟子も生徒も、師や教師と心的なつながりを前提とした関係を結んでいる。","弟子も生徒も、学ぶということに対する基本的な姿勢に変わりはない。","弟子は自分の学ぶべきことを把握しているが、生徒はあまり認識していない。","弟子は師から学ぼうとするが、生徒は社会の中で自然に学んでいる。"],"ans":3},{"no":57,"sec":"dokkai","stem":"「教師と生徒」について、筆者はどのように述べているか。","options":["社会的な役割よりも、教師と生徒の個人的なつながりを重視している。","社会システムの中で、生徒の個人形成を目的とした関係である。","互いに公の立場を保ちつつ、心的なつながりを深めようとしている。","近代の膨大な知や生活や技術を教え、教えられる私的な関係である。"],"ans":2}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"地球の長い歴史の中で生物は進化と分化し、生物種の数は基本的には増える傾向にある。地球上の生物の種類が急激に増えたのが､カンブリア紀と呼ばれる約五億年前のことで、生物種の「ビッグバン」と呼ばれることもある。だが､その後生物の歴史の中では、過去五回、生物種の数が急激に減少する「大絶滅の時代」があったことが化石の分析などから分かっている。（中略）\n現在確認されている種の絶滅は、ほんの氷山の一角である。多様な生物が生息している熱帯林が減少する速度からすると、一年間に一千万種のうち二万七千種が絶滅していると推定されるとの研究結果が報告されている。現代は地球の歴史の中で六回目の生物の大絶滅時代だと言えるのだ。\n六回目の大絶滅時代は、過去の五回と多くの点で違う。一つは生物が絶滅する速度が非常に速いということだ。化石の分析などから推定された自然界での生物絶減の速度は百万種に対して一年間に一種というペースだ。多くの研究は、現在の生物絶滅の速度は自然に起こる生物絶滅の速度の百~千倍で、その速度はほとんど速くなっていると指摘している。今回の大絶減が､ほとんどが人間活動が原因で起こっているという点も過去と大きく異なる。自然に起こる絶滅は止めることはできなかった。だが、今回の大絶滅は人間の行動パターンが違っていれば起こることはなかった。逆に言えば、人間が行動を改めれば、絶減を食い止めることができるかもしれないということになる。\n過去の大絶滅の後では、恐竜が減った後で哺乳類が栄えるようになったように、ある種の生物がいなくなったことで、他の生物が生息地を広げることができるようになり、その後比較的短時間のうちに種の数は増加に転じている。\nだが､今回の大絶滅の場合は、速度が速いために生物が変化について行けない可能性がある。しかも、新たな生物が生まれる「ゆりかご」となるような湿地や熱帯林、浅い海などの場所は、人間の開発行為によって破壊され、汚染されている。大絶滅からの復活につながる生物進化の力も、人間が奪っている可能性が高い。今この地球上で起こっている「第六の大絶滅」は、過去の五回とは質的に大きく異なり、地球の生態系にとって取り返しがつかないものとなる可能性が否定できない。\n現在のペースで熱帯林やサンゴ礁､湿地などが破壊されたら、生物種の絶滅や生物多様性の損失は今後も急速に進むことが心配されている。しかも、今世紀半ばくらいには、地球温暖化の進行が生物種の絶滅に拍車を掛けることになることも懸念されている。このままでは、地球の長い歴史の中で例がないほど生物多様性の減少が著しい、傷ついた地球を次世代に引き渡すことになってしまうのである。\n(注)ゆりかご：ここでは、生物の生育に適した環境","items":[{"no":58,"sec":"dokkai","stem":"六回目の大絶滅の前までは、生物種の数はどのように変化してきたか。","options":["約五億年前をピークとして､その後急激に減少してきた。","約五億年前に急増した後、五回の急激な減少を経験したが、増加してきた。","約五億年前に一度増加したが、その後は五回の急激な減少を含めて減り続けてきた。","増加し続けてきたが、約五億年前に急激に減少し、その後再び増加してきた。"],"ans":2},{"no":59,"sec":"dokkai","stem":"今回の生物の大絶滅が過去と異なるのはどのような点か。","options":["絶滅の速度は速くなっているが、生息地を広げて増加する種もあること","絶滅の速度が非常に速くなるとともに、原因も分からなくなっていること","人間の行動パターンが変化することで、生物種の数は増加していること","人間の行動によって、自然界での絶滅の速度が非常に速くなっていること"],"ans":4},{"no":60,"sec":"dokkai","stem":"現在の地球について、筆者はどのように考えているか。","options":["人間が開発のペースを落とせば、生物種の絶滅は食い止められる。","人間が開発行為を続ければ、地球の生態系はさらに破壊されるだろう。","人間が開発行為をやめて、破壊された自然を元に戻さなければならない。","人間が開発行為をやめても、生物多様性の減少は避けられない可能性が高い。"],"ans":2}]},{"label":"Mon11","passage":"A\n変化の激しい時代に必要な頭の使い方というと、できるだけ多くの情報を集めて、できるだけ正しく未来を予測するといったことを、イメージする人は少なくないでしょう。\nしかし、多くの情報を集めても、世の中が予想もしない形で変わると、それらがあまり役に立たなくなってしまう可能性があります。つまり、変化の時代とは、将来が見通しにくい時代でもあるのです。このような時代に必要なのは、ただ情報をかき集めることではなく、自分なりの発想や、自分なりの考え方を組み立て、情報を処理することです。\n（中略）\n情報収集が劇的に楽になった分、「考える」ウエイトはますます重くなっています。いわば、みんなと同じ情報を材料にしながら、いかに新しく、人とは違う発想で、おもしろいことを考えつくか、そういった点での「考える」力がより求められているのです。\nB\n今は多くの情報があふれ、インターネットで何でも調べられるようになった。しかし、ただ待っているだけでは何も手に入らない。あくまで自分から情報を求めていかなければ、あっという間に取り残されてしまう。\n技術が高度に発展した現代では、ゼロから何かを生み出したり、人とは異なるものを考え出すのは困難だと思うかもしれない。しかし、独自の視点を持って既存のものやアイデアを組み合わせていくことで、これまでになかったものを創造することは可能だ。そのためにもやはり、土台となる情報が必要だ。現代は、どれだけ多くの情報を手にしているかで決まるといっても過言ではない。","items":[{"no":61,"sec":"dokkai","stem":"多くの情報を集めることについて、AとBはどのように述べているか。","options":["AもBも、重要だと述べている。","AもBも、それだけでは十分ではないと述べている。","Aは重要だと述べ、Bはそれだけでは十分ではないと述べている。","Aはそれだけでは十分ではないと述べ、Bは重要だと述べている。"],"ans":4},{"no":62,"sec":"dokkai","stem":"これからの時代に必要なことについて、AとBの認識で共通していることは何か。","options":["情報機器を活用して、新しいものを作り出すこと","自分にとって、有用な情報を見極めること","世の中の変化を正確に予測すること","独創的なアイデアを持つこと"],"ans":4}]},{"label":"Mon12","passage":"例えば、3年間ずっとノーミスでやってきた輪田くんが､はじめてミスを出した。\n3年前からずっとその仕事ぶりを見てきた上司と異動していきなり輪田くんのミスに出くわした上司と、輪田くんへの印象は同じだろうか?両者のミスの「情報占有率」がちがう。つまり、3年間のつきあいの中で、ミスが占める割合と、たった一回初めて輪田くんと接した中で、ミスが占める割合と。\n相手は、あなたが過去からずっと積み上げてきたすべての情報で、あなたを判断するのではない。結局は、その時相手が持っている情報だけで判断される。その中で、いい情報の占める割合が多ければ「いい人だ」となる。\nあなたが「優しい人」で10年間怒ったことがなかったとしても、10年ぶりに起こった時、たまたまでくわした初対面の相手にとっては、それが100%だ。あなたを「恐い人」だと思う。\n自分にふさわしい「メディア力」を相手の中に刻むため、ちょっと「情報占有率」を意識してみるといい。\nコミュニケーションでは、出会いから始まって、相手から見たあなたの「メディア力」が決まるまでの間が肝心だ。つまり、初めの方が慎重さがいる。ここで、かっこつけるのでもなく、でも、あなた以下にもならず、等身大のあなたの良さが伝わるのが理想だ。\nいつも質の高い仕事をしているなら、初めての仕事先に対して、決していつもの質を落としてはいけない。ふだん静かな人なら、初対面の相手にも、奇をてらったりせず、普段どおり静かにしていればいい。自分にうそのないふるまいをする、ということは、初対面の相手にこそ大切だ。\nさて、ここで問題なのは、普段とても穏やかなあなたが、その日はたまたま嫌なことが重なり、攻撃的になっているという場合だ。自分にうそのないということで、相手にきついことを言ってしまったらどうだろう。あなたにとっては、年に一回の、「たまたま不機嫌な日でも､相手にとっては、あなたに関する情報の100%になる。\n初対面の相手、まだ付き合いの浅い相手には、すこし慎重になって考えてほしい。\n何が､自分にうそのないふるまいか?自分の正直な姿を伝えるとはどういうことか?日ごろの99%穏やかなあなたなら、1%異常よりも、いつもの穏やかさを伝える方が、結局は、正直な姿を伝えている。相手の中に、あなたの実像に近い「メディア力」が形成されるからだ。初対面の相手にこそ、平常心であること、普段どおりにやることが大切だ。\n（注1）等身大の：誇張のない\n（注2）奇をてらう：変わったことをして、他人の気をひこうとする","items":[{"no":63,"sec":"dokkai","stem":"筆者によれば、上司にとって輪田くんのミスの「情報占有率」が上がるのはどのような場合か。","options":["付き合いの長い上司との関係の中で､輪田くんがミスを1回した場合","付き合いの長い上司との関係の中で、輪田くんがミスを3回した場合","付き合いの短い上司との関係の中で、輪田くんがミスを1回した場合","付き合いの短い上司との関係の中で、輪田くんがミスを3回した場合"],"ans":3},{"no":64,"sec":"dokkai","stem":"自分にうそのないふるまいとはどのようなものか。","options":["その時々の素直な気持ちを表すこと","いつも正直に自分の考えを伝えること","いつもどおりの姿を見せること","うそをつかず正直に話すこと"],"ans":3},{"no":65,"sec":"dokkai","stem":"筆者は、なぜ初対面の相手に慎重になったほうがいいと述べているのか。","options":["普段通りの態度では、相手に自分の良さを十分に伝えられないから","自分に関する一部の情報で相手がすべてを判断するかもしれないから","相手の性格が自分と合うかどうかまだよくわかってないから","初対面の相手には慎重な姿が実像だと思わせる必要があるから。"],"ans":2},{"no":66,"sec":"dokkai","stem":"自分の「メディア力」について、筆者はどのようにするのがよいと述べているのか。","options":["相手に自分の「メディア力」が正確に伝われるように意識する。","相手に普段の自分以上の「メディア力」を伝えるようにすること｡","相手に刻まれた自分の「メディア力」を気にせず平常心でいる。","相手に見せる自分の「メディア力」を下げないように静かにしている。"],"ans":1}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、陶磁器を作っている会社のホームページに載っている案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"工場見学・陶芸体験のご案内\n田原陶芸では、陶芸器の生地の製造から絵付けまでを見学したり、カップや茶碗作りを体験したりすることができます。ご自身がお作りになったものは、後日お送りいたします。\n開始時間：① 9時　② 10時　③ 14時\n所要時間：A. 工場見学と陶芸体験：約80分　B. 工場見学：約30分\n注意：土、日、祝日は工場の一部ができない場合もございます。\n予約方法：インターネット　http://tahara-togei/koji-kengaku/yoyaku/　電話番号 0731-92-3604（8:30〜16:50）\n休業日：年末年始、お盆\n費用：工場見学：無料　陶芸体験：2000円（送料込み）\n所在地：安見市西町5982\n問い合わせ先：田原陶芸株式会社　工場見学、陶芸体験担当　電話 0731-92-3604（8:30〜16:50）\n＊1 インターネットのご予約は、見学希望日の3日前まで承っております。\n＊2 お電話でのご予約は、見学希望日の前日まで承っております。\n以下のお客様に関しては、必ずお電話でご予約ください。準備等ございますので、見学希望日の七日前までにお申し込みをお願いします。\n・10 い。【互角】","options":["今回のプロジェクトで得た利益は、メンバー全員で互角に分配した。","決勝に残った選手たちの実力は互角だから、誰が優勝するか分からない。","いつも出張で使うホテルが満室だったので、互角の料金のところを見つけた。","エアコンが壊れているみたいで、室温が外の気温と互角になってしまった。"],"ans":2}]},{"id":"mon5","title":"問題5 — 文法","sec":"bunpo","instr":"次の文の（　）に入れるのに最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":26,"sec":"bunpo","stem":"不況の影響で、多くの企業が事業の縮小や延期、さらには事業からの撤退（　　）余儀なくされている。","options":["を","で","と","に"],"ans":1},{"no":27,"sec":"bunpo","stem":"一度ついてしまった癖は、（　　）簡単には直らないものだ。","options":["そう","たとえ","そのうち","いったい"],"ans":1},{"no":28,"sec":"bunpo","stem":"半年後に大学受験（　　）、アイドルの西田アキは現在活動を休止している。","options":["を基にして","を控えて","をもって","をめぐって"],"ans":2},{"no":29,"sec":"bunpo","stem":"結婚2年目の記念に、娘が遊園地のペアチケットをプレゼントしてくれた。いまさら夫婦二人で遊園地（　　）と思ったが、行ってみたら意外と楽しめた。","options":["にすぎない","ならではだ","でもあるまい","のようなものだ"],"ans":3},{"no":30,"sec":"bunpo","stem":"(手紙で)毎日を迎え、お忙しい毎日をお過ごしのことと（　　）が、お変わりありませんでしょうか。","options":["いたします","承りします","存じます","申し上げます"],"ans":3},{"no":31,"sec":"bunpo","stem":"駐車場に着いて、車から（　　）、ザーッと大粒の雨が降ってきた。","options":["出るようにしたとたんに","出ようとしたとたんに","出るようにするにつれて","出るようとするにつれて"],"ans":2},{"no":32,"sec":"bunpo","stem":"取引先との打ち合わせで、「御社で」と（　　）、誤って「弊社で」と言ってしまい、相手を混乱させてしまった。","options":["言うのにひきかえ","言ったことにしても","言うべきところを","言ったつもりはないのに"],"ans":3},{"no":33,"sec":"bunpo","stem":"この映画は主役の演技が良くない。ほかの俳優については（　　）、実にもったいない。","options":["文句のつけようがないのか","文句のつけようがないだけに","文句をつけずにはいられないのか","文句をつけずにはいられないだけに"],"ans":2},{"no":34,"sec":"bunpo","stem":"こんなに天気が良くなるなら、レインコートなんて、着て（　　）。","options":["きたんだった","くるんだった","きたんじゃなかった","くるんじゃなかった"],"ans":4},{"no":35,"sec":"bunpo","stem":"夕方の飛行機で帰ろうと思っていたが、台風の進路によっては午後の便がすべて欠航に（　　）。今夜の宿を探しておいたほうがよさそうだ。","options":["なるにこしたことはない","なりそうですらない","なっているはずがない","ならないともかぎらない"],"ans":4}]},{"id":"mon6","title":"問題6 — 並べ替え","sec":"bunpo","instr":"次の文の ★ に入る最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":36,"sec":"bunpo","stem":"先生に薦められた文献は難しくて、ひと通り読むことは（　*　）（　　）（　　）（　　）とは言えない。","options":["が","あまり","読んだ","理解できた"],"ans":3},{"no":37,"sec":"bunpo","stem":"今日は予定が詰まっていて、食事をする（　　）（　*　）（　　）（　　）一日だった。","options":["のも","くらい","忙しい","時間が惜しい"],"ans":4},{"no":38,"sec":"bunpo","stem":"自分のこと（　　）（　　）（　*　）（　　）のは我慢できない。","options":["について","ともかく","なら","家族や友人を悪く言われる"],"ans":2},{"no":39,"sec":"bunpo","stem":"食に関しては、これだけは、（　　）（　　）（　*　）（　　）誰にでもあると思う。","options":["こだわりを","持つことは","譲れないという","何かしらの"],"ans":1},{"no":40,"sec":"bunpo","stem":"人気のランニングシューズが欲しくて、（　　）（　　）（　*　）（　　）結局買えなかった。","options":["残っていても","売り切れているか","サイズが合うのがなかったりで","スポーツショップを数軒回って探したが"],"ans":1}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、「41」から「45」の中に入る最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"「好き」という言葉の罠\n「好き」という言葉は曖昧だ。意味が曖昧なわけではない。言葉に込められる感情の強さの度合いがはっきりしないのだ。ないよりはあったほうがいいという程度の「好き」もあるし、それを奪われたり失ったりしたら死んでしまうかも知れないという強烈な感情や意志を伴う「好き」もある。私事で恐縮だが、わたしは小説を書くのが好きではない。じゃあ嫌いなのかというとそうでもない。おそらくそれがなくては生きていけないくらい重要で大切なものだが、非常な集中を要するのでとても好きとは言えないのだ。 [41] 小説を書くことは好きという言葉の枠外にある。\n子どものころから文章を書くことは得意だったが、好きではなかった。もし自分が小説を書くことが好きだったらどうなっていただろう、と考えることがある。もし好きだったら、たぶん日常的な行為になっていただろう。つまり小説を書くことが自分にとって特別なことではなくなっていただろう。 [42] 小説を書くことそのものに満足を覚えるようになったかも知れない。執筆が日常的な行為と化すこと、書くことそのものに満足すること、いずれも予定調和(注1)に向かう要因となる。わたしにとっては忌避すべきことだ。\n「好き」という概念を [43] 。だが好きという言葉は自家撞着(注2)満足の罠に陥りやすい。程度の差はあっても、好きという感情には必ず脳の深部が関係している。理性一般を司る前頭前皮質ではなく、深部大脳辺縁系や基底核が関わっている。「好き」は理性ではなくエモーショナル(注3)な部分に依存する。だからたいていの場合、本当に「好きなこと」「好きなモノ」「好きな人」に関して、わたしたちは他人に説明できない。なぜ好きなの？どう好きなの？と聞かれても、うまく答えられないのだ。「好き」が脳の深部から湧いてくるもので、その説明を担当するのは理性なので、そこに本来的なギャップが [44] 、逆に、他人にわかりやすく説明できるような「好き」は、案外どうでもいい場合が多い。\n「なぜあの人が好きなの？」「お金持ちだから」というようなやりとりを想像すればわかりやすいが、説明可能なわかりやすい「好き」は、何かを生み出すような力には [45] 。\n(注1)予定調和：ここでは、創造的でない状態\n(注2)自家撞着：自己矛盾\n(注3)エモーショナルな：感情の","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["わたしも","わたしなら","わたしにとって","わたしはというと"],"ans":3},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["実は","確かに","とはいえ","もしかしたら"],"ans":4},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["否定してすらいない","否定してはいまいか","否定していたとしよう","否定しているわけではない"],"ans":4},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["生まれそうだが","生まれるのはいいが","生まれるからだが","生まれるかどうかだが"],"ans":3},{"no":45,"sec":"dokkai","stem":"文章の [45] に入る最もよいものを選びなさい。","options":["なれないという点だ","なり得ないのだと思う","なってはいけないらしい","ならずに済むのかもしれない"],"ans":2}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"以下は、ある会社がホームページに掲載したお知らせである。\n株式会社フジハルク　お客様へ大切なお知らせ\n2019年10月1日\n株式会社フジハルク\n家庭用エアコン「A42-C4」の再修理のお知らせ\n日頃は弊社製品をご愛用いただき、厚く御礼申し上げます。\nこの度、家庭用エアコン「A42-C4」について、弊社が2019年4月から8月の間に行ったホース修理の際に使用した金具に不具合があることが判明しました。そのため、その期間に修理をした製品に対して再修理を実施させていただくことになりました。\nつきましては、再修理の対象となるお客様には、弊社製品の修理を行っております関連会社「FHエンジニア」より直接電話にてご連絡させていただきます。\nなお、本件に関するお問い合わせは、弊社お客様センターまでお願いいたします。\nお客様には大変ご迷惑とお手数をおかけしますことを深くおわびいたします。何卒ご理解賜りますよう、お願い申し上げます。\n株式会社フジハルク　お客様センター：0120-333-4585（受付時間 10:00-18:00　土日祝休み）","items":[{"no":46,"sec":"dokkai","stem":"「A42-C4」の再修理について、このお知らせで伝えたいことは何か。","options":["再修理の対象となる人はお客様センターに連絡してほしい。","該当する期間にホース修理をした人に、関連会社から連絡がある。","該当する期間にホース修理をして、その後不具合が生じた人は、お客様センターに連絡してほしい。","該当する期間以外にホース修理をした人に、関連会社から連絡がある。"],"ans":2}]},{"passage":"目的地を目指して走るだけでは、人生というのはもったいないのではないか。私は散歩することが好きなのだが、散歩というのは、ゴールをめざして邁進することの対極(注)にある。むしろ目的に縛られていたのでは見えてこないものへと心を開いていなければいけない。ちょっとした季節の移り変わり、鳥の声、ここちよい風。店先からパンを焼くにおいなどが漂ってくると、それだけで幸せな気持ちになる。人生にも、こんな味わいがあるだろう。\n(注)対極:反対の位置","items":[{"no":47,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["目的を持っていては、豊かな人生が送れない。","目的を一つだけに限定しなければ、充実した人生になる。","目的の達成ばかりを考えていては、人生を十分に味わえない。","目的が達成できなくても、自然を感じて生きれば幸せな気持ちになる。"],"ans":3}]},{"passage":"子どもたちは、教師から「自分で考えなさい」「人の真似をしてはいけません」ということを明示的にも、暗黙的にも示されると、「人の真似ではない」という「真似」をすることを学ぶようになる。例えば、自分自身の気持ちとは裏腹に、あえて「人とは異なる発言、あるいは行動をする」ことを学んでいく。この学びが模倣ではないとどうして言えようか。一見個性的、一見創造的に見える仮面をつけた模倣は、明らかな「形」の模倣とは異なる故に、その実体が見えにくい。","items":[{"no":48,"sec":"dokkai","stem":"仮面をつけた模倣とは、どのようなものか。","options":["誰の真似もしていないように見える模倣。","教師の真似をしているように見える模倣。","自分の気持ちに反してする模倣。","実体を見せないための模倣。"],"ans":1}]},{"passage":"かつては「必要は発明の母」であった。技術は物質的な欲望から出発したのは事実だが、「必要」という精神の飢えが「発明」という物質的生産へと導いたことを忘れてはならない。精神が物質をコントロールしていたのだ。しかし、現代は「発明は必要の母」となった。「発明」品を改良して新たな機能を付加することにより、人々に「必要」であったと錯覚させ、消費を加速したのである。必要と発明の関係が逆転し、物質が精神を先導するようになったと言える。","items":[{"no":49,"sec":"dokkai","stem":"筆者によると、現代とはどういう時代か。","options":["人間は、「必要」な物は何でも「発明」できると錯覚している。","人間は物質的に豊かになったのに、新たな「発明」品を求め続けている。","「発明」された物によって、人間の精神が影響を受けている。","「発明」品は、人間の精神の飢えを満たすために改良され続けている。"],"ans":3}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"私たちは頭の中で「考える」とき、決して論文のように筋道の立った記述のように考えるわけではない。たとえば私の評論を書くときの経験では、論旨のエッセンスとなるような直感とか、ハイライト部分（注1）の「決め」になるようなフレーズ（注2）を思いついたときに「これは書ける」なんてわくわくして思い立つのである。つまり、その瞬間の頭に浮かんだものは、ばらばらな断片と大まかな展望に他ならない。そのピンポイント（注3）の断片と他の断片との間を、スムーズな説得力のある流れになるように継ぎ足していく作業が「書く」という仕事である。\nしかし、スムーズにつなぐことに集中しすぎると、もとの目的地から逸れた方向へ論旨が勝手に伸びていってしまうことが、ままある（注4）。（中略）ひとは書こうとしていたことをきちんと書けるわけではなくて、むしろ積み木のように書き足しているうちに、最初は書こうともしていなかったことを知らず知らずに書いてしまうことが少なくないのである。そのくせ書き上げてしまうと「そうか、自分はこういうことを考えていたんだ」などと思えてくるから不思議だ。\n私たちの意識は、言葉とイメージの網の目をふわふわ漂っているようなものである。それが言葉や文章に定着したとき、「考え」というものになる。言葉を抜きにして「考え」は存在しない。順序として「考え」がもともとあったから言葉が出てくるのだと思いがちだが、逆に言葉が出てきて初めて「考え」ははっきりするものなのである。だから言葉の運動が勝手に作り上げてしまった論旨が、いつのまにか自分の「考え」になってしまうという現象が起こるわけだ。\n（注1）ハイライト部分:ここでは、重要な部分\n（注2）フレーズ:ここでは、言葉や表現\n（注3）ピンポイントの:ここでは、中心となる\n（注4）まま:時々","items":[{"no":50,"sec":"dokkai","stem":"筆者によると、書くとはどういうことか。","options":["直感や思いつきを頭に浮かんだ順に並べていくこと。","ばらばらな断片を直感に基づいてつないでいくこと。","頭に浮かんだ断片を筋道を立ててつないでいくこと。","論理的に考えたことをスムーズな流れに並べていくこと。"],"ans":3},{"no":51,"sec":"dokkai","stem":"不思議だとあるが、なぜか。","options":["考えていたことが書けていなくても、書けたように思えてくるから。","書くことに集中しすぎないほうが、うまく書けたと思えてくるから。","書き足しているうちに、自分の考えがより深まったと思えてくるから。","書き上げたものが、初めから考えていたことであるかのように思えるから。"],"ans":4},{"no":52,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["言葉にすることで、自分の「考え」が出来上がる。","言葉が作り出す「考え」は自分の「考え」ではない。","「考え」が存在して初めて、書き進められる。","意識によって「考え」を言葉にすることができる。"],"ans":1}]},{"passage":"イギリスの科学誌『ネイチャー』の最近の号に、カエルの種多様性と寄生虫の感染率についての論文が載っています。カエルの全数は同じで、特定の1種類しかいない場合と、数種類のカエルが共存する場合で、ある種のカエルが寄生虫に感染して発病する割合は、前者のケースのほうが高いという内容です。つまり多様性が高いと特定の種が病気になる割合が下がるというのです。\n（中略）\n他の種が存在することによって自分が病気になる確率が下がるとするのなら、それぞれの種は互いの種を競争で滅ぼしてしまわないほうが自分も得をします。もしかすると、自分たちの使う資源を他の種に譲ってでも、それを存続させることが有利になるかもしれません。アリのような種内での協力と同様、いくつもの種がコストを払って共存し合うことで、それぞれの種が得をしている可能性があります。<span class=\"underline-q\">種のレベルを超えた協力</span>と言えるかもしれません。\nこの話がさらに面白いのは、それが寄生虫という、カエルを減ぼしかねない要因とリンクして起こっている点です。寄生虫の側から見た場合、感受性の(感染する)カエル1種だけのときは、どの個体へも感染でき、そこで成長できますから、短期的な寄生虫の増殖率は高くなるでしょう。しかし、全部のカエルに感染して殺してしまうと寄生できる相手がいなくなるため、寄生虫も減びなくてはならなくなります。したがって、いろいろなカエルがいることは、寄生虫にとっても、自身の長期的存続を可能にするメカニズムとして働いているのです。","items":[{"no":53,"sec":"dokkai","stem":"カエルが寄生虫に感染して発病する割合が低いのは、どのような場合か。","options":["1種類の寄生虫しかいない。","1種類のカエルしかいない。","数種類の寄生虫が共存する。","数種類のカエルが共存する。"],"ans":4},{"no":54,"sec":"dokkai","stem":"<span class=\"underline-q\">種のレベルを超えた協力</span>とはどのようなものか。","options":["他の種に自分の種の病気を広めない。","他の種とともに、ある特定の1種類を滅ぼす。","自分の種の存続より他の種の存続を優先させる。","多少の犠牲を払っても、他の種の存続を助ける。"],"ans":4},{"no":55,"sec":"dokkai","stem":"寄生虫について、筆者はどのように述べているか。","options":["感染するカエルが1種類だけだと、寄生虫自身も絶減してしまう。","感染するカエルが1種類だけだと、長期的に寄生虫の増殖率が高まる。","感染するカエルが多種類だと、寄生虫自身も絶減してしまう。","感染するカエルが多種類だと、一時的に寄生虫の増殖率が高まる。"],"ans":1}]},{"passage":"今、モノづくりの過程を「見える化」と称して可視化（注1）、数値化し、技やノウハウを共有化したり、さらには自動化して人を減らそうという動きが盛んになっています。けれど、この過程には大きな危険が潜んでいることを認識しなくてはなりません。\nモノづくりには、手づくり、手作業の要素が非常に重要です。経験、約に基づく技は体で覚えるしかありません。見える化しようとすると、すべての作業をデジタル的に数値化することになります。しかし、勘や経験による手作業は数値化できません。また、どんな思いを込め、どんな気持ちでつくっているかという心の部分は数値にしょうがありません。\n（中略）\n見える化の過程には「省略」と「変形」が起きる危険性があります。怖いのは、一度、仕組みができ上がると、それが元の実態であるかのような錯覚を起こし、一人歩きしてしまうことです。見える化されたものは、元々の姿からアナログの部分が省略され、変形しているのです。<span class=\"underline-q\">これ</span>に気付かなければなりません。\nもう一つの危険は創造が起きなくなることです。ある職人の技があったとします。これを見える化しても、そこからは何も新しいものや価値が生まれているわけではありません。\n匠（注2）の技とは、自分で経験を積み、手で触り、頭で考えている中で、「こうしたほうがいい」「こんなやり方があるな」と気付き培ってきたものです。つまり、手作業のプロセスの中にこそ創造があるのです。今のやり方を見える化、自動化し、手作業のプロセスを抜いてしまえば、新しい技術は生まれません。\n（注1）可視化する:目に見えるようにする\n（注2）匠:優れた職人","items":[{"no":56,"sec":"dokkai","stem":"<span class=\"underline-q\">これ</span>とは何か。","options":["職人の経験や勘、心を「見える化」すると、変形してしまうこと。","職人の経験や勘、心を「見える化」する技術がまだないこと。","「見える化」されたものには、職人の経験や勘、心は含まれないこと。","「見える化」されるには、職人の経験や勘が必要であること。"],"ans":1},{"no":57,"sec":"dokkai","stem":"筆者によると、新しい技術を生み出すのに必要なことは何か。","options":["できるだけ多くのプロセスを手作業で行うこと。","優れた職人の技を「見える化」すること。","職人が「見える化」に取り組むこと。","手と頭を使って作業をすること。"],"ans":4}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"脳科学はヒトそのものの仕組みを明らかにしようとする学問です。そのため、その成り立ちから人々の耳目（注1）を引くように運命づけられていると言えます。脳科学は、誰もが青春の一時期に悩む「自分って何だろう」という疑問に科学の力で挑むという、考えてみたら少し青臭い（注2）学問だったりするのです。\nだからというわけではありませんが、人々の口に上りやすく、そのため伝搬のスピードも他の学問と比べて早いように思います。特に、自己（注3）の知覚の裏をかかれるようなさまざまな現象、たとえば錯視現象や無意識と意識の話などは、自己恒常性、つまり自分がいつも自分であり続けることに関わるだけに、他のどんな科学より人々の気持ちを鷲掴（注4）みにします。そのせいで、脳機能を理解する前に現象だけが先走って人々の間に広がっていくことも多い学問です。もちろん、それは何より面白いからです。\nそんな脳科学も、昨今の説明責任という考え方や社会還元という意味合いで、一般の人々へなんとか知見のフィードバック（注5）をしなければならない圧力にさらされています。少し前には、脳科学の研究成果が新聞に掲載されることはあまりありませんでしたが、今ではプレスリリース（注6）も当たり前に行われますし、そこではできるだけ面白く人々の興味をひきつけるストーリーを作りがちになります。本当はそういう色気は基礎科学に馴染まないのですが、メディアからの要請があると、僕たちはなんとかそれに応えようとして、浅薄な脚色をして本当の面白さをゆがめてしまいがちになります。\nそういう「メディア対応」と呼ばれる技術も科学者に必要とされている現代は、ある意味で科学者にとって不幸な時代なのかもしれません。\n（中略）\n昨今の過剰なメディアの脳科学の取り上げ方は、科学者の説明責任を遥かに逸脱したレベルであるように思えるのです。そういうメディアの要求に、誠実に対応しようとすればするほど、科学者は自分をすり減らすことになるでしょうし、だんだんと科学の現場から乖離せざるを得なくなるでしょう。それは、優秀な科学者を潰すことになります。\n科学者の価値は、何よりも科学の現場に居続けることにあります。科学的知見に裏打ちされない（注7）空論を弄ぶのではなく、常に研究の現場に自分をつなぎ止め、足を杭で打ち付けてでも科学の現実から離れないようにすること。そういう決意をもってメディアに対応するのであれば、フワフワと遠くに行ってしまうことはないでしょう。\n（注1）耳目を引く：注意を引く\n（注2）青臭い:ここでは、純粋すぎる\n（注3）自己の知覚の裏をかかれる:ここでは、自分が思いもしなかった\n（注4）鷲掴みにする:ここでは、強く掴む\n（注6）プレスリリース:メディア向けの公式発表\n（注7）~に裏打ちされる:てに裏づけられる","items":[{"no":58,"sec":"dokkai","stem":"脳科学について、筆者はどのようにとらえているか。","options":["他の学問より早いスピードで進歩している。","人々の脳機能を高めることに貢献している。","身近な疑問を扱っており、多くの人々に理解されている。","脳の働きが理解されないまま、人々の興味だけが先行している。"],"ans":4},{"no":59,"sec":"dokkai","stem":"そういう色気とは、どのようなことか。","options":["科学者が科学本来の面白さを前面に出そうとすること","科学者が事実を実際より面白くして伝えようとすること","科学者が一般の人々に分かりやすく科学を説明しようとすること","科学者が新間に掲載されるような興味深い研究をしようとすること"],"ans":2},{"no":60,"sec":"dokkai","stem":"現代のメディアと脳科学の現場との関係はどのようになっているか。","options":["メディアが、研究内容に介入するようになってきている。","メディアの過剰な要求のため、研究の現場に負担がかかっている。","脳科学に関する情報提供の機会が、メディアに奪われている。","脳科学本来の面白さが、メディアに取り上げられなくなっている。"],"ans":2},{"no":61,"sec":"dokkai","stem":"筆者によると、昨今のメディアとの関わりにおいて、科学者はどうあるべきか。","options":["メディアを自身の研究のために活用するべきだ。","メディアを通じて研究の現場から情報を発信するべきだ。","メディアへの対応よりも、研究を優先するべきだ。","メディアの要求には対応せず、研究の現場を大切にするべきだ。"],"ans":3}]},{"label":"Mon11","passage":"A\n褒めれば人は育つといいます。確かに人間は叱られるより、認められたり褒められたほうが嬉しいに決まっていますし、「よし、次もがんばろう」とやる気も出るものです。リーダーだって、普段からガミガミ言うより、部下を褒めるほうが自分自身の気分も良いでしょう。\nしかし褒めてばかりいると、今度は思わぬ弊害が出てくると私は考えています。確かに部下の士気は上がるのですが、逆に褒められることが目的になりかねない。「お前は偉いな」と課長に褒められたいから、仕事を一生懸命にやるようになってしまうのです。\n（中略）\n「良くやった」「偉いな」などという言葉は、たまに言うから効果的なのであって、日常的に口にしていたら効果は半減してしまうでしょう。要は褒めるところと叱るところ、リーダーはいつも人を見てバランスを考えなくてはなりません。\nB\n部下のやる気を引き出すようにうまく褒めるのは難しい。的外れな褒め方をすれば「自分をよく見ていない」と不信感を抱かせてしまうし、皆の前で特定の人ばかりを褒めれば、チーム内の関係が悪化してしまうこともある。さらに褒め続けることで、部下が、仕事への責任感や使命感からではなく、上司に褒められることを目的にがんばるという状態になってしまう恐れがある。\nこのような事態を避けるために、上司には適切に褒める技術が求められる。部下が良い仕事をしたら、タイミングを逃さずその場で褒めることが効果的だ。また、成果だけを褒めるのではなく、仕事の過程の中で何が良かったかを取り上げて褒めることが重要だ。そうすれば、部下も評価された点を明確に自覚でき、次の仕事につなげやすくなる。","items":[{"no":62,"sec":"dokkai","stem":"部下を褒めすぎることの問題点として、AとBが共通して述べていることは何か。","options":["部下同士の人間関係が悪くなること","部下が上司に不信感を持ち、やる気をなくすこと","部下が褒められるために仕事をするようになること","部下が仕事で成果を上げることだけを目標にすること"],"ans":3},{"no":63,"sec":"dokkai","stem":"部下への接し方について、AとBはどのように述べているか。","options":["Aは状況に応じて褒めたり叱ったりすることが必要だと述べ、Bは良い点をすぐに褒めることが大切だと述べている。","Aは叱った後には褒めるようにしたほうがいいと述べ、Bは適切なタイミングで褒めることが大切だと述べている。","Aはできるだけ叱るのをやめるべきだと述べ、Bは良いと思った点を率直に表現したほうがいいと述べている。","Aは分かりやすい言葉で褒めることが大切だと述べ、Bは仕事の過程の中で良かった点を褒めたほうがいいと述べている。"],"ans":1}]},{"label":"Mon12","passage":"交換と交易（注1）の歴史は非常に古く、何万年も前までさかのほれるようだが、貨幣経済は進化史的に言えばごく最近のことである。どんなものにも変えることができる抽象的な価値とは、とんでもない発明だと思う。（中略）\nそれは、貨幣というものが、確かに人間の生活を変え、世界を見る目を変え、欲望のあり方を変え、人生観を変え、結局のところ人間性を変えてきているように思うからだ。貨幣経済の真っただ中で暮らしている私たちにとって、貨幣は当たり前の存在だが、ヒトという生物にとって、こんなものの存在は決して当たり前ではなかった。そして、大量の砂糖や脂肪の存在に私たちの脳も体もうまく対応できていないのと同じく、この貨幣という存在にも、実は私たちの脳はうまく対応できていないのではないだろか。\nヒトが狩猟採集生活をしていた頃、ヒトは自分たちの手で集められる食料を食べ、自分たちの手で作れる道具や衣服を使って暮らしていた。できることは限られていたし、望めることには限度があった。まさに等身大（注2）の生活である。それ以上の世界の可能性を知らなければ、欲望にも限りがあった。「欲しい物」というのは具体的な物であり、それを手に入れる方法は限られていた。そして、ヒトはそのことを知っていた。\nしかし、何にでも交換できる抽象的な価値が手に入るようになると、それ自体を得たいという新たな欲望が生まれる。「金の亡者」（注3）は、何か特定の物が欲しいから貨幣を得るのではない。ともかく貨幣をためることが何にもまして大事な目的なのだ。そこには限度がない。\nまた、何にでも交換できる抽象的な価値は、人間関係を買うことも、幸せな気分を買うこともできる。貨幣がない時には、人間関係を築いていなければできなかったことが、個別の人間関係抜きに手に入る。逆に、貨幣なしではほとんど何もできない。\nそして、今では、貨幣を手に入れることは一つの職業につくことである。一つの職場で一つの仕事をし、その対価（注4）に貨幣をもらう。そうすると、ヒトは、自分が独立して生きていると思う。本当は、今でも狩猟採集生活時代と同じように、みんなで共同作業をすることで生きているのだ。農家がいなければお米も野菜もない。物流や商店がなければ、買うことができない。医者がいなければ病気を治せない。学校の先生がいなければ教育ができない。今でも、みんなでともに生き、生かされて暮らしているのだが、それぞれに貨幣が介在しているので、共同という感覚がなくなる。便利なものには必ず負の面がある。ちょっと立ち止まって考えてみた方がよい。\n（注1）交易:ここでは、取り引き\n（注2）等身大の:その人の状況や能力に合った\n（注3）金の亡者:異常に金銭に執着する人\n（注4）対価:ここでは、報酬","items":[{"no":64,"sec":"dokkai","stem":"とんでもない発明だと思うのは、なぜか。","options":["人間の脳の対応力を徐々に変えてきたから。","人間に抽象的な思考を強いるようになったから。","多様な人生観や人間性を生み出してきたから。","生活から考え方まで人間のあり方を変えてきたから。"],"ans":4},{"no":65,"sec":"dokkai","stem":"狩猟採集生活をしていた頃のヒトの欲望について、筆者はどのように述べているか。","options":["自らたちの日常しかしらなかったから、欲望は限られていた。","自分たちの経験から欲望には限りがないことを知っていた。","多くの欲望を持っていたが、それを満たす手段は限られていた。","生きることが最優先だったから、欲望を持つ余裕がなかった。"],"ans":1},{"no":66,"sec":"dokkai","stem":"筆者によると、ヒトは貨幣を手に入れてどうなったか。","options":["人間関係に関心がなくなった。","貨幣自体が欲望の対象になった。","特定の物に対する欲望が強くなった。","何が本当に欲しいのか分からなくなった。"],"ans":2},{"no":67,"sec":"dokkai","stem":"筆者が最も言いたいことは何か。","options":["貨幣を得ることだけが働く意味ではないと自覚にすることが必要だ。","貨幣があることによって共同という感覚が必要ではなくなっている。","貨幣によって失われている共同という感覚を忘れてはいけない。","貨幣には人間関係を壊すという負の面もあることを忘れてはいけない。"],"ans":3}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある助成制度の案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"十条市国際交流事業助成制度　2020年度募集概要\n趣旨：本制度は、市民が行う国際交流事業を市が助成し、国際交流を推進することを目的としています。\n対象団体：国際交流活動を行う団体で、次のいずれにも該当する団体\n・団体の主たる構成員が十条市民で、1年以上の活動実績があること\n・過去3年以内に本助成金の交付を受けていないこと\n対象事業：2020年4月1日から12月31日までの間に実施される事業で、「国際理解と国際協力」または「多文化共生社会の実現」に関するもの\n助成額：1事業あたり30万円以内（1団体につき1事業のみ応募可）\n提出書類：1 申請書　2 事業計画書　※当センターホームページよりダウンロードしてください。\n応募方法：上記の書類を郵送していただくか、センター窓口に直接ご持参ください。（メール、ファクス不可）\n応募期間：2020年1月10日（金）〜1月28日（火）　※最終日必着（窓口持参は17時まで）\nスケジュール\n説明会：①2019年12月10日（火）13:00〜14:00　②2019年12月19日（木）13:00〜14:00　応募を希望する方は、①か②のいずれかに必ずご参加ください。（予約不要）\n個別相談会：2019年12月11日（水）〜12月25日（水）30分程度　事業の内容等について担当職員が相談に応じます。（希望者のみ・要予約）\n1次選考：書類審査。結果は2020年2月14日（金）までに応募者全員に書面で通知します。\n2次選考：2020年3月7日（土）10:00〜12:30　団体によるプレゼンテーションと、質疑応答\n結果通知：2020年3月13日（金）までに2次選考参加者全員に書面で通知します。\nお問い合わせ・送付先：〒614-3790 十条市西島2-21　十条市国際交流センター　国際交流事業助成担当　電話 0199-61-2257","items":[{"no":68,"sec":"dokkai","stem":"この助成制度への応募に関して、留意しなければならないことはどれか。","options":["この助成金の交付を過去に一度も受けていない団体である必要がある。","助成を受ける事業は決められた期間内に実施しなければならない。","合計を30万円以内にすれば、複数の事業について応募できる。","団体によるプレゼンテーションを1次選考の際に行わなければならない。"],"ans":2},{"no":69,"sec":"dokkai","stem":"ソンさんは十条市民による国際交流クラブの代表で、この助成制度に応募することにした。参加必須のもの以外は出るつもりはない。12月10日の説明会に参加できない場合、ソンさんの応募方法として合っているのはどれか。","options":["12月19日の説明会に参加し、提出書類を応募期間内にファクスで送る。","12月19日の説明会に参加し、提出書類を応募期間内に着くように郵送する。","12月19日の説明会と個別相談会に参加し、提出書類を応募期間内にメールで送る。","12月19日の説明会と個別相談会に参加し、提出書類を応募期間内に窓口に提出する。"],"ans":2}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t12-2019-nghe.mp3","items":[{"no":70,"sec":"nghe","stem":"1番：男の人は、この後、どうしなければなりませんか？","options":["ちぎれた部分を探す","本を修理する","同じ本を買って持ってくる","図書館に本の代金を払う"],"ans":3,"blind":false},{"no":71,"sec":"nghe","stem":"2番：女の人はこの後何をしますか？","options":["デザイン変更の相談を業者とする","業者に納期の変更を依頼する","記念品の予算を再検討する","記念品を別の業者に注文する"],"ans":1,"blind":false},{"no":72,"sec":"nghe","stem":"3番：女の人はまず何をしますか？","options":["専門家と打ち合わせをする","ツアーで登る山の候補を絞る","他社の類似ツアーに参加する","山周辺の観光スポットを探す"],"ans":2,"blind":false},{"no":73,"sec":"nghe","stem":"4番：男の人はこの後何をしますか？","options":["駐輪場までの地図を作る","店の隣に駐輪場を造る","店の前に看板を立てる","店ののきさきに植物を置く"],"ans":4,"blind":false},{"no":74,"sec":"nghe","stem":"5番：講師は何をしなければなりませんか？","options":["自習用教材の作成","受講生へのアンケートの実施","新しい教材の内容の確認","パソコンの設定変更"],"ans":3,"blind":false},{"no":75,"sec":"nghe","stem":"6番：男の人はこの後まず、議事録をどうしますか？","options":["オンラインの共有フォルダーに保存する","印刷して、出席者に回覧する","印刷して、部長に提出する","発言者にメールで送付する"],"ans":4,"blind":false 映している。","インターンに参加して、職場の様相を知ることができた。"],"ans":3},{"no":25,"sec":"moji","stem":"次の言葉の使い方として、最もよいものを選びなさい。【交える】","options":["アルバイトだった時期も交えると、この会社で働いて7年になる。","首脳会議は冗談を交えた和やかな雰囲気で進められた。","心を交えて、彼のセーターを編んでいる。","母の誕生日にメッセージを交えて花束を贈った。"],"ans":2}]},{"id":"mon5","title":"問題5 — 文法","sec":"bunpo","instr":"次の文の（　）に入れるのに最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":26,"sec":"bunpo","stem":"優勝（　　）逃したが、石川選手は今大会で自己べストを更新する好成績を収めた。","options":["さえ","こそ","ほど","ばかり"],"ans":2},{"no":27,"sec":"bunpo","stem":"今度の正月休みには、留学している息子も帰ってくる（　　）、久しぶりに家族旅行にでも行こうかと思っています。","options":["ことだが","ことでも","ことだから","こととはいえ"],"ans":3},{"no":28,"sec":"bunpo","stem":"兄が会社の採用面接試験から帰ってきた。表情が明るいところを見ると、（　　）うまくいったようだ。","options":["仮に","まさか","必ずしも","どうやら"],"ans":4},{"no":29,"sec":"bunpo","stem":"このレストランは、料理はおいしいのだが、皿が安っぽい。もう少し良いものを使えない（　　）と思う。","options":["ものか","ものの","ものだ","ものを"],"ans":1},{"no":30,"sec":"bunpo","stem":"先生:「木村くん、このレポート読んだよ。うまくまとめられなかったって言ってたけど、けっこうよく（　　）。」木村:「ありがとうございます。」","options":["書けてなきゃ","書けてたらいいね","書けてるじゃない","書けてるかどうかだね"],"ans":3},{"no":31,"sec":"bunpo","stem":"駅前のうどん屋「やまむら」は、最近テレビで紹介された（　　）、毎日店の前に長い行列ができている。","options":["とかで","とかなら","というのが","というのも"],"ans":1},{"no":32,"sec":"bunpo","stem":"今回の事故について社長が会見を行ったが、あれでは何の説明（　　）、わが社の信用が失われるだけだ。","options":["になっておらず","にもなっておらず","になっているのではなく","にもなっているのではなく"],"ans":2},{"no":33,"sec":"bunpo","stem":"小林:「ねえ、今日のダンスの練習、山口さんも来るんだよね?」森:「どうだろう。あの人、来るって言ってても、（　　）だから……。」","options":["来ても来なくても","来るか来ないか","来たり来なかったり","来るのも来ないのも"],"ans":3},{"no":34,"sec":"bunpo","stem":"昨日大学で声をかけられたサークルの勧誘には困った。強引に話を進められて、危うく入会（　　）。","options":["させられるところだった","されようがなかった","させなかったのかと思った","しなかったことにした"],"ans":1},{"no":35,"sec":"bunpo","stem":"高橋:「林さん、ギター教室探してるって聞いたけど、見つかった?」林:「いえ、まだなんです。」高橋:「よかったら、私が通ってるギター教室、見学してみない? 見学したからって、（　　）し、どう?」","options":["入りたがるだけじゃない","入らせないわけにはいかない","入りたくないだけかもしれない","入らなきゃいけないってわけじゃない"],"ans":4}]},{"id":"mon6","title":"問題6 — 並べ替え","sec":"bunpo","instr":"次の文の ★ に入る最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":36,"sec":"bunpo","stem":"X 医院は、患者を（　　）（　　）（　*　）（　　）近々予約制を導入するらしい。","options":["待たせる","診察できる","ように","ことなく"],"ans":2},{"no":37,"sec":"bunpo","stem":"昨日、友人から野菜ジュースをたくさんもらった。一人暮らしだとインスタント食品ばかり食べてしまって（　　）（　　）（　*　）（　　）ありがたい。","options":["だけに","になり","がちな","野菜不足"],"ans":3},{"no":38,"sec":"bunpo","stem":"ホームページで\nQ：洗剤をたくさん使ったほうが、洗濯物がきれいになりますか。\nA：洗濯物を（　　）（　　）（　*　）（　　）悪臭の原因にもなります。適量を守りましょう。","options":["洗剤をたくさん入れればいいかといえば","逆にすすぎ切れなかったりして","きれいに洗うには","そうではなく"],"ans":4},{"no":39,"sec":"bunpo","stem":"この町には、大正初期に建てられた洋館があるらしい。前々から（　　）（　*　）（　　）（　　）帰ることはできない。","options":["私としては","近代建築に興味がある","その洋館を見ずに","それを知ったからには"],"ans":1},{"no":40,"sec":"bunpo","stem":"私は、（　　）（　*　）（　　）（　　）と思い、校内に畑を作って生徒たちに野菜を育てさせることを校長に提案した。","options":["農業を身近なものとして","食べるということが","考えるきっかけになれば","育てた野菜を収穫して"],"ans":4}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、文章全体の内容を考えて、41から45の中に入る最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"人間とは月のようなもの\nこの世を生き抜く上で知っておくべき言葉がある。\nまず一つは、「人間は謎」だということ。\n人は自分ではなんでもわかっているつもりでも、本当は自分自身のことをよく理解できていないのだ。自分で自分のことを理解できていないのに、どうして他人のことを理解できるのか。これが、 [41] 一つ。\nそれからもう一つは「人間は月のような存在だ」ということ。自分が他人に見せている「自分」は、相手に応じて見せる「光り輝いている部分」であって、ほかのところに行けば、また [42] 顔をする。上司の前では部下の顔をするし、お得意様(注1)の前に行けばそれなりの顔をする。自分だけじゃない、みんなが千変万化する(注2)ものであり、人は他人に対して、基本的には常に自分の明るい部分を見せているということだ。\n他人には満月を見せていて、人という光に当たって誰もが輝いて見えているが、その裏側は黒く、暗いものだ。その暗いものを自分が持っているということを最初からわかって [43] 、その人はもう、すぐにでも心が平和になるだろう。\nそうすれば、「あの人は信じられる」とか「信じられない」とか、「裏切られた」という思いもなくなる。人間社会という宇宙の上に回っていて、その人間が裏側を見せている場合もあるのも仕方のないことで、人間関係というのは引力、とかいろんなことが関係してくるということも [44] 。\nだからこそ「人間は謎」であり、たまには元気がなくなったりして、三日月になったりするけど、いつも光って見える。 [45] 裏側に、真っ暗で人に見せたくない部分を誰もが持っていて、そのすべての面を見ることは誰にもできない。\n見えている部分の裏側にある面の存在を認識できていれば、変に気持ちが揺さぶられることもなくなるのだ。\n(注1)お得意様：ここでは、取引先\n(注2)千変万化する：さまざまに変化する","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["あと","もう","まず","ひとつ"],"ans":3},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["同じ","別の","そんな","あのときの"],"ans":2},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["いて","いれば","いるため","いたとしても"],"ans":2},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["わかっていた","わかってきたのか","わかっているらしい","わかってくるはずだ"],"ans":4},{"no":45,"sec":"dokkai","stem":"文章の [45] に入る最もよいものを選びなさい。","options":["しかしその一方で","そうしたからといって","例えばこのように","どちらかというとむしろ"],"ans":1}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"自分の経験や無意識の枠にとらわれている(注)と、想像力はふくらまない。だからその枠を取り除くことが、想像力を鍛えるひとつのポイントになるだろう。\nとはいえ、いままでの経験や考えによって無意識につくられてしまった枠はだれもがもっていて、それはもうしかたがないものだ。\nその枠は、人生や経験の中でつくりあげてきたもので、その人の個性や人柄、物差しや基準になるわけだから、枠はあってもいい。ただ、必要なときには意識してそれをはずせることが大切だ。\n(注)とらわれる：ここでは、こだわりすぎる","items":[{"no":46,"sec":"dokkai","stem":"想像力を鍛えることについて、筆者はどのように考えているか。","options":["経験からつくられた枠を捨てなければいけない。","経験からつくられた枠を意識しないことが大切だ。","経験からつくられた枠を取り除けることが大切だ。","経験を積み重ねて枠をより強いものにしなければいけない。"],"ans":3}]},{"passage":"人間の最も根源的な欲求から生まれる住まいとは、そこに住む人々の生活や気候風土の違いがそのままに表れる土着の（注）ものでした。世界各地にある土着の住まいを眺めてみると、ときに驚くような表現のものもあり、改めて人間の生活の多様な在り方に気づかされます。それらは現代的価値観からすると確かに前近代的で非合理なものに見えるかもしれません。しかし、私はそこに人々の生きること、住まうことへの欲求の切実さ故の力強さと、現代の私達の住環境にはない素朴な豊かさを感じるのです。","items":[{"no":47,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["世界各地にある近代的な住まいには、力強さと豊かさが感じられる。","その土地にもとからある住まいには、人間本来の欲求が表れている。","人間の根源的な欲求から生まれた住まいは、生活の多様さに対応できない。","生きること、住まうことへの欲求は、その土地の生活や気候風土に影響されない。"],"ans":2}]},{"passage":"労働はモノをつくり出すために体に労苦（注1）を強いるので、苦しい部分を併せ持っています。ただ、その活動を通じて社会とのつながりを感じることができれば喜びにも転化します（注2）。そんな喜びの部分を削り取られ、苦役（注3）だけが残る状態が広がっている現実を、どう食い止めていくかは大きな課題です。喜びを感じられない働き方なのに「働くことは喜びだ!」と建前で押し切ろうとしたり、「働くのが怖い」と背中を向けたりの二者択一でなく、苦しさと喜びのバランスの回復を求めて、働き方の改善を求めていくことが必要です。","items":[{"no":48,"sec":"dokkai","stem":"この文章で筆者が言いたいことは何か。","options":["喜びを感じられても、社会とのつながりが感じられない働き方は見直すべきだ。","働く喜びを得るには、苦しさに立ち向かっていかなければならない。","苦しさを感じないで済むように、働き方の改善を求めていかなければならない。","苦しさを受け止めつつ、喜びが感じられるような働き方を目指すべきだ。"],"ans":4}]},{"passage":"情報化社会では、その情報化が進めば進むほど、買い手は商品選択において困るというジレンマをかかえてしまう。企業情報や商品情報が増えると、その実態を推し量る（注）ことが難しくなるので、大量の情報を包括する代表的な名前や記号やスローガンによってその優劣を判断し、それらを手がかりに選択のリスクを軽減しようとする。この記号にあたるものがブランドで、ブランド戦略が注目を浴びてきた背景には、情報社会の進展がある。\n(注)推し量る：推測する","items":[{"no":49,"sec":"dokkai","stem":"情報化社会におけるブランドについて、筆者はどのように述べているか。","options":["買い手の購買意欲を高めるきっかけになっている。","買い手の商品選択におけるジレンマを増大させている。","買い手が商品を選択する際の判断材料になっている。","企業や商品の情報が買い手に誤って伝わるリスクを軽減している。"],"ans":3}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"ここ数年はクマがヒトの領分（注1）に入りこんでトラブルになることが多くなった。\n人里（注2）にクマが出没する原因を餌不足に求める報道が多かったように思うが、ブナ（注3）に代表される奥山の種子生産の豊凶（注4）は昔からあるできごとで、奥山での食物不足を毎年のクマ出没の主因に当てはめるのには無理があるように思う。奥山でのクマ同士の力関係で、弱いクマが餌を求めて人里に出てきているという見方もあったが、人里で捕らえられたクマの栄養状態を調べると、かならずしも力の弱いクマが人里に降りてきているとは言えないようだ。奥山に十分な餌があっても人里に降りてきたり、人里の作物の収穫時期に合わせて山から下りてくる話を聞いていると、奥山よりも効率よく餌を得られる人里へ、力の強いクマが降りている様子が想像できる。奥山の動物たちの動きに変化が見られるようだ。それはクマだけでなくカモシカやシカを含めた野生動物全般に広がる変化である。\n（中略）\nクマをはじめとする野生動物が、人里に「おいしい」食べ物があることを知るのは、山里においしい食べ物をゴミとして捨てたヒトがいるからである。キャンプやバーベキューの後に放置されたゴミや、里山や人里近い山林に捨てられたゴミは、しばしば野生動物の食物になる。そして彼らは学習する。ヒトの捨てたゴミは「おいしい」と。学習した野生動物たちは、人里近くでゴミによって餌付けされ（注5）、人里内部へ入りこんでくるのである。野生動物が人里に出没するのは、人間が彼らを誘導している側面がある。\n（注1）領分：領域\n（注2）人里：ここでは、山に近い村\n（注3）ブナ：森の木の一種\n（注4）豊凶：豊作と凶作\n（注5）餌付けする：ここでは、人になれさせる","items":[{"no":50,"sec":"dokkai","stem":"無理があるように思うのはなぜか。","options":["クマの餌になる種子は一種類だけではないから","クマの餌になる種子の種類が変化しているから","クマの餌になる種子の凶作はこれまでもあったから","クマの餌になる種子の凶作は昔のほうが深刻だったから"],"ans":3},{"no":51,"sec":"dokkai","stem":"筆者によると、クマが山から降りてくるのはなぜか。","options":["人里にも奥山と同じような餌があるから","人里のほうが好みの餌が容易に得られるから","人里でしか餌を得られなくなったから","人里ではクマ同士の力関係にかかわらず餌を得られるから"],"ans":2},{"no":52,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["野生動物の力関係は、栄養状態によって決まる。","野生動物の行動の変化は、人間の行為に原因がある。","野生動物の生態が変化したのは、人間が生活環境を脅かしたためだ。","野生動物と人間が共存していくには、ゴミの増加を抑える必要がある。"],"ans":2}]},{"passage":"以下は、歴史を研究する人に向けて書かれた文章である。\n私たちが生きている現在でも、ちょっと過ぎれば時間的には過去となる。では、少し前の自分の経験がどういう状態であったのだろうか、という場面を、記憶や資料をもとに正確に再現することはできるであろうか。全体について漏れなくすることは、どうあがいても（注1）できない。\n（中略）\n過去を生きた人たちの喜びや楽しみにしても、苦労や苦しみにしても、正確にはわれわれはそのごく一面しか推察できないのだ、という限界についての謙虚な自戒が、歴史を問うにはまず必要だと私は考えている。そのうえで、現在を生きている人間が、ある問題について関心をもって問いかけるとき、はじめて歴史像を描く道への出発点ができる。そうやって問いかけがあってはじめて、なにを歴史資料として利用できるであろうか、というつぎのステップの問いへと続いてゆく。あるいは過去からの遺物に接して興味をそそられ、そこから歴史への扉が開かれる、という場合もあるかもしれない。いずれにしても、そうした問いがあって、ある文字表象（注2）や物体が史料ないし資料としての価値を帯びるのである。そうした手続きを踏むことによって、われわれは、歴史像の構築へと歩みだす。描かれる歴史像は、過去の実態そのものではない。タイムマシーンは残念ながらないのであるから、そこには、歴史を問う者によって再構築された過去の一面についての像があるのみである。そこにあるのは、現在を生きる者によってなされた解釈の結果としての歴史像である。したがって、歴史像の再解釈ということは、つねにありうることといわなければならない。\n（注1）どうあがいても：ここでは、どんなに頑張っても\n（注2）文字表象：文字で書いてあるもの","items":[{"no":53,"sec":"dokkai","stem":"筆者によると、歴史を研究する人はまずどうすべきか。","options":["過去は一部しか把握できないと自覚しなければならない。","過去の一面ではなく、全体を再現しようとしなければならない。","過去を生きた人たちの気持ちは理解できないと自覚しなければならない。","記憶や資料をもとに、過去を正確に再現しようとしなければならない。"],"ans":1},{"no":54,"sec":"dokkai","stem":"そうした手続きを踏むとはどうすることか。","options":["文字表象や物体の分析をして、問題を解決する。","価値のある歴史資料に多く接して、新たな問題を見つける。","人々が関心をもつ問題を理解し、それに応じた史資料を探す。","興味を抱いた問題について問いかけ、文字表象や物体を見る。"],"ans":4},{"no":55,"sec":"dokkai","stem":"歴史像について、筆者の考えに合うのはどれか。","options":["再構築を繰り返すことで明らかになる。","現在を生きる者による解釈が実態に最も近い。","様々な解釈によって実態に近づくことができる。","異なる解釈によって再構築される可能性がある。"],"ans":4}]},{"passage":"近代的な社会革命は、ひとがたまたまどのような社会の場所に生まれ落ちたかという偶然によってそのひとの人生のほとんどが決まってしまうような生き方というものを否定し、家柄とか階層とか性とか民族とかの出自によって差別されない社会を構築することをめざしてきた。言ってみれば、出自をめぐる偶然的条件を度外視して、みなが社会の同じスタートラインにつく、そして学校という場所で、生きるのに最低限必要な基礎的な知識と技能とを学ぶ、そのうえで、その後この社会において個人として何をなしとげるかでそのひとの価値と人生のかたちが決まってくるという、そういう社会をめざした。理念として言えば、出自の偶然な条件に左右されることなく、ひとは何にでもなれる、そういう自由な世界をめざしたのである。そういうなかで、子どもの愛護、婦人の政治参加、もろもろの（注）差別の撤廃などの政策に取り組んできた。\nけれども、何にでもなれるということは、あらかじめ何も決まっていないということ、決定的なものはないということである。裏を返して言えば、何にでもなれるというのは、自分がしたいことが見えないかぎり、何にもなれないということでもある。そのような意味で、自分がここにいることに理由が必要になった時代、自分が存在することの意味を自分で見いださなければならない時代にわたしたちは生きている。ひとびとが自分が「やりたい」ことをみずからに問わざるをえないのも、そうした時代のなかにあるからである。\n（注）もろもろの：いろいろな","items":[{"no":56,"sec":"dokkai","stem":"近代的な社会革命はどのような社会をめざしたか。","options":["個人の出自の違いが存在しない社会","受けた教育によって人生が決まる社会","誰でも平等な生活が送れる社会","誰にでも可能性が平等に与えられる社会"],"ans":4},{"no":57,"sec":"dokkai","stem":"自分が「やりたい」ことをみずからに問わざるをえないのは、なぜか。","options":["ひとに決められたことの中には自分の「やりたい」ことがないから","自分が「やりたい」ことでなければ、実現しても意味がないから","自分の存在価値は自分で明らかにしなければならないから","自分の存在価値は自分ができることの中から探すしかないから"],"ans":3}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"シアノバクテリアと藻類が誕生し、地球上を酸素で満たすまでには20億年以上の時間を要したのに対し、現代人が地球環境を大きく変えるようになったのは、たかだかここ100~200年のことである。光合成生物が大気環境を変えるのに費やした時間と比べると、人間が環境を変えた時間はあっという間といえる。そのため、大昔の非常にゆっくりとした大気環境の変化は、当時の生物たちには適応するのに十分な時間があったが、今の急速な環境変化には、多くの生物種が適応できずに絶滅する可能性が高いかもしれない。そのため、人間は①大きな問題を起こしているのだ、という人もいるだろう。\nところが、地球の長い歴史の中では、人類の活動よりも短時間で地球環境を大きく変え、生態系を非常に大きく攪乱した事件があった。今から6500万年前の中生代白亜紀末の大隕石の衝突である。これにより飛び散った破砕物が大気中で浮遊し（注1）、太陽光の地上への到達を妨げたといわれている。それが植物による光合成を強く抑え、また地上の寒冷化を引き起こしたと考えられている。そしてこのとき、当時優占していた（注2）恐竜をはじめ、多くの生物が絶滅することになった。ところが、これほど急激で大きな生態系の攪乱に直面しても、生き残ったものがいた。そして、その生物たちは、新たにつくられた環境に適応しながら、多様な生態系をつくってきたのである。\n②このことを考えると、生物というものはとてもタフで、打たれ強いものであることがわかる。すると、今、人類が強い力で地球環境を変えて生態系を大きく攪乱しても、人類は滅びるかもしれないが、その急激に変化する環境をうまく生き抜き、新たにつくられた環境の中で繁栄する生物種が必ず出てくるに違いない。そして、生物がそこに存在することができれば、そこには生物たちの相互関係が生まれ、食物連鎖がつくられ、きちんと機能する生態系がつくられるのである。そして、その新しい生態系をつくっている生物たちの中には、「大昔、ヒトという生物がいて、彼らは我々が住みやすい地球環境をつくってくれたとてもありがたい生物だったんだよ」と、子孫に語り継いでいるものもいるかもしれない。\nこのように考えると、生態系の善し悪しを考えるときには、誰を中心にするか、いつを基準とするのかによって評価が大きく変わることがわかる。したがって、議論をするときには、その基準を決めなければならないだろう。\n（注1）浮遊する:浮かび漂う\n（注2）優占している:ここでは、数が多い","items":[{"no":58,"sec":"dokkai","stem":"①大きな問題とはどのような問題か。","options":["特定の生物種だけが影響を受けるような環境変化を起こしていること","大きな環境変化を起こして、多くの生物種を絶滅させてしまったこと","急速な環境変化を起こして、多くの生物種を絶滅させかねないこと","影響が広範囲に及ぶような大きな環境変化を起こしたこと"],"ans":3},{"no":59,"sec":"dokkai","stem":"②このこととは何か。","options":["多くの生物が滅びる事態が起きても、耐えうる生物種がいたこと","どんな生物にも新たな環境に適応する力があったこと","生態系が乱れた結果、個々の生物がさらに強くなったこと","生態系が壊れても、すぐに元のように修復されたこと"],"ans":1},{"no":60,"sec":"dokkai","stem":"人類が滅びた場合の生態系について、筆者はどのように考えているか。","options":["環境を自ら変えることで生き残る生物種が現れる。","人類が繁栄していた以前の生態系に戻る。","新たな環境変化が起きず安定する。","新たに繁栄する生物種が現れる。"],"ans":4},{"no":61,"sec":"dokkai","stem":"生態系について、筆者の考えに合うのはどれか。","options":["人間中心の見方とは別の視点で評価することもできる。","人間以外を基準にして議論するべきである。","生態系の善し悪しは環境を基準にして考えるベきである。","生態系の評価は時代とともに変わっていくものだ。"],"ans":1}]},{"label":"Mon11","passage":"A\n優れた人は決断に迷うものです。決めるために必要な情報をたくさん持っていたり、決めた結果について多岐にわたる予測を立てたりするからです。\n「決める力」のある人とは、たくさんの情報を合理的に利用して、最善の結果を予測できる人のことです。潔くパッと決める人は決断力のある人にみえますが、軽率な判断で最悪の結果を招いたのでは決める力があるとはいえません。また、じっくり考えて決める人は慎重な人にみえますが、ただ迷っているだけでは良い結果が得られないでしょう。\n（中略）\nどうすれば「決める力」のある人になれるのでしょう。身近な仲間の意見はどれも大差がないので話半分に（注）聞いておき、専門性や価値観の違うたくさんの人の意見を集約して整理します。その上で、自分一人で最終的な決断をするのが「決める力」のある人のやり方です。\nB\n情報があふれる現代では、選択肢が多すぎてなかなか決断ができないという状況に陥りやすい。最善の結果を得ようと情報を探せば探すほどリスクの可能性を知り、迷い、検討を繰り返しているうちに決断がどんどん遅れてしまう。しかしどのような決断にも負の面は必ずある。だから時間をかけすぎるよりも、失敗を恐れず迅速に決断していく人のほうが「決める力」がある人だと言える。\nしかし、早さが必要だとはいっても、適切な判断ができなければ意味がない。早く適切な決断ができるようになるには、瞬時に自身とは違う見方を検討し、客観的な判断ができなければならない。日頃からさまざまな価値観に触れ、多角的に物事をとらえられるようになることが必要だ。\n(注)話半分に:ここでは、事実は全体の半分ぐらいだという気持ちで","items":[{"no":62,"sec":"dokkai","stem":"「決める力」のある人について、AとBはどのように述べているか。","options":["AもBも、時間を十分にかけて慎重に判断すると述べている。","AもBも、どのような場面でも失敗を恐れないと述べている。","Aは迷いすぎることなく適切に判断できると述べ、Bは素早く決断できると述べている。","Aは決断が早すぎたり遅すぎたりしないと述べ、Bはリスクを回避することができると述べている。"],"ans":3},{"no":63,"sec":"dokkai","stem":"「決める力」のある人になるために必要なことについて、AとBの認識で共通していることは何か。","options":["他人の意見に惑わされてはいけない。","複数の視点から問題を検討することが大切だ。","いつも最善の結果を得ようとするべきではない。","情報を頼りにせず、自身の意見に自信を持つ 1べきだ。"],"ans":2}]},{"label":"Mon12","passage":"なんであれ無我夢中になって時間を忘れるような体験は、誰にとっても奇跡のような時間である。そんな奇跡を可能にするものこそ、実は「独り」の時間なのである。現実世界の他者との接点が完全になくなり、日常のあれやこれやが背景に没する（注1）とき、人は自由の翼を羽ばたかせる。\nしかし、現実のもろもろ（注2）が想像カや感性を邪魔しているかぎり、そうした無限といってよい自由はやってこない。ヒマで死にそうな人にも、あの、わくわくする自由は訪れない。①あの自由を取り戻すためには、周囲の人たちとのつながりを完全に忘れてしまわなければならない。あるいは、つながりを完全に絶ってまでも、そこに没入したい（注3）世界が存在しなければならないということである。\n独りは、「ひとりぼっち」である。孤独であり、寄る辺ない（注4）状態だ。中学生のなかには――もちろん高校生や大学生のなかにも―、ひとりぼっちになるのが怖くて、電話機から離れられない人も多い。一瞬でもスマホ（注5）を手放すのが怖くて仕方がない人たちのことを聞くと、私は「かわいそうだな」と思う。彼らは人とのつながりがなくなり、ひとりぼっちの深みに沈むのが怖くてたまらないのだ。たぶん、彼ら・彼女たちは孤独の効用を知らないし、ひとりぼっちゆえの自由も知らない。孤独になるところから始まる創造的な時間の使い方もまったく知らない。だから、彼ら・彼女たちにとって、孤独はきっと闇のように暗くて深いのだ。\nそんな、②かわいそうな子どもたちをどうすれば助けてあげられるだろうか。独りを恐れてはならないと言ってあげるべきだろうか、独りになることは怖くないと言っても、きっと彼ら・彼女たちには通じない。たぶん、その恐れているものこそ最も貴い宝なのだと教えてくれる何かに出会うことが必要なのだ。狐独が闇ではなく、光であり、途方もない創造性の源泉であることを知る機会さえあればいい。多くの人々を感動させてきた文学作品や、感嘆の声を上げるしかない美術作品の数々。それらは原稿用紙に向かい、キャンバスと向き合った孤独な者たちの手から生まれたものだ。（中略）もちろん、孤独でありさえすれば③偉大な作品が生まれるわけではない。孤独は創造性にとって十分条件ではなく、必要条件なのだ。だから、いきなり深遠な思索やらオリジナルな発想やらがどうして生まれるのか、と聞かれても、答えようがない。しかしそういう傑作が生まれ落ちた素地（注6）にあるのが「独り」の状態だということは知っておくベきだろう。\n孤独に対して、あまりよくないイメージがあるなら、そのイメージを払拭し、ポジティヴな（注7）イメージに転換しておかなければならない。孤独は創造の源泉であり、夢中になれる悦ばしい時間の素地である。\n（注1）背景に没する:ここでは、意識されなくなる\n（注2）もろもろ:さまざまなこと\n（注3）没入する:熱中する\n（注4）寄る辺ない:頼るものがない\n（注5）スマホ:コンピュータの機能を持っている携帯電話。スマートフォン\n（注6）素地:もと\n（注7）ポジティヴな:肯定的な","items":[{"no":64,"sec":"dokkai","stem":"①あの自由とはどのような状態か。","options":["現実世界と想像の世界が混じり合った状態","独りの時間が十分にある状態","自由に時間が使えるような暇な状態","夢中になって時間を忘れるような状態"],"ans":4},{"no":65,"sec":"dokkai","stem":"②かわいそうな子どもたちとあるが、何がかわいそうなのか。","options":["ひとりぼっちを怖がっていること","自由を求めようとは思っていないこと","人とつながっていても自由だと思っていること","孤独になることは恐ろしいと教えられてきたこと"],"ans":1},{"no":66,"sec":"dokkai","stem":"③偉大な作品について、筆者が述べていることに合うのはどれか。","options":["孤独になれば、人と違う発想が生まれる。","孤独な状態がなければ、偉大な作品は生まれない。","孤独な者でなければ、偉大な作品に共感できない。","孤独な時間が多ければ、偉大な作品を生むことができる。"],"ans":2},{"no":67,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["創造的な時間の使い方を知るには孤独になるべきだ。","孤独は創造力を生み出すための貴い機会だ。","孤独になることで、人とのつながりのよさがわかる。","孤独のよくないイメージを消し、自由との違いを認識すべきだ。"],"ans":2}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある博物館の催し物のお知らせである。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"9月の県立歴史博物館催し物のお知らせ\nA 特別講座「古文書から青井市を知ろう」（全2回）\n　◇定員 各回50名　◇会場 2階 研修室1　◇日時 ①9月7日（土）②9月14日（土）14:00〜16:00　◇受講料 全2回1,800円　※1回のみの受講可、1回1,000円\nB 体験教室「武士の茶道」\n　◇定員 20名　◇会場 茶室　◇日時 9月6日（金）9:50〜12:00　◇参加費 500円\nC 市内建築めぐり「江戸時代の建築」\n　◇定員 20名　◇見学先 旧杉下邸、旧前岩邸など　◇日時 9月1日（日）県立歴史博物館9:30集合。12:30頃戻り、解散。　◇参加費 1,500円　◇その他 14:00より、希望者を対象に、当館で開催中の特別展「江戸末期の建築」の解説を行います（約30分）。ご希望の方は当日お申し出ください。（別途、入館チケットをご購入ください。）\n◆7月開催の特別講座再募集！\nD 特別講座「白船山遺跡発掘の歴史」（全2回）\n　◇募集人数 各回若干名　◇会場 2階 研修室1　◇日時 ①7月20日（土）②7月27日（土）14:00〜16:00　◇受講料 全2回1,800円　※1回のみの受講可、1回1,000円\n【申込方法】\nA〜C：往復はがきに住所・氏名・電話番号・希望する催し物名（複数回開催の催し物は希望回）を明記の上、下記宛先へお送りください。お申し込みが定員を超えた場合は抽選となります。締切：7月19日（金）必着\nD：電話でのみ受け付けます。ご連絡の時点で定員に達していた場合、受講をお断りすることもござい const LS_STATE = "dao11_state_v1", LS_HIST = "dao11_history_v1";
function lsGet(key, def){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e){ return def; } }

function loadState(){

    const sk = saved.state && saved.state[k];
    PARTS.forEach(p => {

      if (!sv && sk && sk.doc && !sk.goi && p === "goi") sv = sk.doc; // bản lưu cũ: Đọc&Ngữ pháp là một phần

const RESULT_ENDPOINT = "";

  if (!RESULT_ENDPOINT) return;
  const box = lsGet(LS_OUTBOX, []);

// Mỗi lần nộp đủ cả bài thì lưu 1 bản vào lịch sử (kèm đáp án đã chọn) để xem lại điểm sau.

  const dSc = STATE[k].doc ? scoreOf(partItems(k, "doc"), k) : null;
  const lSc = STATE[k].nghe ? scoreOf(partItems(k, "nghe"), k) : null;
  hist.unshift({ id: Date.now(), exam: k, label: EXAMS[k].label, at: new Date().toISOString(), answers: JSON.parse(JSON.stringify(answers[k])),
    goi: gSc && { total: gSc.total, max: gSc.max, lines: gSc.lines }, doc: dSc && { total: dSc.total, max: dSc.max, lines: dSc.lines }, nghe: lSc && { total: lSc.total, max: lSc.max, lines: lSc.lines } });
  lsSet(LS_HIST, hist);
  if (STATE[k].goi && STATE[k].doc && STATE[k].nghe) {
    const r = jlptScore(k);
    sendResult({ id: hist[0].id, name: studentName() || "(chưa nhập tên)", exam: EXAMS[k].label, at: hist[0].at, total: r.total, max: r.max, pass: r.pass,

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/&lt;u&gt;/g,"<u>").replace(/&lt;\/u&gt;/g,"</u>");

// Quy đổi điểm N1 theo bảng Dungmori: mỗi Mondai có điểm/câu riêng, mỗi phần tối đa 60, tổng 180.

const JSEC = ["Chữ Hán · Từ vựng · Ngữ pháp", "Đọc hiểu", "Nghe hiểu"];
function jlptScore(k, ans){
  ans = ans || answers[k];
  const secs = JSEC.map(n => ({ name: n, score: 0, max: 0 }));
  const byBlock = [];
  const secOf = (b => b.sec === "nghe" ? 2 : (b.sec === "dokkai" && b.id !== "mon7" ? 1 : 0));
  const cnt = [0, 0, 0];
  if (EXAMS[k].exam.equalWeight) EXAMS[k].exam.blocks.forEach(b => { cnt[secOf(b)] += (b.items || b.groups.reduce((a, g) => a.concat(g.items), [])).length; });

    const its = b.items || b.groups.reduce((a, g) => a.concat(g.items), []);
    const si = secOf(b), w = EXAMS[k].exam.equalWeight ? 60 / cnt[si] : (JW[b.id] || 0);

  if (r.low.length) why += (why ? " " : "") + "Dưới điểm liệt 19: " + r.low.map(x => x.name).join(", ") + ".";

    '<div class="sub">' + r.secs.map(x => esc(x.name) + ": " + x.score + "/" + x.max).join(" · ") + '</div>' +

    const sub = sc[p] ? '<span class="sub">Đã nộp — ' + sc[p].total + '/' + sc[p].max + ' câu đúng</span>'
      : st.submitted ? '<span class="sub">Đã nộp — chờ nộp xong các phần còn lại để xem điểm</span>'
      : st.started ? '<span class="sub">Đang làm dở — còn ' + fmt(st.remain) + '</span>' : "";
    el.innerHTML = title + sub;
  });
  let homeHtml = "";
  const scs = PARTS.map(p => sc[p]).filter(Boolean);
  if (reveal && scs.length) {
    const total = scs.reduce((a, x) => a + x.total, 0), max = scs.reduce((a, x) => a + x.max, 0);
    homeHtml = '<div class="block"><div class="score">🎉 Tổng kết cả bài: ' + total + '/' + max + ' câu đúng</div><div class="sub">' + esc(scs.map(x => x.lines).join(" · ")) + '</div></div>';
  }
  if (hasAnyProgress(k)) homeHtml += '<button class="btn" onclick="retakeExam()">🔄 Làm lại kỳ này từ đầu</button>';
  if (reveal && PARTS.every(p => STATE[k][p])) homeHtml = jlptHtml(jlptScore(k)) + homeHtml;
  document.getElementById("homeScore").innerHTML = homeHtml;
}
function changeName(){ const n = (prompt("Họ tên:", studentName()) || "").trim(); if (n) { lsSet(LS_NAME, n); renderAll(); } }
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString("vi-VN") + " " + d.toLocaleTimeString("vi-VN", {hour:"2-digit", minute:"2-digit"}); }
function renderHistory(){
  const hist = lsGet(LS_HIST, []);
  const el = document.getElementById("history");
  if (!hist.length) { el.innerHTML = ""; return; }
  el.innerHTML = '<h2>📚 Bài đã làm (' + hist.length + ')</h2>' + hist.map(h => {
    const parts = [];
    if (h.goi) parts.push("Goi: " + h.goi.total + "/" + h.goi.max);
    if (h.doc) parts.push((h.goi ? "Đọc hiểu: " : "Đọc: ") + h.doc.total + "/" + h.doc.max);
    if (h.nghe) parts.push("Nghe: " + h.nghe.total + "/" + h.nghe.max);
    const tot = (h.goi ? h.goi.total : 0) + (h.doc ? h.doc.total : 0) + (h.nghe ? h.nghe.total : 0), mx = (h.goi ? h.goi.max : 0) + (h.doc ? h.doc.max : 0) + (h.nghe ? h.nghe.max : 0);
    if (h.doc && h.nghe && EXAMS[h.exam]) { const r = jlptScore(h.exam, h.answers); parts.push(r.total + "/" + r.max + " điểm — " + (r.pass ? "ĐẬU" : "TRƯỢT")); }
    return '<div class="q"><div class="qstem"><b>' + esc(h.label) + '</b> · ' + fmtDate(h.at) + '</div><div class="sub">Tổng ' + tot + '/' + mx + ' câu đúng (' + parts.join(" · ") + ')</div>' +
      '<button class="btn" onclick="viewAttempt(' + h.id + ')">Xem lại bài</button> <button class="btn" onclick="delAttempt(' + h.id + ')">Xoá</button></div>';
  }).join("");
}
function viewAttempt(id){
  const h = lsGet(LS_HIST, []).find(x => x.id === id);
  if (!h || !EXAMS[h.exam]) return;
  const k = h.exam, cur = STATE[k];
  const inProgress = PARTS.some(p => cur[p] && cur[p].started && !cur[p].submitted);
  if (inProgress && !confirm("Kỳ này đang có phần làm dở. Xem lại bài cũ sẽ thay thế phần làm dở. Tiếp tục?")) return;
  PARTS.forEach(p => { if (cur[p]) { clearInterval(cur[p].tick); cur[p].tick = null; cur[p].started = true; cur[p].submitted = true; } });
  answers[k] = JSON.parse(JSON.stringify(h.answers));
  saveState(); chooseExam(k);
}
function delAttempt(id){
  if (!confirm("Xoá bài đã làm này khỏi lịch sử?")) return;
  lsSet(LS_HIST, lsGet(LS_HIST, []).filter(x => x.id !== id)); renderAll();
}
function retakeExam(){
  if (!confirm("Làm lại kỳ này từ đầu? (Điểm các lần đã nộp vẫn lưu trong mục Bài đã làm)")) return;
  const k = curExamKey;
  PARTS.forEach(p => { const st = STATE[k][p]; if (st) { clearInterval(st.tick); st.tick = null; st.started = false; st.submitted = false; st.remain = partMinutes(k, p) * 60; } });
  answers[k] = {}; saveState(); renderAll();
}
function hasAnyProgress(k){ return PARTS.some(p => STATE[k][p] && (STATE[k][p].started || STATE[k][p].submitted)) || Object.keys(answers[k]).length > 0; }
function renderExamPicker(){
  renderHistory();
  const nm = studentName();
  document.getElementById("whoami").innerHTML = nm ? 'Học viên: <b>' + esc(nm) + '</b> <button class="btn" onclick="changeName()">Đổi tên</button>' : '';
  document.getElementById("examCards").innerHTML = Object.keys(EXAMS).map(k => {
    const st = STATE[k];
    const parts = [];
    const reveal = allSubmitted(k);
    PARTS.forEach(p => { if (reveal && st[p] && st[p].submitted) parts.push(PART_LABEL[p].split(" (")[0] + ": " + scoreOf(partItems(k, p), k).total + "/" + partItems(k, p).length); });
    if (reveal && st.goi && st.doc && st.nghe) { const r = jlptScore(k); parts.push(r.total + "/" + r.max + " điểm — " + (r.pass ? "ĐẬU" : "TRƯỢT")); }
    if (!reveal && PARTS.some(p => st[p] && st[p].submitted)) parts.push("Đang chờ nộp xong các phần còn lại");
    return '<button class="btn card" onclick="chooseExam(\'' + k + '\')">' + esc(EXAMS[k].label) + (parts.length ? '<span class="sub">' + parts.join(" · ") + '</span>' : '') + '</button>';
  }).join("");
}
function renderAll(){
  document.getElementById("examPicker").style.display = curExamKey === null ? "" : "none";
  document.getElementById("history").style.display = curExamKey === null ? "" : "none";
  document.getElementById("landing").style.display = (curExamKey !== null && mode === null) ? "" : "none";
  document.getElementById("homeScore").innerHTML = "";
  document.getElementById("topSub").textContent = curExamKey === null ? "Chọn kỳ thi muốn luyện" : (mode === null ? (EXAMS[curExamKey].label + " · chọn phần muốn làm") : (PART_LABEL[mode] + " · " + partMinutes(curExamKey, mode) + " phút"));
  if (curExamKey === null) { renderExamPicker(); }
  else if (mode === null) { renderExamLanding(); }
  updateTimerArea();
  updateBtnArea();
  const examEl = document.getElementById("exam");
  examEl.innerHTML = (curExamKey === null || mode === null) ? "" : renderBlocksFor(curExamKey, mode);
}
function chooseExam(k){ if (!studentName()) askName(); curExamKey = k; mode = null; renderAll(); window.scrollTo(0,0); }
function chooseMode(m){
  if (STATE[curExamKey][m] === null) return;
  mode = m;
  const st = STATE[curExamKey][m];
  if (st.started && !st.submitted && !st.tick) runTick(st);
  renderAll(); window.scrollTo(0,0);
}
function goHome(){ curExamKey = null; mode = null; saveState(); renderAll(); window.scrollTo(0,0); }
window.addEventListener("beforeunload", saveState);

function startTest(){
  const st = STATE[curExamKey][mode];
  if (st.started && st.tick) return; st.started = true;
  runTick(st);
  saveState(); updateTimerArea(); updateBtnArea();
}
function runTick(st){
  clearInterval(st.tick);
  st.tick = setInterval(() => { st.remain--; if (st.remain % 5 === 0) saveState(); updateTimerArea(); if (st.remain <= 0) { clearInterval(st.tick); submitTest(); } }, 1000);
}
function confirmSubmit(){ const label = PART_LABEL[mode]; if (confirm("Nộp bài phần " + label + " bây giờ?")) submitTest(); }
function submitTest(){
  const st = STATE[curExamKey][mode];
  if (st.submitted) return; st.submitted = true; clearInterval(st.tick); st.tick = null;
  saveState(); archiveIfDone(curExamKey); renderAll(); window.scrollTo(0,0);
}

loadState();
renderAll();
flushOutbox();
</script>
