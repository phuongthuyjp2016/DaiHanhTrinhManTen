const EXAMS = {"7/2026":{"label":"Kỳ 7/2026","exam":{"total":96,"minutes":110,"listenMinutes":60,"blocks":[{"id":"mon1","title":"問題1 — 読み方","sec":"moji","instr":"____の言葉の読み方として、最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":1,"sec":"moji","stem":"相手チームの多彩な攻撃に<u>翻弄</u>された。","options":["ばんろう","ほんりょう","ほんろう","ばんりょう"],"ans":3},{"no":2,"sec":"moji","stem":"仲間が裏切ったと<u>悟った</u>主人公はその場から脱出した。","options":["さとった","させった","さぐった","うたがった"],"ans":1},{"no":3,"sec":"moji","stem":"歴史書は現代に生きる私達にも多くの<u>示唆</u>を与えてくれた。","options":["しげき","しや","しさく","しさ"],"ans":4},{"no":4,"sec":"moji","stem":"社長になってからも、彼は常に<u>謙虚</u>だ。","options":["けんりょ","げんきょ","けんきょ","げんりょ"],"ans":3},{"no":5,"sec":"moji","stem":"このクリームを塗ると、肌が<u>滑らか</u>になります。","options":["やわらか","なめらか","きよらか","なだらか"],"ans":2},{"no":6,"sec":"moji","stem":"先に本人の<u>承諾</u>を得たほうがいい。","options":["しょうだく","しょだく","しょうどく","しょどく"],"ans":1}]},{"id":"mon2","title":"問題2 — 文脈規定","sec":"moji","instr":"（　）に入れるのに最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":7,"sec":"moji","stem":"このゴムのボールは、（　）があるので、押しても元の形に戻る。","options":["迫力","効力","弾力","活力"],"ans":3},{"no":8,"sec":"moji","stem":"このダムは完成までに20年という年月を（　）。","options":["振る舞った","捧げた","尽くした","費やした"],"ans":4},{"no":9,"sec":"moji","stem":"この劇場は座席が狭くて、足を伸ばすことができず（　）だった。","options":["煩雑","窮屈","過密","濃厚"],"ans":2},{"no":10,"sec":"moji","stem":"彼のデザインは、花や木などの自然を（　）にしたものが多い。","options":["メモリー","モチーフ","ムード","ニーズ"],"ans":2},{"no":11,"sec":"moji","stem":"登山道のあちこちに登山者の注意を（　）するための看板がある。","options":["喚起","挑発","誘導","増進"],"ans":1},{"no":12,"sec":"moji","stem":"「30年の付き合いなのに相談もしてくれないなんて（　）なあ」と友人は言った。","options":["水くさい","はかない","手ぬるい","とぼしい"],"ans":1},{"no":13,"sec":"moji","stem":"予想外の質問にすぐ答えられず、（　）しまい恥ずかしかった。","options":["くるくると","じろじろと","ごしごしと","あたふたと"],"ans":4}]},{"id":"mon3","title":"問題3 — 言い換え類義","sec":"moji","instr":"＿＿＿の言葉に意味が最も近いものを 1・2・3・4 から一つ選びなさい。","items":[{"no":14,"sec":"moji","stem":"今年は「（不況で）」、ボーナスが支給されなかった。","options":["成績が悪い","売上高が低い","景気が悪くて","態度が悪い"],"ans":3},{"no":15,"sec":"moji","stem":"この記事には、うまく仕事を「（こなす）」方法が書かれている。","options":["依頼する","指導する","習得する","処理する"],"ans":4},{"no":16,"sec":"moji","stem":"私も「（倹約する）」ことにした。","options":["時間を無駄に使わない","お金を無駄に使わない","スペースを無駄に使わない","エネルギーを無駄にする"],"ans":2},{"no":17,"sec":"moji","stem":"その件については、「（断固）」抗議するつもりだ。","options":["即座に","じっくりと","きっぱりと","当然"],"ans":3},{"no":18,"sec":"moji","stem":"相手側は裁判も辞さないという「（構え）」だ。","options":["姿勢","主張","印象","決断"],"ans":1},{"no":19,"sec":"moji","stem":"期待していた試合の内容は「（あっけない）」ものだった。","options":["もったいない","ありえない","物足りない","みっともない"],"ans":3}]},{"id":"mon4","title":"問題4 — 用法","sec":"moji","instr":"次の言葉の使い方として、最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":20,"sec":"moji","stem":"次の言葉の使い方として、最もよいものを選びなさい。【納入】","options":["議会では新制度をいつ納入するかを検討している。","販売店に新商品を納入する日は、来月の10日に決まった。","この時期の子どもたちは知識を納入するのが早い。","私の家では押し入れに布団と衣類を納入している。"],"ans":2},{"no":21,"sec":"moji","stem":"次の言葉の使い方として、最もよいものを選びなさい。【格差】","options":["ユーキさんは、見た目と性格の格差が激しいので誤解されやすい。","社会人になって、学生と話すと話題の格差を感じる。","大企業と中小企業では賃金に格差があると指摘されている。","弟はマラソンで二位の選手に格差をつけて優勝した。"],"ans":3},{"no":22,"sec":"moji","stem":"次の言葉の使い方として、最もよいものを選びなさい。【引き締まる】","options":["長時間パソコンの作業をしていると、肩が引き締まる。","大谷さんは、疑うような引き締まった視線を向けてきた。","モギさんと話をしたが、退職の意思は引き締まっているようだ。","重要な仕事を任されて、気持ちが引き締まる思いがする。"],"ans":4},{"no":23,"sec":"moji","stem":"次の言葉の使い方として、最もよいものを選びなさい。【満喫する】","options":["私たちは科学の発達により、様々な恩恵を満喫している。","短期間だったが、観光をしたり名物を食べたりして、旅を満喫できた。","就職が決まったからといって、将来を満喫するのはまだ早い。","久しぶりの休暇で、疲れをいやし、心を満喫することができた。"],"ans":2},{"no":24,"sec":"moji","stem":"次の言葉の使い方として、最もよいものを選びなさい。【所定】","options":["正月は家でのんびりテレビを見るのが、私たち家族の所定の過ごし方になっている。","機械によるエラーは、どんなに点検や整備をしても所定の確率で起こるものだ。","わが社と A 社の合併は所定のことで、今から変更できるものではない。","証明書が必要な人は、所定の申込書に記入して提出してください。"],"ans":4},{"no":25,"sec":"moji","stem":"次の言葉の使い方として、最もよいものを選びなさい。【はつらつ】","options":["体育館に、若者たちのはつらつとしたあいさつの声が響く。","外は気持ちよく晴れて、空がはつらつとしている。","今朝とれたばかりの魚で作ったはつらつとした刺身を食べた。","ユーキさんに初めて会った日のことは、今でもはつらつと覚えている。"],"ans":1}]},{"id":"mon5","title":"問題5 — 文法","sec":"bunpo","instr":"次の文の（　）に入れるのに最もよいものを、1・2・3・4 から一つ選びなさい。","items":[{"no":26,"sec":"bunpo","stem":"（会社で）A「そっちの課のプロジェクト、順調そうだね。」B「いや、（　　）、そうでもなくて……。」","options":["ただ","それが","なのに","あるいは"],"ans":2},{"no":27,"sec":"bunpo","stem":"人にはいろいろアドバイスできるのに、なぜか自分のこと（　　）、どうしたらいいのかわからなくなってしまう。","options":["だけあって","からすると","にとって","となると"],"ans":4},{"no":28,"sec":"bunpo","stem":"私がこのチームの次期キャプテンにユーキさんを推薦する理由は技術力の高さ（　　）、強い精神力を持っているからだ。","options":["にかけて","をはじめ","もさることながら","とあいまって"],"ans":3},{"no":29,"sec":"bunpo","stem":"（求人広告で）採用にあたっては、書類審査と面接を行います。面接は応募者全員ではなく、書類審査を通過した方（　　）実施します。","options":["に対してのみ","に対してさえ","によってのみ","によってさえ"],"ans":1},{"no":30,"sec":"bunpo","stem":"だます（　　）、事実を隠していたのなら、だましたのと同じだ。","options":["しなかったとしても","しかなかったかというと","つもりはなかったとしても","つもりはなかったかというと"],"ans":3},{"no":31,"sec":"bunpo","stem":"今度動物園にパンダを見に行く。今まで写真やテレビでしか（　　）、実物を見るのが非常に楽しみだ。","options":["見たことがないだけで","見たことがないだけに","見たかっただけで","見たかっただけに"],"ans":2},{"no":32,"sec":"bunpo","stem":"（森）「ユーキさんって、すごく絵が上手だよね。」（杉山）「美術大学出身らしいよ。」（森）「そうなんだ。どうりで上手な（　　）。」","options":["はずだ","ようだ","ほどだ","くらいだ"],"ans":1},{"no":33,"sec":"bunpo","stem":"地道な基礎研究を軽視していては、科学技術の発展など（　　）。","options":["望むがゆえだ","望むべくもない","望むようなものだ","望まないでもない"],"ans":2},{"no":34,"sec":"bunpo","stem":"今日、友達が約束の時間に1時間も遅れてきた。5分、10分ならまだ許せるが、1時間なんて、（　　）。","options":["遅れる始末だ","遅れてはいられない","遅れるにもほどがある","遅れても不思議じゃない"],"ans":3},{"no":35,"sec":"bunpo","stem":"A「うちの課に新人が入るらしいって昨日言っちゃったけど、私の勘違いかもしれないから、（　　）？」B「うん、わかった。」","options":["聞かないでいてくれたのかな","聞かなくてもよかったんじゃない","聞かなかったらよかったかな","聞かなかったことにしてくれない"],"ans":4}]},{"id":"mon6","title":"問題6 — 並べ替え","sec":"bunpo","instr":"次の文の　★　に入る最もよいものを、1・2・3・4 から一つ選びなさい。","items":[{"no":36,"sec":"bunpo","stem":"私は犬が　＿　★　＿　＿のだが、近寄れない。","options":["分には","苦手で","平気な","離れて見ている"],"ans":1},{"no":37,"sec":"bunpo","stem":"同僚が会社を辞めるという。すでに次の仕事も決まっているそうだ。長年一緒に仕事をしてきたので、＿　＿　★　＿も状況は変わらないだろう。","options":["引き止めたところで","辞めてほしくないが","私としては","私が"],"ans":4},{"no":38,"sec":"bunpo","stem":"私が　＿　＿　★　＿子供のうちから身につけさせたいと思うからだ。","options":["しつけに厳しいのは","恥をかかないだけの","社会に出て","マナーを"],"ans":2},{"no":39,"sec":"bunpo","stem":"ドライヤーなんて＿　＿　★　＿髪がさらさらになって驚いた。","options":["どれでもいいと思って","髪を乾かせば","安いのを使っていたが","高性能のドライヤーを使ってみたら"],"ans":3},{"no":40,"sec":"bunpo","stem":"最近買った新しい　＿　＿　★　＿　ままになっている。","options":["箱から出す","ことなく","押し入れにしまい込んだ","食器は"],"ans":2}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、文章全体の趣旨を踏まえて、41から44の中に入る最もよいものを 1・2・3・4 から一つ選びなさい。","passage":"学校には、言語、数学、音楽、運動といった分野や、記憶力、創造性などに関する突出した才能を持つ子どもたちがいる。その中には、学校の授業のレベルが合わせ苦痛だったり、別の教科では学習困難を抱えていたりと、つらい思いを抱える子どもたちも多い。\n\nこうした現状 [41] 、文部科学省は支援について有識者会議を設けた。7月に発表された審議まとめには、理解のための周知や研修の促進、多様な学習の場の充実などの提言が盛り込まれた。\n2点、私見を [42] 。\n\nまず、今回の提言は、英才教育（注）を目的とするものではなく、すべての子どもの学習権を保障するという文脈で理解されるべきものである。教育基本法には「すべて国民は、ひとしく、その能力に応じた教育を受ける機会を与えられなければならない」とある。「特異な才能」を持った子どもたちが、どうしても横並び主義に [43] 学校の中でその機会を十分に得られていないのだとすれば、それを保障することは国の使命なのである。\n\n次に、今回の提言は、教育システム全体を長い目で変えていくための一つのステップとして捉えられる必要がある。「特異な才能」を持った子どもに限らず、授業についていけない子どもや不登校等を生み出してしまっている一つの大きな要因も、何でも「みんなで一緒」を過度に求める学校システムに [44] 。\n\n皆で同じことを、同じペースで、ではなく、仲間や先生との協働に支えられながら、子どもたちが自分のペースで、自分にあったやり方で学びを進められること。それを通じて、すべての子どもの学習権を保障すること。そのようなシステムの転換をこそ、私たちは実現させていく必要があるのだ。\n\n（注）英才教育：優れた才能を持つ者に対する特別な教育","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["はともかく","を受けて","にあたっても","に反して"],"ans":2},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["述べると思う","述べるようにする","述べていただく","述べたい"],"ans":4},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["なりきれない","なりようがない","ならざるを得ない","なるわけにはいかない"],"ans":3},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["あるからだ","あるだけだ","あるほど","ある点だ"],"ans":4}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"我々はビジネスの中に主観や直観（注）を持ち込むことを良しとしません。ただ、全く状況が分からない中で延々と情報収集をしていては今のビジネスのスピードに対応できません。そこで頼りになるのが、直観であり、主観です。ただし、これだけではダメです。直観的に判断したら、必ず論理的な検証をして妥当性を確認してみる必要があります。あるいは主観的に判断したら、必ず、さまざまな人の意見を聞いて、客観性を持たせる必要があります。\n（注）直観：ここでは、直感と同じ","items":[{"no":45,"sec":"dokkai","stem":"ビジネスにおける主観や直観について、筆者はどのように考えているか。","options":["多くの人の意見を聞いたうえで、取り入れるべきだ。","論理的な検証をして判断する時間がない場合は、頼ることも必要だ。","速さとともに妥当性や客観性が求められるので、頼ってはいけない。","速さに対応するには必要だが、判断の妥当性や客観性も検討すべきだ。"],"ans":4}]},{"passage":"赤ちゃんは周囲の人を自分にひきつけるための反応を生得的に（注）備えて生まれてくる。ひよこの緊急時に発するビーという高い発声に対して、親鳥は敏感に反応する。人間でも赤ちゃんの独特の泣き声は、親を動かす。また大人からみて微笑と見える赤ちゃんの顔面筋肉の反応は、周りの大人にかわいいと思わせるためのものであると考えられている。これらの事実から、表情などの動きは本来心とは関係なく、環境に適応するための反応であり、心（感情）に先立つ動きであると考えてもよいであろう。\n（注）生得的に：生まれつき","items":[{"no":46,"sec":"dokkai","stem":"赤ちゃんの表情などの動きについて、筆者はどのように述べているか。","options":["心の動きから生じ、周りの人の反応に合わせて変化することはない。","感情から生じるものではなく、生きていくための本能的な反応である。","緊急時に生じるもので、環境に働きかけるための反応である。","人をひきつけるための本能的な動きだが、感情が伴うこともある。"],"ans":2}]},{"passage":"集団や仲間に依存したり迎合した（注）りせず、ひとりになり、自分の心の声を聴いて、自分の生き方を見つけていく。孤独力とは、そういう能力です。\nそして、この孤独力の逆説的なところは、その基礎が自分の今のままの姿を受けめてくれるような他者との関係の中でこそ養われていくところにあります。自分を今のまま、そのままの姿で認めてくれる他者との関係の中で、はじめて人は自分の心の声に本当に素直になれる。自分の心の声を聴いて、孤独力を育んでいくのです。\n（注）迎合する：自分の考えを他人に合わせる","items":[{"no":47,"sec":"dokkai","stem":"逆説的なところとあるが、どのような点が逆説的なのか。","options":["自分ひとりで生きていく力なのに、他者の存在がなければ育てられない点","自分の心の声を捉える力なのに、他者の心の声も理解しなければならない点","他者に依存しない力なのに、他者の助けがなければ養えない点","ありのままの自分と向き合う力なのに、他者への依存も必要である点"],"ans":1}]},{"passage":"小説をほめるときに、「情景がありありと浮かぶ」という言い方がされることがある。逆に「情景が思い浮かばない」というのが、けなし言葉として使われることもある。\nしかし、小説が、文字を読んで映像を思い浮かべながら読むものだとしたら、最初から映像のほうがずっといい。変換しなければならないだけ、小説は面倒ということになる。小説離れの理由のひとつは、「映像を思い浮かべながら読むものだ」という思い込みにあるようにも思う。","items":[{"no":48,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["情景が思い浮かばない小説は、映像より価値が低い。","小説は、情景が思い浮かぶかどうかで評価するものだ。","小説は、必ずしも情景を思い浮かべながら読むものではない。","小説離れの理由は、情景が思い浮かばない小説が増えたからだ。"],"ans":3}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"料理家電は確かに料理の手助けになります。時間の短縮、そして複雑な手順の段取り。つまり面倒で複雑な過程を器械が肩代わりしてくれます。確かに便利な道具です。少なくとも、そのことを意図して開発された器械のはずです。わたしも、日常的にその手助けの恩恵に浴しています。でも、よく考えてみると、調理家電の前でわたしたちがやることはいくつかのボタンを押すだけです。調理家電の前ではじつは人間が器械の働きの手助けをしているだけではないのか。器械があらかじめ決めたプログラムに従って、プログラム上の分岐点で、どちら（あるいはどれ）を選択するという補助的な行為が求められているのではないのか。ふと、そのように感じたのです。彼らは人間の労働を助けてくれているのではなくて、手抜きを助長しただけではないのかとも思えてきます。もっとはっきりといえば、わたしたちは家電製品のお手伝いをしている存在に成り下がっているかに思われるのです。\nいま、人工知能（AI）が人間の仕事を奪うのではないか、もしそうだとして、真っ先に奪われる仕事は何かなど、人工知能を巡る議論があちこちで沸騰しています。人工知能がもっと普及してくれれば人間は労働から解放されるのではないか──そんな議論もあります。しかし、調理家電の動きを見ていると、料理に関する限りでは人工知能は人間にはボタンを押すという手助けだけを残して、創造的で楽しい部分は人工知能がもってゆくのではないかと懸念します。いや、もうそうなりかけている気がするのです。","items":[{"no":49,"sec":"dokkai","stem":"そのように感じたとあるが、どのように感じたか。","options":["調理家電が人間の手助けをするはずなのに、役割が逆になっている。","調理家電は人間の手助けにはなるが、まだ機能が十分ではない。","調理家電のボタンを押すだけのことでも、人間には面倒になっている。","調理家電の機能が高度になりすぎて、かえって使いこなせない。"],"ans":1},{"no":50,"sec":"dokkai","stem":"人工知能をもつ調理家電の利用によって、人間は今後どうなると筆者は考えているか。","options":["料理に楽しさを求めることがなくなる。","料理の楽しさが感じられなくなる。","料理の技術がさらに低下する。","創造的な料理が徐々に作れなくなる。"],"ans":2}]},{"passage":"『ぴあ』（注1）の占いのコーナーを喜んで読んでいた頃、ぼくはもちろん因果性（注2）を理解していたし、経験科学（注3）の原理もわかっていた。それでも「占い」を読んで喜んでいるぼくがいたということは、人間が、いかに自分の中の整合性（注4）にこだわらない、いい加減な存在であるかを示している。\n同時に、経験からして、「占い」は、それがあるメカニズムに基づいているかどうか、「当たる」か「当たらない」かということが本質ではないのだと思う。それは、いわば、脳の認識の回路に働きかける、「プラシーボ」のようなものなのだろう。\nこれは薬だと言って、砂糖のかたまりをあげると効く。この「プラシーボ効果」は、脳活動計測によって、脳の自己治癒能力が引き出されるものとわかっている。むろん、限界もある。しかし、限界の範囲内では効くのだ。占いの効用も、つまりはそのようなものだろう。\nプラシーボ効果において、重要なのは文脈である。星座占いは、実はどの星座を読んでも同程度に「当たる」。しかし、自分の星座の項目が、まさに自分宛てに書かれたものであると信じることによって、何らかの作用が生の現場にもたらされるのだ。\nたとえば、「今週は素敵な出会いがあります」と言われて、その気になれば、仕事や遊びで会う人、街で通りすがり（注5）の人に対する心の開かれ方が変わってくるかもしれない。もともと何の根拠もないものを、信じることで効果が生まれる。","items":[{"no":51,"sec":"dokkai","stem":"人間について、筆者が自分の経験から言おうとしていることは何か。","options":["占いに矛盾があると理解しつつも、興味が科学的根拠に勝っている。","科学的な考えと行動が矛盾していることに気づいていない。","科学的根拠がないと理解しているのに、そのことを気にしていない。","科学的根拠のないものを信じることはありがちである。"],"ans":3},{"no":52,"sec":"dokkai","stem":"星座占いの効用について、筆者はどのように考えているか。","options":["占いに科学的根拠があると信じれば、積極的に行動できる。","占いが当たると信じて行動すれば、幸運が訪れる。","占い通りにならなくても楽しむ気持ちがあれば、人間関係が広がる。","占い通りのことが自分に起きると信じれば、前向きになれる。"],"ans":4}]},{"passage":"他者との競争に勝ったり、自分で立てた目標を達成することは非常に嬉しいことである。しかし、日常生活でそれを経験する機会は、私たちを満足させるほどには多くない。もっとたくさん勝ちたい私たちのために、ゲームは「先にここに駒を進めた人が勝ちです」「白い線を踏まずに横断歩道を渡れたら勝ちだ」といった定義を持ち込んで、明瞭に勝つ機会を提供してくれるのである。ただし、勝ち負けがつけば必ずゲームが成立するわけではなく、絶対に勝てるゲームや勝ち目（注）のまったくないいゲームはプレイされない。勝った先の利益がない純粋なゲームでは、勝つこと自体に価値が必要であり、初めから勝敗が確定しているゲームにはそれが足りないのである。\nこの「勝ちに価値づけをする」手段がルールの設定である。様々な縛りによって、勝つためにとれる手段を限定し、同時に勝つまでの道筋を複雑にする。それによって「そのままでは低い勝ち目を、そのゲームに応じた自分の適切な行動で高めることができる」状況が生まれ、その中で自身の能力と努力、相手との駆け引き、運の良さなどを駆使して得た勝ちを嬉しいと感じる。そして勝敗とは別に、勝ち目を増やす過程すなわちゲームプレイも面白いと感じるのである。\n（注）勝ち目：勝つ可能性","items":[{"no":53,"sec":"dokkai","stem":"筆者によると、ゲームが成立するために不可欠なことは何か。","options":["すぐに勝敗が決まらないこと","誰もが結果に満足できること","勝てば多くの利益が得られること","勝つことそのものに価値があること"],"ans":4},{"no":54,"sec":"dokkai","stem":"筆者によると、ゲームにルールがあることでどうなるか。","options":["プレイすること自体が面白くなり、勝敗を意識しなくなる。","ゲームに勝つために、ルールを相手よりもよく理解しようとする。","ゲームが複雑になり、自分の努力などで勝つ可能性が高まり楽しくなる。","駆け引きや運に頼らず、ルールの中で能力を駆使するのが面白くなる。"],"ans":3}]},{"passage":"「なぜそうなるんだ」、「どうしてこんなことになってしまうのか」。そんなふうな「どうしようもなさ」を抱えた自分のもとに、それらのため息や憤りに寄り添い、慰めを与えてくれる心地よい言葉が投げかけられる。そんなとき、つい、「ちょっと待て、これはうわべだけの解決を教える言葉にすぎないのではないか。わたしは、立ち止まって考え続けるべきなのではないか」、そう自分に告げる良心の呼び声を封印（注1）し、ため息や怒りをなかったことにしてくれる便利な正解に飛び乗ることを選択をしてしまう。自分たちのなかに潜むそんな傾向に抗い（注2）、逆らうことの難しさを否定することのできる人間はいないのではないだろうか。\n（中略）\nわたしたちの生活を取り巻く数々の「わかりやすい言葉」たちとその魅力に抵抗し、正解を知りたがる人びとのただなかで（注3）「わからない。何かが違っているんじゃないか」とつぶやいてみること。それが、哲学の目をもつ人間に特有の態度であるとすれば、お手軽な答えに飛びついてよしとするのではなく、あえて問いの下にとどまることを教える哲学の習性には、それ自体として一つの積極的な機能を見出すことができるのではないだろうか。すなわち、みんなが問いを放棄し、問題を終わらせよう、片づいたことにしてしまおうとする大きな流れのなかで、「ここには問題があります」とあえて提案してみせることに哲学の仕事の一つが見出されるのならば、そこには、「みずから積極的に問いの場を構築する」という意味において、一つの積極的な働きを見出すことが可能なのではないか。\n（注1）封印する：ここでは、抑える\n（注2）抗う：抵抗する\n（注3）ただなかで：まっただなかで","items":[{"no":55,"sec":"dokkai","stem":"筆者によると、人びとはなぜ心地よい言葉を受け入れてしまうのか。","options":["考え続けても正解は得られないとわかっているから。","考え続けることの苦しさから逃れたいから。","問題が解決できるという安心感があるから。","慰めの言葉は大切にすべきだと思うから。"],"ans":2},{"no":56,"sec":"dokkai","stem":"哲学の機能として、筆者が挙げているのはどれか。","options":["みんなが問い続けることを諦めようとした問題を示し続ける。","みんなが問おうとしていなかった問題を提起する。","問いに対する正解をめぐって議論することの価値を示す。","問いとは考え続ければ正解が出るものだと説き続ける。"],"ans":1}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"子どもの言いなりになってしまう親は、子どもの要求を何でも聞いてあげることが、子どもの意見を尊重することだと思っているところがあります。子どもが習い事をしたいと言ったら何でも習わせる、子どもが行きたいというならどこでも連れて行ってあげる、といったように。\n確かに、習い事などは子どもが自分から何かをやりたいと言っているのですから、子どもの意見を尊重しているという面もあります。子どもの行きたいところに行くのも、子どもの好奇心を満たしてあげたい、いろいろなところに行っていろいろな体験をしてほしいという親心もわかります。そして実際にプラス面も多々あります。\nただ、その子どもの「要求」と「意見」は違います。小学生くらいのお子さんの場合は、あまりよく考えないでなんとなく「やってみたい」「習いたい」「ここに行きたい」「これ欲しい」と言うことはよくあります。これは脳が発達段階にあるため、仕方がないことなのです。問題は、子どもの要求に対して親がどう対応するかです。子どもの要求をなんでもかんでも聞いてあげるのは、意見の尊重ではなく単なる甘やかしです。\n子どもを甘やかしてしまう親は、子ども可愛さのあまりつい子どもの言いなりになったり、忙しさを理由にして子どもにかける手間を省くために甘やかしてしまうという場合が多いのです。\nどちらにしても、一時的な甘やかしではないため、その甘やかしはエスカレートしていくことになりかねず、将来的には親子双方にとって禍根（注1）を残すことになります。親にも限度がありますから、子どもの要求にすべて応えることはできません。すると、あるところで破綻します。\n子どもの脳には、「私が言ったことを親は全部聞いてくれる」という回路が形成されてしまっています。そうなった段階で自分の要求が叶わないとなると、子どもは「もう私（僕）のことが可愛くないの？」「私（僕）のことが嫌いになったの？」と親を責めます。親は親で「望むことは何でも叶えてあげたのに、どうしてこんなことになったんだろう」と嘆く。\nどうしてこんなことになったのかといえば、親子での「対話」による「交渉」や「妥協」が何もなかったからです。\nそうならないためには、子どもとよく「対話」をして、その「要求」に対して「意見」をプラスするように親が導いてあげることが必要です。「○○を習いたい」という要求に対して、「どうしてそれを習いたいのか」「そうすることで何が起きるのか」ということを子どもとよく話し合った上で、子ども自身が自分の意見を修正できるようになればベストです。\n（中略）\n子どもの要求に対しては、ただやみくもに（注2）ダメと言うのでもなく、かといって要求をすべて呑む（注3）のでもなく、子どもとの「対話」を通じてお互いにとっての「妥協点」を探るための愛情のこもった「交渉」の場にすることが、子どもの知的発達にとってプラスになるのではないかと思います。\n（注1）禍根：ここでは、災いの種\n（注2）やみくもに：むやみに\n（注3）呑む：ここでは、受け入れる","items":[{"no":57,"sec":"dokkai","stem":"①子どもの要求について、親はどうすればいいか。","options":["子どもの気持ちを反映したものなので、できるだけ尊重したほうがいい。","明確な理由もなく言っているものもあり、すべてには応えなくてもいい。","脳の発達段階によって変わるものであり、対応の仕方を変えてもいい。","好奇心の表れではあるが、対応は慎重にしたほうがいい。"],"ans":2},{"no":58,"sec":"dokkai","stem":"②破綻しますとあるが、破綻すると子どもはどうなるか。","options":["どうして自分の要求を叶えてくれないのかと親を問い詰めるようになる。","自分に対する愛情がなくなったと考え、親を責めるようになる。","自分の要求のすべてを叶えてもらえないとわかり、親に期待しなくなる。","自分の要求は聞いてもらえないと諦め、親と「対話」しなくなる。"],"ans":2},{"no":59,"sec":"dokkai","stem":"筆者によると、何かを要求する子どもに対して、親はどのように対応するのがよいか。","options":["「対話」をしながら子どもの意見を確認し、要求に応じられるようにする。","「対話」を根気よく繰り返し、子どもが自ら要求を改めるように促す。","「対話」を通して、互いに合意可能なものになるように話を進める。","「対話」をする中で、互いに譲歩ができるようにする。"],"ans":3}]},{"label":"Mon11","passage":"A\nやりたい仕事のために必死に努力している時に、行き詰まりを感じることがある。そういう時にまずすべきことは、なぜそのような状態になっているのかを考えることだ。必要な知識やスキルが足りていないのかもしれないし、これまでの努力のしかたが間違っていたのかもしれない。原因を把握し、自分にできることはすべてやってみる。もちろん、最善を尽くしたとしても成功できない可能性もある。しかし、努力を通して身につけたことこそが自分の強みになるのだ。その努力は、いつか別の道に進むことになっても生きてくるだろう。\n行き詰まりを感じた時は、潔く別の分野に方向転換すればいいという考えもあるが、そう簡単に努力するのをやめてしまったらよい結果には結びつかない。まずは一つの分野で努力し続けることが重要だ。\nB\n人は必死になって努力をしていると、どうしても一つのことしか目に入らなくなりがちです。それはそれで間違っていませんし、努力とはそういうものだと思います。\nしかし、どうしてもそれが実らなかったり、行き詰まってこれから先何をしていいのかわからなくなったりした時、一度頭を柔軟にして別の分野へ方向転換してみるのも一つの方法です。（中略）\nもちろん、方向転換して成功するためには、その別の分野に手を出す以前にどれだけ努力していたかが大切です。そこでつくった蓄積がなければ、別の分野へ移ったところでそれが武器になることはありません。単純にまた一からやり直しになるだけで、余計時間がかかり、混迷していくことになるでしょう。でももし本当に努力してその分野のことをしっかりと身につけていれば、別の分野への挑戦を果たした時、それがとても大きな武器となることがあるのです。","items":[{"no":60,"sec":"dokkai","stem":"行き詰まった時の対処のしかたについて、AとBはどのように述べているか。","options":["AもBも、原因を把握したうえで、異なるやり方で取り組んでみるべきだと述べている。","AもBも、一つの分野にこだわらず、新しいことに挑戦してもいいと述べている。","Aは自分に対処できることをすべてやってみたほうがいいと述べ、Bはこれまでに身につけたことを生かせる分野を探すべきだと述べている。","Aはうまくいかない原因を追究するべきだと述べ、Bは思い切ってほかの分野にチャレンジしてもいいと述べている。"],"ans":4},{"no":61,"sec":"dokkai","stem":"AとBの認識で共通していることは何か。","options":["必死に努力している時は、広い視野で物事を見ることが難しい。","必死に努力して身につけたことは、状況が変わっても役に立つ。","必死に努力し続ければ、困難があっても乗り越えられる。","必死に努力し続けなければ、よい結果につながらない。"],"ans":2}]},{"label":"Mon12","passage":"女性であれ男性であれ、人は自然体でいる時には自分についてなどおよそ意識していないにもかかわらず、自我のスイッチが入ると、たちまち自分を意識化して、感覚的にも理論的にも自己肯定しようとします。人に自意識がある以上いたしかたない（注1）のかもしれませんが、仕事で自我が芽を出したなと気づいた時に、できるだけ早くその芽を刈り取るべきです。（中略）\n自我が出すぎていないかどうか自覚するためには、折ある（注2）ごとに自分を疑ってみなければなりません。何かよい案を思いついても、その直後に、これは第三者にもちゃんと伝わるのだろうか、と自分を疑ってみる。自画自賛に陥ってはいないだろうか、と。なぜなら、どんな仕事でも本来、こちらの自我をあちらの他者に押し付ける所行（注3）ではなく、多くの人々と共鳴するところを冷静に感じ極める作業だからです。もちろん対象によってその程度は異なるし、自分の想いの丈（注4）をぶつけていい場合もあります。\n例えば自己資金で限定十個の作品を販売するのなら、自我を抑える必要などないでしょう。自分の想いを存分にぶつけた作品に共鳴してくれる人が、この広い世の中に十人くらいなら存在するはずだからです。たとえまったく売れなくても、その責任は自分でとればいい。あるいはその人の作家性を期待されて仕事の依頼を受けたのなら、思いっきり自分がやりたいだけやればいい。ただし、予算や制作期間の問題などで関係者に迷惑を掛けることは、むろん許されませんが。\nでは、道路標識のデザインはどうか。この仕事を任されたデザイナーの自我はどのくらい必要でしょうか。公共のサインである道路標識は、言葉も価値観も視力も、文化的背景すらも異なる人たちがほんの一瞬見て判断するグラフィックデザインであり、場合によっては命にかかわるものなので、できる限りの普遍性が求められます。つまり、道路標識をデザインする人の「自我」は、どこからも求められてはいないのです。同様のことは、老若男女誰にでも使用される可能性がある嗜好品などについても言えるし、使用する素材の資源の問題やコスト、使用済みになった後の処理にまで考えを及ぼすとすれば、自分勝手が許される余地などどこにもないのではないでしょうか。\nこのように、対象によってなすべき内容が異なるのだから、与えられた仕事がどんな環境にあるかを客観的に把握しなければなりません。それでも、無意識にも自我はあるとすでに記したように、自分を意識していなくても自我は出てきてしまうものなので、自分のしていることを客観的に見るのはたやすくありませんが、常に相手や周囲の環境を優先し、それらを客観的に理解する習慣がつくと、厄介な「自我」の呪縛（注5）から解放され、楽になり、なすべきことが浮かび上がってくる。それは対象から自ずと表れ出てきたもので、主体は自分ではなく、飽くまで相手なのです。\n（注1）いたしかたない：仕方がない\n（注2）折ある：機会がある\n（注3）所行：行為\n（注4）想いの丈：ここでは、想いのすべて\n（注5）呪縛：縛り","items":[{"no":62,"sec":"dokkai","stem":"自分を疑ってみなければなりませんとあるが、なぜか。","options":["仕事では、自己中心的にならずに他者と共感できる点を見極める必要があるから。","仕事では、自信過剰にならずに自分の能力を正しく評価することが重要だから。","仕事では、冷静に主張し自分の案に共感してもらわなければならないから。","仕事では、どんな場合でも他者に自分の案を押し付けてはいけないから。"],"ans":1},{"no":63,"sec":"dokkai","stem":"デザインの仕事における自我について、筆者の考えに合うのはどれか。","options":["普遍性が求められる場合より自我が求められる場合のほうが一般的だ。","作家性が求められる場合でも、自我より普遍性が優先される。","何をデザインするかによって自我が求められる程度は異なる。","デザインの対象にかかわらず、自我を出しすぎてはいけない。"],"ans":3},{"no":64,"sec":"dokkai","stem":"仕事に対する姿勢について、筆者はどのように考えているか。","options":["自分自身がなすべきことを見つけ出すことが必要だ。","自分自身より相手や周囲の意見を優先するべきだ。","無意識に自分を縛ってきたものを取り除くべきだ。","相手や環境を客観的に理解することが必要だ。"],"ans":4}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある市のフリーマーケットの出店者募集の案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"野木市あおぞらフリーマーケット 出店者募集\nフリーマーケットで、手作りの作品や不要になった日用品などを売ってみませんか。\n\n＜開催要領＞\n・日時：10月24日（土）・25日（日）10時〜16時\n・①手作りマーケット：会場 春島公園／販売できる物 手作りの作品（飲食物は不可）／募集 20組／スペース 1.5m×1.5m\n・②リサイクルマーケット：会場 ひがし大通り／販売できる物 家庭で不要になった日用品、本、衣類など／募集 30組／スペース 2m×2m\n・出店料（1日のみ）1,000円\n・出店料（2日間）同じマーケットに出店する場合は1,600円、異なるマーケットに出店する場合は2,000円\n※学生応援割引：野木市在住または在学の学生で①に出店する方には割引があります。①への出店が1日のみの場合は300円、2日の場合は500円割引します。\n＜出店資格＞18歳以上の方\n＜応募方法＞「出店申込書」（ホームページからダウンロード、または野木市役所で入手可）に記入し、8月31日（月）必着で郵送またはご持参ください。\n＜出店場所抽選会および出店料の支払い＞9月12日（土）13時〜 市役所ホール\n・各会場内の出店場所の抽選を行います。その際に出店料もお支払いいただきます。\n・参加できない場合は、実行委員が代理で抽選を行います。出店当日案内所内で9時半までに出店場所をご確認のうえ、出店料をお支払いください。\n＜出店当日＞\n・①の会場は朝8時、②の会場は8時半から入ることができます。遅くとも9時45分までには入場してください。10時に販売開始となります。\n＜その他＞\n・机、シートなどにご持参ください。\n・雨天で中止する場合は、前日17時までにホームページにお知らせを掲載します。","items":[{"no":65,"sec":"dokkai","stem":"野木市に住む大学生のラマルさんは、フリーマーケットで くりしたいんです。」","options":["らしいことである","らしいところがある","みたいなことである","みたいなところがある"],"ans":4},{"no":35,"sec":"bunpo","stem":"もう１ヶ月近く雨が降っていない。晴れの日が続くのは嬉しいが、水不足などの問題を考えると（　　）。","options":["喜んだだけにすぎない","喜んでばかりもいられない","喜んでしまうところだった","喜んでいないではないか"],"ans":2}]},{"id":"mon6","title":"問題6 — 並べ替え","sec":"bunpo","instr":"次の文の　★　に入る最もよいものを、1・2・3・4 から一つ選びなさい。","items":[{"no":36,"sec":"bunpo","stem":"(会社で） 高橋「さっき、また課長と西山さんがもめてたね」 .自分の主張を譲らない西山さん ＿　★　＿　＿も課長だ。","options":["なら","も","西山さん","課長"],"ans":3},{"no":37,"sec":"bunpo","stem":"トラブルが＿　★　＿　＿トラブルだ。","options":["起きないように","起きる時に","起きてしまう","どんなに気をつけていても"],"ans":4},{"no":38,"sec":"bunpo","stem":"俳優の古川たかしが今回の作品で＿ ＿ ★ ＿といえるだろう。","options":["自然な演技は","長年会社勤めをしてきた","彼ならでは","見せた"],"ans":2},{"no":39,"sec":"bunpo","stem":"普段は無口な息子だが、昨日は校内のマラソン大会で入賞した＿ ＿ ★ ＿なり、楽しそうに話してくれた。","options":["のか","ことが","家に帰ってくる","よほどうれしかった"],"ans":1},{"no":40,"sec":"bunpo","stem":"友人が突然大学を辞めると言い出した。将来のことを＿ ＿ ★ ＿思えないので、考え直すように説得している。","options":["応援したいが","決断ならば","よく考えたうえでの","そうは"],"ans":1}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、文章全体の趣旨を踏まえて、41から44の中に入る最もよいものを 1・2・3・4 から一つ選びなさい。","passage":"ネコの目の前に指先を出すと、必ずクンクンにおいをかぎますね。じつは、これはネコ同士のあいさつに由来するしぐさです。\n\n私たち人間はおじぎをしたり握手をしてあいさつをしますが、ネコたちにとっては、鼻と鼻を近づけてお互いのにおいをかぐのがあいさつです。ネコの口のまわりには臭腺といって、特別なにおいを出す器官があります。そのにおいはネコによって異なるため、鼻を近づけると相手がどこの誰か、そして敵か味方かなどの情報を知ることができるのです。\n\nこのようにネコがにおいで相手を確認するのは、目があまり [41] 。ネコは肉食のハンターですから抜群の視力をもっていそうですが、人間にたとえると0.3程度の近眼だとされています。つまりかなり近づかないと相手の顔を確認できないということ。\n\nだから、人間の指先を見ても、ネコは鼻を近づけられたと勘違いして同じ反応を [42] 。指先だとわかっていても、習慣的に「とりあえず、あいさつだけはしておこう」と考えるのでしょう。おきまりのクンクンが始まります。\n\nこの習慣を [43] 、初対面のネコとも仲よくできます。いくら可愛いネコでも、いきなりなでたり抱っこしようとすれば嫌がります。それは、あなたが何者かわからないからです。 [44] まずは指先をネコの鼻に近づけてみます。ひととおり相手のにおいをかいだ後でネコが逃げなければ、それはあなたに好意をもったという証拠ですから、そっと触れても嫌がらないはずです。","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["よくないせいだとします","よくないことにもあります","よくないときだといえます","よくないからでもあります"],"ans":4},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["示すのです","示しそうです","示してばかります","示したものです"],"ans":1},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["利用させずに","利用すれば","利用させることで","利用するまでもなく"],"ans":2},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["あるいは","ちなみに","そこで","すなわち"],"ans":3}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"自動車メーカーが、製造・販売した自動車に不具合が見つかったとして、無償で修理をするリコールを行うことはよくあります。\nリスクゼロ思考からすると、そもそも不具合のある車を世に出すべきではないということになります。事前に不具合が出ることがわかっているなら、そんな車はつくらないはずです。不具合が絶対に出ない車しかつくってはいけないというのなら、メーカーは何もつくれなくなります。\nそれよりも、不具合が出たらリコールして、次につくる車からは同じ不具合が出ないように改善していくのが理論的な発想です。","items":[{"no":45,"sec":"dokkai","stem":"自動車メーカーについて、筆者が最も言いたいことは何か。","options":["不具合をどう改善するかでメーカーの評価が決まる。","不具合が起こりにくい車を世に出せるように努力すべきだ。","不具合があったら改善して、それを繰り返さないことが大切だ。","不具合によるリコールを想定したうえで、車を世に出すべきだ。"],"ans":3}]},{"passage":"以下は、母語の音声の習得について日本語を例として書かれた文章である。\n「赤ちゃんのときはどんな音でも区別できるのに、成長するとできなくなる」といわれるのは、決して聞き分け能力の劣化ではなく、日本語の音体系に対応して「区別しないものを見いだし、同じと見なす技を学ぶ」という変化なのだ。こと音の知覚に関しては「習得は喪失だ」といわれるゆえんである。諸々の外国語で、日本語では区別しない音の聞き分けに苦労した経験があるならば、それは自分が日本語習得にいかに完璧に成功したかを示しているのだ、と思ってよい。\n（注１）こと：ここでは、特に\n（注２）ゆえん：理由\n（注３）諸々の：多くの","items":[{"no":46,"sec":"dokkai","stem":"「習得は喪失だ」とはどういうことか。","options":["母語で区別されない音は区別できなくなること","母語で区別しなければならない音を区別できなくなること","母語でも外国語でも、特定の音が知覚できなくなること","外国語の習得によって、母語の聞き分け能力が衰えること"],"ans":1}]},{"passage":"ワサビは生育環境を選ぶ植物であるため、系統維持が非常に難しく、栽培者がいなくなれば、維持されてきたワサビも一緒に消失してしまう。山に行けば野生が自生しているから大丈夫、という考えは間違いである。野生個体は栽培ほど根茎も太らず、辛くない。長い時間をかけてできた品種は、一度失われてしまったら、容易には復元できないのだ。だからこそ、植物資源として大切に守る必要があるといえる。\n（注）系統維持：ここでは、種の特徴が受け継がれていくこと","items":[{"no":47,"sec":"dokkai","stem":"筆者によると、栽培されたワサビを守る必要があるのはなぜか。","options":["環境の悪化でワサビが自生できなくなったから","ワサビの品種改良には長い時間がかかるから","栽培されたワサビは育てやすく品質がよいから","野生のワサビの数を増やすには時間がかかるから"],"ans":2}]},{"passage":"よいことは考量できないことはないが、ある人が、ある人物が高まった場合に、事後的その人「知性」な人物だったと判定される。属する集団全体の知的パフォーマンスが、彼らの振る舞いによって、他人の発言やふるまいによって、彼の（個人が私的に所有する知識量や演算能力にかかわらず、ある個人が知性的であるかどうかは、その人の知性は個人の属性でなく、集団的にしか発動しない。\n（注１）属性：性質\n（注２）考量：判断する","items":[{"no":48,"sec":"dokkai","stem":"筆者によると、「知性的」な人物とはどのような人か。","options":["集団内で学びながら、自身の知的パフォーマンスが高められた人","集団内で、ほかの人より知的パフォーマンスが優れていた人","集団全体のことを考えながら、発言やふるまいができた人","集団全体の知的パフォーマンスの向上に貢献した人"],"ans":4}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"火を使って調理をするようになってから、人類はそれ以前よりも多くの種類の食べ物を食べられるようになり、しかもそれを効率よく消化して多くのエネルギーを得ることができるようになった。そして、余ったエネルギーを使って脳を発達させて、優れた知的能力を獲得することになるのである。人類の歯、顎、胃、小腸、大腸などはチンパンジーなどに比べればはるかに小さいが、それは火を使って調理した柔らかい食物に適応して進化した結果であると考えてよい。\n大きな消化器官を使って長時間の消化、吸収活動を行うことは多くのエネルギーを消費するから、消化器官が小さものが生物学的に有利である。\n（中略）\n火で調理することには、人類の脳を発達させただけではなく、人類の社会性を発達させる効果もあった。火を使って調理することが人類の偉大な発明の一つとされているのは、食べ物を変質させただけではなく、社会を変容させたからである。火を使って生の食べ物を調理することを覚えたときから人類の社会が始まったと言ってよい。人々は焚火の周りに集まり、一緒に食事をするようになったので、そこが人々の結びつきの場となった。調理とは、単に食べ物を煮炊きする方法ではなく、決まった時間に集団で食事をすることを中心にして社会を形成する方法でもあったのである。\n（注）チンパンジー：猿の一種","items":[{"no":49,"sec":"dokkai","stem":"筆者によると、火で調理することで人類の脳が発達したのはなぜか。","options":["食べ物から得た多くのエネルギーを使うことで、多様な活動が可能になったから","多くの食べ物が消化できるようになり、脳の活動が活発になったから","多様な食べ物が効率的に消化でき、脳の発達に必要なエネルギーが得られたから","多様な物が食べられるようになり、効率的な食べ方を考えるようになったから"],"ans":3},{"no":50,"sec":"dokkai","stem":"筆者は、火を使った調理は人類にどのような変化をもたらしたと述べているのか。","options":["ほかの人々と食事をともにすることが一般化し、他者とつながる社会が生まれた。","ほかの人々との行動が個人の行動よりも優先される社会が形成された。","同じ物を食べることになり、ほかの人々とのつながりがより深くなった。","規則正しく行動するようになり、集団に社会性が生まれた。"],"ans":1}]},{"passage":"以下は、キャリア教育の専門家が書いた文章である。\n自分にはどんな仕事が向いていて、どんな仕事であれば、やりがいや誇りをもって働けるのか。――すでに仕事をしている大人だって、こんな問いに答えるのは、そう容易なことではないし、実感をもって答えられるようになるには、何年もの就業経験が必要なはずである。\nましてや、いまだ働いたこともない子どもや若者の場合、キャリア教育で「魔法」でもかけられないかぎり、こんな問いに答えることができなくて当然である。その意味で、「やりたいこと」や「就きたい職業」を選び、決めるということは、一種の「賭け」なのである。\nもちろん、「賭け」がいけないわけではない。仕事の世界は、いったんは思いきって飛び込んでみないかぎり、それを理解することはできない。その意味で、最後の最後の階段での賭けは必要なのだが、しかし、そのまえにやっておくべきことはある。（中略）その職業や仕事の世界について、産業構造のなかでの位置や業界の動静、職場や労働環境について、現実的認識をもっていなくてはいけない。\nさらに言えば、自分が、なぜその職業・仕事を選ぶのかについて、みずからの「根っこ」にあるものについても見つめさせ、深めさせたい（キャリア研究の世界では、この「根っこ」のことを「キャリアアンカー」といったりもする）。「根っこ」の部分には、その仕事に就くことを通じて、こんなふうに社会に役立ちたいとか、こんな社会を実現したいとか、自分のこんな特性を生かしたいといった、思いや価値観が存在するはずである。","items":[{"no":51,"sec":"dokkai","stem":"一種の「賭け」とあるが、どういうことか。","options":["自分の適性を教えてもらう機会がなかったのに、仕事を選ばなければならない。","自分の適性が分からないまま、仕事を選ばなければならない。","仕事に就かなければ自分の適性が確かめられないのに、仕事を選ばなければならない。","仕事の内容が分からないまま、仕事を選ばなければならない。"],"ans":2},{"no":52,"sec":"dokkai","stem":"キャリア教育のあり方について、筆者の考えに合うのはどれか。","options":["自分の特性を生かせる仕事や実現したい社会について、深く考えさせるべきだ。","自分の特性を把握させ、社会に貢献できる仕事を選ばせることが重要だ。","どうしたら自分が社会に役立てるのか、現実的認識をもたせるべきだ。","仕事や社会について学んだうえで、自分を見つめさせることが重要だ。"],"ans":4}]},{"passage":"2018年に、米国のデューク大学のエレナ・ケイヴスたちは、カリブ海の水深1～35mのサンゴ礁に棲息するクリーナーシュリンプ（アンキロメネス・ベデルソニ）がブダイやエダイ、ハタなどの魚の体や口を掃除するときの行動を調べた。すると魚とクリーナーシュリンプが、それぞれ相手にすごいと思える信号を出していることが明らかになった。\nまず、ハタなどの魚が、白く長い触角を振るクリーナーシュリンプが棲む場所を訪ねて来て、魚が体表を暗くする。（中略）\n体表の明暗の変化をクリーナーシュリンプが認識すると、自らの長い触角を前後左右に大きく振る。クリーナーシュリンプの一種アンキロメネス・ベデルソニの視力は、相手の魚の色や輪郭ははっきりと認識できるが、魚の体表の明暗の変化は十分に認識できることが明らかになっている。いっぽうでハタなどの魚の眼は、クリーナーシュリンプの体色や輪郭だけでなく、30～40cmほど前方にいる全長2cmほどの小さなクリーナーシュリンプの細長い触角の動きを明確に識別できる。クリーナーシュリンプの触角に白く長いものが多いことは、触角の動きを薄暗い海底でも明確に魚に伝えるためのものと思われる。\nその触角の動きを見て、ハタなどの魚は、クリーナーシュリンプが皮膚や口の中をきれいにしたり傷口を癒やしたりすることを了解したと知るのである。こうして両者が合意すればクリーナーシュリンプは、ハタなどの魚に食べられずに掃除を行うことが可能になる。\n（注1）棲息する：住む\n（注2）クリーナーシュリンプ：えびの一種\n（注3）触角：頭の先にある感覚器官","items":[{"no":53,"sec":"dokkai","stem":"クリーナーシュリンプの特徴のひとつとして、筆者が述べているものはどれか。","options":["魚の体や口を掃除する意思を表すため、体表の明暗を変化させる。","魚の体表の色や輪郭によって、掃除を待つ魚かどうかを識別できる。","掃除を待つ魚の体表の明暗の変化を認識できる視力を持つ。","掃除を待つ魚の大きさや形を認識するための触角を持つ。"],"ans":3},{"no":54,"sec":"dokkai","stem":"両者が合意すればとあるが、合意したといえるのはどの時点か。","options":["魚が体表を暗くしたのをクリーナーシュリンプが見たとき","魚が30～40cmの距離に近づいたのをクリーナーシュリンプが見たとき","クリーナーシュリンプが触角を白く変化させたのを魚が見たとき","クリーナーシュリンプが触角を大きく振ったのを魚が見たとき"],"ans":4}]},{"passage":"自分で自分の書いた日記を読み返し、そこに描かれている「私」の姿にとまどいや自己嫌悪を感じた経験はないだろうか。\n描かれている「私」はたしかに自分であるはずなのだけれども、まるで別人のようにも感じられる。いつも赤の他人ならよいのだろうが、一見異なる人物が実はほかならぬこの自分自身でもある、という二重感覚がわれわれをとまどわせ、羞恥や嫌悪の引き金になるのである。\nいや、こうした言い方はあまり正確ではないかもしれない。たとえば写真で過去の自分の姿を見た時、われわれが感じるのは羞恥や嫌悪よりも、むしろ「こんな自分もいたのだ」というおかしみや懐かしさである。画像が外面的、形態的な客観性を保持しているのに対し、日記は言葉で書かれているために、本来外にさらされることのないはずの「内面」を露呈してしまっている。そのためにわれわれは勝手な「内面」づくりにいそしんでいた、まさにその行為にたたまれなさを感じるのだ。\n日記に登場する「私」は実にさまざまだ。友人と喧嘩したときの記述は自分が都合よく正当化されてしまっているかもしれないし、失恋したときの記述はこの世の悲劇を一身に背負ったヒーロー、あるいはヒロインになってしまっていることだろう。その時々の要請に従ってフィクショナルに仮構された「内面」が、今、読み返している「私」と同一であることを強いられるがゆえに、われわれはいわく言いがたい羞恥や嫌悪を感じてしまうのである。\n（注1）赤の他人：全くの他人\n（注2）羞恥：恥ずかしさ\n（注3）露呈する：ここでは、あからさまにする\n（注4）いそしむ：励む\n（注5）フィクショナルに仮構された：ここでは、事実とは異なる脳内の\n（注6）いわく言いがたい：ここでは、簡単には説明できない","items":[{"no":55,"sec":"dokkai","stem":"筆者によると、写真におかしみや懐かしさを感じるのはなぜか。","options":["当時の自分の「内面」が表れているように見えるから","当時の自分の姿に、現在の自分の外面的特徴が見られるから","写っているのは、客観的に見た自分の姿だから","写っているのは、撮られることを意識した自分の姿だから"],"ans":3},{"no":56,"sec":"dokkai","stem":"筆者によると、日記を読み返したときに羞恥や嫌悪を感じるのはなぜか。","options":["日記の中の自分は、今の自分とは異なり虚構だったと思い知らされるから","日記の中の自分は、今の自分にほかならないと認識せざるを得なくなるから","今の自分が忘れていた「内面」の弱さをいや応なしに自覚させられるから","今の自分は、日記に書かれた自分から成長していないことを突きつけられるから"],"ans":1}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"完璧に記憶でき、忘れない脳があったらいいと思う方もいるでしょう。しかし、記憶は不完全になるように、あたかも設定されているかのようです。それどころか、都合よく記憶同士を合成したり、書き換えたりすることも行われます。場合によっては、自分の昔の恋人との記憶と、現在の配偶者との記憶が混在してしまう……というような事態も生じたりしてしまうわけですが。\nかといって、完璧に記憶できる人が仮にいたとしたら、一体どうなるでしょうか。嫌な思い出を忘れることもできず、周囲に合わせるための都合のよい記憶の書き換えもできず、かなりつらい人生を送ることになるでしょう。\n記憶が徐々に消えていく、あるいは書き換わる仕組みが存在するのは、より良く生きていくためには自然で、当たり前のことだと言えます。\n例えば、体験した危険な出来事を学習し、同様の事象を回避するための安全装置として記憶の仕組みが発達してきたのだとすれば、一定期間その危機がやって来なければ、その案件の重みづけを変え、優先順位を低く見直す仕組みが必要になります。それよりも、高頻度かつ致命的な影響を与え得る危険の方を優先的に回避するべきで、なかなか起こらないことに記憶のリソースを割いていると、かえって重要なことに対応できず、危険な状態になってしまいます。また、過去の失敗だけでなく、成功体験にとらわれやすくなるために、前例のないことには新しい挑戦をしにくくなります。\nしたがって、人間の能力の一部に過ぎない記憶力をことさら重要視する現代の教育や受験制度は、せっかく最適化されてきたはずの人類の生存戦略をかえってゆがめてしまっている可能性があるのではないかと思います。テストでは高得点を取るために記憶力が高い人が有利になるのは確かですが、その結果をそのまま優秀であるかどうかのランク付けとして使うのはいかがなものかと思います。\nというのも、テクノロジーの発達によって、不完全な人間の記憶力はどんどん補完されるようになってきており、実際にその仕組みは社会でも利用され始めているからです。文字をパソコンやスマートフォンで打つようであれば、漢字の書き方を忘れても大きな問題にはなりませんし、そもそも人間の漢字記憶力は、パソコンやスマートフォンには絶対に勝てません。ならば、使用頻度がそれほど高くない漢字を覚えるより、素直に電子機器の恩恵にあずかった方がよさそうです。\nこのような機器の性能はこれからさらに高まっていくわけですから、優秀な人を見分ける基準として記憶力という尺度を使うのは、多くの人が同じように感じていると思いますが、すでに時代にそぐわなくなってきているのかもしれません。","items":[{"no":57,"sec":"dokkai","stem":"記憶力が不完全であることについて、筆者はどう考えている。","options":["人間は完璧ではないので、当たり前だ。","良い思い出を増やせるので重要だ。","周囲に合わせて生きていくために不可欠だ。","よりよく生きていくために必要だ。"],"ans":4},{"no":58,"sec":"dokkai","stem":"その案件の重みづけを変え、優先順位を低く見直すのは何のためか。","options":["過去の体験の記憶を書き換えるため","危険な出来事に対する恐れをなくすため","起こる可能性の高い重大な危険に備えるため","人生に影響を与える新しい挑戦をしやすくするため"],"ans":3},{"no":59,"sec":"dokkai","stem":"現代の教育や試験制度について、筆者はどう述べている。","options":["いくら技術が発達しても、技術で人間の記憶力の優劣を測るには限界がある。","技術で記憶力が補える時代に記憶力で人の優秀さを判断するのは問題である。","技術発達に応じて、時代にあった尺度で記憶力を測る必要がある。","技術の恩恵を受け入れるようになり、人間には記憶力以外の力が求められる。"],"ans":2}]},{"label":"Mon11","passage":"A\n日々の家事を頑張りすぎて疲れてしまっている人が多いという。情報番組や雑誌で「整った快適な住まい」や「健康のための手作りの食事」などが頻繁に取り上げられるので、知らないうちに自分の基準が必要以上に高くなり、多くの時間や労力を費やしてしまっているのではないか。他人の基準ではなく自分が何を大切にしたいかを考え、そうではないことは積極的に手を抜いていくことが、ゆとりのある、自分らしい生き方につながるだろう。\nこういう人たちは手を抜くのは悪いことだと思うかもしれない。しかし「毎日しなければならないか」「どのレベルまでやらなければならないか」といったことは、本来自分で決めるものだ。正解はないはずなのに、いつのまにか世の中の高い基準に縛られてはいないだろうか。\nB\n生活の中で、何を大切にし、何をそぎ落としていくかは人それぞれに違います。周りの人にとっては無駄に思われても、自分にとってそれが大切なものであれば、それはそぎ落とす必要はありません。\nただ、あまりにも抱えているものが多いという人もいます。これは絶対にやらなければならない――生真面目な人ほどそう思い込んでしまうものです。\n（中略）\nあまり自分を追い詰めないで、時々は手を抜いてみましょう。手を抜いたことで何らかの支障が出たなら、そのときにまた従来通りに戻せばいい。手を抜いても何も変わらないのであれば、それはやらなくてもいいものと考えるわけです。\n手を抜くという行為は悪いことだと思われがちですが、そうではありません。すべてのことを完璧にするのは無理なことです。大切なことは、手を抜いていいものといけないものを仕分けすることだと思います。\n（注）そぎ落とす：ここでは、削る","items":[{"no":60,"sec":"dokkai","stem":"生活の中で手を抜くことについて、AとBはどのように述べているか。","options":["Aは手を抜くことは悪いことではないと述べ、Bは手が抜けるものを増やしたほうがいいと述べている。","Aは手を抜けるものを探し出したほうがいいと述べ、Bは完璧にできなくても、手は抜かないほうがいいと述べている。","Aは大切でないことは手を抜いたほうがいいと述べ、Bは手を抜くものと抜かないものを明確にしておけばいいと述べている。","Aはできるだけ手を抜くべきではないと述べ、Bはいったん手を抜いてみて、うまくいかなければ元のやり方に戻せばいいと述べている。"],"ans":3},{"no":61,"sec":"dokkai","stem":"AとBの認識で共通していることは何か。","options":["家事に多くの時間や労力を費やすのは無駄だ。","生活において何を重視するかは自分次第だ。","自分の基準にこだわりすぎるのはよくない。","自分のしたいことだけをするほうが有意義だ。"],"ans":2}]},{"label":"Mon12","passage":"生活者に、○○と言えば、自社の商品、という形で自社商品を第一想起させるには、商品は広告の中心に置かれていなければならない。しかしいつの間にか、商品を中心に置くということが広告をする上でないがしろにされてきている。どの企業からも似たような商品しか出てこなくなり、商品のコモディティ化が進んできてしまったため、商品の差別化を、イメージだけでなんとか乗り切ろうとしている。テレビCMでもウェブ動画でも、商品の存在は最後の最後まで消し去られ、ちょっとおもしろい、ちょっと楽しい、ちょっと感動するような話が繰り広げられ、最後のほんの一瞬に商品が紹介されて終わる広告だ。これらはたいてい、最後に登場する商品が仮に他社の商品でもなんとなく成立してしまう。広告はおもしろくてちょっと話題になるかもしれないが、話題の中心は広告であり、商品は忘れ去られている。なんの商品の広告だったかも覚えられていない。\nこの様な、イメージによって差別化を図る最近の形として挙げられるのが、この数年、世界の広告賞でも取り上げられている「ソーシャルグッド」と呼ばれる種類の広告だろう。社会的な問題、たとえば国家対立や貧困、ジェンダー問題といった世界の誰もが抱えている、もしくは理解できる問題を提起し、決してその問題を根本的に解決するわけではないが、生活者に考えるきっかけを与えたり、はっと気づかせたりする広告だ。「作品」として素晴らしいものばかりで、多くの気づきを与えてくれる。ただしこれらの広告により、どこまで生活者の態度変容を引き起こすことができたのかは疑問である。\n確かに素晴らしい気づきを与えてくれて、この様なメッセージを発信する商品は良いブランドだと感じる。ただし「良いブランド」止まりであり、これだけでは自分の生活を良くするのに必要な存在にはなれない。かつ、この様な尊いメッセージを発信するばかりに、かえって近寄り難い存在になることもある。\n（中略）\n大切なのは広告で社会奉仕をすることでも、良いイメージを与えることでもなく、商品を生活者にとって必要な存在にすることである。商品を生活上役に立つ存在だと認識してもらい、買うに値する理由を明確にすることだ。商品は、この世で必要だと思ってくれる人がいるから存在することができる。だからこそ明確な購買理由を提案していくのだ。\n（注1）想起する：思い起こす\n（注2）コモディティ化：一般化","items":[{"no":62,"sec":"dokkai","stem":"ないがしろにされてきているとあるが、なぜか。","options":["商品のイメージに関心が持たれるようになったから","商品ではなくイメージでしか違いを出せなくなったから","商品を最後に紹介するほうが強く印象づけられるから","商品を強く訴えることが良いイメージを与えなくなったから"],"ans":2},{"no":63,"sec":"dokkai","stem":"「ソーシャルグッド」と呼ばれる種類の広告について、筆者はどのように述べているか。","options":["商品に関心を持たせることはできるが、商品の価値が過大評価されかねない。","社会的な問題の解決につながるが、商品の良さを伝えることはできない。","社会的な問題の提起が目的であり、商品の宣伝効果を期待するものではない。","社会的な問題への関心を持たせられるが、商品が実際に必要だと感じられにくい。"],"ans":4},{"no":64,"sec":"dokkai","stem":"広告について、筆者はどのように考えているか。","options":["商品が実生活において価値があることを示すべきだ。","商品が社会にどのように役に立つかを示さなければならない。","商品の購入を促すだけのものであってはいけない。","商品を購入する際になくてはならないものにするべきだ。"],"ans":1}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある市のフリーマーケットの出店者募集の案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"宅配クリーニング「ピース」 ご利用案内\nインターネットで注文して、バッグに衣類を詰めて送るだけ。日本全国どこからでもご利用いただけます。\n\n＜ご利用の流れ＞\n①ホームページの注文用フォームからご注文ください（初回は会員登録が必要です）。\n②ご注文後、発送用バッグをお送りします。ご自宅にある段ボールや袋を使っていただいても構いません。衣類を詰め、指定の宅配会社に集荷を依頼し、ご発送ください。\n③クリーニング済みの衣類を宅配でご自宅にお届けいたします。\n\n＜会員種別＞\n特別会 s":["現状について","便利で快適な暮らしと引きかえに","講演を聞いて","限りある大切な資源が失われつつある"],"ans":4}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、文章全体の趣旨を踏まえて、41から44の中に入る最もよいものを 1・2・3・4 から一つ選びなさい。","passage":"以下は、元アナウンサーがコミュニケーションのあり方について書いた文章である。\n\n元アナウンサーなのでよく「失敗しないコミュニケーション術を教えてください」ときかれます。\n失敗しないコミュニケーションとはなんでしょう。ニュースキャスターのように滑らかに喋れるようになること？ひな壇トークの真似事（注1）が上手になること？私はどちらも違うと思います。\n\nそもそも、コミュニケーションの目的はなんでしょうか。誰からも嫌われないこと？注目されること？ほめられること？賢そうに見せること？相手を思い通りに動かすこと？なるほど、どれも就活の面接や仕事のプレゼンでは役に立ちそうですね。でも、それ [41] 人との関わりではありません。\n\n私は、今でも人と関わることが苦手です。もっと人の気持ちをわかるようになりたいと悔いることばかりです。でも、みんな脳みそが違うからどうしたってわからないのです。それなりに考えて言った言葉に対して予期せぬ反応が返ってくることも珍しくありません。迂闊なミスもあります。相手の心のコンディションにもよります。人とのやりとりは、しょっちゅう [42] 。\n\n相手の反応が予測と違った時は、関係を変化させる好機でもあります。ずれの修正の過程で以前より親しくなることも。誤解を [43] 長い話し合いが必要になるでしょう。それにちゃんと取り組むのはなかなか胆力がいります。このめんどくさいやりとりこそが、人との関わりの醍醐味です。摩擦を回避するために「失敗しない会話」をマスターしようとするのは、むしろコミュニケーションからの [44] 。\n\nそつなく（注2）話す人が増えるよりも、めんどくさくても時間がかかっても、なんとかして伝えられないかと悩む人、つまり諦めが悪く懲りない人が増える方が、世の中は寛容で豊かになるでしょう。失敗万歳です。\n\n（注1）ひな壇トークの真似事：テレビに出るタレントのように、テンポよく話すこと\n（注2）そつなく：要領よく","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["(資料に欠落あり — xem chú thích)","なら","すらも","だけが"],"ans":4},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["失敗するに越したことはありません","失敗するわけにはいきません","失敗するものなのです","失敗するほどです"],"ans":3},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["解くためには","解かなければ","解いたうえで","解いたからこそ"],"ans":1},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["逃避だと思うでしょう","逃避でしょう","逃避だと思いがちです","逃避であるかのようです"],"ans":2}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"社会というのは抽象的な概念だ。だから、社会を見せてみろといわれても、見せることはできない。テレビでニュース映像を見ていても社会を見たことにはならない。では、社会はどうしたら目に見えるか。それが街である。街の中で人と人がどう具体的に関係し合っているかを見せるしか、社会は見せようがない。人と人の具体的な関係こそが社会だからだ。物をつくる人がいて、運ぶ人がいて、売る人がいて、買う人がいる。そうした人々の無数の行為の連関として社会は存在する。街は、その諸行為の連関を具体的に見せてくれる場なのだ。\n（注）連関：ここでは、つながり","items":[{"no":45,"sec":"dokkai","stem":"社会について、筆者はどのように考えているか。","options":["街の人々の個々の行為を理解することで、社会の仕組みが把握できる。","街の人々の多様性に着目することで、社会の複雑さに気づける。","街の人々の関係を見ることで、社会の姿が捉えられる。","街の経済活動に参加することで、社会のつながりが見えてくる。"],"ans":3}]},{"passage":"病気は、しばしば「鵺」にたとえられます。「鵺」は、頭は猿、胴は狸、尾は蛇、手足は虎という奇怪な物の怪で、からだの一部だけを見てもその本態を捉えることはできません。実は「病気」もこの「鵺」によく似ていて、私たちに多彩な症状を見せますが、その症状を生み出している、病気の「本体」を捉えることは容易ではありません。私たち医師は、病気というさまざまな「鵺」を、症状を手がかりにして引きずり出さなければならないのです。\n（注）物の怪：ここでは、想像上の生き物","items":[{"no":46,"sec":"dokkai","stem":"筆者によると、診断のときに医師はどうするべきか。","options":["あらゆる症状を見て、病気を特定するべきだ。","からだ全体を見て、目に見えない症状を探るべきだ。","多様な症状を見て、複数の病気の影響を疑うべきだ。","特徴的な症状から、根本的な原因を見つけ出すべきだ。"],"ans":1}]},{"passage":"特許とは、ある企業が開発した新製品を、別な企業がまねして生産して利益をあげることを一定期間防止する制度である。新製品の開発には通常多額の資金が必要なので、新製品を一定期間独占的に販売して開発資金の回収を認める仕組みになっている。こうした制度がなければ、企業はリスクのある新製品開発に躊躇してしまい、社会の発展が阻害されてしまう。特許には、企業同士の公正な開発競争を促す目的があるのだ。","items":[{"no":47,"sec":"dokkai","stem":"筆者によると、特許制度による企業の利点は何か。","options":["一定期間にいろいろな新製品を販売することができる。","新製品の開発に必要な資金を抑えることができる。","新製品の開発に安心して取り組むことができる。","ほかの企業との厳しい開発競争に勝つことができる。"],"ans":3}]},{"passage":"日常世界にもじつはさまざまな問題が隠れている、とこのような仕方で「問い」を発し、あたりまえの根拠を吟味する経験を積み重ねると、一見すると透明に見えるがゆえに、ふだんは意識しない日々の営みの細部にまで十分な意識を払います。そこで自分があたりまえに受け入れていたことを見つけ出し、それは本当にあたりまえなのかと疑おうとするのです。知を愛し求める人は、自らの無知に人一倍、敏感であるがゆえに、感知できるようになります。","items":[{"no":48,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["自らの無知に気づいたら、当然だと思っていることを疑うべきだ。","ふだん意識しないことに意識を払えば、日々の問題解決につながる。","日常の多様な問題を吟味し問いを発し続ければ、人生が豊かになる。","無意識に受け入れていたことを疑うことで、見えなかった問題が見えてくる。"],"ans":4}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"リーダーと呼ばれる立場にある者は、専門性をつねに高めていく努力を怠ってはならないのだが、以前なら、専門書を読むとか、より高い知識を持つ人に訊ねるとか、あるいは海外の最先端の情報を翻訳するなどすれば、ある程度は事足りたように思う。いわゆる「受け売り」であっても、それなりにカバーできたのだ。\nしかし、これだけ情報化が進むと、その程度の「知識」は、得ようとすれば誰もが得ることができる。誰もが知り得ていることを話しても意味はない。相手の行動を変えるきっかけにはなり得ない。つまり、もはや「受け売り」の専門性は通用しないということだ。誰もが知り得る知識を、より深めたものでなければ「専門性」にはならないのである。\nそうした専門性を身につけるためには、自分自身がほかの人間が知り得ないことを見聞したとか、あるいは実際にそうした領域に足を踏み入れたとかして、獲得したものでなければ、共感は呼びにくくなるのではなかろうか。そういう専門性が、これからは求められるのではないかと私は思うのだ。\n（中略）\nつまり、専門性にはなんらかの裏付けが必要になる、リアリティを感じさせることが重要になるということである。\n言葉を変えれば、「知っている」だけでは専門性にはならないということだ。「わかっていなければならないということである。「知った」ことを、それまでの経験なども付け加えながら自分のなかで自分の言葉として置き換え、「わかる」に変換させなければ、専門性を高めたことにはならないのだ。","items":[{"no":49,"sec":"dokkai","stem":"「受け売り」の専門性について、筆者はどのように述べているか。","options":["情報化が進み、誰もが専門家のようになって必要なくなった。","情報や知識を誰もが簡単に得られる時代になり、意味がなくなった。","以前なら受け入れられたが、今では誰も関心を持たなくなった。","より新しい知識や情報が求められるようになり、役に立たなくなった。"],"ans":2},{"no":50,"sec":"dokkai","stem":"筆者によると、リーダーに求められることは何か。","options":["今持っている専門的な知識や情報に満足せず、さらに知ろうとすること","専門的な知識や情報に自身の経験などを加えて、専門性を高めていくこと","より高い知識と最先端の情報を獲得して、専門性をさらに高めていくこと","共感を得るために、専門的なことをわかりやすく伝えられるようにすること"],"ans":2}]},{"passage":"人はなにも考えないということはできません。考えていないようでも、いろんな記憶や印象や思いや感情がゴチャマゼになって決して筋道立ってなどいないでしょうが、なにかを考えてはいるのです。\n（中略）\nそれを誰かに伝えなければいけないときは、私たちは、それを本の頁や原稿用紙のマス目に沿って絞り出すように、なんとかきれいに整えて「出力」していきます。そうでなければ、ほかの誰かは、あなたの考えを知ることも読むこともできないからです。\nそうすることで、頭のなかが整理されたり、自分で思ってもいなかったような発想が浮かんでくることもあるでしょう。それこそが、書くことの恵みです。だから、ときどき私たちは、そうして出力されたものが、最初から頭のなかにあったかのように勘違いをしてしまいます。でも、当然のことながら、頭のなかが最初からそうなっていたわけではありません。逆に、書いたり読んだり反芻したりすることで、渾然一体としていた思いや感情や印象や考えの矛盾の「かたまり」のような豊かさが選別され、角を落とされ、成形されてしまうことも当然あります。これはある意味、とても惜しいことです。\nなぜなら、そういう腑分けされていない「かたまり」のような状態も、立派な「思考」だからです。そして、創造的な飛躍やひらめき、天から降ってきたようなアイデアというのは、こうした「かたまり」の思考がふつふつと化学反応のようなことを起こして、自分でもわからないまま、その「すきま」からひょいと飛び出してきたものなのです。","items":[{"no":51,"sec":"dokkai","stem":"筆者によると、書くことの利点は何か。","options":["記憶や感情が整理され、論理的に説明できるようになること","深く考えるようになり、自分の考えがより明確になり得ること。","整えて書こうとすることで、人より優れた発想が得られること","まとまりのない思いや感情が整理され、新しい発想につながり得ること。"],"ans":4},{"no":52,"sec":"dokkai","stem":"とても惜しいことですとあるが、なぜか。","options":["創造的なアイデアには思考の矛盾が不可欠だから。","整理されていない状態にも大切な思考があるから。","常に同じようなアイデアしか生み出せなくなるから。","思いや感情からしか創造的な思考は生まれないから。"],"ans":2}]},{"passage":"打ち合わせは参加するすべての人で議論をし、ひとつの結論を導き出していく作業である。その裏を返せば、意見が採用されていない人のほうが大勢いるのである。こうした場合、その場では納得しているものの、周囲からの扱われ方次第ではストレスが溜まっていくことになるであろう。\n「それならば、私はいなくてもいいじゃないですか」\n当然ながら、この先この人からはポジティブな発言は得られないであろう。\nメイン・アイデアを考えた人がすべての権限を握り始めたときは、特に注意が必要だ。最初に考えた人がその案件に責任を持つことは当然であるが、それと同時にチームのモチベーションへの責任も持つことになると心得なければならない。そのために、本筋でないことは譲るクセをつけてみてはいかがだろうか。\nでは何が本筋で、何が本筋でないのか。それを客観的に計る基準は「正しいか、正しくないか」「好きか嫌いか」に判断することができる。本筋は「正しいか正しくないか」で判断され、本筋でないものは「好きか嫌いか」で判断される。つまり、好きか嫌いかという好みに関しては、個人的な一存で切り捨てるのではなく、さまざまな意見を積極的に受け入れるべきであると考える。そのことでチームのひとりひとりが自分の存在意義を感じ、前向きなアイデアを出してくれるようになるだろう。","items":[{"no":53,"sec":"dokkai","stem":"自分の意見が採用されない人について、筆者はどのように述べているか。","options":["結論に納得できない場合でも、みんなの意見に従うようになるだろう。","どんな打ち合わせにも今後参加したくなくなるだろう。","周囲の人の意見に対して、否定的な意見しか言わなくなるだろう。","周囲の対応によっては、前向きな意見を言わなくなるだろう。"],"ans":4},{"no":54,"sec":"dokkai","stem":"モチベーションへの責任も持つとあるが、どうすればいいか。","options":["主観的判断にゆだねられるものはチームのひとりひとりの意見を尊重する。","客観的な判断が必要とされる場合は、チーム全体で議論する。","本筋かどうかにかかわらず、チームのひとりひとりに責任を持たせる。","本筋のものは、さまざまな意見に耳を傾けチーム全体で決定する。"],"ans":1}]},{"passage":"ガラス張りの床のある部屋で、赤ちゃんに自由にハイハイや寝返りなどをさせる実験があります。床は一部が深く掘ってありますが、その上をガラスで覆ってあるので安全です。赤ちゃんは最初は平気でガラス床の上をハイハイして通過します。ところが、ハイハイの経験が積み重なってくると、ガラス床の上には這って出なくなります。転んだり落ちたりした経験があるからです。\nこれは重要なことです。なぜなら、ヒヨコでは異なる結果が出るからです。卵から孵ったばかりのヒヨコを同じ床に置くと、初めからガラス床の上に出て行きません。野生の世界では、ヒヨコは一度でもどこかに落ちたら助からない可能性が高い。だから落ちないように、生まれたときから「高いところは怖い」ことが脳回路にインストールされているのです。\n一方、ヒトの場合は生まれてから自分で移動できるようになることで、経験を通じて、つまり痛い思いを通じて、「高さ」に恐怖を感じるようになります。（中略）\n見方を変えると、ヒヨコは本能で決まってしまっている範囲内でしか生きられません。でも、ヒトは後天的に学ぶために高い柔軟性を備えています。さらに一歩進めば、「怖いけれど、崖を下りてみよう」などと判断することもできますから、冒険の範囲が広がります。生まれた直後の判断能力は、動物たちのほうが高いかもしれませんが、ヒトの「初期能力の低さ」は、のちに「柔軟性の高さ」へと化ける、いわば先行投資。そのリターンは絶大で、十分に元がとれます。","items":[{"no":55,"sec":"dokkai","stem":"初めからガラス床の上に出て行きませんとあるが、なぜか。","options":["ガラスは危険なものだと本能で察知できるから。","致命的な危険を避ける本能が備わっているから。","未経験のことに対する恐怖心が強いから。","高いところに興味を持たないから。"],"ans":2},{"no":56,"sec":"dokkai","stem":"ヒトの能力について、筆者はどのように述べているか。","options":["痛さや恐怖を感じた経験をしなければ、柔軟な判断能力は身につかない。","幼少期に多くの経験を積むことで、柔軟に判断できるようになる。","生まれたときの判断能力が低いからこそ、柔軟に経験から学ぶことができる。","生まれたときの判断能力が低ければ低いほど、判断能力が大きく伸びる。"],"ans":3}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"美術館は芸術作品を楽しむ場所だ。しかし、予備知識なしに無心で楽しめるエンターテインメントと違って、アートを楽しむには特別な知識がいると①思っている人は多い。私はそうした考え方は大きな誤解だと思っている。\nしかし、そう考える人の気持ちがわからないではない。なぜなら、この国では子どもの頃からアートに親しむ環境が整っていないからだ。美術館では子どもはうるさくて邪魔な存在だとされている。美術館に来る資格があるのは分別のある大人だけだ――そう思われたら、敷居が高くなるのは仕方がない。しかし、その逆に、子どもの頃から美術館に何度も足を運び、なじみのある場所になっていれば、芸術作品との距離はもっと近づくだろう。\nでは、子どもたちに美術館を楽しんでもらうことはどうすればいいのだろうか。\n（中略）\n私がよくやるのは②「宝探し」だ。もともとはシカゴ美術館にいたときに同僚が実践しているのを見て面白いと思い、日本の美術館に来てからも実践している。\n「宝探し」のルールは簡単だ。子どもたちに美術館で販売されているポストカードを渡して、展示されているその作品を探すように言う。すると、彼らは絵を一生懸命見て、ポストカードに印刷されている絵を探す。\n作品を見つけ出したら、そのポストカードに感想を書いてもらう。どんなことを書いてもいい。感想が思い浮かばなければ、その絵の中に何が描かれているかということでいい。「見た」ものを書いてもらうだけでいいのだ。とにかく、作品は「見る」きっかけを作ることが目的である。\n大人はともすれば絵を頭で理解しようとする。この絵は印象派の巨匠○○が描いた絵だからすばらしい、というように、知識と実物を一致させるだけで満足してしまう。しかし、そんな見方が果たして本当に作品を「見た」と言えるだろうか。\n子どもたちは予備知識を持たずに絵を見る。そのときに「感動」しなくてもかまわない。一生懸命に「見る」だけでいいのだ。一枚の絵を一生懸命見たという体験だけで、美術館に来た価値は十分にある。\n美術館のすばらしいところは「本物」をその目で見られることだ。子どもたちは手にしたポストカードと作品を見比べて「色が違う」と気づくかもしれない。それだけでも立派な「発見」だ。本物と印刷物は違うのだということがわかるだけでも、実物を見た甲斐がある。\n私は、教育とは、自分の感性で感じ、自分の頭で考えられるよう、感性と知性を鍛えることだと思っている。問いに対する答えを教えるのだけが教育ではないはずだ。そして、美術館は、うまく使えば、感性を鍛えるすばらしい学校になりうる場所だ。なぜなら、美術館は「答えがたくさんある」ことを教えるのに最適な場だからだ。\n一人ひとり見る「目」も違えば、その作品を感じる「心」も、そこから考える「頭」も違う。答えは決して一つではないのだ。\n（注1）敷居が高い：近づきにくい\n（注2）ポストカード：ここでは、芸術作品が印刷されたはがき\n（注3）印象派：ここでは、絵画の流派の一つ\n（注4）巨匠○○：○○という名前の巨匠","items":[{"no":57,"sec":"dokkai","stem":"①思っている人は多いとあるが、そういう人たちの気持ちについて筆者はどのように考えているか。","options":["美術館は楽しむより学ぶ場所だと思われているから理解できる。","美術館には知識がないと理解できない作品が多いから理解できる。","芸術作品の楽しみ方は大人になってからしか学べないから理解できる。","子どもの頃から芸術作品に触れる体験が十分ではないから理解できる。"],"ans":4},{"no":58,"sec":"dokkai","stem":"筆者が、子どもたちに②「宝探し」をさせるのは何のためか。","options":["本物の価値を理解させるため","本物を実際に見る機会を作るため","本物を見た感動を忘れないようにするため。","本物を通して知識を確かなものにするため。"],"ans":2},{"no":59,"sec":"dokkai","stem":"筆者によると、美術館は子どもたちの教育にどのように役立つか。","options":["子どもたちはさまざまな発見を通して感性を磨けるようになる。","子どもたちは多くの作品の中から価値のあるものが見極められるようになる。","子どもたちは考えることより感じることのほうが大切だとわかるようになる。","子どもたちは感性を鍛えることができより良い答えが見つけ出せるようになる。"],"ans":1}]},{"label":"Mon11","passage":"A\n人は不安を感じたり緊張したりすると、慌てたり身体の動きがぎこちなくなったりして、本来の力が発揮できなくなることがある。そういうときは、「うまくいかなかったらどうしよう」といったマイナスの思考をしないようにする必要がある。そのためには、自分自身に肯定的な言葉を発することが効果的だ。「きっとうまくいく」と言い聞かせたり、「こうなりたい」という具体的なイメージを言葉にしたりする。脳は自分が発した言葉を真実だと認識しようとするので、その言葉どおりになると思えてきて不安な気持ちが和らいでいく。つまり、心の状態はコントロールが可能なのだ。心の状態が好転すれば、身体もスムーズに動き本来の力が発揮できるはずだ。\nB\n人は不安な状態に陥ると、反射的に下を向いてしまいます。このように、人間の身体というものは、心の微妙な動きに反応しているのです。こうした身体と心の関係性をうまく活用すると、身体の動きを操作することで心の動きまでもコントロールすることができるようになります。\nたとえば、不安でしょうがない状態になったときは意識的に目線をあげてみる。極度に緊張して呼吸が早くなったとしたら、息を大きく吸い込んで深呼吸をしてみる。\nシンプルにいうならば、今の身体の状態に対して、すべて反対の方向に身体を動かせばよいのです。目線をあげれば不安は解消されますし、深呼吸をすれば落ち着いた状態になります。\nそもそも、心の状態というものは、自律神経を通して身体の反応へと現れてくるものなのですが、こうした作用を逆転させてやることで、身体の動きから自律神経に対して、逆のアプローチをかけていくことができるのです。\n（注）自律神経：意志とは無関係に、身体の機能を自動的に調節する神経","items":[{"no":60,"sec":"dokkai","stem":"不安を感じたり緊張したりしたとき、AとBはどうすればよいと述べているか。","options":["AもBも、深呼吸しながらうまくいっている状態をイメージすればよいと述べている。","AもBも、今の身体の状態を落ち着かせる動きをすればよいと述べている。","Aは自分がどうなりたいかを具体的に言葉にすればよいと述べ、Bは身体の力を抜いて呼吸を整えればよいと述べている。","Aは自分に前向きな言葉をかければよいと述べ、Bは今の身体の状態が反対になるようにすればよいと述べている。"],"ans":4},{"no":61,"sec":"dokkai","stem":"AとBで共通して述べられていることは何か。","options":["心の状態を変えるには思考を変える必要がある。","心の状態を自覚することは難しい。","心の状態は身体の状態から影響を受けやすい。","心の状態は自分の力でよい方向に変えられる。"],"ans":4}]},{"label":"Mon12","passage":"人間同士の将棋、勝負というのは、ただ盤上で能力を発揮し合うだけのものではありません。必ずそこに至るまでのプロセスがあります。強い相手と戦うことになってプレッシャーを受けたり、「ああ、厳しい相手だなあ」と萎縮してしまって勉強の意欲が減ったりすることだってあります。でも、「それじゃダメだ」と自分の心と戦ったり、整理をつけたりして最終的に対局当日を迎える。もちろん盤上の戦いもすごく大変なのですが、必ず事前にそういうステップを踏んでいます。\n人間の強さというのは、他人との戦いはもちろんですが、自分自身との戦いによっても生まれ、育っていくものなのです。\nそれに、人間は疲れも感じるし、集中力も永遠には続きません。判断ミスだって何度もします。\nしかし、そんなちっぽけな一人の人間が焦りや苦しさを乗り越えて、観ている側が感動したり、あっと驚くような勝負をしたりする。それこそが人間の将棋の醍醐味だと思うのです。\n（中略）\nよく言われることですが、コンピューターに悩みやプレッシャーはありません。いくらコンピューターが強くても、先ほど述べたような人間的なプロセスを乗り越えてきているわけではない。\n強いコンピューターというのは、開発者のプログラミング能力、また人間的な意味で言えば閃きに懸ける情熱とか、そういうものが評価されていきます。ただそれは、人間の将棋の強さとは別の軸にあるものだと思うのです。\nその相容れないまったく別物の強さを競わせたのが、棋士対コンピューター戦です。その結果、コンピューターのほうが強かったとしても、人間の強さが魅力や意味を失うわけではないでしょう。\nもちろん、棋士がコンピューターに負けたら、ファンの方がガッカリする気持ちもわかります。いままで人間同士の素晴らしい戦いを観てきて、最強棋士のすごさを体感してきた。そういう中でソフトという新しい存在が出てきてそれに負かされたら、人間は感情の生き物である以上、落胆するのも当然だと思うのです。\nいままで自分が興奮や感動してきたものは何だったのだ、と。\nただ実は、人間とコンピューターの強さというのは一緯にかけるものではなくて、それぞれが固有の良さを持っているものだと思うのです。\n人間対人間、人間対コンピューター、コンピューター対コンピューター。大きく分ければこの三つになると思いますが、これらはそれぞれに独立した魅力があって、お互いを阻害するものではありません。そこを分けて考えることが大事なのではないでしょうか。\nこの三つのコンテンツを徹底的に味わいつくしたうえで、コンピューター対コンピューターの対戦が一番面白いと思えば、人間の強さに魅力を感じなくなっても仕方がないとは思います。でもきちんと比較もせずに、なんとなく時代の流れやちょっとしたインパクトだけで、人間対人間の面白さの魅力が薄らいだと思うのはすごくもったいない。","items":[{"no":62,"sec":"dokkai","stem":"人間同士の将棋の魅力について、筆者はどのように考えているか。","options":["勝負に至るまでの苦悩を抱えつつ、戦いに臨んでいる棋士に魅力がある。","勝負自体ではなく、勝負の前の自分自身と戦うプロセスに感動する。","焦りや苦しさを克服して、勝った棋士に魅力が感じられる。","弱い側が強い相手に挑んで勝つ勝負にこそ感動する。"],"ans":1},{"no":63,"sec":"dokkai","stem":"コンピューターによる将棋について、筆者はどのように述べているか。","options":["強さの基準が人間とは異なるので、人間の棋士と比べられるものではない。","常に一定の能力が発揮できるので、人間を感動させる勝負はできない。","人間には超えることができない力があり、人間と勝負することに意味はない。","人間のような焦りや苦しさは感じないので、人間の強さは超えられない。"],"ans":1},{"no":64,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["三つの対戦を十分に味わってはじめて、将棋の本当の魅力に気づくことができる。","三つの対戦をきちんと比較すれば、人間同士の将棋が最も面白いとわかる。","コンピューターによる将棋の出現で人間同士の将棋の魅力が失われたわけではない。","コンピューターによる将棋の出現のおかげで将棋の魅力が増したとは言えない。"],"ans":3}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある市のフリーマーケットの出店者募集の案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"玉北市市民学習センター「市民企画講座」募集\n\nA. 「市民企画講座」とは\n市内で活動する団体の皆さんに、講座を企画・運営してもらうものです。市民学習センターは、広報、受講者の募集、会場の提供を行います。\n\nB. 応募条件\n【申し込める団体】\n・玉北市在住者による団体\n\n【実施できる講座】\n＜内容・場所・講師＞\n文化や芸術、歴史等に関する内容で、当センター内の教室（和室含む）で開講できるもの\n団体のメンバーが講師をすることも、外部の講師を招くことも可能\n※外部の講師は玉北市在住でない方でも可能\n\n＜実施期間・回数＞\n4月1日〜9月30日の間で、計4〜6回の実施\n\n＜定員・受講対象者＞\n・定員 10〜30人\n・受講対象者は玉北市在住者とし、年齢による限定をしないこと\n※夏休み期間中（7月25日〜8月31日）の講座のみ、「子供」または「親子」を対象にしてもかまいません。\n\nC. スケジュール\n①事前説明会：1月13日（土）14時〜16時 市民学習センター2階会議室\n・応募や企画・運営の注意点等をご説明します。初めて応募する団体の代表者は、必ず出席してください。事前申し込みは不要です。\n\n②応募書類提出・受付期間：1月15日（月）〜1月31日（水）\n・応募書類（「申請書」と「講座概要」）を、当センターの開館時間内（平日9時〜19時）に窓口に持参してください。記載内容を確認するので、代表者が提出してください。\n・「講座概要」は、講師が作成してください。\n\n③選考会（面接）：2月24日（土）午後\n・代表者が必ず出席してください。代表者と講師が異なる場合は、講師も一緒に出席してください。\n・結果は3月上旬に郵送します。\n\n【問い合わせ】玉北市市民学習センター 電話242-000-8688　〒665-2243 玉北市浅田町2-5","items":[{"no":65,"sec":"dokkai","stem":"次の4つの団体は、玉北市在住者による団体で、今後、以下の講座の開講を検討している。この中で「市民企画講座」に応募できるのはどの団体か。\n\n①大空グループ「絵画教室」／4月と5月に計5回／玉北市内の公園／受講対象：玉北市在住者（年齢制限なし）／15〜20人\n②もみじの会「俳句教室」／7月〜9月に計6回／学習センター内の教室／受講対象：60歳以上の玉北市在住者／20〜30人\n③たまきた文化の家「茶道体験」／8月に計4回／学習センター内の和室／受講対象：玉北市在住の親子／10〜20人\n④玉北市歴史クラブ「玉北市の歴史」／9月に計4回／学習センター内の教室／受講対象：玉北市在住の親子／15〜30人","options":["大空グループ","もみじの会","たまきた文化の家","玉北市歴史クラブ"],"ans":3},{"no":66,"sec":"dokkai","stem":"田村さんはある団体の代表者を務めており、今回初めて「市民企画講座」に応募したいと考えている。外部の講師を探しているが、講師について留意しなければならないことは何か。","options":["玉北市在住で、③に出席し、②に同伴してくれる人を選ぶ。","玉北市在住で、「講座概要」を作成し、①と③に出席してくれる人を選ぶ。","「講座概要」を作成し、③に出席してくれる人を選ぶ。","「講座概要」を作成し、①と③に出席してくれる人を選ぶ。"],"ans":3}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t7-2025-nghe.mp3","items":[{"no":67,"sec":"nghe","stem":"1番：男の学生はこの後、事務室に何を再提出しますか？","options":["合宿の申請書","活動計画書","駐車許可の申請書","参加者のメール一覧"],"ans":1,"blind":false},{"no":68,"sec":"nghe","stem":"2番：男の人はこの後、まず何をしなければなりませんか？","options":["応募フォームに記入する","自宅の環境がわかる資料を提出する","講習会を受講する","猫との対面をする"],"ans":2,"blind":false},{"no":69,"sec":"nghe","stem":"3番：部員はこの後、まず何をしなければなりませんか？","options":["新入部員勧誘の日時を決める","説明会の内容を話し合う","全員で集合写真を撮る","ユニフォームに着替える"],"ans":4,"blind":false},{"no":70,"sec":"nghe","stem":"4番：女の人は企画書をどう修正しますか？","options":["売り上げの数値を具体的に示す","お客様の声などの実例を加える","価格を見直す","リスク分析を書き直す"],"ans":2,"blind":false},{"no":71,"sec":"nghe","stem":"5番：男の人はこの後、まず何をしますか？","options":["担当者を増員する","クイズ形式のシートを作る","シートの裏にスタンプを押せるようにする","見学通路の窓を大きくする"],"ans":3,"blind":false}]},{"id":"listen2","title":"聴解 問題2","sec":"nghe","instr":"問題2：話を聞いて、答えとして最もよいものを選びなさい。","items":[{"no":72,"sec":"nghe","stem":"1番：店員は商品を選ぶ時、どんな点に注目するといいと言っていますか？","options":["汚れの落ちやすさ","食器の入れやすさ","節水性能","殺菌効果の高さ"],"ans":4,"blind":false},{"no":73,"sec":"nghe","stem":"2番：男の人は自分のサッカーチームでプレイすることのどんな点がいいと言っていますか？","options":["全員が思い切り走り回れること","試合で結果を出せること","怪我をしても休めること","互いに助け合えること"],"ans":3,"blind":false},{"no":74,"sec":"nghe","stem":"3番：先輩はリモコンカーをどう直した方がいいと言っていますか？","options":["受信機を交換する","バッテリーを強く 工合(注3)を考えれば、むしろその方が自然だと自分に言い聞かせながら、私はまだピアスの消えた片耳を撫で続けている。\n(注1)発注する：注文する\n(注2)高を括っていた：油断していた\n(注3)工合：具合","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["気を使えはしない","気を使ってなどいない","気を使わせられはしない","気を使わせてなどいない"],"ans":3},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["それによって","そればかりでなく","それどころか","それにもかかわらず"],"ans":4},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["承知していれば","承知していて","承知していたのか","承知していたかのように"],"ans":1},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["なら","だって","でさえ","といっても"],"ans":2}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"どんな社会にも、「情報通」と呼ばれる人がいます。\n「物知り(注)」とは違います。多くの場合は、「情報に通じた人」つまり、どこにいけば情報があるのかを知っている人を指します。\nどんなに知識の豊かな人でも、知っている分野や程度にはかぎりがあります。けれども、ある分野については、人並み以上によく知っている人は少なくありません。\n「この問題については、○○さんが詳しい」\n「この問題なら、○○さんに聞けばわかる」\nそうした引き出しを、人並み以上にもっている人が「情報通」なのです。","items":[{"no":45,"sec":"dokkai","stem":"筆者によると、「情報通」とはどのような人か。","options":["幅広い分野で人並み以上の情報をもっている人。","何が自分にとって必要な情報かをよく理解している人。","誰が必要な情報をもっているかをよく把握している人。","情報をもっている人を見つけて、問題解決ができる人。"],"ans":3}]},{"passage":"人間の感覚がいかにあてにならないものかを示す有名な実験があります。\nまず、三つの容器に冷たい水とぬるま湯、それに熱いお湯を用意します。はじめに右手を冷たい水に、左手を熱いお湯に、同時につけます。しばらくつけたら、今度は両手を同時にぬるま湯につけてみます。すると、冷たい水に慣れた右手は温かいと感じ、熱いお湯に慣れた左手は同じぬるま湯を冷たいと感じるでしょう。人間の感覚は同じ身体の一部でさえも、ちがう意味を受け取ってしまうのです。","items":[{"no":46,"sec":"dokkai","stem":"手の感覚について、実験からどのようなことが分かったか。","options":["熱いお湯や冷たい水につけ続けていると、温度が感じられなくなる。","冷たい水のあとより熱いお湯のあとにつけたほうが、ぬるま湯を温かく感じる。","先につけていた水やお湯の温度より、ぬるま湯の温度のほうが低く感じる。","先につけていた水やお湯の温度によって、ぬるま湯の温度の感じ方が変わる。"],"ans":4}]},{"passage":"自動車が自動的に運転されることになれば、それは完全に単なる移動手段となり、運転することの娯楽性は存在しなくなる。人間が自分で自動車を運転する楽しさというものは、安全や利便性(注1)とのトレードオフ(注2)として、なくなってしかるべきものなのだろうか。人間を害するリスクのある非合理な娯楽性は、自動運転車とともになくなってしまえばいいと割り切ってしまう前に、安全性と娯楽性が両立する解はあると信じたい。","items":[{"no":47,"sec":"dokkai","stem":"自動運転車の登場について、筆者はどのように考えているか。","options":["安全や便利さも重要ではあるが、自分で運転する楽しさは失いたくない。","安全性と娯楽性の共存が望ましいが、実現は難しい。","娯楽性がなくなるが、安全や便利さのためには許容せざるをえない。","娯楽性を犠牲にしてまで、運転の自動化を進めてはいけない。"],"ans":1}]},{"passage":"翻訳という作業は音楽の演奏に似ている。作家は作曲家に、翻訳者は演奏家に、それぞれたとえることができるのではないか。前から、ひそかにそう考えていた。\n新しい世界観を提示するために構成を練り、一つ一つの言葉や音を吟味して組み立てていく作家＝作曲家。\nかたや(注)作者に寄りそうようにして意を汲み、原作や楽譜を丹念にたどってその世界を再現してみせる翻訳家＝演奏家。楽譜をもとにしていても、演奏家によって、生み出される曲の印象がまるで違うことがあるように、小説や詩も、翻訳家の個性や解釈によって、何種類もの異なる翻訳が存在することがありうる。","items":[{"no":48,"sec":"dokkai","stem":"筆者は、翻訳のどのような点が音楽の演奏と似ていると述べているか。","options":["原作を丹念にたどっても、作家の世界観が再現されない可能性がある点。","同じ原作を翻訳しても、出来上がった翻訳が多様になりうる点。","翻訳家の個性により、異なる作家の作品でも似た印象になりうる点。","翻訳家次第で、さまざまな世界観が生み出される可能性がある点。"],"ans":2}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"育児と言えば、たいていは母親によってなされると思われています。(中略)ところがライオンはちょっと違います。同じ群れのライオンは、そろって出産する傾向があり、育児も群れの雌全員が協力して行うのです。赤ちゃんは生まれて一か月あまりは物陰に隠され、母親だけで育てられます。しかし、歩けるようになると、群れに連れてこられて共同生活が始まります。\nライオンの群れには複数の大人の雌がいますから、それらの子どもたちが集まって、大所帯となります。集められた子どもたちは、自分の母親以外のライオンの乳も飲むことができ、群れの全員の保護を受けることができます。捕食獣(注1)であるライオンは、子育て中も獲物狩りに出かけなければなりません。母親一頭で子育てをしている場合には、外出中に、ハイエナ(注2)などに子どもが捕食される危険があります。しかし、共同育児をして誰かが子どものそばに残っていれば安心です。\n若い雌ライオンは敏捷(注3)ですが、子育ての経験に乏しく、失敗することもよくあります。それに比べ、壮年期になったライオンは経験豊富で態度もどっしりとして子育ても上手です。長の雌がまとめて面倒を見た方が育児はうまくいくかもしれません。反面、若いライオンの敏捷性は狩りでは有利に働くでしょう。ライオンは狩りも共同で行い、獲物はみんなで食べますから年老いて狩りに参加できなくても、食事をとることができるのです。\nライオンたちは、明確な分業とまではいえなくても、うまく育児と狩りを全員が協力することで、問題を解決しています。\n(注1)捕食獣:ほかの動物を捕らえて食べる獣\n(注2)ハイエナ:動物の一種\n(注3)敏捷だ:動きが素早い","items":[{"no":49,"sec":"dokkai","stem":"ライオンの子育てについて、筆者はどのように述べているか。","options":["生後すぐに、群れの中で雌が交代で育てる。","生後一カ月あまり過ぎると、経験豊富な年長の雌が育てる。","歩けるようになるまで、群れの中で母親が育てる。","歩けるようになると、群れの雌が協力して育てる。"],"ans":4},{"no":50,"sec":"dokkai","stem":"共同生活の利点について、筆者はどのように述べているか。","options":["壮年期のライオンの経験を育児と狩りに生かすことができる。","年齢に応じて役割を分担することで、育児と狩りが両立できる。","群れの中での役割分担が明確になり、個々のライオンの負担が減る。","若いライオンが育児も狩りも経験することで、どんな役割もできるようになる。"],"ans":2}]},{"passage":"仕事柄(注1)、私は取材を受けることが多いが、あるとき取材をしている人から、話すのが苦手だと打ち明けられたことがある。取材中は自然な感じで会話が進んでいたこともあって少し驚いたが、そう言われてみるとたしかに少し緊張しているように見えなくもない。ただ、取材を受けている私の立場からすると、必ずしも悪い印象は受けなかった。\nむしろ緊張感が相手に対する配慮のように感じられて、良い感じで話をすることができた。\n私たちは、あることが苦手だと思うと、うまくできていないように思える面に目を向けてしまう。\nスムーズに言葉が出てこなかったことや、話が行きつ戻りつしてしまったことなどが気になって、自分を責める気持ちになる。\nしかし、スムーズに言葉が出なかったことで、会話にため(注2)が出てきていることもある。相手は、その時間的すきまの時に、考えをまとめたり、振り返りをしたりできたりする。トントン拍子に(注3)会話が進まないことで、話している内容を多面的に考えることができたりもする。\n思うように会話できないときは、失敗ではなく、話を深めるように無意識に心が手助けしているようにも思える。(中略)失敗のように思えることには、それなりに意味があるのだろう。\n欠点のように思えることも、見方を変えるとじつは長所だということが少なくない。自分に対して多面的な見方ができると、気持ちが楽になるし、本来の力を発揮できるようになる。\n(注1)仕事柄:仕事の性質上\n(注2)ため:ここでは、余裕の時間\n(注3)トントン拍子に:順調","items":[{"no":51,"sec":"dokkai","stem":"取材をしている人からうまく言葉が出てこないことについて、筆者はどのように考えているか。","options":["取材を受けている人は、間を取りながら話さなければならないという気持ちにさせられる。","取材を受けている人は、考えをまとめたり振り返ったりしながら内容が深められる。","取材を受けている人は、内容をまとめて分かりやすく伝えるための準備ができる。","取材を受けている人は、自分のせいだと考えて自ら会話を進めようとする。"],"ans":2},{"no":52,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["自分に対して多面的な見方ができれば、ほかの人の失敗や欠点にも寛容になる。","欠点だと思えることを改善できれば、自分の能力が発揮できるようになる。","本来の力を発揮するためには、自分の欠点ではなく長所を探すのがいい。","失敗や欠点だと思っていても、捉え方次第で長所になり得る。"],"ans":4}]},{"passage":"以下は、商品パッケージのデザイナーが書いた文章である。\n大量生産品のように全国に流通し、多くの方々にご利用いただく商品の場合には、必ずマーケティング調査(注1)が行われます。とくにパッケージのリニューアル時には、従来よりも売り上げが落ちてしまっては大変なので、より慎重に行われます。\nただそういう場合、必ず「今までの方が良かった」という意見が過半を占めます。ですがメーカーにとっては、定番となっている商品をどうしてもリニューアル(注2)しなければならないタイミングが必ずやってきます。それは、競合他社が売り上げを伸ばしたり、技術開発に伴い商品そのものが改善された「り、いろいろな理由でそれは必ずやってくる。ところがマーケティング調査してみると「変えない方がいい」という結果が出てしまう。今までのファンはその商品に愛着をもっているわけですから、リニューアルに大賛成してくれるわけがないのです。ですが、どうしても新しくしなければならない。\n私は<span class=\"underline-q\">こういった時</span>、これまでの財産をうまく生かして、今までのファンがある程度を許容してくれれば、それは大成功だと考えています。最初は少し許せない部分があったとしても、これが一年、二年経つと、新しいデザインも見慣れてくる。したがってマーケティング調査の数字は、そういう時間軸も考えたうえで見る必要があります。\n(注1)マーケティング調査:市場調査\n(注2)リニューアル:ここでは、更新","items":[{"no":53,"sec":"dokkai","stem":"<span class=\"underline-q\">こういった時</span>とは、どのような時か。","options":["パッケージの変更に伴って、ファンが商品への愛着を失った時。","パッケージの変更を望まないファンが多いのに、変更せざるを得ない時。","新しいファンを獲得するには、パッケージの変更が不可欠だと分かった時。","ファンの賛否が分からない状況で、パッケージを変更しなければならない時。"],"ans":2},{"no":54,"sec":"dokkai","stem":"マーケティング調査の結果について、筆者はどのように考えているか。","options":["一部の消費者の意見として、うまく生かすべきだ。","肯定的な意見を積極的に取り入れて商品開発に生かすべきだ。","消費者の反応が変わっていくことを考慮して分析するべきだ。","過去の結果と合わせて、消費者の好みの変化を読み取るべきだ。"],"ans":3}]},{"passage":"群馬県の上野村で暮らすようになって覚えたもののひとつに「待つ」という感覚がある。\nたとえばこの村の農業は春を待たなければはじまらない。山菜も、茸も、それが出てくる時期を待たなければけっして手には入らない。木材として利用するのなら、木を切るのは、森の木々が活動を低下させる秋から冬がくるのを待つ必要がある。実に多くのことが、村では<span class=\"underline-q\">「待つ」ことからはじまっていく</span>。\nそれが、自然とともに働き、暮らすということなのであろう。自然の力を借りようとすれば、自然がつくる、それに適したときがくるのを待たなければならない。といってもそれは、のんびりした暮らし方とばかりもいえないのである。なぜなら、ときを待つ以上、逆にそのときを逃してしまったらうまくいかなくなる。田植えのとき、草取りのとき、稲刈りのとき･･･。村の暮らしには、逃がしてはいけないときがたえずやってくる。\nときを待つ暮らしにとっては、人間の意志は万能ではない。それよりも自然という他者の動きの方が重要で、人間の意志は、自然の動きをうまく活用する範囲内でしか有効ではない。だから、自然と結ばれ、ときを待ちながら働き暮らしてきた村の人たちは、人間関係のなかでも同じような感覚を育んだ。人間関係においても自分の一方的な意志は万能ではない。人々の動きを理解しながら、ちょうどよいタイミングがくるのを待って、そのときを逃さずに働きかけていく。それが村の人たちの人間関係のつくり方だった。自然との関係のなかで学んだことが人間同士の関係のなかでもいかされていたのである。\n(内山節『戦争という仕事』による)","items":[{"no":55,"sec":"dokkai","stem":"<span class=\"underline-q\">「待つ」ことからはじまっていく</span>とあるが、何を待つのか。","options":["自然が豊かさを回復して利用できるようになるとき。","自然を人間の都合に合わせるのに適したとき。","自然の恵みを受けるのに適した状態になるとき。","自然の変化が感じられるようになるとき。"],"ans":3},{"no":56,"sec":"dokkai","stem":"筆者によると、村の人たちの人間関係はどのようにつくられたか。","options":["自然との関係と同様に、相手の行動を見ながら時機を捉えて働きかける。","自然の変化を捉えるように、相手の変化を待って働きかける。","自然の影響を受けやすい人々の動きを理解し、タイミングよく働きかける。","自然の変化を待つのと同様に、相手からの働きかけを焦らずに待つ。"],"ans":1}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"教育を仕事にしていると、面白いことがたくさんある。その中の一つに、「未熟さの効用」とでも言うべき現象がある。知識や教育技術がたとえ未熟であったとしても、不思議と初めて受け持った授業が生徒との間に一番濃い縁を結ぶことがよくある。\n通常の仕事は、経験を積み、技術が上がるほど、質が良くなる。教育の界でも、もちろん経験知は有効に働く。ベテランの安定感は、たしかに大切だ。しかし、教育の場合は、若く未熟であることがむしろプラスに働くケースがよくあるのも事実だ。初年度に受け持った学生たちのことが鮮明に記憶に残り、その後のつき合いも深い、という経験が私にもある。\nこれはどういうことだろうか。まず考えられるのは、初年度の緊張感が、学生たちに新鮮な印象を与えたということだ。慣れてくると手際が良くなる。すると、学生たちは、安心する一方で油断が出る。レストランで手際のいいコックに料理を出してもらうような気分で、授業を受け始めてしまうのだ。授業を上手にサービスする側と、サービスされる側に、立場がはっきり分かれてしまう。先生はいかにも先生らしく、生徒はいかにも生徒らしい。\nこうした関係は、安定はしているが、ときに新鮮さに欠ける。これに対して、初年度の教師が持つ緊張感は、生徒にも伝染する。その緊張感の共有が、一つの同じ場を作り上げているのだという意識を生みだす。参加し作り上げる感覚が、生徒の方にも生まれる。それが思い出の濃さにもつながる。\nここで初年度というのは、教師になって初めての年度というだけではない。学校を替わって、教師が新たな気持ちで臨むときも新鮮さが出る。あるいは新しい教科を担当し、一生懸命勉強して多少の不安を持ちながらも勢いをつけて切り抜けていくときにも、印象深い授業ができやすい。\nただ単に未熟であることがいいわけではもちろんない。自分が未熟であることを自覚し、その分精一杯準備し、情熱を持って語りかけるときに、未熟さがプラスに転じるのだ。\n教育において「新鮮さ」は決定的な重要性を持っている。いわゆる「教師臭さ」は、学ぶ側の構えを鈍くさせてしまう。型どおりの教え方が染みついてしまっている、という印象を与えてしまうだけで大きなマイナスになるのだ。「決まり切った感じ」を印象として与えないようにすることが大切である。経験知を重ねる良さを残したまま、新鮮さを失わない。これは、もはや一つの技である。「先生も自分たちと一緒に変化してくれるのだ」という意識が学ぶ側に生まれると、場を一緒に盛り上げる機運が高まる。","items":[{"no":57,"sec":"dokkai","stem":"筆者によると、教育の仕事は通常の仕事とどのような点で異なるか。","options":["知識や技術の高さよりも人格の良さの方が重視される。","知識や技術が十分でなくても良い結果を生むことがある。","経験の豊富なベテランより、若く未熟な方が好かれやすい。","経験を積み技術が上がっても、仕事の質が良くなるとは限らない。"],"ans":2},{"no":58,"sec":"dokkai","stem":"筆者によると、初年度の教師の緊張感は学生たちにどのように影響するか。","options":["積極的に授業に参加し、教師の緊張感を和らげようとする。","教師の立場を理解し、生徒らしい態度で授業を受けようとする。","教師と一緒に授業を作っているのだという気持ちになる。","教師と緊張感が共有でき、心を開いていいのだと思うようになる。"],"ans":3},{"no":59,"sec":"dokkai","stem":"筆者によると、教育を仕事にしている人間にとって大切なことは何か。","options":["経験に満足することなく、自ら変化し続けようとすること。","新鮮さを失わないために、自ら新しい知識や技術を身につけること。","自らの足りなさを補いつつ、情熱を持って接すること。","自らの未熟さを隠さずに、学ぶ側が一体感を得やすくすること。"],"ans":1}]},{"label":"Mon11","passage":"A\n「指示されないと自分から動かない」「指示されたことしかやらない」、いわゆる指示待ちになっているといわれる部下や後輩がいる。指示待ちになるのは、仕事に関する知識や経験が不足していたり仕事に対してやる気がなかったりすることなどが原因だといわれている。しかし実は、そもそも上司からの指示に従うことが自分の役目だと考え、それ以上のことをする必要性を感じていないという場合が多いのだ。\nそのような部下には、何のためのこの仕事を行い、業務全体の中でほかの仕事とどうかかわっているのかを教えることが重要だ。仕事の全体像がイメージできれば、部下は次にやるべきことや工夫できそうな点が分かってくる。その結果、自分に求められていることに気づき、自主的に行動できるようになっていくだろう。\nB\n部下や後輩が指示待ちであるのを簡単に部下自身の責任と決めつけるのは、問題があります。指示待ちになっている理由が何かあるのかもしれません。\nまず部下自身が自主的に動くことの重要性を認識していないケースがあります。「言われた通りにするのが部下の仕事だ」と思いこんでいて、むしろ「どうしましょう」と相談することこそが部下の務めだと信じているケースです。この場合は、どんな仕事もすべてマニュアルで示すことはできず、個人の判断や工夫がいることを伝えることからはじめる必要があります。(中略)\n「これはどうしましょうか」と相談された時は、部下自身にその対応策を考えられるかどうか見極めて、「一度、自分なりの案を考えてみて」と要求してみるのです。上司がいつもそのように振る舞えば、部下は上司の思いにそって、「提案型の相談」をするようになってきます。","items":[{"no":60,"sec":"dokkai","stem":"部下や後輩が指示待ちになっている理由として、AとBが共通して述べていることは何か。","options":["知識や経験が足りず、やるべきことが分からないこと。","自信がなく、自主的に仕事を進めることができないこと。","上司がいつも丁寧にやり方を教えてくれること。","上司にいわれたことを行うのが仕事だと思っていること。"],"ans":4},{"no":61,"sec":"dokkai","stem":"指示待ちになっている部下や後輩の対応のしかたについて、AとBはどのように述べているか","options":["AもBも、自分なりのやり方を考えて提案させるといいと述べている。","AもBも、仕事の目的を伝え、やるべきことを一緒に考えるといいと述べている。","Aは仕事の目的と全体像を理解させるといいと述べ、Bは自分でできそうなことはまず一人で考えさせるといいと述べている。","Aはほかの仕事とのかかわりを教えるといいと述べ、Bはやり方がすでに分かっている仕事を与え自分自身でやらせるといいと述べている。"],"ans":3}]},{"label":"Mon12","passage":"最近、日本ではテレビや書籍で脳科学者がブームになりました。脳科学が一般の人々の関心を強く惹いた最大の理由は、脳科学によって自分がよりよい人生を歩めそうだと感じるからではないでしょうか。\n科学は事物を客観的に扱う三人称的な学問です。そのため、何か冷たく、自分とは関係のないようなよそよそしさ(注1)を感じてしまいます。ところが、脳科学は人間の感情や思考や行動に関わる科学です。そのため、科学としては初めてのことですが、まるで文学や芸術のように一人称(注2)\n世界に踏み込んできて、幸せな人生のノウハウを提供してくれているように思えるのです。\nしかし、せっかく関心を持っている人に水を差す(注3)つもりはないのですが、脳科学が今よりずっと進歩したとしても、人間の心や私たちの人生について、すみずみまで解き明かせるようになるわけではないと肝に銘じて(注4)おいた方がよいと思います。脳は複雑で、まだまだわからないことが多く、普通的な法則に到達するまでの道のりはきわめて遠いのです。そして、たとえ到達できたとしても、科学の普通法則は人生の個別性や一回(注5)に対しては全く無力です。ゆえに、人生の個別の事柄に適用して何かを予言したりすることは、おそらく不可能でしょう。\nもう一つ大切なのは、科学は事実を扱うことはできますが、価値観の問題を扱うことはできないということです。ですから、脳科学によってある事実が判明したとしても、それを価値観と混同してはいけません。たとえば、ある脳科学の本に、「こうすれば脳を活性化できるので、みなさんもやってみましょう」と書いてあったとします。ですが、脳の活性化は絶対的な価値でしょうか。極端な例で考えてみましょう。副作用の全くない薬物だったとしても、薬物で健康な人間(たとえば受験生)の脳を活性化することは許されるでしょうか。これが許されるかどうかは、論理や価値観に属する話です。価値観は個人と社会が決めるものです。そして、個人の価値と社会の価値も同じとは限りません。脳科学の知見(注6)は事実を記述したものであって、価値とは何の関係もないのです。\n(中略)\n人類がどのような未来を選ぶかという問題も、結局のところ価値観の問題です。科学は、選んだ未来を実現するための道具にはあり得ますが、未来を選ぶ価値観の問題を扱うことはできません。\n(注1)よそよそしい:無関係である(注2)一人称:書き手が自分自身をさす(注3)水を差す:わきから邪魔をする(注4)肝に銘じる:心に強くきざみつけて忘れない(注5)一回性:一回起こるだけ(注6)知見:見解、見識","items":[{"no":62,"sec":"dokkai","stem":"筆者によると、人々は脳科学に何を期待しているか。","options":["複雑な脳の仕組みをわかりやすく説明してくれること。","どうすれば自分が幸せに生きられるかを教えてくれること。","人間の感情や思考や行動の扱い方を教えてくれること。","人間にとって幸せな人生とは何かを客観的に示してくれること。"],"ans":2},{"no":63,"sec":"dokkai","stem":"脳科学について、筆者の考えに合うのはどれか。","options":["個人の人生に適用するには、普遍的な法則を見つけなければならない。","人の脳の機能をすべて解明できたとしても、普遍的な法則にたどり着けない。","普遍的な法則にたどり着いたとしても、人生の個々の事柄には応用できない。","普遍的な法則に到達するには、人生の個々の事柄を解き明かさなければならない。"],"ans":3},{"no":64,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["科学が証明した事実は、個人や社会の価値観に影響を与える恐れがある。","科学だけでなく個人や社会の価値観を考慮したうえで、未来を選ぶ必要がある。","科学は個人や社会の価値観を扱えず、人類が望む未来の実現には役に立たない。","科学は事実を対象とするものであり、個人や社会の価値観を扱うものではない。"],"ans":4}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある大学の研究活動助成の案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"ボランティア活動助成金 申請要項\n緑川大学では、国内各地でボランティア活動に参加する学生に対して、費用の一部を助成する制度を設けています。\n\n1. 助成対象者\n緑川大学の学部生と大学院生\n\n2. 助成対象となる活動\n公的団体が主催するボランティア活動\n\n3. 助成対象となる費用、助成が受けられる金額と回数\n(1) 費用　ボランティア活動のために支出される交通費と宿泊費\n(2) 金額\n- 交通費：1回の活動につき、10,000円を上限として支給します。\n- 宿泊費：1回の活動につき、1泊あたり6,000円を上限として実費を支給します。2泊分までを支給対象とします。\n(3) 回数　年度中2回まで\n\n4. 申請方法（A〜Cの書類の様式はホームページからダウンロード可）\n活動終了後2か月以内に以下の書類をボランティアセンターに提出してください。\nただし、年度内最終提出期限は3月24日（厳守）とします。\nA: ボランティア活動助成金申請書\nB: ボランティア活動助成金振込口座届\nC: ボランティア活動証明書：（受け入れ先の様式も可）\nD: 領収書 ※\n※宿泊費の領収書は必ず提出してください。交通費の領収書は入手が可能な場合は提出してください。交通費の領収書が入手できない場合は、実際にかかった金額をAに記入してください。\n\n5. 助成金振込\n審査を行い、申請が認められた場合は、書類提出があった翌月の月末に振り込みます（書類に不備があった場合、振り込みが遅れる場合があります）。\n\n6. その他\n「A: ボランティア活動助成金申請書」の「活動に参加した感想」をボランティアセンターのホームページで紹介することがあります。\n\n7. 問い合わせ先\n緑川大学ボランティアセンター（3号館1階―Yuuki）\n月〜金曜日 9:00〜17:00\n電話: 083-747-8688\nEメール: jlptmogi1@gmail.com","items":[{"no":65,"sec":"dokkai","stem":"サイさんは、9月4日から7日までボランティア活動を行ったので、9月中に助成金を申請しようと考えている。交通費と宿泊費を計算してメモにまとめたが、申請が認められた場合、サイさんに支給される助成金はいくらになるか。\n\n【サイさんのメモ】交通費：12,000円　宿泊費：7,000円を3泊分","options":["交通10,000円と、宿泊6,000円を2泊分。","交通10,000円と、宿泊6,000円を3泊分。","交通12,000円と、宿泊7,000円を2泊分。","交通12,000円と、宿泊7,000円を3泊分。"],"ans":1},{"no":66,"sec":"dokkai","stem":"ジムさんは、1月10日に日帰りでボランティア活動を行う予定である。助成金を申請したいと考えているが、活動終了後に必ず提出しなければならないものは何で、いつまでに提出しなければならないか。","options":["AとBとCで、3月10日までに提出する。","AとBとCで、3月24日までに提出する。","AとBとCとDで、3月10日までに提出する。","AとBとCとDで、3月24日までに提出する。"],"ans":1}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t12-2024-nghe.mp3","items":[{"no":67,"sec":"nghe","stem":"1番：女の学生はこの後何をしなければなりませんか？","options":["体験会で使うシーンを選ぶ","せりふを印刷する","当日の仕事の担当を決める","ちらしを
