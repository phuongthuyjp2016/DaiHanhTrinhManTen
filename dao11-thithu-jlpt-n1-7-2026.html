s":["森さんが","だけあって","勧める","料理が上手な"],"ans":3},{"no":38,"sec":"bunpo","stem":"最後に見た映画が（　　）（　　）（　*　）（　　）映画を見ていない。","options":["ほど","何だったのかも","思い出せない","久しく"],"ans":1},{"no":39,"sec":"bunpo","stem":"学生から提出された論文の中に面白いものがあった。私が（　　）（　　）（　*　）（　　）これまでにない。","options":["知る限りでは","論文は","分析している","このアプローチで"],"ans":3},{"no":40,"sec":"bunpo","stem":"このレシピ本は、ふだん料理をしない人でも（　　）（　　）（　*　）（　　）評判になっているそうだ。","options":["若い人の間で","調理するだけで","レシピに沿って","簡単に本格的な料理が作れると"],"ans":4}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、文章全体の内容を考えて、41から44の中に入る最もよいものを 1・2・3・4 から一つ選びなさい。","passage":"以下は、作家が書いたエッセイである。\nエッセイのネタのほとんどを、私は日常の中から探している。もちろん「エッセイに書いて面白いネタ」と「書いてもあまり面白くないネタ」とがある。面白いものを [41] 。\nつまり君は、自分が書くエッセイは全部面白いと言いたいのかね?という声が聞こえるので、さらに説明すると、面白いかどうかは、まずは「自分にとって」である。自分にとって面白いとはどういうことか。それは私の場合、「自分がそれまで知らなかったこと」を書く、 [42] 。\n知識というよりは感覚や感情であることが多い。今まで見えなかったものが見えたとき。同じ場所なのに違う場所のように感じられたとき。ずっと眠っていた記憶。思いがけない嬉しさや悲しさや淋しさ。不意に自分の中に生まれた、世界というものへのあらたな認識。\n春になったら暖かくなるとか、困っている人には親切にしたほうがいいとか、不倫はしないほうがいいとか、梅に鶯とか月に雁とか、すでに知っていることは、いくら上手に書いてもつまらない。このエッセイの、665文字という短さの中ですら、書いている途中で退屈になってきてしまう。\nエッセイにかぎらず、 [43] でもそうだ。理想を言えば、知らないことを「知った」という報告ではなくて、この世の謎、自分自身の謎に近づいていく過程を書いていきたいと思っているし、そのような書きかたをしているときが、結局、私は一番面白いのだ。あるいはこれは書くことにかぎらず、人生全般に対して採用したいと思っている [44] 。","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["選べそうだ","選び得るか","選べるとよかった","選ばなければならない"],"ans":4},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["というほとだ","というわけだ","ということだ","というときだ"],"ans":3},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["小説","ある小説","その小説","そういった小説"],"ans":1},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["アプローチだとか","アプローチかもしれない","アプローチにある","アプローチとされているのだ"],"ans":2}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"機械はどんどん精密化し、巨大に進化している。人間の介入を許さないかのような迫力さえ感じさせる。だが、どれほど機械が進化しようとも、本質は変わらない。熟練工(注1)が金槌やドライバーなどの道具を、自分の体の一部のように自在に使いこなすことで最大のパフォーマンスを発揮するように、精密機器や巨大な設備も、人間が活き活きと動かすことが必要である。機械も道具である、という当たり前のことを、私たちは忘れてはいないだろうか。人間が機械に使われたり、単なる番人(注2)になったりするようなことがあってはいけない。\n(注1) 熟練工：熟練した職人\n(注2) 番人：監視する人","items":[{"no":45,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["機械の進化に伴い、人間も技術や能力を向上させることが必要だ。","機械がどんなに進化しても、人間は機械に使われないようにすべきだ。","人間は機械も道具であるという認識を考え直したほうがいい。","人間はどこまで機械を進化させるべきかをよく考えたほうがいい。"],"ans":2}]},{"passage":"以下は、ある電気店から届いたメールである。\n宛て先：syo_yasuhara@kfy.co.jp\n件　名：イヤホン「AS-10」の件\n日　時：9月13日　13：30\n安原　正一様\nLM電気大木店をご利用いただき、ありがとうございます。\nご予約いただいたイヤホン「AS-10」ですが、メーカーの生産が遅れているため、発売日(9月20日)当日に、すべてのお客様にお渡しすることが困難な状況です。\n本日、当店で9月20日にお渡しできる数が確定し、安原様のご注文分は確保できないことが分かりました。大変申し訳ございません。\n安原様へのお渡しは10月以降になってしまうのですが、いかがいたしましょうか。ご注文のキャンセルも承っております。\nお忙しいところ恐縮ですが、ご返信お待ちしております。\nLM電気大木店\n担当：上田　映子","items":[{"no":46,"sec":"dokkai","stem":"イヤホン「AS-10」について、このメールで確認していることは何か。","options":["今から予約しても発売日には渡せないが、予約するかどうか。","発売日が10月以降になってしまうが、予約するかどうか。","発売日に渡せるかは分からないが、予約したままでいいかどうか。","発売日ではなく10月以降に渡すことになるが、予約したままでいいかどうか。"],"ans":4}]},{"passage":"消費者ニーズの多様化が進む今日、「あらゆる人のための商品」はありえない。経営資源が限られるひとつの企業が、すべての顧客を満足させることは不可能だ。今の時代、すべての顧客の要望に応えようとすると、結局、誰の要望にも応えないことになってしまう。「万人受け(注)」という言葉はすでに死語かもしれない。「誰に売らないか」を決めることによって、経営資源を最大限に有効に活用し「売るべき人」に集中することができる。\n(注) 万人受け：皆に受け入れられること","items":[{"no":47,"sec":"dokkai","stem":"筆者が最も言いたいことは何か。","options":["顧客を限定して、その要望に応えた商品を作るべきだ。","顧客の要望に応えるために、経営資源を増やすべきだ。","多様なニーズに応えて、多くの消費者を満足させるべきだ。","ひとつの商品に焦点を当てて、経営資源を最大限に活用すべきだ。"],"ans":1}]},{"passage":"「自分の悪い部分を露にすると、嫌われたり、敬遠されたりするのではないか」という不安は、もちろんあるだろう。見せ方がまずいと、実際にそうなる危険性もないとは言えない。しかし、世間からの評価や期待に対して神経質になりすぎ、そのせいで常に不安を抱えながら生きていくくらいなら、他人から嫌われるほうがよほどましである。\nそもそも他人は、あなたが思っているほどあなたに対して期待などしていない。誰もが皆、自分のことで頭がいっぱいで、他人のことなど気にかけてはいない。","items":[{"no":48,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["他人に嫌われることなく生きることは難しい。","世間の評価や期待を気にしながら生きる必要はない。","自分の悪い部分を見せなければ、他人に嫌われることはない。","自分の悪い部分を見せて他人から嫌われるほうが、楽に生きられる。"],"ans":2}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"中等教育で、生徒たちはいろいろな科目でさまざまな分野の知識に触れていきます。\nどのような知識でも必ず前提となる世界観や物事の枠組みがあり、そうした背景なくしては該当する理論や見識が成り立ちません。\n生徒たちは、それぞれの科目で分野ごとの専門知識に触れていくことによって、前提とされる世界観や物事の枠組みを、自分の世界観や考え方の一部として固定化させていきます。\nつまり、学習を進めて、専門知識を身につければつけるほど、前提とされる価値観や枠組みに縛られていくことになるのです。\n一方で、技術革新やグローバル化により、社会の仕組みや共通認識が、目まぐるしく変化する中、現在の自分の世界観から飛び出して、他の価値観を理解する力が必要とされています。\n哲学の営みの中核は、物事の根本や前提を問い直して、考察することにあります。\n哲学の営みに親しむことで、現在のものの見方や考える枠組みから自分を解き放ち、急速に変化する社会の中で、揺るぎない自分の価値観を模索していく力を身につけることができるのです。\nより深いレベルでの学習が始まる中等教育においてこそ、より柔軟な「<span class=\"underline-q\">哲学する力</span>」を養い始めることが必要とされているのです。\n(注1)中等教育:中学、高校での教育\n(注2)揺るぎない:強固な","items":[{"no":49,"sec":"dokkai","stem":"筆者によると、中学や高校でさまざまな知識に触れていくと、どうなるか。","options":["分野ごとに前提とされる世界観や物事の枠組みが違うことに気づく。","身についた世界観や物事の枠組みの中で思考するようになる。","新しい世界観や考え方にしか興味が持てなくなる。","自分の世界観や考え方がより明確になる。"],"ans":2},{"no":50,"sec":"dokkai","stem":"筆者によると、何のために「<span class=\"underline-q\">哲学する力</span>」が必要か。","options":["激しく変化する社会の中で、自分の価値観を探求できるようにするため","自分のものの見方や考える枠組みの間違いを修正できるようにするため","自分の価値観を問い直し、社会の仕組みを正しく理解するため","社会の共通認識を学び、より深いレベルでの学習を進めるため"],"ans":1}]},{"passage":"以下は、羽毛を持つ恐竜について述べられた文章である。\n恐竜には、鳥のように卵を温める習性があったことがわかっています。\n(中略)気になるのは、いつから卵を温めるようになったのかということですが、羽毛を持った時点で、卵を温める習性も持っていた可能性があります。\n羽毛を持つことで、体温が維持できるようになるので、その体温を使って卵の温度を一定に保つことができます。特に夜間は気温が下がるので、夜に親が卵の上に座って眠っていれば、卵の保温にはとても効果的です。卵が一定の温かさで保たれていれば、さまざまな環境で卵が孵る確率が高くなります。\n爬虫類は卵を温めません。爬虫類の卵は、放置されても、1日のうちある程度の時間、気温が30度を超えるなどの条件が整っていれば、自然と孵ります。その代わり、爬虫類は1年のうち気温の高い限られた時期にしか産卵しません。生息地域も限られます。\n羽毛のある恐竜が、鳥に近い体温を持っていたとすれば、夏以外の季節でも、寒冷地でも、安定して35~40度ほどの温度で卵を温めることが可能です。\n厳密に言うと、羽毛があると体の熱を逃がさないので、卵を温めるには不向きです。\n人間で言うと、衣服の上からでは温めにくいのと同じです。温めるなら、服の中に入れて直接体温が伝わるようにするはずです。\n卵を抱く時期の鳥も、卵と接する部分の羽毛がなくなり、皮膚がむき出しになります。\n恐竜が卵を温めていたとすれば、おそらく同じように、<span class=\"underline-q\">お腹のあたりの羽毛が抜けていたと思われます</span>。\n(注)生息地域:生活している地域","items":[{"no":51,"sec":"dokkai","stem":"筆者によると、羽毛を持つことにはどのような利点があるか。","options":["低温の環境でも、卵を一定の温かさで保つことができる。","低温の環境でも、卵の成長を促し早く孵すことができる。","環境にかかわらず体温が維持でき、卵が多く産める。","環境に合わせて卵の温度を調整でき、早くすことができる。"],"ans":1},{"no":52,"sec":"dokkai","stem":"<span class=\"underline-q\">お腹のあたりの羽毛が抜けていたと思われます</span>とあるが、筆者はなぜそう考えるのか。","options":["体の熱を逃がすことで、卵を温めすぎるのを防げるから","皮膚から卵に直接体温が伝わることで、効率的に卵を温められるから","卵に皮膚を直接当てることで、卵の温度を知ることができるから","卵と接する部分の皮膚がむき出しになることで、卵が抱きやすくなるから"],"ans":2}]},{"passage":"以下は、仕事でリーダーの立場にある人に向けて書かれた文章である。\n「君は何がやりたいの?」「どんな仕事が好きですか?」と聞いたとき、本人の口から出てくる答えが本当に「向いていること」とは限りません。なぜなら、どんな仕事をやりたいかについては、驚くほど多くの人がイメージに左右されています。特に若い人や新人であれば、その傾向は強くなります。本人の発言を鵜呑みに(注1)してはいけないのです仕事の実情を知らずに単純に「あの仕事が好きだ!」と思い込んでいたり、「商品開発のAさんは楽しそう。私も商品開発をやりたい」と憧れていたり。上司に何をやりたいか聞かれたから、<span class=\"underline-q\">それ</span>ほど強い興味があるわけではなくても「特にありません」と答えるのは気まずいので、「なんとなくやりたいもの」をとりあえず答えただけというケースもあります。\nそれを踏まえずに、「君、広報が好きなの?じゃあ、やってみなさい!自分で言うならモチベーションも高いからうまくいくだろう」というリーダーは、マネジメントという大切な仕事を放棄しているようなものです。(注3)本人も気づかない埋もれたスキルを引き出し、チームの勝利に貢献してもらうには、リーダーがメンバー自身よりも、その人の適性を把握していなければなりません。\n(中略)本当に適性があれば、新しいポジションで成果を出します。成果が出ると面白くなり、ますますスキルが上がります。やがて「自分が貢献できている、チームの役に立っている」と実感できるようになれば、それがそのメンバーのやりたい仕事になっていきます。\n(注1)鵜呑みにする:そのまま受け入れる\n(注2)モチベーション:意欲\n(注3)マネジメント:ここでは、チームのメンバーの管理","items":[{"no":53,"sec":"dokkai","stem":"<span class=\"underline-q\">それ</span>とあるが、どのようなことか。","options":["仕事を具体的な内容よりイメージで捉えて答えていること","よいイメージが持たれやすい仕事を選んで答えていること","できない仕事をできると思い込んで答えていること","本当にやりたい仕事を選ばずに答えていること"],"ans":1},{"no":54,"sec":"dokkai","stem":"部下への接し方について、筆者はどのように考えているか。","options":["希望と違う仕事に挑戦させて、本人の新しいスキルを引き出すことが大切だ。","適性を見極めて仕事を任せれば、本人は充実感を持って取り組むようになる。","本人のやりたい仕事に挑戦させれば、望ましい成果が出せるようになる。","個人の成果を望むより、チームに貢献する経験をさせることが大切だ。"],"ans":2}]},{"passage":"実験科学の世界では、仮説にぴたりと合致するような結果が得られることはまずないといってよい。その際、ほとんどの研究者はこう考える。自分の仮説は間違っていない。\nただ、実験の方法がよくないから、よいデータが出ないのだと。そこで条件を少しずつ変えて、繰り返し実験を行うことになる。しかし、ほとんどの場合、実験がうまくいかないのは、実は、仮説そのものが間違っているからなのだ。\nだが、研究者は頑迷なので自説に固執してしまう。かくして膨大な時間と試行錯誤が浪費される。なので、科学研究にほんとうに必要な才能は、天才性やひらめきというよりは、むしろ、自己懐疑、失望に対する耐性、潔い諦め、といったものとなる。\n逆に、実験科学の世界では、時として、思い描いたとおりの、いや、想像以上にすばらしい、見事な実験データが得られることがある。こんな時、研究者に求められることは何か。ぬか喜びしてはならぬ、ということである。実験の方法に穴があるから、見せかけだけの結果が出ているのかもしれない。つまりここでも自己懐疑、(希望に対する)耐性、諦め、が必要となる。\n英語にはこんな言い方がある。toogoodtobetrue(できすぎは、真実ではない)。もう少しだけ研究者に冷静さがあればあの「発見」はなかった。そんな誤謬はいくつでもある。\n(注1)頑迷:頑固\n(注2)~に対する耐性:ここでは、~に影響されない強さ\n(注3)ぬか喜び:あとでがっかりする結果になる一時的な喜び\n(注4)誤謬:誤り","items":[{"no":55,"sec":"dokkai","stem":"筆者によると、自分の仮説に合う実験結果が得られない場合、多くの研究者はどうするか。","options":["仮説と条件を少しずつ変えて、実験を繰り返す。","仮説の問題点を明らかにするために、実験の条件を変える。","仮説に合う結果を得るために、条件を変えて実験を繰り返す。","仮説に合う結果を求めて、条件を変えずに時間をかけて実験する。"],"ans":3},{"no":56,"sec":"dokkai","stem":"実験科学の分野の研究者について、筆者の考えに合うのはどれか。","options":["実験結果に振り回されず、常に仮説と結果を冷静に検証する必要がある。","実験に冷静に臨んでも、思いどおりのよい結果が得られるとは限らない。","「発見」のためには、膨大な時間と試行錯誤を覚悟しなければならない。","思い描いたとおりの結果を得るには、実験による検証を諦めてはならない。"],"ans":1}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"以下は、報道写真を撮る人が書いた文章である。\n写真の発表の場が減ったことで、その未来を懸念する声が多いが、私は、そうは思わない。音も動きもなく、数千分の一秒という高速で動きを止める写真は、テレビと比べると臨場感では劣り、「伝えるためのメディア」としては原始的なのかもしれない。しかし、テレビのように用意された答えを差し出し、「こうです」と押しつけるのとは違って、写真には、すべてが提示されていないからこそ、それを補うための想像力が必要となる。(中略)\n写真の一瞬に込められた意味を想像すること。その瞬間の前と後、あるいは、写っていないものにまで思いをめぐらせること。さらに写っているものに、どう自分を重ね合わせ、何を感じ取るかということ。想像力を伸びやかに働かせることで、私たちは周りに流されずに、「いまの時代」を自分なりに感じ取ることができるはずだ。\nしかし、想像力を呼び起こすためには、写真に「絵」としての力があることが必要条件となる。最初に「絵画」の構成力や力強さといったものがあってこそ、人を惹きつけることができるはずで、そこから何を感じてもらうかはその次のこととなる。\n写真を始めた頃、「名作」と呼ばれる写真をたくさん見るように努めた。ロバート・キャパの「倒れし兵士」、カルティエ・ブレッソンの「水たまりを飛ぶ男」、ユージン・スミスの「シュバイッツア博士」…………･･･。それらの写真を前に、「どうして名作なのか」と考えた。その時は、すぐには答えが見つからなかったが、いま思うのは、「名作とは見る人が、それぞれに感じ取れるものがある写真」ということだ。悲しい時、うれしい時、その時々の心のあり様によって、一枚の写真から感じるものは違ってくる。若い時に、私が感動した写真でも、いま見ると、さほど感じないというものもあるし、逆に、若い頃は何も感じなかった写真がいまになって心に迫ってくることもある。様々な人が、心のままに写真に向き合い、そこからいろいろなメッセージをくみとれる写真が、多くの人に支持され、時を越えて残っていく名作なのだと思う。\n写真の力が失われていると嘆く人もいるが、いまはカメラ付き携帯電話が普及し、多くの場所で写真を撮ることができる時代でもある。その意味では、一億総カメラマンの時代といえるのかもしれない。誰もが撮ることができる時代だからこそ、独自の視点で、他の人が見逃していたアングルで素晴らしい写真を撮ることができれば、多くの人たちによさが認めてもらえる環境が整ったといえるのではないだろうか。\n(注)アングル:角度","items":[{"no":57,"sec":"dokkai","stem":"写真とテレビの映像について、筆者の考えに合うのはどれか。","options":["想像力を働かせて写真を見れば、映像と同じような臨場感が得られる。","写真のほうが原始的だからこそ、見る人に簡潔に意味が伝わる。","写真は一瞬しか写し出されていないため、映像より見る人の想像力が必要だ。","写真は写っていないものがある分、見る人が自分を重ね合わせるのが難しい。"],"ans":3},{"no":58,"sec":"dokkai","stem":"「名作」と呼ばれる写真について、筆者はどのように考えているか。","options":["若い時に価値が分からなくても、年を取るとよさが分かるようになる。","多くのメッセージを含んでおり、見る人に様々な感情を呼び起こす。","明確な一つのメッセージが伝わるような構成力や力強さがある。","見る人や心の状態によって、受け取るメッセージが違う。"],"ans":4},{"no":59,"sec":"dokkai","stem":"写真について、筆者の考えに合うのはどれか。","options":["誰もがどこでも撮れる時代になり、心に迫るものを撮ることが難しくなっている。","想像力を生かせば、他の人が見逃していた視点で撮れる環境が整ってきている。","他の人にはない視点で想像力を呼び起こすものが撮れれば、力を持ち続ける。","技術の進歩 で誰でもよいものが撮れるようになり、力が再認識されている。"],"ans":3}]},{"label":"Mon11","passage":"A\n小説を書こうとしている人やすでに何作か書いたことのある人が、よく私にテクニック面での質問をしてくるけれど、そういうとき私は「あなたが技術や手法について誰かに訊くたびに小説はあなたから離れていく」と答えることにしている。\n（中略）\n自分の小説の行き詰まりをテクニック不足が原因だと考える人は「小説の書き方マニュアル」を信じる律儀さと同じで、たしかに真面目で素直ないい人ではあるのだろうが、本当に自分が書きたいことが何なのかをきちんと考えていないという意味で、怠けているということになる。小説の中身と表現・手法・技術の関係は何重にも重なり込まれたもので、厳密に論じだしたらキリがないが、まずはそんな面倒なことは考えずに、「本当に書きたいことだったらテクニックなんか関係ない」と、シンプルに考えてほしい。\nB\n小説を書くには想像以上の気力が必要である。書くことを決めて執筆に取りかかっても、自分には技術がないから下手な文章しか書けないと手を止めてしまう人が多い。\nしかし、そんなことで悩んでいるくらいなら、まずはどんどん書き進めてみるべきだ。テーマとジャンルを決める、構成と展開を考える、登場人物と舞台を決めるといった必要な手順を踏んだら、あとは書き始めること、そして完結させることが何より重要なのだ。\nいくら面白いストーリーでも、完結させないことには小説とはいえない。短編小説でも、納得できる出来栄えでなくてもかまわない。まずは自分の力で一つの作品を書き上げることだ。それができれば、自信が生まれ次の作品につながっていく。\n(注1)訊く：ここでは、質問する\n(注2)律儀さ：礼儀正しさ\n(注3)何重にも簋み込まれた：ここでは、複雑に絡み合った\n(注4)キリがない：際限がない","items":[{"no":60,"sec":"dokkai","stem":"小説を書くときの問題点として、AとBが共通して挙げていることは何か。","options":["うまく書けないのは技術が足りないからだと考えること","他者にアドバイスを求めて、自分で考えようとしないこと","本当の小説とはどのようなものかが理解できていないこと","書くのに必要な技術や手法を身につけていると過信すること"],"ans":1},{"no":61,"sec":"dokkai","stem":"小説を書くために必要なことについて、AとBはどのように述べているか。","options":["AもBも、本当に書きたいことかどうかを考えながら書くことだと述べている。","AもBも、うまく書けないと思っても、怠けずに書き続けることだと述べている。","Aは自分が書きたいことを明確にすることだと述べ、Bは最後まで書き上げること だと述べている。","Aは内容と表現の関係を考えて書くことだと述べ、Bは手順に沿って書き進めてい くことだと述べている。"],"ans":3}]},{"label":"Mon12","passage":"SNS (注1)を含むリアルタイムウェブ(注2)の本質は、時間と過程の消去にある。かつてコンテンツ(注3)の拡散には一定の時間がかかった。権威やメディアをすり抜ける必要もあった。けれどもいまや、それらの面倒をすべてすっとばし(注4)、無名の書き手が一晩で何百万もの支持者を集めることができる。それはSNSの良いところだ。\nけれども人生にはトラブルがつきもの(注5)である。どれだけ誠実に生きていても、誤解や中傷に曝されることが必ずある。そしてそういうとき、SNSの支持はほとんど役に立たない。匿名の支持者は、トラブルの話題自体すぐに忘れてしまう。あっというまに(注6)集まった人々は、同じくあっというまに離れる。そこで継続的に助けてくれるのは、結局は面倒な人間関係に支えられた家族や友人たちだったりする。\nSNSの人間関係には面倒がない。だからSNSの知人は面倒を背負ってくれない。そんなSNSでも、たしかに人生がうまく行っているときは大きな力になる。けれども、本当の困難を抱えたときは、助けにならないのだ。\nこれからの時代を生きるうえで、SNSのこの性格を知っておくことはとても重要なように思う。そもそも、人生の困難なるものは自分と世界のズレの表れである。自分はあることを正しいと信じるが、世界はそう思わない――そういう対立が生じたとき、困難が訪れる。だから困難そのものが悪いわけではない。むしろ、概念の発明や政治の変革は必ず困難とともに生じる。その困難を時間をかけて解消し昇華する(注７)ことで、はじめて自分も相手も社会も進歩するのだ。けれども、いまのSNSにはそのような熟成の余裕がほとんどない。\n困難な時期を支えるとは、言いかえれば、支える相手と世界の関係が変化する過程に時間をかけてつきあうということである。ひとりの人間が変わるというのはたいへんなことで、「いいね!」をつけるようにポンポン複製できるものではない。いわゆる「議論」で相手が変わると考えているひとは、人間の本質について無知である。ぼくが一生をかけて変えることができるのは、ごく少数の身の回りの人々だけであり、そしてぼくを変えることができるのもおそらくは彼らだけだ。その小さく面倒な人間関係をどれだけ濃密に作れるかで、人生の広がりが決まるのだと思う。\n家族も友人もあっというまには作れない。面倒な存在でもある。だからこそそれは変化の受け皿となる。面倒がないところに変化はない。情報技術は、面側のない人間関係の調達を可能にしたが、それはまた人間から変化の可能性を奪うものでもあった。そのことを忘れずにおきたいと思う。\n(注1) SNS:ウェブ上での情報のやり取りや交流の場を提供するサービス(注2)リアルタイムウェブ:情報更新が即時に行われるウェブ(注3)コンテンツ:ここでは、情報(注4)すっとばす:ここでは、省略する(注5)つきもの:必ず伴うもの(注6)あっというまに短い間に(注7)昇華する:ここでは、別の良いものに変える","items":[{"no":62,"sec":"dokkai","stem":"SNSの支持はほとんど役に立たないとあるが、なぜか。","options":["SNSの支持者の意見はさまざまで、すぐにはまとまらないから","SNSの支持者は無名で権威を持たないひとが多いから","SNSの支持者はトラブルの原因を誤解したまますぐに発信するから","SNSの支持者はすぐに興味をなくし、去ってしまうから"],"ans":4},{"no":63,"sec":"dokkai","stem":"困難な時期について、筆者はどのように述べているか。","options":["自分と世界の認識のズレに気づき自分が変わろうとすれば、乗り越えられる。","「議論」によって相手や自分を変化させることで、乗り越えられる。","少数の身の回りの人々から人間関係を広げていけば、乗り越えられる。","家族や友人のような存在との深い関係によって、乗り越えられる。"],"ans":4},{"no":64,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["情報技術の特徴を理解したうえで活用すれば、自分自身の変化につながる。","情報技術を活用すれば、面倒な人間関係を変えられる可能性がある。","情報技術によって作られた人間関係では、人間の変化は期待できない。","情報技術は人間の変化の可能性を奪うものであり、利用は控えるべきだ。"],"ans":3}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、不用品の買い取りをしている会社のホームページに載っている案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"マスダ買い取りサービス\n買い取りサービスのご利用について\n●買い取り可能な品物\n冷蔵庫などの家電、机などの家具、自転車、楽器を受け付けています。詳しくは、「買い取り可能な品物」のページをご確認ください。\n●買い取り方法と流れ\n【店頭買取】①店頭へお持ちください。②品物を確認し、買い取り金額をご提示します。③ご納得いただけた場合は、現金をお渡しします。\n【出張買取】①最寄りの店舗にお電話ください。②弊社スタッフがご自宅へ伺います。③ご自宅で品物を確認し、買い取り金額をご提示します。④ご納得いただけた場合は、現金をお渡しします。\n【宅配買取】①ホームページからご予約ください。②宅配業者が伺いますので、品物をお渡しください。③店舗への品物到着から3営業日以内に、買い取り金額をメールでご連絡します。ご納得いただけた場合は、銀行口座へお振り込みします。\n※買い取り金額にご納得いただけずキャンセルされる場合でも、出張料や返送料はかかりません。\n●受け付け可能な品数とサイズ\n店頭買取：1点から　サイズ制限なし\n出張買取：2点から　サイズ制限なし\n宅配買取：1点から　1点あたり25kg以下で、かつ三辺（縦・横・高さ）の合計が160cm以下のもの（自転車の場合、サイズ内でも宅配買取は利用できません）\n●ご本人確認について\n店頭買取、出張買取の場合、本人確認書類（運転免許証等）をご提示いただきます。宅配買取の場合は、品物と一緒にコピーをお送りいただきます。\n家電、家具、楽器の場合は、顔写真のない本人確認書類もご利用になれますが、自転車の場合は、顔写真付きのものをご用意ください。","items":[{"no":65,"sec":"dokkai","stem":"チョウさんは、机1台を買い取ってもらいたいと思っている。机は、重さが12kgで、三辺の合計が220cmである。チョウさんが利用できる方法はどれか。","options":["店頭買取か出張買取か宅配買取","店頭買取か出張買取","店頭買取か宅配買取","店頭買取"],"ans":4},{"no":66,"sec":"dokkai","stem":"森村さんは、ギター(重さ5kg、三辺の合計150cm)と自転車(重さ10kg、三辺の合計160cm)をまとめて買い取ってもらいたいと思っているが、店頭に自分で持っていかずに済む方法がいい。森村さんが利用できる方法はどれで、何を準備しなければならないか。","options":["宅配買取で、品物と顔写真付きの本人確認書類のコピーを準備する。","宅配買取で、品物と本人確認書類のコピーを準備する。本人確認書類は、顔写真付きでなくてもいい。","出張買取で、品物と顔写真付きの本人確認書類を準備する。","出張買取で、品物と本人確認書類を準備する。本人確認書類は、顔写真付きでなくてもいい。"],"ans":3}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t12-2023-nghe.mp3","items":[{"no":67,"sec":"nghe","stem":"1番：男の人はこの後まず、何をしなければなりませんか。","options":["けいやくしょを、かくにんする","山下食品に納品に行く","工場に納品日の変更を依頼する","山下食品と打ち合わせをする"],"ans":3,"blind":false},{"no":68,"sec":"nghe","stem":"2番：男の職員は来月号の表紙をどのように修正しますか。","options":["のせる写真を増やす","鳥の説明を加える","見出しの表現を変える","目次を入れる"],"ans":3,"blind":false},{"no":69,"sec":"nghe","stem":"3番：女の人はアルバイトの人を探すために何をしますか。","options":["大学時代の同級生に声をかける","大学院のこうはいに連絡を取る","大学の学生課に求人を出す","大学の先生に紹介を頼む"],"ans":2,"blind":false},{"no":70,"sec":"nghe","stem":"4番：受講生は今日の研修で地図に何を描かなければなりませんか。","options":["観光スポットの解説の要点","案内する道順","交通安全上、気を付ける場所","きゅうけいできる場所"],"ans":3,"blind":false},{"no":71,"sec":"nghe","stem":"5番：男の学生はこれからまず、何をしますか。","options":["食品の賞味期限を確かめる","箱の隙間に新聞紙を詰める","寄付するものの一覧を作成する","申し込みフォームに入力する"],"ans":4,"blind":false}]},{"id":"listen2","title":"聴解 問題2","sec":"nghe","instr":"問題2：まず質 す。\n一生の仕事\n自分の作品を読み返さぬ日はないと言っていい。\n書斎の手近な場所に全著作を収めた棚があり、読書や執筆に倦んだ(注1)ときには適当に一冊を抜き出して読み始める。退屈して寝てしまうときもあれば、仕事をそっちのけで読了してしまうこともある。\nまさかナルシストではない。復読に耐えるほどたいそうな [41] 。わが子はよその子よりもかわいいと思う親の情である。\n読みながら勝手に感心したり、あきれ果てたり、 [42] 。\n気に入らない点があるのなら書き直せば良さそうなものだが。どうしてもできない。単行本を文庫本にするときですら。校閲上の明らかな誤りの他にはまず筆を入れるということがない。横着なわけではなく、読めば読むほどその文章を書いていたころの自分を [43] のである。いくらか齢(注2)を食ったからといって、齢なりに懸命であったおのれの文章を滅ぼすことは忍びないし、その間に得たものも多いが喪ったもの(注3)もまた多かろうと思えば勇気も要る。\n出来栄えのいかんに関わらず、自分なりに全きをめざしていたのである。そうした過去の自分には敬意を払い続けねばならないし、また同時に現在の自分は、未来の自分に恥じぬ小説を書かねばなるまい。一生の仕事 [44] そうしたものであろうと思う。\nかにかくに、この短い文章もいつか読み返して愕然とするのであろうが。\n(注1)倦(あぐ)んだ：疲れた\n(注2)齢(よわい)：年齢\n(注3)喪(うしな)った：失った","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["小説であってもだ","小説でもあるまい","小説なのであろうか","小説なのではないか"],"ans":2},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["褒めたり叱ったりする","褒めたり叱ったりしたほうがいい","褒めたり叱ったりするようだ","褒めたり叱ったりしても仕方ない"],"ans":1},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["否定せずにいられなくなる","否定しがちになる","否定できなくなる","否定するようになる"],"ans":3},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["も含めて","でない限り","にしても","とは"],"ans":4}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"情報社会、あるいは情報化社会と言ってもいいですが、そこで懸命に生きていこうとすると、まず出てくる悲鳴があります。つまり、あまりにも多くの情報があって、その中のどれが本当なのか、何を選んだらいいかわからない。今、流行っているものの情報に熱心であればあるほど、世間で流行っていることを知らないと自分が遅れるんじゃないか、という焦りみたいなものが人間を突き動かすのが情報化社会の特徴です。","items":[{"no":45,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["情報を求める人ほど、知らない情報があることに不安を感じる。","情報を得ることに熱心な人は、世間で流行っていることしか知らない。","多くの情報から必要なものが選べなければ、世間から遅れてしまう。","流行っているものの情報に熱心なだけでは、情報化社会で生きられない。"],"ans":1}]},{"passage":"以下は、「書くこと」について述べたものである。\n「思ったこと」や「考えたこと」という抽象的な存在が文字という具体的な存在に変化した瞬間、その筆者は自分自身の「思ったこと」や「考えたこと」を、直接、自分の目で「見た」ことになる。つまり、客観的に「観察」することになるわけだ。「書くこと」は「読むこと」。自分の文章を読みながら書き進めるのが、「書く」という作業なのである。観察はほとんど必然的に「批判」のこころを呼び起こす。「思ったこと」や「考えたこと」の浅さや甘さを、書いた瞬間に思い知らされるのである。","items":[{"no":46,"sec":"dokkai","stem":"筆者によると、「書くこと」によってどうなるか。","options":["自身の新しい考え方に気づく。","自身の意見を具体的に伝えられる。","自身の意見を批判的に見ることができる。","自身のこころの変化を観察することができる。"],"ans":3}]},{"passage":"昔と比べてモノが売れなくなり、広告の働きも悪くなっていることから、表現の面白さや新奇性ばかりに走ってしまう…要は、本来、最も大切であるはずの消費者心理のツボを十分に突ききれていない、分析しきれていない、いわば表面上の、表現にこだわった広告が増えているように感じます。\n消費者心理は「本質」、表現は「伝え方」とも言い換えられますが、最も大切な本質を重視せず、表面上の伝え方ばかりに重きが置かれるようになっている状況は、いかがなものでしょうか？本質なきところに良い伝え方など存在するはずがないのです。","items":[{"no":47,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["消費者心理を捉えた広告作りは、昔より難しくなっている。","消費者心理を捉えていないのは、良い広告とは言えない。","消費者心理を捉えていれば、広告は表現にこだわる必要はない。","消費者心理を捉えているだけでは、効き目のある広告にはならない。"],"ans":2}]},{"passage":"語り合えば語り合うほど他人と自分との違いがより繊細にわかるようになること。それが対話だ。「わかりあえない」「伝わらない」という戸惑いや痛みから出発すること。それは、不可欠なものに心を開くことである。そのことで、ひとはより熱い対話をすることができるようになる。対話のなかでみずからの思考をも鍛えていく。よくよく考えたうえで口にされる他人の異なる思いや考えに、これまたよく耳を澄ますことで、じぶんの考えを再点検しはじめるからだ。","items":[{"no":48,"sec":"dokkai","stem":"対話について、筆者はどのように述べているか。","options":["他人とじぶんの違いが大きいほど、熱い対話ができる。","他人との思考の違いを把握することで、自身の思考が深められる。","わかりあえないという戸惑いや痛みが克服でき、他人と共感できる。","思いや考えを表現する能力が鍛えられ、他人に理解してもらいやすくなる。"],"ans":2}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"「常識を疑ってみる」ということ、実はそれが学問の始まりでもあります。勉強が「強いて勉める」という受動的な側面を持つものであるならば、学問は「問うで学ぶ」ことであり、極めて能動的な行為です。自ら主体的な行為として問うことを通して、常識とされてきたものの見方を疑い、それを少しずらすなどして、別の見方を見出そうとしていきます。学問の「正解」はひとつとは限りません。学ぶこととは、単純に知識を増やすということではなく、ましてやテストで覚えたことを吐き出すことでもなく、それを自分のものとして再編成していくことであり、さらに言えば自分の物差しが変わり、自分自身が変わっていくことなのです。そして、思いがけない大発見や、独創的なアイデアが生まれるかもしれません。\n「<span class=\"underline-q\">疑う</span>」という言葉は、通常は否定的な意味で使われます。「人を疑う」と言えば、普通はその人を信用しないというのと同義なわけです。私も、人を疑って生きるよりも、できるだけ人を信じて生きていたいと思っています。しかし、世の中で当たり前とされている事柄を「疑う」ことが必要な時もあります。「常識だから」という一言で目を閉ざし、それに安易に取り込まれてしまうことなく、そこを少しずらしたところに面白いことを見出していくために。それは、何事も信用しないというような厭世的な生き方に繋がるのでなく、むしろ創造的で豊かな世界を紡ぎだしていくための、積極的な営みなのです。","items":[{"no":49,"sec":"dokkai","stem":"筆者によると、学問とはどのような行為か。","options":["「正解」を求めて、自ら主体的に問い続けていく行為である。","独創的なアイデアを生み出すために、自らのものの見方を変える行為だ。","自ら問いながら、ものの見方を模索しながら自分自身が変わっていく行為だ。","新しい知識を積極的に取り入れることで、自分自身を変えていく行為だ。"],"ans":3},{"no":50,"sec":"dokkai","stem":"学問で「<span class=\"underline-q\">疑う</span>」ことについて、筆者の考えに合うのはどれか。","options":["何を信じればいいのかを理解するのに欠かせない行為だ。","豊かに生きるために、新しい常識を作りだす積極的な行為だ。","常識に安易に取り込まれないために必要だが、否定的な行為だ。","常識に縛られずに、これまでと異なる考え方を生み出す行為だ。"],"ans":4}]},{"passage":"春に美しい花をさかせるカタクリは、アリに種まきをさせるという驚くべき戦略を持っている。\nカタクリの種は熟すのは花が咲いてから、およそ2ヶ月後だ。はじけて地面に落ちた種は、すぐにアリがやってきて巣に運んでいってしまう。薄茶色の種の先に白い部分がある。これが脂肪分に富んだエライオゾームと呼ばれるものだ。アリはこの部分に惹かれる(注1)ことが分かっている。エライオゾームはアリにとってそれほど魅力的な物質であるらしい。\n運ばれた種はアリの巣に貯蔵されることになるが、アリは二日もすると、せっかく運び込んだ種を巣から運び出してしまう。種は巣の中深いところに持ち込まれても発芽できないから、これはカタクリにとって好都合だ。どうしてアリはせっかく集めた種を棄ててしまうのだろうか。\n実は熟して地上に落ちたばかりのカタクリの種についているエライオゾームは、アリの幼虫が共通して持つにおいに近い物質を持っているのだという。アリは種を食べ物として集めるわけではなく、自分の幼虫と思って巣に持ち帰るらしいというわけだ。ところが種がはじけてから24時間もすると、アリの死んだ幼虫のにおいに変わるのだそうだ。それで今度はアリは種を巣の外に捨てに行くのだというから恐れ入ってしまう。\n(注1)惹かれる:心が引きつけられる","items":[{"no":51,"sec":"dokkai","stem":"筆者によると、アリはなぜカタクリの種を巣に運ぶのか。","options":["種についている脂肪分がアリの好物だから。","種はアリの成長に欠かせない栄養分だから。。","種がアリの餌になる幼虫に似ているから。","種をアリの生きた幼虫だと思うから。"],"ans":4},{"no":52,"sec":"dokkai","stem":"筆者によると、アリはなぜ集めた種を捨てるのか。","options":["種のにおいで、アリの幼虫が死んでしまうから。","種からアリの死んだ幼虫のにおいがするから。","種がアリの死んだ幼虫と同じ色に変わるから。","種がはじけて、アリの嫌うにおいを出すから。"],"ans":2}]},{"passage":"子は親の鏡と言われる。こどもを見れば親が分かるということだが、こどもは親のしぐさ、もの言いを実によく見ている。三つにもなれば如何にも(注1)生意気で反論などをするものだが、<span class=\"underline-q\">「そんな言い方をするもんじゃない」と言ったら負けだ</span>。「あら、あなたの言い方とそっくりよ」と横からチクリと揶揄される(注2)のがオチだから。全くこどもは物真似の名人なのである。\nアイドル歌手からくまのプーさんの喋り方まで、見境なく(注3)貪欲にコピーしてしまう。コピーすることによってこどもたちはすべてを獲得してゆく。こどもたちは個性的であろうなどと少しも考えない。みんなと同じじょうにできることが嬉しくてたまらないのだ。\nだが、こどもの再現のありさまを少し注意深く観察していると、この性能の良い複写機の、本当の性能の良さが見えてくる。大人たちの考えるコピーとはいささか違うのである。こどもたちの身体的能力、言語的能力は未熟なのでオリジナルなものの完璧なコピーはできない。\n従ってこどもはオリジナルなものを自由に改変する。切り捨て、誇張する。それはオリジナルなものからの絶妙な逸脱なのである。この模倣行為は、むしろ、一人のこどもの生きる生活全体のなかで、今全く新しく意味付けられた別のオリジナルなものが生成していると言ってもいいものなのだ。\nこどもが模倣をしながらも、とりわけ個性的であるのは、このような模倣モデルからの自由な逸脱があるからだ。私たちがこどもを見て楽しむのも、その逸脱のほほえましさなのではないか。\n(注1)如何(いか)にも:見るからに\n(注2)揶揄(やゆ)される:からかわれる\n(注3)見境(みさかい)なく:区別なく、何でも","items":[{"no":53,"sec":"dokkai","stem":"<span class=\"underline-q\">「そんな言い方をするもんじゃない」と言ったら負けだ</span>とあるが、なぜか。","options":["こどもの成長を否定しているようなものだから。","こどもの反論が正しいと認めるようなものだから。","自分で自分を注意しているようなものだから。","自分がこどもと同じレベルで答えるようなものだから。"],"ans":3},{"no":54,"sec":"dokkai","stem":"こどもの模倣について、筆者はどのように考えているか。","options":["完璧にはコピーできないことが、個性につながっている。","完璧にコピーしようとしているが、本質は捉えられていない。","オリジナルなものを自由に変えて、おとなを楽しませようとしている。","オリジナルからの逸脱を気にせず、自分の個性を表現しようとしている。"],"ans":1}]},{"passage":"人々の肉体には、実は大きな幅がある。生まれ持った個性があり、成長の段階で著しく改変するこうした人間が使用するものを作る際の方向性には、二つの選択肢がある。一つは、異なる体格や身体能力を持つ多数の人々が同じものや環境を平等に使えるようにする方法。もう一つは、それぞれの体格や能力に合わせて、いくつかのサイズや機能を用意する方法である。前者は経済的に有利な試みだが、その効果に限界があるケースが多い。後者は多様なユーザーに対応できるが、開発に時間がかかり、しかも作られたもののコストが上昇してしまうという問題性を孕んでいる(注1)。\nユニバーサルデザイン(UD)では、使い手の様々な問題負担を抑えつつ、個人に不平等感を抱かせないデザインやものづくりを求められている。デザインに平等という意識を上手に反映させていくために、多様な使い手とできるだけ接触し対話を行い、使い手に対する知識と体験を広げることが効果的だ。私たちは平等という感覚をどのようなときに感じ、考えるのかという点を、見つめ直したい。\n私たちが平等かどうかを意識するのは、確かな不平等の予感や印象を持つときであることは間違いない。平等がきちんと保証されている場合、その状況は私たちにとって自然なことであり、問題意識が芽生える(注2)ことはない。しかしデザインやものづくりに当たっては、問題が発生してから平等について考えるのではなく、ものやサービスに常に必要な普通の意識であるととらえたい。\n(注1)孕む:含む\n(注2)芽生える:生まれる","items":[{"no":55,"sec":"dokkai","stem":"人間が使用するものを作る際の問題点について、筆者が述べていることはどれか。","options":["同じもので多様な使い手に対応すると、そのものの効果に限界が生じる。","同じものを多様な使い手に対応させるには、開発に時間がかかりすぎる。","個別の使い手に対応すると、そのものの効果が見えにくくなる。","個別の使い手に対応すると、平等にものが使えなくなる。"],"ans":1},{"no":56,"sec":"dokkai","stem":"ユニバーサルデザインにおけるデザインやものづくりについて、筆者が最も言いたいことはなにか。","options":["多様な使い手が、平等だという感覚が持てるものを作り出すべきだ。","使い手が不平等だと感じたら、原因を究明しなければならない。","すべての使い手にとって平等であるものにすることは難しい。","常に使い手にとっての平等について考えなければならない。"],"ans":4}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"以下は、筆者がほかの研究員とともに開発したロボットについて書かれた文章である。\n通常、ロボットに対するプログラミングは、センサから取得した情報に応じてロボットが何らかの反応をするようなものを作っていく。たとえば「障害物を察知したら避ける」といった具合のものである。しかし、・僕はロボピーがもっと適当に、意味のない動きも含めてさまざまな行動を取るようにしたのだ。\n300以上の動作プログラムをし、動作パターンが次々にどういう順番で発現するかというルールを700以上プログラムした。その結果複雑に、多様に動くロボットが実現された。ここまでやると、自分たちでもプログラムがどう作用するかわからなくなる。何に反応して、どんな行動をするか予測不能になった。\nそんなプログラミングをしておいたロボピーを研究室に置いていたら、何が起こったか。僕らがミーティングをしているとき、突然ロボピーは僕らの音声を認識し、「そうではないよ」と言って手をぶらぶらさせながらどこかへ向かって歩きだしたのだ。それを見て僕らは呆気にとられながらも、ロボピーに意思を感じてしまった。僕らの話を聞いていて、彼は思うところがあり、だからどこかへ行ってしまったのだろう、と。\nもちろんそれは、ロボピーの中のあるプログラムが、何かをきっかけに作動しただけのことだ。だがなにか首尾一貫したひとつの意思決定機構から生み出された行動であるかのように見えたのだ。\n僕はそのとき確信した。「心とは、観察する側の問題である」と。\n非常に単純な機械の動きに「心を感じますか」と問えば、感じると言う人は少ない。多少複雑でも、原理を知っていれば「それは心ではない」と言う。しかし、人間は複雑である。いや、虫程度でもいい。動きが相当以上に複雑なものに対しては、相手のことを一から、すべては理解しきれない。自分の頭の中で完全に再現しきれない、解釈しきれない、理解しきれないほど複雑なもの、仕組みがよくわからないくらい入りくんだものが目の前にあると、「こいつは、私の知らないところで勝手に独立して考え、動いているのだろう」という想像が働く。その浮かんできた想像に名前をつけずにはいられなくなる。それを「心」と呼んでいるのだ。\n心とは、複雑に動くモノに現実的にあるというより、その動きを見ている側が想像しているものなのだ。\nそしてその心は、見ている側の自分にもないと都合が悪い。とくに人間同士であればお互いに「心がある」と感じてしまっている。だからひとはみな「自分には心がある」と思う。しかし心は、実は自分の中にいくら問い合わせ、内省してみてもしょうがない。相手を観察し、想像することでしかわからないものなのだ。","items":[{"no":57,"sec":"dokkai","stem":"ロボピーが、ほかのロボットと異なる点は何か。","options":["動作パターンが限られているので、ある程度動きが予測できる。","与えられた情報の一部を自分で判断して動くので、動きが予測できない。","どう動くかというプログラムを多数組み込んだので、動きが予測できない。","多様で複雑な動作をプログラムしたので、人間のように自然な動きができる。"],"ans":3},{"no":58,"sec":"dokkai","stem":"どこかへ向かって歩きだしたとあるが、その時筆者にはどのように思えたか。","options":["プログラムに間違いがあり、ロボピーに意思が生まれて動いた","プログラムが作動したのではなく、ロボピー自身が考えて動いた。","プログラムが作動して、意思があるかのようにロボピーが動いた。","プログラムが誤作動して、制作者の意図に反してロボピーが動いた。"],"ans":3},{"no":59,"sec":"dokkai","stem":"「心」について、筆者はどのように考えているか。","options":["あると思って観察すれば、複雑な動きの意図が理解できる。","実体がないので、あるとかないとか想像しても意味がない。","仕組みが複雑すぎるため、人間同士であっても想像できない。","理解しきれない複雑な動きを見たときに、人間が想像するものだ。"],"ans":4}]},{"label":"Mon11","passage":"A\n私は普段からメモ魔（注）ですが、人の講演に行くと、必死にメモを取りながら話を聞きます。せっかくその場にいるのだから、最大限吸収して帰ろうと考えます。あるいは友達とくだらない話をしている時でも、「あれ？」と思ったことや、「いい話だ」と思ったことは、何でもその場でメモを取るようにしています。そこで感じた何かや、新しく知り得たものは、別の機会に自分の役に立つかもしれないからです。\n新しい発想や考え方のヒントを得たいといつも問題意識を持っていれば、何気ない人の発言のなかにも発見があるはずです。メモを取らなければ忘れてしまいますので、必然的にメモを取ることになります。手を動かして、記録を取る結果、記憶にも残りやすくなります。こうして意識化・可視化することが大切なのです。\nB\n話を聞いている時に、視線も上げずにただひたすらメモを取っている人がいる。熱心さは伝わるが、質問もされないと興味や関心を持って聞いてもらえているのか不安になる。このような人は、メモを取ることが目的になってしまっているのではないか。多くの情報を正確に書きとることに集中してしまい、肝心な内容が頭に入っていないのだ。\nしかしどんなに正確にメモを取ったとしても、内容が理解できていなければ、あとでメモを活かすこともできない。受け身ではなく、自分に必要な情報は何か、自分だったらどうするかというように自分と関連付けて、主体的に考えながら聞くことが必要だ。メモは、あとで話を整理する際の手がかりになれば十分である。\n(注)メモ魔:何でもメモを取る人","items":[{"no":60,"sec":"dokkai","stem":"メモを取ることについて、AとBはどのように述べているか。","options":["AもBも、量よりも書きとる内容を意識して取ることが重要だと述べている。","AもBも、できるだけ多くの情報を正確に書き取ったほうがいいと述べている。","Aは内容を活用するために必要だと述べ、Bは取ることに集中し過ぎては意味がないと述べている。","Aは問題点や感想なども一緒に記入したほうがいいと述べ、Bは話の内容を理解していなければ正確には取れないと述べている。"],"ans":3},{"no":61,"sec":"dokkai","stem":"話の聞き方について、AとBの認識で共通していることは何か。","options":["何かを得ようという姿勢で聞くことが重要だ。","その場ですべてを理解しようとしなくてもいい。","手を動かしながら聞いたほうが、記憶に残りやすい。","興味や関心を示し、話し手に安心感を与えることが大切だ。"],"ans":1}]},{"label":"Mon12","passage":"企業にとっても、人々にとっても、さきのみえない不安な時代である、そしてそんな不安な時代を生きる子供たちに、「生きる力」をつけさせたいという「親心」は、わからないではない。また企業の経営者が、少しでも優秀な人材を取り込みたいと考えるのは、必然ではあるだろう。地域の衰退や産業の空洞化を食い止められる人間が現れてくれれば、わたしたちの不安な気持ちも、いくぶんなりとも和らぐというものである。\nしかし、まがりなりにも教育学を専門とする者として、ここは言わせてほしい。現代日本社会の問題を、なんでもかんでも教育で解決しようというのはいただけない。\n確かに教育は、人間を育てることを通じて、人々の人生や社会の未来に対して、一定の貢献を為すことができる。しかしわたしに言わせれば、そのような教育の役立ちの度合いは、決して大きいものではない。教育には不確定性がつきものである。これはもう、教員養成のテキストでも論じられる「教育学の基本のキ」だ。教えたからといって、その分だけ子どもが育つというわけではないし、教えたつもりがないのに、子供の方が勝手に学んでいるということもある。もちろん教師も教育学者も、その確率論的な育ちをどうにかして望ましい方向に向ける努力はするが、なんと言っても育つのは子どもなのだから、「最小限のコストで最大限のメリットを達成しなさい」「必要な人材をきっちりきっかり、耳をそろえて(注1)社会に納品しなさい」などという注文を、そうそう請け負うことはできない。\nそれにそもそも教育は、経済のためだけのものでも、共同体の維持のためだけのものでも、家族のためだけのものでもない。市場も、国家も、地域共同体も、そして家族も、もっと役に立つ教育をしろ、意味のある教育をしろと言うけれど、それぞれ注文はバラバラなのである。もちろん教育は、それぞれの要求に(確率論的に)少しずつ貢献はする。しかしそれをもって推し進めて、どれかの目的のためだけに合理化・効率化しようとすれば、教育はずいぶんと歪な(注2)ものになる。まして、みんながみんな教育からそれぞれの利益を引き出そうと躍起になっても(注3)、そんな過剰な期待に引き裂かれた教育がうまく機能するとは思えない。\n(中略)\n停滞の続くこの社会で、誰もが不安に押しつぶされ、ちょうどその分だけ教育に過剰な期待や希望を託そうとしている。その結果、教育、なかでも学校教育が、改革の波に呑まれ、余裕をなくしそうになっている。教育に多くをもとめすぎると警報を鳴らすことは、結果的に、この社会と教育を持続させるためにいま一番必要なことなのではないだろうか。\n(注1)耳をそろえて：不足なく(注2)歪な：ゆがんだ(注3)躍起になっても：必死になって","items":[{"no":62,"sec":"dokkai","stem":"決して大きいものではないと考える理由として、筆者が述べているのはどれか。","options":["企業や社会が望む人材と、教育学で目標とする人材は異なるから。","「生きる力」をつけるために必要なことは、明確ではないから。","子ども一人一人に併せて、教育の内容を変えられないから。","子どもは、教えたとおりに育つとはかぎらないから。"],"ans":4},{"no":63,"sec":"dokkai","stem":"教育について、筆者の考えに合うのはどれか。","options":["それぞれの目的に合わせて合理化・効率化しなければ、機能しない。","みんなで一つの目的を共有しなければ、効果は上がらない。","特定の目的を果たすために存在するものではない","役に立つかどうかという観点で評価されるべきだ。"],"ans":3},{"no":64,"sec":"dokkai","stem":"筆者が最も言いたいことは何か。","options":["多様な社会の要求に応えられるように、教育のあり方を考え直すべきだ。","社会の不安を取り除くためには、教育を合理化・効率化すべきではない。","教育の改革によって、安定した社会を持続させていくことが必要だろう。","現代社会の問題のすべてが、教育で解決できると思ってはいけない。"],"ans":4}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"木原市健康づくりセンター　いきいき運動教室のご案内\n健康のために、楽しく運動しませんか。健康づくりセンターでは、三つのクラスを毎週開講しています（通年開講）。1回ごとの予約制なので、ご自分のペースで受講ができます。\n【対象】\n下の①、②両方に当てはまる方\n① 市内在住、もしくは市内で勤務している、18歳以上の方\n② 健康づくりセンターの健康度測定を、受講日から過去1年以内に受けた方\n※健康度測定の内容や予約方法等の詳細は、ホームページでご確認ください。\n水曜日　ダンスA　初心者でもできるゆっくりしたダンスをします。\n木曜日　ダンスB　リズムに合わせて速く動くダンスをします。\n金曜日　体操　全身を使った体操をします。\n〈時間〉10:40-11:00　〈会場〉第一運動室　〈料金〉1回500円\n【利用方法】\n◆予約の仕組み\n・申し込みは各クラス毎回必要で、先着順です（各クラス定員20名）。\n・予約の種類は、基本予約と追加予約があります。\n　基本予約：すべてのクラスの中から週に1回分だけ予約できます。基本予約は、受講日の前の週から可能です。\n　追加予約：実施日の2日前に定員に達していないクラスに限り、基本予約1回分のほかに追加予約ができます。追加予約が可能な回数は週1回のみです。\n　空きは2日前から、健康づくりセンター窓口か電話で確認できます。\n◆予約方法\n・いきいき運動教室の予約が初めての方は、健康度測定の結果票をお持ちになり、窓口で予約してください。受講者カードを作ります。\n・予約が2回目以降の方は、健康づくりセンターにある予約機か電話でしてください。\n◆料金の支払い\n・受講日当日に、自動受付支払機で料金を支払ってください（受講者カードが必要です。忘れた方は窓口で対応します）。\n木原市健康づくりセンター　電話：02-1124-45","items":[{"no":65,"sec":"dokkai","stem":"次の4人は今年の4月に、運動教室を受講したいと考えている。この中で、この教室を受講できる人は誰か。\n\n【ダニエルさん】54歳／住んでいる所：木原市内／勤務地：木原市外／健康度測定：去年の1月に受けた\n【木村さん】34歳／住んでいる所：木原市外／勤務地：木原市内／健康度測定：去年の10月に受けた\n【大川さん】16歳／住んでいる所：木原市内／勤務地：なし／健康度測定：今年の2月に受けた\n【チンさん】27歳／住んでいる所：木原市内／勤務地：木原市内／健康度測定：今年の5月に受ける予定","options":["ダニエルさん","木村さん","大川さん","チンさん"],"ans":2},{"no":66,"sec":"dokkai","stem":"シャヒンさんは、来週の「ダンスA」を予約したが、空きがあれば来週の「体操」も追加予約したいと考えている。どうすればいいか。","options":["来週の月曜日以降に窓口か電話で空きを確認し、空きがあれば、窓口で予約する。","来週の月曜日以降に窓口か電話で空きを確認し、空きがあれば、予約機か電話で予約する。","来週の水曜日以降に窓口か電話で空きを確認し、空きがあれば、窓口で予約する。","来週の水曜日以降に窓口か電話で空きを確認し、空きがあれば、予約機か電話で予約する。"],"ans":4}]},{" c":"bunpo","instr":"次の文の ★ に入る最もよいものを 1・2・3・4 から一つ選びなさい。","items":[{"no":36,"sec":"bunpo","stem":"秋の初めてのこの時期は、真夏の戻った（　　）（　*　）（　　）（　　）、気温の差が大きくて体調を崩しやすいので、注意が必要だ。","options":["日もあり","日もあれば","ひんやりとした","かのような"],"ans":2},{"no":37,"sec":"bunpo","stem":"歴史的価値が高いとされる旧日本小学校の校舎を始めて見たが、とても（　　）（　　）（　*　）（　　）驚いた。","options":["100年前に","現代的なデザインに","建てられたものとは","思えないほどの"],"ans":4},{"no":38,"sec":"bunpo","stem":"くしゃみや鼻水といった症状が現れる花粉症は、風邪と（　　）（　　）（　*　）（　　）ケースもあるそうだ。","options":["自覚がない","自分は花粉症だという","症状が似ている","こともあって"],"ans":2},{"no":39,"sec":"bunpo","stem":"高校卒業後の進路について両親に反対されたが、誰に何と（　　）（　　）（　*　）（　　）思う。","options":["思える道を","信じて進みたいと","言われようとも","自分がこれだと"],"ans":1},{"no":40,"sec":"bunpo","stem":"企業の海外進出が成功するかどうかは、（　　）（　　）（　*　）（　　）といってもいいだろう。","options":["優秀な人材を確保できる","にかかっている","か否か","その国の事情をよく知る"],"ans":3}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、「41」から「44」の中に入る最もよいものを 1・2・3・4 から一つ選びなさい。","passage":"以下は、新聞のコラムである。\n昔に比べてレストランのメニューに修飾語が増えたと感じる。「プリプリ海老の○○パスタ」「とろ〜りチーズ入りのハンバーグ」「××県産のやわらか若鶏の△△」といった感じだ。付加価値や希少価値をアピールして、商品の差別化を図りたいのだろう。\nこれらの修飾語は [41] 食欲を刺激し期待感を高める。でもよくよく考えると、差別化の中身は実にあいまいだ。プリプリ海老の定義は？チーズはみな、とろ〜りするのでは？××県産が品質保証になるのか？\n実質的な中身を伴った新商品の開発が困難になっていく高度消費社会では、見せかけの新しさで消費を刺激しようとする傾向が強まる。商品のパッケージを新しくしたり、商品名の変更が頻繁に行われたりするのも [42] 。消費社会とは、商品の差別化戦略によって中身の空虚な(注1)ネーミング(注2)が氾濫し、消費者がそれに踊らされる世界ではないのか。\nそのような社会は、私たちの言語感覚 [43] 変えてしまう可能性がある。商品の差別化競争に終わりがないなら、修飾語こそが肝要になる。つまり、修飾語を伴った呼称がデフォルト(注3)となり、裸の名詞が空虚に感じられるようになるかもしれない。\n何十年かすれば、生物としての海老という記号は空洞化して、おいしそうな食材としての修飾語が不可欠な要素となり、「海老」は「プリプリ海老」、「海老のチリソース」は「プリプリ海老のチリソース」と呼ばれているのだろうか。\n私たちは、増殖する見せかけの新しさに囲まれながら、空虚な記号と戯れ続ける(注4)しかないのか？メニューに並ぶ修飾語は、消費社会の遠い未来からの [44] 。\n(注1)空虚な：実質的な意味がない\n(注2)ネーミング：名前を付けること\n(注3)デフォルト：標準\n(注4)戯れ続ける：ここでは、付き合い続ける","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["むしろ","かえって","たしかに","ようやく"],"ans":3},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["それ以来だ","それだけだ","そのままだ","そのためだ"],"ans":4},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["が","すら","なら","でもって"],"ans":2},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["使者のようでもある","使者とのことである","使者だとは言えない","使者にもなり得まい"],"ans":1}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"「嫌い」はネガティブな(注)感情で、まさに嫌悪感をもってしまいがちですが、自分の中に芽生えてきた大切な感情であり、大事な機能でもあります。何より根絶できません。\n「嫌い」はとてもパワーを必要とする感情ですから、それだけに反動も大きい。振り回されないための第一歩は、嫌いを認めることです。ネガティブな感情でも、もつことは自然なことであり、生きる上でメリットになる、そして周囲の人にもメリットがあると捉えてみてください。\n(注) ネガティブな：否定的","items":[{"no":45,"sec":"dokkai","stem":"「嫌い」の感情について、筆者の考えに合うのはどれか。","options":["否定的で強い感情であり、振り回されても仕方がない。","なくせない感情であり、受け入れたほうがいい。","認めることで、その感情を抑えることができる。","理由を考えれば、振り回されることはない。"],"ans":2}]},{"passage":"安く売るべきか、品質にこだわるべきか。事はそんなに単純ではない。どんなに良い商品であったとしても、できるだけ価格を抑えるための努力は必要だ。品質にこだわる戦略というのは、品質さえ良ければどんなに高くても買ってもらえるという短絡的な戦略ではない。\nできるだけ価格を抑える努力はしているけれども、それでも品質にこだわるとこれ以上は安くできない。他社の商品よりも高いのだけれども、それだけの価値はある。だからその差額を許容してほしい。そう訴えることが、品質にこだわった正しい戦略である。","items":[{"no":46,"sec":"dokkai","stem":"品質にこだわる戦略とは、どういうことか。","options":["品質に見合った価格であると主張する。","品質の良さと価格の低さを主張する。","価格に合わせた品質であると主張する。","価格よりも、品質の良さを主張する。"],"ans":1}]},{"passage":"時には、自らに「素朴な質問」を投げかけてみてはどうだろうか。子どもが親に尋ねるような「素朴な質問」というものは、意外にも人生や生きることの本質にかかわることであり、人生論や哲学の課題であることが少なくない。そうした質問を真正面から投げかけられたとき、はっと何か気づかされるところがあって、自分の日常を反省するような反応を示さないとしたら、その人の感性は相当に(注)枯れていると考えたほうがよい。\n(注) 相当に：かなり","items":[{"no":47,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["素朴な質問に向き合って、日常を省みることが必要だ。","親が子どもから人生の本当の意味を教わることもある。","大人になると、子どもが尋ねるような質問をすることは難しい。","感性を磨くには、子どもが投げかけた素朴な質問に答えるとよい。"],"ans":1}]},{"passage":"科学とは、知れば知るほどわからないことが増えてくるものである。自分は何も知らなかったと思い知らされるのが科学者の日常と言える。\nつまり、科学者は研究を極めれば極めるほど謙虚になる。自分の無知さを知って謙虚にならざるを得ないのだ。\nその観点から言えば、知ったかぶりをする(注)科学者はもはや研究をストップしており、それまでに得た知識を誇っているに過ぎないと言うことができる。もはや過去の人であり、その知識は時代遅れになっている可能性が高いのだ。\n(注) 知ったかぶりをする：知っているふりをする","items":[{"no":48,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["科学者は時代に合った知識を持つべきだ。","科学者は研究を続けることでより謙虚になるものだ。","謙虚であれば、よい科学者として認められるものだ。","どんな科学者であっても、自分の無知を自覚しているものだ。"],"ans":2}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"ともすると私たち大人は、自分たちの子ども時代の遊びはよくて、今の子どもの遊びは好ましくないと考えがちです。(中略)今はダメで昔はよかったというような感覚をもって、今の子どもの遊びについて考えると、<span class=\"underline-q\">とんでもないことになります</span>。子どもたちが嬉々として(注)遊んでいるものを取り上げて、今の時代ではおもしろくないような遊びを、無理に押しつけることになってしまいます。そうなると遊びが遊びでなくなってしまいかねません。\nまた、私たちが考える好ましい遊び環境となると、なぜかとても整理された空間になりがちです。たとえば画一化された公園を見ると、ムダなく機能を重視したオフィスを連想させさえします。限られたスペースで、しかも安全性や管理の問題を考えればそうならざるをえないのかもしれませんが、それでは子どもが遊びたいと思わなくなるのです。\n子どもたちの遊び空間には、もしかしたら不自由さや不便さ、大人がムダだと思えるようなものも必要かもしれません。配慮の行き届きすぎた場所は、遊園地という商業施設は別として、子どもたちが自由に遊べる環境としては好ましくないのではないでしょうか。\n子どもたちの遊び環境について考えるときに大切なのは、私たち大人の側にあるそのような先入観です。自分は子どものころにこんな遊びをした。今の子どもはそれをしていない。だから今の子どもは遊んでいない。こんな単純な考え方では、決して子どものためになる遊び環境など考えることはできません。\n(注)嬉々として:喜んで","items":[{"no":49,"sec":"dokkai","stem":"<span class=\"underline-q\">とんでもないことになります</span>とあるが、どうなるのか","options":["子どもが子ども同士で遊べなくなる。","子どもが自由に遊びを楽しめなくなる。","子どもが今の時代の遊びに興味をもたなくなる。","子どもが安全に管理された場所でしか遊べなくなる。"],"ans":2},{"no":50,"sec":"dokkai","stem":"筆者が言いたいことは何か","options":["大人は子どもの遊びに干渉するべきではない。","大人は安全性を考えて、遊び環境を整えなければならない。・","大人は先入観をもたずに、子どもの遊び環境を考えるべきだ。","大人の先入観が遊び環境を考えるうえで役に立つこともある。"],"ans":3}]},{"passage":"私たち人間は、いろいろなものを食べる雑食性動物です。それに対し、基本的にパンダはササだけを食べ、コアラ(注1)はユーカリの葉だけを食べます。動物の生き残り戦略を考えると、雑食性動物の方が、慣れ親しんだ食べものが入手困難な状況になったとしても、それ以外の食べられるものへと嗜好をシフトすることによって飢餓を脱し、生存する確率を高めることができます。雑食性動物は環境適応性に優れた生きものといえます。\nしかしその一方で、新たに見つけ出した食べものが毒性をもっていたり、栄養バランスが悪いものであれば、健康を損ね、最悪死に至る可能性があります。そのため、雑食性動物は、新しい食べものを食べるときには、必ずそのリスクと対峙(注2)しなければなりません。\nすなわち雑食性動物は、食べたことのないものを食べるのを躊躇する「食物新奇性恐怖」と、積極的に食べようとする「食物新奇性嗜好」という相矛盾(注3)する行動傾向を、生まれながらに合わせもっているといえます。(中略)雑食性動物がもつ食べものの新奇性恐怖と新奇性嗜好のジレンマを解消してきたもののひとつが、人の「調理」という行為です。食べたことのない食材、たとえば昆虫をそのままの“原型”で出されると、拒否感を抱く人が多いですが、粉にしてチップスなど、見慣れたお菓子のかたちで提供されれば、食べる人は確実に増えます。さらに慣れ親しんだ調味料で味付けしたものなどてあれば、「あっ、意外とおいしい」と好評価を得るかもしれません。この調理という操作が、新奇なものを食べるという恐怖を緩和させるのに一役(注4)買っています。\n(注1)コアラ:動物の一種\n(注2)対峙する:ここでは、向き合う\n(注3)相~:互いに~\n(注4)一役買う:ここでは、役立つ","items":[{"no":51,"sec":"dokkai","stem":"筆者によると、雑食性動物の特徴は何か。","options":["慣れ親しんだものを食べたいという気持ちよりも、新しい食べものへの好奇心の方が強い。","新しい食べものに対して、恐怖心をもちながらも、挑戦する性質をもっている。","いろいろなものを食べるので、栄養バランスが偏らず、生存する確率が高い。","目の前に食べものがあれば、躊躇せずに積極的に食べようとする。"],"ans":2},{"no":52,"sec":"dokkai","stem":"筆者によると、調理することでどうなるか。","options":["食材が限られていても、人間の欲求を満たすことができる。","新しい食材への好奇心は薄れるが、恐怖は解消できる。","慣れ親しんでいないものへの好奇心を高めることができる。","食べたことのないものへの抵抗感を減らすことができる。"],"ans":4}]},{"passage":"私は、自分の研究をおもしろいと思えるのと同じ程度に、他人の研究をおもしろいと思えるかどうかが、研究者に向いているか否かの判断の基準であると思っている。いくらいいデータを出す人であっても、他人のデータを自分の仕事と同じだけの熱量を持っておもしろがれなければ、研究者としてははっきり不向きであると思わざるを得ない。学者としては失格であろう。\nこれがもっとも端的にあらわれるのが、研究発表の際に見られる質問の量である。\n(中略)発表された内容を、当事者として自分ならこういうアイデアで実験をし、結果をこう解釈することもできる、明確な結論を得るためにはこの部分に不備があり、次にはこんな実験を計画すれば、もっとはっきりした結論に到達することができるのではないか、などなど、考え始めれば、おのずから尋ねたいことは次から次へ出てくるはずなのである。\n私はこれを「能動的に聞く」と言っている。人の話は、能動的に聞いてこそ、自らの身につくものである。話された内容をただひたすら覚えようとしたり、吸収しようとしているだけでは、却ってその知識は自分のものとならない。\n「能動的に聞く」とは、話された内容を、自らのこれまでの知の体系のなかに位置づけることであり、位置づけるためには、聞きつつ常に自分の知の体系を確認し、照合する作業を伴うはずである。外部からインプットされてくる内容と、既存の自らの知識の箱とのあいだに軋轢が生じるのは当然であり、その軋轢こそが質間を促す力になる筈なのだ。","items":[{"no":53,"sec":"dokkai","stem":"筆者によると、研究者として不向きな人とはどのような人か。","options":["他人の研究に、自分の研究ほどの関心を持てない人。","他人よりいいデータを出すことができない人。","自分の研究も他人の研究もおもしろがれない人。","自分の研究に、他人の研究成果を生かせない人。"],"ans":1},{"no":54,"sec":"dokkai","stem":"筆者によると、どのようにすれば質間の量が増えるか","options":["既存の知識に聞いた内容を加えて、知の体系を豊かにする。","聞いた内容と自分の知の体系を照合し、違いを意識する。","新しい知の体系のなかに、既存の自分の知識を組み込む。","自分の既存の知識に、常に疑問を持つ。"],"ans":2}]},{"passage":"企業Aと企業Bがあり、ある契約をそのどちらと取り交わすべきか考えるときに、A社は資本金1000万円、B社は資本金1億円であるという情報は、おそらく重要な情報の一つであると想定されるが、すべてではない。従業員数、年商(注)、営業継続年数、支社数・支店数、などなどのうちから、意思決定者が、意思決定の方針に基づいて重要な情報を取捨選択しなければならないだろう。そのとき、ことさらにいくつかの情報に力点を置く報告書があげられたときに、意思決定者(経営者)はそこに存在する<span class=\"underline-q\">「意図」を充分に嗅ぎ取らなくてはならない</span>。つまり、汚染されている可能性があるということである。ここで、報告された情報がすべて確実な事実であったとしても汚染は生じている可能性があるという点に注意が必要である。\nしたがって、情報汚染とは、ある情報に、本来想定しているもの以外の何かが付随していて、それによってその情報の理解が歪むことをいう。その何かとは、その情報をもたらした側の意図である。この世界に「データのみで構成されていて、そこに意図の混入が認められない」という意味での無色透明な情報など存在しない。どのような情報であっても、意図という色で染められている。そして、重要なのはそれが必ずしも汚染ではないという点である。意図が混入するのは当然のことであり、すべての情報には意図が混入しているのであるから、それだけでもってそれを汚染とまでは呼べない。\nそれが汚染となるのは、その情報に含まれる「意図」によって、その情報の本質部分である「データ」の理解が深められるからである。\n(注)年商:一年間の売り上げ額","items":[{"no":55,"sec":"dokkai","stem":"<span class=\"underline-q\">「意図」を充分に嗅ぎ取らなくてはならない</span>とあるが、なぜか。","options":["事実ではない情報が意図的に混入されているかもしれないから。","意思決定者に有利な情報が取り除かれているかもしれないから。","情報には意図が含まれていて、理解が歪められるかもしれないから。","情報をもたらす側の意図が、歪められて理解されるかもしれないから。"],"ans":3},{"no":56,"sec":"dokkai","stem":"情報の汚染について、筆者はどのように述べているか。","options":["情報が汚染されているかどうかを見抜くことは難しい。","情報が汚染されていても、受け取る側の理解に影響はない。","情報に意図含まれていても、汚染されているとは限らない。","すべての情報には意図が含まれているので、汚染されているといえる。"],"ans":3}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"以下は、森林を守るボランティア活軌をしている人が書いた文章である。\n世界的に森林や自然の維持、復元に対する関心が高まってきたとき、この気運(注1)を支えた初期の理論は、人間中心主義的な森林・自然維持論、つまり人間の生存や未来にとって森林や自然の維持は不可欠であるという理論であった。いわばそれは、人間のための森林・自然維持論であった。ところが、この考え方は、たちまち暗礁に乗り上げる(注2)。\n第一に、人間のための森林・自然維持論であるかぎり、人間のための森林・自然の開発論を否定できなくなる。なぜなら、どちらも「人間のための」という共通の基盤の上にたっている以上、その違いは価値観の違いにすぎず、人間の価値観を統一することなどできないばかりでなく、すべきでもないからである。\n第二に、「人間のための」といっても、その内容はさまざまである。農山村に暮らす人びとと都市の市民とでは、その感じ方は同じではないし、たとえば同じ山村に暮らす者でも、林業経営をしている者とそうでない者とでは、考え方が異なってくる。人と森の関係は多様である以上、どうすることが人間のための森林・自然の維持なのかと問われれば、その答えはさまざまである。\n第三に、「人間のための」という発想にたつかぎり、「人間のためにならない」自然は破壊してもよいということになりかねない。\nこうした問題点があったために、「人間のための」論は、つまり人間中心的な森林・自然維持論は、たちまち破綻してしまった。自然保護思想の流れをみるなら、それに代わって生まれた理論は、自然中心主義的な考え方であった。それは、人間のためになろうとも、ならなかったとしても、自然はそれ自身のうちに生存権をもっており、その生存権は保障されなければならないというものであった。\nところが、この考え方にも問題点があった。なぜならこの理論では、原生林や原生的な自然を維持する理論としては有効でも、たとえば日本のような、長い歴史のなかで自然と人間とが相互に影響を与えながら、それぞれが暮らしてきた地域の森林・自然の問題をよく説明できないからである。\n一例をあげれば、かつて農山村の人びとは、自分たちの暮らしを守るために、人家の近くに里山天然林をつくりだした。それは、徹底的に人間の手を加えた天然林である。(中略)\n森林ボランティアとは、自発的に森の中で仕事をする人びとである。そうである以上、私たちは、人間中心主義的な立場にたっことも、自然中心的な立場にたつこともできない。\nとすれば、どうすればよいのだろうか。この問いに対して、私たちは、森林・自然と人間の関係を持続的に維持していくことこそが重要だと考える。単純に人間の未来を守ることでも、森を守ることでもない。森林と人間の関係を維持することによって、森と人とが相互的な依存関係をもっている日本の森と人の営みを守っていくことである。\n(注1)気運:ここでは、意識の高まり(注2)暗礁に乗り上げる:ここでは、進められなくなる","items":[{"no":57,"sec":"dokkai","stem":"「人間のための論」の問題点として、筆者の考えに合うのはどれか。","options":["人間のための森林・自然の維持に、結びついていないこと。","人間がいなければ、森林・自然は維持できないと考えていること。","農山村に暮らす人間の考え方が優先されすぎていること。","森林・自然の維持に対する考え方は、立場によって異なること。"],"ans":4},{"no":58,"sec":"dokkai","stem":"筆者によると、日本に関して、自然中心主義的な考え方が問題なのはなぜか。","options":["人間の介入によって、維持されてきた森林・自然もあるから。","人間が手を加えずに、原生林や原生的な自然を維持するのは難しいから。","自然の維持よりも人間の暮らしを守ることが優先されているから。","自然の生存権を保障することについて、人間の理解が得られないから。"],"ans":1},{"no":59,"sec":"dokkai","stem":"筆者によると、森林ボランティアの役割とは何か。","options":["人間を中心として、森林・自然との関係を維持していくこと。","人間の営みを制限して、森林・自然との新たな関係を見付け出すこと。","森林・自然と人間が共存できる関係を維持していくこと。","森林・自然が持続できるように、できるだけ自然に任せること。"],"ans":3}]},{"label":"Mon11","passage":"A\n勉強やスポーツなど何かに取り組んでいる時にスランプはつきもの（注）だ。いつもどおりしているのに、全く成果が上がらない。そんな時間が続くと、自分には能力が足りないのではないか、これ以上は上達しないのではないかと自信を失ってしまう。\nしかし、スランプとは一時的に調子が悪くなっている状態にすぎない。誰にでも調子の良い時と悪い時があり、それは波のようにやってくる。悪い時にはそれを乗り越えようともがくのではなく、波に身を任せるようにするといい。現状をすなおに受け止め、これまでと同じことをやり続けるのだ。そうして自然に波を乗り越えれば、またやる気も自信も戻ってくる。そうすれば、自然に次にやるべきことも見えてくるものだ。\nB\nスランプの状態になると、調子が良かった過去と比べてしまいます。だから、その差にショックを受けてしまって、自信を無くしてしまうわけですね。調子の波があることは普通なので、良い時と比べるのは止めましょう。\nそれよりも、今に集中することの方が大切です。今の自分を受け入れて、「これからどうするべきか」ということを考えてください。こういう考え方ができれば、前向きに物事を捉えることができるはずです。\nいつまでも過去に捉われている人は、後悔や焦りといった感情しか出てきません。しかし、今を見ている人だと、「どうすればいいか」という生産的な考え方ができるわけですね。\n(注)つきもの：当然あるもの","items":[{"no":60,"sec":"dokkai","stem":"スランプの時に落ち込んでしまう原因について、AとBはどのように述べているか。","options":["AもBも、成果が上がらない原因を考えすぎてしまうからだと述べている。","AもBも、過去の状態と比較して、焦ってしまうからだと述べている。","Aは何が悪いのかが分からないからだと述べ、Bは調子が良い人と比較してしまうからだと述べている。","Aは能力の限界だと思ってしまうからだと述べ、Bは良かった時と比較してしまうからだと述べている。"],"ans":4},{"no":61,"sec":"dokkai","stem":"AとBは、スランプの時はどのようにするのがいいと述べているか。","options":["AもBも、現状を維持しながら、調子が良くなるのを待てばいいと述べている。","AもBも、成果を上げるための方法を考えたほうがいいと述べている。","Aはやる気や自信を取り戻すまで待ったほうがいいと述べ、Bは今の状態を受け入れて、自然に任せていればいいと述べている。","Aは特別なことは何もしなくてもいいと述べ、Bは現状を認めて、今後どうするべきかを考えたほうがいいと述べている。"],"ans":4}]},{"label":"Mon12","passage":"以下は、十代の若者に向けて書かれた文章である。\n　だれでも、自分が自分であることを望み、個性的であろうと願っている。そしてその一方では、自分が他のみんなと違った、自分であることを恐れている。\n　本当は、「個性的」であろうと思って、個性的になれるものでもない。それはたいてい、「個性的」といわれる一つの型に、自分をあてはめていることだったりする。人間にとっては、「個性的であれ」などと言われても、どうしてよいかわからないものであって、「個性的」とよばれる型を持ったほうが楽なのだ。しかしそれは、本当に個性的なわけではない。\n　それでも、青年期に向けて、個性的であろうと試みることは、よいことだ。かりにそれが、一つの型にすぎなくても、あるいは、個性的であろうとして挫折し、個性的であることから逃避することも含めて、自分にとって個性とはと、考えるのはよいことだ。それは、自分が自分であることの、あかしでもある。\n　そこでは、ときに悩むことがあったり、どうしたら個性的な人間になれるかと、模索することもあるかもしれない。それはじつは、「個性的」であること以上に、自分というものを意識していく、一つの過程である。そうした意味では、「個性的」であるかどうかなんて、本当はたいしたことではなくて、自分というものが確立していくことが、大事なことも言える。\n　そしてじつは、個性というものは、人間のひとりひとりに備わったもので、その個性がありのままに出ていることが、本当の意味で個性的である。むしろ、本当の自分が出せないから、没個性的にもなるのだ。もちろん、人間はまわりの社会を気にするものであって、自分をよそおうことも含めてしか、社会のなかで存在できない。無理に「個性的」かどうかを、自分のよそおいを捨てようとしても、捨てられるものではない。そうした、社会とのかかわりも含めて、自分というものはある。\n　たいていの場合、つっぱったり、いじけたりしていては、自分の個性は発揮できない。つっぱるまいとするのが一種のつっぱりだったり、いじけまいとしてそのことにいじけたり、なんてことまで問題にしだすと、ちょっと言葉の遊びみたいになるが、ま、そうしたことまで含めて、気楽に自分であるようにしなくては、本当の意味で個性的にはなれないものだ。\n　そして、ありのままの自分を出すことへの不安が、「個性的」を一つの型にしたり、あるいはそうした型から逃れる道へ向かわせたりもする。\n　それでも結局、自分とはありのままの自分しかない。それを自覚したとき、きみは個性的なきみになる。","items":[{"no":62,"sec":"dokkai","stem":"よいことだとあるが、なぜか。","options":["個性的である必要はないと気づくから。","挫折したり悩んだりする経験が個性を作るから。","自分という人間を意識することになるから。","自分にあてはまる個性の型を見付けられるから。"],"ans":3},{"no":63,"sec":"dokkai","stem":"個性について、筆者はどのように考えているか。","options":["自分から社会とかかわることで、意識できるものだ。","他人と比較しなければ、自然に発揮できるものだ。","なりたい自分を意識すれば、自然に身につくものだ。","求めて得るものではなく、初めから持っているものだ。"],"ans":4},{"no":64,"sec":"dokkai","stem":"筆者が最も言いたいことは何か","options":["自分の個性を模索すべきだ。","自分自身であることが大事だ。","ありのままの自分を出せなくてもいい。","型に縛られない生き方をしたほうがいい。"],"ans":2}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある大学の研究活動助成の案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"星川大学　2022年度「グローバル研究活動助成」募集要項\n1. 応募資格（以下の条件を満たす者）\n2022年度に星川大学の大学院に在学していて、2021年度に本助成に採択されていない者\n2. 対象となる研究活動（以下の①または②に当てはまる活動）\n① 渡航期間10日間以上で、海外において調査を行う。\n② 海外での研究会議、シンポジウム等で研究発表を行う（渡航期間は問わない）。\n3. 対象となる研究活動の実施期間\n①②ともに2022年8月1日から2023年3月31日までに行うもの\n4. 助成金額等\n一人あたりの助成金額の上限は20万円とします。応募は一人1件のみ可能です。助成対象の費目の詳細は別紙を参照してください。\n5. 選考　書類による選考\n6. スケジュール\n募集期間：2022年5月10日（火）〜6月10日（金）　結果通知：2022年7月中旬\n7. 応募手続き\n以下のA〜Cを研究推進課窓口へまとめて提出してください。\nA 申請書（様式1）\nB 推薦書（様式2）…指導教員が作成したものを学生本人が提出すること。作成依頼は余裕をもってするようにしてください。\nC 発表申し込みの写し（②の場合のみ）…申し込みの開始が募集期間後になる場合は、準備ができ次第提出すること。\n●AとBの記入用紙は4月26日から募集期間の最終日まで研究推進課窓口で配布します。研究推進課のウェブページからダウンロードもできます。\n●②で発表が確定していない場合でも応募することができます。その旨をAに記入のうえ、必ず募集期間内にAとBを提出してください。また、実際に発表するかどうかが決まり次第、速やかに連絡してください。\n8. 採択後の注意事項\n報告書と経費の領収書を帰国後2週間以内に提出してもらいます。未提出の書類があった場合は採択を取り消す可能性があります。\n問い合わせ先：研究推進課　電話：061-625-9398　Eメール：graduate-research@hoshikawa.ac.jp","items":[{"no":65,"sec":"dokkai","stem":"次の4人は、星川大学の大学院に在学中で、以下の研究活動を行いたいと思っている。「グローバル研究活動助成」に応募できるのは誰か。\n\n【西田さん】海外のシンポジウムで講演を開く／渡航時期：2022年8月24日から3日間／この助成の採択歴：なし\n【ダリアさん】海外に渡航し、資料の収集や調査を行う／渡航時期：2022年1月18日から3日間／この助成の採択歴：なし\n【ラワンさん】海外で研究発表を行う／渡航時期：2022年2月20日から5日間／この助成の採択歴：2020年度にあり\n【山本さん】海外に渡航し、調査を行う／渡航時期：2022年8月20日から12日間／この助成の採択歴：2021年度にあり","options":["西田さん","ダリアさん","ラワンさん","山本さん"],"ans":3},{"no":66,"sec":"dokkai","stem":"応募に関して、留意しなければならないことは何か。","options":["指導教員から研究推進課窓口に提出してもらわなければならない書類がある。","研究活動が発表か調査かによって、提出しなければならない書類の種類が異なる。","記入用紙は、5月10日までに研究推進課窓口に取りに行かなければならない。","研究発表の場合、発表を行うことが確定していないと応募ができない。"],"ans":2}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t12-2022-nghe.mp3","items":[{"no":67,"sec":"nghe","stem":"1番：男の学生はこの後、まず何をしなければなりませんか？","options":["応募書類の用紙を取りに行く","指導教員の許可を得る","説明会に参加する","経験者に話を聞く"],"ans":2,"blind":false},{"no":68,"sec":"nghe","stem":"2番：女の人はこの後、昇格のために最初に何をしなければなりませんか？","options":["部長と面談する","筆記試験を受ける","プレゼンテーションをする","研修を受ける"],"ans":4,"blind":false},{"no":69,"sec":"nghe","stem":"3番：部員は何をしなければなりませんか？","options":["代わりの会場を探す","ポスターを張る場所を探す","ちらしを配る","招待券を配る"],"ans":3,"blind":false},{"no":70,"sec":"nghe","stem":"4番：男の店員は今日、何をしなければなりませんか？","options":["新刊の紹介文を書き直す","新刊を並べる場所を変える","料理本の在庫を確認する","料理本を注文する"],"ans":2,"blind":false},{"no":71,"sec":"nghe","stem":"5番：女の職員はこれからまず何をしなければなりませんか？","options":["卒業生に講演会についてのメールを送る","ホームページに講演会の情報をのせる","講演会の会場の予約を変更する","食事会の会場を予約す tem":"「未来のものづくりコンテスト」は、（　　）（　　）（　*　）（　　）、今年で20回目を迎える。","options":["子供たちに","コンテストで","物づくりの面白さを感じてもらおうと","ABC社が創立50周年を機に始めた"],"ans":4}]},{"id":"mon7","title":"問題7 — 文章の文法（穴埋め）","sec":"dokkai","instr":"次の文章を読んで、「41」から「44」の中に入る最もよいものを 1・2・3・4 から一つ選びなさい。","passage":"以下では、作家が書いた文章です。\n立場が人をつくる。とはよく言ったものだと思います。これは主にビジネスの世界で使われていることばだと思うのですが、子供の社会でも同じようなことを感じることが多々あります。\nここ十数年、私は毎月、保育園の取材を行っていました。今多くの保育園では0歳から5歳（就学前まで）の子供を受け入れていますが、なかには0歳から2歳児までの低年齢児を対象にした保育園もあります。 [41] に行って驚くのは、2歳児の姿です。5歳児までいる保育園の2歳児や、園に通っていない2歳児と比べると、とにかくしっかりして見えるのです。\nどちらがいいとか、悪い、という話ではありません。 [42] 、「自分は小さい子」という環境で生活をするのと「自分は一番大きい子」という環境で過ごすのでは、やはり行動や意識に違いが出てくると思うのです。\nそれが顕著に表れていると思うのは、小学校一年生へと進学したときの子供たちです。\n入学前、保育園や幼稚園に年長児だったときは、小さなお友達の着替えを手伝ったり、給食や掃除などのお当番活動を行ったり、おあそびを通して様々な活動の中で、いろいろな体験を積み重ねていきます。\n年長児は、なんでもできるかっこういいお兄ちゃん、お姉ちゃんだったのです。\nところが、小学校に [43] 、一年生は面倒を見てもらう、小さくてかわいい存在になります。立場が一転するのです。\n六年生に手を握られ、トイレに連れて行ってもらっている一年生の中には、案外まんざらでもない顔で、その状況に順応している子もいます。それはそれでかわいいのですが…\nけれど、いるのです。いえ、実はたくさんの一年生が、お世話されることに対して、なんで？どうして？と感じていると思うのです。\n「僕は私は大きくなったのに！」と\nそんな不満顔の一年生が、なんとも [44] 。\n子供は、自分の明日に大きな期待をしている。その期待が、子供のたくましさなのではないかと思うのです。","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["保育園","ある保育園","そうした保育園","それ以外の保育園"],"ans":3},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["なお","ただ","ゆえに","それなのに"],"ans":2},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["入学したとたん","入学しておきながら","入学したとしても","入学してはじめて"],"ans":1},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["たくましく思えます","たくましいとされています","たくましかったはずです","たくましくなったものです"],"ans":1}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"テレビ番組は、その番組内容のすべてが視聴者に伝わるよう、わかるように作られるが、一歩間違えれば、「わかりやすいだけの番組づくり」になってしまう危険性がある。メッセージがシンプルな番組のほうが視聴率を取りやすい、などと言われる傾向があるなかで、「わかりやすく」することでかえって、事象や事実の、深さ、複雑さ、多面性、つまり事実の豊かさを、そぎ落としてしまう(注)危険性があるのだ。とりわけ報道番組では、このことは致命的な危うさになる。\n(注) そぎ落とす：削る","items":[{"no":45,"sec":"dokkai","stem":"筆者が、番組づくりにおいて危険だと感じていることは何か。","options":["視聴率を上げようとして、事実とは異なることを伝えてしまうこと。","わかりやすいことだけを伝えて、視聴者に関心を持たれなくなってしまうこと。","わかりやすくしようとして、事実を掘り下げて伝えられなくなってしまうこと。","メッセージをシンプルにしようとして、本質がわかりにくくなってしまうこと。"],"ans":3}]},{"passage":"人材育成という場面では、相手に「失敗する権利」をもっと与えてもいいような気がします。それはなによりも「失敗する権利」を与えることが、相手の自発性を生み出すことに結びつくからです。\n逆にいえば「失敗する権利」がないところでは、行動がどうしても「しなければならない」の連続になり、自発性よりも義務感を助長してしまいます。自分はどのくらい相手に「失敗する権利」を与えているのか、一度立ち止まって考える価値はあるでしょう。","items":[{"no":46,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["失敗してもいいと思わせることで、相手は自ら行動できるようになる。","失敗を経験させれば、相手は失敗について自ら考えるようになる。","失敗の経験を積ませることで、相手は失敗をしないようになる。","失敗を許容しなければ、相手は行動することを恐れてしまう。"],"ans":1}]},{"passage":"直感力は即座に作用する場合もあれば、逆に時間をおいて、ある日突然作用をすることもあります。言い方を変えれば、気まぐれな存在とも言えます。\nしかし、その気まぐれとも思える直感力による「発見や気づき」は、考え続けたり、悩み続けるといった努力と強い指向性(注)の結果として生まれてくる「閃き」であって、探求への意識関心がないところに発生することもありません。つまり、強い探求心と問題意識を持ち続けた結果として、あとから直感が働いているわけです。\n(注) 指向性：ここでは、特定の方向に向かう意識","items":[{"no":47,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["直感力による「発見や気づき」は、問題の解決に欠かせない。","「発見や気づき」は直感力によって生まれるわけではない。","強い探求心と問題意識を持っていれば、問題は解決できる。","問題への探求心を持ち続けていなければ、直感力は作用しない。"],"ans":4}]},{"passage":"「思い出」とは、「かつて」の私の出来事について、「いま」の私の内で生起する「心の動き」のことだ。「嫌な不愉快な思い出」は自ずと封印(注1)されて縮小してもゆくが、一万の楽しい愉快な「思い出」は止め処なく(注2)過剰に膨らみ、出来事の事実を超えて一つの「物語」が出来上がってしまうことも多い。\n「かつて」から経た時間が遠くなればなるほど(老いるほど)、思い違いや思い込みを含んだ「私の記憶」が作られる、そうなりがちだ。\n(注1) 封印されて：ここでは、触られずに\n(注2) 止め処なく：止まることなく","items":[{"no":48,"sec":"dokkai","stem":"「思い出」について、筆者の考えに合うのはどれか。","options":["不愉快な「思い出」ほど、記憶に残りやすい。","時間がたてば、多くの「思い出」が消えていく。","時間がたつほど、事実とは異なっていくことが多い。","出来事の記憶が鮮明なほど、自分の「物語」が作られる。"],"ans":3}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"巻によくある<span class=\"underline-q\">料理本</span>について、私がかねがね不満に思っていたことがある。\nそれは、たとえば炒飯ならば、一、フライパンを熱する。二、大さじ二杯のサラダ油を入れる。三、溶き卵を入れる。････といった感じに書かれていることが多くて、なぜそうするのかが書かれていないのだ。なぜフライパンを熱してから油を入れるのか。なぜ溶き卵をこのタイミングで入れるのか。私は、そういうことが知りたい。型というかマニュアルが欲しいのではなく、その型が生み出された基本原理が知りたいのである。\n基本原理さえつかめれば、これは他にも広く応用が利くので、後々役立つ度合いが大きい。個別の型だけを学んでも、それは他のことに応用できるのかできないのか判断がつかないし、応用したとしても、その範囲はかなり限定されてしまう。そして何より、ただ誰かの作った型に理由もわからず無自覚なまま従っていること自体が、私にはとても気持ちが悪いのだ。\n(中略)型というものは、それを考案した人自身に最も必要だったものであって、必ずしもすべての人に有益とは限らない。真に学ぶとは、誰かの型をコピーすることではなく、そこからエッセンスを抽出して、自分に合ったやり方を生み出すことではないだろうか。\nマニュアルを使うことに慣らされた現代だからこそ、白紙の状態から必要なやり方をその都度見つけ出せるような人間を育てていく必要があるのではないかと、私はいろんな場面で思うのである。","items":[{"no":49,"sec":"dokkai","stem":"<span class=\"underline-q\">料理本</span>について筆者が不満に思っていたことは何か、","options":["なぜ自分とは違う手順なのかがわからないこと。","作り方が丁寧に書かれていないこと。","手順が決められた理由が書かれていないこと。","手順が一つしか書かれていないこと。"],"ans":3},{"no":50,"sec":"dokkai","stem":"型について、筆者はどのように述べているか","options":["個人が自由に作ったもので、基本原理をもとに作られたものではない。","学ぶことはできないので、自分で見つけるしかない。","作った人には必要なものだが、誰にでも役に立つとは言えない。","作った人から学べば、誰にでも応用できるものだ。"],"ans":3},{"no":51,"sec":"dokkai","stem":"学ぶことについて、筆者の考に合うのはどれか。","options":["基本原理を理解したうえで、自分なりのやり方を発見することが大切だ。","より多くの型を学び、その中から自分に合ったやり方を探し出すべきだ。","まず型を身につけ、それを自分に合うように修正していくことが大切だ。","マニュアルを使うことをやめて、基本原理を自分で考えるべきだ。"],"ans":1}]},{"passage":"これまでずいぶんたくさんアニメーションを作ってきましたが、しかしなかなか未だに巧くアニメーションを作るのは難しく、大変です。いつもどう作ったらよいのか、作り始めてからもとまどってしまうのです。しかし少しずつ形になってくると、ふつふつと(注1)楽しくなってくるのです。そしてできあがってきたイメージと自分の頭の中のイメージとの、一致とズレを近づけたり、遠ざけたりするために、たくさんの作業を積み重ねて、最後には、どこかであきらめを付けて、終わりにします。\nただその時には終わったと思っても、少し時間を置いてみると、もう少しこうすればよかった、ああすればよかったと、後悔ばかりが浮かんできて、自分のアニメーションの上映会に立ち会う時は、いたたまれない思いがします。アニメーションに限らず、クリエーター(注2)は多かれ少なかれ、ただ楽しいばかりではなく、こんな思いをしながら、次こそは自分のベストを形にしようと、日々まるで「修行」のように物作りに追われていくのではないでしょうか。いつかは、<span class=\"underline-q\">この魔物</span>から逃れて、心安らかな日が訪れるのを夢想しながら。\n(中略)現実世界には、辛いことや思いどおりにならないこともたくさんありますが、創作活動の中、精神の世界で自由に羽を伸ばせる時、そこには他のいろいろな楽しい娯楽では味わえない深い喜びがあり、それがこの魔物から逃れられない理由のひとつです。\nそして、言葉にはできない価値観をうまく作品として整えられた時、それは人の反応や評価を超えた、絶対的な充実感を与えてくれるものと信じています。\n(注1)ふつふつと:心の中からわいてくるように\n(注2)クリエーター:創造的な仕事に携わっている人","items":[{"no":52,"sec":"dokkai","stem":"筆者にとって、アニメーションを作る作業とはどのようなものか","options":["自分のイメージどおりになることを求めずに、楽しみながら形にする。","自分のイメージに近づけて修正を重ねるうちに、できあがっていく。","思い描いたことと現実の形を調整し続け、あるところで妥協する。","十分納得できるまで、完成に向けて作業を積み重ねる。"],"ans":3},{"no":53,"sec":"dokkai","stem":"<span class=\"underline-q\">この魔物</span>とは何か","options":["我慢できないくらい大変で、作品作りをやめてしまいたくなる物作り。","後悔に悩まされながら、納得できる作品を目指し続ける物作り。","自分のベストの形が分からなくなってしまうような物作り。","作品を作り終えるたびに、気力を奪われるような物作り。"],"ans":2},{"no":54,"sec":"dokkai","stem":"創作することについて、筆者の考えに合うのはどれか。","options":["自分の思いどおりにならなくても、人に評価された時に充実感が得られる。","自分の世界観を思う存分広げ、作品の中で表現できた時に満足できる。","満足できる作品になりそうになくても、完成させると充実感が得られる。","いつか満足する作品が作れると信じていれば、評価される作品が作れる。"],"ans":2}]},{"passage":"人間の脳の一部に、前頭葉というものがある。\nこの前頭葉は、意欲や感情のコントロール、思考や想像のスイッチ機能を果たしていると考えられている。そして、長期記憶を保持する役割も担っている。しかしここが、脳の中で一番早く老化が始まるのだという。(中略)前頭葉の老化に拍車をかけると懸念されているものがある。デジタルだ。(注1)人間がパソコンやスマートフォン(注2)、インターネットなどに頼り過ぎるようになったことで、自分の頭の中に情報や知識を蓄積したり、繰り返し引き出す機会が減った。それが前頭葉の老化をいっそう促しているという指摘がある。\nデジタルの中に蓄えられる莫大な情報を、人間に新たに与えられた「外部脳」だと解釈し、これが人間の脳の効率化につながるのだという見解が増えた。外部脳を持てば、自分の脳を記憶装置にせず、思考の場として徹底できる、そう考える専門家も少なくない。\nしかし、外部脳に頼ることの代償が前頭葉の老化促進だとすれば、<span class=\"underline-q\">この考え</span>に対しては慎重に対峙(注3)しなければならない。\n自分の脳の中に情報や知識を記憶し、それを駆使してこそ生まれる連想や判断というものがある。これを頻繁に繰り返すことで、人間の脳の潜在力が引き出され、老化も防ぐことができる。外部脳ができたことを謳歌する前に、自分の脳を鍛え、活用することの重要性を再認識する必要がありそうだ。闇雲に(注4)デジタルへ脳の役目を託すことは、危険を伴うと言わざるを得ない。外部脳に人間の脳が持つ元来の力を奪われかねないのだから。\n(注1)デジタル:ここでは、デジタル機器\n(注2)スマートフォン:パソコンの機能もある携帯電話\n(注3)対峙する:向き合う\n(注4)闇雲に:深く考えずに","items":[{"no":55,"sec":"dokkai","stem":"筆者によると、デジタルを使うことで前頭葉の老化が進むのはなぜか","options":["記憶にかかわる脳の機能を使うことが少なくなるから。","デジタルがもたらす膨大な情報が、脳を疲労させるから","脳が情報や知識を扱うことがなくなるから。","脳が感情のコントロールや思考をしないようになるから。"],"ans":1},{"no":56,"sec":"dokkai","stem":"<span class=\"underline-q\">この考え</span>とはどのような考えか","options":["脳よりデジタルのほうが、情報や知識を多く蓄積できる。","デジタルに頼り過ぎると、次第に脳の機能が低下する。","デジタルは、脳と同じように思考に使えるものではない。","デジタルと脳を使い分けることで、脳は思考に特化できる。"],"ans":4},{"no":57,"sec":"dokkai","stem":"筆者が言いたいことは何か","options":["情報や知識の記憶装置である脳を、さらに鍛えるべきだ。","連想や判断の機能を持てば、デジタルも脳の役目を果たせる。","デジタルをうまく活用しなければ、脳の潜在力が引き出せない。","脳の機能を衰えさせないよう、デジタルの利用は慎重であるべきだ。"],"ans":4}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"大学2回生(注1)の頃だったか、フランス語の文章を講読する授業に出席していたところ、なにかの折に先生が、「分かるものを読むのは読書ではなく、分からないものを読むのが読書です」、と仰った。\n(中略)\n先生の言葉を聞いて当時の私は、自分がそれまでに知った限られた知識を確認するだけの本を読むのではだめで、自分の知らない考え方や感じ方にふれることによって、自分の偏狭(注2)な物の見方を問い直さなければならない。と先生は言いたかったのだろうと思った。先生の言葉に私は感銘し、その時以来、当時の私にとってとりわけ難解であったフランス現代思想の哲学者や思想家の本を、理解できるようになるまでとことん読むように心がけた。\nそんな読書を続けるうちに、はたして、難解な本を理解するだけの読書でいいのだろうかと自問するようになった。というのも、理解するということが、そもそも良いことかと問いかける哲学者や思想家の本を読んだからだ。理解するとは、人であれ物であれ、その人やその物を理にかなった(注3)仕方で知る良い方法だとたいていは言われる。\nしかしながら、理にかなった仕方で、その人の人格なり、その物の本質なりを知ることには、暴力的なところはなにもないのだろうか。理解するということは、唯一存在しているこの人やこの物を、その単独な在り方ではなく、ほかの人やほかの物と共通する一般的な在り方で捉えることだ。私たちがなにかを知ろうとする際に頼りとする概念や観念は、様々な在り方をする諸々(注4)の存在に当てはまるから役に立つ。\n概念や観念は私たちが知ろうとする対象の在り方に力を加えるわけではないのだから、知る私たちと知られる対象の間に立つ中立的な光のようなものだと見なされている。的確な概念や観念をとおして諸々の存在を理解するのは、正しい学間だとされてきた。\nしかしながら、たとえそれが正しくても、この人やこの物が持っている単独のなにかは、理解では捉えられないまま、知それ自体のなかで忘却(注5)されてしまいがちだ。なにかを理解できるということは、たしかに人間の優れた能力である。が、それは武器であり、この至高(注6)の武器の前では、およそ存在するものはなんであれ、ほとんど抵抗することができないということを心得ていなければならない。\n(注1)2回生:2年生(注2)偏狭な:偏っていて狭い(注3)理にかなった:合理的な(注4)諸々の:ここでは、あらゆる(注5)忘却する:忘れ去る(注6)至高:最高","items":[{"no":58,"sec":"dokkai","stem":"筆者は先生の言葉を聞いて、なんのために読書をするようになったか。","options":["難解な物の見方や考え方を理解するため。","自身の物の見方や考え方を再考するため。","自身の知識を増やすため","自身の知識が正しいかどうか、確認するため。"],"ans":2},{"no":59,"sec":"dokkai","stem":"理解するとはどういうことか。","options":["概念や観念に頼らず、人や物を中立的に捉えること。","概念や観念にとらわれず、人や物の本質を捉えること。","概念や観念を利用して、人や物を単独な在り方で捉えること。","概念や観念をとおして、様々な人や物を共通の枠組みで捉えること。"],"ans":4},{"no":60,"sec":"dokkai","stem":"理解することの問題点について、筆者はどのように考えているか。","options":["学問としての正しい在り方に、疑問を持たなくなる。","諸々の存在を個別性や独自性でしか捉えらななる。","人や物の個別性や独自性が見えなくなるおそれがある。","人や物の本質に力を加えて、ゆかめてしまう可能性がある。"],"ans":3}]},{"label":"Mon11","passage":"A\nビジネスで相手をうまく説得したいとは誰もが思うことだろう。私が最も意識しているのは、相手の性格や価値観、知的水準などに応じた説明のしかたをすることだ。具体的で明快な例を決める人もいるし、データに基づいた緻密な説明を好む人もいる。さまざまなタイプに合わせて対応することで、説得力を高められるように努めている。\nただ、どのような相手でも、まずは話を聞いてもらえなければ意味がない。そのためには、話し方や服装などの最低限のマナーは身につけておかなければならない。中身のある話ができればいいとこれらを軽視する人もいるが、初対面で悪い印象を持たれてしまうと、そもそも話を聞こうとは思ってもらえず大きなマイナスになってしまうからだ。もちろん相手の印象を気にしすぎるのは問題だが、いい印象を持ってもらうことはプラスに働くことも多いと思う。\nB\n説得力を高めるための第一歩は、「送り手」としての自分自身の信頼度を高めること。「この人は信用できそう」といった印象を与えることです。多くのビジネスパーソンが服装や言葉づかいを気にするのも、信頼できる印象を与えたいからに他なりません。\n何よりも重要なのは、説得内容に関連した知識や情報を十分に吸収し、専門性を高めておくことです。（中略）\n仕事に関連する情報というのは、日常生活の至る場面に転がっています。街を歩いていても、ショッピングモールや行楽地に出かけても、人々の行動パターンやライフスタイル（注）を知るヒントが見つかります。専門的知識や情報を生活に密着した形で提示することができれば、より説得力が増すはずです。説得力のある人には日頃から研究熱心な人が多いのもそのためです。\n好印象も説得力につながります。人の話に耳を傾け、言葉と心のキャッチボールができる人は、間違いなく好印象を与えます。\n(注)ライフスタイル:生活様式","items":[{"no":61,"sec":"dokkai","stem":"AとBの認識で共通していることは何か。","options":["初対面の印象を変えるのは難しい。","態度や服装も相手が持つ印象に影響を与える。","相手が持つ印象を気にしすぎないほうがいい。","信頼度は、自分自身の努力だけでは高められない。"],"ans":2},{"no":62,"sec":"dokkai","stem":"説得力を高めるために必要なことについて、AとBはどのように述べているか。","options":["AもBも、専門性の高い説明ではなく、日常生活の身近な例を挙げて説明することだと述べている。","AもBも、相手の要求を理解するために、話をしっかり聞くことだと述べている。","Aは相手に合わせた説明をすることだと述べ、Bは専門的知識や情報を多く集めて生活に結び付けながら説明することだと述べている。","Aは相手の求める内容を的確に説明することだと述べ、Bは相手に合わて情報量を調整することだと述べている。"],"ans":3}]},{"label":"Mon12","passage":"植物は美しい花を咲かせ、虫を誘った。鳥は飛ぶために翼を生やした。しかし、生物は、自ら求めてそのような性質を得たわけではない。生命にとって新しい変化は偶然によってしか生まれない。\nDNAが複製され、親から子に受け渡されるとき、ごく稀に、ほんのわずかな誤植(注1)が発生する。もちろん誤植はランダム(注2)におきる。ささいな誤植は新たな変化をもたらす。その変化自体には目的も意図も方向性もない。そこから何かを選びとるのは自然環境である。自然環境に適した変化は選択され、子孫を残す。環境に不適な変化は子孫を残せず、淘汰される。\nところが。もし本来ならあっさり淘汰されてしまうような変化であっても、それを選びとり、守り、育むような「選択者」が自然以外に存在すれば、その変化は生きのびることができる。そんなことが近年、実はたくさん、あちこちで起こっている。近年、といってもそれは、人間がこの世界に出現して以来のこと。\nたとえば鳥。鳥は卵を産むと巣に籠って暖める性質を持つ。数週間それに専心(注4)する。しかし、もし何らかの突然変異によって鳥の習性が変化し、卵を産んでも暖めることを放棄してしまったら。そんな変化は、子孫を残すのに圧倒的に不利だから、たちまちそんな鳥は淘汰されるはず。\nところが人間はその島の卵を島に代わって暖め子孫を増やしてやることにした。なぜか。鳥は卵を暖めることを放棄したかわりに、またすぐに次の卵を作りはじめる性質を持っていたから。こうして現在、私たち人間は、毎日排卵(注5)し、毎日のように卵を産みっぱなしにして平然としている鳥、すなわち、一年に300個以上も卵を産み続けるニワトリ、ホワイトレグホン①を選びとった。\nたとえばカイコ(注6)②カイコはもともとクワコという蛾の一種だった。人間が常時、餌を供給して人工的な環境を与えた。すると幼虫は自分で餌を探索するのをサボるようになった。その分の余力をもっと別なこと、つまり絹糸を作り出す能力に振り向けるような種が選別された。かくして自分ではほとんど動けず、必要以上に大きく厚手の繭(注7)を作りだし、そこから出ることも飛ぶこともできないような昆虫が作り出された。カイコは人間がいないと生きていけない。\n(中略)\n人間がその進化のプロセスに介入し、自然になりかわって選択者としてふるまい、作りかえ、新たに生み出した生命。その生命たちはもはや人間なしでは生きていくことができない。一方、人間もまたそんな生命に助けられ、あるいは支えられて生きている。これは人間と人間が作り出した生命との新たな共生関係とも呼べる。\n人間が登場して以来、進化の歴史は新しい局面を迎えた。人が作りかえたいのち。それに対して人間はきちんと責任を取らなければならない。\n(注1)誤植:ここでは、ずれ(注2)ランダムに:偶然に(注3)淘汰される:ここでは、滅びる(注4)専心する:集中する","items":[{"no":63,"sec":"dokkai","stem":"筆者によると、自然界で子孫を残した生物はなぜ子孫を残せたか","options":["自然環境に合わせて自身を変化させたから。","自身に適した自然環境を選んで移動したから。","DNAが複製されるときに、ずれが生じなかったから。","DNAに生じた変化が、たまたま自然環境に合ったから。"],"ans":4},{"no":64,"sec":"dokkai","stem":"①ホワイトレグホンについて、筆者はどのように述べているか","options":["卵を産んでも暖めない。","一度に多くの卵を産む。","産んだ卵をほかの鳥に託す。","ほかの鳥より卵を暖める時間が短い。"],"ans":1},{"no":65,"sec":"dokkai","stem":"カイコについて、筆者はどのように述べているか。","options":["身動きが取れないため、細糸が多く作り出せなくなった。","人間が餌を与えることで、絹糸を作ることに専念するようになった。","生きるエネルギーの大部分を、餌を食べることに費やすようになった。","人工的な環境を与えた結果、絹糸を作るという新しい能力を獲得した。"],"ans":2},{"no":66,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["人間が作りかえた生物は、本来の姿に戻さなければならない。","人間はあらゆる生物と新たな共生関係を築くべきだ。","人間は生物の進化のプロセスに介入するべきではない。","人間は作り出した生命との共生関係を維持しなければならない。"],"ans":4}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある会社の授業料補助についての案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"2022年度　外部講座の受講料補助について\n社員の業務能力向上を目的として、社外で受講する外部講座に受講料を補助します。\n1 対象の講座\n・2022年4月1日から2023年2月28日までに行われる、業務と関連がある講座が対象です。業務との関連については、受講料補助申請書に記入してください。\n・昨年度の補助対象講座例：ビジネスマナー講座、プレゼン講座、ビジネス文書講座等\n2 補助金額\n・講座受講料の補助の申請は、以下のAかBで行ってください（同年度内にAとBの両方で申請することはできません）。\nA　一つの講座の受講料が30,000円以上：補助金額25,000円／補助申請可能な講座数（年度につき）1講座\nB　一つの講座の受講料が30,000円未満：補助金額10,000円＊／補助申請可能な講座数（年度につき）2講座\n＊講座の受講料が1万円未満の場合、受講料の実費を支給します。\n3 申請書類と補助金の支払い\n・補助金額分は、建て替え払いになります。\n・以下の書類を、受講後にまとめて、人事課にご提出ください。Bで二つの講座を受講する場合は、講座ごとに書類を分けて提出してもかまいません。\n① 受講料補助申請書（人事課ウェブページよりダウンロード）\n② 受講料の領収書\n③ 講座に出席したことを証明する書類（講座修了証等）\n④ 講座の内容が書かれた資料（パンフレット等）\n・補助金は、各月の15日までに書類を提出した場合、翌月末日に振り込みます。16日以降に提出した場合は、2か月後の末日となります。\n・申請書類提出締め切り：2023年2月15日\n提出締め切りまでに書類をまとめて提出できない場合、①のみ先に提出締め切りまでに提出し、他の書類については、3月10日までにご提出ください。補助金は、3月31日に振り込みます。\n提出・問い合わせ先：人事課平川（内線3210）","items":[{"no":67,"sec":"dokkai","stem":"ジェンカさんは、9月に受講料9,000円のビジネスマナー講座を、10月に受講料27,000円のプレゼン講座を受講する。ジェンカさんが会社から受けられる補助は、いくらになるか。","options":["9,000円と10,000円","9,000円と27,000円","10,000円と10,000円","10,000円"],"ans":1},{"no":68,"sec":"dokkai","stem":"森田さんは、2月20日にビジネス文書講座を受講する。受講料補助の申請はどうしなければならないか。","options":["2月15日までに①～④を人事課に提出する。","2月15日までに①を、3月10日までに②～④を人事課に提出する。","2月15日までに①を、3月31日までに②～④を人事課に提出する。","3月10日までに①～④を人事課に提出する。"],"ans":2}]},{"id":"listen1","title":"聴解 問題1","sec":"nghe","instr":"問題1：会話を聞いて、このあとどうしますか。","audio":"audio/n1-t7-2022-nghe.mp3","items":[{"no":69,"sec":"nghe","stem":"1番：男の学生はこのあと先生に何を送らなければなりませんか？","options":["学部での研究内容","進学の志望動機","進学希望の大学院の情報","今後の研究の展望"],"ans":3,"blind":false},{"no":70,"sec":"nghe","stem":"2番：参加者はこの後まず何をしますか？","options":["集まった食品の数を数える","食品を袋に入れる","段ボール箱に食品を分けて入れる","申し込みを確認する"],"ans":2,"blind":false},{"no":71,"sec":"nghe","stem":"3番：女の学生はまず何をしますか？","options":["提出していない人へのさいそく","リストの作成","印刷会社への電話","表紙のイラストの確認"],"ans":1,"blind":false},{"no":72,"sec":"nghe","stem":"4番：男の人は資料をどのように修正しますか？","options":["パッケージのイラストを変更する","自由回答の内容を追加する","原材料の説明を短くする","開発スケジュールを書き直す"],"ans":2,"blind":false},{"no":73,"sec":"nghe","stem":"5番：ツアー客はバスを降りた後、まず何をしますか？","options":["やしきの入り口で記名する","庭園で集合写真を撮る","やしきの入り口でバッジをもらう","資料コーナーでビデオを見る"],"ans":3,"blind":false},{"no":74,"sec":"nghe","stem":"6番：男の学生は今日、何をしなければなりませんか？","options":["ア・イ","ア・ウ","イ・ウ","ア・イ・ウ"],"ans":2,"blind":false}]},{"id":"listen2","title":"聴解 問題2","sec":"nghe","instr":"問題2：まず質問を聞いてください。それから話を聞いて、選択肢から最もよいものを選びなさい。","items":[{"no":75,"sec":"nghe","stem":"1番：社長は取り組みの意外な効果はなんだと言っていますか？","options":["仕事のオンとオフが切り替えやすくなった","業務の効率化が進んだ","社員の健康が促進された","よりよい人材の確保につながった"],"ans":2,"blind":false},{"no":76,"sec":"nghe","stem":"2番：男の人は引っ越し料金を抑えるためにどうしたと言っていますか？","options":["安いと評判の業者に頼んだ","平日に引っ越しをした","荷造りをすべて自分でした","いらない家電を自分で処分した"],"ans":3,"blind":false},{"no":77,"sec":"nghe","stem":"3番：館長はこの美術館を建てた目的は何だと言っていますか？","options":["漫画のファンを観光客として集めるため","原稿の保存場所を確保するため","手書きの原稿の魅力を伝えるため","漫画の文化的価値を高めるため"],"ans":2,"blind":false},{"no":78,"sec":"nghe","stem":"4番：社長は客に何が一番喜ばれていると言っていますか？","options":["氷を積む作業の負担がなくなったこと","利益が増えたこと","海水から質のよい氷が作れること","魚に傷がつかなくなったこと"],"ans":2,"blind":false},{"no":79,"sec":"nghe","stem":" うため、部屋から部屋へと動き回る。\nバッグの中身も、財布、名刺入れ、手帳などはひとまとめにしておくが、それ以外の日によって違う持ちものが結構ある。\n折りたたみ傘を玄関収納に戻し、保冷バッグをキッチンに戻し、ストールをクローゼットに戻し、日焼け止めクリームを洗面所に戻し、書類を本棚に戻し…。出かけるときは急いでいるのでほぼ無心だが、片付ける段になり、こんなにもあちこちからモノをかき集めてきていたのかと [41] 。\n元の場所へ運んで、形を整え、入れることを繰り返していると、10分や20分はあっという間。一日のうちどれくらいの時間、モノをしまうのに費やしていることか。\n今日中に [42] 、何も死ぬわけではない。後回しして消耗を防ぎ、明日に備える方がいいのでは。\nそう考え、ある晩サボることにした。出張から帰ったキャリーバッグを、歯ブラシだけ抜きそのままにして寝る。\n翌朝、着替えのはみ出たキャリーバッグが床にあるのを見て、どっと疲れをおぼえた。そのとき悟った。しなくていいようでいて、やはり必要な [43] 。\n元気は「元」の「気」と書く。一日の活動で昂ったり乱れたりした気が、本来の状態に立ち返る。モノを所定の位置に戻すのは、その象徴的行為である。元気を「もらう」とよく言うが、私にとって元気はまず、付加より前にリセットだ。睡眠時間が多少短くなっても、今日のうちに [44] 。","items":[{"no":41,"sec":"dokkai","stem":"文章の [41] に入る最もよいものを選びなさい。","options":["驚くほどだ","驚くようだ","驚くべきだ","驚くはずだ"],"ans":1},{"no":42,"sec":"dokkai","stem":"文章の [42] に入る最もよいものを選びなさい。","options":["片付けても","片付ける限り","片付けなくても","片付けない限り"],"ans":3},{"no":43,"sec":"dokkai","stem":"文章の [43] に入る最もよいものを選びなさい。","options":["プロセスだとか","プロセスなのに","プロセスだったが","プロセスなのだと"],"ans":4},{"no":44,"sec":"dokkai","stem":"文章の [44] に入る最もよいものを選びなさい。","options":["戻したかった","戻すことにしていこう","戻せてよかった","戻すようにしてほしい"],"ans":2}]},{"id":"mon8","title":"問題8 — 短文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"人をその気(※)にさせようとしているときに、相手が反論されることがあります。むしろ反論されることの方が多いと言えるでしょう。反論されると、それで「ああ、その気がないのか」と諦めてしまう人がいます。しかし、反論されただけで諦めていてはいけません。反論されるということは、承諾してもらうためにクリアすべき点が明らかにされた、ということなのです。むしろプラスに解釈しましょう。反論もせずに去っていってしまう人が最も説得しにくい人です。\n(※) その気：そうしようという気持ち","items":[{"no":45,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["反論されないように、問題点を解決しておいた方がいい。","反論されないと言うことは、相手を説得できたということだ。","反論されたら、相手を説得できる可能性が生まれたと考えていい。","反論されるということは、相手が承諾したことと同じだと言える。"],"ans":3}]},{"passage":"一般的に工具は、とても合理的にデザインされているはずです。その原則は、世界中どこに行っても変わらないようですが、その合理的デザインの結果は、なぜ国によって全然違ってきます。もちろん素材や加工方法の違いがあって、工具の役割自体が違う場合も多いのですが、はさみやのこぎりのように、全く同じ機能、素材であっても民族独特の美意識の違いがくっきり現れます。そのことは、工具も持つ美しさが、必ずしも合理性からだけ生まれるのではないことを示しているように思います。","items":[{"no":46,"sec":"dokkai","stem":"工具のデザインについて、筆者の考えに合うのはどれか。","options":["民族独特の美意識が、合理的より優先されている。","民族によって異なる美意識が、素材や加工方法に現れる。","国による違いは、合理的の追求から生まれる。","合理性に加え、民族独特の美意識が反映されている。"],"ans":4}]},{"passage":"昔もいまも、才能というのは一定の軌道から飛び出してゆく能力のことで、みんなにそんな例外的な能力が備わっていたら、そもそも大地にはりつく農業も、分業で成り立つ産業社会もあり得ない。\nいつの世も、才覚のある者が新しいビジネスを起こしてゆくのは事実だが、それをビジネスとして成立させるのは社員の労働と献身であるし、それがなければ起業者の才覚が活きることもない。","items":[{"no":47,"sec":"dokkai","stem":"才覚のある人について、この文章ではどのように述べられているか。","options":["優秀な能力を使って、社員を率いてゆく責任がある。","人並み外れた能力をビジネスに活かすことが必要である。","誰の助けを借りることもなく、起業を成功に導くことができる。","他者の支えによって初めて能力をビジネスに活用することができる。"],"ans":4}]},{"passage":"日記とは限りなく私的な記録であり、読者が存在しないどころか、他人には読まれたくない秘密の表現であるともいえる。\nただ一人だけ、奇妙な読者が存在する。いつでも自由に日記を読むことの出来る、日記の筆者である。その読者は筆者とは異なる場に立って、様々な配慮を働かす。万が一日記が盗み読まれたり、死後に他人の目に曝されるような事態が発生した場合、こんなことが書かれているのはまずいのではあるまいか、等々と。しかし、これは限りなく私的な記録である筈の日記にとって矛盾である。\n(注) 盗み読む：他の人の日記や手紙などをこっそり読む","items":[{"no":48,"sec":"dokkai","stem":"矛盾であるとあるが、何が矛盾か。","options":["他人に読まれる可能性のある日記に秘密を書き残すこと。","日記の筆者が他人に読まれることを想定すること。","日記は筆者しか読まないのに、他人にも読みやすく書くこと。","日記は私的なものなのに、他人に自由に読まれるかもしれないこと。"],"ans":1}]}]},{"id":"mon9","title":"問題9 — 中文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"passage":"技術者にとってレース車を開発すると言うのは、非常に魅力があるようなのだ。\nそれはそうだろう。市販車の開発であれば、コストのことや工場のことを考えなければいけないので、自分の考え出した創意工夫を必ずしも反映できるわけではない。\nいいモデルを出したからといって、営業の力が弱ければ売れるとは限らない(少なくとも、多くの開発技術はそう思って歯軋り(注1)をしているに違いない)。しかし、レース車であれば、ある程度、採算無視で色んなことにトライできる。何よりも、営業力とか他の要素に邪魔されることなく、<span class=\"underline-q\">①どんな大メーカーを相手にも対等に優劣を争うことができる</span>わけだ。逆にいうと、言い訳のない世界でもある。敵よりコンマ1秒でも遅れをとれば負けるのだ。そして、それは、はっきりとその場で目に見える。\n(中略)目標設定も単純だ。市販車開発なら、時にはアメリカと欧州の両市場で売れる車を作ってくれと営業から要求されたりする。そこでは技術的に妥協せざるを得ないが、レースは絶対的な速さだけを目指せばいいのだ。その代わり、自分の実力がいまどうであれ、敵の車が75秒でサーキット(注2)を1周していれば、それより速いタイムで走る車を作らないと意味がないのだ。<span class=\"underline-q\">②出来る、出来ない</span>を論じる余地は全くない。また、お分かりのように、他チームの車の真似だけをしていれば、決して「最速」にはならないのも真実なのだ。\n(注1)歯軋りをするここでは、悔しく思う\n(注2)サーキット:レース用コース","items":[{"no":49,"sec":"dokkai","stem":"<span class=\"underline-q\">①どんな大メーカーを相手にも対等に優劣を争うことができる</span>とあるが、なぜか。","options":["創意工夫する力さえあれば売れる車がつくれるから。","性能さえよければ採算のとれるレース車がつくれるから。","営業力に邪魔されずに価格で勝負できる車がつくれるから。","コストなどの要素に影響されずにレースで競える車が造られるから。"],"ans":4},{"no":50,"sec":"dokkai","stem":"<span class=\"underline-q\">②出来る、出来ない</span>とあるが、何が出来る、出来ないのか。","options":["自社の最高タイムを次のレースで上回ること。","技術的に妥協するしかない場合には妥協すること。","ライバル社より少しでも速く走れる車をつくること。","アメリカや欧州のレースでいい成績をおさめること。"],"ans":3},{"no":51,"sec":"dokkai","stem":"この文章によると、レース車の開発は、技術者にとってなぜ魅力的なのか。","options":["高い技術力を示せれば世界で認められるから。","自社が持っている技術力の高さを証明できるから。","明確な目標に向かって開発だけに集中できるから。","開発者としての実力が大メーカーからも評価されるから。"],"ans":3}]},{"passage":"下の文章はプールで水泳をするときの<span class=\"underline-q\">準備運動</span>について書かれたものである。\nよく、プールなどで、水着に着替えると、ろくに準備運動もしないで、水に飛び込んで“水泳のベテラン”のような顔をしている人をみかけますが、これは絶対にまねてはいけない見本です。水泳は全身運動、しかも体にいろいろな負荷や刺激を与える。いわばかなり激しい運動ですから、水に入る前の準備運動をするのは鉄則だといえます。\nまず、筋肉をほぐしましょう。\nプールの<span class=\"underline-q\">水温</span>はたいだい30度前後です。なれている人にとっては温かく感じられますが、初めての人はとても冷たいと思うでしょう。人間の体温は36度前後ですが、水の熱伝導率はとても大きく、空気の20倍だそうですから、水は体から熱をどんどん奪っていってしまいます。そのため、しだいに体が冷えてきて、血行が悪くなり、筋肉のけいれんを起こすことがあるのです。\nこのように、水温によって筋肉に血行不良が起こり、柔軟性を失い、けいれん(注1)を引き起こすことがわかります。そこで、練習を始める前に、あらかじめ筋肉の血行をよくし、筋温度を高めておかなければなりません。準備運動のとき、下半身に重点をおいて柔軟体操をすることです。ふくらはぎ(注2)、太ももの裏の筋肉などをとくに念入りに伸縮させ、ウォーミングアップ(注3)しておきます。\nまた、あわせて関節を柔軟にし、どのような運動も無理なくできるようにしておくことが大切になります。首、肩、ひざ、足首そしてふくらはぎなどのストレッチング(注4)を、あらかじめ十分にしておきましょう。\n(注1)けいれん:筋肉が自分の意志とはかかわりなく、勝手に震えたように動くこと\n(注2)ふくらはぎ:足のこの部分\n(注3)ウォーミングアップする:本格的な運動に入る前に体をよく準備する\n(注4)ストレッチング:伸ばすこと","items":[{"no":52,"sec":"dokkai","stem":"絶対にまねてはいけないのはなぜか。","options":["水着に着替えてすぐに泳がないと体に負荷がかかるから","水泳のようなはげしい運動に準備運動は欠かせないから","ベテランのように泳ぐとすぐ体力を消耗してしまうから","準備運動の省略はベテラン以外にはゆすされていないから"],"ans":2},{"no":53,"sec":"dokkai","stem":"この文章のキーワードを「<span class=\"underline-q\">水温</span>」の他に3つあげるとしたら、以下どの3つあげるか。","options":["筋肉、血行、柔軟","空気、血行、刺激","筋肉、空気、鉄則","負荷、伸縮、鉄則"],"ans":1},{"no":54,"sec":"dokkai","stem":"<span class=\"underline-q\">準備運動</span>について筆者がすすめていることはどんなことか。","options":["水泳は全身運動であるので、全身の筋肉をほぐす運動を水中で行うと","下半身の柔軟体操を行うことともに全身のストレッチングをしておくと","下半身の柔軟体操をする際に太ももの裏の筋肉の状態をしらべておくと","関節を柔軟に動かせるようにいろいろな全身運動を合わせて行うと"],"ans":2}]},{"passage":"日本ではあまり朗読CDで本を読むということをしないが、欧米では人気があり、新刊本から往年の名作まで朗読CD化され、普通の書店でずらりと販売されている。これは視力の低下している人のためだけではなく、車中の眼を休めたいときでも、そうした朗読CDを利用して多くの人が読書を楽しんでいるのだ。\nそれなのに、これが日本であまり利用されないのは、日常的に活字に親しむ文化があるので、わざわざ音声化する必要性を感じていない人が多いだけのことだろう。しかし、「音声は音声なりの楽しみがある」ということを知ったなら、朗読CDは趣味や実用にもっと活用されるに違いない。\n(中略)同じ内容の文章を活字で読むのと、他人が朗読した音声を聞くのでは、ほぼ同じ時間がかかる。「黙読(1)なら、音声を聞くより速い」という意見があるかもしれないが、黙読にかかる時間は、自分で活字を音読(注2)した場合とそれほど変わらないはずだ。\nそして、一定のペースで読み進める限り、自分で活字を読んだ場合と音声で聞いた場合とで、理解できた内容もほぼ同じになるに違いない。\n実はそれでも、脳に入力される情報量は、音声より活字の方が少ないのである。なぜなら、音声で聞いた場合は、文字だけでは区別がつかないニュアンスの違いなどが朗読した人によって適切に判断され、イントネーション(抑揚)や「間」などを含めた音声表現として発話されるからだ。\n(注1)黙読:声に出さないで読むこと\n(注2)音読:声に出して読むこと","items":[{"no":55,"sec":"dokkai","stem":"筆者によると、日本ではあまり朗読CDで本を読むということをしないのはなぜか。","options":["音声化された本の種類が少なく、欲しいものが手に入りにくいから","音声化されたものを誰もが楽しめるという意識がないから","音声化されたもの聞くより活字で読むほうが、習慣になっているから","音声化されたもの聞いても、活字で読むほど理解は深まらないと考えているから"],"ans":3},{"no":56,"sec":"dokkai","stem":"文章を読んだり聞いたりするのにかかる時間と理解できる内容について、筆者はどのように述べているか。","options":["自身で黙読するのと音読するのとでは、時間は同じだが、理解できる内容は差があるだろう。","自身で黙読するのと他人の音読を聞くのとでは、時間と理解できる内容に大きな差はないだろう。","自身で音読するのと他人の音読を聞くのとでは、時間と理解できる内容に差があるだろう。","自身で音読するより他人の音読を聞くほうが、時間はかかるが、理解できる内容に差はないだろう。"],"ans":2},{"no":57,"sec":"dokkai","stem":"筆者の考えに合うのはどれか。","options":["活字で読むより音声で聞くほうが、得られる情報量は多い。","活字で読むのと音声で聞くのとでは、情報量に大きな差は生じない。","活字で読むほうが文字から想像できることが多く、得られる情報量が多い。","音声での表現は、伝える人による情報量の差がほとんどない。"],"ans":1}]}]},{"id":"mon10_12","title":"問題10〜12 — 長文","sec":"dokkai","instr":"次の文章を読んで、後の問いに対する答えとして、最もよいものを 1・2・3・4 から一つ選びなさい。","groups":[{"label":"Mon10","passage":"以下は筆者が本の中で「哲学の役割」について書いたものである。\nここで、大切なのは、とりわけ科学の意義と限界をしっかりと見定めて、人間的知の全体をほんとうに見渡しうる哲学的知の立場を我がのものとすることにある。というのは、科学的知は、二つの限界を持ち、その限界内でしか意義を持たないからである。\n一つには、科学的知は、対象を突き放して、第三者的立場で、自分に関わりのない客観的事象として眺め、しかも、必ずそのつど、特定の観点からだけ対象を扱い、自分が関心を持つ側面だけを取り上げ、それ以外の局面を捨象し、けっして対象の全体を見ようとはしないのである。だから、科学が進むと、細分化が必至となり、隣の研究室でやっていることが、お互いにはまったくわからなくなる。専門化と特殊化が、科学の運命であり、いかに学際化が叫ばれても、根本的には①この傾向には歯止めが利かない。それはちょうど、近代的病院で、病気を扱う諸部門が、外科や内科等々として、細かく分かれ、人間全体を扱ってくれる部署は存在しないのと、同様である。\n二つには、科学的知は、対象を、自分と無関係な事柄として扱う客観性がその特色をなしているので、そこでは、私たちが、自己として、主体的に決断して実践的に生きてゆく行為の問題を、本質的に扱うことができないのである。というのも、ある状況のなかで、いかに生きるべきかをよく考えて、決断し、行為してゆくためには、来し方行く末をよく熟慮して、もはや無い過去と、いまだ無い将来とを視野に収めながら、現在の状況のなかにつき入ってゆかねばならない。しかし、そのような無いものを視野に収めながら、記憶と期待という熱い思いを抱きつつ行為することは、知覚的に有る現在の事実に検証されることによってのみ確実性を得ようとする科学の実証性とは、まったく別個の事柄だからである。客観的な事実確認のみを大事と考える科学の次元と、人生の岐路に立って、右すべきか左すべきかに思い悩む行為者の立場とは、別個の事柄である。②科学は、いかに生きるべきかという後者の問題を、本質的に扱うことができないのである。\nしたがって、科学とは別に、存在の全体を視野に収め、世界のあり方の原理的全体を考慮して、世界観の知を育むと同時に、そのなかで、人間はいかに生きるであるかという、人間の主体的な行為の根本を考究して、人生観の知を形成するところに、哲学的な知の本質的な成立根拠があることになる。哲学が愛し求める真実の知とは、こうした人生観・世界観の根本的な知にほかならない。\n(二郎『現代の哲学』による）\n(注)捨象(しゃしょう)する：捨て去ろ","items":[{"no":58,"sec":"dokkai","stem":"科学的にものごとを見るということを、筆者はどのようにとらえているか。","options":["現在の事象の一部だけを取り上げて、客観的な立場で検証する。","関心のある対象だけを客観的な立場で検証し、未来を予測する。","過去の経験をもとにして客観的な立場で現在の状況を扱う。","人間の知の全体を客観的な立場からだけとらえる。"],"ans":1},{"no":59,"sec":"dokkai","stem":"①この傾向とあるが、どのような傾向か。","options":["近代的な研究を行う部門がさらに増えてきた。","特殊な研究対象が排除されるようになってきた。","研究対象をより実践的にとらえるようになってきた。","専門分野が以前より細かく分かれるようになってきた。"],"ans":4},{"no":60,"sec":"dokkai","stem":"②科学は、いかに生きるべきかという後者の問題を、本質的に扱うことができない とあるがなぜか。","options":["客観的な事実確認を重視するものだから。","現在の行為だけを主体的に扱うものだから。","人間全体を解明することができないから。","人間の考えや行為の多くをまだ実証できないから。"],"ans":1},{"no":61,"sec":"dokkai","stem":"哲学的知の重要性はどこにあるか。","options":["人間の生き方の根本を扱えること。","主体的に考え方法を示せること。","科学的な世界を視野に入れられること","世界のあり方を客観的にとらえられること。"],"ans":1}]},{"label":"Mon11","passage":"A\n1月15日(株)ファッション・ベル代表取締役橋田直子殿(株)A&Bビル開発事業部長前田一郎拝啓貴店におかれましてはますますご繁栄のこととお慶び申し上げます。\nさて、弊社では昨年来、岸本駅前に7階建て貸しビル「岸本タウンビル」を建設中でございますが、来る8月末の完成を予定いたしております。「岸本タウンビル」は、伝統ある岸本商店街を若者層にもよりアピールすることを目指し、ただ今、テナント出店の募集をいたしております。\nつきましては、岸本商店街を長く支えられ、商店街の顔とも言われる貴店にもぜひご出店お願いできればと存じます。当ビルは貴店の現店舗より駅に近く、いっそうのご集客に貢献できることと存じます。ここに出店募集要項を同封させていただきますので、ご検討の上お申し込みを賜りますようお願い申し上げます。\nまずは、書面をもちましてご案内かたがた、お願いを申し上げます。\n敬具\nB\n(株)A&Bビル開発事業部長前田一郎殿(株)ファッション・ベル代表取締役橋田直子拝啓厳寒の候、貴社にはますますご発展のこととお喜び申し上げます。\nこのたび、貴社のテナント募集にあたり、弊店にもお声をかけて頂きましてありがとうございます。岸本商店街の活性化のため、若者にアピールする商店街にしたいという貴社の方針心より賛同し、出店の方向で検討させていただいているところです。\nただ、弊店には現在の平屋になじんだ年配のお客様も多くいらっしゃることから、開店場所については、申込用紙にも記入いたしましたように、弊店の客層に合うよう階または2階のエスカレーター付近を希望しております。いずれ具体的なことを直接相談申し上げたく存じますが、どうか格別のご配慮をいただければ幸いでございます。\nまずは、書面にてお願いいたします。","items":[{"no":62,"sec":"dokkai","stem":"Aの手紙文の目的は何か。","options":["岸本駅前の新しいビルに店を出したいので、良い場所を貸してほしいと頼んでいる。","岸本駅前に完成予定の新しいビルへの出店を呼びかけ、申し込みをお願いしている。","岸本駅前に建設中の新しいビルに、一緒に出店して共同経営をしようと誘っている。","岸本駅前に新しくできるビルに「若者層を呼び込むアイデア募集のお願いをしている。"],"ans":2},{"no":63,"sec":"dokkai","stem":"Aの依頼に応じる条件として、Bではどんなことを挙げているか。","options":["若い客層を考えてエスカレーター近くに出店できること","年配客が来店しやすいような場所を確保してくれること","商店街にある現店舗よりも多くの集客をしてくれること","若者にアピールするような品物を売ることができること"],"ans":2},{"no":64,"sec":"dokkai","stem":"橋田さんからの返事(B)に対して前田さんがさらに返信するときは、前田さんはまずどのようなことを書くべきか。","options":["テナント出店募集のお礼と、集客方法のアイデア募集について","年配客層へのアピールの感謝と、これまでの出店応募数について","出店応募のお礼と、Bの希望する条件に対する検討結果について","申込用紙送付のお願いと、エスカレーターの位置の案内について"],"ans":3}]},{"label":"Mon12","passage":"私たちは、その時の状況や、周りの人のまなざしに合わせるように、行動を決めていることがある。人は一人の時の行動と、人に見られている時とでは行動が変わる。誰かのまなざしを気にして動くのである。そして、多くの人々が生き交う街は、皆が皆に視線を向け合う「まなざしの集合体」\nと言える場所だ。そんな場所では何が適切な行動で、何が不適切な行動なのかという暗黙の公共性が生まれてくる。まなざしの集合によってそこに社会規範が生まれ、それは生活の型となって私たちの認識を導く。\nこうした社会規範や公共性は、かつてはその場所での営みの中で自然に生まれてくるものであった。同じ土地で、たくさんの人が争わずに仲良く生活するためにひつようだからである。それがはっきりと明文化されていったものが、法律や制度がたくさんあるように思える。「街角でギターを鳴らしてはいけません」、「路上で物を売ってはいけません」、あげくの果てには、「公園でキャッチボールをしてはいけません」ということになる。\n一体どういう意味があるのか明確ではないルールは単なる記号だ。それがなぜダメなのかという理由が共有できないまま、ルールは押し付けられて従っていることがある。そうやって与えられているルールに、自分でいちいち判断せずに従っていると、今度はそれが無意識の型となってくる。\nなんとなく街を眺めて、なんとなくその場の型に従っていると、そのうちに周りの物事に対する疑問は次第に薄れていくのである。私たちは、なぜその行動をしているのか、なぜその場所にそのルールがあるのかを改めて考えなくなる。そうすると今度は物事の判断基準が「ルールに従っているかどうか」に変わってしまう。まなざしが集まるからルールが生まれるのではなく、決められたルールにまなざしを合わせることになる。\nルールとは私たちが共有している記号である。街ではどういう振る舞いが共有されていて、どういう行動は許されないのか。それに対して街の人々が想像したことが集合した結果として、取り決められるものである。しかしそれは繰り返される間に、だんだんと単なる記号になり、私たちの行動や認識も、単なる型にはまっていく。だからこそ、もう一度それに正しくまなざしを向けなおすためには、その想像の型をいったん外して、全く違う型を取ってみることが重要なのである。\n(注)あげくの果てには、そして最後には","items":[{"no":65,"sec":"dokkai","stem":"かつての社会規範や公共性について、筆者はどのように述べているか。","options":["自分自身よりも、周りの人を優先するという考えに基づいていた。","同じ土地の人々の間でも、一様に認識されているものではなかった。","同じ土地で人々と争わずに生活していれば、自然に身についてくるものだった。","ともに生活するうえで必要なものとして、同じ土地の人々の間で然に発生した。"],"ans":4},{"no":66,"sec":"dokkai","stem":"無意識の型となってくるとあるが、どういうことか。","options":["法律や制度に合わせることが、特に難しいことではなくなってくる。","法律や制度の必要性を考えずに、従うべきものとして認識してしまう。","法律や制度の意味が分からなくなり、守る必要性を感じなくなってしまう。","法律や制度の意味を理解していなくても、人々の間で共有することができる。"],"ans":2},{"no":67,"sec":"dokkai","stem":"筆者が言いたいことは何か。","options":["ルールは時代の変化に合わせて変えていくことが大切だ。","ルールの有無にかかわらず、自身が正しいと思う行動をすべきだ。","なぜそのルールがあるのかを考えて、行動することが大切だ。","これまでのルールに反している行動でも、社会の中で許容していくべきだ。"],"ans":3}]}]},{"id":"mon13","title":"問題13 — 情報検索","sec":"dokkai","instr":"右のページは、ある大学の施設の利用案内である。下の問いに対する答えとして最もよいものを、1・2・3・4 から一つ選びなさい。","passage":"正南大学＞在学生向け＞施設の使用について＞教室、正南ホール\n教室、正南ホールの使用について\n在学生、大学公認の団体は、勉強会や練習等で教室やホールを使用することができます（営利目的は不可）。利用の可否は、書類の提出後に施設管理委員会が決定します。\n＜教室の使用＞\n申請可能な教室一覧（施設／机の種類／定員／備え付けのプロジェクター、スクリーン）\n① 中教室102〜106／固定／50名／なし\n② 中教室202〜206／固定／50名／あり［各教室1台］\n③ 中教室302〜306／移動可／50名／なし\n④ 小教室401〜410／移動可／20名／あり［各教室1台］\n※備え付けのプロジェクター、スクリーンがない教室で、これらを使用したい場合や、2台以上使用したい場合は、学生課で借りられます。\n＜正南ホールの使用＞\n申請前に、代表者が学生課でホール使用に関する説明を受けてください。ただし、1年以内にホールを使用したことのある場合は必要ありません。設備についての詳細は、「正南ホールについて」のページを参照してください。\n提出書類一覧（提出先：学生課）\n一つの企画に複数の書類の提出が必要な場合は、提出期限の最も早い書類に合わせ、まとめて提出してください。\nA イベント開催申請書：参加者50名以上が見込まれるイベントを開催する。／提出期限：3か月前\nB ホール使用申請書：正南ホールを使用する。／提出期限：2か月前\nC 教室使用申請書：教室を使用する。／提出期限：7日前\nD 備品借用申請書：備え付け以外の備品を追加で借りる。／提出期限：3日前","items":[{"no":68,"sec":"dokkai","stem":"正南大学3年生のヤンさんは、研究発表の練習のために教室を借りたいと思っている。7名が参加予定で、机が動かせる教室がいい。大学のプロジェクターを2台使う予定である。ヤンさんの希望に合う教室はどこか。また、書類は何を提出しなければならないか。","options":["③か④の教室で、③の場合はCとDを、④の場合はCを提出する。","③か④の教室で、どちらの教室を借りる場合もCとDを提出する。","④の教室だけで、CとDを提出する。","④の教室だけで、Cを提出する。"],"ans":2},{"no":69,"sec":"dokkai","stem":"正南大学留学生会は、参加者が100名以上見込まれるスピーチ大会のために「正南ホール」を使用したいと思っている。備え付け以外の備品を追加で借りる必要はない。留学生会が最後にホールを使用したのは2年前である。どのように手続きを進めなければならないか。","options":["AとBを使用希望日の3か月前までに提出する。学生課で説明を受ける必要はない。","AとBを使用希望日の3か月前までに提出する。学生課で説明を受ける必要がある。","Aを使用希望日の3か月前までに、Bを2か月前までに提出する。学生課で説明を受ける必要はない。","Aを使用希望日の3か月前までに、Bを2か月前までに提出する。学生課で説明を受ける必要がある。"],"ans":2}]},{"id":"l
