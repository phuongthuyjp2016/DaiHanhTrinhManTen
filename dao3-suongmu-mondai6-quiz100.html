<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz N1 - 100 câu điền sao (Mondai 6)</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2b2b; --muted:#7a7a7a;
    --accent:#b5402c; --accent2:#2c6e58; --line:#e4ddd2; --wrong:#c0392b; --right:#1e7d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); padding:24px 16px 80px;
  }
  .wrap{max-width:720px; margin:0 auto;}
  header{text-align:center; margin-bottom:20px;}
  header h1{font-size:1.4rem; margin:0 0 4px;}
  header p{color:var(--muted); margin:0; font-size:0.9rem;}

  /* SET SELECTOR */
  .set-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:20px;
  }
  @media(max-width:480px){.set-grid{grid-template-columns:repeat(2,1fr);}}
  .set-btn{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:14px 8px; text-align:center; cursor:pointer; font-family:inherit;
    transition:.15s;
  }
  .set-btn:hover{border-color:var(--accent2); transform:translateY(-1px);}
  .set-btn .set-num{display:block; font-weight:700; font-size:1.05rem; color:var(--accent);}
  .set-btn .set-range{display:block; font-size:0.78rem; color:var(--muted); margin-top:2px;}
  .back-link{
    display:inline-block; margin-bottom:14px; color:var(--accent2); cursor:pointer;
    font-size:0.9rem; text-decoration:underline;
  }

  .progress{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:10px 16px; margin-bottom:16px; font-size:0.85rem; color:var(--muted); flex-wrap:wrap; gap:6px;
  }
  .progress b{color:var(--ink);}
  .progress .set-label{color:var(--accent); font-weight:700;}
  .bar{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:20px;}
  .bar-fill{height:100%; background:var(--accent2); width:0%; transition:width .3s;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:22px 20px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .qnum{
    display:inline-block; background:var(--accent); color:#fff; font-weight:700;
    border-radius:6px; padding:2px 10px; font-size:0.85rem; margin-bottom:10px;
  }
  .sentence{font-size:1.25rem; line-height:2.1; margin:10px 0 18px;}
  .blank{
    display:inline-block; min-width:64px; border-bottom:2px solid var(--muted);
    text-align:center; margin:0 2px; color:var(--muted); font-size:0.95rem;
  }
  .blank.star{border-color:var(--accent); color:var(--accent); font-weight:700;}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:480px){.choices{grid-template-columns:1fr;}}
  .choice-btn{
    border:1.5px solid var(--line); background:#fdfcfa; border-radius:10px;
    padding:12px 14px; font-size:1.05rem; cursor:pointer; text-align:left;
    transition:.15s; font-family:inherit;
  }
  .choice-btn:hover{border-color:var(--accent2);}
  .choice-btn.correct{background:#eaf6ee; border-color:var(--right); color:var(--right); font-weight:700;}
  .choice-btn.wrong{background:#fbeceb; border-color:var(--wrong); color:var(--wrong); font-weight:700;}
  .choice-btn:disabled{cursor:default;}
  .explain{
    margin-top:16px; border-radius:10px; background:#fbf8f1;
    border:1px solid var(--line); font-size:0.92rem; line-height:1.7; display:none;
    padding:16px;
  }
  .explain.show{display:block;}
  .order-badge{
    display:inline-block; background:var(--accent2); color:#fff; font-weight:700;
    border-radius:8px; padding:5px 14px; font-size:0.95rem; margin-bottom:10px; margin-right:8px;
  }
  .grammar-badge{
    display:block; background:#fff3e0; border:1.5px solid #d98c2b; color:#8a5a16; font-weight:700;
    border-radius:8px; padding:8px 14px; font-size:0.93rem; margin-bottom:12px;
  }
  .grammar-badge span{font-weight:400; color:#6b4a14;}
  .explain .full{font-size:1.08rem; margin-bottom:8px; color:var(--ink);}
  .explain .vi{color:var(--accent2); margin-bottom:14px; font-style:italic;}
  .explain hr{border:none; border-top:1px dashed var(--line); margin:12px 0;}
  .step{margin-bottom:10px;}
  .step b{color:var(--ink);}
  .navrow{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  #topNavRow{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:8px 0 4px; margin-top:0 !important;
  }
  .navbtn{
    background:var(--accent2); color:#fff; border:none;
    padding:10px 18px; border-radius:8px; font-size:0.95rem; cursor:pointer;
  }
  .navbtn.secondary{background:#fff; color:var(--accent2); border:1.5px solid var(--accent2);}
  .navbtn:disabled{opacity:.4; cursor:not-allowed;}
  .navbtn.hidden{display:none;}
  .result{
    text-align:center; padding:40px 20px; background:var(--card); border-radius:14px;
    border:1px solid var(--line);
  }
  .result h2{margin-top:0;}
  .restart{
    background:var(--accent); color:#fff; border:none; padding:10px 22px;
    border-radius:8px; font-size:1rem; cursor:pointer; margin-top:12px;
  }
  .remember-box{
    background:#eef6f2; border:1px solid var(--accent2); border-radius:10px;
    padding:12px 16px; margin-top:16px; font-size:0.88rem; color:var(--accent2);
  }
  footer{text-align:center; color:var(--muted); font-size:0.8rem; margin-top:30px;}
</style>
</head>

<div class="wrap">
  <header>
    <h1>JLPT N1 — Mondai 6 練習 (文の文法②)</h1>
    <p>Bộ 100 câu điền sao — Đầy đủ 100/100 câu, chia 16 set x 20 câu</p>
  </header>

  <div id="setSelectArea"></div>

    <div id="resultArea" style="display:none"></div>
  </div>
</div>

 full:"彼は散々借金をしたあげくついには人のお金まで盗む始末だ。", vi:"Anh ta cuối cùng đến mức ăn trộm cả tiền của người khác.",

{n:48, pre:"大学を出た", post:"。いつまでも家でごろごろしているべきではない。", choices:["働こうともしない","子ども","と言うのに","ではあるまいし"], order:[2,4,1,3], star:3,
 full:"大学を出た子どもではあるまいし働こうともしないと言うのに。いつまでも家でごろごろしているべきではない。", vi:"Đâu phải trẻ con mà không định đi làm, dù đã tốt nghiệp đại học — không nên cứ nằm dài ở nhà mãi như vậy.",
 orderDisp:"2-4-1-3",
 grammar:"〜ではあるまいし (đâu phải là... mà)",
 steps:["Mảnh đầu câu (vị trí 1): 「子ども」— khớp với phần câu 「...大学を出た」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「と言うのに」— khớp với phần câu 「。いつまでも家でごろ」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「ではあるまいし」 rồi 「働こうともしない」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 働こうともしない"]},
{n:49, pre:"彼は留学して", post:"ようになった。", choices:["うって変わって","勉強に励む","それまでとは","からというもの"], order:[4,3,1,2], star:3,
 full:"彼は留学してからというものそれまでとはうって変わって勉強に励むようになった。", vi:"Từ khi đi du học, anh ấy đã thay đổi hoàn toàn so với trước, trở nên chăm chỉ học hành.",
 orderDisp:"4-3-1-2",
 grammar:"〜からというもの (từ khi... trở đi) + 〜とは打って変わって (thay đổi hẳn so với...)",
 steps:["Mảnh đầu câu (vị trí 1): 「からというもの」— khớp với phần câu 「...彼は留学して」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「勉強に励む」— khớp với phần câu 「ようになった。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「それまでとは」 rồi 「うって変わって」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = うって変わって"]},
{n:50, pre:"最近の子供は甘やかされている", post:"子供の意見を聞いてやることが大切だ。", choices:["厳しくしつければいい","厳しくしながらも","とよく言われるが","というものでもなく"], order:[3,1,4,2], star:3,
 full:"最近の子供は甘やかされているとよく言われるが厳しくしつければいいというものでもなく厳しくしながらも子供の意見を聞いてやることが大切だ。", vi:"Người ta thường nói trẻ con ngày nay được nuông chiều, cứ nghiêm khắc là được, nhưng không hẳn là vậy, quan trọng là vừa nghiêm khắc vừa biết lắng nghe ý kiến của trẻ.",
 orderDisp:"3-1-4-2",
 grammar:"〜というものでもなく (không hẳn là... — phản biện nhẹ)",
 steps:["Mảnh đầu câu (vị trí 1): 「とよく言われるが」— khớp với phần câu 「...甘やかされている」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「厳しくしながらも」— khớp với phần câu 「子供の意見を聞いてや」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「厳しくしつければいい」 rồi 「というものでもなく」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = というものでもなく"]},
{n:51, pre:"姉は家事は何でも得意だが、", post:"だ。", choices:["並み","プロ","に至っては","料理"], order:[4,3,2,1], star:3,
 full:"姉は家事は何でも得意だが、料理に至ってはプロ並みだ。", vi:"Chị tôi việc nhà gì cũng giỏi, nhưng riêng về nấu ăn thì đạt đến mức như chuyên gia.",
 orderDisp:"4-3-2-1",
 grammar:"Nに至っては (riêng về, nói đến... thì)",
 steps:["Mảnh đầu câu (vị trí 1): 「料理」— khớp với phần câu 「...何でも得意だが、」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「並み」— khớp với phần câu 「だ。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「に至っては」 rồi 「プロ」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = プロ"]},
{n:52, pre:"物質文明が高度に発達した現代社会", post:"。", choices:["われわれは","きらいがある","において","機械に頼りすぎる"], order:[3,1,4,2], star:3,
 full:"物質文明が高度に発達した現代社会においてわれわれは機械に頼りすぎるきらいがある。", vi:"Trong xã hội hiện đại với văn minh vật chất phát triển cao, chúng ta có khuynh hướng quá phụ thuộc vào máy móc.",

{n:53, pre:"あの時、会社を", post:"言ったってどうにもならない。", choices:["といまさら","やめなければ","よかったのに","のように"], order:[2,3,1,4], star:3,
 full:"あの時、会社をやめなければよかったのにといまさらのように言ったってどうにもならない。", vi:"Lúc đó, đáng lẽ nên bỏ việc thì tốt hơn, nhưng giờ nói lại cũng chẳng giải quyết được gì.",

{n:54, pre:"いくら", post:"それまでだ。", choices:["失敗すれば","本番で","重ねても","練習を"], order:[4,3,2,1], star:3,
 full:"いくら練習を重ねても本番で失敗すればそれまでだ。", vi:"Dù có luyện tập bao nhiêu lần, nếu thất bại ngay lúc thi thật thì cũng coi như hết.",
 orderDisp:"4-3-2-1",

 steps:["Mảnh đầu câu (vị trí 1): 「練習を」— khớp với phần câu 「...いくら」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「失敗すれば」— khớp với phần câu 「それまでだ。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「重ねても」 rồi 「本番で」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 本番で"]},
{n:55, pre:"栄養、ほとんどの野菜は", post:"なかなか楽しめない。", choices:["栽培できないため","ならではの味が","生の野菜","農薬なしには"], order:[4,1,3,2], star:3,
 full:"栄養、ほとんどの野菜は農薬なしには栽培できないため生の野菜ならではの味がなかなか楽しめない。", vi:"Vì hầu hết các loại rau hiện nay không thể trồng được mà không dùng thuốc trừ sâu, nên khó mà thưởng thức được vị đặc trưng của rau tươi tự nhiên.",
 orderDisp:"4-1-3-2",
 grammar:"Nなしには〜ない (nếu không có N thì không thể...) + Nならではの (chỉ riêng N mới có)",
 steps:["Mảnh đầu câu (vị trí 1): 「農薬なしには」— khớp với phần câu 「...ほとんどの野菜は」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「ならではの味が」— khớp với phần câu 「なかなか楽しめない。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「栽培できないため」 rồi 「生の野菜」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 生の野菜"]},
{n:56, pre:"その本が", post:"。", choices:["生命の起源","や否や","出版される","をめぐって"], order:[3,2,1,4], star:3,
 full:"その本が出版されるや否や生命の起源をめぐって。", vi:"Ngay khi cuốn sách đó được xuất bản, đã trở thành đề tài tranh luận sôi nổi xung quanh nguồn gốc của sự sống.",
 orderDisp:"3-2-1-4",
 grammar:"〜や否や (ngay khi vừa... thì lập tức) + Nをめぐって (xung quanh, liên quan đến N)",
 steps:["Mảnh đầu câu (vị trí 1): 「出版される」— khớp với phần câu 「...その本が」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「をめぐって」— khớp với phần câu 「。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「や否や」 rồi 「生命の起源」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 生命の起源"]},
{n:57, pre:"彼は世間の批判に", post:"その生涯を終えた。", choices:["研究に終生を捧げ","さらされながらも","をもって","七十三歳"], order:[2,1,4,3], star:3,
 full:"彼は世間の批判にさらされながらも研究に終生を捧げ七十三歳をもってその生涯を終えた。", vi:"Anh ấy dù bị xã hội phê phán, vẫn dành cả đời cho nghiên cứu, và kết thúc cuộc đời mình ở tuổi 73.",
 orderDisp:"2-1-4-3",
 grammar:"〜ながらも (dù... nhưng vẫn) + Nをもって (vào lúc/bằng N — trang trọng)",
 steps:["Mảnh đầu câu (vị trí 1): 「さらされながらも」— khớp với phần câu 「...彼は世間の批判に」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「をもって」— khớp với phần câu 「その生涯を終えた。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「研究に終生を捧げ」 rồi 「七十三歳」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 七十三歳"]},
{n:58, pre:"タバコが体に", post:"。", choices:["やめられない","どうしても","百も承知しつつ","悪いことは"], order:[4,3,2,1], star:3,

 grammar:"〜は百も承知しつつ (dù biết rất rõ... nhưng) + どうしても〜ない (dù thế nào cũng không...)",

{n:59, pre:"手術が成功した", post:"到底無理だろう。", choices:["歩けるようになる","ところで","のがやっとで","山登りなんて"], order:[2,1,3,4], star:3,
 full:"手術が成功したところで歩けるようになるのがやっとで山登りなんて到底無理だろう。", vi:"Dù phẫu thuật thành công thì cũng chỉ mới đi lại được là cùng, leo núi thì chắc còn lâu mới làm được.",
 orderDisp:"2-1-3-4",
 grammar:"Vたところで (dù có... thì cũng) + Vのがやっとで (chỉ mới... là cùng)",

{n:60, pre:"高名の俳句の先生", post:"初心者の私にも十分わかるように易しく語ってくださった。", choices:["さぞ","と思いきや","難しい話をされるだろう","のことだから"], order:[4,1,3,2], star:3,
 full:"高名の俳句の先生のことだからさぞ難しい話をされるだろうと思いきや初心者の私にも十分わかるように易しく語ってくださった。", vi:"Cứ nghĩ thầy giáo haiku nổi tiếng kia chắc sẽ nói chuyện khó hiểu lắm, nhưng thầy đã giảng giải dễ hiểu đến mức ngay cả người mới như tôi cũng hiểu được.",
 orderDisp:"4-1-3-2",

 steps:["Mảnh đầu câu (vị trí 1): 「のことだから」— khớp với phần câu 「...高名の俳句の先生」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「と思いきや」— khớp với phần câu 「初心者の私にも十分わ」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「さぞ」 rồi 「難しい話をされるだろう」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 難しい話をされるだろう"]},
{n:61, pre:"いくら", post:"とは、情けないやつだ。", choices:["聞くにたえない","スピーチをする","とはいえ","準備時間がなかった"], order:[4,3,1,2], star:3,
 full:"いくら準備時間がなかったとはいえ聞くにたえないスピーチをするとは、情けないやつだ。", vi:"Dù nói là không có thời gian chuẩn bị, nhưng bài diễn thuyết tệ đến mức không thể nghe được, thật là một kẻ đáng thất vọng.",

 grammar:"〜とはいえ (dù nói là... nhưng) + 〜にたえない (không thể chịu được, không đáng để...)",

{n:62, pre:"日曜日にわざわざ", post:"に違いない。", choices:["からには","発生した","緊急事態が","呼び出す"], order:[4,1,3,2], star:3,

{n:63, pre:"将来のことで両親と対立すること", post:"思う。", choices:["突き進もうと","自分が","になるとしても","選んだ道を"], order:[3,2,4,1], star:3,

 steps:["Mảnh đầu câu (vị trí 1): 「もちつ」— khớp với phần câu 「...生同士はお互いに」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「ながら」— khớp với phần câu 「生活している。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「もたれつ」 rồi 「助け合い」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 助け合い"]},
{n:82, pre:"大学生の娘は食べる", post:"もしない。", choices:["はおろか","後片付け","食事の支度","ばかりで"], order:[4,3,1,2], star:3,

 grammar:"Nはおろか (N thì khỏi nói đến)",
 steps:["Mảnh đầu câu (vị trí 1): 「ばかりで」— khớp với phần câu 「...学生の娘は食べる」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「後片付け」— khớp với phần câu 「もしない。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「食事の支度」 rồi 「はおろか」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = はおろか"]},
{n:83, pre:"ことここ", post:"だろう。", choices:["政府も","せざるを得ない","に至っては","真剣な対応を"], order:[3,1,4,2], star:3,

 steps:["Mảnh đầu câu (vị trí 1): 「に至っては」— khớp với phần câu 「...ことここ」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「せざるを得ない」— khớp với phần câu 「だろう。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「政府も」 rồi 「真剣な対応を」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 真剣な対応を"]},
{n:84, pre:"緊急時", post:"行動が必要だ。", choices:["冷静","迅速な","且つ","にあっては"], order:[4,1,3,2], star:3,

{n:85, pre:"おもちゃをとられた子どもは、", post:"走ってきた。", choices:["顔で","泣き出さん","ばかりの","今にも"], order:[4,2,3,1], star:3,
 full:"おもちゃをとられた子どもは、今にも泣き出さんばかりの顔で走ってきた。", vi:"Đứa trẻ bị giành mất đồ chơi chạy tới với vẻ mặt như muốn khóc ngay lập tức.",

{n:86, pre:"口先で", post:"のが大切だ。", choices:["なかなか","信用されないから","行動に移す","やると言っただけでは"], order:[4,1,2,3], star:3,

 grammar:"〜だけでは〜ない (chỉ... thì không...)",

{n:88, pre:"ファン", post:"裏切ってはならない。", choices:["野球チーム","あっての","ファンの期待を","だから"], order:[2,1,4,3], star:3,

 grammar:"Nあっての N (nhờ có N mới có...)",

{n:89, pre:"彼は学生の身", post:"を乗りまわしている。", choices:["500万円","高級車","でありながら","からする"], order:[3,1,4,2], star:3,

{n:90, pre:"間違い電話をかけてきて", post:"極まりない。", choices:["切る","とは","非常識","謝りもせずに"], order:[4,1,2,3], star:3,

{n:91, pre:"行政の対応の遅れ", post:"を禁じえない。", choices:["怒り","によって","災害の被害者が増えた","ことに"], order:[2,3,4,1], star:3,

{n:92, pre:"国内の厳しい財政現状を", post:"だろう。", choices:["増税問題について","再議論せずには","すまない","考えれば"], order:[4,1,2,3], star:3,

{n:93, pre:"互いに理屈ばかり", post:"再考してみようではないか。", choices:["机上の空論にすぎないんだから","に即して","述べていても","実情"], order:[3,1,4,2], star:3,

{n:96, pre:"遊んで暮らせるような", post:"日々の生活の営みが何より大事だ。", choices:["となると","一般の市民","いざしらず","大金持ちなら"], order:[4,3,2,1], star:3,

 orderDisp:"4-2-1-3",
 grammar:"〜とは (mà lại... — phê phán) + 〜にあるまじきこと (điều không nên có đối với...)",
 steps:["Mảnh đầu câu (vị trí 1): 「とは」— khớp với phần câu 「...って判定を変える」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「あるまじき」— khớp với phần câu 「ことだ。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「中立であるべき」 rồi 「審判に」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 審判に"]},
{n:100, pre:"", post:"わけで気持ちを切り替えて頑張ろう。", choices:["なにも","後悔しても","始まらない","いまさら"], order:[4,2,1,3], star:3,
 full:"いまさら後悔してもなにも始まらないわけで気持ちを切り替えて頑張ろう。", vi:"Giờ mới hối hận thì cũng chẳng ích gì, nên hãy thay đổi tâm thế và cố gắng lên.",
 orderDisp:"4-2-1-3",
 grammar:"いまさら〜ても (giờ mới... thì cũng) + 〜ても何も始まらない (dù có... cũng chẳng ích gì)",
 steps:["Mảnh đầu câu (vị trí 1): 「いまさら」— đứng đầu câu.","Mảnh cuối câu (vị trí 4): 「始まらない」— khớp với phần câu 「わけで気持ちを切り替」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「後悔しても」 rồi 「なにも」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = なにも"]}
];
const TOTAL = window.QUIZ_DATA.length;
const SET_SIZE = 20;
const NUM_SETS = Math.ceil(TOTAL / SET_SIZE);

let currentSet = 0; // 0-indexed
let idxInSet = 0;
let score = 0;
let answered = false;
let setData = [];

function getSetData(setIndex){
  const start = setIndex * SET_SIZE;
  return window.QUIZ_DATA.slice(start, start + SET_SIZE);
}

const STORAGE_KEY = 'n1_mondai6_progress_100';

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({set:currentSet, idx:idxInSet, score:score}));
  }catch(e){ /* ignore if storage unavailable */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

function renderSetSelector(){
  let html = '';
  const saved = loadProgress();
  if(saved && saved.set>=0 && saved.set<NUM_SETS){
    const sStart = saved.set*SET_SIZE+1;
    const sQuestionNum = sStart + saved.idx;
    html += `<div class="remember-box" style="background:#fdf1ea; border-color:var(--accent);">
      📍 Lần trước bạn đang làm <b>Set ${saved.set+1}</b>, dừng ở <b>câu ${sQuestionNum}</b>.
      <div style="margin-top:10px;">
        <button class="navbtn" id="resumeBtn">Tiếp tục câu ${sQuestionNum} →</button>
        <button class="navbtn secondary" id="clearProgressBtn" style="margin-left:8px;">Xóa tiến độ</button>
      </div>
    </div>`;
  }
  html += '<div class="set-grid">';
  for(let s=0; s<NUM_SETS; s++){
    const start = s*SET_SIZE+1;
    const end = Math.min((s+1)*SET_SIZE, TOTAL);
    const isSaved = saved && saved.set===s;
    html += `<div class="set-btn" data-set="${s}" style="${isSaved?'border-color:var(--accent);':''}">
      <span class="set-num">Set ${s+1}</span>
      <span class="set-range">Câu ${start}–${end}</span>
      ${isSaved?'<span style="display:block;font-size:0.72rem;color:var(--accent);margin-top:2px;">● đang dừng đây</span>':''}
    </div>`;
  }
  html += '</div>';
  html += `<div class="remember-box">💡 Tiến độ được <b>tự động lưu</b> trong trình duyệt này — lần sau mở lại file sẽ thấy nút "Tiếp tục" ở câu bạn vừa dừng.</div>`;
  document.getElementById('setSelectArea').innerHTML = html;
  document.querySelectorAll('.set-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> startSet(parseInt(btn.dataset.set), 0));
  });
  if(saved){
    document.getElementById('resumeBtn').addEventListener('click', ()=> startSet(saved.set, saved.idx, saved.score||0));
    document.getElementById('clearProgressBtn').addEventListener('click', ()=>{
      clearProgress();
      renderSetSelector();
    });
  }
}

function startSet(setIndex, resumeIdx, resumeScore){
  currentSet = setIndex;
  setData = getSetData(setIndex);
  idxInSet = resumeIdx || 0;
  score = resumeScore || 0;
  document.getElementById('setSelectArea').style.display = 'none';
  document.getElementById('quizWrapArea').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  const start = currentSet*SET_SIZE+1;
  const end = Math.min((currentSet+1)*SET_SIZE, TOTAL);
  document.getElementById('setLabel').textContent = `Set ${currentSet+1} (câu ${start}–${end})`;
  document.getElementById('totalNum').textContent = setData.length;
  document.getElementById('scoreNum').textContent = score;
  render();
}

function backToSets(){
  document.getElementById('setSelectArea').style.display = 'block';
  document.getElementById('quizWrapArea').style.display = 'none';
  renderSetSelector();
}

function render(){
  const q = setData[idxInSet];
  answered = false;
  saveProgress();
  document.getElementById('curNum').textContent = idxInSet+1;
  document.getElementById('barFill').style.width = (idxInSet/setData.length*100)+'%';

  let blanksHtml = '';
  for(let p=1;p<=4;p++){
    blanksHtml += `<span class="blank ${p===q.star?'star':''}" id="slot${p}">${p===q.star?'★':'…'}</span>`;
  }

  const stepsHtml = q.steps.map((s,i)=>`<div class="step"><b>${i+1}.</b> ${s}</div>`).join('');
  const isFirst = idxInSet===0;

  document.getElementById('topNavRow').innerHTML = `
    <button class="navbtn secondary" id="prevBtnTop" ${isFirst?'disabled':''}>← Câu trước</button>
    <button class="navbtn hidden" id="nextBtnTop">Câu tiếp theo →</button>
  `;

  const html = `
    <div class="card">
      <span class="qnum">Câu ${q.n}</span>
      <div class="sentence">${q.pre}${blanksHtml}${q.post}</div>
      <div class="choices" id="choiceWrap">
        ${q.choices.map((c,i)=>`<button class="choice-btn" data-i="${i+1}">${i+1}. ${c}</button>`).join('')}
      </div>
      <div class="explain" id="explainBox">
        <div class="order-badge">Thứ tự đúng: ${q.orderDisp}</div>
        <div class="grammar-badge">📌 Cấu trúc/cụm cố định: <span>${q.grammar}</span></div>
        <div class="full">${q.full}</div>
        <div class="vi">🇻🇳 ${q.vi}</div>
        <hr>
        ${stepsHtml}
      </div>
      <div class="navrow">
        <button class="navbtn secondary" id="prevBtn" ${isFirst?'disabled':''}>← Câu trước</button>
        <button class="navbtn hidden" id="nextBtn">Câu tiếp theo →</button>
      </div>
    </div>
  `;
  document.getElementById('quizArea').innerHTML = html;

  document.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>onAnswer(btn, q));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('nextBtnTop').addEventListener('click', next);
  document.getElementById('prevBtnTop').addEventListener('click', prev);
}

function onAnswer(btn, q){
  if(answered) return;
  answered = true;
  const picked = parseInt(btn.dataset.i);
  const correctChoiceNum = q.order[q.star-1];
  document.querySelectorAll('.choice-btn').forEach(b=>{
    const i = parseInt(b.dataset.i);
    if(i===correctChoiceNum) b.classList.add('correct');
    else if(i===picked) b.classList.add('wrong');
    b.disabled = true;
  });
  if(picked===correctChoiceNum) score++;
  document.getElementById('scoreNum').textContent = score;
  saveProgress();
  document.getElementById('explainBox').classList.add('show');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtnTop').classList.remove('hidden');
}

function next(){
  idxInSet++;
  if(idxInSet>=setData.length){ showResult(); return; }
  render();
}

function prev(){
  if(idxInSet<=0) return;
  idxInSet--;
  score = Math.max(0, score); // score not recalculated when going back, just informational
  render();
  // re-show explanation immediately since this question was already answered before
  const q = setData[idxInSet];
  const correctChoiceNum = q.order[q.star-1];
  document.querySelectorAll('.choice-btn').forEach(b=>{
    const i = parseInt(b.dataset.i);
    b.disabled = true;
    if(i===correctChoiceNum) b.classList.add('correct');
  });
  document.getElementById('explainBox').classList.add('show');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtnTop').classList.remove('hidden');
  answered = true;
}

function showResult(){
  document.getElementById('barFill').style.width = '100%';
  document.getElementById('quizArea').style.display='none';
  document.getElementById('topNavRow').innerHTML = '';
  clearProgress();
  const pct = Math.round(score/setData.length*100);
  document.getElementById('resultArea').style.display='block';
  const start = currentSet*SET_SIZE+1;
  const end = Math.min((currentSet+1)*SET_SIZE, TOTAL);
  document.getElementById('resultArea').innerHTML = `
    <div class="result">
      <h2>🎉 Hoàn thành Set ${currentSet+1}!</h2>
      <p style="font-size:1.4rem;">Điểm: <b>${score}</b> / ${setData.length} (${pct}%)</p>
      <p style="color:var(--muted);">Bạn đã hoàn thành câu ${start}–${end}.</p>
      <button class="restart" onclick="startSet(${currentSet})">Làm lại Set này</button>
      <button class="restart" style="background:var(--accent2); margin-left:8px;" onclick="backToSets()">Chọn Set khác</button>
    </div>
  `;
}

document.getElementById('backToSets').addEventListener('click', backToSets);
renderSetSelector();
</script>
<footer>JLPT N1 — Mondai 6 (文の文法②) · Bộ 100 câu — ĐẦY ĐỦ 100/100 câu · 5 set</footer>
</body>
