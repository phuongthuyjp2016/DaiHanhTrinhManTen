<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N1 聴解 問題1 — Đảo Tiếng Vọng</title>
<style>
  :root{ --sea1:#0e5273; --sea2:#2f8fd1; --foam:#eaf8fd;
    --ink:#12324a; --ink-soft:#4a7188; --gold1:#ffd25a; --gold2:#f5a623; --gold-ink:#5a3b22; --gold-shadow:#b9761a;
    --good:#2f9e5c; --good-bg:#e1f5ea; --bad:#d64545; --bad-bg:#fdeaea; --line:#e3d9bf; --card:#fffdf6; --parch:#fbf3dd; }
  *{box-sizing:border-box;}
  html{ background:url('assets/art-001.webp') center top / cover no-repeat fixed, #0e5273; }
  @media (max-width:643px){ html{ background:url('assets/art-002.webp') center top / cover no-repeat fixed, #0e5273; } }
  body{ margin:0; min-height:100dvh; background:transparent;
    color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Segoe UI",sans-serif;
    line-height:1.65; padding-bottom:40px; }
  .baloo{ font-family:'Baloo 2',sans-serif; font-weight:800; }
  .topbar{ background:linear-gradient(180deg,#12658f,#0e5273); padding:12px 18px; position:sticky; top:0; z-index:20; box-shadow:0 2px 10px rgba(0,0,0,.3); border-bottom:2px solid rgba(255,233,176,.35); }
  .topbar-inner{ max-width:840px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .back-link{ color:#fff; font-weight:700; font-size:13px; text-decoration:none; background:rgba(255,255,255,.15); border:1.5px solid rgba(255,255,255,.5); border-radius:14px; padding:6px 14px; white-space:nowrap; }
  .brand{ font-size:13px; letter-spacing:0.04em; color:#eaf8fd; font-weight:700; }
  .brand b{ color:#ffe9b0; }
  .wrap{ max-width:840px; margin:0 auto; padding:22px 16px; }

  /* ---------- game-style card shell ---------- */
  .plank{ background:linear-gradient(180deg,#ffe9b0,#f5a623); border-radius:22px; padding:4px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .plank-inner{ background:var(--card); border-radius:19px; padding:24px; border:2px dashed #e3c67a; }
  .gold-btn{ background:linear-gradient(180deg,var(--gold1),var(--gold2)); border:none; border-radius:16px; padding:15px 34px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; color:var(--gold-ink); cursor:pointer; box-shadow:0 6px 0 var(--gold-shadow); }
  .gold-btn:hover{ filter:brightness(1.04); }
  .gold-btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:0 6px 0 rgba(0,0,0,.15); }
  .ghost-btn{ background:#fff; border:1.5px solid var(--sea2); color:var(--sea1); font-weight:700; padding:11px 22px; border-radius:14px; cursor:pointer; font-size:14px; }
  .ghost-btn:hover{ background:var(--foam); }
  .center{ text-align:center; }

  /* ---------- intro screen ---------- */
  .isle-tag{ display:inline-block; background:var(--sea2); color:#fff; font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:10px; margin-bottom:10px; }
  .mascot-row{ display:flex; align-items:center; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .mascot-img{ width:110px; height:110px; object-fit:contain; filter:drop-shadow(0 8px 14px rgba(0,0,0,.3)); flex:0 0 auto; }
  .mascot-bubble{ flex:1; min-width:200px; background:var(--foam); border:1.5px solid var(--line); border-radius:16px 16px 16px 4px; padding:12px 16px; font-size:14.5px; font-weight:700; color:var(--sea1); }
  .mondai-title{ font-size:27px; color:var(--sea1); margin:2px 0 4px; }
  .mondai-sub{ font-size:13px; color:var(--ink-soft); font-weight:700; margin-bottom:16px; }
  .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .info-box{ background:var(--foam); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
  .info-box .k{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
  .info-box .v{ font-size:14.5px; font-weight:700; color:var(--sea1); }
  .point-box{ background:#fff8e6; border:1.5px dashed var(--gold2); border-radius:12px; padding:14px 16px; margin-bottom:22px; }
  .point-box .pt-title{ font-weight:800; color:var(--gold-shadow); font-size:13.5px; margin-bottom:8px; }
  .point-box ul{ margin:0; padding-left:18px; font-size:13.5px; color:var(--ink-soft); }
  .point-box li{ margin-bottom:5px; }

  /* ---------- quiz screen ---------- */
  .player-plank{ background:linear-gradient(180deg,#ffe9b0,#f5a623); border-radius:16px; padding:2px; margin-bottom:14px; }
  .player-plank.player-sticky{ position:sticky; top:62px; z-index:15; box-shadow:0 8px 16px rgba(0,0,0,.35); margin-bottom:16px; }
  .player-card{ background:linear-gradient(180deg,#0f5583,#0d4a72); border-radius:14px; padding:10px 12px; }
  .player-label{ color:#ffe9b0; font-size:11px; font-weight:800; letter-spacing:.05em; margin-bottom:6px; }
  .player-row-main{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .player-icon-btn{ background:#fff; border:none; border-radius:10px; width:34px; height:30px; font-size:13px; color:var(--sea1); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .player-icon-btn:hover{ filter:brightness(1.05); }
  .player-icon-btn.play-pause{ width:40px; background:linear-gradient(180deg,var(--gold1),var(--gold2)); font-size:15px; }
  .player-time{ color:#eaf8fd; font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums; margin-left:auto; white-space:nowrap; }
  .seek-bar{ width:100%; height:14px; accent-color:#ffd25a; margin-top:6px; cursor:pointer; }
  .player-row-sub{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .speed-group{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .speed-label{ color:#bfe0f0; font-size:10px; font-weight:700; margin-right:1px; }
  .speed-btn{ background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.25); color:#eaf8fd; font-size:10px; font-weight:700; padding:3px 7px; border-radius:8px; cursor:pointer; }
  .speed-btn.active{ background:#ffd25a; border-color:#ffd25a; color:var(--gold-ink); }
  .volume-group{ display:flex; align-items:center; gap:6px; }
  .vol-bar{ width:70px; accent-color:#ffd25a; cursor:pointer; }
  .player-note{ width:100%; color:#bfe0f0; font-size:10.5px; margin-top:6px; }
  @media (max-width:480px){ .player-time{ margin-left:0; width:100%; text-align:right; } }

  .qcard{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 4px 14px rgba(0,0,0,.15); margin-bottom:14px; scroll-margin-top:90px; }
  .qcard-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .qnum-badge{ display:flex; align-items:center; gap:8px; }
  .anchor-num{ width:36px; height:36px; border-radius:50%; background:linear-gradient(180deg,var(--gold1),var(--gold2)); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:0 0 auto; box-shadow:0 3px 0 var(--gold-shadow); }
  .qtitle{ font-weight:800; color:var(--sea1); font-size:14.5px; }
  .reselect-btn{ background:none; border:1.5px solid var(--line); color:var(--ink-soft); font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:10px; cursor:pointer; }
  .reselect-btn:hover{ border-color:var(--sea2); color:var(--sea1); }
  .choice-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  @media (max-width:520px){ .choice-grid{ grid-template-columns:1fr; } }
  .choice{ display:flex; gap:9px; align-items:flex-start; text-align:left; background:var(--foam); border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; cursor:pointer; font-size:14px; color:var(--ink); }
  .choice:hover{ border-color:var(--sea2); }
  .choice.selected{ border-color:var(--sea2); background:#dcf0fb; }
  .choice .letter{ font-weight:800; color:var(--sea1); min-width:16px; }

  .status-strip{ position:sticky; bottom:0; margin-top:6px; padding:14px 0 4px; }
  .status-inner{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; box-shadow:0 -2px 18px rgba(0,0,0,.25); }
  .status-title{ font-size:12px; font-weight:800; color:var(--ink-soft); }
  .status-warn{ font-size:11px; color:var(--bad); font-weight:700; margin-top:2px; }
  .anchor-dots{ display:flex; gap:7px; flex-wrap:wrap; }
  .anchor-dot{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; border:1.5px solid var(--line); color:var(--ink-soft); background:#fff; cursor:pointer; }
  .anchor-dot.done{ background:var(--good-bg); border-color:var(--good); color:var(--good); }
  .status-spacer{ flex:1; }

  /* ---------- results screen ---------- */
  .parchment{ background:linear-gradient(180deg,var(--parch),#f3e2b8); border:2.5px solid var(--gold2); border-radius:22px; padding:28px 20px; text-align:center; margin-bottom:20px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .parchment-mascot{ width:76px; height:76px; object-fit:contain; margin-bottom:6px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.25)); }
  .parchment-title{ font-size:12.5px; font-weight:800; color:var(--gold-shadow); letter-spacing:.06em; margin-bottom:10px; }
  .score-grid{ display:flex; justify-content:center; gap:26px; flex-wrap:wrap; margin-bottom:14px; }
  .score-item .num{ font-size:34px; font-weight:800; color:var(--sea1); font-family:'Baloo 2',sans-serif; }
  .score-item .lbl{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
  .score-msg{ font-size:13.5px; color:var(--ink-soft); margin-bottom:16px; }
  .result-dots{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .result-dot{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; cursor:pointer; border:none; }
  .result-dot.correct{ background:var(--good); color:#fff; }
  .result-dot.wrong{ background:var(--bad); color:#fff; }
  .result-actions{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }

  /* ---------- review screen (continuous scroll) ---------- */
  .review-summary{ text-align:center; color:#eaf8fd; font-weight:700; font-size:14px; margin-bottom:16px; }
  .review-block{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  .review-block-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .review-qtitle{ font-weight:800; color:var(--sea1); font-size:16px; }
  .verdict-badge{ margin-left:auto; font-size:12px; font-weight:800; padding:4px 12px; border-radius:20px; }
  .verdict-badge.ok{ background:var(--good-bg); color:#1f5c3a; }
  .verdict-badge.no{ background:var(--bad-bg); color:#7a2424; }
  .review-question{ font-size:14px; color:var(--ink-soft); margin-bottom:14px; }
  .your-answer-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .ans-chip{ flex:1; min-width:180px; border-radius:10px; padding:10px 14px; font-size:13.5px; font-weight:700; }
  .ans-chip .lbl{ display:block; font-size:11px; font-weight:800; opacity:.75; margin-bottom:2px; }
  .ans-chip.you.ok{ background:var(--good-bg); color:#1f5c3a; border:1px solid var(--good); }
  .ans-chip.you.no{ background:var(--bad-bg); color:#7a2424; border:1px solid var(--bad); }
  .ans-chip.correct{ background:var(--good-bg); color:#1f5c3a; border:1px solid var(--good); }
  .script-panel{ background:#0f3350; border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .script-panel-title{ color:#bfe0f0; font-size:12px; font-weight:800; letter-spacing:.04em; margin-bottom:10px; }
  .script-line{ display:flex; gap:8px; margin-bottom:7px; font-size:13.5px; }
  .script-line .spk{ flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; }
  .script-line.spk-f .spk{ background:#e0729f; }
  .script-line.spk-m .spk{ background:#4f9dbf; }
  .script-line .txt{ color:#eaf8fd; }
  .explain-box{ background:var(--foam); border-left:3px solid var(--sea2); border-radius:8px; padding:12px 14px; font-size:13.5px; margin-bottom:12px; }
  .explain-box b{ display:block; margin-bottom:4px; color:var(--sea1); }
  .keypoint-box{ background:#fff8e6; border:1.5px dashed var(--gold2); border-radius:10px; padding:12px 14px; font-size:13.5px; color:var(--gold-shadow); }
  .keypoint-box b{ display:block; margin-bottom:4px; }
  .review-divider{ text-align:center; color:#bfe0f0; letter-spacing:.3em; font-size:11px; margin:18px 0; opacity:.6; }
</style>
</head>

<div class="topbar">

<div class="wrap" id="app"></div>

<script>
const ISLAND_URL = 'DaiHaiTrinhManten.dc.html?island=4';
const MASCOT_ART = 'assets/art-009.webp';
const AUDIO_SRC = 'assets/audio/MD1/N1_7-2010.mp3';

const QUESTIONS = [
  {
    number: 1,
    question: '女の人が電話で話しています。女の人は講演会の当日、何をしなければなりませんか。',
    choices: ['参加費を支払う。','入場券を受け取る。','田中先生の本を買う。','名前と連絡先を言う。'],
    correctAnswer: 1,
    script: [
      { speaker:'女', text:'もしもし、あのう、来週四日の講演会に参加したいんですが、まだあいてますか。' },
      { speaker:'男', text:'ああ、田中先生の講演会ですね、少々お待ちください。調べますので。' },
      { speaker:'女', text:'お願いします。' },
      { speaker:'男', text:'あっ、もしもし、お待たせしました。まだ余裕がございますので、ご参加いただけます。' },
      { speaker:'女', text:'ああ、そうですか。よかった。' },
      { speaker:'男', text:'参加費は今週末までにお振込みください。' },
      { speaker:'女', text:'はい。' },
      { speaker:'男', text:'当日は一時間前からの開場となりますが。受付で入場券をお受け取りください。開始時間まで、先生の著書の展示販売も行っております。定価の二割引ですので、ぜひご利用ください。' },
      { speaker:'女', text:'あっ、そうですか、わかりました。' },
      { speaker:'男', text:'それでは、恐れ入りますが、お名前とご連絡先お願いします。' }
    ],
    explanation: 'Vào đúng ngày diễn ra buổi giảng (当日), người phụ nữ phải đến quầy lễ tân nhận vé vào cửa: 「受付で入場券をお受け取りください」. Việc đóng phí tham gia phải hoàn tất trước đó (今週末までにお振込み), còn việc nói tên/liên lạc là ngay lúc gọi điện đặt chỗ — không phải việc làm trong ngày diễn ra sự kiện.',
    keypoint: '「受付で入場券を受け取ってください」は「当日」(ngày diễn ra) làm — cần phân biệt với việc đã xong trước đó (振込み) hoặc việc làm ngay lúc gọi điện (nói tên/liên lạc).'
  },
  {
    number: 2,
    question: '会社で女の人と男の人が会議について話しています。男の人が何をしなければなりませんか。',
    choices: ['開始時間を早める。','時間を短くする。','議題を少なくする。','議題を事前に知らせる。'],
    correctAnswer: 3,
    script: [
      { speaker:'女', text:'田中さん、例の金曜日の会議の件なんだけどね。' },
      { speaker:'男', text:'はい。' },
      { speaker:'女', text:'上のほうから、会議の効率化をはかるための指針っていうのが来てるんだけど。' },
      { speaker:'男', text:'はい。' },
      { speaker:'女', text:'それでね、まず会議の開始時間だけど、原則として、九時から十二時までの間って書いてある。' },
      { speaker:'男', text:'ああ。会議は十時からの予定です。' },
      { speaker:'女', text:'あっ、そうでしたね。それから、会議時間なんだけど、二時間を越えちゃいけない。' },
      { speaker:'男', text:'ああ、それは何とかなりますね。' },
      { speaker:'女', text:'それと、議題は四つ以下にして、遅くとも前日までにメールで参加者に知らせておくこと。' },
      { speaker:'男', text:'あっ、そうなんですか。では、今日のうちにやっておきます。数のほうは問題ないですね。' },
      { speaker:'女', text:'そうね、じゃあ、準備、よろしくね。' },
      { speaker:'男', text:'はい、わかりました。' }
    ],
    explanation: 'Theo chỉ thị mới: giờ họp (10 giờ, nằm trong khung 9–12 giờ) và thời lượng (dưới 2 tiếng) đều đã đạt yêu cầu, không cần đổi. Chỉ còn việc gửi email thông báo nghị trình cho người tham dự trước 1 ngày, và người đàn ông nói sẽ làm ngay trong hôm nay: 「今日のうちにやっておきます」.',
    keypoint: 'Chú ý câu「今日のうちにやっておきます」— dấu hiệu chỉ hành động SẼ làm ngay, đó chính là đáp án.'
  },
  {
    number: 3,
    question: 'ホテルで男がフロントに話しています。フロントの人はこの後、客室係りにどんな指示を出しますか。',
    choices: ['洗面所を点検する。','毛布を補充する。','別の部屋を用意する。','荷物を運ぶ。'],
    correctAnswer: 0,
    script: [
      { speaker:'女', text:'はい、フロントでございます。' },
      { speaker:'男', text:'あのう、洗面台の水の流れが悪いんだけど、後、毛布もって来てくれないかな。' },
      { speaker:'女', text:'大変申し訳ございません。あの、お客様。毛布はクローゼットの上の棚にございます。洗面台のほうは、係りの者を伺わせますので、しばらく、お待ちいただけますでしょうか。' },
      { speaker:'男', text:'どのくらいかかるかな。疲れてて早く寝たいんだよね。' },
      { speaker:'女', text:'それでしたら。ほかのお部屋にお移りいただくことも可能ですが。' },
      { speaker:'男', text:'うーん、荷物あけちゃったし、とりあえず見てくれる。' },
      { speaker:'女', text:'承知いたしました。すぐに手配いたします。' }
    ],
    explanation: 'Khách phàn nàn nước ở bồn rửa mặt chảy yếu. Lễ tân nói chăn đã có sẵn trong tủ nên không cần mang thêm, còn khoản bồn rửa sẽ cử nhân viên tới kiểm tra. Khách từ chối đổi phòng, chỉ muốn "xem giúp" (とりあえず見てくれる) — nên lễ tân sẽ chỉ đạo nhân viên phòng đi kiểm tra bồn rửa mặt.',
    keypoint: '「見てくれる」= khách yêu cầu kiểm tra tại chỗ, không phải đổi phòng hay mang thêm chăn.'
  },
  {
    number: 4,
    question: '会社で男の人と女の人が話しています。女の人は、明日何をしなければなりませんか。',
    choices: ['国内出張に出かける。','会議の通訳をする。','資料を作成する。','海外出張に出かける。'],
    correctAnswer: 1,
    script: [
      { speaker:'男', text:'今度の国際共同プロジェクトについてなんだけど。' },
      { speaker:'女', text:'はい、来月から予備調査のために、国連の支社を幾つか回る予定です。' },
      { speaker:'男', text:'あっ、そう。それでね。この件で明日アメリカの会社から責任者がくるんだけど、君に通訳を頼めないかな。実は予定していた人は急にこられなくなってね。' },
      { speaker:'女', text:'えっ？急に言われても、私に代役が務まりますか。' },
      { speaker:'男', text:'できそうな人は君しかいないんだよ。会議の資料を読み込んで準備してくれないかな。頼むよ。' },
      { speaker:'女', text:'えっ、そんな大役、自信ないんですが。' },
      { speaker:'男', text:'何とかお願いします。' },
      { speaker:'女', text:'はい。' },
      { speaker:'男', text:'ああ、そうそう、例の海外出張の件は許可が下りたから、そっちのほうの準備もよろしく。' },
      { speaker:'女', text:'はい、わかりました。' }
    ],

    keypoint: 'Từ khóa「明日」giới hạn phạm vi câu hỏi — chỉ lấy đúng việc diễn ra vào ngày mai.'
  },
  {
    number: 5,
    question: '繊維工場の男の人が取引先の女の人と話しています。男の人はこの後、どうしますか。',
    choices: ['最新の方法で生地を織る。','生地の色を変える。','生地から服を作る。','人手を増やす。'],
    correctAnswer: 1,
    script: [
      { speaker:'男', text:'どうですか。この生地なんですけど。' },
      { speaker:'女', text:'ああ、いいですね。この触り心地はなかなかほかではないんですよね。' },
      { speaker:'男', text:'そうでしょう。うちでは昔からの織り方で作ってるんで、この独特の感じが出るんですよ。' },
      { speaker:'女', text:'そうですか。新しいやり方ですと、こうはならないんですか。' },
      { speaker:'男', text:'いや、無理ですね。手間がかかっても、うちではその点にこだわってますからね。' },
      { speaker:'女', text:'なるほどね。色合いはかえられますか。' },
      { speaker:'男', text:'ご希望をいっていただければ、微妙な違いも出せますよ。' },
      { speaker:'女', text:'じゃあ、もう少し、淡い感じを出していただければ、私たちのイメージに合うんですが。' },
      { speaker:'男', text:'ああ、そうですか。わかりました。じゃ、2、3日ください。' },

      { speaker:'男', text:'うん、ちょっと時間かかりますね。今、人手が足りないんですよ。厳しくてね。' },
      { speaker:'女', text:'ああ、そうですか。それですと、難しいですね。' },
      { speaker:'男', text:'すみません。じゃ、ご希望に合うようにやってみます。' },
      { speaker:'女', text:'はい、お願いします。' }
    ],
    explanation: 'Khách hàng nữ đưa ra 2 yêu cầu: đổi màu vải nhạt hơn (được đồng ý, hẹn 2–3 ngày) và tăng số lượng sản xuất (bị từ chối vì thiếu nhân lực). Cuối cùng người đàn ông nói sẽ cố làm theo đúng nguyện vọng của khách — điều duy nhất khả thi còn lại là đổi màu vải.',
    keypoint: 'Yêu cầu đầu (đổi màu) được nhận lời「わかりました」; yêu cầu sau (tăng số lượng) bị từ chối vì「人手が足りない」.'
  },
  {
    number: 6,
    question: '電話で女の人と男の人が話しています。男の人はホテルにキャンセル料をいくら払わなければなりませんか。',
    choices: ['10,000円','8,000円','2,000円','1,000円'],
    correctAnswer: 1,
    script: [
      { speaker:'女', text:'はい、北国ホテルでございます。' },
      { speaker:'男', text:'あのう、明日の予約お願いしてた山田ですが、急用ができてキャンセルしたいんですけど。' },
      { speaker:'女', text:'かしこまりました。山田様ですね。一万円の部屋をご予約ですね。はい、そうしましたら、所定のキャンセル料をいただくことになりますが、よろしいでしょうか。' },
      { speaker:'男', text:'えーと、キャンセル料は確か、80パーセントでしたっけ。' },
      { speaker:'女', text:'えー、あのう。ご連絡なしの場合は全額。ご連絡いただいた場合は、当日が80パーセント、前日は二十パーセントとなっております。' },
      { speaker:'男', text:'ええー、痛いなあ。' },
      { speaker:'女', text:'あっ、お客様、申し訳ございません。前日の午後九時以降にご連絡いただいた場合は、当日扱いとさせていただいております。ただいま十時を回っておりますので。' },
      { speaker:'男', text:'ええー。なに。もう当日扱いになるの？それはひどいなあ。' },
      { speaker:'女', text:'誠に申し訳ございません。お送りしたパンフレットに明記しておりますので。' },
      { speaker:'男', text:'そうか。しょうがないな。' }
    ],
    explanation: 'Phòng giá 10.000円. Không báo hủy trước: phí 100% (10.000円); báo hủy trong ngày: 80% (8.000円); báo hủy từ hôm trước: 20% (2.000円). Vì khách gọi hủy sau 21h hôm trước — quá giờ quy định — nên bị tính theo mức "hủy trong ngày": 80% × 10.000円 = 8.000円.',
    keypoint: 'Phân biệt 3 mức phí theo thời điểm báo hủy: không báo (toàn phần) / báo trong ngày (80%) / báo từ hôm trước (20%).'
  }
];

let screen = 'intro'; // intro | quiz | results | review
let selected = new Array(QUESTIONS.length).fill(null);
let isSeeking = false;

const player = new Audio(AUDIO_SRC);
player.preload = 'metadata';

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function togglePlayPause() {
  if (player.paused || player.ended) player.play().catch(() => {});
  else player.pause();
}
function seekBy(delta) {
  player.currentTime = clamp(player.currentTime + delta, 0, player.duration || 0);
}
function replayAudio() {
  player.currentTime = 0;
  player.play().catch(() => {});
}
function setRate(r) {
  player.playbackRate = r;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.rate) === r));
}
function onSeekInput(val) {
  isSeeking = true;
  const t = document.getElementById('playerTime');
  if (t) t.textContent = `${fmtTime((val/100) * (player.duration||0))} / ${fmtTime(player.duration)}`;
}
function onSeekChange(val) {
  player.currentTime = (val/100) * (player.duration || 0);
  isSeeking = false;
}
function onVolumeInput(val) {
  player.volume = val;
  player.muted = false;
  const icon = document.getElementById('volIcon');
  if (icon) icon.textContent = val == 0 ? '🔇' : val < 0.5 ? '🔈' : '🔊';
}

player.addEventListener('play', () => syncPlayerUI());
player.addEventListener('pause', () => syncPlayerUI());
player.addEventListener('ended', () => syncPlayerUI());
player.addEventListener('loadedmetadata', () => syncPlayerUI());
player.addEventListener('timeupdate', () => syncPlayerUI());

function syncPlayerUI() {
  const btn = document.getElementById('playPauseBtn');
  const timeEl = document.getElementById('playerTime');
  const seekEl = document.getElementById('seekBar');
  if (!btn) return;
  btn.textContent = (!player.paused && !player.ended) ? '⏸️' : '▶️';
  if (timeEl) timeEl.textContent = `${fmtTime(player.currentTime)} / ${fmtTime(player.duration)}`;
  if (seekEl && !isSeeking) {
    const pct = player.duration ? (player.currentTime / player.duration) * 100 : 0;
    seekEl.value = pct;
  }
}

function render() {
  const app = document.getElementById('app');
  if (screen === 'intro') app.innerHTML = renderIntro();
  else if (screen === 'quiz') app.innerHTML = renderQuiz();
  else if (screen === 'results') app.innerHTML = renderResults();
  else if (screen === 'review') app.innerHTML = renderReview();
}

function renderIntro() {
  return `
  <div class="plank"><div class="plank-inner">
    <span class="isle-tag">🏝 ĐẢO TIẾNG VỌNG</span>
    <div class="mascot-row">
      <img class="mascot-img" src="${MASCOT_ART}" alt="Cá Mập Âm Thanh">
      <div class="mascot-bubble">Nghe hội thoại thật kỹ rồi chọn đáp án đúng nhé, nhà thám hiểm!</div>
    </div>
    <div class="mondai-title baloo">MONDAI 1 · 課題理解</div>
    <div class="mondai-sub">Nghe hội thoại/đoạn nói ngắn, chọn hành động cần làm tiếp theo</div>

    <div class="info-grid">
      <div class="info-box"><div class="k">Số câu hỏi</div><div class="v">6 câu</div></div>
      <div class="info-box"><div class="k">Hình thức</div><div class="v">Nghe rồi chọn 1/4</div></div>
    </div>

    <div class="point-box">
      <div class="pt-title">💡 Cách làm bài (Mondai 1 · 課題理解)</div>
      <ul>
        <li>Câu hỏi được đọc <b>trước</b> hội thoại — hãy đọc trước 4 lựa chọn trong lúc chờ để đoán hướng nội dung.</li>
        <li>Câu hỏi thường hỏi việc làm <b>tiếp theo / đúng lúc đó</b> (これから, 明日, 当日...) — chú ý mốc thời gian được hỏi.</li>
        <li>Đáp án đúng thường nằm ở <b>quyết định cuối cùng</b> trong hội thoại, không phải ý kiến ban đầu.</li>
        <li>Chọn đáp án cho cả 6 câu bên dưới, có thể đổi ý bất cứ lúc nào trước khi nộp bài.</li>
        <li>Sau khi nộp bài mới được xem đáp án đúng, script hội thoại và giải thích.</li>
      </ul>
    </div>

    <div class="center">
      <button class="gold-btn" onclick="goToQuiz()">🎧 Bắt Đầu Nghe</button>
    </div>
  </div></div>`;
}

function goToQuiz() {
  screen = 'quiz';
  render();
  syncPlayerUI();
}

function renderPlayerBar(note, sticky) {
  return `
  <div class="player-plank${sticky ? ' player-sticky' : ''}"><div class="player-card">
    <div class="player-label">🎧 MONDAI 1</div>
    <div class="player-row-main">
      <button class="player-icon-btn play-pause" id="playPauseBtn" onclick="togglePlayPause()">▶️</button>
      <button class="player-icon-btn" onclick="seekBy(-5)" title="Lùi 5 giây">⏪</button>
      <button class="player-icon-btn" onclick="seekBy(5)" title="Tiến 5 giây">⏩</button>
      <button class="player-icon-btn" onclick="replayAudio()" title="Nghe lại từ đầu">🔁</button>
      <div class="player-time" id="playerTime">00:00 / 00:00</div>
    </div>
    <input type="range" class="seek-bar" id="seekBar" min="0" max="100" step="0.1" value="0"
      oninput="onSeekInput(this.value)" onchange="onSeekChange(this.value)">
    <div class="player-row-sub">
      <div class="speed-group">
        <span class="speed-label">Tốc độ</span>
        <button class="speed-btn" data-rate="0.75" onclick="setRate(0.75)">0.75x</button>
        <button class="speed-btn active" data-rate="1" onclick="setRate(1)">1.0x</button>
        <button class="speed-btn" data-rate="1.25" onclick="setRate(1.25)">1.25x</button>
        <button class="speed-btn" data-rate="1.5" onclick="setRate(1.5)">1.5x</button>
      </div>
      <div class="volume-group">
        <span id="volIcon">🔊</span>
        <input type="range" class="vol-bar" min="0" max="1" step="0.01" value="1" oninput="onVolumeInput(this.value)">
      </div>
    </div>
    ${note ? `<div class="player-note">${note}</div>` : ''}
  </div></div>`;
}

function renderQuiz() {
  const answeredCount = selected.filter(s => s !== null).length;
  return `
  ${renderPlayerBar('💡 Nghe rồi chọn đáp án cho 6 câu bên dưới, có thể tua/nghe lại thoải mái.', false)}

  <div id="qlist">
    ${QUESTIONS.map((q, qi) => `
      <div class="qcard" id="qcard-${qi}">
        <div class="qcard-head">
          <div class="qnum-badge"><div class="anchor-num">${q.number}</div><div class="qtitle">${q.number} 番</div></div>
          <button class="reselect-btn" onclick="clearChoice(${qi})">↺ Chọn lại</button>
        </div>
        <div class="choice-grid">
          ${q.choices.map((opt, oi) => `
            <div class="choice" id="choice-${qi}-${oi}" onclick="selectChoice(${qi},${oi})">
              <span class="letter">${oi+1}</span><span>${opt}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
  </div>

  <div class="status-strip"><div class="status-inner">
    <div>
      <div class="status-title">回答状況 · Đã chọn ${answeredCount}/${QUESTIONS.length}</div>
      <div class="anchor-dots" style="margin-top:6px;">
        ${QUESTIONS.map((q, qi) => `<div class="anchor-dot ${selected[qi] !== null ? 'done' : ''}" onclick="scrollToQ(${qi})">${selected[qi] !== null ? '✓' : q.number}</div>`).join('')}
      </div>
    </div>
    <div class="status-spacer"></div>
    <div>
      <button class="gold-btn" onclick="submitQuiz()">📮 Nộp Bài</button>
      <div class="status-warn">※Không thể đổi đáp án sau khi nộp bài</div>
    </div>
  </div></div>
  `;
}

function selectChoice(qi, oi) {
  selected[qi] = oi;
  refreshChoiceUI();
  refreshStatusStrip();
}
function clearChoice(qi) {
  selected[qi] = null;
  refreshChoiceUI();
  refreshStatusStrip();
}
function refreshChoiceUI() {
  QUESTIONS.forEach((q, qi) => {
    q.choices.forEach((_, oi) => {
      const el = document.getElementById(`choice-${qi}-${oi}`);
      if (el) el.classList.toggle('selected', selected[qi] === oi);
    });
  });
}
function refreshStatusStrip() {
  const answeredCount = selected.filter(s => s !== null).length;
  const titleEl = document.querySelector('.status-title');
  if (titleEl) titleEl.textContent = `回答状況 · Đã chọn ${answeredCount}/${QUESTIONS.length}`;
  document.querySelectorAll('.anchor-dot').forEach((el, qi) => {
    const done = selected[qi] !== null;
    el.classList.toggle('done', done);
    el.textContent = done ? '✓' : QUESTIONS[qi].number;
  });
}
function scrollToQ(qi) {
  const el = document.getElementById(`qcard-${qi}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function submitQuiz() {
  const unanswered = selected.findIndex(s => s === null);
  if (unanswered !== -1) {
    if (!confirm(`Bạn chưa chọn đáp án cho câu ${QUESTIONS[unanswered].number}. Vẫn muốn nộp bài?`)) return;
  }
  player.pause();
  saveProgress();
  screen = 'results';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function correctCount() {
  return QUESTIONS.reduce((acc, q, qi) => acc + (selected[qi] === q.correctAnswer ? 1 : 0), 0);
}

function saveProgress() {
  const correct = correctCount();
  const total = QUESTIONS.length;
  try {
    const bkey = 'dao5_mondai1_best';
    const prevBest = parseInt(localStorage.getItem(bkey) || '0', 10);
    if (correct > prevBest) localStorage.setItem(bkey, String(correct));
    const key = 'dc_tool_progress';
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    const best = Math.max(correct, (all['dao5-tiengvong-mondai1-nghe.html'] && all['dao5-tiengvong-mondai1-nghe.html'].correct) || 0);
    all['dao5-tiengvong-mondai1-nghe.html'] = { correct: best, total };
    localStorage.setItem(key, JSON.stringify(all));
  } catch (e) {}
}

function renderResults() {
  const correct = correctCount();
  const total = QUESTIONS.length;
  const pct = Math.round(correct / total * 100);
  const score = correct * 20;
  const msg = correct === total ? '🎉 Xuất sắc! Bạn đã nghe bắt trọn cả 6 câu.'
    : correct >= total * 0.7 ? 'Khá tốt! Xem lại vài câu sai để hiểu rõ hơn nhé.'
    : 'Hãy xem đáp án & script để rút kinh nghiệm cho lần sau.';
  return `
  <div class="parchment">
    <img class="parchment-mascot" src="${MASCOT_ART}" alt="Cá Mập Âm Thanh">
    <div class="parchment-title">⚓ MONDAI 1 · 結果発表</div>
    <div class="score-grid">
      <div class="score-item"><div class="num baloo">${correct}/${total}</div><div class="lbl">正解数</div></div>
      <div class="score-item"><div class="num baloo">${pct}%</div><div class="lbl">正答率</div></div>
      <div class="score-item"><div class="num baloo">${score}</div><div class="lbl">SCORE</div></div>
    </div>
    <div class="score-msg">${msg}</div>
    <div class="result-dots">
      ${QUESTIONS.map((q, qi) => {
        const ok = selected[qi] === q.correctAnswer;
        return `<button class="result-dot ${ok ? 'correct' : 'wrong'}" onclick="openReview()">${q.number}</button>`;
      }).join('')}
    </div>
    <div class="result-actions">
      <button class="ghost-btn" onclick="restartQuiz()">🔄 Làm lại</button>
      <button class="gold-btn" onclick="openReview()">📖 Xem đáp án & giải thích</button>
    </div>
  </div>
  <div class="center">
    <button class="ghost-btn" onclick="window.location.href=ISLAND_URL">🏝 Về Đảo Tiếng Vọng</button>
  </div>
  `;
}

function openReview() {
  screen = 'review';
  render();
  syncPlayerUI();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  selected = new Array(QUESTIONS.length).fill(null);
  player.pause();
  screen = 'intro';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderReview() {
  const correct = correctCount();
  return `
  ${renderPlayerBar('', true)}
  <div class="review-summary">MONDAI 1 · 答えと解説 — ${correct}/${QUESTIONS.length} 正解</div>
  ${QUESTIONS.map((q, qi) => {
    const yourIdx = selected[qi];
    const isCorrect = yourIdx === q.correctAnswer;
    return `
    <div class="review-block">
      <div class="review-block-head">
        <div class="review-qtitle">${q.number} 番</div>
        <div class="verdict-badge ${isCorrect ? 'ok' : 'no'}">${isCorrect ? '🟢 正解' : '🔴 不正解'}</div>
      </div>
      <div class="review-question">${q.question}</div>

      <div class="your-answer-row">
        <div class="ans-chip you ${isCorrect ? 'ok' : 'no'}">
          <span class="lbl">あなたの答え</span>${yourIdx !== null ? (yourIdx+1) + ' 番 — ' + q.choices[yourIdx] : '(chưa chọn)'}
        </div>
        ${!isCorrect ? `<div class="ans-chip correct"><span class="lbl">正解</span>${q.correctAnswer+1} 番 — ${q.choices[q.correctAnswer]}</div>` : ''}
      </div>

      <div class="script-panel">
        <div class="script-panel-title">📜 SCRIPT — 会話の内容</div>
        ${q.script.map(line => `
          <div class="script-line ${line.speaker === '女' ? 'spk-f' : 'spk-m'}">
            <div class="spk">${line.speaker}</div>
            <div class="txt">${line.text}</div>
          </div>
        `).join('')}
      </div>

      <div class="explain-box"><b>💡 解説</b>${q.explanation}</div>
      <div class="keypoint-box"><b>⭐ Điểm quan trọng</b>${q.keypoint}</div>
    </div>
    ${qi < QUESTIONS.length - 1 ? '<div class="review-divider">━━━━━━━━━━━━━━━━</div>' : ''}
    `;
  }).join('')}

  <div class="center" style="margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
    <button class="ghost-btn" onclick="restartQuiz()">🔄 Làm lại</button>
    <button class="ghost-btn" onclick="window.location.href=ISLAND_URL">🏝 Về Đảo Tiếng Vọng</button>
  </div>
  `;
}

render();
</script>
</body>
</html>
