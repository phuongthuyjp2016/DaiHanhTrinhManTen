i, không phải thay đổi ý thức."}]}],"Mon10-9":[{"huongTuDuy":"①帰ってきたなあと実感する — tìm khoảnh khắc cụ thể được mô tả ngay trước câu này.","chotY":"「自然の色彩が**非常にやわらかい**ことに毎回あらためて気づかされて、そうして、①帰ってきたなあと実感する」.","lienKetJP":"列車の窓から景色を見る → 自然の色彩がやわらかいと気づく → ①帰ってきたなあと実感する","lienKetVI":"Nhìn cảnh vật qua cửa sổ tàu → nhận ra màu sắc tự nhiên rất mềm mại → cảm nhận 'đã về đến nhà'","correct":{"jp":"日本の**自然の色合い**をあらためて**意識した**とき","vi":"Khớp trực tiếp với 「自然の色彩が非常にやわらかいことに…気づかされて」."},"wrong":[{"key":"A","jp":"都心に向かう列車のなかで**静けさ**を感じたとき","trap":"bẫy chi tiết phụ","vi":"Sự yên tĩnh là mô tả ở đoạn TRƯỚC, không phải nguyên nhân trực tiếp gây cảm giác 'đã về' ở câu ①."},{"key":"C","jp":"日本には**緑が多い**ことにあらためて気づいたとき","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — bài nói về MÀU SẮC mềm mại nói chung, không riêng về 'nhiều cây xanh'."},{"key":"D","jp":"**四季の変化**が感じられるような色に気づいたとき","trap":"bẫy chi tiết phụ","vi":"'Sự thay đổi theo mùa' là chi tiết phụ xuất hiện sau, không phải nguyên nhân trực tiếp của ①."}]},{"huongTuDuy":"Đoạn về phản ứng của tác giả khi đi du lịch NƯỚC NGOÀI — đối lập với cảm nhận khi về nước.","chotY":"「緑の多い町だとか、水墨画みたいだとか、その程度の**感想は抱くが**、その**色彩について特別何も思わない**」.","lienKetJP":"外国の自然＝緑のなかを歩く、見とれることもある → しかし色彩については特別何も思わない","lienKetVI":"Tự nhiên nước ngoài: đi giữa cây xanh, có lúc say mê ngắm → nhưng KHÔNG có ấn tượng đặc biệt về màu sắc lúc đó","correct":{"jp":"景色にひかれることはあるが、**色彩に特別な印象は持たない**","vi":"Khớp trực tiếp với 「色彩について特別何も思わない」 — chỉ có ấn tượng về cảnh, không phải về màu sắc."},"wrong":[{"key":"A","jp":"色彩の**多様さに驚く**ことはあるが、特別よいとは感じない","trap":"bẫy chi tiết phụ","vi":"Bài không nói về 'ngạc nhiên trước sự đa dạng màu sắc' — nói về việc KHÔNG chú ý đến màu sắc."},{"key":"B","jp":"色彩が**強烈だと思う**ことはあるが、見とれることはあまりない","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — cảm nhận 'màu sắc mạnh mẽ' chỉ xuất hiện SAU KHI về nước, không phải lúc đang ở nước ngoài."},{"key":"D","jp":"懐かしい景色だと思うことはあるが、色彩が**やわらかい**とは思わない","trap":"bẫy chi tiết phụ","vi":"'Cảnh hoài niệm' không có trong bài — và 'mềm mại' là từ chỉ dùng cho Nhật Bản, không liên quan câu hỏi này."}]},{"huongTuDuy":"Cảm nhận về phong cảnh đô thị khi về nước — cần phân biệt 'thích/ghét' với cảm giác 'gần gũi'.","chotY":"「**好きとか嫌いではなくて**、**私に含まれているかのような近しさ**を覚えるのだ」.","lienKetJP":"都心の風景をきれいだと思ったことはない → でも帰ってくると毎回近しく思う → 自分に含まれているような近しさ","lienKetVI":"Chưa từng thấy phong cảnh đô thị đẹp → nhưng mỗi lần về vẫn thấy gần gũi → cảm giác như một phần của bản thân","correct":{"jp":"**自分の一部**であるような**親しみ**を感じる","vi":"Khớp trực tiếp với 「私に含まれているかのような近しさ」 — không phải vì thích, mà vì cảm giác thuộc về bản thân."},"wrong":[{"key":"B","jp":"自分を**受け入れてくれる優しさ**を感じる","trap":"bẫy mọi người","vi":"Tự thêm ý 'sự ân cần được chấp nhận' — không có trong bài."},{"key":"C","jp":"自分の**好みに合っている**場所だと感じる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — bài nói rõ KHÔNG phải vì 'thích' (好きとか嫌いではなくて)."},{"key":"D","jp":"自分の**ふだんの生活**に戻ったように感じる","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng thiếu sắc thái cốt lõi 'một phần của bản thân' — đây là ý ở đoạn KHÁC (câu kết bài)."}]},{"huongTuDuy":"Câu hỏi tổng kết quan điểm về 'du lịch' — bám vào câu kết bài, và đối chiếu với trải nghiệm đi đón người khác.","chotY":"「旅というのは…**周囲の景色が**、わざわざ目を凝らすこともない**日常に戻ったときに終わる**のだと知った」.","lienKetJP":"空港に着いたときには終わらない → 景色が日常に戻ったとき → そこで旅は終わる","lienKetVI":"Không kết thúc khi đến sân bay → mà khi cảnh vật trở lại thành đời thường quen thuộc → lúc đó du lịch mới thực sự kết thúc","correct":{"jp":"旅は、**見慣れた風景**が再び**ありふれた日常**になるまで続いている","vi":"Khớp trực tiếp với câu kết: du lịch tiếp diễn cho đến khi cảnh quen thuộc trở lại thành đời thường."},"wrong":[{"key":"A","jp":"旅は、**慣れ親しんだ景色のよさ**を**再確認**させてくれる","trap":"bẫy chi tiết phụ","vi":"Không phải trọng tâm — bài tập trung vào THỜI ĐIỂM kết thúc của du lịch, không phải tác dụng của nó."},{"key":"B","jp":"旅は、見慣れた風景に**新しい何かを発見する**ことを可能にする","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — câu chuyện người được đón ở cuối bài cho thấy điều NGƯỢC LẠI: cảnh quen thuộc bị nhìn như 'tẻ nhạt' chứ không phải khám phá mới."},{"key":"C","jp":"旅は、旅先と慣れ親しんだ景色の**違いに気づいたとき終わる**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng sai chi tiết — kết thúc không phải lúc NHẬN RA sự khác biệt, mà lúc cảnh đã THỰC SỰ trở thành đời thường."}]}],"Mon10-10":[{"huongTuDuy":"Vấn đề trẻ con không tiếc tranh bị vứt — bám đoạn mô tả về bản chất hành vi vẽ của trẻ.","chotY":"「問題は自分のなかにあるものを**外に突き出す、投げ出すという行為自体**であって、決して出来上がりの効果ではない」— hành vi tự thể hiện đã hoàn tất, mong muốn vẽ đã được thỏa mãn.","lienKetJP":"魂の衝動は強い → だから子供は描きたがる → 突き出す行為自体が目的（効果ではない）→ 描きおわったらふり向きもしない","lienKetVI":"Xung động tâm hồn mạnh mẽ → nên trẻ muốn vẽ → mục đích là hành vi 'tự thể hiện' chứ không phải kết quả → vẽ xong là không ngoái nhìn lại","correct":{"jp":"描きたいという**欲求が満たされた**から","vi":"Khớp đúng bản chất: hành vi vẽ (突き出す行為自体) đã hoàn thành mục đích, không cần giữ lại sản phẩm."},"wrong":[{"key":"A","jp":"いつでも**描きたいものが描ける**から","trap":"bẫy chi tiết phụ","vi":"Không phải lý do — bài không nói về khả năng vẽ lại bất cứ lúc nào."},{"key":"B","jp":"描きたいものが描けて**納得した**から","trap":"bẫy chi tiết phụ","vi":"'Hài lòng' nhẹ hơn và khác bản chất 'nhu cầu/xung động được giải tỏa' mà bài nhấn mạnh."},{"key":"D","jp":"**最後まで描けた**ことに満足しているから","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — vấn đề không phải 'vẽ xong hoàn chỉnh' mà là hành vi giải tỏa xung động."}]},{"huongTuDuy":"Lý do tranh trẻ con không phải 'tác phẩm' — đối lập với định nghĩa 'tác phẩm' của người lớn.","chotY":"「大人のは見せる芸であり、商品である。**はじめから観賞すること、してもらうことを目的**とし」— tác phẩm người lớn có MỤC ĐÍCH được thưởng thức, còn tranh trẻ con thì không.","lienKetJP":"子供の絵＝「作品」ではない → なぜなら観賞される目的で描かれていないから → 大人の絵＝はじめから観賞目的で作られる","lienKetVI":"Tranh trẻ con KHÔNG phải 'tác phẩm' → vì không được vẽ với mục đích được thưởng thức → tranh người lớn thì NGAY TỪ ĐẦU đã nhằm mục đích đó","correct":{"jp":"**観賞されることを目的として**描かれていないから","vi":"Khớp đúng với phép đối lập: tranh người lớn 'observation目的' (はじめから観賞すること目的), tranh trẻ con thì không."},"wrong":[{"key":"A","jp":"大人ほどの**表現力や情熱**をもって描かれていないから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài khẳng định 魂の衝動は強い (xung động tâm hồn trẻ con MẠNH), không phải yếu hơn người lớn."},{"key":"C","jp":"**評価に値する出来上り**になっていないから","trap":"bẫy chi tiết phụ","vi":"Không phải vấn đề chất lượng tác phẩm — bài nói về MỤC ĐÍCH sáng tác, không phải kết quả."},{"key":"D","jp":"描いた本人が**価値を認めていない**から","trap":"bẫy chi tiết phụ","vi":"Gần đúng về hiện tượng nhưng sai về NGUYÊN NHÂN — bản chất là thiếu mục đích 'để được thưởng thức', không phải tự bản thân trẻ phủ định giá trị."}]},{"huongTuDuy":"Về '絵描きさん' (họa sĩ chuyên nghiệp) — cần tìm động cơ thực sự đằng sau hành động vẽ của họ.","chotY":"「評判をとり、**買手がついてくれなければ食ってゆけない**し、社会が許さない。生活はきびしいのだ」「明らかに「作品」つまり「**商品**」を作っているのである」.","lienKetJP":"絵描きさんは結果を予測しながら作る → 大向こうの気配を見すかす → 買手がつくように描く（＝商品を作っている）","lienKetVI":"Họa sĩ vừa vẽ vừa dự đoán trước kết quả → để ý phản ứng người xem → vẽ sao cho có người mua (= đang tạo ra hàng hóa)","correct":{"jp":"**買ってもらえるように**描いている","vi":"Khớp trực tiếp với 「買手がついてくれなければ食ってゆけない」「商品を作っている」."},"wrong":[{"key":"A","jp":"**かんぺきな出来ばえ**を求めている","trap":"bẫy chi tiết phụ","vi":"Không phải trọng tâm — bài nói về động cơ THƯƠNG MẠI (bán được), không phải sự hoàn hảo kỹ thuật."},{"key":"B","jp":"いつも**同じような描き方**をしている","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý 'phong cách lặp lại'."},{"key":"C","jp":"**買い手の要望どおり**に描いている","trap":"bẫy chi tiết phụ","vi":"Hơi quá — bài nói họ NGẦM dự đoán phản ứng người xem (見すかして), không hẳn là vẽ THEO YÊU CẦU trực tiếp của người mua."}]},{"huongTuDuy":"Câu hỏi tổng kết quan điểm tác giả về nghệ thuật — phải bám vào câu KẾT CUỐI CÙNG, nơi tác giả phủ định việc quan tâm đánh giá từ người khác.","chotY":"「自分の存在を**純粋に外に投げ出す**、突き出すアクションの**質、強さ**によって、猛烈な魅力になる」+ kết: 「出来るかぎり**他の評価を無視したい**」— cốt lõi là hành động do XUNG ĐỘNG/ĐAM MÊ thúc đẩy, không phải sức hút kết quả.","lienKetJP":"魂の衝動は強い（子供も大人も共通）→ 自分の存在を純粋に投げ出すアクション → 他の評価を無視したい（結果ではなく行為自体が本質）","lienKetVI":"Xung động tâm hồn mạnh mẽ (chung cho cả trẻ con và người lớn) → hành động tự thể hiện thuần khiết bản thân → muốn phớt lờ đánh giá người khác (cốt lõi là HÀNH ĐỘNG, không phải kết quả)","correct":{"jp":"**情熱**に**突き動かされて**作るもの","vi":"Khớp đúng tinh thần xuyên suốt: nghệ thuật bắt nguồn từ xung động/đam mê (魂の衝動、情熱), không phải mong muốn gây ấn tượng."},"wrong":[{"key":"A","jp":"人を**引きつける魅力的な**もの","trap":"bẫy chi tiết phụ","vi":"Đây chỉ là HỆ QUẢ phụ (猛烈な魅力になる) ở đoạn giữa, nhưng câu kết bài lại phủ định việc quan tâm đến sức hút/đánh giá từ người khác."},{"key":"C","jp":"**他人には理解できない**ようなもの","trap":"bẫy chi tiết phụ","vi":"Có nhắc thoáng qua (わけがわからないと言われる) nhưng không phải định nghĩa cốt lõi về nghệ thuật."},{"key":"D","jp":"人間の**生命力を巧みに表現**するもの","trap":"bẫy chi tiết phụ","vi":"'Khéo léo biểu hiện' (巧み) sai sắc thái — bài nhấn mạnh tính THUẦN KHIẾT, BỘC PHÁT (純粋に) chứ không phải sự khéo léo có tính toán."}]}],"Mon10-11":[{"huongTuDuy":"①そのようにして作った — chỉ thị từ về CÁCH sáng tác đã mô tả ở câu ngay trước.","chotY":"「単に、**感覚に頼って**、**直観的に**「これが好い」と納得できる音の連なりを探し続ける」— chọn âm hoàn toàn theo cảm giác/trực giác, không theo lý luận.","lienKetJP":"言葉で説明できる方法論はない → 感覚に頼って直観的に音を探す → ①そのようにして作った曲","lienKetVI":"Không có phương pháp luận giải thích bằng lời được → dựa vào cảm giác, trực giác để tìm âm thanh → '①cách đã tạo ra' bản nhạc","correct":{"jp":"音の連なりを**理屈ではなく感覚的**に選んで作った","vi":"Khớp trực tiếp với 「感覚に頼って、直観的に」 — đối lập rõ với lý luận/lý thuyết."},"wrong":[{"key":"A","jp":"曲全体の**出来上がりをイメージ**しながら作った","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — tác giả nói rõ KHÔNG biết bản nhạc sẽ ra sao (①そのようにして作った曲が何であるかについてもよく分からない)."},{"key":"B","jp":"曲の**終わりを意識**して納得できる音を探しながら作った","trap":"bẫy chi tiết phụ","vi":"Nhầm 2 yếu tố riêng biệt — 'cảm nhận đoạn kết' và 'chọn âm theo cảm giác' là 2 ý khác nhau trong bài, câu hỏi chỉ hỏi về cách CHỌN ÂM."},{"key":"C","jp":"**美しいとされている**音の連なりを組み合わせて作った","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — '美しいとされている' (được công nhận là đẹp) là tiêu chuẩn khách quan/xã hội, trái với '感覚的・直観的' (chủ quan, cá nhân) mà bài mô tả."}]},{"huongTuDuy":"Ví dụ bình hoa thủy tinh dùng để minh họa cho luận điểm nào — đọc câu kết đoạn ngay sau ví dụ.","chotY":"「ガラスのことも、そして、花瓶というものがどのようなものかも知らなければ、ガラスの花瓶を**作ることはできない**」+「作曲をするからには、作曲者は、当然、それらについて**一応知っている**」.","lienKetJP":"自分の作曲について本当に何も知らないわけではない → ガラスの花瓶の例 → 知識なしに物を作ることは不可能","lienKetVI":"Không phải hoàn toàn không biết gì về sáng tác của mình → ví dụ bình hoa thủy tinh → không thể sáng tạo nếu không có kiến thức nền tảng","correct":{"jp":"作曲家は**何の知識もなく**曲を作ることは**できない**こと","vi":"Khớp đúng vai trò minh họa của ví dụ: không có kiến thức cơ bản thì không thể sáng tạo."},"wrong":[{"key":"A","jp":"音楽の**素材として適している音**があること","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — ví dụ không nói về việc CHỌN âm thanh phù hợp, mà về sự CẦN THIẾT của kiến thức nền."},{"key":"B","jp":"作曲家はどのような**仕事をしなければならない**かということ","trap":"bẫy mọi người","vi":"Quá chung chung, không khớp với nội dung cụ thể của ví dụ bình hoa."},{"key":"D","jp":"自身の作曲について知らなければ**いい曲はできない**こと","trap":"bẫy chi tiết phụ","vi":"Sai mức độ — bài nói về điều kiện CẦN để sáng tác ĐƯỢC (可能/不可能), không phải về chất lượng 'hay/dở' của bản nhạc."}]},{"huongTuDuy":"Câu hỏi về nhạc của những nhà soạn nhạc TIÊN PHONG — đối lập với nhà soạn nhạc 'bảo thủ'.","chotY":"「前衛主義に代表されるような、新たな音楽の可能性を求める作曲家達は、自らが出発点とした伝統における「基本的な」知識の**外に踏み出そう**とする」「**伝統に由来する**「基本的な」知識が告げる音楽というもののイメージから**逸脱**した未知のもの」.","lienKetJP":"基本的な知識を前提とする（共通） → 保守的：その範囲内で作曲 ／ 前衛的：知識の外に踏み出す → 伝統的イメージから逸脱した実験的な音楽","lienKetVI":"Đều dựa trên kiến thức cơ bản (điểm chung) → bảo thủ: sáng tác trong phạm vi đó / tiên phong: bước ra ngoài phạm vi → âm nhạc thực nghiệm thoát khỏi hình ảnh truyền thống","correct":{"jp":"**伝統的なイメージから離れた実験的**な音楽","vi":"Khớp trực tiếp với 「伝統から踏み出し」「逸脱した未知のもの」「実験的な性質を帯びる」."},"wrong":[{"key":"B","jp":"「基本的な」**知識を知らずに**作った未知の音楽","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài khẳng định MỌI sáng tác đều cần kiến thức cơ bản làm tiền đề (必ず、何らかの伝統における基本的な知識を前提)."},{"key":"C","jp":"「基本的な」**知識を元にして**作った新しい音楽","trap":"bẫy chi tiết phụ","vi":"Thiếu yếu tố cốt lõi 'thoát ra ngoài/逸脱' — đây mô tả gần với nhà soạn nhạc BẢO THỦ hơn."},{"key":"D","jp":"**非伝統的だが「保守的な」イメージを失わない**音楽","trap":"bẫy ngược nghĩa","vi":"Mâu thuẫn nội tại và ngược nghĩa — nhạc tiên phong chính là loại THOÁT KHỎI hình ảnh truyền thống/bảo thủ."}]},{"huongTuDuy":"Câu hỏi tổng kết — bám vào câu kết bài về điều tác giả có thể nói về sáng tác của chính mình.","chotY":"「自らが行った**実験的な試みの結果**として産み出された音楽についての**吟味**であり、言い換えれば、自分が行ったこととその結果についての**自分自身による解釈**なのである」.","lienKetJP":"作曲についてよく知っているわけではない → 語り得ることは → 自らの試みの結果の吟味＋自分自身による解釈","lienKetVI":"Không hẳn hiểu rõ về việc sáng tác của mình → điều có thể nói được là → đánh giá kết quả thử nghiệm của bản thân + tự diễn giải về điều mình đã làm","correct":{"jp":"**自身の試み**と、**曲についての解釈**","vi":"Khớp trực tiếp với 「実験的な試みの結果…についての吟味」「自分自身による解釈」."},"wrong":[{"key":"A","jp":"**自身の曲の意義と価値**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ Ý NGHĨA/GIÁ TRỊ của bản nhạc thì KHÔNG THỂ biết được (それがどのような意義と価値をもつ音楽なのかは、分らない)."},{"key":"B","jp":"**自身の方法論**についての解釈","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — ngay đầu bài tác giả nói KHÔNG CÓ phương pháp luận có thể giải thích bằng lời (組織的な方法論はない)."},{"key":"D","jp":"自身の**作曲過程**と、**実験的音楽の可能性**","trap":"bẫy chi tiết phụ","vi":"'Khả năng của âm nhạc thực nghiệm' là chủ đề chung của bài, không phải điều tác giả nói riêng về CHÍNH MÌNH."}]}],"Mon10-12":[{"huongTuDuy":"Điểm chung giữa sử học và khoa học tự nhiên — câu mở bài nêu rõ ngay từ đầu.","chotY":"「この史料的根拠を基盤とするがゆえに、歴史学者の歴史観は、相互に**批判可能**なもの」「その論拠、論理を**他の学者にも検証可能な形で提示**しなければならない」.","lienKetJP":"歴史学＝史料的根拠が必要 → 相互に批判可能 → 自然科学も同様：論拠を他の学者に検証可能な形で提示","lienKetVI":"Sử học cần căn cứ tư liệu → có thể bị phê bình lẫn nhau → khoa học tự nhiên cũng vậy: cần trình bày luận cứ để học giả khác kiểm chứng được","correct":{"jp":"**他の学者**が**検証できる**ように、新説の**根拠を示す**必要があること","vi":"Khớp trực tiếp với 「他の学者にも検証可能な形で提示しなければならない」."},"wrong":[{"key":"A","jp":"研究の価値は**新説を示すことで認められる**こと","trap":"bẫy mọi ":"知覚＝個人差が少ない ←対立→ 感情＝個人差が大きい","lienKetVI":"Tri giác = ít khác biệt cá nhân ↔ Cảm xúc = khác biệt cá nhân lớn","correct":{"jp":"**感情の反応**のほうが**大きな個人差**が見られる","vi":"Khớp trực tiếp với đối lập đầu bài: tri giác (ít khác biệt) vs cảm xúc (khác biệt lớn)."},"wrong":[{"key":"A","jp":"いずれも**大きな個人差**が見られる","trap":"bẫy ngược nghĩa","vi":"Sai hoàn toàn — tri giác được khẳng định là ÍT khác biệt cá nhân (比較的少ない)."},{"key":"B","jp":"いずれも**個人差はあまり見られない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — đúng với tri giác nhưng sai với cảm xúc, không thể nói 'cả 2 đều ít'."},{"key":"C","jp":"**知覚の情報処理**のほうが大きな個人差が見られる","trap":"bẫy ngược nghĩa","vi":"Ngược hoàn toàn — bài nói rõ tri giác ÍT khác biệt, cảm xúc MỚI là nhiều."}]},{"huongTuDuy":"Câu hỏi về nhận thức GẦN ĐÂY về chức năng cảm xúc — đối lập với quan niệm cũ (類型的な反応).","chotY":"「感情は、むしろ生きる上で避けることのできない不確実性に対する**適応戦略**である」「**判断し、決断することを支える**ための情報処理のメカニズム」.","lienKetJP":"昔：感情＝決まり切った反応 →（しかし/近年）→ 感情＝不確実性への適応戦略、判断・決断を支えるもの","lienKetVI":"Trước đây: cảm xúc = phản ứng cố định → (nhưng/gần đây) → cảm xúc = chiến lược thích nghi với bất định, hỗ trợ phán đoán-quyết định","correct":{"jp":"**不確実な状況**において、**判断して決断する**ためのもの","vi":"Khớp trực tiếp với 「判断し、決断することを支えるための情報処理のメカニズム」."},"wrong":[{"key":"A","jp":"避けられない状況を**受け入れる**ためのもの","trap":"bẫy chi tiết phụ","vi":"'Chấp nhận' (受け入れ) nhẹ hơn thực chất — bài nói cảm xúc TÍCH CỰC hỗ trợ phán đoán/quyết định, không chỉ thụ động 'chấp nhận'."},{"key":"B","jp":"避けられない状況において、**理性を保つ**ためのもの","trap":"bẫy ngược nghĩa","vi":"Sai — bài làm rõ cảm xúc là thứ LÀM ĐƯỢC điều mà lý trí (理性) KHÔNG làm được, không phải để duy trì lý trí."},{"key":"D","jp":"不確実な状況において、**正解を求める**ためのもの","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ ở tình huống bất định 'không nhất thiết chỉ có 1 đáp án đúng' (一つとは限らない)."}]},{"huongTuDuy":"Câu hỏi về ý nghĩa của sự đa dạng cảm xúc (個人差) ở tầm loài.","chotY":"「さまざまな人々が異なる戦略をとり、全体としてバラエティが増したほうが、**人間という生物種全体としては、むしろ適応的**である」.","lienKetJP":"個人差→選択肢が多様化→たとえ一方が不幸でも別の選択をした人が生きのびれば→生物種として存続できる","lienKetVI":"Khác biệt cá nhân → đa dạng hóa chiến lược → dù có người không may thiệt mạng, người chọn phương án khác sống sót → loài tồn tại được","correct":{"jp":"**人間という生物種**の**存続**","vi":"Khớp trực tiếp với 「人間という生物種全体としては、むしろ適応的」「生物種としては存続できる」."},"wrong":[{"key":"B","jp":"人間と**他の生物種との共存**","trap":"bẫy mọi người","vi":"Không có trong bài — 共存 (cộng sinh) với loài khác là ý tự thêm vào."},{"key":"C","jp":"**生死にかかわるような事態の減少**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài dùng ví dụ 'tình huống liên quan sinh tử' như TIỀN ĐỀ cho lập luận, không phải kết quả."},{"key":"D","jp":"環境の変化に対応できる**生物種の増加**","trap":"bẫy chi tiết phụ","vi":"Nhầm đơn vị — bài nói về sự TỒN TẠI của LOÀI NGƯỜI (一種), không phải sự gia tăng số lượng loài."}]},{"huongTuDuy":"Câu hỏi tổng kết quan điểm tác giả — bám câu kết bài về thái độ đối với sự khác biệt cảm xúc.","chotY":"「他人が異なる感情の反応を見せることを**許容すること**の倫理的基礎は…自他の差異に対して**許容的であること**が、すぐれて生命哲学上の原理にかなっている」.","lienKetJP":"感情に個人差がある → むしろ種の存続に適応的 → 他人の感情の差異を許容することが生命哲学の原理にかなう","lienKetVI":"Cảm xúc có sự khác biệt cá nhân → thực ra phù hợp với sự tồn tại của loài → dung thứ sự khác biệt của người khác là nguyên lý triết học sự sống","correct":{"jp":"人々が生きていく上では、**感情の反応の個人差を受け入れた**ほうがいい","vi":"Khớp đúng kết luận: 許容的であること、反発するのは自然だがとらわれてはいけない."},"wrong":[{"key":"A","jp":"人々が生きていくためには、感情の個人差を**敏感に察知**すべきだ","trap":"bẫy chi tiết phụ","vi":"'Nhạy bén phát hiện' khác với 'dung thứ' — bài không yêu cầu nhận ra nhanh, mà yêu cầu chấp nhận/bao dung."},{"key":"C","jp":"感情の反応に個人差があることこそが、**人間であることのあかし**である","trap":"bẫy mọi người","vi":"Quá tuyệt đối hóa và không có trong bài — đây là ý tự thêm vào."},{"key":"D","jp":"感情の反応に個人差があることは、**人間を取り巻く環境の変化**によるものだ","trap":"bẫy ngược nghĩa","vi":"Ngược nhân quả — bài nói cảm xúc cá nhân HỮU ÍCH khi đối phó với môi trường thay đổi, không phải môi trường là NGUYÊN NHÂN của cảm xúc cá nhân."}]}],"Mon10-14":[{"huongTuDuy":"Vai trò của cây trong thành phố — câu đầu kết bằng 'không ý thức', câu hỏi về điều gì sẽ mất khi thiếu cây.","chotY":"「うるおいやすらぎのないまちのようにも見えます」「まちの樹木は、実はとても**大きな役割**を持っています」.","lienKetJP":"街路樹がない→うるおい・やすらぎがない→まちの樹木の大きな役割＝うるおいやすらぎを与えること","lienKetVI":"Không có cây → không có sự êm dịu/bình yên → vai trò lớn của cây đô thị = mang lại cảm giác êm dịu, bình yên","correct":{"jp":"人々を**落ち着いた気持ち**にさせる","vi":"Khớp với 「うるおいやすらぎ」 — cặp gần nghĩa: うるおい・やすらぎ ↔ 落ち着いた気持ち."},"wrong":[{"key":"A","jp":"人々に木が**身近な存在**であることを意識させる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói đầu rằng mọi người thấy cây hàng ngày nhưng LẠI KHÔNG ý thức đến nó (あらためて意識することは少ない)."},{"key":"B","jp":"人々に**未来都市的なイメージ**を与える","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 'hình ảnh đô thị tương lai' là mô tả khu KHÔNG CÓ cây, và tác giả dùng từ 'tuy nhiên' để chỉ ra đây không đủ."},{"key":"C","jp":"人々を**現実の煩わしさから逃れさせる**","trap":"bẫy mọi người","vi":"Tự thêm ý 'thoát khỏi phiền não đời thực' — không có trong bài."}]},{"huongTuDuy":"①それ chỉ thị từ — chỉ về điều được giải thích ngay trước đó trong đoạn về việc chọn loài cây trồng.","chotY":"「その土地の植生を踏まえ、その上に歴史性や未来性を重ね合わせる。季節の移ろいの中で、人々がその木をどのように眺めながら暮らしていくのか」→ ①それがその木がその場所に存在する意義.","lienKetJP":"土地の植生＋歴史性・未来性＋人々の暮らし方 → これらを考慮した上でどの木を植えるか → ①それがその木の存在意義","lienKetVI":"Đặc tính đất + lịch sử/tương lai + cách sống của người dân → xem xét tất cả để quyết định trồng cây gì → '①điều đó' là lý do tồn tại của cây tại chỗ đó","correct":{"jp":"**その土地の特性**と**人々の暮らし**を考慮し、樹木を植えること","vi":"Khớp đúng với toàn bộ nội dung trước ①: đất + người dân + cách sống."},"wrong":[{"key":"A","jp":"その土地に暮らす人々の**好みに合わせた**樹木を植えること","trap":"bẫy chi tiết phụ","vi":"'Sở thích cá nhân' là yếu tố bị phê phán sau (単に自分の好みばかりではなく), không phải tiêu chuẩn chính."},{"key":"C","jp":"その土地の**歴史的な樹木**を大切にし、**保存する**こと","trap":"bẫy chi tiết phụ","vi":"'Bảo tồn cây lịch sử' là 1 phần nhỏ trong nhiều yếu tố, không phải toàn bộ ý của ①."},{"key":"D","jp":"その土地の**季節の移ろいを感じさせる**樹木を大切にすること","trap":"bẫy chi tiết phụ","vi":"'Mùa thay đổi' cũng chỉ là 1 trong nhiều yếu tố (季節の移ろいの中で), không đủ để bao quát ①."}]},{"huongTuDuy":"②もっと欲張って — tác giả muốn người làm vườn mở rộng tầm nhìn ra ngoài khuôn viên nhà mình.","chotY":"「単に自分の好みばかりでなく、その木が住宅街の小路をどのように演出するのか、**まわりとの調和**はどうなのか」「個々の部分と**共有の部分が美しくなってこそ**はじめて全体が美しくなる」.","lienKetJP":"ガーデニング＝個々の庭は美しくなった→しかし自分の土地から外に広がっていない→もっと欲張って→まちとの調和・共有部分の美しさも考えてほしい","lienKetVI":"Làm vườn → vườn riêng đã đẹp hơn → nhưng vẫn chỉ gói trong khuôn viên → 'tham vọng hơn' → hãy nghĩ đến sự hài hòa với cả thành phố, với phần chung","correct":{"jp":"**自分の好みだけではなく、まち全体との調和**も考えてほしい","vi":"Khớp đúng với 「まわりとの調和」「共有の部分が美しくなってこそ全体が美しくなる」."},"wrong":[{"key":"B","jp":"ガーデニングをする人達同士で、もっと**情報交換**をしてほしい","trap":"bẫy chi tiết phụ","vi":"'Chia sẻ thông tin' là chi tiết mô tả hiện tượng (情報交流も盛ん), không phải điều tác giả yêu cầu tiếp theo."},{"key":"C","jp":"個々の庭の花や木が、さらに**美しく育つよう**にしてほしい","trap":"bẫy ngược nghĩa","vi":"Ngược tinh thần bài — tác giả không muốn họ đi sâu hơn vào vườn riêng, mà muốn họ MỞ RỘNG ra ngoài."},{"key":"D","jp":"**個々の庭よりも、まちの共有の部分**のほうに力を入れてほしい","trap":"bẫy chi tiết phụ","vi":"Quá cực đoan — tác giả muốn bao gồm CẢ HAI (個々の部分と共有の部分), không phải bỏ cái này chọn cái kia."}]},{"huongTuDuy":"Câu hỏi tổng kết — bám câu kết bài về mối quan hệ giữa 'yêu cây' và 'thành phố tốt đẹp'.","chotY":"「その**愛でる心と愛でられる木々**があってはじめて**よいまちとなる**のです」.","lienKetJP":"木々を眺め、思いをこめて手入れをする＝愛でる → 愛でる心＋愛でられる木々 → よいまちができる","lienKetVI":"Ngắm nhìn cây, chăm sóc với tâm ý = 'yêu mến' → lòng yêu mến + cây được yêu → thành phố tốt đẹp","correct":{"jp":"人々がまちの木々を**愛でること**が、**よいまちづくり**につながる","vi":"Khớp trực tiếp với câu kết 「愛でる心と愛でられる木々があってはじめてよいまちとなる」."},"wrong":[{"key":"A","jp":"人々がまちの木々を愛でることで、**子供達が自然に関心**を持つようになる","trap":"bẫy chi tiết phụ","vi":"'Trẻ em quan tâm đến tự nhiên' là cảm xúc tác giả nêu (子供達の明るい未来を願う) nhưng không phải kết luận chính."},{"key":"C","jp":"人々がまちの木々の**手入れを怠らなければ**、よいまちになる","trap":"bẫy chi tiết phụ","vi":"Thiếu yếu tố cốt lõi 'lòng yêu mến' (愛でる心) — chỉ chăm sóc kỹ thuật mà không có tấm lòng là chưa đủ theo bài."},{"key":"D","jp":"人々が**季節による木々の変化**に関心を持つことで、愛でる心が生まれる","trap":"bẫy ngược nghĩa","vi":"Đảo nhân quả — bài mô tả 愛でる (yêu mến) BẰNG CÁCH ngắm theo mùa, không phải ngắm theo mùa tạo ra lòng yêu mến."}]}],"Mon10-15":[{"huongTuDuy":"①不思議がっていた — đoạn đầu bài mô tả điều bất thường về cửa hàng cốt ở điểm nào.","chotY":"「毎日どんどん売れる商売じゃないだろうけど、それにしても**客が入っているのを見たことないよね**」— đây là điều chồng thấy kỳ lạ.","lienKetJP":"お店なのに→客が入っているのを見たことがない→①不思議がっていた","lienKetVI":"Là cửa hàng → nhưng chưa từng thấy khách vào → '①thấy kỳ lạ'","correct":{"jp":"店なのに**客がいるのを見たことがない**こと","vi":"Khớp trực tiếp với 「それにしても客が入っているのを見たことないよね」."},"wrong":[{"key":"A","jp":"宅配便の荷物が**梱包されたまま置かれている**こと","trap":"bẫy chi tiết phụ","vi":"Đây là suy đoán của tác giả về lý do (ネット販売専門か), không phải điều kỳ lạ được nêu trực tiếp."},{"key":"B","jp":"十年経っても**店の様子が何も変わらない**こと","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý 'không thay đổi sau 10 năm'."},{"key":"D","jp":"**店主を一度も見たことがない**こと","trap":"bẫy chi tiết phụ","vi":"Ngược lại — bài mô tả chủ tiệm vẫn ngồi trong nhìn ra, không phải chưa thấy lần nào."}]},{"huongTuDuy":"②ひと筋の光が射し込んで来る思い — ẩn dụ về cảm giác hy vọng, cần xác định hy vọng về điều gì.","chotY":"Đoạn sau ②: 「我が家にも欠けたからといって捨てられず…これらをもとの形にもどすことができたら、どんなに**心和む**ことだろう」— nghĩa là biết có thể sửa được đồ sứ vỡ quý giá đang cất giữ.","lienKetJP":"金継ぎという修復技術がある→近所にその工房がある→家の大切な器を直せるかもしれない→②ひと筋の光","lienKetVI":"Có kỹ thuật phục hồi kintsugi → tiệm đó ở ngay gần nhà → có thể sửa được đồ sứ kỷ vật quý giá → '②ánh sáng le lói'","correct":{"jp":"**割れてしまった思い出深い陶器**を**直せそう**だとわかったから","vi":"Khớp đúng — bài ngay lập tức mô tả những món đồ kỷ vật tác giả đang cất giữ và mong muốn sửa chữa."},"wrong":[{"key":"A","jp":"同世代の女性が**自分と同じ思い**を抱いていることがわかったから","trap":"bẫy chi tiết phụ","vi":"Sự đồng cảm với blogger là chi tiết phụ, không phải nguyên nhân trực tiếp gây cảm giác 'ánh sáng hy vọng'."},{"key":"C","jp":"**不思議に思っていた店がどのような店か**わかったから","trap":"bẫy chi tiết phụ","vi":"Biết được bí mật cửa hàng là điều giải quyết câu hỏi tò mò, nhưng không đủ để gây cảm giác 'ánh sáng hy vọng' mạnh mẽ như vậy."},{"key":"D","jp":"**専門的な技術**を近所で**見られる**ことがわかったから","trap":"bẫy chi tiết phụ","vi":"'Có thể xem kỹ thuật' không phải điều gây xúc động — điều quan trọng hơn là CÓ THỂ SỬA được đồ sứ kỷ vật."}]},{"huongTuDuy":"③すっかり気が楽になって — cần tìm nguyên nhân trực tiếp ở câu ngay trước.","chotY":"「「やあ、いらっしゃい」と主はまるで**なじみの客のように迎えてくれた**」+「近所に住んでいる人のことはなんとなくわかるんです」— chủ tiệm biết về mình và đón tiếp thân thiện.","lienKetJP":"「見ているのはこちらばかりと思ったら大間違いだ」→主は自分を知っていた→なじみの客のように迎えてくれた→③気が楽になった","lienKetVI":"Tưởng chỉ mình quan sát cửa hàng → nhưng chủ tiệm cũng biết mình → đón tiếp thân thiện như khách quen → '③cảm thấy thoải mái hơn'","correct":{"jp":"**店主も自分のことを知っていて**、親しく接してくれたから","vi":"Khớp trực tiếp với 「まるでなじみの客のように迎えてくれた」「近所の人のことはなんとなくわかる」."},"wrong":[{"key":"B","jp":"店主は**話しづらい人だと思ったが**、そうではなかったから","trap":"bẫy mọi người","vi":"Không có trong bài — tác giả không nói đã từng sợ chủ tiệm khó tiếp chuyện."},{"key":"C","jp":"店主が仕事の手を休めて**話しかけてくれた**から","trap":"bẫy chi tiết phụ","vi":"Gần đúng về hành động nhưng sai về NGUYÊN NHÂN cụ thể của cảm giác thoải mái — điều khiến thoải mái là chủ tiệm ĐÃ BIẾT mình trước."},{"key":"D","jp":"店主が**以前と同じように**接してくれたから","trap":"bẫy mọi người","vi":"Không có căn cứ — là lần đầu gặp, không có 'lần trước' để so sánh."}]},{"huongTuDuy":"Câu hỏi tổng kết cảm nhận mạnh nhất của tác giả sau trải nghiệm — bám câu kết bài.","chotY":"「もしもの時に助けてくれる人がいると思うと心底有り難い。けれど、だからこそ**指先には神経を使ってぞんざいな扱いはすまい**と、見事に修復された器を手に思っている」.","lienKetJP":"金継ぎの技術に感謝→だからこそ→大切に使おうと思う（指先に神経を使う）","lienKetVI":"Biết ơn kỹ thuật kintsugi → chính vì vậy → quyết tâm dùng cẩn thận hơn (chú ý từng đầu ngón tay)","correct":{"jp":"壊れたものを直す技術があることに**感謝**しながら、**大事に使いたい**","vi":"Khớp trực tiếp với câu kết: 心底有り難い (感謝) + 指先には神経を使ってぞんざいな扱いはすまい (大事に使う)."},"wrong":[{"key":"A","jp":"形あるものは壊れるからこそ、**愛情を持って使いたい**","trap":"bẫy chi tiết phụ","vi":"'Có tình cảm' là ý đúng một phần nhưng thiếu yếu tố 'biết ơn kỹ thuật sửa chữa' — là 2 yếu tố song hành trong câu kết."},{"key":"B","jp":"壊れるものには**美しさ**があり、**作り手への感謝の念**を忘れてはならない","trap":"bẫy chi tiết phụ","vi":"'Người tạo ra' không phải trọng tâm — bài nói đến 'người sửa chữa' (修復) và việc dùng cẩn thận, không phải cảm ơn người làm ban đầu."},{"key":"C","jp":"壊れたものは修復できても、壊れたときの**心の痛手はなくならない**","trap":"bẫy ngược nghĩa","vi":"Ngược tinh thần bài — tác giả nói kintsugi 'yさしくいたわってくれる' (nhẹ nhàng an ủi cả vết thương tâm hồn), không phải vết thương vẫn còn đó."}]}],"Mon10-16":[{"huongTuDuy":"Quy tắc xã hội của khỉ — bài mô tả rõ ràng hệ thống thứ bậc dựa trên ánh nhìn.","chotY":"「弱いサルは、見つめられたら**決して見返してはいけない**。挑戦したとみなされて攻撃を受ける羽目になるから」「弱いサルが強いサルに**譲るように**誰もが期待している」.","lienKetJP":"強いサルが見つめる＝威嚇 → 弱いサルは見返せない・譲る → それがサル社会のルール","lienKetVI":"Khỉ mạnh nhìn chằm chằm = đe dọa → khỉ yếu không được nhìn lại / phải nhường → đó là quy tắc xã hội khỉ","correct":{"jp":"弱いサルは、**強いサルに挑戦するようなことはしない**","vi":"Khớp với 「見返してはいけない」「強いサルに譲るように期待」 — không được thách thức."},"wrong":[{"key":"A","jp":"強いサルも弱いサルも、挑戦されれば**相手を攻撃する**","trap":"bẫy ngược nghĩa","vi":"Sai — chỉ khỉ MẠNH mới tấn công khi bị thách thức, còn khỉ YẾU không được phép thách thức."},{"key":"B","jp":"強いサルは、弱いサルを**威嚇することはない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — nhìn chằm chằm của khỉ mạnh là '軽い威嚇' (đe dọa nhẹ)."},{"key":"D","jp":"弱いサルは、強いサルの**関心を引こうとする**","trap":"bẫy ngược nghĩa","vi":"Ngược hoàn toàn — khỉ yếu cố TRÁNH sự chú ý của khỉ mạnh, không phải cố thu hút."}]},{"huongTuDuy":"'Khác với khỉ' ở điểm gì — đoạn sau だが nêu đặc trưng của cách sử dụng ánh mắt ở người.","chotY":"「見つめるという行為はふつう威嚇につながらない。むしろ、相手に積極的な関心を向けたり、**許容や忠告、愛の表現**であったりする」「**多種多様**である」.","lienKetJP":"サル：見つめる＝威嚇（一義的）→（人間では違う）→ 視線を**様々な意味に使い分ける**","lienKetVI":"Khỉ: nhìn chằm chằm = đe dọa (một nghĩa duy nhất) → (ở người khác hẳn) → dùng ánh nhìn với NHIỀU Ý NGHĨA khác nhau","correct":{"jp":"視線を**様々な意味に使い分ける**こと","vi":"Khớp với 「許容や忠告、愛の表現」「多種多様」 — người dùng ánh mắt với nhiều mục đích/ý nghĩa khác nhau."},"wrong":[{"key":"A","jp":"**視線以外の手段**を使って気持ちを表現すること","trap":"bẫy chi tiết phụ","vi":"Không phải điểm 'khác với khỉ' — bài không nói người dùng phương tiện KHÁC, mà nói CÙNG ánh nhìn nhưng có nhiều nghĩa hơn."},{"key":"B","jp":"視線の向け方が**場面によって決められる**こと","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng sai sắc thái — 'đã được quy định sẵn theo tình huống' khác với 'chủ động sử dụng đa dạng'."},{"key":"C","jp":"視線を向け続ければ**威嚇につながる**こと","trap":"bẫy ngược nghĩa","vi":"Đây chính là đặc điểm của KHỈ, không phải của người — bài nói rõ ở người 見つめるのは威嚇につながらない."}]},{"huongTuDuy":"Tác giả nhìn nhận 視線の作法 như thế nào — đoạn giải thích vai trò cốt lõi.","chotY":"「顔と顔とを合わせ、視線を交わすことが**重要なコミュニケーション**であるからだ」「**言葉は意味を、視線は感情を伝える**」.","lienKetJP":"視線の作法が多様 → なぜなら視線は感情を伝える重要なコミュニケーション手段 → お互いの感情をうまく伝え合うために必要","lienKetVI":"Cách sử dụng ánh mắt đa dạng → vì ánh mắt là phương tiện giao tiếp quan trọng truyền tải cảm xúc → cần thiết để truyền đạt cảm xúc lẫn nhau","correct":{"jp":"**お互いの感情をうまく伝え合うために**必要なもの","vi":"Khớp với 「視線は感情を伝える」「重要なコミュニケーション」."},"wrong":[{"key":"B","jp":"言葉によるコミュニケーションの**代わりになる**もの","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài khẳng định rõ 「言葉は視線のコミュニケーションを代替できない」 — không thể thay thế nhau."},{"key":"C","jp":"相手に**いやな感情を伝えないようにする**ためのもの","trap":"bẫy chi tiết phụ","vi":"Quá hạn hẹp — ánh mắt truyền đạt đủ loại cảm xúc (暖かくも冷たくも), không chỉ để tránh truyền cảm xúc tiêu cực."},{"key":"D","jp":"**性別や年齢、身分や服装に惑わされない**ように使うもの","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 作法 THAY ĐỔI TÙY THEO tính biệt/tuổi/địa vị/trang phục, không phải để không bị ảnh hưởng bởi chúng."}]},{"huongTuDuy":"Câu hỏi tổng kết quan điểm tác giả — bám câu kết bài về lo ngại xã hội 'không nhìn mắt nhau như khỉ'.","chotY":"「現代の情報機器はこの視線の作法をあまり使わなくてもすむ社会をつくってしまった」「それは皮肉にも**サルのような視線を合わせない、優劣社会に移行**することにつながるのではないか」.","lienKetJP":"情報機器の発達→視線を合わせる場面が減る→視線のコミュニケーションの役割が失われる→優劣社会へ","lienKetVI":"Thiết bị thông tin phát triển → ít cơ hội gặp mắt nhau hơn → vai trò của giao tiếp ánh mắt bị mất dần → xã hội thứ bậc kiểu khỉ","correct":{"jp":"**情報機器の発達**で、**視線がコミュニケーションに果たす役割**が見失われつつある","vi":"Khớp đúng kết luận lo ngại của tác giả: thiết bị thông tin → vai trò ánh mắt mất dần."},"wrong":[{"key":"A","jp":"情報機器を使用せずに**感情を伝え合うことは難しく**なってきている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — lo ngại là 'dùng thiết bị NHIỀU, mất dần kỹ năng giao tiếp trực tiếp', không phải 'không dùng thiết bị thì khó truyền cảm xúc'."},{"key":"B","jp":"情報機器によるよりも対面のほうが、**意味を伝え合うには効果的**である","trap":"bẫy chi tiết phụ","vi":"Bài phân biệt rõ: 言葉＝意味 / 視線＝感情 — câu này chỉ đúng một nửa và không phải kết luận chính."},{"key":"C","jp":"情報機器の使用も視線を交わすことも、コミュニケーションに**不可欠**である","trap":"bẫy mọi người","vi":"Quá cân bằng — tác giả không ủng hộ cả hai, mà LO NGẠI rằng thiết bị đang LẤN ÁT giao tiếp ánh mắt."}]}],"Mon10-17":[{"huongTuDuy":"Quan điểm của dư luận về việc diễn viên tự công khai đời tư — tìm phản ứng được nêu đầu bài.","chotY":"「プライバシー保護を訴えておきながら、都合のいいときだけ私生活をさらけ出そうとする」— thái độ VỪA kêu gọi bảo vệ VỪA tự công khai = không nhất quán.","lienKetJP":"プライバシー保護を訴える一方→都合のいいときだけ公表→一貫していない態度→眉をひそめる人もいる","lienKetVI":"Kêu gọi bảo vệ privacy → nhưng lại tự công khai khi có lợi → thái độ không nhất quán → nhiều người phản cảm","correct":{"jp":"プライバシーに対する**姿勢が一貫していない**","vi":"Khớp với 「プライバシー保護を訴えておきながら、都合のいいときだけさらけ出す」."},"wrong":[{"key":"B","jp":"プライバシー保護の流れに**逆行**していて好ましくない","trap":"bẫy chi tiết phụ","vi":"Không phải điểm chính — vấn đề không phải là 'đi ngược xu hướng' mà là sự MÂU THUẪN trong thái độ bản thân."},{"key":"C","jp":"マスメディアに**都合よく利用されているだけ**だ","trap":"bẫy mọi người","vi":"Tự thêm ý 'bị lợi dụng' — không có trong bài, bài nói diễn viên CHỦ ĐỘNG làm điều này."},{"key":"D","jp":"マスメディアを利用した**情報は信じることができない**","trap":"bẫy mọi người","vi":"Không liên quan — không có trong bài."}]},{"huongTuDuy":"Lý do tác giả đề xuất — đoạn sau 'だが別のとらえ方' mô tả giả thuyết 'phòng thủ trước'.","chotY":"「マスメディアに勝手に詮索され…自分の方から情報公開して、いわば**他人による勝手な物語化に対する予防措置**である」.","lienKetJP":"マスメディアが勝手に記事化する前に→自ら先手を打つ→他人による勝手なイメージ作りを防ぐ","lienKetVI":"Trước る","lienKetVI":"<私づくり> là quyền cá nhân → nhưng đôi khi bị cướp mất → cố giành lại = muốn giữ vai trò chủ thể","correct":{"jp":"＜私づくり＞において、人は**主体的であろうとする**","vi":"Khớp đúng với câu kết 「引き戻そうとする」 — hành động chủ động giành lại quyền tự quyết hình ảnh bản thân."},"wrong":[{"key":"B","jp":"＜私づくり＞において、**個人の人権が守られるようになった**","trap":"bẫy ngược nghĩa","vi":"Ngược chiều — bài nói quyền này ĐÃ BỊ CƯỚP (権利が奪われ), không phải đang được bảo vệ."},{"key":"C","jp":"＜私づくり＞の主導権が**他人に奪われてしまっている**","trap":"bẫy chi tiết phụ","vi":"Đây chỉ là HIỆN TRẠNG/VẤN ĐỀ nêu ra, không phải quan điểm TỔNG KẾT của tác giả — bài kết ở hành động 'cố giành lại'."},{"key":"D","jp":"＜私づくり＞の主導権を**自身のもとに引き戻すことはできない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — câu kết dùng 「引き戻そうとする」 với ý chí rõ ràng, không phải 'không thể'."}]}],"Mon10-18":[{"huongTuDuy":"Bài 18 trùng nội dung với Bài 4 (triết học) — cùng đáp án, dùng lại giải thích tương tự.","chotY":"「科学的知は…必ずそのつど、**特定の観点からだけ**対象を扱い、自分が**関心を持つ側面だけを取り上げ**」.","lienKetJP":"科学＝対象を突き放す → 特定の観点・関心ある側面だけ扱う → 現在の客観的事象の一部のみ検証","lienKetVI":"Khoa học = tách rời đối tượng → chỉ lấy góc nhìn/khía cạnh quan tâm cụ thể → chỉ kiểm chứng 1 phần sự kiện khách quan hiện tại","correct":{"jp":"**現在の事象の一部だけ**を取り上げて**客観的な立場**で検証する","vi":"Khớp với 「特定の観点からだけ対象を扱い、関心ある側面だけ取り上げ」."},"wrong":[{"key":"B","jp":"関心のある対象だけを客観的な立場で検証し**未来を予測**する","trap":"bẫy chi tiết phụ","vi":"'Dự đoán tương lai' không có trong nội dung giới hạn thứ nhất — đó là vùng của giới hạn thứ 2."},{"key":"C","jp":"**過去の経験**をもとにして客観的な立場で現在の状況を扱う","trap":"bẫy chi tiết phụ","vi":"Nhầm với nội dung giới hạn thứ 2: khoa học không xử lý được ký ức quá khứ/kỳ vọng tương lai."},{"key":"D","jp":"**人間的知の全体**を客観的な立場からだけとらえる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — khoa học KHÔNG bao giờ nhìn toàn thể (決して対象の全体を見ようとはしない)."}]},{"huongTuDuy":"①この傾向 chỉ thị từ — câu ngay trước nói về hệ quả của việc khoa học chỉ nhìn 1 phần.","chotY":"「科学が進むと、**細分化が必至**となり…**専門化と特殊化**が、科学の運命であり…①この傾向には歯止めが利かない」.","lienKetJP":"科学は一部だけを扱う → 細分化が必至 → 専門化・特殊化が進む（①この傾向）→ 歯止めが利かない","lienKetVI":"Khoa học chỉ xử lý một phần → tất yếu phân nhỏ → chuyên môn hóa ngày càng mạnh (= '①xu hướng này') → không thể ngăn lại","correct":{"jp":"**専門分野**が以前より**細かく分かれる**ようになってきた","vi":"Khớp trực tiếp với 「専門化と特殊化が、科学の運命」「細分化が必至」."},"wrong":[{"key":"A","jp":"近代的な研究を行う**部門がさらに増えてきた**","trap":"bẫy chi tiết phụ","vi":"Quá chung chung — trọng tâm là sự PHÂN NHỎ của từng lĩnh vực (細分化), không phải tăng số lượng bộ phận."},{"key":"B","jp":"特殊な研究対象が**排除**されるようになってきた","trap":"bẫy mọi người","vi":"Không có trong bài."},{"key":"C","jp":"研究対象をより**実践的**にとらえるようになってきた","trap":"bẫy mọi người","vi":"Không liên quan — bài không nói về tính thực tiễn của nghiên cứu."}]},{"huongTuDuy":"②なぜ khoa học không xử lý được 'nên sống thế nào' — câu giải thích ngay sau.","chotY":"「科学的知は、対象を、自分と無関係な事柄として扱う**客観性**がその特色をなしている」— chỉ xác nhận sự kiện khách quan hiện tại, không xử lý hành vi quyết định chủ thể.","lienKetJP":"科学＝客観性が特色（現在の事実確認のみ）→ 過去の記憶・未来の期待を考慮した主体的決断は扱えない","lienKetVI":"Khoa học = đặc trưng khách quan (chỉ xác nhận sự kiện hiện tại) → không xử lý được quyết định chủ thể dựa vào ký ức quá khứ/kỳ vọng tương lai","correct":{"jp":"**客観的な事実確認**を重視するものだから","vi":"Khớp đúng đặc trưng cốt lõi: khoa học chỉ dựa vào xác nhận sự kiện khách quan (実証性)."},"wrong":[{"key":"B","jp":"**現在の行為だけ**を主体的に扱うものだから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — khoa học XỬ LÝ hiện tại một cách khách quan, nhưng KHÔNG xử lý được 'hành vi chủ thể'."},{"key":"C","jp":"**人間全体を解明することができない**から","trap":"bẫy chi tiết phụ","vi":"Đây là giới hạn THỨ NHẤT (không nhìn toàn thể), không phải lý do của giới hạn THỨ HAI đang được hỏi."},{"key":"D","jp":"人間の考えや行為の多くを**まだ実証できない**から","trap":"bẫy mọi người","vi":"Không có trong bài — tác giả không nói về giới hạn 'chưa chứng minh được', mà về bản chất KHÁC BIỆT giữa khách quan và chủ thể."}]},{"huongTuDuy":"Câu hỏi tổng kết vai trò triết học — câu mở và câu kết bài nêu rõ.","chotY":"「人間はいかに生きるであるかという、**人間の主体的な行為の根本**を考究して、**人生観の知を形成する**ところに、哲学的な知の本質的な成立根拠がある」.","lienKetJP":"科学は2つの限界がある（全体を見ない・主体的行為を扱えない）→ 哲学はこれを補う → 人間の生き方の根本を扱える","lienKetVI":"Khoa học có 2 giới hạn → triết học bù đắp → có thể xử lý gốc rễ cách sống con người","correct":{"jp":"**人間の生き方の根本**を扱えること","vi":"Khớp đúng với 「人間はいかに生きるべきか…人間の主体的な行為の根本を考究」."},"wrong":[{"key":"B","jp":"**主体的に考える方法**を示せること","trap":"bẫy chi tiết phụ","vi":"'Phương pháp suy nghĩ' chỉ là công cụ — bài nhấn mạnh triết học xử lý GỐC RỄ CỦA CÁCH SỐNG, không phải dạy phương pháp tư duy."},{"key":"C","jp":"**科学的な世界**を視野に入れられること","trap":"bẫy chi tiết phụ","vi":"Không chính xác — triết học vượt ra NGOÀI giới hạn của khoa học, không phải 'bao gồm cả thế giới khoa học'."},{"key":"D","jp":"世界のあり方を**客観的にとらえられる**こと","trap":"bẫy ngược nghĩa","vi":"'Khách quan' là đặc trưng của KHOA HỌC — triết học xử lý những gì khách quan KHÔNG làm được."}]}],"Mon10-19":[{"huongTuDuy":"Câu hỏi về mục đích đọc sách sau khi nghe lời thầy — bám vào điều tác giả TỰ SUY RA từ câu nói của thầy.","chotY":"「自分の**偏狭な物の見方を問い直さなければならない**」— không phải để hiểu sách khó, mà để XEM XÉT LẠI cách nhìn hẹp hòi của bản thân.","lienKetJP":"先生の言葉 → 限られた知識の確認だけではだめ → 自分の知らない考え方にふれる → 偏狭な物の見方を問い直す","lienKetVI":"Lời thầy → không chỉ xác nhận kiến thức cũ → tiếp xúc với cách nghĩ mình chưa biết → xem xét lại cái nhìn hẹp hòi bản thân","correct":{"jp":"**自身の物の見方**や考え方を**再考する**ため","vi":"Khớp trực tiếp với 「偏狭な物の見方を問い直さなければならない」."},"wrong":[{"key":"A","jp":"**難解な物の見方**や考え方を**理解する**ため","trap":"bẫy chi tiết phụ","vi":"Đây là hành động tác giả THỰC HIỆN sau đó (フランス現代思想の本をとことん読む), không phải mục đích gốc rễ."},{"key":"C","jp":"**自身の知識を増やす**ため","trap":"bẫy chi tiết phụ","vi":"Ngược lại với lời thầy — tác giả đọc để KHÔNG CHỈ là tích lũy kiến thức (確認するだけの本を読むのではだめ)."},{"key":"D","jp":"自身の知識が正しいかどうか、**確認するため**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — đây chính là điều tác giả bác bỏ (確認するだけの本を読むのではだめ)."}]},{"huongTuDuy":"'Hiểu' (理解する) theo định nghĩa của bài — câu hỏi về bản chất của hành vi 'hiểu'.","chotY":"「理解するということは、唯一存在しているこの人やこの物を、その単独な在り方ではなく、**ほかの人やほかの物と共通する一般的な在り方で捉える**ことだ」.","lienKetJP":"理解する＝単独の在り方ではなく → 他と共通する一般的な在り方 → 概念・観念をとおして諸々の存在を捉える","lienKetVI":"'Hiểu' = không theo cách tồn tại riêng biệt → mà theo khuôn chung với những thứ khác → dùng khái niệm/quan niệm để nắm bắt mọi sự vật","correct":{"jp":"概念や観念をとおして、**様々な人や物を共通の枠組みで**捉えること","vi":"Khớp trực tiếp với 「ほかの人やほかの物と共通する一般的な在り方で捉える」「概念や観念をとおして」."},"wrong":[{"key":"A","jp":"概念や観念に頼らず、人や物を**中立的に**捉えること","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ 理解するとは DÙNG khái niệm/quan niệm, không phải 'không dựa vào' chúng."},{"key":"B","jp":"概念や観念にとらわれず、人や物の**本質を**捉えること","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói khái niệm/quan niệm là CÔNG CỤ của lý giải, không phải thứ cần thoát khỏi."},{"key":"C","jp":"概念や観念を利用して、人や物を**単独な在り方で**捉えること","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói rõ 'hiểu' là theo cách CHUNG, không phải theo cách 単独 (riêng biệt)."}]},{"huongTuDuy":"Câu hỏi về VẤN ĐỀ của việc 'hiểu' — bài chỉ ra điều bị bỏ sót khi ta dùng khung chung để hiểu.","chotY":"「この人やこの物が持っている**単独のなにか**は、理解では捉えられないまま、知それ自体のなかで**忘却されてしまいがち**だ」.","lienKetJP":"理解＝共通の枠組みで捉える → しかし → 単独のなにか（個別性・独自性）は捉えられないまま忘却される","lienKetVI":"'Hiểu' = dùng khuôn chung → nhưng → cái riêng biệt/độc đáo (tính cá biệt) bị bỏ sót và bị lãng quên","correct":{"jp":"人や物の**個別性や独自性**が見えなくなるおそれがある","vi":"Khớp với 「単独のなにかは、理解では捉えられないまま、忘却されてしまいがち」."},"wrong":[{"key":"A","jp":"学問としての**正しい在り方に疑問を持たなくなる**","trap":"bẫy chi tiết phụ","vi":"Không phải vấn đề được nêu — bài không nói về thái độ với học thuật mà nói về điều BỊ BỎ QUÊN khi ta 'hiểu'."},{"key":"B","jp":"諸々の存在を**個別性や独自性でしか捉えられなくなる**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — vấn đề là 'hiểu theo khung chung' nên cá biệt tính BỊ QUÊN, không phải 'chỉ nhìn theo cá biệt tính'."},{"key":"D","jp":"人や物の本質に**力を加えて、ゆかめてしまう**可能性がある","trap":"bẫy chi tiết phụ","vi":"Bài có nêu 'liệu có bạo lực không' (暴力的なところはないのか) như câu hỏi gợi mở, nhưng câu trả lời cụ thể là về 'tính cá biệt bị lãng quên', không phải 'bóp méo bản chất'."}]}],"Mon10-20":[{"huongTuDuy":"Vấn đề của 'thuyết nhân loại trung tâm' — bài nêu 3 vấn đề, câu hỏi hỏi vấn đề nào khớp với quan điểm tác giả.","chotY":"「どちらも「人間のための」という共通の基盤の上にたっている以上…人間の価値観を統一することなどできない」「人と森の関係は**多様**である以上、どうすることが…その答えはさまざまである」.","lienKetJP":"人間中心的な論 → 3つの問題 → その中でも最も根本的：立場によって答えが変わる（多様性の問題）","lienKetVI":"Thuyết nhân loại trung tâm → 3 vấn đề → cốt lõi: đứng góc nào thì câu trả lời khác nhau (vấn đề đa dạng quan điểm)","correct":{"jp":"森林・自然の維持に対する考え方は、**立場によって異なること**","vi":"Khớp với 「人間の価値観を統一することなどできない」「人と森の関係は多様である以上、答えはさまざま」."},"wrong":[{"key":"A","jp":"人間のための森林・自然の維持に、**結びついていない**こと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — thuyết nhân loại trung tâm CHÍNH LÀ lý luận vì con người, không phải tách rời."},{"key":"B","jp":"人間がいなければ、森林・自然は**維持できないと考えている**こと","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý này vào."},{"key":"C","jp":"**農山村に暮らす人間の考え方**が優先されすぎていること","trap":"bẫy chi tiết phụ","vi":"Bài dùng nông dân/thành phố như VÍ DỤ minh họa cho sự đa dạng, không phải vấn đề 'ưu tiên quá mức' của nhóm này."}]},{"huongTuDuy":"Vấn đề của 'thuyết tự nhiên trung tâm' ở Nhật Bản — bài đưa ra ví dụ cụ thể.","chotY":"「日本のような、長い歴史のなかで自然と人間とが相互に影響を与えながら…地域の森林・自然の問題をよく説明できないからである」→ ví dụ: 里山天然林 = 「徹底的に**人間の手を加えた**天然林」.","lienKetJP":"自然中心主義→原生林には有効 → しかし日本の里山＝人間の手を加えた天然林 → 人間が介入して維持されてきた森も多い","lienKetVI":"Thuyết tự nhiên trung tâm → hiệu quả với rừng nguyên sinh → nhưng ở Nhật có 里山 = rừng tự nhiên ĐƯỢC DUY TRÌ bởi bàn tay con người → lý thuyết này không giải thích được","correct":{"jp":"**人間の介入**によって、**維持されてきた森林・自然**もあるから","vi":"Khớp với 「徹底的に人間の手を加えた天然林」「人間の手が入ることで守られてきた」."},"wrong":[{"key":"B","jp":"人間が手を加えずに、**原生林や原生的な自然を維持するのは難しい**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói thuyết tự nhiên trung tâm VẪN HIỆU QUẢ với rừng nguyên sinh (原生林), vấn đề là ở rừng loại KHÁC."},{"key":"C","jp":"自然の維持よりも**人間の暮らしを守ることが優先されている**から","trap":"bẫy chi tiết phụ","vi":"Không đúng trọng tâm — vấn đề là thực tế lịch sử (rừng được người duy trì), không phải về thứ tự ưu tiên."},{"key":"D","jp":"自然の生存権を保障することについて、**人間の理解が得られない**から","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm vào."}]},{"huongTuDuy":"Vai trò của tình nguyện viên rừng — đoạn kết bài nêu rõ lập trường.","chotY":"「森林・自然と人間の関係を**持続的に維持していく**ことこそが重要だ」「森と人とが**相互的な依存関係**をもっている…営みを守っていく」.","lienKetJP":"人間中心でも自然中心でもない → 森林と人間の関係を持続的に維持する → 相互依存関係を守る","lienKetVI":"Không theo trung tâm con người cũng không theo tự nhiên → duy trì bền vững MỐI QUAN HỆ giữa rừng và người → bảo vệ sự phụ thuộc lẫn nhau","correct":{"jp":"森林・自然と人間が**共存できる関係を維持**していくこと","vi":"Khớp với 「森林・自然と人間の関係を持続的に維持」「相互的な依存関係…守っていく」."},"wrong":[{"key":"A","jp":"**人間を中心として**、森林・自然との関係を維持していくこと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ không thể đứng về phía 人間中心 (「人間中心主義的な立場にたつこともできない」)."},{"key":"B","jp":"**人間の営みを制限**して、森林・自然との新たな関係を見付け出すこと","trap":"bẫy chi tiết phụ","vi":"'Hạn chế hoạt động con người' không có trong bài — trọng tâm là DUY TRÌ mối quan hệ, không phải hạn chế."},{"key":"D","jp":"森林・自然が持続できるように、**できるだけ自然に任せる**こと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — đây là lập trường 自然中心主義 mà bài cũng bác bỏ (「自然中心的な立場にたつこともできない」)."}]}],"Mon10-21":[{"huongTuDuy":"Điểm khác biệt của Robopy so với robot thông thường — đoạn đầu mô tả rõ nguyên tắc lập trình.","chotY":"「300以上の動作プログラムをし、動作パターンが次々にどういう順番で発現するかというルールを700以上プログラムした」「自分たちでも**プログラムがどう作用するかわからなくなる**。何に反応して、どんな行動をするか**予測不能**になった」.","lienKetJP":"通常のロボット：情報に応じた反応（予測可能）← 対立 → ロボピー：300+700のプログラム → 動きが予測不能","lienKetVI":"Robot thông thường: phản ứng theo thông tin (dự đoán được) ↔ Robopy: 300+700 chương trình → hành động không thể dự đoán","correct":{"jp":"**どう動くかというプログラム**を多数組み込んだので、**動きが予測できない**","vi":"Khớp với 「300以上の動作プログラム」「予測不能になった」."},"wrong":[{"key":"A","jp":"動作パターンが**限られている**ので、ある程度動きが予測できる","trap":"bẫy ngược nghĩa","vi":"Ngược hoàn toàn — Robopy có HƠN 300 chương trình, không phải 'hạn chế'."},{"key":"B","jp":"与えられた情報の一部を**自分で判断して**動くので、動きが予測できない","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — tác giả nhấn mạnh Robopy KHÔNG tự phán đoán, chỉ là chương trình phức tạp kích hoạt (「もちろんそれはプログラムが作動しただけ」)."},{"key":"D","jp":"多様で複雑な動作をプログラムしたので、**人間のように自然な動き**ができる","trap":"bẫy mọi người","vi":"Không có trong bài — 'tự nhiên như người' không phải mục đích hay kết quả được mô tả."}]},{"huongTuDuy":"Cảm nhận của tác giả khi Robopy đột ngột đi — cần tìm đúng 'cảm nhận' chứ không phải 'thực tế'.","chotY":"「もちろんそれは、ロボピーの中のある**プログラムが…作動しただけのことだ**。だがなにか首尾一貫したひとつの意思決定機構から生み出された行動**であるかのように見えた**のだ」.","lienKetJP":"実際：プログラムが作動しただけ → しかし → 意思があるかのように見えた（そう感じてしまった）","lienKetVI":"Thực tế: chỉ là chương trình kích hoạt → nhưng → trông như có ý chí (tác giả CẢM THẤY như vậy)","correct":{"jp":"**プログラムが作動**して、意思があるかのようにロボピーが動いた","vi":"Khớp với 「プログラムが作動しただけ」+「意思決定機構から生み出された行動であるかのように見えた」 — phân biệt thực tế và cảm nhận."},"wrong":[{"key":"A","jp":"プログラムに**間違いがあり**、ロボピーに意思が生まれて動いた","trap":"bẫy mọi người","vi":"Không có trong bài — không có lỗi lập trình, mà là chương trình phức tạp hoạt động đúng."},{"key":"B","jp":"プログラムが作動したのではなく、**ロボピー自身が考えて**動いた","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ 「もちろんそれはプログラムが作動しただけ」, tác giả biết rõ không phải robot 'tự suy nghĩ'."},{"key":"D","jp":"プログラムが**誤作動**して、制作者の意図に反してロボピーが動いた","trap":"bẫy chi tiết phụ","vi":"Không có trong bài — không có khái niệm 'lỗi hoạt động' hay 'ngược ý định'."}]},{"huongTuDuy":"Quan điểm tổng kết của tác giả về 'tâm' — bám câu kết bài.","chotY":"「心とは、複雑に動くモノに現実的にあるというより、**その動きを見ている側が想像しているもの**なのだ」.","lienKetJP":"単純な動き→心を感じない → 複雑すぎる動き→理解しきれない → 「こいつは考えている」という想像が働く → それを「心」と呼ぶ","lienKetVI":"Chuyển động đơn giản → không cảm nhận tâm → chuyển động quá phức tạp/không hiểu nổi → trí tưởng tượng 'nó đang suy nghĩ' hoạt động → đó là cái gọi là 'tâm'","correct":{"jp":"**理解しきれない複雑な動き**を見たときに、人間が**想像するもの**だ","vi":"Khớp trực tiếp với câu kết 「複雑に動くモノを見ている側が想像しているもの」+「解釈しきれないほど複雑なものがあると、想像が働く」."},"wrong":[{"key":"A","jp":"あると思って観察すれば、複雑な動きの**意図が理解できる**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 'tâm' xuất hiện khi KHÔNG hiểu được (理解しきれない), không phải khi cố quan sát để hiểu."},{"key":"B","jp":"**実体がない**ので、あるとかないとか想像しても**意味がない**","trap":"bẫy mọi người","vi":"Tự thêm kết luận hư vô — bài không nói 'tưởng tượng về tâm là vô nghĩa', mà chỉ nói tâm là SẢN PHẨM của trí tưởng tượng."},{"key":"C","jp":"仕組みが**複雑すぎる**ため、人間同士であっても**想像できない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói khi quá phức tạp thì trí tưởng tượng MỚI ĐƯỢC kích hoạt (「想像が働く」), không phải 'không tưởng tượng được'."}]}],"Mon10-22":[{"huongTuDuy":"So sánh ảnh và video theo quan điểm tác giả — đoạn mở bài nêu rõ.","chotY":"「すべてが提示されていないからこそ、それを**補うための想像力が必要**となる」「テレビのように用意された答えを差し出し…とは違って」.","lienKetJP":"テレビ：用意された答えを差し出す（受動的）← 対立 → 写真：すべてが提示されない → 想像力が必要","lienKetVI":"TV: đưa sẵn câu trả lời (thụ động) ↔ Ảnh: không hiển thị tất cả → người xem cần tưởng tượng (chủ động)","correct":{"jp":"写真は一瞬しか写し出されていないため、**映像より見る人の想像力が必要**だ","vi":"Khớp trực tiếp với 「すべてが提示されていないからこそ…想像力が必要」."},"wrong":[{"key":"A","jp":"想像力を働かせて写真を見れば、映像と**同じような臨場感**が得られる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói ảnh 「臨場感では劣り」 (kém về cảm giác thực tế hơn video), không phải 'bằng nhau'."},{"key":"B","jp":"写真のほうが**原始的**だからこそ、見る人に**簡潔に意味が伝わる**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 'nguyên thủy' không có nghĩa là truyền đạt dễ hơn; ảnh đòi hỏi NGƯỜI XEM phải tự bổ sung thêm."},{"key":"D","jp":"写真は写っていないものがある分、見る人が**自分を重ね合わせるのが難しい**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói thiếu thông tin giúp người xem DỄ DÀNG hơn (không phải khó hơn) khi tự mình tưởng tượng và phóng chiếu bản thân."}]},{"huongTuDuy":"'Tác phẩm nổi tiếng' (名作) theo tác giả — câu hỏi về định nghĩa ở đoạn cuối bài.","chotY":"「様々な人が、心のままに写真に向き合い、そこから**いろいろなメッセージをくみとれる**写真が、多くの人に支持され、時を越えて残っていく名作なのだと思う」.","lienKetJP":"名作＝見る人・心の状態によって感じるものが違う → 様々なメッセージをくみとれる → 多くの人に支持される","lienKetVI":"Tác phẩm nổi tiếng = thay đổi theo người xem/trạng thái tâm lý → nhiều thông điệp có thể rút ra → được nhiều người ủng hộ vượt thời gian","correct":{"jp":"見る人や心の状態によって、**受け取るメッセージが違う**","vi":"Khớp trực tiếp với 「悲しい時、うれしい時…感じるものは違ってくる」「いろいろなメッセージをくみとれる」."},"wrong":[{"key":"A","jp":"若い時に価値が分からなくても、**年を取るとよさが分かるようになる**","trap":"bẫy chi tiết phụ","vi":"Đây chỉ là VÍ DỤ minh họa (「若い時感動した写真が今は感じない…逆に」), không phải định nghĩa của 名作."},{"key":"B","jp":"多くのメッセージを含んでおり、見る人に**様々な感情を呼び起こす**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng sai trọng tâm — bài nhấn mạnh sự KHÁC NHAU của mỗi người (心のあり様によって違う), không phải 'nhiều cảm xúc được gợi ra đồng thời'."},{"key":"C","jp":"明確な一つのメッセージが伝わるような**構成力や力強さ**がある","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 構成力や力強さ là ĐIỀU KIỆN ĐỂ THU HÚT (điều kiện cần), còn 名作 mới là thứ mang lại NHIỀU THÔNG ĐIỆP KHÁC NHAU theo người xem."}]},{"huongTuDuy":"Quan điểm tổng kết của tác giả về nhiếp ảnh trong thời đại mới — bám câu kết bài.","chotY":"「誰もが撮ることができる時代だからこそ、**独自の視点**で…素晴らしい写真を撮ることができれば、多くの人たちによさが**認めてもらえる環境**が整った」.","lienKetJP":"一億総カメラマンの時代 → だからこそ → 独自の視点で撮れれば → 認められる環境が整った（むしろプラス）","lienKetVI":"Thời đại ai cũng chụp được → chính vì vậy → nếu chụp được từ góc nhìn độc đáo → môi trường để được công nhận đã được tạo ra (là cơ hội, không phải thách thức)","correct":{"jp":"**独自の視点**で想像力を呼び起こすものが撮れれば、**力を持ち続ける**","vi":"Khớp với 「独自の視点で…よさが認めてもらえる環境が整った」 — thời đại nhiều người chụp tạo ra CƠ HỘI cho góc nhìn độc đáo."},"wrong":[{"key":"A","jp":"誰もがどこでも撮れる時代になり、**心に迫るものを撮ることが難しくなっている**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — bài không xem đây là mối đe dọa mà là CƠ HỘI (「写真の力が失われていると嘆く人もいるが、私はそうは思わない」)."},{"key":"B","jp":"想像力を生かせば、他の人が見逃していた視点で**撮れる環境が整ってきている**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng sai trọng điểm so sánh — bài nhấn mạnh 'được CÔNG NHẬN' (認めてもらえる) chứ không chỉ 'chụp được'."},{"key":"D","jp":"技術の進歩で誰でもよいものが撮れるようになり、力が**再認識されている**","trap":"bẫy mọi người","vi":"Sai trọng tâm — bài không nói về 'kỹ thuật tiến bộ → ai cũng chụp hay được', mà về QUAN ĐIỂM ĐỘC ĐÁO tạo ra sự khác biệt."}]}],"Mon10-23":[{"huongTuDuy":"Quan điểm của tác giả về việc giải toán — đoạn đầu bài nêu rõ lập trường.","chotY":"「解き方がわかってしまったあとで、力がつくことはない」「解き方のわからない間だけが、力をつけるチャンス」「解き方がわからないからこそ、**問題の名にあたいする**のだ」.","lienKetJP":"解けるようになる過程にこそ意味がある → 解けない問題を解こうとすること自体が価値 → 解き方がわからないからこそ問題","lienKetVI":"Quá trình để giải được mới có ý nghĩa → bản thân việc cố giải bài chưa biết cách mới có giá trị → chưa biết cách giải MỚI THỰC SỰ là bài toán","correct":{"jp":"解き方のわからない問題を**解こうとすることに意味がある**","vi":"Khớp trực tiếp với 「解き方がわからないからこそ、問題の名にあたいする」."},"wrong":[{"key":"A","jp":"早く解けなくても、**解き方を身につけることが大切だ**","trap":"bẫy chi tiết phụ","vi":"'Học cách giải' là mục tiêu KẾT QUẢ, không phải điều tác giả nhấn mạnh — tác giả chú trọng QUÁ TRÌNH còn đang không biết."},{"key":"B","jp":"解けても解けなくても、問題に**取り組むことが大切だ**","trap":"bẫy chi tiết phụ","vi":"Quá rộng — bài không nói 'dù thế nào cũng tốt', mà nhấn mạnh riêng giai đoạn CHƯA BIẾT CÁCH GIẢI."},{"key":"C","jp":"解けなかった問題が**解けるようになったらおもしろくなる**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ 「解けるようになったあとは、むしろむなしい」(sau khi giải được thì trống rỗng hơn)."}]},{"huongTuDuy":"'頭の中に飼っておく' — ẩn dụ, cần xác định đúng nghĩa bóng.","chotY":"「案外に、多少はわからないでも、うまく**頭のなかに飼っておく**と、そのうちに馴れてくれて、わかってきたりする」「わからないのを飼っておける、その**牧場のゆたかさ**」.","lienKetJP":"すぐわかろうとしない → わからないまま頭に残しておく → そのうちに理解できてくる","lienKetVI":"Không vội hiểu ngay → giữ trạng thái chưa hiểu trong đầu → dần dần sẽ hiểu ra","correct":{"jp":"**わからない状態のまま**、問題を頭のなかに**残しておくこと**","vi":"Khớp trực tiếp với 「多少はわからないでも、頭のなかに飼っておく」 — 'nuôi' bài toán chưa hiểu trong đầu, không vội giải."},"wrong":[{"key":"A","jp":"わかる問題を手がかりにして、**わからない問題を考えること**","trap":"bẫy chi tiết phụ","vi":"Không có trong bài — tự thêm ý 'dùng bài biết để giải bài không biết'."},{"key":"B","jp":"わかる問題とわからない問題を、頭のなかで**区別しておくこと**","trap":"bẫy chi tiết phụ","vi":"Không phải ý nghĩa của ẩn dụ — không có nội dung 'phân loại' trong bài."},{"key":"C","jp":"わからない問題を**わかるまで解き続けていること**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không nói 'cố giải cho ra', mà nói GIỮ TRẠNG THÁI CHƯA HIỂU và đợi."}]},{"huongTuDuy":"Câu hỏi tổng kết về cách học nên có — bám câu kết bài.","chotY":"「ゆったりとやると、そのわかり方に**コクが出てくる**ものだ。そして、その**結果に達するまでの道筋を楽しむ**ことで、力がつく」「楽しむ気になれば、なんだって楽しめるものだ」.","lienKetJP":"急がない → わかり方に深みが出る → 道筋を楽しむ → 力がつく","lienKetVI":"Không vội → hiểu sâu hơn → tận hưởng quá trình → năng lực được tích lũy","correct":{"jp":"**結果を急がず**に、考えることを**楽しむ**","vi":"Khớp với 「ゆったりとやる」「結果に達するまでの道筋を楽しむことで力がつく」."},"wrong":[{"key":"B","jp":"結果に達することができれば、**どんなやり方でもよい**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ 「どんなやり方でも…結果は同じかもしれない」 NHƯNG cách 'ゆったり' mới tạo ra 深み và 力, tức là CÁCH LÀM CÓ KHÁC NHAU."},{"key":"C","jp":"**目的を忘れないで**、あせらずに勉強を楽しめばよい","trap":"bẫy chi tiết phụ","vi":"Sai hướng — bài nói 「目的ばかり見てあせるから楽しめない」 tức là nên BỚT CHÚ Ý VÀO MỤC TIÊU, không phải 'đừng quên mục tiêu'."},{"key":"D","jp":"**自分に合ったやり方を探して**、時間を気にせず取り組む","trap":"bẫy mọi người","vi":"Không có trong bài — 'tìm cách phù hợp bản thân' là ý tự thêm vào."}]}],"Mon10-24":[{"huongTuDuy":"Điểm khác biệt của nghề giáo với công việc thông thường — đoạn đầu bài nêu rõ.","chotY":"「知識や教育技術がたとえ**未熟であったとしても**、不思議と初めて受け持った授業が…**一番濃い縁を結ぶ**ことがよくある」「若く未熟であることが**むしろプラスに働く**ケースがよくある」.","lienKetJP":"通常の仕事：技術が上がるほど質が良くなる ← 対立 → 教育：未熟さがプラスに働くことがある","lienKetVI":"Công việc thông thường: kỹ năng cao hơn → chất lượng tốt hơn ↔ Giáo dục: sự non nớt đôi khi LẠI có tác dụng tích cực","correct":{"jp":"知識や技術が十分でなくても**良い結果**を生むことがある","vi":"Khớp với 「知識や教育技術がたとえ未熟であったとしても…一番濃い縁」「未熟さがプラスに働く」."},"wrong":[{"key":"A","jp":"知識や技術の高さよりも**人格の良さ**の方が重視される","trap":"bẫy mọi người","vi":"'Nhân cách tốt' không có trong bài — tác giả không so sánh kỹ năng với nhân cách."},{"key":"C","jp":"経験の豊富なベテランより、**若く未熟な方が好かれやすい**","trap":"bẫy chi tiết phụ","vi":"Quá tuyệt đối hóa — bài nói kinh nghiệm VẪN HỮU ÍCH (「ベテランの安定感は大切」), vấn đề là cả hai đều có giá trị khác nhau."},{"key":"D","jp":"経験を積み技術が上がっても、**仕事の質が良くなるとは限らない**","trap":"bẫy chi tiết phụ","vi":"Quá rộng — bài không nói kinh nghiệm làm giảm chất lượng, mà chỉ nói trong GIÁO DỤC có yếu tố 'sự tươi mới' không đến từ kinh nghiệm."}]},{"huongTuDuy":"Tác động của sự căng thẳng của giáo viên năm đầu đến học sinh — đoạn giải thích cơ chế.","chotY":"「初年度の教師が持つ緊張感は、生徒にも**伝染する**。その緊張感の共有が、**一つの同じ場を作り上げているのだという意識**を生みだす。**参加し作り上げる感覚**が、生徒の方にも生まれる」.","lienKetJP":"初年度の緊張感 → 生徒に伝染 → 緊張感を共有 → 一緒に作り上げている意識 → 参加感が生まれる","lienKetVI":"Sự căng thẳng năm đầu → lây sang học sinh → cùng chia sẻ căng thẳng → ý thức 'cùng nhau tạo ra buổi học' → cảm giác tham gia được hình thành","correct":{"jp":"教師と**一緒に授業を作っているのだという気持ち**になる","vi":"Khớp trực tiếp với 「参加し作り上げる感覚が、生徒の方にも生まれる」."},"wrong":[{"key":"A","jp":"積極的に授業に参加し、**教師の緊張感を和らげようとする**","trap":"bẫy chi tiết phụ","vi":"'Giúp giáo viên bớt căng thẳng' không có trong bài — học sinh tham gia vì CẢM GIÁC CÙNG TẠO RA, không phải vì muốn giúp giáo viên."},{"key":"B","jp":"教師の立場を理解し、**生徒らしい態度で授業を受けようとする**","trap":"bẫy ngược nghĩa","vi":"Ngược với tinh thần bài — 'thái độ học sinh đúng nghĩa' là kiểu quan hệ THỤ ĐỘNG (サービスされる側), đây là điều bài PHÊ PHÁN."},{"key":"D","jp":"教師と緊張感が共有でき、**心を開いていいのだと思うようになる**","trap":"bẫy chi tiết phụ","vi":"'Cảm thấy có thể cởi mở' không phải điều được nêu — trọng tâm là Ý THỨC CÙNG TẠO RA buổi học."}]},{"huongTuDuy":"Điều quan trọng nhất với người làm giáo dục — bám câu kết bài không phải câu giữa.","chotY":"「経験知を重ねる良さを残したまま、**新鮮さを失わない**。これは、もはや一つの技である」「「先生も**自分たちと一緒に変化してくれる**」という意識が学ぶ側に生まれると」.","lienKetJP":"未熟さがプラスに働く → ただし自覚した上での精一杯さが必要 → 経験を積みながらも新鮮さを失わない → 自ら変化し続ける","lienKetVI":"Sự non nớt có tác dụng → nhưng cần ý thức và cố gắng hết sức → tích lũy kinh nghiệm mà không mất đi sự tươi mới → không ngừng tự thay đổi","correct":{"jp":"経験に満足することなく、**自ら変化し続けようとすること**","vi":"Khớp với câu kết 「新鮮さを失わない」「先生も自分たちと一緒に変化してくれる」."},"wrong":[{"key":"B","jp":"新鮮さを失わないために、**自ら新しい知識や技術を身につけること**","trap":"bẫy chi tiết phụ","vi":"'Học kiến thức/kỹ năng mới' chỉ là 1 phương tiện — bài nhấn mạnh sự THAY ĐỔI và TƯƠI MỚI trong THÁI ĐỘ, không phải tích lũy kiến thức."},{"key":"C","jp":"自らの足りなさを補いつつ、**情熱を持って接すること**","trap":"bẫy chi tiết phụ","vi":"'Bổ sung thiếu sót + nhiệt huyết' là điều kiện để 未熟さがプラスに転じる (câu giữa bài), không phải kết luận QUAN TRỌNG NHẤT."},{"key":"D","jp":"自らの未熟さを隠さずに、**学ぶ側が一体感を得やすくすること**","trap":"bẫy chi tiết phụ","vi":"'Không che giấu sự non nớt' là điều kiện, còn 'giúp học sinh đoàn kết' là KẾT QUẢ, không phải điều bài đặt làm trọng tâm cuối cùng."}]}],"Mon12-1":[{"huongTuDuy":"Câu hỏi về định nghĩa 外的報酬 vs 内的報酬 — cần bao quát ĐỦ cả 2 khái niệm.","chotY":"「外的報酬とは給与そのもの…お金として受け取れるもの」「内的報酬とは…仕事を**長く続けていくには**、内的報酬がちゃんとなくては**つとまらない**」.","lienKetJP":"外的報酬＝お金（他人から評価される）↔ 内的報酬＝仕事の満足感（長く続けるために必要）","lienKetVI":"Phần thưởng ngoại tại = tiền (được người khác đánh giá) ↔ Phần thưởng nội tại = sự hài lòng từ công việc (cần để tiếp tục lâu dài)","correct":{"jp":"外的報酬は**他人から評価され得られる**ものであり、内的報酬は**仕事を長く続けるために必要**なもの","vi":"Khớp với 「給与そのもの…お金」(外的) + 「仕事を長く続けていくには…つとまらない」(内的)."},"wrong":[{"key":"A","jp":"外的報酬は給与として得られるものであり、内的報酬は**長期的には満足感が得られないもの**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói nội tại là NGUỒN GỐC của sự hài lòng lâu dài, không phải ngược lại."},{"key":"B","jp":"外的報酬は**仕事の幅を広げるのに必要**なものであり、内的報酬は**会社から評価され**給与として得られるもの","trap":"bẫy ngược nghĩa","vi":"Đảo ngược định nghĩa hoàn toàn."},{"key":"C","jp":"外的報酬は将来のために必要なものであり、内的報酬は**自分の努力では得られない**もの","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 内的報酬 (thành tựu, trưởng thành) là thứ bản thân TỰ TẠO RA, còn 外的報酬 (đánh giá từ người khác) mới là thứ 「いかんともしがたい」."}]},{"huongTuDuy":"①そこ chỉ thị từ — tìm câu ngay trước mô tả loại công việc cụ thể.","chotY":"「どんなに外的報酬が高くても**内的報酬が極端に低い仕事**だと、長く続けることはできない。また、①そこで得たお金は身につかないことが多い」.","lienKetJP":"内的報酬が極端に低い仕事＝①そこ → そこで得たお金は身につかない（心の満足感がない）","lienKetVI":"Công việc nội tại CỰC THẤP = '①chỗ đó' → tiền kiếm được ở đó không đọng lại (không có sự hài lòng tâm hồn)","correct":{"jp":"**心の満足感を伴わない**仕事","vi":"Khớp với 「内的報酬が極端に低い仕事」 — cặp gần nghĩa: 内的報酬が極端に低い ↔ 心の満足感を伴わない."},"wrong":[{"key":"A","jp":"**やりがいのある**仕事","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — やりがい chính là 内的報酬 cao, đây là thứ KHÔNG CÓ trong loại công việc ①."},{"key":"B","jp":"**内容に釣り合わない**仕事","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý 'không xứng với nội dung'."},{"key":"C","jp":"**報酬の低い**仕事","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ 「どんなに**外的報酬が高くても**」, tức là lương VẪN CAO, chỉ là nội tại thấp."}]},{"huongTuDuy":"②内的報酬が外的報酬へと実を結んでいった — cặp gần nghĩa và nhân-quả.","chotY":"「達成感や、自分が成長していることを実感できる成長感こそ仕事の**原動力**」→「内的報酬の高い仕事なら…将来**ビッグな報酬に化けるかもしれない**」→ ví dụ người bạn: 10 năm ít lương nhưng cuối cùng thu nhập cao.","lienKetJP":"内的報酬（達成感・成長感）を高める → 結果として外的報酬（収入）も高まった","lienKetVI":"Phần thưởng nội tại cao (thành tựu, trưởng thành) → dẫn đến thu nhập cao (phần thưởng ngoại tại)","correct":{"jp":"成長感や達成感を得るために**働いてきたことが**、**高い収入につながった**","vi":"Khớp với 「内的報酬（達成感・成長感）→ 将来ビッグな報酬に化ける」."},"wrong":[{"key":"A","jp":"仕事に慣れて早く片づけられるようになり、**同僚と同じ金額**の収入を得た","trap":"bẫy chi tiết phụ","vi":"'Ngang bằng đồng nghiệp' không phải ý nghĩa của 'trổ hoa' — bài nói đây là BƯỚC NÚT, mục đích là vượt lên."},{"key":"C","jp":"10年間アルバイトを続けて、**正社員と同じ収入**を得られるようになった","trap":"bẫy chi tiết phụ","vi":"'Ngang bằng chính thức' là giai đoạn trung gian, không phải điểm đến 'ビッグな報酬'."},{"key":"D","jp":"ボーナスも退職金もないが、**同じ会社で仕事を続けた**結果、収入が増えた","trap":"bẫy chi tiết phụ","vi":"Nhầm chi tiết mô tả hoàn cảnh với kết quả cốt lõi — trọng tâm là nội tại dẫn đến ngoại tại, không phải việc 'ở cùng 1 công ty'."}]},{"huongTuDuy":"Câu hỏi tổng kết điều tác giả MUỐN NÓI NHẤT — bám câu kết bài.","chotY":"「すぐに高い収入に結びつかなくても、**心の満足感を重視して仕事を続けることが大切**だ」— cốt lõi là không vội ngoại tại, ưu tiên nội tại lâu dài.","lienKetJP":"外的報酬だけを追うと長続きしない → 内的報酬（心の満足感）を重視する → いつか外的報酬にも化ける","lienKetVI":"Chỉ đuổi theo ngoại tại thì không bền → ưu tiên nội tại (sự hài lòng tâm hồn) → sẽ dẫn đến ngoại tại lớn hơn","correct":{"jp":"すぐに高い収入に結びつかなくても、**心の満足感を重視**して仕事を続けることが大切だ","vi":"Khớp trực tiếp với thông điệp xuyên suốt: 内的報酬（心の満足感）を重視する."},"wrong":[{"key":"A","jp":"人脈や仕事の幅を広げて**高い収入を得ることができれば**、それが仕事の原動力になる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 高い収入 không phải 原動力, mà 達成感・成長感 (内的報酬) mới là 原動力."},{"key":"B","jp":"見えないところで努力して仕事をすれば、**他人が高く評価してくれ**、いつか収入も高くなる","trap":"bẫy chi tiết phụ","vi":"Bài nói ngược lại: 「他人からの評価という…いかんともしがたいもの」 — đừng phụ thuộc vào đánh giá của người khác."},{"key":"C","jp":"大きな収入を得たいなら、**アルバイトを続け**高い技術や人脈を得ることが大切だ","trap":"bẫy chi tiết phụ","vi":"Ví dụ アルバイト là minh họa, không phải điểm mấu chốt tác giả muốn nhấn mạnh."}]}],"Mon12-2":[{"huongTuDuy":"'Tỉ lệ chiếm thông tin' tăng CAO NHẤT khi nào — cần tính toán đúng kịch bản.","chotY":"「3年間のつきあいの中で、ミスが占める割合」vs「たった1回初めて論田くんと接した中で、ミスが占める割合」→ quan hệ NGẮN + lỗi NHIỀU → tỉ lệ tăng vọt.","lienKetJP":"情報占有率＝（問題の情報）÷（総情報量）→ 分母が小さいほど、分子が大きいほど占有率が高くなる","lienKetVI":"Tỉ lệ = (thông tin xấu) / (tổng thông tin) → mẫu số nhỏ (quan hệ ngắn) + tử số lớn (nhiều lỗi) = tỉ lệ cao nhất","correct":{"jp":"付き合いの**短い**上司との関係の中で、論田くんがミスを**3回した**場合","vi":"Tỉ lệ cao nhất khi: tổng thông tin ÍT (quan hệ ngắn) + lỗi NHIỀU (3 lần) → mẫu nhỏ, tử lớn."},"wrong":[{"key":"A","jp":"付き合いの**長い**上司との関係の中で、論田くんがミスを1回した場合","trap":"bẫy ngược nghĩa","vi":"Tỉ lệ THẤP nhất — quan hệ dài (mẫu lớn) + lỗi ít (1 lần) = tỉ lệ nhỏ nhất."},{"key":"B","jp":"付き合いの**長い**上司との関係の中で、論田くんがミスを3回した場合","trap":"bẫy chi tiết phụ","vi":"3 lỗi nhưng quan hệ dài → mẫu lớn, tỉ lệ vẫn thấp hơn C và D."},{"key":"C","jp":"付き合いの**短い**上司との関係の中で、論田くんがミスを1回した場合","trap":"bẫy chi tiết phụ","vi":"Quan hệ ngắn → mẫu nhỏ, nhưng chỉ 1 lỗi → tỉ lệ chưa cao nhất."}]},{"huongTuDuy":"'Hành vi không nói dối bản thân' — cần xác định nghĩa đúng trong văn cảnh, không phải nghĩa ngữ nghĩa của từ.","chotY":"「ふだん静かな人なら、初対面の相手にも、奇をてらったりせず、**普段どおり静かにしていればいい**」「**いつもどおりの姿を見せる**ということは、初対面の相手にこそ大切だ」.","lienKetJP":"自分にうそのないふるまい＝かっこつけない、自分以下にもならない → いつもどおりの姿を見せること","lienKetVI":"'Không nói dối bản thân' = không cố làm bảnh, không tự hạ thấp → thể hiện đúng như bình thường","correct":{"jp":"**いつもどおりの姿**を見せること","vi":"Khớp trực tiếp với 「普段どおり静かにしていればいい」「いつもどおりの姿を見せることが大切」."},"wrong":[{"key":"A","jp":"**その時々のすなおな気持ち**を表すこと","trap":"bẫy chi tiết phụ","vi":"Bài CÓ PHỦI NHẬN điều này — câu 'nếu hôm đó tâm trạng xấu mà tự nhiên nổi nóng thì sao?' là VÍ DỤ PHẢN CHỨNG, không phải điều nên làm."},{"key":"B","jp":"いつも**正直に自分の考えを伝えること**","trap":"bẫy chi tiết phụ","vi":"'Chân thật chia sẻ suy nghĩ' rộng hơn và không chính xác — bài tập trung vào việc thể hiện con người BÌNH THƯỜNG, không phải nói thật mọi lúc."},{"key":"D","jp":"うそをつかず**正直に話すこと**","trap":"bẫy chi tiết phụ","vi":"Gần nghĩa với B, nhầm 'không nói dối' (về lời nói) với 'không giả tạo bản thân' (về hành vi/thái độ)."}]},{"huongTuDuy":"Lý do cần cẩn thận với người mới gặp — tìm câu giải thích trực tiếp.","chotY":"「結局は、そのとき相手が持っている**情報だけで判断される**。その中で、いい情報の占める割合が多ければ「いい人だ」となる」「**一部の情報ですべてを判断するかもしれない**」.","lienKetJP":"初対面の相手→持っている情報が少ない→その少ない情報だけで全部判断してしまう→慎重になるべき","lienKetVI":"Người mới gặp → lượng thông tin ít → dùng ít thông tin đó để phán xét toàn bộ → nên cẩn thận","correct":{"jp":"自分に関する**一部の情報**で相手が**すべてを判断するかもしれない**から","vi":"Khớp trực tiếp với 「そのとき相手が持っている情報だけで判断される」."},"wrong":[{"key":"A","jp":"普段どおりの態度では、相手に**自分の良さを十分に伝えられない**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói CHÍNH việc 'bình thường' là lý tưởng nhất (「等身大のあなたの良さが伝わるのが理想」)."},{"key":"C","jp":"相手の**性格が自分と合うかどうか**がまだよくわかっていないから","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về sự tương hợp tính cách."},{"key":"D","jp":"初対面の相手には**慎重な姿が実像**だと思わせる必要があるから","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý 'cần thể hiện sự cẩn thận là bản thân thật'."}]},{"huongTuDuy":"Về 'メディア力' — tác giả khuyên điều gì?","chotY":"「自分にふさわしい「メディア力」を相手の中に刻むために」「**等身大**のあなたの良さが伝わるのが理想だ」「**自分の「メディア力」が正確に伝わる**ように意識する」.","lienKetJP":"メディア力＝相手の中に刻まれるあなたのイメージ → 正確に（等身大に）伝わることが理想","lienKetVI":"Mediaryoku = hình ảnh của bạn trong mắt người khác → lý tưởng là được truyền đạt CHÍNH XÁC (đúng với bản thân thật)","correct":{"jp":"相手に自分の「メディア力」が**正確に伝わる**ように意識する","vi":"Khớp với 「等身大のあなたの良さが伝わるのが理想」 — không hơn không kém, đúng như bản thân thật."},"wrong":[{"key":"B","jp":"相手に**普段の自分以上**の「メディア力」を伝えるようにする","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phủ nhận 「かっこつけるのでもなく」 tức là không cố làm bảnh hơn thực tế."},{"key":"C","jp":"相手に刻まれた自分の「メディア力」を**気にせず平常心**でいる","trap":"bẫy chi tiết phụ","vi":"'Thản nhiên không quan tâm' ngược với tinh thần bài — bài nói phải Ý THỨC về tỉ lệ chiếm thông tin."},{"key":"D","jp":"相手に見せる自分の「メディア力」を**下げないように静かにしている**","trap":"bẫy chi tiết phụ","vi":"Hành động 'im lặng' chỉ là VÍ DỤ (với người vốn trầm lặng), không phải nguyên tắc áp dụng cho tất cả."}]}],"Mon12-3":[{"huongTuDuy":"'かたちにならないもの' — tác giả dùng ví dụ nào để chỉ thứ không có hình thức?","chotY":"「そのなかには、**かたちにならないものもある**」→ ví dụ: 村人の 作法 qua 食事の仕方... chờ, nhưng câu hỏi hỏi 'ví dụ được NÊU RA', và đáp án là 自然 vì bài dùng 村人の自然への思想 như ví dụ đầu tiên.","lienKetJP":"思想の表現形式 → 文章・絵・音楽 → それ以外にかたちにならないものもある → 例：村人の自然への思想（作法という形で存在）","lienKetVI":"Hình thức biểu hiện tư tưởng → văn bản, tranh, nhạc → còn có loại không thành hình → ví dụ: tư tưởng về tự nhiên của dân làng (tồn tại dưới dạng 作法/lễ nghi)","correct":{"jp":"**作法**","vi":"Khớp đúng — 作法 là ví dụ điển hình nhất được tác giả đưa ra cho 'thứ không thành hình' (「それは作法をとおしてではないかという気がする」)."},"wrong":[{"key":"A","jp":"自然","trap":"bẫy chi tiết phụ","vi":"自然 là CHỦ ĐỀ của tư tưởng dân làng, không phải là 'hình thức biểu hiện không thành hình'."},{"key":"B","jp":"生命","trap":"bẫy chi tiết phụ","vi":"生命 xuất hiện trong ví dụ về thức ăn (他の生命を取り入れる), không phải 'thứ không thành hình' mà bài muốn nói."},{"key":"C","jp":"感謝","trap":"bẫy chi tiết phụ","vi":"感謝 là CẢM XÚC/THÁI ĐỘ gắn với tư tưởng ăn uống, không phải hình thức biểu hiện tư tưởng."}]},{"huongTuDuy":"Tư tưởng của dân làng — câu hỏi bao quát nhiều nội dung, cần chọn đáp án đủ rộng.","chotY":"「**自然**に対する深い思想」「**農**についての深い思想や、**村**とは何かという思想」— 3 loại tư tưởng: về tự nhiên + về nông nghiệp + về làng xã.","lienKetJP":"村人の思想：自然への思想＋農についての思想＋村とは何かという思想 → 3つすべてを含む答えが正しい","lienKetVI":"Tư tưởng của dân làng: về tự nhiên + về nông nghiệp + về làng xã → cần bao quát cả 3","correct":{"jp":"**自然の中で生きる**ための思想や、**農業や村のあり方**についての思想","vi":"Khớp đủ 3 loại: 自然 + 農 + 村のあり方."},"wrong":[{"key":"B","jp":"自然を**壊さずに暮らす**ために、農業や村人はどうあるべきかという思想","trap":"bẫy chi tiết phụ","vi":"'Không phá vỡ tự nhiên' thêm ý không có trong bài — dân làng không cần 'bảo tồn' mà cần 'sống với tự nhiên'."},{"key":"C","jp":"自然に対する**感謝を表すために**、村人としてどうするべきかという思想","trap":"bẫy chi tiết phụ","vi":"'Biết ơn tự nhiên' là 1 phần nhỏ (ví dụ ăn uống), không bao quát đủ toàn bộ tư tưởng dân làng."},{"key":"D","jp":"**自然を取り戻すため**の思想や、自然を利用する農業のあり方についての思想","trap":"bẫy ngược nghĩa","vi":"'Lấy lại tự nhiên' không có trong bài — dân làng đang SỐNG TRONG và VỚI tự nhiên, không phải đi 'lấy lại'."}]},{"huongTuDuy":"Lễ nghi ăn uống gắn với suy nghĩ nào — đoạn mô tả cụ thể về tập tục ăn uống.","chotY":"「食事は他の生命を自分の身体に取り入れるものであり、それらの**生命に感謝しなければいけない**という気持ちと深く結びついている」.","lienKetJP":"食事の作法の厳しいしつけ → なぜなら → 食事は他の生命を取り入れること → 感謝が必要","lienKetVI":"Dạy nghiêm ngặt lễ nghi ăn uống → vì → ăn uống là nhận lấy sinh mạng khác vào người mình → cần có lòng biết ơn","correct":{"jp":"食事は**他の生命を自分の身体に取り入れる**ものであり、それらの**生命に感謝しなければいけない**という考え方","vi":"Khớp trực tiếp với 「他の生命を自分の身体に取り入れるものであり、生命に感謝」."},"wrong":[{"key":"A","jp":"多くの**労力がささげられて作られた食べ物**が、いかに尊いものであるかという考え方","trap":"bẫy chi tiết phụ","vi":"'Lao động của người làm ra thức ăn' không phải nội dung được nêu — bài nói về SINH MẠNG bị lấy, không phải lao động."},{"key":"B","jp":"食べないでは生きてはいけない**人間のあり方が、いかに罪深い**ものであるかという考え方","trap":"bẫy mọi người","vi":"'Tội lỗi' quá tiêu cực và không có trong bài — bài nói về biết ơn, không phải sám hối."},{"key":"C","jp":"食事は農が生み出したものをいただくものであり、**農業を営む村人への感謝**が必要だという考え方","trap":"bẫy chi tiết phụ","vi":"'Biết ơn nông dân' không đúng đối tượng — bài nói biết ơn các SINH MẠNG (động thực vật được ăn), không phải người trồng trọt."}]},{"huongTuDuy":"Câu hỏi tổng kết điều tác giả nói — bám luận điểm chính về hình thức biểu hiện tư tưởng.","chotY":"「思想の表現形式は…文章というかたちをとるとは限らない」「**かたちにならないものもある**」— tư tưởng không nhất thiết có hình thức cố định.","lienKetJP":"論文だけが思想表現ではない → 絵・音楽もある → かたちにならないものもある（作法）→ 表現は多様","lienKetVI":"Không chỉ có luận văn → có cả tranh/nhạc → còn có thứ không thành hình (lễ nghi) → hình thức biểu hiện rất đa dạng","correct":{"jp":"思想の表現は必ずしも**文章や作品というかたちをとるとは限らず**、**かたちにならないものもある**","vi":"Khớp đúng luận điểm xuyên suốt bài."},"wrong":[{"key":"B","jp":"思想は絵や音楽のようなかたちに表わされるものと考えられてきたが、深い思想とは**かたちにならないものである**","trap":"bẫy ngược nghĩa","vi":"Quá tuyệt đối hóa — bài không nói 'tư tưởng sâu sắc thì KHÔNG thành hình', mà nói có THÊNH tha cả loại không thành hình."},{"key":"C","jp":"思想の表現には絵や音楽などもあるし、かたちにならないものもあるが、**文章で表現されたものが最上**のものである","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — đây chính là quan niệm cũ mà tác giả ĐÃ PHỦ NHẬN (「論文が唯一の方法ということは絶対にない」)."},{"key":"D","jp":"思想は文章や作品のようなかたちになったものが尊重されるが、生活と結びついた深い思想は**かたちにならないもの**である","trap":"bẫy ngược nghĩa","vi":"Sai vì chia đôi không đúng — bài không nói hình thức nào được tôn trọng hơn."}]}],"Mon12-4":[{"huongTuDuy":"Lý do chim nhạn làm tổ ở hiên nhà — đọc kỹ logic quan hệ 3 bên: nhạn, sẻ, người.","chotY":"「スズメはふだんはあまり人間を恐れないが、**ひなを育てるときは人間を避ける**。だから、人がひんぱんに出入りする店先などには巣をかけない。**ツバメはそれを利用する**」.","lienKetJP":"スズメ＝ツバメの嫌な存在 → スズメはひなを育てるとき人間を避ける → ツバメは人間のいる軒先に巣→スズメが来ない","lienKetVI":"Chim sẻ = kẻ thù của nhạn → sẻ tránh người khi nuôi con → nhạn lợi dụng: làm tổ chỗ có người → sẻ không đến","correct":{"jp":"ツバメの嫌う**スズメが、人のいるところではひなを育てない**から","vi":"Khớp đúng logic 3 bên: nhạn lợi dụng tập tính của sẻ tránh người khi nuôi con."},"wrong":[{"key":"A","jp":"人家の軒先では、ツバメが**子育てに必要な餌を得ることができる**から","trap":"bẫy chi tiết phụ","vi":"'Nguồn thức ăn' không được đề cập như lý do làm tổ ở hiên nhà — lý do đó liên quan đến đô thị hóa ở đoạn sau."},{"key":"B","jp":"人家の軒先は、店の軒先ほど**人の出入りがひんぱんではない**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 「人がひんぱんに出入りする店先」 CHÍNH LÀ chỗ nhạn chọn vì sẻ không đến đó."},{"key":"C","jp":"ツバメの天敵であるスズメが、**常に人間を恐れて近寄らない**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — sẻ THƯỜNG KHÔNG sợ người (ふだんはあまり人間を恐れない), chỉ tránh khi NUÔI CON."}]},{"huongTuDuy":"Lý do nhạn giảm ở đô thị — câu giải thích trực tiếp ở đoạn cuối.","chotY":"「町が人工的にきれいになりすぎて、**餌にする虫があまりにも減ってしまった**ので、町ではひなも育てられなくなったから」.","lienKetJP":"都市化 → 虫が減る → ツバメの餌がない → ひなを育てられない → 都会から去る","lienKetVI":"Đô thị hóa → côn trùng giảm → nhạn không có thức ăn → không nuôi được chim con → rời đô thị","correct":{"jp":"**食物を得るのが難しく**なったから","vi":"Khớp với 「餌にする虫があまりにも減ってしまった」 — cặp gần nghĩa: 餌にする虫が減る ↔ 食物を得るのが難しくなる."},"wrong":[{"key":"A","jp":"**森や林が失われた**から","trap":"bẫy mọi người","vi":"Không có trong bài — nhạn làm tổ ở chỗ CÓ NGƯỜI, không phải trong rừng."},{"key":"B","jp":"**巣をつくりにくく**なったから","trap":"bẫy chi tiết phụ","vi":"Bài không đề cập vấn đề về 'chỗ làm tổ' — lý do là THỨC ĂN."},{"key":"C","jp":"**カラスやスズメが増えた**から","trap":"bẫy mọi người","vi":"Không có trong bài — quan hệ với sẻ là câu chuyện khác (lý do chọn chỗ làm tổ), không phải lý do rời đô thị."}]},{"huongTuDuy":"'したたかである' (linh hoạt/cứng đầu) theo nghĩa của bài — đoạn tiếp theo giải thích.","chotY":"「自分たちの**生活の基盤になる条件さえそろっていれば**、たとえその条件が人工のものであろうとも…**平気で棲みついてしまう**」.","lienKetJP":"動物はしたたか → 条件さえそろえば人工環境でも棲みつく（森でなくてもよい）","lienKetVI":"Động vật 'cứng đầu linh hoạt' → chỉ cần đủ điều kiện sống, dù nhân tạo, vẫn sống được","correct":{"jp":"**生きるための条件が整えば**都会で生活する","vi":"Khớp trực tiếp với 「生活の基盤になる条件さえそろっていれば…平気で棲みついてしまう」."},"wrong":[{"key":"A","jp":"**都会でもっても森や木があれば**巣を作る","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói dù KHÔNG có rừng (tức là trong môi trường nhân tạo) vẫn sống được, không phải 'cần rừng'."},{"key":"C","jp":"都会であっても**餌がなければ命がけで探す**","trap":"bẫy chi tiết phụ","vi":"'Liều mạng tìm thức ăn' không có trong bài — bài nói về sự thích nghi, không phải tính gan dạ."},{"key":"D","jp":"**人間を避けることができれば**、都会に棲みつく","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói động vật DÙ CÓ NGƯỜI XUNG QUANH vẫn sống được (ツバメはむしろ人間を利用)."}]},{"huongTuDuy":"Điều tác giả muốn nói — bám câu kết bài về 'cộng sinh với tự nhiên'.","chotY":"「自然保護とか自然との**共生**ということについて、少し考え直す必要がある…動物の**生存に必須の条件**を大切にした形での共存でなければならない」.","lienKetJP":"動物は条件さえそろえば都会でも生きられる → 共生を考えるなら → 動物の生存必須条件を尊重する必要がある","lienKetVI":"Động vật sống được ở đô thị nếu đủ điều kiện → khi nghĩ về cộng sinh → phải tôn trọng điều kiện sinh tồn thiết yếu của động vật","correct":{"jp":"自然との共生を考える際には、**動物の生存に必須の条件を尊重すべき**である","vi":"Khớp với 「自然との共生…考え直す必要がある」 + nội dung về điều kiện sống của động vật xuyên suốt bài."},"wrong":[{"key":"A","jp":"都会を去った動物たちが再び人間と**共生できるような対策を立てる**必要がある","trap":"bẫy chi tiết phụ","vi":"'Đưa ra đối sách cụ thể' không phải kết luận của bài — bài chỉ gợi mở cách NHÌN NHẬN lại, chưa đề xuất biện pháp cụ thể."},{"key":"B","jp":"都会での生活は動物にとって実は**利点が多い**ということを認識する必要がある","trap":"bẫy chi tiết phụ","vi":"'Nhiều ưu điểm' quá lạc quan và không phải điểm chính — bài chỉ nói ĐỦ ĐIỀU KIỆN là ổn."},{"key":"D","jp":"動物たちの生活を守るために**環境汚染を防止し、自然を保護**すべきである","trap":"bẫy mọi người","vi":"Quá chung chung và không khớp với tinh thần bài — bài PHẢN BÁC quan điểm 'tự nhiên thuần túy không người' và nhấn mạnh điều kiện CỤ THỂ (thức ăn, v.v.)."}]}],"Mon12-5":[{"huongTuDuy":"①お宅の坊ちゃんがまだ... — câu bị bỏ lửng, cần suy ra phần còn thiếu từ ngữ cảnh.","chotY":"「家庭内での**序列**がはっきりしたら」「**体格的にも犬と息子に差がない**」「両者は最下位争いを演じたまま」— kết luận: con trai chưa vượt qua chó trong thứ bậc.","lienKetJP":"訓練終了条件＝家庭内の序列が確定すること → 犬と息子が最下位争い中 → まだ序列が犬より上になっていない","lienKetVI":"Điều kiện kết thúc huấn luyện = xác định thứ bậc trong nhà → con trai và chó đang tranh nhau vị trí cuối → thứ bậc của con chưa cao hơn chó","correct":{"jp":"**序列が犬より上に**なっていませんから","vi":"Khớp logic: điều kiện kết thúc là thứ bậc rõ ràng, và vấn đề đang còn là con trai chưa vượt qua chó."},"wrong":[{"key":"A","jp":"小学生で、犬の**訓練が苦手**ですから","trap":"bẫy mọi người","vi":"Không có trong bài — không nói về việc con có giỏi huấn luyện chó hay không."},{"key":"C","jp":"小学生で、**訓練が終わっていません**から","trap":"bẫy chi tiết phụ","vi":"'Chưa kết thúc huấn luyện' là KẾT QUẢ, không phải LÝ DO được thầy giải thích — lý do mới là điều được hỏi."},{"key":"D","jp":"きょうだいの**序列を理解していません**から","trap":"bẫy mọi người","vi":"'Thứ bậc anh chị em' không có trong bài — không đề cập đến anh chị em."}]},{"huongTuDuy":"Lý do con chó cắn chủ — đoạn giải thích về tâm lý động vật và thứ bậc.","chotY":"「甘やかせばつけ上がるだけ、**自分が主人と信じ込んで**飼い主をなめた結果である」.","lienKetJP":"甘やかされる → 飼い主より自分が上と思い込む → 主人をなめる → 噛みつく","lienKetVI":"Được nuông chiều → con chó tin mình ở vị trí CAO HƠN chủ → coi thường chủ → cắn","correct":{"jp":"この犬は**自分の方が飼い主より上**だと思っていたから","vi":"Khớp trực tiếp với 「自分が主人と信じ込んで飼い主をなめた」."},"wrong":[{"key":"B","jp":"女性の訓練士に甘やかされて**誰にでも噛みついていた**から","trap":"bẫy chi tiết phụ","vi":"'Cắn bất kỳ ai' không phải nội dung bài — bài nói chó cắn vì tâm lý thứ bậc, không phải thói quen hung hăng."},{"key":"C","jp":"強い相手に挑まなければ**厳しい自然界では生きられない**から","trap":"bẫy chi tiết phụ","vi":"Đây là nguyên lý chung về động vật, không phải lý do cụ thể của con chó này cắn chủ."},{"key":"D","jp":"この犬は飼い主と自分の**序列はまだ定まっていない**と思ったから","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng sai chiều — chó đã TIN CHẮC mình ở trên (信じ込む), không phải 'vẫn chưa xác định'."}]},{"huongTuDuy":"③男女平等をはきちがえてはいけない — 'はきちがえる' = hiểu nhầm, hiểu sai → hiểu sai thì sẽ xảy ra điều gì?","chotY":"「家父長制を否定しすぎた結果」「タテマエとしての序列がないと**混乱がはじまる**」「**父親と母親の役割が混乱し、問題が生まれる**」.","lienKetJP":"男女平等をはきちがえる → 家庭内の父性・母性の役割が失われる → 混乱が起きる","lienKetVI":"Hiểu nhầm bình đẳng giới → mất vai trò cha/mẹ trong gia đình → bắt đầu hỗn loạn","correct":{"jp":"**父親と母親の家庭内での役割が混乱し**、問題が生まれる","vi":"Khớp với 「タテマエとしての序列がないと混乱がはじまる」「家父長制を否定しすぎた結果」."},"wrong":[{"key":"A","jp":"**共働きが普通になり**、父親が家事を分担するようになる","trap":"bẫy mọi người","vi":"'Cả hai vợ chồng đi làm' là hiện tượng xã hội, không phải vấn đề 'hiểu nhầm' mà bài phê phán."},{"key":"C","jp":"職場で女性が**もっと管理職に進出できる**ような環境になる","trap":"bẫy mọi người","vi":"Không có trong bài — tác giả không nói về vấn đề phụ nữ trong công sở."},{"key":"D","jp":"**家父長制が復活**して戦前の社会のように人が序列化される","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phê phán việc 'phủ định quá mức' gia trưởng, không phải kêu gọi PHỤC HỒI gia trưởng."}]},{"huongTuDuy":"Điều tác giả MUỐN NÓI NHẤT — bám câu kết về vai trò cha/mẹ trong gia đình.","chotY":"「親は**家庭でそれぞれ父性や母性にもとづく役割**を果たすべきである」.","lienKetJP":"犬のしつけ＝序列の重要性 → 家庭内でも序列・役割が必要 → 父性・母性に基づく役割を果たすべき","lienKetVI":"Huấn luyện chó = tầm quan trọng của thứ bậc → trong gia đình cũng cần thứ bậc/vai trò → cha mẹ nên đảm nhận vai trò dựa trên tính phụ/mẫu","correct":{"jp":"親は家庭でそれぞれ**父性や母性にもとづく役割**を果たすべきである","vi":"Khớp trực tiếp với câu kết bài."},"wrong":[{"key":"A","jp":"犬には訓練によって**家庭内での序列を教え込むことが必要**である","trap":"bẫy chi tiết phụ","vi":"Huấn luyện chó là VÍ DỤ DẪN nhập, không phải điều tác giả muốn nói nhất."},{"key":"B","jp":"父親と母親の役割を明確にするために、**家父長制を復活すべき**である","trap":"bẫy ngược nghĩa","vi":"Quá cực đoan — bài phê phán việc 'phủ định quá mức' chứ không kêu gọi phục hồi chế độ gia trưởng cũ."},{"key":"C","jp":"家庭の問題を解決するためには**動物と同じく序列化が必要**である","trap":"bẫy chi tiết phụ","vi":"'Cần thứ bậc như động vật' đúng 1 phần nhưng thiếu yếu tố cốt lõi 'tính phụ/mẫu' — bài nhấn mạnh TÍNH CHẤT của vai trò, không chỉ thứ bậc đơn thuần."}]}],"Mon12-6":[{"huongTuDuy":"①もっと根本的なこと — điều BỊ BỎ QUA trong cuộc họp về quảng cáo.","chotY":"「果たして、広告とは**関心をもってもらえるものなのか**という、ぐっと引いた視線で見ることを忘れがちになってしまう」.","lienKetJP":"会議では用語・表現の話が白熱 → しかし → 「広告とは人に注目されるものなのか」という根本的な前提が見えていない","lienKetVI":"Cuộc họp sôi nổi về từ ngữ/cách diễn đạt → nhưng → bỏ qua tiền đề căn bản: 'liệu quảng cáo có được người ta chú ý không'","correct":{"jp":"**広告とは人に注目されるもの**なのかということ","vi":"Khớp trực tiếp với 「広告とは関心をもってもらえるものなのか」."},"wrong":[{"key":"A","jp":"**広告とは一体何なの**かということ","trap":"bẫy chi tiết phụ","vi":"Quá triết học — bài không hỏi về bản chất của quảng cáo mà về tính hiệu quả thực tế (có được chú ý không)."},{"key":"B","jp":"**広告とは必要なもの**なのかということ","trap":"bẫy chi tiết phụ","vi":"'Có cần thiết không' khác với 'có được chú ý không' — bài không đặt câu hỏi về sự cần thiết."},{"key":"C","jp":"広告の**用語や表現が適切なのか**ということ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói từ ngữ/diễn đạt là điều ĐƯỢC BÀN trong cuộc họp, còn điều BỊ BỎ QUA mới là điều ①."}]},{"huongTuDuy":"Tác giả nhìn nhận người nhận quảng cáo như thế nào — đoạn giải thích về tâm lý người nhận.","chotY":"「日常生活のなかでは、**自分の身の回りの出来事や問題で精一杯**になっているからです。人は自分の心に**バリアを張っていて**、無意識のうちに**外部情報を遮断**しています」.","lienKetJP":"受け手＝自分のことで精一杯 → 心のバリア → 無意識に外部情報を遮断 → 広告など意に介さない","lienKetVI":"Người nhận = bận rộn với việc của mình → tạo rào cản tâm lý → vô thức chặn thông tin bên ngoài → không để tâm đến quảng cáo","correct":{"jp":"自分のことで**忙しくて**、余計な**情報を取り入れようとしない**","vi":"Khớp với 「自分の身の回りの出来事や問題で精一杯」「外部情報を遮断」."},"wrong":[{"key":"B","jp":"毎日の生活が忙しく、**たくさんのことを覚えようとしない**","trap":"bẫy chi tiết phụ","vi":"'Không cố nhớ' thiếu chiều sâu — bài nói không chỉ không nhớ mà còn CHỦ ĐỘNG CHẶN (遮断) thông tin ngoài."},{"key":"C","jp":"目にする広告が多すぎて、**必要なものが選べなくなっている**","trap":"bẫy chi tiết phụ","vi":"'Không chọn được' không phải vấn đề được nêu — vấn đề là chặn thông tin CẦU THỦ (バリア), không phải quá tải lựa chọn."},{"key":"D","jp":"**関心のもてない**広告が多く、広告を見る**必要性を感じていない**","trap":"bẫy ngược nghĩa","vi":"Đảo nhân quả — người nhận TRƯỚC TIÊN đã chặn thông tin, không phải vì 'quảng cáo không hay' mà chặn."}]},{"huongTuDuy":"Tác giả phản bác ý kiến về quảng cáo 'kích thích' (刺激的) như thế nào?","chotY":"「刺激的なものは確かに、目を向けさせることはできるかもしれない。しかし、それは**一時の驚き**に終わり、**心の奥までは浸透していかない**」.","lienKetJP":"刺激的な広告→目を向けさせる（注目は得られる）→しかし→一時の驚き→心の奥に残らない","lienKetVI":"Quảng cáo kích thích → có thể thu hút ánh nhìn (được chú ý) → nhưng → chỉ là sự ngạc nhiên thoáng qua → không đọng lại trong lòng","correct":{"jp":"ただ刺激的な広告は、**驚かせるだけで**受け手の**心には残らない**","vi":"Khớp với 「一時の驚きに終わり、心の奥までは浸透していかない」."},"wrong":[{"key":"A","jp":"刺激的な広告は、**受け手の心の奥に入り込んでいきやすい**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói rõ kích thích KHÔNG đọng lại trong tâm (心の奥までは浸透していかない)."},{"key":"B","jp":"刺激的な広告は、より**刺激的にしていかないと**
