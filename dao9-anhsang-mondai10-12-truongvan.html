かで、ぱっと思い出せるものはありますか。そう言われてみると、ほとんどといっていい\nくらい、記憶に残っていないのではないでしょうか。 (中略)\n「広告なんて誰も見ていない」\nこれは、僕が会社に入って間もない頃に実感したことです。会議で難しい用語が飛び交い、\n商品のアピールポイントや表現の話は白熱しているのですが、①もっと根本的なことにはなかなか\n触れられずにいる。目の前の仕事に深く入り込んでしまうと、「果たして、広告とは関心をもってもら\nえるものなのか」という、ぐっと引いた視線で見ることを忘れがちになってしまうのです。こうした大前\n提が見えないままに作られている広告が、非常に多いのではないでしょうか。\n広告を発信する側としては、伝えたいことはたくさんあって、一般の人たちは当然注目してく\nれるものと思い込みがちです。ところが、受け手側というのは、発信者側のそんな思いなど、ほとん\nど意に介し (注1) ていません。なぜなら、日常生活のなかでは、自分の身の回りの出来事や問題\nで精一杯になっているからです。人は自分の心にバリア (注2) を張っていて、無意識のうちに外部\n情報を遮断しています。ですから、伝えたい情報を相当きちんと整理したうえで、筋道を立てて戦\n略的に伝えることを考えないと、受け手の心のバリアを破って入り込むことなどできないのです。\n「振り向かせるためには、刺激的なものにすればいいんじゃないの?」\n②こういう意見もあるでしょう。でも、単に刺激的なだけでは、一瞬目を引くだけで終わってし\nまう。心の奥までは浸透していかないのです。たとえるなら、子どもが隠れていた物陰から出てき\nて、「わっ!」と驚かせるようなもの。驚かされた方は、怒ったり相手にしなかったりするかもしれませ\nん。相手の理解を得たり興味を引いたりしないと、本当に心を捉えたことにはならないのです。だか\nら、まず何が言いたいのかという主旨をはっきりさせ、そのうえでどんなトーンで伝えるのかという工\n夫をすることが大切です。\n(佐藤可土和『加藤可士和の超整理術』による)\n(注1) 意に介する : 気にする\n(注2) バリア : ここでは、壁","questions":[{"q":"①もっと根本的なことがあるが、どのようなことか。","options":["広告とは一体何なのかということ","広告とは必要なものなのかということ","広告の用語や表現が適切なのかということ","広告とは人に注目されるものなのかということ"],"answer":3,"explain":"①Vấn đề căn bản nhất bị bỏ qua: liệu quảng cáo có được người ta CHÚ Ý đến không (関心をもってもらえるものなのか). ✅D."},{"q":"筆者は、広告の受け手をどのようにとらえているか。","options":["自分のことで忙しくて、余計な情報を取り入れようとしない。","毎日の生活が忙しく、たくさんのことを覚えようとしない。","目にする広告が多すぎて、必要なものが選べなくなっている。","関心のもてない広告が多く、広告を見る必要性を感じていない。"],"answer":0,"explain":"Người nhận quảng cáo: quá bận với việc riêng → vô thức CHẶN thông tin bên ngoài (心にバリアを張り、無意識に外部情報を遮断). ✅A."},{"q":"筆者はの②こういう意見に対してどのように考えているか。","options":["刺激的な広告は、受け手の心の奥に入り込んでいきやすい。","刺激的な広告は、より刺激的にしていかないと受け手に伝わらない。","単に刺激的なだけの広告も、受け手を振り向かせるためには必要だ。","ただ刺激的な広告は、驚かせるだけで受け手の心には残らない。"],"answer":3,"explain":"②Quảng cáo gây sốc: chỉ làm giật mình thoáng qua, KHÔNG đọng lại trong tâm trí (心の奥までは浸透していかない). ✅D."},{"q":"広告の発信者に対して、筆者が言いたいことは何か。","options":["受け手の視点に立って商品をアピールすることが重要だ。","受け手の心をつかむような情報を発信し続けることが重要だ。","受け手に商品の魅力をいかにストレートに伝えるかが重要だ。","受け手に伝えたい情報をいかに整理して発信するかが重要だ。"],"answer":3,"explain":"Ý chính: quan trọng là SẮP XẾP + truyền tải thông tin có CHIẾN LƯỢC, có chủ đích rõ ràng. ✅D."}]},{"source":"Mon12","bai":7,"date":"07/2013","title":"Mon12 - Bài 7 (07/2013)","passage":"私もかつて一個の子供であったが、親との「対話」など別にのぞまなかったように思う。もし親\nの方が「対話」をしかけてきたら、照れくさいような、歯の浮くような (注1) 気持だばしただろう。少なく\nとも、中学生のあたりからは、そうであった。私は特別反抗的な子供ではなかったが、親と「対話」な\nどしたって、本当の話はできない、とごく自然に承知していたように思う。\nといって、親とのつながりを、まったくのぞんでいなかったわけではない。しかし、それは [対\n話] などという正面きったもの (注2) ではなく、言葉としてはほとんど意味をなさないような交流があれ\nば、充分だった。つまり、家の中で顔を合わせて、黙って顔をそむけられては、どこかで寂しいような\n見捨てられたような気持だばしたが、「お」「やってるか」ぐらいのやりとりがあれば、①気持は安定し\nていたのである。\nそれ以上親が気をつかって「このごろ音楽はどんなもんがはやっているんだ?」などと聞いてきたら、\n無理してるなあ、と思うし、そんな必要ないのになあ、と思うし、答えるのがすごく億劫だったろう、と\n思う。\n親とは通じない部分を、どんどん持つことによって、子供は自分の世界をつくっていくのであ\nる。不分明な(注3)ところが多いからといって親が不安におちいることはない、と思う。\n「なにを考えているか、なにをしているか分らない」部分が増えていくことで、子供は成長しているの\nだ。そこへ、いちいち親が音をつっこみ「一緒に悩み、一緒に考えよう」などとすることは、子供にとっ\nては、ひどくわずらわしいことだし、親が加わることで当面の局面はいい方向へ転換するとしても、②\n長い目で見れば、あまりいい影響を残さない、というように思う。\n(中略)\nでは、どうしたらいいか、というと、原則的には親は子供の内面については、ほうっておくしか\nないのだ。理解しようとしたり、いわんや (注4) 共感しようとしたり一緒に悩もうとしたりしてもむだなの\nだと思う。\n子供との距離が、刻々ひらいていくことに堪えるしかないのだ。そして、その距離をリアルにとらえて\nいる親は、子供にとって魅力的だと思う。\nそうした親は、子供を理解しようとしたり、一緒に悩もうとしたりしない。そういうことができない\nことの悲しさ、寂しさ、情けなさを胸におさめて、子供と対する。いわば「他人」として対する。「親切な\n他人」として対する。そして、その節度を保てるということが、子供への愛情になっている。というような\n親でありたい。と少なくとも私は思っている。\n(山田太一 『誰かへの手紙のように』による)\n(注1) 歯の浮くような : ここでは、なんとなく落ち着かない\n(注2) 正面きったもの : ここでは、きちんとしたもの\n(注3) 不分明な : はっきりしない\n(注4) いわんや : まして","questions":[{"q":"中学生のころの筆者の親に対する態度はどのようなものだったか。","options":["話らしい話はしようとしなかった。","話しかけられないように顔を合わせなかった。","親を寂しがらせないように気をつかっていた。","言葉として意味をなさないやりとりを避けていた。"],"answer":0,"explain":"Tuổi trung học, tác giả KHÔNG muốn nói chuyện thực sự với cha mẹ (本当の話はできない). ✅A."},{"q":"①気持は安定していたとあるが、なぜか。","options":["親と時々「対話」による交流が持てたから","親が「対話」をのぞんでいることが分かったから","親が自分を気にかけていることを確認できたから","親が自分のことを理解していると感じたから"],"answer":2,"explain":"①Tâm trạng ổn định chỉ cần: 1 câu hỏi đơn giản 'có gì không?' cũng đủ biết cha mẹ vẫn QUAN TÂM đến mình. ✅C."},{"q":"②長い目で見れば、あまりいい影響を残さないとあるが、なぜか。","options":["親が不安な気持でアドバイスすると、子供の不安も増すから","親の価値観によるアドバイスは、子供にとってあまり役に立たないから","親が子供の世界に入ろうとすると、子供は心を半ざしてしまうから","親が子供にかかわりすぎると、子供は自分の世界をつくりにくくなるから"],"answer":3,"explain":"②Ảnh hưởng xấu lâu dài: cha mẹ can thiệp quá nhiều → con KHÓ tạo thế giới riêng của bản thân (自分の世界をつくりにくくなる). ✅D."},{"q":"親は子供に対してどうあるべきだと、筆者は考えているか。","options":["子供との意思不通を図り、交流を深める。","子供との距離を受け入れ、成長を見守る。","子供の気持を理解し、愛情を言葉にする。","子供の悩みを共有し、かつ適度な距離を保つ。"],"answer":1,"explain":"Cha mẹ nên: chấp nhận khoảng cách, theo dõi con TRƯỞNG THÀNH (距離を受け入れ、成長を見守る). ✅B."}]},{"source":"Mon12","bai":8,"date":"12/2013","title":"Mon12 - Bài 8 (12/2013)","passage":"「目を見て話す」この秘訣を教えてくれたのは、まだ小さかった頃の娘でした。\n「外から帰ったら、手を洗いなさい」\n「ごちそうさまを言いなさい」\n(中略) どんなに声に威厳を込めたつもりでも、新聞をよみながらだと、まるでだめ。\n「お父さんはこういっているけど、手を洗うっていうのは、別に大事なことじゃないんだな。」\nきちんと目を見ていないと、子どもはたちまちそう判断してしまいます。よそ見をしながら口\nやかましく繰り返しても、①「ごちそうさま」を言うようにはならないのです。目を見て話すことは、分\nかり合い、メッセージを伝え、コミュニケーションをよくする秘訣。これは子供に限ったことではありま\nせん。 仕事でも家庭でも、すべての場において有効です。\n大人になると、ぎくしゃくすることは頻繁にあります。\n環境も価値観も考え方や違う人たちの集まりである以上、意見が食い違ったり、誤解が生\nじてトラブルになることは珍しくありません。\n「じっくり話し合えば、ちゃんと分かり合える」というのは、僕の見たところ、残念ながら理想\n論。どちらかが妥協したり、お互いがちょっと意見を曲げたりして合わせているだけで、 1 0 0パー\nセントの解決などありえないのが現実です。\nあげくの果てに(注)「話しても無駄だし、まだ同じことの繰り返しか」とうんざりし、コミュニ\nケーションをあきらめてしまう一ほうっておくとこんな事態に陥ることも、珍しくはありません。\nそれでもコミュニケーションを諦めたくないと思ったとき、僕はこの秘訣を思い出しました。\nいくら意見が食い違っても、どんなにトラブルが燃え上がっても、必ず相手の目を見て話をすると\nいうことを考え方がまるで合わず、最後まで言い分は平行線をたどるような議論でも、相手の目を\n離さなければ、不思議なことに相手に尊敬の念が湧いてきます。たとえ「この人の言っていること\nは、間違っている ! 」 と思っていても、相手の目を見ていれば、「その人の人間性」に対しては、別\nの気持ちを抱くようになります。意見は認められなくても、人としては認められるということです。\n言い合っても目と目を見つめ合っていれば、不思議な一体感すら生まれます。結果として\n解決には到らなくても、悪い方向には向かわない。これだけは、何度も試した僕の保証付きです。\n疲れていたり、へこんでいたりすると、人は目を見て話すことができません。そして下を向い\nていればいるほど、よくない事態が悪化します。\nさあ、洗い物をしながら大事な話をするのはやめましょう。パソコンから顔を上げて、まっす\nぐ目を見て話しましょう。理解できない相手でも、受け入れられない相手でも、この秘訣を知ってい\nれば、②何か別の関係は生まれるはずです。\n(松浦弥大郎「あたらしいあたりまえ。人暮らしの中の工夫と発見ノート2」による)\n(注) あげくの果てに : 結局","questions":[{"q":"子供は、①「ごちそうさま」を言うようにはならないとあるが、なぜか。","options":["親が手本を見せないとわからないから。","親がやかましく言うとかえって逆効果になるから。","その言葉を言うことが習慣になっていないから。","その言葉が必要だという親の気持ちが伝わらないから。"],"answer":3,"explain":"①Con không nói 'cảm ơn bữa ăn' vì: không nhìn vào mắt → con KHÔNG cảm nhận được sự quan trọng cha mẹ truyền đạt (気持ちが伝わらない). ✅D."},{"q":"大人同士の人間関係について、筆者はどのように述べているか。","options":["話し合いを重ねても、お互いを理解できないことがある。","お互いを理解するためには、最後まで議論することが必要だ。","話し合いの場で誤解をなくすには、お互いが妥協しなければならない。","コミュニケーションを諦めると、トラブルになることも珍しくない。"],"answer":0,"explain":"Quan hệ người lớn: dù nói chuyện nhiều vẫn có lúc KHÔNG thể hiểu nhau hoàn toàn (100%の解決などありえない). ✅A."},{"q":"②何か別の関係が生まれるとあるが、どういうことか。","options":["相手の人間性を認めるようになる。","相手の意見を容認できるようになる。","相手の態度を受け入れるようになる。","相手の価値観を理解できるようになる。"],"answer":0,"explain":"②'Mối quan hệ khác' = dù bất đồng ý kiến, vẫn CÔNG NHẬN nhân cách của đối phương (人としては認められる). ✅A."},{"q":"この文章で筆者が言いたいことは何か。","options":["問題を解決するためには、相手の目を見て理解できるまで話し合えばいい。","コミュニケーションのためには、相手の目を見て話すことが大切である。","相手に誤解されないためには、目を見てコミュニケーションをすればいい。","自分を理解してもらうには、目を見て繰り返し話すことが大切である。"],"answer":1,"explain":"Ý chính: nhìn vào mắt khi nói chuyện là CHÌA KHÓA của giao tiếp. ✅B."}]},{"source":"Mon12","bai":9,"date":"07/2014","title":"Mon12 - Bài 9 (07/2014)","passage":"現代は、「必要は発明の母」となった時代である。あるものが発明されると、企業はさまざまな\n余分の機能をあたかも必要不可欠とばかり付加して製品を売り込もうとし、人々はその機能がいかに\nも前から必要であったかのごとく錯覚して購入するからだ。発明が欲望を刺激し、欲望が人々を消\n費に走らせ、消費が新たな必要性という幻想を生み出すのである。その結果、本来必要でなかった\nものにまで飢餓感を募らせ、無限に便利さを追い求めるという悪循環に陥る。\nこのように企業の戦略と人々の欲望が結びついて、ひたすら「幸福」を求めようとする構造が\n①現代という時代を象徴している。ケータイがその典型である。\nそんな時代に「幸福」を考えるとすれば、この欲望の連鎖をどこかで断ち切るより仕方がない。\nいや、発明というような新技術には目を向けず、むしろそれらと縁を切って積極的に時代遅れになる\nということに「幸福」は求められるのではないだろうか。テレビは置かずにCDでモーツァルトや座語を\n開き、パソコンはインターネットに手を出さずワープロ機能だけにする。クルマは持たずに公共交通\n機関のみを使う。ケータイは家族にしか番号を知らせない。欲望を他者との関係に求めず、自分の\n内部からの声を汲み上げ、何かを創り出すことのみに時間を使う、そんな生活にこそ「幸福」がありそ\nうな気がする。\nむろん、そんな修道僧 (注1) のような生き方は現代では②不可能である。電子メールでは誰と\nでも簡単につながって対話できる。インターネットで買い物をし、ブログ (注2) で自分の意見が自由\nに出せるのは新しいテクノロジーがあってこそである。テレビからの情報は日常会話に欠かせない\nし、電話での長話も楽しい。クルマがあればいつでも好きな場所に行ける。パソコンもテレビもケータ\nイもクルマもない生活は考えられず、これら文明の利器 (注3) は私たちを誘引して止まない (注4) の\nだ。③そこに「幸福」はないと実は誰もが知っていても、便利さと効率性を棄てきれないのも私たちな\nのである。とすると、どこかで妥協することを考えねばならない。断ち切るところと利用するところを使\nい分けるのである。私のやり方は比較的単純で、余分な機器を持たず、持っても時間を区切るか場\n所を限るかして欲望を抑制することだ。\n(中略)\nそのようにして生み出された時間を自分のために使うのだ。それが私の「幸福」への接近法な\nのである。\n(池内了『生きのびるための科学』 による)\n(注1) 修道僧 : 終行中の僧\n(注2) ブログ : 日記形式のホームページ\n(注3) 利器 : 便利な器具\n(注4) 誘引して止まない : ここでは、絶えず引き付けている","questions":[{"q":"①現代という時代とは、どのような時代だと筆者は述べているか。","options":["人々が必要性を感じているものを、企業がすぐに察知し製品化している。","人々の購買欲にこたえるために、企業が必要以上のものを開発している。","企業の多くの発明によって、人々の便利な生活が支えられている。","企業が次々に新製品を売り込むことで、人々の欲望が膨れ上がっている。"],"answer":3,"explain":"①'Thời đại hiện nay': doanh nghiệp liên tục bán sản phẩm mới → lòng ham muốn con người ngày càng PHỒNG TO (欲望が膨れ上がっている). ✅D."},{"q":"②不可能であるとあるが、なぜか。","options":["人は外部の情報なしでは生きられないものだから","人は他者とのつながりを径てきれないものだから","人は不便で手問のかかる生活に戻れなくなっているから","人は新しいテクノロジーがよいものだと思い込んでいるから"],"answer":2,"explain":"②'Không thể' vì: con người KHÔNG THỂ trở lại cuộc sống bất tiện, nhiều công sức nữa (不便で手間のかかる生活に戻れなくなっている). ✅C."},{"q":"そことは何を指しているか。","options":["古い機器を棄てられない生活","便利な機器に半まれた生活","新しい機器に頼らない生活","必要な機器だけを使う生活"],"answer":1,"explain":"③'そこ' = cuộc sống bị BAO BỌC bởi thiết bị tiện ích (便利な機器に囲まれた生活). ✅B."},{"q":"筆者は、どのようにして 「幸福」を得ようとしているか。","options":["欲望を抑制して、自身が本当に気に入った機器だけを手に入れる。","機器とのかかわりを制限して得られた時間を、自身のために使う。","便利さや効率性を放棄して、自身が本当に必要なものを見極める。","ものに対する執着心を棄てて、自身のための時間を生み出す。"],"answer":1,"explain":"Cách đạt 'hạnh phúc': HẠN CHẾ liên hệ với thiết bị, dùng thời gian có được cho CHÍNH MÌNH. ✅B."}]},{"source":"Mon12","bai":10,"date":"12/2014","title":"Mon12 - Bài 10 (12/2014)","passage":"本というのは、人間と同じようなものだ。一律の価値によって優劣を決めることはできない。\n人気者がいるのと同じように、ベストセラーがある。嫌われ者がいるように、誰からも手に取られない\n本もある。だが、どれもがそれぞれの価値を持っている。それを求めている人の手に求めていると\nきに渡れば、それは良書になる。\nそれゆえ、私はインターネットの書評サイトなどで、まるで自分を神であるかのように本の優\n劣を断定しているものには激しい抵抗を感じる。もちろん、書評をするのは悪いことではない。本を\n批判したりほめたりするのも、もちろん大事なことだ。だが、あくまでもそれは、その人の知識と関心\nと人柄によっての判断でしかない。つい神の立場でものを言いたくなる気持ちはわからないでもな\nいが、それはあまりに傲慢というものだろう。\n私の本も、インターネットの書評サイトでかなり叩かれているものがある。それはそれでやむ\nをえないと思っている。ある程度売れると、それをけなしたがる人間がいるものだ。本をけなすと、\n自分が著者よりも偉くなったような気がするのだろう。私自身も本を書くようになる前、いや、正直に\n言うとある程度売れる本を出すようになる前、他人の本をずいぶんけなしたものだ。\nただきわめて心外なのは、ないものねだりをしている評があまりに多いことだ。たとえば、私\nはある参考書を出している。その趣旨としていることは、「大学の小論文試験に何とか合格できるだ\nけのレベルの小論文が書けるようにするため、最低限これだけの知識は持っていてほしい」という\n知識を整理した参考書だ。だから、私はその本の中では、敢えて難しいことは書いていない。とこ\nろが、その参考書を酷評する (注) 書評がある。そして、その評の中には「この本を読んでも、かろう\nじて合格するくらいの力しかつかない」と書かれている。\n私は、まさしくかろうじて合格するくらいの力をつけるためにその本を書いているのだ。かろ\nうじて合格すれば、その本は最高の良書だろう。私がそのような意味で敢えてカットしたことを取り\n上げて、それが書かれていないからと批判されても、こちらとしては困ってしまう。\nそのような身勝手な書評がなんと多いことか。知識のある人間が入門書を幼稚すぎるとけ\nなし、知識のない人間が専門書をわかりにくいとけなす。しかし、それは単に自分の背丈にあって\nいない本を求めただけのことに過ぎない。きちんと自分の背丈にあった本を探して買うのが、読者\nの務めだと、私は思う。\n本について語るからには、あらゆる本に愛情を持つべきだと私は考えている。そうしてこ\nそ、本を批判する資格を持つと思うのだ。\n(樋口祐一『差がつく読書』 による)\n(注) 酷評する : ひどく厳しい評価を下す","questions":[{"q":"筆者は、どのような書評が傲慢だと感じているか。","options":["大した理由づけもなく優劣を断定したもの","優れている点を決して認めようとしないもの","自身に知識があるかのように見せかけたもの","自身の判断がすべてであるかのように評価したもの"],"answer":3,"explain":"Phê bình ngạo mạn: đánh giá như thể PHÁN ĐOÁN CỦA MÌNH là tuyệt đối đúng, duy nhất (神の立場で本の優劣を断定). ✅D."},{"q":"ある参考書について、筆者が心外だと感じたのはどのような書評か。","options":["どうにか合格できる程度を目指したのに、それ以上の内容が必要だと評判したもの","合格に必要な最低限の知識を整理したものなのに、合格は不可能だと批判したもの","敢えて難しいことは書いていないのに、それでもわかりにくいと批判したもの","難しい試験でも合格できるように書いたのに、それでも不十分だと挑判したもの"],"answer":0,"explain":"Tác giả thấy bất công: tác giả nhằm mức 'đủ đậu' nhưng người phê bình lại chê cần NHIỀU nội dung hơn — đúng ngược chủ đích của sách. ✅A."},{"q":"筆者によると、本が良書と言えるのはどのような場合か。","options":["書評で強く批判されない場合","多くの人が価値を認めている場合","求める人に本の趣旨が理解しやすい場合","求める人のレベルや目的にあっている場合"],"answer":3,"explain":"Sách hay = PHÙ HỢP với trình độ/mục đích người cần (自分の背丈にあった本). ✅D."},{"q":"本を批評する人に対して、筆者が言いたいことは何か。","options":["著者のあらゆる本を読むべきだ。","極端に否定的な評価は避けるべきだ。","それぞれの本の存在価値を認めるべきだ。","どのような本にも先入観なしで接するべきだ。"],"answer":2,"explain":"Ý chính: nên công nhận GIÁ TRỊ TỒN TẠI riêng của từng cuốn sách (あらゆる本に愛情を持つべき). ✅C."}]},{"source":"Mon12","bai":11,"date":"07/2015","title":"Mon12 - Bài 11 (07/2015)","passage":"たとえば、あなたが会社の中で企画部門に属し、①目標値を設定する仕事を与えられたと\nする。ここでは達成不可能な目標を設定したところで意味がないとされるから、外部環境や内部の状\n況を含め、諸々の要素を検討することになるだろう。その上で現状から考えて、達成可能かつできる\n限り高い目標を探ることになる。\nこのとき、あなたが今後変わりうる外部環境を完璧に予想し、会社内部のすべてを完全に把\n握している存在であれば、目標を設定する仕事はこの上なく素晴らしいものだ。社員全員がこれに\n向かって全力を出せばそれでいいことになる。\nしかし、実際にはそんなことはありえない。外部環境は予想もつかない方向に変わりうるし、\n社内では、上からの目が届かないところでアイデアを隠し持った人が必ずいる。固定化した目標は、\n不確定要素にまったく対応できないのである。しかも、こうした事前に予想ができない要素にこそ、\n大きなビジネスチャンスが転がっている。\nだから目標を設定するならば、変化に対応する中で、各人の創意工夫の果てにやっと達成\nされるようなものでなければならない。しかし、事前にこれらをすべて盛り込むことはできるはずもな\nいから、何となく納得感のありそうな落とし所(注1)を探すことになる。大人はこの落とし所という言葉\nが大好きなのだが、こんなものに意味があるはずもないのだ。これではすべての可能性を引き出す\nことができないのである。\nこれは個人としても同じことである。 (中略)\n試合直後の力士にインタビューをすれば、「明日の一戦をまた頑張るだけ」と答えが返ってく\nるだろう。ゴルフツアーの最終日を明日に控えたプロ選手でも、翌日のスコア目標などはロにしな\nい。そんなことを考え始めれば、プレイが崩れ始めることを知っているからだ。\nそれにもかかわらず、なぜかビジネスになると、途端に誰もが最終ゴールを決めようとする。\nスポーツよりも遥かに不確定な要素が多いにもかかわらず、目標によって自分たちを縛りつけようと\nするのである。これにはかなり②違和感を覚える。\nどんなことでも、周囲の状況はどんどん変わることが当たり前である。それにもかかわらず、\n自分だけ変わらないのはおかしい。過去に立てた目標によって自分を窮屈な存在にしてはいけな\nいのである。もしどうしても目標を立てたいのであれば、ほとんど実現不可能なくらいの大きな目標を\n持つべきだろう。しかし、これ自体はその達成方法を考えるのに役には立たない。自分が持つ可能\n性を大事にしたいのであれば、目の前のことだけに投入(注2)し、何かしらの(注3)変化を察知するに\nつけ、次のベストを探すというスタンスを保持することが重要である。\n(成毛眞『大人げない大人になれ ! 』による)\n(注1) 落とし所 : 妥協点 (注2) 投入 : ここでは、集中する (注3) 何かしらの : 何らかの","questions":[{"q":"①且標値を設定する仕事では、どのような目標を設定しようとするか。","options":["外部環境や内部の状況の変化を完璧に予測した目標","現在の状況から見て無理なく達成される目標","成し遂げられる範囲の中で最も高い目標","達成が難しくても取り組む価値のある目標"],"answer":2,"explain":"Mục tiêu kinh doanh nên đặt: CAO NHẤT trong phạm vi khả thi (達成可能かつできる限り高い目標). ✅C."},{"q":"筆者は、何がビジネスチャンスにつながると述べているか。","options":["創意工夫を生み出す社内環境","社員にとって納得感のある目標設定","社内外の不確定な変化に対する大胆な予想","社内に埋もれている発想や社外で起こる変化"],"answer":3,"explain":"Cơ hội kinh doanh đến từ: ý tưởng ẨN trong công ty + biến động ngoài KHÔNG dự đoán được (社内に埋もれている発想や社外で起こる変化). ✅D."},{"q":"②違和感を覚えるとあるが、どのようなことに違和感を覚えているか。","options":["不確定な要素が多いため目標を立てないこと","周囲の状況は変わるのに目標を固定すること","目標を立てたのにそれを口にしないこと","目標を立てたのにそれを変えなくてはならないこ"],"answer":1,"explain":"②Khó chịu vì: hoàn cảnh xung quanh luôn THAY ĐỔI nhưng mục tiêu lại bị CỐ ĐỊNH (周囲の状況は変わるのに目標を固定する). ✅B."},{"q":"とこの文章で筆者が言いたいことは何か。","options":["実現不可能なくらいの大きな目標を立てて達成に向けて努力すべきだ。","自分の可能性を大事にするためには、大きな目標を立てるべきではない。","自分が持つ可能が最大限に発揮できるような目標を探し続けることが重要だ。","目標を立てることに縛られず、目の前のことに最善の対応をすることが重要だ。"],"answer":3,"explain":"Ý chính: không bị ràng buộc bởi mục tiêu cũ, ỨNG BIẾN tốt nhất với hiện tại (目の前のことに最善の対応). ✅D."}]},{"source":"Mon12","bai":12,"date":"12/2015","title":"Mon12 - Bài 12 (12/2015)","passage":"山の風景画は、世の中にいくらでもある。日本画にしろ洋画にしろ、古今東西あまたの (注\n1) 画家たちが、その題材に「山」を選んでいる。モチーフとしての山の意味するものはさまざまだろ\nうが、個人的にはそれらに興味を惹かれることはなかった。\nなぜか。\n一般的な登山者が山を眺めたときの感慨は、おおむね似かよっている。それは、雄大さ、\n唆厳さ (注2) 、あるいは優しさといったステレオタイプな観点から山を賛美し、その風景を自分の心\nの展示箱に納めて「いい思い出」にしてしまう。そして、山策画や山岳写真の作家たちの多くもま\nた、似たようなイメージを印画紙やカンバスなどに再現して、狭い市場のなかで再生産している例\nが少なくない。\nだが、山に登る者の心に刻印 (注3き) される山の風景は本来限定的なものではなく、確定\nしえない動的な現象として記憶されてもよいのではないだろうか。見る者の心のなかで定着される\n山のイメージは、そしてその表現は、もっと多様であるべきだろう。\nつねに転変をくり返す「海」に対して、動かざるものの象徴として、「山」が引き合いに出され\nることもある。はたしてほんとうに山は動かないのか。 (中略)\n一登山者としてこう思う。山は動いている、と。それは、地殻 (注4) 変動や火山の噴火など\n大規模なものだけではない。 遠目には同じように見えても、風に吹かれて砂塵は舞い、山腹を覆う\n植物たちは陽光を浴びて茂り、渓流はその谷の深さを日々深く削り、刻一刻と変化しつづけてい\nる。そういった微細な物理的変貌、小さな生命たちの死滅と再生が瞬時も止まることのない現場\nが、「山」なのである。\n都市の風景は近代以降多様な都市論の対象となってきたが、本来、多様性に富んでいる\nはずの山という場所を表現するイメージが、なぜこれほどまでに単一的なのか。\nそれは、山というつねに転変する自然から、都市部の生活者の生活が乖離してしまったこ\nとに、原因を求めることができるかもしれない。山の変化に気づくほど山を観測していないから、そ\nの変化にも気づかない。\n何十年も山で暮らしてきたような画家でさえも、その表現は先述した域を出ることは稀だ。\n思うに、そういった者は都市生活者とは反対に、表現への憧れが先に立ち、山の実相 (注5) を表\n現しえていないのかもしれない。\n(志水哲也編『山と私の対話』 による)\n(注1) あまたの : 数多く刻の\n(注2) 唆厳さ : 厳しさ\n(注3) 刻印する : ここでは、 刻む\n(注4) 地殻 : 地球の表層部\n(注5) 実相 : 本当の姿","questions":[{"q":"個人的にはそれらに興味を惹かれることはなかったとあるが、なぜか。","options":["型にはまった見方で描かれた山の絵が多いから","一般的な登山者の視点で描かれた山の絵ではないから","思い出として残すために描かれた山の絵しかないから","自分の心の中にある風景と似たような山の絵ばかりだから"],"answer":0,"explain":"Tranh núi không hấp dẫn vì: thường vẽ theo cách nhìn RẬP KHUÔN, sáo mòn (ステレオタイプな観点). ✅A."},{"q":"筆者は山をどのようにとらえているか。","options":["山の変化は小さくても、心に残る感動は大きい。","山は同じように見えても、それぞれの個性がある。","山は一見変わらないようでも、変化しつづけている。","同じ山に面しても、山から受ける印象は毎回異なる。"],"answer":2,"explain":"Tác giả nhìn nhận núi: tưởng như không đổi nhưng THỰC RA luôn biến đổi liên tục (微細な物理的変貌...刻一刻と変化). ✅C."},{"q":"都市生活者と、何十年も山で暮らしてきたような画家について、筆者はどのように述べている か。","options":["いずれも山への憧れが強い。","いずれも山への興味が失われている。","いずれも山の見方が変化してきている。","いずれも山のイメージが固定化している。"],"answer":3,"explain":"Cả người thành thị và họa sĩ sống lâu ở núi: đều có hình ảnh núi CỐ ĐỊNH, rập khuôn (イメージが固定化している). ✅D."},{"q":"山の風景画について、筆者はどのように考えているか。","options":["山の姿を描くためには、その山の特徴を強調すべきだ。","山を多様に描くためには、画家は個性を発揮すべきだ。","山への思いは皆違うのだから、その表現も自由であるべきだ。","山の姿は単一ではないのだから、その表現も多様であるべきだ。"],"answer":3,"explain":"Ý chính: vì hình dáng núi KHÔNG đơn nhất nên cách biểu hiện cũng nên ĐA DẠNG. ✅D."}]},{"source":"Mon12","bai":13,"date":"07/2016","title":"Mon12 - Bài 13 (07/2016)","passage":"わたしは、暮らしや家族の中にある科学をテーマにして、雑誌に記事を書くことがありま\nす。料理の科学、生活の中にある器具のしくみなどを取りあげて、科学を専門としない人たちにも\n関心を持ってもらえるよう記事づくりを工夫します。そんなとき①編集者の注文はこうです。\n「一般の主婦の方々にとっつきやすくする (注1) ために、内容は科学のことであっても「科\n学」ということばは使わないでください。「科学」と聞いただけで引いてしまう (そのページを読むこと\nをやめてしまう) 人がけっこういますから」\nこれは、わたしにとってはむずかしい注文でもやることが多いのですが、編集者の言うこと\nは、一般の人に対する情報発信の心構えとして、現時点では適切と言うほかありません。「科学」と\nいうことばを使うか否かが大きな問題なのではありません。読者である「一般の人たち」も、発信す\nる側である「編集者」も、科学に対して距離を感じているということであり、それは、現在の「科学技\n術」と②「それを使う人たち」の関係を象徴しています。作る側、発信する側は、当然その内容を熟\n知し将来の方向性を提案しますが、それを使う側の人は与えられたものを十分に理解せず「買う」\nという行動だけで受け入れていると言いかえられます。\n(中略)\n技術、そして科学技術は、その時代に生きている人々によって求められ発展してきたもの\nであるはずですから、わたしたちはそれらの科学技術を使う主人公です。しかし、はたしてわたした\nちの科学技術に対する理解は、科学の発展とともに進んでいるでしょうか…?\nたとえば、あなたの周りで、「科学はむずかしいから」 と決めつけて、苦手だと思っている人\nはいませんか。あなた自身はどうでしょ う。科学的理論と実用化のレベルが複雑で高度なために、\n一握りの人たちにしかわからないむずかしいものになってしまっているのは事実です。\n専門家や技術者が作り出したものを、マニュアルの通りに使うことさえできれば、③そのしく\nみなどを知る必要はない、という人もいるかもしれません。しかし、そのような使い方では、供給する\n側から示された技術の「良い部分」しか見えません。 科学技術を提供する側からは「良い部分」し\nか聞かれないのだとしたら…。 それらを使う主人公であるわたしたちは、与えられる情報だけでは\nなく、科学的背景やしくみを少しでも知った上で、生活の中に取り入れるか、取り入れないのかを\n判断することが必要です。\n良いこと (ベネフィット) も悪いこと (リスク) も考えながら科学技術とつきあっていく、その第一歩は、\n「知ること」です。\n(佐倉純ノ古田ゆかりプリビング・サイエンス・ラボ「おはようからおやすみまでの科学」による)\n(注) とっつきやすくする : ここでは、受け入れられやすくする","questions":[{"q":"編集者の注文とあるが、編集者はなぜ注文したのか。","options":["読者が科学に苦手意識を持っていると考えているから","読者が科学の専門的なことばを理解できないと考えているから","読者が考える科学と暮らしの中の科学は違うと考えているから","読者が持っている科学のイメージがはっきりしないと考えているから"],"answer":0,"explain":"Biên tập viên yêu cầu tránh từ 'khoa học' vì nghĩ độc giả có TÂM LÝ SỢ khoa học (「科学」と聞くと引いてしまう). ✅A."},{"q":"②「それを使う人たち」について、筆者はどのように述べでいるか。","options":["科学技術は使っているうちに理解できると思っている。","科学技術を使ってはいるが、理解しているとは言えない。","科学技術を理解してはいるが、使いこなせていない。","科学技術を理解しているつもりで使っている。"],"answer":1,"explain":"②'Người sử dụng' khoa học: DÙNG công nghệ nhưng không hẳn HIỂU nó (使ってはいるが、理解しているとは言えない). ✅B."},{"q":"そのしくみなどを知る必要はないと考えることの問題点は何か。","options":["マニュアルがないと製品が使えないこと","マニュアル以外の使い方ができなくなること","供給する側の伝えたい情報が理解できないこと","供給する側に都合のいい情報しか得られないこと"],"answer":3,"explain":"Vấn đề khi không cần biết cơ chế: chỉ nhận được thông tin CÓ LỢI từ phía cung cấp (供給する側に都合のいい情報しか得られない). ✅D."},{"q":"筆者が言いたいことは何か。","options":["技術の知識を豊富に身につけることが大切だ。","科学技術をマニュアルに頼らず使いこなすことが大切だ。","科学技術を取り入れ、そのしくみを知ろうとすることが大切だ。","科学技術を知り、生活に取り入れるかどうかを判断することが大切だ。"],"answer":3,"explain":"Ý chính: cần HIỂU BIẾT khoa học để TỰ quyết định đưa vào đời sống hay không. ✅D."}]},{"source":"Mon12","bai":14,"date":"12/2016","title":"Mon12 - Bài 14 (12/2016)","passage":"建築の設計をやっていると様々な職人に出会う。大小を問わずどの現場でも一人や二人、主\n役を張れる (注1) 人がいる。そうした人に出会うのが、現場に通う楽しみのひとつだ。長い時間、図\n面にばかり接していると、現実を離れて思考が一人歩きすることがよくある。そんな時、彼らからもらう\n情報がかけがえのない (注2) ものであることが分かる。我々が作り出す図面は、線で描かれた抽象\n的な記号に過ぎない。彼らは物に触っている。経験則によって裏付けられた、物に近い、深くて確か\nな情報を持っている。\n図面は人間の頭の中だけで作り出されたものだ。それを現実の建物に移し替えるには、木や\n鉄やコンクリートといった、物から手によって直接に得られる情報が不可欠だ。頭で生み出されたも\nのは、思いこみや錯誤によって間違うことが多いからだ。\n今はコンピューターと情報通信の時代だ。それにともなって、手を動かす機会がどんどん少な\nくなってきている。建築の設計でもCAD (コンピューター利用設計) 化の勢いはすさまじい。 しかし、\nその図面は、設計の全体を把握しにくい。きれい過ぎて、何であれ、すべてうまくいっているように見\nえてしまう。手を経ずに、頭の中だけで作業が完結してしまっているからだろう。\nトレーシングペーパー (注3) に鉛筆で苦労をして描かれた旧来 (注4) の図面は、そこに描く人\nの感情が入っている。うまくいっていないところは消しゴムで消し、描き直して修正していく。 技術的\nに問題のあるところ、デザイン的にうまくいっていないところほど、線はにじみ、トレーシングペーパー\nは人の手の脂で汚れてくる。何回も描き直した個所は、しまいには擦り切れて穴が開いてしまうことも\nある。\n描いた当人の自信がなければ、鉛筆の線にもその迷いを見て取ることもできる。 慣れてくる\nと、図面上の線から、描いた人の経験的なレベルや人柄さえ分かるようになる。手書きの図面には、\nすてがたい様々な種類の情報が塗り込められている。均質な図面の向こう側に人の姿が見えにくい\n分、CADでは大きなリスクを見落とす可能性もある。\n手から遠いコンピューターの出現によって、リスクの所在をかぎ取ることが、旧来の経験則では\n難しくなってきている。これは設計に限ったことではないだろう。今情報通信とコンピューターはあら\nゆる分野に浸透し、社会全体を変えつつある。頭から生み出されたものが暴走している。リスクの所\n在が、より巨大で、見えにくくなった。\nどこかでそれを、生身の身体を持つ人間の側に引き戻す必要がある。手から得られる情報\nは、効率は悪いが、現実の世界をまさぐって (注5) 得られるものだ。その人の身体だけにとどまる固\n有に情報といってもよい。忘れられつつある手の行き場を考えるべきだろう。\n(内藤廣 『建築のはじまりに向かって』による)\n(注1) 主役を張る : ここでは、主要な役割を果たす\n(注2) かけがえのない : 他に代わりがないほど貴重な\n(注3) トレーシングペーパー : ここでは、設計図を描くための紙\n(注4) 旧来の : 昔からの\n(注5) まさぐる : 手探りをする","questions":[{"q":"そうした人に出会うのが、現場に通う楽しみのひとつだとあるが、なぜか。","options":["職人から得る情報で自分のやり方の正しさが確かめられるから","職人たちの経験に基づいた信頼できる情報が得られるから","様々な職人たちから建築設計の多様性が学べるから","経験豊かな職人たちの仕事ぶりが見られるから"],"answer":1,"explain":"Niềm vui gặp người thợ: thông tin đáng tin cậy dựa trên KINH NGHIỆM thực tế (経験則によって裏付けられた、深くて確かな情報). ✅B."},{"q":"鉛筆で描かれた図面について、筆者はどのように述べているか。","options":["設計の過程や描いた人に関する情報が得られる。","経験を積んで設計に自信のある人にしか描けない。","細部は分かりにくいが、全体は把握しやすい。","情報を読み取りにくいが、描いた人の感情がこもっている。"],"answer":0,"explain":"Bản vẽ tay: cho biết thông tin về QUÁ TRÌNH thiết kế + cả NGƯỜI vẽ (描いた人の経験的なレベルや人柄). ✅A."},{"q":"筆者は、コンピューターが社会にどのような影響を与えたと述べているか。","options":["多くの情報の中から必要な情報を選び出しにくくなった。","リスクの高い様々な種類の情報が池溢するようになった。","これまでに得られた経験則が社会で必要とされなくなった。","どこにどのようなリスクが潜んでいるか把握しにくくなった。"],"answer":3,"explain":"Ảnh hưởng máy tính (CAD): rủi ro trở nên KHÓ NHẬN BIẾT vị trí tiềm ẩn hơn (リスクの所在が見えにくくなった). ✅D."},{"q":"この文章で筆者が最も言いたいことは何か。","options":["コンピュータ化によるリスクを経験則によって回避すべきだ。","コンピューター化による効率重視の風湖を改めるべきだ。","手によってなされる仕事の伝統を守っていくべきだ。","手によってなされる仕事の価値を再認識すべきだ。"],"answer":3,"explain":"Ý chính: cần NHẬN THỨC LẠI giá trị công việc làm bằng tay (手によってなされる仕事の価値を再認識すべき). ✅D."}]},{"source":"Mon12","bai":15,"date":"07/2017","title":"Mon12 - Bài 15 (07/2017)","passage":"私は、科学が再び文化のみに寄与する営みを取り戻すべきと考えている。壁に飾られたピ\nカソの絵のように、なければないで済ませられるが、そこにあれば楽しい、なければ何か心の空白\nを感じてしまう、そんな「無用の用」としての科学である。 世の中に役立とうというような野心を捨て、\n自然と戯れ (注1) ながら自然の偉大さを学んでいく科学で良いのではないだろうか。 好奇心、探\n求心、美を求める心、想像する力、普遍性への憧れ、そのような人間の感性を最大限練磨 (注2)し\nて、人間の可能性を拡大する営みのことである。\nむろん、経済一辺倒の現代社会では、そんな原初的な科学は許されない。一般に文化の\n創造には金がかかる。ましてや科学は高価な実験器具やコンピューターを必要とするから一定の\n投資をしなければならず、そうすれば必ずその分の見返りが要求される。「文化より明日のコメを」と\nいう声も絶えることがない。社会もムダと思われるものに金を投ずるのを忌避 (注3き) するからだ。\nそれが「役に立つ」科学とならねばならない要因で、科学者もセールスマンのように次々に目新し\nい商品を用意して社会の要求に迎合していかねばならなくなる。それを逆手にとって、あたかも世\nの中を牛耳 (注4) っているかのように尊大に振舞う科学者すら合場するようになった。これほど社\n会に貢献しているのだから、もっと金をよこせ (注5) というわけである。金を通しての科学者と社会\nの網引き (注6) 状態と言えるだろうか。\nそれでいいのかと改めて考え直してみる必要がある。確かに科学には金がかかり、それに\nは社会の支持が欠かせない。「無用の用」にすらならないムダも多いだろう。 しかし、ときに科学は\n世界の見方を変える大きな力を秘めている。 事実、科学はその力によって自然観や世界観を一\n変させ、社会のありように大きな変化をもたらしてきた。社会への見返りとは、そのような概念や思\n想を提供する役目にあるのではないか。それは万に一つくらいの確率であるかもしれないが、科学\nの営み抜きにしては起こり得ない貢献でもる。むろん、天才の登場を必要とする場合が多いが、そ\nの陰には無数の無名の科学者がいたことを忘れてはならない。それらの積み上げがあってこそ天\n才も活躍できるのである。\n今必要なのは、「文化としての科学」を広く市民に伝えることであり、科学の楽しみを市民と\nともに共有することである。実際、本当のところ市民は「役に立つ科学」ではなく、「役に立たないけ\nれど知的なスリルを味わえる科学」を求めている。市民も知的冒険をしたいのだ。 (中略) 科学の行\n為は科学者という人間の営みだから、そこには数多くのエピソードがあり、成功も失敗もある。それ\nらも一緒に紡ぎ合わせることによって 「文化としての科学」が豊かになっていくのではないだろう\nか。それが結果的に市民に勇気や喜びを与えると信じている。\n(池内了『科学の限界』による)\n(注1) 戯れる : ここでは、触れ合う (注2) 練磨する : 鍛えて磨く\n(注3) 忌避する : 嫌って避ける (注4) 牛耳る : 思い通りに動かす\n(注5) よこせ : くれ (注6) 綱引き状態 : ここでは、引っ張り合い状態\n(注7) 紡ぎ合わせる : ここでは、組み合わせる","questions":[{"q":"筆者によると、原初的な科学とはどういうものか。","options":["一見無用と思われるものを、世の中に役立てようとするもの","人間の可能性を拡大するために、なくてはならないもの","自然の中で感性豊かに生きるために、自然を学ばうとするもの","自然の偉大さを学び、人間の感性を豊かにしていくもの"],"answer":3,"explain":"Khoa học nguyên thủy: học hỏi sự VĨ ĐẠI của tự nhiên, làm GIÀU cảm tính con người (自然の偉大さを学び、感性を最大限練磨). ✅D."},{"q":"それでいいのかと改めて考え直してみる必要があるとあるが、筆者は何を考え直してみる必要が あると述べているか。","options":["科学の営みの中に社会に寄与しないムダが多いこと","社会が科学に投資したなくなってきたこと","社会も科学者も科学を経済的観点からしか見ていないこと","社会も科学者も科学に見返りを求めるべきではないと考えていること"],"answer":2,"explain":"'Cần suy nghĩ lại': cả XÃ HỘI và NHÀ KHOA HỌC đều chỉ nhìn khoa học từ góc độ KINH TẾ (金を通しての網引き状態). ✅C."},{"q":"筆者は科学が社会にどのような貢献をしてきたと考えているか。","options":["無数の科学者の積み上げから天才を登場させてきた。","これまで主流とされてきたものの見方を履し変化をもたらした。","社会の要求する新しい商品を次々に提供してきた。","社会の役に立たないことにも価値があると人々に認識させてきた。"],"answer":1,"explain":"Đóng góp của khoa học cho xã hội: làm THAY ĐỔI cách nhìn chủ đạo trước đó về thế giới (自然観や世界観を一変させた). ✅B."},{"q":"筆者が言いたいことは何か。","options":["市民と科学の楽しみを共有することが「文化としての科学」の発展につながる。","市民が知的好奇心を高めあれば「文化としての科学」が豊かになる。","「文化としての科学」と「役に立つ科学」が共存することで社会が豊かになる。","「文化としての科学」とともに「役に立つ科学」 を市民に伝えることが必要だ。"],"answer":0,"explain":"Ý chính: CHIA SẺ niềm vui khoa học với công dân → phát triển 'khoa học văn hóa'. ✅A."}]},{"source":"Mon12","bai":16,"date":"12/2017","title":"Mon12 - Bài 16 (12/2017)","passage":"このところ、「○○倫理」という言葉をしばしば耳にする。マスコミでは、政治倫理、企業倫理、\nメディア倫理などといった言葉はおなじみのものだろう。そうした言葉は、なにか問題が起きたとき\nの掛け声のようなもので、空疎(くうそ)(注1)な常套句(じょうとうく)にすぎないのかもしれない。だが、\n漠然と、倫理といったものが必要だという気分が漂っているのは、事実であるように思う。\nそうした雰囲気を受けて、倫理学では、応用倫理学と呼ばれる分野が急速に成長し、さま\nざまな倫理が提唱されつつある。たとえば、生命倫理、環境倫理、ビジネス倫理に始まって、情報\n倫理、工学倫理、スポーツ倫理、さらには、遺伝子倫理、脳神経倫理、ナノ倫理、ロボット倫理と\nいった具合に、言葉を見ただけでは、内容がにわかには想像しにくいものまで登場している。「な\nんでも倫理症候群」とでもいいたくなるほど、「○○倫理」が大はやりなのだ。どうやら、現代は「倫理\n的な時代」らしいのである。こうした倫理ばやりは、わたしのように哲学や倫理学を専攻する人間に\nとって、必ずしも喜ばしい事態であるわけではない。それは、倫理が空 気のようなものだからだ。\n普段、わたしたちが生活しているときに、空気を吸っていることをとりたてて意識などしな\nい。生きていく上で空気が必要なことはわかってはいても、希薄になって、息苦しくでもならない限\nり、空気は意識さ れたりはしない。\n倫理には、それと似たところがある。倫理がさかんに語られるのは、社会がそれまで通りに\nはいかず、息苦しくなっているような時代である。少なくとも歴史を振り返ってみると、「倫理的な時\n代」はいずれも価値観の大きな変動期にあたっていた。つまり、それまで当然だと思っていた考え\n方や生き方が大きく揺らぎ、どう考え、どう生きたらよいのかわからないようなときに、倫理は求めら\nれてきたのだ。わたしたちが生きている現代は、そうした時代である可能性が高い。\nこの場合、一番の問題は、変動期の人間には、先が容易に見通せないことである。現在\nは、 過去の歴史的な事例とは違って、どのような結果が待ち受けているか、あらかじめ知ることは\nできない。わたしたちは、そうした不確かさのなかで、現在を生きていかざるをえない。\nもちろん、こうした事態を、わたしたちが新たな未 来を切り開くのだと、積極的にいってみる\nことはできるかもしれない。しかし、そうした積極的な態度や発言が簡単にはできないのが、「倫理\n的な時代」のとりあえずできるのは、何があるのか、どのような問題が出てきているのかを知り、考え\nていくことである。 それが、現在を生きるということであるはずだ。\n(注)空疎(くうそ)\n(注)な常套句(じょうとうく):ここでは、中身のない形だけの言葉","questions":[{"q":"そうした有雰囲気とあるが、どのようなことか。","options":["社会が倫理を求めている。","マスコミが倫理の必要性を訴えている。","倫理学の価値が見直されつつある。","倫理学が他の分野に応用され始めている。"],"answer":0,"explain":"Bầu không khí xã hội: XÃ HỘI đang CẦN đạo đức, lan rộng cảm giác bất an (社会が倫理を求めている). ✅A."},{"q":"倫理と空気の似ている点について、筆者の考えに合うのはどれか。","options":["実体がわかりにくいので、意識されない。","生きていく上で、常になくてはならない。","必要だと感じなければ、意識されない。","必要になっても、すぐには意識されにくい。"],"answer":2,"explain":"Giống không khí: chỉ khi CẢM THẤY CẦN THIẾT (vì thiếu/khó thở) mới được ý thức đến, không tự nhiên được để ý. ✅C."},{"q":"筆者は「倫理的な時代」をどのような時代だととらえているか。","options":["新たな価値観が生まれ、社会に受け入れられている。","従来の価値観が通用しなくなり、人々が生きる方向性を見失っている。","倫理の価値が再評価され、次の世代に積極的に倫理を教えている。","倫理自体に価値がないと考えられ、社会が大きく揺らいでいる。 Câu 4. 筆者は「倫理的な時代」を生きる人間にできることは何だと考えているか。","積極的に発言し行動すること","現在の経験を将来生かすこと","現状の問題を把握して考えること","未来を切り開く方法を考えること"],"answer":1,"explain":"'Thời đại đạo đức': giá trị quan CŨ không còn dùng được, con người MẤT phương hướng sống (どう考え、どう生きたらよいのかわからない). ✅B."}]},{"source":"Mon12","bai":17,"date":"07/2018","title":"Mon12 - Bài 17 (07/2018)","passage":"多くの人が今の社会は生きづらいと言う。\n長いこと農林業者や職人、漁業者達に会って話を開いてきた。明治生まれも大正生まれも\n昭和の方もいた。その方々も、自分たちは生きやすく、楽しい人生を送ってきたとは言わなかっ\nた。\n私が会った多くの方々は徒弟制度(注)のなかで技を身につけ生き方を学んできた人達\nだった。林業者達は親方や先輩に仕えて、 道具の使い方や山や木の性質、癖を読み取る方法を\n覚えて一人前になった。 漁師達もそうだ。 父や兄の船に乗り込み飯炊きから始めて、その日の水\n温や風の流れを読み、漁場を決め、そこに合った道具を選び、漁獲を得るようになる。\n教える親方や先輩達は「見て学べ」と言うだけだった。自分の指先や感覚、体が覚えた技\nを伝えるには言葉はあまりに幅が狭すぎるからだ。\n(中略)\nやがて一人前になり、腕を上げれば、効率は上がり、利益も出るようになるが、目指す到達\n点が遠いことに気さく。だから日々の①努力を惜しまなかった。 努力だけが自分を補ってくれる手\n段だったからだ。 努力は辛いものであったが、 喜びも伴っていた。 積み重ねれば明日があり、報\nわれることがあったのだ,しかし、②時代は変わった。時間のかかる訓練を避け、効率の向上を目\n指した。効率こそが価格競争に勝てる最高の武器だと考えたからだ。工場はもちろん、漁師は機\n械を満載 した高速船を手に入れ、農業者はトラクターを買った。森林の伐採も機械がする。\n世の仕組みも、人々の考えも努力や修業、技を持つ体を不要なものとしたのだ。技はデー\nタとして機械に組み込まれ、人間に付属するものではなくなってしまった。修業は人を磨き、生き方\nを支えるものであったのだが、それがなくなった.\n今、人は働かされていると感じている。そこでは隠された能力が引き出されることがない。\n見つけ出す過程がなくなったからだ。報いは金銭ではあり、喜びが薄っぺらなものになってしまっ\nた。働くことの意味が変わったのだ。\n働くことと生きることは人生の裏と表であった。生きづらい世の中と思う人が多いのは、働く\nことに喜びが伴わなくなったからではないか。私の会ってきた人々は自分の仕事を語るとき、苦し\nかったとは言いながら、表情に生気があり、誇りがにじんでいた。\n社会が変わっても人は生きていかねばならない。働かねばならない。機械を捨てるというの\nではない。 効率も必要だ。しかし、新しい時代の中で働く意味と喜びを見つけ出さなければ、生き\nづらさが増すばかりだ。\n働くことの喜びをどうやって復活させるのか。お手本はほんのこの間までの日本にある。た\nくさんの方達の話を聞いてきてそう思う。\n(注) 徒弟制度: ここでは、弟子として技を習得する制度","questions":[{"q":"親方や先輩が技を言葉で教えなかったのはなぜか。","options":["技を伝える言葉を理解させられないから","技は言葉では十分伝えられないから","技は言葉で伝えても身につかないから","技は時間がたてば自然に身につくものだから"],"answer":1,"explain":"Người thợ dạy 'nhìn mà học' vì: kỹ năng KHÔNG thể truyền tải đủ bằng LỜI NÓI (言葉はあまりに幅が狭すぎる). ✅B."},{"q":"①即力を惜しまなかったのはなぜか。","options":["努力を積み重ねなければ、辛さが喜びに変わらないから","努力を積み重ねれば、報われた時の吾びが大きくなるから","努力をして腕を上げれば、利益が出るから","努力をし続けなければ、目指すものに近づけないから"],"answer":3,"explain":"①Không tiếc nỗ lực vì: chỉ có nỗ lực mới giúp TIẾN GẦN mục tiêu xa (努力だけが自分を補ってくれる手段). ✅D."},{"q":"時代は変わったとあるが、人の働き方はどう変わったのか。","options":["修業に努力が求められなくなった。","技を習得することが必要とされなくなった。","機械の出現で効率的に修業ができるようになった。","誰もが機械に精通することを求められるようになった。"],"answer":1,"explain":"②Thời đại thay đổi: kỹ năng KHÔNG còn cần thiết phải học nữa, bị máy móc thay thế (技はデータとして機械に組み込まれた). ✅B."},{"q":"筆者の考えに合うのはどれか。","options":["生きづらい社会であっても、誇りを持って生きていこう。","修業を通して働く意味と喜びを得られた時代に戻るべきだ。","時代が変わっても、働く意味と喜びを見つけて生きていこう。","働く意味や喜びを大切にしながら、効率を追求していくべきだ。"],"answer":2,"explain":"Ý chính: dù thời đại đổi thay, vẫn cần TÌM ý nghĩa & niềm vui trong lao động. ✅C."}]},{"source":"Mon12","bai":18,"date":"12/2021","title":"Mon12 - Bài 18 (12/2021)","passage":"私たちは、その時の状況や、周りの人のまなざしに合わせるように、行動を決めている ことがあ\nる。人は一人の時の行動と、人に見られている時とでは行動が変わる。誰かのま なざしを気にして\n動くのである。そして、多くの人々が生き交う街は、皆が皆に視線を向 け合う「まなざしの集合体」\nと言える場所だ。そんな場所では何が適切な行動で、何が不 適切な行動なのかという暗黙の公共\n性が生まれてくる。まなざしの集合によってそこに社 会規範が生まれ、それは生活の型となって私\nたちの認識を導く。\nこうした社会規範や公共性は、かつてはその場所での営みの中で自然に生まれてくるも ので\nあった。同じ土地で、たくさんの人が争わずに仲良く生活するためにひつようだから である。それ\nがはっきりと明文化されていったものが、法律や制度がたくさんあるように 思える。「街角でギター\nを鳴らしてはいけません」、「路上で物を売ってはいけません」、あげくの果 てには、「公園でキャッ\nチボールをしてはいけません」ということになる。\n一体どういう意味があるのか明確ではないルールは単なる記号だ。それがなぜダメなの かという\n理由が共有できないまま、ルールは押し付けられて従っていることがある。そう やって与えられて\nいるルールに、自分でいちいち判断せずに従っていると、今度はそれが 無意識の型となってくる。\nなんとなく街を眺めて、なんとなくその場の型に従っていると、そのうちに周りの物事 に対する疑\n問は次第に薄れていくのである。私たちは、なぜその行動をしているのか、な ぜその場所にその\nルールがあるのかを改めて考えなくなる。そうすると今度は物事の判断 基準が「ルールに従ってい\nるかどうか」に変わってしまう。まなざしが集まるからルール が生まれるのではなく、決められたルー\nルにまなざしを合わせることになる。\nルールとは私たちが共有している記号である。街ではどういう振る舞いが共有されてい て、どうい\nう行動は許されないのか。それに対して街の人々が想像したことが集合した結 果として、取り決め\nられるものである。しかしそれは繰り返される間に、だんだんと単な る記号になり、私たちの行動や\n認識も、単なる型にはまっていく。だからこそ、もう一 度それに正しくまなざしを向けなおすために\nは、その想像の型をいったん外して、全く違 う型を取ってみることが重要なのである。\n(注)あげくの果てには、そして最後には","questions":[{"q":"かつての社会規範や公共性について、筆者はどのように述べているか。","options":["自分自身よりも、周りの人を優先するという考えに基づいていた。","同じ土地の人々の間でも、一様に認識されているものではなかった。","同じ土地で人々と争わずに生活していれば、自然に身についてくるものだった。","ともに生活するうえで必要なものとして、同じ土地の人々の間で然に発生した。"],"answer":3,"explain":"Quy chuẩn xã hội xưa: nảy sinh TỰ NHIÊN từ nhu cầu sống chung hòa thuận trên cùng vùng đất (争わずに仲良く生活するために必要). ✅D."},{"q":"無意識の型となってくるとあるが、どういうことか。","options":["法律や制度に合わせることが、特に難しいことではなくなってくる。","法律や制度の必要性を考えずに、従うべきものとして認識してしまう。","法律や制度の意味が分からなくなり、守る必要性を感じなくなってしまう。","法律や制度の意味を理解していなくても、人々の間で共有することができる。"],"answer":1,"explain":"'Khuôn mẫu vô thức': TUÂN THEO quy tắc mà không nghĩ đến LÝ DO tồn tại của nó (理由が共有できないまま押し付けられて従う). ✅B."},{"q":"筆者が言いたいことは何か。","options":["ルールは時代の変化に合わせて変えていくことが大切だ。","ルールの有無にかかわらず、自身が正しいと思う行動をすべきだ。","なぜそのルールがあるのかを考えて、行動することが大切だ。","これまでのルールに反している行動でも、社会の中で許容していくべきだ。"],"answer":2,"explain":"Ý chính: quan trọng là SUY NGHĨ tại sao có quy tắc đó rồi mới hành động, không chỉ làm theo máy móc (想像の型を外して違う型を取ってみる). ✅C."}]},{"source":"Mon12","bai":19,"date":"07/2022","title":"Mon12 - Bài 19 (07/2022) [thiếu đề gốc]","passage":"植物は美しい花を咲かせ、虫を誘った。鳥は飛ぶために翼を生やした。しかし、生物は、自ら求\nめてそ のような性質を得たわけではない。生命にとって新しい変化は偶然によってしか生まれな\nい。\nDNAが複製され、親から子に受け渡されるとき、ごく稀に、ほんのわずかな誤植(注1)が発生す\nる。もちろん誤植はランダム(注2)におきる。ささいな誤植は新たな変化をもたらす。その変化自体\nには目 的も意図も方向性もない。そこから何かを選びとるのは自然環境である。自然環境に適し\nた変化は選択され、子孫を残す。環境に不適な変化は子孫を残せず、淘汰される。\nところが。もし本来ならあっさり淘汰されてしまうような変化であっても、それを選びとり、守り、育む\nような 「選択者」が自然以外に存在すれば、その変化は生きのびることができる。そんなことが近\n年、実はたくさ ん、あちこちで起こっている。近年、といってもそれは、人間がこの世界に出現して\n以来のこと。\nたとえば鳥。鳥は卵を産むと巣に籠って暖める性質を持つ。数週間それに専心(注4)する。しか\nし、 もし何らかの突然変異によって鳥の習性が変化し、卵を産んでも暖めることを放棄してしまっ\nたら。そんな変 化は、子孫を残すのに圧倒的に不利だから、たちまちそんな鳥は淘汰されるは\nず。\nところが人間はその島の卵を島に代わって暖め子孫を増やしてやることにした。なぜか。鳥は卵\nを暖める ことを放棄したかわりに、またすぐに次の卵を作りはじめる性質を持っていたから。こうし\nて現在、私たち人間 は、毎日排卵(注5)し、毎日のように卵を産みっぱなしにして平然としている\n鳥、すなわち、一年に300個 以上も卵を産み続けるニワトリ、ホワイトレグホン①を選びとった。\nたとえばカイコ(注6)② カイコはもともとクワコという蛾の一種だった。人間が常時、餌を供給して人\n工 的な環境を与えた。すると幼虫は自分で餌を探索するのをサボるようになった。その分の余力\nをもっと別な こと、つまり絹糸を作り出す能力に振り向けるような種が選別された。かくして自分で\nはほとんど動けず、必要以上に大きく厚手の繭(注7)を作りだし、そこから出ることも飛ぶこともでき\nないような昆虫が作り出され た。カイコは人間がいないと生きていけない。\n(中略)\n人間がその進化のプロセスに介入し、自然になりかわって選択者としてふるまい、作りかえ、新た\nに生み出 した生命。その生命たちはもはや人間なしでは生きていくことができない。一方、人間も\nまたそんな生命に助 けられ、あるいは支えられて生きている。これは人間と人間が作り出した生命\nとの新たな共生関係とも呼べ る。\n人間が登場して以来、進化の歴史は新しい局面を迎えた。人が作りかえたいのち。それに対して\n人間 はきちんと責任を取らなければならない。\n(注1)誤植:ここでは、ずれ\n(注2)ランダムに:偶然に\n(注3)淘汰される: ここでは、滅びる\n(注4)専心する:集中する","questions":[{"q":"筆者によると、自然界で子孫を残した生物はなぜ子孫を残せたか","options":["自然環境に合わせて自身を変化させたから。","自身に適した自然環境を選んで移動したから。","DNAが複製されるときに、ずれが生じなかったから。","DNAに生じた変化が、たまたま自然環境に合ったから。"],"answer":3,"explain":"DNA biến đổi ngẫu nhiên → tự nhiên chọn lọc → biến đổi PHÙ HỢP với môi trường được giữ lại → D."},{"q":"①ホワイトレグホンについて、筆者はどのように述べているか","options":["卵を産んでも暖めない。","一度に多くの卵を産む。","産んだ卵をほかの鳥に託す。","ほかの鳥より卵を暖める時間が短い。"],"answer":0,"explain":"「卵を産んでも暖めることを放棄してしまった」→ 人間が代わりに暖める → 現在: 卵を産んでも暖めない → A."},{"q":"カイコについて、筆者はどのように述べているか。","options":["身動きが取れないため、細糸が多く作り出せなくなった。","人間が餌を与えることで、絹糸を作ることに専念するようになった。","生きるエネルギーの大部分を、餌を食べることに費やすようになった。","人工的な環境を与えた結果、絹糸を作るという新しい能力を獲得した。"],"answer":1,"explain":"「人間が常時餌を供給 → 餌探索をサボる → 余力を絹糸を作り出す能力に振り向ける」→ B."},{"q":"筆者が言いたいことは何か。","options":["人間が作りかえた生物は、本来の姿に戻さなければならない。","人間はあらゆる生物と新たな共生関係を築くべきだ。","人間は生物の進化のプロセスに介入するべきではない。","人間は作り出した生命との共生関係を維持しなければならない。"],"answer":3,"explain":"「人が作りかえたいのち。それに対して人間はきちんと責任を取らなければならない」→ D."}]},{"source":"Mon12","bai":20,"date":"12/2022","title":"Mon12 - Bài 20 (12/2022) [bản dịch tiếng Việt]","passage":"以下は、十代の若者に向けて書かれた文章である。\n\n　だれでも、自分が自分であることを望み、個性的であろうと願っている。そしてその一方では、自分が他のみんなと違った、自分であることを恐れている。\n\n　本当は、「個性的」であろうと思って、個性的になれるものでもない。それはたいてい、「個性的」といわれる一つの型に、自分をあてはめていることだったりする。人間にとっては、「個性的であれ」などと言われても、どうしてよいかわからないものであって、「個性的」とよばれる型を持ったほうが楽なのだ。しかしそれは、本当に個性的なわけではない。\n\n　それでも、青年期に向けて、個性的であろうと試みることは、よいことだ。かりにそれが、一つの型にすぎなくても、あるいは、個性的であろうとして挫折し、個性的であることから逃避することも含めて、自分にとって個性とはと、考えるのはよいことだ。それは、自分が自分であることの、あかしでもある。\n\n　そこでは、ときに悩むことがあったり、どうしたら個性的な人間になれるかと、模索することもあるかもしれない。それはじつは、「個性的」であること以上に、自分というものを意識していく、一つの過程である。そうした意味では、「個性的」であるかどうかなんて、本当はたいしたことではなくて、自分というものが確立していくことが、大事なことも言える。\n\n　そしてじつは、個性というものは、人間のひとりひとりに備わったもので、その個性がありのままに出ていることが、本当の意味で個性的である。むしろ、本当の自分が出せないから、没個性的にもなるのだ。もちろん、人間はまわりの社会を気にするものであって、自分をよそおうことも含めてしか、社会のなかで存在できない。無理に「個性的」かどうかを、自分のよそおいを捨てようとしても、捨てられるものではない。そうした、社会とのかかわりも含めて、自分というものはある。\n　たいていの場合、つっぱったり、いじけたりしていては、自分の個性は発揮できない。つっぱるまいとするのが一種のつっぱりだったり、いじけまいとしてそのことにいじけたり、なんてことまで問題にしだすと、ちょっと言葉の遊びみたいになるが、ま、そうしたことまで含めて、気楽に自分であるようにしなくては、本当の意味で個性的にはなれないものだ。\n　そして、ありのままの自分を出すことへの不安が、「個性的」を一つの型にしたり、あるいはそうした型から逃れる道へ向かわせたりもする。\n\n　それでも結局、自分とはありのままの自分しかない。それを自覚したとき、きみは個性的なきみになる。","questions":[{"q":"よいことだとあるが、なぜか。","options":["個性的である必要はないと気づくから。","挫折したり悩んだりする経験が個性を作るから。","自分という人間を意識することになるから。","自分にあてはまる個性の型を見付けられるから。"],"answer":2,"explain":"「自分にとって個性とはと、考えるのはよいことだ」→「自分というものを意識していく過程」→ C."},{"q":"個性について、筆者はどのように考えているか。","options":["自分から社会とかかわることで、意識できるものだ。","他人と比較しなければ、自然に発揮できるものだ。","なりたい自分を意識すれば、自然に身につくものだ。","求めて得るものではなく、初めから持っているものだ。"],"answer":3,"explain":"「個性というものは、人間のひとりひとりに備わったもの」→ 求めるものではなく最初から持っているもの → D."},{"q":"筆者が最も言いたいことは何か","options":["自分の個性を模索すべきだ。","自分自身であることが大事だ。","ありのままの自分を出せなくてもいい。","型に縛られない生き方をしたほうがいい。"],"answer":1,"explain":"「それでも結局、自分とはありのままの自分しかない。それを自覚したとき、きみは個性的なきみになる」→ B."}]},{"source":"Mon12","bai":21,"date":"07/2023","title":"Mon12 - Bài 21 (07/2023) [bản dịch tiếng Việt]","passage":"Đối với doanh nghiệp cũng như với người dân, đây là một thời đại đầy bất an và không thể\nnhìn thấy tương lai. Trong thời đại đầy bất an ấy, mong muốn từ phía cha mẹ rằng “muốn trang bị cho\ncon cái năng lực sống” là điều có thể hiểu được. Tương tự, việc các nhà điều hành doanh nghiệp mong\nmuốn thu hút được nhân lực ưu tú dù chỉ là một chút cũng là điều hiển nhiên. Nếu có ai đó xuất hiện\ncó thể ngăn chặn sự suy thoái của khu vực và tình trạng rỗng hóa ngành công nghiệp, thì cảm giác bất\nan của chúng ta cũng phần nào được xoa dịu.\nTuy nhiên, với tư cách là người chuyên ngành giáo dục học, dù là ở mức độ nào, tôi vẫn muốn\nnói điều này. Việc cho rằng mọi vấn đề của xã hội Nhật Bản hiện đại đều có thể giải quyết bằng giáo\ndục là điều không thể chấp nhận được.\nQuả thực, giáo dục thông qua việc nuôi dưỡng con người có thể đóng góp nhất định cho cuộc\nsống của con người và tương lai của xã hội. Nhưng theo tôi, mức độ hữu ích đó không phải là lớn.\nGiáo dục vốn luôn đi kèm với tính bất định. Đây là điều được bàn đến trong cả giáo trình đào tạo giáo\nviên – cái gọi là “những điều cơ bản nhất trong giáo dục học”.\nKhông phải cứ dạy là trẻ em sẽ phát triển tương ứng, mà đôi khi dù không có ý định dạy, trẻ\nvẫn tự học được. Dĩ nhiên, giáo viên và các nhà giáo dục học vẫn nỗ lực hướng sự phát triển xác suất\nấy theo hướng tích cực, nhưng dù sao thì người phát triển vẫn là trẻ em. Do đó, chúng ta không thể dễ\ndàng chấp nhận những yêu cầu như “hãy đạt được lợi ích tối đa với chi phí tối thiểu” hay “hãy đào tạo\nđúng loại nhân lực cần thiết và cung ứng đầy đủ cho xã hội”.\nHơn nữa, vốn dĩ giáo dục không chỉ dành riêng cho kinh tế, cho việc duy trì cộng đồng, hay\ncho gia đình. Thị trường, quốc gia, cộng đồng địa phương, và gia đình đều yêu cầu “giáo dục hữu ích”,\n“giáo dục có ý nghĩa”, nhưng mỗi bên lại có yêu cầu khác nhau. Dĩ nhiên, giáo dục có thể đáp ứng\ntừng yêu cầu đó một cách xác suất. Tuy nhiên, nếu chỉ vì một mục tiêu cụ thể nào đó mà thúc đẩy giáo\ndục theo hướng hợp lý hóa hay tối ưu hóa, thì giáo dục sẽ trở nên méo mó. Hơn nữa, nếu mọi người\nđều cố gắng rút ra lợi ích riêng từ giáo dục, tôi không nghĩ một nền giáo dục bị kéo căng bởi kỳ vọng\nthái quá đó có thể vận hành tốt.\n(…)\nTrong xã hội trì trệ này, ai cũng bị đè nén bởi bất an, và chính vì vậy, kỳ vọng và hy vọng đặt\nvào giáo dục ngày càng lớn. Kết quả là, giáo dục – đặc biệt là giáo dục học đường – đang bị cuốn vào\nlàn sóng cải cách và sắp đánh mất sự bình tĩnh. Cảnh báo rằng “đừng kỳ vọng quá nhiều vào giáo dục”\ncó lẽ chính là điều cần thiết nhất hiện nay để duy trì xã hội và chính nền giáo dục này.\nChú thích:\n(注1) 耳をそろえて : đầy đủ, không thiếu sót gì\n(注2) 歪な（いびつな） : méo mó, không cân đối\n(注3) 躍起になって : trở nên quá mức nỗ lực, cố quá sức","questions":[{"q":"決して大きいものではないと考える理由として、筆者が述べているのはどれか。","options":["企業や社会が望む人材と、教育学で目標とする人材は異なるから。","「生きる力」をつけるために必要なことは、明確ではないから。","子ども一人一人に併せて、教育の内容を変えられないから。","子どもは、教えたとおりに育つとはかぎらないから。"],"answer":3,"explain":"Hiệu quả giáo dục không lớn vì: trẻ KHÔNG NHẤT THIẾT lớn lên đúng như được dạy (教えたとおりに育つとはかぎらない、自ら学んでしまうこともある). ✅D."},{"q":"教育について、筆者の考えに合うのはどれか。","options":["それぞれの目的に合わせて合理化・効率化しなければ、機能しない。","みんなで一つの目的を共有しなければ、効果は上がらない。","特定の目的を果たすために存在するものではない","役に立つかどうかという観点で評価されるべきだ。"],"answer":2,"explain":"Giáo dục không tồn tại CHỈ để phục vụ 1 mục đích cụ thể (kinh tế/gia đình/cộng đồng) — mỗi bên có yêu cầu khác nhau. ✅C."},{"q":"筆者が最も言いたいことは何か。","options":["多様な社会の要求に応じられるように、教育のあり方を考え直すべきだ。","社会の不安を取り除くためには、教育を合理化・効率化すべきではない。","教育の改革によって、安定した社会を持続させていくことが必要だろう。","現代社会の問題のすべてが、教育で解決できると思ってはいけない。"],"answer":3,"explain":"Ý chính: KHÔNG nên nghĩ giáo dục giải quyết được MỌI vấn đề của xã hội hiện đại. ✅D."}]},{"source":"Mon12","bai":22,"date":"12/2023","title":"Mon12 - Bài 22 (12/2023)","passage":"SNS (注1) を含むリアルタイムウェブ (注2) の本質は、時間と過程の消去にある。かつてコンテンツ\n(注3) の拡散には一定の時間がかかった。権威やメディアをすり抜ける必要もあった。けれどもいま\nや、それらの面倒をすべてすっとばし(注4)、無名の書き手が一晩で何百万もの支持者を集 めるこ\nとができる。それはSNSの良いところだ。\nけれども人生にはトラブルがつきもの(注5)である。どれだけ誠実に生きていても、誤解や中 傷に\n曝されることが必ずある。そしてそういうとき、SNSの支持はほとんど役に立たな い。匿名の支持者\nは、トラブルの話題自体すぐに忘れてしまう。あっというまに(注6)集まった 人々は、同じくあっという\nまに離れる。そこで継続的に助けてくれるのは、結局は面倒な 人間関係に支えられた家族や友人\nたちだったりする。\nSNSの人間関係には面倒がない。だからSNSの知人は面倒を背負ってくれない。そ んなSNSで\nも、たしかに人生がうまく行っているときは大きな力になる。けれども、本 当の困難を抱えたときは、\n助けにならないのだ。\nこれからの時代を生きるうえで、SNSのこの性格を知っておくことはとても重要なよ うに思う。そも\nそも、人生の困難なるものは自分と世界のズレの表れである。自分はある ことを正しいと信じるが、\n世界はそう思わない――そういう対立が生じたとき、困難が訪 れる。だから困難そのものが悪いわ\nけではない。むしろ、概念の発明や政治の変革は必ず 困難とともに生じる。その困難を時間をか\nけて解消し昇華する(注７)ことで、はじめて自分も相 手も社会も進歩するのだ。けれども、いまの\nSNSにはそのような熟成の余裕がほとんど ない。\n困難な時期を支えるとは、言いかえれば、支える相手と世界の関係が変化する過程に時 間をか\nけてつきあうということである。ひとりの人間が変わるというのはたいへんなこと で、「いいね!」をつ\nけるようにポンポン複製できるものではない。いわゆる「議論」で 相手が変わると考えているひと\nは、人間の本質について無知である。ぼくが一生をかけて 変えることができるのは、ごく少数の身\nの回りの人々だけであり、そしてぼくを変えるこ とができるのもおそらくは彼らだけだ。その小さく面\n倒な人間関係をどれだけ濃密に作れ るかで、人生の広がりが決まるのだと思う。\n家族も友人もあっというまには作れない。面倒な存在でもある。だからこそそれは変化の受け皿と\nなる。面倒がないところに変化はない。情報技術は、面側のない人間関係の調 達を可能にした\nが、それはまた人間から変化の可能性を奪うものでもあった。そのことを 忘れずにおきたいと思う。\n(注1) SNS: ウェブ上での情報のやり取りや交流の場を提供するサービス\n(注2) リアルタイムウェブ: 情報更新が即時に行われるウェブ\n(注3) コンテンツ: ここでは、情報\n(注4) すっとばす: ここでは、省略する\n(注5) つきもの:必ず伴うもの\n(注6) あっというまに短い間に\n(注7) 昇華する:ここでは、別の良いものに変える","questions":[{"q":"SNSの支持はほとんど役に立たないとあるが、なぜか。","options":["SNSの支持者の意見はさまざまで、すぐにはまとまらないから","SNSの支持者は無名で権威を持たないひとが多いから","SNSの支持者はトラブルの原因を誤解したまますぐに発信するから","SNSの支持者はすぐに興味をなくし、去ってしまうから"],"answer":3,"explain":"Sự ủng hộ trên SNS không giúp được gì vì: người ủng hộ vô danh nhanh MẤT hứng thú và rời đi (あっというまに集まった人々はあっという間に離れる). ✅D."},{"q":"困難な時期について、筆者はどのように述べているか。","options":["自分と世界の認識のズレに気づき自分が変わろうとすれば、乗り越えられる。","「読論」によって相手や自分を変化させることで、乗り越えられる。","少数の身の回りの人々から人間関係を広げていけば、乗り越えられる。","家族や友人のような存在との深い関係によって、乗り越えられる。"],"answer":3,"explain":"Vượt qua khó khăn nhờ: quan hệ SÂU SẮC, lâu dài với gia đình/bạn bè (面倒な人間関係に支えられた家族や友人). ✅D."},{"q":"筆者が言いたいことは何か。","options":["情報技術の特徴を理解したうえで活用すれば、自分自身の変化につながる。","情報技術を活用すれば、面倒な人間関係を変えられる可能性がある。","情報技術によって作られた人間関係では、人間の変化は期待できない。","情報技術は人間の変化の可能性を奪うものであり、利用は控えるべきだ。"],"answer":2,"explain":"Ý chính: quan hệ tạo từ công nghệ thông tin (dễ dàng, không 'phiền phức') KHÔNG mang lại sự THAY ĐỔI con người thực sự. ✅C."}]},{"source":"Mon12","bai":23,"date":"07/2024","title":"Mon12 - Bài 23 (07/2024)","passage":"子育て(養育)にしろ、学校での教育にしろ、当事者(親・教師)が心がけなければならないのは、\nまず 子どもは親(教師)の思うとおりにならないということである。あるいは、こちらの思うとおりになっ\nたら、 かえって問題だということである。\n「子供は親(教師)の思う通りにならない」という意味は、甘やかして野放図(注1)にしていいというこ\nとではない。反抗は望ましいから、大いに結構だとも違う。もともと、親も教師も言葉で説得できるよ\nう になる以前から、まず子ども(生徒)たちを家庭や学校の生活の枠組みに入れなければならな\nい。絶対 に放っておくわけにはいかないし、理屈抜きで生活の型や秩序を押しつけざるをえな\nい。それが親や教 ・師の社会的役割であり、個人としてはどうかと思うようなことも、親や教師は、一\n律に画一的に身につ けさせようとする。それは避けられない。望むと望まざるとにかかわらず、み\nんながやらなくてはならな い。\n人間が社会的動物であるということは、そういうことであろう。動物が持って生まれてきた本能で自\n由に生きられるのに対して、ひとの子どもは動物的な本能を抑圧されて、社会的規範を生まれて\nから 次々と覚え、身につけていかねばならない。これは、ほかの動物と比較すると、不自由なこと\nである。親 や教師は、そういうひとの宿命である不自由を子どもたちに身につけさせなければなら\nない。\n(中略)\nそういう社会的規範は、今の社会のレベルや段階が必要としていることであり、本当にひとの幸\n福に とってふさわしいものかどうかはわからない。ましてや、生まれ育っていくその子どもにとって、\n絶対的に 必要なものかどうかもわからない。ただ、わかっているのは、社会的に生きていくために\n今ある社会的 規範やルール、考え方をひとまず受け入れなければならないということだけである。\nそして、そういうひと を規制し構成してきたもろもろの (注2)精神的な財産は、時代とともに変わって\nきたという事実である。 だから、次の世代は、私たちと同じにはならない。したがって、子どもは親\n(教師)の思うとおりにはなら ないのだ。\nだから、次の世代は、私たちと同じにはならない。したがって、子どもは親(教師)の思うとおりには\nな らないのだ。\nもちろん、思うとおりにしようとすることは避けられないとしても、思うとおりにならないことを覚悟し\nて いるべきである。それが子ども(生徒)や、あとの世代の人たちへの尊敬であり、信頼であろう。\n「こちら の思うとおりになったら、かえって問題だ」も同じことだが、現在の人間や社会がすでに理\n想を実現し た完璧な社会であるはずがないし、私たちが正しいと思い、子どもたちに押しつけてい\nる社会規範やルールも、あくまでも暫定的なものにすぎない。だから、私たちが予想した以上に、\n私たちの思いどお りになる子どもができてしまったら、大変なことになる。\nおとなと子どもとの誤差は、基本的にはいつでも歓迎していいことである。\n(注1) 野放図にする: 勝手にさせる\n(注2) もろもろの:さまざまな","questions":[{"q":"筆者によると、親や教師は子どもや生徒に対して何をしているか。","options":["反抗を容認しつつ、不自由な社会的規範に従わせている。","どの時代にも通用する社会的規範を身につけさせている。","社会的規範を教え、社会の枠組みに適応させている。","社会的規範を教えたうえで、自由に生きる方法を身につけさせている。"],"answer":2,"explain":"Cha mẹ/giáo viên: dạy quy chuẩn xã hội để trẻ THÍCH NGHI với khuôn khổ gia đình/trường học (社会の枠組みに入れなければならない). ✅C."},{"q":"精神的な財産とは何か。","options":["ひとが幸福になるために守ってきたもの。","ひとが本能を抑圧されずに生きるためのもの。","ひとが社会で生きていくために作られてきたもの。","これから生まれ育っていく子どもにとって必要なもの。"],"answer":2,"explain":"'Tài sản tinh thần' = những quy chuẩn/giá trị được TẠO RA để con người sống trong xã hội (ひとが社会で生きていくために作られてきたもの). ✅C."},{"q":"筆者が言いたいことは何か。","options":["社会的規範は時代によって変化するものであり、子どもはおとなの思うとおりにならな くて 当然である。","社会的規範は暫定的なものにすぎず、子どもが自身の考え方に合ったものを作って いく ことが望ましい。","時代の変化に適応できるように、おとなは子どもに社会的規範の背景となる考え方 を教え たほうがいい。","時代によって考え方は変化するものなので、それに合わせて次の世代が社会的規範 を変 えるべきだ。"],"answer":0,"explain":"Ý chính: quy chuẩn xã hội thay đổi theo THỜI ĐẠI → trẻ con đương nhiên KHÔNG giống cha mẹ, đó là điều nên hoan nghênh (おとなと子どもとの誤差は歓迎していい). ✅A."}]},{"source":"Mon12","bai":24,"date":"12/2024","title":"Mon12 - Bài 24 (12/2024)","passage":"最近、日本ではテレビや書籍で脳科学者がブームになりました。脳科学が一般の人々の関心を\n強く 惹いた最大の理由は、脳科学によって自分がよりよい人生を歩めそうだと感じるからではない\nでしょう か。\n科学は事物を客観的に扱う三人称的な学問です。そのため、何か冷たく、自分とは関係のない\nよう なよそよそしさ(注1)を感じてしまいます。ところが、脳科学は人間の感情や思考や行動に関わ\nる科学 です。そのため、科学としては初めてのことですが、まるで文学や芸術のように一人称(注2)\n世界に踏 み込んできて、幸せな人生のノウハウを提供してくれているように思えるのです。\nしかし、せっかく関心を持っている人に水を差す(注3)つもりはないのですが、脳科学が今より\nずっ と進歩したとしても、人間の心や私たちの人生について、すみずみまで解き明かせるようにな\nるわけで はないと肝に銘じて(注4) おいた方がよいと思います。脳は複雑で、まだまだわからない\nことが多く、 普通的な法則に到達するまでの道のりはきわめて遠いのです。そして、たとえ到達で\nきたとしても、科 学の普通法則は人生の個別性や一回(注5)に対しては全く無力です。ゆえに、人\n生の個別の事柄に 適用して何かを予言したりすることは、おそらく不可能でしょう。\nもう一つ大切なのは、科学は事実を扱うことはできますが、価値観の問題を扱うことはできないと\nい うことです。ですから、脳科学によってある事実が判明したとしても、それを価値観と混同しては\nいけま せん。たとえば、ある脳科学の本に、「こうすれば脳を活性化できるので、みなさんもやって\nみましょう」 と書いてあったとします。ですが、脳の活性化は絶対的な価値でしょうか。極端な例で\n考えてみましょう。 副作用の全くない薬物だったとしても、薬物で健康な人間(たとえば受験生)の\n脳を活性化することは 許されるでしょうか。これが許されるかどうかは、論理や価値観に属する話\nです。価値観は個人と社会 が決めるものです。そして、個人の価値と社会の価値も同じとは限りま\nせん。脳科学の知見(注6)は 事実を記述したものであって、価値とは何の関係もないのです。\n(中略)\n人類がどのような未来を選ぶかという問題も、結局のところ価値観の問題です。科学は、選んだ\n未 来を実現するための道具にはあり得ますが、未来を選ぶ価値観の問題を扱うことはできませ\nん。\n(注1)よそよそしい: 無関係である\n( 注2)一人称:書き手が自分自身をさす\n(注3)水を差す: わきから邪魔をする\n(注4)肝に銘じる: 心に強くきざみつけて忘れない\n(注5)一回性:一回起こるだけ\n(注6)知見:見解、見識","questions":[{"q":"筆者によると、人々は脳科学に何を期待しているか。","options":["複雑な脳の仕組みをわかりやすく説明してくれること。","どうすれば自分が幸せに生きられるかを教えてくれること。","人間の感情や思考や行動の扱い方を教えてくれること。","人間にとって幸せな人生とは何かを客観的に示してくれること。"],"answer":1,"explain":"Người ta kỳ vọng khoa học não: dạy cách SỐNG HẠNH PHÚC (幸せな人生のノウハウを提供してくれている). ✅B."},{"q":"脳科学について、筆者の考えに合うのはどれか。","options":["個人の人生に適用するには、普遍的な法則を見つけなければならない。","人の脳の機能をすべて解明できたとしても、普遍的な法則にたどり着けない。","普遍的な法則にたどり着いたとしても、人生の個々の事柄には応用できない。","普遍的な法則に到達するには、人生の個々の事柄を解き明かさなければならない。"],"answer":2,"explain":"Dù đạt quy luật phổ quát về não, vẫn KHÔNG áp dụng được cho từng trường hợp CÁ NHÂN cụ thể (普遍法則は人生の個別性に対して無力). ✅C."},{"q":"筆者が言いたいことは何か。","options":["科学が証明した事実は、個人や社会の価値観に影響を与える恐れがある。","科学だけでなく個人や社会の価値観を考慮したうえで、未来を選ぶ必要がある。","科学は個人や社会の価値観を扱えず、人類が望む未来の実現には役に立たない。","科学は事実を対象とするものであり、個人や社会の価値観を扱うものではない。"],"answer":3,"explain":"Ý chính: khoa học chỉ xử lý SỰ THẬT (事実), KHÔNG xử lý GIÁ TRỊ QUAN (価値観) của cá nhân/xã hội. ✅D."}]}];
const EXPL_DETAIL = {"Mon10-1":[{"huongTuDuy":"Câu mở theo hướng mọi người (tưởng tâm lý học giỏi cảm xúc), tác giả dùng しかし chuyển sang sự thật ngược lại.","chotY":"「実は肝心の**感情**（情動）についてはまだ**よくわかっていない**のです」— cảm xúc chính là điều tâm lý học chưa làm rõ.","lienKetJP":"感情こそ得意なはず →（しかし）→ 実はよくわかっていない → ①不思議に思われる","lienKetVI":"Tưởng cảm xúc là sở trường → (nhưng) → thực ra chưa rõ → người đọc thấy 'lạ'","correct":{"jp":"心理学では**感情機能**についてまだ**十分わかっていない**こと","vi":"Khớp trực tiếp với 「感情…まだよくわかっていない」. Cặp gần nghĩa: よくわかっていない ↔ 十分わかっていない."},"wrong":[{"key":"B","jp":"心理学では**認知**と**感情**の関係がまだ**解明されていない**こと","trap":"bẫy chi tiết phụ","vi":"Bài không nói về quan hệ nhận thức-cảm xúc, mà nói cảm xúc tự nó chưa rõ."},{"key":"C","jp":"心理学は**感情の働き**を研究するのが**得意**だということ","trap":"bẫy ngược nghĩa","vi":"Ngược hoàn toàn — tác giả khẳng định KHÔNG giỏi."},{"key":"D","jp":"心理学が昔から**心**について研究してきたということ","trap":"bẫy mọi người","vi":"Đúng có trong bài nhưng là tiền đề, không phải điều gây 'không ngờ'."}]},{"huongTuDuy":"Câu hỏi về chỉ thị từ ② — luôn tóm gọn câu ngay trước nó.","chotY":"「そうした働き（**感覚・知覚・認知**）と**感情**を**一体化**した心のプロセス」— phải bao gồm cả nhận thức và cảm xúc.","lienKetJP":"感覚・知覚・認知 → ＋感情を一体化 → ②全体的な「生」の体験","lienKetVI":"Nhận thức + cảm xúc hợp nhất → trải nghiệm 'sống' toàn vẹn","correct":{"jp":"身の回りの世界を**目や耳**で**認識**して考え、**心で感じる**体験","vi":"Bao quát đủ 2 nhánh: nhận thức + cảm xúc. Cặp gần nghĩa: 感覚・知覚 ↔ 目や耳で認識."},"wrong":[{"key":"A","jp":"心で感じとったことを、そのまま**行動**に移すような体験","trap":"bẫy chi tiết phụ","vi":"Thêm yếu tố 'hành động' không có trong câu nguồn."},{"key":"C","jp":"どのように周囲を**見**たり**聴**いたりして**考える**かという体験","trap":"bẫy ví dụ","vi":"Chỉ nói phần nhận thức, bỏ sót phần cảm xúc."},{"key":"D","jp":"**感覚**や**知覚**で周囲の世界のものごとを**とらえようとする**体験","trap":"bẫy chi tiết phụ","vi":"Tương tự C — chỉ 1 nhánh nhận thức, thiếu phần cảm xúc."}]},{"huongTuDuy":"Robot là ví dụ minh họa, không phải chủ đề chính — cần tìm câu kết luận sau loạt しかし.","chotY":"「複雑な心の働きの中でも特に**感情機能を解明するのは難しく**、それをうまく**再現できない**からです」.","lienKetJP":"ロボット表情できる →（しかし）→ 真似しているだけ →（しかし）→ 感情機能を解明するのは難しく再現できない","lienKetVI":"Robot biểu cảm được → nhưng chỉ bắt chước bề ngoài → vì cơ chế cảm xúc người chưa giải mã được","correct":{"jp":"**人間**の**感情の働き**を**解明する**ことの**難しさ**","vi":"Khớp trực tiếp với câu kết đoạn 「感情機能を解明するのは難しく」."},"wrong":[{"key":"A","jp":"**ロボット**の感情のメカニズムの複雑さ","trap":"bẫy mọi người","vi":"Nhầm chủ thể — bài nói về con người, robot chỉ là ví dụ."},{"key":"B","jp":"最近の**ロボット工学**の**進歩**のめざましさ","trap":"bẫy chi tiết phụ","vi":"Chỉ là thông tin nền, không phải trọng tâm."},{"key":"C","jp":"人間の**動作**や**表情**を**再現する**ことの難しさ","trap":"bẫy ví dụ","vi":"Nhầm 'tái hiện bề ngoài' với 'giải mã cơ chế cảm xúc bên trong'."}]},{"huongTuDuy":"Câu hỏi tổng kết toàn bài — bám vào câu kết cuối cùng.","chotY":"「感情は…**行動を駆り立てる動因**にもなります」「感情は私たちの**思考や行動の土台**になっている」.","lienKetJP":"感情＝体験を豊かに裏打ち → 行動を駆り立てる動因 → 思考や行動の土台","lienKetVI":"Cảm xúc làm phong phú trải nghiệm → thúc đẩy hành động → là nền tảng tư duy/hành động","correct":{"jp":"何かを**したいと思い**、**行動を起こす**","vi":"Khớp với 「行動を駆り立てる動因」. Cặp gần nghĩa: 駆り立てる動因 ↔ したいと思い行動を起こす."},"wrong":[{"key":"B","jp":"ものごとを**感覚でとらえようとする**","trap":"bẫy chi tiết phụ","vi":"Nhầm với 感覚・知覚 ở đoạn đầu bài, đó là nhận thức không phải cảm xúc."},{"key":"C","jp":"相手の心を**分析**して**理解しようとする**","trap":"bẫy mọi người","vi":"Nghe hợp lý nhưng bài không đề cập, tự thêm vào."},{"key":"D","jp":"好き嫌いを**論理的**に考え判断する","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — cảm xúc là động lực phi lý luận, không phải logic."}]}],"Mon10-2":[{"huongTuDuy":"Mở bài theo hướng hành vi luận: chỉ quan sát hành động vì tâm không thể quan sát trực tiếp. Câu hỏi hỏi MỤC ĐÍCH của thí nghiệm.","chotY":"行動主義心理学では「その行動から**動物の心を探っていく**」— mục đích cuối cùng vẫn là tìm hiểu tâm/ý thức động vật qua hành vi.","lienKetJP":"心は目に見えない → 行動だけを訓練・観察 → その行動から動物の心を探る","lienKetVI":"Tâm không quan sát được trực tiếp → huấn luyện/quan sát hành vi → dùng hành vi để dò tìm tâm động vật","correct":{"jp":"サルの行動を通して、**目に見えない動物の心や意識**を**研究する**こと","vi":"Khớp đúng câu mở đầu 「その行動から動物の心を探っていく」, nhấn mạnh 'không nhìn thấy được' (目に見えない)."},"wrong":[{"key":"A","jp":"サルを訓練して、**人間の意図**を読み取れるようにすること","trap":"bẫy mọi người","vi":"Sai chủ thể — mục đích là hiểu tâm SAI, không phải dạy khỉ hiểu người."},{"key":"B","jp":"サルを訓練して、動物だけが持つ**見えない能力を開発する**こと","trap":"bẫy chi tiết phụ","vi":"'Phát triển năng lực' không phải mục đích — mục đích là nghiên cứu, quan sát."},{"key":"C","jp":"サルの行動を通して、**動物に対する人間の心の動き**を探ること","trap":"bẫy ngược nghĩa","vi":"Đảo ngược chủ thể nghiên cứu — phải là tâm của ĐỘNG VẬT chứ không phải tâm người."}]},{"huongTuDuy":"Đoạn mô tả quy trình huấn luyện shaping từng bước — cần xác định đúng trình tự: thấy lever→cho ăn, rồi chờ hành động tiếp mới cho ăn tiếp.","chotY":"「サルが少しでもチラッとレバーを見たとする。そこですかさず**エサを与える**」→「いったんエサやりを止める」→「**手が少しでも伸びれば**、すかさずエサを与える」.","lienKetJP":"サルがレバーを見る → エサを与える → 一旦止める → 次の行動（手を伸ばす）を待つ → またエサを与える","lienKetVI":"Khỉ nhìn thấy lever → cho ăn → tạm dừng → chờ hành động tiếp theo (đưa tay) → lại cho ăn","correct":{"jp":"サルがレバーを見たらエサをやり、**人間が期待する次の行動をするまでじっと待つ**","vi":"Khớp đúng quy trình: cho ăn khi thấy lever, rồi CHỜ hành động tiếp theo mới cho ăn tiếp."},"wrong":[{"key":"A","jp":"サルをレバーの近くに連れて行き、目標の行動をしたらすぐにエサをやる","trap":"bẫy chi tiết phụ","vi":"Bỏ qua bước quan trọng nhất: chờ đợi (ひたすら待つ) từng bước nhỏ."},{"key":"B","jp":"サルがレバーを押したらエサを指し示し、目標の行動をするまでじっと待つ","trap":"bẫy ngược nghĩa","vi":"Đảo ngược trình tự — phải là người cho ăn khi khỉ hành động, không phải chỉ tay vào thức ăn."},{"key":"C","jp":"サルにレバーを指し示し、人間が期待する次の行動をしたらすぐエサをやる","trap":"bẫy chi tiết phụ","vi":"Sai vì người không 'chỉ tay vào lever' — khỉ phải tự khám phá qua thử-sai (試行錯誤)."}]},{"huongTuDuy":"そのとき chỉ thị thời điểm đặc biệt — cần tìm câu mô tả cảm giác 'nắm được' ngay trước đó.","chotY":"「この訓練をずっとやっていると、徐々にサルの**気持ちがつかめてくる**」「心は行動からしかつかめない。しかしそれが**つかめたとき**、手の中にサルの心があるように思えてくる」.","lienKetJP":"エサやりメッセージを送り続ける → 徐々に気持ちがつかめてくる → サルの心があるように思えてくる（＝そのとき）","lienKetVI":"Liên tục gửi tín hiệu 'cho ăn' → dần dần cảm nhận được tâm khỉ → cảm giác như tâm khỉ nằm trong tay (= 'lúc đó')","correct":{"jp":"「エサやり」というメッセージを送る**過程**を通して、**サルの心がつかめた**と感じたとき","vi":"Khớp với 「気持ちがつかめてくる」「サルの心があるように思えてくる」 — quá trình tích lũy, không phải 1 lần duy nhất."},"wrong":[{"key":"A","jp":"「エサやり」というメッセージを繰り返し送ることで人間と**サルの行動の違い**がわかったとき","trap":"bẫy chi tiết phụ","vi":"Bài không nói về 'sự khác biệt hành vi' — nói về việc nắm được tâm khỉ."},{"key":"C","jp":"レバー押しの訓練が進むにつれて、サルが**筆者の心をわかってくれた**と感じたとき","trap":"bẫy ngược nghĩa","vi":"Đảo chiều chủ thể — phải là TÁC GIẢ hiểu tâm khỉ, không phải khỉ hiểu tâm tác giả."},{"key":"D","jp":"レバー押しの訓練によって**教科書には書かれていないサルの行動**が解明されたとき","trap":"bẫy chi tiết phụ","vi":"Nhầm 'điều sách không viết' (ở câu kết, ý khác) với nội dung そのとき."}]},{"huongTuDuy":"Câu kết bài là chìa khóa: 「学問の本当に大事なことは、教科書には書いていないことを知った」.","chotY":"行動だけを見よといいながら、その実、うまく訓練するには**サルの心がつかめていなければならない**のだ。→ điều quan trọng nhất phải tự trải nghiệm mới biết.","lienKetJP":"教科書通りにやる → しかし実際は衝撃の体験 → 心がつかめないと訓練がうまくいかない → 教科書には書いていないことを知った","lienKetVI":"Làm theo đúng sách → nhưng thực tế là trải nghiệm gây sốc → không nắm được tâm thì huấn luyện không thành → nhận ra điều sách không dạy","correct":{"jp":"動物を訓練するためには**気持ちをつかむ**ことが重要であり、それは**自分で体験**して初めてわかる","vi":"Khớp đúng cả 2 ý: tầm quan trọng của việc nắm bắt cảm xúc + phải tự trải nghiệm mới biết (giáo trình không dạy được)."},"wrong":[{"key":"A","jp":"動物を目標に近づける訓練では、「エサやり」を通して**動物が人間に慣れる**ことが大切だ","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — bài không nói về việc động vật quen với con người."},{"key":"C","jp":"動物の心理を探るためには、まず**教科書に書いてあるとおりのこと**を実践することが大事だ","trap":"bẫy ngược nghĩa","vi":"Ngược hoàn toàn — bài nói điều QUAN TRỌNG NHẤT không có trong sách giáo khoa."},{"key":"D","jp":"動物の心をつかむには**目に見える行動だけ**に注目することが大切だが、そのことは教科書に書いていない","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói phải nắm được TÂM (vô hình) chứ không phải chỉ hành động (hữu hình)."}]}],"Mon10-3":[{"huongTuDuy":"①そんな錯覚 là chỉ thị từ — phải tìm đúng câu ngay trước nó, không lấy phần mô tả phương tiện.","chotY":"「自分は**世界的に考えている**、そのなかに**世界のすべてを包める**」— đây là nội dung của ảo tưởng, không phải nguyên nhân gây ra nó.","lienKetJP":"言葉の風呂敷はいくらでも広げられる →（だから）→ 自分は世界的に考えている、世界を包める → ①そんな錯覚","lienKetVI":"Lời nói có thể khoác đến đâu cũng được → (nên) → tưởng mình suy nghĩ tầm thế giới, ôm trọn cả thế giới → '①ảo tưởng đó'","correct":{"jp":"自分は**何でも知っていて**、**世界を相手にできる**と思う","vi":"Khớp đúng nội dung ảo tưởng: 世界的に考えている、世界のすべてを包める."},"wrong":[{"key":"B","jp":"**言葉**でどんなことでも**伝えられる**ような気になる","trap":"bẫy chi tiết phụ","vi":"Đây là phương tiện/nguyên nhân gây ảo tưởng (言葉の風呂敷), không phải nội dung ảo tưởng."},{"key":"C","jp":"学問から得られることには**限界がない**と感じてしまう","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — toàn bài nhấn mạnh giới hạn nhỏ bé (小さい) của con người, không phải vô hạn."},{"key":"D","jp":"人間が世界から**学べることはいかに大きい**ことかと思う","trap":"bẫy mọi người","vi":"Nghe hợp lý nhưng sai hướng — ảo tưởng là về KHẢ NĂNG CỦA BẢN THÂN, không phải về thế giới."}]},{"huongTuDuy":"②これ là chỉ thị từ chỉ về tính chất công việc của 大工・農夫 đã nêu ngay trước.","chotY":"彼らはみな、**自分の仕事において賢明**である。**我が身ひとつの能力でできることを知り抜いている**.","lienKetJP":"大工・農夫は世界的に木を削ったりはできない → 自分の仕事で賢明、能力を知り抜いている → ②これと学問は変わらない","lienKetVI":"Thợ mộc/nông dân không thể làm việc 'tầm thế giới' → khôn ngoan trong công việc mình, biết rõ năng lực bản thân → '②điều này' giống hệt việc học vấn","correct":{"jp":"**自分にできること**を**把握したうえで**仕事をすること","vi":"Khớp đúng 「我が身ひとつの能力でできることを知り抜いている」 — biết rõ giới hạn năng lực bản thân."},"wrong":[{"key":"B","jp":"自分が**世界のために**何ができるかを考えて仕事に励むこと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phủ định hoàn toàn cách nghĩ 'tầm thế giới' (世界的に)."},{"key":"C","jp":"できる限り**多くの知識**を得て自分の仕事に役立たせること","trap":"bẫy chi tiết phụ","vi":"Không phải về 'thu thập kiến thức' mà về biết giới hạn năng lực bản thân."},{"key":"D","jp":"**人のために**できることは何かを考えたうえで仕事をすること","trap":"bẫy mọi người","vi":"Tự thêm yếu tố 'vì người khác' không có trong bài."}]},{"huongTuDuy":"Đoạn cuối dùng ẩn dụ nông nghiệp (土壌・苗) để giải thích về việc học — cần xác định đúng động từ chính trong ví dụ.","chotY":"教養とは「気質に植えられた苗のように育つ学問や思想」— tương tự việc trồng và CHĂM SÓC để mạ TỰ LỚN, không phải cải tạo đất.","lienKetJP":"気質は土壌のようなもの → 与えられたこの土を耕し、苗を植え、苗が育つのを手伝う → 教養が育つ","lienKetVI":"Khí chất giống như đất → cày đất được giao, trồng mạ, giúp mạ tự lớn → học vấn/giáo dưỡng được hình thành","correct":{"jp":"与えられた**土を耕し**、よい**作物**になるように**苗を育てる**","vi":"Khớp đúng hình ảnh: cày đất + giúp mạ lớn thành tốt, không phải 'chọn mạ có sẵn' hay 'cải tạo đất'."},"wrong":[{"key":"A","jp":"与えられた土を耕し、よい**苗を選んで植える**","trap":"bẫy chi tiết phụ","vi":"Sai chi tiết — bài nói về việc CHĂM SÓC mạ lớn lên, không phải CHỌN mạ có sẵn."},{"key":"C","jp":"与えられた**土壌を改善する**ために耕し続ける","trap":"bẫy chi tiết phụ","vi":"Thiếu mất phần quan trọng nhất: nuôi trồng cây/mạ — chỉ nói về cải tạo đất."},{"key":"D","jp":"与えられた**土壌を改善**しながら**世界標準**の作物を育てる","trap":"bẫy ngược nghĩa","vi":"'Tiêu chuẩn thế giới' (世界標準) ngược hoàn toàn với tinh thần bài — phủ định suy nghĩ tầm thế giới."}]},{"huongTuDuy":"Câu hỏi tổng kết khái niệm 教養 — bám vào câu định nghĩa cuối bài.","chotY":"教養は「**気質に植えられた苗**のように育つ学問や思想」— giáo dưỡng/học vấn được nuôi dưỡng THEO KHÍ CHẤT RIÊNG của từng người.","lienKetJP":"人は誰でも自分の気質を背負って生まれる → 気質は土壌のようなもの → 教養はその土壌で育つ学問・思想","lienKetVI":"Ai cũng mang theo khí chất riêng khi sinh ra → khí chất như mảnh đất → giáo dưỡng là học vấn/tư tưởng lớn lên trên mảnh đất đó","correct":{"jp":"**人それぞれの気質**の中で**育まれた**学問や思想","vi":"Khớp đúng định nghĩa: giáo dưỡng gắn liền với khí chất riêng từng cá nhân."},"wrong":[{"key":"A","jp":"新たな**気質を見いだす**ことができる学問や思想","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — khí chất là CÓ SẴN từ khi sinh ra (背負って生まれる), không phải thứ 'tìm ra mới'."},{"key":"B","jp":"生きていくうえで必要な**専門的な知識**","trap":"bẫy chi tiết phụ","vi":"Giáo dưỡng không đồng nghĩa với kiến thức chuyên môn cụ thể."},{"key":"C","jp":"書物や学問から得られた**多くの知識**","trap":"bẫy chi tiết phụ","vi":"Thiếu yếu tố cốt lõi 'khí chất cá nhân' — chỉ nói về số lượng kiến thức."}]}],"Mon10-4":[{"huongTuDuy":"Đoạn đầu mô tả 2 giới hạn của khoa học — câu hỏi tập trung vào giới hạn thứ nhất.","chotY":"科学的知は「対象を**突き放して**、第三者的立場で…必ずそのつど、**特定の観点からだけ**対象を扱い、**自分が関心を持つ側面だけ**を取り上げ」.","lienKetJP":"科学＝対象を突き放す → 特定の観点・関心ある側面だけ扱う → それ以外は捨象（決して全体を見ない）","lienKetVI":"Khoa học = tách rời đối tượng → chỉ lấy góc nhìn/khía cạnh quan tâm cụ thể → bỏ qua phần còn lại (không bao giờ nhìn toàn thể)","correct":{"jp":"**現在**の事象の**一部だけ**を取り上げて**客観的な立場**で検証する","vi":"Khớp với '特定の観点からだけ扱い、関心ある側面だけ取り上げ' — chỉ 1 phần, góc nhìn khách quan cụ thể."},"wrong":[{"key":"B","jp":"関心のある対象だけを客観的な立場で検証し**未来を予測**する","trap":"bẫy chi tiết phụ","vi":"'Dự đoán tương lai' không có trong đoạn này — đó là nội dung của giới hạn thứ 2 (quá khứ/tương lai)."},{"key":"C","jp":"**過去の経験**をもとにして客観的な立場で現在の状況を扱う","trap":"bẫy chi tiết phụ","vi":"Nhầm lẫn với nội dung giới hạn thứ 2 của khoa học (không xử lý được ký ức quá khứ)."},{"key":"D","jp":"**人間的知の全体**を客観的な立場からだけとらえる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — khoa học 'quyết KHÔNG nhìn toàn thể đối tượng' (決して対象の全体を見ようとはしない)."}]},{"huongTuDuy":"①この傾向 chỉ thị từ — tìm câu ngay trước về hệ quả của việc khoa học chỉ nhìn 1 phần.","chotY":"「科学が進むと、**細分化が必至**となり…**専門化と特殊化**が、科学の運命であり…①この傾向には歯止めが利かない」.","lienKetJP":"科学は一部だけを扱う → 細分化が必至 → 専門化・特殊化が進む（①この傾向）→ 歯止めが利かない","lienKetVI":"Khoa học chỉ xử lý một phần → tất yếu phân nhỏ → chuyên môn hóa, đặc thù hóa (= '①xu hướng này') → không thể ngăn lại","correct":{"jp":"**専門分野**が以前より**細かく分かれる**ようになってきた","vi":"Khớp trực tiếp với 専門化と特殊化、細分化 — phân ngành ngày càng nhỏ."},"wrong":[{"key":"A","jp":"近代的な研究を行う**部門がさらに増えてきた**","trap":"bẫy chi tiết phụ","vi":"'Tăng số bộ phận' không chính xác bằng — trọng tâm là sự PHÂN NHỎ/chuyên môn hóa."},{"key":"B","jp":"特殊な研究対象が**排除**されるようになってきた","trap":"bẫy chi tiết phụ","vi":"Không có nội dung 'loại bỏ đối tượng nghiên cứu đặc biệt' trong bài."},{"key":"C","jp":"研究対象をより**実践的**にとらえるようになってきた","trap":"bẫy mọi người","vi":"Không liên quan — bài không nói về tính thực tiễn mà nói về sự phân mảnh chuyên môn."}]},{"huongTuDuy":"②なぜ khoa học không xử lý được vấn đề 'nên sống thế nào' — cần tìm lý do ở câu giải thích ngay sau.","chotY":"科学的知は「対象を、自分と無関係な事柄として扱う**客観性**がその特色」— chỉ coi trọng sự kiện khách quan, không xử lý được hành vi chủ thể quyết định sống.","lienKetJP":"科学＝客観性が特色（自分と無関係な事柄として扱う）→ 主体的に決断して生きる行為の問題は扱えない","lienKetVI":"Khoa học coi trọng tính khách quan (xử lý như sự việc không liên quan đến mình) → không xử lý được vấn đề tự quyết định cách sống chủ thể","correct":{"jp":"**客観的な事実確認**を重視するものだから","vi":"Khớp đúng đặc trưng cốt lõi: khoa học chỉ coi trọng xác nhận sự kiện khách quan."},"wrong":[{"key":"B","jp":"**現在の行為だけ**を主体的に扱うものだから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — khoa học KHÔNG xử lý được hành vi 'chủ thể quyết định', đây là điểm bài phủ định."},{"key":"C","jp":"**人間全体**を解明することができないから","trap":"bẫy chi tiết phụ","vi":"Đây thuộc giới hạn thứ NHẤT (không nhìn toàn thể), không phải lý do của giới hạn thứ 2 đang được hỏi."},{"key":"D","jp":"人間の考えや行為の多くを**まだ実証できない**から","trap":"bẫy mọi người","vi":"Tự thêm 'chưa thể chứng minh được' — không có trong lý lẽ của bài."}]},{"huongTuDuy":"Câu hỏi tổng kết — tìm câu mở đầu định nghĩa vai trò triết học.","chotY":"「人間的知の全体をほんとに見渡しうる哲学的知の立場」+ phần sau bài (không trích ở đây) nói triết học giải quyết 「**いかに生きるべきか**」— gốc rễ hành vi chủ thể con người.","lienKetJP":"科学は2つの限界を持つ → 全体を見れない／主体的に生きる問題を扱えない → 哲学はこの両方を扱える＝人間の生き方の根本","lienKetVI":"Khoa học có 2 giới hạn → không nhìn toàn thể / không xử lý vấn đề sống chủ thể → triết học xử lý được cả 2, là gốc rễ cách sống con người","correct":{"jp":"**人間の生き方の根本**を扱えること","vi":"Khớp đúng với 'いかに生きるべきか'、 ' 主体的な行為の根本' — vấn đề gốc rễ của cách sống con người."},"wrong":[{"key":"B","jp":"**主体的に考える方法**を示せること","trap":"bẫy chi tiết phụ","vi":"Chỉ nói 'phương pháp suy nghĩ', thiếu yếu tố cốt lõi 'gốc rễ cách sống'."},{"key":"C","jp":"**科学的な世界**を視野に入れられること","trap":"bẫy mọi người","vi":"Không phải trọng tâm — triết học không phải chỉ 'bao gồm cả khoa học'."},{"key":"D","jp":"世界のあり方を**客観的にとらえられる**こと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 'khách quan' là đặc trưng của KHOA HỌC, triết học vượt ra ngoài giới hạn khách quan đó."}]}],"Mon10-5":[{"huongTuDuy":"①シナジー効果 với người đọc — tìm định nghĩa ngay trước, phân biệt với '100 điểm thông thường'.","chotY":"「著者と読者のあいだで、その文章を媒体として**記述されていること以上の事柄が発見**できれば、読者にとって最高の満足感」.","lienKetJP":"目的に合致した文章＝満足感（100点）→ もし記述以上のことが発見できれば →①シナジー効果＝最高の満足感","lienKetVI":"Văn bản đúng mục đích = hài lòng (100 điểm) → nếu phát hiện được nhiều hơn cả những gì viết ra → 'hiệu ứng synergy' = sự hài lòng cao nhất","correct":{"jp":"記述されている内容から、**求めていた以上のこと**が得られる","vi":"Khớp trực tiếp 「記述されていること以上の事柄が発見できる」."},"wrong":[{"key":"B","jp":"著者が伝えようとしている事柄を**理解**し、**知識を増やす**","trap":"bẫy chi tiết phụ","vi":"Đây chỉ là mức '100 điểm' thông thường, chưa đạt đến 'synergy' (vượt quá nội dung viết)."},{"key":"C","jp":"読むことを通して事実を知り、**不十分な点を自覚**する","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 'tự nhận ra thiếu sót bản thân' là cảm giác TIÊU CỰC (tự ti), khác hoàn toàn với 'phát hiện kiến thức mới' tích cực."},{"key":"D","jp":"文章から**足りない知識を補い**、**疑問を解消**する","trap":"bẫy chi tiết phụ","vi":"Chỉ là việc đáp ứng đủ thông tin cần thiết (mức cơ bản), chưa phải 'vượt quá những gì được viết'."}]},{"huongTuDuy":"②それが一番よくわかる — tìm điều được minh họa bằng ví dụ báo cáo sinh viên (đoạn tiếp theo, không trích đầy đủ ở đây nhưng theo mạch bài).","chotY":"Đoạn về báo cáo sinh viên: nếu vài dòng đầu không cuốn hút, người đọc sẽ KHÔNG đọc tiếp — minh chứng cho tầm quan trọng của việc giữ chân người đọc đến cuối.","lienKetJP":"文章の目的を達成するために大事なのは、読者が**最後まで読んでくれる**こと → 読む気のしない文章は目的を果たせない → ②それが一番よくわかる（学生レポートの例）","lienKetVI":"Điều quan trọng để đạt mục đích văn bản là người đọc ĐỌC ĐẾN CUỐI → văn bản không hấp dẫn thì không đạt mục đích → ví dụ báo cáo sinh viên minh chứng rõ nhất","correct":{"jp":"**読む気がしない**ものは**終わりまで読んでもらえない**こと","vi":"Khớp đúng luận điểm chính của đoạn: văn bản không cuốn hút sẽ không được đọc hết."},"wrong":[{"key":"A","jp":"読み手に**満足感**を与えるのは難しいということ","trap":"bẫy mọi người","vi":"Quá chung chung, không khớp với trọng tâm cụ thể về việc 'đọc đến cuối'."},{"key":"B","jp":"**素晴らしい内容**でなければ読んでもらえないこと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói RÕ dù nội dung tuyệt vời (素晴らしい内容が書かれていても) vẫn không đạt mục đích nếu không hấp dẫn để đọc."},{"key":"D","jp":"読んで**すべてを理解**してもらうことは**不可能**だということ","trap":"bẫy chi tiết phụ","vi":"Không phải nội dung của đoạn này — đoạn không nói về khả năng hiểu hết nội dung."}]},{"huongTuDuy":"③脳に届いても心に届かない — phép đối lập 脳 (lý trí/hiểu) vs 心 (cảm xúc/tấm lòng).","chotY":"脳＝hiểu được nội dung logic; 心＝cảm nhận được tấm lòng/sự chân thành của người viết. 「届いても…届かない」= đạt được vế trước nhưng KHÔNG đạt vế sau.","lienKetJP":"AはBだ、覚えておけという姿勢 → 脳には届く（理解できる）→ しかし心には届かない（気持ちは伝わらない）","lienKetVI":"Thái độ 'A là B, hãy nhớ lấy' → đến được não (hiểu được nội dung) → nhưng không đến được tim (không cảm nhận được tấm lòng người viết)","correct":{"jp":"**内容は理解**できても、**書き手の気持ち**は伝わってこない","vi":"Khớp đúng phép đối lập 脳(理解)/心(気持ち) trong câu gốc."},"wrong":[{"key":"A","jp":"**技巧**には感心しても、**内容**には共感できない","trap":"bẫy chi tiết phụ","vi":"Sai cặp đối lập — bài đối lập '理解nội dung' với 'cảm xúc người viết', không phải 'kỹ thuật' với 'nội dung'."},{"key":"B","jp":"**行間の意味**は理解できても、内容には**感動**できない","trap":"bẫy chi tiết phụ","vi":"'Ý ngoài lời' không phải là điều được nói đến — bài nói rõ về nội dung và tấm lòng người viết."},{"key":"C","jp":"**書き手の姿勢**は理解できても、**気迫**までは感じられない","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng sai từ — phải là KHÔNG hiểu được 'tấm lòng/cảm xúc' (気持ち) chứ không phải 'khí phách' (気迫)."}]},{"huongTuDuy":"Câu hỏi tổng kết thái độ nên có của người viết văn lý kỹ thuật — bám câu kết luận về cách viết tốt.","chotY":"著者は常に**読者を意識**し、読者とともに**問題の解決**にあたるという**姿勢**を持つことで文章に磨きがかかる.","lienKetJP":"著者は読者を意識する → 読者とともに問題解決にあたる姿勢 → 文章が磨かれる（シナジー効果が生まれる）","lienKetVI":"Tác giả ý thức về độc giả → mang thái độ cùng giải quyết vấn đề với độc giả → văn bản trở nên tinh tế hơn (tạo ra hiệu ứng synergy)","correct":{"jp":"読者を**意識**しつつ、**真摯に解答を求めて**その**気持ちを伝えよう**とする","vi":"Khớp đúng thái độ được khuyến nghị: ý thức độc giả + chân thành tìm giải pháp + truyền tải cảm xúc."},"wrong":[{"key":"A","jp":"読者の**読む目的を分析**し、読者に**過不足のない情報**を与えようとする","trap":"bẫy chi tiết phụ","vi":"Đây chỉ là mức '100 điểm' thông thường, chưa đạt mức 'synergy' với tấm lòng chân thành."},{"key":"C","jp":"読者に満足感を与えるよう、**妥協せずに完全な解答**を提供しようとする","trap":"bẫy chi tiết phụ","vi":"Quá tuyệt đối hóa — bài không yêu cầu 'giải pháp hoàn hảo', mà là thái độ chân thành đồng hành."},{"key":"D","jp":"読者の読む気を最後まで誘うよう、**読者の思考過程を深く分析**しようとする","trap":"bẫy mọi người","vi":"Không có trong bài — 'phân tích sâu quá trình tư duy độc giả' là chi tiết tự thêm vào."}]}],"Mon10-6":[{"huongTuDuy":"①ふさわしいあり方 — bài chia thành 2 nhánh ngay sau, cần đáp án bao quát ĐỦ cả 2.","chotY":"「ふさわしさ」は二つ：①**働いて食べていけるために必要な能力**（技能・知識）②**他の人びととのあいだでふさわしいふるまい**（他者との関係能力）.","lienKetJP":"ふさわしさ＝二つに分けられる → 技能・知識（働く能力）＋ 他者との関係能力（協力・責任）","lienKetVI":"'Phù hợp' chia làm 2: kỹ năng/kiến thức để làm việc kiếm sống + năng lực quan hệ với người khác (hợp tác, trách nhiệm)","correct":{"jp":"**技能や知識**を身につけ、**他者とのあいだでうまく生きていける**こと","vi":"Bao quát đủ cả 2 nhánh: kỹ năng/kiến thức (技能・知識) + quan hệ với người khác."},"wrong":[{"key":"A","jp":"子供を**養い**、社会において**責任あるふるまい**ができること","trap":"bẫy chi tiết phụ","vi":"'Nuôi con' không có trong định nghĩa gốc — chỉ nói về năng lực làm việc và quan hệ xã hội nói chung."},{"key":"B","jp":"**自立**するために必要な能力を身につけ、**自由に生きていける**こと","trap":"bẫy chi tiết phụ","vi":"Thiếu hẳn nhánh thứ 2 (quan hệ với người khác), chỉ nói về tự lập."},{"key":"C","jp":"**いつの時代にも通用する**技能や知識を備え、**他者に尊敬**されること","trap":"bẫy mọi người","vi":"Tự thêm 'mọi thời đại đều áp dụng được' và 'được tôn trọng' — không có trong bài."}]},{"huongTuDuy":"Câu hỏi về lý do khó 'chia sẻ' lý niệm giáo dục — tìm câu giải thích ngay sau だが.","chotY":"「そこには、社会のあり方と人間の生き方をどのようなものとして思い描くか、つまりは、**異なった社会観・人間観**がさまざまに**入り込み、衝突**してくるからだ」.","lienKetJP":"教育理念の共有はむずかしい →（だが）→ 異なった社会観・人間観が入り込み、衝突する","lienKetVI":"Chia sẻ lý niệm giáo dục rất khó → (nhưng) → nhiều quan điểm xã hội/con người khác nhau xen vào, va chạm nhau","correct":{"jp":"社会や人間について**色々な考え方**があり**ぶつかり合う**から","vi":"Khớp trực tiếp với 「異なった社会観・人間観…衝突してくる」."},"wrong":[{"key":"B","jp":"**教育者**と**一般社会**の人びとが思い描く**大人らしさ**は違うから","trap":"bẫy chi tiết phụ","vi":"Bài không chia phe 'nhà giáo dục vs xã hội nói chung' — nói về sự đa dạng quan điểm nói chung."},{"key":"C","jp":"**子どもの主体性**について**一致した見解**が得られないから","trap":"bẫy chi tiết phụ","vi":"'Tính chủ thể của trẻ' là nội dung của đoạn SAU (phần 反発を覚える人), chưa xuất hiện ở đây."},{"key":"D","jp":"社会のあり方や人びとの**価値観が変化**してきているから","trap":"bẫy mọi người","vi":"Bài không nói về sự THAY ĐỔI theo thời gian, mà nói về sự ĐA DẠNG cùng tồn tại."}]},{"huongTuDuy":"Câu hỏi về thái độ tác giả với người PHẢN ĐỐI định nghĩa giáo dục ban đầu — cần đoạn tiếp theo (không trích đủ ở đây) nhưng theo mạch: tác giả coi phản đối cũng là 1 dạng kỳ vọng giống mình.","chotY":"Tác giả nhận định: người phản đối (cho rằng giáo dục không nên 'ép buộc' theo khuôn mẫu xã hội) thực chất cũng đang mong muốn trẻ tự đạt được kỳ vọng nào đó — GIỐNG bản chất với định nghĩa ban đầu của tác giả (đều là kỳ vọng/期待).","lienKetJP":"反発を覚える人＝子どもの主体性を尊重したい → しかし、それも一種の「期待」である → 筆者の定義（大人としてふさわしさを期待）と本質は同じ","lienKetVI":"Người phản đối muốn tôn trọng tính chủ thể của trẻ → nhưng đó cũng là một dạng 'kỳ vọng' → về bản chất giống với định nghĩa ban đầu của tác giả","correct":{"jp":"大人の**期待を実現**しようとするという点では**筆者の考えと同じ**だ","vi":"Khớp với luận điểm: dù khác hình thức, cả 2 quan điểm đều xuất phát từ một dạng 'kỳ vọng' tương tự."},"wrong":[{"key":"B","jp":"大人の期待を**押し付け**ようとすることは**教育理念にそぐわない**ものだ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — đây là LẬP TRƯỜNG của người phản đối, không phải đánh giá của tác giả về họ."},{"key":"C","jp":"子どもの**主体的な判断力**がみずから育つと考えることは**思い込み**でしかない","trap":"bẫy chi tiết phụ","vi":"Quá tiêu cực — tác giả không phủ định hoàn toàn quan điểm của người phản đối, mà chỉ ra điểm chung."},{"key":"D","jp":"子どもの**主体的な判断力**を育てようとする点では**筆者の考えと変わらない**","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm so sánh — điểm chung là 'kỳ vọng' (期待) chứ không phải 'nuôi dưỡng năng lực phán đoán chủ thể'."}]},{"huongTuDuy":"Câu hỏi tổng kết quan điểm cuối cùng của tác giả về bản chất giáo dục — bám câu kết luận.","chotY":"Giáo dục「**強制**から**自由ではない**」，nhưng cường chế đó cần có tiền đề là **lý niệm được chia sẻ chung** (理念の共有を前提とした強制かどうか).","lienKetJP":"教育＝大人としてふさわしさへ育てる営み → それは必然的に強制を伴う → しかし、理念の共有があるかどうかが重要","lienKetVI":"Giáo dục = công việc nuôi dạy trẻ thành người phù hợp xã hội → tất yếu đi kèm với cường chế → nhưng quan trọng là cường chế đó có tiền đề chia sẻ lý niệm chung hay không","correct":{"jp":"教育は**強制から自由ではなく**、その強制は**教育理念の共有が前提**となる","vi":"Khớp đúng kết luận: giáo dục không thoát khỏi cường chế, nhưng cường chế đó cần dựa trên việc chia sẻ lý niệm chung."},"wrong":[{"key":"A","jp":"教育は社会の秩序に**縛られない主体的な判断力**を養うものだ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — tác giả khẳng định giáo dục KHÔNG thoát khỏi cường chế, không phải 'tự do khỏi trật tự xã hội'."},{"key":"B","jp":"教育は社会のあり方を**批判的に検討**できる能力を育てるものだ","trap":"bẫy mọi người","vi":"Không có trong bài — đây là quan điểm tự thêm về 'tư duy phản biện', không phải kết luận của tác giả."},{"key":"D","jp":"教育は強制から自由ではなく、社会の**有力な教育観を受け入れざるをえない**","trap":"bẫy ngược nghĩa","vi":"Gần đúng nhưng sai chi tiết quan trọng — tác giả nhấn mạnh CẦN CÓ sự chia sẻ lý niệm (共有が前提), không phải 'bắt buộc chấp nhận quan điểm giáo dục có thế lực'."}]}],"Mon10-7":[{"huongTuDuy":"①意表をついた連鎖反応 minh họa bằng ví dụ A/B/C/D — cần xác định đúng vai trò từng ký hiệu trong chuỗi quan hệ.","chotY":"「Aなる害虫を除去…Bなる作物が虫害をまぬかれた。しかしその結果、おなじく**Aによって食い殺されていたCやD**の種属が、抑制因子をとりのけられて爆発的に増加し、あらたな害虫となって**Bにおそいかかる**」.","lienKetJP":"Aを除去してBを守る → しかしAに食われていたC・Dが爆発的に増加 → C・DがBを襲う（＝意表をついた連鎖反応）","lienKetVI":"Diệt A để bảo vệ B → nhưng C, D vốn từng bị A ăn nay bùng nổ → C, D quay sang tấn công B (= phản ứng dây chuyền bất ngờ)","correct":{"jp":"BをおそうAを除去した結果、**Aに食い殺されていたCやD**が**Bをおそうように**なる","vi":"Khớp đúng chuỗi quan hệ: diệt A (kẻ thù B) → C,D (từng bị A ăn) bùng nổ → tấn công B."},"wrong":[{"key":"A","jp":"BをおそうAを除去した結果、**あらたな強いA**が発生してCやDをおそうようになる","trap":"bẫy ngược nghĩa","vi":"Sai hoàn toàn vai trò — không có 'A mới mạnh hơn' xuất hiện, mà là C,D tăng vọt."},{"key":"C","jp":"BをおそうCやDを除去した結果、**あらたなA**が増加してBをおそうようになる","trap":"bẫy ngược nghĩa","vi":"Đảo ngược vai trò các ký hiệu — chính A mới là đối tượng bị loại bỏ ban đầu, không phải C,D."},{"key":"D","jp":"BをおそうCやDを除去した結果、**CやDに食い殺されていたA**がBをおそうようになる","trap":"bẫy ngược nghĩa","vi":"Đảo ngược hoàn toàn quan hệ săn mồi giữa các loài so với bài gốc."}]},{"huongTuDuy":"②このこと chỉ thị từ — tìm câu ngay trước nói về xu hướng sử dụng hóa chất.","chotY":"「ひたすらそれへの依存度を増し、つまり**量質ともに強大化する方向**へつっぱしった」— đây chính là nội dung ②このこと.","lienKetJP":"化学薬品が開発される → 依存度を増す → 量質ともに強大化する方向へつっぱしる（＝②このこと）","lienKetVI":"Hóa chất được phát triển → mức độ phụ thuộc tăng → cả lượng và chất ngày càng tăng mạnh (= '②điều này')","correct":{"jp":"化学薬品の**量と質**の**強大化**","vi":"Khớp trực tiếp với 「量質ともに強大化する方向」."},"wrong":[{"key":"A","jp":"化学薬品の**開発**","trap":"bẫy chi tiết phụ","vi":"Chỉ là bước khởi đầu (いったん開発されてこのかた), không phải nội dung của ②このこと."},{"key":"B","jp":"化学薬品の**有用性**","trap":"bẫy mọi người","vi":"Không có trong câu gốc — tự thêm khái niệm 'tính hữu dụng'."},{"key":"C","jp":"化学薬品の**無効性**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói về sự tăng cường sử dụng, không phải mất hiệu quả."}]},{"huongTuDuy":"③最初の出発点 — cần đọc đoạn cuối bài để xác định mốc lịch sử đúng.","chotY":"「人間が今日のごとく高度文明をきずきえたのは、採集経済から脱して、**牧畜さらに農耕**という生産手段を発明したからである」+「公害の起原は…遠く**牧畜ないし農耕のはじまり**にさかのぼる」.","lienKetJP":"採集経済から脱却 → 牧畜・農耕を発明（＝土地を独占して使用）→ ③最初の出発点 → 公害の起原もここに遡る","lienKetVI":"Thoát khỏi kinh tế hái lượm → phát minh chăn nuôi/nông canh (= chiếm dụng đất đai) → '③điểm khởi đầu' → nguồn gốc ô nhiễm cũng bắt nguồn từ đây","correct":{"jp":"人間が**土地を牧場や田畑**として**使用しはじめた**ころ","vi":"Khớp đúng với 「牧畜さらに農耕という生産手段を発明した」「牧畜ないし農耕のはじまり」."},"wrong":[{"key":"A","jp":"人間が**採集活動**によって生活を営みはじめたころ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói '採集経済から脱して' (THOÁT KHỎI hái lượm), không phải bắt đầu từ đó."},{"key":"C","jp":"**企業に資本**が集まり、産業が発展しはじめたころ","trap":"bẫy chi tiết phụ","vi":"Đây là quan điểm SAI LẦM mà tác giả phê phán (一企業の責任に帰するには根が深すぎる), không phải điểm khởi đầu thật sự."},{"key":"D","jp":"**文明が高度化**し、工業が盛んになりはじめたころ","trap":"bẫy ngược nghĩa","vi":"Bài khẳng định rõ: nguồn gốc KHÔNG bắt đầu từ công nghiệp (工業とともにおきたのではなく), mà từ xa xưa hơn."}]},{"huongTuDuy":"Câu hỏi tổng kết nguyên nhân gốc rễ — bám vào đoạn cuối bài về việc loại bỏ sinh vật 'vô dụng'.","chotY":"「人間はそれらの生物群にたいし、**害獣・害鳥・害虫**あるいは雑草といった汚名を一方的にかぶせ、**強引に排除する**手段にでた」.","lienKetJP":"特定の土地を独占使用 → 利用目的にかなわない生物群を排除（害獣・害虫の汚名）→ 自然界のバランスがくずれる","lienKetVI":"Chiếm dụng đất đai cho mục đích riêng → loại bỏ sinh vật không phục vụ mục đích (gán mác 'sâu bệnh') → cân bằng tự nhiên bị phá vỡ","correct":{"jp":"人間が人間に**利用価値のない生物群**を**排除**してきたこと","vi":"Khớp đúng với 「汚名をかぶせ、強引に排除する」 — nguyên nhân cốt lõi là loại bỏ sinh vật không có giá trị sử dụng."},"wrong":[{"key":"A","jp":"人間が**生産手段**を発明したこと","trap":"bẫy chi tiết phụ","vi":"Đây là TIỀN ĐỀ (phát minh chăn nuôi/nông nghiệp), không phải nguyên nhân trực tiếp gây mất cân bằng."},{"key":"B","jp":"人間が**薬剤開発**のために各種生物群を利用してきたこと","trap":"bẫy chi tiết phụ","vi":"Hóa chất chỉ là VÍ DỤ minh họa ở đoạn đầu, không phải nguyên nhân gốc rễ mà bài kết luận."},{"key":"D","jp":"人間が人間以外の生物群の**存在を無視**してきたこと","trap":"bẫy chi tiết phụ","vi":"'Phớt lờ sự tồn tại' nhẹ hơn thực tế — bài nói rõ con người chủ động LOẠI BỎ (強引に排除), không chỉ đơn thuần phớt lờ."}]}],"Mon10-8":[{"huongTuDuy":"①何とも複雑な心境 — tìm nguyên nhân ở câu mở đầu mô tả định kiến chung về nghệ thuật.","chotY":"「芸術、文化などの名で呼ばれるものはどうしても、**現実の政治経済や社会生活に関わることがらとは切り離されたもの**と考えられることが多く」— bị xem là TÁCH BIỆT khỏi đời sống xã hội hiện thực.","lienKetJP":"芸術・文化＝現実生活と切り離されたものと思われがち → 「うらやましい」と言われる → ①複雑な心境","lienKetVI":"Nghệ thuật/văn hóa thường bị coi là tách biệt khỏi đời sống hiện thực → bị nói 'ghen tị' (vì nhàn rỗi) → tâm trạng phức tạp","correct":{"jp":"芸術や文化が**社会生活とは懸け離れている**と思われていること","vi":"Khớp trực tiếp với 「現実の政治経済や社会生活に関わることがらとは切り離されたもの」."},"wrong":[{"key":"A","jp":"芸術や文化の価値が現実生活で**高く評価されない**から","trap":"bẫy chi tiết phụ","vi":"Không chính xác — vấn đề không phải về MỨC ĐỘ đánh giá, mà là bị coi là TÁCH BIỆT khỏi đời sống."},{"key":"B","jp":"芸術や文化と社会生活との関係が**希薄になっていく**から","trap":"bẫy chi tiết phụ","vi":"'Ngày càng nhạt dần theo thời gian' không khớp — bài nói đây là một ĐỊNH KIẾN có sẵn, không phải quá trình."},{"key":"C","jp":"芸術や文化の**研究が現実生活に役立たない**と思われているから","trap":"bẫy chi tiết phụ","vi":"Hẹp hơn ý gốc — bài nói về cả LĨNH VỰC nghệ thuật/văn hóa nói chung, không chỉ riêng việc nghiên cứu có ích hay không."}]},{"huongTuDuy":"Câu hỏi về quan điểm của các nhà nghiên cứu âm nhạc GẦN ĐÂY — cần đối lập với quan điểm cũ (純粋な音楽).","chotY":"「政治や社会の話と切り離して文化が論じられるなどということが**幻想**である」「音楽研究者の中にも…**純粋な「音楽そのもの」**…と素朴に信じているような人は、誰もいないだろう」.","lienKetJP":"コペルニクス的転回（考え方が根本的に変化）→ 純粋な音楽という幻想が暴かれる → 音楽は政治・社会と深く関わっている","lienKetVI":"Bước ngoặt nhận thức căn bản → ảo tưởng về 'âm nhạc thuần túy' bị vạch trần → âm nhạc gắn sâu với chính trị-xã hội","correct":{"jp":"**政治や社会**に深く**関わっている**","vi":"Khớp đúng quan điểm hiện đại: phủ định hoàn toàn ý tưởng 'âm nhạc thuần túy tách biệt'."},"wrong":[{"key":"A","jp":"社会の状況が**悪化したとき**に最も**必要とされる**","trap":"bẫy chi tiết phụ","vi":"Đây là quan điểm 'ốc đảo trốn tránh đời thực' ở đoạn đầu — không phải quan điểm của nhà nghiên cứu âm nhạc gần đây."},{"key":"B","jp":"ほかの芸術や文化と**同等には論じられない**","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý so sánh giữa các loại hình nghệ thuật."},{"key":"C","jp":"現実生活と切り離した**純粋なもの**である","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — đây chính là 'ảo tưởng' (幻想) mà bài phủ định."}]},{"huongTuDuy":"②皮肉なこと — nghịch lý giữa người TRONG ngành và NGOÀI ngành âm nhạc.","chotY":"「音楽研究の世界の**外側にいる人**のほうが、音楽を**「純粋」な形で囲い込みたがっている**ように思われるのは②皮肉なことだ」.","lienKetJP":"音楽研究者の意識は変化（音楽＝社会と関わる）→ しかし外側の人ほど「純粋」を求めたがる → ②皮肉","lienKetVI":"Nhà nghiên cứu âm nhạc đã thay đổi nhận thức → nhưng người NGOÀI ngành lại càng muốn giữ âm nhạc 'thuần túy' → nghịch lý","correct":{"jp":"音楽研究者**以外の人**の方が、音楽を**特別なもの**としたがっていること","vi":"Khớp đúng nghịch lý: người ngoài ngành lại cố giữ quan niệm cũ về âm nhạc 'thuần túy/đặc biệt'."},"wrong":[{"key":"A","jp":"音楽研究者以外の人の方が、音楽について、**最先端の議論**を従っていること","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói người ngoài ngành dùng dữ liệu CŨ (30年前の音楽研究), không phải tối tân."},{"key":"C","jp":"音楽研究者以外の人の方が、音楽を**純粋に楽しんでいる**こと","trap":"bẫy chi tiết phụ","vi":"'Thưởng thức thuần túy' khác với 'muốn giữ âm nhạc ở dạng thuần túy' — nhầm sắc thái."},{"key":"D","jp":"音楽研究者以外の人の方が、音楽を**よくわかっている**こと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài chỉ ra người ngoài ngành dùng cách nghĩ LẠC HẬU, không phải hiểu rõ hơn."}]},{"huongTuDuy":"Câu hỏi tổng kết — bám vào câu kết bài về vấn đề 'phát tín' (発信).","chotY":"「われわれの**発信が不足**しているために、その**面白さを十分に伝え切れていない**。そんな気がするのである」.","lienKetJP":"音楽研究の内実は大きく変化 → しかし発信が不足 → 面白さが十分に伝わっていない","lienKetVI":"Nội dung nghiên cứu âm nhạc đã thay đổi nhiều → nhưng việc truyền tải/phát tín còn thiếu → sự thú vị chưa được truyền đạt đầy đủ","correct":{"jp":"音楽研究の**成果**をこれまで以上に**発信**することが求められている","vi":"Khớp trực tiếp với câu kết: 発信が不足、十分に伝え切れていない."},"wrong":[{"key":"A","jp":"音楽の持つ**普遍的な価値**を社会によりわかりやすく伝えることが課題だ","trap":"bẫy chi tiết phụ","vi":"'Giá trị phổ quát' không phải trọng tâm — bài nói về việc truyền tải THÀNH QUẢ nghiên cứu cụ thể."},{"key":"C","jp":"**最先端の音楽研究**について議論していくことが重要である","trap":"bẫy chi tiết phụ","vi":"Không phải về việc 'thảo luận học thuật' mà về việc PHÁT TÍN ra bên ngoài ngành."},{"key":"D","jp":"音楽に対する**意識を変えて**新たな研究に取り組むべきだ","trap":"bẫy ngược nghĩa","vi":"Bài nói rõ ý thức người NGHIÊN CỨU đã thay đổi rồi (意識も変わり) — vấn đề còn lại là truyền tả
