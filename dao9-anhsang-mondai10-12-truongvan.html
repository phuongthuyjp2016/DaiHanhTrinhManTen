nh: quan trọng là SẮP XẾP + truyền tải thông tin có CHIẾN LƯỢC, có chủ đích rõ ràng. ✅D."}]},{"source":"Mon12","bai":7,"date":"07/2013","title":"Mon12 - Bài 7 (07/2013)","passage":"私もかつて一個の子供であったが、親との「対話」など別にのぞまなかったように思う。もし親\nの方が「対話」をしかけてきたら、照れくさいような、歯の浮くような (注1) 気持だばしただろう。少なく\nとも、中学生のあたりからは、そうであった。私は特別反抗的な子供ではなかったが、親と「対話」な\nどしたって、本当の話はできない、とごく自然に承知していたように思う。\nといって、親とのつながりを、まったくのぞんでいなかったわけではない。しかし、それは [対\n話] などという正面きったもの (注2) ではなく、言葉としてはほとんど意味をなさないような交流があれ\nば、充分だった。つまり、家の中で顔を合わせて、黙って顔をそむけられては、どこかで寂しいような\n見捨てられたような気持だばしたが、「お」「やってるか」ぐらいのやりとりがあれば、①気持は安定し\nていたのである。\nそれ以上親が気をつかって「このごろ音楽はどんなもんがはやっているんだ?」などと聞いてきたら、\n無理してるなあ、と思うし、そんな必要ないのになあ、と思うし、答えるのがすごく億劫だったろう、と\n思う。\n親とは通じない部分を、どんどん持つことによって、子供は自分の世界をつくっていくのであ\nる。不分明な(注3)ところが多いからといって親が不安におちいることはない、と思う。\n「なにを考えているか、なにをしているか分らない」部分が増えていくことで、子供は成長しているの\nだ。そこへ、いちいち親が音をつっこみ「一緒に悩み、一緒に考えよう」などとすることは、子供にとっ\nては、ひどくわずらわしいことだし、親が加わることで当面の局面はいい方向へ転換するとしても、②\n長い目で見れば、あまりいい影響を残さない、というように思う。\n(中略)\nでは、どうしたらいいか、というと、原則的には親は子供の内面については、ほうっておくしか\nないのだ。理解しようとしたり、いわんや (注4) 共感しようとしたり一緒に悩もうとしたりしてもむだなの\nだと思う。\n子供との距離が、刻々ひらいていくことに堪えるしかないのだ。そして、その距離をリアルにとらえて\nいる親は、子供にとって魅力的だと思う。\nそうした親は、子供を理解しようとしたり、一緒に悩もうとしたりしない。そういうことができない\nことの悲しさ、寂しさ、情けなさを胸におさめて、子供と対する。いわば「他人」として対する。「親切な\n他人」として対する。そして、その節度を保てるということが、子供への愛情になっている。というような\n親でありたい。と少なくとも私は思っている。\n(山田太一 『誰かへの手紙のように』による)\n(注1) 歯の浮くような : ここでは、なんとなく落ち着かない\n(注2) 正面きったもの : ここでは、きちんとしたもの\n(注3) 不分明な : はっきりしない\n(注4) いわんや : まして","questions":[{"q":"中学生のころの筆者の親に対する態度はどのようなものだったか。","options":["話らしい話はしようとしなかった。","話しかけられないように顔を合わせなかった。","親を寂しがらせないように気をつかっていた。","言葉として意味をなさないやりとりを避けていた。"],"answer":0,"explain":"Tuổi trung học, tác giả KHÔNG muốn nói chuyện thực sự với cha mẹ (本当の話はできない). ✅A."},{"q":"①気持は安定していたとあるが、なぜか。","options":["親と時々「対話」による交流が持てたから","親が「対話」をのぞんでいることが分かったから","親が自分を気にかけていることを確認できたから","親が自分のことを理解していると感じたから"],"answer":2,"explain":"①Tâm trạng ổn định chỉ cần: 1 câu hỏi đơn giản 'có gì không?' cũng đủ biết cha mẹ vẫn QUAN TÂM đến mình. ✅C."},{"q":"②長い目で見れば、あまりいい影響を残さないとあるが、なぜか。","options":["親が不安な気持でアドバイスすると、子供の不安も増すから","親の価値観によるアドバイスは、子供にとってあまり役に立たないから","親が子供の世界に入ろうとすると、子供は心を半ざしてしまうから","親が子供にかかわりすぎると、子供は自分の世界をつくりにくくなるから"],"answer":3,"explain":"②Ảnh hưởng xấu lâu dài: cha mẹ can thiệp quá nhiều → con KHÓ tạo thế giới riêng của bản thân (自分の世界をつくりにくくなる). ✅D."},{"q":"親は子供に対してどうあるべきだと、筆者は考えているか。","options":["子供との意思不通を図り、交流を深める。","子供との距離を受け入れ、成長を見守る。","子供の気持を理解し、愛情を言葉にする。","子供の悩みを共有し、かつ適度な距離を保つ。"],"answer":1,"explain":"Cha mẹ nên: chấp nhận khoảng cách, theo dõi con TRƯỞNG THÀNH (距離を受け入れ、成長を見守る). ✅B."}]},{"source":"Mon12","bai":8,"date":"12/2013","title":"Mon12 - Bài 8 (12/2013)","passage":"「目を見て話す」この秘訣を教えてくれたのは、まだ小さかった頃の娘でした。\n「外から帰ったら、手を洗いなさい」\n「ごちそうさまを言いなさい」\n(中略) どんなに声に威厳を込めたつもりでも、新聞をよみながらだと、まるでだめ。\n「お父さんはこういっているけど、手を洗うっていうのは、別に大事なことじゃないんだな。」\nきちんと目を見ていないと、子どもはたちまちそう判断してしまいます。よそ見をしながら口\nやかましく繰り返しても、①「ごちそうさま」を言うようにはならないのです。目を見て話すことは、分\nかり合い、メッセージを伝え、コミュニケーションをよくする秘訣。これは子供に限ったことではありま\nせん。 仕事でも家庭でも、すべての場において有効です。\n大人になると、ぎくしゃくすることは頻繁にあります。\n環境も価値観も考え方や違う人たちの集まりである以上、意見が食い違ったり、誤解が生\nじてトラブルになることは珍しくありません。\n「じっくり話し合えば、ちゃんと分かり合える」というのは、僕の見たところ、残念ながら理想\n論。どちらかが妥協したり、お互いがちょっと意見を曲げたりして合わせているだけで、 1 0 0パー\nセントの解決などありえないのが現実です。\nあげくの果てに(注)「話しても無駄だし、まだ同じことの繰り返しか」とうんざりし、コミュニ\nケーションをあきらめてしまう一ほうっておくとこんな事態に陥ることも、珍しくはありません。\nそれでもコミュニケーションを諦めたくないと思ったとき、僕はこの秘訣を思い出しました。\nいくら意見が食い違っても、どんなにトラブルが燃え上がっても、必ず相手の目を見て話をすると\nいうことを考え方がまるで合わず、最後まで言い分は平行線をたどるような議論でも、相手の目を\n離さなければ、不思議なことに相手に尊敬の念が湧いてきます。たとえ「この人の言っていること\nは、間違っている ! 」 と思っていても、相手の目を見ていれば、「その人の人間性」に対しては、別\nの気持ちを抱くようになります。意見は認められなくても、人としては認められるということです。\n言い合っても目と目を見つめ合っていれば、不思議な一体感すら生まれます。結果として\n解決には到らなくても、悪い方向には向かわない。これだけは、何度も試した僕の保証付きです。\n疲れていたり、へこんでいたりすると、人は目を見て話すことができません。そして下を向い\nていればいるほど、よくない事態が悪化します。\nさあ、洗い物をしながら大事な話をするのはやめましょう。パソコンから顔を上げて、まっす\nぐ目を見て話しましょう。理解できない相手でも、受け入れられない相手でも、この秘訣を知ってい\nれば、②何か別の関係は生まれるはずです。\n(松浦弥大郎「あたらしいあたりまえ。人暮らしの中の工夫と発見ノート2」による)\n(注) あげくの果てに : 結局","questions":[{"q":"子供は、①「ごちそうさま」を言うようにはならないとあるが、なぜか。","options":["親が手本を見せないとわからないから。","親がやかましく言うとかえって逆効果になるから。","その言葉を言うことが習慣になっていないから。","その言葉が必要だという親の気持ちが伝わらないから。"],"answer":3,"explain":"①Con không nói 'cảm ơn bữa ăn' vì: không nhìn vào mắt → con KHÔNG cảm nhận được sự quan trọng cha mẹ truyền đạt (気持ちが伝わらない). ✅D."},{"q":"大人同士の人間関係について、筆者はどのように述べているか。","options":["話し合いを重ねても、お互いを理解できないことがある。","お互いを理解するためには、最後まで議論することが必要だ。","話し合いの場で誤解をなくすには、お互いが妥協しなければならない。","コミュニケーションを諦めると、トラブルになることも珍しくない。"],"answer":0,"explain":"Quan hệ người lớn: dù nói chuyện nhiều vẫn có lúc KHÔNG thể hiểu nhau hoàn toàn (100%の解決などありえない). ✅A."},{"q":"②何か別の関係が生まれるとあるが、どういうことか。","options":["相手の人間性を認めるようになる。","相手の意見を容認できるようになる。","相手の態度を受け入れるようになる。","相手の価値観を理解できるようになる。"],"answer":0,"explain":"②'Mối quan hệ khác' = dù bất đồng ý kiến, vẫn CÔNG NHẬN nhân cách của đối phương (人としては認められる). ✅A."},{"q":"この文章で筆者が言いたいことは何か。","options":["問題を解決するためには、相手の目を見て理解できるまで話し合えばいい。","コミュニケーションのためには、相手の目を見て話すことが大切である。","相手に誤解されないためには、目を見てコミュニケーションをすればいい。","自分を理解してもらうには、目を見て繰り返し話すことが大切である。"],"answer":1,"explain":"Ý chính: nhìn vào mắt khi nói chuyện là CHÌA KHÓA của giao tiếp. ✅B."}]},{"source":"Mon12","bai":9,"date":"07/2014","title":"Mon12 - Bài 9 (07/2014)","passage":"現代は、「必要は発明の母」となった時代である。あるものが発明されると、企業はさまざまな\n余分の機能をあたかも必要不可欠とばかり付加して製品を売り込もうとし、人々はその機能がいかに\nも前から必要であったかのごとく錯覚して購入するからだ。発明が欲望を刺激し、欲望が人々を消\n費に走らせ、消費が新たな必要性という幻想を生み出すのである。その結果、本来必要でなかった\nものにまで飢餓感を募らせ、無限に便利さを追い求めるという悪循環に陥る。\nこのように企業の戦略と人々の欲望が結びついて、ひたすら「幸福」を求めようとする構造が\n①現代という時代を象徴している。ケータイがその典型である。\nそんな時代に「幸福」を考えるとすれば、この欲望の連鎖をどこかで断ち切るより仕方がない。\nいや、発明というような新技術には目を向けず、むしろそれらと縁を切って積極的に時代遅れになる\nということに「幸福」は求められるのではないだろうか。テレビは置かずにCDでモーツァルトや座語を\n開き、パソコンはインターネットに手を出さずワープロ機能だけにする。クルマは持たずに公共交通\n機関のみを使う。ケータイは家族にしか番号を知らせない。欲望を他者との関係に求めず、自分の\n内部からの声を汲み上げ、何かを創り出すことのみに時間を使う、そんな生活にこそ「幸福」がありそ\nうな気がする。\nむろん、そんな修道僧 (注1) のような生き方は現代では②不可能である。電子メールでは誰と\nでも簡単につながって対話できる。インターネットで買い物をし、ブログ (注2) で自分の意見が自由\nに出せるのは新しいテクノロジーがあってこそである。テレビからの情報は日常会話に欠かせない\nし、電話での長話も楽しい。クルマがあればいつでも好きな場所に行ける。パソコンもテレビもケータ\nイもクルマもない生活は考えられず、これら文明の利器 (注3) は私たちを誘引して止まない (注4) の\nだ。③そこに「幸福」はないと実は誰もが知っていても、便利さと効率性を棄てきれないのも私たちな\nのである。とすると、どこかで妥協することを考えねばならない。断ち切るところと利用するところを使\nい分けるのである。私のやり方は比較的単純で、余分な機器を持たず、持っても時間を区切るか場\n所を限るかして欲望を抑制することだ。\n(中略)\nそのようにして生み出された時間を自分のために使うのだ。それが私の「幸福」への接近法な\nのである。\n(池内了『生きのびるための科学』 による)\n(注1) 修道僧 : 終行中の僧\n(注2) ブログ : 日記形式のホームページ\n(注3) 利器 : 便利な器具\n(注4) 誘引して止まない : ここでは、絶えず引き付けている","questions":[{"q":"①現代という時代とは、どのような時代だと筆者は述べているか。","options":["人々が必要性を感じているものを、企業がすぐに察知し製品化している。","人々の購買欲にこたえるために、企業が必要以上のものを開発している。","企業の多くの発明によって、人々の便利な生活が支えられている。","企業が次々に新製品を売り込むことで、人々の欲望が膨れ上がっている。"],"answer":3,"explain":"①'Thời đại hiện nay': doanh nghiệp liên tục bán sản phẩm mới → lòng ham muốn con người ngày càng PHỒNG TO (欲望が膨れ上がっている). ✅D."},{"q":"②不可能であるとあるが、なぜか。","options":["人は外部の情報なしでは生きられないものだから","人は他者とのつながりを径てきれないものだから","人は不便で手問のかかる生活に戻れなくなっているから","人は新しいテクノロジーがよいものだと思い込んでいるから"],"answer":2,"explain":"②'Không thể' vì: con người KHÔNG THỂ trở lại cuộc sống bất tiện, nhiều công sức nữa (不便で手間のかかる生活に戻れなくなっている). ✅C."},{"q":"そことは何を指しているか。","options":["古い機器を棄てられない生活","便利な機器に半まれた生活","新しい機器に頼らない生活","必要な機器だけを使う生活"],"answer":1,"explain":"③'そこ' = cuộc sống bị BAO BỌC bởi thiết bị tiện ích (便利な機器に囲まれた生活). ✅B."},{"q":"筆者は、どのようにして 「幸福」を得ようとしているか。","options":["欲望を抑制して、自身が本当に気に入った機器だけを手に入れる。","機器とのかかわりを制限して得られた時間を、自身のために使う。","便利さや効率性を放棄して、自身が本当に必要なものを見極める。","ものに対する執着心を棄てて、自身のための時間を生み出す。"],"answer":1,"explain":"Cách đạt 'hạnh phúc': HẠN CHẾ liên hệ với thiết bị, dùng thời gian có được cho CHÍNH MÌNH. ✅B."}]},{"source":"Mon12","bai":10,"date":"12/2014","title":"Mon12 - Bài 10 (12/2014)","passage":"本というのは、人間と同じようなものだ。一律の価値によって優劣を決めることはできない。\n人気者がいるのと同じように、ベストセラーがある。嫌われ者がいるように、誰からも手に取られない\n本もある。だが、どれもがそれぞれの価値を持っている。それを求めている人の手に求めていると\nきに渡れば、それは良書になる。\nそれゆえ、私はインターネットの書評サイトなどで、まるで自分を神であるかのように本の優\n劣を断定しているものには激しい抵抗を感じる。もちろん、書評をするのは悪いことではない。本を\n批判したりほめたりするのも、もちろん大事なことだ。だが、あくまでもそれは、その人の知識と関心\nと人柄によっての判断でしかない。つい神の立場でものを言いたくなる気持ちはわからないでもな\nいが、それはあまりに傲慢というものだろう。\n私の本も、インターネットの書評サイトでかなり叩かれているものがある。それはそれでやむ\nをえないと思っている。ある程度売れると、それをけなしたがる人間がいるものだ。本をけなすと、\n自分が著者よりも偉くなったような気がするのだろう。私自身も本を書くようになる前、いや、正直に\n言うとある程度売れる本を出すようになる前、他人の本をずいぶんけなしたものだ。\nただきわめて心外なのは、ないものねだりをしている評があまりに多いことだ。たとえば、私\nはある参考書を出している。その趣旨としていることは、「大学の小論文試験に何とか合格できるだ\nけのレベルの小論文が書けるようにするため、最低限これだけの知識は持っていてほしい」という\n知識を整理した参考書だ。だから、私はその本の中では、敢えて難しいことは書いていない。とこ\nろが、その参考書を酷評する (注) 書評がある。そして、その評の中には「この本を読んでも、かろう\nじて合格するくらいの力しかつかない」と書かれている。\n私は、まさしくかろうじて合格するくらいの力をつけるためにその本を書いているのだ。かろ\nうじて合格すれば、その本は最高の良書だろう。私がそのような意味で敢えてカットしたことを取り\n上げて、それが書かれていないからと批判されても、こちらとしては困ってしまう。\nそのような身勝手な書評がなんと多いことか。知識のある人間が入門書を幼稚すぎるとけ\nなし、知識のない人間が専門書をわかりにくいとけなす。しかし、それは単に自分の背丈にあって\nいない本を求めただけのことに過ぎない。きちんと自分の背丈にあった本を探して買うのが、読者\nの務めだと、私は思う。\n本について語るからには、あらゆる本に愛情を持つべきだと私は考えている。そうしてこ\nそ、本を批判する資格を持つと思うのだ。\n(樋口祐一『差がつく読書』 による)\n(注) 酷評する : ひどく厳しい評価を下す","questions":[{"q":"筆者は、どのような書評が傲慢だと感じているか。","options":["大した理由づけもなく優劣を断定したもの","優れている点を決して認めようとしないもの","自身に知識があるかのように見せかけたもの","自身の判断がすべてであるかのように評価したもの"],"answer":3,"explain":"Phê bình ngạo mạn: đánh giá như thể PHÁN ĐOÁN CỦA MÌNH là tuyệt đối đúng, duy nhất (神の立場で本の優劣を断定). ✅D."},{"q":"ある参考書について、筆者が心外だと感じたのはどのような書評か。","options":["どうにか合格できる程度を目指したのに、それ以上の内容が必要だと評判したもの","合格に必要な最低限の知識を整理したものなのに、合格は不可能だと批判したもの","敢えて難しいことは書いていないのに、それでもわかりにくいと批判したもの","難しい試験でも合格できるように書いたのに、それでも不十分だと挑判したもの"],"answer":0,"explain":"Tác giả thấy bất công: tác giả nhằm mức 'đủ đậu' nhưng người phê bình lại chê cần NHIỀU nội dung hơn — đúng ngược chủ đích của sách. ✅A."},{"q":"筆者によると、本が良書と言えるのはどのような場合か。","options":["書評で強く批判されない場合","多くの人が価値を認めている場合","求める人に本の趣旨が理解しやすい場合","求める人のレベルや目的にあっている場合"],"answer":3,"explain":"Sách hay = PHÙ HỢP với trình độ/mục đích người cần (自分の背丈にあった本). ✅D."},{"q":"本を批評する人に対して、筆者が言いたいことは何か。","options":["著者のあらゆる本を読むべきだ。","極端に否定的な評価は避けるべきだ。","それぞれの本の存在価値を認めるべきだ。","どのような本にも先入観なしで接するべきだ。"],"answer":2,"explain":"Ý chính: nên công nhận GIÁ TRỊ TỒN TẠI riêng của từng cuốn sách (あらゆる本に愛情を持つべき). ✅C."}]},{"source":"Mon12","bai":11,"date":"07/2015","title":"Mon12 - Bài 11 (07/2015)","passage":"たとえば、あなたが会社の中で企画部門に属し、①目標値を設定する仕事を与えられたと\nする。ここでは達成不可能な目標を設定したところで意味がないとされるから、外部環境や内部の状\n況を含め、諸々の要素を検討することになるだろう。その上で現状から考えて、達成可能かつできる\n限り高い目標を探ることになる。\nこのとき、あなたが今後変わりうる外部環境を完璧に予想し、会社内部のすべてを完全に把\n握している存在であれば、目標を設定する仕事はこの上なく素晴らしいものだ。社員全員がこれに\n向かって全力を出せばそれでいいことになる。\nしかし、実際にはそんなことはありえない。外部環境は予想もつかない方向に変わりうるし、\n社内では、上からの目が届かないところでアイデアを隠し持った人が必ずいる。固定化した目標は、\n不確定要素にまったく対応できないのである。しかも、こうした事前に予想ができない要素にこそ、\n大きなビジネスチャンスが転がっている。\nだから目標を設定するならば、変化に対応する中で、各人の創意工夫の果てにやっと達成\nされるようなものでなければならない。しかし、事前にこれらをすべて盛り込むことはできるはずもな\nいから、何となく納得感のありそうな落とし所(注1)を探すことになる。大人はこの落とし所という言葉\nが大好きなのだが、こんなものに意味があるはずもないのだ。これではすべての可能性を引き出す\nことができないのである。\nこれは個人としても同じことである。 (中略)\n試合直後の力士にインタビューをすれば、「明日の一戦をまた頑張るだけ」と答えが返ってく\nるだろう。ゴルフツアーの最終日を明日に控えたプロ選手でも、翌日のスコア目標などはロにしな\nい。そんなことを考え始めれば、プレイが崩れ始めることを知っているからだ。\nそれにもかかわらず、なぜかビジネスになると、途端に誰もが最終ゴールを決めようとする。\nスポーツよりも遥かに不確定な要素が多いにもかかわらず、目標によって自分たちを縛りつけようと\nするのである。これにはかなり②違和感を覚える。\nどんなことでも、周囲の状況はどんどん変わることが当たり前である。それにもかかわらず、\n自分だけ変わらないのはおかしい。過去に立てた目標によって自分を窮屈な存在にしてはいけな\nいのである。もしどうしても目標を立てたいのであれば、ほとんど実現不可能なくらいの大きな目標を\n持つべきだろう。しかし、これ自体はその達成方法を考えるのに役には立たない。自分が持つ可能\n性を大事にしたいのであれば、目の前のことだけに投入(注2)し、何かしらの(注3)変化を察知するに\nつけ、次のベストを探すというスタンスを保持することが重要である。\n(成毛眞『大人げない大人になれ ! 』による)\n(注1) 落とし所 : 妥協点 (注2) 投入 : ここでは、集中する (注3) 何かしらの : 何らかの","questions":[{"q":"①且標値を設定する仕事では、どのような目標を設定しようとするか。","options":["外部環境や内部の状況の変化を完璧に予測した目標","現在の状況から見て無理なく達成される目標","成し遂げられる範囲の中で最も高い目標","達成が難しくても取り組む価値のある目標"],"answer":2,"explain":"Mục tiêu kinh doanh nên đặt: CAO NHẤT trong phạm vi khả thi (達成可能かつできる限り高い目標). ✅C."},{"q":"筆者は、何がビジネスチャンスにつながると述べているか。","options":["創意工夫を生み出す社内環境","社員にとって納得感のある目標設定","社内外の不確定な変化に対する大胆な予想","社内に埋もれている発想や社外で起こる変化"],"answer":3,"explain":"Cơ hội kinh doanh đến từ: ý tưởng ẨN trong công ty + biến động ngoài KHÔNG dự đoán được (社内に埋もれている発想や社外で起こる変化). ✅D."},{"q":"②違和感を覚えるとあるが、どのようなことに違和感を覚えているか。","options":["不確定な要素が多いため目標を立てないこと","周囲の状況は変わるのに目標を固定すること","目標を立てたのにそれを口にしないこと","目標を立てたのにそれを変えなくてはならないこ"],"answer":1,"explain":"②Khó chịu vì: hoàn cảnh xung quanh luôn THAY ĐỔI nhưng mục tiêu lại bị CỐ ĐỊNH (周囲の状況は変わるのに目標を固定する). ✅B."},{"q":"とこの文章で筆者が言いたいことは何か。","options":["実現不可能なくらいの大きな目標を立てて達成に向けて努力すべきだ。","自分の可能性を大事にするためには、大きな目標を立てるべきではない。","自分が持つ可能が最大限に発揮できるような目標を探し続けることが重要だ。","目標を立てることに縛られず、目の前のことに最善の対応をすることが重要だ。"],"answer":3,"explain":"Ý chính: không bị ràng buộc bởi mục tiêu cũ, ỨNG BIẾN tốt nhất với hiện tại (目の前のことに最善の対応). ✅D."}]},{"source":"Mon12","bai":12,"date":"12/2015","title":"Mon12 - Bài 12 (12/2015)","passage":"山の風景画は、世の中にいくらでもある。日本画にしろ洋画にしろ、古今東西あまたの (注\n1) 画家たちが、その題材に「山」を選んでいる。モチーフとしての山の意味するものはさまざまだろ\nうが、個人的にはそれらに興味を惹かれることはなかった。\nなぜか。\n一般的な登山者が山を眺めたときの感慨は、おおむね似かよっている。それは、雄大さ、\n唆厳さ (注2) 、あるいは優しさといったステレオタイプな観点から山を賛美し、その風景を自分の心\nの展示箱に納めて「いい思い出」にしてしまう。そして、山策画や山岳写真の作家たちの多くもま\nた、似たようなイメージを印画紙やカンバスなどに再現して、狭い市場のなかで再生産している例\nが少なくない。\nだが、山に登る者の心に刻印 (注3き) される山の風景は本来限定的なものではなく、確定\nしえない動的な現象として記憶されてもよいのではないだろうか。見る者の心のなかで定着される\n山のイメージは、そしてその表現は、もっと多様であるべきだろう。\nつねに転変をくり返す「海」に対して、動かざるものの象徴として、「山」が引き合いに出され\nることもある。はたしてほんとうに山は動かないのか。 (中略)\n一登山者としてこう思う。山は動いている、と。それは、地殻 (注4) 変動や火山の噴火など\n大規模なものだけではない。 遠目には同じように見えても、風に吹かれて砂塵は舞い、山腹を覆う\n植物たちは陽光を浴びて茂り、渓流はその谷の深さを日々深く削り、刻一刻と変化しつづけてい\nる。そういった微細な物理的変貌、小さな生命たちの死滅と再生が瞬時も止まることのない現場\nが、「山」なのである。\n都市の風景は近代以降多様な都市論の対象となってきたが、本来、多様性に富んでいる\nはずの山という場所を表現するイメージが、なぜこれほどまでに単一的なのか。\nそれは、山というつねに転変する自然から、都市部の生活者の生活が乖離してしまったこ\nとに、原因を求めることができるかもしれない。山の変化に気づくほど山を観測していないから、そ\nの変化にも気づかない。\n何十年も山で暮らしてきたような画家でさえも、その表現は先述した域を出ることは稀だ。\n思うに、そういった者は都市生活者とは反対に、表現への憧れが先に立ち、山の実相 (注5) を表\n現しえていないのかもしれない。\n(志水哲也編『山と私の対話』 による)\n(注1) あまたの : 数多く刻の\n(注2) 唆厳さ : 厳しさ\n(注3) 刻印する : ここでは、 刻む\n(注4) 地殻 : 地球の表層部\n(注5) 実相 : 本当の姿","questions":[{"q":"個人的にはそれらに興味を惹かれることはなかったとあるが、なぜか。","options":["型にはまった見方で描かれた山の絵が多いから","一般的な登山者の視点で描かれた山の絵ではないから","思い出として残すために描かれた山の絵しかないから","自分の心の中にある風景と似たような山の絵ばかりだから"],"answer":0,"explain":"Tranh núi không hấp dẫn vì: thường vẽ theo cách nhìn RẬP KHUÔN, sáo mòn (ステレオタイプな観点). ✅A."},{"q":"筆者は山をどのようにとらえているか。","options":["山の変化は小さくても、心に残る感動は大きい。","山は同じように見えても、それぞれの個性がある。","山は一見変わらないようでも、変化しつづけている。","同じ山に面しても、山から受ける印象は毎回異なる。"],"answer":2,"explain":"Tác giả nhìn nhận núi: tưởng như không đổi nhưng THỰC RA luôn biến đổi liên tục (微細な物理的変貌...刻一刻と変化). ✅C."},{"q":"都市生活者と、何十年も山で暮らしてきたような画家について、筆者はどのように述べている か。","options":["いずれも山への憧れが強い。","いずれも山への興味が失われている。","いずれも山の見方が変化してきている。","いずれも山のイメージが固定化している。"],"answer":3,"explain":"Cả người thành thị và họa sĩ sống lâu ở núi: đều có hình ảnh núi CỐ ĐỊNH, rập khuôn (イメージが固定化している). ✅D."},{"q":"山の風景画について、筆者はどのように考えているか。","options":["山の姿を描くためには、その山の特徴を強調すべきだ。","山を多様に描くためには、画家は個性を発揮すべきだ。","山への思いは皆違うのだから、その表現も自由であるべきだ。","山の姿は単一ではないのだから、その表現も多様であるべきだ。"],"answer":3,"explain":"Ý chính: vì hình dáng núi KHÔNG đơn nhất nên cách biểu hiện cũng nên ĐA DẠNG. ✅D."}]},{"source":"Mon12","bai":13,"date":"07/2016","title":"Mon12 - Bài 13 (07/2016)","passage":"わたしは、暮らしや家族の中にある科学をテーマにして、雑誌に記事を書くことがありま\nす。料理の科学、生活の中にある器具のしくみなどを取りあげて、科学を専門としない人たちにも\n関心を持ってもらえるよう記事づくりを工夫します。そんなとき①編集者の注文はこうです。\n「一般の主婦の方々にとっつきやすくする (注1) ために、内容は科学のことであっても「科\n学」ということばは使わないでください。「科学」と聞いただけで引いてしまう (そのページを読むこと\nをやめてしまう) 人がけっこういますから」\nこれは、わたしにとってはむずかしい注文でもやることが多いのですが、編集者の言うこと\nは、一般の人に対する情報発信の心構えとして、現時点では適切と言うほかありません。「科学」と\nいうことばを使うか否かが大きな問題なのではありません。読者である「一般の人たち」も、発信す\nる側である「編集者」も、科学に対して距離を感じているということであり、それは、現在の「科学技\n術」と②「それを使う人たち」の関係を象徴しています。作る側、発信する側は、当然その内容を熟\n知し将来の方向性を提案しますが、それを使う側の人は与えられたものを十分に理解せず「買う」\nという行動だけで受け入れていると言いかえられます。\n(中略)\n技術、そして科学技術は、その時代に生きている人々によって求められ発展してきたもの\nであるはずですから、わたしたちはそれらの科学技術を使う主人公です。しかし、はたしてわたした\nちの科学技術に対する理解は、科学の発展とともに進んでいるでしょうか…?\nたとえば、あなたの周りで、「科学はむずかしいから」 と決めつけて、苦手だと思っている人\nはいませんか。あなた自身はどうでしょ う。科学的理論と実用化のレベルが複雑で高度なために、\n一握りの人たちにしかわからないむずかしいものになってしまっているのは事実です。\n専門家や技術者が作り出したものを、マニュアルの通りに使うことさえできれば、③そのしく\nみなどを知る必要はない、という人もいるかもしれません。しかし、そのような使い方では、供給する\n側から示された技術の「良い部分」しか見えません。 科学技術を提供する側からは「良い部分」し\nか聞かれないのだとしたら…。 それらを使う主人公であるわたしたちは、与えられる情報だけでは\nなく、科学的背景やしくみを少しでも知った上で、生活の中に取り入れるか、取り入れないのかを\n判断することが必要です。\n良いこと (ベネフィット) も悪いこと (リスク) も考えながら科学技術とつきあっていく、その第一歩は、\n「知ること」です。\n(佐倉純ノ古田ゆかりプリビング・サイエンス・ラボ「おはようからおやすみまでの科学」による)\n(注) とっつきやすくする : ここでは、受け入れられやすくする","questions":[{"q":"編集者の注文とあるが、編集者はなぜ注文したのか。","options":["読者が科学に苦手意識を持っていると考えているから","読者が科学の専門的なことばを理解できないと考えているから","読者が考える科学と暮らしの中の科学は違うと考えているから","読者が持っている科学のイメージがはっきりしないと考えているから"],"answer":0,"explain":"Biên tập viên yêu cầu tránh từ 'khoa học' vì nghĩ độc giả có TÂM LÝ SỢ khoa học (「科学」と聞くと引いてしまう). ✅A."},{"q":"②「それを使う人たち」について、筆者はどのように述べでいるか。","options":["科学技術は使っているうちに理解できると思っている。","科学技術を使ってはいるが、理解しているとは言えない。","科学技術を理解してはいるが、使いこなせていない。","科学技術を理解しているつもりで使っている。"],"answer":1,"explain":"②'Người sử dụng' khoa học: DÙNG công nghệ nhưng không hẳn HIỂU nó (使ってはいるが、理解しているとは言えない). ✅B."},{"q":"そのしくみなどを知る必要はないと考えることの問題点は何か。","options":["マニュアルがないと製品が使えないこと","マニュアル以外の使い方ができなくなること","供給する側の伝えたい情報が理解できないこと","供給する側に都合のいい情報しか得られないこと"],"answer":3,"explain":"Vấn đề khi không cần biết cơ chế: chỉ nhận được thông tin CÓ LỢI từ phía cung cấp (供給する側に都合のいい情報しか得られない). ✅D."},{"q":"筆者が言いたいことは何か。","options":["技術の知識を豊富に身につけることが大切だ。","科学技術をマニュアルに頼らず使いこなすことが大切だ。","科学技術を取り入れ、そのしくみを知ろうとすることが大切だ。","科学技術を知り、生活に取り入れるかどうかを判断することが大切だ。"],"answer":3,"explain":"Ý chính: cần HIỂU BIẾT khoa học để TỰ quyết định đưa vào đời sống hay không. ✅D."}]},{"source":"Mon12","bai":14,"date":"12/2016","title":"Mon12 - Bài 14 (12/2016)","passage":"建築の設計をやっていると様々な職人に出会う。大小を問わずどの現場でも一人や二人、主\n役を張れる (注1) 人がいる。そうした人に出会うのが、現場に通う楽しみのひとつだ。長い時間、図\n面にばかり接していると、現実を離れて思考が一人歩きすることがよくある。そんな時、彼らからもらう\n情報がかけがえのない (注2) ものであることが分かる。我々が作り出す図面は、線で描かれた抽象\n的な記号に過ぎない。彼らは物に触っている。経験則によって裏付けられた、物に近い、深くて確か\nな情報を持っている。\n図面は人間の頭の中だけで作り出されたものだ。それを現実の建物に移し替えるには、木や\n鉄やコンクリートといった、物から手によって直接に得られる情報が不可欠だ。頭で生み出されたも\nのは、思いこみや錯誤によって間違うことが多いからだ。\n今はコンピューターと情報通信の時代だ。それにともなって、手を動かす機会がどんどん少な\nくなってきている。建築の設計でもCAD (コンピューター利用設計) 化の勢いはすさまじい。 しかし、\nその図面は、設計の全体を把握しにくい。きれい過ぎて、何であれ、すべてうまくいっているように見\nえてしまう。手を経ずに、頭の中だけで作業が完結してしまっているからだろう。\nトレーシングペーパー (注3) に鉛筆で苦労をして描かれた旧来 (注4) の図面は、そこに描く人\nの感情が入っている。うまくいっていないところは消しゴムで消し、描き直して修正していく。 技術的\nに問題のあるところ、デザイン的にうまくいっていないところほど、線はにじみ、トレーシングペーパー\nは人の手の脂で汚れてくる。何回も描き直した個所は、しまいには擦り切れて穴が開いてしまうことも\nある。\n描いた当人の自信がなければ、鉛筆の線にもその迷いを見て取ることもできる。 慣れてくる\nと、図面上の線から、描いた人の経験的なレベルや人柄さえ分かるようになる。手書きの図面には、\nすてがたい様々な種類の情報が塗り込められている。均質な図面の向こう側に人の姿が見えにくい\n分、CADでは大きなリスクを見落とす可能性もある。\n手から遠いコンピューターの出現によって、リスクの所在をかぎ取ることが、旧来の経験則では\n難しくなってきている。これは設計に限ったことではないだろう。今情報通信とコンピューターはあら\nゆる分野に浸透し、社会全体を変えつつある。頭から生み出されたものが暴走している。リスクの所\n在が、より巨大で、見えにくくなった。\nどこかでそれを、生身の身体を持つ人間の側に引き戻す必要がある。手から得られる情報\nは、効率は悪いが、現実の世界をまさぐって (注5) 得られるものだ。その人の身体だけにとどまる固\n有に情報といってもよい。忘れられつつある手の行き場を考えるべきだろう。\n(内藤廣 『建築のはじまりに向かって』による)\n(注1) 主役を張る : ここでは、主要な役割を果たす\n(注2) かけがえのない : 他に代わりがないほど貴重な\n(注3) トレーシングペーパー : ここでは、設計図を描くための紙\n(注4) 旧来の : 昔からの\n(注5) まさぐる : 手探りをする","questions":[{"q":"そうした人に出会うのが、現場に通う楽しみのひとつだとあるが、なぜか。","options":["職人から得る情報で自分のやり方の正しさが確かめられるから","職人たちの経験に基づいた信頼できる情報が得られるから","様々な職人たちから建築設計の多様性が学べるから","経験豊かな職人たちの仕事ぶりが見られるから"],"answer":1,"explain":"Niềm vui gặp người thợ: thông tin đáng tin cậy dựa trên KINH NGHIỆM thực tế (経験則によって裏付けられた、深くて確かな情報). ✅B."},{"q":"鉛筆で描かれた図面について、筆者はどのように述べているか。","options":["設計の過程や描いた人に関する情報が得られる。","経験を積んで設計に自信のある人にしか描けない。","細部は分かりにくいが、全体は把握しやすい。","情報を読み取りにくいが、描いた人の感情がこもっている。"],"answer":0,"explain":"Bản vẽ tay: cho biết thông tin về QUÁ TRÌNH thiết kế + cả NGƯỜI vẽ (描いた人の経験的なレベルや人柄). ✅A."},{"q":"筆者は、コンピューターが社会にどのような影響を与えたと述べているか。","options":["多くの情報の中から必要な情報を選び出しにくくなった。","リスクの高い様々な種類の情報が池溢するようになった。","これまでに得られた経験則が社会で必要とされなくなった。","どこにどのようなリスクが潜んでいるか把握しにくくなった。"],"answer":3,"explain":"Ảnh hưởng máy tính (CAD): rủi ro trở nên KHÓ NHẬN BIẾT vị trí tiềm ẩn hơn (リスクの所在が見えにくくなった). ✅D."},{"q":"この文章で筆者が最も言いたいことは何か。","options":["コンピュータ化によるリスクを経験則によって回避すべきだ。","コンピューター化による効率重視の風湖を改めるべきだ。","手によってなされる仕事の伝統を守っていくべきだ。","手によってなされる仕事の価値を再認識すべきだ。"],"answer":3,"explain":"Ý chính: cần NHẬN THỨC LẠI giá trị công việc làm bằng tay (手によってなされる仕事の価値を再認識すべき). ✅D."}]},{"source":"Mon12","bai":15,"date":"07/2017","title":"Mon12 - Bài 15 (07/2017)","passage":"私は、科学が再び文化のみに寄与する営みを取り戻すべきと考えている。壁に飾られたピ\nカソの絵のように、なければないで済ませられるが、そこにあれば楽しい、なければ何か心の空白\nを感じてしまう、そんな「無用の用」としての科学である。 世の中に役立とうというような野心を捨て、\n自然と戯れ (注1) ながら自然の偉大さを学んでいく科学で良いのではないだろうか。 好奇心、探\n求心、美を求める心、想像する力、普遍性への憧れ、そのような人間の感性を最大限練磨 (注2)し\nて、人間の可能性を拡大する営みのことである。\nむろん、経済一辺倒の現代社会では、そんな原初的な科学は許されない。一般に文化の\n創造には金がかかる。ましてや科学は高価な実験器具やコンピューターを必要とするから一定の\n投資をしなければならず、そうすれば必ずその分の見返りが要求される。「文化より明日のコメを」と\nいう声も絶えることがない。社会もムダと思われるものに金を投ずるのを忌避 (注3き) するからだ。\nそれが「役に立つ」科学とならねばならない要因で、科学者もセールスマンのように次々に目新し\nい商品を用意して社会の要求に迎合していかねばならなくなる。それを逆手にとって、あたかも世\nの中を牛耳 (注4) っているかのように尊大に振舞う科学者すら合場するようになった。これほど社\n会に貢献しているのだから、もっと金をよこせ (注5) というわけである。金を通しての科学者と社会\nの網引き (注6) 状態と言えるだろうか。\nそれでいいのかと改めて考え直してみる必要がある。確かに科学には金がかかり、それに\nは社会の支持が欠かせない。「無用の用」にすらならないムダも多いだろう。 しかし、ときに科学は\n世界の見方を変える大きな力を秘めている。 事実、科学はその力によって自然観や世界観を一\n変させ、社会のありように大きな変化をもたらしてきた。社会への見返りとは、そのような概念や思\n想を提供する役目にあるのではないか。それは万に一つくらいの確率であるかもしれないが、科学\nの営み抜きにしては起こり得ない貢献でもる。むろん、天才の登場を必要とする場合が多いが、そ\nの陰には無数の無名の科学者がいたことを忘れてはならない。それらの積み上げがあってこそ天\n才も活躍できるのである。\n今必要なのは、「文化としての科学」を広く市民に伝えることであり、科学の楽しみを市民と\nともに共有することである。実際、本当のところ市民は「役に立つ科学」ではなく、「役に立たないけ\nれど知的なスリルを味わえる科学」を求めている。市民も知的冒険をしたいのだ。 (中略) 科学の行\n為は科学者という人間の営みだから、そこには数多くのエピソードがあり、成功も失敗もある。それ\nらも一緒に紡ぎ合わせることによって 「文化としての科学」が豊かになっていくのではないだろう\nか。それが結果的に市民に勇気や喜びを与えると信じている。\n(池内了『科学の限界』による)\n(注1) 戯れる : ここでは、触れ合う (注2) 練磨する : 鍛えて磨く\n(注3) 忌避する : 嫌って避ける (注4) 牛耳る : 思い通りに動かす\n(注5) よこせ : くれ (注6) 綱引き状態 : ここでは、引っ張り合い状態\n(注7) 紡ぎ合わせる : ここでは、組み合わせる","questions":[{"q":"筆者によると、原初的な科学とはどういうものか。","options":["一見無用と思われるものを、世の中に役立てようとするもの","人間の可能性を拡大するために、なくてはならないもの","自然の中で感性豊かに生きるために、自然を学ばうとするもの","自然の偉大さを学び、人間の感性を豊かにしていくもの"],"answer":3,"explain":"Khoa học nguyên thủy: học hỏi sự VĨ ĐẠI của tự nhiên, làm GIÀU cảm tính con người (自然の偉大さを学び、感性を最大限練磨). ✅D."},{"q":"それでいいのかと改めて考え直してみる必要があるとあるが、筆者は何を考え直してみる必要が あると述べているか。","options":["科学の営みの中に社会に寄与しないムダが多いこと","社会が科学に投資したなくなってきたこと","社会も科学者も科学を経済的観点からしか見ていないこと","社会も科学者も科学に見返りを求めるべきではないと考えていること"],"answer":2,"explain":"'Cần suy nghĩ lại': cả XÃ HỘI và NHÀ KHOA HỌC đều chỉ nhìn khoa học từ góc độ KINH TẾ (金を通しての網引き状態). ✅C."},{"q":"筆者は科学が社会にどのような貢献をしてきたと考えているか。","options":["無数の科学者の積み上げから天才を登場させてきた。","これまで主流とされてきたものの見方を履し変化をもたらした。","社会の要求する新しい商品を次々に提供してきた。","社会の役に立たないことにも価値があると人々に認識させてきた。"],"answer":1,"explain":"Đóng góp của khoa học cho xã hội: làm THAY ĐỔI cách nhìn chủ đạo trước đó về thế giới (自然観や世界観を一変させた). ✅B."},{"q":"筆者が言いたいことは何か。","options":["市民と科学の楽しみを共有することが「文化としての科学」の発展につながる。","市民が知的好奇心を高めあれば「文化としての科学」が豊かになる。","「文化としての科学」と「役に立つ科学」が共存することで社会が豊かになる。","「文化としての科学」とともに「役に立つ科学」 を市民に伝えることが必要だ。"],"answer":0,"explain":"Ý chính: CHIA SẺ niềm vui khoa học với công dân → phát triển 'khoa học văn hóa'. ✅A."}]},{"source":"Mon12","bai":16,"date":"12/2017","title":"Mon12 - Bài 16 (12/2017)","passage":"このところ、「○○倫理」という言葉をしばしば耳にする。マスコミでは、政治倫理、企業倫理、\nメディア倫理などといった言葉はおなじみのものだろう。そうした言葉は、なにか問題が起きたとき\nの掛け声のようなもので、空疎(くうそ)(注1)な常套句(じょうとうく)にすぎないのかもしれない。だが、\n漠然と、倫理といったものが必要だという気分が漂っているのは、事実であるように思う。\nそうした雰囲気を受けて、倫理学では、応用倫理学と呼ばれる分野が急速に成長し、さま\nざまな倫理が提唱されつつある。たとえば、生命倫理、環境倫理、ビジネス倫理に始まって、情報\n倫理、工学倫理、スポーツ倫理、さらには、遺伝子倫理、脳神経倫理、ナノ倫理、ロボット倫理と\nいった具合に、言葉を見ただけでは、内容がにわかには想像しにくいものまで登場している。「な\nんでも倫理症候群」とでもいいたくなるほど、「○○倫理」が大はやりなのだ。どうやら、現代は「倫理\n的な時代」らしいのである。こうした倫理ばやりは、わたしのように哲学や倫理学を専攻する人間に\nとって、必ずしも喜ばしい事態であるわけではない。それは、倫理が空 気のようなものだからだ。\n普段、わたしたちが生活しているときに、空気を吸っていることをとりたてて意識などしな\nい。生きていく上で空気が必要なことはわかってはいても、希薄になって、息苦しくでもならない限\nり、空気は意識さ れたりはしない。\n倫理には、それと似たところがある。倫理がさかんに語られるのは、社会がそれまで通りに\nはいかず、息苦しくなっているような時代である。少なくとも歴史を振り返ってみると、「倫理的な時\n代」はいずれも価値観の大きな変動期にあたっていた。つまり、それまで当然だと思っていた考え\n方や生き方が大きく揺らぎ、どう考え、どう生きたらよいのかわからないようなときに、倫理は求めら\nれてきたのだ。わたしたちが生きている現代は、そうした時代である可能性が高い。\nこの場合、一番の問題は、変動期の人間には、先が容易に見通せないことである。現在\nは、 過去の歴史的な事例とは違って、どのような結果が待ち受けているか、あらかじめ知ることは\nできない。わたしたちは、そうした不確かさのなかで、現在を生きていかざるをえない。\nもちろん、こうした事態を、わたしたちが新たな未 来を切り開くのだと、積極的にいってみる\nことはできるかもしれない。しかし、そうした積極的な態度や発言が簡単にはできないのが、「倫理\n的な時代」のとりあえずできるのは、何があるのか、どのような問題が出てきているのかを知り、考え\nていくことである。 それが、現在を生きるということであるはずだ。\n(注)空疎(くうそ)\n(注)な常套句(じょうとうく):ここでは、中身のない形だけの言葉","questions":[{"q":"そうした有雰囲気とあるが、どのようなことか。","options":["社会が倫理を求めている。","マスコミが倫理の必要性を訴えている。","倫理学の価値が見直されつつある。","倫理学が他の分野に応用され始めている。"],"answer":0,"explain":"Bầu không khí xã hội: XÃ HỘI đang CẦN đạo đức, lan rộng cảm giác bất an (社会が倫理を求めている). ✅A."},{"q":"倫理と空気の似ている点について、筆者の考えに合うのはどれか。","options":["実体がわかりにくいので、意識されない。","生きていく上で、常になくてはならない。","必要だと感じなければ、意識されない。","必要になっても、すぐには意識されにくい。"],"answer":2,"explain":"Giống không khí: chỉ khi CẢM THẤY CẦN THIẾT (vì thiếu/khó thở) mới được ý thức đến, không tự nhiên được để ý. ✅C."},{"q":"筆者は「倫理的な時代」をどのような時代だととらえているか。","options":["新たな価値観が生まれ、社会に受け入れられている。","従来の価値観が通用しなくなり、人々が生きる方向性を見失っている。","倫理の価値が再評価され、次の世代に積極的に倫理を教えている。","倫理自体に価値がないと考えられ、社会が大きく揺らいでいる。"],"answer":1,"explain":"'Thời đại đạo đức': giá trị quan CŨ không còn dùng được, con người MẤT phương hướng sống (どう考え、どう生きたらよいのかわからない). ✅B."},{"q":"筆者は「倫理的な時代」を生きる人間にできることは何だと考えているか。","options":["積極的に発言し行動すること","現在の経験を将来生かすこと","現状の問題を把握して考えること","未来を切り開く方法を考えること"],"answer":2,"explain":"Đáp án đúng: C. Việc có thể làm trước mắt là tìm hiểu có vấn đề gì đang xuất hiện và suy nghĩ về nó (「何があるのか、どのような問題が出てきているのかを知り、考えていくこと」)."}]},{"source":"Mon12","bai":17,"date":"07/2018","title":"Mon12 - Bài 17 (07/2018)","passage":"多くの人が今の社会は生きづらいと言う。\n長いこと農林業者や職人、漁業者達に会って話を開いてきた。明治生まれも大正生まれも\n昭和の方もいた。その方々も、自分たちは生きやすく、楽しい人生を送ってきたとは言わなかっ\nた。\n私が会った多くの方々は徒弟制度(注)のなかで技を身につけ生き方を学んできた人達\nだった。林業者達は親方や先輩に仕えて、 道具の使い方や山や木の性質、癖を読み取る方法を\n覚えて一人前になった。 漁師達もそうだ。 父や兄の船に乗り込み飯炊きから始めて、その日の水\n温や風の流れを読み、漁場を決め、そこに合った道具を選び、漁獲を得るようになる。\n教える親方や先輩達は「見て学べ」と言うだけだった。自分の指先や感覚、体が覚えた技\nを伝えるには言葉はあまりに幅が狭すぎるからだ。\n(中略)\nやがて一人前になり、腕を上げれば、効率は上がり、利益も出るようになるが、目指す到達\n点が遠いことに気さく。だから日々の①努力を惜しまなかった。 努力だけが自分を補ってくれる手\n段だったからだ。 努力は辛いものであったが、 喜びも伴っていた。 積み重ねれば明日があり、報\nわれることがあったのだ,しかし、②時代は変わった。時間のかかる訓練を避け、効率の向上を目\n指した。効率こそが価格競争に勝てる最高の武器だと考えたからだ。工場はもちろん、漁師は機\n械を満載 した高速船を手に入れ、農業者はトラクターを買った。森林の伐採も機械がする。\n世の仕組みも、人々の考えも努力や修業、技を持つ体を不要なものとしたのだ。技はデー\nタとして機械に組み込まれ、人間に付属するものではなくなってしまった。修業は人を磨き、生き方\nを支えるものであったのだが、それがなくなった.\n今、人は働かされていると感じている。そこでは隠された能力が引き出されることがない。\n見つけ出す過程がなくなったからだ。報いは金銭ではあり、喜びが薄っぺらなものになってしまっ\nた。働くことの意味が変わったのだ。\n働くことと生きることは人生の裏と表であった。生きづらい世の中と思う人が多いのは、働く\nことに喜びが伴わなくなったからではないか。私の会ってきた人々は自分の仕事を語るとき、苦し\nかったとは言いながら、表情に生気があり、誇りがにじんでいた。\n社会が変わっても人は生きていかねばならない。働かねばならない。機械を捨てるというの\nではない。 効率も必要だ。しかし、新しい時代の中で働く意味と喜びを見つけ出さなければ、生き\nづらさが増すばかりだ。\n働くことの喜びをどうやって復活させるのか。お手本はほんのこの間までの日本にある。た\nくさんの方達の話を聞いてきてそう思う。\n(注) 徒弟制度: ここでは、弟子として技を習得する制度","questions":[{"q":"親方や先輩が技を言葉で教えなかったのはなぜか。","options":["技を伝える言葉を理解させられないから","技は言葉では十分伝えられないから","技は言葉で伝えても身につかないから","技は時間がたてば自然に身につくものだから"],"answer":1,"explain":"Người thợ dạy 'nhìn mà học' vì: kỹ năng KHÔNG thể truyền tải đủ bằng LỜI NÓI (言葉はあまりに幅が狭すぎる). ✅B."},{"q":"①即力を惜しまなかったのはなぜか。","options":["努力を積み重ねなければ、辛さが喜びに変わらないから","努力を積み重ねれば、報われた時の吾びが大きくなるから","努力をして腕を上げれば、利益が出るから","努力をし続けなければ、目指すものに近づけないから"],"answer":3,"explain":"①Không tiếc nỗ lực vì: chỉ có nỗ lực mới giúp TIẾN GẦN mục tiêu xa (努力だけが自分を補ってくれる手段). ✅D."},{"q":"時代は変わったとあるが、人の働き方はどう変わったのか。","options":["修業に努力が求められなくなった。","技を習得することが必要とされなくなった。","機械の出現で効率的に修業ができるようになった。","誰もが機械に精通することを求められるようになった。"],"answer":1,"explain":"②Thời đại thay đổi: kỹ năng KHÔNG còn cần thiết phải học nữa, bị máy móc thay thế (技はデータとして機械に組み込まれた). ✅B."},{"q":"筆者の考えに合うのはどれか。","options":["生きづらい社会であっても、誇りを持って生きていこう。","修業を通して働く意味と喜びを得られた時代に戻るべきだ。","時代が変わっても、働く意味と喜びを見つけて生きていこう。","働く意味や喜びを大切にしながら、効率を追求していくべきだ。"],"answer":2,"explain":"Ý chính: dù thời đại đổi thay, vẫn cần TÌM ý nghĩa & niềm vui trong lao động. ✅C."}]},{"source":"Mon12","bai":18,"date":"12/2021","title":"Mon12 - Bài 18 (12/2021)","passage":"私たちは、その時の状況や、周りの人のまなざしに合わせるように、行動を決めている ことがあ\nる。人は一人の時の行動と、人に見られている時とでは行動が変わる。誰かのま なざしを気にして\n動くのである。そして、多くの人々が生き交う街は、皆が皆に視線を向 け合う「まなざしの集合体」\nと言える場所だ。そんな場所では何が適切な行動で、何が不 適切な行動なのかという暗黙の公共\n性が生まれてくる。まなざしの集合によってそこに社 会規範が生まれ、それは生活の型となって私\nたちの認識を導く。\nこうした社会規範や公共性は、かつてはその場所での営みの中で自然に生まれてくるも ので\nあった。同じ土地で、たくさんの人が争わずに仲良く生活するためにひつようだから である。それ\nがはっきりと明文化されていったものが、法律や制度がたくさんあるように 思える。「街角でギター\nを鳴らしてはいけません」、「路上で物を売ってはいけません」、あげくの果 てには、「公園でキャッ\nチボールをしてはいけません」ということになる。\n一体どういう意味があるのか明確ではないルールは単なる記号だ。それがなぜダメなの かという\n理由が共有できないまま、ルールは押し付けられて従っていることがある。そう やって与えられて\nいるルールに、自分でいちいち判断せずに従っていると、今度はそれが 無意識の型となってくる。\nなんとなく街を眺めて、なんとなくその場の型に従っていると、そのうちに周りの物事 に対する疑\n問は次第に薄れていくのである。私たちは、なぜその行動をしているのか、な ぜその場所にその\nルールがあるのかを改めて考えなくなる。そうすると今度は物事の判断 基準が「ルールに従ってい\nるかどうか」に変わってしまう。まなざしが集まるからルール が生まれるのではなく、決められたルー\nルにまなざしを合わせることになる。\nルールとは私たちが共有している記号である。街ではどういう振る舞いが共有されてい て、どうい\nう行動は許されないのか。それに対して街の人々が想像したことが集合した結 果として、取り決め\nられるものである。しかしそれは繰り返される間に、だんだんと単な る記号になり、私たちの行動や\n認識も、単なる型にはまっていく。だからこそ、もう一 度それに正しくまなざしを向けなおすために\nは、その想像の型をいったん外して、全く違 う型を取ってみることが重要なのである。\n(注)あげくの果てには、そして最後には","questions":[{"q":"かつての社会規範や公共性について、筆者はどのように述べているか。","options":["自分自身よりも、周りの人を優先するという考えに基づいていた。","同じ土地の人々の間でも、一様に認識されているものではなかった。","同じ土地で人々と争わずに生活していれば、自然に身についてくるものだった。","ともに生活するうえで必要なものとして、同じ土地の人々の間で然に発生した。"],"answer":3,"explain":"Quy chuẩn xã hội xưa: nảy sinh TỰ NHIÊN từ nhu cầu sống chung hòa thuận trên cùng vùng đất (争わずに仲良く生活するために必要). ✅D."},{"q":"無意識の型となってくるとあるが、どういうことか。","options":["法律や制度に合わせることが、特に難しいことではなくなってくる。","法律や制度の必要性を考えずに、従うべきものとして認識してしまう。","法律や制度の意味が分からなくなり、守る必要性を感じなくなってしまう。","法律や制度の意味を理解していなくても、人々の間で共有することができる。"],"answer":1,"explain":"'Khuôn mẫu vô thức': TUÂN THEO quy tắc mà không nghĩ đến LÝ DO tồn tại của nó (理由が共有できないまま押し付けられて従う). ✅B."},{"q":"筆者が言いたいことは何か。","options":["ルールは時代の変化に合わせて変えていくことが大切だ。","ルールの有無にかかわらず、自身が正しいと思う行動をすべきだ。","なぜそのルールがあるのかを考えて、行動することが大切だ。","これまでのルールに反している行動でも、社会の中で許容していくべきだ。"],"answer":2,"explain":"Ý chính: quan trọng là SUY NGHĨ tại sao có quy tắc đó rồi mới hành động, không chỉ làm theo máy móc (想像の型を外して違う型を取ってみる). ✅C."}]},{"source":"Mon12","bai":19,"date":"07/2022","title":"Mon12 - Bài 19 (07/2022) [thiếu đề gốc]","passage":"植物は美しい花を咲かせ、虫を誘った。鳥は飛ぶために翼を生やした。しかし、生物は、自ら求\nめてそ のような性質を得たわけではない。生命にとって新しい変化は偶然によってしか生まれな\nい。\nDNAが複製され、親から子に受け渡されるとき、ごく稀に、ほんのわずかな誤植(注1)が発生す\nる。もちろん誤植はランダム(注2)におきる。ささいな誤植は新たな変化をもたらす。その変化自体\nには目 的も意図も方向性もない。そこから何かを選びとるのは自然環境である。自然環境に適し\nた変化は選択され、子孫を残す。環境に不適な変化は子孫を残せず、淘汰される。\nところが。もし本来ならあっさり淘汰されてしまうような変化であっても、それを選びとり、守り、育む\nような 「選択者」が自然以外に存在すれば、その変化は生きのびることができる。そんなことが近\n年、実はたくさ ん、あちこちで起こっている。近年、といってもそれは、人間がこの世界に出現して\n以来のこと。\nたとえば鳥。鳥は卵を産むと巣に籠って暖める性質を持つ。数週間それに専心(注4)する。しか\nし、 もし何らかの突然変異によって鳥の習性が変化し、卵を産んでも暖めることを放棄してしまっ\nたら。そんな変 化は、子孫を残すのに圧倒的に不利だから、たちまちそんな鳥は淘汰されるは\nず。\nところが人間はその島の卵を島に代わって暖め子孫を増やしてやることにした。なぜか。鳥は卵\nを暖める ことを放棄したかわりに、またすぐに次の卵を作りはじめる性質を持っていたから。こうし\nて現在、私たち人間 は、毎日排卵(注5)し、毎日のように卵を産みっぱなしにして平然としている\n鳥、すなわち、一年に300個 以上も卵を産み続けるニワトリ、ホワイトレグホン①を選びとった。\nたとえばカイコ(注6)② カイコはもともとクワコという蛾の一種だった。人間が常時、餌を供給して人\n工 的な環境を与えた。すると幼虫は自分で餌を探索するのをサボるようになった。その分の余力\nをもっと別な こと、つまり絹糸を作り出す能力に振り向けるような種が選別された。かくして自分で\nはほとんど動けず、必要以上に大きく厚手の繭(注7)を作りだし、そこから出ることも飛ぶこともでき\nないような昆虫が作り出され た。カイコは人間がいないと生きていけない。\n(中略)\n人間がその進化のプロセスに介入し、自然になりかわって選択者としてふるまい、作りかえ、新た\nに生み出 した生命。その生命たちはもはや人間なしでは生きていくことができない。一方、人間も\nまたそんな生命に助 けられ、あるいは支えられて生きている。これは人間と人間が作り出した生命\nとの新たな共生関係とも呼べ る。\n人間が登場して以来、進化の歴史は新しい局面を迎えた。人が作りかえたいのち。それに対して\n人間 はきちんと責任を取らなければならない。\n(注1)誤植:ここでは、ずれ\n(注2)ランダムに:偶然に\n(注3)淘汰される: ここでは、滅びる\n(注4)専心する:集中する","questions":[{"q":"筆者によると、自然界で子孫を残した生物はなぜ子孫を残せたか","options":["自然環境に合わせて自身を変化させたから。","自身に適した自然環境を選んで移動したから。","DNAが複製されるときに、ずれが生じなかったから。","DNAに生じた変化が、たまたま自然環境に合ったから。"],"answer":3,"explain":"DNA biến đổi ngẫu nhiên → tự nhiên chọn lọc → biến đổi PHÙ HỢP với môi trường được giữ lại → D."},{"q":"①ホワイトレグホンについて、筆者はどのように述べているか","options":["卵を産んでも暖めない。","一度に多くの卵を産む。","産んだ卵をほかの鳥に託す。","ほかの鳥より卵を暖める時間が短い。"],"answer":0,"explain":"「卵を産んでも暖めることを放棄してしまった」→ 人間が代わりに暖める → 現在: 卵を産んでも暖めない → A."},{"q":"カイコについて、筆者はどのように述べているか。","options":["身動きが取れないため、細糸が多く作り出せなくなった。","人間が餌を与えることで、絹糸を作ることに専念するようになった。","生きるエネルギーの大部分を、餌を食べることに費やすようになった。","人工的な環境を与えた結果、絹糸を作るという新しい能力を獲得した。"],"answer":1,"explain":"「人間が常時餌を供給 → 餌探索をサボる → 余力を絹糸を作り出す能力に振り向ける」→ B."},{"q":"筆者が言いたいことは何か。","options":["人間が作りかえた生物は、本来の姿に戻さなければならない。","人間はあらゆる生物と新たな共生関係を築くべきだ。","人間は生物の進化のプロセスに介入するべきではない。","人間は作り出した生命との共生関係を維持しなければならない。"],"answer":3,"explain":"「人が作りかえたいのち。それに対して人間はきちんと責任を取らなければならない」→ D."}]},{"source":"Mon12","bai":20,"date":"12/2022","title":"Mon12 - Bài 20 (12/2022) [bản dịch tiếng Việt]","passage":"以下は、十代の若者に向けて書かれた文章である。\n\n　だれでも、自分が自分であることを望み、個性的であろうと願っている。そしてその一方では、自分が他のみんなと違った、自分であることを恐れている。\n\n　本当は、「個性的」であろうと思って、個性的になれるものでもない。それはたいてい、「個性的」といわれる一つの型に、自分をあてはめていることだったりする。人間にとっては、「個性的であれ」などと言われても、どうしてよいかわからないものであって、「個性的」とよばれる型を持ったほうが楽なのだ。しかしそれは、本当に個性的なわけではない。\n\n　それでも、青年期に向けて、個性的であろうと試みることは、よいことだ。かりにそれが、一つの型にすぎなくても、あるいは、個性的であろうとして挫折し、個性的であることから逃避することも含めて、自分にとって個性とはと、考えるのはよいことだ。それは、自分が自分であることの、あかしでもある。\n\n　そこでは、ときに悩むことがあったり、どうしたら個性的な人間になれるかと、模索することもあるかもしれない。それはじつは、「個性的」であること以上に、自分というものを意識していく、一つの過程である。そうした意味では、「個性的」であるかどうかなんて、本当はたいしたことではなくて、自分というものが確立していくことが、大事なことも言える。\n\n　そしてじつは、個性というものは、人間のひとりひとりに備わったもので、その個性がありのままに出ていることが、本当の意味で個性的である。むしろ、本当の自分が出せないから、没個性的にもなるのだ。もちろん、人間はまわりの社会を気にするものであって、自分をよそおうことも含めてしか、社会のなかで存在できない。無理に「個性的」かどうかを、自分のよそおいを捨てようとしても、捨てられるものではない。そうした、社会とのかかわりも含めて、自分というものはある。\n　たいていの場合、つっぱったり、いじけたりしていては、自分の個性は発揮できない。つっぱるまいとするのが一種のつっぱりだったり、いじけまいとしてそのことにいじけたり、なんてことまで問題にしだすと、ちょっと言葉の遊びみたいになるが、ま、そうしたことまで含めて、気楽に自分であるようにしなくては、本当の意味で個性的にはなれないものだ。\n　そして、ありのままの自分を出すことへの不安が、「個性的」を一つの型にしたり、あるいはそうした型から逃れる道へ向かわせたりもする。\n\n　それでも結局、自分とはありのままの自分しかない。それを自覚したとき、きみは個性的なきみになる。","questions":[{"q":"よいことだとあるが、なぜか。","options":["個性的である必要はないと気づくから。","挫折したり悩んだりする経験が個性を作るから。","自分という人間を意識することになるから。","自分にあてはまる個性の型を見付けられるから。"],"answer":2,"explain":"「自分にとって個性とはと、考えるのはよいことだ」→「自分というものを意識していく過程」→ C."},{"q":"個性について、筆者はどのように考えているか。","options":["自分から社会とかかわることで、意識できるものだ。","他人と比較しなければ、自然に発揮できるものだ。","なりたい自分を意識すれば、自然に身につくものだ。","求めて得るものではなく、初めから持っているものだ。"],"answer":3,"explain":"「個性というものは、人間のひとりひとりに備わったもの」→ 求めるものではなく最初から持っているもの → D."},{"q":"筆者が最も言いたいことは何か","options":["自分の個性を模索すべきだ。","自分自身であることが大事だ。","ありのままの自分を出せなくてもいい。","型に縛られない生き方をしたほうがいい。"],"answer":1,"explain":"「それでも結局、自分とはありのままの自分しかない。それを自覚したとき、きみは個性的なきみになる」→ B."}]},{"source":"Mon12","bai":21,"date":"07/2023","title":"Mon12 - Bài 21 (07/2023) [bản dịch tiếng Việt]","passage":"Đối với doanh nghiệp cũng như với người dân, đây là một thời đại đầy bất an và không thể\nnhìn thấy tương lai. Trong thời đại đầy bất an ấy, mong muốn từ phía cha mẹ rằng “muốn trang bị cho\ncon cái năng lực sống” là điều có thể hiểu được. Tương tự, việc các nhà điều hành doanh nghiệp mong\nmuốn thu hút được nhân lực ưu tú dù chỉ là một chút cũng là điều hiển nhiên. Nếu có ai đó xuất hiện\ncó thể ngăn chặn sự suy thoái của khu vực và tình trạng rỗng hóa ngành công nghiệp, thì cảm giác bất\nan của chúng ta cũng phần nào được xoa dịu.\nTuy nhiên, với tư cách là người chuyên ngành giáo dục học, dù là ở mức độ nào, tôi vẫn muốn\nnói điều này. Việc cho rằng mọi vấn đề của xã hội Nhật Bản hiện đại đều có thể giải quyết bằng giáo\ndục là điều không thể chấp nhận được.\nQuả thực, giáo dục thông qua việc nuôi dưỡng con người có thể đóng góp nhất định cho cuộc\nsống của con người và tương lai của xã hội. Nhưng theo tôi, mức độ hữu ích đó không phải là lớn.\nGiáo dục vốn luôn đi kèm với tính bất định. Đây là điều được bàn đến trong cả giáo trình đào tạo giáo\nviên – cái gọi là “những điều cơ bản nhất trong giáo dục học”.\nKhông phải cứ dạy là trẻ em sẽ phát triển tương ứng, mà đôi khi dù không có ý định dạy, trẻ\nvẫn tự học được. Dĩ nhiên, giáo viên và các nhà giáo dục học vẫn nỗ lực hướng sự phát triển xác suất\nấy theo hướng tích cực, nhưng dù sao thì người phát triển vẫn là trẻ em. Do đó, chúng ta không thể dễ\ndàng chấp nhận những yêu cầu như “hãy đạt được lợi ích tối đa với chi phí tối thiểu” hay “hãy đào tạo\nđúng loại nhân lực cần thiết và cung ứng đầy đủ cho xã hội”.\nHơn nữa, vốn dĩ giáo dục không chỉ dành riêng cho kinh tế, cho việc duy trì cộng đồng, hay\ncho gia đình. Thị trường, quốc gia, cộng đồng địa phương, và gia đình đều yêu cầu “giáo dục hữu ích”,\n“giáo dục có ý nghĩa”, nhưng mỗi bên lại có yêu cầu khác nhau. Dĩ nhiên, giáo dục có thể đáp ứng\ntừng yêu cầu đó một cách xác suất. Tuy nhiên, nếu chỉ vì một mục tiêu cụ thể nào đó mà thúc đẩy giáo\ndục theo hướng hợp lý hóa hay tối ưu hóa, thì giáo dục sẽ trở nên méo mó. Hơn nữa, nếu mọi người\nđều cố gắng rút ra lợi ích riêng từ giáo dục, tôi không nghĩ một nền giáo dục bị kéo căng bởi kỳ vọng\nthái quá đó có thể vận hành tốt.\n(…)\nTrong xã hội trì trệ này, ai cũng bị đè nén bởi bất an, và chính vì vậy, kỳ vọng và hy vọng đặt\nvào giáo dục ngày càng lớn. Kết quả là, giáo dục – đặc biệt là giáo dục học đường – đang bị cuốn vào\nlàn sóng cải cách và sắp đánh mất sự bình tĩnh. Cảnh báo rằng “đừng kỳ vọng quá nhiều vào giáo dục”\ncó lẽ chính là điều cần thiết nhất hiện nay để duy trì xã hội và chính nền giáo dục này.\nChú thích:\n(注1) 耳をそろえて : đầy đủ, không thiếu sót gì\n(注2) 歪な（いびつな） : méo mó, không cân đối\n(注3) 躍起になって : trở nên quá mức nỗ lực, cố quá sức","questions":[{"q":"決して大きいものではないと考える理由として、筆者が述べているのはどれか。","options":["企業や社会が望む人材と、教育学で目標とする人材は異なるから。","「生きる力」をつけるために必要なことは、明確ではないから。","子ども一人一人に併せて、教育の内容を変えられないから。","子どもは、教えたとおりに育つとはかぎらないから。"],"answer":3,"explain":"Hiệu quả giáo dục không lớn vì: trẻ KHÔNG NHẤT THIẾT lớn lên đúng như được dạy (教えたとおりに育つとはかぎらない、自ら学んでしまうこともある). ✅D."},{"q":"教育について、筆者の考えに合うのはどれか。","options":["それぞれの目的に合わせて合理化・効率化しなければ、機能しない。","みんなで一つの目的を共有しなければ、効果は上がらない。","特定の目的を果たすために存在するものではない","役に立つかどうかという観点で評価されるべきだ。"],"answer":2,"explain":"Giáo dục không tồn tại CHỈ để phục vụ 1 mục đích cụ thể (kinh tế/gia đình/cộng đồng) — mỗi bên có yêu cầu khác nhau. ✅C."},{"q":"筆者が最も言いたいことは何か。","options":["多様な社会の要求に応じられるように、教育のあり方を考え直すべきだ。","社会の不安を取り除くためには、教育を合理化・効率化すべきではない。","教育の改革によって、安定した社会を持続させていくことが必要だろう。","現代社会の問題のすべてが、教育で解決できると思ってはいけない。"],"answer":3,"explain":"Ý chính: KHÔNG nên nghĩ giáo dục giải quyết được MỌI vấn đề của xã hội hiện đại. ✅D."}]},{"source":"Mon12","bai":22,"date":"12/2023","title":"Mon12 - Bài 22 (12/2023)","passage":"SNS (注1) を含むリアルタイムウェブ (注2) の本質は、時間と過程の消去にある。かつてコンテンツ\n(注3) の拡散には一定の時間がかかった。権威やメディアをすり抜ける必要もあった。けれどもいま\nや、それらの面倒をすべてすっとばし(注4)、無名の書き手が一晩で何百万もの支持者を集 めるこ\nとができる。それはSNSの良いところだ。\nけれども人生にはトラブルがつきもの(注5)である。どれだけ誠実に生きていても、誤解や中 傷に\n曝されることが必ずある。そしてそういうとき、SNSの支持はほとんど役に立たな い。匿名の支持者\nは、トラブルの話題自体すぐに忘れてしまう。あっというまに(注6)集まった 人々は、同じくあっという\nまに離れる。そこで継続的に助けてくれるのは、結局は面倒な 人間関係に支えられた家族や友人\nたちだったりする。\nSNSの人間関係には面倒がない。だからSNSの知人は面倒を背負ってくれない。そ んなSNSで\nも、たしかに人生がうまく行っているときは大きな力になる。けれども、本 当の困難を抱えたときは、\n助けにならないのだ。\nこれからの時代を生きるうえで、SNSのこの性格を知っておくことはとても重要なよ うに思う。そも\nそも、人生の困難なるものは自分と世界のズレの表れである。自分はある ことを正しいと信じるが、\n世界はそう思わない――そういう対立が生じたとき、困難が訪 れる。だから困難そのものが悪いわ\nけではない。むしろ、概念の発明や政治の変革は必ず 困難とともに生じる。その困難を時間をか\nけて解消し昇華する(注７)ことで、はじめて自分も相 手も社会も進歩するのだ。けれども、いまの\nSNSにはそのような熟成の余裕がほとんど ない。\n困難な時期を支えるとは、言いかえれば、支える相手と世界の関係が変化する過程に時 間をか\nけてつきあうということである。ひとりの人間が変わるというのはたいへんなこと で、「いいね!」をつ\nけるようにポンポン複製できるものではない。いわゆる「議論」で 相手が変わると考えているひと\nは、人間の本質について無知である。ぼくが一生をかけて 変えることができるのは、ごく少数の身\nの回りの人々だけであり、そしてぼくを変えるこ とができるのもおそらくは彼らだけだ。その小さく面\n倒な人間関係をどれだけ濃密に作れ るかで、人生の広がりが決まるのだと思う。\n家族も友人もあっというまには作れない。面倒な存在でもある。だからこそそれは変化の受け皿と\nなる。面倒がないところに変化はない。情報技術は、面側のない人間関係の調 達を可能にした\nが、それはまた人間から変化の可能性を奪うものでもあった。そのことを 忘れずにおきたいと思う。\n(注1) SNS: ウェブ上での情報のやり取りや交流の場を提供するサービス\n(注2) リアルタイムウェブ: 情報更新が即時に行われるウェブ\n(注3) コンテンツ: ここでは、情報\n(注4) すっとばす: ここでは、省略する\n(注5) つきもの:必ず伴うもの\n(注6) あっというまに短い間に\n(注7) 昇華する:ここでは、別の良いものに変える","questions":[{"q":"SNSの支持はほとんど役に立たないとあるが、なぜか。","options":["SNSの支持者の意見はさまざまで、すぐにはまとまらないから","SNSの支持者は無名で権威を持たないひとが多いから","SNSの支持者はトラブルの原因を誤解したまますぐに発信するから","SNSの支持者はすぐに興味をなくし、去ってしまうから"],"answer":3,"explain":"Sự ủng hộ trên SNS không giúp được gì vì: người ủng hộ vô danh nhanh MẤT hứng thú và rời đi (あっというまに集まった人々はあっという間に離れる). ✅D."},{"q":"困難な時期について、筆者はどのように述べているか。","options":["自分と世界の認識のズレに気づき自分が変わろうとすれば、乗り越えられる。","「議論」によって相手や自分を変化させることで、乗り越えられる。","少数の身の回りの人々から人間関係を広げていけば、乗り越えられる。","家族や友人のような存在との深い関係によって、乗り越えられる。"],"answer":3,"explain":"Vượt qua khó khăn nhờ: quan hệ SÂU SẮC, lâu dài với gia đình/bạn bè (面倒な人間関係に支えられた家族や友人). ✅D."},{"q":"筆者が言いたいことは何か。","options":["情報技術の特徴を理解したうえで活用すれば、自分自身の変化につながる。","情報技術を活用すれば、面倒な人間関係を変えられる可能性がある。","情報技術によって作られた人間関係では、人間の変化は期待できない。","情報技術は人間の変化の可能性を奪うものであり、利用は控えるべきだ。"],"answer":2,"explain":"Ý chính: quan hệ tạo từ công nghệ thông tin (dễ dàng, không 'phiền phức') KHÔNG mang lại sự THAY ĐỔI con người thực sự. ✅C."}]},{"source":"Mon12","bai":23,"date":"07/2024","title":"Mon12 - Bài 23 (07/2024)","passage":"子育て(養育)にしろ、学校での教育にしろ、当事者(親・教師)が心がけなければならないのは、\nまず 子どもは親(教師)の思うとおりにならないということである。あるいは、こちらの思うとおりになっ\nたら、 かえって問題だということである。\n「子供は親(教師)の思う通りにならない」という意味は、甘やかして野放図(注1)にしていいというこ\nとではない。反抗は望ましいから、大いに結構だとも違う。もともと、親も教師も言葉で説得できるよ\nう になる以前から、まず子ども(生徒)たちを家庭や学校の生活の枠組みに入れなければならな\nい。絶対 に放っておくわけにはいかないし、理屈抜きで生活の型や秩序を押しつけざるをえな\nい。それが親や教 ・師の社会的役割であり、個人としてはどうかと思うようなことも、親や教師は、一\n律に画一的に身につ けさせようとする。それは避けられない。望むと望まざるとにかかわらず、み\nんながやらなくてはならな い。\n人間が社会的動物であるということは、そういうことであろう。動物が持って生まれてきた本能で自\n由に生きられるのに対して、ひとの子どもは動物的な本能を抑圧されて、社会的規範を生まれて\nから 次々と覚え、身につけていかねばならない。これは、ほかの動物と比較すると、不自由なこと\nである。親 や教師は、そういうひとの宿命である不自由を子どもたちに身につけさせなければなら\nない。\n(中略)\nそういう社会的規範は、今の社会のレベルや段階が必要としていることであり、本当にひとの幸\n福に とってふさわしいものかどうかはわからない。ましてや、生まれ育っていくその子どもにとって、\n絶対的に 必要なものかどうかもわからない。ただ、わかっているのは、社会的に生きていくために\n今ある社会的 規範やルール、考え方をひとまず受け入れなければならないということだけである。\nそして、そういうひと を規制し構成してきたもろもろの (注2)精神的な財産は、時代とともに変わって\nきたという事実である。 だから、次の世代は、私たちと同じにはならない。したがって、子どもは親\n(教師)の思うとおりにはなら ないのだ。\nだから、次の世代は、私たちと同じにはならない。したがって、子どもは親(教師)の思うとおりには\nな らないのだ。\nもちろん、思うとおりにしようとすることは避けられないとしても、思うとおりにならないことを覚悟し\nて いるべきである。それが子ども(生徒)や、あとの世代の人たちへの尊敬であり、信頼であろう。\n「こちら の思うとおりになったら、かえって問題だ」も同じことだが、現在の人間や社会がすでに理\n想を実現し た完璧な社会であるはずがないし、私たちが正しいと思い、子どもたちに押しつけてい\nる社会規範やルールも、あくまでも暫定的なものにすぎない。だから、私たちが予想した以上に、\n私たちの思いどお りになる子どもができてしまったら、大変なことになる。\nおとなと子どもとの誤差は、基本的にはいつでも歓迎していいことである。\n(注1) 野放図にする: 勝手にさせる\n(注2) もろもろの:さまざまな","questions":[{"q":"筆者によると、親や教師は子どもや生徒に対して何をしているか。","options":["反抗を容認しつつ、不自由な社会的規範に従わせている。","どの時代にも通用する社会的規範を身につけさせている。","社会的規範を教え、社会の枠組みに適応させている。","社会的規範を教えたうえで、自由に生きる方法を身につけさせている。"],"answer":2,"explain":"Cha mẹ/giáo viên: dạy quy chuẩn xã hội để trẻ THÍCH NGHI với khuôn khổ gia đình/trường học (社会の枠組みに入れなければならない). ✅C."},{"q":"精神的な財産とは何か。","options":["ひとが幸福になるために守ってきたもの。","ひとが本能を抑圧されずに生きるためのもの。","ひとが社会で生きていくために作られてきたもの。","これから生まれ育っていく子どもにとって必要なもの。"],"answer":2,"explain":"'Tài sản tinh thần' = những quy chuẩn/giá trị được TẠO RA để con người sống trong xã hội (ひとが社会で生きていくために作られてきたもの). ✅C."},{"q":"筆者が言いたいことは何か。","options":["社会的規範は時代によって変化するものであり、子どもはおとなの思うとおりにならな くて 当然である。","社会的規範は暫定的なものにすぎず、子どもが自身の考え方に合ったものを作って いく ことが望ましい。","時代の変化に適応できるように、おとなは子どもに社会的規範の背景となる考え方 を教え たほうがいい。","時代によって考え方は変化するものなので、それに合わせて次の世代が社会的規範 を変 えるべきだ。"],"answer":0,"explain":"Ý chính: quy chuẩn xã hội thay đổi theo THỜI ĐẠI → trẻ con đương nhiên KHÔNG giống cha mẹ, đó là điều nên hoan nghênh (おとなと子どもとの誤差は歓迎していい). ✅A."}]},{"source":"Mon12","bai":24,"date":"12/2024","title":"Mon12 - Bài 24 (12/2024)","passage":"最近、日本ではテレビや書籍で脳科学者がブームになりました。脳科学が一般の人々の関心を\n強く 惹いた最大の理由は、脳科学によって自分がよりよい人生を歩めそうだと感じるからではない\nでしょう か。\n科学は事物を客観的に扱う三人称的な学問です。そのため、何か冷たく、自分とは関係のない\nよう なよそよそしさ(注1)を感じてしまいます。ところが、脳科学は人間の感情や思考や行動に関わ\nる科学 です。そのため、科学としては初めてのことですが、まるで文学や芸術のように一人称(注2)\n世界に踏 み込んできて、幸せな人生のノウハウを提供してくれているように思えるのです。\nしかし、せっかく関心を持っている人に水を差す(注3)つもりはないのですが、脳科学が今より\nずっ と進歩したとしても、人間の心や私たちの人生について、すみずみまで解き明かせるようにな\nるわけで はないと肝に銘じて(注4) おいた方がよいと思います。脳は複雑で、まだまだわからない\nことが多く、 普通的な法則に到達するまでの道のりはきわめて遠いのです。そして、たとえ到達で\nきたとしても、科 学の普通法則は人生の個別性や一回(注5)に対しては全く無力です。ゆえに、人\n生の個別の事柄に 適用して何かを予言したりすることは、おそらく不可能でしょう。\nもう一つ大切なのは、科学は事実を扱うことはできますが、価値観の問題を扱うことはできないと\nい うことです。ですから、脳科学によってある事実が判明したとしても、それを価値観と混同しては\nいけま せん。たとえば、ある脳科学の本に、「こうすれば脳を活性化できるので、みなさんもやって\nみましょう」 と書いてあったとします。ですが、脳の活性化は絶対的な価値でしょうか。極端な例で\n考えてみましょう。 副作用の全くない薬物だったとしても、薬物で健康な人間(たとえば受験生)の\n脳を活性化することは 許されるでしょうか。これが許されるかどうかは、論理や価値観に属する話\nです。価値観は個人と社会 が決めるものです。そして、個人の価値と社会の価値も同じとは限りま\nせん。脳科学の知見(注6)は 事実を記述したものであって、価値とは何の関係もないのです。\n(中略)\n人類がどのような未来を選ぶかという問題も、結局のところ価値観の問題です。科学は、選んだ\n未 来を実現するための道具にはあり得ますが、未来を選ぶ価値観の問題を扱うことはできませ\nん。\n(注1)よそよそしい: 無関係である\n( 注2)一人称:書き手が自分自身をさす\n(注3)水を差す: わきから邪魔をする\n(注4)肝に銘じる: 心に強くきざみつけて忘れない\n(注5)一回性:一回起こるだけ\n(注6)知見:見解、見識","questions":[{"q":"筆者によると、人々は脳科学に何を期待しているか。","options":["複雑な脳の仕組みをわかりやすく説明してくれること。","どうすれば自分が幸せに生きられるかを教えてくれること。","人間の感情や思考や行動の扱い方を教えてくれること。","人間にとって幸せな人生とは何かを客観的に示してくれること。"],"answer":1,"explain":"Người ta kỳ vọng khoa học não: dạy cách SỐNG HẠNH PHÚC (幸せな人生のノウハウを提供してくれている). ✅B."},{"q":"脳科学について、筆者の考えに合うのはどれか。","options":["個人の人生に適用するには、普遍的な法則を見つけなければならない。","人の脳の機能をすべて解明できたとしても、普遍的な法則にたどり着けない。","普遍的な法則にたどり着いたとしても、人生の個々の事柄には応用できない。","普遍的な法則に到達するには、人生の個々の事柄を解き明かさなければならない。"],"answer":2,"explain":"Dù đạt quy luật phổ quát về não, vẫn KHÔNG áp dụng được cho từng trường hợp CÁ NHÂN cụ thể (普遍法則は人生の個別性に対して無力). ✅C."},{"q":"筆者が言いたいことは何か。","options":["科学が証明した事実は、個人や社会の価値観に影響を与える恐れがある。","科学だけでなく個人や社会の価値観を考慮したうえで、未来を選ぶ必要がある。","科学は個人や社会の価値観を扱えず、人類が望む未来の実現には役に立たない。","科学は事実を対象とするものであり、個人や社会の価値観を扱うものではない。"],"answer":3,"explain":"Ý chính: khoa học chỉ xử lý SỰ THẬT (事実), KHÔNG xử lý GIÁ TRỊ QUAN (価値観) của cá nhân/xã hội. ✅D."}]},{"source":"Mon10","bai":26,"date":"07/2025","title":"Mon10 - Bài 26 (07/2025)","passage":"美術館は芸術作品を楽しむ場所だ。しかし、予備知識なしに無心で楽しめるエンターテインメントと違って、アートを楽しむには特別な知識がいると①思っている人は多い。私はそうした考え方は大きな誤解だと思っている。\n\nしかし、そう考える人の気持ちがわからないではない。なぜなら、この国では子どもの頃からアートに親しむ環境が整っていないからだ。美術館では子どもはうるさくて邪魔な存在だとされている。美術館に来る資格があるのは分別のある大人だけだ――そう思われたら、敷居が高くなるのは仕方がない。しかし、その逆に、子どもの頃から美術館に何度も足を運び、なじみのある場所になっていれば、芸術作品との距離はもっと近づくだろう。\n\nでは、子どもたちに美術館を楽しんでもらうことはどうすればいいのだろうか。\n\n（中略）\n\n私がよくやるのは②「宝探し」だ。もともとはシカゴ美術館にいたときに同僚が実践しているのを見て面白いと思い、日本の美術館に来てからも実践している。\n\n「宝探し」のルールは簡単だ。子どもたちに美術館で販売されているポストカードを渡して、展示されているその作品を探すように言う。すると、彼らは絵を一生懸命見て、ポストカードに印刷されている絵を探す。\n\n作品を見つけ出したら、そのポストカードに感想を書いてもらう。どんなことを書いてもいい。感想が思い浮かばなければ、その絵の中に何が描かれているかということでいい。「見た」ものを書いてもらうだけでいいのだ。とにかく、作品は「見る」きっかけを作ることが目的である。\n\n大人はともすれば絵を頭で理解しようとする。この絵は印象派の巨匠○○が描いた絵だからすばらしい、というように、知識と実物を一致させるだけで満足してしまう。しかし、そんな見方が果たして本当に作品を「見た」と言えるだろうか。\n\n子どもたちは予備知識を持たずに絵を見る。そのときに「感動」しなくてもかまわない。一生懸命に「見る」だけでいいのだ。一枚の絵を一生懸命見たという体験だけで、美術館に来た価値は十分にある。\n\n美術館のすばらしいところは「本物」をその目で見られることだ。子どもたちは手にしたポストカードと作品を見比べて「色が違う」と気づくかもしれない。それだけでも立派な「発見」だ。本物と印刷物は違うのだということがわかるだけでも、実物を見た甲斐がある。\n\n私は、教育とは、自分の感性で感じ、自分の頭で考えられるよう、感性と知性を鍛えることだと思っている。問いに対する答えを教えるのだけが教育ではないはずだ。そして、美術館は、うまく使えば、感性を鍛えるすばらしい学校になりうる場所だ。なぜなら、美術館は「答えがたくさんある」ことを教えるのに最適な場だからだ。\n\n一人ひとり見る「目」も違えば、その作品を感じる「心」も、そこから考える「頭」も違う。答えは決して一つではないのだ。\n\n（注1）敷居が高い：近づきにくい\n（注2）ポストカード：ここでは、芸術作品が印刷されたはがき\n（注3）印象派：ここでは、絵画の流派の一つ\n（注4）巨匠○○：○○という名前の巨匠","questions":[{"q":"①思っている人は多いとあるが、そういう人たちの気持ちについて筆者はどのように考えているか。","options":["美術館は楽しむより学ぶ場所だと思われているから理解できる。","美術館には知識がないと理解できない作品が多いから理解できる。","芸術作品の楽しみ方は大人になってからしか学べないから理解できる。","子どもの頃から芸術作品に触れる体験が十分ではないから理解できる。"],"answer":3,"explain":"Đáp án đúng: D. Tác giả thông cảm vì môi trường cho trẻ tiếp xúc nghệ thuật từ nhỏ chưa đủ, nên người lớn mới nghĩ cần kiến thức mới hiểu được."},{"q":"筆者が、子どもたちに②「宝探し」をさせるのは何のためか。","options":["本物の価値を理解させるため","本物を実際に見る機会を作るため","本物を見た感動を忘れないようにするため。","本物を通して知識を確かなものにするため。"],"answer":1,"explain":"Đáp án đúng: B. Mục đích chỉ là tạo cơ hội để trẻ thực sự NHÌN tác phẩm gốc, chưa cần hiểu hay cảm động gì cả."},{"q":"筆者によると、美術館は子どもたちの教育にどのように役立つか。","options":["子どもたちはさまざまな発見を通して感性を磨けるようになる。","子どもたちは多くの作品の中から価値のあるものが見極められるようになる。","子どもたちは考えることより感じることのほうが大切だとわかるようになる。","子どもたちは感性を鍛えることができより良い答えが見つけ出せるようになる。"],"answer":0,"explain":"Đáp án đúng: A. Qua từng phát hiện nhỏ (như nhận ra ảnh in khác màu với bản gốc), trẻ mài giũa được cảm nhận (感性)."}]},{"source":"Mon10","bai":27,"date":"12/2025","title":"Mon10 - Bài 27 (12/2025)","passage":"完璧に記憶でき、忘れない脳があったらいいと思う方もいるでしょう。しかし、記憶は不完全になるように、あたかも設定されているかのようです。それどころか、都合よく記憶同士を合成したり、書き換えたりすることも行われます。場合によっては、自分の昔の恋人との記憶と、現在の配偶者との記憶が混在してしまう……というような事態も生じたりしてしまうわけですが。\n\nかといって、完璧に記憶できる人が仮にいたとしたら、一体どうなるでしょうか。嫌な思い出を忘れることもできず、周囲に合わせるための都合のよい記憶の書き換えもできず、かなりつらい人生を送ることになるでしょう。\n\n記憶が徐々に消えていく、あるいは書き換わる仕組みが存在するのは、より良く生きていくためには自然で、当たり前のことだと言えます。\n\n例えば、体験した危険な出来事を学習し、同様の事象を回避するための安全装置として記憶の仕組みが発達してきたのだとすれば、一定期間その危機がやって来なければ、その案件の重みづけを変え、優先順位を低く見直す仕組みが必要になります。それよりも、高頻度かつ致命的な影響を与え得る危険の方を優先的に回避するべきで、なかなか起こらないことに記憶のリソースを割いていると、かえって重要なことに対応できず、危険な状態になってしまいます。また、過去の失敗だけでなく、成功体験にとらわれやすくなるために、前例のないことには新しい挑戦をしにくくなります。\n\nしたがって、人間の能力の一部に過ぎない記憶力をことさら重要視する現代の教育や受験制度は、せっかく最適化されてきたはずの人類の生存戦略をかえってゆがめてしまっている可能性があるのではないかと思います。テストでは高得点を取るために記憶力が高い人が有利になるのは確かですが、その結果をそのまま優秀であるかどうかのランク付けとして使うのはいかがなものかと思います。\n\nというのも、テクノロジーの発達によって、不完全な人間の記憶力はどんどん補完されるようになってきており、実際にその仕組みは社会でも利用され始めているからです。文字をパソコンやスマートフォンで打つようであれば、漢字の書き方を忘れても大きな問題にはなりませんし、そもそも人間の漢字記憶力は、パソコンやスマートフォンには絶対に勝てません。ならば、使用頻度がそれほど高くない漢字を覚えるより、素直に電子機器の恩恵にあずかった方がよさそうです。\n\nこのような機器の性能はこれからさらに高まっていくわけですから、優秀な人を見分ける基準として記憶力という尺度を使うのは、多くの人が同じように感じていると思いますが、すでに時代にそぐわなくなってきているのかもしれません。","questions":[{"q":"記憶力が不完全であることについて、筆者はどう考えている。","options":["人間は完璧ではないので、当たり前だ。","良い思い出を増やせるので重要だ。","周囲に合わせて生きていくために不可欠だ。","よりよく生きていくために必要だ。"],"answer":3,"explain":"Đáp án đúng: D. Trí nhớ không hoàn hảo là cơ chế tự nhiên, cần thiết để sống tốt hơn (quên được, điều chỉnh lại ký ức)."},{"q":"その案件の重みづけを変え、優先順位を低く見直すのは何のためか。","options":["過去の体験の記憶を書き換えるため","危険な出来事に対する恐れをなくすため","起こる可能性の高い重大な危険に備えるため","人生に影響を与える新しい挑戦をしやすくするため"],"answer":2,"explain":"Đáp án đúng: C. Hạ ưu tiên những nguy cơ hiếm gặp để dành nguồn lực ghi nhớ cho nguy cơ nghiêm trọng, dễ xảy ra hơn."},{"q":"現代の教育や試験制度について、筆者はどう述べている。","options":["いくら技術が発達しても、技術で人間の記憶力の優劣を測るには限界がある。","技術で記憶力が補える時代に記憶力で人の優秀さを判断するのは問題である。","技術発達に応じて、時代にあった尺度で記憶力を測る必要がある。","技術の恩恵を受け入れるようになり、人間には記憶力以外の力が求められる。"],"answer":1,"explain":"Đáp án đúng: B. Thời đại công nghệ đã bù đắp được trí nhớ, nên dùng trí nhớ để đánh giá sự ưu tú của con người là có vấn đề."}]},{"source":"Mon11","bai":26,"date":"07/2025","title":"Mon11 - Bài 26 (07/2025)","passage":"A\n\n人は不安を感じたり緊張したりすると、慌てたり身体の動きがぎこちなくなったりして、本来の力が発揮できなくなることがある。そういうときは、「うまくいかなかったらどうしよう」といったマイナスの思考をしないようにする必要がある。そのためには、自分自身に肯定的な言葉を発することが効果的だ。「きっとうまくいく」と言い聞かせたり、「こうなりたい」という具体的なイメージを言葉にしたりする。脳は自分が発した言葉を真実だと認識しようとするので、その言葉どおりになると思えてきて不安な気持ちが和らいでいく。つまり、心の状態はコントロールが可能なのだ。心の状態が好転すれば、身体もスムーズに動き本来の力が発揮できるはずだ。\n\nB\n\n人は不安な状態に陥ると、反射的に下を向いてしまいます。このように、人間の身体というものは、心の微妙な動きに反応しているのです。こうした身体と心の関係性をうまく活用すると、身体の動きを操作することで心の動きまでもコントロールすることができるようになります。\n\nたとえば、不安でしょうがない状態になったときは意識的に目線をあげてみる。極度に緊張して呼吸が早くなったとしたら、息を大きく吸い込んで深呼吸をしてみる。\n\nシンプルにいうならば、今の身体の状態に対して、すべて反対の方向に身体を動かせばよいのです。目線をあげれば不安は解消されますし、深呼吸をすれば落ち着いた状態になります。\n\nそもそも、心の状態というものは、自律神経を通して身体の反応へと現れてくるものなのですが、こうした作用を逆転させてやることで、身体の動きから自律神経に対して、逆のアプローチをかけていくことができるのです。\n\n（注）自律神経：意志とは無関係に、身体の機能を自動的に調節する神経","questions":[{"q":"不安を感じたり緊張したりしたとき、AとBはどうすればよいと述べているか。","options":["AもBも、深呼吸しながらうまくいっている状態をイメージすればよいと述べている。","AもBも、今の身体の状態を落ち着かせる動きをすればよいと述べている。","Aは自分がどうなりたいかを具体的に言葉にすればよいと述べ、Bは身体の力を抜いて呼吸を整えればよいと述べている。","Aは自分に前向きな言葉をかければよいと述べ、Bは今の身体の状態が反対になるようにすればよいと述べている。"],"answer":3,"explain":"Đáp án đúng: D. A nói nên tự nói lời tích cực với mình; B nói nên làm ngược lại trạng thái cơ thể hiện tại (ngước nhìn lên, hít sâu...)."},{"q":"AとBで共通して述べられていることは何か。","options":["心の状態を変えるには思考を変える必要がある。","心の状態を自覚することは難しい。","心の状態は身体の状態から影響を受けやすい。","心の状態は自分の力でよい方向に変えられる。"],"answer":3,"explain":"Đáp án đúng: D. Cả A và B đều cho rằng trạng thái tâm lý có thể tự mình điều chỉnh theo hướng tốt lên."}]},{"source":"Mon11","bai":27,"date":"12/2025","title":"Mon11 - Bài 27 (12/2025)","passage":"A\n\n日々の家事を頑張りすぎて疲れてしまっている人が多いという。情報番組や雑誌で「整った快適な住まい」や「健康のための手作りの食事」などが頻繁に取り上げられるので、知らないうちに自分の基準が必要以上に高くなり、多くの時間や労力を費やしてしまっているのではないか。他人の基準ではなく自分が何を大切にしたいかを考え、そうではないことは積極的に手を抜いていくことが、ゆとりのある、自分らしい生き方につながるだろう。\n\nこういう人たちは手を抜くのは悪いことだと思うかもしれない。しかし「毎日しなければならないか」「どのレベルまでやらなければならないか」といったことは、本来自分で決めるものだ。正解はないはずなのに、いつのまにか世の中の高い基準に縛られてはいないだろうか。\n\nB\n\n生活の中で、何を大切にし、何をそぎ落としていくかは人それぞれに違います。周りの人にとっては無駄に思われても、自分にとってそれが大切なものであれば、それはそぎ落とす必要はありません。\n\nただ、あまりにも抱えているものが多いという人もいます。これは絶対にやらなければならない――生真面目な人ほどそう思い込んでしまうものです。\n\n（中略）\n\nあまり自分を追い詰めないで、時々は手を抜いてみましょう。手を抜いたことで何らかの支障が出たなら、そのときにまた従来通りに戻せばいい。手を抜いても何も変わらないのであれば、それはやらなくてもいいものと考えるわけです。\n\n手を抜くという行為は悪いことだと思われがちですが、そうではありません。すべてのことを完璧にするのは無理なことです。大切なことは、手を抜いていいものといけないものを仕分けすることだと思います。\n\n（注）そぎ落とす：ここでは、削る","questions":[{"q":"生活の中で手を抜くことについて、AとBはどのように述べているか。","options":["Aは手を抜くことは悪いことではないと述べ、Bは手が抜けるものを増やしたほうがいいと述べている。","Aは手を抜けるものを探し出したほうがいいと述べ、Bは完璧にできなくても、手は抜かないほうがいいと述べている。","Aは大切でないことは手を抜いたほうがいいと述べ、Bは手を抜くものと抜かないものを明確にしておけばいいと述べている。","Aはできるだけ手を抜くべきではないと述べ、Bはいったん手を抜いてみて、うまくいかなければ元のやり方に戻せばいいと述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói nên cắt giảm việc không quan trọng; B nói nên phân định rõ việc nào được cắt giảm, việc nào không."},{"q":"AとBの認識で共通していることは何か。","options":["家事に多くの時間や労力を費やすのは無駄だ。","生活において何を重視するかは自分次第だ。","自分の基準にこだわりすぎるのはよくない。","自分のしたいことだけをするほうが有意義だ。"],"answer":1,"explain":"Đáp án đúng: B. Cả hai đều cho rằng việc coi trọng điều gì trong cuộc sống là do chính mình quyết định, không theo chuẩn của người khác."}]},{"source":"Mon12","bai":26,"date":"07/2025","title":"Mon12 - Bài 26 (07/2025)","passage":"人間同士の将棋、勝負というのは、ただ盤上で能力を発揮し合うだけのものではありません。必ずそこに至るまでのプロセスがあります。強い相手と戦うことになってプレッシャーを受けたり、「ああ、厳しい相手だなあ」と萎縮してしまって勉強の意欲が減ったりすることだってあります。でも、「それじゃダメだ」と自分の心と戦ったり、整理をつけたりして最終的に対局当日を迎える。もちろん盤上の戦いもすごく大変なのですが、必ず事前にそういうステップを踏んでいます。\n\n人間の強さというのは、他人との戦いはもちろんですが、自分自身との戦いによっても生まれ、育っていくものなのです。\n\nそれに、人間は疲れも感じるし、集中力も永遠には続きません。判断ミスだって何度もします。\n\nしかし、そんなちっぽけな一人の人間が焦りや苦しさを乗り越えて、観ている側が感動したり、あっと驚くような勝負をしたりする。それこそが人間の将棋の醍醐味だと思うのです。\n\n（中略）\n\nよく言われることですが、コンピューターに悩みやプレッシャーはありません。いくらコンピューターが強くても、先ほど述べたような人間的なプロセスを乗り越えてきているわけではない。\n\n強いコンピューターというのは、開発者のプログラミング能力、また人間的な意味で言えば閃きに懸ける情熱とか、そういうものが評価されていきます。ただそれは、人間の将棋の強さとは別の軸にあるものだと思うのです。\n\nその相容れないまったく別物の強さを競わせたのが、棋士対コンピューター戦です。その結果、コンピューターのほうが強かったとしても、人間の強さが魅力や意味を失うわけではないでしょう。\n\nもちろん、棋士がコンピューターに負けたら、ファンの方がガッカリする気持ちもわかります。いままで人間同士の素晴らしい戦いを観てきて、最強棋士のすごさを体感してきた。そういう中でソフトという新しい存在が出てきてそれに負かされたら、人間は感情の生き物である以上、落胆するのも当然だと思うのです。\n\nいままで自分が興奮や感動してきたものは何だったのだ、と。\n\nただ実は、人間とコンピューターの強さというのは一緯にかけるものではなくて、それぞれが固有の良さを持っているものだと思うのです。\n\n人間対人間、人間対コンピューター、コンピューター対コンピューター。大きく分ければこの三つになると思いますが、これらはそれぞれに独立した魅力があって、お互いを阻害するものではありません。そこを分けて考えることが大事なのではないでしょうか。\n\nこの三つのコンテンツを徹底的に味わいつくしたうえで、コンピューター対コンピューターの対戦が一番面白いと思えば、人間の強さに魅力を感じなくなっても仕方がないとは思います。でもきちんと比較もせずに、なんとなく時代の流れやちょっとしたインパクトだけで、人間対人間の面白さの魅力が薄らいだと思うのはすごくもったいない。","questions":[{"q":"人間同士の将棋の魅力について、筆者はどのように考えているか。","options":["勝負に至るまでの苦悩を抱えつつ、戦いに臨んでいる棋士に魅力がある。","勝負自体ではなく、勝負の前の自分自身と戦うプロセスに感動する。","焦りや苦しさを克服して、勝った棋士に魅力が感じられる。","弱い側が強い相手に挑んで勝つ勝負にこそ感動する。"],"answer":0,"explain":"Đáp án đúng: A. Sự hấp dẫn nằm ở việc kỳ thủ vẫn bước vào trận dù đang mang nỗi khổ tâm trước đó, không chỉ ở kết quả thắng."},{"q":"コンピューターによる将棋について、筆者はどのように述べているか。","options":["強さの基準が人間とは異なるので、人間の棋士と比べられるものではない。","常に一定の能力が発揮できるので、人間を感動させる勝負はできない。","人間には超えることができない力があり、人間と勝負することに意味はない。","人間のような焦りや苦しさは感じないので、人間の強さは超えられない。"],"answer":0,"explain":"Đáp án đúng: A. Tiêu chí mạnh của máy tính khác hẳn con người (không trải qua quá trình tâm lý con người), nên không thể so sánh trực tiếp."},{"q":"筆者の考えに合うのはどれか。","options":["三つの対戦を十分に味わってはじめて、将棋の本当の魅力に気づくことができる。","三つの対戦をきちんと比較すれば、人間同士の将棋が最も面白いとわかる。","コンピューターによる将棋の出現で人間同士の将棋の魅力が失われたわけではない。","コンピューターによる将棋の出現のおかげで将棋の魅力が増したとは言えない。"],"answer":2,"explain":"Đáp án đúng: C. Sự xuất hiện của cờ tướng máy tính không làm mất đi sức hấp dẫn của cờ tướng giữa người với người."}]},{"source":"Mon12","bai":27,"date":"12/2025","title":"Mon12 - Bài 27 (12/2025)","passage":"生活者に、○○と言えば、自社の商品、という形で自社商品を第一想起させるには、商品は広告の中心に置かれていなければならない。しかしいつの間にか、商品を中心に置くということが広告をする上でないがしろにされてきている。どの企業からも似たような商品しか出てこなくなり、商品のコモディティ化が進んできてしまったため、商品の差別化を、イメージだけでなんとか乗り切ろうとしている。テレビCMでもウェブ動画でも、商品の存在は最後の最後まで消し去られ、ちょっとおもしろい、ちょっと楽しい、ちょっと感動するような話が繰り広げられ、最後のほんの一瞬に商品が紹介されて終わる広告だ。これらはたいてい、最後に登場する商品が仮に他社の商品でもなんとなく成立してしまう。広告はおもしろくてちょっと話題になるかもしれないが、話題の中心は広告であり、商品は忘れ去られている。なんの商品の広告だったかも覚えられていない。\n\nこの様な、イメージによって差別化を図る最近の形として挙げられるのが、この数年、世界の広告賞でも取り上げられている「ソーシャルグッド」と呼ばれる種類の広告だろう。社会的な問題、たとえば国家対立や貧困、ジェンダー問題といった世界の誰もが抱えている、もしくは理解できる問題を提起し、決してその問題を根本的に解決するわけではないが、生活者に考えるきっかけを与えたり、はっと気づかせたりする広告だ。「作品」として素晴らしいものばかりで、多くの気づきを与えてくれる。ただしこれらの広告により、どこまで生活者の態度変容を引き起こすことができたのかは疑問である。\n\n確かに素晴らしい気づきを与えてくれて、この様なメッセージを発信する商品は良いブランドだと感じる。ただし「良いブランド」止まりであり、これだけでは自分の生活を良くするのに必要な存在にはなれない。かつ、この様な尊いメッセージを発信するばかりに、かえって近寄り難い存在になることもある。\n\n（中略）\n\n大切なのは広告で社会奉仕をすることでも、良いイメージを与えることでもなく、商品を生活者にとって必要な存在にすることである。商品を生活上役に立つ存在だと認識してもらい、買うに値する理由を明確にすることだ。商品は、この世で必要だと思ってくれる人がいるから存在することができる。だからこそ明確な購買理由を提案していくのだ。\n\n（注1）想起する：思い起こす\n（注2）コモディティ化：一般化","questions":[{"q":"ないがしろにされてきているとあるが、なぜか。","options":["商品のイメージに関心が持たれるようになったから","商品ではなくイメージでしか違いを出せなくなったから","商品を最後に紹介するほうが強く印象づけられるから","商品を強く訴えることが良いイメージを与えなくなったから"],"answer":1,"explain":"Đáp án đúng: B. Doanh nghiệp không còn tạo khác biệt được qua chính sản phẩm, nên chỉ còn trông vào hình ảnh/cảm xúc trong quảng cáo."},{"q":"「ソーシャルグッド」と呼ばれる種類の広告について、筆者はどのように述べているか。","options":["商品に関心を持たせることはできるが、商品の価値が過大評価されかねない。","社会的な問題の解決につながるが、商品の良さを伝えることはできない。","社会的な問題の提起が目的であり、商品の宣伝効果を期待するものではない。","社会的な問題への関心を持たせられるが、商品が実際に必要だと感じられにくい。"],"answer":3,"explain":"Đáp án đúng: D. Dù khiến người xem quan tâm vấn đề xã hội, nhưng khó khiến họ thấy sản phẩm thực sự cần thiết."},{"q":"広告について、筆者はどのように考えているか。","options":["商品が実生活において価値があることを示すべきだ。","商品が社会にどのように役に立つかを示さなければならない。","商品の購入を促すだけのものであってはいけない。","商品を購入する際になくてはならないものにするべきだ。"],"answer":0,"explain":"Đáp án đúng: A. Quảng cáo phải cho thấy giá trị thực tế của sản phẩm trong đời sống, không chỉ dựa vào hình ảnh/cảm xúc."}]},{"source":"Mon10","bai":25,"date":"07/2026","title":"Mon10 - Bài 25 (07/2026)","passage":"子どもの言いなりになってしまう親は、子どもの要求を何でも聞いてあげることが、子どもの意見を尊重することだと思っているところがあります。子どもが習い事をしたいと言ったら何でも習わせる、子どもが行きたいというならどこでも連れて行ってあげる、といったように。\n\n確かに、習い事などは子どもが自分から何かをやりたいと言っているのですから、子どもの意見を尊重しているという面もあります。子どもの行きたいところに行くのも、子どもの好奇心を満たしてあげたい、いろいろなところに行っていろいろな体験をしてほしいという親心もわかります。そして実際にプラス面も多々あります。\n\nただ、その子どもの「要求」と「意見」は違います。小学生くらいのお子さんの場合は、あまりよく考えないでなんとなく「やってみたい」「習いたい」「ここに行きたい」「これ欲しい」と言うことはよくあります。これは脳が発達段階にあるため、仕方がないことなのです。問題は、子どもの要求に対して親がどう対応するかです。子どもの要求をなんでもかんでも聞いてあげるのは、意見の尊重ではなく単なる甘やかしです。\n\n子どもを甘やかしてしまう親は、子ども可愛さのあまりつい子どもの言いなりになったり、忙しさを理由にして子どもにかける手間を省くために甘やかしてしまうという場合が多いのです。\n\nどちらにしても、一時的な甘やかしではないため、その甘やかしはエスカレートしていくことになりかねず、将来的には親子双方にとって禍根（注1）を残すことになります。親にも限度がありますから、子どもの要求にすべて応えることはできません。すると、あるところで破綻します。\n\n子どもの脳には、「私が言ったことを親は全部聞いてくれる」という回路が形成されてしまっています。そうなった段階で自分の要求が叶わないとなると、子どもは「もう私（僕）のことが可愛くないの？」「私（僕）のことが嫌いになったの？」と親を責めます。親は親で「望むことは何でも叶えてあげたのに、どうしてこんなことになったんだろう」と嘆く。\n\nどうしてこんなことになったのかといえば、親子での「対話」による「交渉」や「妥協」が何もなかったからです。\n\nそうならないためには、子どもとよく「対話」をして、その「要求」に対して「意見」をプラスするように親が導いてあげることが必要です。「○○を習いたい」という要求に対して、「どうしてそれを習いたいのか」「そうすることで何が起きるのか」ということを子どもとよく話し合った上で、子ども自身が自分の意見を修正できるようになればベストです。\n\n（中略）\n\n子どもの要求に対しては、ただやみくもに（注2）ダメと言うのでもなく、かといって要求をすべて呑む（注3）のでもなく、子どもとの「対話」を通じてお互いにとっての「妥協点」を探るための愛情のこもった「交渉」の場にすることが、子どもの知的発達にとってプラスになるのではないかと思います。\n\n（注1）禍根：ここでは、災いの種\n（注2）やみくもに：むやみに\n（注3）呑む：ここでは、受け入れる","questions":[{"q":"①子どもの要求について、親はどうすればいいか。","options":["子どもの気持ちを反映したものなので、できるだけ尊重したほうがいい。","明確な理由もなく言っているものもあり、すべてには応えなくてもいい。","脳の発達段階によって変わるものであり、対応の仕方を変えてもいい。","好奇心の表れではあるが、対応は慎重にしたほうがいい。"],"answer":1,"explain":"Đáp án đúng: B. Tác giả nói nhiều yêu cầu của trẻ không có lý do rõ ràng (vì não đang phát triển), nên không phải cái gì cũng đáp ứng; cha mẹ cần đối thoại để điều chỉnh."},{"q":"②破綻しますとあるが、破綻すると子どもはどうなるか。","options":["どうして自分の要求を叶えてくれないのかと親を問い詰めるようになる。","自分に対する愛情がなくなったと考え、親を責めるようになる。","自分の要求のすべてを叶えてもらえないとわかり、親に期待しなくなる。","自分の要求は聞いてもらえないと諦め、親と「対話」しなくなる。"],"answer":1,"explain":"Đáp án đúng: B. Khi yêu cầu không được đáp ứng, trẻ cho rằng cha mẹ không còn yêu thương mình (「もう私のことが可愛くないの？」) và trách cha mẹ."},{"q":"筆者によると、何かを要求する子どもに対して、親はどのように対応するのがよいか。","options":["「対話」をしながら子どもの意見を確認し、要求に応じられるようにする。","「対話」を根気よく繰り返し、子どもが自ら要求を改めるように促す。","「対話」を通して、互いに合意可能なものになるように話を進める。","「対話」をする中で、互いに譲歩ができるようにする。"],"answer":2,"explain":"Đáp án đúng: C. Tác giả muốn tìm 'điểm thỏa hiệp' (妥協点) qua đối thoại — tức điều cả hai bên có thể chấp nhận."}]},{"source":"Mon11","bai":25,"date":"07/2026","title":"Mon11 - Bài 25 (07/2026)","passage":"A\n\nやりたい仕事のために必死に努力している時に、行き詰まりを感じることがある。そういう時にまずすべきことは、なぜそのような状態になっているのかを考えることだ。必要な知識やスキルが足りていないのかもしれないし、これまでの努力のしかたが間違っていたのかもしれない。原因を把握し、自分にできることはすべてやってみる。もちろん、最善を尽くしたとしても成功できない可能性もある。しかし、努力を通して身につけたことこそが自分の強みになるのだ。その努力は、いつか別の道に進むことになっても生きてくるだろう。\n\n行き詰まりを感じた時は、潔く別の分野に方向転換すればいいという考えもあるが、そう簡単に努力するのをやめてしまったらよい結果には結びつかない。まずは一つの分野で努力し続けることが重要だ。\n\nB\n\n人は必死になって努力をしていると、どうしても一つのことしか目に入らなくなりがちです。それはそれで間違っていませんし、努力とはそういうものだと思います。\nしかし、どうしてもそれが実らなかったり、行き詰まってこれから先何をしていいのかわからなくなったりした時、一度頭を柔軟にして別の分野へ方向転換してみるのも一つの方法です。（中略）\nもちろん、方向転換して成功するためには、その別の分野に手を出す以前にどれだけ努力していたかが大切です。そこでつくった蓄積がなければ、別の分野へ移ったところでそれが武器になることはありません。単純にまた一からやり直しになるだけで、余計時間がかかり、混迷していくことになるでしょう。でももし本当に努力してその分野のことをしっかりと身につけていれば、別の分野への挑戦を果たした時、それがとても大きな武器となることがあるのです。","questions":[{"q":"行き詰まった時の対処のしかたについて、AとBはどのように述べているか。","options":["AもBも、原因を把握したうえで、異なるやり方で取り組んでみるべきだと述べている。","AもBも、一つの分野にこだわらず、新しいことに挑戦してもいいと述べている。","Aは自分に対処できることをすべてやってみたほうがいいと述べ、Bはこれまでに身につけたことを生かせる分野を探すべきだと述べている。","Aはうまくいかない原因を追究するべきだと述べ、Bは思い切ってほかの分野にチャレンジしてもいいと述べている。"],"answer":3,"explain":"Đáp án đúng: D. A cho rằng cần tìm nguyên nhân khiến mình không thành công; B cho rằng có thể dứt khoát chuyển sang lĩnh vực khác (思い切って)."},{"q":"AとBの認識で共通していることは何か。","options":["必死に努力している時は、広い視野で物事を見ることが難しい。","必死に努力して身につけたことは、状況が変わっても役に立つ。","必死に努力し続ければ、困難があっても乗り越えられる。","必死に努力し続けなければ、よい結果につながらない。"],"answer":1,"explain":"Đáp án đúng: B. Cả hai đều cho rằng điều đã nỗ lực để học được sẽ còn có ích dù đổi hướng (A: 別の道に進んでも生きてくる; B: 蓄積が武器になる)."}]},{"source":"Mon12","bai":25,"date":"07/2026","title":"Mon12 - Bài 25 (07/2026)","passage":"女性であれ男性であれ、人は自然体でいる時には自分についてなどおよそ意識していないにもかかわらず、自我のスイッチが入ると、たちまち自分を意識化して、感覚的にも理論的にも自己肯定しようとします。人に自意識がある以上いたしかたない（注1）のかもしれませんが、仕事で自我が芽を出したなと気づいた時に、できるだけ早くその芽を刈り取るべきです。（中略）\n\n自我が出すぎていないかどうか自覚するためには、折ある（注2）ごとに自分を疑ってみなければなりません。何かよい案を思いついても、その直後に、これは第三者にもちゃんと伝わるのだろうか、と自分を疑ってみる。自画自賛に陥ってはいないだろうか、と。なぜなら、どんな仕事でも本来、こちらの自我をあちらの他者に押し付ける所行（注3）ではなく、多くの人々と共鳴するところを冷静に感じ極める作業だからです。もちろん対象によってその程度は異なるし、自分の想いの丈（注4）をぶつけていい場合もあります。\n\n例えば自己資金で限定十個の作品を販売するのなら、自我を抑える必要などないでしょう。自分の想いを存分にぶつけた作品に共鳴してくれる人が、この広い世の中に十人くらいなら存在するはずだからです。たとえまったく売れなくても、その責任は自分でとればいい。あるいはその人の作家性を期待されて仕事の依頼を受けたのなら、思いっきり自分がやりたいだけやればいい。ただし、予算や制作期間の問題などで関係者に迷惑を掛けることは、むろん許されませんが。\n\nでは、道路標識のデザインはどうか。この仕事を任されたデザイナーの自我はどのくらい必要でしょうか。公共のサインである道路標識は、言葉も価値観も視力も、文化的背景すらも異なる人たちがほんの一瞬見て判断するグラフィックデザインであり、場合によっては命にかかわるものなので、できる限りの普遍性が求められます。つまり、道路標識をデザインする人の「自我」は、どこからも求められてはいないのです。同様のことは、老若男女誰にでも使用される可能性がある嗜好品などについても言えるし、使用する素材の資源の問題やコスト、使用済みになった後の処理にまで考えを及ぼすとすれば、自分勝手が許される余地などどこにもないのではないでしょうか。\n\nこのように、対象によってなすべき内容が異なるのだから、与えられた仕事がどんな環境にあるかを客観的に把握しなければなりません。それでも、無意識にも自我はあるとすでに記したように、自分を意識していなくても自我は出てきてしまうものなので、自分のしていることを客観的に見るのはたやすくありませんが、常に相手や周囲の環境を優先し、それらを客観的に理解する習慣がつくと、厄介な「自我」の呪縛（注5）から解放され、楽になり、なすべきことが浮かび上がってくる。それは対象から自ずと表れ出てきたもので、主体は自分ではなく、飽くまで相手なのです。\n\n（注1）いたしかたない：仕方がない\n（注2）折ある：機会がある\n（注3）所行：行為\n（注4）想いの丈：ここでは、想いのすべて\n（注5）呪縛：縛り","questions":[{"q":"自分を疑ってみなければなりませんとあるが、なぜか。","options":["仕事では、自己中心的にならずに他者と共感できる点を見極める必要があるから。","仕事では、自信過剰にならずに自分の能力を正しく評価することが重要だから。","仕事では、冷静に主張し自分の案に共感してもらわなければならないから。","仕事では、どんな場合でも他者に自分の案を押し付けてはいけないから。"],"answer":0,"explain":"Đáp án đúng: A. Tác giả nói công việc thiết kế là tìm điểm đồng cảm với nhiều người, không phải áp đặt cái tôi nên phải tự hỏi mình có đang tự ái/tự khen không."},{"q":"デザインの仕事における自我について、筆者の考えに合うのはどれか。","options":["普遍性が求められる場合より自我が求められる場合のほうが一般的だ。","作家性が求められる場合でも、自我より普遍性が優先される。","何をデザインするかによって自我が求められる程度は異なる。","デザインの対象にかかわらず、自我を出しすぎてはいけない。"],"answer":2,"explain":"Đáp án đúng: C. Tùy đối tượng (作品 cá nhân hay biển báo giao thông) mà mức cái tôi được phép khác nhau. Tác giả nói rõ điều này."},{"q":"仕事に対する姿勢について、筆者はどのように考えているか。","options":["自分自身がなすべきことを見つけ出すことが必要だ。","自分自身より相手や周囲の意見を優先するべきだ。","無意識に自分を縛ってきたものを取り除くべきだ。","相手や環境を客観的に理解することが必要だ。"],"answer":3,"explain":"Đáp án đúng: D. Tác giả khuyên luôn hiểu đối tượng và môi trường một cách khách quan; từ đó việc cần làm sẽ tự hiện ra."}]},{"source":"Mon11","bai":1,"date":"07/2010","title":"Mon11 - Bài 1 (07/2010)","passage":"A\n\nしっかりした人生を歩むには、やはり「学歴」が必要です。そう断言すると（注１）眉をひそめる人もいるかもしれません。\n\nしかし私には、学歴なんかいらない、あるいは、（注２）ほどほどでかまわないという考え方は、中途半端なきれいごとに思えてなりません。\n\n学歴がなくて苦労をしたという話は、昔はさんざん聞かされました。最近はあまり言われていないだけで、本当はもっと厳しい選別が行なわれているそうです。（中略）\n\n親ならば、一生を幸せに生きていける、一生、食べるのに困らない「生きる力」を、子供に付けさせるべきです。そして、そのための最良の方法が「学歴を付けさせる」ことだということは、今も昔も、変わりないのではないでしょうか。\n\n（和田寿栄子『子供を東大に入れる母親のちょっとした「習慣術」』による）\n\nB\n\nいったい、学歴とはなにものなのか。\n\n会社は、厳しい過当競争のさなかにあって、実力で勝負しなければならないというのに、そこで働いている人は、入社前に教育を受けた「場所」で評価されるというのは、どう考えても納得がいかない。教育の「質」が問われるのならばまだ解る。「場所」というのは、正常ではない。わずか数年間の学校教育が、以後何十年にもわたって、その人の看板として通用するというのは、奇妙というほかはない。\n\n（中略）\n\nほんの小さなグループから出発した私たちの会社では、何でもやれる人が、それをやる、といった気持ちで仕事をしてきたつもりであったのに、人数が増えてくるに従って、いつとはなしに、学歴による区分といった方式が、なんとなくとり入れられつつある事実に気付いて、はっとしたことがある。\n\n（盛田昭夫『学歴無用論』による）\n\n（注１）眉をひそめる：不快に感じる\n\n（注２）ほどほど：ちょうどよい程度","questions":[{"q":"AとBの認識で共通しているのは何か。","options":["学歴の重要性は否定できない。","学歴による区別は実在する。","学歴よりも実力が重要だ。","学歴は実在と関係がある。"],"answer":1,"explain":"Đáp án đúng: B. Sự phân biệt dựa trên học vấn là có thật."},{"q":"学歴や学校教育について、Bが批判しているのはどのようなことか。","options":["実際の社会では学歴は関係なく、何でもできる人が高く評価されること。","社会人になってからも、どこで学校教育を受けたかが重要視されること。","実際の社会で必要とされる実力が、学校教育では養成されていないこと。","社会的には学歴が重視されているのに、企業ではそれが通用しないこと。"],"answer":1,"explain":"Đáp án đúng: B. Ngay cả khi đã trở thành người của xã hội, nơi được giáo dục ở trường vẫn được coi trọng."},{"q":"AとBの二つの文章を以下のようにまとめる場合、①と②に入るものの組み合わせとして適切なのはどれか。「Aの筆者は（①）と考えているが、Bの筆者は（②）と考えている。」","options":["①学歴が高ければ高いほどよい／②社員が多くなれば学歴と言う区分も大切だ","①学歴を得るために苦労が必要だ／②会社で競争に勝つには学歴は通用しない","①学歴は生きていくのに必要なものだ／②会社は社員の学歴より実力を重視するべきだ","①子供に学歴を付けさせるのは親の役目だ／②社員は専門の知識と学歴の両方が必要だ"],"answer":2,"explain":"Đáp án đúng: C. A cho rằng học vấn cần thiết để sống vững vàng; B cho rằng công ty nên coi trọng thực lực hơn học vấn. (Câu 3 của đề gốc 07/2010, bổ sung từ đề chính thức; đáp án chính thức: 3.)"}],"trans":"A Để có một cuộc đời vững chắc, \"học vấn\" là điều cần thiết. Có thể một số người sẽ nhíu mày khi tôi khẳng định như vậy. Tuy nhiên, tôi thấy những suy nghĩ như \"học vấn không cần thiết\" hoặc \"vừa đủ là được\" chỉ là những lời nói suông nửa vời. Ngày xưa, tôi đã nghe rất nhiều câu chuyện về những người gặp khó khăn vì không có học vấn. Có thể gần đây người ta không nói nhiều về điều đó, nhưng thực tế, sự sàng lọc còn khắt khe hơn nhiều. Nếu là cha mẹ, chúng ta nên trang bị cho con cái \"năng lực sống\" để chúng có thể sống hạnh phúc cả đời, không lo thiếu ăn. Và phương pháp tốt nhất để làm điều đó chính là \"cho con cái học vấn\", điều này vẫn không thay đổi từ xưa đến nay.\n\n(Trích từ \"Những thói quen nhỏ của người mẹ cho con vào Đại học Tokyo\" của Wada Sueko)\n\nB\n\nRốt cuộc, học vấn là gì? Các công ty đang phải cạnh tranh khốc liệt, phải dùng thực lực để chiến thắng, vậy mà những người làm việc ở đó lại được đánh giá dựa trên \"nơi\" họ được đào tạo trước khi vào công ty, điều này thật khó hiểu. Nếu đánh giá \"chất lượng\" giáo dục thì còn có thể hiểu được. Nhưng đánh giá \"nơi\" học thì thật bất thường. Việc một vài năm học ở trường lại trở thành tấm biển hiệu cho cả cuộc đời của một người trong hàng chục năm sau đó, quả là kỳ lạ.\n\n(Trích) Công ty chúng tôi xuất phát từ một nhóm nhỏ, mọi người làm việc với tinh thần ai làm được gì thì làm. Nhưng khi số lượng nhân viên tăng lên, tôi nhận thấy rằng cách phân chia dựa trên học vấn đang dần được áp dụng, điều này khiến tôi cảm thấy nhẹ nhõm.\n\n(Trích từ \"Luận về việc không cần học vấn\" ー Morita Akio)\n\nChú thích:\n\n(注1) 眉をひそめる : cảm thấy khó chịu\n\n(注2) ほどほど : mức độ vừa phải"},{"source":"Mon11","bai":2,"date":"12/2010","title":"Mon11 - Bài 2 (12/2010)","passage":"A\n\nテレビや新聞などで年々深刻化するゴミ問題が取り上げられている。例えば一般的な家庭ごみとして、生ゴミのほかにも食品容器などの過剰包装による廃棄物が多く見られるという報告がある。最近では指定されたゴミ袋を買ってゴミを捨てたり、客に買い物袋の持参を促したりする動きがあるが、ゴミの量に変化は見られない。\n\nもし、自治体が家庭ごみ一個の収集につき〇〇円と有料化すればゴミは減るかもしれない。ゴミ自体の廃棄にもお金がかかるようになれば、誰もがゴミを出す前に考えるようになるだろう。そうなれば消費者は不必要な包装を断り、使用可能な物まで捨ててしまうことも減少するのではないだろうか。\n\nB\n\n現代社会は数十年前と比較にならないほど便利な生活が可能になった。しかし、不要になった物を再利用することよりも便利さを優先してきた結果、家庭ごみは増え続ける一方だ。\n\n家庭ごみを減量するため、現在、ゴミ袋を有料化し消費者が処理費用の一部を負担することになっている。しかし、それだけでは不十分であり、所定の場所でのごみの収集にかかる費用を消費者に負担させようという意見も出ているが、そうなればごみを所定以外の所に隠れて捨てるおそれも出てくる。このような問題を解決せずに安易にこれを実行に移すのには賛成しかねる。\n\n物が生産され、消費者が購入し、不要なものは廃棄されゴミになるという循環を考えると、新しい製品を次々と作りだす生産者も、それに慣れ切ってしまった消費者も便利さに対する意識を変える必要があるのではないか。","questions":[{"q":"AとBが共通して問題だと指摘していることは何か。","options":["家庭ごみが所定の場所以外に捨てられること。","ゴミ処理の費用を消費者が負担すること。","ゴミ問題への生産者側の意識が薄いこと。","家庭で出されるゴミが減らないこと。"],"answer":3,"explain":"Đáp án đúng: D. Lượng rác thải sinh hoạt không giảm."},{"q":"家庭ごみ収集の有料化についてAとBはどのように述べているか。","options":["AとBも、ゴミ処理費用を消費者が負担することになるので、ゴミの減少に貢献するだろうと述べている。","AもBも、有料化しても家庭ごみは減らないばかりか、ゴミ捨ての規則を守らない人が出てくるだろうと述べている。","Aでは有料化すればゴミに対する考え方が変わるだろうと述べ、Bでは有料化する前に意識改革が必要だと述べている。","Aでは有料化すれば資源の無駄遣いが少なくなるだろうと述べ、B では有料化すれば便利さに対する意識が変わると述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng việc tính phí sẽ thay đổi cách suy nghĩ về rác thải, trong khi B nói rằng cần phải thay đổi nhận thức trước khi tính phí."},{"q":"ゴミ問題についてAとBはどのように考えているか。","options":["AもBも生産者と消費者の双方が協力すれば改善できると考えている。","AもBも、自治体の協力を得て消費者自身が対応すべき問題だと考えている。","Aでは消費者が対応すべきだと考えているのに対し、B では主に生産者が取り組むべきだと考えている。","Aは自治体が対応すればいいと考えているのに対し、Bは生産者や消費者の意識も大切だと考えている。"],"answer":3,"explain":"Đáp án đúng: D. A cho rằng chính quyền địa phương nên giải quyết, trong khi B cho rằng nhận thức của nhà sản xuất và người tiêu dùng cũng quan trọng."}],"trans":"A Các vấn đề rác thải ngày càng nghiêm trọng đang được đề cập trên TV và báo chí. Ví dụ, đối với rác thải sinh hoạt thông thường, có báo cáo cho rằng ngoài rác thải thực phẩm, còn có nhiều chất thải do đóng gói quá mức các hộp đựng thực phẩm. Gần đây, có những động thái như mua túi rác được chỉ định để vứt rác hoặc khuyến khích khách hàng mang theo túi mua sắm, nhưng lượng rác thải không có sự thay đổi. Nếu chính quyền địa phương tính phí thu gom rác thải sinh hoạt theo từng túi với mức phí là 〇〇 yên, rác thải có thể sẽ giảm. Nếu việc thải bỏ rác thải cũng tốn tiền, mọi người sẽ suy nghĩ trước khi vứt rác. Nếu vậy, người tiêu dùng sẽ từ chối việc đóng gói không cần thiết và việc vứt bỏ cả những vật dụng có thể sử dụng được cũng sẽ giảm đi.\n\nB\n\nXã hội hiện đại đã cho phép cuộc sống tiện lợi hơn nhiều so với hàng chục năm trước. Tuy nhiên, kết quả của việc ưu tiên sự tiện lợi hơn là tái sử dụng những vật dụng không cần thiết, rác thải sinh hoạt ngày càng tăng. Để giảm lượng rác thải sinh hoạt, hiện nay, túi rác đã được tính phí và người tiêu dùng phải chịu một phần chi phí xử lý. Tuy nhiên, điều đó là không đủ và có ý kiến cho rằng người tiêu dùng nên chịu chi phí thu gom rác thải tại các địa điểm quy định, nhưng nếu vậy, có nguy cơ người dân sẽ lén lút vứt rác ở những nơi không quy định. Không thể chấp nhận việc thực hiện điều này một cách dễ dàng mà không giải quyết những vấn đề như vậy. Khi xem xét vòng tuần hoàn sản xuất, người tiêu dùng mua và những vật dụng không cần thiết bị vứt bỏ thành rác, liệu những nhà sản xuất liên tục tạo ra các sản phẩm mới và những người tiêu dùng đã quá quen với điều đó có cần thay đổi nhận thức về sự tiện lợi hay không?"},{"source":"Mon11","bai":3,"date":"07/2011","title":"Mon11 - Bài 3 (07/2011)","passage":"A\n\n乳幼児期の子どもは、身近な人とのかかわりあい、そして遊びなどの実体験を重ねることによって、人間関係を築き、心と身体を成長させます。ところが乳児期からのメディア（注1）漬けの生活では、外遊びの機会を奪い、人とのかかわり体験の不足を招きます。実際、運動不足、睡眠不足そしてコミュニケーション能力の低下などを生じさせ、その結果、心身の発達の遅れや歪みが生じた事例が臨床の場（注2）から報告されています。このようなメディアの弊害は、ごく一部の影響を受けやすい個々の子どもの問題としてではなく、メディアが子ども全体に及ぼす影響の甚大さの警鐘と私たちはとらえています。特に象徴機能（注3）が未熟な2歳以下の子どもや、発達に問題のある子どものテレビ画面への早期接触や長時間化は、親子が顔をあわせ一緒に遊ぶ時間を奪い、言葉や心の発達を妨げます。\n\n(社団法人日本小児科医会 2010年6月18日取得による)\n\nB\n\n専門家からは「テレビをやめて積極的に外遊びをしましょう」「自然の中で遊びましょう」という意見が聞かれますが、お母さんたちは進んでテレビを見せているのではなく、地域に出ても同世代の子どもがいない、昔と比べて自然がなくなった、という問題もあるのだと思います。（中略）多くの親は、テレビの長時間視聴がよくないことを自覚しており、見せる内容にも気を遣っています。\n\n生活の中からテレビを排除するだけではなく、一日に六時間も七時間も子どもにテレビを見せる親の背景に何があるのかを考えなければ、問題の根本的な解決にはならないのです。\n\nしたがって、私たちの生活スタイルと、子どもにとって望ましいテレビ視聴のあり方のバランスをとりながら、これらの検証を進める必要があるのではないでしょうか。\n\n(小西行郎「早期教育と脳」による)\n\n(注1) メディア : ここでは、テレビやビデオ\n\n(注2) 臨床の場 : 実際の診察、治療の現場\n\n(注3) 象徴機能 : ここでは、身の回りのものを、例えば言葉などで表す働き","questions":[{"q":"子どもにテレビを長時間見せることについて、AとBの観点はどのようなものか。","options":["Aは問題解決を意識した今後の課題を述べ、Bは批判的に現状を報告している。","Aは解決を意識した問題提起をし、Bは問題の原因は社会的背景にあると指摘している。","Aは影響の大きさを示して注意を喚起し、Bは問題解決を意識した今後の課題を述べている。","Aは問題の原因は社会的背景にあると指摘し、Bは影響の大きさを示して注意を喚起している。"],"answer":2,"explain":"Đáp án đúng: C. A chỉ ra mức độ ảnh hưởng lớn và kêu gọi chú ý, B nêu ra những vấn đề cần giải quyết trong tương lai, chú trọng vào việc giải quyết vấn đề."},{"q":"子どもとテレビの関係について、AとBはどのように述べているか。","options":["Aはメディアとの接触より親子のかかわりが大切だと述べ、Bはテレビを見せるよりも外での遊びを重視したほうがいいと述べている。","Aはメディアとの接触が子どもの発育を妨げる要因だと述べ、Bは子育てを取り巻く状況がテレビの見せ過ぎを引き起こす場合があると述べている。","Aはメディアとの接触が長いことよりも実体験の不足のほうが問題だと述べ、Bは生活の中からテレビを排除しただけでは問題は解決 しないと述べている。","Aはメディアに長時間接することが子どもの成長に影響を与える場合が多いと述べ、Bは親が子どもに適切にテレビを見せることが大切だと述べている。"],"answer":1,"explain":"Đáp án đúng: B. A nói rằng việc tiếp xúc với phương tiện truyền thông là yếu tố cản trở sự phát triển của trẻ em, B nói rằng tình hình xung quanh việc nuôi dạy con cái có thể gây ra việc cho xem tivi quá nhiều."}],"trans":"A \"Trẻ em trong giai đoạn sơ sinh và trẻ nhỏ, thông qua các mối quan hệ với những người thân thiết và việc tích lũy kinh nghiệm thực tế như vui chơi, sẽ xây dựng các mối quan hệ con người và phát triển cả về tâm hồn lẫn thể chất. Tuy nhiên, cuộc sống \"ngập\" trong các phương tiện truyền thông (chú thích 1) từ giai đoạn sơ sinh sẽ tước đi cơ hội vui chơi ngoài trời và dẫn đến sự thiếu hụt kinh nghiệm tương tác với người khác. Trên thực tế, các trường hợp chậm phát triển hoặc lệch lạc về tâm sinh lý do thiếu vận động, thiếu ngủ và suy giảm khả năng giao tiếp đã được báo cáo từ các cơ sở lâm sàng (chú thích 2). Chúng tôi coi tác hại của các phương tiện truyền thông như vậy không chỉ là vấn đề của một số ít trẻ em dễ bị ảnh hưởng, mà còn là lời cảnh báo về mức độ ảnh hưởng to lớn của các phương tiện truyền thông đối với toàn bộ trẻ em. Đặc biệt, việc tiếp xúc sớm và kéo dài với màn hình tivi ở trẻ em dưới 2 tuổi có chức năng biểu tượng (chú thích 3) chưa phát triển đầy đủ, hoặc ở trẻ em có vấn đề về phát triển, sẽ tước đi thời gian cha mẹ và con cái nhìn mặt nhau và chơi cùng nhau, cản trở sự phát triển ngôn ngữ và tâm hồn.\"\n\n(Trích từ “Hiệp hội Nhi khoa Nhật Bản”, lấy ngày 18/06/2010)\n\nB\n\n\"Từ các chuyên gia, chúng ta nghe thấy những ý kiến như \"hãy ngừng xem tivi và tích cực vui chơi ngoài trời\" hay \"hãy vui chơi trong tự nhiên\", nhưng tôi nghĩ rằng các bà mẹ không phải là chủ động cho con xem tivi, mà còn có những vấn đề như không có trẻ em cùng độ tuổi khi ra khu vực địa phương, hoặc tự nhiên đã biến mất so với ngày xưa. (lược bỏ) Nhiều bậc cha mẹ nhận thức được rằng việc xem tivi quá lâu là không tốt, và họ cũng chú ý đến nội dung cho con xem. Không chỉ đơn thuần là loại bỏ tivi khỏi cuộc sống, mà chúng ta còn phải suy nghĩ về những gì ẩn chứa đằng sau việc cha mẹ cho con xem tivi 6 hoặc 7 tiếng một ngày, nếu không, chúng ta sẽ không thể giải quyết vấn đề một cách căn bản. Do đó, tôi nghĩ rằng cần tiến hành xác minh những điều này, đồng thời cân bằng giữa phong cách sống của chúng ta và cách xem tivi mong muốn cho trẻ em.\"\n\n(Trích từ “Giáo dục sớm và bộ não” – Konishi Yukio)\n\nChú thích: (注1) メディア : ở đây chỉ các phương tiện như tivi, video (注2) 臨床の場 : bối cảnh lâm sàng – nơi thực hiện việc khám và điều trị thực tế (注3) 象徴機能 : ở đây có nghĩa là chức năng biểu tượng – khả năng diễn đạt sự vật xung quanh bằng những hình thức như ngôn ngữ"},{"source":"Mon11","bai":4,"date":"12/2011","title":"Mon11 - Bài 4 (12/2011)","passage":"A\n\nアートを買うか買わないか。その後もコレクションし続けるか、止めてしまうのか。いずれも最初の一点をうまく買えるかどうか、そしてその最初の作品が、自分にとって後々までも価値あるものかどうかで決まってくると思います。勿論ここでいう価値とは単純な市場価値だけではなく、求めた人にとって、飽きずに長い間付き合い続けられる魅力のことを指しています。この自分満足の部分が大きくないと、なかなか次の一点に手が伸びにくいのではないでしょうか。アートは大好きだけれど作品を買うほどではないと最初は思っていても、一度購入してみれば、後は堰を切ったように（注１）買い続けてしまったコレクターの友達を身近に何人も見ています。\n\n(宮津大博『現代アートを買おう 1. 』による)\n\nB\n\n真にアートの価値が分かるようになるためには、やはり、買うと言うステップに至らないといけないと思う。実際に買って自分のものにしてこそ、本当にわかってくるものだ。自分がお金を出して手に入れたものだからこそ、愛着も出てくるだろうし、身近において毎日みていることで、いろんな刺激を受けていくはずだ。 （中略）数万円にしろ、数百万円にしろ、いくらかのお金を出して買うんだから、それに見合うだけのものかどうかをしっかり吟味すること。ギャラリー（注２）で作品と対峙（注３）して、これ、おもしろいな、とか、好きだなと心を動かされる作品に出会えたら、さらに、どうして自分はこれが好きなのか、一歩踏み込んでその理由を考えてみることだ。大切なのは、自分にとって、これは充分な価値のあるものだと思えるような、自分自身の基準を持つということである。\n\n(小山若美夫『その弧、いくち?現代アートの相場がわかる』 による)\n\n(注1) 堀 (せき) を切ったように : ここでは、勢いが止まらずに\n\n(注2) ギャラリー : 美術品の展示場\n\n(注3) 対峙 (たいじ) する : 向き合う","questions":[{"q":"AとBはアートを買うことについて、どのような考えを持っているか。","options":["Aは一つ買ってみることがアート収集につながると考え、Bは心を動かされたらすぐに買ったほうがよいと考えている。","Aは最初に買った作品がその後のアート収集に影響すると考え、Bはアートを理解するには買うことが欠かせないと考えている。","Aは市場価値の高いものを買うことが重要だと考え、Bは作品が好きだと思う理由をよく考えてから買うことが大切だと考えている。","Aは買うほどではないと思った作品でも買うことが重要だと考え、Bは作品を選ぶときの基準を高く設定することが大切だと考えている。"],"answer":1,"explain":"Đáp án đúng: B. A cho rằng tác phẩm đầu tiên mua sẽ ảnh hưởng đến việc sưu tầm nghệ thuật sau này, B cho rằng việc mua là không thể thiếu để hiểu được nghệ thuật."},{"q":"アートの価値について、A とB が共通して述べていることは何か","options":["アートの価値と、市場価値は連動している。","アートの価値とは、買い続けることで分かるものである。","アートの価値とは、買い手の価値観で決まるものである。","アートの価値は、多くの人に共有される価値観によって決められる。"],"answer":2,"explain":"Đáp án đúng: C. Giá trị của nghệ thuật được quyết định bởi giá trị quan của người mua."}],"trans":"A:\n\n\"Mua hay không mua tác phẩm nghệ thuật? Tiếp tục sưu tầm sau đó hay dừng lại? Tôi nghĩ rằng tất cả đều phụ thuộc vào việc bạn có thể mua thành công tác phẩm đầu tiên hay không, và liệu tác phẩm đầu tiên đó có giá trị đối với bạn trong thời gian dài sau này hay không. Tất nhiên, giá trị ở đây không chỉ là giá trị thị trường đơn thuần, mà còn là sức hấp dẫn mà người tìm kiếm có thể tiếp tục gắn bó trong thời gian dài mà không cảm thấy nhàm chán. Nếu phần tự hài lòng này không lớn, thì có lẽ khó có thể tiếp tục mua tác phẩm tiếp theo. Ban đầu, ngay cả khi bạn nghĩ rằng mình yêu thích nghệ thuật nhưng không đến mức mua tác phẩm, tôi đã thấy nhiều người bạn sưu tầm xung quanh mình sau khi mua một lần, họ đã tiếp tục mua như thể đê vỡ (chú thích 1).\"\n\n(Trích từ “Hãy mua nghệ thuật đương đại 1” – Miyazu Hiroshi)\n\nB:\n\n\"Tôi nghĩ rằng để thực sự hiểu được giá trị của nghệ thuật, bạn cần phải tiến đến bước mua. Chỉ khi bạn thực sự mua và sở hữu nó, bạn mới thực sự hiểu được. Vì đó là thứ bạn đã bỏ tiền ra để có được, nên bạn sẽ có tình cảm gắn bó, và khi bạn đặt nó gần gũi và nhìn thấy nó mỗi ngày, bạn sẽ nhận được nhiều kích thích khác nhau. (lược bỏ) Dù là vài vạn yên hay vài trăm vạn yên, vì bạn bỏ ra một số tiền để mua, nên hãy xem xét kỹ lưỡng xem nó có xứng đáng hay không. Nếu bạn gặp một tác phẩm khiến bạn cảm động khi đối diện với nó trong phòng trưng bày (chú thích 2), chẳng hạn như \"cái này thú vị\" hoặc \"tôi thích cái này\", hãy tiến thêm một bước và suy nghĩ về lý do tại sao bạn thích nó. Điều quan trọng là có tiêu chuẩn của riêng bạn, sao cho bạn có thể nghĩ rằng nó có giá trị đầy đủ đối với bạn.\"\n\n(Trích từ “Cái vòng cung ấy, bao nhiêu? Hiểu về giá cả nghệ thuật đương đại” – Koyama Wakao)\n\nChú thích: (注1) 堀を切ったように : ở đây có nghĩa là thế勢 không thể dừng lại, tràn ra ào ạt (注2) ギャラリー : phòng trưng bày nghệ thuật (注3) 対峙する : đối diện, đối mặt"},{"source":"Mon11","bai":5,"date":"07/2012","title":"Mon11 - Bài 5 (07/2012)","passage":"A\n\n生態系保全（注1）では、そこに生息（注2）する生物のことを考慮するが、生態系を構成するすべての生物を等しく扱うことはできない。なぜなら、一部の生物を守ろうとすると、必ず不利益を被る生物が生じるからである。すなわち、われわれ人間が何をしても、それによって利益を得る生物と不利益を受けるものが生じることになる。そうなると、生態系を保全する目的で、何らかの活動をするということは、一部の生物種に利益を与えるということになる。\n\n（中略）\n\n唯一われわれが言えることは、われわれが人類であるから、「地球生態系は人類が健全に生きていくためにある」ということである。すなわち、「生態系は人類のため」なのである。言い換えれば、人類に利益を与えてくれる生態系を保全すべきなのである。\n\n(花里孝幸『自然はそんなにヤワじゃない―誤解だらけの生態系」による)\n\nB\n\n保全生物学（注3）の核となる概念である生物多様性は種の存続によって維持される。したがって、保全生物学では、希少種や減少過程にある個体群の保全に関する知識と方法が一つの重要な課題である。（中略）\n\nしかし、個別の種をそれぞれ保護することは非常に困難である。一つの生態系をとっても、微生物から植物、昆虫、哺乳動物など多くの種が生存しているが、それらの全ての生態を把握して保護することは不可能に近い。さらに、未分類の種や種レベル以下の遺伝的多様性は、個別の種を保護する方法では逆に保護されなくなってしまう恐れがある。そこで、多様な生物の相互関係を含む自然をそのまま保全することが重要になってくる。つまり、生態系を保全することで、そこに含まれる全ての生物を保護するという考え方である。\n\n(注1)保全:ここでは、守ること。\n\n(注2)生息する:生きる\n\n(注3)保全生物学:生態学の研究分野のひとつ","questions":[{"q":"生態系を構成する生物の保護について、AとBの文章で共通して述べられていることは何ですか。","options":["多様な生物を含む自然全体を保護することが重要である。","多様な生物種を一様に保護していくことは非常に難しい。","生物種を分類して保護することは生物間の差別につながる。","人類に利益を与える生物を保護するべきである。"],"answer":1,"explain":"Đáp án đúng: B. Việc bảo vệ đồng đều các loài sinh vật đa dạng là vô cùng khó khăn."},{"q":"保護すべき対象についてAとBはどのように考えているか。","options":["Aは地球生態系を、Bは遺伝的多様性のある種を保護すべきだと考えている。","Aは生態系の全生物を、Bは希少価値のある生物を保護すべきだと考えている。","Aは人類に利益を与える生物種を、Bは個別の種を保護すべきだと考えている。","Aは人類のために生態系を、Bは生態系全体を保護すべきだと考えている。"],"answer":3,"explain":"Đáp án đúng: D. A cho rằng nên bảo vệ hệ sinh thái vì loài người, B cho rằng nên bảo vệ toàn bộ hệ sinh thái."}],"trans":"A \"Trong bảo tồn hệ sinh thái (chú thích 1), người ta xem xét đến các sinh vật sống ở đó (chú thích 2), nhưng không thể đối xử bình đẳng với tất cả các sinh vật cấu thành hệ sinh thái. Bởi vì, nếu cố gắng bảo vệ một số sinh vật, chắc chắn sẽ có những sinh vật bị thiệt hại. Nói cách khác, dù con người chúng ta làm gì, cũng sẽ có những sinh vật được lợi và những sinh vật bị hại. Như vậy, việc thực hiện bất kỳ hoạt động nào với mục đích bảo tồn hệ sinh thái cũng có nghĩa là mang lại lợi ích cho một số loài sinh vật. (lược bỏ) Điều duy nhất chúng ta có thể nói là vì chúng ta là loài người, nên \"hệ sinh thái trái đất tồn tại để loài người có thể sống khỏe mạnh\". Nói cách khác, \"hệ sinh thái là vì loài người\". Nói cách khác, chúng ta nên bảo tồn hệ sinh thái mang lại lợi ích cho con người.\"\n\nB\n\n\"Đa dạng sinh học, khái niệm cốt lõi của sinh học bảo tồn, được duy trì bởi sự tồn tại của các loài. Do đó, tr
