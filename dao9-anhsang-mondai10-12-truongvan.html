  card.appendChild(icon);
  card.appendChild(text);
  card.appendChild(sub);
  overlay.appendChild(card);
  for(let i=0;i<14;i++){
    const pt=document.createElement('div');
    pt.className='coin-particle';
    pt.textContent='🪙';
    const angle=Math.random()*Math.PI*2;
    const dist=80+Math.random()*140;
    pt.style.setProperty('--dx',(Math.cos(angle)*dist)+'px');
    pt.style.setProperty('--dy',(Math.sin(angle)*dist)+'px');
    overlay.appendChild(pt);
  }
  document.body.appendChild(overlay);
  setTimeout(()=>{card.classList.add('coin-burst-out');},1200);
  setTimeout(()=>{overlay.remove();},1700);
}
function maybeDropCoins(){
  if(Math.random()>=0.35)return;
  const amount=5+Math.floor(Math.random()*21);
  const profile=loadLocalProfile();
  if(profile){
    profile.coins=(profile.coins||0)+amount;
    saveLocalProfile(profile);
  }
  showCoinBurst(amount);
}
function showExpToast(mainText,subText,big){
  document.querySelectorAll('.exp-toast').forEach(t=>t.remove());
  const wrap=document.createElement('div');
  wrap.className='exp-toast'+(big?' exp-toast-big':'');
  const line1=document.createElement('div');
  line1.className='exp-toast-main';
  line1.textContent=mainText;
  const line2=document.createElement('div');
  line2.className='exp-toast-sub';
  line2.textContent=subText;
  wrap.appendChild(line1);
  wrap.appendChild(line2);
  document.body.appendChild(wrap);
  setTimeout(()=>{wrap.classList.add('exp-toast-out');},900);
  setTimeout(()=>{wrap.remove();},1400);
}
function showComboToast(n){
  let el=document.getElementById('combo-toast');
  if(!el){
    el=document.createElement('div');
    el.id='combo-toast';
    el.className='combo-toast';
    document.body.appendChild(el);
  }
  el.textContent='🔥 Chuỗi '+n+' câu đúng';
  el.classList.add('show');
  clearTimeout(window._comboToastTimer);
  window._comboToastTimer=setTimeout(()=>{el.classList.remove('show');},1500);
}
function onCorrectAnswer(){
  comboCount++;
  let gained=EXP_PER_CORRECT;
  let big=false;
  let sub=pickHype();
  if(comboCount>=2)showComboToast(comboCount);
  if(comboCount>0 && comboCount%COMBO_TARGET===0){
    gained+=COMBO_BONUS;
    big=true;
    sub='Chuỗi '+comboCount+' câu đúng — Bùng nổ!';
  }
  const leveledUp=awardExp(gained);
  showExpToast('+'+gained+' EXP', leveledUp?'LÊN CẤP! 🎉':sub, big||leveledUp);
  maybeDropCoins();
}
function onWrongAnswer(){
  comboCount=0;
}
reportToolProgress(allCorrectMon1012.length,TOTAL_Q_MON1012);
function filtered(){return DATA.filter(d=>d.source===currentSrc);}
function hasDetail(item){return !!(EXPL_DETAIL[item.source+'-'+item.bai]);}
function computeAnchors(passage,options,answerIdx){
  if(answerIdx===undefined||!options[answerIdx])return[];
  const ans=options[answerIdx];
  const kanjiRe=/[\u4E00-\u9FFF]{2,}/g;
  const words=new Set();let m;
  while((m=kanjiRe.exec(ans))!==null){words.add(m[0]);}
  return Array.from(words).filter(w=>passage.includes(w));
}
function buildSheetNav(){
  const nav=document.getElementById("sheetNav");nav.innerHTML="";
  filtered().forEach((item,idx)=>{
    const btn=document.createElement("div");
    btn.className="sheet-btn"+(idx===currentBaiIndex?" active":"")+(hasDetail(item)?"":" nodata");
    btn.textContent=item.date;
    btn.onclick=()=>{currentBaiIndex=idx;resetState();render();};
    nav.appendChild(btn);
  });
}
function resetState(){state={answered:{},unlocked:false,hlAnchor:false,hlConn:true,hlSyn:false};}
resetState();
function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mdBold(s){return escHtml(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
function addSpans(arr,text,words,cls){
  const sorted=words.slice().sort((a,b)=>b.length-a.length);
  const used=new Uint8Array(text.length);
  sorted.forEach(w=>{
    if(!w)return;let pos=0;
    while((pos=text.indexOf(w,pos))!==-1){
      const end=pos+w.length;let conflict=false;
      for(let i=pos;i<end;i++){if(used[i]){conflict=true;break;}}
      if(!conflict){arr.push({start:pos,end,cls});for(let i=pos;i<end;i++)used[i]=1;}
      pos++;
    }
  });
}
function buildHTML(text,spans){
  if(!spans.length)return escHtml(text);
  spans.sort((a,b)=>a.start-b.start);
  let html="",pos=0;
  spans.forEach(sp=>{
    if(sp.start<pos)return;
    html+=escHtml(text.slice(pos,sp.start));
    html+='<span class="'+sp.cls+'">'+escHtml(text.slice(sp.start,sp.end))+'</span>';
    pos=sp.end;
  });
  html+=escHtml(text.slice(pos));return html;
}
function applyPassageHighlight(item){
  const passageEl=document.getElementById("passage");if(!passageEl)return;
  if(item.html){passageEl.style.whiteSpace="normal";passageEl.innerHTML=item.html+(item.note?'<div style="font-size:.78rem;color:#6b5a3a;margin-top:10px">'+escHtml(item.note)+"</div>":"");return;}
  if(item.images){passageEl.style.whiteSpace="normal";passageEl.innerHTML=item.images.map(function(u){return '<img src="'+u+'" alt="Đề Mon13" loading="lazy" style="max-width:100%;display:block;margin:0 auto 6px;border:1px solid #e3d9c0;border-radius:6px;background:#fff">';}).join("")+(item.note?'<div style="font-size:.78rem;color:#6b5a3a;margin-top:6px">'+escHtml(item.note)+"</div>":"");return;}
  passageEl.style.whiteSpace="";
  if(item.note&&!item.images){}
  const raw=item.passage;const spans=[];
  if(state.hlConn)addSpans(spans,raw,CONNECTIVES,"hl-connective");
  if(state.hlAnchor){
    let allAnchors=[];
    item.questions.forEach(q=>{allAnchors=allAnchors.concat(computeAnchors(item.passage,q.options,q.answer));});
    allAnchors=Array.from(new Set(allAnchors));
    addSpans(spans,raw,allAnchors,"hl-anchor");
  }
  passageEl.innerHTML=buildHTML(raw,spans)+(item.note?'<div style="font-size:.78rem;color:#6b5a3a;margin-top:10px;white-space:normal">'+escHtml(item.note)+'</div>':'');
}
function renderDetailExplain(item,qi,q){
  const detailList=EXPL_DETAIL[item.source+'-'+item.bai];
  const d=detailList?detailList[qi]:null;
  if(!d){
    return '<div class="expl-label">💡 Giải thích</div><div class="chain-box">'+escHtml(q.explain||"")+'</div>';
  }
  let html="";
  html+='<div class="expl-section"><div class="expl-label">1. Hướng tư duy</div><div class="expl-body">'+mdBold(d.huongTuDuy)+'</div></div>';
  html+='<div class="expl-section"><div class="expl-label">2. Chốt ý</div><div class="expl-body">'+mdBold(d.chotY)+'</div></div>';
  html+='<div class="expl-section"><div class="expl-label">3. Liên kết đầu — cuối</div><div class="chain-box"><span class="jp">'+escHtml(d.lienKetJP)+'</span>'+escHtml(d.lienKetVI)+'</div></div>';
  html+='<div class="expl-section"><div class="expl-label">4. Đáp án đúng</div><div class="opt-expl correct-e"><span class="key">✅ '+String.fromCharCode(65+q.answer)+'.</span><span class="jp-text">'+mdBold(d.correct.jp)+'</span>'+escHtml(d.correct.vi)+'</div></div>';
  html+='<div class="expl-section"><div class="expl-label">5. Đáp án sai</div>';
  d.wrong.forEach(function(w){
    html+='<div class="opt-expl wrong-e"><span class="key">❌ '+w.key+'.</span><span class="jp-text">'+mdBold(w.jp)+'</span>'+escHtml(w.vi)+'<span class="trap-tag">'+escHtml(w.trap)+'</span></div>';
  });
  html+='</div>';
  return html;
}
function render(){
  const tb=document.querySelector('.toolbar');if(tb)tb.style.display=(currentSrc==='Mon13')?'none':'';
  buildSheetNav();
  const list=filtered();const item=list[currentBaiIndex];
  const content=document.getElementById("content");content.innerHTML="";
  document.getElementById("progress").textContent=currentSrc+" — Kỳ "+item.date+" ("+(currentBaiIndex+1)+"/"+list.length+")";
  document.getElementById("noteBanner").textContent=hasDetail(item)
    ?"✅ Bài này đã có giải thích chi tiết đầy đủ (5 mục + nhãn bẫy)."
    :"📝 Bài này có đáp án và giải thích tóm tắt.";
  const passageWrap=document.createElement("div");passageWrap.className="passage-wrap";
  const passageDiv=document.createElement("div");passageDiv.className="passage";passageDiv.id="passage";
  passageWrap.appendChild(passageDiv);content.appendChild(passageWrap);
  item.questions.forEach(function(q,qi){
    const card=document.createElement("div");card.className="qcard";
    const tag=document.createElement("div");tag.className="qtag";tag.textContent="Câu "+(qi+1);card.appendChild(tag);
    const qt=document.createElement("div");qt.className="qtext";qt.textContent=q.q;card.appendChild(qt);
    const optsDiv=document.createElement("div");optsDiv.className="options";
    const selected=state.answered[qi];
    q.options.forEach(function(opt,oi){
      const btn=document.createElement("button");btn.className="opt-btn";
      btn.textContent=String.fromCharCode(65+oi)+"．"+opt;
      if(selected!==undefined){
        btn.disabled=true;
        if(oi===q.answer)btn.classList.add("correct");
        else if(oi===selected)btn.classList.add("wrong");
      }
      btn.onclick=function(){
        if(state.answered[qi]!==undefined)return;
        state.answered[qi]=oi;
        if(!state.unlocked){
          state.unlocked=true;state.hlAnchor=true;state.hlSyn=true;
          document.getElementById("btn-anchor").classList.remove("locked");
          document.getElementById("btn-anchor").classList.add("on");
          document.getElementById("btn-syn").classList.remove("locked");
          document.getElementById("btn-syn").classList.add("on");
        }
        const qKey=item.source+'-'+item.bai+'_'+qi;
        if(oi===q.answer){
          if(allCorrectMon1012.indexOf(qKey)<0)allCorrectMon1012.push(qKey);
          onCorrectAnswer();
        } else {
          onWrongAnswer();
        }
        localStorage.setItem('dao9_mondai10_12_correct',JSON.stringify(allCorrectMon1012));
        reportToolProgress(allCorrectMon1012.length,TOTAL_Q_MON1012);
        render();
      };
      optsDiv.appendChild(btn);
    });
    card.appendChild(optsDiv);
    if(selected!==undefined){
      const isOk=selected===q.answer;
      const rb=document.createElement("div");rb.className="result-badge "+(isOk?"correct":"wrong");
      rb.textContent=isOk?"✅ Chính xác!":"❌ Chưa đúng — Đáp án đúng: "+String.fromCharCode(65+q.answer);
      card.appendChild(rb);
      const ex=document.createElement("div");ex.className="explain show";
      ex.innerHTML=renderDetailExplain(item,qi,q);
      card.appendChild(ex);
    }
    content.appendChild(card);
  });
  if(item.trans){
    const det=document.createElement("details");det.className="trans-box";
    const sm=document.createElement("summary");sm.textContent="📖 Bản dịch tiếng Việt";det.appendChild(sm);
    const tb=document.createElement("div");tb.className="trans-body";tb.textContent=item.trans;det.appendChild(tb);
    content.appendChild(det);
  }
  applyPassageHighlight(item);
  const allDone=item.questions.length>0&&Object.keys(state.answered).length===item.questions.length;
  document.getElementById("resetBtn").className="reset-btn"+(allDone?" show":"");
  document.getElementById("prevBtn").disabled=currentBaiIndex===0;
  document.getElementById("nextBtn").disabled=currentBaiIndex===list.length-1;
}
function resetCurrent(){resetState();render();}
document.querySelectorAll(".tab-btn").forEach(function(btn){
  if(ONLY.length&&ONLY.indexOf(btn.dataset.src)<0){btn.style.display="none";return;}
  btn.onclick=function(){
    document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");currentSrc=btn.dataset.src;currentBaiIndex=0;resetState();render();
  };
});
if(ONLY.length){document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.toggle("active",b.dataset.src===currentSrc);});}
function toggleHL(type){
  const map={anchor:"hlAnchor",conn:"hlConn",syn:"hlSyn"};
  const btnId={anchor:"btn-anchor",conn:"btn-conn",syn:"btn-syn"}[type];
  const btn=document.getElementById(btnId);
  if(btn.classList.contains("locked"))return;
  const key=map[type];state[key]=!state[key];
  btn.classList.toggle("on",state[key]);
  applyPassageHighlight(filtered()[currentBaiIndex]);
}
document.getElementById("prevBtn").onclick=function(){if(currentBaiIndex>0){currentBaiIndex--;resetState();render();}};
document.getElementById("nextBtn").onclick=function(){const list=filtered();if(currentBaiIndex<list.length-1){currentBaiIndex++;resetState();render();}};
render();
</script>

<script>
let yearFilter = 'all';
const yearOfDate = d => { const m = String(d.date||'').match(/(\d{4})/); return m ? m[1] : ''; };
function renderYearSelect(){
  const box = document.getElementById('yearChips'); if(!box) return;
  const list = DATA.filter(d => d.source === currentSrc);
  const ys = [...new Set(list.map(yearOfDate))].filter(Boolean).sort();
  if(yearFilter !== 'all' && !ys.includes(yearFilter)) yearFilter = 'all';
  const chip = (v, label, n) => '<div class="year-chip'+(yearFilter===v?' active':'')+'" data-y="'+v+'">'+label+'<small>'+n+'</small></div>';
  box.innerHTML = chip('all', 'Tất cả', list.length) + ys.map(y => chip(y, y, list.filter(d => yearOfDate(d) === y).length)).join('');
  box.querySelectorAll('.year-chip').forEach(c => c.onclick = () => setYear(c.dataset.y));
  const sub = document.getElementById('subHeader');
  if(sub) sub.textContent = currentSrc + ' · ' + list.length + ' bài · ' + ys.length + ' năm (' + (ys[0]||'') + '–' + (ys[ys.length-1]||'') + ') · chọn năm bên dưới';
}
window.filtered = function(){
  return DATA.filter(d => d.source === currentSrc && (yearFilter === 'all' || yearOfDate(d) === yearFilter));
};
function setYear(v){
  yearFilter = v; currentBaiIndex = 0; resetState(); renderYearSelect(); buildSheetNav(); render();
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
  setTimeout(() => { yearFilter = 'all'; renderYearSelect(); currentBaiIndex = 0; resetState(); buildSheetNav(); render(); }, 0);
}));
renderYearSelect(); buildSheetNav(); render();
</script>
