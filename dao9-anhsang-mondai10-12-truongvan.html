, không phải mức khó."}]},{"huongTuDuy":"Khi nào sách là 'sách hay' theo tác giả — đoạn đầu bài định nghĩa.","chotY":"「それ（本）を求めている人の手に求めているときに渡れば、それは**良書になる**」.","lienKetJP":"本＝人間と同じ → 一律に優劣は決められない → 必要な人に必要なときに → 良書になる","lienKetVI":"Sách = như con người → không thể xếp hạng một chiều → đến tay người cần vào lúc họ cần → trở thành sách hay","correct":{"jp":"**求める人のレベルや目的にあっている**場合","vi":"Khớp với 「それを求めている人の手に求めているときに渡れば…良書」 — cặp gần nghĩa: 求めている人・求めているとき ↔ 求める人のレベルや目的にあっている."},"wrong":[{"key":"A","jp":"**書評で強く批判されない**場合","trap":"bẫy ngược nghĩa","vi":"Ngược tinh thần bài — bài phê phán các đánh giá sách, và tác giả tự biết sách mình cũng bị phê nhưng vẫn là sách tốt."},{"key":"B","jp":"**多くの人が価値を認めている**場合","trap":"bẫy chi tiết phụ","vi":"'Được nhiều người công nhận' = bestselller, nhưng bài nói ngay đầu: bestselller không có nghĩa là sách hay với tất cả."},{"key":"C","jp":"求める人に**本の趣旨が理解しやすい**場合","trap":"bẫy chi tiết phụ","vi":"'Dễ hiểu' là yếu tố phụ — bài không nói về tính dễ hiểu mà về sự PHÙ HỢP với nhu cầu/trình độ của người đọc."}]},{"huongTuDuy":"Điều tác giả muốn nói với người phê bình sách — câu kết bài.","chotY":"「あらゆる本に**愛情を持つべき**だと私は考えている。そうしてこそ、本を批判する**資格を持つ**と思うのだ」.","lienKetJP":"本は全てそれぞれの価値を持つ → あらゆる本に愛情を → そうしてこそ批評の資格がある","lienKetVI":"Sách đều có giá trị riêng → nên yêu mến mọi cuốn sách → từ đó mới có tư cách phê bình","correct":{"jp":"**それぞれの本の存在価値を認めるべきだ**","vi":"Khớp với 「あらゆる本に愛情を持つべき」「一律の価値によって優劣を決めることはできない」."},"wrong":[{"key":"A","jp":"著者の**あらゆる本を読むべきだ**","trap":"bẫy mọi người","vi":"Không có trong bài — 'đọc hết sách của tác giả' không phải điều tác giả yêu cầu."},{"key":"B","jp":"**極端に否定的な評価は避けるべきだ**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng quá hẹp — bài không chỉ nói về mức độ phê bình mà về THÁI ĐỘ CƠ BẢN: yêu mến và công nhận giá trị."},{"key":"D","jp":"どのような本にも**先入観なしで接するべきだ**","trap":"bẫy mọi người","vi":"'Không thành kiến' không phải điểm mấu chốt — bài nói về TÌNH YÊU với sách (愛情), không chỉ về thái độ khách quan."}]}],"Mon12-11":[{"huongTuDuy":"Loại mục tiêu được thiết lập trong công việc — đoạn đầu mô tả quy trình.","chotY":"「外部環境や内部の状況を含め、諸々の要素を検討」→「**達成可能かつできる限り高い目標**を探ることになる」.","lienKetJP":"さまざまな要素を検討 → 達成不可能ではない範囲で → できる限り高い目標","lienKetVI":"Xem xét nhiều yếu tố → không phải bất khả thi → mục tiêu CAO NHẤT có thể đạt được","correct":{"jp":"成し遂げられる範囲の中で**最も高い目標**","vi":"Khớp với 「達成可能かつできる限り高い目標」."},"wrong":[{"key":"A","jp":"外部環境や内部の状況の変化を**完璧に予測した**目標","trap":"bẫy chi tiết phụ","vi":"Bài nói rõ đây là ĐiỀU KHÔNG THỂ (「実際にはそんなことはありえない」), không phải cách thiết lập mục tiêu hiện thực."},{"key":"B","jp":"現在の状況から見て**無理なく達成される**目標","trap":"bẫy chi tiết phụ","vi":"'Dễ dàng đạt được' thiếu phần 'cao nhất có thể' — bài nhấn mạnh 「できる限り高い」."},{"key":"D","jp":"達成が難しくても**取り組む価値のある**目標","trap":"bẫy chi tiết phụ","vi":"'Đáng thử dù khó' gần với kết luận cuối bài, không phải mô tả cách thiết lập mục tiêu thực tế trong đoạn ①."}]},{"huongTuDuy":"Điều tác giả nói là cơ hội kinh doanh — câu giải thích về 'bất định'.","chotY":"「事前に予想ができない要素にこそ、**大きなビジネスチャンスが転がっている**」→ cụ thể: 「社内では…アイデアを**隠し持った人**が必ずいる」「外部環境は**予想もつかない方向に変わりうる**」.","lienKetJP":"固定した目標は不確定要素に対応できない → しかしその不確定要素（社内の埋もれた発想＋社外の変化）にこそチャンスがある","lienKetVI":"Mục tiêu cứng đơ không đáp ứng được yếu tố bất định → nhưng chính trong yếu tố bất định đó (ý tưởng ẩn bên trong + thay đổi bên ngoài) mới có cơ hội","correct":{"jp":"**社内に埋もれている発想**や**社外で起こる変化**","vi":"Khớp với 「社内では…アイデアを隠し持った人」「外部環境は予想もつかない方向に変わりうる」「この要素にこそビジネスチャンスが転がっている」."},"wrong":[{"key":"A","jp":"**創意工夫を生み出す社内環境**","trap":"bẫy chi tiết phụ","vi":"'Môi trường nuôi dưỡng sáng tạo' không phải nội dung được đề xuất — bài nói về các yếu tố BẤT ĐỊNH cụ thể, không phải về việc xây dựng môi trường."},{"key":"B","jp":"**社員にとって納得感のある目標設定**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phê phán 「落とし所 (妥協点)」 là 「意味がない」, không phải ca ngợi."},{"key":"C","jp":"社内外の不確定な変化に対する**大胆な予想**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không ủng hộ 'dự đoán táo bạo' mà nói dự đoán là KHÔNG THỂ; hãy ỨNG PHÓ khi thay đổi xảy ra."}]},{"huongTuDuy":"②違和感 — cái gì gây ra cảm giác 'không ổn' cho tác giả?","chotY":"「スポーツよりも遥かに**不確定な要素が多い**にもかかわらず、**目標によって自分たちを縛りつけようとする**のである。これにはかなり②違和感を覚える」.","lienKetJP":"力士やゴルフ選手は目標を口にしない（変化に対応するため）→ しかしビジネスでは固定目標で自分を縛る → 不確定要素が多いのに変わらない → ②違和感","lienKetVI":"Vận động viên không đặt mục tiêu cứng (để ứng phó thay đổi) → nhưng kinh doanh lại tự trói bằng mục tiêu cố định → nhiều yếu tố bất định hơn nhưng lại cứng nhắc hơn → '②cảm giác không ổn'","correct":{"jp":"**周囲の状況は変わるのに**、**目標を固定すること**","vi":"Khớp với 「周囲の状況はどんどん変わることが当たり前…自分だけ変わらないのはおかしい」 + 「目標によって縛りつけようとする」."},"wrong":[{"key":"A","jp":"不確定な要素が多いため**目標を立てないこと**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài phê phán việc ĐẶTMỤC TIÊU cứng nhắc, không phải việc không đặt mục tiêu."},{"key":"C","jp":"目標を立てたのに**それを口にしないこと**","trap":"bẫy chi tiết phụ","vi":"'Không nói ra mục tiêu' là hành vi của vận động viên (VÍ DỤ), không phải điều gây ra ②違和感."},{"key":"D","jp":"目標を立てたのに**それを変えなくてはならないこと**","trap":"bẫy chi tiết phụ","vi":"'Phải thay đổi mục tiêu' gần đúng nhưng sai trọng tâm — vấn đề là 自分を縛る (TỰ TRÓI) bằng mục tiêu cũ, không phải việc phải sửa mục tiêu."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「過去に立てた目標によって自分を窮屈な存在にしてはいけない」「**目の前のことだけに投入**し、何かしらの変化を察知するにつけ、**次のベストを探すというスタンスを保持することが重要**」.","lienKetJP":"目標に縛られるな → 目の前のことに集中 → 変化を察知して次のベストを探す → これが重要","lienKetVI":"Không bị trói bởi mục tiêu → tập trung vào trước mắt → nhận biết thay đổi và tìm phương án tốt nhất tiếp theo → đây là điều quan trọng","correct":{"jp":"目標を立てることに**縛られず**、**目の前のことに最善の対応をすること**が重要だ","vi":"Khớp trực tiếp với câu kết 「目の前のことだけに投入し、次のベストを探すというスタンスが重要」."},"wrong":[{"key":"A","jp":"**実現不可能なくらいの大きな目標**を立てて達成に向けて努力すべきだ","trap":"bẫy chi tiết phụ","vi":"Bài CÓ đề cập 'đặt mục tiêu lớn khó đạt' nhưng ngay lập tức nói 「しかし、これ自体は達成方法を考えるのに役に立たない」 — không phải điều được ủng hộ."},{"key":"B","jp":"自分の可能性を大事にするためには、**大きな目標を立てるべきではない**","trap":"bẫy chi tiết phụ","vi":"Quá tuyệt đối — bài không phủ nhận hoàn toàn mục tiêu, chỉ phủ nhận việc 'bị trói' bởi mục tiêu."},{"key":"C","jp":"自分が持つ可能性が最大限に発揮できるような**目標を探し続けること**が重要だ","trap":"bẫy chi tiết phụ","vi":"'Tìm kiếm mục tiêu' không phải điểm nhấn — bài nhấn mạnh 'ứng phó linh hoạt với trước mắt', không phải 'tìm mục tiêu hoàn hảo'."}]}],"Mon12-12":[{"huongTuDuy":"Lý do tác giả không bị thu hút bởi tranh vẽ núi — đoạn 2-3 giải thích.","chotY":"「**ステレオタイプな観点**から山を賛美し、その風景を自分の心の展示箱に納めて「いい思い出」にしてしまう」「**似たようなイメージ**…再生産している」.","lienKetJP":"一般的な山の絵＝ステレオタイプな観点（雄大さ・厳粛さ）→ 似たようなイメージを再生産 → 興味が湧かない","lienKetVI":"Tranh núi thông thường = nhìn theo khuôn mẫu (hùng vĩ/trang nghiêm) → tái sản xuất hình ảnh giống nhau → không thu hút","correct":{"jp":"**型にはまった見方で描かれた**山の絵が多いから","vi":"Khớp với 「ステレオタイプな観点から山を賛美」「似たようなイメージを再生産」."},"wrong":[{"key":"B","jp":"**一般的な登山者の視点で描かれた**山の絵ではないから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói CHÍNH các họa sĩ cũng dùng cùng quan điểm với người leo núi thông thường (ステレオタイプ)."},{"key":"C","jp":"**思い出として残すために描かれた**山の絵しかないから","trap":"bẫy chi tiết phụ","vi":"'Vẽ để lưu kỷ niệm' là một MÔ TẢ trong bài (心の展示箱に納める), không phải NGUYÊN NHÂN đủ để gây phản cảm."},{"key":"D","jp":"**自分の心の中にある風景と似たような**山の絵ばかりだから","trap":"bẫy mọi người","vi":"Không có trong bài — tác giả phê phán sự GIỐNG NHAU giữa các tranh với nhau, không phải giống với hình ảnh trong tâm trí tác giả."}]},{"huongTuDuy":"Tác giả nhìn nhận 'núi' như thế nào — đoạn giữa bài mô tả quan điểm cá nhân.","chotY":"「山は動いている、と」「微細な物理的変貌、小さな生命たちの死滅と再生が**瞬時も止まることのない現場**が、「山」なのである」.","lienKetJP":"「動かざるものの象徴」とされる山 → しかし実際は → 刻一刻と変化しつづけている","lienKetVI":"Núi thường được coi là biểu tượng 'bất biến' → nhưng thực ra → biến đổi không ngừng từng khoảnh khắc","correct":{"jp":"山は一見変わらないようでも、**変化しつづけている**","vi":"Khớp trực tiếp với 「山は動いている」「刻一刻と変化しつづけている」."},"wrong":[{"key":"A","jp":"山の変化は小さくても、心に残る**感動は大きい**","trap":"bẫy mọi người","vi":"Không có trong bài — tác giả nói về THỰC TẾ núi biến đổi, không nói về 'cảm động'."},{"key":"B","jp":"山は**同じように見えても、それぞれの個性がある**","trap":"bẫy chi tiết phụ","vi":"'Mỗi núi có cá tính riêng' không phải trọng tâm — bài nhấn mạnh núi LUÔN THAY ĐỔI, không phải sự khác biệt giữa các núi."},{"key":"D","jp":"同じ山に面しても、**山から受ける印象は毎回異なる**","trap":"bẫy chi tiết phụ","vi":"'Ấn tượng mỗi lần khác nhau' là kết quả của việc núi biến đổi, nhưng không phải điểm tác giả muốn nhấn mạnh nhất — trọng tâm là THỰC TẾ VẬT LÝ của sự biến đổi."}]},{"huongTuDuy":"So sánh người thành thị và họa sĩ sống lâu ở núi — tìm điểm CHUNG.","chotY":"「都市部の生活者…山の変化に気づかない」「何十年も山で暮らしてきたような画家でさえも、その表現は**先述した域を出ることは稀**」「表現への憧れが先に立ち…」→ cả 2 đều có hình ảnh núi CỐ ĐỊNH.","lienKetJP":"都市生活者＝山から乖離して変化に気づかない → 山暮らしの画家も＝表現への憧れで山の実相を捉えられない → 両者ともイメージが固定化","lienKetVI":"Người thành thị = xa núi nên không nhận ra thay đổi → Họa sĩ sống ở núi cũng = bị 'khao khát biểu hiện' che khuất nên không nắm bắt thực tế → Cả 2 đều có hình ảnh núi CỐ ĐỊNH","correct":{"jp":"いずれも**山のイメージが固定化している**","vi":"Khớp với 「変化に気づかない」(người thành thị) + 「先述した域を出ることは稀」(họa sĩ) = cả 2 đều bị khuôn mẫu hóa."},"wrong":[{"key":"A","jp":"いずれも**山への憧れが強い**","trap":"bẫy chi tiết phụ","vi":"'Khao khát về núi' chỉ được nêu cho HỌA SĨ (表現への憧れが先に立ち), không phải cả 2."},{"key":"B","jp":"いずれも**山への興味が失われている**","trap":"bẫy chi tiết phụ","vi":"'Mất hứng thú' không phải điểm chung được nêu — người thành thị không đặc biệt 'mất hứng' mà chỉ 'không để ý thay đổi'."},{"key":"C","jp":"いずれも**山の見方が変化してきている**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — cả 2 đều KHÔNG thay đổi cách nhìn (hình ảnh cố định), đây là điểm phê phán của tác giả."}]},{"huongTuDuy":"Quan điểm tổng kết của tác giả về tranh vẽ núi — bám câu kết bài.","chotY":"「山に登る者の心に刻印される山の風景…**確定しえない動的な現象として記憶されてもよい**」「**その表現は、もっと多様であるべき**だろう」.","lienKetJP":"山＝変化する → 単一的なイメージで描かれている現状 → しかし→ 山は多様なはずなので→ 表現も多様であるべき","lienKetVI":"Núi = biến đổi → hiện tại bị vẽ với hình ảnh đơn điệu → nhưng → núi vốn đa dạng → cách biểu hiện cũng nên đa dạng","correct":{"jp":"山の姿は**単一ではない**のだから、**その表現も多様であるべきだ**","vi":"Khớp trực tiếp với 「見る者の心のなかで定着される山のイメージは…もっと多様であるべきだろう」."},"wrong":[{"key":"A","jp":"山の姿を描くためには、**その山の特徴を強調すべきだ**","trap":"bẫy mọi người","vi":"Không có trong bài — 'nhấn mạnh đặc điểm của từng núi' không phải điều tác giả đề xuất."},{"key":"B","jp":"山を多様に描くためには、**画家は個性を発揮すべきだ**","trap":"bẫy chi tiết phụ","vi":"'Phát huy cá tính của họa sĩ' chỉ là phương tiện, không phải điểm nhấn cốt lõi — điều cốt lõi là NHẬN RA thực tế biến đổi của núi rồi mới biểu hiện đa dạng."},{"key":"C","jp":"山への思いは皆違うのだから、**その表現も自由であるべきだ**","trap":"bẫy chi tiết phụ","vi":"'Suy nghĩ của mọi người về núi khác nhau' không phải luận điểm của bài — bài xuất phát từ THỰC TẾ VẬT LÝ của núi (luôn biến đổi), không phải từ sự khác nhau của cảm nhận cá nhân."}]}],"Mon12-13":[{"huongTuDuy":"Lý do biên tập viên yêu cầu không dùng từ '科学' — câu trích dẫn lời biên tập viên nêu rõ.","chotY":"「「科学」と聞いただけで**引いてしまう**（そのページを読むことをやめてしまう）人がけっこういますから」— người đọc có TÂM LÝ NGẠI/SỢ khoa học.","lienKetJP":"「科学」という言葉を使うな → なぜなら → 「科学」と聞いただけで引いてしまう読者がいる → 苦手意識を持っている","lienKetVI":"Không dùng từ 'khoa học' → vì → chỉ nghe từ đó đã muốn dừng đọc → người đọc có tâm lý ngại/sợ khoa học","correct":{"jp":"読者が**科学に苦手意識を持っている**と考えているから","vi":"Khớp trực tiếp với 「「科学」と聞いただけで引いてしまう人がいる」."},"wrong":[{"key":"B","jp":"読者が科学の**専門的なことばを理解できない**と考えているから","trap":"bẫy chi tiết phụ","vi":"'Không hiểu thuật ngữ' khác với 'có tâm lý ngại' — biên tập viên không nói về hiểu/không hiểu, mà về THÁI ĐỘ KHI NGHE từ 'khoa học'."},{"key":"C","jp":"読者が考える科学と**暮らしの中の科学は違う**と考えているから","trap":"bẫy mọi người","vi":"Không có trong lý do biên tập viên nêu — tự thêm ý về sự khác biệt nhận thức."},{"key":"D","jp":"読者が持っている科学の**イメージがはっきりしない**と考えているから","trap":"bẫy mọi người","vi":"Không có trong bài — biên tập viên nói về PHẢN ỨNG CỤ THỂ (dừng đọc), không phải về hình ảnh mơ hồ."}]},{"huongTuDuy":"'Người sử dụng công nghệ' theo tác giả — tìm câu mô tả trực tiếp.","chotY":"「それを使う側の人は与えられたものを**十分に理解せず**「買う」という行動だけで受け入れている」.","lienKetJP":"科学技術を使う人 → 理解せず → 「買う」だけで受け入れる → 使ってはいるが理解していない","lienKetVI":"Người dùng công nghệ → không hiểu → chỉ 'mua' mà chấp nhận → dùng nhưng không thực sự hiểu","correct":{"jp":"**科学技術を使ってはいるが、理解しているとは言えない**","vi":"Khớp với 「十分に理解せず「買う」という行動だけで受け入れている」."},"wrong":[{"key":"A","jp":"科学技術は**使っているうちに理解できる**と思っている","trap":"bẫy mọi người","vi":"Không có trong bài — không nói về việc người dùng 'nghĩ có thể hiểu sau này'."},{"key":"C","jp":"科学技術を**理解してはいるが、使いこなせていない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói DÙNG ĐƯỢC nhưng KHÔNG HIỂU, không phải ngược lại."},{"key":"D","jp":"科学技術を**理解しているつもりで**使っている","trap":"bẫy chi tiết phụ","vi":"'Tưởng mình hiểu' thêm sắc thái tự mãn không có trong bài — bài chỉ nói 'không hiểu đủ', không xác nhận người dùng có 'tưởng' gì."}]},{"huongTuDuy":"Vấn đề của 'không cần biết cơ chế' — câu giải thích ngay sau câu ③.","chotY":"「そのような使い方では、供給する側から示された技術の**「良い部分」しか見えません**」「供給する側に**都合のいい情報しか得られない**」.","lienKetJP":"しくみを知らない → 「良い部分」しか見えない → 供給側に都合のいい情報しか得られない","lienKetVI":"Không biết cơ chế → chỉ thấy phần 'tốt' → chỉ nhận được thông tin CÓ LỢI CHO BÊN CUNG CẤP","correct":{"jp":"**供給する側に都合のいい情報**しか得られないこと","vi":"Khớp trực tiếp với 「供給する側から「良い部分」しか聞かれない」."},"wrong":[{"key":"A","jp":"**マニュアルがないと製品が使えない**こと","trap":"bẫy chi tiết phụ","vi":"Không phải vấn đề được nêu — phụ thuộc vào manual là mô tả cách dùng (マニュアルの通り), không phải vấn đề cốt lõi."},{"key":"B","jp":"**マニュアル以外の使い方ができなくなる**こと","trap":"bẫy chi tiết phụ","vi":"'Không dùng được ngoài manual' không phải điều được nêu như vấn đề chính."},{"key":"C","jp":"供給する側の**伝えたい情報が理解できない**こと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — vấn đề không phải là 'không hiểu thông tin', mà là 'chỉ nhận được thông tin MỘT CHIỀU từ phía cung cấp'."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「科学的背景やしくみを少しでも知った上で、生活の中に**取り入れるか、取り入れないのかを判断する**ことが必要です」.","lienKetJP":"知る → その上で → 生活に取り入れるか否か判断する → これが重要","lienKetVI":"Biết (hiểu cơ chế) → từ đó → tự phán đoán có đưa vào cuộc sống hay không → đây là điều quan trọng","correct":{"jp":"**科学技術を知り、生活に取り入れるかどうかを判断する**ことが大切だ","vi":"Khớp trực tiếp với câu kết 「しくみを少しでも知った上で、取り入れるか否かを判断することが必要」."},"wrong":[{"key":"A","jp":"**技術の知識を豊富に身につける**ことが大切だ","trap":"bẫy chi tiết phụ","vi":"'Phong phú kiến thức' quá cao hơn mục tiêu bài đặt ra — tác giả chỉ nói 「少しでも知った上で」 (biết PHẦN NÀO), không đòi hỏi nhiều kiến thức."},{"key":"B","jp":"科学技術を**マニュアルに頼らず使いこなす**ことが大切だ","trap":"bẫy chi tiết phụ","vi":"'Sử dụng thành thạo không cần manual' không phải mục tiêu — bài nói về việc PHÁN ĐOÁN có dùng hay không, không phải về kỹ năng sử dụng."},{"key":"C","jp":"科学技術を**取り入れ**、そのしくみを知ろうとすることが大切だ","trap":"bẫy ngược nghĩa","vi":"Sai trật tự — bài nói 「知った上で…取り入れるか否か判断する」 tức là BIẾT TRƯỚC rồi mới QUYẾT ĐỊNH, không phải 'áp dụng vào rồi tìm hiểu sau'."}]}],"Mon12-14":[{"huongTuDuy":"Hỏi lý do 'gặp thợ lành nghề là một niềm vui khi đến công trường' — đáp án nằm ngay câu sau, ở 'thông tin' họ mang lại.","chotY":"「彼らからもらう情報が**かけがえのない**ものであることが分かる」「**経験則によって裏付けられた**、物に近い、**深くて確かな情報**を持っている」.","lienKetJP":"職人 → 物に触っている → 経験則に裏付けられた深くて確かな情報 → かけがえのない","lienKetVI":"Thợ → trực tiếp chạm vào vật liệu → thông tin sâu và chắc dựa trên kinh nghiệm → không gì thay thế được","correct":{"jp":"職人たちの経験に基づいた信頼できる情報が得られるから","vi":"Khớp với 「経験則によって裏付けられた…深くて確かな情報」= thông tin đáng tin dựa trên kinh nghiệm."},"wrong":[{"key":"A","jp":"職人から得る情報で自分のやり方の正しさが確かめられるから","trap":"bẫy mọi người","vi":"Bài không nói thông tin của thợ dùng để 'xác nhận cách làm của mình đúng'."},{"key":"C","jp":"様々な職人たちから建築設計の多様性が学べるから","trap":"bẫy mọi người","vi":"Không có ý 'học sự đa dạng của thiết kế kiến trúc' từ nhiều thợ."},{"key":"D","jp":"経験豊かな職人たちの仕事ぶりが見られるから","trap":"bẫy chi tiết phụ","vi":"Bài nhấn vào THÔNG TIN nhận được, không phải việc 'ngắm' cách làm việc của họ."}]},{"huongTuDuy":"Bản vẽ tay (鉛筆) chứa đựng điều gì — đoạn 4-5 mô tả cụ thể.","chotY":"「うまくいっていないところは消しゴムで消し、描き直して修正していく」「慣れてくると、図面上の線から、描いた人の**経験的なレベルや人柄**さえ分かるようになる」「手書きの図面には…**様々な種類の情報が塗り込められている**」.","lienKetJP":"鉛筆図面＝設計の過程（消し跡・修正箇所）＋描いた人の情報（レベル・人柄）→ 様々な情報が含まれる","lienKetVI":"Bản vẽ tay = quá trình thiết kế (chỗ xóa/sửa) + thông tin về người vẽ (trình độ/tính cách) → chứa đựng nhiều loại thông tin","correct":{"jp":"**設計の過程や描いた人**に関する情報が得られる","vi":"Khớp với 「経験的なレベルや人柄…わかる」「様々な種類の情報が塗り込められている」."},"wrong":[{"key":"B","jp":"経験を積んで設計に**自信のある人にしか描けない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói ngay cả 'người thiếu tự tin' cũng để lại dấu vết trong bản vẽ (鉛筆の線にも迷いを見て取れる)."},{"key":"C","jp":"**細部は分かりにくいが、全体は把握しやすい**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói điều này về CAD (「全体を把握しにくい」), không phải về bản vẽ tay."},{"key":"D","jp":"**情報を読み取りにくいが**、描いた人の感情がこもっている","trap":"bẫy ngược nghĩa","vi":"Ngược về 'khó đọc thông tin' — bài nói bản vẽ tay chứa NHIỀU THÔNG TIN HỮU ÍCH, dễ đọc hơn CAD."}]},{"huongTuDuy":"Ảnh hưởng của máy tính đến xã hội — câu kết của đoạn về CAD và công nghệ.","chotY":"「リスクの所在が、より**巨大で、見えにくくなった**」「手から遠いコンピューターの出現によって、リスクの所在を**かぎ取ることが**…難しくなってきている」.","lienKetJP":"コンピューター・CADの普及 → 手を使わなくなる → リスクの所在が見えにくくなる","lienKetVI":"Máy tính/CAD phổ biến → ít dùng tay hơn → vị trí của rủi ro khó nắm bắt hơn","correct":{"jp":"どこにどのような**リスクが潜んでいるか把握しにくくなった**","vi":"Khớp với 「リスクの所在が、より巨大で、見えにくくなった」."},"wrong":[{"key":"A","jp":"多くの情報の中から**必要な情報を選び出しにくくなった**","trap":"bẫy chi tiết phụ","vi":"'Khó chọn thông tin' không phải ảnh hưởng được nêu — bài nói về rủi ro BỊ ẨN, không phải về quá tải thông tin."},{"key":"B","jp":"**リスクの高い様々な種類の情報が氾濫するようになった**","trap":"bẫy chi tiết phụ","vi":"'Thông tin nhiều rủi ro tràn lan' không phải nội dung — bài nói rủi ro BỊ KHUẤT TẦM NHÌN, không phải tăng về lượng."},{"key":"C","jp":"これまでに得られた**経験則が社会で必要とされなくなった**","trap":"bẫy chi tiết phụ","vi":"'Kinh nghiệm không cần nữa' không phải điểm chính — bài nói kinh nghiệm cũ KHÔNG ĐỦ để phát hiện rủi ro mới, không phải 'không cần thiết'."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「**忘れられつつある手の行き場を考えるべき**だろう」「手によって生み出された時間を自分のために使う」「**どこかでそれを、生身の身体を持つ人間の側に引き戻す必要**がある」.","lienKetJP":"コンピュータ化が進む → 手の作業が忘れられる → しかし手から得られる情報は重要 → 手によってなされる仕事の価値を再認識すべき","lienKetVI":"Máy tính hóa tiến nhanh → công việc bằng tay bị lãng quên → nhưng thông tin từ tay vẫn quan trọng → cần NHÌN LẠI GIÁ TRỊ của công việc bằng tay","correct":{"jp":"**手によってなされる仕事の価値を再認識すべき**だ","vi":"Khớp với câu kết 「忘れられつつある手の行き場を考えるべき」「人間の側に引き戻す必要がある」."},"wrong":[{"key":"A","jp":"**コンピュータ化によるリスクを経験則によって回避すべきだ**","trap":"bẫy chi tiết phụ","vi":"'Dùng kinh nghiệm cũ để tránh rủi ro' không phải kết luận bài hướng đến — bài nói kinh nghiệm cũ KHÔNG ĐỦ, cần 'đưa về phía con người'."},{"key":"B","jp":"コンピューター化による**効率重視の風潮を改めるべきだ**","trap":"bẫy chi tiết phụ","vi":"'Sửa thái độ trọng hiệu quả' quá chung chung — bài nhấn mạnh cụ thể vào GIÁ TRỊ CỦA CÔNG VIỆC BẰNG TAY."},{"key":"C","jp":"手によってなされる仕事の**伝統を守っていくべきだ**","trap":"bẫy chi tiết phụ","vi":"'Bảo tồn truyền thống' hàm ý nhìn về quá khứ — bài nhấn mạnh 'NHÌN NHẬN LẠI GIÁ TRỊ' cho hiện tại và tương lai (引き戻す必要)."}]}],"Mon12-15":[{"huongTuDuy":"'Khoa học nguyên thủy' theo tác giả — câu đầu bài định nghĩa rõ ràng.","chotY":"「自然と戯れながら**自然の偉大さを学んでいく**科学」「好奇心、探求心、美を求める心…**人間の感性を最大限練磨**して、人間の可能性を拡大する営み」.","lienKetJP":"原初的な科学＝役立とうという野心を捨て → 自然の偉大さを学ぶ → 人間の感性を磨く","lienKetVI":"Khoa học nguyên thủy = bỏ tham vọng 'có ích' → học từ sự vĩ đại của tự nhiên → mài giũa cảm tính con người","correct":{"jp":"**自然の偉大さを学び**、人間の**感性を豊かにしていく**もの","vi":"Khớp với 「自然の偉大さを学んでいく」「人間の感性を最大限練磨」."},"wrong":[{"key":"A","jp":"一見無用と思われるものを、**世の中に役立てようとする**もの","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — bài nói 「世の中に役立とうというような野心を捨て」 = BỎ tham vọng 'có ích'."},{"key":"B","jp":"人間の可能性を拡大するために、**なくてはならない**もの","trap":"bẫy chi tiết phụ","vi":"'Không thể thiếu' không phải đặc trưng nêu ra — bài nói về MỤC TIÊU của khoa học nguyên thủy, không phải về tính thiết yếu."},{"key":"C","jp":"自然の中で感性豊かに生きるために、**自然を学ばうとするもの**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng thiếu yếu tố cốt lõi 'mài giũa cảm tính' (練磨) — chỉ nói 'học về tự nhiên' là chưa đủ."}]},{"huongTuDuy":"Điều cần 'suy nghĩ lại' — tìm nội dung đoạn ngay sau câu đó.","chotY":"「金を通しての科学者と社会の**綱引き状態**と言えるだろうか」→「それでいいのかと改めて考え直してみる必要がある」— cả khoa học gia lẫn xã hội đều chỉ nhìn khoa học qua TIỀN.","lienKetJP":"社会＝金の見返りを求める / 科学者＝もっと金をよこせと言う → 双方が経済的観点からしか見ていない → それでいいのか","lienKetVI":"Xã hội = đòi hoàn vốn bằng tiền / Khoa học gia = đòi thêm tiền → cả 2 chỉ nhìn khoa học từ góc độ kinh tế → có ổn không?","correct":{"jp":"**社会も科学者も科学を経済的観点からしか見ていないこと**","vi":"Khớp với 「金を通しての科学者と社会の綱引き状態」 — cả 2 phía đều chỉ quan tâm đến tiền."},"wrong":[{"key":"A","jp":"科学の営みの中に**社会に寄与しないムダが多いこと**","trap":"bẫy chi tiết phụ","vi":"Bài thừa nhận 「無用の用にすらならないムダも多いだろう」 nhưng ngay sau đó chuyển sang 「しかし…」— đây không phải điều cần 'suy nghĩ lại'."},{"key":"B","jp":"社会が**科学に投資したくなってきたこと**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói xã hội VẪN ĐẦU TƯ nhưng theo tiêu chí kinh tế, không phải 'không muốn đầu tư'."},{"key":"D","jp":"社会も科学者も**科学に見返りを求めるべきではない**と考えていること","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — đây là điều TÁC GIẢ MONG MUỐN, không phải hiện trạng mà tác giả phê phán."}]},{"huongTuDuy":"Đóng góp của khoa học cho xã hội theo tác giả — bám đoạn 'しかし、ときに...'","chotY":"「ときに科学は世界の見方を変える大きな力を秘めている。事実、科学はその力によって**自然観や世界観を一変**させ、社会のありように**大きな変化をもたらしてきた**」.","lienKetJP":"科学の真の貢献 → 自然観・世界観を変える → これまで主流だったものの見方を覆す","lienKetVI":"Đóng góp thật sự của khoa học → thay đổi quan niệm về tự nhiên/thế giới → lật đổ cách nhìn chủ đạo trước đó","correct":{"jp":"**これまで主流とされてきたものの見方を覆し**変化をもたらした","vi":"Khớp với 「自然観や世界観を一変させ、社会のありように大きな変化をもたらしてきた」."},"wrong":[{"key":"A","jp":"**無数の科学者の積み上げから天才を登場させてきた**","trap":"bẫy chi tiết phụ","vi":"'Đào tạo thiên tài' là PHƯƠNG TIỆN/QUÁ TRÌNH, không phải ĐÓNG GÓP cho xã hội được hỏi."},{"key":"C","jp":"社会の要求する**新しい商品を次々に提供してきた**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — đây là mô tả khoa học gia như 'nhân viên bán hàng' (セールスマン), là điều TÁC GIẢ PHÊ PHÁN, không phải đóng góp thật sự."},{"key":"D","jp":"社会の役に立たないことにも**価値があると人々に認識させてきた**","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về 'thay đổi nhận thức về vô dụng'."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「今必要なのは、「文化としての科学」を広く市民に伝えることであり、**科学の楽しみを市民とともに共有すること**である」.","lienKetJP":"役に立つ科学ではなく → 文化としての科学 → 楽しみを市民と共有する → これが今必要","lienKetVI":"Không phải 'khoa học hữu ích' → mà 'khoa học văn hóa' → chia sẻ niềm vui khoa học với công dân → đây là điều cần thiết hiện nay","correct":{"jp":"市民と**科学の楽しみを共有**することが「**文化としての科学**」の発展につながる","vi":"Khớp trực tiếp với câu kết 「科学の楽しみを市民とともに共有することである」."},"wrong":[{"key":"B","jp":"市民が**知的好奇心を高め合えば**「文化としての科学」が豊かになる","trap":"bẫy chi tiết phụ","vi":"'Nâng cao tò mò trí tuệ của nhau' không phải điểm nhấn — bài nhấn mạnh vai trò CHỦ ĐỘNG của nhà khoa học trong việc CHIA SẺ."},{"key":"C","jp":"「文化としての科学」と「役に立つ科学」が**共存すること**で社会が豊かになる","trap":"bẫy chi tiết phụ","vi":"'Cùng tồn tại' không phải điều được đề xuất — bài rõ ràng ưu tiên 'văn hóa' hơn 'hữu ích'."},{"key":"D","jp":"「文化としての科学」とともに**「役に立つ科学」を市民に伝えること**が必要だ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói muốn bỏ định hướng 「役に立つ科学」, không phải truyền tải cả 2."}]}],"Mon12-16":[{"huongTuDuy":"'そうした雰囲気' — chỉ thị từ về không khí xã hội đã mô tả trước đó.","chotY":"「漠然と、倫理といったものが**必要だという気分**が漂っているのは、事実であるように思う」.","lienKetJP":"「○○倫理」ということばがさかんに聞かれる → 倫理が必要だという気分が漂っている → 社会が倫理を求めている","lienKetVI":"Từ '○○đạo đức' được nghe khắp nơi → không khí xã hội cảm thấy cần đạo đức → xã hội đang cầu cần đạo đức","correct":{"jp":"**社会が倫理を求めている**","vi":"Khớp với 「倫理といったものが必要だという気分が漂っている」."},"wrong":[{"key":"B","jp":"**マスコミが倫理の必要性を訴えている**","trap":"bẫy chi tiết phụ","vi":"Truyền thông là PHƯƠNG TIỆN nêu vấn đề, không phải '不khí xã hội' được hỏi."},{"key":"C","jp":"**倫理学の価値が見直されつつある**","trap":"bẫy chi tiết phụ","vi":"'Giá trị đạo đức học được nhìn lại' không chính xác bằng 'xã hội cầu cần đạo đức'."},{"key":"D","jp":"**倫理学が他の分野に応用され始めている**","trap":"bẫy chi tiết phụ","vi":"Đây là HIỆN TƯỢNG (応用倫理学の成長), không phải 'không khí xã hội' theo nghĩa rộng mà bài mô tả."}]},{"huongTuDuy":"Điểm tương đồng giữa đạo đức và không khí — đoạn ẩn dụ giải thích rõ.","chotY":"「普段…空気を吸っていることをとりたてて意識などしない。**希薄になって、息苦しくでもならない限り**、空気は意識されたりはしない」— chỉ khi CẢM THẤY CẦN mới để ý.","lienKetJP":"空気＝必要だとわかっていても希薄でなければ意識しない → 倫理も同じ → 必要だと感じなければ意識されない","lienKetVI":"Không khí = biết là cần nhưng không ý thức đến trừ khi thiếu → Đạo đức cũng vậy → không cảm thấy cần thì không được ý thức đến","correct":{"jp":"**必要だと感じなければ**、意識されない","vi":"Khớp với 「希薄になって、息苦しくでもならない限り、空気は意識されない」 — chỉ khi 'ngột ngạt' (cảm thấy cần) mới ý thức."},"wrong":[{"key":"A","jp":"**実体がわかりにくいので**、意識されない","trap":"bẫy mọi người","vi":"Không phải điểm tương đồng được nêu — lý do không ý thức là 'chưa cảm thấy cần', không phải 'khó hiểu bản chất'."},{"key":"B","jp":"生きていく上で、**常になくてはならない**","trap":"bẫy chi tiết phụ","vi":"Đây là đặc tính giống nhau về tầm quan trọng, nhưng không phải điểm tương đồng THEO ĐÚNG NGỮCẢNH bài hỏi (tại sao không được ý thức đến)."},{"key":"D","jp":"必要になっても、**すぐには意識されにくい**","trap":"bẫy chi tiết phụ","vi":"'Khó ý thức ngay' không chính xác — bài nói chỉ khi CẢM THẤY THIẾU (息苦しく) mới được ý thức, không phải 'chậm ý thức'."}]},{"huongTuDuy":"'Thời đại đạo đức' theo tác giả — đoạn lịch sử giải thích.","chotY":"「「倫理的な時代」はいずれも**価値観の大きな変動期**にあたっていた」「それまで当然だと思っていた考え方や生き方が大きく揺らぎ、どう考え、**どう生きたらよいのかわからない**ようなとき」.","lienKetJP":"倫理的な時代 → 価値観の変動期 → 従来の考え方・生き方が揺らぐ → どう生きればいいかわからない","lienKetVI":"Thời đại đạo đức = giai đoạn biến động giá trị quan → cách nghĩ/sống truyền thống lung lay → không biết sống như thế nào","correct":{"jp":"**従来の価値観が通用しなくなり**、人々が**生きる方向性を見失っている**","vi":"Khớp với 「それまで当然だった考え方・生き方が大きく揺らぎ、どう生きたらよいのかわからない」."},"wrong":[{"key":"A","jp":"**新たな価値観が生まれ**、社会に**受け入れられている**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói giá trị cũ LUNG LAY, không phải giá trị mới đã được chào đón."},{"key":"C","jp":"倫理の価値が**再評価**され、次の世代に積極的に倫理を教えている","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về việc dạy đạo đức cho thế hệ sau."},{"key":"D","jp":"倫理自体に価値がないと考えられ、社会が**大きく揺らいでいる**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói xã hội CẦU CẦN đạo đức (求められる), không phải 'coi đạo đức vô nghĩa'."}]},{"huongTuDuy":"Câu cuối nói về điều con người sống trong 'thời đại đạo đức' có thể làm — nhìn câu 「…とりあえずできるのは、」ở đoạn cuối.","chotY":"「積極的な態度や発言が簡単にはできない」「とりあえずできるのは、**何があるのか、どのような問題が出てきているのかを知り、考えていくこと**である」.","lienKetJP":"先が見通せない時代 → 積極的な態度・発言は難しい → できるのは現状を知り考えること","lienKetVI":"Thời đại không nhìn thấy trước → khó chủ động phát ngôn/hành động → điều làm được là tìm hiểu và suy nghĩ về hiện trạng","correct":{"jp":"現状の問題を把握して考えること","vi":"Khớp với 「何があるのか、どのような問題が出てきているのかを知り、考えていくこと」."},"wrong":[{"key":"A","jp":"積極的に発言し行動すること","trap":"bẫy ngược nghĩa","vi":"Bài nói chính vì 'khó mà tích cực phát ngôn/hành động' nên mới là thời đại đạo đức — ngược hẳn."},{"key":"B","jp":"現在の経験を将来生かすこと","trap":"bẫy mọi người","vi":"Không có ý dùng kinh nghiệm hiện tại cho tương lai; bài nhấn 'không biết trước kết quả'."},{"key":"D","jp":"未来を切り開く方法を考えること","trap":"bẫy ngược nghĩa","vi":"'Mở ra tương lai mới' chỉ là thái độ tích cực mà tác giả nói là khó thực hiện, không phải điều làm được lúc này."}]}],"Mon12-17":[{"huongTuDuy":"Lý do thầy/đàn anh dạy bằng 'nhìn mà học' thay vì lời nói — câu giải thích trực tiếp.","chotY":"「自分の指先や感覚、体が覚えた技を伝えるには**言葉はあまりに幅が狭すぎる**からだ」.","lienKetJP":"技は感覚・指先・体が覚えるもの → 言葉では十分に伝えられない → 「見て学べ」","lienKetVI":"Kỹ năng được lưu trong cảm giác/đầu ngón tay/cơ thể → ngôn ngữ không đủ để truyền đạt → 'hãy nhìn mà học'","correct":{"jp":"**技は言葉では十分伝えられない**から","vi":"Khớp trực tiếp với 「言葉はあまりに幅が狭すぎる」."},"wrong":[{"key":"A","jp":"**技を伝える言葉を理解させられない**から","trap":"bẫy chi tiết phụ","vi":"'Học trò không hiểu được lời' sai trọng tâm — vấn đề là ngôn ngữ BẢN THÂN không đủ, không phải khả năng hiểu của học trò."},{"key":"C","jp":"技は**言葉で伝えても身につかない**から","trap":"bẫy chi tiết phụ","vi":"Gần đúng về hệ quả nhưng sai về cơ chế — bài nhấn mạnh 'ngôn ngữ KHÔNG ĐỦ RỘNG' (幅が狭すぎる) để diễn đạt kỹ năng thể chất."},{"key":"D","jp":"技は**時間がたてば自然に身につく**ものだから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nhấn mạnh phải TÍCH CỰC rèn luyện/nỗ lực (努力を惜しまなかった), không phải 'tự nhiên học được'."}]},{"huongTuDuy":"①努力を惜しまなかった — tìm lý do ở câu ngay sau.","chotY":"「目指す到達点が遠いことに気づく。だから日々の①努力を惜しまなかった。**努力だけが自分を補ってくれる手段**だったからだ」.","lienKetJP":"目指す到達点が遠い → 努力だけが手段 → 努力し続けなければ近づけない","lienKetVI":"Đích đến còn xa → chỉ có nỗ lực là phương tiện → nếu không nỗ lực không thể tiến gần đến đích","correct":{"jp":"**努力をし続けなければ、目指すものに近づけない**から","vi":"Khớp với 「努力だけが自分を補ってくれる手段」「目指す到達点が遠い」."},"wrong":[{"key":"A","jp":"努力を積み重ねなければ、**辛さが喜びに変わらない**から","trap":"bẫy chi tiết phụ","vi":"Bài CÓ đề cập 'nỗ lực vui và buồn' nhưng đây không phải LÝ DO chính — lý do là 'nỗ lực là phương tiện duy nhất tiến đến đích'."},{"key":"B","jp":"努力を積み重ねれば、**報われた時の喜びが大きくなる**から","trap":"bẫy chi tiết phụ","vi":"'Được đền đáp lớn hơn' không phải lý do được nêu — đây là kết quả tích lũy, không phải động lực nỗ lực."},{"key":"C","jp":"努力をして腕を上げれば、**利益が出るから**","trap":"bẫy chi tiết phụ","vi":"'Lợi nhuận' là kết quả phụ (利益も出るようになるが), không phải lý do của ①努力を惜しまなかった."}]},{"huongTuDuy":"Thời đại thay đổi — cách làm việc của con người thay đổi thế nào?","chotY":"「技はデータとして機械に組み込まれ、**人間に付属するものではなくなってしまった**」「世の仕組みも…努力や修業、技を持つ体を**不要なものとした**のだ」.","lienKetJP":"機械化・効率化 → 技は機械のデータになる → 人間が技を習得する必要がなくなった","lienKetVI":"Cơ giới hóa/hiệu quả hóa → kỹ năng trở thành dữ liệu của máy → con người không cần học kỹ năng nữa","correct":{"jp":"**技を習得することが必要とされなくなった**","vi":"Khớp với 「技はデータとして機械に組み込まれ」「努力や修業、技を持つ体を不要なものとした」."},"wrong":[{"key":"A","jp":"**修業に努力が求められなくなった**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng bài nói bản thân VIỆC TU LUYỆN BỊ LÀM THỪA (不要), không chỉ là 'nỗ lực giảm'."},{"key":"C","jp":"機械の出現で**効率的に修業ができるようになった**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — máy móc không giúp 'tu luyện hiệu quả hơn' mà loại bỏ sự cần thiết của tu luyện."},{"key":"D","jp":"**誰もが機械に精通することを求められるようになった**","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về 'cần thành thạo máy móc'."}]},{"huongTuDuy":"Quan điểm tổng kết của tác giả — bám câu kết bài.","chotY":"「社会が変わっても人は生きていかねばならない。…新しい時代の中で**働く意味と喜びを見つけ出さなければ**、生きづらさが増すばかりだ」.","lienKetJP":"機械を捨てるわけではない → しかし → 新しい時代の中でも働く意味と喜びを見つける → それが重要","lienKetVI":"Không bỏ máy móc → nhưng → trong thời đại mới vẫn phải tìm ra ý nghĩa/niềm vui trong lao động → điều đó là quan trọng","correct":{"jp":"**時代が変わっても**、**働く意味と喜びを見つけ**て生きていこう","vi":"Khớp với 「新しい時代の中で働く意味と喜びを見つけ出さなければ…」."},"wrong":[{"key":"A","jp":"生きづらい社会であっても、**誇りを持って**生きていこう","trap":"bẫy chi tiết phụ","vi":"'Tự hào' là cảm xúc được nêu khi mô tả người xưa, không phải kết luận tác giả hướng đến."},{"key":"B","jp":"**修業を通して働く意味と喜びを得られた時代に戻るべきだ**","trap":"bẫy chi tiết phụ","vi":"'Quay lại thời xưa' không phải kết luận — tác giả nói 「機械を捨てるというのではない」 = không phủ nhận hiện đại."},{"key":"D","jp":"働く意味や喜びを大切にしながら、**効率を追求していくべきだ**","trap":"bẫy chi tiết phụ","vi":"'Đuổi theo hiệu quả' không phải điểm nhấn — bài chú trọng vào 'ý nghĩa và niềm vui lao động', không phải tối ưu hóa hiệu quả."}]}],"Mon12-18":[{"huongTuDuy":"Quy tắc xã hội ngày xưa được hình thành thế nào — câu đầu đoạn 2 giải thích.","chotY":"「同じ土地で、たくさんの人が**争わずに仲良く生活するためにひつよう**だから」「自然に生まれてくるものであった」.","lienKetJP":"かつては → 同じ土地での営みの中で → 自然に生まれてくる（必要があったから）","lienKetVI":"Ngày xưa → từ hoạt động sống chung trên cùng mảnh đất → tự nhiên nảy sinh (vì cần thiết)","correct":{"jp":"ともに生活するうえで必要なものとして、同じ土地の人々の間で**自然に発生した**","vi":"Khớp với 「その場所での営みの中で自然に生まれてくる」「争わずに仲良く生活するためにひつよう」."},"wrong":[{"key":"A","jp":"**自分自身よりも、周りの人を優先するという考え**に基づいていた","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm nguyên tắc 'người khác trước bản thân'."},{"key":"B","jp":"同じ土地の人々の間でも、**一様に認識されているものではなかった**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói quy chuẩn ngày xưa được CHIA SẺ tự nhiên bởi cộng đồng, không phải 'không nhất quán'."},{"key":"C","jp":"同じ土地で人々と争わずに生活していれば、**自然に身についてくる**ものだった","trap":"bẫy chi tiết phụ","vi":"'Tự nhiên thấm vào bản thân' nhầm chủ thể — bài nói quy chuẩn TỰ NHIÊN PHÁT SINH TRONG CỘNG ĐỒNG, không phải 'bản thân từng người tự nhiên học được'."}]},{"huongTuDuy":"'Vô thức trở thành khuôn mẫu' — cần xác định đúng nội dung của cụm ẩn dụ này.","chotY":"「自分でいちいち判断せずに従っていると、今度はそれが**無意識の型となってくる**」「なぜその行動をしているのか…**改めて考えなくなる**」「物事の判断基準が「**ルールに従っているかどうか**」に変わってしまう」.","lienKetJP":"理由を考えずにルールに従う → 無意識に従うのが当たり前になる → 法律・制度を考えずに従うべきものとして認識","lienKetVI":"Không suy nghĩ lý do mà theo quy tắc → vô thức biến thành thói quen → nhận thức quy tắc là 'điều phải tuân theo' mà không cần hiểu","correct":{"jp":"**法律や制度の必要性を考えずに**、従うべきものとして**認識してしまう**","vi":"Khớp với 「なぜその行動をしているのか考えなくなる」「判断基準が「ルールに従っているかどうか」に変わる」."},"wrong":[{"key":"A","jp":"法律や制度に合わせることが、**特に難しいことではなくなってくる**","trap":"bẫy chi tiết phụ","vi":"'Không khó để tuân theo' không phải nội dung của 無意識の型 — bài nhấn mạnh mất đi SỰ NHẬN THỨC/PHÁN ĐOÁN, không phải về độ khó."},{"key":"C","jp":"法律や制度の意味が分からなくなり、**守る必要性を感じなくなる**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói TIẾP TỤC TUÂN THEO (theo khuôn mẫu), không phải 'không cảm thấy cần tuân theo'."},{"key":"D","jp":"法律や制度の意味を理解していなくても、**人々の間で共有できる**","trap":"bẫy chi tiết phụ","vi":"'Được chia sẻ dù không hiểu' là hiện tượng có thật nhưng sai ý nghĩa của vấn đề — bài phê phán điều này, không phải coi là tốt."}]},{"huongTuDuy":"Điều tác giả muốn nói — bám câu kết bài.","chotY":"「もう一度それに正しくまなざしを向けなおすためには、**その想像の型をいったん外して、全く違う型を取ってみることが重要**なのである」.","lienKetJP":"ルールが単なる記号になる → まなざしを向けなおす必要 → 想像の型を外す → なぜそのルールがあるのか考えること","lienKetVI":"Quy tắc trở thành ký hiệu đơn thuần → cần nhìn lại → thoát khỏi khuôn mẫu tư duy → nghĩ xem TẠI SAO có quy tắc đó","correct":{"jp":"**なぜそのルールがあるのか**を考えて、行動することが大切だ","vi":"Khớp với 「その想像の型をいったん外して」「なぜその場所にそのルールがあるのかを改めて考えなくなる」(phê phán điều này)."},"wrong":[{"key":"A","jp":"ルールは**時代の変化に合わせて変えていく**ことが大切だ","trap":"bẫy chi tiết phụ","vi":"'Thay đổi quy tắc theo thời đại' không phải điều được đề xuất — bài nói về THÁI ĐỘ với quy tắc, không phải cách sửa đổi quy tắc."},{"key":"B","jp":"ルールの有無にかかわらず、**自身が正しいと思う行動をすべきだ**","trap":"bẫy mọi người","vi":"'Làm theo lương tâm bất kể quy tắc' quá cực đoan — bài không phủ nhận quy tắc, chỉ kêu gọi HIỂU LÝ DO của chúng."},{"key":"D","jp":"これまでのルールに反している行動でも、**社会の中で許容していくべきだ**","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về sự khoan dung với hành vi vi phạm quy tắc."}]}],"Mon12-19":[{"huongTuDuy":"Câu mở bài phủ định hoàn toàn 2 quan niệm sai: (A) tự thích nghi và (B) di chuyển tìm môi trường phù hợp — rồi chỉ ra cơ chế thật sự.","chotY":"「DNAに生じた変化は、「偶然」によるものだ」「その変化がたまたま自然環境に合っていれば、その生物は子孫を残せた」","lienKetJP":"DNA変化は偶然（自身の意志ではない）→ たまたま環境に合った変化だけが生き残る → 自然界で子孫を残せた理由","lienKetVI":"Biến đổi DNA là ngẫu nhiên (không phải ý chí) → biến đổi nào vô tình phù hợp môi trường → loài đó giữ lại được con cháu","correct":{"jp":"DNAに生じた変化が、**たまたま自然環境に合った**から","vi":"Khớp với 「その変化がたまたま自然環境に合っていれば」— 'たまたま' là từ khóa cốt lõi: ngẫu nhiên, không phải chủ ý."},"wrong":[{"key":"A","jp":"自然環境に合わせて**自身を変化させた**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài khẳng định sinh vật KHÔNG tự chủ ý thay đổi theo môi trường, biến đổi là ngẫu nhiên (偶然)."},{"key":"B","jp":"自身に適した自然環境を選んで**移動した**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phủ định việc 'tự di chuyển tìm môi trường phù hợp' (そんな都合のいいことにはならない)."},{"key":"C","jp":"DNAが複製されるときに、ずれが**生じなかった**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — chính CÁI LỖI (ずれ) khi sao chép DNA mới tạo ra biến đổi, không có lỗi thì không có tiến hóa."}]},{"huongTuDuy":"①ホワイトレグホン — chỉ thị từ, tìm đúng mô tả đặc điểm hiện tại của giống gà này.","chotY":"「ある種の鳥は、卵を産んでも暖めることを放棄してしまったら」「人間はその鳥の卵を代わって暖め…毎日排卵し、300個以上も卵を産み続ける」","lienKetJP":"本来：卵を産んで暖める → 変化：暖めることを放棄 → 人間が代わりに暖める → 現在：卵を産んでも暖めない（①ホワイトレグホン）","lienKetVI":"Bình thường: đẻ trứng rồi ấp → Biến đổi: không còn ấp trứng → người ấp thay → Hiện tại gà Bạch Leghorn đẻ trứng mà không ấp","correct":{"jp":"卵を産んでも**暖めない**","vi":"Khớp trực tiếp với 「卵を産んでも暖めることを放棄してしまった」 — đặc điểm cốt lõi của ①ホワイトレグホン."},"wrong":[{"key":"B","jp":"一度に**多くの卵を産む**","trap":"bẫy chi tiết phụ","vi":"Gần đúng về số lượng (300個以上) nhưng sai đặc trưng ĐỊNH NGHĨA — điều đặc biệt không phải 'đẻ nhiều' mà là 'đẻ mà không ấp'."},{"key":"C","jp":"産んだ卵を**ほかの鳥に託す**","trap":"bẫy mọi người","vi":"Không có trong bài — gà không nhờ chim khác ấp, mà là CON NGƯỜI ấp thay."},{"key":"D","jp":"ほかの鳥より卵を**暖める時間が短い**","trap":"bẫy chi tiết phụ","vi":"Sai mức độ — không phải 'ấp ngắn hơn' mà là KHÔNG ẤP HOÀN TOÀN (放棄)."}]},{"huongTuDuy":"カイコ — chuỗi nhân-quả khi người cung cấp thức ăn nhân tạo liên tục.","chotY":"「人間が常時餌を供給してやるようにすると、幼虫は餌を探索するのをサボるようになる」「余力を絹糸を作り出すことに振り向けるようになった」","lienKetJP":"人間が餌を供給 → 幼虫が餌探索をサボる → 余力が生まれる → 絹糸を作ることに専念","lienKetVI":"Người cung cấp thức ăn → tằm không cần tìm mồi → có thêm năng lượng dư → dồn vào tạo tơ tằm","correct":{"jp":"人間が餌を与えることで、**絹糸を作ることに専念**するようになった","vi":"Khớp với 「余力を絹糸を作り出すことに振り向けるようになった」 — chuỗi nhân quả đúng."},"wrong":[{"key":"A","jp":"身動きが取れないため、細糸が**多く作り出せなくなった**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói tằm TẠO RA NHIỀU tơ hơn (振り向ける), không phải ít hơn."},{"key":"C","jp":"生きるエネルギーの大部分を、**餌を食べることに費やす**ようになった","trap":"bẫy ngược nghĩa","vi":"Ngược nhân quả — chính vì KHÔNG cần tìm mồi nữa nên mới có thêm năng lượng cho tơ."},{"key":"D","jp":"人工的な環境を与えた結果、絹糸を作るという**新しい能力を獲得した**","trap":"bẫy chi tiết phụ","vi":"Sai — bài nói tằm vốn đã có khả năng tạo tơ từ trước (もともと), người chỉ giúp nó TẬP TRUNG vào đó, không phải 'năng lực mới'."}]},{"huongTuDuy":"Câu hỏi tổng kết — bám câu kết bài về trách nhiệm của con người.","chotY":"「人が作りかえたいのち。それに対して人間はきちんと**責任を取らなければならない**」「その生命たちはもはや**人間なしでは生きていくことができない**」","lienKetJP":"人間が選択者として生命を作りかえた → 生命は人間なしでは生きられない → 人間は作り出した生命との共生関係を維持する責任がある","lienKetVI":"Con người thay tự nhiên thay đổi sinh vật → sinh vật không thể sống thiếu người → người phải duy trì quan hệ cộng sinh và chịu trách nhiệm","correct":{"jp":"人間は**作り出した生命との共生関係を維持**しなければならない","vi":"Khớp với 「人間はきちんと責任を取らなければならない」 — duy trì quan hệ cộng sinh với sinh vật mình đã tạo ra."},"wrong":[{"key":"A","jp":"人間が作りかえた生物は、**本来の姿に戻さなければならない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 「カイコは人間がいないと生きていけない」 — đã không thể trở về tự nhiên được nữa."},{"key":"B","jp":"人間はあらゆる生物と**新たな共生関係を築くべきだ**","trap":"bẫy chi tiết phụ","vi":"Quá rộng — 'mọi sinh vật' sai phạm vi; bài chỉ nói về sinh vật mà CON NGƯỜI ĐÃ CAN THIỆP và tạo ra."},{"key":"C","jp":"人間は生物の進化のプロセスに**介入するべきではない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài mô tả thực tế con người ĐÃ CAN THIỆP và TIẾP TỤC phải chịu trách nhiệm, không phủ nhận việc can thiệp."}]}],"Mon12-20":[{"huongTuDuy":"「よいこと」là câu chỉ thị về đoạn vừa nói — tìm nội dung ngay trước câu đó.","chotY":"「個性的であろうと試みること…自分にとって個性とはと、考えるのはよいことだ」→「自分というものを意識していく、一つの**過程**である」","lienKetJP":"個性的になろうとする（失敗しても）→ 自分について考える → 自分というものを意識する過程 → それがよいこと","lienKetVI":"Cố trở nên cá tính (dù thất bại) → suy nghĩ về bản thân → trở thành quá trình ý thức về 'bản thân là ai' → đó mới là điều tốt","correct":{"jp":"**自分という人間を意識**することになるから","vi":"Khớp với 「自分というものを意識していく、一つの過程」— quá trình cố gắng giúp ý thức về bản thân."},"wrong":[{"key":"A","jp":"個性的である**必要はないと気づく**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không nói 'không cần cá tính', mà nói quá trình TÌM KIẾM cá tính có giá trị riêng của nó."},{"key":"B","jp":"挫折したり悩んだりする**経験が個性を作る**から","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — bài không nói 'thất bại tạo ra cá tính', mà nói thất bại là bằng chứng bạn đang ý thức về bản thân mình."},{"key":"D","jp":"自分にあてはまる**個性の型を見付けられる**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phê phán chính tư duy 'tìm khuôn mẫu cá tính phù hợp' (型にあてはめる) là không phải cá tính thật."}]},{"huongTuDuy":"Câu hỏi về định nghĩa 'cá tính' theo tác giả — bám đoạn giải thích cuối.","chotY":"「個性というものは、人間のひとりひとりに**備わったもの**で、その個性がありのままに出ていることが、本当の意味で個性的である」","lienKetJP":"個性＝最初からひとりひとりに備わっている → 求めるものではない → ありのままに出ることが本当の個性","lienKetVI":"Cá tính = vốn có sẵn trong mỗi người từ đầu → không phải thứ cần tìm kiếm → thể hiện tự nhiên mới là cá tính thật","correct":{"jp":"求めて得るものではなく、**初めから持っている**ものだ","vi":"Khớp với 「個性というものは、人間のひとりひとりに備わったもの」 — cặp gần nghĩa: 備わったもの ↔ 初めから持っているもの."},"wrong":[{"key":"A","jp":"自分から**社会とかかわることで**、意識できるものだ","trap":"bẫy chi tiết phụ","vi":"'Kết nối xã hội' là điều kiện để THỂ HIỆN cá tính ra ngoài (社会との関わりも含めて), không phải để NHẬN RA cá tính."},{"key":"B","jp":"他人と**比較しなければ**、自然に発揮できるものだ","trap":"bẫy ngược nghĩa","vi":"Sai — bài không nêu 'không so sánh' là điều kiện; hơn nữa bài nói trong xã hội buộc phải để ý đến người khác."},{"key":"C","jp":"なりたい自分を**意識すれば**、自然に身につくものだ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 'muốn trở thành' là cách tiếp cận từ bên ngoài vào, còn bài nói cá tính là thứ ĐÃ CÓ SẴN bên trong, chỉ cần để nó tự nhiên ra."}]},{"huongTuDuy":"Câu hỏi tổng kết — bám câu kết bài cuối cùng.","chotY":"「それでも結局、自分とはありのままの自分しかない。それを**自覚したとき**、きみは**個性的なきみになる**」","lienKetJP":"型を追う・逃げる → どちらも本当の個性ではない → 結局ありのままの自分しかない → 自覚 → 個性的になる","lienKetVI":"Đuổi theo khuôn mẫu / trốn chạy → đều không phải cá tính thật → cuối cùng chỉ có bản thân thật → ý thức điều đó → trở nên cá tính","correct":{"jp":"**自分自身であることが大事**だ","vi":"Khớp với câu kết 「自分とはありのままの自分しかない」「自覚したとき、きみは個性的なきみになる」 — cốt lõi là sống đúng bản thân."},"wrong":[{"key":"A","jp":"自分の**個性を模索すべき**だ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói cá tính ĐÃ CÓ SẴN, không cần 'tìm kiếm' (模索); tìm kiếm là cách tiếp cận sai."},{"key":"C","jp":"ありのままの自分を出せ**なくてもいい**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — toàn bài hướng đến 'ありのままの自分を出すこと' là điều cốt lõi."},{"key":"D","jp":"**型に縛られない**生き方をしたほうがいい","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng thiếu chiều sâu — không chỉ 'thoát khuôn mẫu' mà phải 'tự giác rằng bản thân thật là chính mình'; đây là hệ quả, không phải thông điệp cốt lõi."}]}],"Mon12-21":[{"huongTuDuy":"Lý do tác giả nói hiệu quả giáo dục 'không lớn' — đoạn giải thích ngay sau.","chotY":"「教えたとおりに育つとはかぎらない」「教えるつもりがなくても子どもは自ら学んでしまう」「人が発達するのは子どもたちだ」.","lienKetJP":"教育の効果が大きくない → なぜなら → 教えたとおりに子どもは育たないから","lienKetVI":"Hiệu quả giáo dục không lớn → vì → trẻ không nhất thiết lớn lên đúng như được dạy","correct":{"jp":"子どもは、**教えたとおりに育つとはかぎらない**から","vi":"Khớp trực tiếp với 「教えたとおりに育つとはかぎらない」."},"wrong":[{"key":"A","jp":"企業や社会が望む人材と、教育学で目標とする人材は異なるから","trap":"bẫy mọi người","vi":"Không phải lý do được nêu — bài không so sánh mục tiêu của doanh nghiệp và giáo dục học."},{"key":"B","jp":"「生きる力」をつけるために必要なことは、**明確ではない**から","trap":"bẫy chi tiết phụ","vi":"'Không rõ ràng' không phải lý do cụ thể — bài nói về tính BẤT ĐỊNH của kết quả giáo dục, không phải sự không rõ ràng của mục tiêu."},{"key":"C","jp":"子ども一人一人に合わせて、**教育の内容を変えられない**から","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về hạn chế của giáo dục cá nhân hóa."}]},{"huongTuDuy":"Quan điểm của tác giả về giáo dục — bám câu giải thích về 'méo mó'.","chotY":"「ある特定の目的のために教育を合理化・効率化しようとすれば、教育はいびつになる」「もともと、教育は経済のため、地域のため、家族のためだけにあるのではない」.","lienKetJP":"教育＝特定の目的のためだけではない → 特定の目的のために合理化すれば歪む","lienKetVI":"Giáo dục không chỉ vì 1 mục đích cụ thể → nếu hợp lý hóa vì 1 mục đích sẽ bị méo mó","correct":{"jp":"**特定の目的を果たすために存在するものではない**","vi":"Khớp với 「教育は経済のためだけにあるのではない」「特定の目的のために合理化すれば歪む」."},"wrong":[{"key":"A","jp":"それぞれの目的に合わせて**合理化・効率化しなければ**、機能しない","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói hợp lý hóa/tối ưu hóa vì mục đích cụ thể làm giáo dục BỊ MÉO MÓ."},{"key":"B","jp":"みんなで一つの目的を共有しなければ、**効果は上がらない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài cảnh báo chính việc 'mọi người cùng rút lợi ích riêng' làm giáo dục không vận hành tốt."},{"key":"D","jp":"**役に立つかどうかという観点**で評価されるべきだ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phê phán cách nhìn này (giáo dục như công cụ kinh tế)."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「「教育に過大な期待をするな」という警告こそが、今の社会と教育を守るために最も必要なことかもしれない」.","lienKetJP":"教育への過大な期待 → 教育が改革の波に飲まれる → 「現代社会の問題すべてを教育で解決できると思うな」","lienKetVI":"Kỳ vọng quá lớn vào giáo dục → giáo dục bị cuốn vào làn sóng cải cách → 'đừng nghĩ mọi vấn đề xã hội đều giải quyết được bằng giáo dục'","correct":{"jp":"現代社会の**問題のすべてが、教育で解決できる**と思ってはいけない","vi":"Khớp trực tiếp với câu mở và câu kết: 「教育に過大な期待をするな」."},"wrong":[{"key":"A","jp":"多様な社会の要求に応じられるように、**教育のあり方を考え直すべきだ**","trap":"bẫy chi tiết phụ","vi":"'Suy nghĩ lại về giáo dục' gần đúng nhưng không phải điểm nhấn — bài nhấn mạnh GIẢM KỲ VỌNG, không phải cải cách thêm."},{"key":"B","jp":"社会の不安を取り除くためには、**教育を合理化・効率化すべきではない**","trap":"bẫy chi tiết phụ","vi":"'Không nên hợp lý hóa' là lý lẽ trong bài nhưng không phải thông điệp tổng kết — câu kết nhấn mạnh 'đừng kỳ vọng quá'."},{"key":"C","jp":"教育の**改革によって、安定した社会を持続させていくことが必要だろう**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói giáo dục đang bị cuốn vào 'làn sóng cải cách' một cách tai hại, không ủng hộ thêm cải cách."}]}],"Mon12-22":[{"huongTuDuy":"Lý do SNS không giúp được trong lúc gặp khó khăn — tìm câu giải thích trực tiếp.","chotY":"「匿名の支持者は、トラブルの話題自体すぐに忘れてしまう。あっというまに集まった人々は、**同じくあっというまに離れる**」.","lienKetJP":"SNSの支持者＝匿名・面倒なし → トラブルの話題をすぐ忘れる → あっというまに去ってしまう → 役に立たない","lienKetVI":"Người ủng hộ SNS = ẩn danh, không phiền phức → nhanh quên chủ đề → nhanh chóng rời đi → không giúp được","correct":{"jp":"SNSの支持者は**すぐに興味をなくし、去ってしまう**から","vi":"Khớp với 「あっというまに集まった人々は…あっというまに離れる」."},"wrong":[{"key":"A","jp":"SNSの支持者の意見はさまざまで、**すぐにはまとまらない**から","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về 'ý kiến phân tán'."},{"key":"B","jp":"SNSの支持者は**無名で権威を持たない**ひとが多いから","trap":"bẫy chi tiết phụ","vi":"'Vô danh không có uy quyền' là mô tả thực tế nhưng không phải LÝ DO giải thích tại sao SNS không giúp được — lý do là SỰ NHANH CHÓNG RỜI ĐI."},{"key":"C","jp":"SNSの支持者はトラブルの原因を**誤解したまますぐに発信する**から","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về 'hiểu nhầm rồi phát tán'."}]},{"huongTuDuy":"Về 'thời kỳ khó khăn' — tác giả nói gì về cách vượt qua?","chotY":"「継続的に助けてくれるのは、結局は**面倒な人間関係に支えられた家族や友人**たちだったりする」「その**小さく面倒な人間関係をどれだけ濃密**に作れるかで、人生の広がりが決まる」.","lienKetJP":"困難な時期 → SNSは役立たない → 継続的に助けるのは → 面倒だが深い家族・友人関係","lienKetVI":"Thời kỳ khó khăn → SNS không giúp được → điều giúp liên tục là → quan hệ gia đình/bạn bè sâu sắc (dù phiền phức)","correct":{"jp":"**家族や友人**のような存在との**深い関係**によって、乗り越えられる","vi":"Khớp với 「面倒な人間関係に支えられた家族や友人たちだったりする」."},"wrong":[{"key":"A","jp":"自分と世界の認識のズレに気づき**自分が変わろうとすれば**、乗り越えられる","trap":"bẫy chi tiết phụ","vi":"'Tự mình thay đổi' là quá trình được mô tả nhưng không phải CÁI GIÚP VƯỢT QUA — điều giúp vượt qua là QUAN HỆ SÂU SẮC với người thân."},{"key":"B","jp":"「議論」によって相手や**自分を変化させること**で、乗り越えられる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ 「「議論」で相手が変わると考えているひとは、人間の本質について無知」."},{"key":"C","jp":"少数の身の回りの人々から**人間関係を広げていけば**、乗り越えられる","trap":"bẫy chi tiết phụ","vi":"'Mở rộng quan hệ' không phải điểm nhấn — bài nhấn mạnh CHIỀU SÂU (濃密) của quan hệ nhỏ, không phải sự mở rộng."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「情報技術は、面倒のない人間関係の調達を可能にしたが、それはまた**人間から変化の可能性を奪う**ものでもあった。そのことを忘れずにおきたいと思う」.","lienKetJP":"情報技術＝面倒なし関係を作れる → しかし → 変化の可能性を奪う → 人間の成長はない","lienKetVI":"Công nghệ thông tin = tạo quan hệ không phiền phức → nhưng → cướp đi khả năng thay đổi/phát triển của người","correct":{"jp":"情報技術によって作られた人間関係では、**人間の変化は期待できない**","vi":"Khớp với câu kết 「情報技術は…人間から変化の可能性を奪うものでもあった」."},"wrong":[{"key":"A","jp":"情報技術の特徴を理解したうえで活用すれば、**自分自身の変化につながる**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không ủng hộ 'tận dụng tốt công nghệ', mà cảnh báo bản chất của nó."},{"key":"B","jp":"情報技術を活用すれば、**面倒な人間関係を変えられる**可能性がある","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 'quan hệ phiền phức' (gia đình/bạn bè thật) MỚI LÀ thứ tạo ra thay đổi, không phải công nghệ."},{"key":"D","jp":"情報技術は人間の変化の可能性を奪うものであり、**利用は控えるべきだ**","trap":"bẫy chi tiết phụ","vi":"Quá cực đoan — bài không kêu gọi 'không dùng công nghệ', chỉ muốn người ta NHẬN THỨC được hạn chế của nó."}]}],"Mon12-23":[{"huongTuDuy":"Cha mẹ/giáo viên đang làm gì với con cái/học sinh — đoạn 2-3 mô tả.","chotY":"「親も教師も…子ども(生徒)たちを家庭や学校の生活の**枠組みに入れなければならない**」「社会的規範を生まれてから次々と覚え、**身につけていかねばならない**。これは…不自由なことである」.","lienKetJP":"親・教師の役割 → 社会的規範を教える → 社会の枠組みに適応させる → 避けられない","lienKetVI":"Vai trò cha mẹ/giáo viên → dạy quy chuẩn xã hội → cho trẻ thích nghi với khuôn khổ xã hội → không thể tránh","correct":{"jp":"**社会的規範を教え**、**社会の枠組みに適応させている**","vi":"Khớp với 「枠組みに入れなければならない」「社会的規範を身につけさせなければならない」."},"wrong":[{"key":"A","jp":"**反抗を容認しつつ**、不自由な社会的規範に従わせている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 「反抗は望ましいから大いに結構とも違う」 — không phải 'chấp nhận phản kháng'."},{"key":"B","jp":"**どの時代にも通用する**社会的規範を身につけさせている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ quy chuẩn chỉ là 「暫定的なもの」 (tạm thời), thay đổi theo thời đại, không phải vĩnh cửu."},{"key":"D","jp":"社会的規範を教えたうえで、**自由に生きる方法**を身につけさせている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói chính xác ngược lại: 「動物的な本能を抑圧されて、社会的規範を覚えていく。これは不自由なこと」."}]},{"huongTuDuy":"'Tinh thần tài sản' (精神的な財産) là gì — tìm định nghĩa trong văn cảnh.","chotY":"「社会的に生きていくために**今ある社会的規範やルール、考え方をひとまず受け入れなければならない**ということだけである。そして、そういうひとを規制し構成してきたもろもろの**精神的な財産**は、時代とともに変わってきた」.","lienKetJP":"精神的な財産＝社会的規範やルール・考え方 → 社会で生きていくために作られてきたもの → 時代とともに変わる","lienKetVI":"Tài sản tinh thần = quy chuẩn xã hội/nguyên tắc/cách nghĩ → được tạo ra để sống trong xã hội → thay đổi theo thời đại","correct":{"jp":"ひとが**社会で生きていくために作られてきたもの**","vi":"Khớp với 「社会的に生きていくために今ある社会的規範やルール…受け入れなければならない」."},"wrong":[{"key":"A","jp":"ひとが**幸福になるために守ってきた**もの","trap":"bẫy chi tiết phụ","vi":"'Để trở nên hạnh phúc' không phải mục đích được nêu — bài nói 「本当にひとの幸福にとってふさわしいものかどうかはわからない」 — tức là KHÔNG CHẮC có phải để hạnh phúc."},{"key":"B","jp":"ひとが**本能を抑圧されずに生きるため**のもの","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói xã hội quy chuẩn là thứ PHẢI DÙNG để 'ép bản năng' (動物的な本能を抑圧されて身につける)."},{"key":"D","jp":"これから**生まれ育っていく子どもにとって必要なもの**","trap":"bẫy chi tiết phụ","vi":"'Cần thiết cho thế hệ sau' không phải định nghĩa — bài nói rõ 「その子どもにとって絶対的に必要かどうかもわからない」."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「おとなと子どもとの誤差は、基本的にはいつでも**歓迎していいことである**」「社会的規範は…**暫定的なもの**にすぎない。だから、**子どもは親(教師)の思うとおりにはならない**のだ」.","lienKetJP":"社会的規範は時代とともに変わる → 次の世代は同じにならない → それを歓迎すべき → 当然のこと","lienKetVI":"Quy chuẩn xã hội thay đổi theo thời đại → thế hệ sau khác đi → nên chào đón điều đó → là điều đương nhiên","correct":{"jp":"社会的規範は時代によって変化するものであり、**子どもはおとなの思うとおりにならなくて当然**である","vi":"Khớp với câu kết 「おとなと子どもとの誤差は…歓迎していいことである」「社会的規範は暫定的なもの」."},"wrong":[{"key":"B","jp":"社会的規範は暫定的なものにすぎず、**子どもが自身の考え方に合ったものを作っていくことが望ましい**","trap":"bẫy chi tiết phụ","vi":"'Trẻ tự tạo quy chuẩn mới' quá cực đoan — bài không nói điều này, chỉ nói sự THAY ĐỔI giữa các thế hệ là tự nhiên và nên chào đón."},{"key":"C","jp":"時代の変化に適応できるように、**おとなは子どもに社会的規範の背景となる考え方を教えたほうがいい**","trap":"bẫy mọi người","vi":"'Dạy tư duy đằng sau quy chuẩn' không phải điều tác giả đề xuất — bài nhấn mạnh CHẤP NHẬN sự khác biệt, không phải cách giảng dạy."},{"key":"D","jp":"時代によって考え方は変化するものなので、**次の世代が社会的規範を変えるべきだ**","trap":"bẫy chi tiết phụ","vi":"'Thế hệ sau nên thay đổi' là kết quả tự nhiên chứ không phải YÊU CẦU — bài không kêu gọi hành động cụ thể này."}]}],"Mon12-24":[{"huongTuDuy":"Người ta kỳ vọng gì ở khoa học não — đoạn đầu bài giải thích lý do thịnh hành.","chotY":"「脳科学によって自分がよりよい人生を歩めそうだと感じる」「まるで文学や芸術のように…**幸せな人生のノウハウを提供**してくれているように思えるのです」.","lienKetJP":"脳科学のブーム → 人々が期待するのは → 幸せな人生のノウハウを教えてくれること","lienKetVI":"Khoa học não thịnh hành → điều người ta kỳ vọng là → dạy cách sống hạnh phúc hơn","correct":{"jp":"どうすれば**自分が幸せに生きられるか**を教えてくれること","vi":"Khớp với 「よりよい人生を歩めそう」「幸せな人生のノウハウを提供」."},"wrong":[{"key":"A","jp":"**複雑な脳の仕組みをわかりやすく**説明してくれること","trap":"bẫy chi tiết phụ","vi":"'Giải thích dễ hiểu về não' không phải lý do chính mà người ta kỳ vọng — lý do là MỤC TIÊU THỰC DỤNG (sống hạnh phúc hơn)."},{"key":"C","jp":"人間の感情や思考や行動の**扱い方**を教えてくれること","trap":"bẫy chi tiết phụ","vi":"'Cách xử lý cảm xúc/hành vi' gần đúng nhưng thiếu yếu tố cốt lõi 'hạnh phúc' — bài nhấn mạnh người ta muốn 'sống tốt hơn', không chỉ 'xử lý cảm xúc'."},{"key":"D","jp":"人間にとって幸せな人生とは何かを**客観的に示してくれること**","trap":"bẫy chi tiết phụ","vi":"'Khách quan' không phải yêu cầu — người ta kỳ vọng khoa học não như HƯỚNG DẪN THỰC TẾ (ノウハウ), không phải định nghĩa triết học về hạnh phúc."}]},{"huongTuDuy":"Quan điểm của tác giả về khoa học não — đoạn 'たとえ到達できたとしても...'","chotY":"「たとえ（普遍的な法則に）到達できたとしても、科学の普遍法則は**人生の個別性や一回性に対しては全く無力**です」「人生の個別の事柄に適用して何かを予言したりすることは、おそらく**不可能**でしょう」.","lienKetJP":"普遍的な法則に到達できたとしても → 人生の個別性・一回性に対して → 全く無力 → 応用不可能","lienKetVI":"Dù đạt được quy luật phổ quát → với tính cá biệt/đơn nhất của cuộc sống cụ thể → hoàn toàn vô lực → không thể áp dụng","correct":{"jp":"普遍的な法則にたどり着いたとしても、**人生の個々の事柄には応用できない**","vi":"Khớp với 「たとえ到達できたとしても…人生の個別性に対しては全く無力」."},"wrong":[{"key":"A","jp":"個人の人生に適用するには、**普遍的な法則を見つけなければならない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói ngay cả KHI TÌM ĐƯỢC quy luật phổ quát cũng không áp dụng được cho cá nhân."},{"key":"B","jp":"人の脳の機能をすべて解明できたとしても、**普遍的な法則にたどり着けない**","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — bài nói 'đường đến quy luật phổ quát còn rất xa', nhưng câu hỏi này hỏi về 'giả sử ĐÃ ĐẾN được'."},{"key":"D","jp":"普遍的な法則に到達するには、**人生の個々の事柄を解き明かさなければならない**","trap":"bẫy ngược nghĩa","vi":"Ngược nhân quả — bài không nói cần giải mã từng trường hợp để đạt quy luật phổ quát."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài về giới hạn của khoa học.","chotY":"「科学は事実を扱うことはできますが、**価値観の問題を扱うことはできない**」「人類がどのような未来を選ぶかという問題も…**価値観の問題**です。科学は…未来を選ぶ価値観の問題を扱うことはできません」.","lienKetJP":"科学＝事実を扱う → 価値観は扱えない → 未来の選択も価値観の問題 → 科学の領域外","lienKetVI":"Khoa học = xử lý sự thật → không xử lý được giá trị quan → việc chọn tương lai cũng là vấn đề giá trị → ngoài phạm vi khoa học","correct":{"jp":"科学は**事実を対象とするものであり**、**個人や社会の価値観を扱うものではない**","vi":"Khớp trực tiếp với câu kết 「科学は事実を扱えるが、価値観の問題を扱うことはできない」."},"wrong":[{"key":"A","jp":"科学が証明した事実は、**個人や社会の価値観に影響を与える恐れがある**","trap":"bẫy chi tiết phụ","vi":"'Ảnh hưởng đến giá trị quan' không phải điểm nhấn — bài cảnh báo không nên 'nhầm lẫn' sự thật với giá trị quan, không nói về 'ảnh hưởng'."},{"key":"B","jp":"科学だけでなく**個人や社会の価値観を考慮したうえで**、未来を選ぶ必要がある","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng không phải điểm nhấn chính — bài nhấn mạnh GIỚI HẠN của khoa học (không xử lý được giá trị quan), không phải đưa ra công thức 'kết hợp cả hai'."},{"key":"C","jp":"科学は個人や社会の価値観を扱えず、**人類が望む未来の実現には役に立たない**","trap":"bẫy ngược nghĩa","vi":"Quá cực đoan — bài nói khoa học 「選んだ未来を実現するための道具にはあり得ます」 tức là VẪN HỮU ÍCH cho việc thực hiện tương lai, chỉ không thể CHỌN tương lai thay người."}]}],"Mon10-25":[{"huongTuDuy":"Hỏi cách cha mẹ nên đối xử với 'yêu cầu' của trẻ — đoạn 3 phân biệt rõ 要求 và 意見.","chotY":"「その子どもの『要求』と『意見』は違います」「あまりよく考えないでなんとなく『やってみたい』…と言うことはよくあります」「子どもの要求をなんでもかんでも聞いてあげるのは、意見の尊重ではなく**単なる甘やかし**です」.","lienKetJP":"要求 ≠ 意見 → よく考えずに言うことも多い → 全部聞くのは甘やかし","lienKetVI":"Yêu cầu ≠ ý kiến → trẻ thường nói mà chưa nghĩ kỹ → đáp ứng hết là nuông chiều","correct":{"jp":"明確な理由もなく言っているものもあり、すべてには応えなくてもいい。","vi":"Khớp: nhiều yêu cầu của trẻ không có lý do rõ ràng, nên không cần đáp ứng tất cả."},"wrong":[{"key":"A","jp":"子どもの気持ちを反映したものなので、できるだけ尊重したほうがいい。","trap":"bẫy ngược nghĩa","vi":"Bài nói 'đáp ứng mọi yêu cầu' không phải tôn trọng ý kiến mà là nuông chiều — không nên tôn trọng 'càng nhiều càng tốt'."},{"key":"C","jp":"脳の発達段階によって変わるものであり、対応の仕方を変えてもいい。","trap":"bẫy chi tiết phụ","vi":"Việc não đang phát triển chỉ giải thích VÌ SAO trẻ nói bừa, bài không nói nên đổi cách đối phó theo giai đoạn."},{"key":"D","jp":"好奇心の表れではあるが、対応は慎重にしたほうがいい。","trap":"bẫy chi tiết phụ","vi":"Tính hiếu kỳ chỉ xuất hiện ở đoạn 2 như tấm lòng cha mẹ; kết luận của bài không phải 'đối ứng thận trọng'."}]},{"huongTuDuy":"Hỏi hậu quả của trẻ khi 'phá sản' (破綻) — đoạn kế tiếp mô tả lời trẻ nói.","chotY":"「あるところで破綻します」→「『もう私（僕）のことが可愛くないの？』『私（僕）のことが嫌いになったの？』と**親を責めます**」.","lienKetJP":"親にも限度がある → 要求が叶わない → 愛情がなくなったと考え親を責める","lienKetVI":"Cha mẹ có giới hạn → yêu cầu không được đáp ứng → trẻ nghĩ cha mẹ hết yêu và trách móc","correct":{"jp":"自分に対する愛情がなくなったと考え、親を責めるようになる。","vi":"Khớp với 「もう私のことが可愛くないの？」「嫌いになったの？」と親を責める."},"wrong":[{"key":"A","jp":"どうして自分の要求を叶えてくれないのかと親を問い詰めるようになる。","trap":"bẫy chi tiết phụ","vi":"Bài không nói trẻ truy hỏi 'vì sao không đáp ứng', mà trách cha mẹ không còn yêu mình."},{"key":"C","jp":"自分の要求のすべてを叶えてもらえないとわかり、親に期待しなくなる。","trap":"bẫy ngược nghĩa","vi":"Trẻ đã quen 'cha mẹ nghe hết mọi điều ta nói', nên không phải là hết kỳ vọng vào cha mẹ."},{"key":"D","jp":"自分の要求は聞いてもらえないと諦め、親と「対話」しなくなる。","trap":"bẫy chi tiết phụ","vi":"Việc không có 対話 là NGUYÊN NHÂN dẫn đến đổ vỡ, không phải phản ứng của trẻ."}]},{"huongTuDuy":"Hỏi cách ứng xử theo tác giả — đoạn cuối nêu 'đối thoại → đàm phán → điểm thỏa hiệp'.","chotY":"「子どもとの『対話』を通じてお互いにとっての『**妥協点**』を探るための愛情のこもった『交渉』の場にする」.","lienKetJP":"やみくもにダメ/全部呑む ではなく → 対話 → 交渉 → お互いの妥協点","lienKetVI":"Không cấm bừa cũng không chiều hết → đối thoại → thương lượng → điểm thỏa hiệp hai bên","correct":{"jp":"「対話」を通して、互いに合意可能なものになるように話を進める。","vi":"Khớp với 「お互いにとっての妥協点を探る」= tìm điểm cả hai bên có thể chấp nhận (合意可能)."},"wrong":[{"key":"A","jp":"「対話」をしながら子どもの意見を確認し、要求に応じられるようにする。","trap":"bẫy ngược nghĩa","vi":"Mục đích không phải 'để đáp ứng yêu cầu' — chính việc đáp ứng hết bị gọi là nuông chiều."},{"key":"B","jp":"「対話」を根気よく繰り返し、子どもが自ら要求を改めるように促す。","trap":"bẫy chi tiết phụ","vi":"'Con tự sửa ý kiến' chỉ là trạng thái lý tưởng; đích của bài là điểm hai bên cùng chấp nhận, không chỉ một phía thay đổi."},{"key":"D","jp":"「対話」をする中で、互いに譲歩ができるようにする。","trap":"bẫy chi tiết phụ","vi":"'Nhượng bộ' chỉ là phương tiện; bài nhấn vào tìm ra 妥協点 mà cả hai cùng đồng ý."}]}],"Mon10-26":[{"huongTuDuy":"Hỏi tác giả nghĩ gì về cảm giác của những người cho rằng 'cần kiến thức đặc biệt' — đoạn 2 mở bằng 「そう考える人の気持ちがわからないではない」.","chotY":"「なぜなら、この国では**子どもの頃からアートに親しむ環境が整っていない**からだ」「子どもの頃から美術館に何度も足を運び…芸術作品との距離はもっと近づく」.","lienKetJP":"そう考える人の気持ちがわかる → 子どもの頃から親しむ環境がない → 敷居が高い","lienKetVI":"Hiểu cảm giác của họ → không có môi trường làm quen từ nhỏ → bảo tàng thành nơi khó tiếp cận","correct":{"jp":"子どもの頃から芸術作品に触れる体験が十分ではないから理解できる。","vi":"Khớp với 「子どもの頃からアートに親しむ環境が整っていない」."},"wrong":[{"key":"A","jp":"美術館は楽しむより学ぶ場所だと思われているから理解できる。","trap":"bẫy chi tiết phụ","vi":"'Nơi để học' không phải lý do tác giả đưa ra; lý do là thiếu cơ hội làm quen từ nhỏ."},{"key":"B","jp":"美術館には知識がないと理解できない作品が多いから理解できる。","trap":"bẫy ngược nghĩa","vi":"Tác giả cho rằng quan niệm 'cần kiến thức' là hiểu lầm lớn, không phải có nhiều tác phẩm khó hiểu."},{"key":"C","jp":"芸術作品の楽しみ方は大人になってからしか学べないから理解できる。","trap":"bẫy ngược nghĩa","vi":"Bài nói nếu quen từ nhỏ thì khoảng cách gần hơn, chứ không nói 'chỉ học được khi đã lớn'."}]},{"huongTuDuy":"Hỏi mục đích của trò 「宝探し」 — câu 'とにかく…' sau phần hướng dẫn nêu ra.","chotY":"「とにかく、作品は『見る』**きっかけを作る**ことが目的である」「美術館のすばらしいところは**『本物』をその目で見られる**ことだ」.","lienKetJP":"ポストカードの絵を探す → 一生懸命見る → 本物を『見る』きっかけ","lienKetVI":"Tìm bức tranh trên bưu thiếp → chăm chú nhìn → cơ hội nhìn tác phẩm thật","correct":{"jp":"本物を実際に見る機会を作るため","vi":"Khớp với 「『見る』きっかけを作ることが目的」: tạo cơ hội xem tác phẩm thật."},"wrong":[{"key":"A","jp":"本物の価値を理解させるため","trap":"bẫy ngược nghĩa","vi":"Tác giả không đòi hiểu giá trị; chỉ cần 'nhìn'."},{"key":"C","jp":"本物を見た感動を忘れないようにするため。","trap":"bẫy ngược nghĩa","vi":"「感動しなくてもかまわない」— cảm động không phải mục đích."},{"key":"D","jp":"本物を通して知識を確かなものにするため。","trap":"bẫy ngược nghĩa","vi":"Việc 'khớp kiến thức với tác phẩm' là cách nhìn của người lớn mà tác giả phê phán."}]},{"huongTuDuy":"Hỏi bảo tàng giúp ích giáo dục trẻ thế nào — đoạn cuối nêu định nghĩa giáo dục của tác giả.","chotY":"「それだけでも立派な『**発見**』だ」「教育とは、自分の感性で感じ、自分の頭で考えられるよう、**感性と知性を鍛える**ことだ」「美術館は…感性を鍛えるすばらしい学校になりうる」.","lienKetJP":"色が違うという発見 → 感性と知性を鍛える → 美術館は学校になりうる","lienKetVI":"Nhận ra màu khác → rèn cảm nhận và trí tuệ → bảo tàng có thể là ngôi trường tốt","correct":{"jp":"子どもたちはさまざまな発見を通して感性を磨けるようになる。","vi":"Khớp: qua nhiều khám phá nhỏ, trẻ mài giũa được cảm nhận (感性)."},"wrong":[{"key":"B","jp":"子どもたちは多くの作品の中から価値のあるものが見極められるようになる。","trap":"bẫy chi tiết phụ","vi":"Bài không nói trẻ sẽ biết nhận ra tác phẩm 'có giá trị'."},{"key":"C","jp":"子どもたちは考えることより感じることのほうが大切だとわかるようになる。","trap":"bẫy ngược nghĩa","vi":"Tác giả nói cần cả cảm nhận LẪN suy nghĩ (感性と知性), không đặt cảm nhận cao hơn suy nghĩ."},{"key":"D","jp":"子どもたちは感性を鍛えることができより良い答えが見つけ出せるようになる。","trap":"bẫy ngược nghĩa","vi":"「答えは決して一つではない」— không có chuyện tìm 'đáp án tốt hơn'."}]}],"Mon10-27":[{"huongTuDuy":"Hỏi quan điểm về việc trí nhớ không hoàn hảo — đoạn 3 kết luận.","chotY":"「記憶が徐々に消えていく、あるいは書き換わる仕組みが存在するのは、**より良く生きていくためには自然で、当たり前**」.","lienKetJP":"完璧な記憶はつらい → 忘れる・書き換える仕組みがある → より良く生きるために必要","lienKetVI":"Nhớ hoàn hảo rất khổ → có cơ chế quên/viết lại → cần thiết để sống tốt hơn","correct":{"jp":"よりよく生きていくために必要だ。","vi":"Khớp với 「より良く生きていくためには自然で、当たり前」."},"wrong":[{"key":"A","jp":"人間は完璧ではないので、当たり前だ。","trap":"bẫy chi tiết phụ","vi":"'Con người không hoàn hảo' không phải lý do; lý do là để sống tốt hơn."},{"key":"B","jp":"良い思い出を増やせるので重要だ。","trap":"bẫy mọi người","vi":"Việc 'tăng kỷ niệm đẹp' không có trong bài."},{"key":"C","jp":"周囲に合わせて生きていくために不可欠だ。","trap":"bẫy chi tiết phụ","vi":"Viết lại ký ức cho hợp xung quanh chỉ là ví dụ; 'không thể thiếu' là nói quá."}]},{"huongTuDuy":"Hỏi mục đích của việc 'đổi mức độ nặng nhẹ, hạ ưu tiên' — đoạn 4 có câu giải thích.","chotY":"「高頻度かつ**致命的な影響を与え得る危険**の方を**優先的に回避する**べきで、なかなか起こらないことに記憶のリソースを割いていると、かえって重要なことに対応できず」.","lienKetJP":"なかなか起こらない危険の優先度を下げる → 高頻度で致命的な危険を優先 → 備える","lienKetVI":"Hạ ưu tiên nguy cơ hiếm gặp → ưu tiên nguy cơ hay xảy ra và nghiêm trọng → chuẩn bị cho chúng","correct":{"jp":"起こる可能性の高い重大な危険に備えるため","vi":"Khớp: để dành nguồn lực ghi nhớ cho nguy cơ nghiêm trọng và dễ xảy ra."},"wrong":[{"key":"A","jp":"過去の体験の記憶を書き換えるため","trap":"bẫy chi tiết phụ","vi":"Viết lại ký ức là cơ chế khác; ở đây là điều chỉnh mức ưu tiên."},{"key":"B","jp":"危険な出来事に対する恐れをなくすため","trap":"bẫy mọi người","vi":"Không có ý 'xóa nỗi sợ nguy hiểm'."},{"key":"D","jp":"人生に影響を与える新しい挑戦をしやすくするため","trap":"bẫy chi tiết phụ","vi":"'Dám thử thách mới' chỉ là hệ quả phụ nói ở cuối đoạn, không phải mục đích."}]},{"huongTuDuy":"Hỏi ý kiến về giáo dục/thi cử hiện nay — đoạn 5–6 có 「いかがなものか」.","chotY":"「その結果をそのまま優秀であるかどうかのランク付けとして使うのは**いかがなものか**」「テクノロジーの発達によって、不完全な人間の記憶力は…補完されるようになってきて」.","lienKetJP":"技術が記憶力を補完 → 記憶力で優秀さを測る → 問題・時代にそぐわない","lienKetVI":"Công nghệ bù đắp trí nhớ → dùng trí nhớ để đánh giá ưu tú → có vấn đề, lỗi thời","correct":{"jp":"技術で記憶力が補える時代に記憶力で人の優秀さを判断するのは問題である。","vi":"Khớp: khi công nghệ đã bù được trí nhớ thì lấy trí nhớ đánh giá sự ưu tú là có vấn đề."},"wrong":[{"key":"A","jp":"いくら技術が発達しても、技術で人間の記憶力の優劣を測るには限界がある。","trap":"bẫy ngược nghĩa","vi":"Bài không nói công nghệ 'có giới hạn' mà nói công nghệ vượt trội con người."},{"key":"C","jp":"技術発達に応じて、時代にあった尺度で記憶力を測る必要がある。","trap":"bẫy ngược nghĩa","vi":"Tác giả phản đối dùng trí nhớ làm thước đo, không đề xuất 'đo trí nhớ theo thước mới'."},{"key":"D","jp":"技術の恩恵を受け入れるようになり、人間には記憶力以外の力が求められる。","trap":"bẫy chi tiết phụ","vi":"Bài không bàn về việc 'cần năng lực khác ngoài trí nhớ'."}]}],"Mon11-25":[{"huongTuDuy":"So sánh A và B về cách xử lý khi bế tắc: A hỏi nguyên nhân và tiếp tục; B cho phép chuyển hướng.","chotY":"A: 「まずすべきことは、**なぜそのような状態になっているのかを考える**ことだ」「まずは一つの分野で努力し続けることが重要だ」. B: 「一度頭を柔軟にして**別の分野へ方向転換してみる**のも一つの方法です」.","lienKetJP":"A：原因を考える・一つの分野で続ける ↔ B：別の分野へ方向転換してもよい","lienKetVI":"A: tìm nguyên nhân, tiếp tục một lĩnh vực ↔ B: có thể đổi sang lĩnh vực khác","correct":{"jp":"Aはうまくいかない原因を追究するべきだと述べ、Bは思い切ってほかの分野にチャレンジしてもいいと述べている。","vi":"Khớp: A truy tìm nguyên nhân thất bại; B nói có thể dứt khoát chuyển lĩnh vực."},"wrong":[{"key":"A","jp":"AもBも、原因を把握したうえで、異なるやり方で取り組んでみるべきだと述べている。","trap":"bẫy ngược nghĩa","vi":"A không khuyên 'làm theo cách khác' mà khuyên làm hết sức; cũng không có ý 'cả hai thử cách khác'."},{"key":"B","jp":"AもBも、一つの分野にこだわらず、新しいことに挑戦してもいいと述べている。","trap":"bẫy ngược nghĩa","vi":"A phản đối bỏ ngay lĩnh vực mà khuyên tiếp tục một lĩnh vực — không phải 'cả hai chấp nhận thử cái mới'."},{"key":"C","jp":"Aは自分に対処できることをすべてやってみたほうがいいと述べ、Bはこれまでに身につけたことを生かせる分野を探すべきだと述べている。","trap":"bẫy chi tiết phụ","vi":"Vế A đúng một phần, nhưng B không nói 'tìm lĩnh vực tận dụng cái đã học' mà nói thử chuyển hướng."}]},{"huongTuDuy":"Tìm điểm A và B cùng nói: cả hai đều nhắc tới điều tích lũy được nhờ nỗ lực.","chotY":"A: 「努力を通して身につけたことこそが自分の強みになる。その努力は、いつか別の道に進むことになっても**生きてくる**」. B: 「その分野のことをしっかりと身につけていれば…それがとても**大きな武器**となる」.","lienKetJP":"A：努力で得たものは別の道でも生きる ＝ B：蓄積は別の分野でも武器になる","lienKetVI":"A: cái học được từ nỗ lực còn có ích khi đổi đường ＝ B: tích lũy trở thành vũ khí ở lĩnh vực khác","correct":{"jp":"必死に努力して身につけたことは、状況が変わっても役に立つ。","vi":"Khớp: cả hai đều nói điều đã nỗ lực để có được sẽ còn có ích khi hoàn cảnh thay đổi."},"wrong":[{"key":"A","jp":"必死に努力している時は、広い視野で物事を見ることが難しい。","trap":"bẫy chi tiết phụ","vi":"Chỉ B nhắc 'chỉ nhìn thấy một thứ'; A không nói về tầm nhìn."},{"key":"C","jp":"必死に努力し続ければ、困難があっても乗り越えられる。","trap":"bẫy mọi người","vi":"Không bên nào nói cứ nỗ lực là vượt qua được khó khăn (A còn nêu khả năng không thành công)."},{"key":"D","jp":"必死に努力し続けなければ、よい結果につながらない。","trap":"bẫy chi tiết phụ","vi":"Chỉ A nhấn mạnh phải tiếp tục; B cho phép đổi hướng."}]}],"Mon11-26":[{"huongTuDuy":"So sánh cách xử lý lo lắng: A dùng LỜI NÓI tích cực; B dùng cử động cơ thể ngược với trạng thái hiện tại.","chotY":"A: 「自分自身に**肯定的な言葉**を発することが効果的だ」. B: 「**今の身体の状態に対して、すべて反対の方向に身体を動かせばよい**」.","lienKetJP":"A：前向きな言葉 ↔ B：今と反対に身体を動かす","lienKetVI":"A: nói lời tích cực ↔ B: cử động cơ thể ngược trạng thái hiện tại","correct":{"jp":"Aは自分に前向きな言葉をかければよいと述べ、Bは今の身体の状態が反対になるようにすればよいと述べている。","vi":"Khớp: A nói lời tích cực với bản thân; B nói làm ngược trạng thái cơ thể hiện tại."},"wrong":[{"key":"A","jp":"AもBも、深呼吸しながらうまくいっている状態をイメージすればよいと述べている。","trap":"bẫy chi tiết phụ","vi":"Hít sâu chỉ có ở B; A không nói hít sâu hay hình dung khi hít thở."},{"key":"B","jp":"AもBも、今の身体の状態を落ち着かせる動きをすればよいと述べている。","trap":"bẫy chi tiết phụ","vi":"A chỉ nói về lời nói/tư duy, không nói 'làm dịu cơ thể'."},{"key":"C","jp":"Aは自分がどうなりたいかを具体的に言葉にすればよいと述べ、Bは身体の力を抜いて呼吸を整えればよいと述べている。","trap":"bẫy chi tiết phụ","vi":"Vế A tương đối đúng, nhưng B không nói 'thả lỏng cơ thể, điều hòa hơi thở' mà nói làm NGƯỢC trạng thái hiện tại."}]},{"huongTuDuy":"Điểm chung: cả A và B đều coi tâm trạng là thứ điều chỉnh được.","chotY":"A: 「つまり、**心の状態はコントロールが可能**なのだ」. B: 「身体の動きを操作することで**心の動きまでもコントロールすることができる**」.","lienKetJP":"A：言葉で心をコントロール ＝ B：身体で心をコントロール","lienKetVI":"A: điều khiển tâm bằng lời ＝ B: điều khiển tâm bằng cơ thể","correct":{"jp":"心の状態は自分の力でよい方向に変えられる。","vi":"Khớp: cả hai đều nói trạng thái tâm lý có thể tự điều chỉnh theo hướng tốt."},"wrong":[{"key":"A","jp":"心の状態を変えるには思考を変える必要がある。","trap":"bẫy chi tiết phụ","vi":"Chỉ A nhấn mạnh 'đổi tư duy'; B dùng cơ thể."},{"key":"B","jp":"心の状態を自覚することは難しい。","trap":"bẫy mọi người","vi":"Không bên nào nói 'khó nhận ra tâm trạng của mình'."},{"key":"C","jp":"心の状態は身体の状態から影響を受けやすい。","trap":"bẫy chi tiết phụ","vi":"Chỉ B nói tâm chịu ảnh hưởng của cơ thể; A thì dùng lời nói."}]}],"Mon11-27":[{"huongTuDuy":"So sánh quan điểm về 'bỏ bớt việc': A bỏ việc không quan trọng; B phân loại việc được/không được bỏ.","chotY":"A: 「自分が何を大切にしたいかを考え、**そうではないことは積極的に手を抜いていく**」. B: 「大切なことは、**手を抜いていいものといけないものを仕分けする**ことだ」.","lienKetJP":"A：大切でないことは手を抜く ↔ B：手を抜くもの/抜かないものを仕分け","lienKetVI":"A: bỏ bớt việc không quan trọng ↔ B: phân loại việc nên/không nên bỏ","correct":{"jp":"Aは大切でないことは手を抜いたほうがいいと述べ、Bは手を抜くものと抜かないものを明確にしておけばいいと述べている。","vi":"Khớp: A nói bỏ bớt việc không quan trọng; B nói cần phân định rõ việc nào bỏ được, việc nào không."},"wrong":[{"key":"A","jp":"Aは手を抜くことは悪いことではないと述べ、Bは手が抜けるものを増やしたほうがいいと述べている。","trap":"bẫy chi tiết phụ","vi":"A đúng một phần, nhưng B không nói 'tăng số việc có thể bỏ' mà nói phân loại."},{"key":"B","jp":"Aは手を抜けるものを探し出したほうがいいと述べ、Bは完璧にできなくても、手は抜かないほうがいいと述べている。","trap":"bẫy ngược nghĩa","vi":"A khuyên chủ động bớt việc; B không nói 'không nên bỏ' — B nói cần phân loại."},{"key":"D","jp":"Aはできるだけ手を抜くべきではないと述べ、Bはいったん手を抜いてみて、うまくいかなければ元のやり方に戻せばいいと述べている。","trap":"bẫy ngược nghĩa","vi":"A không nói 'đừng bớt việc'; B có nói thử rồi quay lại nhưng A thì khuyến khích bớt việc."}]},{"huongTuDuy":"Điểm chung: cả hai đều nói điều quan trọng thuộc về quyết định của chính mình.","chotY":"A: 「『毎日しなければならないか』…といったことは、**本来自分で決めるもの**だ」. B: 「何を大切にし、何をそぎ落としていくかは**人それぞれに違います**」.","lienKetJP":"A：自分で決めるもの ＝ B：人それぞれ・自分にとって大切か","lienKetVI":"A: tự mình quyết định ＝ B: mỗi người một khác, quan trọng với bản thân","correct":{"jp":"生活において何を重視するかは自分次第だ。","vi":"Khớp: cả hai đều nói coi trọng điều gì là do mình quyết định."},"wrong":[{"key":"A","jp":"家事に多くの時間や労力を費やすのは無駄だ。","trap":"bẫy ngược nghĩa","vi":"B nói thứ người khác thấy vô ích mà mình thấy quan trọng thì không cần bỏ — không kết luận 'tốn công là vô ích'."},{"key":"C","jp":"自分の基準にこだわりすぎるのはよくない。","trap":"bẫy chi tiết phụ","vi":"Chỉ A nói 'bị chuẩn của thế giới trói buộc'; B không nói 'bám tiêu chuẩn của mình là xấu'."},{"key":"D","jp":"自分のしたいことだけをするほうが有意義だ。","trap":"bẫy mọi người","vi":"Không bên nào khuyên 'chỉ làm điều mình muốn'."}]}],"Mon12-25":[{"huongTuDuy":"Hỏi vì sao 'phải nghi ngờ bản thân' — câu có 「なぜなら」 ngay sau đó.","chotY":"「なぜなら、どんな仕事でも本来、こちらの自我をあちらの他者に押し付ける所行ではなく、**多くの人々と共鳴するところを冷静に感じ極める作業**だからです」.","lienKetJP":"自分を疑う → 自画自賛していないか → 仕事は他者と共鳴する点を見極める作業","lienKetVI":"Nghi ngờ bản thân → có đang tự khen không → công việc là tìm điểm đồng cảm với nhiều người","correct":{"jp":"仕事では、自己中心的にならずに他者と共感できる点を見極める必要があるから。","vi":"Khớp với 「多くの人々と共鳴するところを冷静に感じ極める作業」."},"wrong":[{"key":"B","jp":"仕事では、自信過剰にならずに自分の能力を正しく評価することが重要だから。","trap":"bẫy chi tiết phụ","vi":"Bài không nói tới 'đánh giá đúng năng lực của mình'."},{"key":"C","jp":"仕事では、冷静に主張し自分の案に共感してもらわなければならないから。","trap":"bẫy ngược nghĩa","vi":"Bài nói công việc không phải 'áp đặt' cái tôi — không phải làm cho người khác đồng cảm bằng cách chủ trương."},{"key":"D","jp":"仕事では、どんな場合でも他者に自分の案を押し付けてはいけないから。","trap":"bẫy ngược nghĩa","vi":"Quá tuyệt đối: ở ví dụ tác phẩm giới hạn 10 bản, tác giả nói có thể bộc lộ hết cái tôi."}]},{"huongTuDuy":"Hỏi quan điểm về cái tôi trong thiết kế — các ví dụ ở đoạn 3, 4 cho thấy mức khác nhau theo đối tượng.","chotY":"「**対象によってその程度は異なる**」。作品限定十個や作家性を期待された仕事 → 自我を出してよい。道路標識 → 「自我は、どこからも求められてはいない」.","lienKetJP":"作品・作家性の仕事 → 自我OK ↔ 道路標識 → 普遍性 → 対象によって程度が違う","lienKetVI":"Tác phẩm cá nhân → được thể hiện cái tôi ↔ biển báo → tính phổ quát → mức độ tùy đối tượng","correct":{"jp":"何をデザインするかによって自我が求められる程度は異なる。","vi":"Khớp với 「対象によってその程度は異なる」."},"wrong":[{"key":"A","jp":"普遍性が求められる場合より自我が求められる場合のほうが一般的だ。","trap":"bẫy ngược nghĩa","vi":"Bài không nói trường hợp cần cái tôi là phổ biến hơn."},{"key":"B","jp":"作家性が求められる場合でも、自我より普遍性が優先される。","trap":"bẫy ngược nghĩa","vi":"Với công việc được kỳ vọng tính tác giả, tác giả nói cứ làm hết mình — không phải luôn ưu tiên tính phổ quát."},{"key":"D","jp":"デザインの対象にかかわらず、自我を出しすぎてはいけない。","trap":"bẫy ngược nghĩa","vi":"Quá tuyệt đối: có trường hợp (tác phẩm cá nhân) không cần kìm cái tôi."}]},{"huongTuDuy":"Hỏi thái độ làm việc theo tác giả — đoạn cuối tổng kết.","chotY":"「**与えられた仕事がどんな環境にあるかを客観的に把握しなければなりません**」「常に相手や周囲の環境を優先し、それらを**客観的に理解する習慣**がつくと…なすべきことが浮かび上がってくる」.","lienKetJP":"対象によって内容が違う → 環境を客観的に把握 → 習慣がつくとなすべきことが浮かぶ","lienKetVI":"Nội dung khác nhau theo đối tượng → nắm bắt khách quan môi trường → thành thói quen thì việc cần làm tự hiện ra","correct":{"jp":"相手や環境を客観的に理解することが必要だ。","vi":"Khớp với 「環境を客観的に把握」「客観的に理解する習慣」."},"wrong":[{"key":"A","jp":"自分自身がなすべきことを見つけ出すことが必要だ。","trap":"bẫy chi tiết phụ","vi":"Việc cần làm 'tự hiện ra từ đối tượng', không phải tự mình đi tìm."},{"key":"B","jp":"自分自身より相手や周囲の意見を優先するべきだ。","trap":"bẫy chi tiết phụ","vi":"Bài nói ưu tiên môi trường xung quanh, không phải 'ý kiến' của người khác."},{"key":"C","jp":"無意識に自分を縛ってきたものを取り除くべきだ。","trap":"bẫy chi tiết phụ","vi":"Giải thoát khỏi 自我の呪縛 là KẾT QUẢ, không phải điều 'phải làm'."}]}],"Mon12-26":[{"huongTuDuy":"Hỏi sức hấp dẫn của shogi giữa người với người — đoạn đầu nêu quá trình trước trận.","chotY":"「必ずそこに至るまでのプロセスがあります」「そんなちっぽけな一人の人間が**焦りや苦 function awardExp(amount){
  const profile=loadLocalProfile();
  if(!profile)return false;
  let exp=(profile.exp||0)+amount, level=profile.level||1, expToNext=profile.expToNext||100;
  let leveledUp=false;
  while(exp>=expToNext){exp-=expToNext;level+=1;expToNext=Math.round(expToNext*(level>=10?1.4:1.25));leveledUp=true;}
  profile.exp=exp;profile.level=level;profile.expToNext=expToNext;
  saveLocalProfile(profile);
  return leveledUp;
}
