ong sinh học bảo tồn (chú thích 3), kiến thức và phương pháp liên quan đến bảo tồn các loài quý hiếm và quần thể đang suy giảm là một vấn đề quan trọng. (lược bỏ) Tuy nhiên, việc bảo vệ từng loài riêng lẻ là vô cùng khó khăn. Ngay cả khi xem xét một hệ sinh thái, nhiều loài như vi sinh vật, thực vật, côn trùng và động vật có vú cũng đang sinh tồn, nhưng việc nắm bắt và bảo vệ toàn bộ hệ sinh thái của chúng là gần như không thể. Hơn nữa, các loài chưa được phân loại và sự đa dạng di truyền ở cấp độ dưới loài có nguy cơ không được bảo vệ nếu sử dụng phương pháp bảo vệ từng loài riêng lẻ. Do đó, điều quan trọng là phải bảo tồn tự nhiên như nó vốn có, bao gồm cả mối quan hệ tương hỗ giữa các sinh vật đa dạng. Nói cách khác, chúng ta tin rằng bằng cách bảo tồn hệ sinh thái, chúng ta sẽ bảo vệ tất cả các sinh vật có trong đó.\"\n\nChú thích:\n\n(注1) 保全 : ở đây có nghĩa là bảo vệ\n\n(注2) 生息する : sinh sống\n\n(注3) 保全生物学 : một lĩnh vực nghiên cứu trong sinh thái học"},{"source":"Mon11","bai":6,"date":"12/2012","title":"Mon11 - Bài 6 (12/2012)","passage":"A\n\n私たち日本人がこれまで培ってきた日本語を次の世代に伝えていくうえで、国語辞典のデジタル化は避けて通れない課題です。辞書のデジタル化は「電子辞書」という形ですでに実用化され、多くの人が利用してきました。わからないことばを瞬時に検索できる電子辞書は「データ検索」というコンピューターの強みを生かしたもので、ことばに関する膨大な情報をポケットに入れて持ち歩けるようになりました。でも、書籍の大辞林 (注１) を手にとって眺めていると、電子辞書では味わうことのできない楽しみがあることに気付かされます。ページをぱらぱらとめくりながら、気になったことばの解読を読むという楽しみ方です。 辞書は単にことばを調べるだけでなく、読物としても十分に楽しめます。\n\n(広瀬則仁 三省堂 2011年11月25日取得による)\n\nB\n\n最近の電子辞書研究によると、電子辞書を用いた学生は単語にたどり着く時間は早いが第一義の（注２）意味だけを読むことによる誤答率が高まるという。また僕が行った大学生のメディア行動調査でも印刷辞書と電子辞書は、意外なことにかなりの率で使い分けられている。パソコンとネットを使いこなす理工系学生でも、アンダーラインを引いたり、使いこなすにしたがってカスタマイズできる（注３）印刷辞書の魅力を語っていた。「印刷辞書はマイ・ディクショナリー（注４）になりますから」という発言が象徴的だった。生まれたときからデジタル機器に囲まれて育った今の学生でも、メディアの本質を見抜き使い分けているのである。\n\n(西村八潮 三省堂 2011年11月25日取得による)\n\n(注1. ) 大辞林 : 国語辞典の名前\n\n(注2. ) 第一義の : ここでは、一番目に書いてある\n\n(注3. ) カスタマイズする : ここでは、自分に都合のいい使い方ができるようにする\n\n(注4. ) ディクショナリー: 辞書","questions":[{"q":"電子辞書の長所について、AとBが共通して述べていることは何か。","options":["軽くて簡単に持ち運ぶことができる。","大量のデータを小さくまとめて収納できる。","インターネットを介して多くの人が利用できる。","知りたいことばを速く探し出すことができる。"],"answer":3,"explain":"Đáp án đúng: D. Có thể tìm kiếm từ ngữ muốn biết một cách nhanh chóng."},{"q":"印刷された辞書について、AとBはどのように述べているか。","options":["Aは紙の本ならではのよさがあると述べ、Bは電子辞書とは違う使い方で学生も使用していると述べている。","Aはデジタル化が避けられないと述べ、Bは学生は電子辞書よりも魅力を感じていると述べている。","Aは辞書としての使われ方はされなくなると述べ、Bは電子辞書と共存していくと述べている。","Aは本のように楽しんで読めると述べ、Bは電子辞書と使い分けるべきだと述べている。"],"answer":0,"explain":"Đáp án đúng: A. A nói rằng có những điểm tốt chỉ có ở sách giấy, B nói rằng sinh viên cũng sử dụng từ điển in theo cách khác với từ điển điện tử."}],"trans":"A \"Việc số hóa từ điển tiếng Nhật là một vấn đề không thể tránh khỏi trong việc truyền lại tiếng Nhật mà chúng ta, người Nhật, đã vun đắp cho thế hệ tiếp theo. Việc số hóa từ điển đã được đưa vào thực tiễn dưới hình thức \"từ điển điện tử\" và được nhiều người sử dụng. Từ điển điện tử có thể tìm kiếm từ ngữ không rõ nghĩa ngay lập tức, tận dụng thế mạnh của máy tính là \"tìm kiếm dữ liệu\", cho phép chúng ta mang theo một lượng lớn thông tin về từ ngữ trong túi. Tuy nhiên, khi cầm cuốn từ điển Đại Từ Lâm (chú thích 1) trên tay và xem qua, tôi nhận ra rằng có những thú vui mà từ điển điện tử không thể mang lại. Đó là thú vui đọc phần giải thích của những từ ngữ mà bạn quan tâm trong khi lật giở từng trang. Từ điển không chỉ đơn thuần là công cụ để tra cứu từ ngữ, mà còn có thể được thưởng thức đầy đủ như một cuốn sách đọc.\"\n\nB\n\n\"Theo một nghiên cứu gần đây về từ điển điện tử, sinh viên sử dụng từ điển điện tử có thời gian tìm đến từ vựng nhanh hơn, nhưng tỷ lệ trả lời sai do chỉ đọc nghĩa đầu tiên (chú thích 2) tăng lên. Ngoài ra, trong cuộc khảo sát hành vi truyền thông của sinh viên đại học mà tôi đã thực hiện, từ điển in và từ điển điện tử được sử dụng một cách khác nhau với tỷ lệ đáng ngạc nhiên. Ngay cả sinh viên khoa học kỹ thuật thành thạo máy tính và internet cũng nói về sức hấp dẫn của từ điển in, nơi họ có thể gạch chân và tùy chỉnh (chú thích 3) khi sử dụng thành thạo. Phát biểu \"từ điển in trở thành từ điển của riêng tôi (chú thích 4)\" là một biểu tượng. Ngay cả sinh viên ngày nay, những người lớn lên trong môi trường xung quanh là thiết bị kỹ thuật số từ khi sinh ra, cũng nhận ra bản chất của truyền thông và sử dụng chúng một cách khác nhau.\"\n\nChú thích:\n\n(注1) 大辞林 : tên của một cuốn từ điển tiếng Nhật\n\n(注2) 第一義の : ở đây có nghĩa là nghĩa được viết đầu tiên\n\n(注3) カスタマイズする : ở đây có nghĩa là có thể sử dụng theo cách thuận tiện cho bản thân\n\n(注4) ディクショナリー : từ điển cá nhân"},{"source":"Mon11","bai":7,"date":"07/2013","title":"Mon11 - Bài 7 (07/2013)","passage":"A\n\n現代の若者向けのファッションは、かつての一流デザイナー主導とは異なり、消費者自らの感性で選択するものに変わってきている。\n\nある衣料専門店では、客の目線に近い若い店員に好きな服をデザインさせて、これまでにない若者向けのファッションを形成してきた。店内にはいろいろなバリエーションを楽しみたいという客の要望に応えられるように、あらゆるタイプの商品が置かれている。また、一対一で接客することを基本としているため、売り場には多くの店員がいる。悩んでいる客には一時間以上対応することもある。この丁寧さのおかげで、客は喜んで買い物をして、何度も足を運ぶ客となっていく。このような努力を重ねた結果、売り上げを確実に伸ばし、現在ではトップクラスの専門店となっている。\n\nB\n\n店はがらがらなのに、長期間増収を続けている大手衣料品店がある。\n\nどの店舗も広々としていて、店内が客で混雑することはない。道路もショッピングカートが楽々とすれちがえるほど広く、カートを止めて商品を見ていても邪魔にならない、子供連れでも他の客に気を遣うこともなく買い物ができる。ある店舗が混雑するようになると、近く新店舗を作ってしまうというのだから、驚きだ。\n\n店には多種多様な商品があり、それらはすべてハンガーで壁一面につり下げられている。客は、一目で欲しいものが見つけ出せるので、無駄な時間を費やすことなく買い物を済ませられる。このような経営スタイルが評判で顧客満足度が高く、増収につながっているのだ。","questions":[{"q":"AとBで紹介されている店の共通点は何か。","options":["商品が見やすく並べられていること。","様々な商品がそろえられていること。","時間を気にせずに買い物できること。","客の要望を品ぞろえに反映していること。"],"answer":1,"explain":"Đáp án đúng: B. Có nhiều loại sản phẩm khác nhau."},{"q":"AとBで紹介されている店の経営方針は、どのような点で異なるか。","options":["Aの店は客への対応を重視し、Bの店は客の買い物の効率を重視している。","Aの店は固定客の確保を重視し、Bの店は新規の客の増加を重視している。","Aの店は商品の価格設定を重視 し、B の店は顧客満足度を重視 している。","Aの店は商品のデザイン性を重視し、Bの店は商品の実用性を重視している。"],"answer":0,"explain":"Đáp án đúng: A. Cửa hàng A coi trọng việc phục vụ khách hàng, cửa hàng B coi trọng hiệu quả mua sắm của khách hàng."}],"trans":"A \"Thời trang dành cho giới trẻ hiện nay đã thay đổi, không còn do các nhà thiết kế hàng đầu dẫn dắt như trước đây, mà trở thành thứ mà người tiêu dùng tự lựa chọn theo cảm quan của mình. Một cửa hàng quần áo chuyên dụng đã cho phép các nhân viên trẻ, những người có cái nhìn gần gũi với khách hàng, thiết kế những bộ quần áo yêu thích, tạo ra những kiểu thời trang dành cho giới trẻ chưa từng có trước đây. Trong cửa hàng, tất cả các loại sản phẩm đều được bày bán để đáp ứng nhu cầu của khách hàng muốn tận hưởng nhiều kiểu dáng khác nhau. Ngoài ra, vì họ lấy việc phục vụ khách hàng một kèm một làm nguyên tắc cơ bản, nên có rất nhiều nhân viên bán hàng tại khu vực bán hàng. Họ có thể hỗ trợ khách hàng đang gặp khó khăn trong việc lựa chọn trong hơn một giờ. Nhờ sự tận tâm này, khách hàng vui vẻ mua sắm và trở thành khách hàng thường xuyên. Sau khi nỗ lực như vậy, doanh số bán hàng đã tăng lên đáng kể và hiện nay họ đã trở thành một trong những cửa hàng chuyên dụng hàng đầu.\"\n\nB\n\n\"Có một cửa hàng quần áo lớn tiếp tục tăng doanh thu trong thời gian dài mặc dù cửa hàng vắng khách. Tất cả các cửa hàng đều rộng rãi và không bao giờ có tình trạng đông đúc khách hàng bên trong. Lối đi cũng đủ rộng để xe đẩy mua sắm có thể dễ dàng đi qua, và bạn sẽ không bị làm phiền ngay cả khi dừng xe đẩy để xem sản phẩm. Thậm chí có thể mua sắm mà không cần lo lắng về những khách hàng khác ngay cả khi bạn có con nhỏ. Thật đáng ngạc nhiên khi họ sẽ xây dựng một cửa hàng mới gần đó nếu một cửa hàng nào đó trở nên đông đúc. Cửa hàng có nhiều loại sản phẩm khác nhau, tất cả đều được treo trên tường bằng móc treo. Khách hàng có thể tìm thấy những gì họ muốn trong nháy mắt, vì vậy họ có thể hoàn thành việc mua sắm mà không lãng phí thời gian. Phong cách kinh doanh này được ưa chuộng, mức độ hài lòng của khách hàng cao, dẫn đến tăng doanh thu.\""},{"source":"Mon11","bai":8,"date":"12/2013","title":"Mon11 - Bài 8 (12/2013)","passage":"A\n\n近年食品問題への関心が高い。その多くは食品の安全性を不安視する声だ。すでに政府は中立の立場で公正に科学的評価を行う機関を設置し、企業も独自の検査や表示を行うなどの対策を始めた結果、以前より安全性は向上していると言える。\n\nしかし残念ながら、まだ消費者の安心感には結びついていない。今後必要なのは、安全なものは安全だと消費者が正しく理解できることではないだろうか。科学的に安全だと判断された食品が、消費者にも安全だと認知されれば消費者の安心につながる。そのためには、提供する側のわかりやすい説明とともに、消費者側もそれを理解するための科学的知識を備える必要があるだろう。\n\nB\n\n発生した食品事故に対して適切な対策がとられ、科学的に安全が証明された後も、いつまでもその食品の消費回復が見られないということはよくある。消費者が納得しないのである。\n\n（中略）\n\n安全に関しては、絶対安全ということはありえないにしても、コストさえ掛ければ技術的に安全度を上げることが可能である。しかも安全度は多くの場合、科学的に数値として明示できる。しかし安心の場合には、示された客観的な事実に納得するかどうかは、消費者一人一人の主観によっており、これを説得するのは簡単なことではない。安全を安心に繋げる難しさには、フードシステム（注）に対する消費者の信頼の程度が大きく関係する。消費者と生産者あるいは、政府の間に信頼関係が構築されていれば安全証明がほぼ同時に安心へと繋がる。\n\n(時子山ひろみ「安全で良質な食生活を手に入れる一フードシステム入門」による)\n\n(注) フードシステム : 食品が生産者から消費者に届くまでの流れ","questions":[{"q":"AとBの認識で共通しているのは何か。","options":["食品の安全対策に消費者の意見が反映されていない。","食品問題への対策は安全性を考えるだけでは十分ではない。","食品の安全性に関して科学的な証明が重視されていない。","食品は絶対に安全だと言えなければ消費者は納得しない。"],"answer":1,"explain":"Đáp án đúng: B. Các biện pháp đối với vấn đề thực phẩm không đủ nếu chỉ xem xét đến sự an toàn."},{"q":"AとBは、どうしたら消費者が安心を得られると述べているか。","options":["AもBも、消費者自身が食の安全により関心を持つことで得られると述べれいる。","AもBも、消費者が信頼できる説明を生産者側がすることで得られると述べている。","Aは消費者が安全性を理解することで得られると述べ、Bは消費者と生産者側が信頼関係を築くことで得られると述べている。","Aは消費者が科学的知識を身に付けることで得られると述べ、Bは生産者側がより精度の高い安全証明をすることで得られると述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng có thể đạt được bằng cách người tiêu dùng hiểu được sự an toàn, B nói rằng có thể đạt được bằng cách người tiêu dùng và phía nhà sản xuất xây dựng mối quan hệ tin tưởng."}],"trans":"A \"Trong những năm gần đây, sự quan tâm đến vấn đề thực phẩm ngày càng cao. Phần lớn trong số đó là những tiếng nói lo ngại về sự an toàn của thực phẩm. Chính phủ đã thành lập một cơ quan đánh giá khoa học công bằng trên lập trường trung lập, và các doanh nghiệp cũng đã bắt đầu thực hiện các biện pháp như kiểm tra và ghi nhãn riêng, do đó có thể nói rằng sự an toàn đã được cải thiện so với trước đây. Tuy nhiên, đáng tiếc là điều này vẫn chưa mang lại cảm giác an tâm cho người tiêu dùng. Điều cần thiết trong tương lai có lẽ không phải là việc người tiêu dùng hiểu đúng rằng những thứ an toàn là an toàn. Nếu thực phẩm được đánh giá là an toàn về mặt khoa học được người tiêu dùng nhận thức là an toàn, điều đó sẽ dẫn đến sự an tâm của người tiêu dùng. Để làm được điều đó, cùng với lời giải thích dễ hiểu từ phía cung cấp, người tiêu dùng cũng cần trang bị kiến thức khoa học để hiểu điều đó.\"\n\nB:\n\n\"Thường xảy ra trường hợp ngay cả sau khi các biện pháp thích hợp được thực hiện đối với các sự cố thực phẩm đã xảy ra và sự an toàn được chứng minh về mặt khoa học, việc phục hồi tiêu dùng thực phẩm đó vẫn không được thấy trong một thời gian dài. Đó là vì người tiêu dùng không hài lòng. (lược bỏ) Về mặt an toàn, mặc dù không thể có sự an toàn tuyệt đối, nhưng về mặt kỹ thuật, có thể tăng mức độ an toàn nếu chi phí được bỏ ra. Hơn nữa, mức độ an toàn thường có thể được hiển thị bằng số liệu một cách khoa học. Tuy nhiên, trong trường hợp an tâm, việc có hài lòng với sự thật khách quan được trình bày hay không phụ thuộc vào chủ quan của mỗi người tiêu dùng, và việc thuyết phục điều này không hề dễ dàng. Sự khó khăn trong việc kết nối an toàn với an tâm có liên quan mật thiết đến mức độ tin tưởng của người tiêu dùng đối với hệ thống thực phẩm (chú thích). Nếu mối quan hệ tin tưởng được xây dựng giữa người tiêu dùng và nhà sản xuất hoặc chính phủ, thì chứng minh an toàn sẽ kết nối với an tâm gần như đồng thời.\"\n\n(Trích từ “Có được cuộc sống ăn uống an toàn và chất lượng – Nhập môn hệ thống thực phẩm” – Tokiyama Hiromi)\n\nChú thích: (注) フードシステム : quá trình lưu chuyển của thực phẩm từ nhà sản xuất đến tay người tiêu dùng"},{"source":"Mon11","bai":9,"date":"07/2014","title":"Mon11 - Bài 9 (07/2014)","passage":"A\n\n子どもたちが社会全般のあらゆる分野に関心を向けようとするとき、マンガはその垣根を低くしてくれる。これは、マンガというメディアの強みだと思う。気軽に手にしたマンガをきっかけに、知的好奇心が刺激されたりすることもあるだろう。正味１５分たらずの休み時間、マンガの世界に入り込んでいた子どもたちの横顔を思い出す。マンガならではの魅力があることも確かだ。魅力は堪能してほしいし、強みは学校図書館活性化に利用したい。\n\nまだ人生の入り口ともいえる小学生。彼らを多様なメディアの魅力に出会わせたいという思いと、学校図書館が彼らにとって魅力的な場所であってほしいという思いがある。だから小学校でも（制約は多くても）選書のアンテナ（注）はマンガにもはっておいてほしいと、職を離れたいまも思っているのである。\n\n(若葉千佳子『子供の本棚』2007年12月による)\n\nB\n\nマンガを他の本と区別して考える方向は間違っているといえる。マンガを図書館に置くことによって、子どもは勉強しなくなるという神話から決別すべきである。学校図書館としては、絵本や写真集、童話や物語などの本の読み方を教えるように、マンガやアニメについてもその見方や特性を教えなくてはならないし、そのことを通して適切な学習資料を適切な場面で活用するようになると思われる。\n\n（中略）\n\n学校図書館の担当者は、図書購入に際して、直接学習に役立つ図書だけを購入するのではなく、長い目で見て子どもたちの学習や人格形成に役立つ図書も購入するゆとりを持つことが大切である。\n\n(糸賀雅児『現代の図書館』 第1. 9 2. 号による)\n\n(注) 選書のアンテナをはる : ここでは、本を選ぶために常に関心を向ける","questions":[{"q":"漫画について、AとBはどのように述べているか。","options":["AもBも、子どもにとって魅力的なメディアだと述べている。","AもBも、子どもの学習の妨げになるという考えは間違いだと述べている。","Aは子どもの知識を深めるのに役立つと述べ、Bは学習資料などとして活用できる と述べている。","Aは子どもの関心を広げるきっかけになると述べ、Bは見方や特性を教えれば子どものためになると述べている。"],"answer":3,"explain":"Đáp án đúng: D. A nói rằng truyện tranh là một khởi đầu để mở rộng sự quan tâm của trẻ em, B nói rằng truyện tranh có ích cho trẻ em nếu dạy chúng cách xem và đặc điểm của truyện tranh."},{"q":"学校図書館に漫画を置くことについて、AとBはどのように述べているか。","options":["AもBも、他の本と同じように選択肢に含めたほうがよいと述べている。","AもBも、図書館が魅力的な場所になるのでよいと述べている。","Aは図書館の活性化につながるのでよいと述べ、Bは直接学習に役立つものならよいと述べている。","Aは図書の選択は慎重にならざるをえないと述べ、Bは長期的な視点で検討すべきだと述べている。"],"answer":0,"explain":"Đáp án đúng: A. Cả A và B đều nói rằng nên bao gồm truyện tranh trong các lựa chọn giống như các loại sách khác."}],"trans":"A \"Khi trẻ em cố gắng hướng sự quan tâm đến tất cả các lĩnh vực của xã hội nói chung, truyện tranh sẽ giúp hạ thấp rào cản đó. Tôi nghĩ đây là thế mạnh của phương tiện truyền thông truyện tranh. Cũng có thể trí tò mò tri thức sẽ được kích thích bởi truyện tranh mà bạn cầm trên tay một cách dễ dàng. Tôi nhớ lại hình ảnh những đứa trẻ đang đắm chìm trong thế giới truyện tranh trong giờ nghỉ giải lao chỉ vỏn vẹn 15 phút. Chắc chắn rằng truyện tranh có sức hấp dẫn riêng. Tôi muốn chúng tận hưởng sức hấp dẫn đó và tôi muốn sử dụng thế mạnh đó để kích hoạt thư viện trường học. Trẻ em tiểu học, những người có thể nói là mới chỉ ở ngưỡng cửa cuộc đời. Tôi có mong muốn cho chúng được tiếp xúc với sức hấp dẫn của nhiều phương tiện truyền thông khác nhau và tôi có mong muốn thư viện trường học là một nơi hấp dẫn đối với chúng. Vì vậy, ngay cả ở trường tiểu học (mặc dù có nhiều hạn chế), tôi vẫn nghĩ rằng nên hướng sự quan tâm đến việc lựa chọn sách (chú thích) ngay cả đối với truyện tranh, ngay cả bây giờ khi tôi đã rời khỏi công việc.\"\n\n(Trích từ “Tủ sách của trẻ em” – Wakaba Chikako, tháng 12/2007)\n\nB\n\n\"Có thể nói rằng hướng suy nghĩ phân biệt truyện tranh với các loại sách khác là sai lầm. Chúng ta nên từ bỏ huyền thoại rằng trẻ em sẽ ngừng học khi đặt truyện tranh trong thư viện. Thư viện trường học nên dạy cách đọc truyện tranh và phim hoạt hình, cũng như dạy cách đọc sách tranh, sách ảnh, truyện cổ tích và truyện kể, và thông qua đó, tôi nghĩ rằng chúng sẽ học cách sử dụng tài liệu học tập phù hợp trong những tình huống thích hợp. (lược bỏ) Người phụ trách thư viện trường học không chỉ nên mua những cuốn sách có ích trực tiếp cho việc học, mà còn nên có sự thoải mái để mua những cuốn sách có ích cho việc học tập và hình thành nhân cách của trẻ em trong thời gian dài.\"\n\n(Trích từ “Thư viện hiện đại” – Itoga Masashi, số 192)\n\nChú thích: (注) 選書のアンテナをはる : ở đây có nghĩa là luôn chú ý, quan tâm để lựa chọn sách"},{"source":"Mon11","bai":10,"date":"12/2014","title":"Mon11 - Bài 10 (12/2014)","passage":"A\n\n世界遺産への関心が高まるのは喜ばしい。各地で登録をめざす動きも活発化している。新聞をはじめとしたメディアがそれらを報じる機会も増えた。ただ、いつも気になるのは、そこに「地元では観光振興に結びつくのを期待している」というたぐいの文言が、必ずと言ってよいほど目につくことだ。\n\n私としては、観光・経済効果の拡大を否定はしないし、文化財保護との両立はできると考えている。しかし、近年の状況を眺めると、遺産の保護という基本理念が、あまりにも置き去りにされてしまってはいないだろうか。\n\n(中村俊介『世界遺産が消えてゆく』 による)\n\nB\n\n日本では映像や書籍など、さまざまなメディアで世界遺産を商品化し、パッケージ・ツアーが数多く組まれ、観光産業と深く結び付く。だが、それは本当に建築や自然を愛し、歴史への理解を深める人間を増やしているのだろうか。\n\n（中略）\n\n世界遺産であろうとなかろうと、建築の価値は個別に判断すればいい。人間も肩書きだけで、すべてを理解できないだろう。世界遺産に認定されたからといって、株のように、建築の価値が上昇するわけではない。むろん、観光資源として巨額の富をもたらすだろうが、モノとしては同じままである。私が気になるのは、世界遺産だけを特別視するあまり、逆にそれ以外のものはがんばって保存しなくてもいいという風潮を助長するのではないかということだ。\n\n(五十嵐太郎 『建築はいかに社会と回路をつなぐのか』 による)","questions":[{"q":"近年の世界遺産について、AとBが共通して認識している点は何か。","options":["世界遺産の報道のしかたが過剰になってきている。","世界遺産への登録をめざす動きが過熱している。","世界遺産への登録で登録以前より価値が上がる。","世界遺産は観光振興と密接に関係している。"],"answer":3,"explain":"Đáp án đúng: D. Di sản thế giới có mối quan hệ mật thiết với việc thúc đẩy du lịch."},{"q":"AとBは、世界遺産をめぐってどのような姿勢を持つべきだと述べているか。","options":["AもBも、世界遺産への登録による経済効果は期待すべきではないと述べている。","AもBも、認定にかかわらず文化財として価値のあるものは保護すべきだと述べている。","Aは保護という本来の目的に立ち戻るべきだと述べ、Bは認定に惑わされずもの自体の価値を見定めるべきだと述べている。","Aは世界遺産に値するか冷静に再検討すべきだと述べ、Bは世界遺産だけを特別視せず他にも目を向けるべきだと述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng nên quay trở lại mục đích ban đầu là bảo vệ, B nói rằng nên đánh giá giá trị của bản thân sự vật mà không bị lung lay bởi việc công nhận."}],"trans":"A \"Việc sự quan tâm đến di sản thế giới ngày càng tăng là điều đáng mừng. Phong trào hướng tới việc đăng ký tại các địa phương cũng đang trở nên sôi động. Cơ hội để các phương tiện truyền thông, bao gồm cả báo chí, đưa tin về chúng cũng tăng lên. Tuy nhiên, điều tôi luôn băn khoăn là việc các câu chữ kiểu như \"địa phương kỳ vọng điều này sẽ dẫn đến thúc đẩy du lịch\" luôn xuất hiện gần như chắc chắn. Về phần tôi, tôi không phủ nhận việc mở rộng hiệu quả du lịch và kinh tế, và tôi tin rằng có thể đạt được sự cân bằng giữa điều đó với việc bảo vệ di sản văn hóa. Tuy nhiên, khi nhìn vào tình hình những năm gần đây, liệu lý tưởng cơ bản về bảo vệ di sản có bị bỏ quên quá nhiều hay không?\"\n\n(Trích từ “Di sản thế giới đang dần biến mất” – Nakamura Shunsuke)\n\nB:\n\n\"Ở Nhật Bản, di sản thế giới được thương mại hóa trên nhiều phương tiện truyền thông khác nhau như video và sách, nhiều tour du lịch trọn gói được tổ chức và gắn bó sâu sắc với ngành công nghiệp du lịch. Nhưng điều đó có thực sự làm tăng số lượng người yêu kiến trúc và thiên nhiên, đồng thời làm sâu sắc sự hiểu biết về lịch sử hay không? (lược bỏ) Dù là di sản thế giới hay không, giá trị của kiến trúc nên được đánh giá riêng lẻ. Con người cũng không thể hiểu hết mọi thứ chỉ bằng danh hiệu. Ngay cả khi được công nhận là di sản thế giới, giá trị của kiến trúc cũng không tăng lên như cổ phiếu. Tất nhiên, nó sẽ mang lại khối tài sản khổng lồ như một nguồn tài nguyên du lịch, nhưng về mặt vật chất, nó vẫn giữ nguyên. Điều tôi lo lắng là việc đặc biệt coi trọng chỉ di sản thế giới có thể thúc đẩy xu hướng ngược lại, cho rằng không cần nỗ lực bảo tồn những thứ khác hay không.\"\n\n(Trích từ “Kiến trúc kết nối với xã hội và mạch lưới như thế nào” – Igarashi Tarō)"},{"source":"Mon11","bai":11,"date":"07/2015","title":"Mon11 - Bài 11 (07/2015)","passage":"A\n\n子どもの昆虫採集について、生命尊重や希少種保護の観点からの批判的な意見が聞かれる。これに対しては、子どもが採集する数など微々たるものなのだから、自然と触れ合うことのメリットを重視すべきだという反論もある。\n\n確かに幼少期の自然体験は自然観の形成に必要ではあるが、実際に子どもの昆虫採集の様子を見ると、子どもが魅力を感じているのは捕獲の瞬間だけだ。子どもの興味に任せるだけではただの遊びにしかならない。そのため、昆虫採集をより有意義な体験にするには、大人からの働きかけが必要だ。昆虫の体や生態を見て知る姿勢を教え、子どもが種の多様性に気づくようにすることが大切だ。\n\nB\n\n虫取りに夢中になって時間を忘れてしまう子や自分のつかまえたバッタ（注）に見入ってしまう子は、もうその活動の中にその子どものよさや可能性が秘められている。「どこがおもしろいの」と訊ねれば、彼らは根拠を持って今日自分が価値を持って見つめているものについて答えてくれるだろう。彼らの学びは、もうすでに始まっているのだ。\n\n学びを通して、自然に対し自分なりの意味を構築していく中で「生命観」も「自然観」も進化していく。\n\nそれに伴って、「生命愛護」「自然環境との共存」という心情も深化していくものだろう。（中略）そのように考えるとき、自然に対して自分なりの意味を見いだせるかということ、実感を伴った理解が行われるかということを抜きにして、「生命愛護」も「自然環境との共生」も語ることはできないだろう。\n\n(角屋重樹森本信也編著『小学校理科教育はこう変わる一ニューサイエンスを求めて』による)\n\n(注) バッタ : 昆虫の一種","questions":[{"q":"子どもが昆虫をつかまえることについて、AとBはどのように考えているか。","options":["Aは観察する姿勢を身につけさせれば有益になると考え、Bは実感を伴った自然の理解に役立つと考えている。","Aは子どもの興味に任せるだけでは十分ではないと考え、Bは興味を持った子どもには積極的に勧めたほうがいいと考えている。","Aは自然を知るきっかけにはならないと考え、Bは子どものよさや可能性を伸ばすきっかけになると考えている。","Aは種の多様性を知る上で重要だと考え、Bは成長過程において欠かせない経験だと考えている。"],"answer":0,"explain":"Đáp án đúng: A. A cho rằng nếu dạy trẻ em thái độ quan sát thì sẽ có lợi, B cho rằng nó có ích cho việc hiểu biết về thiên nhiên đi kèm với cảm nhận thực tế."},{"q":"AとBの認識で共通していることは何か。","options":["子どもの成長過程で、自然保護に対する心情が深められていく。","子ども時代の自然との触れ合いを通した学びが自然観の基礎になる。","子どもの自発的な体験や学びだけでは自然観の形成には十分ではない。","自然体験が多い子どものほうが、自然保護の精神が強くなるわけではない。"],"answer":1,"explain":"Đáp án đúng: B. Học tập thông qua tiếp xúc với thiên nhiên thời thơ ấu là nền tảng cho quan điểm về thiên nhiên."}],"trans":"A:\n\n\"Về việc trẻ em sưu tầm côn trùng, có những ý kiến phê phán từ quan điểm tôn trọng sự sống và bảo vệ các loài quý hiếm. Đáp lại điều này, có những phản bác cho rằng vì số lượng trẻ em thu thập là rất nhỏ, nên cần coi trọng lợi ích của việc tiếp xúc với thiên nhiên. Chắc chắn rằng trải nghiệm thiên nhiên thời thơ ấu là cần thiết để hình thành quan điểm về thiên nhiên, nhưng khi nhìn vào thực tế trẻ em sưu tầm côn trùng, trẻ em chỉ cảm thấy hấp dẫn ở khoảnh khắc bắt giữ. Chỉ để trẻ em tự do theo đuổi sở thích của mình thì chỉ là trò chơi. Vì vậy, để việc sưu tầm côn trùng trở thành một trải nghiệm có ý nghĩa hơn, cần có sự can thiệp từ người lớn. Điều quan trọng là dạy trẻ em thái độ quan sát và tìm hiểu về cơ thể và sinh thái của côn trùng, đồng thời giúp trẻ em nhận ra sự đa dạng của các loài.\"\n\nB:\n\n\"Những đứa trẻ quên cả thời gian vì say mê bắt côn trùng hoặc những đứa trẻ bị cuốn hút vào con châu chấu (chú thích) mà chúng bắt được, những đứa trẻ đó đã tiềm ẩn những điểm tốt và tiềm năng trong hoạt động đó. Nếu bạn hỏi \"có gì thú vị?\", chúng sẽ trả lời với lý do về những gì chúng đang nhìn nhận có giá trị. Quá trình học tập của chúng đã bắt đầu. Thông qua học tập, trong quá trình xây dựng ý nghĩa riêng của chúng đối với thiên nhiên, \"quan điểm về sự sống\" và \"quan điểm về thiên nhiên\" cũng sẽ tiến hóa. Cùng với đó, tình cảm \"yêu quý sự sống\" và \"cùng tồn tại với môi trường tự nhiên\" cũng sẽ sâu sắc hơn. (lược bỏ) Khi suy nghĩ như vậy, nếu không có việc tìm ra ý nghĩa riêng đối với thiên nhiên và việc đạt được sự hiểu biết đi kèm với cảm nhận thực tế, thì không thể nói về \"yêu quý sự sống\" và \"cùng tồn tại với môi trường tự nhiên\".\"\n\n(Trích từ “Giáo dục khoa học tự nhiên ở tiểu học sẽ thay đổi như thế nào – Hướng tới khoa học mới” – Kadoya Shigeki & Morimoto Shinya, biên soạn)\n\nChú thích: (注) バッタ : một loài côn trùng (châu chấu)"},{"source":"Mon11","bai":12,"date":"12/2015","title":"Mon11 - Bài 12 (12/2015)","passage":"A\n\n現在の若者世代は、「車離れ」などの言葉に象徴されるように消費に対して消極的な世代だととらえられることが多い。高級車やブランド品などかつて若者があこがれたものに見向きもしない若者が増加しているという。要因の一つとしては、収入が少なく未来に希望が持てないために節約志向の若者が増えていることがあると言われているが、生まれたときから多くのものに囲まれて育ったおかげで、ものそのものに対する欲求が低いことも挙げられよう。\n\nとはいえ、そのような若者たちも全く消費をしないわけではない。彼らは、単なるものだけではなく、人とのつながりや体験を共有するためにお金を使うのだ。\n\nB\n\n若者の消費実態を俯瞰（注1）すると、今の若者は、デフレや流通環境の進化による消費社会の成熟化、情報通信をはじめとする技術進化の恩恵を受けて、バブル期（注2）の若者よりもお金をかけずに多様な商品・サービスを楽しめる環境にある。安価で高品質な商品・サービスがあふれ、娯楽も多様化していることで、選択できる対象も増えている。こういった変化によって、今の若者では消費に対するモノサシが変わり、「クルマ」や「高級ブランド品」といったバブル期の若者が欲していたものへの興味関心が相対的に薄れているのだろう。\n\nつまり、「若者はお金を使わない」わけではなく、お金を使わなくて済むようになり、価値観の変化により欲するものが変わってきている。\n\n(久我尚子『若者は本当にお金がないのか?一統計データが語る意外な真実』 による)\n\n(注1) 俯瞰する : ここでは、全体を見る\n\n(注2) バブル期: 1980年代後半から1990年代初頭の、日本の景気が非常によかった時期","questions":[{"q":"現代の若者の消費傾向について、AとBはどのように述べているか。","options":["AもBも、消費の対象が変化していると述べている。","AもBも、ものそのものに対する興味関心が低くなったと述べている。","Aはものを買わなくなったと述べ、Bは品質にこだわらなくなったと述べている。","Aは消費の対象がものではなくなったと述べ、Bは自身のために消費するようになったと述べている。"],"answer":1,"explain":"Đáp án đúng: B. Cả A và B đều nói rằng sự quan tâm đến bản thân đồ vật đã giảm đi."},{"q":"着者の消費傾向の変化の要因について、AとBが共通して指摘している点は何か。","options":["若者の購買カが下がったこと。","若者が節約を好むようになったこと。","若者がものに恵まれた環境にあること。","若者にとって魅力的なものが少ないこと。"],"answer":2,"explain":"Đáp án đúng: C. Giới trẻ ở trong môi trường có nhiều đồ vật."}],"trans":"A \"Thế hệ trẻ hiện nay thường được coi là thế hệ tiêu cực đối với tiêu dùng, được tượng trưng bởi những từ như \"xa rời xe hơi\". Số lượng thanh niên không thèm để mắt đến những thứ mà trước đây thanh niên từng mơ ước, chẳng hạn như ô tô nhập khẩu và hàng hiệu, đang tăng lên. Một trong những yếu tố được cho là số lượng thanh niên có xu hướng tiết kiệm đang tăng lên do thu nhập thấp và không có hy vọng vào tương lai, nhưng cũng có thể kể đến việc họ có ít ham muốn đối với bản thân đồ vật nhờ lớn lên trong môi trường xung quanh là nhiều đồ vật từ khi sinh ra. Tuy nhiên, không phải là những thanh niên đó hoàn toàn không tiêu dùng. Họ không chỉ chi tiền cho những thứ đơn thuần, mà còn chi tiền để chia sẻ mối quan hệ với mọi người và trải nghiệm.\"\n\nB\n\n\"Khi quan sát thực tế tiêu dùng của giới trẻ (chú thích 1), giới trẻ ngày nay đang ở trong môi trường có thể tận hưởng nhiều loại hàng hóa và dịch vụ mà không tốn nhiều tiền hơn so với giới trẻ thời kỳ bong bóng (chú thích 2), nhờ lợi ích của sự trưởng thành của xã hội tiêu dùng do giảm phát và sự tiến hóa của môi trường phân phối, cũng như sự tiến hóa của công nghệ bao gồm cả thông tin và truyền thông. Do có nhiều hàng hóa và dịch vụ chất lượng cao với giá rẻ, và giải trí cũng đa dạng hóa, nên các đối tượng có thể lựa chọn cũng tăng lên. Do những thay đổi này, thước đo đối với tiêu dùng của giới trẻ ngày nay đã thay đổi, và sự quan tâm đến những thứ mà giới trẻ thời kỳ bong bóng mong muốn, chẳng hạn như \"ô tô\" và \"hàng hiệu cao cấp\", có lẽ đã tương đối giảm đi. Nói cách khác, không phải là \"giới trẻ không chi tiền\", mà là họ đã có thể không cần chi tiền, và những thứ họ mong muốn đã thay đổi do sự thay đổi trong giá trị quan.\"\n\n(Trích từ “Người trẻ thật sự không có tiền sao? – Sự thật bất ngờ qua số liệu thống kê” – Kuga Naoko)\n\nChú thích: (注1) 俯瞰する : ở đây có nghĩa là nhìn toàn cảnh, nhìn tổng thể (注2) バブル期 : giai đoạn cuối thập niên 1980 đến đầu thập niên 1990, khi nền kinh tế Nhật Bản cực kỳ hưng thịnh"},{"source":"Mon11","bai":13,"date":"07/2016","title":"Mon11 - Bài 13 (07/2016)","passage":"A\n\n企業のような組織では、上下関係、年齢、性別などのさまざまな要因により、普段からメンバー全員がフラットに（注1）話し合える雰囲気がない場合も少なくありません。さらに、会議の場になると、誰かに対する遠慮や、ライバル心などが作用して、メンバーからまったく発言が出なかったり、話が平行線のまますり合わない、などといったことが起こってしまいます。\n\nこうした状況を活性化させて、メンバー全員でアイデアを出していくために重要なのが、チームリーダーからメンバーへ質問をすることです。\n\nチームリーダーという立場になると、ついつい、自分の考えや答えを、メンバーに提示してしまいがちですが、そうやって出た結論は得てして（注2）予定調和（注3）になりがちです。\n\nチームで創造的なアイデアを出していくためには、メンバーの内側にあるものを引き出すことが重要であり、そのきっかけを与えるのが「質問」なのです。\n\n(博報堂ブランドデザイン『チームのアイデア力。アイデアが出るチームになるための5つのステップ』)\n\nB\n\n組織の力を生かすには、メンバー同士の積極的な意見交換が欠かせない。しかし再三会議は行われるものの、役職や人間関係を気にしすぎて積極的な議論にならず、生産性がないという声も聞かれる。こうした状況を打開するために、リーダーは会議でどうすべきか。\n\nまずリーダーが自身の明確なビジョンをメンバーに提示し、それについて広く意見を求めることが大切だ。目標がはっきり定まっていて、それに向けて具体的な方策を練るという議論ならば、メンバーも発言しやすい。また、さまざまな方向性の意見が出て一つの結論へ収束させられないという非効率な事態も避けられる。リーダーは、目指すべき方向を示し、メンバーと議論を深めていける場を作ることが重要だ。\n\n(注1) フラットに : ここでは、対等に\n\n(注2) 得てして : ともすれば\n\n(注3) 予定調和 :ここでは、無難なもの","questions":[{"q":"企業の問題点として、AとBが共通して指摘している点は何か。","options":["社内の人間関係が悪いこと。","社内で無駄な会論が多すぎること。","社内会議で活発な議論が行われないこと。","社内会議の結論が業績向上に結びつかないこと。"],"answer":2,"explain":"Đáp án đúng: C. Các cuộc thảo luận sôi nổi không được tổ chức trong các cuộc họp công ty."},{"q":"会議でのリーダーの姿勢について、AとBはどのように述べているか。","options":["AもBも、メンバーから出た意見をうまく調整することが重要だと述べている。","AもBも、自身の意見は控えて、質問でメンバーの意見を引き出すことが重要だと述べている。","Aはメンバー同士で話し合うことが重要だと述べ、Bは自身の考えを示してメンバーも意見を求めるべ きだと述べている。","Aは質問をしてメンバーの意見を集めるべきだと述べ、Bは目標を明確に示して議論を進めることが重要だと述べている。"],"answer":3,"explain":"Đáp án đúng: D. A nói rằng nên thu thập ý kiến của các thành viên bằng cách đặt câu hỏi, B nói rằng điều quan trọng là chỉ ra mục tiêu rõ ràng và tiến hành thảo luận."}],"trans":"A:\n\n\"Trong các tổ chức như doanh nghiệp, do nhiều yếu tố khác nhau như quan hệ cấp trên-cấp dưới, tuổi tác, giới tính, v.v., không ít trường hợp không có bầu không khí mà tất cả các thành viên có thể thảo luận một cách bình đẳng (chú thích 1) trong cuộc sống hàng ngày. Hơn nữa, khi đến cuộc họp, do sự e ngại đối với ai đó hoặc tinh thần cạnh tranh, v.v. tác động, có những trường hợp các thành viên hoàn toàn không đưa ra ý kiến hoặc cuộc trò chuyện vẫn song song mà không thể dung hòa. Để kích hoạt tình hình này và đưa ra ý tưởng với tất cả các thành viên, điều quan trọng là người lãnh đạo nhóm đặt câu hỏi cho các thành viên. Khi ở vị trí lãnh đạo nhóm, người ta có xu hướng đưa ra ý tưởng và câu trả lời của mình cho các thành viên, nhưng kết luận được đưa ra theo cách đó thường có xu hướng trở thành sự hòa hợp đã định trước (chú thích 3). Để đưa ra những ý tưởng sáng tạo trong nhóm, điều quan trọng là phải khai thác những gì nằm bên trong các thành viên, và \"câu hỏi\" là thứ mang lại cơ hội đó.\"\n\nB:\n\n\"Để tận dụng sức mạnh của tổ chức, việc các thành viên tích cực trao đổi ý kiến là không thể thiếu. Tuy nhiên, mặc dù các cuộc họp được tổ chức nhiều lần, nhưng cũng có những tiếng nói cho rằng chúng không dẫn đến các cuộc thảo luận tích cực do quá lo lắng về chức vụ và quan hệ con người, và không có năng suất. Người lãnh đạo nên làm gì trong cuộc họp để phá vỡ tình hình này? Trước hết, điều quan trọng là người lãnh đạo đưa ra tầm nhìn rõ ràng của mình cho các thành viên và tìm kiếm ý kiến rộng rãi về điều đó. Nếu mục tiêu được xác định rõ ràng và cuộc thảo luận là để xây dựng các biện pháp cụ thể hướng tới mục tiêu đó, thì các thành viên cũng sẽ dễ dàng phát biểu. Ngoài ra, có thể tránh được tình huống không hiệu quả khi nhiều ý kiến theo các hướng khác nhau xuất hiện và không thể hội tụ thành một kết luận. Điều quan trọng là người lãnh đạo tạo ra một nơi có thể chỉ ra hướng đi cần hướng tới và làm sâu sắc thêm cuộc thảo luận với các thành viên.\"\n\nChú thích:\n\n(注1) フラットに : ở đây có nghĩa là ngang hàng\n\n(注2) 得てして : có xu hướng\n\n(注3) 予定調和 : ở đây có nghĩa là một thứ vô thưởng vô phạt"},{"source":"Mon11","bai":14,"date":"12/2016","title":"Mon11 - Bài 14 (12/2016)","passage":"A\n\n雑談はいろいろな意見を交換し合うことによって、ヒントを得ようというスケールの大きな場である。そこにいる誰もが自由に発言する権利を持っている。仮に自分とは反対意見であっても、まずは聞くという姿勢を保つこと、心理学のカウンセリングと同じである。\n\nそして相手の発言に対して、自分の意見を軽い気持ちで返せる、それが雑談である。\n\nどんなに間違っている、バカバカしいと思われる意見であっても、いったんそれを受け入れること。「なぜあの人はこのような発言をするのか」と考えていくと、自分がそれまで見落としていたことに気がつくこともある。\n\n「話し上手は聞き上手」という言葉があるように、雑談では「いかに発言するか」よりも「いかに聞くか」が大切になる。\n\n(多湖多『人の心をつかむ「雑談力」情報が集まる「雑談力」』 による)\n\nB\n\n雑談は無駄だという人がいるが、本当にそうだろうか。辞書を調べると「無駄話」という意味もあるが、「さまざまなことを気楽に話し合うこと」という意味もある。気楽な気持ちのとき、人は本音を話すものだ。バカらしいと思う話もあるかもしれないが、雑談の中から相手の人間性が見えてくる。\n\nそうはいっても、気楽に話せる雰囲気を作るのは簡単なことではない。まずは、自分から話のきっかけになりそうな小さなエピソードを話そう。相手が話に乗って（注）きたと思ったら、そこで自分の本音を話してみよう。そうすれば、相手もやがて心を開いて話し始めるだろう。そうなれば、雑談も意味のある時間となる。\n\n(注) 話に乗る : ここでは、話に興味を持つ","questions":[{"q":"雑談の良い点について、AとBはどのように述べているか。","options":["Aはお互いの考えを認め合えると述べ、Bは相手の人間性が見えてくると述べている。","Aは相手と意見交換ができると述べ、Bはバカらしい話をしても受け入れてもらえると述べている。","Aは自分が気づいていなかったことに気づけると述べ、Bは相手の本音を知ることができると述べている。","Aは誰もが自由に意見を発言できると述べ、Bは相手と自分との共通点を見つけることができると述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng có thể nhận ra những điều mình chưa nhận ra, B nói rằng có thể biết được suy nghĩ thật lòng của đối phương."},{"q":"雑談をするときの姿勢について、AとBはどのように述べているか。","options":["AもBも、相手の話をよく聞くことが大切だと述べている。","AもBも、相手と自分が同じぐらいの割合で話すようにしようと述べている。","Aは相手の話を聞くことが大切だと述べ、Bは自分から話すようにしようと述べている。","Aは相手の発言の意図を考えることが大切だと述べ、Bはまずは相手に話をさせることが大切だと述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng điều quan trọng là lắng nghe câu chuyện của đối phương, B nói rằng nên chủ động nói chuyện."}],"trans":"A:\n\n\"Tán gẫu cũng được thực hiện trong một không gian quy mô lớn, nơi chúng ta trao đổi nhiều ý kiến khác nhau để có được gợi ý. Bất kỳ ai ở đó đều có quyền tự do phát biểu. Ngay cả khi đó là ý kiến trái ngược với ý kiến của bản thân, điều quan trọng là phải duy trì thái độ lắng nghe trước hết, giống như tư vấn tâm lý học. Và trình bày ý kiến của bản thân một cách thoải mái đối với phát biểu của đối phương, đó là tán gẫu. Ngay cả khi đó là ý kiến bị cho là sai lầm hay ngớ ngẩn đến đâu, điều quan trọng là chấp nhận ý kiến đó trước hết. Khi suy nghĩ \"tại sao người đó lại đưa ra phát biểu như vậy?\", bạn có thể nhận ra rằng có những điều mình đã bỏ sót cho đến lúc đó. Như câu nói \"người nói giỏi là người nghe giỏi\", trong tán gẫu, \"lắng nghe như thế nào\" quan trọng hơn \"phát biểu như thế nào\".\"\n\n(Trích từ “Nghệ thuật trò chuyện nắm bắt lòng người – Nghệ thuật trò chuyện giúp thu thập thông tin” – Tako Masaru)\n\nB:\n\n\"Có người nói rằng tán gẫu là vô ích, nhưng có thực sự như vậy không? Khi tra từ điển, nó cũng có nghĩa là \"nói chuyện vô bổ\", nhưng nó cũng có nghĩa là \"thảo luận thoải mái về nhiều điều khác nhau\". Khi có tâm trạng thoải mái, con người sẽ nói ra suy nghĩ thật lòng của mình. Có thể có những câu chuyện bị cho là ngớ ngẩn, nhưng tính cách con người của đối phương sẽ được thể hiện qua những cuộc tán gẫu. Mặc dù vậy, việc tạo ra bầu không khí thoải mái để trò chuyện không phải là điều dễ dàng. Trước hết, hãy bắt đầu bằng cách kể một câu chuyện nhỏ có thể là khởi đầu của cuộc trò chuyện. Khi bạn nghĩ rằng đối phương đã hứng thú với câu chuyện (chú thích), hãy nói ra suy nghĩ thật lòng của bạn. Làm như vậy, đối phương cũng sẽ dần mở lòng và bắt đầu trò chuyện. Khi đó, tán gẫu cũng sẽ trở thành một khoảng thời gian có ý nghĩa.\"\n\nChú thích:\n\n(注) 話に乗る : ở đây có nghĩa là hứng thú, quan tâm đến câu chuyện"},{"source":"Mon11","bai":15,"date":"07/2017","title":"Mon11 - Bài 15 (07/2017)","passage":"A\n\n国際化の進展や新技術の開発などに伴って、新しい概念やニュアンスの提示など、外来語・外国語（注）を使用せざるを得ない面があり、また、既に外来語・外国語を用いた方がその日本語訳よりも分かりやすい場合もある。そうした場合は別として、一般的には、相手や目的に応じて十分な配慮の下に、その外来語や外国語を使用するか否かの判断がなされる必要があろう。外来語・外国語は基本的にその語に対する知識がないと伝達不能になることが多い。そういう意味で、広く国民一般を対象にしている官公庁、新聞・放送等では、簡単に日本語に言い換えられる外来語・外国語や耳慣れない外来語・外国語などは安易に使わないようにすべきである。\n\n(文化庁2015年10月23日取得による)\n\nB\n\n「ユーザー」、「ケア」など多くの外来語・外国語が私たちの生活の中にあふれている。外来語・外国語は意味があいまいなので使用すべきでないという声も多い。しかし、グローバル化する現代では、既存の日本語で置き換えにくい新しい概念や事象を表す上で、外来語・外国語を使うのは仕方がないことだ。\n\n一方、ある調査によると、若い世代は外来語・外国語使用の増加を容認し、使用する割合が高いが、年齢の高い世代ではその割合が低いそうだ。このような違いが、世代間のコミュニケーションの障害になるという心配もある。また、年齢が高くなってから利用機会が多くなる医療や福祉の分野で、外来語・外国語の使用が多いことも問題だ。外来語・外国語を使用する際には、相手が理解できるかどうかを考えることも大切だ。\n\n(注) 外来語・外国語 : ここでは、片仮名語","questions":[{"q":"外来語・外国語の使用が避けられない理由と して、AとBが共通して述べていることは何か。","options":["外来語・外国語の方が日本語で表現しにくい概念を表すこともできること。","外来語・外国語がすでに定着して一般的になっていること。","外来語・外国語を使用しないと外国人が理解できないと考えられていること。","外来語・外国語を使用する方が現代的であると考えられていること。"],"answer":0,"explain":"Đáp án đúng: A. Từ ngoại lai/ngoại ngữ cũng có thể diễn đạt các khái niệm khó diễn đạt bằng tiếng Nhật."},{"q":"外来語・外国語のあり方について、AとBはどのように述べているか。","options":["AもBも、若い世代であってもできるだけ使用すべきではないと述べている。","AもBも、対象となる世代によって使用するかどうかを考えるべきだと述べている。","Aは安易に使用しないようにすべきだと述べ、Bは意味をよく理解した上で使用すべきだと述べている。","Aは国民一般を対象に使用する場合はよく考えるべきだと述べ、Bは相手に応じて使用した方がいいと述べている。"],"answer":3,"explain":"Đáp án đúng: D. A nói rằng nên suy nghĩ kỹ khi sử dụng cho công chúng nói chung, B nói rằng nên sử dụng tùy thuộc vào đối phương."}],"trans":"A \"Đi kèm với sự tiến bộ của quốc tế hóa và phát triển công nghệ mới, có những khía cạnh mà chúng ta buộc phải sử dụng từ ngoại lai/ngoại ngữ (chú thích) như trình bày các khái niệm và sắc thái mới, và cũng có những trường hợp mà việc sử dụng từ ngoại lai/ngoại ngữ đã dễ hiểu hơn so với bản dịch tiếng Nhật của chúng. Ngoại trừ những trường hợp đó, nói chung, cần phải đưa ra quyết định có nên sử dụng từ ngoại lai hoặc ngoại ngữ đó hay không dưới sự cân nhắc đầy đủ tùy thuộc vào đối phương và mục đích. Về cơ bản, từ ngoại lai/ngoại ngữ thường không thể truyền đạt nếu không có kiến thức về từ đó. Theo nghĩa đó, các cơ quan chính phủ, báo chí và phát thanh truyền hình, v.v., nhắm đến công chúng nói chung, không nên dễ dàng sử dụng các từ ngoại lai/ngoại ngữ mà có thể dễ dàng thay thế bằng tiếng Nhật hoặc các từ ngoại lai/ngoại ngữ không quen thuộc.\"\n\n(Trích từ “Cơ quan Văn hóa Nhật Bản”, lấy ngày 23/10/2015)\n\nB\n\n\"Nhiều từ ngoại lai/ngoại ngữ như \"người dùng\" và \"chăm sóc\" đang tràn ngập trong cuộc sống của chúng ta. Có nhiều ý kiến cho rằng không nên sử dụng từ ngoại lai/ngoại ngữ vì ý nghĩa của chúng mơ hồ. Tuy nhiên, trong thời đại toàn cầu hóa ngày nay, việc sử dụng từ ngoại lai/ngoại ngữ là điều không thể tránh khỏi để diễn đạt các khái niệm và hiện tượng mới khó thay thế bằng tiếng Nhật hiện có. Mặt khác, theo một cuộc khảo sát, thế hệ trẻ chấp nhận sự gia tăng sử dụng từ ngoại lai/ngoại ngữ và có tỷ lệ sử dụng cao, nhưng tỷ lệ đó thấp ở thế hệ lớn tuổi hơn. Cũng có những lo ngại rằng sự khác biệt này sẽ trở thành rào cản giao tiếp giữa các thế hệ. Ngoài ra, việc sử dụng nhiều từ ngoại lai/ngoại ngữ trong lĩnh vực y tế và phúc lợi, nơi cơ hội sử dụng tăng lên khi tuổi cao, cũng là một vấn đề. Điều quan trọng là phải xem xét liệu đối phương có hiểu được hay không khi sử dụng từ ngoại lai/ngoại ngữ.\"\n\nChú thích:\n\n(注) 外来語・外国語 : ở đây có nghĩa là từ viết bằng Katakana"},{"source":"Mon11","bai":16,"date":"12/2017","title":"Mon11 - Bài 16 (12/2017)","passage":"A\n\n会社の仕事は学校と違い、知識だけでは役に立たず、実際の判断や行動が問題である。だから何ごとも、実際に経験しない限り、新しい能力は身につかない。今持っている能力というのはすべて、過去において未経験の仕事に取り組んだ結果、身についたものだ。したがって、部下や後輩に対しては常に、今までの仕事をだいたいこなせる（注）ようになったなと思ったら、すかさず彼にとっては未経験の仕事を与え、それをやりとげるようバックアップをする必要がある。（中略）そして何とか問題を克服したら、必ずほめる。ほめることによって本人も“おれもやれるな”と自信がつき、次はこちらから未経験の仕事を与えなくても、自分で新しい問題を買って出るようになる。そして全力投球でそれと対決し、克服してさらに自信の持てる範囲を広げ、さらに未経験の課題に取り組むという成長循環に入っていく。\n\nB\n\n企業で人材を育てるには、上司が部下の行動のスタイルを理解して指導を行うことが重要だ。これまでは、まずはとにかく経験させ、その過程で試行錯誤しながら進歩していくのがよいと考えられてきたが、最近では事前に情報をインプットした上で経験をしたいというタイプが多い。このようなタイプには、未経験の仕事をいきなり与えるのではなく、十分に情報を与え全体像をつかませた上で、新しい仕事に取り組ませることが効果的だ。最近の部下は現状維持でいいと考える人が多いという批判が聞かれるが、彼らの行動のスタイルに合わせて経験を積ませていくことによって視野が広がり、自ら新しいことに取り組もうという姿勢を持つようになるだろう。\n\n(注) こなす : 処理する","questions":[{"q":"部下に未経験の仕事をさせることについて、AとBはどのように述べているか。","options":["AもBも、仕事上の判断や行動を学べるので多くさせたほうがいいと述べている。","AもBも、与えられた仕事ができるようになったらさせたほうがいいと述べている。","Aは自力でやりとげられそうな仕事ならさせたほうがいいと述べ、Bはイメージがつかめる仕事ならさせたほうがいいと述べている。","Aは積極的に経験させたほうがいいと述べ、Bは十分な情報を与えてからさせたほうがいいと述べている。"],"answer":3,"explain":"Đáp án đúng: D. A nói rằng nên tích cực cho họ trải nghiệm, B nói rằng nên giao sau khi cung cấp đầy đủ thông tin."},{"q":"AとBが共通して部下に期待していることは何か。","options":["会社で必要な新しい行動スタイルを身につけること。","新しいことに挑戦しようという気持ちを持つこと。","自力で多くの問題を克服できるようになること。","自身がしている仕事に自信を持つこと。"],"answer":1,"explain":"Đáp án đúng: B. Có tinh thần sẵn sàng thử thách những điều mới."}],"trans":"A:\n\n\"Công việc ở công ty khác với trường học, kiến thức thôi thì không hữu ích, mà vấn đề là phán đoán và hành động thực tế. Vì vậy, trừ khi thực sự trải nghiệm bất cứ điều gì, bạn sẽ không thể có được khả năng mới. Tất cả những khả năng bạn có bây giờ đều là kết quả của việc giải quyết những công việc chưa từng có kinh nghiệm trong quá khứ. Do đó, đối với cấp dưới và hậu bối, luôn cần hỗ trợ họ hoàn thành công việc đó bằng cách ngay lập tức giao cho họ những công việc chưa từng có kinh nghiệm khi bạn nghĩ rằng họ đã có thể hoàn thành (chú thích) công việc hiện tại. (lược bỏ) Và nếu họ bằng cách nào đó vượt qua được vấn đề, hãy khen ngợi họ. Bằng cách khen ngợi, bản thân họ cũng sẽ tự tin rằng \"mình cũng có thể làm được\", và sau đó họ sẽ tự mình tìm kiếm những vấn đề mới ngay cả khi chúng ta không giao cho họ những công việc chưa từng có kinh nghiệm. Và họ sẽ bước vào vòng tuần hoàn phát triển, trong đó họ đối đầu với nó bằng tất cả sức lực, vượt qua nó, mở rộng phạm vi mà họ có thể tự tin hơn nữa, và giải quyết các nhiệm vụ chưa từng có kinh nghiệm.\"\n\nB:\n\n\"Để phát triển nguồn nhân lực trong doanh nghiệp, điều quan trọng là cấp trên phải hiểu phong cách hành động của cấp dưới và đưa ra hướng dẫn. Cho đến nay, người ta cho rằng điều tốt nhất là trước hết hãy để họ trải nghiệm, và tiến bộ bằng cách thử và sai trong quá trình đó, nhưng gần đây có nhiều người muốn trải nghiệm sau khi nhập thông tin trước. Đối với những người như vậy, sẽ hiệu quả hơn nếu không giao ngay cho họ những công việc chưa từng có kinh nghiệm, mà hãy để họ giải quyết những công việc mới sau khi cung cấp đầy đủ thông tin và nắm bắt toàn bộ bức tranh. Gần đây, có những lời chỉ trích rằng nhiều cấp dưới cho rằng việc duy trì hiện trạng là đủ, nhưng bằng cách cho họ tích lũy kinh nghiệm phù hợp với phong cách hành động của họ, quan điểm của họ sẽ được mở rộng và họ sẽ có thái độ chủ động giải quyết những điều mới.\"\n\nChú thích: (注) こなす : xử lý"},{"source":"Mon11","bai":17,"date":"07/2018","title":"Mon11 - Bài 17 (07/2018)","passage":"A\n\n「私、絵が描けないのです」と言う人がたまにいる。そんな訳はない。紙とペンがあれば誰だって描ける。紙がなくったって、何だっていい。でも、描けないというのは、「それらしく」描かなくてはならないという気持ちがあるからだ。馬を描きたかったんだけど牛になってしまった、りんごを描いたのがみかんに見える。だから絵はうまくない、描きたくないとなる。\n\nでも、絵は正確さを要求されるものではない。自分の馬、自分のりんごを描けばいい。絵はそれくらい「いいかげん」なものであり、許容範囲の広いものである。本物らしく描くことは、描くことではなく写すこと。描くということは自分なりの形でいいのだ。（中略）\n\n誰だって絵を描けるし、誰だって絵を楽しめる。それらしく描く技術よりも喜んで描く気持ちが大切であり、絵に失敗はなく、不正確もない。それが自分の作品であり、それは自分の世界である。\n\nB\n\n絵が上手になるには、とにかく多くの絵を描く経験が大切だ。絵がうまくならないという人は、うまく描けないからといって途中であきらめてしまうことが多い。だがたとえうまく描けなくても、まずは最後まで真剣に描き上げることが重要だ。\n\nさらに、描く対象をしっかり観察して、考えながら描くことも大切だ。対象をよく見ると新しい発見も多いので、描くことが楽しくなる。実はこの描くことを楽しむ気持ちが最も重要なのだ。どんなことでも、楽しければたくさんできる。多くの経験を積めば、それだけ上達するというもので、絵を描くことも同じだといえる。","questions":[{"q":"絵を描くことについて、A と B はどのように述べているか。","options":["AもBも、描くことと写すことの違いを知ることが大切だと述べている。","AもBも、途中であきらめないで、最後まで描くことが大切だと述べている。","Aは正確さにこだわりすぎないほうがいいと述べ、B は対象をよく見て考えながら描くことが大切だと述べている。","Aは自身が描きたいように描けばいいと述べ、B は多くの絵を描くより一つ一つを丁寧に描いたほうがいいと述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng không nên quá chú trọng đến sự chính xác, B nói rằng điều quan trọng là quan sát kỹ đối tượng và vẽ trong khi suy nghĩ."},{"q":"AとBの認識で共通していることは何か。","options":["個性が感じられる絵が優れた絵だといえる。","自身だけでなく周りも楽しめる絵を描くべきだ。","誰でも絵が上手に描けるようになる。","楽しむ気持ちを持って絵を描くべきだ。"],"answer":3,"explain":"Đáp án đúng: D. Bạn nên vẽ tranh với cảm giác thích thú."}],"trans":"A \"Thỉnh thoảng có người nói rằng \"Tôi không biết vẽ tranh\". Không có chuyện đó. Bất kỳ ai cũng có thể vẽ nếu có giấy và bút. Ngay cả khi không có giấy, bất cứ thứ gì cũng được. Nhưng lý do họ nói không vẽ được là vì họ có cảm giác phải vẽ \"giống như thật\". Tôi muốn vẽ một con mèo nhưng nó lại thành con bò, tôi vẽ quả táo nhưng nó lại giống quả quýt. Vì vậy, tôi nghĩ mình vẽ không giỏi và không muốn vẽ. Nhưng tranh không đòi hỏi sự chính xác. Bạn chỉ cần vẽ con mèo của mình, quả táo của mình. Vẽ tranh là một thứ \"tạm được\" và có phạm vi chấp nhận rộng như vậy. Vẽ giống như thật không phải là vẽ mà là sao chép. Vẽ có thể theo cách riêng của bạn. (lược bỏ)\"\n\nAi cũng có thể vẽ, và ai cũng có thể tận hưởng việc vẽ. Quan trọng hơn kỹ thuật vẽ cho giống là tấm lòng vui vẻ khi vẽ. Trong hội họa, không có cái gọi là thất bại hay sai lệch. Bởi vì đó là tác phẩm của chính mình, và đó là thế giới của riêng mình.\n\nB\n\n\"Bất kỳ ai cũng có thể vẽ tranh và bất kỳ ai cũng có thể thưởng thức tranh. Điều quan trọng là cảm giác thích thú vẽ hơn là kỹ thuật vẽ giống như thật, và không có thất bại hay không chính xác trong tranh. Đó là tác phẩm của bạn và đó là thế giới của bạn. Để vẽ giỏi, điều quan trọng là phải có kinh nghiệm vẽ nhiều tranh. Những người nói rằng họ không thể vẽ giỏi thường bỏ cuộc giữa chừng vì họ không thể vẽ tốt. Nhưng ngay cả khi bạn không thể vẽ tốt, điều quan trọng là trước hết phải vẽ xong một cách nghiêm túc. Hơn nữa, điều quan trọng là phải quan sát kỹ đối tượng vẽ và vẽ trong khi suy nghĩ. Nếu bạn nhìn kỹ đối tượng, bạn sẽ tìm thấy nhiều khám phá mới và việc vẽ sẽ trở nên thú vị. Thực tế, cảm giác thích thú vẽ này là quan trọng nhất. Bất cứ điều gì cũng vậy, nếu bạn thích thú, bạn sẽ làm được nhiều. Càng có nhiều kinh nghiệm, bạn sẽ càng tiến bộ, và có thể nói rằng vẽ tranh cũng vậy.\""},{"source":"Mon11","bai":28,"date":"12/2018","title":"Mon11 - Bài 28 (12/2018)","passage":"A\n\n苦手を克服しようとする努力は貴重です。しかし、人には向き不向きがあるのも事実。苦手を克服するまで好きなことをやってはならないとすれば、誰だって自分らしさを見失ってしまいます。\n\nそう考えれば、できないことを無理に克服する必要はないと考えてもいいのではないでしょうか。不得手な部分は得意な人に助けてもらえばいいのです。\n\n落ちこぼれだったエジソンは、自分の知識の足りない部分を補うために、優秀な科学者や技術者を雇いました。自分の弱みを知っていたからこそ、エジソンはそれを埋め合わせる方法を考え、千にも及ぶ発明を実現できたのです。弱みがわかれば弱みを「避ける」という選択ができます。それは弱みから「逃げる」という意味ではありません。失敗の要因を避けて、事前に適切な対処をする工夫ができるようになるという意味です。\n\n困難から逃げてばかりいては何事も成し遂げられませんが、困難を避けるために行う試行錯誤は成功を導く大きな戦略です。\n\nB\n\nあなたは「苦手なことは何とかして乗り越えなければ」と自分自身を必要以上に追い込んではいないだろうか。もちろん、自身の欠点や弱点はすなおに認めて謙虚にならなければならない。しかしそれは、努力で簡単に克服できることばかりではない。克服できないからといってコンプレックスを抱え続けるよりも、得意なことを生かすことを考えてみてはどうだろうか。\n\n特に仕事の場合は、さまざまな職種や職場があるので、自身に合ったものを選ぶことが可能だ。得意なことを生かせる環境を見付けることで、自信を持って生き生きと働くことができるだろう。","questions":[{"q":"苦手を克服することについて、AとBはどのように述べているか。","options":["AもBも、必要だと述べている。","AもBも、必ずしも必要ではないと述べている。","Aは必要だと述べ、Bは必ずしも必要ではないと述べている。","Aは必ずしも必要ではないと述べ、Bは必要だと述べている。"],"answer":1,"explain":"Đáp án đúng: B. Cả A và B đều nói rằng điều đó không nhất thiết phải cần thiết."},{"q":"AとBの認識で共通していることは何か。","options":["困難を避けるために、さまざまな試行錯誤を行うのがよい。","失敗に備えて、事前に適切な対処を考えておくべきだ。","自身の長所を生かせる場を見付けるべきだ。","自身の弱いところを自覚することは大切だ。"],"answer":3,"explain":"Đáp án đúng: D. Điều quan trọng là nhận thức được điểm yếu của bản thân."}],"trans":"A:\n\n\"Nỗ lực để vượt qua điểm yếu rất đáng quý. Tuy nhiên, sự thật là mỗi người đều có những điểm phù hợp và không phù hợp. Nếu bạn không được phép làm những gì mình thích cho đến khi vượt qua điểm yếu, bất kỳ ai cũng sẽ đánh mất bản sắc của mình. Nếu bạn nghĩ như vậy, bạn có thể nghĩ rằng không cần thiết phải cố gắng vượt qua những gì mình không thể làm. Bạn có thể nhờ những người giỏi giúp đỡ những phần mình không giỏi. Edison, người từng là học sinh cá biệt, đã thuê những nhà khoa học và kỹ sư xuất sắc để bù đắp cho những phần kiến thức còn thiếu của mình. Chính vì biết điểm yếu của mình mà Edison đã nghĩ ra cách bù đắp nó và thực hiện được hàng nghìn phát minh. Nếu bạn biết điểm yếu của mình, bạn có thể lựa chọn \"tránh\" điểm yếu đó. Điều đó không có nghĩa là \"trốn chạy\" khỏi điểm yếu. Nó có nghĩa là bạn có thể nghĩ ra cách tránh các yếu tố gây thất bại và thực hiện các biện pháp thích hợp trước. Mặc dù bạn không thể đạt được bất cứ điều gì nếu bạn chỉ trốn tránh khó khăn, nhưng việc thử và sai để tránh khó khăn là một chiến lược lớn dẫn đến thành công.\"\n\nB:\n\n\"Bạn có đang tự ép mình quá mức với suy nghĩ \"Mình phải vượt qua những điều mình không giỏi bằng cách nào đó\" không? Tất nhiên, bạn phải thẳng thắn thừa nhận những khuyết điểm và điểm yếu của mình và trở nên khiêm tốn. Tuy nhiên, không phải tất cả chúng đều có thể dễ dàng vượt qua bằng nỗ lực. Thay vì tiếp tục mang mặc cảm vì không thể vượt qua, tại sao bạn không thử nghĩ đến việc phát huy những điểm mạnh của mình? Đặc biệt là trong công việc, vì có nhiều loại hình công việc và nơi làm việc khác nhau, nên bạn có thể chọn những thứ phù hợp với mình. Bằng cách tìm ra môi trường mà bạn có thể phát huy điểm mạnh của mình, bạn sẽ có thể sống tự tin và làm việc một cách sống động.\""},{"source":"Mon11","bai":29,"date":"07/2019","title":"Mon11 - Bài 29 (07/2019)","passage":"A\n\n優れた人は決断に迷うものです。決めるために必要な情報をたくさん持っていたり、決めた結果について多岐にわたる予測を立てたりするからです。\n\n「決める力」のある人とは、たくさんの情報を合理的に利用して、最善の結果を予測できる人のことです。潔くパッと決める人は決断力のある人にみえますが、軽率な判断で最悪の結果を招いたのでは決める力があるとはいえません。また、じっくり考えて決める人は慎重な人にみえますが、ただ迷っているだけでは良い結果が得られないでしょう。\n\n（中略）\n\nどうすれば「決める力」のある人になれるのでしょう。身近な仲間の意見はどれも大差がないので話半分に（注）聞いておき、専門性や価値観の違うたくさんの人の意見を集約して整理します。その上で、自分一人で最終的な決断をするのが「決める力」のある人のやり方です。\n\nB\n\n情報があふれる現代では、選択肢が多すぎてなかなか決断ができないという状況に陥りやすい。最善の結果を得ようと情報を探せば探すほどリスクの可能性を知り、迷い、検討を繰り返しているうちに決断がどんどん遅れてしまう。しかしどのような決断にも負の面は必ずある。だから時間をかけすぎるよりも、失敗を恐れず迅速に決断していく人のほうが「決める力」がある人だと言える。\n\nしかし、早さが必要だとはいっても、適切な判断ができなければ意味がない。早く適切な決断ができるようになるには、瞬時に自身とは違う見方を検討し、客観的な判断ができなければならない。日頃からさまざまな価値観に触れ、多角的に物事をとらえられるようになることが必要だ。\n\n(注) 話半分に: ここでは、事実は全体の半分ぐらいだという気持ちで","questions":[{"q":"「決める力」のある人について、AとBはどのように述べているか。","options":["AもBも、時間を十分にかけて慎重に判断すると述べている。","AもBも、どのような場面でも失敗を恐れないと述べている。","Aは迷いすぎることなく適切に判断できると述べ、Bは素早く決断できると述べている。","Aは決断が早すぎたり遅すぎたりしないと述べ、Bはリスクを回避することができると述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng họ có thể đưa ra quyết định thích hợp mà không do dự quá nhiều, B nói rằng họ có thể đưa ra quyết định nhanh chóng."},{"q":"「決める力」のある人になるために必要なことについて、AとBの認識で共通していることは何か。","options":["他人の意見に惑わされてはいけない。","複数の視点から問題を検討することが大切だ。","いつも最善の結果を得ようとするべきではない。","情報を頼りにせず、自身の意見に自信を持つ 1べきだ。"],"answer":1,"explain":"Đáp án đúng: B. Điều quan trọng là xem xét vấn đề từ nhiều quan điểm."}],"trans":"A \"Người xuất sắc thường do dự trong việc đưa ra quyết định. Đó là vì họ có nhiều thông tin cần thiết để đưa ra quyết định hoặc đưa ra nhiều dự đoán khác nhau về kết quả của quyết định. Người có \"khả năng quyết định\" là người có thể sử dụng hợp lý nhiều thông tin và dự đoán kết quả tốt nhất. Người đưa ra quyết định nhanh chóng và dứt khoát có vẻ là người có khả năng quyết đoán, nhưng nếu họ gây ra kết quả tồi tệ nhất bằng một quyết định thiếu thận trọng, thì không thể nói rằng họ có khả năng quyết định. Và người đưa ra quyết định sau khi suy nghĩ kỹ lưỡng có vẻ là người thận trọng, nhưng nếu họ chỉ do dự, họ sẽ không đạt được kết quả tốt. (lược bỏ) Làm thế nào để trở thành người có \"khả năng quyết định\"? Họ lắng nghe ý kiến của những người bạn thân thiết xung quanh một cách hời hợt (chú thích) vì chúng không khác nhau nhiều, và họ tổng hợp và sắp xếp ý kiến của nhiều người khác nhau về chuyên môn và giá trị quan. Sau đó, việc tự mình đưa ra quyết định cuối cùng là cách làm của người có \"khả năng quyết định\".\"\n\nB:\n\n\"Trong thời đại tràn ngập thông tin ngày nay, người ta dễ rơi vào tình trạng không thể đưa ra quyết định vì có quá nhiều lựa chọn. Càng tìm kiếm thông tin để đạt được kết quả tốt nhất, người ta càng biết đến khả năng rủi ro, và quyết định ngày càng chậm trễ khi người ta do dự và lặp lại việc xem xét. Tuy nhiên, bất kỳ quyết định nào cũng luôn có mặt tiêu cực. Vì vậy, người đưa ra quyết định nhanh chóng mà không sợ thất bại hơn là người dành quá nhiều thời gian có thể được gọi là người có \"khả năng quyết định\". Tuy nhiên, ngay cả khi cần nhanh chóng, sẽ vô nghĩa nếu không thể đưa ra quyết định thích hợp. Để có thể đưa ra quyết định thích hợp nhanh chóng, người ta phải xem xét ngay lập tức các quan điểm khác với quan điểm của bản thân và có thể đưa ra quyết định khách quan. Điều cần thiết là phải tiếp xúc với nhiều giá trị quan khác nhau hàng ngày và có thể nhìn nhận sự vật từ nhiều góc độ.\"\n\nChú thích:\n\n(注) 話半分に : ở đây có nghĩa là cảm giác rằng sự thật chỉ bằng khoảng một nửa toàn bộ câu chuyện"},{"source":"Mon11","bai":30,"date":"12/2019","title":"Mon11 - Bài 30 (12/2019)","passage":"A\n\n褒めれば人は育つといいます。確かに人間は叱られるより、認められたり褒められたほうが嬉しいに決まっていますし、「よし、次もがんばろう」とやる気も出るものです。リーダーだって、普段からガミガミ言うより、部下を褒めるほうが自分自身の気分も良いでしょう。\n\nしかし褒めてばかりいると、今度は思わぬ弊害が出てくると私は考えています。確かに部下の士気は上がるのですが、逆に褒められることが目的になりかねない。「お前は偉いな」と課長に褒められたいから、仕事を一生懸命にやるようになってしまうのです。\n\n（中略）\n\n「良くやった」「偉いな」などという言葉は、たまに言うから効果的なのであって、日常的に口にしていたら効果は半減してしまうでしょう。要は褒めるところと叱るところ、リーダーはいつも人を見てバランスを考えなくてはなりません。\n\nB\n\n部下のやる気を引き出すようにうまく褒めるのは難しい。的外れな褒め方をすれば「自分をよく見ていない」と不信感を抱かせてしまうし、皆の前で特定の人ばかりを褒めれば、チーム内の関係が悪化してしまうこともある。さらに褒め続けることで、部下が、仕事への責任感や使命感からではなく、上司に褒められることを目的にがんばるという状態になってしまう恐れがある。\n\nこのような事態を避けるために、上司には適切に褒める技術が求められる。部下が良い仕事をしたら、タイミングを逃さずその場で褒めることが効果的だ。また、成果だけを褒めるのではなく、仕事の過程の中で何が良かったかを取り上げて褒めることが重要だ。そうすれば、部下も評価された点を明確に自覚でき、次の仕事につなげやすくなる。","questions":[{"q":"部下を褒めすぎることの問題点として、AとBが共通して述べていることは何か。","options":["部下同士の人間関係が悪くなること","部下が上司に不信感を持ち、やる気をなくすこと","部下が褒められるために仕事をするようになること","部下が仕事で成果を上げることだけを目標にすること"],"answer":2,"explain":"Đáp án đúng: C. Cấp dưới làm việc để được khen ngợi."},{"q":"部下への接し方について、AとBはどのように述べているか。","options":["Aは状況に応じて褒めたり叱ったりすることが必要だと述べ、Bは良い点をすぐに褒めることが大切だと述べている。","Aは叱った後には褒めるようにしたほうがいいと述べ、Bは適切なタイミングで褒めることが大切だと述べている。","Aはできるだけ叱るのをやめるべきだと述べ、Bは良いと思った点を率直に表現したほうがいいと述べている。","Aは分かりやすい言葉で褒めることが大切だと述べ、Bは仕事の過程の中で良かった点を褒めたほうがいいと述べている。"],"answer":0,"explain":"Đáp án đúng: A. A nói rằng cần khen ngợi hoặc khiển trách tùy theo tình huống, B nói rằng điều quan trọng là khen ngợi những điểm tốt ngay lập tức."}],"trans":"A \"Người ta nói rằng khen ngợi sẽ giúp con người phát triển. Chắc chắn rằng con người sẽ vui hơn khi được công nhận hoặc khen ngợi hơn là bị mắng, và họ sẽ có động lực để nghĩ rằng \"tốt, mình sẽ cố gắng hết sức lần sau\". Ngay cả một người lãnh đạo cũng sẽ cảm thấy tốt hơn khi khen ngợi cấp dưới hơn là cằn nhằn hàng ngày. Tuy nhiên, tôi nghĩ rằng nếu bạn chỉ khen ngợi, bạn sẽ gặp phải những tác hại bất ngờ. Chắc chắn rằng tinh thần của cấp dưới sẽ tăng lên, nhưng ngược lại, việc được khen ngợi có thể trở thành mục đích. Họ sẽ làm việc chăm chỉ vì họ muốn được trưởng phòng khen ngợi rằng \"cậu giỏi lắm\". (lược bỏ) Những lời như \"làm tốt lắm\" hoặc \"cậu giỏi lắm\" chỉ hiệu quả khi bạn nói chúng thỉnh thoảng, và hiệu quả sẽ giảm đi một nửa nếu bạn nói chúng hàng ngày. Tóm lại, người lãnh đạo phải luôn quan sát mọi người và suy nghĩ về sự cân bằng giữa việc khen ngợi và khiển trách.\"\n\nB\n\n\"Thật khó để khen ngợi cấp dưới một cách khéo léo để khơi dậy động lực của họ. Nếu bạn khen ngợi một cách lạc lõng, họ sẽ cảm thấy nghi ngờ rằng \"anh ta không quan sát tôi kỹ\", và nếu bạn chỉ khen ngợi những người cụ thể trước mặt mọi người, mối quan hệ trong nhóm có thể xấu đi. Hơn nữa, nếu bạn tiếp tục khen ngợi, có nguy cơ cấp dưới sẽ cố gắng vì mục đích được cấp trên khen ngợi chứ không phải vì trách nhiệm và sứ mệnh đối với công việc. Để tránh tình trạng này, cấp trên cần có kỹ năng khen ngợi phù hợp. Nếu cấp dưới làm tốt công việc, sẽ hiệu quả nếu khen ngợi họ ngay tại chỗ mà không bỏ lỡ thời điểm. Ngoài ra, điều quan trọng là không chỉ khen ngợi kết quả mà còn chọn ra và khen ngợi những điểm tốt trong quá trình làm việc. Bằng cách đó, cấp dưới có thể nhận thức rõ ràng về những điểm được đánh giá và dễ dàng kết nối với công việc tiếp theo.\""},{"source":"Mon11","bai":31,"date":"12/2020","title":"Mon11 - Bài 31 (12/2020)","passage":"A\n\n変化の激しい時代に必要な頭の使い方というと、できるだけ多くの情報を集めて、できるだけ正しく未来を予測する といったことを、イメージする人は少なくないでしょう。\n\nしかし、多くの情報を集めても、世の中が予想もしない形で変わると、それらがあまり役に立たなくなってしまう可能性があります。つまり、変化の時代とは、将来が見通しにくい時代でもあるのです。このような時代に必要なのは、ただ情報をかき集めることではなく、自分なりの発想や、自分なりの考え方を組み立て、情報を処理することです。\n\n（中略）\n\n情報収集が劇的に楽になった分、「考える」ウエイトはますます重くなっています。いわば、みんなと同じ情報を材料にしながら、いかに新しく、人とは違う発想で、おもしろいことを考えつくか、そういった点での「考える」力がより求められているのです。\n\nB\n\n今は多くの情報があふれ、インターネットで何でも調べられるようになった。しかし、ただ待っているだけでは何も手に入らない。あくまで自分から情報を求めていかなければ、あっという間に取り残されてしまう。\n\n技術が高度に発展した現代では、ゼロから何かを生み出したり、人とは異なるものを考え出すのは困難だと思うかもしれない。しかし、独自の視点を持って既存のものやアイデアを組み合わせていくことで、これまでになかったものを創造することは可能だ。そのためにもやはり、土台となる情報が必要だ。現代は、どれだけ多くの情報を手にしているかで決まるといっても過言ではない。","questions":[{"q":"多くの情報を集めることについて、AとBはどのように述べているか。","options":["AもBも、重要だと述べている。","AもBも、それだけでは十分ではないと述べている。","Aは重要だと述べ、Bはそれだけでは十分ではないと述べている。","Aはそれだけでは十分ではないと述べ、Bは重要だと述べている。"],"answer":3,"explain":"Đáp án đúng: D. A nói rằng chỉ điều đó thôi là chưa đủ, B nói rằng điều đó là quan trọng."},{"q":"これからの時代に必要なことについて、AとBの認識で共通していることは何か。","options":["情報機器を活用して、新しいものを作り出すこと","自分にとって、有用な情報を見極めること","世の中の変化を正確に予測すること","独創的なアイデアを持つこと"],"answer":3,"explain":"Đáp án đúng: D. Có những ý tưởng độc đáo."}],"trans":"A:\n\n\"Khi nói đến cách sử dụng đầu óc cần thiết trong một thời đại thay đổi nhanh chóng, không ít người hình dung rằng đó là việc thu thập càng nhiều thông tin càng tốt và dự đoán tương lai chính xác nhất có thể. Tuy nhiên, ngay cả khi bạn thu thập nhiều thông tin, nếu thế giới thay đổi theo những cách không ngờ tới, những thông tin đó có thể trở nên không hữu ích lắm. Nói cách khác, thời đại thay đổi cũng là thời đại khó dự đoán tương lai. Điều cần thiết trong một thời đại như vậy không phải là chỉ thu thập thông tin, mà là xây dựng những ý tưởng và cách suy nghĩ của riêng bạn, đồng thời xử lý thông tin. (lược bỏ) Vì việc thu thập thông tin trở nên dễ dàng hơn đáng kể, nên trọng lượng của việc \"suy nghĩ\" ngày càng tăng lên. Nói cách khác, trong khi sử dụng cùng một thông tin làm nguyên liệu, điều quan trọng hơn là suy nghĩ ra những điều mới mẻ, khác biệt với người khác và thú vị, tức là sức mạnh của việc \"suy nghĩ\".\"\n\nB:\n\n\"Ngày nay, có rất nhiều thông tin và bạn có thể tìm kiếm mọi thứ trên internet. Tuy nhiên, bạn sẽ không nhận được gì nếu chỉ chờ đợi. Bạn phải chủ động tìm kiếm thông tin, nếu không bạn sẽ nhanh chóng bị bỏ lại phía sau. Trong thời đại mà công nghệ phát triển cao độ, bạn có thể nghĩ rằng khó có thể tạo ra thứ gì đó từ con số không hoặc nghĩ ra những thứ khác biệt với người khác. Tuy nhiên, bạn có thể tạo ra những thứ chưa từng có trước đây bằng cách kết hợp những thứ và ý tưởng hiện có với quan điểm độc đáo của riêng bạn. Để làm được điều đó, thông tin nền tảng là điều cần thiết. Có thể nói rằng thời đại ngày nay được quyết định bởi việc bạn có bao nhiêu thông tin.\""},{"source":"Mon11","bai":32,"date":"07/2021","title":"Mon11 - Bài 32 (07/2021)","passage":"A\n\n企業の採用試験では、必ず志望動機を書いて提出する。もちろん仕事を希望する理由を書くのだが、大切な点が抜けている場合がある。「なぜ、その会社でなければならないのか」が明確に書かれていない場合だ。例えば、出版社への応募書類で、志望動機として「感動させる本が作りたい」としか書かれていなかったら、この人は出版社に入りたいだけで、その出版社に入りたいわけではないと思われてしまうだろう。他社ではなく、どうしてもその会社に入りたいという強い意志を相手に伝えることが重要だ。そのためには、まずは情報収集が欠かせない。特徴や経営方針を正しく理解したうえで、自分がその会社でどのような仕事ができるかという視点でまとめていく。そうすれば、なぜその会社なのかが明確な志望動機が書けるだろう。\n\nB\n\n就職試験において、志望動機はどのように書けばいいのか。自分の能力や経験を最大限にアピールすることが重要だと思うかもしれないが、それらを入社後にどのように生かせるかを書かなければ、説得力のある志望動機だとは言えない。\n\n特に、規模や製品、経営者など、企業の特徴のようなホームページを見れば分かる情報を、ただ並べて書くだけでは、意欲は伝わらない。具体的な業務の内容に触れながら、自分の能力や経験と結びつけて説明することが必要だ。業務の内容をよく調べ、その企業で求められている能力や技術を分析して、それらの要求に自分が応じられるということをアピールするべきだ。","questions":[{"q":"よくない志望動機の問題点について、AとBはどのように述べているか。","options":["AもBも、誰でも容易に調べられる企業や製品の情報しか書かれていないことだと述べている。","AもBも、入りたいという希望だけが書かれていて、その企業の特徴が分析されていないことだと述べている。","Aはその企業でなければならない理由が書かれていないことだと述べ、Bはその企業の業務内容について書かれていないことだと述べている。","Aはその企業に入りたいという意志が感じられないことだと述べ、Bは自分のしたい業務しか書かれていないことだと述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng nó không viết lý do tại sao phải là công ty đó, B nói rằng nó không viết về nội dung công việc của công ty đó."},{"q":"志望動機を書く際に、AとBが共通して重要だと述べていることは何か。","options":["企業の経営方針や製品などを批判しないこと。","他の企業の情報も集めて、比較しながら書くこと。","自分の能力や経験を正確に書くこと。","自分がその企業にどう貢献できるかを考えて書くこと。"],"answer":3,"explain":"Đáp án đúng: D. Viết trong khi suy nghĩ về cách bạn có thể đóng góp cho công ty đó."}],"trans":"A:\n\n\"Trong các kỳ thi tuyển dụng của công ty, người ta luôn viết và nộp động lực ứng tuyển. Tất nhiên, họ viết lý do mong muốn làm việc, nhưng có những trường hợp thiếu điểm quan trọng. Đó là trường hợp mà \"Tại sao phải là công ty đó?\" không được viết rõ ràng. Ví dụ, trong hồ sơ ứng tuyển vào nhà xuất bản, nếu động lực ứng tuyển chỉ viết là \"Tôi muốn tạo ra những cuốn sách gây xúc động\", người ta sẽ nghĩ rằng người này chỉ muốn vào nhà xuất bản chứ không phải muốn vào nhà xuất bản đó. Điều quan trọng là truyền đạt cho đối phương ý chí mạnh mẽ rằng bạn nhất định muốn vào công ty đó chứ không phải công ty khác. Để làm được điều đó, trước hết việc thu thập thông tin là không thể thiếu. Sau khi hiểu đúng đặc điểm và phương châm kinh doanh, bạn sẽ tổng hợp chúng từ góc độ bạn có thể làm loại công việc nào ở công ty đó. Bằng cách đó, bạn sẽ có thể viết động lực ứng tuyển rõ ràng lý do tại sao lại là công ty đó.\"\n\nB:\n\n\"Trong kỳ thi tuyển dụng, làm thế nào để viết động lực ứng tuyển? Bạn có thể nghĩ rằng điều quan trọng là thể hiện tối đa khả năng và kinh nghiệm của mình, nhưng nếu bạn không viết cách bạn có thể phát huy chúng sau khi vào công ty, thì không thể nói đó là một động lực ứng tuyển thuyết phục. Đặc biệt, nếu bạn chỉ viết ra những thông tin mà bạn có thể thấy trên trang chủ, chẳng hạn như đặc điểm của công ty như quy mô, sản phẩm và người điều hành, thì ý chí của bạn sẽ không được truyền đạt. Cần phải giải thích bằng cách đề cập đến nội dung công việc cụ thể và liên kết nó với khả năng và kinh nghiệm của bạn. Bạn nên tìm hiểu kỹ nội dung công việc, phân tích khả năng và kỹ thuật mà công ty đó yêu cầu, đồng thời thể hiện rằng bạn có thể đáp ứng những yêu cầu đó.\""},{"source":"Mon11","bai":18,"date":"12/2021","title":"Mon11 - Bài 18 (12/2021)","passage":"A\n\n1月15日(株)ファッション・ベル 代表取締役 橋田直子 殿(株)A&Bビル開発 事業部長 前田一郎拝啓 貴店におかれましてはますますご繁栄のこととお慶び申し上げます。\n\nさて、弊社では昨年来、岸本駅前に7階建て貸しビル「岸本タウンビル」を建設中でございますが、来る8月末の完成を予定いたしております。「岸本タウンビル」は、伝統ある岸本商店街を若者層にもよりアピールすることを目指し、ただ今、テナント出店の募集をいたしております。\n\nつきましては、岸本商店街を長く支えられ、商店街の顔とも言われる貴店にもぜひご出店お願いできればと存じます。当ビルは貴店の現店舗より駅に近く、いっそうのご集客に貢献できることと存じます。ここに出店募集要項を同封させていただきますので、ご検討の上お申し込みを賜りますようお願い申し上げます。\n\nまずは、書面をもちましてご案内かたがた、お願いを申し上げます。\n\n敬具\n\nB\n\n(株)A&Bビル開発 事業部長 前田一郎 殿(株)ファッション・ベル 代表取締役 橋田直子拝啓 厳寒の候、貴社にはますますご発展のこととお喜び申し上げます。\n\nこのたび、貴社のテナント募集にあたり、弊店にもお声をかけて頂きましてありがとうございます。岸本商店街の活性化のため、若者にアピールする商店街にしたいという貴社の方針心より賛同し、出店の方向で検討させていただ いているところです。\n\nただ、弊店には現在の平屋になじんだ年配のお客様も多くいらっしゃることから、開店場所については、申込用紙にも記入いたしましたように、弊店の客層に合うよう階または2階のエスカレーター付近を希望しております。いずれ具体的なことを直接相談申し上げたく存じますが、どうか格別のご配慮をいただければ幸いでございます。\n\nまずは、書面にてお願いいたします。","questions":[{"q":"Aの手紙文の目的は何か。","options":["岸本駅前の新しいビルに店を出したいので、良い場所を貸してほしいと頼んでいる。","岸本駅前に完成予定の新しいビルへの出店を呼びかけ、申し込みをお願いしている。","岸本駅前に建設中の新しいビルに、一緒に出店して共同経営をしようと誘っている。","岸本駅前に新しくできるビルに「若者層を呼び込むアイデア募集のお願いをしている。"],"answer":1,"explain":"Đáp án đúng: B. Kêu gọi đăng ký mở cửa hàng trong tòa nhà mới dự kiến hoàn thành trước ga Kishimoto."},{"q":"Aの依頼に応じる条件として、Bではどんなことを挙げているか。","options":["若い客層を考えてエスカレーター近くに出店できること","年配客が来店しやすいような場所を確保してくれること","商店街にある現店舗よりも多くの集客をしてくれること","若者にアピールするような品物を売ることができること"],"answer":1,"explain":"Đáp án đúng: B. Đảm bảo địa điểm dễ dàng cho khách hàng lớn tuổi đến cửa hàng."},{"q":"橋田さんからの返事(B)に対して前田さんがさらに返信するときは、前田さんはまずどのようなことを書くべきか。","options":["テナント出店募集のお礼と、集客方法のアイデア募集について","年配客層へのアピールの感謝と、これまでの出店応募数について","出店応募のお礼と、Bの希望する条件に対する検討結果について","申込用紙送付のお願いと、エスカレーターの位置の案内について"],"answer":2,"explain":"Đáp án đúng: C. Cảm ơn về đơn đăng ký cửa hàng và kết quả xem xét các điều kiện mà B mong muốn."}],"trans":"A Ngày 15 tháng 1\n\nKính gửi Bà Hashida Naoko, Giám đốc đại diện Công ty TNHH Thời trang Bell\n\nTừ ông Maeda Ichiro, Trưởng phòng Kinh doanh Phát triển Tòa nhà A&B\n\nKính gửi quý cửa hàng, tôi xin bày tỏ sự vui mừng trước sự thịnh vượng ngày càng tăng của quý cửa hàng.\n\nGần đây, công ty chúng tôi đang xây dựng tòa nhà cho thuê 7 tầng \"Tòa nhà Thị trấn Kishimoto\" trước ga Kishimoto, và dự kiến sẽ hoàn thành vào cuối tháng 8 tới. \"Tòa nhà Thị trấn Kishimoto\" nhằm mục đích thu hút tầng lớp thanh niên đến khu mua sắm Kishimoto truyền thống, và hiện chúng tôi đang tuyển dụng người thuê cửa hàng.\n\nDo đó, chúng tôi hy vọng rằng quý cửa hàng, vốn đã hỗ trợ khu mua sắm Kishimoto trong một thời gian dài và được coi là bộ mặt của khu mua sắm, cũng sẽ mở cửa hàng. Tòa nhà của chúng tôi gần ga hơn cửa hàng hiện tại của quý cửa hàng và chúng tôi tin rằng nó có thể góp phần thu hút nhiều khách hàng hơn.\n\nChúng tôi xin gửi kèm theo các yêu cầu tuyển dụng cửa hàng tại đây, vì vậy chúng tôi mong quý vị xem xét và đăng ký.\n\nTrước hết, tôi xin gửi thư này để thông báo và đưa ra yêu cầu của chúng tôi.\n\nTrân trọng,\n\nB\n\nKính gửi ông Maeda Ichiro, Trưởng phòng Kinh doanh Phát triển Tòa nhà A&B Công ty TNHH\n\nTừ bà Hashida Naoko, Giám đốc đại diện Công ty TNHH Thời trang Bell\n\nKính gửi quý công ty, tôi xin bày tỏ sự vui mừng trước sự phát triển ngày càng tăng của quý công ty trong thời tiết lạnh giá.\n\nCảm ơn quý công ty đã liên hệ với cửa hàng của chúng tôi khi tuyển dụng người thuê cửa hàng.\n\nChúng tôi hoàn toàn đồng ý với chính sách của quý công ty là hồi sinh khu mua sắm Kishimoto và biến nó thành một khu mua sắm thu hút giới trẻ, và chúng tôi đang xem xét việc mở cửa hàng.\n\nTuy nhiên, vì cửa hàng của chúng tôi có nhiều khách hàng lớn tuổi quen với ngôi nhà một tầng hiện tại, nên chúng tôi hy vọng tầng một hoặc gần thang cuốn ở tầng hai, như đã ghi trong mẫu đơn đăng ký, để phù hợp với đối tượng khách hàng của cửa hàng chúng tôi. Chúng tôi muốn thảo luận trực tiếp về các chi tiết cụ thể, nhưng chúng tôi sẽ rất biết ơn nếu quý vị có thể đặc biệt quan tâm đến chúng tôi.\n\nTrước hết, tôi xin gửi thư này để thông báo.\n\nTrân trọng,"},{"source":"Mon11","bai":19,"date":"07/2022","title":"Mon11 - Bài 19 (07/2022)","passage":"A\n\nビジネスで相手をうまく説得したいとは誰もが思うことだろう。私が最も意識しているのは、相手の性格や価値観、知的水準などに応じた説明のしかたをすることだ。具体的で明快な例を決める人もいるし、データに基づいた緻密な説明を好む人もいる。さまざまなタイプに合わせて対応することで、説得力を高められるように努めている。\n\nただ、どのような相手でも、まずは話を聞いてもらえなければ意味がない。そのためには、話し方や服装などの最低限のマナーは身につけておかなければならない。中身のある話ができればいいとこれらを軽視する人もいるが、初対面で悪い印象を持たれてしまうと、そもそも話を聞こうとは思ってもらえず大きなマイナスになってしまうからだ。もちろん相手の印象を気にしすぎるのは問題だが、いい印象を持ってもらうことはプラスに働くことも多いと思う。\n\nB\n\n説得力を高めるための第一歩は、「送り手」としての自分自身の信頼度を高めること。「この人は信用できそう」といった印象を与えることです。多くのビジネスパーソンが服装や言葉づかいを気にするのも、信頼できる印象を与えたいからに他なりません。\n\n何よりも重要なのは、説得内容に関連した知識や情報を十分に吸収し、専門性を高めておくことです。（中略）\n\n仕事に関連する情報というのは、日常生活の至る場面に転がっています。街を歩いていても、ショッピングモールや行楽地に出かけても、人々の行動パターンやライフスタイル（注）を知るヒントが見つかります。専門的知識や情報を生活に密着した形で提示することができれば、より説得力が増すはずです。説得力のある人には日頃から研究熱心な人が多いのもそのためです。\n\n好印象も説得力につながります。人の話に耳を傾け、言葉と心のキャッチボールができる人は、間違いなく好印象を与えます。\n\n(注) ライフスタイル: 生活様式","questions":[{"q":"AとBの認識で共通していることは何か。","options":["初対面の印象を変えるのは難しい。","態度や服装も相手が持つ印象に影響を与える。","相手が持つ印象を気にしすぎないほうがいい。","信頼度は、自分自身の努力だけでは高められない。"],"answer":1,"explain":"Đáp án đúng: B. Thái độ và trang phục cũng ảnh hưởng đến ấn tượng mà đối phương có."},{"q":"説得力を高めるために必要なことについて、AとBはどのように述べているか。","options":["AもBも、専門性の高い説明ではなく、日常生活の身近な例を挙げて説明することだと述べている。","AもBも、相手の要求を理解するために、話をしっかり聞くことだと述べている。","Aは相手に合わせた説明をすることだと述べ、Bは専門的知識や情報を多く集めて生活に結び付けながら説明することだと述べている。","Aは相手の求める内容を的確に説明することだと述べ、Bは相手に合わて情報量を調整することだと述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng nên đưa ra lời giải thích phù hợp với đối phương, B nói rằng nên thu thập nhiều kiến thức và thông tin chuyên môn và giải thích trong khi liên kết chúng với cuộc sống."}],"trans":"A:\n\n\"Chắc hẳn ai cũng muốn thuyết phục đối phương thành công trong kinh doanh. Điều tôi ý thức nhất là cách giải thích phù hợp với tính cách, giá trị quan, trình độ tri thức, v.v. của đối phương. Có người thích những ví dụ cụ thể và rõ ràng, có người thích những lời giải thích tỉ mỉ dựa trên dữ liệu. Tôi cố gắng nâng cao khả năng thuyết phục bằng cách đáp ứng các loại hình khác nhau. Tuy nhiên, dù đối phương là ai, trước hết nếu họ không chịu lắng nghe câu chuyện thì cũng vô nghĩa. Để làm được điều đó, cần phải có những phép tắc tối thiểu như cách nói chuyện và trang phục. Có người coi thường những điều này và nghĩ rằng chỉ cần có một câu chuyện nội dung là đủ, nhưng nếu bạn có ấn tượng xấu trong lần gặp đầu tiên, họ sẽ không nghĩ đến việc lắng nghe câu chuyện ngay từ đầu, và đó sẽ là một bất lợi lớn. Tất nhiên, việc quá quan tâm đến ấn tượng của đối phương là một vấn đề, nhưng tôi nghĩ rằng việc tạo ấn tượng tốt thường có tác dụng tích cực.\"\n\nB:\n\n\"Bước đầu tiên để nâng cao khả năng thuyết phục là nâng cao độ tin cậy của bản thân với tư cách là \"người gửi\". Đó là việc tạo ấn tượng rằng \"người này có vẻ đáng tin cậy\". Việc nhiều doanh nhân quan tâm đến trang phục và cách sử dụng ngôn từ cũng không khác gì việc muốn tạo ấn tượng đáng tin cậy. Điều quan trọng hơn hết là tiếp thu đầy đủ kiến thức và thông tin liên quan đến nội dung thuyết phục và nâng cao tính chuyên môn. (lược bỏ) Thông tin liên quan đến công việc nằm rải rác ở mọi nơi trong cuộc sống hàng ngày. Ngay cả khi bạn đang đi bộ trên phố, hoặc đi đến trung tâm mua sắm hoặc khu vui chơi, bạn cũng có thể tìm thấy gợi ý để biết về mô hình hành vi và phong cách sống (chú thích) của mọi người. Nếu bạn có thể trình bày kiến thức và thông tin chuyên môn dưới hình thức gắn liền với cuộc sống, khả năng thuyết phục sẽ tăng lên. Đó là lý do tại sao có nhiều người chăm chỉ nghiên cứu trong cuộc sống hàng ngày trong số những người có khả năng thuyết phục. Ấn tượng tốt cũng dẫn đến khả năng thuyết phục. Người có thể lắng nghe câu chuyện của người khác và trao đổi ngôn từ và trái tim chắc chắn sẽ tạo ấn tượng tốt.\"\n\nChú thích:\n\n(注) ライフスタイル : lối sống"},{"source":"Mon11","bai":20,"date":"12/2022","title":"Mon11 - Bài 20 (12/2022)","passage":"A\n\n勉強やスポーツなど何かに取り組んでいる時にスランプはつきもの（注）だ。いつもどおりしているのに、全く成果が上がらない。そんな時間が続くと、自分には能力が足りないのではないか、これ以上は上達しないのではないかと自信を失ってしまう。\n\nしかし、スランプとは一時的に調子が悪くなっている状態にすぎない。誰にでも調子の良い時と悪い時があり、それは波のようにやってくる。悪い時にはそれを乗り越えようともがくのではなく、波に身を任せるようにするといい。現状をすなおに受け止め、これまでと同じことをやり続けるのだ。そうして自然に波を乗り越えれば、またやる気も自信も戻ってくる。そうすれば、自然に次にやるべきことも見えてくるものだ。\n\nB\n\nスランプの状態になると、調子が良かった過去と比べてしまいます。だから、その差にショックを受けてしまって、自信を無くしてしまうわけですね。調子の波があることは普通なので、良い時と比べるのは止めましょう。\n\nそれよりも、今に集中することの方が大切です。今の自分を受け入れて、「これからどうするべきか」ということを考えてください。こういう考え方ができれば、前向きに物事を捉えることができるはずです。\n\nいつまでも過去に捉われている人は、後悔や焦りといった感情しか出てきません。しかし、今を見ている人だと、「どうすればいいか」という生産的な考え方ができるわけですね。\n\n(注) つきもの：当然あるもの","questions":[{"q":"スランプの時に落ち込んでしまう原因について、AとBはどのように述べているか。","options":["AもBも、成果が上がらない原因を考えすぎてしまうからだと述べている。","AもBも、過去の状態と比較して、焦ってしまうからだと述べている。","Aは何が悪いのかが分からないからだと述べ、Bは調子が良い人と比較してしまうからだと述べている。","Aは能力の限界だと思ってしまうからだと述べ、Bは良かった時と比較してしまうからだと述べている。"],"answer":3,"explain":"Đáp án đúng: D. A nói rằng đó là vì họ nghĩ rằng đó là giới hạn khả năng của mình, B nói rằng đó là vì họ so sánh với những lúc tốt đẹp."},{"q":"AとBは、スランプの時はどのようにするのがいいと述べているか。","options":["AもBも、現状を維持しながら、調子が良くなるのを待てばいいと述べている。","AもBも、成果を上げるための方法を考えたほうがいいと述べている。","Aはやる気や自信を取り戻すまで待ったほうがいいと述べ、Bは今の状態を受け入れて、自然に任せていればいいと述べている。","Aは特別なことは何もしなくてもいいと述べ、Bは現状を認めて、今後どうするべきかを考えたほうがいいと述べている。"],"answer":3,"explain":"Đáp án đúng: D. A nói rằng bạn không cần phải làm bất cứ điều gì đặc biệt, B nói rằng bạn nên thừa nhận hiện trạng và nghĩ về những gì bạn nên làm trong tương lai."}],"trans":"A:\n\nKhi bạn đang làm việc gì đó như học tập hay thể thao, tình trạng sa sút phong độ là điều không thể tránh khỏi (chú thích). Mặc dù bạn đang làm mọi thứ như bình thường, nhưng bạn hoàn toàn không đạt được kết quả nào. Nếu thời gian như vậy tiếp tục, bạn sẽ mất tự tin và nghĩ rằng mình không đủ khả năng hoặc mình sẽ không tiến bộ hơn nữa. Tuy nhiên, tình trạng sa sút phong độ chỉ là trạng thái tạm thời kém phong độ. Bất kỳ ai cũng có lúc phong độ tốt và lúc phong độ kém, và chúng đến như những con sóng. Thay vì cố gắng vượt qua nó khi bạn đang ở trong tình trạng xấu, bạn nên để bản thân trôi theo con sóng. Hãy chấp nhận tình hình hiện tại một cách thẳng thắn và tiếp tục làm những điều bạn đã làm cho đến nay. Bằng cách đó, nếu bạn tự nhiên vượt qua con sóng, động lực và sự tự tin của bạn sẽ quay trở lại. Bằng cách đó, bạn sẽ tự nhiên nhìn thấy những gì bạn nên làm tiếp theo.\n\nB:\n\nKhi bạn đang ở trong tình trạng sa sút phong độ, bạn sẽ so sánh mình với quá khứ khi bạn có phong độ tốt. Đó là lý do tại sao bạn bị sốc trước sự khác biệt đó và mất tự tin. Việc có những con sóng phong độ là điều bình thường, vì vậy hãy ngừng so sánh với những lúc tốt đẹp. Thay vào đó, tập trung vào hiện tại quan trọng hơn. Hãy chấp nhận con người hiện tại của bạn và suy nghĩ về \"bạn nên làm gì từ bây giờ\". Nếu bạn có thể suy nghĩ theo cách này, bạn sẽ có thể nhìn nhận mọi thứ một cách tích cực. Những người luôn bị mắc kẹt trong quá khứ chỉ có những cảm xúc như hối tiếc và lo lắng. Tuy nhiên, những người nhìn vào hiện tại có thể có những suy nghĩ mang tính xây dựng như \"tôi nên làm gì\".\n\nChú thích:\n\n(注) つきもの : điều hiển nhiên tồn tại, điều tất yếu luôn đi kèm."},{"source":"Mon11","bai":21,"date":"07/2023","title":"Mon11 - Bài 21 (07/2023)","passage":"A\n\n私は普段からメモ魔（注）ですが、人の講演に行くと、必死にメモを取りながら話を聞きます。せっかくその場にいるのだから、最大限吸収して帰ろうと考えます。あるいは友達とくだらない話をしている時でも、「あれ？」と思ったことや、「いい話だ」と思ったことは、何でもその場でメモを取るようにしています。そこで感じた何かや、新しく知り得たものは、別の機会に自分の役に立つかもしれないからです。\n\n新しい発想や考え方のヒントを得たいといつも問題意識を持っていれば、何気ない人の発言のなかにも発見があるはずです。メモを取らなければ忘れてしまいますので、必然的にメモを取ることになります。手を動かして、記録を取る結果、記憶にも残りやすくなります。こうして意識化・可視化することが大切なのです。\n\nB\n\n話を聞いている時に、視線も上げずにただひたすらメモを取っている人がいる。熱心さは伝わるが、質問もされないと興味や関心を持って聞いてもらえているのか不安になる。このような人は、メモを取ることが目的になってしまっているのではないか。多くの情報を正確に書きとることに集中してしまい、肝心な内容が頭に入っていないのだ。\n\nしかしどんなに正確にメモを取ったとしても、内容が理解できていなければ、あとでメモを活かすこともできない。受け身ではなく、自分に必要な情報は何か、自分だったらどうするかというように自分と関連付けて、主体的に考えながら聞くことが必要だ。メモは、あとで話を整理する際の手がかりになれば十分である。\n\n(注)メモ魔: 何でもメモを取る人","questions":[{"q":"メモを取ることについて、AとBはどのように述べているか。","options":["AもBも、量よりも書きとる内容を意識して取ることが重要だと述べている。","AもBも、できるだけ多くの情報を正確に書き取ったほうがいいと述べている。","Aは内容を活用するために必要だと述べ、Bは取ることに集中し過ぎては意味がないと述べている。","Aは問題点や感想なども一緒に記入したほうがいいと述べ、Bは話の内容を理解していなければ正確には取れないと述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng nó cần thiết để tận dụng nội dung, B nói rằng vô nghĩa nếu quá tập trung vào việc ghi chú."},{"q":"話の聞き方について、AとBの認識で共通していることは何か。","options":["何かを得ようという姿勢で聞くことが重要だ。","その場ですべてを理解しようとしなくてもいい。","手を動かしながら聞いたほうが、記憶に残りやすい。","興味や関心を示し、話し手に安心感を与えることが大切だ。"],"answer":0,"explain":"Đáp án đúng: A. Điều quan trọng là lắng nghe với thái độ muốn đạt được điều gì đó."}],"trans":"A : \"Tôi có thói quen ghi chú từ trước đến nay (chú thích), nhưng khi đi nghe diễn thuyết của người khác, tôi sẽ vừa nghe vừa ghi chú một cách chăm chú. Tôi nghĩ rằng vì mình đã có mặt ở đó, mình sẽ hấp thụ tối đa và trở về. Hoặc ngay cả khi tôi đang nói chuyện vô bổ với bạn bè, tôi cũng cố gắng ghi chú ngay tại chỗ bất cứ điều gì tôi nghĩ \"ồ?\" hoặc bất cứ điều gì tôi nghĩ \"một câu chuyện hay\". Bởi vì những gì tôi cảm thấy ở đó hoặc những gì tôi mới biết có thể hữu ích cho tôi vào một dịp khác. Nếu tôi luôn có ý thức vấn đề rằng tôi muốn có được gợi ý cho những ý tưởng và cách suy nghĩ mới, tôi sẽ tìm thấy những khám phá ngay cả trong những lời nói tình cờ của mọi người. Vì tôi sẽ quên nếu tôi không ghi chú, tôi sẽ nhất thiết phải ghi chú. Kết quả là ghi lại bằng cách di chuyển tay, nó cũng sẽ dễ nhớ hơn. Điều quan trọng là phải nhận thức và hình dung hóa theo cách này.\"\n\nB : \"Có những người chỉ ghi chú chăm chú mà không ngước nhìn lên khi nghe câu chuyện. Sự nhiệt tình được truyền tải, nhưng tôi cảm thấy lo lắng rằng họ có đang lắng nghe với sự quan tâm hay không nếu họ không đặt câu hỏi. Những người như vậy có lẽ đã biến việc ghi chú thành mục đích. Họ quá tập trung vào việc ghi lại chính xác nhiều thông tin, và nội dung quan trọng không được lưu vào đầu. Tuy nhiên, cho dù bạn ghi chú chính xác đến đâu, bạn cũng không thể tận dụng ghi chú sau này nếu bạn không hiểu nội dung. Thay vì thụ động, bạn cần phải lắng nghe trong khi chủ động suy nghĩ, chẳng hạn như thông tin nào là cần thiết cho bạn, bạn sẽ làm gì nếu bạn là mình, v.v. Ghi chú chỉ cần là manh mối để sắp xếp câu chuyện sau này.\"\n\nChú thích:\n\n(注) メモ魔 : người có thói quen ghi chú mọi thứ"},{"source":"Mon11","bai":22,"date":"12/2023","title":"Mon11 - Bài 22 (12/2023)","passage":"A\n\n小説を書こうとしている人やすでに何作か書いたことのある人が、よく私にテクニック面での質問をしてくるけれど、そういうとき私は「あなたが技術や手法について誰かに訊くたびに小説はあなたから離れていく」と答えることにしている。\n\n（中略）\n\n自分の小説の行き詰まりをテクニック不足が原因だと考える人は「小説の書き方マニュアル」を信じる律儀さと同じで、たしかに真面目で素直ないい人ではあるのだろうが、本当に自分が書きたいことが何なのかをきちんと考えていないという意味で、怠けているということになる。小説の中身と表現・手法・技術の関係は何重にも重なり込まれたもので、厳密に論じだしたらキリがないが、まずはそんな面倒なことは考えずに、「本当に書きたいことだったらテクニックなんか関係ない」と、シンプルに考えてほしい。\n\nB\n\n小説を書くには想像以上の気力が必要である。書くことを決めて執筆に取りかかっても、自分には技術がないから下手な文章しか書けないと手を止めてしまう人が多い。\n\nしかし、そんなことで悩んでいるくらいなら、まずはどんどん書き進めてみるべきだ。テーマとジャンルを決める、構成と展開を考える、登場人物と舞台を決めるといった必要な手順を踏んだら、あとは書き始めること、そして完結させることが何より重要なのだ。\n\nいくら面白いストーリーでも、完結させないことには小説とはいえない。短編小説でも、納得できる出来栄えでなくてもかまわない。まずは自分の力で一つの作品を書き上げることだ。それができれば、自信が生まれ次の作品につながっていく。\n\n(注1)訊く：ここでは、質問する\n\n(注2) 律儀さ：礼儀正しさ\n\n(注3)何重にも簋み込まれた：ここでは、複雑に絡み合った\n\n(注4) キリがない： 際限がない","questions":[{"q":"小説を書くときの問題点として、AとBが共通して挙げていることは何か。","options":["うまく書けないのは技術が足りないからだと考えること","他者にアドバイスを求めて、自分で考えようとしないこと","本当の小説とはどのようなものかが理解できていないこと","書くのに必要な技術や手法を身につけていると過信すること"],"answer":0,"explain":"Đáp án đúng: A. Cho rằng viết không hay là vì mình thiếu kỹ thuật."},{"q":"小説を書くために必要なことについて、AとBはどのように述べているか。","options":["AもBも、本当に書きたいことかどうかを考えながら書くことだと述べている。","AもBも、うまく書けないと思っても、怠けずに書き続けることだと述べている。","Aは自分が書きたいことを明確にすることだと述べ、Bは最後まで書き上げること だと述べている。","Aは内容と表現の関係を考えて書くことだと述べ、Bは手順に沿って書き進めてい くことだと述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng phải làm rõ điều mình muốn viết, còn B nói rằng quan trọng là viết đến cuối."}],"trans":"A Những người đang cố gắng viết tiểu thuyết hoặc đã từng viết vài tác phẩm thường đặt ra cho tôi những câu hỏi liên quan đến kỹ thuật viết. Trong những lúc đó, tôi thường trả lời rằng: \"Mỗi lần bạn tìm đến ai đó để hỏi về kỹ thuật hay thủ pháp viết, tiểu thuyết lại rời xa bạn một chút.\"\n\n(...lược...)\n\nNhững người cho rằng việc họ bị bế tắc trong quá trình viết là do thiếu kỹ thuật, thường cũng là những người tin tưởng nghiêm túc vào các “sách hướng dẫn cách viết tiểu thuyết”. Chắc chắn, họ là người chăm chỉ, ngoan ngoãn và nghiêm túc, nhưng việc họ chưa suy nghĩ một cách rõ ràng rằng mình thực sự muốn viết điều gì, nghĩa là họ đang lười biếng ở một khía cạnh khác.\n\nMối quan hệ giữa nội dung tiểu thuyết và biểu hiện, kỹ thuật, thủ pháp là điều rất phức tạp và khó bàn luận cho rõ ràng. Nhưng tôi muốn họ đơn giản hóa mọi thứ bằng cách nghĩ: “Nếu thật sự là điều mình muốn viết, thì kỹ thuật chẳng quan trọng gì cả.”\n\nB\n\nĐể viết một tiểu thuyết, cần nhiều nghị lực hơn ta tưởng. Ngay cả khi bạn đã quyết tâm viết và bắt đầu ngồi vào bàn, nhiều người vẫn dễ bỏ cuộc vì nghĩ rằng \"mình không có kỹ thuật, nên chỉ có thể viết ra những câu kém cỏi\". Tuy nhiên, nếu đã lo nghĩ đến vậy thì càng phải tiếp tục viết cho tới cùng. Sau khi hoàn tất các bước cần thiết như: Xác định chủ đề và thể loại, lên ý tưởng bố cục và diễn biến, quyết định nhân vật và bối cảnh… thì điều quan trọng nhất vẫn là bắt đầu viết và viết cho đến khi hoàn tất.\n\nDù cốt truyện có thú vị đến đâu, nếu không hoàn thành thì không thể gọi là tiểu thuyết. Ngay cả truyện ngắn, dù không hoàn hảo, cũng không sao cả. Việc đầu tiên cần làm là tự tay hoàn thành một tác phẩm. Khi làm được điều đó, bạn sẽ có thêm tự tin, và có thể bắt tay vào tác phẩm tiếp theo.\n\nChú thích:\n\n(注1) 訊く : ở đây có nghĩa là đặt câu hỏi\n\n(注2) 律儀さ : sự lễ phép, đúng mực\n\n(注3) 何重にも簇み込まれた : ở đây có nghĩa là đan xen, chồng chéo phức tạp\n\n(注4) キリがない : không có giới hạn, không có điểm dừng"},{"source":"Mon11","bai":23,"date":"07/2024","title":"Mon11 - Bài 23 (07/2024)","passage":"A\n\nまじめで責任感が強く、負けず嫌いな人は「あきらめない」傾向があります。「あきらめない」ことは、基本的にはもちろんいいことなのですが、しかし一方、あきらめたほうがよいことも、実はけっこうあるものです。\n\n一所懸命に取り組んでも、うまくいかない、成果が出ない、充足感や満足感が得られない。そうした場合は「あきらめる」というのも、十分よい選択肢になります。こうした場合の「あきらめる」とは、「やめてしまう」ということです。\n\nやめる際には、「うまくいかなかった。やめてよかったと思うのがコツでしょうね。うまくいかなかったことを悔やみつつやめるのは、避けたいものです。それでは、うまくいかなかったことが尾を引いてしまいます。「うまくいかなくてよかった」と思うくらいがちょうどいいでしょう。それができるようになると、一時的には落ち込んでも、立ち直りが早くなります。\n\nB\n\n最近は仕事で悩んでいる人に対して「無理をしないであきらめたほうがよい。」というアドバイスを目にすることがある。もちろん体調を崩してしまうような場合には途中でもやめるべきだ。\n\nしかしあきらめるということは、やれることはすべてやり尽くしたあとで考えるべきではないだろうか。困難な目標ほど簡単には達成できないものだ。だから、最初から、できなければあきらめてもいいんだという気持ちでいては、つらくなったときに頑張り続けることができない。\n\n仮にどうしてもうまくいかずにあきらめることになったとしても、精いっぱい努力した結果ならば納得できる。落ち込んだりくよくよしたりするのではなく気持ちを切り替えて、しっかり原因を考えて次に生かすことが重要だ。\n\n(注)尾を引く: ずっと残る","questions":[{"q":"あきらめることについて、AとBはどのように述べているか。","options":["AもBも、成果が出せる可能性が低い場合には、あきらめたほうがよいと述べている。","AもBも、つらくても、できるだけあきらめずに頑張ったほうがよいと述べている。","Aは状況によっては、あきらめたほうがよいこともあると述べ、Bはあきらめてもいいと思ったほうが、頑張り続けられる場合もあると述べている。","Aは努力しても結果に結びつかない場合は、あきらめたほうがよいと述べ、Bは十分にやってみるまでは、あきらめることを考えるべきではないと述べている。"],"answer":3,"explain":"Đáp án đúng: D. A nói rằng nên từ bỏ nếu bạn không thể đạt được kết quả ngay cả khi bạn nỗ lực, B nói rằng bạn không nên nghĩ đến việc từ bỏ cho đến khi bạn đã cố gắng hết sức."},{"q":"AとBの認識で共通していることは何か。","options":["あきらめることになった原因を考えるべきだ。","あきらめるのが早ければ、早く立ち直れる。","あきらめたことでも、再挑戦することはできる。","あきらめたことを後悔してはいけない。"],"answer":3,"explain":"Đáp án đúng: D. Không nên hối tiếc về những gì bạn đã từ bỏ."}],"trans":"A:\n\n\"Những người nghiêm túc, có tinh thần trách nhiệm cao và không chịu thua thường có xu hướng 'không từ bỏ'. 'Không từ bỏ' về cơ bản là một điều tốt, nhưng mặt khác, thực tế có khá nhiều điều nên từ bỏ. Ngay cả khi bạn nỗ lực hết mình, bạn vẫn không thành công, không đạt được kết quả, không đạt được cảm giác thỏa mãn. Trong những trường hợp như vậy, 'từ bỏ' cũng là một lựa chọn tốt. 'Từ bỏ' trong trường hợp này có nghĩa là 'dừng lại'. Khi dừng lại, 'điều quan trọng là nghĩ rằng mình đã không thành công và mình đã làm đúng khi dừng lại'. Nên tránh dừng lại trong khi hối tiếc vì đã không thành công. Nếu bạn làm vậy, những gì bạn không thành công sẽ kéo dài (chú thích). Tốt nhất là bạn nên nghĩ rằng 'thật tốt vì mình đã không thành công'. Nếu bạn có thể làm được điều đó, bạn sẽ nhanh chóng phục hồi, ngay cả khi bạn tạm thời suy sụp.\"\n\nB:\n\n\"Gần đây, tôi thấy lời khuyên 'bạn nên từ bỏ mà không ép buộc bản thân' cho những người đang gặp khó khăn trong công việc. Tất nhiên, bạn nên dừng lại giữa chừng nếu bạn đang bị ốm. Tuy nhiên, không phải bạn nên nghĩ đến việc từ bỏ sau khi đã làm tất cả những gì có thể sao? Những mục tiêu khó khăn không dễ dàng đạt được. Vì vậy, nếu bạn có suy nghĩ rằng 'nếu tôi không thể làm được, tôi có thể từ bỏ ngay từ đầu', bạn sẽ không thể tiếp tục cố gắng khi mọi thứ trở nên khó khăn. Giả sử bạn phải từ bỏ vì bạn không thể làm gì khác, bạn có thể chấp nhận nếu đó là kết quả của việc nỗ lực hết mình. Điều quan trọng là phải thay đổi tâm trạng, suy nghĩ kỹ về nguyên nhân và tận dụng nó cho lần sau, thay vì suy sụp hoặc lo lắng.\"\n\nChú thích:\n\n(注) 尾を引く : tiếp tục để lại ảnh hưởng"},{"source":"Mon11","bai":24,"date":"12/2024","title":"Mon11 - Bài 24 (12/2024)","passage":"A\n\n「指示されないと自分から動かない」「指示されたことしかやらない」、いわゆる指示待ちになっているといわれる部下や後輩がいる。指示待ちになるのは、仕事に関する知識や経験が不足していたり仕事に対してやる気がなかったりすることなどが原因だといわれている。しかし実は、そもそも上司からの指示に従うことが自分の役目だと考え、それ以上のことをする必要性を感じていないという場合が多いのだ。\n\nそのような部下には、何のためのこの仕事を行い、業務全体の中でほかの仕事とどうかかわっているのかを教えることが重要だ。仕事の全体像がイメージできれば、部下は次にやるべきことや工夫できそうな点が分かってくる。その結果、自分に求められていることに気づき、自主的に行動できるようになっていくだろう。\n\nB\n\n部下や後輩が指示待ちであるのを簡単に部下自身の責任と決めつけるのは、問題があります。指示待ちになっている理由が何かあるのかもしれません。\n\nまず部下自身が自主的に動くことの重要性を認識していないケースがあります。「言われた通りにするのが部下の仕事だ」と思いこんでいて、むしろ「どうしましょう」と相談することこそが部下の務めだと信じているケースです。この場合は、どんな仕事もすべてマニュアルで示すことはできず、個人の判断や工夫がいることを伝えることからはじめる必要があります。(中略)\n\n「これはどうしましょうか」と相談された時は、部下自身にその対応策を考えられるかどうか見極めて、「一度、自分なりの案を考えてみて」と要求してみるのです。上司がいつもそのように振る舞えば、部下は上司の思いにそって、「提案型の相談」をするようになってきます。","questions":[{"q":"部下や後輩が指示待ちになっている理由として、AとBが共通して述べていることは何か。","options":["知識や経験が足りず、やるべきことが分からないこと。","自信がなく、自主的に仕事を進めることができないこと。","上司
