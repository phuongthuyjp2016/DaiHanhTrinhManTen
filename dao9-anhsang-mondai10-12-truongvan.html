受け手に伝わらない","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm logic 'phải kích thích hơn nữa'."},{"key":"C","jp":"単に刺激的なだけの広告も、**受け手を振り向かせるためには必要**だ","trap":"bẫy chi tiết phụ","vi":"Bài thừa nhận có thể 'thu hút ánh nhìn' (振り向かせる) nhưng lập tức phủ định hiệu quả thực sự, không ủng hộ cách làm này."}]},{"huongTuDuy":"Điều tác giả muốn nói với người làm quảng cáo — bám câu kết bài.","chotY":"「伝えたい情報を**相当きちんと整理したうえで、筋道を立てて戦略的に伝える**ことを考えないと…心のバリアを破って入り込むことなどできない」.","lienKetJP":"心のバリアを破るには → 整理した情報を → 筋道を立てて → 戦略的に伝える必要がある","lienKetVI":"Để vượt qua rào cản tâm lý → cần sắp xếp thông tin → có cấu trúc rõ ràng → truyền tải có chiến lược","correct":{"jp":"受け手に伝えたい情報を**いかに整理して発信するか**が重要だ","vi":"Khớp trực tiếp với 「情報を相当きちんと整理したうえで、筋道を立てて戦略的に伝える」."},"wrong":[{"key":"A","jp":"受け手の**視点に立って商品をアピールする**ことが重要だ","trap":"bẫy chi tiết phụ","vi":"'Đứng vào góc độ người nhận' là một phần, nhưng bài nhấn mạnh cụ thể hơn vào việc SẮP XẾP và TRUYỀN TẢI CÓ CHIẾN LƯỢC."},{"key":"B","jp":"受け手の心をつかむような情報を**発信し続けること**が重要だ","trap":"bẫy chi tiết phụ","vi":"'Liên tục phát tín' không phải trọng tâm — điều quan trọng là CÁCH SẮP XẾP và TƯ DUY CHIẾN LƯỢC."},{"key":"C","jp":"受け手に商品の魅力を**いかにストレートに伝えるか**が重要だ","trap":"bẫy ngược nghĩa","vi":"'Trực tiếp' (ストレート) không phải yếu tố được nhấn mạnh — bài nhấn mạnh 'sắp xếp có hệ thống' (整理), không phải sự thẳng thắn."}]}],"Mon12-7":[{"huongTuDuy":"Thái độ của tác giả hồi trung học đối với cha mẹ — tìm ý mô tả chính xác nhất.","chotY":"「少なくとも、中学生のあたりからは…親と**「対話」などしたって、本当の話はできない**、とごく自然に承知していた」.","lienKetJP":"対話はのぞまなかった → 本当の話はできない → 話らしい話はしようとしなかった","lienKetVI":"Không muốn 'đối thoại' → biết rõ không thể nói chuyện thật → không cố nói chuyện nghiêm túc","correct":{"jp":"**話らしい話はしようとしなかった**","vi":"Khớp với 「対話などしたって本当の話はできない」 — không cố ý nói chuyện thật sự."},"wrong":[{"key":"B","jp":"**話しかけられないように顔を合わせなかった**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 'không nhìn mặt nhau thì cảm thấy cô đơn', tức là tác giả KHÔNG tránh mặt."},{"key":"C","jp":"**親を寂しがらせないように気をつかっていた**","trap":"bẫy mọi người","vi":"Không có trong bài — tác giả không đặc biệt quan tâm đến cảm xúc của cha mẹ, chỉ muốn được để yên."},{"key":"D","jp":"言葉として意味をなさない**やりとりを避けていた**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — bài nói trao đổi không có ý nghĩa thực sự (ゃってるか) là ĐỦ và làm tác giả an tâm."}]},{"huongTuDuy":"①気持は安定していた — tìm nguyên nhân ở đoạn giải thích trước đó.","chotY":"「「お」「やってるか」ぐらいのやりとりがあれば、①気持は安定していた」— chỉ cần một câu ngắn là đủ biết cha mẹ VẪN QUAN TÂM, vẫn để ý đến mình.","lienKetJP":"黙って顔をそむけられては寂しい → しかし「やってるか」程度のやりとりがあれば → 親が自分を気にかけていることが確認できる → 安定する","lienKetVI":"Bị phớt lờ → cô đơn. Nhưng chỉ 'ổn không?' ngắn gọn → xác nhận cha mẹ vẫn để ý đến mình → tâm trạng ổn định","correct":{"jp":"**親が自分を気にかけていることを確認できた**から","vi":"Khớp đúng — câu trao đổi ngắn đủ để xác nhận SỰ QUAN TÂM, không cần 'đối thoại' thật sự."},"wrong":[{"key":"A","jp":"親と時々**「対話」による交流**が持てたから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ tác giả KHÔNG muốn 'đối thoại', chỉ cần trao đổi không có ý nghĩa thực sự là đủ."},{"key":"B","jp":"親が**「対話」をのぞんでいること**が分かったから","trap":"bẫy mọi người","vi":"Không có trong bài — tác giả không quan tâm đến việc cha mẹ có muốn 'đối thoại' hay không."},{"key":"D","jp":"親が**自分のことを理解している**と感じたから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — tác giả biết rõ cha mẹ KHÔNG thể hiểu mình, và điều đó là bình thường. Điều cần là CẢM GIÁC ĐƯỢC ĐỂ Ý, không phải được hiểu."}]},{"huongTuDuy":"②長い目で見ればあまりいい影響を残さない — cần tìm LÝ DO được giải thích ngay sau đó.","chotY":"「親とは通じない部分を、どんどん持つことによって、子供は**自分の世界をつくっていく**」「親が加わることで…子供にとって、ひどくわずらわしいことだし」.","lienKetJP":"親が子供の内面に踏み込む → 子供が自分の世界を作れなくなる → 長い目で見ればマイナス","lienKetVI":"Cha mẹ xâm phạm vào nội tâm trẻ → trẻ khó tạo ra thế giới riêng → về lâu dài là tiêu cực","correct":{"jp":"**親が子供にかかわりすぎると**、子供は**自分の世界をつくりにくくなる**から","vi":"Khớp với 「親とは通じない部分を持つことで自分の世界をつくる」 + 「親が加わることは…わずらわしい」."},"wrong":[{"key":"A","jp":"**親が不安な気持でアドバイスすると**、子供の不安も増すから","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm logic 'cảm xúc lây nhiễm'."},{"key":"B","jp":"**親の価値観によるアドバイスは**、子供にとってあまり役に立たないから","trap":"bẫy chi tiết phụ","vi":"'Lời khuyên không hữu ích' là ý phụ, không phải lý do chính về TÁC HẠI LÂU DÀI được nêu."},{"key":"C","jp":"親が子供の世界に入ろうとすると、子供は**心を半ざしてしまう**から","trap":"bẫy chi tiết phụ","vi":"Gần đúng về hiện tượng nhưng sai về TẦNG SÂU — vấn đề không chỉ là 'trẻ đóng lòng' mà là trẻ mất cơ hội XÂY DỰNG THẾ GIỚI RIÊNG."}]},{"huongTuDuy":"Tác giả cho rằng cha mẹ NÊN làm gì — bám câu kết bài.","chotY":"「子供との距離が、刻々ひらいていくことに**堪えるしかない**のだ」「**「親切な他人」として対する**。その節度を保てることが、子供への愛情になっている」.","lienKetJP":"子供の内面をほうっておく → 距離が広がることに堪える → 「他人」として接する = 節度を保つ = 真の愛情","lienKetVI":"Mặc kệ nội tâm của trẻ → chịu đựng việc khoảng cách ngày càng xa → đối xử như 'người dưng tốt bụng' = giữ khoảng cách = tình yêu thương thật sự","correct":{"jp":"**子供との距離を受け入れ**、**成長を見守る**","vi":"Khớp với 「距離をリアルにとらえている親」「ほうっておくしかない」「節度を保てるということが愛情」."},"wrong":[{"key":"A","jp":"子供との**意思不通を図り**、交流を深める","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói KHÔNG thể giao tiếp thật, và nên CHẤP NHẬN điều đó."},{"key":"C","jp":"子供の気持を**理解し**、愛情を**言葉にする**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 「理解しようとしたり…してもむだ」 và 「悲しさ、寂しさを胸におさめて」= giữ trong lòng, KHÔNG nói ra."},{"key":"D","jp":"子供の悩みを**共有し**、かつ適度な距離を保つ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 「一緒に悩もうとしたりしてもむだ」 tác giả phủ nhận rõ việc chia sẻ nỗi lo của trẻ."}]}],"Mon12-8":[{"huongTuDuy":"Lý do trẻ không nói 'ごちそうさま' — cần đọc kỹ logic: không phải về THÓI QUEN mà về SỰ TRUYỀN ĐẠT.","chotY":"「きちんと目を見ていないと、子どもはたちまち**「別に大事なことじゃないんだな」と判断**してしまいます」— trẻ không cảm nhận được sự QUAN TRỌNG mà cha mẹ muốn truyền đạt.","lienKetJP":"親が目を見ない → 大事なメッセージが伝わらない → 子どもは「大事じゃない」と判断 → 言わなくてもいいと思う","lienKetVI":"Cha mẹ không nhìn vào mắt → thông điệp quan trọng không được truyền đạt → trẻ phán đoán 'không quan trọng' → không nói","correct":{"jp":"その言葉が必要だという**親の気持ちが伝わらない**から","vi":"Khớp với 「目を見ていないと…「別に大事なことじゃないんだな」と判断してしまう」."},"wrong":[{"key":"A","jp":"**親が手本を見せない**とわからないから","trap":"bẫy mọi người","vi":"'Làm gương' không có trong bài — vấn đề là không NHÌN VÀO MẮT khi nói, không phải thiếu làm mẫu."},{"key":"B","jp":"**親がやかましく言うとかえって逆効果**になるから","trap":"bẫy chi tiết phụ","vi":"Bài CÓ đề cập 'dù nhắc nhiều cũng vô ích' nhưng đây là HIỆN TƯỢNG, không phải NGUYÊN NHÂN. Nguyên nhân là không nhìn mắt."},{"key":"C","jp":"その言葉を言うことが**習慣になっていない**から","trap":"bẫy mọi người","vi":"'Chưa thành thói quen' là KẾT QUẢ, không phải nguyên nhân — không có trong bài như lý giải."}]},{"huongTuDuy":"Quan điểm của tác giả về quan hệ giữa người lớn — đoạn trung tâm của bài.","chotY":"「「じっくり話し合えば、ちゃんと分かり合える」というのは…理想論。どちらかが妥協したり…**1 0 0パーセントの解決などありえない**のが現実です」.","lienKetJP":"話し合いを重ねる → しかし100%の解決はない → それでも話し合うことを諦めるのも問題","lienKetVI":"Nói chuyện nhiều → nhưng không có giải pháp 100% → dù vậy vẫn không nên từ bỏ giao tiếp","correct":{"jp":"**話し合いを重ねても、お互いを理解できないことがある**","vi":"Khớp với 「100パーセントの解決などありえない」「どちらかが妥協しているだけ」."},"wrong":[{"key":"B","jp":"お互いを理解するためには、**最後まで議論することが必要だ**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không ủng hộ 'cứ tiếp tục tranh luận cho đến cùng' như giải pháp."},{"key":"C","jp":"話し合いの場で誤解をなくすには、**お互いが妥協しなければならない**","trap":"bẫy chi tiết phụ","vi":"'Nhượng bộ' được đề cập nhưng không phải đề xuất của tác giả — bài nói đây là HIỆN THỰC không lý tưởng (「妥協しているだけ」)."},{"key":"D","jp":"コミュニケーションを**諦めると、トラブルになることも珍しくない**","trap":"bẫy chi tiết phụ","vi":"Sai nhân quả — bài nói từ bỏ là HỆ QUẢ của việc tranh cãi lâu dài, không phải nguyên nhân của vấn đề."}]},{"huongTuDuy":"②何か別の関係が生まれる — tìm định nghĩa ở đoạn giải thích trước câu này.","chotY":"「相手の目を見ていれば…**「その人の人間性」に対しては、別の気持ちを抱くようになります**。意見は認められなくても、**人としては認められる**ということです」.","lienKetJP":"意見は食い違ったまま → しかし相手の目を見る → 「その人の人間性」に尊敬の念が湧く → 人としては認められる","lienKetVI":"Ý kiến vẫn khác nhau → nhưng nhìn vào mắt nhau → cảm thấy tôn trọng 'nhân cách của người đó' → công nhận nhau như con người","correct":{"jp":"**相手の人間性を認める**ようになる","vi":"Khớp trực tiếp với 「その人の人間性に対しては、別の気持ちを抱く」「人としては認められる」."},"wrong":[{"key":"B","jp":"**相手の意見を容認できる**ようになる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ 「意見は認められなくても」 — ý kiến VẪN KHÔNG được chấp nhận."},{"key":"C","jp":"**相手の態度を受け入れられる**ようになる","trap":"bẫy chi tiết phụ","vi":"'Chấp nhận thái độ' không phải nội dung được nêu — bài nói về NHÂN CÁCH (人間性), không phải thái độ."},{"key":"D","jp":"**相手の価値観を理解できる**ようになる","trap":"bẫy chi tiết phụ","vi":"'Hiểu giá trị quan' quá sâu — bài chỉ nói đến mức độ 'công nhận nhân cách như con người'."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám thông điệp xuyên suốt và câu kết bài.","chotY":"「目を見て話すことは、分かり合い、メッセージを伝え、**コミュニケーションをよくする秘訣**」「まっすぐ目を見て話しましょう」.","lienKetJP":"子育ての秘訣 → 大人同士の関係でも同じ → 目を見て話すことが大切","lienKetVI":"Bí quyết nuôi dạy con → cũng áp dụng cho quan hệ người lớn → nhìn vào mắt khi nói chuyện là quan trọng","correct":{"jp":"**コミュニケーションのためには**、相手の**目を見て話すことが大切**である","vi":"Khớp với thông điệp xuyên suốt: 「目を見て話すことは…コミュニケーションをよくする秘訣」."},"wrong":[{"key":"A","jp":"問題を解決するためには、相手の目を見て**理解できるまで話し合えばいい**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ 100% giải quyết là không tưởng, nhìn mắt nhau KHÔNG đảm bảo hiểu nhau."},{"key":"C","jp":"相手に**誤解されないためには**、目を見てコミュニケーションをすればいい","trap":"bẫy chi tiết phụ","vi":"'Tránh hiểu nhầm' quá hẹp — bài nói về hiệu quả giao tiếp TỔNG THỂ, không chỉ tránh hiểu nhầm."},{"key":"D","jp":"自分を理解してもらうには、目を見て**繰り返し話すことが大切**","trap":"bẫy chi tiết phụ","vi":"'Nhắc đi nhắc lại' không phải bí quyết được đề xuất — bài thậm chí nói nhắc nhiều mà không nhìn mắt thì VÔ DỤNG."}]}],"Mon12-9":[{"huongTuDuy":"①現代という時代の đặc trưng — đoạn đầu bài mô tả cơ chế vòng xoáy tiêu dùng.","chotY":"「発明が欲望を刺激し、欲望が人々を消費に走らせ…**企業の戦略と人々の欲望が結びついて**、ひたすら「幸福」を求めようとする構造が①現代という時代を象徴している」.","lienKetJP":"企業が製品を売り込む → 欲望が刺激される → 消費に走る → 新たな欲望が生まれる（悪循環）→ ①現代","lienKetVI":"Doanh nghiệp bán sản phẩm → kích thích ham muốn → tiêu thụ → tạo ra ham muốn mới (vòng xoáy) → '①thời đại hiện nay'","correct":{"jp":"**企業が次々に新製品を売り込む**ことで、**人々の欲望が膨れ上がっている**","vi":"Khớp với 「企業の戦略と人々の欲望が結びついて…悪循環に陥る」."},"wrong":[{"key":"A","jp":"人々が必要性を感じているものを、企業が**すぐに察知し製品化している**","trap":"bẫy ngược nghĩa","vi":"Ngược nhân quả — bài nói NGƯỢC LẠI: phát minh TẠO RA cảm giác 'cần thiết', không phải nhu cầu có trước rồi doanh nghiệp mới làm."},{"key":"B","jp":"人々の**購買欲にこたえるために**、企業が必要以上のものを開発している","trap":"bẫy ngược nghĩa","vi":"Đảo nhân quả — bài nói doanh nghiệp TẠO RA ham muốn tiêu dùng, không phải đáp ứng ham muốn có sẵn."},{"key":"C","jp":"企業の多くの発明によって、**人々の便利な生活が支えられている**","trap":"bẫy ngược nghĩa","vi":"Quá tích cực và ngược với tinh thần phê phán của bài — bài coi đây là vòng xoáy tiêu cực."}]},{"huongTuDuy":"②不可能である — lý do tại sao lối sống 'tách biệt công nghệ' là bất khả thi.","chotY":"「電子メールでは誰とでも…テレビからの情報は日常会話に欠かせない…**パソコンもテレビもケータイもクルマもない生活は考えられず**、これら文明の利器は私たちを誘引して止まない」.","lienKetJP":"便利な機器が生活に深く浸透している → もはや手放せない（不可能に戻れない）→ ②不可能","lienKetVI":"Thiết bị tiện ích đã ăn sâu vào cuộc sống → không thể trở lại cuộc sống không có chúng → '②bất khả thi'","correct":{"jp":"人は**不便で手間のかかる生活に戻れなくなっている**から","vi":"Khớp với 「パソコンもテレビもケータイもない生活は考えられず」「文明の利器は誘引して止まない」."},"wrong":[{"key":"A","jp":"人は**外部の情報なしでは生きられない**ものだから","trap":"bẫy chi tiết phụ","vi":"'Sống không có thông tin' quá cực đoan — bài không phủ nhận hoàn toàn việc sống thiếu thông tin."},{"key":"B","jp":"人は**他者とのつながりを絶てきれない**ものだから","trap":"bẫy chi tiết phụ","vi":"'Không thể cắt đứt quan hệ xã hội' chỉ là 1 lý do trong nhiều lý do, không bao quát đủ."},{"key":"D","jp":"人は**新しいテクノロジーがよいものだと思い込んでいる**から","trap":"bẫy chi tiết phụ","vi":"'Tưởng là tốt' không phải lý do chính — bài nói về việc KHÔNG THỂ TRỞ LẠI (không thể tưởng tượng), không phải về sự nhầm tưởng."}]},{"huongTuDuy":"③そこ chỉ thị từ — tìm câu ngay trước.","chotY":"「そこに「幸福」はないと実は誰もが知っていても、**便利さと効率性を棄てきれない**のも私たちなのである」— ③そこ = cuộc sống bị bao bọc bởi thiết bị tiện ích.","lienKetJP":"文明の利器に囲まれた生活 → ③そこに「幸福」はないと知っている → しかし棄てられない","lienKetVI":"Cuộc sống bao quanh bởi thiết bị → '③chỗ đó' không có 'hạnh phúc' thật sự → nhưng không thể bỏ được","correct":{"jp":"**便利な機器に囲まれた**生活","vi":"Khớp với 「文明の利器は私たちを誘引して止まない」「便利さと効率性を棄てきれない」."},"wrong":[{"key":"A","jp":"古い機器を**棄てられない**生活","trap":"bẫy chi tiết phụ","vi":"'Bỏ không được đồ cũ' không phải trọng tâm — bài nói về cuộc sống DỰA VÀO và BỊ BÁM VÍU bởi tiện ích nói chung."},{"key":"C","jp":"新しい機器に**頼らない**生活","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — đây là cuộc sống 'tu sĩ' mà bài nói là BẤT KHẢ THI, không phải ③そこ."},{"key":"D","jp":"**必要な機器だけを使う**生活","trap":"bẫy chi tiết phụ","vi":"Đây là GIẢI PHÁP tác giả đề xuất ở cuối bài, không phải nội dung ③そこ."}]},{"huongTuDuy":"Tác giả tìm kiếm 'hạnh phúc' bằng cách nào — bám câu kết bài.","chotY":"「余分な機器を持たず、持っても時間を区切るか場所を限るかして欲望を抑制…そのようにして生み出された**時間を自分のために使う**のだ。それが私の「幸福」への接近法」.","lienKetJP":"機器とのかかわりを制限する → 時間を生み出す → その時間を自分のために使う → 「幸福」","lienKetVI":"Hạn chế liên hệ với thiết bị → tạo ra thời gian → dùng thời gian đó cho bản thân → 'hạnh phúc'","correct":{"jp":"**機器とのかかわりを制限**して得られた時間を、**自身のために使う**","vi":"Khớp trực tiếp với câu kết 「欲望を抑制…時間を自分のために使うのだ」."},"wrong":[{"key":"A","jp":"欲望を抑制して、**自身が本当に気に入った機器だけを手に入れる**","trap":"bẫy chi tiết phụ","vi":"'Chỉ mua đồ mình thích' không phải điều tác giả nói — điều quan trọng là THỜI GIAN TẠO RA được, không phải việc chọn mua đồ gì."},{"key":"C","jp":"**便利さや効率性を放棄**して、自身が本当に必要なものを見極める","trap":"bẫy chi tiết phụ","vi":"'Từ bỏ hoàn toàn tiện ích' là điều tác giả nói là BẤT KHẢ THI (②不可能) — tác giả chọn GIỮA, không từ bỏ hoàn toàn."},{"key":"D","jp":"ものに対する**執着心を棄てて**、自身のための時間を生み出す","trap":"bẫy chi tiết phụ","vi":"'Bỏ tâm chấp trước' quá thiền định/tâm linh — bài nói cụ thể là HẠN CHẾ thời gian/nơi dùng thiết bị, không phải từ bỏ nội tâm."}]}],"Mon12-10":[{"huongTuDuy":"Loại phê bình nào tác giả gọi là 'ngạo mạn' — tìm câu định nghĩa trực tiếp.","chotY":"「まるで**自分を神であるかのように**本の優劣を断定しているものには激しい抵抗を感じる」.","lienKetJP":"書評がいい→それはその人の知識・関心・人柄による判断でしかない → しかし神の立場で断定 → 傲慢","lienKetVI":"Phê bình là tốt → nhưng chỉ là đánh giá dựa trên tri thức/quan tâm của người đó → nhưng phán xét như thần → ngạo mạn","correct":{"jp":"**自身の判断がすべてであるかのように**評価したもの","vi":"Khớp trực tiếp với 「自分を神であるかのように本の優劣を断定」."},"wrong":[{"key":"A","jp":"**大した理由づけもなく**優劣を断定したもの","trap":"bẫy chi tiết phụ","vi":"'Không có lý do' không phải điểm bài nhấn mạnh — vấn đề là thái độ 'PHÁN XÉT TUYỆT ĐỐI', không phải thiếu lý lẽ."},{"key":"B","jp":"優れている点を**決して認めようとしない**もの","trap":"bẫy chi tiết phụ","vi":"Không có trong bài — tự thêm ý về 'không chịu khen'."},{"key":"C","jp":"自身に**知識があるかのように見せかけた**もの","trap":"bẫy chi tiết phụ","vi":"'Giả vờ có kiến thức' không phải điểm bài phê phán — bài phê phán thái độ TOÀN TRI (như thần), không phải sự giả tạo."}]},{"huongTuDuy":"Điều tác giả thấy bực bội về bình luận cuốn sách tham khảo — cần đọc kỹ mục đích của cuốn sách.","chotY":"私は「かろうじて合格できるだけのレベル…最低限これだけの知識」を目指して書いた。 → 書評「かろうじて合格するくらいの力しかつかない」→ tác giả: CHÍNH XÁC là mục đích của sách, đây không phải chỉ trích mà là KHEN.","lienKetJP":"筆者の目的＝かろうじて合格できる力 → 書評「かろうじて合格する力しかつかない」と批判 → しかしそれが筆者の意図そのもの → ないものねだり（もっと高いものを求めている）","lienKetVI":"Mục đích sách = đủ để 'vừa đậu' → bình luận phê: 'chỉ đủ vừa đậu' = đúng ý tác giả nhưng coi là điểm thiếu → đòi hỏi thứ không có trong sách","correct":{"jp":"**どうにか合格できる程度を目指したのに**、それ以上の内容が必要だと評判したもの","vi":"Khớp với nghịch lý: mục đích 「かろうじて合格」 = đúng, nhưng người phê coi đó là THIẾU SÓT."},"wrong":[{"key":"B","jp":"合格に必要な最低限の知識を整理したものなのに、**合格は不可能だと批判した**もの","trap":"bẫy ngược nghĩa","vi":"Quá cực đoan — bài không nói người phê chỉ trích là 'không thể đậu', mà là 'chỉ vừa đủ đậu'."},{"key":"C","jp":"敢えて難しいことは書いていないのに、**それでもわかりにくいと批判した**もの","trap":"bẫy chi tiết phụ","vi":"'Khó hiểu' không phải điểm phê bình được mô tả — người phê chê về NỘI DUNG (thiếu sâu), không phải về cách trình bày."},{"key":"D","jp":"難しい試験でも合格できるように書いたのに、**それでも不十分だと批判した**もの","trap":"bẫy ngược nghĩa","vi":"'Khó cũng đậu được' ngược với mục đích thật sự — sách nhắm vào MỨC TỐI THIỂU, không phải mức khó."}]},{"huongTuDuy":"Khi nào sách là 'sách hay' theo tác giả — đoạn đầu bài định nghĩa.","chotY":"「それ（本）を求めている人の手に求めているときに渡れば、それは**良書になる**」.","lienKetJP":"本＝人間と同じ → 一律に優劣は決められない → 必要な人に必要なときに → 良書になる","lienKetVI":"Sách = như con người → không thể xếp hạng một chiều → đến tay người cần vào lúc họ cần → trở thành sách hay","correct":{"jp":"**求める人のレベルや目的にあっている**場合","vi":"Khớp với 「それを求めている人の手に求めているときに渡れば…良書」 — cặp gần nghĩa: 求めている人・求めているとき ↔ 求める人のレベルや目的にあっている."},"wrong":[{"key":"A","jp":"**書評で強く批判されない**場合","trap":"bẫy ngược nghĩa","vi":"Ngược tinh thần bài — bài phê phán các đánh giá sách, và tác giả tự biết sách mình cũng bị phê nhưng vẫn là sách tốt."},{"key":"B","jp":"**多くの人が価値を認めている**場合","trap":"bẫy chi tiết phụ","vi":"'Được nhiều người công nhận' = bestselller, nhưng bài nói ngay đầu: bestselller không có nghĩa là sách hay với tất cả."},{"key":"C","jp":"求める人に**本の趣旨が理解しやすい**場合","trap":"bẫy chi tiết phụ","vi":"'Dễ hiểu' là yếu tố phụ — bài không nói về tính dễ hiểu mà về sự PHÙ HỢP với nhu cầu/trình độ của người đọc."}]},{"huongTuDuy":"Điều tác giả muốn nói với người phê bình sách — câu kết bài.","chotY":"「あらゆる本に**愛情を持つべき**だと私は考えている。そうしてこそ、本を批判する**資格を持つ**と思うのだ」.","lienKetJP":"本は全てそれぞれの価値を持つ → あらゆる本に愛情を → そうしてこそ批評の資格がある","lienKetVI":"Sách đều có giá trị riêng → nên yêu mến mọi cuốn sách → từ đó mới có tư cách phê bình","correct":{"jp":"**それぞれの本の存在価値を認めるべきだ**","vi":"Khớp với 「あらゆる本に愛情を持つべき」「一律の価値によって優劣を決めることはできない」."},"wrong":[{"key":"A","jp":"著者の**あらゆる本を読むべきだ**","trap":"bẫy mọi người","vi":"Không có trong bài — 'đọc hết sách của tác giả' không phải điều tác giả yêu cầu."},{"key":"B","jp":"**極端に否定的な評価は避けるべきだ**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng quá hẹp — bài không chỉ nói về mức độ phê bình mà về THÁI ĐỘ CƠ BẢN: yêu mến và công nhận giá trị."},{"key":"D","jp":"どのような本にも**先入観なしで接するべきだ**","trap":"bẫy mọi người","vi":"'Không thành kiến' không phải điểm mấu chốt — bài nói về TÌNH YÊU với sách (愛情), không chỉ về thái độ khách quan."}]}],"Mon12-11":[{"huongTuDuy":"Loại mục tiêu được thiết lập trong công việc — đoạn đầu mô tả quy trình.","chotY":"「外部環境や内部の状況を含め、諸々の要素を検討」→「**達成可能かつできる限り高い目標**を探ることになる」.","lienKetJP":"さまざまな要素を検討 → 達成不可能ではない範囲で → できる限り高い目標","lienKetVI":"Xem xét nhiều yếu tố → không phải bất khả thi → mục tiêu CAO NHẤT có thể đạt được","correct":{"jp":"成し遂げられる範囲の中で**最も高い目標**","vi":"Khớp với 「達成可能かつできる限り高い目標」."},"wrong":[{"key":"A","jp":"外部環境や内部の状況の変化を**完璧に予測した**目標","trap":"bẫy chi tiết phụ","vi":"Bài nói rõ đây là ĐiỀU KHÔNG THỂ (「実際にはそんなことはありえない」), không phải cách thiết lập mục tiêu hiện thực."},{"key":"B","jp":"現在の状況から見て**無理なく達成される**目標","trap":"bẫy chi tiết phụ","vi":"'Dễ dàng đạt được' thiếu phần 'cao nhất có thể' — bài nhấn mạnh 「できる限り高い」."},{"key":"D","jp":"達成が難しくても**取り組む価値のある**目標","trap":"bẫy chi tiết phụ","vi":"'Đáng thử dù khó' gần với kết luận cuối bài, không phải mô tả cách thiết lập mục tiêu thực tế trong đoạn ①."}]},{"huongTuDuy":"Điều tác giả nói là cơ hội kinh doanh — câu giải thích về 'bất định'.","chotY":"「事前に予想ができない要素にこそ、**大きなビジネスチャンスが転がっている**」→ cụ thể: 「社内では…アイデアを**隠し持った人**が必ずいる」「外部環境は**予想もつかない方向に変わりうる**」.","lienKetJP":"固定した目標は不確定要素に対応できない → しかしその不確定要素（社内の埋もれた発想＋社外の変化）にこそチャンスがある","lienKetVI":"Mục tiêu cứng đơ không đáp ứng được yếu tố bất định → nhưng chính trong yếu tố bất định đó (ý tưởng ẩn bên trong + thay đổi bên ngoài) mới có cơ hội","correct":{"jp":"**社内に埋もれている発想**や**社外で起こる変化**","vi":"Khớp với 「社内では…アイデアを隠し持った人」「外部環境は予想もつかない方向に変わりうる」「この要素にこそビジネスチャンスが転がっている」."},"wrong":[{"key":"A","jp":"**創意工夫を生み出す社内環境**","trap":"bẫy chi tiết phụ","vi":"'Môi trường nuôi dưỡng sáng tạo' không phải nội dung được đề xuất — bài nói về các yếu tố BẤT ĐỊNH cụ thể, không phải về việc xây dựng môi trường."},{"key":"B","jp":"**社員にとって納得感のある目標設定**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phê phán 「落とし所 (妥協点)」 là 「意味がない」, không phải ca ngợi."},{"key":"C","jp":"社内外の不確定な変化に対する**大胆な予想**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không ủng hộ 'dự đoán táo bạo' mà nói dự đoán là KHÔNG THỂ; hãy ỨNG PHÓ khi thay đổi xảy ra."}]},{"huongTuDuy":"②違和感 — cái gì gây ra cảm giác 'không ổn' cho tác giả?","chotY":"「スポーツよりも遥かに**不確定な要素が多い**にもかかわらず、**目標によって自分たちを縛りつけようとする**のである。これにはかなり②違和感を覚える」.","lienKetJP":"力士やゴルフ選手は目標を口にしない（変化に対応するため）→ しかしビジネスでは固定目標で自分を縛る → 不確定要素が多いのに変わらない → ②違和感","lienKetVI":"Vận động viên không đặt mục tiêu cứng (để ứng phó thay đổi) → nhưng kinh doanh lại tự trói bằng mục tiêu cố định → nhiều yếu tố bất định hơn nhưng lại cứng nhắc hơn → '②cảm giác không ổn'","correct":{"jp":"**周囲の状況は変わるのに**、**目標を固定すること**","vi":"Khớp với 「周囲の状況はどんどん変わることが当たり前…自分だけ変わらないのはおかしい」 + 「目標によって縛りつけようとする」."},"wrong":[{"key":"A","jp":"不確定な要素が多いため**目標を立てないこと**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài phê phán việc ĐẶTMỤC TIÊU cứng nhắc, không phải việc không đặt mục tiêu."},{"key":"C","jp":"目標を立てたのに**それを口にしないこと**","trap":"bẫy chi tiết phụ","vi":"'Không nói ra mục tiêu' là hành vi của vận động viên (VÍ DỤ), không phải điều gây ra ②違和感."},{"key":"D","jp":"目標を立てたのに**それを変えなくてはならないこと**","trap":"bẫy chi tiết phụ","vi":"'Phải thay đổi mục tiêu' gần đúng nhưng sai trọng tâm — vấn đề là 自分を縛る (TỰ TRÓI) bằng mục tiêu cũ, không phải việc phải sửa mục tiêu."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「過去に立てた目標によって自分を窮屈な存在にしてはいけない」「**目の前のことだけに投入**し、何かしらの変化を察知するにつけ、**次のベストを探すというスタンスを保持することが重要**」.","lienKetJP":"目標に縛られるな → 目の前のことに集中 → 変化を察知して次のベストを探す → これが重要","lienKetVI":"Không bị trói bởi mục tiêu → tập trung vào trước mắt → nhận biết thay đổi và tìm phương án tốt nhất tiếp theo → đây là điều quan trọng","correct":{"jp":"目標を立てることに**縛られず**、**目の前のことに最善の対応をすること**が重要だ","vi":"Khớp trực tiếp với câu kết 「目の前のことだけに投入し、次のベストを探すというスタンスが重要」."},"wrong":[{"key":"A","jp":"**実現不可能なくらいの大きな目標**を立てて達成に向けて努力すべきだ","trap":"bẫy chi tiết phụ","vi":"Bài CÓ đề cập 'đặt mục tiêu lớn khó đạt' nhưng ngay lập tức nói 「しかし、これ自体は達成方法を考えるのに役に立たない」 — không phải điều được ủng hộ."},{"key":"B","jp":"自分の可能性を大事にするためには、**大きな目標を立てるべきではない**","trap":"bẫy chi tiết phụ","vi":"Quá tuyệt đối — bài không phủ nhận hoàn toàn mục tiêu, chỉ phủ nhận việc 'bị trói' bởi mục tiêu."},{"key":"C","jp":"自分が持つ可能性が最大限に発揮できるような**目標を探し続けること**が重要だ","trap":"bẫy chi tiết phụ","vi":"'Tìm kiếm mục tiêu' không phải điểm nhấn — bài nhấn mạnh 'ứng phó linh hoạt với trước mắt', không phải 'tìm mục tiêu hoàn hảo'."}]}],"Mon12-12":[{"huongTuDuy":"Lý do tác giả không bị thu hút bởi tranh vẽ núi — đoạn 2-3 giải thích.","chotY":"「**ステレオタイプな観点**から山を賛美し、その風景を自分の心の展示箱に納めて「いい思い出」にしてしまう」「**似たようなイメージ**…再生産している」.","lienKetJP":"一般的な山の絵＝ステレオタイプな観点（雄大さ・厳粛さ）→ 似たようなイメージを再生産 → 興味が湧かない","lienKetVI":"Tranh núi thông thường = nhìn theo khuôn mẫu (hùng vĩ/trang nghiêm) → tái sản xuất hình ảnh giống nhau → không thu hút","correct":{"jp":"**型にはまった見方で描かれた**山の絵が多いから","vi":"Khớp với 「ステレオタイプな観点から山を賛美」「似たようなイメージを再生産」."},"wrong":[{"key":"B","jp":"**一般的な登山者の視点で描かれた**山の絵ではないから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói CHÍNH các họa sĩ cũng dùng cùng quan điểm với người leo núi thông thường (ステレオタイプ)."},{"key":"C","jp":"**思い出として残すために描かれた**山の絵しかないから","trap":"bẫy chi tiết phụ","vi":"'Vẽ để lưu kỷ niệm' là một MÔ TẢ trong bài (心の展示箱に納める), không phải NGUYÊN NHÂN đủ để gây phản cảm."},{"key":"D","jp":"**自分の心の中にある風景と似たような**山の絵ばかりだから","trap":"bẫy mọi người","vi":"Không có trong bài — tác giả phê phán sự GIỐNG NHAU giữa các tranh với nhau, không phải giống với hình ảnh trong tâm trí tác giả."}]},{"huongTuDuy":"Tác giả nhìn nhận 'núi' như thế nào — đoạn giữa bài mô tả quan điểm cá nhân.","chotY":"「山は動いている、と」「微細な物理的変貌、小さな生命たちの死滅と再生が**瞬時も止まることのない現場**が、「山」なのである」.","lienKetJP":"「動かざるものの象徴」とされる山 → しかし実際は → 刻一刻と変化しつづけている","lienKetVI":"Núi thường được coi là biểu tượng 'bất biến' → nhưng thực ra → biến đổi không ngừng từng khoảnh khắc","correct":{"jp":"山は一見変わらないようでも、**変化しつづけている**","vi":"Khớp trực tiếp với 「山は動いている」「刻一刻と変化しつづけている」."},"wrong":[{"key":"A","jp":"山の変化は小さくても、心に残る**感動は大きい**","trap":"bẫy mọi người","vi":"Không có trong bài — tác giả nói về THỰC TẾ núi biến đổi, không nói về 'cảm động'."},{"key":"B","jp":"山は**同じように見えても、それぞれの個性がある**","trap":"bẫy chi tiết phụ","vi":"'Mỗi núi có cá tính riêng' không phải trọng tâm — bài nhấn mạnh núi LUÔN THAY ĐỔI, không phải sự khác biệt giữa các núi."},{"key":"D","jp":"同じ山に面しても、**山から受ける印象は毎回異なる**","trap":"bẫy chi tiết phụ","vi":"'Ấn tượng mỗi lần khác nhau' là kết quả của việc núi biến đổi, nhưng không phải điểm tác giả muốn nhấn mạnh nhất — trọng tâm là THỰC TẾ VẬT LÝ của sự biến đổi."}]},{"huongTuDuy":"So sánh người thành thị và họa sĩ sống lâu ở núi — tìm điểm CHUNG.","chotY":"「都市部の生活者…山の変化に気づかない」「何十年も山で暮らしてきたような画家でさえも、その表現は**先述した域を出ることは稀**」「表現への憧れが先に立ち…」→ cả 2 đều có hình ảnh núi CỐ ĐỊNH.","lienKetJP":"都市生活者＝山から乖離して変化に気づかない → 山暮らしの画家も＝表現への憧れで山の実相を捉えられない → 両者ともイメージが固定化","lienKetVI":"Người thành thị = xa núi nên không nhận ra thay đổi → Họa sĩ sống ở núi cũng = bị 'khao khát biểu hiện' che khuất nên không nắm bắt thực tế → Cả 2 đều có hình ảnh núi CỐ ĐỊNH","correct":{"jp":"いずれも**山のイメージが固定化している**","vi":"Khớp với 「変化に気づかない」(người thành thị) + 「先述した域を出ることは稀」(họa sĩ) = cả 2 đều bị khuôn mẫu hóa."},"wrong":[{"key":"A","jp":"いずれも**山への憧れが強い**","trap":"bẫy chi tiết phụ","vi":"'Khao khát về núi' chỉ được nêu cho HỌA SĨ (表現への憧れが先に立ち), không phải cả 2."},{"key":"B","jp":"いずれも**山への興味が失われている**","trap":"bẫy chi tiết phụ","vi":"'Mất hứng thú' không phải điểm chung được nêu — người thành thị không đặc biệt 'mất hứng' mà chỉ 'không để ý thay đổi'."},{"key":"C","jp":"いずれも**山の見方が変化してきている**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — cả 2 đều KHÔNG thay đổi cách nhìn (hình ảnh cố định), đây là điểm phê phán của tác giả."}]},{"huongTuDuy":"Quan điểm tổng kết của tác giả về tranh vẽ núi — bám câu kết bài.","chotY":"「山に登る者の心に刻印される山の風景…**確定しえない動的な現象として記憶されてもよい**」「**その表現は、もっと多様であるべき**だろう」.","lienKetJP":"山＝変化する → 単一的なイメージで描かれている現状 → しかし→ 山は多様なはずなので→ 表現も多様であるべき","lienKetVI":"Núi = biến đổi → hiện tại bị vẽ với hình ảnh đơn điệu → nhưng → núi vốn đa dạng → cách biểu hiện cũng nên đa dạng","correct":{"jp":"山の姿は**単一ではない**のだから、**その表現も多様であるべきだ**","vi":"Khớp trực tiếp với 「見る者の心のなかで定着される山のイメージは…もっと多様であるべきだろう」."},"wrong":[{"key":"A","jp":"山の姿を描くためには、**その山の特徴を強調すべきだ**","trap":"bẫy mọi người","vi":"Không có trong bài — 'nhấn mạnh đặc điểm của từng núi' không phải điều tác giả đề xuất."},{"key":"B","jp":"山を多様に描くためには、**画家は個性を発揮すべきだ**","trap":"bẫy chi tiết phụ","vi":"'Phát huy cá tính của họa sĩ' chỉ là phương tiện, không phải điểm nhấn cốt lõi — điều cốt lõi là NHẬN RA thực tế biến đổi của núi rồi mới biểu hiện đa dạng."},{"key":"C","jp":"山への思いは皆違うのだから、**その表現も自由であるべきだ**","trap":"bẫy chi tiết phụ","vi":"'Suy nghĩ của mọi người về núi khác nhau' không phải luận điểm của bài — bài xuất phát từ THỰC TẾ VẬT LÝ của núi (luôn biến đổi), không phải từ sự khác nhau của cảm nhận cá nhân."}]}],"Mon12-13":[{"huongTuDuy":"Lý do biên tập viên yêu cầu không dùng từ '科学' — câu trích dẫn lời biên tập viên nêu rõ.","chotY":"「「科学」と聞いただけで**引いてしまう**（そのページを読むことをやめてしまう）人がけっこういますから」— người đọc có TÂM LÝ NGẠI/SỢ khoa học.","lienKetJP":"「科学」という言葉を使うな → なぜなら → 「科学」と聞いただけで引いてしまう読者がいる → 苦手意識を持っている","lienKetVI":"Không dùng từ 'khoa học' → vì → chỉ nghe từ đó đã muốn dừng đọc → người đọc có tâm lý ngại/sợ khoa học","correct":{"jp":"読者が**科学に苦手意識を持っている**と考えているから","vi":"Khớp trực tiếp với 「「科学」と聞いただけで引いてしまう人がいる」."},"wrong":[{"key":"B","jp":"読者が科学の**専門的なことばを理解できない**と考えているから","trap":"bẫy chi tiết phụ","vi":"'Không hiểu thuật ngữ' khác với 'có tâm lý ngại' — biên tập viên không nói về hiểu/không hiểu, mà về THÁI ĐỘ KHI NGHE từ 'khoa học'."},{"key":"C","jp":"読者が考える科学と**暮らしの中の科学は違う**と考えているから","trap":"bẫy mọi người","vi":"Không có trong lý do biên tập viên nêu — tự thêm ý về sự khác biệt nhận thức."},{"key":"D","jp":"読者が持っている科学の**イメージがはっきりしない**と考えているから","trap":"bẫy mọi người","vi":"Không có trong bài — biên tập viên nói về PHẢN ỨNG CỤ THỂ (dừng đọc), không phải về hình ảnh mơ hồ."}]},{"huongTuDuy":"'Người sử dụng công nghệ' theo tác giả — tìm câu mô tả trực tiếp.","chotY":"「それを使う側の人は与えられたものを**十分に理解せず**「買う」という行動だけで受け入れている」.","lienKetJP":"科学技術を使う人 → 理解せず → 「買う」だけで受け入れる → 使ってはいるが理解していない","lienKetVI":"Người dùng công nghệ → không hiểu → chỉ 'mua' mà chấp nhận → dùng nhưng không thực sự hiểu","correct":{"jp":"**科学技術を使ってはいるが、理解しているとは言えない**","vi":"Khớp với 「十分に理解せず「買う」という行動だけで受け入れている」."},"wrong":[{"key":"A","jp":"科学技術は**使っているうちに理解できる**と思っている","trap":"bẫy mọi người","vi":"Không có trong bài — không nói về việc người dùng 'nghĩ có thể hiểu sau này'."},{"key":"C","jp":"科学技術を**理解してはいるが、使いこなせていない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói DÙNG ĐƯỢC nhưng KHÔNG HIỂU, không phải ngược lại."},{"key":"D","jp":"科学技術を**理解しているつもりで**使っている","trap":"bẫy chi tiết phụ","vi":"'Tưởng mình hiểu' thêm sắc thái tự mãn không có trong bài — bài chỉ nói 'không hiểu đủ', không xác nhận người dùng có 'tưởng' gì."}]},{"huongTuDuy":"Vấn đề của 'không cần biết cơ chế' — câu giải thích ngay sau câu ③.","chotY":"「そのような使い方では、供給する側から示された技術の**「良い部分」しか見えません**」「供給する側に**都合のいい情報しか得られない**」.","lienKetJP":"しくみを知らない → 「良い部分」しか見えない → 供給側に都合のいい情報しか得られない","lienKetVI":"Không biết cơ chế → chỉ thấy phần 'tốt' → chỉ nhận được thông tin CÓ LỢI CHO BÊN CUNG CẤP","correct":{"jp":"**供給する側に都合のいい情報**しか得られないこと","vi":"Khớp trực tiếp với 「供給する側から「良い部分」しか聞かれない」."},"wrong":[{"key":"A","jp":"**マニュアルがないと製品が使えない**こと","trap":"bẫy chi tiết phụ","vi":"Không phải vấn đề được nêu — phụ thuộc vào manual là mô tả cách dùng (マニュアルの通り), không phải vấn đề cốt lõi."},{"key":"B","jp":"**マニュアル以外の使い方ができなくなる**こと","trap":"bẫy chi tiết phụ","vi":"'Không dùng được ngoài manual' không phải điều được nêu như vấn đề chính."},{"key":"C","jp":"供給する側の**伝えたい情報が理解できない**こと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — vấn đề không phải là 'không hiểu thông tin', mà là 'chỉ nhận được thông tin MỘT CHIỀU từ phía cung cấp'."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「科学的背景やしくみを少しでも知った上で、生活の中に**取り入れるか、取り入れないのかを判断する**ことが必要です」.","lienKetJP":"知る → その上で → 生活に取り入れるか否か判断する → これが重要","lienKetVI":"Biết (hiểu cơ chế) → từ đó → tự phán đoán có đưa vào cuộc sống hay không → đây là điều quan trọng","correct":{"jp":"**科学技術を知り、生活に取り入れるかどうかを判断する**ことが大切だ","vi":"Khớp trực tiếp với câu kết 「しくみを少しでも知った上で、取り入れるか否かを判断することが必要」."},"wrong":[{"key":"A","jp":"**技術の知識を豊富に身につける**ことが大切だ","trap":"bẫy chi tiết phụ","vi":"'Phong phú kiến thức' quá cao hơn mục tiêu bài đặt ra — tác giả chỉ nói 「少しでも知った上で」 (biết PHẦN NÀO), không đòi hỏi nhiều kiến thức."},{"key":"B","jp":"科学技術を**マニュアルに頼らず使いこなす**ことが大切だ","trap":"bẫy chi tiết phụ","vi":"'Sử dụng thành thạo không cần manual' không phải mục tiêu — bài nói về việc PHÁN ĐOÁN có dùng hay không, không phải về kỹ năng sử dụng."},{"key":"C","jp":"科学技術を**取り入れ**、そのしくみを知ろうとすることが大切だ","trap":"bẫy ngược nghĩa","vi":"Sai trật tự — bài nói 「知った上で…取り入れるか否か判断する」 tức là BIẾT TRƯỚC rồi mới QUYẾT ĐỊNH, không phải 'áp dụng vào rồi tìm hiểu sau'."}]}],"Mon12-14":[{"huongTuDuy":"Lý do vui khi gặp thợ lành nghề — câu đầu đoạn giải thích.","chotY":"「経験則によって裏付けられた、物に近い、**深くて確かな情報**を持っている」「長い時間、図面にばかり接していると、現実を離れて思考が一人歩きすることがよくある。そんな時、彼らからもらう情報がかけがえのないものであることが分かる」.","lienKetJP":"図面ばかりでは現実から離れてしまう → 職人からの経験則による確かな情報が必要 → それが現場に通う楽しみ","lienKetVI":"Chỉ làm với bản vẽ dễ xa rời thực tế → thợ cung cấp thông tin đáng tin cậy từ kinh nghiệm → đó là niềm vui khi đến công trường","correct":{"jp":"**職人から得る情報**で自分のやり方の正しさが確かめられるから","vi":"Khớp với 「経験則によって裏付けられた、深くて確かな情報を持っている」."},"wrong":[{"key":"A","jp":"職人から得る情報で**自分のやり方の正しさが確かめられる**から","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng sai hướng — bài không nói về việc 'xác nhận đúng/sai', mà về THÔNG TIN THỰC TẾ mà bản vẽ không có được."},{"key":"C","jp":"様々な職人たちから**建築設計の多様性が学べる**から","trap":"bẫy mọi người","vi":"Không có trong bài — 'học sự đa dạng thiết kế' không phải điều được nêu."},{"key":"D","jp":"経験豊かな職人たちの**仕事ぶりが見られる**から","trap":"bẫy chi tiết phụ","vi":"'Được xem cách làm' không phải lý do được nêu — bài nhấn mạnh THÔNG TIN nhận được từ thợ, không phải cơ hội quan sát."}]},{"huongTuDuy":"Bản vẽ tay (鉛筆) chứa đựng điều gì — đoạn 4-5 mô tả cụ thể.","chotY":"「うまくいっていないところは消しゴムで消し、描き直して修正していく」「慣れてくると、図面上の線から、描いた人の**経験的なレベルや人柄**さえ分かるようになる」「手書きの図面には…**様々な種類の情報が塗り込められている**」.","lienKetJP":"鉛筆図面＝設計の過程（消し跡・修正箇所）＋描いた人の情報（レベル・人柄）→ 様々な情報が含まれる","lienKetVI":"Bản vẽ tay = quá trình thiết kế (chỗ xóa/sửa) + thông tin về người vẽ (trình độ/tính cách) → chứa đựng nhiều loại thông tin","correct":{"jp":"**設計の過程や描いた人**に関する情報が得られる","vi":"Khớp với 「経験的なレベルや人柄…わかる」「様々な種類の情報が塗り込められている」."},"wrong":[{"key":"B","jp":"経験を積んで設計に**自信のある人にしか描けない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói ngay cả 'người thiếu tự tin' cũng để lại dấu vết trong bản vẽ (鉛筆の線にも迷いを見て取れる)."},{"key":"C","jp":"**細部は分かりにくいが、全体は把握しやすい**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói điều này về CAD (「全体を把握しにくい」), không phải về bản vẽ tay."},{"key":"D","jp":"**情報を読み取りにくいが**、描いた人の感情がこもっている","trap":"bẫy ngược nghĩa","vi":"Ngược về 'khó đọc thông tin' — bài nói bản vẽ tay chứa NHIỀU THÔNG TIN HỮU ÍCH, dễ đọc hơn CAD."}]},{"huongTuDuy":"Ảnh hưởng của máy tính đến xã hội — câu kết của đoạn về CAD và công nghệ.","chotY":"「リスクの所在が、より**巨大で、見えにくくなった**」「手から遠いコンピューターの出現によって、リスクの所在を**かぎ取ることが**…難しくなってきている」.","lienKetJP":"コンピューター・CADの普及 → 手を使わなくなる → リスクの所在が見えにくくなる","lienKetVI":"Máy tính/CAD phổ biến → ít dùng tay hơn → vị trí của rủi ro khó nắm bắt hơn","correct":{"jp":"どこにどのような**リスクが潜んでいるか把握しにくくなった**","vi":"Khớp với 「リスクの所在が、より巨大で、見えにくくなった」."},"wrong":[{"key":"A","jp":"多くの情報の中から**必要な情報を選び出しにくくなった**","trap":"bẫy chi tiết phụ","vi":"'Khó chọn thông tin' không phải ảnh hưởng được nêu — bài nói về rủi ro BỊ ẨN, không phải về quá tải thông tin."},{"key":"B","jp":"**リスクの高い様々な種類の情報が氾濫するようになった**","trap":"bẫy chi tiết phụ","vi":"'Thông tin nhiều rủi ro tràn lan' không phải nội dung — bài nói rủi ro BỊ KHUẤT TẦM NHÌN, không phải tăng về lượng."},{"key":"C","jp":"これまでに得られた**経験則が社会で必要とされなくなった**","trap":"bẫy chi tiết phụ","vi":"'Kinh nghiệm không cần nữa' không phải điểm chính — bài nói kinh nghiệm cũ KHÔNG ĐỦ để phát hiện rủi ro mới, không phải 'không cần thiết'."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「**忘れられつつある手の行き場を考えるべき**だろう」「手によって生み出された時間を自分のために使う」「**どこかでそれを、生身の身体を持つ人間の側に引き戻す必要**がある」.","lienKetJP":"コンピュータ化が進む → 手の作業が忘れられる → しかし手から得られる情報は重要 → 手によってなされる仕事の価値を再認識すべき","lienKetVI":"Máy tính hóa tiến nhanh → công việc bằng tay bị lãng quên → nhưng thông tin từ tay vẫn quan trọng → cần NHÌN LẠI GIÁ TRỊ của công việc bằng tay","correct":{"jp":"**手によってなされる仕事の価値を再認識すべき**だ","vi":"Khớp với câu kết 「忘れられつつある手の行き場を考えるべき」「人間の側に引き戻す必要がある」."},"wrong":[{"key":"A","jp":"**コンピュータ化によるリスクを経験則によって回避すべきだ**","trap":"bẫy chi tiết phụ","vi":"'Dùng kinh nghiệm cũ để tránh rủi ro' không phải kết luận bài hướng đến — bài nói kinh nghiệm cũ KHÔNG ĐỦ, cần 'đưa về phía con người'."},{"key":"B","jp":"コンピューター化による**効率重視の風潮を改めるべきだ**","trap":"bẫy chi tiết phụ","vi":"'Sửa thái độ trọng hiệu quả' quá chung chung — bài nhấn mạnh cụ thể vào GIÁ TRỊ CỦA CÔNG VIỆC BẰNG TAY."},{"key":"C","jp":"手によってなされる仕事の**伝統を守っていくべきだ**","trap":"bẫy chi tiết phụ","vi":"'Bảo tồn truyền thống' hàm ý nhìn về quá khứ — bài nhấn mạnh 'NHÌN NHẬN LẠI GIÁ TRỊ' cho hiện tại và tương lai (引き戻す必要)."}]}],"Mon12-15":[{"huongTuDuy":"'Khoa học nguyên thủy' theo tác giả — câu đầu bài định nghĩa rõ ràng.","chotY":"「自然と戯れながら**自然の偉大さを学んでいく**科学」「好奇心、探求心、美を求める心…**人間の感性を最大限練磨**して、人間の可能性を拡大する営み」.","lienKetJP":"原初的な科学＝役立とうという野心を捨て → 自然の偉大さを学ぶ → 人間の感性を磨く","lienKetVI":"Khoa học nguyên thủy = bỏ tham vọng 'có ích' → học từ sự vĩ đại của tự nhiên → mài giũa cảm tính con người","correct":{"jp":"**自然の偉大さを学び**、人間の**感性を豊かにしていく**もの","vi":"Khớp với 「自然の偉大さを学んでいく」「人間の感性を最大限練磨」."},"wrong":[{"key":"A","jp":"一見無用と思われるものを、**世の中に役立てようとする**もの","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — bài nói 「世の中に役立とうというような野心を捨て」 = BỎ tham vọng 'có ích'."},{"key":"B","jp":"人間の可能性を拡大するために、**なくてはならない**もの","trap":"bẫy chi tiết phụ","vi":"'Không thể thiếu' không phải đặc trưng nêu ra — bài nói về MỤC TIÊU của khoa học nguyên thủy, không phải về tính thiết yếu."},{"key":"C","jp":"自然の中で感性豊かに生きるために、**自然を学ばうとするもの**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng thiếu yếu tố cốt lõi 'mài giũa cảm tính' (練磨)  lực nỗ lực."},{"key":"C","jp":"努力をして腕を上げれば、**利益が出るから**","trap":"bẫy chi tiết phụ","vi":"'Lợi nhuận' là kết quả phụ (利益も出るようになるが), không phải lý do của ①努力を惜しまなかった."}]},{"huongTuDuy":"Thời đại thay đổi — cách làm việc của con người thay đổi thế nào?","chotY":"「技はデータとして機械に組み込まれ、**人間に付属するものではなくなってしまった**」「世の仕組みも…努力や修業、技を持つ体を**不要なものとした**のだ」.","lienKetJP":"機械化・効率化 → 技は機械のデータになる → 人間が技を習得する必要がなくなった","lienKetVI":"Cơ giới hóa/hiệu quả hóa → kỹ năng trở thành dữ liệu của máy → con người không cần học kỹ năng nữa","correct":{"jp":"**技を習得することが必要とされなくなった**","vi":"Khớp với 「技はデータとして機械に組み込まれ」「努力や修業、技を持つ体を不要なものとした」."},"wrong":[{"key":"A","jp":"**修業に努力が求められなくなった**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng bài nói bản thân VIỆC TU LUYỆN BỊ LÀM THỪA (不要), không chỉ là 'nỗ lực giảm'."},{"key":"C","jp":"機械の出現で**効率的に修業ができるようになった**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — máy móc không giúp 'tu luyện hiệu quả hơn' mà loại bỏ sự cần thiết của tu luyện."},{"key":"D","jp":"**誰もが機械に精通することを求められるようになった**","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về 'cần thành thạo máy móc'."}]},{"huongTuDuy":"Quan điểm tổng kết của tác giả — bám câu kết bài.","chotY":"「社会が変わっても人は生きていかねばならない。…新しい時代の中で**働く意味と喜びを見つけ出さなければ**、生きづらさが増すばかりだ」.","lienKetJP":"機械を捨てるわけではない → しかし → 新しい時代の中でも働く意味と喜びを見つける → それが重要","lienKetVI":"Không bỏ máy móc → nhưng → trong thời đại mới vẫn phải tìm ra ý nghĩa/niềm vui trong lao động → điều đó là quan trọng","correct":{"jp":"**時代が変わっても**、**働く意味と喜びを見つけ**て生きていこう","vi":"Khớp với 「新しい時代の中で働く意味と喜びを見つけ出さなければ…」."},"wrong":[{"key":"A","jp":"生きづらい社会であっても、**誇りを持って**生きていこう","trap":"bẫy chi tiết phụ","vi":"'Tự hào' là cảm xúc được nêu khi mô tả người xưa, không phải kết luận tác giả hướng đến."},{"key":"B","jp":"**修業を通して働く意味と喜びを得られた時代に戻るべきだ**","trap":"bẫy chi tiết phụ","vi":"'Quay lại thời xưa' không phải kết luận — tác giả nói 「機械を捨てるというのではない」 = không phủ nhận hiện đại."},{"key":"D","jp":"働く意味や喜びを大切にしながら、**効率を追求していくべきだ**","trap":"bẫy chi tiết phụ","vi":"'Đuổi theo hiệu quả' không phải điểm nhấn — bài chú trọng vào 'ý nghĩa và niềm vui lao động', không phải tối ưu hóa hiệu quả."}]}],"Mon12-18":[{"huongTuDuy":"Quy tắc xã hội ngày xưa được hình thành thế nào — câu đầu đoạn 2 giải thích.","chotY":"「同じ土地で、たくさんの人が**争わずに仲良く生活するためにひつよう**だから」「自然に生まれてくるものであった」.","lienKetJP":"かつては → 同じ土地での営みの中で → 自然に生まれてくる（必要があったから）","lienKetVI":"Ngày xưa → từ hoạt động sống chung trên cùng mảnh đất → tự nhiên nảy sinh (vì cần thiết)","correct":{"jp":"ともに生活するうえで必要なものとして、同じ土地の人々の間で**自然に発生した**","vi":"Khớp với 「その場所での営みの中で自然に生まれてくる」「争わずに仲良く生活するためにひつよう」."},"wrong":[{"key":"A","jp":"**自分自身よりも、周りの人を優先するという考え**に基づいていた","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm nguyên tắc 'người khác trước bản thân'."},{"key":"B","jp":"同じ土地の人々の間でも、**一様に認識されているものではなかった**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói quy chuẩn ngày xưa được CHIA SẺ tự nhiên bởi cộng đồng, không phải 'không nhất quán'."},{"key":"C","jp":"同じ土地で人々と争わずに生活していれば、**自然に身についてくる**ものだった","trap":"bẫy chi tiết phụ","vi":"'Tự nhiên thấm vào bản thân' nhầm chủ thể — bài nói quy chuẩn TỰ NHIÊN PHÁT SINH TRONG CỘNG ĐỒNG, không phải 'bản thân từng người tự nhiên học được'."}]},{"huongTuDuy":"'Vô thức trở thành khuôn mẫu' — cần xác định đúng nội dung của cụm ẩn dụ này.","chotY":"「自分でいちいち判断せずに従っていると、今度はそれが**無意識の型となってくる**」「なぜその行動をしているのか…**改めて考えなくなる**」「物事の判断基準が「**ルールに従っているかどうか**」に変わってしまう」.","lienKetJP":"理由を考えずにルールに従う → 無意識に従うのが当たり前になる → 法律・制度を考えずに従うべきものとして認識","lienKetVI":"Không suy nghĩ lý do mà theo quy tắc → vô thức biến thành thói quen → nhận thức quy tắc là 'điều phải tuân theo' mà không cần hiểu","correct":{"jp":"**法律や制度の必要性を考えずに**、従うべきものとして**認識してしまう**","vi":"Khớp với 「なぜその行動をしているのか考えなくなる」「判断基準が「ルールに従っているかどうか」に変わる」."},"wrong":[{"key":"A","jp":"法律や制度に合わせることが、**特に難しいことではなくなってくる**","trap":"bẫy chi tiết phụ","vi":"'Không khó để tuân theo' không phải nội dung của 無意識の型 — bài nhấn mạnh mất đi SỰ NHẬN THỨC/PHÁN ĐOÁN, không phải về độ khó."},{"key":"C","jp":"法律や制度の意味が分からなくなり、**守る必要性を感じなくなる**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói TIẾP TỤC TUÂN THEO (theo khuôn mẫu), không phải 'không cảm thấy cần tuân theo'."},{"key":"D","jp":"法律や制度の意味を理解していなくても、**人々の間で共有できる**","trap":"bẫy chi tiết phụ","vi":"'Được chia sẻ dù không hiểu' là hiện tượng có thật nhưng sai ý nghĩa của vấn đề — bài phê phán điều này, không phải coi là tốt."}]},{"huongTuDuy":"Điều tác giả muốn nói — bám câu kết bài.","chotY":"「もう一度それに正しくまなざしを向けなおすためには、**その想像の型をいったん外して、全く違う型を取ってみることが重要**なのである」.","lienKetJP":"ルールが単なる記号になる → まなざしを向けなおす必要 → 想像の型を外す → なぜそのルールがあるのか考えること","lienKetVI":"Quy tắc trở thành ký hiệu đơn thuần → cần nhìn lại → thoát khỏi khuôn mẫu tư duy → nghĩ xem TẠI SAO có quy tắc đó","correct":{"jp":"**なぜそのルールがあるのか**を考えて、行動することが大切だ","vi":"Khớp với 「その想像の型をいったん外して」「なぜその場所にそのルールがあるのかを改めて考えなくなる」(phê phán điều này)."},"wrong":[{"key":"A","jp":"ルールは**時代の変化に合わせて変えていく**ことが大切だ","trap":"bẫy chi tiết phụ","vi":"'Thay đổi quy tắc theo thời đại' không phải điều được đề xuất — bài nói về THÁI ĐỘ với quy tắc, không phải cách sửa đổi quy tắc."},{"key":"B","jp":"ルールの有無にかかわらず、**自身が正しいと思う行動をすべきだ**","trap":"bẫy mọi người","vi":"'Làm theo lương tâm bất kể quy tắc' quá cực đoan — bài không phủ nhận quy tắc, chỉ kêu gọi HIỂU LÝ DO của chúng."},{"key":"D","jp":"これまでのルールに反している行動でも、**社会の中で許容していくべきだ**","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về sự khoan dung với hành vi vi phạm quy tắc."}]}],"Mon12-19":[{"huongTuDuy":"Câu mở bài phủ định hoàn toàn 2 quan niệm sai: (A) tự thích nghi và (B) di chuyển tìm môi trường phù hợp — rồi chỉ ra cơ chế thật sự.","chotY":"「DNAに生じた変化は、「偶然」によるものだ」「その変化がたまたま自然環境に合っていれば、その生物は子孫を残せた」","lienKetJP":"DNA変化は偶然（自身の意志ではない）→ たまたま環境に合った変化だけが生き残る → 自然界で子孫を残せた理由","lienKetVI":"Biến đổi DNA là ngẫu nhiên (không phải ý chí) → biến đổi nào vô tình phù hợp môi trường → loài đó giữ lại được con cháu","correct":{"jp":"DNAに生じた変化が、**たまたま自然環境に合った**から","vi":"Khớp với 「その変化がたまたま自然環境に合っていれば」— 'たまたま' là từ khóa cốt lõi: ngẫu nhiên, không phải chủ ý."},"wrong":[{"key":"A","jp":"自然環境に合わせて**自身を変化させた**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài khẳng định sinh vật KHÔNG tự chủ ý thay đổi theo môi trường, biến đổi là ngẫu nhiên (偶然)."},{"key":"B","jp":"自身に適した自然環境を選んで**移動した**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phủ định việc 'tự di chuyển tìm môi trường phù hợp' (そんな都合のいいことにはならない)."},{"key":"C","jp":"DNAが複製されるときに、ずれが**生じなかった**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — chính CÁI LỖI (ずれ) khi sao chép DNA mới tạo ra biến đổi, không có lỗi thì không có tiến hóa."}]},{"huongTuDuy":"①ホワイトレグホン — chỉ thị từ, tìm đúng mô tả đặc điểm hiện tại của giống gà này.","chotY":"「ある種の鳥は、卵を産んでも暖めることを放棄してしまったら」「人間はその鳥の卵を代わって暖め…毎日排卵し、300個以上も卵を産み続ける」","lienKetJP":"本来：卵を産んで暖める → 変化：暖めることを放棄 → 人間が代わりに暖める → 現在：卵を産んでも暖めない（①ホワイトレグホン）","lienKetVI":"Bình thường: đẻ trứng rồi ấp → Biến đổi: không còn ấp trứng → người ấp thay → Hiện tại gà Bạch Leghorn đẻ trứng mà không ấp","correct":{"jp":"卵を産んでも**暖めない**","vi":"Khớp trực tiếp với 「卵を産んでも暖めることを放棄してしまった」 — đặc điểm cốt lõi của ①ホワイトレグホン."},"wrong":[{"key":"B","jp":"一度に**多くの卵を産む**","trap":"bẫy chi tiết phụ","vi":"Gần đúng về số lượng (300個以上) nhưng sai đặc trưng ĐỊNH NGHĨA — điều đặc biệt không phải 'đẻ nhiều' mà là 'đẻ mà không ấp'."},{"key":"C","jp":"産んだ卵を**ほかの鳥に託す**","trap":"bẫy mọi người","vi":"Không có trong bài — gà không nhờ chim khác ấp, mà là CON NGƯỜI ấp thay."},{"key":"D","jp":"ほかの鳥より卵を**暖める時間が短い**","trap":"bẫy chi tiết phụ","vi":"Sai mức độ — không phải 'ấp ngắn hơn' mà là KHÔNG ẤP HOÀN TOÀN (放棄)."}]},{"huongTuDuy":"カイコ — chuỗi nhân-quả khi người cung cấp thức ăn nhân tạo liên tục.","chotY":"「人間が常時餌を供給してやるようにすると、幼虫は餌を探索するのをサボるようになる」「余力を絹糸を作り出すことに振り向けるようになった」","lienKetJP":"人間が餌を供給 → 幼虫が餌探索をサボる → 余力が生まれる → 絹糸を作ることに専念","lienKetVI":"Người cung cấp thức ăn → tằm không cần tìm mồi → có thêm năng lượng dư → dồn vào tạo tơ tằm","correct":{"jp":"人間が餌を与えることで、**絹糸を作ることに専念**するようになった","vi":"Khớp với 「余力を絹糸を作り出すことに振り向けるようになった」 — chuỗi nhân quả đúng."},"wrong":[{"key":"A","jp":"身動きが取れないため、細糸が**多く作り出せなくなった**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói tằm TẠO RA NHIỀU tơ hơn (振り向ける), không phải ít hơn."},{"key":"C","jp":"生きるエネルギーの大部分を、**餌を食べることに費やす**ようになった","trap":"bẫy ngược nghĩa","vi":"Ngược nhân quả — chính vì KHÔNG cần tìm mồi nữa nên mới có thêm năng lượng cho tơ."},{"key":"D","jp":"人工的な環境を与えた結果、絹糸を作るという**新しい能力を獲得した**","trap":"bẫy chi tiết phụ","vi":"Sai — bài nói tằm vốn đã có khả năng tạo tơ từ trước (もともと), người chỉ giúp nó TẬP TRUNG vào đó, không phải 'năng lực mới'."}]},{"huongTuDuy":"Câu hỏi tổng kết — bám câu kết bài về trách nhiệm của con người.","chotY":"「人が作りかえたいのち。それに対して人間はきちんと**責任を取らなければならない**」「その生命たちはもはや**人間なしでは生きていくことができない**」","lienKetJP":"人間が選択者として生命を作りかえた → 生命は人間なしでは生きられない → 人間は作り出した生命との共生関係を維持する責任がある","lienKetVI":"Con người thay tự nhiên thay đổi sinh vật → sinh vật không thể sống thiếu người → người phải duy trì quan hệ cộng sinh và chịu trách nhiệm","correct":{"jp":"人間は**作り出した生命との共生関係を維持**しなければならない","vi":"Khớp với 「人間はきちんと責任を取らなければならない」 — duy trì quan hệ cộng sinh với sinh vật mình đã tạo ra."},"wrong":[{"key":"A","jp":"人間が作りかえた生物は、**本来の姿に戻さなければならない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 「カイコは人間がいないと生きていけない」 — đã không thể trở về tự nhiên được nữa."},{"key":"B","jp":"人間はあらゆる生物と**新たな共生関係を築くべきだ**","trap":"bẫy chi tiết phụ","vi":"Quá rộng — 'mọi sinh vật' sai phạm vi; bài chỉ nói về sinh vật mà CON NGƯỜI ĐÃ CAN THIỆP và tạo ra."},{"key":"C","jp":"人間は生物の進化のプロセスに**介入するべきではない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài mô tả thực tế con người ĐÃ CAN THIỆP và TIẾP TỤC phải chịu trách nhiệm, không phủ nhận việc can thiệp."}]}],"Mon12-20":[{"huongTuDuy":"「よいこと」là câu chỉ thị về đoạn vừa nói — tìm nội dung ngay trước câu đó.","chotY":"「個性的であろうと試みること…自分にとって個性とはと、考えるのはよいことだ」→「自分というものを意識していく、一つの**過程**である」","lienKetJP":"個性的になろうとする（失敗しても）→ 自分について考える → 自分というものを意識する過程 → それがよいこと","lienKetVI":"Cố trở nên cá tính (dù thất bại) → suy nghĩ về bản thân → trở thành quá trình ý thức về 'bản thân là ai' → đó mới là điều tốt","correct":{"jp":"**自分という人間を意識**することになるから","vi":"Khớp với 「自分というものを意識していく、一つの過程」— quá trình cố gắng giúp ý thức về bản thân."},"wrong":[{"key":"A","jp":"個性的である**必要はないと気づく**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không nói 'không cần cá tính', mà nói quá trình TÌM KIẾM cá tính có giá trị riêng của nó."},{"key":"B","jp":"挫折したり悩んだりする**経験が個性を作る**から","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — bài không nói 'thất bại tạo ra cá tính', mà nói thất bại là bằng chứng bạn đang ý thức về bản thân mình."},{"key":"D","jp":"自分にあてはまる**個性の型を見付けられる**から","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phê phán chính tư duy 'tìm khuôn mẫu cá tính phù hợp' (型にあてはめる) là không phải cá tính thật."}]},{"huongTuDuy":"Câu hỏi về định nghĩa 'cá tính' theo tác giả — bám đoạn giải thích cuối.","chotY":"「個性というものは、人間のひとりひとりに**備わったもの**で、その個性がありのままに出ていることが、本当の意味で個性的である」","lienKetJP":"個性＝最初からひとりひとりに備わっている → 求めるものではない → ありのままに出ることが本当の個性","lienKetVI":"Cá tính = vốn có sẵn trong mỗi người từ đầu → không phải thứ cần tìm kiếm → thể hiện tự nhiên mới là cá tính thật","correct":{"jp":"求めて得るものではなく、**初めから持っている**ものだ","vi":"Khớp với 「個性というものは、人間のひとりひとりに備わったもの」 — cặp gần nghĩa: 備わったもの ↔ 初めから持っているもの."},"wrong":[{"key":"A","jp":"自分から**社会とかかわることで**、意識できるものだ","trap":"bẫy chi tiết phụ","vi":"'Kết nối xã hội' là điều kiện để THỂ HIỆN cá tính ra ngoài (社会との関わりも含めて), không phải để NHẬN RA cá tính."},{"key":"B","jp":"他人と**比較しなければ**、自然に発揮できるものだ","trap":"bẫy ngược nghĩa","vi":"Sai — bài không nêu 'không so sánh' là điều kiện; hơn nữa bài nói trong xã hội buộc phải để ý đến người khác."},{"key":"C","jp":"なりたい自分を**意識すれば**、自然に身につくものだ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 'muốn trở thành' là cách tiếp cận từ bên ngoài vào, còn bài nói cá tính là thứ ĐÃ CÓ SẴN bên trong, chỉ cần để nó tự nhiên ra."}]},{"huongTuDuy":"Câu hỏi tổng kết — bám câu kết bài cuối cùng.","chotY":"「それでも結局、自分とはありのままの自分しかない。それを**自覚したとき**、きみは**個性的なきみになる**」","lienKetJP":"型を追う・逃げる → どちらも本当の個性ではない → 結局ありのままの自分しかない → 自覚 → 個性的になる","lienKetVI":"Đuổi theo khuôn mẫu / trốn chạy → đều không phải cá tính thật → cuối cùng chỉ có bản thân thật → ý thức điều đó → trở nên cá tính","correct":{"jp":"**自分自身であることが大事**だ","vi":"Khớp với câu kết 「自分とはありのままの自分しかない」「自覚したとき、きみは個性的なきみになる」 — cốt lõi là sống đúng bản thân."},"wrong":[{"key":"A","jp":"自分の**個性を模索すべき**だ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói cá tính ĐÃ CÓ SẴN, không cần 'tìm kiếm' (模索); tìm kiếm là cách tiếp cận sai."},{"key":"C","jp":"ありのままの自分を出せ**なくてもいい**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — toàn bài hướng đến 'ありのままの自分を出すこと' là điều cốt lõi."},{"key":"D","jp":"**型に縛られない**生き方をしたほうがいい","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng thiếu chiều sâu — không chỉ 'thoát khuôn mẫu' mà phải 'tự giác rằng bản thân thật là chính mình'; đây là hệ quả, không phải thông điệp cốt lõi."}]}],"Mon12-21":[{"huongTuDuy":"Lý do tác giả nói hiệu quả giáo dục 'không lớn' — đoạn giải thích ngay sau.","chotY":"「教えたとおりに育つとはかぎらない」「教えるつもりがなくても子どもは自ら学んでしまう」「人が発達するのは子どもたちだ」.","lienKetJP":"教育の効果が大きくない → なぜなら → 教えたとおりに子どもは育たないから","lienKetVI":"Hiệu quả giáo dục không lớn → vì → trẻ không nhất thiết lớn lên đúng như được dạy","correct":{"jp":"子どもは、**教えたとおりに育つとはかぎらない**から","vi":"Khớp trực tiếp với 「教えたとおりに育つとはかぎらない」."},"wrong":[{"key":"A","jp":"企業や社会が望む人材と、教育学で目標とする人材は異なるから","trap":"bẫy mọi người","vi":"Không phải lý do được nêu — bài không so sánh mục tiêu của doanh nghiệp và giáo dục học."},{"key":"B","jp":"「生きる力」をつけるために必要なことは、**明確ではない**から","trap":"bẫy chi tiết phụ","vi":"'Không rõ ràng' không phải lý do cụ thể — bài nói về tính BẤT ĐỊNH của kết quả giáo dục, không phải sự không rõ ràng của mục tiêu."},{"key":"C","jp":"子ども一人一人に合わせて、**教育の内容を変えられない**から","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về hạn chế của giáo dục cá nhân hóa."}]},{"huongTuDuy":"Quan điểm của tác giả về giáo dục — bám câu giải thích về 'méo mó'.","chotY":"「ある特定の目的のために教育を合理化・効率化しようとすれば、教育はいびつになる」「もともと、教育は経済のため、地域のため、家族のためだけにあるのではない」.","lienKetJP":"教育＝特定の目的のためだけではない → 特定の目的のために合理化すれば歪む","lienKetVI":"Giáo dục không chỉ vì 1 mục đích cụ thể → nếu hợp lý hóa vì 1 mục đích sẽ bị méo mó","correct":{"jp":"**特定の目的を果たすために存在するものではない**","vi":"Khớp với 「教育は経済のためだけにあるのではない」「特定の目的のために合理化すれば歪む」."},"wrong":[{"key":"A","jp":"それぞれの目的に合わせて**合理化・効率化しなければ**、機能しない","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói hợp lý hóa/tối ưu hóa vì mục đích cụ thể làm giáo dục BỊ MÉO MÓ."},{"key":"B","jp":"みんなで一つの目的を共有しなければ、**効果は上がらない**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài cảnh báo chính việc 'mọi người cùng rút lợi ích riêng' làm giáo dục không vận hành tốt."},{"key":"D","jp":"**役に立つかどうかという観点**で評価されるべきだ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phê phán cách nhìn này (giáo dục như công cụ kinh tế)."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「「教育に過大な期待をするな」という警告こそが、今の社会と教育を守るために最も必要なことかもしれない」.","lienKetJP":"教育への過大な期待 → 教育が改革の波に飲まれる → 「現代社会の問題すべてを教育で解決できると思うな」","lienKetVI":"Kỳ vọng quá lớn vào giáo dục → giáo dục bị cuốn vào làn sóng cải cách → 'đừng nghĩ mọi vấn đề xã hội đều giải quyết được bằng giáo dục'","correct":{"jp":"現代社会の**問題のすべてが、教育で解決できる**と思ってはいけない","vi":"Khớp trực tiếp với câu mở và câu kết: 「教育に過大な期待をするな」."},"wrong":[{"key":"A","jp":"多様な社会の要求に応じられるように、**教育のあり方を考え直すべきだ**","trap":"bẫy chi tiết phụ","vi":"'Suy nghĩ lại về giáo dục' gần đúng nhưng không phải điểm nhấn — bài nhấn mạnh GIẢM KỲ VỌNG, không phải cải cách thêm."},{"key":"B","jp":"社会の不安を取り除くためには、**教育を合理化・効率化すべきではない**","trap":"bẫy chi tiết phụ","vi":"'Không nên hợp lý hóa' là lý lẽ trong bài nhưng không phải thông điệp tổng kết — câu kết nhấn mạnh 'đừng kỳ vọng quá'."},{"key":"C","jp":"教育の**改革によって、安定した社会を持続させていくことが必要だろう**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói giáo dục đang bị cuốn vào 'làn sóng cải cách' một cách tai hại, không ủng hộ thêm cải cách."}]}],"Mon12-22":[{"huongTuDuy":"Lý do SNS không giúp được trong lúc gặp khó khăn — tìm câu giải thích trực tiếp.","chotY":"「匿名の支持者は、トラブルの話題自体すぐに忘れてしまう。あっというまに集まった人々は、**同じくあっというまに離れる**」.","lienKetJP":"SNSの支持者＝匿名・面倒なし → トラブルの話題をすぐ忘れる → あっというまに去ってしまう → 役に立たない","lienKetVI":"Người ủng hộ SNS = ẩn danh, không phiền phức → nhanh quên chủ đề → nhanh chóng rời đi → không giúp được","correct":{"jp":"SNSの支持者は**すぐに興味をなくし、去ってしまう**から","vi":"Khớp với 「あっというまに集まった人々は…あっというまに離れる」."},"wrong":[{"key":"A","jp":"SNSの支持者の意見はさまざまで、**すぐにはまとまらない**から","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về 'ý kiến phân tán'."},{"key":"B","jp":"SNSの支持者は**無名で権威を持たない**ひとが多いから","trap":"bẫy chi tiết phụ","vi":"'Vô danh không có uy quyền' là mô tả thực tế nhưng không phải LÝ DO giải thích tại sao SNS không giúp được — lý do là SỰ NHANH CHÓNG RỜI ĐI."},{"key":"C","jp":"SNSの支持者はトラブルの原因を**誤解したまますぐに発信する**から","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý về 'hiểu nhầm rồi phát tán'."}]},{"huongTuDuy":"Về 'thời kỳ khó khăn' — tác giả nói gì về cách vượt qua?","chotY":"「継続的に助けてくれるのは、結局は**面倒な人間関係に支えられた家族や友人**たちだったりする」「その**小さく面倒な人間関係をどれだけ濃密**に作れるかで、人生の広がりが決まる」.","lienKetJP":"困難な時期 → SNSは役立たない → 継続的に助けるのは → 面倒だが深い家族・友人関係","lienKetVI":"Thời kỳ khó khăn → SNS không giúp được → điều giúp liên tục là → quan hệ gia đình/bạn bè sâu sắc (dù phiền phức)","correct":{"jp":"**家族や友人**のような存在との**深い関係**によって、乗り越えられる","vi":"Khớp với 「面倒な人間関係に支えられた家族や友人たちだったりする」."},"wrong":[{"key":"A","jp":"自分と世界の認識のズレに気づき**自分が変わろうとすれば**、乗り越えられる","trap":"bẫy chi tiết phụ","vi":"'Tự mình thay đổi' là quá trình được mô tả nhưng không phải CÁI GIÚP VƯỢT QUA — điều giúp vượt qua là QUAN HỆ SÂU SẮC với người thân."},{"key":"B","jp":"「議論」によって相手や**自分を変化させること**で、乗り越えられる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ 「「議論」で相手が変わると考えているひとは、人間の本質について無知」."},{"key":"C","jp":"少数の身の回りの人々から**人間関係を広げていけば**、乗り越えられる","trap":"bẫy chi tiết phụ","vi":"'Mở rộng quan hệ' không phải điểm nhấn — bài nhấn mạnh CHIỀU SÂU (濃密) của quan hệ nhỏ, không phải sự mở rộng."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「情報技術は、面倒のない人間関係の調達を可能にしたが、それはまた**人間から変化の可能性を奪う**ものでもあった。そのことを忘れずにおきたいと思う」.","lienKetJP":"情報技術＝面倒なし関係を作れる → しかし → 変化の可能性を奪う → 人間の成長はない","lienKetVI":"Công nghệ thông tin = tạo quan hệ không phiền phức → nhưng → cướp đi khả năng thay đổi/phát triển của người","correct":{"jp":"情報技術によって作られた人間関係では、**人間の変化は期待できない**","vi":"Khớp với câu kết 「情報技術は…人間から変化の可能性を奪うものでもあった」."},"wrong":[{"key":"A","jp":"情報技術の特徴を理解したうえで活用すれば、**自分自身の変化につながる**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không ủng hộ 'tận dụng tốt công nghệ', mà cảnh báo bản chất của nó."},{"key":"B","jp":"情報技術を活用すれば、**面倒な人間関係を変えられる**可能性がある","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 'quan hệ phiền phức' (gia đình/bạn bè thật) MỚI LÀ thứ tạo ra thay đổi, không phải công nghệ."},{"key":"D","jp":"情報技術は人間の変化の可能性を奪うものであり、**利用は控えるべきだ**","trap":"bẫy chi tiết phụ","vi":"Quá cực đoan — bài không kêu gọi 'không dùng công nghệ', chỉ muốn người ta NHẬN THỨC được hạn chế của nó."}]}],"Mon12-23":[{"huongTuDuy":"Cha mẹ/giáo viên đang làm gì với con cái/học sinh — đoạn 2-3 mô tả.","chotY":"「親も教師も…子ども(生徒)たちを家庭や学校の生活の**枠組みに入れなければならない**」「社会的規範を生まれてから次々と覚え、**身につけていかねばならない**。これは…不自由なことである」.","lienKetJP":"親・教師の役割 → 社会的規範を教える → 社会の枠組みに適応させる → 避けられない","lienKetVI":"Vai trò cha mẹ/giáo viên → dạy quy chuẩn xã hội → cho trẻ thích nghi với khuôn khổ xã hội → không thể tránh","correct":{"jp":"**社会的規範を教え**、**社会の枠組みに適応させている**","vi":"Khớp với 「枠組みに入れなければならない」「社会的規範を身につけさせなければならない」."},"wrong":[{"key":"A","jp":"**反抗を容認しつつ**、不自由な社会的規範に従わせている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói 「反抗は望ましいから大いに結構とも違う」 — không phải 'chấp nhận phản kháng'."},{"key":"B","jp":"**どの時代にも通用する**社会的規範を身につけさせている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ quy chuẩn chỉ là 「暫定的なもの」 (tạm thời), thay đổi theo thời đại, không phải vĩnh cửu."},{"key":"D","jp":"社会的規範を教えたうえで、**自由に生きる方法**を身につけさせている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói chính xác ngược lại: 「動物的な本能を抑圧されて、社会的規範を覚えていく。これは不自由なこと」."}]},{"huongTuDuy":"'Tinh thần tài sản' (精神的な財産) là gì — tìm định nghĩa trong văn cảnh.","chotY":"「社会的に生きていくために**今ある社会的規範やルール、考え方をひとまず受け入れなければならない**ということだけである。そして、そういうひとを規制し構成してきたもろもろの**精神的な財産**は、時代とともに変わってきた」.","lienKetJP":"精神的な財産＝社会的規範やルール・考え方 → 社会で生きていくために作られてきたもの → 時代とともに変わる","lienKetVI":"Tài sản tinh thần = quy chuẩn xã hội/nguyên tắc/cách nghĩ → được tạo ra để sống trong xã hội → thay đổi theo thời đại","correct":{"jp":"ひとが**社会で生きていくために作られてきたもの**","vi":"Khớp với 「社会的に生きていくために今ある社会的規範やルール…受け入れなければならない」."},"wrong":[{"key":"A","jp":"ひとが**幸福になるために守ってきた**もの","trap":"bẫy chi tiết phụ","vi":"'Để trở nên hạnh phúc' không phải mục đích được nêu — bài nói 「本当にひとの幸福にとってふさわしいものかどうかはわからない」 — tức là KHÔNG CHẮC có phải để hạnh phúc."},{"key":"B","jp":"ひとが**本能を抑圧されずに生きるため**のもの","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói xã hội quy chuẩn là thứ PHẢI DÙNG để 'ép bản năng' (動物的な本能を抑圧されて身につける)."},{"key":"D","jp":"これから**生まれ育っていく子どもにとって必要なもの**","trap":"bẫy chi tiết phụ","vi":"'Cần thiết cho thế hệ sau' không phải định nghĩa — bài nói rõ 「その子どもにとって絶対的に必要かどうかもわからない」."}]},{"huongTuDuy":"Điều tác giả muốn nói nhất — bám câu kết bài.","chotY":"「おとなと子どもとの誤差は、基本的にはいつでも**歓迎していいことである**」「社会的規範は…**暫定的なもの**にすぎない。だから、**子どもは親(教師)の思うとおりにはならない**のだ」.","lienKetJP":"社会的規範は時代とともに変わる → 次の世代は同じにならない → それを歓迎すべき → 当然のこと","lienKetVI":"Quy chuẩn xã hội thay đổi theo thời đại → thế hệ sau khác đi → nên chào đón điều đó → là điều đương nhiên","correct":{"jp":"社会的規範は時代によって変化するものであり、**子どもはおとなの思うとおりにならなくて当然**である","vi":"Khớp với câu kết 「おとなと子どもとの誤差は…歓迎していいことである」「社会的規範は暫定的なもの」."},"wrong":[{"key":"B","jp":"社会的規範は暫定的なものにすぎず、**子どもが自身の考え方に合ったものを作っていくことが望ましい**","trap":"bẫy chi tiết phụ","vi":"'Trẻ tự tạo quy chuẩn mới' quá cực đoan — bài không nói điều này, chỉ nói sự THAY ĐỔI giữa các thế hệ là tự nhiên và nên chào đón."},{"key":"C","jp":"時代の変化に適応できるように、**おとなは子どもに社会的規範の背景となる考え方を教えたほうがいい**","trap":"bẫy mọi người","vi":"'Dạy tư duy đằng sau quy chuẩn' không phải điều tác giả đề xuất — bài nhấn mạnh CHẤP NHẬN sự khác biệt, không phải cách giảng dạy."},{"key":"D","jp":"時代によって考え方は変化するものなので、**次の世 function loadLocalProfile(){
  try{const r=localStorage.getItem('dhtm_profile_v1');return r?JSON.parse(r):null;}catch(e){return null;}

function saveLocalProfile(p){
  try{localStorage.setItem('dhtm_profile_v1',JSON.stringify(p));}catch(e){}

function awardExp(amount){
  const profile=loadLocalProfile();
  if(!profile)return false;
  let exp=(profile.exp||0)+amount, level=profile.level||1, expToNext=profile.expToNext||100;
  let leveledUp=false;
  while(exp>=expToNext){exp-=expToNext;level+=1;expToNext=Math.round(expToNext*1.25);leveledUp=true;}
  profile.exp=exp;profile.level=level;profile.expToNext=expToNext;
  saveLocalProfile(profile);
  return leveledUp;
}
function pickHype(){return HYPE_MESSAGES[Math.floor(Math.random()*HYPE_MESSAGES.length)];}
function showCoinBurst(amount){
  const overlay=document.createElement('div');

  card.className='coin-burst-card';
  const icon=document.createElement('div');
  icon.className='coin-burst-icon';

  const sub=document.createElement('div');
  sub.className='coin-burst-sub';
  sub.textContent='Nhặt được xu may mắn!';
  card.appendChild(icon);

  for(let i=0;i<14;i++){

    pt.className='coin-particle';

    const angle=Math.random()*Math.PI*2;

    pt.style.setProperty('--dx',(Math.cos(angle)*dist)+'px');
    pt.style.setProperty('--dy',(Math.sin(angle)*dist)+'px');
    overlay.appendChild(pt);
  }
  document.body.appendChild(overlay);
  setTimeout(()=>{card.classList.add('coin-burst-out');},1200);

}

function computeAnchors(passage,options,answerIdx){
  if(answerIdx===undefined||!options[answerIdx])return[];
  const ans=options[answerIdx];
  const kanjiRe=/[\u4E00-\u9FFF]{2,}/g;
  const words=new Set();let m;
  while((m=kanjiRe.exec(ans))!==null){words.add(m[0]);}
  return Array.from(words).filter(w=>passage.includes(w));
}

function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mdBold(s){return escHtml(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
function addSpans(arr,text,words,cls){
  const sorted=words.slice().sort((a,b)=>b.length-a.length);
  const used=new Uint8Array(text.length);
  sorted.forEach(w=>{
    if(!w)return;let pos=0;
    while((pos=text.indexOf(w,pos))!==-1){
      const end=pos+w.length;let conflict=false;
      for(let i=pos;i<end;i++){if(used[i]){conflict=true;break;}}
      if(!conflict){arr.push({start:pos,end,cls});for(let i=pos;i<end;i++)used[i]=1;}
      pos++;
    }
  });
}
function buildHTML(text,spans){
  if(!spans.length)return escHtml(text);
  spans.sort((a,b)=>a.start-b.start);
  let html="",pos=0;
  spans.forEach(sp=>{
    if(sp.start<pos)return;
    html+=escHtml(text.slice(pos,sp.start));
    html+='<span class="'+sp.cls+'">'+escHtml(text.slice(sp.start,sp.end))+'</span>';
    pos=sp.end;
  });
  html+=escHtml(text.slice(pos));return html;
}
function applyPassageHighlight(item){
  const passageEl=document.getElementById("passage");if(!passageEl)return;
  const raw=item.passage;const spans=[];
  if(state.hlConn)addSpans(spans,raw,CONNECTIVES,"hl-connective");
  if(state.hlAnchor){
    let allAnchors=[];
    item.questions.forEach(q=>{allAnchors=allAnchors.concat(computeAnchors(item.passage,q.options,q.answer));});
    allAnchors=Array.from(new Set(allAnchors));
    addSpans(spans,raw,allAnchors,"hl-anchor");
  }
  passageEl.innerHTML=buildHTML(raw,spans);
}
function renderDetailExplain(item,qi,q){
  const detailList=EXPL_DETAIL[item.source+'-'+item.bai];
  const d=detailList?detailList[qi]:null;
  if(!d){
    return '<div class="expl-label">💡 Giải thích</div><div class="chain-box">'+escHtml(q.explain||"")+'</div>';
  }
  let html="";
  html+='<div class="expl-section"><div class="expl-label">1. Hướng tư duy</div><div class="expl-body">'+mdBold(d.huongTuDuy)+'</div></div>';
  html+='<div class="expl-section"><div class="expl-label">2. Chốt ý</div><div class="expl-body">'+mdBold(d.chotY)+'</div></div>';
  html+='<div class="expl-section"><div class="expl-label">3. Liên kết đầu — cuối</div><div class="chain-box"><span class="jp">'+escHtml(d.lienKetJP)+'</span>'+escHtml(d.lienKetVI)+'</div></div>';
  html+='<div class="expl-section"><div class="expl-label">4. Đáp án đúng</div><div class="opt-expl correct-e"><span class="key">✅ '+String.fromCharCode(65+q.answer)+'.</span><span class="jp-text">'+mdBold(d.correct.jp)+'</span>'+escHtml(d.correct.vi)+'</div></div>';
  html+='<div class="expl-section"><div class="expl-label">5. Đáp án sai</div>';
  d.wrong.forEach(function(w){
    html+='<div class="opt-expl wrong-e"><span class="key">❌ '+w.key+'.</span><span class="jp-text">'+mdBold(w.jp)+'</span>'+escHtml(w.vi)+'<span class="trap-tag">'+escHtml(w.trap)+'</span></div>';
  });
  html+='</div>';
  return html;
}
function render(){
  buildSheetNav();
  const list=filtered();const item=list[currentBaiIndex];
  const content=document.getElementById("content");content.innerHTML="";
  document.getElementById("progress").textContent=currentSrc+" — Bài "+item.bai+" / "+list.length+" ("+item.date+")";
  document.getElementById("noteBanner").textContent=hasDetail(item)
    ?"✅ Bài này đã có giải thích chi tiết đầy đủ (5 mục + nhãn bẫy)."
    :"⏳ Bài này chưa có giải thích chi tiết — đang dùng bản tóm tắt.";
  const passageWrap=document.createElement("div");passageWrap.className="passage-wrap";
  const passageDiv=document.createElement("div");passageDiv.className="passage";passageDiv.id="passage";
  passageWrap.appendChild(passageDiv);content.appendChild(passageWrap);
  item.questions.forEach(function(q,qi){
    const card=document.createElement("div");card.className="qcard";
    const tag=document.createElement("div");tag.className="qtag";tag.textContent="Câu "+(qi+1);card.appendChild(tag);
    const qt=document.createElement("div");qt.className="qtext";qt.textContent=q.q;card.appendChild(qt);
    const optsDiv=document.createElement("div");optsDiv.className="options";
    const selected=state.answered[qi];
    q.options.forEach(function(opt,oi){
      const btn=document.createElement("button");btn.className="opt-btn";
      btn.textContent=String.fromCharCode(65+oi)+"．"+opt;
      if(selected!==undefined){
        btn.disabled=true;
        if(oi===q.answer)btn.classList.add("correct");
        else if(oi===selected)btn.classList.add("wrong");
      }
      btn.onclick=function(){
        if(state.answered[qi]!==undefined)return;
        state.answered[qi]=oi;
        if(!state.unlocked){
          state.unlocked=true;state.hlAnchor=true;state.hlSyn=true;
          document.getElementById("btn-anchor").classList.remove("locked");
          document.getElementById("btn-anchor").classList.add("on");
          document.getElementById("btn-syn").classList.remove("locked");
          document.getElementById("btn-syn").classList.add("on");
        }
        const qKey=item.source+'-'+item.bai+'_'+qi;
        if(oi===q.answer){
          if(allCorrectMon1012.indexOf(qKey)<0)allCorrectMon1012.push(qKey);
          onCorrectAnswer();
        } else {
          onWrongAnswer();
        }
        localStorage.setItem('dao9_mondai10_12_correct',JSON.stringify(allCorrectMon1012));
        reportToolProgress(allCorrectMon1012.length,TOTAL_Q_MON1012);
        render();
      };
      optsDiv.appendChild(btn);
    });
    card.appendChild(optsDiv);
    if(selected!==undefined){
      const isOk=selected===q.answer;
      const rb=document.createElement("div");rb.className="result-badge "+(isOk?"correct":"wrong");
      rb.textContent=isOk?"✅ Chính xác!":"❌ Chưa đúng — Đáp án đúng: "+String.fromCharCode(65+q.answer);
      card.appendChild(rb);
      const ex=document.createElement("div");ex.className="explain show";
      ex.innerHTML=renderDetailExplain(item,qi,q);
      card.appendChild(ex);
    }
    content.appendChild(card);
  });
  applyPassageHighlight(item);
  const allDone=item.questions.length>0&&Object.keys(state.answered).length===item.questions.length;
  document.getElementById("resetBtn").className="reset-btn"+(allDone?" show":"");
  document.getElementById("prevBtn").disabled=currentBaiIndex===0;
  document.getElementById("nextBtn").disabled=currentBaiIndex===list.length-1;
}
function resetCurrent(){resetState();render();}
document.querySelectorAll(".tab-btn").forEach(function(btn){
  btn.onclick=function(){
    document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");currentSrc=btn.dataset.src;currentBaiIndex=0;resetState();render();
  };
});
function toggleHL(type){
  const map={anchor:"hlAnchor",conn:"hlConn",syn:"hlSyn"};
  const btnId={anchor:"btn-anchor",conn:"btn-conn",syn:"btn-syn"}[type];
  const btn=document.getElementById(btnId);
  if(btn.classList.contains("locked"))return;
  const key=map[type];state[key]=!state[key];
  btn.classList.toggle("on",state[key]);
  applyPassageHighlight(filtered()[currentBaiIndex]);
}
document.getElementById("prevBtn").onclick=function(){if(currentBaiIndex>0){currentBaiIndex--;resetState();render();}};
document.getElementById("nextBtn").onclick=function(){const list=filtered();if(currentBaiIndex<list.length-1){currentBaiIndex++;resetState();render();}};
render();
</script>
