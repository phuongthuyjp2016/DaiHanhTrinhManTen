 sống (nhiên liệu, gỗ...)."},{"q":"人間の自然への関わりについて、筆者はどのように述べているか。","options":["自然の作用による変化を見守り続けるのがよい","自然への介入の有無による利害を十分見極める必要がある","生物の損失より人間の損失が少ない場合は、自然に介入すべきだ","人間が介入した自然をもとに戻すために、資金を投じて対策をすべきだ"],"answer":1,"explain":"Đáp án đúng: B. Cần hiểu chính xác lợi ích tương xứng với công sức khi can thiệp và tổn thất khi để mặc tự nhiên."}]},{"source":"Mon12","bai":28,"date":"12/2018","title":"Mon12 - Bài 28 (12/2018)","passage":"人間はおかしなもので、自分が苦労して作ったり、特定の誰かが自分のために作ってくれたと思うと、より深い満足感を覚えるものらしい。それは恋人が編んでくれたセーターをプレゼントされた時のことを思えば、容易に想像できよう。モノにではなく、そこに込められた「思い」こそが人を満足させ、幸福にするのである。\n\nだとすると「労働や生産」を家庭から切り離すことで成立する大量生産・大量消費システムの進展は、身の周りからそうした「思い」や「かけがえ（注1）のなさ」を消し去っていく過程だったと言えなくもない。\n\nかつて何でも手作りしていた時代には、身の周りに手作りのモノやサービスがあふれていたため、金銭を払って得る商品やサービスにそんな「思い」や「かけがえのなさ」を要求する必要もなかった。人々が商品に求めたのは単に機能と安さだった。だからこそ、均質な機能を持つ商品を安く供給できる大量生産が有効だったのである。\n\nしかし、ある程度商品が行き渡ると①事情は違ってくる。人間は持たざる時には人並みを求めるが、ひとたび人並みになるや、今度は人との違いを求めだし、人と同じ商品では満足できなくなるからだ。この隘路（注2）を現代の資本主義はデザインによってモード（流行）を作りだしたり、特定の商品を持つことが社会的地位の象徴であるかのように思わせることで切り抜けてきた。\n\n頻繁に繰り返される自動車のモデルチェンジや、去年買った服を今年着るのが恥ずかしいくらいに目まぐるしく変わる流行のファッション。機能的には軽自動車で十分であるにもかかわらず、乗っている自動車の大きさや豪華さによって自分の価値が判断されるような気がして、より高級な車を買いたくなるのもそのためだろう。（中略）\n\nただ、モノによって自分を他と差別化するというこのやり方は、②深刻な矛盾に陥らざるをえない。つまり、社会に流布された豊かさや幸福のモデルに自分を合わせることで個を主張するわけだから、自分を個性化しようとすればするほど本当の自分の色を消し去り、逆に没個性化していくという矛盾である。\n\n消費財がほぼ万人に行き渡り、しかも所得の大きな格差も無くなって、モノによって自分を他者と差別化することが困難になりつつある現在、この矛盾はこれまでになく鮮明になってきている。もう買いたいモノがないという現状は、その端的な現れだろう。こうした消費社会の矛盾を自覚した時に人が立ち戻る場所は、やはり「思い」とか「かけがえのなさ」しかないような気がする。\n\n記号と化したモノに人が操られている現状を脱し、人がモノを使う本来の姿に戻るためにも、満足感や幸福感は何によってもたらされるのか、今一度考える必要があるのではないか。\n\n（注1）かけがえのなさ：他に代わりがないほど貴重であること\n（注2）隘路：ここでは、難しい状況","note":"ℹ️ Đề bổ sung từ đề chính thức; đáp án do Claude giải từ nội dung đề (chưa có đáp án chính thức để đối chiếu).","questions":[{"q":"筆者によると、大量生産のシステムが普及したのはなぜか。","options":["消費者には手作りのモノは価格が高く手が届かなかったから","消費者が商品に金銭を払うことを惜しまなかったから","消費者が手作りのモノでは満足できなかったから","消費者が便利で安価な商品を欲していたから"],"answer":3,"explain":"Đáp án đúng: D. Thời tự làm mọi thứ, người ta chỉ cần chức năng và giá rẻ nên sản xuất hàng loạt hữu hiệu."},{"q":"①事情は違ってくるとあるが、どのように違ってきたか。","options":["人と違う商品を持つことに意味を見いだすようになった。","人と違う商品を持たなくても個性を表せるようになった。","特定の商品を求めることに疑問を感じるようになった。","特定の商品を持つことでは自身の価値を高められなくなった。"],"answer":0,"explain":"Đáp án đúng: A. Khi hàng hóa đã phổ biến, người ta bắt đầu muốn khác người khác nên thấy ý nghĩa ở việc sở hữu hàng khác biệt."},{"q":"②深刻な矛盾とあるが、どういうことか。","options":["人との違いを出そうとしているのに、人と似てしまう。","買いたいモノはないのに、お金を使いたくなる。","社会のモデルに自分を合わせようとするほど、合わなくなる。","本当の自分を隠そうとするほど、自分が出てしまう。"],"answer":0,"explain":"Đáp án đúng: A. Muốn tạo cá tính bằng cách theo mẫu hình xã hội thì càng cá tính hóa lại càng mất cá tính (giống người khác)."},{"q":"筆者の言いたいことは何か。","options":["モノを持たないことで消費社会の矛盾を自覚すべきだ。","モノを持てることの幸福感を味わうべきだ。","モノに込められた「思い」を再認識すべきだ。","モノの持つ本来の機能を再認識すべきだ。"],"answer":2,"explain":"Đáp án đúng: C. Kết luận: cần quay về với 'tình cảm gửi gắm' và 'tính không thể thay thế' trong đồ vật."}]},{"source":"Mon10","bai":29,"date":"07/2019","title":"Mon10 - Bài 29 (07/2019)","passage":"シアノバクテリアと藻類が誕生し、地球上を酸素で満たすまでには20億年以上の時間を要したのに対し、現代人が地球環境を大きく変えるようになったのは、たかだかここ100~200年のことである。光合成生物が大気環境を変えるのに費やした時間と比べると、人間が環境を変えた時間はあっという間といえる。そのため、大昔の非常にゆっくりとした大気環境の変化は、当時の生物たちには適応するのに十分な時間があったが、今の急速な環境変化には、多くの生物種が適応できずに絶滅する可能性が高いかもしれない。そのため、人間は①大きな問題を起こしているのだ、という人もいるだろう。\n\nところが、地球の長い歴史の中では、人類の活動よりも短時間で地球環境を大きく変え、生態系を非常に大きく攪乱した事件があった。今から6500万年前の中生代白亜紀末の大隕石の衝突である。これにより飛び散った破砕物が大気中で浮遊し（注1）、太陽光の地上への到達を妨げたといわれている。それが植物による光合成を強く抑え、また地上の寒冷化を引き起こしたと考えられている。そしてこのとき、当時優占していた（注2）恐竜をはじめ、多くの生物が絶滅することになった。ところが、これほど急激で大きな生態系の攪乱に直面しても、生き残ったものがいた。そして、その生物たちは、新たにつくられた環境に適応しながら、多様な生態系をつくってきたのである。\n\n②このことを考えると、生物というものはとてもタフで、打たれ強いものであることがわかる。すると、今、人類が強い力で地球環境を変えて生態系を大きく攪乱しても、人類は滅びるかもしれないが、その急激に変化する環境をうまく生き抜き、新たにつくられた環境の中で繁栄する生物種が必ず出てくるに違いない。そして、生物がそこに存在することができれば、そこには生物たちの相互関係が生まれ、食物連鎖がつくられ、きちんと機能する生態系がつくられるのである。そして、その新しい生態系をつくっている生物たちの中には、「大昔、ヒトという生物がいて、彼らは我々が住みやすい地球環境をつくってくれたとてもありがたい生物だったんだよ」と、子孫に語り継いでいるものもいるかもしれない。\n\nこのように考えると、生態系の善し悪しを考えるときには、誰を中心にするか、いつを基準とするのかによって評価が大きく変わることがわかる。したがって、議論をするときには、その基準を決めなければならないだろう。\n\n（注1）浮遊する:浮かび漂う\n（注2）優占している:ここでは、数が多い","note":"ℹ️ Đề bổ sung từ đề chính thức; đáp án do Claude giải từ nội dung đề (chưa có đáp án chính thức để đối chiếu).","questions":[{"q":"①大きな問題とはどのような問題か。","options":["特定の生物種だけが影響を受けるような環境変化を起こしていること","大きな環境変化を起こして、多くの生物種を絶滅させてしまったこと","急速な環境変化を起こして、多くの生物種を絶滅させかねないこと","影響が広範囲に及ぶような大きな環境変化を起こしたこと"],"answer":2,"explain":"Đáp án đúng: C. Biến đổi môi trường quá nhanh có thể khiến nhiều loài không kịp thích nghi và tuyệt chủng."},{"q":"②このこととは何か。","options":["多くの生物が滅びる事態が起きても、耐えうる生物種がいたこと","どんな生物にも新たな環境に適応する力があったこと","生態系が乱れた結果、個々の生物がさらに強くなったこと","生態系が壊れても、すぐに元のように修復されたこと"],"answer":0,"explain":"Đáp án đúng: A. Dù có sự kiện làm nhiều sinh vật tuyệt chủng (va chạm thiên thạch) vẫn có loài sống sót."},{"q":"人類が滅びた場合の生態系について、筆者はどのように考えているか。","options":["環境を自ら変えることで生き残る生物種が現れる。","人類が繁栄していた以前の生態系に戻る。","新たな環境変化が起きず安定する。","新たに繁栄する生物種が現れる。"],"answer":3,"explain":"Đáp án đúng: D. Nếu nhân loại diệt vong, nhất định sẽ có loài mới thích nghi và hưng thịnh trong môi trường mới."},{"q":"生態系について、筆者の考えに合うのはどれか。","options":["人間中心の見方とは別の視点で評価することもできる。","人間以外を基準にして議論するべきである。","生態系の善し悪しは環境を基準にして考えるベきである。","生態系の評価は時代とともに変わっていくものだ。"],"answer":0,"explain":"Đáp án đúng: A. Đánh giá hệ sinh thái thay đổi tùy lấy ai làm trung tâm, lấy thời điểm nào làm chuẩn → có thể nhìn bằng góc nhìn ngoài con người."}]},{"source":"Mon12","bai":29,"date":"07/2019","title":"Mon12 - Bài 29 (07/2019)","passage":"なんであれ無我夢中になって時間を忘れるような体験は、誰にとっても奇跡のような時間である。そんな奇跡を可能にするものこそ、実は「独り」の時間なのである。現実世界の他者との接点が完全になくなり、日常のあれやこれやが背景に没する（注1）とき、人は自由の翼を羽ばたかせる。\n\nしかし、現実のもろもろ（注2）が想像カや感性を邪魔しているかぎり、そうした無限といってよい自由はやってこない。ヒマで死にそうな人にも、あの、わくわくする自由は訪れない。①あの自由を取り戻すためには、周囲の人たちとのつながりを完全に忘れてしまわなければならない。あるいは、つながりを完全に絶ってまでも、そこに没入したい（注3）世界が存在しなければならないということである。\n\n独りは、「ひとりぼっち」である。孤独であり、寄る辺ない（注4）状態だ。中学生のなかには――もちろん高校生や大学生のなかにも―、ひとりぼっちになるのが怖くて、電話機から離れられない人も多い。一瞬でもスマホ（注5）を手放すのが怖くて仕方がない人たちのことを聞くと、私は「かわいそうだな」と思う。彼らは人とのつながりがなくなり、ひとりぼっちの深みに沈むのが怖くてたまらないのだ。たぶん、彼ら・彼女たちは孤独の効用を知らないし、ひとりぼっちゆえの自由も知らない。孤独になるところから始まる創造的な時間の使い方もまったく知らない。だから、彼ら・彼女たちにとって、孤独はきっと闇のように暗くて深いのだ。\n\nそんな、②かわいそうな子どもたちをどうすれば助けてあげられるだろうか。独りを恐れてはならないと言ってあげるべきだろうか、独りになることは怖くないと言っても、きっと彼ら・彼女たちには通じない。たぶん、その恐れているものこそ最も貴い宝なのだと教えてくれる何かに出会うことが必要なのだ。狐独が闇ではなく、光であり、途方もない創造性の源泉であることを知る機会さえあればいい。多くの人々を感動させてきた文学作品や、感嘆の声を上げるしかない美術作品の数々。それらは原稿用紙に向かい、キャンバスと向き合った孤独な者たちの手から生まれたものだ。（中略）もちろん、孤独でありさえすれば③偉大な作品が生まれるわけではない。孤独は創造性にとって十分条件ではなく、必要条件なのだ。だから、いきなり深遠な思索やらオリジナルな発想やらがどうして生まれるのか、と聞かれても、答えようがない。しかしそういう傑作が生まれ落ちた素地（注6）にあるのが「独り」の状態だということは知っておくベきだろう。\n\n孤独に対して、あまりよくないイメージがあるなら、そのイメージを払拭し、ポジティヴな（注7）イメージに転換しておかなければならない。孤独は創造の源泉であり、夢中になれる悦ばしい時間の素地である。\n\n（注1）背景に没する:ここでは、意識されなくなる\n（注2）もろもろ:さまざまなこと\n（注3）没入する:熱中する\n（注4）寄る辺ない:頼るものがない\n（注5）スマホ:コンピュータの機能を持っている携帯電話。スマートフォン\n（注6）素地:もと\n（注7）ポジティヴな:肯定的な","note":"ℹ️ Đề bổ sung từ đề chính thức; đáp án do Claude giải từ nội dung đề (chưa có đáp án chính thức để đối chiếu).","questions":[{"q":"①あの自由とはどのような状態か。","options":["現実世界と想像の世界が混じり合った状態","独りの時間が十分にある状態","自由に時間が使えるような暇な状態","夢中になって時間を忘れるような状態"],"answer":3,"explain":"Đáp án đúng: D. 'Sự tự do hồi hộp ấy' là trạng thái mải mê quên cả thời gian."},{"q":"②かわいそうな子どもたちとあるが、何がかわいそうなのか。","options":["ひとりぼっちを怖がっていること","自由を求めようとは思っていないこと","人とつながっていても自由だと思っていること","孤独になることは恐ろしいと教えられてきたこと"],"answer":0,"explain":"Đáp án đúng: A. Đáng thương vì họ sợ cô đơn đến mức không rời được điện thoại."},{"q":"③偉大な作品について、筆者が述べていることに合うのはどれか。","options":["孤独になれば、人と違う発想が生まれる。","孤独な状態がなければ、偉大な作品は生まれない。","孤独な者でなければ、偉大な作品に共感できない。","孤独な時間が多ければ、偉大な作品を生むことができる。"],"answer":1,"explain":"Đáp án đúng: B. Cô đơn không phải điều kiện đủ mà là điều kiện cần: thiếu trạng thái đơn độc thì không có tác phẩm vĩ đại."},{"q":"筆者が言いたいことは何か。","options":["創造的な時間の使い方を知るには孤独になるべきだ。","孤独は創造力を生み出すための貴い機会だ。","孤独になることで、人とのつながりのよさがわかる。","孤独のよくないイメージを消し、自由との違いを認識すべきだ。"],"answer":1,"explain":"Đáp án đúng: B. Cô đơn là nguồn cội của sáng tạo và thời gian say mê đáng quý."}]},{"source":"Mon10","bai":30,"date":"12/2019","title":"Mon10 - Bài 30 (12/2019)","passage":"脳科学はヒトそのものの仕組みを明らかにしようとする学問です。そのため、その成り立ちから人々の耳目（注1）を引くように運命づけられていると言えます。脳科学は、誰もが青春の一時期に悩む「自分って何だろう」という疑問に科学の力で挑むという、考えてみたら少し青臭い（注2）学問だったりするのです。\n\nだからというわけではありませんが、人々の口に上りやすく、そのため伝搬のスピードも他の学問と比べて早いように思います。特に、自己（注3）の知覚の裏をかかれるようなさまざまな現象、たとえば錯視現象や無意識と意識の話などは、自己恒常性、つまり自分がいつも自分であり続けることに関わるだけに、他のどんな科学より人々の気持ちを鷲掴（注4）みにします。そのせいで、脳機能を理解する前に現象だけが先走って人々の間に広がっていくことも多い学問です。もちろん、それは何より面白いからです。\n\nそんな脳科学も、昨今の説明責任という考え方や社会還元という意味合いで、一般の人々へなんとか知見のフィードバック（注5）をしなければならない圧力にさらされています。少し前には、脳科学の研究成果が新聞に掲載されることはあまりありませんでしたが、今ではプレスリリース（注6）も当たり前に行われますし、そこではできるだけ面白く人々の興味をひきつけるストーリーを作りがちになります。本当はそういう色気は基礎科学に馴染まないのですが、メディアからの要請があると、僕たちはなんとかそれに応えようとして、浅薄な脚色をして本当の面白さをゆがめてしまいがちになります。\n\nそういう「メディア対応」と呼ばれる技術も科学者に必要とされている現代は、ある意味で科学者にとって不幸な時代なのかもしれません。\n\n（中略）\n\n昨今の過剰なメディアの脳科学の取り上げ方は、科学者の説明責任を遥かに逸脱したレベルであるように思えるのです。そういうメディアの要求に、誠実に対応しようとすればするほど、科学者は自分をすり減らすことになるでしょうし、だんだんと科学の現場から乖離せざるを得なくなるでしょう。それは、優秀な科学者を潰すことになります。\n\n科学者の価値は、何よりも科学の現場に居続けることにあります。科学的知見に裏打ちされない（注7）空論を弄ぶのではなく、常に研究の現場に自分をつなぎ止め、足を杭で打ち付けてでも科学の現実から離れないようにすること。そういう決意をもってメディアに対応するのであれば、フワフワと遠くに行ってしまうことはないでしょう。\n\n（注1）耳目を引く：注意を引く\n（注2）青臭い:ここでは、純粋すぎる\n（注3）自己の知覚の裏をかかれる:ここでは、自分が思いもしなかった\n（注4）鷲掴みにする:ここでは、強く掴む\n（注6）プレスリリース:メディア向けの公式発表\n（注7） ~に裏打ちされる:てに裏づけられる","note":"ℹ️ Đề bổ sung từ đề chính thức; đáp án do Claude giải từ nội dung đề (chưa có đáp án chính thức để đối chiếu).","questions":[{"q":"脳科学について、筆者はどのようにとらえているか。","options":["他の学問より早いスピードで進歩している。","人々の脳機能を高めることに貢献している。","身近な疑問を扱っており、多くの人々に理解されている。","脳の働きが理解されないまま、人々の興味だけが先行している。"],"answer":3,"explain":"Đáp án đúng: D. Khoa học não được lan truyền hiện tượng đi trước khi hiểu cơ chế, chỉ có sự quan tâm của mọi người chạy trước."},{"q":"そういう色気とは、どのようなことか。","options":["科学者が科学本来の面白さを前面に出そうとすること","科学者が事実を実際より面白くして伝えようとすること","科学者が一般の人々に分かりやすく科学を説明しようとすること","科学者が新間に掲載されるような興味深い研究をしようとすること"],"answer":1,"explain":"Đáp án đúng: B. 'Sức hấp dẫn' là việc thêm thắt phô trương, làm sự thật thành thú vị hơn thực tế."},{"q":"現代のメディアと脳科学の現場との関係はどのようになっているか。","options":["メディアが、研究内容に介入するようになってきている。","メディアの過剰な要求のため、研究の現場に負担がかかっている。","脳科学に関する情報提供の機会が、メディアに奪われている。","脳科学本来の面白さが、メディアに取り上げられなくなっている。"],"answer":1,"explain":"Đáp án đúng: B. Yêu cầu quá mức của truyền thông làm nhà khoa học hao mòn, đặt gánh nặng lên hiện trường nghiên cứu."},{"q":"筆者によると、昨今のメディアとの関わりにおいて、科学者はどうあるべきか。","options":["メディアを自身の研究のために活用するべきだ。","メディアを通じて研究の現場から情報を発信するべきだ。","メディアへの対応よりも、研究を優先するべきだ。","メディアの要求には対応せず、研究の現場を大切にするべきだ。"],"answer":2,"explain":"Đáp án đúng: C. Giá trị nhà khoa học là ở hiện trường nên ưu tiên nghiên cứu hơn việc đối phó với truyền thông."}]},{"source":"Mon12","bai":30,"date":"12/2019","title":"Mon12 - Bài 30 (12/2019)","passage":"交換と交易（注1）の歴史は非常に古く、何万年も前までさかのほれるようだが、貨幣経済は進化史的に言えばごく最近のことである。どんなものにも変えることができる抽象的な価値とは、とんでもない発明だと思う。（中略）\n\nそれは、貨幣というものが、確かに人間の生活を変え、世界を見る目を変え、欲望のあり方を変え、人生観を変え、結局のところ人間性を変えてきているように思うからだ。貨幣経済の真っただ中で暮らしている私たちにとって、貨幣は当たり前の存在だが、ヒトという生物にとって、こんなものの存在は決して当たり前ではなかった。そして、大量の砂糖や脂肪の存在に私たちの脳も体もうまく対応できていないのと同じく、この貨幣という存在にも、実は私たちの脳はうまく対応できていないのではないだろか。\n\nヒトが狩猟採集生活をしていた頃、ヒトは自分たちの手で集められる食料を食べ、自分たちの手で作れる道具や衣服を使って暮らしていた。できることは限られていたし、望めることには限度があった。まさに等身大（注2）の生活である。それ以上の世界の可能性を知らなければ、欲望にも限りがあった。「欲しい物」というのは具体的な物であり、それを手に入れる方法は限られていた。そして、ヒトはそのことを知っていた。\n\nしかし、何にでも交換できる抽象的な価値が手に入るようになると、それ自体を得たいという新たな欲望が生まれる。「金の亡者」（注3）は、何か特定の物が欲しいから貨幣を得るのではない。ともかく貨幣をためることが何にもまして大事な目的なのだ。そこには限度がない。\n\nまた、何にでも交換できる抽象的な価値は、人間関係を買うことも、幸せな気分を買うこともできる。貨幣がない時には、人間関係を築いていなければできなかったことが、個別の人間関係抜きに手に入る。逆に、貨幣なしではほとんど何もできない。\n\nそして、今では、貨幣を手に入れることは一つの職業につくことである。一つの職場で一つの仕事をし、その対価（注4）に貨幣をもらう。そうすると、ヒトは、自分が独立して生きていると思う。本当は、今でも狩猟採集生活時代と同じように、みんなで共同作業をすることで生きているのだ。農家がいなければお米も野菜もない。物流や商店がなければ、買うことができない。医者がいなければ病気を治せない。学校の先生がいなければ教育ができない。今でも、みんなでともに生き、生かされて暮らしているのだが、それぞれに貨幣が介在しているので、共同という感覚がなくなる。便利なものには必ず負の面がある。ちょっと立ち止まって考えてみた方がよい。\n\n（注1）交易:ここでは、取り引き\n（注2）等身大の:その人の状況や能力に合った\n（注3）金の亡者:異常に金銭に執着する人\n（注4）対価:ここでは、報酬","note":"ℹ️ Đề bổ sung từ đề chính thức; đáp án do Claude giải từ nội dung đề (chưa có đáp án chính thức để đối chiếu).","questions":[{"q":"とんでもない発明だと思うのは、なぜか。","options":["人間の脳の対応力を徐々に変えてきたから。","人間に抽象的な思考を強いるようになったから。","多様な人生観や人間性を生み出してきたから。","生活から考え方まで人間のあり方を変えてきたから。"],"answer":3,"explain":"Đáp án đúng: D. Tiền tệ làm đổi từ cuộc sống, cách nhìn thế giới, dục vọng, nhân sinh quan đến bản tính con người."},{"q":"狩猟採集生活をしていた頃のヒトの欲望について、筆者はどのように述べているか。","options":["自らたちの日常しかしらなかったから、欲望は限られていた。","自分たちの経験から欲望には限りがないことを知っていた。","多くの欲望を持っていたが、それを満たす手段は限られていた。","生きることが最優先だったから、欲望を持つ余裕がなかった。"],"answer":0,"explain":"Đáp án đúng: A. Chỉ biết cuộc sống thường ngày của mình nên dục vọng có giới hạn."},{"q":"筆者によると、ヒトは貨幣を手に入れてどうなったか。","options":["人間関係に関心がなくなった。","貨幣自体が欲望の対象になった。","特定の物に対する欲望が強くなった。","何が本当に欲しいのか分からなくなった。"],"answer":1,"explain":"Đáp án đúng: B. Có đồng tiền đổi được mọi thứ nên nảy sinh ham muốn tích tiền vì chính nó."},{"q":"筆者が最も言いたいことは何か。","options":["貨幣を得ることだけが働く意味ではないと自覚にすることが必要だ。","貨幣があることによって共同という感覚が必要ではなくなっている。","貨幣によって失われている共同という感覚を忘れてはいけない。","貨幣には人間関係を壊すという負の面もあることを忘れてはいけない。"],"answer":2,"explain":"Đáp án đúng: C. Tiền xen vào khiến mất cảm giác chung tay chung sức; không nên quên điều đó."}]},{"source":"Mon10","bai":31,"date":"12/2020","title":"Mon10 - Bài 31 (12/2020)","passage":"地球の長い歴史の中で生物は進化と分化し、生物種の数は基本的には増える傾向にある。地球上の生物の種類が急激に増えたのが､カンブリア紀と呼ばれる約五億年前のことで、生物種の「ビッグバン」と呼ばれることもある。だが､その後生物の歴史の中では、過去五回、生物種の数が急激に減少する「大絶滅の時代」があったことが化石の分析などから分かっている。（中略）\n\n現在確認されている種の絶滅は、ほんの氷山の一角である。多様な生物が生息している熱帯林が減少する速度からすると、一年間に一千万種のうち二万七千種が絶滅していると推定されるとの研究結果が報告されている。現代は地球の歴史の中で六回目の生物の大絶滅時代だと言えるのだ。\n\n六回目の大絶滅時代は、過去の五回と多くの点で違う。一つは生物が絶滅する速度が非常に速いということだ。化石の分析などから推定された自然界での生物絶減の速度は百万種に対して一年間に一種というペースだ。多くの研究は、現在の生物絶滅の速度は自然に起こる生物絶滅の速度の百~千倍で、その速度はほとんど速くなっていると指摘している。今回の大絶減が､ほとんどが人間活動が原因で起こっているという点も過去と大きく異なる。自然に起こる絶滅は止めることはできなかった。だが、今回の大絶滅は人間の行動パターンが違っていれば起こることはなかった。逆に言えば、人間が行動を改めれば、絶減を食い止めることができるかもしれないということになる。\n\n過去の大絶滅の後では、恐竜が減った後で哺乳類が栄えるようになったように、ある種の生物がいなくなったことで、他の生物が生息地を広げることができるようになり、その後比較的短時間のうちに種の数は増加に転じている。\n\nだが､今回の大絶滅の場合は、速度が速いために生物が変化について行けない可能性がある。しかも、新たな生物が生まれる「ゆりかご」となるような湿地や熱帯林、浅い海などの場所は、人間の開発行為によって破壊され、汚染されている。大絶滅からの復活につながる生物進化の力も、人間が奪っている可能性が高い。今この地球上で起こっている「第六の大絶滅」は、過去の五回とは質的に大きく異なり、地球の生態系にとって取り返しがつかないものとなる可能性が否定できない。\n\n現在のペースで熱帯林やサンゴ礁､湿地などが破壊されたら、生物種の絶滅や生物多様性の損失は今後も急速に進むことが心配されている。しかも、今世紀半ばくらいには、地球温暖化の進行が生物種の絶滅に拍車を掛けることになることも懸念されている。このままでは、地球の長い歴史の中で例がないほど生物多様性の減少が著しい、傷ついた地球を次世代に引き渡すことになってしまうのである。\n\n(注)ゆりかご：ここでは、生物の生育に適した環境","note":"ℹ️ Đề bổ sung từ đề chính thức; đáp án do Claude giải từ nội dung đề (chưa có đáp án chính thức để đối chiếu).","questions":[{"q":"六回目の大絶滅の前までは、生物種の数はどのように変化してきたか。","options":["約五億年前をピークとして､その後急激に減少してきた。","約五億年前に急増した後、五回の急激な減少を経験したが、増加してきた。","約五億年前に一度増加したが、その後は五回の急激な減少を含めて減り続けてきた。","増加し続けてきたが、約五億年前に急激に減少し、その後再び増加してきた。"],"answer":1,"explain":"Đáp án đúng: B. Số loài tăng nhanh ở kỷ Cambri (khoảng 5 trăm triệu năm trước), trải qua 5 lần giảm mạnh nhưng nói chung vẫn tăng."},{"q":"今回の生物の大絶滅が過去と異なるのはどのような点か。","options":["絶滅の速度は速くなっているが、生息地を広げて増加する種もあること","絶滅の速度が非常に速くなるとともに、原因も分からなくなっていること","人間の行動パターンが変化することで、生物種の数は増加していること","人間の行動によって、自然界での絶滅の速度が非常に速くなっていること"],"answer":3,"explain":"Đáp án đúng: D. Khác biệt: phần lớn do hoạt động của con người nên tốc độ tuyệt chủng rất nhanh."},{"q":"現在の地球について、筆者はどのように考えているか。","options":["人間が開発のペースを落とせば、生物種の絶滅は食い止められる。","人間が開発行為を続ければ、地球の生態系はさらに破壊されるだろう。","人間が開発行為をやめて、破壊された自然を元に戻さなければならない。","人間が開発行為をやめても、生物多様性の減少は避けられない可能性が高い。"],"answer":1,"explain":"Đáp án đúng: B. Với tốc độ hiện nay, nếu cứ tiếp tục khai phá thì hệ sinh thái sẽ tiếp tục bị phá hủy."}]},{"source":"Mon12","bai":31,"date":"12/2020","title":"Mon12 - Bài 31 (12/2020)","passage":"例えば、3年間ずっとノーミスでやってきた輪田くんが､はじめてミスを出した。\n\n3年前からずっとその仕事ぶりを見てきた上司と異動していきなり輪田くんのミスに出くわした上司と、輪田くんへの印象は同じだろうか?両者のミスの「情報占有率」がちがう。つまり、3年間のつきあいの中で、ミスが占める割合と、たった一回初めて輪田くんと接した中で、ミスが占める割合と。\n\n相手は、あなたが過去からずっと積み上げてきたすべての情報で、あなたを判断するのではない。結局は、その時相手が持っている情報だけで判断される。その中で、いい情報の占める割合が多ければ「いい人だ」となる。\n\nあなたが「優しい人」で10年間怒ったことがなかったとしても、10年ぶりに起こった時、たまたまでくわした初対面の相手にとっては、それが100%だ。あなたを「恐い人」だと思う。\n\n自分にふさわしい「メディア力」を相手の中に刻むため、ちょっと「情報占有率」を意識してみるといい。\n\nコミュニケーションでは、出会いから始まって、相手から見たあなたの「メディア力」が決まるまでの間が肝心だ。つまり、初めの方が慎重さがいる。ここで、かっこつけるのでもなく、でも、あなた以下にもならず、等身大のあなたの良さが伝わるのが理想だ。\n\nいつも質の高い仕事をしているなら、初めての仕事先に対して、決していつもの質を落としてはいけない。ふだん静かな人なら、初対面の相手にも、奇をてらったりせず、普段どおり静かにしていればいい。自分にうそのないふるまいをする、ということは、初対面の相手にこそ大切だ。\n\nさて、ここで問題なのは、普段とても穏やかなあなたが、その日はたまたま嫌なことが重なり、攻撃的になっているという場合だ。自分にうそのないということで、相手にきついことを言ってしまったらどうだろう。あなたにとっては、年に一回の、「たまたま不機嫌な日でも､相手にとっては、あなたに関する情報の100%になる。\n\n初対面の相手、まだ付き合いの浅い相手には、すこし慎重になって考えてほしい。\n\n何が､自分にうそのないふるまいか?自分の正直な姿を伝えるとはどういうことか?日ごろの99%穏やかなあなたなら、1%異常よりも、いつもの穏やかさを伝える方が、結局は、正直な姿を伝えている。相手の中に、あなたの実像に近い「メディア力」が形成されるからだ。初対面の相手にこそ、平常心であること、普段どおりにやることが大切だ。\n\n（注1）等身大の：誇張のない\n（注2）奇をてらう：変わったことをして、他人の気をひこうとする","note":"ℹ️ Đề bổ sung từ đề chính thức; đáp án do Claude giải từ nội dung đề (chưa có đáp án chính thức để đối chiếu).","questions":[{"q":"筆者によれば、上司にとって輪田くんのミスの「情報占有率」が上がるのはどのような場合か。","options":["付き合いの長い上司との関係の中で､輪田くんがミスを1回した場合","付き合いの長い上司との関係の中で、輪田くんがミスを3回した場合","付き合いの短い上司との関係の中で、輪田くんがミスを1回した場合","付き合いの短い上司との関係の中で、輪田くんがミスを3回した場合"],"answer":2,"explain":"Đáp án đúng: C. Tỷ lệ 'chiếm thông tin' của lỗi tăng khi quan hệ ngắn: chỉ một lần tiếp xúc mà dính lỗi là 100%."},{"q":"自分にうそのないふるまいとはどのようなものか。","options":["その時々の素直な気持ちを表すこと","いつも正直に自分の考えを伝えること","いつもどおりの姿を見せること","うそをつかず正直に話すこと"],"answer":2,"explain":"Đáp án đúng: C. Hành xử không giả dối là thể hiện đúng con người thường ngày."},{"q":"筆者は、なぜ初対面の相手に慎重になったほうがいいと述べているのか。","options":["普段通りの態度では、相手に自分の良さを十分に伝えられないから","自分に関する一部の情報で相手がすべてを判断するかもしれないから","相手の性格が自分と合うかどうかまだよくわかってないから","初対面の相手には慎重な姿が実像だと思わせる必要があるから。"],"answer":1,"explain":"Đáp án đúng: B. Vì người mới gặp chỉ phán đoán dựa trên một phần thông tin ít ỏi về mình."},{"q":"自分の「メディア力」について、筆者はどのようにするのがよいと述べているのか。","options":["相手に自分の「メディア力」が正確に伝われるように意識する。","相手に普段の自分以上の「メディア力」を伝えるようにすること｡","相手に刻まれた自分の「メディア力」を気にせず平常心でいる。","相手に見せる自分の「メディア力」を下げないように静かにしている。"],"answer":0,"explain":"Đáp án đúng: A. Nên ý thức để tỷ lệ thông tin giúp người khác hình dung đúng con người thật của mình."}]}];
const EXPL_DETAIL = {"Mon10-1":[{"huongTuDuy":"Câu mở theo hướng mọi người (tưởng tâm lý học giỏi cảm xúc), tác giả dùng しかし chuyển sang sự thật ngược lại.","chotY":"「実は肝心の**感情**（情動）についてはまだ**よくわかっていない**のです」— cảm xúc chính là điều tâm lý học chưa làm rõ.","lienKetJP":"感情こそ得意なはず →（しかし）→ 実はよくわかっていない → ①不思議に思われる","lienKetVI":"Tưởng cảm xúc là sở trường → (nhưng) → thực ra chưa rõ → người đọc thấy 'lạ'","correct":{"jp":"心理学では**感情機能**についてまだ**十分わかっていない**こと","vi":"Khớp trực tiếp với 「感情…まだよくわかっていない」. Cặp gần nghĩa: よくわかっていない ↔ 十分わかっていない."},"wrong":[{"key":"B","jp":"心理学では**認知**と**感情**の関係がまだ**解明されていない**こと","trap":"bẫy chi tiết phụ","vi":"Bài không nói về quan hệ nhận thức-cảm xúc, mà nói cảm xúc tự nó chưa rõ."},{"key":"C","jp":"心理学は**感情の働き**を研究するのが**得意**だということ","trap":"bẫy ngược nghĩa","vi":"Ngược hoàn toàn — tác giả khẳng định KHÔNG giỏi."},{"key":"D","jp":"心理学が昔から**心**について研究してきたということ","trap":"bẫy mọi người","vi":"Đúng có trong bài nhưng là tiền đề, không phải điều gây 'không ngờ'."}]},{"huongTuDuy":"Câu hỏi về chỉ thị từ ② — luôn tóm gọn câu ngay trước nó.","chotY":"「そうした働き（**感覚・知覚・認知**）と**感情**を**一体化**した心のプロセス」— phải bao gồm cả nhận thức và cảm xúc.","lienKetJP":"感覚・知覚・認知 → ＋感情を一体化 → ②全体的な「生」の体験","lienKetVI":"Nhận thức + cảm xúc hợp nhất → trải nghiệm 'sống' toàn vẹn","correct":{"jp":"身の回りの世界を**目や耳**で**認識**して考え、**心で感じる**体験","vi":"Bao quát đủ 2 nhánh: nhận thức + cảm xúc. Cặp gần nghĩa: 感覚・知覚 ↔ 目や耳で認識."},"wrong":[{"key":"A","jp":"心で感じとったことを、そのまま**行動**に移すような体験","trap":"bẫy chi tiết phụ","vi":"Thêm yếu tố 'hành động' không có trong câu nguồn."},{"key":"C","jp":"どのように周囲を**見**たり**聴**いたりして**考える**かという体験","trap":"bẫy ví dụ","vi":"Chỉ nói phần nhận thức, bỏ sót phần cảm xúc."},{"key":"D","jp":"**感覚**や**知覚**で周囲の世界のものごとを**とらえようとする**体験","trap":"bẫy chi tiết phụ","vi":"Tương tự C — chỉ 1 nhánh nhận thức, thiếu phần cảm xúc."}]},{"huongTuDuy":"Robot là ví dụ minh họa, không phải chủ đề chính — cần tìm câu kết luận sau loạt しかし.","chotY":"「複雑な心の働きの中でも特に**感情機能を解明するのは難しく**、それをうまく**再現できない**からです」.","lienKetJP":"ロボット表情できる →（しかし）→ 真似しているだけ →（しかし）→ 感情機能を解明するのは難しく再現できない","lienKetVI":"Robot biểu cảm được → nhưng chỉ bắt chước bề ngoài → vì cơ chế cảm xúc người chưa giải mã được","correct":{"jp":"**人間**の**感情の働き**を**解明する**ことの**難しさ**","vi":"Khớp trực tiếp với câu kết đoạn 「感情機能を解明するのは難しく」."},"wrong":[{"key":"A","jp":"**ロボット**の感情のメカニズムの複雑さ","trap":"bẫy mọi người","vi":"Nhầm chủ thể — bài nói về con người, robot chỉ là ví dụ."},{"key":"B","jp":"最近の**ロボット工学**の**進歩**のめざましさ","trap":"bẫy chi tiết phụ","vi":"Chỉ là thông tin nền, không phải trọng tâm."},{"key":"C","jp":"人間の**動作**や**表情**を**再現する**ことの難しさ","trap":"bẫy ví dụ","vi":"Nhầm 'tái hiện bề ngoài' với 'giải mã cơ chế cảm xúc bên trong'."}]},{"huongTuDuy":"Câu hỏi tổng kết toàn bài — bám vào câu kết cuối cùng.","chotY":"「感情は…**行動を駆り立てる動因**にもなります」「感情は私たちの**思考や行動の土台**になっている」.","lienKetJP":"感情＝体験を豊かに裏打ち → 行動を駆り立てる動因 → 思考や行動の土台","lienKetVI":"Cảm xúc làm phong phú trải nghiệm → thúc đẩy hành động → là nền tảng tư duy/hành động","correct":{"jp":"何かを**したいと思い**、**行動を起こす**","vi":"Khớp với 「行動を駆り立てる動因」. Cặp gần nghĩa: 駆り立てる動因 ↔ したいと思い行動を起こす."},"wrong":[{"key":"B","jp":"ものごとを**感覚でとらえようとする**","trap":"bẫy chi tiết phụ","vi":"Nhầm với 感覚・知覚 ở đoạn đầu bài, đó là nhận thức không phải cảm xúc."},{"key":"C","jp":"相手の心を**分析**して**理解しようとする**","trap":"bẫy mọi người","vi":"Nghe hợp lý nhưng bài không đề cập, tự thêm vào."},{"key":"D","jp":"好き嫌いを**論理的**に考え判断する","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — cảm xúc là động lực phi lý luận, không phải logic."}]}],"Mon10-2":[{"huongTuDuy":"Mở bài theo hướng hành vi luận: chỉ quan sát hành động vì tâm không thể quan sát trực tiếp. Câu hỏi hỏi MỤC ĐÍCH của thí nghiệm.","chotY":"行動主義心理学では「その行動から**動物の心を探っていく**」— mục đích cuối cùng vẫn là tìm hiểu tâm/ý thức động vật qua hành vi.","lienKetJP":"心は目に見えない → 行動だけを訓練・観察 → その行動から動物の心を探る","lienKetVI":"Tâm không quan sát được trực tiếp → huấn luyện/quan sát hành vi → dùng hành vi để dò tìm tâm động vật","correct":{"jp":"サルの行動を通して、**目に見えない動物の心や意識**を**研究する**こと","vi":"Khớp đúng câu mở đầu 「その行動から動物の心を探っていく」, nhấn mạnh 'không nhìn thấy được' (目に見えない)."},"wrong":[{"key":"A","jp":"サルを訓練して、**人間の意図**を読み取れるようにすること","trap":"bẫy mọi người","vi":"Sai chủ thể — mục đích là hiểu tâm SAI, không phải dạy khỉ hiểu người."},{"key":"B","jp":"サルを訓練して、動物だけが持つ**見えない能力を開発する**こと","trap":"bẫy chi tiết phụ","vi":"'Phát triển năng lực' không phải mục đích — mục đích là nghiên cứu, quan sát."},{"key":"C","jp":"サルの行動を通して、**動物に対する人間の心の動き**を探ること","trap":"bẫy ngược nghĩa","vi":"Đảo ngược chủ thể nghiên cứu — phải là tâm của ĐỘNG VẬT chứ không phải tâm người."}]},{"huongTuDuy":"Đoạn mô tả quy trình huấn luyện shaping từng bước — cần xác định đúng trình tự: thấy lever→cho ăn, rồi chờ hành động tiếp mới cho ăn tiếp.","chotY":"「サルが少しでもチラッとレバーを見たとする。そこですかさず**エサを与える**」→「いったんエサやりを止める」→「**手が少しでも伸びれば**、すかさずエサを与える」.","lienKetJP":"サルがレバーを見る → エサを与える → 一旦止める → 次の行動（手を伸ばす）を待つ → またエサを与える","lienKetVI":"Khỉ nhìn thấy lever → cho ăn → tạm dừng → chờ hành động tiếp theo (đưa tay) → lại cho ăn","correct":{"jp":"サルがレバーを見たらエサをやり、**人間が期待する次の行動をするまでじっと待つ**","vi":"Khớp đúng quy trình: cho ăn khi thấy lever, rồi CHỜ hành động tiếp theo mới cho ăn tiếp."},"wrong":[{"key":"A","jp":"サルをレバーの近くに連れて行き、目標の行動をしたらすぐにエサをやる","trap":"bẫy chi tiết phụ","vi":"Bỏ qua bước quan trọng nhất: chờ đợi (ひたすら待つ) từng bước nhỏ."},{"key":"B","jp":"サルがレバーを押したらエサを指し示し、目標の行動をするまでじっと待つ","trap":"bẫy ngược nghĩa","vi":"Đảo ngược trình tự — phải là người cho ăn khi khỉ hành động, không phải chỉ tay vào thức ăn."},{"key":"C","jp":"サルにレバーを指し示し、人間が期待する次の行動をしたらすぐエサをやる","trap":"bẫy chi tiết phụ","vi":"Sai vì người không 'chỉ tay vào lever' — khỉ phải tự khám phá qua thử-sai (試行錯誤)."}]},{"huongTuDuy":"そのとき chỉ thị thời điểm đặc biệt — cần tìm câu mô tả cảm giác 'nắm được' ngay trước đó.","chotY":"「この訓練をずっとやっていると、徐々にサルの**気持ちがつかめてくる**」「心は行動からしかつかめない。しかしそれが**つかめたとき**、手の中にサルの心があるように思えてくる」.","lienKetJP":"エサやりメッセージを送り続ける → 徐々に気持ちがつかめてくる → サルの心があるように思えてくる（＝そのとき）","lienKetVI":"Liên tục gửi tín hiệu 'cho ăn' → dần dần cảm nhận được tâm khỉ → cảm giác như tâm khỉ nằm trong tay (= 'lúc đó')","correct":{"jp":"「エサやり」というメッセージを送る**過程**を通して、**サルの心がつかめた**と感じたとき","vi":"Khớp với 「気持ちがつかめてくる」「サルの心があるように思えてくる」 — quá trình tích lũy, không phải 1 lần duy nhất."},"wrong":[{"key":"A","jp":"「エサやり」というメッセージを繰り返し送ることで人間と**サルの行動の違い**がわかったとき","trap":"bẫy chi tiết phụ","vi":"Bài không nói về 'sự khác biệt hành vi' — nói về việc nắm được tâm khỉ."},{"key":"C","jp":"レバー押しの訓練が進むにつれて、サルが**筆者の心をわかってくれた**と感じたとき","trap":"bẫy ngược nghĩa","vi":"Đảo chiều chủ thể — phải là TÁC GIẢ hiểu tâm khỉ, không phải khỉ hiểu tâm tác giả."},{"key":"D","jp":"レバー押しの訓練によって**教科書には書かれていないサルの行動**が解明されたとき","trap":"bẫy chi tiết phụ","vi":"Nhầm 'điều sách không viết' (ở câu kết, ý khác) với nội dung そのとき."}]},{"huongTuDuy":"Câu kết bài là chìa khóa: 「学問の本当に大事なことは、教科書には書いていないことを知った」.","chotY":"行動だけを見よといいながら、その実、うまく訓練するには**サルの心がつかめていなければならない**のだ。→ điều quan trọng nhất phải tự trải nghiệm mới biết.","lienKetJP":"教科書通りにやる → しかし実際は衝撃の体験 → 心がつかめないと訓練がうまくいかない → 教科書には書いていないことを知った","lienKetVI":"Làm theo đúng sách → nhưng thực tế là trải nghiệm gây sốc → không nắm được tâm thì huấn luyện không thành → nhận ra điều sách không dạy","correct":{"jp":"動物を訓練するためには**気持ちをつかむ**ことが重要であり、それは**自分で体験**して初めてわかる","vi":"Khớp đúng cả 2 ý: tầm quan trọng của việc nắm bắt cảm xúc + phải tự trải nghiệm mới biết (giáo trình không dạy được)."},"wrong":[{"key":"A","jp":"動物を目標に近づける訓練では、「エサやり」を通して**動物が人間に慣れる**ことが大切だ","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — bài không nói về việc động vật quen với con người."},{"key":"C","jp":"動物の心理を探るためには、まず**教科書に書いてあるとおりのこと**を実践することが大事だ","trap":"bẫy ngược nghĩa","vi":"Ngược hoàn toàn — bài nói điều QUAN TRỌNG NHẤT không có trong sách giáo khoa."},{"key":"D","jp":"動物の心をつかむには**目に見える行動だけ**に注目することが大切だが、そのことは教科書に書いていない","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói phải nắm được TÂM (vô hình) chứ không phải chỉ hành động (hữu hình)."}]}],"Mon10-3":[{"huongTuDuy":"①そんな錯覚 là chỉ thị từ — phải tìm đúng câu ngay trước nó, không lấy phần mô tả phương tiện.","chotY":"「自分は**世界的に考えている**、そのなかに**世界のすべてを包める**」— đây là nội dung của ảo tưởng, không phải nguyên nhân gây ra nó.","lienKetJP":"言葉の風呂敷はいくらでも広げられる →（だから）→ 自分は世界的に考えている、世界を包める → ①そんな錯覚","lienKetVI":"Lời nói có thể khoác đến đâu cũng được → (nên) → tưởng mình suy nghĩ tầm thế giới, ôm trọn cả thế giới → '①ảo tưởng đó'","correct":{"jp":"自分は**何でも知っていて**、**世界を相手にできる**と思う","vi":"Khớp đúng nội dung ảo tưởng: 世界的に考えている、世界のすべてを包める."},"wrong":[{"key":"B","jp":"**言葉**でどんなことでも**伝えられる**ような気になる","trap":"bẫy chi tiết phụ","vi":"Đây là phương tiện/nguyên nhân gây ảo tưởng (言葉の風呂敷), không phải nội dung ảo tưởng."},{"key":"C","jp":"学問から得られることには**限界がない**と感じてしまう","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — toàn bài nhấn mạnh giới hạn nhỏ bé (小さい) của con người, không phải vô hạn."},{"key":"D","jp":"人間が世界から**学べることはいかに大きい**ことかと思う","trap":"bẫy mọi người","vi":"Nghe hợp lý nhưng sai hướng — ảo tưởng là về KHẢ NĂNG CỦA BẢN THÂN, không phải về thế giới."}]},{"huongTuDuy":"②これ là chỉ thị từ chỉ về tính chất công việc của 大工・農夫 đã nêu ngay trước.","chotY":"彼らはみな、**自分の仕事において賢明**である。**我が身ひとつの能力でできることを知り抜いている**.","lienKetJP":"大工・農夫は世界的に木を削ったりはできない → 自分の仕事で賢明、能力を知り抜いている → ②これと学問は変わらない","lienKetVI":"Thợ mộc/nông dân không thể làm việc 'tầm thế giới' → khôn ngoan trong công việc mình, biết rõ năng lực bản thân → '②điều này' giống hệt việc học vấn","correct":{"jp":"**自分にできること**を**把握したうえで**仕事をすること","vi":"Khớp đúng 「我が身ひとつの能力でできることを知り抜いている」 — biết rõ giới hạn năng lực bản thân."},"wrong":[{"key":"B","jp":"自分が**世界のために**何ができるかを考えて仕事に励むこと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài phủ định hoàn toàn cách nghĩ 'tầm thế giới' (世界的に)."},{"key":"C","jp":"できる限り**多くの知識**を得て自分の仕事に役立たせること","trap":"bẫy chi tiết phụ","vi":"Không phải về 'thu thập kiến thức' mà về biết giới hạn năng lực bản thân."},{"key":"D","jp":"**人のために**できることは何かを考えたうえで仕事をすること","trap":"bẫy mọi người","vi":"Tự thêm yếu tố 'vì người khác' không có trong bài."}]},{"huongTuDuy":"Đoạn cuối dùng ẩn dụ nông nghiệp (土壌・苗) để giải thích về việc học — cần xác định đúng động từ chính trong ví dụ.","chotY":"教養とは「気質に植えられた苗のように育つ学問や思想」— tương tự việc trồng và CHĂM SÓC để mạ TỰ LỚN, không phải cải tạo đất.","lienKetJP":"気質は土壌のようなもの → 与えられたこの土を耕し、苗を植え、苗が育つのを手伝う → 教養が育つ","lienKetVI":"Khí chất giống như đất → cày đất được giao, trồng mạ, giúp mạ tự lớn → học vấn/giáo dưỡng được hình thành","correct":{"jp":"与えられた**土を耕し**、よい**作物**になるように**苗を育てる**","vi":"Khớp đúng hình ảnh: cày đất + giúp mạ lớn thành tốt, không phải 'chọn mạ có sẵn' hay 'cải tạo đất'."},"wrong":[{"key":"A","jp":"与えられた土を耕し、よい**苗を選んで植える**","trap":"bẫy chi tiết phụ","vi":"Sai chi tiết — bài nói về việc CHĂM SÓC mạ lớn lên, không phải CHỌN mạ có sẵn."},{"key":"C","jp":"与えられた**土壌を改善する**ために耕し続ける","trap":"bẫy chi tiết phụ","vi":"Thiếu mất phần quan trọng nhất: nuôi trồng cây/mạ — chỉ nói về cải tạo đất."},{"key":"D","jp":"与えられた**土壌を改善**しながら**世界標準**の作物を育てる","trap":"bẫy ngược nghĩa","vi":"'Tiêu chuẩn thế giới' (世界標準) ngược hoàn toàn với tinh thần bài — phủ định suy nghĩ tầm thế giới."}]},{"huongTuDuy":"Câu hỏi tổng kết khái niệm 教養 — bám vào câu định nghĩa cuối bài.","chotY":"教養は「**気質に植えられた苗**のように育つ学問や思想」— giáo dưỡng/học vấn được nuôi dưỡng THEO KHÍ CHẤT RIÊNG của từng người.","lienKetJP":"人は誰でも自分の気質を背負って生まれる → 気質は土壌のようなもの → 教養はその土壌で育つ学問・思想","lienKetVI":"Ai cũng mang theo khí chất riêng khi sinh ra → khí chất như mảnh đất → giáo dưỡng là học vấn/tư tưởng lớn lên trên mảnh đất đó","correct":{"jp":"**人それぞれの気質**の中で**育まれた**学問や思想","vi":"Khớp đúng định nghĩa: giáo dưỡng gắn liền với khí chất riêng từng cá nhân."},"wrong":[{"key":"A","jp":"新たな気質を見いだすことができる学問や思想。","trap":"bẫy ngược nghĩa","vi":"Bài nói 学問や思想 lớn lên từ khí chất sẵn có, không phải 'tìm ra khí chất mới' — nhầm gốc và ngọn."},{"key":"C","jp":"生きていくうえで必要な専門的な知識 。","trap":"bẫy chi tiết phụ","vi":"「専門的な知識」không xuất hiện; tác giả nói 教養 là 'tác phẩm' (作物) kết quả của quá trình tự học, không phải tri thức chuyên môn."},{"key":"D","jp":"書物や学問から得られた多くの知識。","trap":"bẫy ngược nghĩa","vi":"Tác giả phủ nhận: 教養 không chỉ 'đại phong bao' của người biết nhiều (物識りたちの大風呂敷) mà là 'mùa gặt' từ chính khí chất mình."}]}],"Mon10-4":[{"huongTuDuy":"Đoạn đầu mô tả 2 giới hạn của khoa học — câu hỏi tập trung vào giới hạn thứ nhất.","chotY":"科学的知は「対象を**突き放して**、第三者的立場で…必ずそのつど、**特定の観点からだけ**対象を扱い、**自分が関心を持つ側面だけ**を取り上げ」.","lienKetJP":"科学＝対象を突き放す → 特定の観点・関心ある側面だけ扱う → それ以外は捨象（決して全体を見ない）","lienKetVI":"Khoa học = tách rời đối tượng → chỉ lấy góc nhìn/khía cạnh quan tâm cụ thể → bỏ qua phần còn lại (không bao giờ nhìn toàn thể)","correct":{"jp":"**現在**の事象の**一部だけ**を取り上げて**客観的な立場**で検証する","vi":"Khớp với '特定の観点からだけ扱い、関心ある側面だけ取り上げ' — chỉ 1 phần, góc nhìn khách quan cụ thể."},"wrong":[{"key":"B","jp":"関心のある対象だけを客観的な立場で検証し**未来を予測**する","trap":"bẫy chi tiết phụ","vi":"'Dự đoán tương lai' không có trong đoạn này — đó là nội dung của giới hạn thứ 2 (quá khứ/tương lai)."},{"key":"C","jp":"**過去の経験**をもとにして客観的な立場で現在の状況を扱う","trap":"bẫy chi tiết phụ","vi":"Nhầm lẫn với nội dung giới hạn thứ 2 của khoa học (không xử lý được ký ức quá khứ)."},{"key":"D","jp":"**人間的知の全体**を客観的な立場からだけとらえる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — khoa học 'quyết KHÔNG nhìn toàn thể đối tượng' (決して対象の全体を見ようとはしない)."}]},{"huongTuDuy":"①この傾向 chỉ thị từ — tìm câu ngay trước về hệ quả của việc khoa học chỉ nhìn 1 phần.","chotY":"「科学が進むと、**細分化が必至**となり…**専門化と特殊化**が、科学の運命であり…①この傾向には歯止めが利かない」.","lienKetJP":"科学は一部だけを扱う → 細分化が必至 → 専門化・特殊化が進む（①この傾向）→ 歯止めが利かない","lienKetVI":"Khoa học chỉ xử lý một phần → tất yếu phân nhỏ → chuyên môn hóa, đặc thù hóa (= '①xu hướng này') → không thể ngăn lại","correct":{"jp":"**専門分野**が以前より**細かく分かれる**ようになってきた","vi":"Khớp trực tiếp với 専門化と特殊化、細分化 — phân ngành ngày càng nhỏ."},"wrong":[{"key":"A","jp":"近代的な研究を行う**部門がさらに増えてきた**","trap":"bẫy chi tiết phụ","vi":"'Tăng số bộ phận' không chính xác bằng — trọng tâm là sự PHÂN NHỎ/chuyên môn hóa."},{"key":"B","jp":"特殊な研究対象が**排除**されるようになってきた","trap":"bẫy chi tiết phụ","vi":"Không có nội dung 'loại bỏ đối tượng nghiên cứu đặc biệt' trong bài."},{"key":"C","jp":"研究対象をより**実践的**にとらえるようになってきた","trap":"bẫy mọi người","vi":"Không liên quan — bài không nói về tính thực tiễn mà nói về sự phân mảnh chuyên môn."}]},{"huongTuDuy":"②なぜ khoa học không xử lý được vấn đề 'nên sống thế nào' — cần tìm lý do ở câu giải thích ngay sau.","chotY":"科学的知は「対象を、自分と無関係な事柄として扱う**客観性**がその特色」— chỉ coi trọng sự kiện khách quan, không xử lý được hành vi chủ thể quyết định sống.","lienKetJP":"科学＝客観性が特色（自分と無関係な事柄として扱う）→ 主体的に決断して生きる行為の問題は扱えない","lienKetVI":"Khoa học coi trọng tính khách quan (xử lý như sự việc không liên quan đến mình) → không xử lý được vấn đề tự quyết định cách sống chủ thể","correct":{"jp":"**客観的な事実確認**を重視するものだから","vi":"Khớp đúng đặc trưng cốt lõi: khoa học chỉ coi trọng xác nhận sự kiện khách quan."},"wrong":[{"key":"B","jp":"**現在の行為だけ**を主体的に扱うものだから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — khoa học KHÔNG xử lý được hành vi 'chủ thể quyết định', đây là điểm bài phủ định."},{"key":"C","jp":"**人間全体**を解明することができないから","trap":"bẫy chi tiết phụ","vi":"Đây thuộc giới hạn thứ NHẤT (không nhìn toàn thể), không phải lý do của giới hạn thứ 2 đang được hỏi."},{"key":"D","jp":"人間の考えや行為の多くを**まだ実証できない**から","trap":"bẫy mọi người","vi":"Tự thêm 'chưa thể chứng minh được' — không có trong lý lẽ của bài."}]},{"huongTuDuy":"Câu hỏi tổng kết — tìm câu mở đầu định nghĩa vai trò triết học.","chotY":"「人間的知の全体をほんとに見渡しうる哲学的知の立場」+ phần sau bài (không trích ở đây) nói triết học giải quyết 「**いかに生きるべきか**」— gốc rễ hành vi chủ thể con người.","lienKetJP":"科学は2つの限界を持つ → 全体を見れない／主体的に生きる問題を扱えない → 哲学はこの両方を扱える＝人間の生き方の根本","lienKetVI":"Khoa học có 2 giới hạn → không nhìn toàn thể / không xử lý vấn đề sống chủ thể → triết học xử lý được cả 2, là gốc rễ cách sống con người","correct":{"jp":"**人間の生き方の根本**を扱えること","vi":"Khớp đúng với 'いかに生きるべきか'、 ' 主体的な行為の根本' — vấn đề gốc rễ của cách sống con người."},"wrong":[{"key":"B","jp":"**主体的に考える方法**を示せること","trap":"bẫy chi tiết phụ","vi":"Chỉ nói 'phương pháp suy nghĩ', thiếu yếu tố cốt lõi 'gốc rễ cách sống'."},{"key":"C","jp":"**科学的な世界**を視野に入れられること","trap":"bẫy mọi người","vi":"Không phải trọng tâm — triết học không phải chỉ 'bao gồm cả khoa học'."},{"key":"D","jp":"世界のあり方を**客観的にとらえられる**こと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 'khách quan' là đặc trưng của KHOA HỌC, triết học vượt ra ngoài giới hạn khách quan đó."}]}],"Mon10-5":[{"huongTuDuy":"①シナジー効果 với người đọc — tìm định nghĩa ngay trước, phân biệt với '100 điểm thông thường'.","chotY":"「著者と読者のあいだで、その文章を媒体として**記述されていること以上の事柄が発見**できれば、読者にとって最高の満足感」.","lienKetJP":"目的に合致した文章＝満足感（100点）→ もし記述以上のことが発見できれば →①シナジー効果＝最高の満足感","lienKetVI":"Văn bản đúng mục đích = hài lòng (100 điểm) → nếu phát hiện được nhiều hơn cả những gì viết ra → 'hiệu ứng synergy' = sự hài lòng cao nhất","correct":{"jp":"記述されている内容から、**求めていた以上のこと**が得られる","vi":"Khớp trực tiếp 「記述されていること以上の事柄が発見できる」."},"wrong":[{"key":"B","jp":"著者が伝えようとしている事柄を**理解**し、**知識を増やす**","trap":"bẫy chi tiết phụ","vi":"Đây chỉ là mức '100 điểm' thông thường, chưa đạt đến 'synergy' (vượt quá nội dung viết)."},{"key":"C","jp":"読むことを通して事実を知り、**不十分な点を自覚**する","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — 'tự nhận ra thiếu sót bản thân' là cảm giác TIÊU CỰC (tự ti), khác hoàn toàn với 'phát hiện kiến thức mới' tích cực."},{"key":"D","jp":"文章から**足りない知識を補い**、**疑問を解消**する","trap":"bẫy chi tiết phụ","vi":"Chỉ là việc đáp ứng đủ thông tin cần thiết (mức cơ bản), chưa phải 'vượt quá những gì được viết'."}]},{"huongTuDuy":"②それが一番よくわかる — tìm điều được minh họa bằng ví dụ báo cáo sinh viên (đoạn tiếp theo, không trích đầy đủ ở đây nhưng theo mạch bài).","chotY":"Đoạn về báo cáo sinh viên: nếu vài dòng đầu không cuốn hút, người đọc sẽ KHÔNG đọc tiếp — minh chứng cho tầm quan trọng của việc giữ chân người đọc đến cuối.","lienKetJP":"文章の目的を達成するために大事なのは、読者が**最後まで読んでくれる**こと → 読む気のしない文章は目的を果たせない → ②それが一番よくわかる（学生レポートの例）","lienKetVI":"Điều quan trọng để đạt mục đích văn bản là người đọc ĐỌC ĐẾN CUỐI → văn bản không hấp dẫn thì không đạt mục đích → ví dụ báo cáo sinh viên minh chứng rõ nhất","correct":{"jp":"**読む気がしない**ものは**終わりまで読んでもらえない**こと","vi":"Khớp đúng luận điểm chính của đoạn: văn bản không cuốn hút sẽ không được đọc hết."},"wrong":[{"key":"A","jp":"読み手に**満足感**を与えるのは難しいということ","trap":"bẫy mọi người","vi":"Quá chung chung, không khớp với trọng tâm cụ thể về việc 'đọc đến cuối'."},{"key":"B","jp":"**素晴らしい内容**でなければ読んでもらえないこと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói RÕ dù nội dung tuyệt vời (素晴らしい内容が書かれていても) vẫn không đạt mục đích nếu không hấp dẫn để đọc."},{"key":"D","jp":"読んで**すべてを理解**してもらうことは**不可能**だということ","trap":"bẫy chi tiết phụ","vi":"Không phải nội dung của đoạn này — đoạn không nói về khả năng hiểu hết nội dung."}]},{"huongTuDuy":"③脳に届いても心に届かない — phép đối lập 脳 (lý trí/hiểu) vs 心 (cảm xúc/tấm lòng).","chotY":"脳＝hiểu được nội dung logic; 心＝cảm nhận được tấm lòng/sự chân thành của người viết. 「届いても…届かない」= đạt được vế trước nhưng KHÔNG đạt vế sau.","lienKetJP":"AはBだ、覚えておけという姿勢 → 脳には届く（理解できる）→ しかし心には届かない（気持ちは伝わらない）","lienKetVI":"Thái độ 'A là B, hãy nhớ lấy' → đến được não (hiểu được nội dung) → nhưng không đến được tim (không cảm nhận được tấm lòng người viết)","correct":{"jp":"**内容は理解**できても、**書き手の気持ち**は伝わってこない","vi":"Khớp đúng phép đối lập 脳(理解)/心(気持ち) trong câu gốc."},"wrong":[{"key":"A","jp":"**技巧**には感心しても、**内容**には共感できない","trap":"bẫy chi tiết phụ","vi":"Sai cặp đối lập — bài đối lập '理解nội dung' với 'cảm xúc người viết', không phải 'kỹ thuật' với 'nội dung'."},{"key":"B","jp":"**行間の意味**は理解できても、内容には**感動**できない","trap":"bẫy chi tiết phụ","vi":"'Ý ngoài lời' không phải là điều được nói đến — bài nói rõ về nội dung và tấm lòng người viết."},{"key":"C","jp":"**書き手の姿勢**は理解できても、**気迫**までは感じられない","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng sai từ — phải là KHÔNG hiểu được 'tấm lòng/cảm xúc' (気持ち) chứ không phải 'khí phách' (気迫)."}]},{"huongTuDuy":"Câu hỏi tổng kết thái độ nên có của người viết văn lý kỹ thuật — bám câu kết luận về cách viết tốt.","chotY":"著者は常に**読者を意識**し、読者とともに**問題の解決**にあたるという**姿勢**を持つことで文章に磨きがかかる.","lienKetJP":"著者は読者を意識する → 読者とともに問題解決にあたる姿勢 → 文章が磨かれる（シナジー効果が生まれる）","lienKetVI":"Tác giả ý thức về độc giả → mang thái độ cùng giải quyết vấn đề với độc giả → văn bản trở nên tinh tế hơn (tạo ra hiệu ứng synergy)","correct":{"jp":"読者を**意識**しつつ、**真摯に解答を求めて**その**気持ちを伝えよう**とする","vi":"Khớp đúng thái độ được khuyến nghị: ý thức độc giả + chân thành tìm giải pháp + truyền tải cảm xúc."},"wrong":[{"key":"A","jp":"読者の**読む目的を分析**し、読者に**過不足のない情報**を与えようとする","trap":"bẫy chi tiết phụ","vi":"Đây chỉ là mức '100 điểm' thông thường, chưa đạt mức 'synergy' với tấm lòng chân thành."},{"key":"C","jp":"読者に満足感を与えるよう、**妥協せずに完全な解答**を提供しようとする","trap":"bẫy chi tiết phụ","vi":"Quá tuyệt đối hóa — bài không yêu cầu 'giải pháp hoàn hảo', mà là thái độ chân thành đồng hành."},{"key":"D","jp":"読者の読む気を最後まで誘うよう、**読者の思考過程を深く分析**しようとする","trap":"bẫy mọi người","vi":"Không có trong bài — 'phân tích sâu quá trình tư duy độc giả' là chi tiết tự thêm vào."}]}],"Mon10-6":[{"huongTuDuy":"①ふさわしいあり方 — bài chia thành 2 nhánh ngay sau, cần đáp án bao quát ĐỦ cả 2.","chotY":"「ふさわしさ」は二つ：①**働いて食べていけるために必要な能力**（技能・知識）②**他の人びととのあいだでふさわしいふるまい**（他者との関係能力）.","lienKetJP":"ふさわしさ＝二つに分けられる → 技能・知識（働く能力）＋ 他者との関係能力（協力・責任）","lienKetVI":"'Phù hợp' chia làm 2: kỹ năng/kiến thức để làm việc kiếm sống + năng lực quan hệ với người khác (hợp tác, trách nhiệm)","correct":{"jp":"**技能や知識**を身につけ、**他者とのあいだでうまく生きていける**こと","vi":"Bao quát đủ cả 2 nhánh: kỹ năng/kiến thức (技能・知識) + quan hệ với người khác."},"wrong":[{"key":"A","jp":"子供を**養い**、社会において**責任あるふるまい**ができること","trap":"bẫy chi tiết phụ","vi":"'Nuôi con' không có trong định nghĩa gốc — chỉ nói về năng lực làm việc và quan hệ xã hội nói chung."},{"key":"B","jp":"**自立**するために必要な能力を身につけ、**自由に生きていける**こと","trap":"bẫy chi tiết phụ","vi":"Thiếu hẳn nhánh thứ 2 (quan hệ với người khác), chỉ nói về tự lập."},{"key":"C","jp":"**いつの時代にも通用する**技能や知識を備え、**他者に尊敬**されること","trap":"bẫy mọi người","vi":"Tự thêm 'mọi thời đại đều áp dụng được' và 'được tôn trọng' — không có trong bài."}]},{"huongTuDuy":"Câu hỏi về lý do khó 'chia sẻ' lý niệm giáo dục — tìm câu giải thích ngay sau だが.","chotY":"「そこには、社会のあり方と人間の生き方をどのようなものとして思い描くか、つまりは、**異なった社会観・人間観**がさまざまに**入り込み、衝突**してくるからだ」.","lienKetJP":"教育理念の共有はむずかしい →（だが）→ 異なった社会観・人間観が入り込み、衝突する","lienKetVI":"Chia sẻ lý niệm giáo dục rất khó → (nhưng) → nhiều quan điểm xã hội/con người khác nhau xen vào, va chạm nhau","correct":{"jp":"社会や人間について**色々な考え方**があり**ぶつかり合う**から","vi":"Khớp trực tiếp với 「異なった社会観・人間観…衝突してくる」."},"wrong":[{"key":"B","jp":"**教育者**と**一般社会**の人びとが思い描く**大人らしさ**は違うから","trap":"bẫy chi tiết phụ","vi":"Bài không chia phe 'nhà giáo dục vs xã hội nói chung' — nói về sự đa dạng quan điểm nói chung."},{"key":"C","jp":"**子どもの主体性**について**一致した見解**が得られないから","trap":"bẫy chi tiết phụ","vi":"'Tính chủ thể của trẻ' là nội dung của đoạn SAU (phần 反発を覚える人), chưa xuất hiện ở đây."},{"key":"D","jp":"社会のあり方や人びとの**価値観が変化**してきているから","trap":"bẫy mọi người","vi":"Bài không nói về sự THAY ĐỔI theo thời gian, mà nói về sự ĐA DẠNG cùng tồn tại."}]},{"huongTuDuy":"Câu hỏi về thái độ tác giả với người PHẢN ĐỐI định nghĩa giáo dục ban đầu — cần đoạn tiếp theo (không trích đủ ở đây) nhưng theo mạch: tác giả coi phản đối cũng là 1 dạng kỳ vọng giống mình.","chotY":"Tác giả nhận định: người phản đối (cho rằng giáo dục không nên 'ép buộc' theo khuôn mẫu xã hội) thực chất cũng đang mong muốn trẻ tự đạt được kỳ vọng nào đó — GIỐNG bản chất với định nghĩa ban đầu của tác giả (đều là kỳ vọng/期待).","lienKetJP":"反発を覚える人＝子どもの主体性を尊重したい → しかし、それも一種の「期待」である → 筆者の定義（大人としてふさわしさを期待）と本質は同じ","lienKetVI":"Người phản đối muốn tôn trọng tính chủ thể của trẻ → nhưng đó cũng là một dạng 'kỳ vọng' → về bản chất giống với định nghĩa ban đầu của tác giả","correct":{"jp":"大人の**期待を実現**しようとするという点では**筆者の考えと同じ**だ","vi":"Khớp với luận điểm: dù khác hình thức, cả 2 quan điểm đều xuất phát từ một dạng 'kỳ vọng' tương tự."},"wrong":[{"key":"B","jp":"大人の期待を**押し付け**ようとすることは**教育理念にそぐわない**ものだ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — đây là LẬP TRƯỜNG của người phản đối, không phải đánh giá của tác giả về họ."},{"key":"C","jp":"子どもの**主体的な判断力**がみずから育つと考えることは**思い込み**でしかない","trap":"bẫy chi tiết phụ","vi":"Quá tiêu cực — tác giả không phủ định hoàn toàn quan điểm của người phản đối, mà chỉ ra điểm chung."},{"key":"D","jp":"子どもの**主体的な判断力**を育てようとする点では**筆者の考えと変わらない**","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm so sánh — điểm chung là 'kỳ vọng' (期待) chứ không phải 'nuôi dưỡng năng lực phán đoán chủ thể'."}]},{"huongTuDuy":"Câu hỏi tổng kết quan điểm cuối cùng của tác giả về bản chất giáo dục — bám câu kết luận.","chotY":"Giáo dục「**強制**から**自由ではない**」，nhưng cường chế đó cần có tiền đề là **lý niệm được chia sẻ chung** (理念の共有を前提とした強制かどうか).","lienKetJP":"教育＝大人としてふさわしさへ育てる営み → それは必然的に強制を伴う → しかし、理念の共有があるかどうかが重要","lienKetVI":"Giáo dục = công việc nuôi dạy trẻ thành người phù hợp xã hội → tất yếu đi kèm với cường chế → nhưng quan trọng là cường chế đó có tiền đề chia sẻ lý niệm chung hay không","correct":{"jp":"教育は**強制から自由ではなく**、その強制は**教育理念の共有が前提**となる","vi":"Khớp đúng kết luận: giáo dục không thoát khỏi cường chế, nhưng cường chế đó cần dựa trên việc chia sẻ lý niệm chung."},"wrong":[{"key":"A","jp":"教育は社会の秩序に**縛られない主体的な判断力**を養うものだ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — tác giả khẳng định giáo dục KHÔNG thoát khỏi cường chế, không phải 'tự do khỏi trật tự xã hội'."},{"key":"B","jp":"教育は社会のあり方を**批判的に検討**できる能力を育てるものだ","trap":"bẫy mọi người","vi":"Không có trong bài — đây là quan điểm tự thêm về 'tư duy phản biện', không phải kết luận của tác giả."},{"key":"D","jp":"教育は強制から自由ではなく、社会の**有力な教育観を受け入れざるをえない**","trap":"bẫy ngược nghĩa","vi":"Gần đúng nhưng sai chi tiết quan trọng — tác giả nhấn mạnh CẦN CÓ sự chia sẻ lý niệm (共有が前提), không phải 'bắt buộc chấp nhận quan điểm giáo dục có thế lực'."}]}],"Mon10-7":[{"huongTuDuy":"①意表をついた連鎖反応 minh họa bằng ví dụ A/B/C/D — cần xác định đúng vai trò từng ký hiệu trong chuỗi quan hệ.","chotY":"「Aなる害虫を除去…Bなる作物が虫害をまぬかれた。しかしその結果、おなじく**Aによって食い殺されていたCやD**の種属が、抑制因子をとりのけられて爆発的に増加し、あらたな害虫となって**Bにおそいかかる**」.","lienKetJP":"Aを除去してBを守る → しかしAに食われていたC・Dが爆発的に増加 → C・DがBを襲う（＝意表をついた連鎖反応）","lienKetVI":"Diệt A để bảo vệ B → nhưng C, D vốn từng bị A ăn nay bùng nổ → C, D quay sang tấn công B (= phản ứng dây chuyền bất ngờ)","correct":{"jp":"BをおそうAを除去した結果、**Aに食い殺されていたCやD**が**Bをおそうように**なる","vi":"Khớp đúng chuỗi quan hệ: diệt A (kẻ thù B) → C,D (từng bị A ăn) bùng nổ → tấn công B."},"wrong":[{"key":"A","jp":"BをおそうAを除去した結果、**あらたな強いA**が発生してCやDをおそうようになる","trap":"bẫy ngược nghĩa","vi":"Sai hoàn toàn vai trò — không có 'A mới mạnh hơn' xuất hiện, mà là C,D tăng vọt."},{"key":"C","jp":"BをおそうCやDを除去した結果、**あらたなA**が増加してBをおそうようになる","trap":"bẫy ngược nghĩa","vi":"Đảo ngược vai trò các ký hiệu — chính A mới là đối tượng bị loại bỏ ban đầu, không phải C,D."},{"key":"D","jp":"BをおそうCやDを除去した結果、**CやDに食い殺されていたA**がBをおそうようになる","trap":"bẫy ngược nghĩa","vi":"Đảo ngược hoàn toàn quan hệ săn mồi giữa các loài so với bài gốc."}]},{"huongTuDuy":"②このこと chỉ thị từ — tìm câu ngay trước nói về xu hướng sử dụng hóa chất.","chotY":"「ひたすらそれへの依存度を増し、つまり**量質ともに強大化する方向**へつっぱしった」— đây chính là nội dung ②このこと.","lienKetJP":"化学薬品が開発される → 依存度を増す → 量質ともに強大化する方向へつっぱしる（＝②このこと）","lienKetVI":"Hóa chất được phát triển → mức độ phụ thuộc tăng → cả lượng và chất ngày càng tăng mạnh (= '②điều này')","correct":{"jp":"化学薬品の**量と質**の**強大化**","vi":"Khớp trực tiếp với 「量質ともに強大化する方向」."},"wrong":[{"key":"A","jp":"化学薬品の**開発**","trap":"bẫy chi tiết phụ","vi":"Chỉ là bước khởi đầu (いったん開発されてこのかた), không phải nội dung của ②このこと."},{"key":"B","jp":"化学薬品の**有用性**","trap":"bẫy mọi người","vi":"Không có trong câu gốc — tự thêm khái niệm 'tính hữu dụng'."},{"key":"C","jp":"化学薬品の**無効性**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói về sự tăng cường sử dụng, không phải mất hiệu quả."}]},{"huongTuDuy":"③最初の出発点 — cần đọc đoạn cuối bài để xác định mốc lịch sử đúng.","chotY":"「人間が今日のごとく高度文明をきずきえたのは、採集経済から脱して、**牧畜さらに農耕**という生産手段を発明したからである」+「公害の起原は…遠く**牧畜ないし農耕のはじまり**にさかのぼる」.","lienKetJP":"採集経済から脱却 → 牧畜・農耕を発明（＝土地を独占して使用）→ ③最初の出発点 → 公害の起原もここに遡る","lienKetVI":"Thoát khỏi kinh tế hái lượm → phát minh chăn nuôi/nông canh (= chiếm dụng đất đai) → '③điểm khởi đầu' → nguồn gốc ô nhiễm cũng bắt nguồn từ đây","correct":{"jp":"人間が**土地を牧場や田畑**として**使用しはじめた**ころ","vi":"Khớp đúng với 「牧畜さらに農耕という生産手段を発明した」「牧畜ないし農耕のはじまり」."},"wrong":[{"key":"A","jp":"人間が**採集活動**によって生活を営みはじめたころ","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói '採集経済から脱して' (THOÁT KHỎI hái lượm), không phải bắt đầu từ đó."},{"key":"C","jp":"**企業に資本**が集まり、産業が発展しはじめたころ","trap":"bẫy chi tiết phụ","vi":"Đây là quan điểm SAI LẦM mà tác giả phê phán (一企業の責任に帰するには根が深すぎる), không phải điểm khởi đầu thật sự."},{"key":"D","jp":"**文明が高度化**し、工業が盛んになりはじめたころ","trap":"bẫy ngược nghĩa","vi":"Bài khẳng định rõ: nguồn gốc KHÔNG bắt đầu từ công nghiệp (工業とともにおきたのではなく), mà từ xa xưa hơn."}]},{"huongTuDuy":"Câu hỏi tổng kết nguyên nhân gốc rễ — bám vào đoạn cuối bài về việc loại bỏ sinh vật 'vô dụng'.","chotY":"「人間はそれらの生物群にたいし、**害獣・害鳥・害虫**あるいは雑草といった汚名を一方的にかぶせ、**強引に排除する**手段にでた」.","lienKetJP":"特定の土地を独占使用 → 利用目的にかなわない生物群を排除（害獣・害虫の汚名）→ 自然界のバランスがくずれる","lienKetVI":"Chiếm dụng đất đai cho mục đích riêng → loại bỏ sinh vật không phục vụ mục đích (gán mác 'sâu bệnh') → cân bằng tự nhiên bị phá vỡ","correct":{"jp":"人間が人間に**利用価値のない生物群**を**排除**してきたこと","vi":"Khớp đúng với 「汚名をかぶせ、強引に排除する」 — nguyên nhân cốt lõi là loại bỏ sinh vật không có giá trị sử dụng."},"wrong":[{"key":"A","jp":"人間が**生産手段**を発明したこと","trap":"bẫy chi tiết phụ","vi":"Đây là TIỀN ĐỀ (phát minh chăn nuôi/nông nghiệp), không phải nguyên nhân trực tiếp gây mất cân bằng."},{"key":"B","jp":"人間が**薬剤開発**のために各種生物群を利用してきたこと","trap":"bẫy chi tiết phụ","vi":"Hóa chất chỉ là VÍ DỤ minh họa ở đoạn đầu, không phải nguyên nhân gốc rễ mà bài kết luận."},{"key":"D","jp":"人間が人間以外の生物群の**存在を無視**してきたこと","trap":"bẫy chi tiết phụ","vi":"'Phớt lờ sự tồn tại' nhẹ hơn thực tế — bài nói rõ con người chủ động LOẠI BỎ (強引に排除), không chỉ đơn thuần phớt lờ."}]}],"Mon10-8":[{"huongTuDuy":"①何とも複雑な心境 — tìm nguyên nhân ở câu mở đầu mô tả định kiến chung về nghệ thuật.","chotY":"「芸術、文化などの名で呼ばれるものはどうしても、**現実の政治経済や社会生活に関わることがらとは切り離されたもの**と考えられることが多く」— bị xem là TÁCH BIỆT khỏi đời sống xã hội hiện thực.","lienKetJP":"芸術・文化＝現実生活と切り離されたものと思われがち → 「うらやましい」と言われる → ①複雑な心境","lienKetVI":"Nghệ thuật/văn hóa thường bị coi là tách biệt khỏi đời sống hiện thực → bị nói 'ghen tị' (vì nhàn rỗi) → tâm trạng phức tạp","correct":{"jp":"芸術や文化が**社会生活とは懸け離れている**と思われていること","vi":"Khớp trực tiếp với 「現実の政治経済や社会生活に関わることがらとは切り離されたもの」."},"wrong":[{"key":"A","jp":"芸術や文化の価値が現実生活で**高く評価されない**から","trap":"bẫy chi tiết phụ","vi":"Không chính xác — vấn đề không phải về MỨC ĐỘ đánh giá, mà là bị coi là TÁCH BIỆT khỏi đời sống."},{"key":"B","jp":"芸術や文化と社会生活との関係が**希薄になっていく**から","trap":"bẫy chi tiết phụ","vi":"'Ngày càng nhạt dần theo thời gian' không khớp — bài nói đây là một ĐỊNH KIẾN có sẵn, không phải quá trình."},{"key":"C","jp":"芸術や文化の**研究が現実生活に役立たない**と思われているから","trap":"bẫy chi tiết phụ","vi":"Hẹp hơn ý gốc — bài nói về cả LĨNH VỰC nghệ thuật/văn hóa nói chung, không chỉ riêng việc nghiên cứu có ích hay không."}]},{"huongTuDuy":"Câu hỏi về quan điểm của các nhà nghiên cứu âm nhạc GẦN ĐÂY — cần đối lập với quan điểm cũ (純粋な音楽).","chotY":"「政治や社会の話と切り離して文化が論じられるなどということが**幻想**である」「音楽研究者の中にも…**純粋な「音楽そのもの」**…と素朴に信じているような人は、誰もいないだろう」.","lienKetJP":"コペルニクス的転回（考え方が根本的に変化）→ 純粋な音楽という幻想が暴かれる → 音楽は政治・社会と深く関わっている","lienKetVI":"Bước ngoặt nhận thức căn bản → ảo tưởng về 'âm nhạc thuần túy' bị vạch trần → âm nhạc gắn sâu với chính trị-xã hội","correct":{"jp":"**政治や社会**に深く**関わっている**","vi":"Khớp đúng quan điểm hiện đại: phủ định hoàn toàn ý tưởng 'âm nhạc thuần túy tách biệt'."},"wrong":[{"key":"A","jp":"社会の状況が**悪化したとき**に最も**必要とされる**","trap":"bẫy chi tiết phụ","vi":"Đây là quan điểm 'ốc đảo trốn tránh đời thực' ở đoạn đầu — không phải quan điểm của nhà nghiên cứu âm nhạc gần đây."},{"key":"B","jp":"ほかの芸術や文化と**同等には論じられない**","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý so sánh giữa các loại hình nghệ thuật."},{"key":"C","jp":"現実生活と切り離した**純粋なもの**である","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — đây chính là 'ảo tưởng' (幻想) mà bài phủ định."}]},{"huongTuDuy":"②皮肉なこと — nghịch lý giữa người TRONG ngành và NGOÀI ngành âm nhạc.","chotY":"「音楽研究の世界の**外側にいる人**のほうが、音楽を**「純粋」な形で囲い込みたがっている**ように思われるのは②皮肉なことだ」.","lienKetJP":"音楽研究者の意識は変化（音楽＝社会と関わる）→ しかし外側の人ほど「純粋」を求めたがる → ②皮肉","lienKetVI":"Nhà nghiên cứu âm nhạc đã thay đổi nhận thức → nhưng người NGOÀI ngành lại càng muốn giữ âm nhạc 'thuần túy' → nghịch lý","correct":{"jp":"音楽研究者**以外の人**の方が、音楽を**特別なもの**としたがっていること","vi":"Khớp đúng nghịch lý: người ngoài ngành lại cố giữ quan niệm cũ về âm nhạc 'thuần túy/đặc biệt'."},"wrong":[{"key":"A","jp":"音楽研究者以外の人の方が、音楽について、**最先端の議論**を従っていること","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói người ngoài ngành dùng dữ liệu CŨ (30年前の音楽研究), không phải tối tân."},{"key":"C","jp":"音楽研究者以外の人の方が、音楽を**純粋に楽しんでいる**こと","trap":"bẫy chi tiết phụ","vi":"'Thưởng thức thuần túy' khác với 'muốn giữ âm nhạc ở dạng thuần túy' — nhầm sắc thái."},{"key":"D","jp":"音楽研究者以外の人の方が、音楽を**よくわかっている**こと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài chỉ ra người ngoài ngành dùng cách nghĩ LẠC HẬU, không phải hiểu rõ hơn."}]},{"huongTuDuy":"Câu hỏi tổng kết — bám vào câu kết bài về vấn đề 'phát tín' (発信).","chotY":"「われわれの**発信が不足**しているために、その**面白さを十分に伝え切れていない**。そんな気がするのである」.","lienKetJP":"音楽研究の内実は大きく変化 → しかし発信が不足 → 面白さが十分に伝わっていない","lienKetVI":"Nội dung nghiên cứu âm nhạc đã thay đổi nhiều → nhưng việc truyền tải/phát tín còn thiếu → sự thú vị chưa được truyền đạt đầy đủ","correct":{"jp":"音楽研究の**成果**をこれまで以上に**発信**することが求められている","vi":"Khớp trực tiếp với câu kết: 発信が不足、十分に伝え切れていない."},"wrong":[{"key":"A","jp":"音楽の持つ**普遍的な価値**を社会によりわかりやすく伝えることが課題だ","trap":"bẫy chi tiết phụ","vi":"'Giá trị phổ quát' không phải trọng tâm — bài nói về việc truyền tải THÀNH QUẢ nghiên cứu cụ thể."},{"key":"C","jp":"**最先端の音楽研究**について議論していくことが重要である","trap":"bẫy chi tiết phụ","vi":"Không phải về việc 'thảo luận học thuật' mà về việc PHÁT TÍN ra bên ngoài ngành."},{"key":"D","jp":"音楽に対する**意識を変えて**新たな研究に取り組むべきだ","trap":"bẫy ngược nghĩa","vi":"Bài nói rõ ý thức người NGHIÊN CỨU đã thay đổi rồi (意識も変わり) — vấn đề còn lại là truyền tải, không phải thay đổi ý thức."}]}],"Mon10-9":[{"huongTuDuy":"①帰ってきたなあと実感する — tìm khoảnh khắc cụ thể được mô tả ngay trước câu này.","chotY":"「自然の色彩が**非常にやわらかい**ことに毎回あらためて気づかされて、そうして、①帰ってきたなあと実感する」.","lienKetJP":"列車の窓から景色を見る → 自然の色彩がやわらかいと気づく → ①帰ってきたなあと実感する","lienKetVI":"Nhìn cảnh vật qua cửa sổ tàu → nhận ra màu sắc tự nhiên rất mềm mại → cảm nhận 'đã về đến nhà'","correct":{"jp":"日本の**自然の色合い**をあらためて**意識した**とき","vi":"Khớp trực tiếp với 「自然の色彩が非常にやわらかいことに…気づかされて」."},"wrong":[{"key":"A","jp":"都心に向かう列車のなかで**静けさ**を感じたとき","trap":"bẫy chi tiết phụ","vi":"Sự yên tĩnh là mô tả ở đoạn TRƯỚC, không phải nguyên nhân trực tiếp gây cảm giác 'đã về' ở câu ①."},{"key":"C","jp":"日本には**緑が多い**ことにあらためて気づいたとき","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — bài nói về MÀU SẮC mềm mại nói chung, không riêng về 'nhiều cây xanh'."},{"key":"D","jp":"**四季の変化**が感じられるような色に気づいたとき","trap":"bẫy chi tiết phụ","vi":"'Sự thay đổi theo mùa' là chi tiết phụ xuất hiện sau, không phải nguyên nhân trực tiếp của ①."}]},{"huongTuDuy":"Đoạn về phản ứng của tác giả khi đi du lịch NƯỚC NGOÀI — đối lập với cảm nhận khi về nước.","chotY":"「緑の多い町だとか、水墨画みたいだとか、その程度の**感想は抱くが**、その**色彩について特別何も思わない**」.","lienKetJP":"外国の自然＝緑のなかを歩く、見とれることもある → しかし色彩については特別何も思わない","lienKetVI":"Tự nhiên nước ngoài: đi giữa cây xanh, có lúc say mê ngắm → nhưng KHÔNG có ấn tượng đặc biệt về màu sắc lúc đó","correct":{"jp":"景色にひかれることはあるが、**色彩に特別な印象は持たない**","vi":"Khớp trực tiếp với 「色彩について特別何も思わない」 — chỉ có ấn tượng về cảnh, không phải về màu sắc."},"wrong":[{"key":"A","jp":"色彩の**多様さに驚く**ことはあるが、特別よいとは感じない","trap":"bẫy chi tiết phụ","vi":"Bài không nói về 'ngạc nhiên trước sự đa dạng màu sắc' — nói về việc KHÔNG chú ý đến màu sắc."},{"key":"B","jp":"色彩が**強烈だと思う**ことはあるが、見とれることはあまりない","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — cảm nhận 'màu sắc mạnh mẽ' chỉ xuất hiện SAU KHI về nước, không phải lúc đang ở nước ngoài."},{"key":"D","jp":"懐かしい景色だと思うことはあるが、色彩が**やわらかい**とは思わない","trap":"bẫy chi tiết phụ","vi":"'Cảnh hoài niệm' không có trong bài — và 'mềm mại' là từ chỉ dùng cho Nhật Bản, không liên quan câu hỏi này."}]},{"huongTuDuy":"Cảm nhận về phong cảnh đô thị khi về nước — cần phân biệt 'thích/ghét' với cảm giác 'gần gũi'.","chotY":"「**好きとか嫌いではなくて**、**私に含まれているかのような近しさ**を覚えるのだ」.","lienKetJP":"都心の風景をきれいだと思ったことはない → でも帰ってくると毎回近しく思う → 自分に含まれているような近しさ","lienKetVI":"Chưa từng thấy phong cảnh đô thị đẹp → nhưng mỗi lần về vẫn thấy gần gũi → cảm giác như một phần của bản thân","correct":{"jp":"**自分の一部**であるような**親しみ**を感じる","vi":"Khớp trực tiếp với 「私に含まれているかのような近しさ」 — không phải vì thích, mà vì cảm giác thuộc về bản thân."},"wrong":[{"key":"B","jp":"自分を**受け入れてくれる優しさ**を感じる","trap":"bẫy mọi người","vi":"Tự thêm ý 'sự ân cần được chấp nhận' — không có trong bài."},{"key":"C","jp":"自分の**好みに合っている**場所だと感じる","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — bài nói rõ KHÔNG phải vì 'thích' (好きとか嫌いではなくて)."},{"key":"D","jp":"自分の**ふだんの生活**に戻ったように感じる","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng thiếu sắc thái cốt lõi 'một phần của bản thân' — đây là ý ở đoạn KHÁC (câu kết bài)."}]},{"huongTuDuy":"Câu hỏi tổng kết quan điểm về 'du lịch' — bám vào câu kết bài, và đối chiếu với trải nghiệm đi đón người khác.","chotY":"「旅というのは…**周囲の景色が**、わざわざ目を凝らすこともない**日常に戻ったときに終わる**のだと知った」.","lienKetJP":"空港に着いたときには終わらない → 景色が日常に戻ったとき → そこで旅は終わる","lienKetVI":"Không kết thúc khi đến sân bay → mà khi cảnh vật trở lại thành đời thường quen thuộc → lúc đó du lịch mới thực sự kết thúc","correct":{"jp":"旅は、**見慣れた風景**が再び**ありふれた日常**になるまで続いている","vi":"Khớp trực tiếp với câu kết: du lịch tiếp diễn cho đến khi cảnh quen thuộc trở lại thành đời thường."},"wrong":[{"key":"A","jp":"旅は、**慣れ親しんだ景色のよさ**を**再確認**させてくれる","trap":"bẫy chi tiết phụ","vi":"Không phải trọng tâm — bài tập trung vào THỜI ĐIỂM kết thúc của du lịch, không phải tác dụng của nó."},{"key":"B","jp":"旅は、見慣れた風景に**新しい何かを発見する**ことを可能にする","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — câu chuyện người được đón ở cuối bài cho thấy điều NGƯỢC LẠI: cảnh quen thuộc bị nhìn như 'tẻ nhạt' chứ không phải khám phá mới."},{"key":"C","jp":"旅は、旅先と慣れ親しんだ景色の**違いに気づいたとき終わる**","trap":"bẫy chi tiết phụ","vi":"Gần đúng nhưng sai chi tiết — kết thúc không phải lúc NHẬN RA sự khác biệt, mà lúc cảnh đã THỰC SỰ trở thành đời thường."}]}],"Mon10-10":[{"huongTuDuy":"Vấn đề trẻ con không tiếc tranh bị vứt — bám đoạn mô tả về bản chất hành vi vẽ của trẻ.","chotY":"「問題は自分のなかにあるものを**外に突き出す、投げ出すという行為自体**であって、決して出来上がりの効果ではない」— hành vi tự thể hiện đã hoàn tất, mong muốn vẽ đã được thỏa mãn.","lienKetJP":"魂の衝動は強い → だから子供は描きたがる → 突き出す行為自体が目的（効果ではない）→ 描きおわったらふり向きもしない","lienKetVI":"Xung động tâm hồn mạnh mẽ → nên trẻ muốn vẽ → mục đích là hành vi 'tự thể hiện' chứ không phải kết quả → vẽ xong là không ngoái nhìn lại","correct":{"jp":"描きたいという**欲求が満たされた**から","vi":"Khớp đúng bản chất: hành vi vẽ (突き出す行為自体) đã hoàn thành mục đích, không cần giữ lại sản phẩm."},"wrong":[{"key":"A","jp":"いつでも**描きたいものが描ける**から","trap":"bẫy chi tiết phụ","vi":"Không phải lý do — bài không nói về khả năng vẽ lại bất cứ lúc nào."},{"key":"B","jp":"描きたいものが描けて**納得した**から","trap":"bẫy chi tiết phụ","vi":"'Hài lòng' nhẹ hơn và khác bản chất 'nhu cầu/xung động được giải tỏa' mà bài nhấn mạnh."},{"key":"D","jp":"**最後まで描けた**ことに満足しているから","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — vấn đề không phải 'vẽ xong hoàn chỉnh' mà là hành vi giải tỏa xung động."}]},{"huongTuDuy":"Lý do tranh trẻ con không phải 'tác phẩm' — đối lập với định nghĩa 'tác phẩm' của người lớn.","chotY":"「大人のは見せる芸であり、商品である。**はじめから観賞すること、してもらうことを目的**とし」— tác phẩm người lớn có MỤC ĐÍCH được thưởng thức, còn tranh trẻ con thì không.","lienKetJP":"子供の絵＝「作品」ではない → なぜなら観賞される目的で描かれていないから → 大人の絵＝はじめから観賞目的で作られる","lienKetVI":"Tranh trẻ con KHÔNG phải 'tác phẩm' → vì không được vẽ với mục đích được thưởng thức → tranh người lớn thì NGAY TỪ ĐẦU đã nhằm mục đích đó","correct":{"jp":"**観賞されることを目的として**描かれていないから","vi":"Khớp đúng với phép đối lập: tranh người lớn 'observation目的' (はじめから観賞すること目的), tranh trẻ con thì không."},"wrong":[{"key":"A","jp":"大人ほどの**表現力や情熱**をもって描かれていないから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài khẳng định 魂の衝動は強い (xung động tâm hồn trẻ con MẠNH), không phải yếu hơn người lớn."},{"key":"C","jp":"**評価に値する出来上り**になっていないから","trap":"bẫy chi tiết phụ","vi":"Không phải vấn đề chất lượng tác phẩm — bài nói về MỤC ĐÍCH sáng tác, không phải kết quả."},{"key":"D","jp":"描いた本人が**価値を認めていない**から","trap":"bẫy chi tiết phụ","vi":"Gần đúng về hiện tượng nhưng sai về NGUYÊN NHÂN — bản chất là thiếu mục đích 'để được thưởng thức', không phải tự bản thân trẻ phủ định giá trị."}]},{"huongTuDuy":"Về '絵描きさん' (họa sĩ chuyên nghiệp) — cần tìm động cơ thực sự đằng sau hành động vẽ của họ.","chotY":"「評判をとり、**買手がついてくれなければ食ってゆけない**し、社会が許さない。生活はきびしいのだ」「明らかに「作品」つまり「**商品**」を作っているのである」.","lienKetJP":"絵描きさんは結果を予測しながら作る → 大向こうの気配を見すかす → 買手がつくように描く（＝商品を作っている）","lienKetVI":"Họa sĩ vừa vẽ vừa dự đoán trước kết quả → để ý phản ứng người xem → vẽ sao cho có người mua (= đang tạo ra hàng hóa)","correct":{"jp":"**買ってもらえるように**描いている","vi":"Khớp trực tiếp với 「買手がついてくれなければ食ってゆけない」「商品を作っている」."},"wrong":[{"key":"A","jp":"**かんぺきな出来ばえ**を求めている","trap":"bẫy chi tiết phụ","vi":"Không phải trọng tâm — bài nói về động cơ THƯƠNG MẠI (bán được), không phải sự hoàn hảo kỹ thuật."},{"key":"B","jp":"いつも**同じような描き方**をしている","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý 'phong cách lặp lại'."},{"key":"C","jp":"**買い手の要望どおり**に描いている","trap":"bẫy chi tiết phụ","vi":"Hơi quá — bài nói họ NGẦM dự đoán phản ứng người xem (見すかして), không hẳn là vẽ THEO YÊU CẦU trực tiếp của người mua."}]},{"huongTuDuy":"Câu hỏi tổng kết quan điểm tác giả về nghệ thuật — phải bám vào câu KẾT CUỐI CÙNG, nơi tác giả phủ định việc quan tâm đánh giá từ người khác.","chotY":"「自分の存在を**純粋に外に投げ出す**、突き出すアクションの**質、強さ**によって、猛烈な魅力になる」+ kết: 「出来るかぎり**他の評価を無視したい**」— cốt lõi là hành động do XUNG ĐỘNG/ĐAM MÊ thúc đẩy, không phải sức hút kết quả.","lienKetJP":"魂の衝動は強い（子供も大人も共通）→ 自分の存在を純粋に投げ出すアクション → 他の評価を無視したい（結果ではなく行為自体が本質）","lienKetVI":"Xung động tâm hồn mạnh mẽ (chung cho cả trẻ con và người lớn) → hành động tự thể hiện thuần khiết bản thân → muốn phớt lờ đánh giá người khác (cốt lõi là HÀNH ĐỘNG, không phải kết quả)","correct":{"jp":"**情熱**に**突き動かされて**作るもの","vi":"Khớp đúng tinh thần xuyên suốt: nghệ thuật bắt nguồn từ xung động/đam mê (魂の衝動、情熱), không phải mong muốn gây ấn tượng."},"wrong":[{"key":"A","jp":"人を**引きつける魅力的な**もの","trap":"bẫy chi tiết phụ","vi":"Đây chỉ là HỆ QUẢ phụ (猛烈な魅力になる) ở đoạn giữa, nhưng câu kết bài lại phủ định việc quan tâm đến sức hút/đánh giá từ người khác."},{"key":"C","jp":"**他人には理解できない**ようなもの","trap":"bẫy chi tiết phụ","vi":"Có nhắc thoáng qua (わけがわからないと言われる) nhưng không phải định nghĩa cốt lõi về nghệ thuật."},{"key":"D","jp":"人間の**生命力を巧みに表現**するもの","trap":"bẫy chi tiết phụ","vi":"'Khéo léo biểu hiện' (巧み) sai sắc thái — bài nhấn mạnh tính THUẦN KHIẾT, BỘC PHÁT (純粋に) chứ không phải sự khéo léo có tính toán."}]}],"Mon10-11":[{"huongTuDuy":"①そのようにして作った — chỉ thị từ về CÁCH sáng tác đã mô tả ở câu ngay trước.","chotY":"「単に、**感覚に頼って**、**直観的に**「これが好い」と納得できる音の連なりを探し続ける」— chọn âm hoàn toàn theo cảm giác/trực giác, không theo lý luận.","lienKetJP":"言葉で説明できる方法論はない → 感覚に頼って直観的に音を探す → ①そのようにして作った曲","lienKetVI":"Không có phương pháp luận giải thích bằng lời được → dựa vào cảm giác, trực giác để tìm âm thanh → '①cách đã tạo ra' bản nhạc","correct":{"jp":"音の連なりを**理屈ではなく感覚的**に選んで作った","vi":"Khớp trực tiếp với 「感覚に頼って、直観的に」 — đối lập rõ với lý luận/lý thuyết."},"wrong":[{"key":"A","jp":"曲全体の**出来上がりをイメージ**しながら作った","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — tác giả nói rõ KHÔNG biết bản nhạc sẽ ra sao (①そのようにして作った曲が何であるかについてもよく分からない)."},{"key":"B","jp":"曲の**終わりを意識**して納得できる音を探しながら作った","trap":"bẫy chi tiết phụ","vi":"Nhầm 2 yếu tố riêng biệt — 'cảm nhận đoạn kết' và 'chọn âm theo cảm giác' là 2 ý khác nhau trong bài, câu hỏi chỉ hỏi về cách CHỌN ÂM."},{"key":"C","jp":"**美しいとされている**音の連なりを組み合わせて作った","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — '美しいとされている' (được công nhận là đẹp) là tiêu chuẩn khách quan/xã hội, trái với '感覚的・直観的' (chủ quan, cá nhân) mà bài mô tả."}]},{"huongTuDuy":"Ví dụ bình hoa thủy tinh dùng để minh họa cho luận điểm nào — đọc câu kết đoạn ngay sau ví dụ.","chotY":"「ガラスのことも、そして、花瓶というものがどのようなものかも知らなければ、ガラスの花瓶を**作ることはできない**」+「作曲をするからには、作曲者は、当然、それらについて**一応知っている**」.","lienKetJP":"自分の作曲について本当に何も知らないわけではない → ガラスの花瓶の例 → 知識なしに物を作ることは不可能","lienKetVI":"Không phải hoàn toàn không biết gì về sáng tác của mình → ví dụ bình hoa thủy tinh → không thể sáng tạo nếu không có kiến thức nền tảng","correct":{"jp":"作曲家は**何の知識もなく**曲を作ることは**できない**こと","vi":"Khớp đúng vai trò minh họa của ví dụ: không có kiến thức cơ bản thì không thể sáng tạo."},"wrong":[{"key":"A","jp":"音楽の**素材として適している音**があること","trap":"bẫy chi tiết phụ","vi":"Sai trọng tâm — ví dụ không nói về việc CHỌN âm thanh phù hợp, mà về sự CẦN THIẾT của kiến thức nền."},{"key":"B","jp":"作曲家はどのような**仕事をしなければならない**かということ","trap":"bẫy mọi người","vi":"Quá chung chung, không khớp với nội dung cụ thể của ví dụ bình hoa."},{"key":"D","jp":"自身の作曲について知らなければ**いい曲はできない**こと","trap":"bẫy chi tiết phụ","vi":"Sai mức độ — bài nói về điều kiện CẦN để sáng tác ĐƯỢC (可能/不可能), không phải về chất lượng 'hay/dở' của bản nhạc."}]},{"huongTuDuy":"Câu hỏi về nhạc của những nhà soạn nhạc TIÊN PHONG — đối lập với nhà soạn nhạc 'bảo thủ'.","chotY":"「前衛主義に代表されるような、新たな音楽の可能性を求める作曲家達は、自らが出発点とした伝統における「基本的な」知識の**外に踏み出そう**とする」「**伝統に由来する**「基本的な」知識が告げる音楽というもののイメージから**逸脱**した未知のもの」.","lienKetJP":"基本的な知識を前提とする（共通） → 保守的：その範囲内で作曲 ／ 前衛的：知識の外に踏み出す → 伝統的イメージから逸脱した実験的な音楽","lienKetVI":"Đều dựa trên kiến thức cơ bản (điểm chung) → bảo thủ: sáng tác trong phạm vi đó / tiên phong: bước ra ngoài phạm vi → âm nhạc thực nghiệm thoát khỏi hình ảnh truyền thống","correct":{"jp":"**伝統的なイメージから離れた実験的**な音楽","vi":"Khớp trực tiếp với 「伝統から踏み出し」「逸脱した未知のもの」「実験的な性質を帯びる」."},"wrong":[{"key":"B","jp":"「基本的な」**知識を知らずに**作った未知の音楽","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài khẳng định MỌI sáng tác đều cần kiến thức cơ bản làm tiền đề (必ず、何らかの伝統における基本的な知識を前提)."},{"key":"C","jp":"「基本的な」**知識を元にして**作った新しい音楽","trap":"bẫy chi tiết phụ","vi":"Thiếu yếu tố cốt lõi 'thoát ra ngoài/逸脱' — đây mô tả gần với nhà soạn nhạc BẢO THỦ hơn."},{"key":"D","jp":"**非伝統的だが「保守的な」イメージを失わない**音楽","trap":"bẫy ngược nghĩa","vi":"Mâu thuẫn nội tại và ngược nghĩa — nhạc tiên phong chính là loại THOÁT KHỎI hình ảnh truyền thống/bảo thủ."}]},{"huongTuDuy":"Câu hỏi tổng kết — bám vào câu kết bài về điều tác giả có thể nói về sáng tác của chính mình.","chotY":"「自らが行った**実験的な試みの結果**として産み出された音楽についての**吟味**であり、言い換えれば、自分が行ったこととその結果についての**自分自身による解釈**なのである」.","lienKetJP":"作曲についてよく知っているわけではない → 語り得ることは → 自らの試みの結果の吟味＋自分自身による解釈","lienKetVI":"Không hẳn hiểu rõ về việc sáng tác của mình → điều có thể nói được là → đánh giá kết quả thử nghiệm của bản thân + tự diễn giải về điều mình đã làm","correct":{"jp":"**自身の試み**と、**曲についての解釈**","vi":"Khớp trực tiếp với 「実験的な試みの結果…についての吟味」「自分自身による解釈」."},"wrong":[{"key":"A","jp":"**自身の曲の意義と価値**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ Ý NGHĨA/GIÁ TRỊ của bản nhạc thì KHÔNG THỂ biết được (それがどのような意義と価値をもつ音楽なのかは、分らない)."},{"key":"B","jp":"**自身の方法論**についての解釈","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — ngay đầu bài tác giả nói KHÔNG CÓ phương pháp luận có thể giải thích bằng lời (組織的な方法論はない)."},{"key":"D","jp":"自身の**作曲過程**と、**実験的音楽の可能性**","trap":"bẫy chi tiết phụ","vi":"'Khả năng của âm nhạc thực nghiệm' là chủ đề chung của bài, không phải điều tác giả nói riêng về CHÍNH MÌNH."}]}],"Mon10-12":[{"huongTuDuy":"Điểm chung giữa sử học và khoa học tự nhiên — câu mở bài nêu rõ ngay từ đầu.","chotY":"「この史料的根拠を基盤とするがゆえに、歴史学者の歴史観は、相互に**批判可能**なもの」「その論拠、論理を**他の学者にも検証可能な形で提示**しなければならない」.","lienKetJP":"歴史学＝史料的根拠が必要 → 相互に批判可能 → 自然科学も同様：論拠を他の学者に検証可能な形で提示","lienKetVI":"Sử học cần căn cứ tư liệu → có thể bị phê bình lẫn nhau → khoa học tự nhiên cũng vậy: cần trình bày luận cứ để học giả khác kiểm chứng được","correct":{"jp":"**他の学者**が**検証できる**ように、新説の**根拠を示す**必要があること","vi":"Khớp trực tiếp với 「他の学者にも検証可能な形で提示しなければならない」."},"wrong":[{"key":"A","jp":"研究の価値は**新説を示すことで認められる**こと","trap":"bẫy mọi người","vi":"Không phải điểm chung được nêu — bài nói về tính kiểm chứng được, không phải tiêu chuẩn đánh giá giá trị nghiên cứu."},{"key":"B","jp":"新説の展開には、**学者同士の相互批判**が欠かせないこと","trap":"bẫy chi tiết phụ","vi":"'Phê bình lẫn nhau' là KẾT QUẢ của việc có căn cứ kiểm chứng được, không phải bản thân điểm chung cốt lõi."},{"key":"C","jp":"新説の根拠を検証可能な形で検証するのは**容易ではない**こと","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không nói về độ khó, mà nói đây là YÊU CẦU bắt buộc phải làm được."}]},{"huongTuDuy":"Lý do chuyên gia thiên văn ít phát hiện sao chổi mới — câu trả lời của thầy giáo thiên văn học.","chotY":"「天文学の先端では、彗星などの**発見よりは**、大きな電波望遠鏡を使って…**宇宙の大きさを推測**したり、**宇宙の成り立ちを究明**したりしている」.","lienKetJP":"アマチュアの天文家＝彗星などの新天体発見が多い → なぜなら専門研究者は → 宇宙全体の構造・成り立ちの探求を目的としているから","lienKetVI":"Nhà thiên văn nghiệp dư hay phát hiện thiên thể mới → vì các chuyên gia → hướng đến mục tiêu lớn hơn: tìm hiểu cấu trúc/nguồn gốc cả vũ trụ","correct":{"jp":"専門研究者は、新天体の発見より**宇宙そのものの探究**を目的としているから","vi":"Khớp trực tiếp với 「彗星などの発見よりは…宇宙の成り立ちを究明したりしている」."},"wrong":[{"key":"A","jp":"専門研究者は、新天体の発見には**価値がない**と考えているから","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài không phủ định giá trị phát hiện thiên thể mới, chỉ nói chuyên gia hướng đến mục tiêu KHÁC lớn hơn."},{"key":"C","jp":"専門研究者は、アマチュアの天文家との**役割分担**を意識しているから","trap":"bẫy mọi người","vi":"'Ý thức phân chia vai trò' không có trong bài — tự thêm vào, không phải lý do được nêu."},{"key":"D","jp":"専門研究者は、アマチュアの天文家の発見を**集約**して宇宙全体を研究しているから","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý 'tổng hợp phát hiện của người nghiệp dư'."}]},{"huongTuDuy":"Đặc điểm tiểu thuyết lịch sử — đối lập với nghiên cứu sử học ở câu liền sau phép so sánh với thiên văn.","chotY":"「歴史小説では、**誰もがよく知っている人物や事件**をとりあげて小説にすることが多い」.","lienKetJP":"歴史小説家＝アマチュアではないが立ち位置が違う → 誰もがよく知っている人物・事件を題材にする（対：歴史学は誰も知らない人物・事件から）","lienKetVI":"Nhà văn lịch sử không phải nghiệp dư nhưng lập trường khác → lấy người/sự kiện NỔI TIẾNG làm đề tài (đối lập: sử học lấy người/sự kiện ÍT AI BIẾT)","correct":{"jp":"**有名な人物や出来事**などを**題材**としている","vi":"Khớp trực tiếp với 「誰もがよく知っている人物や事件をとりあげて」."},"wrong":[{"key":"A","jp":"**制度的な政治システム**を題材としている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — đây là đặc điểm của NGHIÊN CỨU SỬ HỌC (chứ không phải tiểu thuyết lịch sử), bài nói rõ tiểu thuyết thiên về nhân vật/sự kiện nổi tiếng hơn."},{"key":"B","jp":"**誰も知らない史実**を面白く物語にしている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa hoàn toàn — bài nói tiểu thuyết lấy người/sự kiện NỔI TIẾNG, còn 'sự kiện ít ai biết' mới là đặc trưng của sử học."},{"key":"D","jp":"**歴史学者が気づかないような視点**で書いている","trap":"bẫy mọi người","vi":"Không có trong bài — tự thêm ý so sánh về góc nhìn độc đáo."}]},{"huongTuDuy":"Đặc điểm các nhà sử học — bám vào đoạn cuối bài về phương pháp nghiên cứu.","chotY":"「一見**地味な事例研究を積み重ねる**ことによって、それまでの**通説を修正**する新しい視点が見いだされていく」.","lienKetJP":"歴史学者もメジャートピックに無関心ではない → しかし地味な事例研究の積み重ねが重要 → それによって通説を修正","lienKetVI":"Nhà sử học không hẳn thờ ơ với chủ đề lớn → nhưng quan trọng là tích lũy nghiên cứu case nhỏ → từ đó sửa đổi học thuyết cũ","correct":{"jp":"**個々の事例研究**を踏まえて、**史実を明らかにしよう**としている","vi":"Khớp trực tiếp với 「地味な事例研究を積み重ねる…見いだされていく」."},"wrong":[{"key":"A","jp":"**通説を覆すため**に、新しい史実を**発見しようとしている**","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa — bài nói rõ KHÔNG NÊN làm theo kiểu 'một bước nhảy vọt lật đổ học thuyết' (一足飛びに通説を覆そうとする…禁物)."},{"key":"B","jp":"通説に惑わされず、**特定の視点**から歴史をとらえようとしている","trap":"bẫy ngược nghĩa","vi":"Ngược nghĩa trực tiếp — bài cảnh báo KHÔNG ĐƯỢC đọc sử liệu từ một góc nhìn đặc định cố định (特定の視点から史料を読むような真似は禁物)."},{"key":"D","jp":"知られていない史実をとりあげ、**人々の歴史認識を改めよう**としている","trap":"bẫy chi tiết phụ","vi":"Quá to tát — bài không nói về mục tiêu 'thay đổi nhận thức lịch sử của công chúng', mà về phương pháp nghiên cứu tích lũy từng bước."}]}],"Mon10-13":[{"huongTuDuy":"Câu hỏi so sánh 2 loại xử lý thông tin — bài mở bằng đối lập rõ ràng giữa 知覚
