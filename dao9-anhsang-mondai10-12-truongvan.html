がいつも丁寧にやり方を教えてくれること。","上司にいわれたことを行うのが仕事だと思っていること。"],"answer":3,"explain":"Đáp án đúng: D. Nghĩ rằng làm những gì cấp trên nói là công việc của mình."},{"q":"指示待ちになっている部下や後輩の対応のしかたについて、AとBはどのように述べているか","options":["AもBも、自分なりのやり方を考えて提案させるといいと述べている。","AもBも、仕事の目的を伝え、やるべきことを一緒に考えるといいと述べている。","Aは仕事の目的と全体像を理解させるといいと述べ、Bは自分でできそうなことはまず一人で考えさせるといいと述べている。","Aはほかの仕事とのかかわりを教えるといいと述べ、Bはやり方がすでに分かっている仕事を与え自分自身でやらせるといいと述べている。"],"answer":2,"explain":"Đáp án đúng: C. A nói rằng nên giúp họ hiểu mục đích và bức tranh toàn cảnh của công việc, B nói rằng nên để họ tự mình suy nghĩ về những gì họ có thể làm."}],"trans":"A Có những cấp dưới hoặc đàn em mà người ta nói là chỉ biết chờ lệnh, “không tự động làm gì nếu không được ra lệnh” hoặc “chỉ làm những gì được ra lệnh”. Người ta nói rằng nguyên nhân của việc chờ lệnh là do thiếu kiến thức và kinh nghiệm về công việc hoặc thiếu động lực làm việc. Nhưng thực tế, trong nhiều trường hợp, họ chỉ đơn giản nghĩ rằng tuân theo lệnh của cấp trên là nhiệm vụ của mình và không cảm thấy cần thiết phải làm gì hơn thế. Điều quan trọng là phải dạy cho những cấp dưới như vậy biết công việc này được thực hiện để làm gì và nó liên quan như thế nào đến các công việc khác trong toàn bộ hoạt động kinh doanh. Nếu họ có thể hình dung được bức tranh toàn cảnh của công việc, họ sẽ hiểu những gì họ nên làm tiếp theo và những điểm mà họ có thể cải thiện. Kết quả là, họ sẽ nhận ra những gì được mong đợi ở mình và có thể hành động một cách độc lập.\n\nB\n\nSẽ là vấn đề nếu bạn dễ dàng quy trách nhiệm cho cấp dưới của mình vì họ chỉ biết chờ lệnh. Có thể có một số lý do tại sao họ lại như vậy. Trước hết, có những trường hợp mà bản thân cấp dưới không nhận thức được tầm quan trọng của việc hành động độc lập. Có những trường hợp họ tin rằng “làm theo những gì được nói là công việc của cấp dưới” và thậm chí tin rằng việc tham khảo ý kiến “tôi nên làm gì” là nhiệm vụ của cấp dưới. Trong trường hợp này, cần phải bắt đầu bằng cách truyền đạt rằng không phải công việc nào cũng có thể được hướng dẫn hoàn toàn bằng sách hướng dẫn và cần có sự phán đoán và cải tiến cá nhân. (lược bỏ) Khi họ hỏi “tôi nên làm gì với việc này”, hãy xem liệu bản thân cấp dưới có thể nghĩ ra biện pháp đối phó hay không và yêu cầu họ “hãy thử nghĩ ra một phương án của riêng bạn”. Nếu cấp trên luôn hành xử như vậy, cấp dưới sẽ bắt đầu đưa ra “tham vấn kiểu đề xuất” theo ý muốn của cấp trên."},{"source":"Mon13","bai":1,"date":"07/2010","title":"Mon13 - Bài 1 (07/2010)","passage":"","note":"✅ Đáp án đã đối chiếu với đáp án chính thức. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"高木さんが制作した以下の作品のうち、応募できるものはどれか。","options":["清森高校に通っていたとき入賞した秋の風景画","清森市にある清森温泉の紅葉の油絵とイラスト","清森市にある清森公園で撮った春の木々の写真","去年清森市で行われた秋祭りの写真と水彩画"],"answer":3,"explain":"Đáp án đúng: D. Mỗi bộ môn chỉ 1 tác phẩm, đề tài phải là mùa thu ở thành phố Kiyomori và chưa từng công bố/đoạt giải. ① đã đoạt giải; ② 2 tác phẩm cùng bộ môn tranh; ③ là mùa xuân; ④ 1 ảnh (bộ môn ảnh) + 1 tranh màu nước (bộ môn tranh) nên hợp lệ."},{"q":"入賞したかどうかを知るには、高木さんはどうしたらよいか。","options":["1月中旬に清森市のホームページを見る。","1月中旬に直接、観光係に電話して聞く。","2月下旬に市役所の窓口に問い合わせる。","2月下旬に届く予定の通知を待つ。"],"answer":0,"explain":"Đáp án đúng: A. Kết quả đăng trên website của thành phố vào 15/1. Không trả lời điện thoại hay tại quầy; người trúng giải được gửi thư trong tháng 1 (không phải cuối tháng 2)."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">清森市　秋の美術コンクール<br>作品募集</div><table class=\"m13-t m13-kv\"><tr><th>部門</th><td>絵画部門、写真部門</td></tr><tr><th>募集期間</th><td>2010年11月1日～11月30日</td></tr><tr><th>審査員</th><td>山田太郎（日本アート協会会長）、山本花子（画家）、川上次郎（写真家）</td></tr><tr><th>応募規定</th><td>1. 清森市内の秋を題材にしたもの。<br>2. 絵画部門に出品する作品は、イラスト、水彩画、油絵、どれでも可。<br>　写真部門に出品する写真は、フィルム写真、デジタル写真、どちらも可。<br>※応募作品は各部門1人1点に限ります。<br>※作品の制作年は問わないが、未発表のものに限ります。<br>（他のコンクールに入賞していたり、出版物や展示会などで公表されたりしていないものであること。）</td></tr><tr><th>応募方法</th><td>郵送、または持参。ただし郵送中の事故について、市は責任を負いません。<br>指定の応募用紙を作品裏側に添付のこと。<br>応募用紙は市役所の窓口で、または市のホームページ（http://www.kiyomari-shi.jp）から入手可能。</td></tr><tr><th>応募先</th><td>清森市商業観光課観光係<br>（〒951-0022　清森市清森2-8、TEL：084-874-8524）</td></tr></table><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>賞</th><th>点数</th><th>内容</th></tr></thead><tbody><tr><td>最優秀賞</td><td>各部門1点</td><td>賞状と副賞（デジタル一眼レフカメラ）</td></tr><tr><td>優秀賞</td><td>各部門2点</td><td>賞状と副賞（清森ホテルのペア宿泊券）</td></tr><tr><td>清森賞</td><td>各部門20点以内</td><td>賞状と副賞（図書カード5千円分）</td></tr></tbody></table></div><table class=\"m13-t m13-kv\"><tr><th>審査結果</th><td>清森市のホームページ上に1月15日に発表します。入賞者には1月中に結果を郵送します。電話および窓口での問い合わせには応じられません。</td></tr><tr><th>表彰式</th><td>2011年2月下旬（予定）最優秀賞と優秀賞の方には、表彰式で賞状および副賞をお渡しします。</td></tr><tr><th>注意事項</th><td>※入賞作品は1年を限度に主催者がお預かりして広報活動などに使用し、1年後にお返しします。<br>※上記の応募規定を守っていなかった場合には入賞が取り消されることがあります。</td></tr></table><p>（主催）清森市　（協賛）昭和デザイン株式会社、山手百貨店、新東京鉄道、清森ホテル</p></div>"},{"source":"Mon13","bai":2,"date":"12/2010","title":"Mon13 - Bài 2 (12/2010)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"日本の大学・大学院に在学している次の学生のうち、この奨学金に応募できるのは誰か。","options":["ソムシリーさん","ワンさん","アフマドさん","ジョンさん"],"answer":1,"explain":"Đáp án đúng: B. Điều kiện: cao học ngành khoa học/kỹ thuật/nông học, GPA từ 2.8, không nhận học bổng khác năm 2011. Wan (nông học, 2.9, không nhận học bổng khác) đạt; Somsiri sẽ nhận học bổng khác, Ahmad học luật, John mới là sinh viên đại học."},{"q":"キムさんは、2010年4月現在、日本の大学院の修士課程2年生で農学を専攻している。2011年度には博士課程に進学予定である。キムさんが、この奨学金に応募する場合、応募時に必ずしなければならないのは、次のどれか。","options":["ホームページから研究計画書の様式をダウンロードする。","博士課程進学が決定していることを証明する書類をもらう。","出身大学の指導教授の推薦書を取り寄せる。","応募書類を大学院の事務所に提出する。"],"answer":3,"explain":"Đáp án đúng: D. Phải nộp thông qua trường cao học đang theo học (không nộp trực tiếp). Kế hoạch nghiên cứu mẫu tự do; thư tiến cử là của giáo sư hướng dẫn tại trường đang học, không phải trường cũ."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">財団法人　日本留学生奨学財団<br>2011年度　外国人留学生奨学金募集要項</div><p>1. 募集人員　30名</p><p>2. 奨学金の支給額・支給方法など</p><ul><li>① 支給額　大学院修士課程（博士前期課程）月額100,000円<br>　　　　　　大学院博士課程（博士後期課程）月額120,000円</li><li>② 支給期間　在籍する大学院の正規の修学期間で、最長3年間</li><li>③ 支給方法　毎月一回決まった日に、受給者本人名義の銀行口座に直接振り込む</li></ul><p>3. 応募資格</p><ul><li>① 国籍・ビザについて<br>日本以外の国籍を有し、勉強または研究のための在留資格（例えば留学）で、日本に入国した者</li><li>② 対象<br>・日本国内の大学院で、理学、工学、農学の分野を専攻している者<br>・2010年4月時点で、修士課程の1年次、博士課程の1年次か2年次に在籍している者、または修士課程の2年次で、2011年4月に博士課程進学を予定している者<br>・2009年度の大学院での成績が2.8以上（満点3.0）で、心身ともに健康な者<br>・2011年度に、それぞれの政府、日本政府、他の奨学金支給を受けない者</li></ul><p>4. 応募方法</p><ul><li>① 提出書類（指定のものは当財団ホームページからダウンロードして使用すること）<br>・2011年度日本留学生奨学財団奨学生応募用紙（指定のもの）<br>・在学証明書と2009年度の成績が分かる成績証明書<br>・在籍大学院の指導教授からの推薦書<br>・研究計画書（3000字以内）、書式は自由</li><li>② 応募締め切り<br>2010年7月31日必着<br>なお、申請者が直接応募するのではなく、必ず所属の大学院を通じて応募すること</li></ul><p>5. 選考方法<br>応募書類、面接を総合的に判断して決定する</p><p>6. 決定通知<br>2010年9月10日までに所属の大学院を通じ、書面で通知する</p><p>7. 問い合わせ先<br>日本留学生奨学財団　http://www.ryugaku.or.jp/</p><div class=\"m13-sec\">▶ 問1の表</div><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>名前</th><th>国籍</th><th>2010年4月時点の在籍年次</th><th>専攻</th><th>成績</th><th>2011年度他の奨学金の受給予定の有無</th></tr></thead><tbody><tr><td>ソムシリー</td><td>タイ</td><td>修士1年</td><td>電子工学</td><td>3.0</td><td>有</td></tr><tr><td>ワン</td><td>中国</td><td>博士2年</td><td>農学</td><td>2.9</td><td>無</td></tr><tr><td>アフマド</td><td>エジプト</td><td>修士1年</td><td>法学</td><td>2.8</td><td>有</td></tr><tr><td>ジョン</td><td>アメリカ</td><td>学部4年</td><td>理学</td><td>3.0</td><td>無</td></tr></tbody></table></div></div>"},{"source":"Mon13","bai":3,"date":"07/2011","title":"Mon13 - Bài 3 (07/2011)","passage":"","note":"✅ Đáp án đã đối chiếu với đáp án chính thức. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"留学生のリーさんは、毎週3回ぐらい店でアルバイトをしたいと考えている。リーさんは平日の午後3時から9時までの間しか働けないが、同じ時間仕事をした場合、一番給料が多いのはどの仕事か。","options":["中国料理店スタッフ","日本そば屋スタッフ","居酒屋スタッフ","コンビニ店員"],"answer":1,"explain":"Đáp án đúng: B. Làm được 15:00–21:00 các ngày thường. Quán Trung Hoa làm 10–14h nên không hợp; quán nhậu bắt buộc 1 buổi đến 23:00 (và từ 20 tuổi); quán soba (900 yên, 10–21h, giờ thương lượng) cao hơn cửa hàng tiện lợi (800 yên)."},{"q":"大学生の山田さんは夏休みの旅行の費用が少し足りないので、7月に1日か2日だけアルバイトをしたいと考えている。山田さんが応募できる仕事はいくつあるか。","options":["1つ","2つ","3つ","4つ"],"answer":2,"explain":"Đáp án đúng: C. Phù hợp với 1–2 ngày trong tháng 7: ⑦ (từ 2 ngày trở lên trong tháng 7), ⑧ (chỉ 1 ngày cũng được), ⑨ (ngày 25/7, sinh viên đại học). Các việc khác đều yêu cầu làm lâu dài."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">アルバイト情報　7月号</div><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>仕事</th><th>内容</th><th>時給（円）</th><th>曜日・時間</th><th>条件</th></tr></thead><tbody><tr><td>1</td><td>中国料理店スタッフ</td><td>食器洗います、材料の準備</td><td>800</td><td>木曜定休<br>10:00～14:00</td><td>週3回以上<br>なるべく多く勤務できる方を望む</td></tr><tr><td>2</td><td>日本そば屋スタッフ</td><td>注文を取る・料理を出す等の接客、後片付け</td><td>900</td><td>月曜定休<br>10:00～21:00</td><td>週2回以上<br>時間は相談可</td></tr><tr><td>3</td><td>居酒屋スタッフ</td><td>注文を取る・料理を出す等の接客、後片付け</td><td>900</td><td>毎日<br>17:00～23:00</td><td>週2回以上（1回は必ず23:00まで）<br>20歳以上の男女（学生可）</td></tr><tr><td>4</td><td>コンビニ店員</td><td>商品販売および商品管理</td><td>（～22時）800<br>（22時～）950</td><td>毎日<br>(1) 8:00～13:00<br>(2) 15:00～21:00<br>(3) 24:00～6:00</td><td>長期できる人<br>週1、2回でもOK</td></tr><tr><td>5</td><td>スーパー店員</td><td>生鮮食品・鮮魚野菜果物・肉売り場で商品を切る、並べる、清掃</td><td>850</td><td>水曜定休<br>9:00～20:00</td><td>週1日、1回4時間以上（時間相談可）<br>長期できる人</td></tr><tr><td>6</td><td>食品工場製造スタッフ</td><td>主に果物の皮むき</td><td>（～22時）800<br>（22時～）1000</td><td>毎日<br>(1) 8:00～17:00<br>(2) 17:00～24:00</td><td>毎日来られる人<br>夜間可能な人歓迎</td></tr><tr><td>7</td><td>新製品宣伝スタッフ</td><td>スーパーで新製品（飲み物）をお客様に紹介する</td><td>1000</td><td>7月の土・日曜<br>9:00～18:00のうち3時間以上</td><td>7月中に2日以上勤務できる人</td></tr><tr><td>8</td><td>引っ越しアシスタント</td><td>荷物を造る、荷物の出し入れ</td><td>950</td><td>毎日<br>原則　9:00～17:00<br>（残業あり）</td><td>1日だけでも可</td></tr><tr><td>9</td><td>試験監督補助</td><td>試験監督の助手<br>・問題配布と回収<br>・受験生のチェック</td><td>（日給）6000</td><td>7月25日（土）<br>8:30～17:00</td><td>大学生</td></tr><tr><td>10</td><td>塾講師（英語）</td><td>中学生・高校生の英語の補習授業</td><td>2000</td><td>火・木・土曜<br>16:00～20:00</td><td>受験指導経験者<br>長期のみ</td></tr></tbody></table></div></div>"},{"source":"Mon13","bai":4,"date":"12/2011","title":"Mon13 - Bài 4 (12/2011)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"次の4人のうち、現段階でアイデア部門の特定課題の応募条件を満たしているのはだれか。","options":["山田さん","鈴木さん","チェンさん","川村さん"],"answer":3,"explain":"Đáp án đúng: D. Bộ môn ý tưởng dành cho học sinh THCS trở lên, đề tài cụ thể là dụng cụ thao tác dễ bằng một tay, và cần nộp hình minh họa. Yamada là học sinh tiểu học; Suzuki chỉ có ghi chú ý tưởng; Chen nộp mẫu thử và đề tài không đúng; Kawamura (bàn phím một tay + hình minh họa) đạt."},{"q":"前川さんは、小さい子供を乗せたまま階段をスムーズに上り下りできる仕組みを持ったベビーカーの実物を見て審査してもらいたいと思っているが、前川さんはどの部門に応募するのが適切か。また、応募の段階で必ず提出しなければならないものは何か。","options":["アイデア部門の自由課題に応募し、作品のイラストを提出する。","アイデア部門の自由課題に応募し、模型とイラストを提出する。","開発部門に応募し、実物の動きなどがわかるような動画を提出する。","開発部門に応募し、実物の動きなどを記録した動画と実物を提出する。"],"answer":2,"explain":"Đáp án đúng: C. Muốn được xét sản phẩm thật nên nộp bộ môn phát triển; khi nộp chỉ cần video thể hiện chuyển động/cách dùng (hiện vật chỉ cần ở vòng 2 nếu có)."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">生活便利化協会<br>2012「生活を便利にする機器・道具」コンテスト<br>募集案内</div><p>1. 部門・参加資格</p><ul><li>① 開発部門<br>企業、高校生以上の一般市民を対象に、生活を便利にするオリジナルな機器を募集します。</li><li>② アイデア部門（特定課題と自由課題）<br>中学生以上の一般市民を対象に、便利な道具のアイデアを募集します。<br>特定課題：片手で簡単に操作できる道具のアイデア<br>自由課題：「生活を便利にする道具」に関するアイデアで、特定課題に該当しないものなら何でもかまいません。</li></ul><p>2. 応募</p><ul><li>① 応募方法<br>・開発部門の応募には、機器の実物の動きや使い方がわかるような動画が必要です。<br>・アイデア部門の応募には、アイデアが具体的にイメージできるようなイラストが必要です。<br>・応募はすべて生活便利化協会のホームページ（http://www.benrika.com/）から行ってください。<br>・応募フォームに必要事項を記入の上、必要なものを添付して送信してください。<br>・応募フォームに添付できないものは郵送してください（送付先はホームページ参照）。</li><li>② 応募期間　2012年6月15日～7月15日</li></ul><p>3. 選考方法<br>開発部門は、独創性のほか、実用性、有効性、コストパフォーマンスを基準に審査します。一次審査は実物の動画を含めた書類審査、二次審査は模型および書類審査です。</p><p>4. 発表・表彰<br>・2012年8月にホームページ上で入賞作品を公表し、応募者にも結果を通知します。<br>・開発部門の入賞作品は、「2012生活便利化フォーラム東京」で表彰・展示され、デモンストレーションも行われます。アイデア部門の入賞作品は、同フォーラムで表彰され、試作品が展示されます。</p><div class=\"m13-sec\">▶ 問1の表</div><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>名前</th><th>職業</th><th>応募作品</th><th>提出可能なもの</th></tr></thead><tbody><tr><td>山田</td><td>小学生</td><td>帽子のようにかぶれる雨具</td><td>作品とイラスト</td></tr><tr><td>鈴木</td><td>高校教師</td><td>片手で簡単に開けられる缶切り</td><td>アイデアのメモ</td></tr><tr><td>チェン</td><td>会社員</td><td>ふたがあけやすくこぼれにくい水筒</td><td>試作品</td></tr><tr><td>川村</td><td>大学生</td><td>片手で楽に入力できるキーボード</td><td>イラスト</td></tr></tbody></table></div></div>"},{"source":"Mon13","bai":5,"date":"07/2012","title":"Mon13 - Bài 5 (07/2012)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"会社員の山田さんは英語で書かれた新聞を読めるようになりたいと思っている。週末は出張が多いので平日しか通えない。山田さんに合う講座はどれか。","options":["①","②","③","④"],"answer":1,"explain":"Đáp án đúng: B. Muốn đọc báo tiếng Anh nên chọn ② (đọc báo cùng giảng viên người nước ngoài), học thứ Năm (ngày thường). ④ cũng có đọc báo nhưng học Chủ nhật."},{"q":"④の講座を受講するためにはどのような手続きが必要か。","options":["見学をしてレベルを確認してから、電話で受講を申し込む。","会館に行って総合パンフレットをもらい、窓口で申し込む。","電話で受講申込書を送ってもらい、会館に行って申し込む。","事前見学の予約をし、見学後、郵便局で受講料を振り込む。"],"answer":0,"explain":"Đáp án đúng: A. ④ yêu cầu bắt buộc phải tham quan trước để xác nhận trình độ. Đăng ký bằng điện thoại (quầy không nhận đăng ký/tiền mặt), sau đó mới chuyển khoản học phí."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">東京都カルチャー会館　4月開講の講座</div><p>①やさしい英語　4月8日開講<br>簡単な単語で伝えられるようになるための「聞く・話す」を中心とした講座。中学校レベルの英語で十分。講師はボランティアの日本人通訳者。事前に見学をすることができます。<br>・毎週火曜　18:30～20:00　12回　16,000円（教材費別）<br>・講師　青木一郎（東京友だちつくろう会代表）</p><p>②外国人としっかり学ぶ英語　4月10日開講<br>日本人講師では物足りない。でも、いきなり英語だけの会話についていく自信はない。そんな人にぴったりの日本語が話せる外国人講師によるコース。毎回講師と新聞記事を読みながら英語力を身につける。事前に見学をすることができます。<br>・毎週木曜　18:30～20:00　15回　18,000円（教材費別）<br>・講師　フレンド外国語学校講師</p><p>③初めての英語　4月12日開講<br>決まり文句をまずレクチャー。あいさつや買い物などでよく使う表現を紹介。聞くことから入り、日常会話を勉強しながらやさしい文法も学ぶので身につきやすい。英語での実務経験の長い日本人講師が丁寧に教える。事前に見学をすることができます。<br>・毎週土曜　12:00～13:30　10回　14,000円（教材費別）<br>・講師　石川健二</p><p>④ステップアップの英語　4月13日開講<br>相手に細かなニュアンスまで伝えられる英語力を身につけたいと思っている方におすすめ。中級以上の文法を習得した方対象。イギリス人講師とさらに複雑なテーマで会話をします。雑誌や新聞などの読解もあり。必ず事前に見学をして、ご自分のレベルに合っているかどうかを確認してからお申し込みください。<br>・毎週日曜　10:00～12:00　12回　20,000円（教材費別）<br>・講師　キャサリン・スミス</p><p>◎受講の申し込み<br>受講の予約、申し込みはお電話で。お電話での申し込み後、受講される講座の案内と振り込み用紙をお送りします。所定日までにお近くの銀行から受講料を振り込んでください。会館の窓口では、申し込みおよび現金の取り扱いはいたしません。<br>館内には4月からの講座の総合パンフレットを用意しています。気軽にお立ち寄りください。<br>申し込み／問い合わせ先：03-444-7890（平日9:00～17:00）</p></div>"},{"source":"Mon13","bai":6,"date":"12/2012","title":"Mon13 - Bài 6 (12/2012)","passage":"","note":"✅ Đáp án đã đối chiếu với đáp án chính thức. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"サラさんは大学の芸術学部の学生で演劇を勉強している。サラさんが「東西劇場 友の会」の会員になったら、次のどのサービスを受けることができるか。","options":["東西劇場の情報が掲載されている会報誌を毎月受け取ることができる。","東西劇場で行われる公演をすべて15％割引で観劇することができる。","東西劇場と系列劇場で行われる公演をすべて割引で見ることができる。","東西劇場と系列劇場の売店で10％割引で買い物をすることができる。"],"answer":1,"explain":"Đáp án đúng: B. Sara là hội viên sinh viên nên được giảm 15% mọi buổi diễn tại Đông Tây. Tạp chí gửi cách tháng; rạp liên kết chỉ giảm một phần (5%); cửa hàng 10% chỉ ở rạp Đông Tây."},{"q":"会社員のユアンさんは「東西劇場 友の会」に入会したいと思っている。入会費と年会費の支払いはどのようにするか。","options":["事務局で入会費と年会費を直接払う。","金融機関で入会費と年会費を振り込む。","事務局で入会費を直接払い、年会費の自動振替の手続きもする。","事務局で入会費を直接払い、金融機関で年会費の自動振替の手続きをする。"],"answer":2,"explain":"Đáp án đúng: C. Hội viên thường: trả phí nhập hội tại văn phòng và đăng ký tài khoản để phí thường niên tự động trừ (làm thủ tục ngay tại văn phòng)."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">「東西劇場　友の会」へのお誘い</div><p>「東西劇場　友の会」は、伝統芸能、現代舞踊、バレエ、音楽などの舞台芸術を皆様により深く、身近に楽しんでいただくための会員組織です。会員の方には様々な特典をご用意しております。</p><ul><li>東西劇場で行われる公演やイベントの情報をお伝えする会報誌「ほうざい」を隔月でお送りいたします。</li><li>東西劇場で行われるすべての公演のチケットを会員割引価格でお求めいただけます（一般会員10％引、学生会員15％引）。また、日本全国の系列劇場の公演にも一部割引を受けられるものがあります（5％引）。</li><li>舞台芸術関連書籍を扱う東西劇場内直営売店、および系列劇場売店でも割引が受けられます（東西劇場10％引、系列劇場5％引）。</li></ul><p>割引を受けられる際には、会員証が必要です。学生会員の方は会員証の他、学生証も併せてご提示ください。</p><p>【入会費・年会費】<br>入会費（入会時のみ）：1,000円<br>年会費（1年ごと）：一般会員 2,000円、学生会員 1,500円</p><p>【ご入会の手続き】<br>ご入会は東西劇場内の「東西劇場　友の会」事務局で承ります。<br>一般会員の方は、事務局で入会費のお支払いおよび年会費振替用の金融機関口座のご登録をお願いします（金融機関の口座情報と印鑑をご持参ください）。年会費は、ご入会の約2か月後に、ご登録の口座からの自動振替となります。退会のお申し出がない限り、毎年自動的に引き落とされますのでご了承ください。<br>学生会員の方は、入会申し込みの際に学生証をお持ちの上、入会費と年会費を事務局でお支払いください。一年ごとに入会継続の手続きをお願いしています。入会を申し込まれた方にはその場で会員証を発行します。</p><p>「東西劇場　友の会」事務局　TEL 03-1834-5578</p></div>"},{"source":"Mon13","bai":7,"date":"07/2013","title":"Mon13 - Bài 7 (07/2013)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"この病院で基本検査項目のほかに、追加の検査も受ける必要がある場合、予約はどのようにしなければならない決まりになっているか。","options":["電話で、2日前までに予約する。","電話で、4日前までに予約する。","Eメールで、2日前までに予約する。","Eメールで、4日前までに予約する。"],"answer":0,"explain":"Đáp án đúng: A. Xét nghiệm ngoài ①–⑨ bắt buộc đặt qua điện thoại, và điện thoại phải đặt trước 2 ngày."},{"q":"アンさんは健康診断書を会社指定の用紙を使って、英文で作成してもらう必要がある。作成料金を受診当日に支払うこと以外に何をすることが必要か。","options":["予約時に英文の診断書の作成を依頼し、受診日までに用紙を郵送する。","予約時に英文の診断書の作成を依頼し、受診当日用紙を渡す。","受診当日に英文の診断書の作成を依頼し、受診後用紙を郵送する。","受診当日に英文の診断書の作成を依頼し、用紙を渡す。"],"answer":1,"explain":"Đáp án đúng: B. Bản tiếng Anh phải báo khi đặt lịch (mất thêm khoảng 2 ngày); mẫu giấy chỉ định của công ty thì nộp tại quầy tiếp nhận vào ngày khám."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">緑町病院　雇用時健康診断のご案内</div><p>【基本検査項目】<br>①問診および診察　②身体計測　③血圧測定　④尿検査　⑤視力検査　⑥聴力検査　⑦血液検査　⑧胸部エックス線検査　⑨心電図検査<br>※その他検査を追加でご希望の方は、ご予約時にお問い合わせください。</p><p>【実施日時】<br>月曜日～金曜日　9:30～17:00</p><p>【予約方法】<br>・予約の申し込みは、電話もしくはEメールにて受け付けます。電話の場合は検診日の2日前まで、メールの場合は4日前までにお願いします。<br>・上記①～⑨以外の検査をご希望の場合は、必ずお電話にてお申し込みください。</p><p>【費用】（検診費用および診断書発行まですべてを含んだ金額です）<br>電話による予約の場合　9,450円（税込み）<br>Eメールによる予約の場合　8,925円（税込み）<br>※上記①～⑨以外の検査を受ける方は、追加料金が発生します。</p><p>【検査結果】<br>・健康診断書は、受診日の1週間後から窓口でのお渡しになります。郵送も可能です（送料別途）。<br>・結果記入用の指定用紙がある場合は、受診当日、受付にご提出ください。<br>・英文による健康診断書も作成いたします（作成料別途）。ご希望の方は、ご予約時にお知らせください。作成には、別途日数が約2日かかります。</p><p>【お支払い】<br>・当日、窓口にてお支払いください。各種カードも取り扱っております。</p><p>【注意事項】<br>・受診6時間前までに食事を終わらせてください。それ以降は、お水のみでお過ごしください。<br>・眼鏡をお使いの方は、当日ご持参ください。コンタクトレンズをお使いの方は、ケースをご持参ください。</p><p>【問い合わせ先】<br>緑町病院　電話：01-1234-5678<br>受付時間：月曜日～金曜日の9:00～17:00<br>Eメール：yoyaku@midori-machi.com</p></div>"},{"source":"Mon13","bai":8,"date":"12/2013","title":"Mon13 - Bài 8 (12/2013)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"ムディさんは、市民農園を借りたいと考えている。作る野菜は自分で決めたいが、農作業の経験がないので作り方を教えてほしいと思っている。ムディさんはどの農園を借りたらよいか。","options":["①","②","③","④"],"answer":1,"explain":"Đáp án đúng: B. Muốn tự chọn rau và được hướng dẫn: ① rau do vườn quy định; ③④ không hướng dẫn trồng trọt; ② cho thuê riêng 10m² và có hướng dẫn khi cần."},{"q":"原口市の市民農園を借りる際に、留意しなければならないことはどれか。","options":["原口市に住んでいる人しか借りることができない。","同じ農園を3年以上連続して借りなければならない。","自分で農具を準備しなければならない農園がある。","早く応募しないと希望の農園が借りられないことがある。"],"answer":2,"explain":"Đáp án đúng: C. ③ và ④ phải tự chuẩn bị giống, cây, nông cụ. Người đi làm trong thành phố cũng được; tối đa 3 năm (không phải tối thiểu); đông người thì bốc thăm chứ không theo thứ tự đến trước."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">原口市市民農園　利用者募集案内</div><p>市民農園は、小面積の土地を利用して野菜や花作りを楽しむための貸し農園です。野菜や花作りに興味はあるけれど育てる場所がないといった方々は、市民農園を利用してみませんか。</p><p>【対象者】原口市内にお住まいの人または市内にお勤めの人<br>【利用期間】2014年4月～2015年3月（最長3年間の継続利用が可能）<br>【農園の場所・特徴・料金】今回募集する農園は以下の4か所です</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>場所</th><th>特徴</th><th>料金/年</th></tr></thead><tbody><tr><td>①</td><td>原口市東山</td><td>指導を受けながら、共同で楽しく野菜や花の栽培ができます（栽培する野菜や花は、農園によって決められています）。</td><td>8000円</td></tr><tr><td>②</td><td>原口市西川</td><td>10m²を個人で借りて、自由に野菜や花の栽培が楽しめます。必要な種、苗、農具などは準備してあります。必要に応じて栽培指導を受けられます。種、苗などは各自で準備してください。農具は貸し出します。</td><td>5000円</td></tr><tr><td>③</td><td>原口市三田</td><td>10m²を個人で借りて、自由に野菜や花の栽培が楽しめます。種、苗、必要な農具は、各自で準備してください。</td><td>3000円</td></tr><tr><td>④</td><td>原口市池沢</td><td>50m²を個人で借りて、じっくり野菜や花の栽培が楽しめます。種、苗、必要な農具は、各自で準備してください。農業用大型機械の貸し出しを行っています。</td><td>5000円</td></tr></tbody></table></div><p>①②③は市街地に近い、比較的利用しやすい場所にあります。④は豊かな自然に囲まれた郊外にあります。③④では栽培指導は行っていません。</p><p>【応募方法】往復はがきに、(1) 利用を希望する農園の場所、(2) 利用者の名前・住所・電話番号を記入し、市役所市民課市民農園係宛に送ってください。希望者が多い場合は抽選になります。<br>【応募締め切り】2014年3月2日当日消印有効<br>【問い合わせ先】原口市役所市民課市民農園係　電話：031（389）6930</p></div>"},{"source":"Mon13","bai":9,"date":"07/2014","title":"Mon13 - Bài 9 (07/2014)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"中西さんは35歳の会社員で、CPJカードを申し込むことにした。中西さんは年会費を5000円以内に抑えたいが、海外旅行の保険はなるべく高額なものがよい。中西さんに最も合っているカードはどれか。","options":["A","B","C","D"],"answer":2,"explain":"Đáp án đúng: C. 35 tuổi nên không dùng được B (18–29 tuổi). Phí hội viên dưới 5000 yên chỉ có C (2625) và D (1050); bảo hiểm du lịch nước ngoài của C là 3000 vạn, cao hơn D (2000 vạn)."},{"q":"会社員の山本さんはCPJカードを申し込むことにした。山本さんは引っ越しをしたばかりのため、運転免許証に書かれた住所と現住所が異なっている。カードを申し込む際、入会申込書のほかに、次のどの書類を提出しなければならないか。","options":["運転免許証のコピーだけ","運転免許証のコピーと住民票のコピー","運転免許証のコピーと先月の電話料金の領収書のコピー","運転免許証のコピーと先月の水道料金の領収書のコピー"],"answer":3,"explain":"Đáp án đúng: D. Nếu địa chỉ trên giấy tờ khác địa chỉ hiện tại thì kèm một giấy tờ ghi địa chỉ hiện tại: biên lai điện/gas/nước, bảo hiểm xã hội hoặc nộp thuế. Biên lai tiền nước hợp lệ, tiền điện thoại thì không."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">CPJカードのご案内</div><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>カードの種類</th><th>A</th><th>B</th><th>C</th><th>D</th></tr></thead><tbody><tr><td>お申込みの資格</td><td>30歳以上※1</td><td>18歳以上※1<br>29歳以下※1</td><td>18歳以上※1</td><td>18歳以上</td></tr><tr><td>年会費　ご本人</td><td>10500円</td><td>3150円</td><td>2625円</td><td>1050円</td></tr><tr><td>年会費　ご家族</td><td>お一人1050円</td><td>お一人420円</td><td>お一人420円</td><td>無料</td></tr><tr><td>ご利用可能枠</td><td>最高500万円</td><td>最高300万円</td><td>最高300万円</td><td>最高200万円</td></tr><tr><td>旅行保険　国内</td><td>最高5000万円</td><td>最高5000万円</td><td>最高3000万円</td><td>最高2000万円</td></tr><tr><td>旅行保険　海外</td><td>最高8000万円</td><td>最高5000万円</td><td>最高3000万円</td><td>最高2000万円</td></tr></tbody></table></div><p>（※1）学生は除きます</p><p>【お申込み方法】<br>1. インターネットまたは電話で資料をご請求ください。<br>2. 資料が到着しましたら、入会申込書にご記入のうえ、本人確認書類と一緒にご返送ください。（Dカードをお申し込みの方は、学生証のコピーも同封してください。）<br>3. 当社に入会申込書到着後、1か月前後でカードを発行いたします。当社の判断で、ご希望に添えない場合もございます。</p><p>本人確認書類は、次のいずれか1点のコピー（お名前、生年月日、現住所の記載面）をご用意ください。<br>（1）運転免許をお持ちの方は、必ず運転免許証<br>（2）運転免許をお持ちでない方は、以下のいずれか1点のコピー　※2<br>　①パスポート　②健康保険証　③住民票　④在留カードまたは特別永住者証明書</p><p>※（1）もしくは（2）に書かれた住所と入会申込書の現住所が異なる場合は、現住所が記載されている以下の書類のうち、いずれか1点のコピーを併せてご提出ください。<br>A 公共料金（電気、ガス、水道のいずれか一つ）の領収書<br>B 社会保険料（健康保険、年金など）の領収書<br>C 税金を納めたときの証明書</p></div>"},{"source":"Mon13","bai":10,"date":"12/2014","title":"Mon13 - Bài 10 (12/2014)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"留学生のマイクさんは日本で就職したいと思っている。マイクさんが必ず出席しなければいけない行事はいくつか。","options":["一つ","二つ","三つ","四つ"],"answer":0,"explain":"Đáp án đúng: A. Người muốn đi làm (kể cả du học sinh) phải dự một trong hai buổi định hướng việc làm (①/④). Buổi định hướng cho du học sinh chỉ dành cho người muốn tham dự, nên bắt buộc chỉ 1 sự kiện."},{"q":"林さんはマスコミ関連の企業に就職したいので、関連企業に就職した先輩の話や、関連企業の仕事内容について聞きたいと思っている。林さんは授業のため17時以降しか出席できない。林さんに合う行事はどれか。","options":["③と⑧のみ","③と⑧と⑩","⑧のみ","⑧と⑩のみ"],"answer":0,"explain":"Đáp án đúng: A. ③ (3/10, 18:30, kể chuyện kinh nghiệm ngành quảng cáo/truyền thông) và ⑧ (1/12, nhóm quảng cáo–truyền thông bắt đầu 17:15). ⑩ (17/12) nhóm quảng cáo–truyền thông diễn ra 16:00–17:00 nên không kịp."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">就職支援行事（9月～12月）のスケジュール</div><p>就職活動を行う学生のために、各種行事を実施しています。<br>全行事、申し込みは不要です。当日、学生証を持参のうえ、会場へお越し下さい。</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>日</th><th>時間</th><th>行事名</th><th>内容</th></tr></thead><tbody><tr><td>①</td><td>9月19日（金）</td><td>イ</td><td>就職ガイダンス</td><td>［就職活動全般の基本的な情報］就職活動の方法やスケジュールなど</td></tr><tr><td>②</td><td>9月24日（水）</td><td>ア</td><td>留学生ガイダンス</td><td>留学生向けの在留資格や留学生の就職状況などの説明</td></tr><tr><td>③</td><td>10月3日（金）</td><td>イ</td><td>就職活動体験談(1)</td><td>広告・マスコミ業界に就職した卒業生による就職活動の体験談</td></tr><tr><td>④</td><td>10月16日（水）</td><td>ア</td><td>就職ガイダンス</td><td>［就職活動全般の基本的な情報］内容は9月19日と同じです</td></tr><tr><td>⑤</td><td>10月23日（木）</td><td>ア</td><td>留学生ガイダンス</td><td>内容は9月24日と同じです</td></tr><tr><td>⑥</td><td>11月7日（金）</td><td>イ</td><td>留学生マナー講座</td><td>留学生が日本で就職活動を行うにあたっての基本的なマナー講座</td></tr><tr><td>⑦</td><td>11月20日（木）</td><td>ア</td><td>就職活動体験談(2)</td><td>金融・証券業界に就職した卒業生による就職活動の体験談</td></tr><tr><td>⑧</td><td>12月1日（月）</td><td>＊</td><td>合同企業説明会</td><td>詳細は下記参照</td></tr><tr><td>⑨</td><td>12月12日（金）</td><td>ア</td><td>就職活動体験談(3)</td><td>貿易・流通業界に就職した卒業生による就職活動の体験談</td></tr><tr><td>⑩</td><td>12月17日（水）</td><td>＊</td><td>合同企業説明会</td><td>詳細は下記参照</td></tr></tbody></table></div><p>開催時間：ア…14:50～16:20　イ…18:30～20:00　＊合同企業説明会は下記参照<br>開催場所：⑥以外…緑山ホール　⑥…101教室</p><div class=\"m13-sec\">注意事項</div><p>・就職希望者（留学生含む）は、［就職ガイダンス］のどちらかに必ず出席してください。<br>・［留学生ガイダンス］は希望者のみ出席してください。</p><div class=\"m13-sec\">合同企業説明会について</div><p>合同企業説明会は業種別に、以下の日時に開催されます。各回、約50社が参加予定です。（途中入退場自由）</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>12月1日</th><th>12月17日</th></tr></thead><tbody><tr><td>16:00～17:00</td><td>金融・証券</td><td>広告・マスコミ</td></tr><tr><td>17:15～18:15</td><td>広告・マスコミ</td><td>メーカー・IT</td></tr><tr><td>18:30～19:30</td><td>貿易・流通</td><td>教育・福祉</td></tr></tbody></table></div><p>緑山大学就職課</p></div>"},{"source":"Mon13","bai":11,"date":"07/2015","title":"Mon13 - Bài 11 (07/2015)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"次の4人は、読者モニターに応募しようと思っている。全員インターネットを使えるパソコンを持っており、過去にモニターに応募したことはない。応募条件をすべて満たしているのは誰か。","options":["水野さん","ソウさん","チョウさん","山田さん"],"answer":2,"explain":"Đáp án đúng: C. Cần: sống ở Kanto 1 đô 3 tỉnh suốt kỳ hợp đồng, đặt báo cả sáng lẫn chiều, từ 20 tuổi, không làm báo/truyền thông/quảng cáo. Mizuno chỉ đặt báo sáng; Sou làm công ty quảng cáo; Yamada sẽ chuyển đến Aichi; Chou đạt."},{"q":"アンケートに回答するときに、モニターがすべきことは何か。","options":["指定時間内に所定のウェブサイトを通じて回答する。","保管しておいたすべての新聞を読み直して回答する。","「実施のお知らせ」を受信してから24時間以内に回答する。","回答形式を問わず、すべての質問に回答する。"],"answer":0,"explain":"Đáp án đúng: A. Trả lời trên trang web chỉ định trong 24 giờ kể từ 7h sáng ngày khảo sát. Chỉ cần xem số báo của 1 tuần trước; thời hạn tính từ ngày khảo sát (không phải khi nhận thông báo); ô tự luận được để trống."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">やまかわ新聞　読者モニター募集</div><p>紙面に掲載された記事や広告に関するアンケートにお答えください。</p><div class=\"m13-sec\">募集概要</div><p>モニター契約期間：2016年4月から2017年3月まで<br>応募条件：(1)～(5)の条件をすべて満たしている方<br>(1) モニター契約期間中、以下にお住まいの方　関東1都3県（東京都、神奈川県、千葉県、埼玉県）<br>(2) やまかわ新聞を朝、夕刊ともに自宅で購読中の方<br>(3) 2016年4月2日時点で20歳以上の方<br>(4) 新聞、マスコミ、広告関係の職業に従事されていない方<br>(5) インターネットに接続できるパソコン等をお持ちの方<br>＊過去に「やまかわ新聞読者モニター」をされた方は、応募できません。<br>募集人数：300人　　締め切り：2016年2月1日（月）<br>募集方法：はがきに「読者モニター希望」の旨と住所、氏名、年齢、性別、職業、メールアドレスをご記入の上、ご送付ください。<br>結果通知：3月下旬までにメールでご連絡します。</p><div class=\"m13-sec\">アンケート内容</div><p>内容：紙面に掲載された記事や広告についての評価など<br>実施回数：月2、3回程度<br>謝礼：回答1回につき図書カード500円分（任期終了時にまとめて発送）<br>手順：①アンケート実施1週間前にメールで「実施のお知らせ」が届きます。<br>　　　②アンケート実施当日にウェブサイトのアンケート回答ページにアクセスして回答してください。<br>留意点：<br>＊アンケート実施前一週間分の紙面を保管しておいてください。アンケートはその中から当社指定の記事や広告について答えていただきます。<br>＊回答可能時間は、アンケート実施当日の午前7時から24時間です。<br>＊回答形式には自由記述式と選択式があります。自由記述式の箇所は空欄でもかまいませんが、選択式の箇所が未入力であった場合、回答は受け付けられません。</p><p>＜問い合わせ先＞やまかわ新聞読者モニター担当<br>電話：07-1234-9876（受付時間：土日祝日を除く午前10時～午後5時）</p><div class=\"m13-sec\">▶ 問1の表</div><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>名前</th><th>職業</th><th>年齢（2016年4月2日時点）</th><th>モニター契約期間中の居住地</th><th>購読中のやまかわ新聞</th></tr></thead><tbody><tr><td>水野</td><td>大学生</td><td>22歳</td><td>神奈川県</td><td>朝刊のみ</td></tr><tr><td>ソウさん</td><td>広告代理店社員</td><td>24歳</td><td>埼玉県</td><td>朝刊と夕刊</td></tr><tr><td>チョウさん</td><td>旅行会社社員</td><td>27歳</td><td>東京都</td><td>朝刊と夕刊</td></tr><tr><td>山田さん</td><td>銀行員</td><td>32歳</td><td>千葉県（2016年8月に愛知県へ転出予定）</td><td>朝刊と夕刊</td></tr></tbody></table></div></div>"},{"source":"Mon13","bai":12,"date":"12/2015","title":"Mon13 - Bài 12 (12/2015)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"東あさひ市立博物館“友の会”の会員になると受けることのできるサービスはどれか。","options":["常設展をいつでも割引料金で見学できる。","開催されるすべての特別展にそれぞれ一度だけ無料で入れる。","ショップで売られている本や雑誌を10%安く買える。","半年間、毎月無料で博物館発行の情報誌を送ってもらえる。"],"answer":1,"explain":"Đáp án đúng: B. Mỗi triển lãm đặc biệt được vào miễn phí 1 lần. Triển lãm thường trực là miễn phí (không phải giảm giá); sách không được giảm 10%; tạp chí gửi 6 lần/năm vào các tháng chẵn."},{"q":"ノンさんは、家の近所にある東あさひ市立博物館の“友の会”会員である。明後日21日に始まる特別展を見に行く予定だが、明日20日で会員期間が終了することに気がついた。21日に会員サービスが利用でき、年会費がより安く済む方法はどれか。","options":["20日までに窓口に行って、継続入会の申し込みをする。","20日までに郵送で、継続入会の申し込みをする。","21日に窓口に行って、継続入会の申し込みをする。","21日に窓口に行って、新規入会の申し込みをする。"],"answer":0,"explain":"Đáp án đúng: A. Gia hạn (8.500 yên) phải làm trong thời hạn hiệu lực (đến 20). Làm tại quầy thì cấp thẻ ngay; gửi thư mất khoảng 2 tuần. Sau ngày 20 chỉ được đăng ký mới (10.000 yên)."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">東あさひ市立博物館“友の会”入会案内</div><p>“友の会”会員になると</p><ul><li>東あさひ市立博物館の常設展や、附属の東あさひ市立植物園に何度でも無料で入場（園）できます。</li><li>東あさひ市立博物館では、特別展を年数回開催します。会員の方は、各特別展につき1回、無料で入場できます。また、同一の特別展を2回以上ご覧になる際は、2回目以降は割引料金で入場できます。</li><li>館内レストランでご飲食の際に5％の割引が受けられます。</li><li>館内のショップで10％の割引が受けられます。ただし、書籍は除きます。</li><li>東あさひ市立博物館が年6回、毎偶数月に発行する情報誌を無料でお届けします。</li></ul><p>入会方法<br>新規入会：初めて入会する場合（以前入会したことがある方も、会員証の有効期間が終了した場合は、再度、新規入会手続きを行ってください。）<br>継続入会：会員証の有効期間内に手続きをする場合<br>新規入会、継続入会ともに、下記のいずれかの方法でお申し込みください。</p><p>＜窓口＞<br>窓口備え付けの入会申込書にご記入いただき、年会費お支払い後、その場で会員証を発行いたします。</p><p>＜郵送＞<br>新規入会申込書、または継続入会申込書を本ホームページからダウンロードし、必要事項をご記入の上、下記住所にご郵送ください。<br>年会費は、郵便局で「払込取扱票」の必要箇所にご記入の上、下記の口座、加入者宛にご送金ください。<br>お申込書内容とご入金が確認でき次第、会員証を発行し、送付いたします。会員証の到着までには、ご入金後2週間程度かかります。</p><p>年会費（1年間有効）　新規入会：10,000円　継続入会：8,500円<br>お問い合わせ先：電話 091-568-1153　Eメール：hakubutsukan@higashi-asahi.jp<br>郵送先：〒009-0364　東あさひ市中川5-6-1　東あさひ市立博物館友の会担当<br>振込先：口座番号 0501-111111　加入者名：東あさひ市立博物館友の会</p></div>"},{"source":"Mon13","bai":13,"date":"07/2016","title":"Mon13 - Bài 13 (07/2016)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"次の4人は、全員「学生レポーター」に応募しようと思っている。この中で、「学生レポーター」に応募できるのは誰か。","options":["キムさん","カーンさん","ホンさん","クルスさん"],"answer":2,"explain":"Đáp án đúng: C. Phải là sinh viên, sống hoặc học tại Kawamura, và dự buổi giải thích ngày 18/3, trong suốt nhiệm kỳ. Kim sống ở Iwasato; Khan vắng mặt 9–20/3; Cruz hết khóa học tháng 9; Hon sống ở Kawamura từ 1/2017 nên đạt."},{"q":"「学生レポーター」に応募する人が、2017年2月24日(金)までに必ずしなければならないことは何か。","options":["申込書、志望理由書をメールで提出する。","申込書、志望理由書を持参して提出する。","申込書、志望理由書、写真をメールで提出する。","申込書、志望理由書、写真を持参して提出する。"],"answer":0,"explain":"Đáp án đúng: A. Hạn 24/2 là gửi mail đơn đăng ký (1) và lý do (2). Ảnh (3) mang theo khi phỏng vấn."}],"html":"<div class=\"m13doc\"><p>川村市 ＞ レポート募集 ＞ 学生レポート募集</p><div class=\"m13-h\">学生レポート募集について</div><p>川村市では、市の魅力を伝えるため、市のホームページに掲載するレポートを執筆する「学生レポート」を募集します。</p><p>［活動内容］<br>川村市の自然、農産、文化などについて取材し、年度中に4本程度の写真つき記事を出していただきます。</p><p>［任期］<br>2017年4月～2018年3月（1年間）</p><p>［謝礼］<br>謝礼（年額10,000円）と記念品を差し上げます。</p><p>［応募資格］<br>任期中を通じて、以下のa)～c)の条件をすべて満たす方<br>a) 大学院、大学、短期大学または専門学校に通う学生である。<br>　・外国人学生の方も、歓迎します。<br>b) 川村市内に在住、または、川村市にある学校に在学します。<br>c) 2017年3月18日（土）に川村市役所で行われる事前説明会に出席できる。</p><p>［応募方法］<br>市役所広報課にメール　(1)、(2)　をご提出ください。（2017年2月24日（金）締切り）。折り返し、面接日についてご連絡します。面接では写真を使ったプレゼンテーション（5分程度）もしていただきます。必ず　(3)　をご持参ください。採否は、志望理由書及び面接により決定します。<br>(1) 申込書<br>…本ホームページからダウンロードし、必要事項を記入してください。<br>(2) 志望理由書<br>…書式自由。川村市学生レポートに応募した理由について200字程度で書いてください。<br>(3) 写真（テーマ「私が伝えたい川村市」。人物、風景、物など、何でも結構です。）<br>＊面接時、学生証と現住所がわかるものを確認しますので、ご持参ください。</p><p>［その他］<br>レポーターをお願いする方には、市で指定するボランティア保険に加入していただきます。（保険の費用は市で負担いたします。）<br>お問合せ：川村市役所　広報課　081-6543-2100 / kouhou@kawamura.jp</p><div class=\"m13-sec\">▶ 問1の表</div><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>名前</th><th>通っている大学</th><th>住む所</th><th>その他</th></tr></thead><tbody><tr><td>キムさん</td><td>岩里市にある大学</td><td>岩里市</td><td></td></tr><tr><td>カーンさん</td><td>川村市の専門学校</td><td>岩里市</td><td>2017年3月9日から20日までの間、しばらく帰国する予定</td></tr><tr><td>ホンさん</td><td>岩里市にある大学</td><td>川村市</td><td>2017年1月から川村市に住む</td></tr><tr><td>クルスさん</td><td>川村市にある大学院</td><td>川村市</td><td>2017年9月修士課程終了後、10月に帰国する予定</td></tr></tbody></table></div></div>"},{"source":"Mon13","bai":14,"date":"12/2016","title":"Mon13 - Bài 14 (12/2016)","passage":"","note":"✅ Đáp án đã đối chiếu với đáp án chính thức. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"大森大学の学生のリンさんは、明日中に借りたい本がある。明日行ける図書館の中では、以下の4館が所蔵していることがわかったので、メモをした。リンさんが本を借りられるのは、次の方法のうちどれか。","options":["学生証を持参して、長島大学図書館に行く。","今から紹介状を申請し、それを持参して、あおば大学図書館に行く。","学生証を持参して、中山工業大学図書館に行く。","今から紹介状を申請し、それを持参して、さくら大学図書館に行く。"],"answer":0,"explain":"Đáp án đúng: A. Thư giới thiệu mất khoảng 5 ngày nên ②④ không kịp. Trường liên kết: Nagashima cho mượn về, còn Nakayama Kōgyō chỉ được đọc tại chỗ."},{"q":"大森大学の学生のロイさんは利用したい資料があるが、大森大学にはなかった。他大学に行く時間がないため、複写依頼か資料借用のサービスを利用しようと考えている。ロイさんが注意しなければならないこととして合っているのは、次のどれか。","options":["複写依頼は、資料を所蔵する大学のホームページから行わなければならない。","複写依頼は、一度に2件以上まとめて申し込むことはできない。","資料の借用に必要な送料は、半額を自身が負担しなければならない。","借用した資料は、大森大学図書館内で閲覧しなければならない。"],"answer":3,"explain":"Đáp án đúng: D. Tài liệu mượn chỉ được xem trong thư viện của trường mình, không được mang về. Đăng ký ở quầy hoặc web của trường mình; tối đa 5 yêu cầu/lần; phí vận chuyển người dùng trả toàn bộ."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">大森大学図書館<br>他大学の図書館の資料の利用について</div><p>利用したい資料が本学にない場合、他大学の図書館の資料を利用できます。</p><p>① 他大学の図書館に行く</p><p>①-A　相互利用協定校を利用する<br>相互利用協定に加盟している図書館は、学生証の提示のみで、利用することができます。図書館によって、受けられるサービスが異なりますので、下記一覧を参照してください。</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>協定に加盟している図書館の一覧</th><th>閲覧</th><th>貸出</th></tr></thead><tbody><tr><td>みはま大学図書館</td><td>可</td><td>可</td></tr><tr><td>長島大学図書館</td><td>可</td><td>可</td></tr><tr><td>あおば大学図書館</td><td>可</td><td>不可</td></tr><tr><td>中山工業大学図書館</td><td>可</td><td>不可</td></tr></tbody></table></div><p>①-B　相互利用協定校以外を利用する<br>本学図書館が発行する紹介状を持参すれば、相互利用協定以外の図書館にも入館できます。受けられるサービスについては、各図書館に問い合わせてください。<br>紹介状の発行は、所定の申込書に記入して本学図書館受付で申し込んでください。<br>注意：利用時は、必ず学生証と紹介状を持参してください。<br>紹介状の発行は無料ですが、発行まで約5日かかります。</p><p>② 他大学の図書館に複写を依頼し、取り寄せる<br>本学図書館が他大学の図書館に複写を依頼し、取り寄せることができます。<br>申し込みは、本学図書館受付、または本学図書館ホームページ上で行ってください。<br>注意：資料の複写料金、送料などは全額利用者負担となります。<br>一度に依頼できる件数は5件までです。</p><p>③ 他大学の図書館から借用した資料を見る<br>本学図書館が他大学の図書館から資料を一定の期間借用し、その資料を本学図書館内にて閲覧することができます。<br>申し込みは、本学図書館受付で行って下さい。<br>注意：資料の往復送料などは全額利用者負担となります。<br>本学図書館内での閲覧に限ります。貸出はできません。<br>借用可能な資料は、一人一点限りとなります。</p></div>"},{"source":"Mon13","bai":15,"date":"07/2017","title":"Mon13 - Bài 15 (07/2017)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"ウーさんは55歳で、このスポーツジムに入会してトレーニングジムとプールを使いたいと考えている。火曜の10時から12時までと、水曜の17時から19時までが両方利用できるもので、できるだけ安いプランがいい。ウーさんの希望に合うプランはどれか。","options":["フルタイム","平日A","平日B","平日C"],"answer":1,"explain":"Đáp án đúng: B. Thứ Tư cần dùng đến 19:00 nên Bình thường B (đến 17h), C (đến 18h), Senior (60 tuổi trở lên) đều không được. Giữa Full time (10.000) và Bình thường A (9.000) thì chọn A rẻ hơn."},{"q":"アンガスさんは、このスポーツジムの「夏のご入会キャンペーン」の期間内に入会手続きに行くつもりだ。アンガスさんが入会手続き時に支払わなければならない料金はどれか。","options":["入会金と2か月分の月会費","入会金と1か月分の月会費","2か月分の月会費","1か月分の月会費"],"answer":2,"explain":"Đáp án đúng: C. Khi đăng ký phải trả phí nhập hội + 2 tháng phí. Ưu đãi miễn phí nhập hội; miễn phí 1 tháng là tháng thứ 3 nên vẫn phải trả 2 tháng phí."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">りんどうスポーツジム　ご入会案内</div><p>広々としたトレーニングジムとプールで、楽しく汗を流しませんか。</p><p>営業時間<br>月～金　8:00～23:00　　土　8:00～21:00　　日　9:00～20:00<br>祝日の場合は20:00で営業終了します。</p><p>料金表　曜日や時間など、ご自身に合ったプランをお選びください！</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>プラン</th><th>月会費</th><th>ご利用時間</th><th>ご入館条件</th></tr></thead><tbody><tr><td>フルタイム</td><td>10000</td><td>全営業日時間内</td><td>16歳以上の方</td></tr><tr><td>平日A</td><td>9000</td><td>月～金の営業時間内</td><td>16歳以上の方</td></tr><tr><td>平日B</td><td>8000</td><td>月～金の17:00まで</td><td>16歳以上の方</td></tr><tr><td>平日C</td><td>8000</td><td>月～金の18:00まで</td><td>16歳以上の方</td></tr><tr><td>シニア</td><td>7800</td><td>月～金の20:00まで</td><td>60歳以上の方</td></tr></tbody></table></div><p>すべてのプランで、トレーニングジムとプールがご利用いただけます。</p><p>入会手続き<br>①～③をお持ちの上、受付にお越しください。<br>①本人確認書類（免許証、保険証などの公的身分証明書）<br>②金融機関の通帳とお届け印、またはキャッシュカード<br>③入会金（5,000円）および2か月分（1か月目、2か月目）の月会費<br>＊各種キャンペーン適用により、入会金、月会費が割引になる場合があります。<br>りんどうスポーツジム　電話 058-556-7788　http://rindou-s.com</p><div class=\"m13-sec\">夏のご入会キャンペーン</div><p>7月31日までにご入会の方限定の3つの特典！この機会をお見逃しなく！<br>特典① 入会金が無料！<br>特典② 月会費が1か月分無料！（3か月目の月会費を免除）<br>特典③ タオルレンタルが2か月間無料！<br>＊入会手続き等、詳細については「ご入会案内」のポスターをご参照の上、ご不明な点はスタッフまでお気軽にお問い合わせください。<br>りんどうスポーツジム　電話 058-556-7788　http://rindou-s.com</p></div>"},{"source":"Mon13","bai":16,"date":"12/2017","title":"Mon13 - Bài 16 (12/2017)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"マイクさんは北山大学の4年生である。就職活動のため、以下の四つの証明書が必要になり、メモをした。この中で、受付時間内に申請をすれば、その日のうちに受け取れるのはどれか。（マイクさんのメモ：成績証明書・卒業見込証明書・健康診断証明書（書式は会社指定のもの）・調査書（書式は会社指定のもの））","options":["成績証明書と卒業見込証明書","成績証明書と卒業見込証明書と健康診断証明書","成績証明書と卒業見込証明書と調査書","成績証明書と健康診断証明書"],"answer":0,"explain":"Đáp án đúng: A. Máy tự động cấp ngay: bảng điểm, giấy dự kiến tốt nghiệp. Giấy khám sức khỏe theo mẫu công ty (mất 5 ngày) và thư giới thiệu/chosa-sho theo mẫu công ty (mất 7 ngày) thì không nhận ngay."},{"q":"証明書の申請に関して、留意しなければならないことはどれか。","options":["申請までに、次の学期の授業料を納入しておく必要がある。","窓口で申請する場合、学生証とパスワードが必要である。","学生センター窓口でしか申請ができない期間がある。","大学に行けない場合の申請方法はメールのみである。"],"answer":2,"explain":"Đáp án đúng: C. Các khoảng 26/3–5/4 và 25/9–5/10 máy tự động ngừng, chỉ nhận tại quầy trung tâm sinh viên. Học phí cần là đến học kỳ trước; mật khẩu chỉ cần khi dùng máy; gửi thư được nhưng email/điện thoại thì không."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">北山大学　証明書の発行（在学生）</div><p>本学に在籍中の学生には以下の証明書の発行が可能です。証明書の種類や書式によって、発行方法が異なります。</p><p>証明書自動発行機で申請・発行できる証明書（全て北山大学の書式を使用）</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>種類</th><th>手数料（和文・英文）</th><th>受付時間</th><th>所要日数</th></tr></thead><tbody><tr><td>1. 在学証明書</td><td>200円</td><td>月～土 8:30～20:00</td><td>即日</td></tr><tr><td>2. 成績証明書</td><td>200円</td><td>月～土 8:30～20:00</td><td>即日</td></tr><tr><td>3. 卒業見込証明書※1</td><td>200円</td><td>月～土 8:30～20:00</td><td>即日</td></tr><tr><td>4-a. 健康診断証明書</td><td>300円</td><td>月～土 8:30～20:00</td><td>即日</td></tr></tbody></table></div><p>※1　大学院の学生は、所属研究科の事務室に申請してください。発行は申請から5日後となります。</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>種類</th><th>受付時間</th><th>所要日数</th></tr></thead><tbody><tr><td>4-b. 健康診断証明書（提出先が指定する書式）</td><td>月～金 9:00～16:30</td><td>申請後5日</td></tr><tr><td>5-a. 調査書（北山大学の書式）</td><td>月～金 9:00～16:30</td><td>申請後5日</td></tr><tr><td>5-b. 調査書（提出先が指定する書式）</td><td>月～金 9:00～16:30</td><td>申請後7日</td></tr></tbody></table></div><p>※2　手数料は、お問い合わせください。</p><ul><li>申請の時点で、その前の学期までの授業料を納入していない場合、証明書は発行できません。</li><li>申請には、学生証が必要です。証明書自動発行機を利用しての申請は、さらに4けたのパスワードも必要です。パスワードを忘れた学生は、所属学部の事務室に再発行を願い出てください。</li><li>3月26日～4月5日、9月25日～10月5日は、データ更新のため、証明書自動発行機の利用を停止します。この期間は、全ての証明書の申請を学生センター窓口で受け付けます。</li></ul><p>電話やメールによる申請はできませんが、郵送での申請は可能です。その場合、郵送にかかる日数も考慮して申請してください。詳しくは、お問い合わせください。<br>問い合わせ先：北山大学学生センター証明書係（041-295-8941）</p><div class=\"m13-sec\">▶ 問1のメモ</div><p>マイクさんのメモ：成績証明書／卒業見込証明書／健康診断証明書（書式は会社指定のもの）／調査書（書式は会社指定のもの）</p></div>"},{"source":"Mon13","bai":17,"date":"07/2018","title":"Mon13 - Bài 17 (07/2018)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"ナイニさんは1年を通じて花の世話をするボランティアに参加したいと考えている。参加するためには、どうしなければならないか。","options":["3月8日の1週間前までに申し込み、3月8日か9日の説明会に参加する。","3月8日の1週間前までに申し込み、3月15日と16日の説明会に参加する。","3月15日の1週間前までに申し込み、3月15日か16日の説明会に参加する。","3月15日の1週間前までに申し込み、3月15日と16日の説明会に参加する。"],"answer":2,"explain":"Đáp án đúng: C. Chăm hoa cả năm là tình nguyện viên ②, buổi giải thích 15/3 hoặc 16/3 (dự một trong hai ngày), hạn đăng ký là 1 tuần trước ngày đầu tiên (15/3)."},{"q":"フリオさんはボランティア①に参加し、さらに、ボランティア③の夏祭りのボランティアとしても参加するつもりだ。その場合、夏祭り当日にしなければならないこととして合っているのはどれか。","options":["イベント開始2時間前に公園に行く。","イベント開始2時間前に公園に行き、ボランティア登録費用50円を支払う。","イベント開始時間に公園に行く。","イベント開始時間に公園に行き、ボランティア登録費用50円を支払う。"],"answer":0,"explain":"Đáp án đúng: A. ③ tập trung trước giờ bắt đầu 2 tiếng. Người đã tham gia ① hoặc ② mà tham gia thêm ③ thì không phải trả phí đăng ký ③ (50 yên)."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">ふかみ農業公園の2019年度ボランティア募集</div><p>ふかみ農業公園では、野菜や花を育てたり、季節に応じたイベントを手伝ったりしてくださるボランティアを募集しています。</p><p>ボランティア①　畑に野菜の種をまいたり、草取りなどの農作業をしたりして、収穫までの作業を行います。<br>活動時間　●日時：2019年4月～翌3月　●毎週金曜10時～12時</p><p>ボランティア②　花を植えたり、草取りなどの花壇の整備をしたりします。<br>活動時間　●日時：2019年4月～翌3月　●毎週木曜10時～12時</p><p>ボランティア③　年3回のイベント（桜祭り、夏祭り、収穫祭）時に、公園内で収穫した野菜を売ったり、花を売ったりします。一つのイベントのみの参加も可能です。<br>活動日時：4月6日（桜祭り）、8月10日（夏祭り）、11月9日（収穫祭）　各イベント当日開始から片付けまで（開始2時間前に集合）</p><p>登録説明会（場所：ふかみ農業公園事務所2階会議室）<br>ボランティア①：2019年3月8日（金）、9日（土）※1　10時～11時<br>ボランティア②：2019年3月15日（金）、16日（土）※1　10時～11時<br>※1　必ずいずれかの日にご参加ください。<br>ボランティア③：なし</p><p>申し込み方法<br>以下を明記の上、はがき、Eメール、FAXのいずれかでお申し込みください。<br>ボランティア①、②：住所、氏名、年齢、電話番号、参加を希望するボランティア番号、登録説明会の参加希望日<br>ボランティア③：住所、氏名、年齢、電話番号、イベント名<br>締切：①、②は登録説明会開催日1日目の1週間前、③は各イベント実施日の1週間前必着</p><p>登録費用（保険料）　ボランティア①、②：300円　③：50円（各イベントにつき）※2<br>①、②にご参加の方は、活動初日にお支払いください。③にご参加の方は、イベント当日の集合時にお支払いください。<br>※2　①または②にご参加の方が③にも参加された場合、③の登録費用は必要ありません。</p><p>ふかみ農業公園　〒009-1527　山川市ふかみ1569<br>電話/FAX：031-849-1111　Eメール：bosyu@fukami-nogyo-koen.com</p></div>"},{"source":"Mon13","bai":28,"date":"12/2018","title":"Mon13 - Bài 28 (12/2018)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"サブリナさんは中橋区に住んでいる。「中橋自然の宿」に、国から遊びに来る友達と二人で泊まりに行こうと思っている。友達の年齢はサブリナさんと同じ24歳である。二人に適用される1泊の利用料金はどのようになるか。","options":["サブリナさんも友達も5300円","サブリナさん5300円、友達6000円","サブリナさん5300円、友達7300円","サブリナさんも友達も7300円"],"answer":1,"explain":"Đáp án đúng: B. Sabrina là cư dân quận nên 5.300 yên; bạn không phải cư dân nhưng đi cùng cư dân nên 6.000 yên."},{"q":"ムカジさんは中橋区にある会社で働いていて、10月1日に「中橋自然の宿」に泊まりたいと考えている。予約が申し込める期間はいつからいつまでで、区民料金で宿泊するためにしなければならないことは何か。","options":["4月1日から9月24日の間で、申し込み時に区民であることを証明できるものを提示する。","4月1日から9月24日の間で、宿泊時に区民であることを証明できるものを提示する。","4月1日から9月30日の間で、宿泊時に区民であることを証明できるものを提示する。","6月1日から9月24日の間で、申し込み時に区民であることを証明できるものを提示する。"],"answer":1,"explain":"Đáp án đúng: B. Làm việc ở công ty trong quận cũng là cư dân. Cư dân đăng ký từ 6 tháng trước (1/4) đến 1 tuần trước (24/9); chứng minh là cư dân khi lưu trú, không phải khi đăng ký."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">中橋区区民施設<br>中橋自然の宿・利用のご案内</div><p>大木山の麓にある「中橋自然の宿」は自然の中で過ごすことを目的に作られた宿泊施設です。</p><p>【利用料金表（税込）】</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>1名の利用料金（1泊2食付き）</th><th></th><th>大人（18歳以上）</th><th>子供（4～7歳）</th></tr></thead><tbody><tr><td>区民料金</td><td>区民の方</td><td>5300円</td><td>3300円</td></tr><tr><td>区民以外の方の料金</td><td>区民ではないが区民と一緒にご利用の方</td><td>6000円</td><td>3800円</td></tr><tr><td>区民以外の方の料金</td><td>区民ではない方</td><td>7300円</td><td>4300円</td></tr></tbody></table></div><p>＊3歳以下は無料です。（食事が必要な場合は2食1,000円になります）</p><p>【申し込み方法】<br>電話、ファクス、インターネットでお申し込みいただけます。</p><p>【申し込み受け付け期間】<br>区民の方<br>利用月の6か月前の1日から、宿泊希望日の1週間前まで<br>（例：10月1日の宿泊を希望の場合、4月1日から9月24日まで）<br>区民以外の方<br>利用月の4か月前の1日から、宿泊希望日の1週間前まで<br>（例：10月1日の宿泊を希望の場合、6月1日から9月24日まで）</p><p>申し込みの際には　①代表者の住所、氏名、電話番号、②利用人数（大人と子どもの各人数、各料金区分）、③希望する宿泊日、宿泊日数、④部屋数の希望　をお知らせください</p><p>【料金の支払い】<br>ご宿泊時にお支払いください。現金またはクレジットカードでのお支払いが可能です。区民料金適用には、宿泊時に、区民であることを証明できるもののご提示が必要です。<br>区民は、以下のa～cのいずれかに当てはまる方になります。<br>a. 中橋区にお住まいの方<br>b. 中橋区にある会社で仕事をしている方<br>c. 中橋区にある学校に通っている方</p><p>中橋区役所　施設課　自然の宿担当<br>電話：015-539-15150　ファクス：015-539-1516<br>http://www.nakahashi.lg.jp/shizennoyado</p></div>"},{"source":"Mon13","bai":29,"date":"07/2019","title":"Mon13 - Bài 29 (07/2019)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"ロンさんは、市内建築めぐり「江戸時代の建築」に参加したいと思っている。ロンさんが留意しなければならないことはどれか。","options":["開催日当日は、自身で直接見学先に向かわなければならない。","特別展の解説も聞きたい場合、開催日の前日までに連絡する必要がある。","受け付けは先着順のため、できるだけ早く申し込まなければならない。","参加が決まったら、開催日の1週間前までに参加費を支払う必要がある。"],"answer":3,"explain":"Đáp án đúng: D. Với mục A–C, phí tham gia phải trả trước ngày tổ chức 1 tuần. Tập trung tại bảo tàng 9:30; bình giảng triển lãm chỉ cần xin tại chỗ trong ngày; vượt quá số lượng thì bốc thăm, không theo thứ tự."},{"q":"アグネスさんは7月の特別講座「白船山遺跡発掘の歴史」の再募集に申し込もうと考えている。7月27日の回を希望しているが、どのように申し込まなければならないか。また、受講できることになった場合、受講料の支払いはどうすればよいか。","options":["7月24日までに電話で申し込み、当日1000円を会場で支払う。","7月24日までに電話で申し込み、当日1800円を会場で支払う。","7月27日まで　　　で申し込み、当日1000円を会場で支払う。","7月27日までに電話で申し込み、当日1800円を会場で支払う。"],"answer":0,"explain":"Đáp án đúng: A. D chỉ nhận qua điện thoại, hạn 3 ngày trước mỗi buổi (24/7). Chỉ dự 1 buổi nên 1.000 yên, trả tại chỗ."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">9月の県立歴史博物館　催し物のお知らせ</div><p>A　特別講座「古文書から青井市を知ろう」（全2回）<br>◇定員　各回50名　◇会場　2階　研修室1<br>◇日時　①9月7日（土）　②9月14日（土）　14:00～16:00<br>◇受講料　全2回1,800円　※1回のみの受講可、1回1,000円</p><p>B　体験教室「武士の茶道」<br>◇定員　20名　◇会場　茶室<br>◇日時　9月6日（金）9:50～12:00　◇参加費　500円</p><p>C　市内建築めぐり「江戸時代の建築」<br>◇定員　20名　◇見学先　旧杉下邸、旧前岩邸など<br>◇日時　9月1日（日）県立歴史博物館9:30集合。12:30頃戻り、解散。<br>◇参加費　1,500円<br>◇その他　14:00より、希望者を対象に、当館で開催中の特別展「江戸末期の建築」の解説を行います（約30分）。ご希望の方は当日お申し出ください。（別途、入館チケットをご購入ください。）</p><p>◆7月開催の特別講座再募集！<br>D　特別講座「白船山遺跡発掘の歴史」（全2回）<br>◇募集人数　各回若干名　◇会場　2階　研修室1<br>◇日時　①7月20日（土）　②7月27日（土）　14:00～16:00<br>◇受講料　全2回1,800円　※1回のみの受講可、1回1,000円</p><p>【申込方法】<br>A～C：往復はがきに住所・氏名・電話番号・希望する催し物名（複数回開催の催し物は希望回）を明記の上、下記宛先へお送りください。お申し込みが定員を超えた場合は抽選となります。<br>　締切：7月19日（金）必着<br>D：電話でのみ受け付けます。ご連絡の時点で定員に達していた場合、受講をお断りすることもございます。<br>　締切：各回の3日前</p><p>【受講料・参加費】<br>A、C：開催日の1週間前までにお支払いください。詳細は、お申し込みの結果をお知らせする返信はがきでご案内します。<br>B、D：当日会場にてお支払いください。</p><p>〒027-3351　青井市本町6-43　県立歴史博物館事務室企画普及課<br>お問合せ・お申込先：019-160-0224（平日8:30～17:00受付）</p></div>"},{"source":"Mon13","bai":30,"date":"12/2019","title":"Mon13 - Bài 30 (12/2019)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"この助成制度への応募に関して、留意しなければならないことはどれか。","options":["この助成金の交付を過去に一度も受けていない団体である必要がある","助成を受ける事業は決められた期間内に実施しなければならない","合計を30万円以内にすれば、複数の事業について応募できる","団体によるプレゼンテーションを1次選考の際に行わなければならない"],"answer":1,"explain":"Đáp án đúng: B. Dự án phải được thực hiện từ 1/4 đến 31/12/2020. Chỉ cần chưa nhận trợ cấp trong 3 năm gần đây (không phải chưa bao giờ); mỗi đoàn thể chỉ 1 dự án; thuyết trình ở vòng 2."},{"q":"ソンさんは十条市民による国際交流クラブの代表で、この助成制度に応募することにした。参加必須のもの以外は出るつもりはない。12月10日の説明会に参加できない場合、ソンさんの応募方法として合っているのはどれか。","options":["12月19日の説明会に参加し、提出書類を応募期間内にファクスで送る","12月19日の説明会に参加し、提出書類を応募期間内に着くように郵送する","12月19日の説明会と個別相談会に参加し、提出書類を応募期間内にメールで送る","12月19日の説明会と個別相談会に参加し、提出書類を応募期間内に窓口に提出する"],"answer":1,"explain":"Đáp án đúng: B. Phải dự một trong hai buổi giải thích (19/12 khi không đi được 10/12); buổi tư vấn riêng chỉ cho ai muốn. Nộp hồ sơ bằng bưu điện hoặc mang đến quầy, không nhận fax/mail."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">十条市国際交流事業助成制度<br>2020年度募集概要</div><table class=\"m13-t m13-kv\"><tr><th>趣旨</th><td>本制度は、市民が行う国際交流事業を市が助成し、国際交流を推進することを目的としています。</td></tr><tr><th>対象団体</th><td>国際交流活動を行う団体で、次のいずれにも該当する団体<br>・団体の主たる構成員が十条市民で、1年以上の活動実績があること<br>・過去3年以内に本助成金の交付を受けていないこと</td></tr><tr><th>対象事業</th><td>2020年4月1日から12月31日までの間に実施される事業で、「国際理解と国際協力」または「多文化共生社会の実現」に関するもの</td></tr><tr><th>助成額</th><td>1事業あたり30万円以内（1団体につき1事業のみ応募可）</td></tr><tr><th>提出書類</th><td>① 申請書　② 事業計画書<br>※当センターホームページよりダウンロードしてください。</td></tr><tr><th>応募方法</th><td>上記の書類を郵送していただくか、センター窓口に直接ご持参ください。（メール、ファクス不可）</td></tr><tr><th>応募期間</th><td>2020年1月10日（金）～1月28日（火）<br>※最終日必着（窓口持参は17時まで）</td></tr><tr><th>スケジュール</th><td>説明会<br>① 2019年12月10日（火）13:00～14:00<br>② 2019年12月19日（木）13:00～14:00<br>応募を希望する方は、①か②のいずれかに必ずご参加ください。（予約不要）<br><br>個別相談会<br>2019年12月11日（水）～12月25日（水）　30分程度<br>事業の内容等について担当職員が相談に応じます。（希望者のみ・要予約）<br><br>1次選考<br>書類審査。結果は2020年2月14日（金）までに応募者全員に書面で通知します。<br><br>2次選考<br>2020年3月7日（土）10:00～12:30<br>団体によるプレゼンテーションと、質疑応答<br><br>結果通知<br>2020年3月13日（金）までに2次選考参加者全員に書面で通知します。</td></tr><tr><th>お問い合わせ・送付先</th><td>〒614-3790　十条市西島2-21　十条市国際交流センター<br>国際交流事業助成担当　電話 0199-61-2257</td></tr></table></div>"},{"source":"Mon13","bai":31,"date":"12/2020","title":"Mon13 - Bài 31 (12/2020)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"ソン先生は、来月以降にクラスの学生15名を連れて、「B.工場見学」に行きたいと考えている。予約に関して、注意しなければならないことは何か。","options":["インターネットで行う場合は見学希望日の3日前まで、電話の場合は前日までにする。","インターネットでも電話でもいいが、見学希望日の7日前までにする。","電話で見学希望日の7日前までにする。","電話で見学希望日の前日までにする。"],"answer":2,"explain":"Đáp án đúng: C. Nhóm từ 10 người trở lên bắt buộc đặt qua điện thoại, trước ngày tham quan 7 ngày."},{"q":"マルコさんは友達と3人で「A.工場見学と陶芸体験」に行きたいと考えている。12月15日から21日の間の3人の空いている日時をメモにまとめたが、予約が入れられる日時はいつか。また、当日の見学についての注意事項として、あっているのはどれか。","options":["16日の14時と20日の9時。見学は16日はすべてできるが、20日は一部できない所がある。","18日の14時と20日の9時。見学は16日も20日も一部できない所がある。","20日の9時。見学は一部できない所がある。","20日の9時。見学はできない。"],"answer":2,"explain":"Đáp án đúng: C. Thời gian cả 3 người rảnh: 16/12 buổi chiều (14h) và buổi sáng 20/12. 14h ngày 16 chỉ còn ≤2 chỗ (△) nên 3 người không vào được; 20/12 lúc 9h còn chỗ (○). 20/12 là Chủ nhật nên một phần xưởng có thể không tham quan được."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">工場見学・陶芸体験のご案内</div><p>田原陶芸では、陶芸器の生地の製造から絵付けまでを見学したり、カップや茶碗作りを体験したりすることができます。ご自身がお作りになったものは、後日お送りいたします。</p><table class=\"m13-t m13-kv\"><tr><th>開始時間</th><td>① 9時　② 10時　③ 14時</td></tr><tr><th>所要時間</th><td>A. 工場見学と陶芸体験：約80分<br>B. 工場見学：約30分<br>注意：土、日、祝日は工場の一部ができない場合もございます。</td></tr><tr><th>予約方法</th><td>インターネット　http://tahara-togei/koji-kengaku/yoyaku/<br>電話番号　0731-92-3604（8:30～16:50）</td></tr><tr><th>休業日</th><td>年末年始、お盆</td></tr><tr><th>費用</th><td>工場見学：無料　陶芸体験：2000円（送料込み）</td></tr><tr><th>所在地</th><td>安見市西町5982</td></tr><tr><th>問い合わせ先</th><td>田原陶芸株式会社　工場見学、陶芸体験担当<br>電話 0731-92-3604（8:30～16:50）</td></tr></table><p>*1　インターネットのご予約は、見学希望日の3日前まで承っております。<br>*2　お電話でのご予約は、見学希望日の前日まで承っております。<br>以下のお客様に関しては、必ずお電話でご予約ください。準備等ございますので、見学希望日の七日前までにお申し込みをお願いします。<br>・10名以上の団体で利用されるお客様<br>・学校にかかわる活動で利用されるお客様</p><p>明日（12月15日）から一週間の予約状況　○予約可　△残り2名以下　×不可</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>15（火）</th><th>16（水）</th><th>17（木）</th><th>18（金）</th><th>19（土）</th><th>20（日）</th><th>21（月）</th></tr></thead><tbody><tr><td>① 9時</td><td>×</td><td>○</td><td>○</td><td>×</td><td>△</td><td>○</td><td>×</td></tr><tr><td>② 10時</td><td>△</td><td>×</td><td>×</td><td>○</td><td>×</td><td>×</td><td>×</td></tr><tr><td>③ 14時</td><td>△</td><td>△</td><td>○</td><td>○</td><td>×</td><td>○</td><td>△</td></tr></tbody></table></div><div class=\"m13-sec\">▶ 問2のメモ（空いている日時）</div><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>空いている日時</th></tr></thead><tbody><tr><td>ハヌルさん</td><td>16日午後のみ、20日午前のみ</td></tr><tr><td>アットさん</td><td>16日午後のみ、18日、19日午前のみ、20日、21日</td></tr><tr><td>マルコ</td><td>16日、19日午後のみ、20日、21日</td></tr></tbody></table></div></div>"},{"source":"Mon13","bai":32,"date":"07/2021","title":"Mon13 - Bài 32 (07/2021)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"会社員のイリヤさんは年間セット券を購入することにした。星山ホールで行われるシリーズで、40,000円以内のものがいい。そして、公演数ができるだけ多く、席種はランクが高いものがいいが、ランクより公演数を優先したい。イリヤさんはどの年間セット券を購入するか。","options":["①のA席","②のA席","③のS席","④のS席"],"answer":1,"explain":"Đáp án đúng: B. Hội trường Hoshiyama là series ② và ④. Trong 40.000 yên: ② hạng A (38.500 yên, 10 buổi) hoặc ④ hạng S (24.500 yên, 5 buổi). Ưu tiên số buổi diễn nên chọn ② hạng A."},{"q":"ススマンさんは「④特別公演」の年間セット券(A席)を持っている。来月10月23日の公演のチケットを「③名曲集公演」の10月30日の公演(A席)に振り替えたい。いつまでにチケットオフィスに電話しなければならないか。また、席が確保された場合、電話のあとどうしなければならないか。","options":["10月13日までに電話し、10月22日必着で振替元のチケットを郵送する。","10月13日までに電話し、10月22日必着で振替元のチケットを郵送し、当日窓口で支払いをする。","10月20日までに電話し、10月22日必着で振替元のチケットを郵送する。","10月20日までに電話し、10月22日必着で振替元のチケットを郵送し、当日窓口で支払いをする。"],"answer":0,"explain":"Đáp án đúng: A. Gọi điện trước ngày 23/10 mười ngày (13/10) và gửi vé gốc đến nơi trước 1 ngày (22/10). Cùng hạng A, giá mỗi buổi đều 3.850 yên (19.250/5 và 30.800/8) nên không phải trả chênh lệch."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">東月オーケストラ<br>年間セット券のご案内</div><p>東月オーケストラでは、お得に公演をお楽しみいただける年間セット券を販売しております。</p><p>【年間セット券の特典】<br>一般販売に比べ30％お得な料金です。<br>一般販売前に1シリーズの全チケットをセットで購入可能です。</p><p>【年間セット券の料金表】</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>シリーズ／席種</th><th>S席（4,900円）</th><th>A席（3,850円）</th><th>B席（3,150円）</th><th>学生席（1,050円）</th><th>公演数</th></tr></thead><tbody><tr><td>①定期公演A</td><td>49,000円</td><td>38,500円</td><td>31,500円</td><td>10,500円</td><td>10</td></tr><tr><td>②定期公演B</td><td>49,000円</td><td>38,500円</td><td>31,500円</td><td>10,500円</td><td>10</td></tr><tr><td>③名曲集公演</td><td>39,200円</td><td>30,800円</td><td>25,200円</td><td>8,400円</td><td>8</td></tr><tr><td>④特別公演</td><td>24,500円</td><td>19,250円</td><td>15,750円</td><td>5,250円</td><td>5</td></tr></tbody></table></div><p>①、③の会場は東風ホール、②、④の会場は星山ホールです。<br>①、④の日程、公演内容等の詳細はホームページをご覧ください。<br>各席種の（　）中の金額は、1公演当たりの料金となっています。</p><p>※チケットの振替<br>ご希望の公演に、同ランクの席種の空席がない場合、異なる席種への振替になります。<br>上のランクの席種に変更の場合は、1公演当たりの料金の差額をお支払いいただきます。<br>下のランクの席種に変更の場合は差額の返金はいたしません。</p><p>＜振替の方法＞<br>1. お電話で振替元と振替先の公演をチケットオフィスにお伝えください。お電話は振替元の公演の10日前までにお願いします。その場で空席を確認いたします。<br>2. お席が確保できた場合、振替元の公演の前日必着で振替元のチケットをチケットオフィスにご郵送ください。<br>3. 振替先のチケットは公演当日に窓口でお渡しいたします。席種の変更により差額が生じる場合は、お支払いも同時にお願いします。</p><p>【お申し込み方法】<br>下記ホームページ、郵送、FAXでお申し込みください。<br>東月オーケストラチケットオフィス　155-6547　東月市星山3-14-1<br>電話、FAX 081-560-2257　http://toutuki-okesutora.jp</p></div>"},{"source":"Mon13","bai":18,"date":"12/2021","title":"Mon13 - Bài 18 (12/2021)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"正南大学3年生のヤンさんは、研究発表の練習のために教室を借りたいと思っている。7名が参加予定で、机が動かせる教室がいい。大学のプロジェクターを2台使う予定である。ヤンさんの希望に合う教室はどこか。また、書類は何を提出しなければならないか。","options":["③か④の教室で、③の場合はCとDを、④の場合はCを提出する。","③か④の教室で、どちらの教室を借りる場合もCとDを提出する。","④の教室だけで、CとDを提出する。","④の教室だけで、Cを提出する。"],"answer":1,"explain":"Đáp án đúng: B. Bàn di chuyển được là ③ và ④. ③ không có máy chiếu và ④ chỉ có 1 máy; dùng 2 máy thì phải mượn thêm, nên cả hai trường hợp đều nộp C (đơn dùng phòng) và D (đơn mượn thiết bị)."},{"q":"正南大学留学生会は、参加者が100名以上見込まれるスピーチ大会のために「正南ホール」を使用したいと思っている。備え付け以外の備品を追加で借りる必要はない。留学生会が最後にホールを使用したのは2年前である。どのように手続きを進めなければならないか。","options":["AとBを使用希望日の3か月前までに提出する。学生課で説明を受ける必要はない。","AとBを使用希望日の3か月前までに提出する。学生課で説明を受ける必要がある。","Aを使用希望日の3か月前までに、Bを2か月前までに提出する。学生課で説明を受ける必要はない。","Aを使用希望日の3か月前までに、Bを2か月前までに提出する。学生課で説明を受ける必要がある。"],"answer":1,"explain":"Đáp án đúng: B. 50 người trở lên cần A (3 tháng trước), dùng hội trường cần B (2 tháng trước), nhưng khi cần nhiều giấy thì theo hạn sớm nhất (3 tháng). Lần cuối dùng đã 2 năm (quá 1 năm) nên phải nghe giải thích ở phòng sinh viên."}],"html":"<div class=\"m13doc\"><p>正南大学 ＞ 在学生向け ＞ 施設の使用について ＞ 教室、正南ホールの使用について</p><div class=\"m13-h\">教室、正南ホールの使用について</div><p>在学生・大学公認の団体は、勉強会や練習等で教室やホールを使用することができます（営利目的は不可）。<br>利用の可否は、書類の提出後に施設管理委員会が決定します。</p><p>＜教室の使用＞<br>・申請可能な教室一覧</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>施設</th><th>机・いす</th><th>定員</th><th>備え付けのプロジェクター、スクリーン</th></tr></thead><tbody><tr><td>①</td><td>中教室102～106</td><td>固定</td><td>50名</td><td>×</td></tr><tr><td>②</td><td>中教室202～206</td><td>固定</td><td>50名</td><td>○【各教室1台】</td></tr><tr><td>③</td><td>中教室302～306</td><td>移動可</td><td>50名</td><td>×</td></tr><tr><td>④</td><td>小教室401～410</td><td>移動可</td><td>20名</td><td>○【各教室1台】</td></tr></tbody></table></div><p>※備え付けのプロジェクター、スクリーンがない教室でこれらを使用したい場合や2台以上使用したい場合は、学生課で借りられます。</p><p>＜正南ホールの使用＞<br>・申請前に、代表者が学生課でホール使用に関する説明を受けてください。ただし、1年以内にホールを使用したことのある場合は必要ありません。<br>・設備についての詳細は、「正南ホールについて」のページを参照してください。<br>・提出書類一覧（提出先：学生課）<br>・一つの企画に複数の書類の提出が必要な場合は、提出期限の最も早い書類に合わせ、まとめて提出してください。</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>種類</th><th>必要な場合</th><th>提出期限</th></tr></thead><tbody><tr><td>A</td><td>イベント開催申請書</td><td>参加者50名以上が見込まれるイベントを開催する。</td><td>3か月前</td></tr><tr><td>B</td><td>ホール使用申請書</td><td>正南ホールを使用する。</td><td>2か月前</td></tr><tr><td>C</td><td>教室使用申請書</td><td>教室を使用する。</td><td>7日前</td></tr><tr><td>D</td><td>備品借用申請書</td><td>備え付け以外の備品を追加で借りる。</td><td></td></tr></tbody></table></div></div>"},{"source":"Mon13","bai":19,"date":"07/2022","title":"Mon13 - Bài 19 (07/2022)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"ジェシカさんは、9月に受講料9,000円のビジネスマナー講座を、10月に受講料27,000円のプレゼン講座を受講する。ジェシカさんが会社から受けられる補助は、いくらになるか。","options":["9,000円と10,000円","9,000円と27,000円","10,000円と10,000円","10,000円"],"answer":0,"explain":"Đáp án đúng: A. Cả hai đều dưới 30.000 yên nên dùng loại B (tối đa 2 khóa). Khóa dưới 10.000 yên được hỗ trợ đúng phí thực tế (9.000), khóa còn lại được 10.000 yên. Không được dùng cả A lẫn B."},{"q":"森田さんは、2月20日にビジネス文書講座を受講する。受講料補助の申請はどうしなければならないか。","options":["2月15日までに①〜④を人事課に提出する。","2月15日までに①を、3月10日までに②〜④を人事課に提出する。","2月15日までに①を、3月31日までに②〜④を人事課に提出する。","3月10日までに①〜④を人事課に提出する。"],"answer":1,"explain":"Đáp án đúng: B. Hạn nộp là 15/2/2023 nhưng khóa học diễn ra ngày 20/2. Khi không kịp nộp đủ thì nộp trước ① đúng hạn, các giấy tờ còn lại nộp đến 10/3; tiền hỗ trợ chuyển ngày 31/3."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">2022年度<br>外部講座の受講料補助について</div><p>社員の業務能力向上を目的として、社外で受講する外部講座の受講料を補助します。</p><p>1. 対象の講座<br>・2022年4月1日から2023年2月28日までに行われる、業務と関連がある講座が対象です。業務との関連については、受講料補助申請書に記入してください。<br>・昨年度の補助対象講座例：ビジネスマナー講座、プレゼン講座、ビジネス文書講座等</p><p>2. 補助金額<br>・講座受講料の補助の申請は、以下のAかBで行ってください（同年度内にAとBの両方で申請することはできません）。</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>一つの講座の受講料</th><th>補助金額</th><th>補助申請可能な講座数（年度につき）</th></tr></thead><tbody><tr><td>A</td><td>30,000円以上</td><td>25,000円</td><td>1講座</td></tr><tr><td>B</td><td>30,000円未満</td><td>10,000円*</td><td>2講座</td></tr></tbody></table></div><p>*講座の受講料が1万円未満の場合、受講料の実費を支給します。</p><p>3. 申請書類と補助金の支払い<br>・補助金額分は、立て替え払いになります。<br>・以下の書類を、受講後にまとめて、人事課にご提出ください。Bで二つの講座を受講する場合は、講座ごとに書類を分けて提出してもかまいません。<br>　①受講料補助申請書（人事課ウェブページよりダウンロード）<br>　②受講料の領収書<br>　③講座に出席したことを証明する書類（講座修了証等）<br>　④講座の内容が書かれた資料（パンフレット等）<br>・補助金は、各月の15日までに書類を提出した場合、翌月末日に振り込みます。16日以降に提出した場合は、2か月後の末日となります。<br>・申請書類提出締め切り：2023年2月15日</p><p>提出締め切りまでに書類をまとめて提出できない場合、①のみ先に提出締め切りまでに提出し、他の書類については、3月10日までにご提出ください。補助金は、3月31日に振り込みます。</p><p>提出・問い合わせ先：人事課　平川（内線3210）</p></div>"},{"source":"Mon13","bai":20,"date":"12/2022","title":"Mon13 - Bài 20 (12/2022)","passage":"","note":"✅ Đáp án đã đối chiếu với đáp án chính thức. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"次の4人は、星川大学の大学院に在学中で、以下の研究活動を行いたいと思っている。「グローバル研究活動助成」に応募できるのは誰か。","options":["西田さん","ダリアさん","ラワンさん","山本さん"],"answer":2,"explain":"Đáp án đúng: C. Đối tượng: chưa được chọn năm 2021; hoạt động là điều tra ở nước ngoài từ 10 ngày trở lên hoặc phát biểu nghiên cứu. Nishida chỉ nghe thuyết trình; Daria đi 3 ngày; Yamamoto đã được chọn 2021; Rawan phát biểu và chỉ được chọn năm 2020 nên đạt."},{"q":"応募に関して、留意しなければならないことは何か。","options":["指導教員から研究推進課窓口に提出してもらわなければならない書類がある。","研究活動が発表か調査かによって、提出しなければならない書類の種類が異なる。","記入用紙は、5月10日までに研究推進課窓口に取りに行かなければならない。","研究発表の場合、発表を行うことが確定していないと応募ができない。"],"answer":1,"explain":"Đáp án đúng: B. Giấy C (bản sao đơn đăng ký phát biểu) chỉ cần với trường hợp ②. Thư tiến cử do sinh viên tự nộp; mẫu phát từ 26/4; chưa xác định phát biểu vẫn được đăng ký."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">星川大学<br>2022年度「グローバル研究活動助成」募集要項</div><p>1. 応募資格（以下の条件を満たす者）<br>2022年度に星川大学の大学院に在学していて、2021年度に本助成に採択されていない者</p><p>2. 対象となる研究活動（以下の①または②に当てはまる活動）<br>① 渡航期間10日間以上で、海外において調査を行う。<br>② 海外での研究会議、シンポジウム等で研究発表を行う（渡航期間は問わない）。</p><p>3. 対象となる研究活動の実施期間<br>①②ともに2022年8月1日から2023年3月31日までに行うもの</p><p>4. 助成金額等<br>一人あたりの助成金額の上限は20万円とします。応募は一人1件のみ可能です。助成対象の費目の詳細は別紙を参照してください。</p><p>5. 選考<br>書類による選考</p><p>6. スケジュール<br>募集期間：2022年5月10日（火）～6月10日（金）<br>結果通知：2022年7月中旬</p><p>7. 応募手続き<br>以下のA～Cを研究推進課窓口へまとめて提出してください。<br>A 申請書（様式1）<br>B 推薦書（様式2）<br>…指導教員が作成したものを学生本人が提出すること。作成依頼は余裕をもってするようにしてください。<br>C 発表申し込みの写し（②の場合のみ）<br>…申し込みの開始が募集期間後になる場合は、準備ができ次第提出すること。<br>・AとBの記入用紙は4月26日から募集期間の最終日まで研究推進課窓口で配布します。研究推進課のウェブページからダウンロードもできます。<br>・②で発表が確定していない場合でも応募することができます。その旨をAに記入のうえ、必ず募集期間内にAとBを提出してください。また、実際に発表するかどうかが決まり次第、速やかに連絡してください。</p><p>8. 採択後の注意事項<br>報告書と経費の領収書を帰国後2週間以内に提出してもらいます。未提出の書類があった場合は採択を取り消す可能性があります。</p><p>問い合わせ先：研究推進課<br>電話：061-625-9398　Eメール：graduate-research@hoshikawa.ac.jp</p><div class=\"m13-sec\">▶ 問1の表</div><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>名前</th><th>研究活動</th><th>渡航期間</th><th>この助成の採択歴</th></tr></thead><tbody><tr><td>西田さん</td><td>海外のシンポジウムで講演を聞く</td><td>2022年8月24日から3日間</td><td>なし</td></tr><tr><td>ダリアさん</td><td>海外に渡航し、資料の収集や調査を行う</td><td>2023年1月18日から3日間</td><td>なし</td></tr><tr><td>ラワンさん</td><td>海外で研究発表を行う</td><td>2023年2月20日から5日間</td><td>2020年度にあり</td></tr><tr><td>山本さん</td><td>海外に渡航し、調査を行う</td><td>2022年8月20日から12日間</td><td>2021年度にあり</td></tr></tbody></table></div></div>"},{"source":"Mon13","bai":21,"date":"07/2023","title":"Mon13 - Bài 21 (07/2023)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"次の4人は今年の4月に、運動教室を受講したいと考えている。この中で、この教室を受講できる人は誰か。","options":["ダニエルさん","木村さん","大川さん","チェさん"],"answer":1,"explain":"Đáp án đúng: B. Cần ở hoặc làm việc trong thành phố, từ 18 tuổi, và đã đo thể lực trong 1 năm gần đây. Daniel đo cách đây hơn 1 năm; Okawa 16 tuổi; Chê mới đo vào tháng 5; Kimura làm việc trong thành phố và đo tháng 10 năm ngoái nên đạt."},{"q":"シャヒンさんは、来週の「ダンスA」を予約したが、空きがあれば来週の「体操」も追加予約したいと考えている。どうすればいいか。","options":["来週の月曜日以降に窓口か電話で空きを確認し、空きがあれば、窓口で予約する。","来週の月曜日以降に窓口か電話で空きを確認し、空きがあれば、予約機か電話で予約する。","来週の水曜日以降に窓口か電話で空きを確認し、空きがあれば、窓口で予約する。","来週の水曜日以降に窓口か電話で空きを確認し、空きがあれば、予約機か電話で予約する。"],"answer":3,"explain":"Đáp án đúng: D. Đặt thêm chỉ được trong 2 ngày trước buổi học còn chỗ; thể dục là thứ Sáu nên xác nhận từ thứ Tư. Người đã từng đặt rồi thì đặt bằng máy đặt chỗ hoặc điện thoại (chỉ lần đầu mới ra quầy)."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">木原市健康づくりセンター<br>いきいき運動教室のご案内</div><p>健康のために、楽しく運動しませんか。健康づくりセンターでは、三つのクラスを毎週開講しています（通年開講）。1回ごとの予約制なので、ご自分のペースで受講ができます。</p><p>【対象】<br>・下の①②両方に当てはまる方<br>①市内在住、もしくは市内で勤務している、18歳以上の方<br>②健康づくりセンターの健康度測定を、受講日から過去1年以内に受けた方<br>※健康度測定の内容や予約方法等の詳細は、ホームページでご確認ください。</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>曜日</th><th>クラス名</th><th>内容</th></tr></thead><tbody><tr><td>水曜日</td><td>ダンスA</td><td>初心者でもできるゆっくりしたダンスをします。</td></tr><tr><td>木曜日</td><td>ダンスB</td><td>リズムに合わせて速く動くダンスをします。</td></tr><tr><td>金曜日</td><td>体操</td><td>全身を使った体操をします。</td></tr></tbody></table></div><p>＜時間＞10:40～12:00　＜会場＞第一運動室　＜料金＞1回500円</p><p>【利用方法】<br>◆予約の仕組み<br>・申し込みは各クラス毎回必要で、先着順です（各クラス定員20名）。<br>・予約の種類は、基本予約と追加予約があります。<br>＋基本予約：すべてのクラスの中から週に1回分だけ予約できます。基本予約は、受講日の前の週から可能です。<br>＋追加予約：実施日の2日前に定員に達していないクラスに限り、基本予約1回分のほかに追加予約ができます。追加予約が可能な回数は週1回のみです。空きは2日前から、健康づくりセンター窓口か電話で確認できます。<br>◆予約方法<br>・いきいき運動教室の予約が初めての方は、健康度測定の結果票をお持ちになり、窓口で予約してください。受講者カードを作ります。<br>・予約が2回目以降の方は、健康づくりセンターにある予約機か電話でしてください。<br>◆料金の支払い<br>・受講日当日に、自動受付支払機で料金を支払ってください（受講者カードが必要です。忘れた方は窓口で対応します）。</p><p>木原市健康づくりセンター　電話：02-1124-45</p><div class=\"m13-sec\">▶ 問1の表</div><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th>名前</th><th>年齢</th><th>住んでいる所</th><th>勤務地</th><th>健康度測定</th></tr></thead><tbody><tr><td>ダニエルさん</td><td>54歳</td><td>木原市内</td><td>木原市外</td><td>去年の1月に受けた</td></tr><tr><td>木村さん</td><td>34歳</td><td>木原市外</td><td>木原市内</td><td>去年の10月に受けた</td></tr><tr><td>大川さん</td><td>16歳</td><td>木原市内</td><td>なし</td><td>今年の2月に受けた</td></tr><tr><td>チェさん</td><td>27歳</td><td>木原市内</td><td>木原市内</td><td>今年の5月に受ける予定</td></tr></tbody></table></div></div>"},{"source":"Mon13","bai":22,"date":"12/2023","title":"Mon13 - Bài 22 (12/2023)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"チョウさんは、机1台を買い取ってもらいたいと思っている。机は、重さが12kgで、三辺の合計が220cmである。チョウさんが利用できる方法はどれか。","options":["店頭買取か出張買取か宅配買取","店頭買取か出張買取","店頭買取か宅配買取","店頭買取"],"answer":3,"explain":"Đáp án đúng: D. Thu mua tại nhà phải từ 2 món trở lên; thu mua gửi chuyển phát giới hạn 25kg và tổng 3 cạnh ≤160cm (cái bàn 220cm quá cỡ). Chỉ còn mang đến cửa hàng."},{"q":"森村さんは、ギター（重さ5kg、三辺の合計150cm）と自転車（重さ10kg、三辺の合計160cm）をまとめて買い取ってもらいたいと思っているが、店頭に自分で持っていかずに済む方法がいい。森村さんが利用できる方法はどれで、何を準備しなければならないか。","options":["宅配買取で、品物と顔写真付きの本人確認書類のコピーを準備する。","宅配買取で、品物と本人確認書類のコピーを準備する。本人確認書類は、顔写真付きでなくてもいい。","出張買取で、品物と顔写真付きの本人確認書類を準備する。","出張買取で、品物と本人確認書類を準備する。本人確認書類は、顔写真付きでなくてもいい。"],"answer":2,"explain":"Đáp án đúng: C. Xe đạp không dùng được thu mua gửi chuyển phát nên chọn thu mua tại nhà (2 món nên được). Có xe đạp nên giấy tờ tùy thân phải có ảnh."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">マスダ買い取りサービス<br>買い取りサービスのご利用について</div><p>◆買い取り可能な品物<br>冷蔵庫などの家電、机などの家具、自転車、楽器を受け付けています。詳しくは、「買い取り可能な品物」のページをご確認ください。</p><p>◆買い取り方法と流れ</p><table class=\"m13-t m13-kv\"><tr><th>店頭買取</th><td>① 店頭へお持ちください。<br>② 品物を確認し、買い取り金額をご提示します。<br>③ ご納得いただけた場合は、現金をお渡しします。</td></tr><tr><th>出張買取</th><td>① 最寄りの店舗にお電話ください。<br>② 弊社スタッフがご自宅へ伺います。<br>③ ご自宅で品物を確認し、買い取り金額をご提示します。<br>④ ご納得いただけた場合は、現金をお渡しします。</td></tr><tr><th>宅配買取</th><td>① ホームページからご予約ください。<br>② 宅配業者が伺いますので、品物をお渡しください。<br>③ 店舗への品物到着から3営業日以内に、買い取り金額をメールでご連絡します。ご納得いただけた場合は、銀行口座へお振り込みします。</td></tr></table><p>※買い取り金額にご納得いただけずキャンセルされる場合でも、出張料や返送料はかかりません。</p><p>◆受け付け可能な品数とサイズ</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>受け付け可能な品数</th><th>1点あたりのサイズ制限</th></tr></thead><tbody><tr><td>店頭買取</td><td>1点から</td><td>なし</td></tr><tr><td>出張買取</td><td>2点から</td><td>なし</td></tr><tr><td>宅配買取</td><td>1点から</td><td>25kg以下で、かつ三辺（縦・横・高さ）の合計が160cm以下のもの（自転車の場合、サイズ内でも宅配買取は利用できません）</td></tr></tbody></table></div><p>◆ご本人確認について<br>店頭買取、出張買取の場合、本人確認書類（運転免許証等）をご提示いただきます。宅配買取の場合は、品物と一緒にコピーをお送りいただきます。家電、家具、楽器の場合は、顔写真のない本人確認書類もご利用になれますが、自転車の場合は、顔写真付きのものをご用意ください。</p></div>"},{"source":"Mon13","bai":23,"date":"07/2024","title":"Mon13 - Bài 23 (07/2024)","passage":"","note":"ℹ️ Nguồn tài liệu không kèm đáp án nên đáp án do Claude giải từ nội dung đề; đã kiểm với 6 kỳ có đáp án chính thức (07/2010, 07/2011, 12/2012, 12/2016, 12/2022, 12/2024) — khớp 12/12 câu. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"マリーさんは秋川大学で本を借りるために、図書館利用カードを作ろうと思っている。今日は金曜日である。明日の夜までに本を借りたいが、図書館利用カードは、どのように申請しなければならないか。","options":["今日、中央図書館か文学部図書館で9時から17時までの間に申請する。","今日、中央図書館で9時から17時までの間に申請する。文学部図書館では申請できない。","今日、中央図書館か文学部図書館で9時から17時までの間に申請するか、明日、中央図書館で9時から17時までの間に申請する。","今日か明日、中央図書館か文学部図書館で9時から17時までの間に申請する。"],"answer":0,"explain":"Đáp án đúng: A. Thẻ chỉ được cấp trong ngày nếu nộp đơn vào ngày thường 9–17h; nộp thứ Bảy thì phải đợi ngày thường kế tiếp. Hôm nay là thứ Sáu nên cả hai thư viện đều tiếp nhận."},{"q":"カイさんは、研究のために資料を借りたり複写したりする必要があって、秋川大学の文学部図書館に来た。図書館利用カードは持っている。今日は、授業期間の火曜日である。貸し出しと複写は、何時まで可能か。","options":["貸し出しは18時の15分前まで、複写は18時まで可能である。","貸し出しは21時の15分前まで、複写は21時まで可能である。","貸し出しは21時の15分前まで、複写は21時の10分前まで可能である。","貸し出しは21時の30分前まで、複写は21時の10分前まで可能である。"],"answer":1,"explain":"Đáp án đúng: B. Khoa Văn trong kỳ học đóng cửa 21:00 ngày thường; mượn sách đến trước giờ đóng 15 phút, photocopy đến khi đóng cửa."}],"html":"<div class=\"m13doc\"><p>秋川大学 ＞ 秋川大学図書館 ＞ 一般利用</p><div class=\"m13-h\">一般の方の図書館利用について</div><p>秋川大学の学生以外の一般の方も、研究等の目的のために、秋川キャンパスにある中央図書館と文学部図書館の資料が利用できます。</p><p>【入館方法】<br>・図書館利用カードをお持ちの方は、自動入退館ゲートから入退館ができます。<br>・お持ちでない方は、カウンターで一日入館証を発行いたします。</p><p>【図書館利用カードについて】<br>・図書館利用カードは、図書館資料の貸し出しの際に必要になります。<br>・発行をご希望の方は、身分証明書をお持ちになり、中央図書館、または文学部図書館のカウンターにお越しください（文学部図書館では平日のみ受け付けています）。<br>・平日の9時から17時までの間に申請を受け付けた場合、その日のうちにカードをお渡しします。平日の17時以降、および土日祝に受け付けた場合は、次の平日開館日以降にお渡しします。</p><p>【貸し出しと返却】<br>・貸し出し冊数は5冊まで、貸し出し期間は2週間です。<br>・中央図書館の貸し出し受付時間は閉館30分前まで、文学部図書館は閉館15分前までです。<br>・開館時の返却は、カウンターで受け付けています。閉館・休館時は、ブックポストに入れてください。</p><p>【資料の複写】<br>・館内の複写機で、図書館資料の複写ができます。<br>・複写機は、中央図書館は閉館10分前まで、文学部図書館は閉館時間まで利用できます。</p><p>【開館時間】</p><div class=\"m13-tw\"><table class=\"m13-t\"><thead><tr><th></th><th>期間※</th><th>平日</th><th>土曜・日曜</th></tr></thead><tbody><tr><td>中央図書館</td><td>授業期間</td><td>9:00～22:00</td><td>9:00～17:00</td></tr><tr><td>中央図書館</td><td>夏休み・春休み期間</td><td>9:00～19:00</td><td>休館</td></tr><tr><td>文学部図書館</td><td>授業期間</td><td>9:00～21:00</td><td>9:00～17:00</td></tr><tr><td>文学部図書館</td><td>夏休み・春休み期間</td><td>9:00～18:00</td><td>休館</td></tr></tbody></table></div><p>※各期間の具体的な日程は、開館カレンダーのページをご覧ください。</p></div>"},{"source":"Mon13","bai":24,"date":"12/2024","title":"Mon13 - Bài 24 (12/2024)","passage":"","note":"✅ Đáp án đã đối chiếu với đáp án chính thức. Nội dung đề do em gõ lại từ đề gốc.","questions":[{"q":"サイさんは、9月4日から7日までボランティア活動を行ったので、9月中に助成金を申請しようと考えている。交通費と宿泊費を計算してメモにまとめたが、申請が認められた場合、サイさんに支給される助成金はいくらになるか。（サイさんのメモ：交通費12,000円　宿泊費7,000円を3泊分）","options":["交通10,000円と、宿泊6,000円を2泊分。","交通10,000円と、宿泊6,000円を3泊分。","交通12,000円と、宿泊7,000円を2泊分。","交通12,000円と、宿泊7,000円を3泊分。"],"answer":0,"explain":"Đáp án đúng: A. Phí đi lại tối đa 10.000 yên/lần; tiền ngủ tối đa 6.000 yên/đêm, chỉ tính tối đa 2 đêm."},{"q":"ジムさんは、1月10日に日帰りでボランティア活動を行う予定である。助成金を申請したいと考えているが、活動終了後に必ず提出しなければならないものは何で、いつまでに提出しなければならないか。","options":["AとBとCで、3月10日までに提出する。","AとBとCで、3月24日までに提出する。","AとBとCとDで、3月10日までに提出する。","AとBとCとDで、3月24日までに提出する。"],"answer":0,"explain":"Đáp án đúng: A. Đi về trong ngày không có tiền ngủ nên không bắt buộc biên lai D. Hạn là trong 2 tháng sau khi kết thúc (10/3), sớm hơn hạn cuối năm 24/3."}],"html":"<div class=\"m13doc\"><div class=\"m13-h\">ボランティア活動助成金　申請要項</div><p>緑川大学では、国内各地でボランティア活動に参加する学生に対して、費用の一部を助成する制度を設けています。</p><p>1. 助成対象者<br>緑川大学の学部生と大学院生</p><p>2. 助成対象となる活動<br>公的団体が主催するボランティア活動</p><p>3. 助成対象となる費用、助成が受けられる金額と回数<br>（1）費用　ボランティア活動のために支出される交通費と宿泊費<br>（2）金額<br>　● 交通費：1回の活動につき、10,000円を上限として実費を支給します。<br>　● 宿泊費：1回の活動につき、1泊あたり6,000円を上限として実費を支給します。2泊分までを支給対象とします。<br>（3）回数　年度中2回まで</p><p>4. 申請方法（A～Cの書類の様式はホームページからダウンロード可）<br>活動終了後2か月以内に以下の書類をボランティアセンターに提出してください。ただし、年度内最終提出期限は3月24日（厳守）とします。<br>A：ボランティア活動助成金申請書<br>B：ボランティア活動助成金振込口座届<br>C：ボランティア活動証明書（受け入れ先の様式も可）<br>D：領収書 ※<br>※宿泊費の領収書は必ず提出してください。交通費の領収書は入手が可能な場合は提出してください。交通費の領収書が入手できない場合は、実際にかかった金額をAに記入してください。</p><p>5. 助成金振込<br>審査を行い、申請が認められた場合は、書類提出があった翌月の月末に振り込みます（書類に不備があった場合、振り込みが遅れる場合があります）。</p><p>6. その他<br>「A：ボランティア活動助成金申請書」の「活動に参加した感想」をボランティアセンターのホームページで紹介することがあります。</p><p>7. 問い合わせ先<br>緑川大学ボランティアセンター（3号館1階）<br>月～金曜日　9:00～17:00<br>電話：083-747-8688</p><div class=\"m13-sec\">▶ 問1のメモ</div><p>サイさんのメモ：交通費 12,000円　宿泊費 7,000円を3泊分</p></div>"},{"source":"Mon13","bai":25,"date":"07/2026","title":"Mon13 - Bài 25 (07/2026)","passage":"野木市あおぞらフリーマーケット 出店者募集\nフリーマーケットで、手作りの作品や不要になった日用品などを売ってみませんか。\n\n＜開催要領＞\n・日時：10月24日（土）・25日（日）10時〜16時\n・①手作りマーケット：会場 春島公園／販売できる物 手作りの作品（飲食物は不可）／募集 20組／スペース 1.5m×1.5m\n・②リサイクルマーケット：会場 ひがし大通り／販売できる物 家庭で不要になった日用品、本、衣類など／募集 30組／スペース 2m×2m\n・出店料（1日のみ）1,000円\n・出店料（2日間）同じマーケットに出店する場合は1,600円、異なるマーケットに出店する場合は2,000円\n※学生応援割引：野木市在住または在学の学生で①に出店する方には割引があります。①への出店が1日のみの場合は300円、2日の場合は500円割引します。\n＜出店資格＞18歳以上の方\n＜応募方法＞「出店申込書」（ホームページからダウンロード、または野木市役所で入手可）に記入し、8月31日（月）必着で郵送またはご持参ください。\n＜出店場所抽選会および出店料の支払い＞9月12日（土）13時〜 市役所ホール\n・各会場内の出店場所の抽選を行います。その際に出店料もお支払いいただきます。\n・参加できない場合は、実行委員が代理で抽選を行います。出店当日案内所内で9時半までに出店場所をご確認のうえ、出店料をお支払いください。\n＜出店当日＞\n・①の会場は朝8時、②の会場は8時半から入ることができます。遅くとも9時45分までには入場してください。10時に販売開始となります。\n＜その他＞\n・机、シートなどにご持参ください。\n・雨天で中止する場合は、前日17時までにホームページにお知らせを掲載します。","note":"✅ Đáp án đã đối chiếu với đáp án chính thức.","questions":[{"q":"野木市に住む大学生のラマルさんは、フリーマーケットで、1日目は手作りのアクセサリーを、2日目は不要な日用品を売りたいと考えている。ラマルさんの支払う出店料はいくらになるか。","options":["1,600円から300円を割引した金額","2,000円から300円を割引した金額","2,000円から500円を割引した金額","2,000円"],"answer":1,"explain":"Đáp án đúng: B."},{"q":"会社員のモギさんは、不要な日用品を売るために、日曜日にこのフリーマーケットに出店したいと考えている。出店場所の抽選会には参加する。出店当日の朝、イナさんが現地でしなければならないことは何か。","options":["8時以降に会場に入り、9時半までに案内所で出店場所を聞いて出店料を支払う。","8時から9時45分までの間に会場に入る。出店料を支払う必要はない。","8時半以降に会場に入り、9時半までに案内所で出店場所を聞いて出店料を支払う。","8時半から9時45分までの間に会場に入る。出店料を支払う必要はない。"],"answer":3,"explain":"Đáp án đúng: D."}]},{"source":"Mon13","bai":27,"date":"12/2025","title":"Mon13 - Bài 27 (12/2025)","passage":"宅配クリーニング「ピース」 ご利用案内\nインターネットで注文して、バッグに衣類を詰めて送るだけ。日本全国どこからでもご利用いただけます。\n\n＜ご利用の流れ＞\n①ホームページの注文用フォームからご注文ください（初回は会員登録が必要です）。\n②ご注文後、発送用バッグをお送りします。ご自宅にある段ボールや袋を使っていただいても構いません。衣類を詰め、指定の宅配会社に集荷を依頼し、ご発送ください。\n③クリーニング済みの衣類を宅配でご自宅にお届けいたします。\n\n＜会員種別＞\n特別会員か普通会員がお選びいただけます。特別会員は、送料の優遇があり、短い日数でのお届けが可能です。特別会員は年会費3,000円、普通会員は年会費無料でご利用いただけます。\n\n＜クリーニング基本料金＞\nコート 2,500円／セーター 800円／ジャケット 1,300円／ワンピース 1,500円／ワイシャツ 400円／着物 5,000円〜\n・初回は、会員種別を問わず上記基本料金の30%引きのお値段でご利用いただけます。\n・上記以外の衣類の取り扱いと料金については、ホームページをご確認ください。\n\n＜送料（往復）＞\n特別会員：クリーニング基本料金の合計が3,000円以上の場合は無料、3,000円未満の場合は2,000円。初回は、クリーニング基本料金にかかわらず、送料無料。\n普通会員：クリーニング基本料金の合計が8,000円以上の場合は無料、8,000円未満の場合は2,000円。\n\n＜お客様のご発送の日からお届けまでの日数（東京都にお住まいの場合）＞\n会員種別と、お客様のご発送の時間帯によって異なります。\n16時までのご発送：特別会員 3日後／普通会員 6日後\n16時以降のご発送：特別会員 4日後／普通会員 7日後\n着物の場合は上記に5日加えた日数になります。その他の衣類と一緒にご注文の場合、着物のクリーニングが終わったあとで、まとめてのお届けになります。\n※東京都以外の地域の日数は、ホームページをご確認ください。\n\n宅配クリーニング「ピース」　〒149-8547 東京都横山市村北1-9-13　電話：069-689-7956","note":"✅ Đáp án đã đối chiếu với đáp án chính thức.","questions":[{"q":"モギさんは、コートとワンピースのクリーニング（基本料金の合計4,000円）を注文しようと考えている。モギさんはこのサービスを初めて利用する。普通会員に登録して注文する場合、モギさんはいくら支払わなければならないか。","options":["4,000円から30%引いた金額","4,000円から30%引いた金額と送料2,000円","4,000円","4,000円と送料2,000円"],"answer":1,"explain":"Đáp án đúng: B. Dùng lần đầu: giảm 30% (4.000 → 2.800 yên). Hội viên thường có phí vận chuyển 2.000 yên khi tổng dưới 8.000 yên (miễn phí vận chuyển lần đầu chỉ áp dụng cho hội viên đặc biệt)."},{"q":"東京都に住んでいる特別会員のユーキさんは、ジャケットと着物のクリーニングを注文しようと考えている。自宅の段ボールに衣類を詰め、今日の17時に発送する予定である。クリーニングが終わった衣類が自宅に届くのはいつになるか。","options":["3日後","4日後","8日後","9日後"],"answer":3,"explain":"Đáp án đúng: D. Hội viên đặc biệt gửi sau 16h: 4 ngày; kimono cộng thêm 5 ngày; gửi chung nên nhận 9 ngày sau."}]},{"source":"Mon13","bai":26,"date":"07/2025","title":"Mon13 - Bài 26 (07/2025)","passage":"玉北市市民学習センター「市民企画講座」募集\n\nA. 「市民企画講座」とは\n市内で活動する団体の皆さんに、講座を企画・運営してもらうものです。市民学習センターは、広報、受講者の募集、会場の提供を行います。\n\nB. 応募条件\n【申し込める団体】\n・玉北市在住者による団体\n\n【実施できる講座】\n＜内容・場所・講師＞\n文化や芸術、歴史等に関する内容で、当センター内の教室（和室含む）で開講できるもの\n団体のメンバーが講師をすることも、外部の講師を招くことも可能\n※外部の講師は玉北市在住でない方でも可能\n\n＜実施期間・回数＞\n4月1日〜9月30日の間で、計4〜6回の実施\n\n＜定員・受講対象者＞\n・定員 10〜30人\n・受講対象者は玉北市在住者とし、年齢による限定をしないこと\n※夏休み期間中（7月25日〜8月31日）の講座のみ、「子供」または「親子」を対象にしてもかまいません。\n\nC. スケジュール\n①事前説明会：1月13日（土）14時〜16時 市民学習センター2階会議室\n・応募や企画・運営の注意点等をご説明します。初めて応募する団体の代表者は、必ず出席してください。事前申し込みは不要です。\n\n②応募書類提出・受付期間：1月15日（月）〜1月31日（水）\n・応募書類（「申請書」と「講座概要」）を、当センターの開館時間内（平日9時〜19時）に窓口に持参してください。記載内容を確認するので、代表者が提出してください。\n・「講座概要」は、講師が作成してください。\n\n③選考会（面接）：2月24日（土）午後\n・代表者が必ず出席してください。代表者と講師が異なる場合は、講師も一緒に出席してください。\n・結果は3月上旬に郵送します。\n\n【問い合わせ】玉北市市民学習センター 電話242-000-8688　〒665-2243 玉北市浅田町2-5","note":"✅ Đáp án đã đối chiếu với đáp án chính thức.","questions":[{"q":"次の4つの団体は、玉北市在住者による団体で、今後、以下の講座の開講を検討している。この中で「市民企画講座」に応募できるのはどの団体か。\n\n①大空グループ「絵画教室」／4月と5月に計5回／玉北市内の公園／受講対象：玉北市在住者（年齢制限なし）／15〜20人\n②もみじの会「俳句教室」／7月〜9月に計6回／学習センター内の教室／受講対象：60歳以上の玉北市在住者／20〜30人\n③たまきた文化の家「茶道体験」／8月に計4回／学習センター内の和室／受講対象：玉北市在住の親子／10〜20人\n④玉北市歴史クラブ「玉北市の歴史」／9月に計4回／学習センター内の教室／受講対象：玉北市在住の親子／15〜30人","options":["大空グループ","もみじの会","たまきた文化の家","玉北市歴史クラブ"],"answer":2,"explain":"Đáp án đúng: C. Điều kiện: nhóm người ở Tamakita, lớp tại phòng của trung tâm, 4–6 buổi trong 1/4–30/9, đối tượng không giới hạn tuổi (riêng kỳ nghỉ hè 25/7–31/8 được dành cho trẻ em/phụ huynh). Chỉ ③ (trà đạo, tháng 8, phòng kiểu Nhật, phụ huynh – trẻ em) đạt."},{"q":"田村さんはある団体の代表者を務めており、今回初めて「市民企画講座」に応募したいと考えている。外部の講師を探しているが、講師について留意しなければならないことは何か。","options":["玉北市在住で、③に出席し、②に同伴してくれる人を選ぶ。","玉北市在住で、「講座概要」を作成し、①と③に出席してくれる人を選ぶ。","「講座概要」を作成し、③に出席してくれる人を選ぶ。","「講座概要」を作成し、①と③に出席してくれる人を選ぶ。"],"answer":2,"explain":"Đáp án đúng: C. Giảng viên bên ngoài không cần ở Tamakita; lập 「講座概要」 và dự buổi phỏng vấn ③ cùng người đại diện. Buổi giải thích ① chỉ dành cho người đại diện."}]},{"source":"Mon10","bai":28,"date":"12/2018","title":"Mon10 - Bài 28 (12/2018)","passage":"日本の森の生態系は、生物多様性が高いといわれています。生物多様性が高いのは、多くの生物の生息（注1）域になりうる多様な環境があるからです。では、なぜ、多様な環境があるかというと、人間が自然に長期的、継続的に介入してきたということが大きく関係しています。\n\n人間がいない状態で、自然が、自然の作用（注2）のなすがままに置かれていた時代の植生（注3）を「原植生」と呼んでいます。この時代、日本列島は現在の状態よりも生物の生息環境として単純なものであったはずで、そこに生息する生物の多様性は現在よりも低かったのではないかと私は考えています。\n\nこれまで、人間は、人間の都合で、自然を改変してきました。しかし最近になって、多くの人が都市に集中して住むようになり、食料も木材もエネルギーも海外から輸送してくるようになって、これまでのように自然に長期的、継続的に介入する必要がなくなりました。人間の介入が止まった森は、自然の作用によって変化していきます。そのまま放っておけば、人間がいなかった時代の自然に戻るかというと、そう簡単ではありません。\n\n人間の介入は土壌の奥深くまで及んでいます。植生の回復に比べて、土壊の回復には長い時間がかかるので、まずは土壌が回復しない状態で、その上に植生が成立することになります。この状態を「潜在自然植生」といい、原植生とは区別されます。\n\n（中略）\n\n現在の日本の生物多様性は、人間による自然への長期的、継続的な介入の結果としてもたらされたものです。その介入は、決して生物多様性のためではなく、人間が生きていくために燃料、木材その他を収奪する（注4）ためだったのです。もし現在の状態が生物多様性が高い状態だとすれば、それはあくまで副産物として得られたものなのです。今後、生物多様性の維持のために、自然に人間が介入し続けるべきだ、という主張があります。しかし問題は、そのための資金を誰が出すかです。とくに、公的な資金を投入するかどうかは、よく考えてからのほうがいいと思います。\n\n自然が、自然の作用によって変化していくのに逆らって、人間が作業をしようとすると膨大な手間と時間がかかります。その手間に見合う利益が、人間にもたらされるのか、また、放置して自然の作用に任せておくことが、人間や生物にどのような損失をもたらすのか、正確に理解することが求められています。\n\n（注1）生息：生存\n（注2）作用のなすがままに：ここでは、作用のままに\n（注3）植生：ここでは、植物群の状態\n（注4）収奪する：奪い取る","note":"ℹ️ Đề bổ sung từ đề chính thức; đáp án do Claude giải từ nội dung đề (chưa có đáp án chính thức để đối chiếu).","questions":[{"q":"人間がいない時代の日本の森の生態系について、筆者はどのように述べているか。","options":["生息環境が単純で生物が生息しやすかった。","生物が環境の影響を受けることが現在より少なかった。","生物もその生息環境も現在ほど多様ではなかった。","生物もその生息環境も自然の作用により多様化しつつあった。"],"answer":2,"explain":"Đáp án đúng: C. Thời chưa có con người, môi trường sống đơn giản hơn, đa dạng sinh học thấp hơn hiện nay."},{"q":"そう簡単ではありませんとあるが、なぜか。","options":["植生と土壌の回復には、人間が介入したのと同じ時間が必要だから","人間が介入した土壌には、植生が成立しにくいから","人間が介入した土壌の回復は、植生の回復より時間がかかるから","人間が介入した植生と土壌は、自然に回復することはないから"],"answer":2,"explain":"Đáp án đúng: C. Sự can thiệp của con người ăn sâu vào đất; đất phục hồi lâu hơn thảm thực vật nên không thể trở lại như cũ ngay."},{"q":"現在の日本の生物多様性について、筆者はどのように述べているか。","options":["人間が自然の恩恵を受けようとして生み出したもの","人間が生存するために行った介入によって生じたもの","人間が生物多様性を目指して介入した結果生まれたもの","人間の介入が行われなかった土壌で自然に生じたもの"],"answer":1,"explain":"Đáp án đúng: B. Đa dạng sinh học hiện nay là sản phẩm phụ của việc con người khai thác tự nhiên để
