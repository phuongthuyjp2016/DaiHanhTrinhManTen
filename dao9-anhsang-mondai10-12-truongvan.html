.app{max-width:840px;margin:20px auto;padding:24px;background:var(--cream);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);}
header{text-align:center;padding-bottom:12px;border-bottom:2.5px solid var(--terra);margin-bottom:14px;}
header h1{font-size:1.2rem;color:var(--terra-dark);margin-bottom:3px;}
header p{color:var(--ink-soft);font-size:.78rem;}
.note-banner{background:#eaf4fb;border:1px solid var(--terra);border-radius:10px;
  padding:10px 14px;font-size:.8rem;color:var(--terra-dark);margin-bottom:14px;}
.tabs{display:flex;gap:6px;margin-bottom:10px;}
.tab-btn{flex:1;padding:8px 4px;text-align:center;border-radius:10px;background:var(--cream2);
  border:1px solid var(--border);cursor:pointer;font-weight:700;color:var(--ink-soft);font-size:.83rem;}
.tab-btn.active{background:var(--terra);color:#fff;border-color:var(--terra-dark);}
.sheet-nav{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:14px;}
.sheet-btn{padding:7px 2px;text-align:center;border-radius:7px;cursor:pointer;
  background:#fff;border:1px solid var(--border);font-size:.76rem;color:var(--ink-soft);}
.sheet-btn.active{background:var(--terra-dark);color:#fff;}
.sheet-btn.nodata{opacity:.8;}
.m13doc{line-height:1.8;font-size:.93rem}.m13doc p{margin:.5em 0}.m13doc ul{margin:.4em 0 .6em 1.2em;padding:0}.m13-h{text-align:center;font-weight:700;font-size:1.02rem;margin:.2em 0 .6em}.m13-sec{font-weight:700;color:var(--terra-dark);margin:.9em 0 .3em}.m13-tw{overflow-x:auto;margin:.5em 0}.m13-t{border-collapse:collapse;font-size:.86rem;line-height:1.55;width:100%}.m13-t th,.m13-t td{border:1px solid var(--border);padding:4px 8px;vertical-align:top}.m13-t th{background:#faf3df;font-weight:700;white-space:nowrap}.m13-kv th{width:6.5em;white-space:normal}.trans-box{background:#fff;border:1px solid var(--border);border-radius:13px;padding:10px 14px;margin:0 0 12px;}
.trans-box summary{cursor:pointer;font-weight:700;color:var(--terra-dark);}
.trans-body{white-space:pre-wrap;line-height:1.85;font-size:.9rem;margin-top:8px;color:var(--ink-soft);}
.year-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;}
.year-chip{padding:5px 11px;border-radius:14px;border:1.5px solid #a3872a;background:#fff;color:#5a4118;font-weight:700;font-size:13px;cursor:pointer;line-height:1.3;}
.year-chip small{font-weight:500;opacity:.75;margin-left:3px;}
.year-chip.active{background:#a3872a;color:#fff;}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
.hl-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:18px;
  border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:.77rem;font-weight:600;
  color:var(--ink-soft);transition:.15s;user-select:none;}
.hl-btn .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
.hl-btn.on{border-color:var(--terra);color:var(--terra-dark);}
.hl-btn.locked{opacity:.4;cursor:not-allowed;}
.hl-btn-anchor .dot{background:var(--hl-anchor);}
.hl-btn-conn .dot{background:var(--hl-conn);}
.hl-btn-syn .dot{background:var(--hl-syn);}
.legend{font-size:.72rem;color:var(--ink-soft);margin-left:auto;}
.passage-wrap{background:#fff;border:1px solid var(--border);border-radius:13px;
  padding:16px 18px;margin-bottom:18px;border-left:4px solid var(--terra);box-shadow:0 2px 7px rgba(0,0,0,.05);}
.passage{white-space:pre-wrap;line-height:2.05;font-size:.95rem;}
.hl-anchor{background:var(--hl-anchor);border-radius:3px;padding:0 2px;font-weight:700;}
.hl-connective{background:var(--hl-conn);border-radius:3px;padding:0 2px;font-weight:700;}
.hl-syn{background:var(--hl-syn);border-radius:3px;padding:0 2px;}
.qcard{background:#fff;border:1px solid var(--border);border-radius:13px;
  padding:16px 18px 14px;margin-bottom:16px;box-shadow:0 2px 7px rgba(0,0,0,.04);}
.qtag{display:inline-block;background:var(--terra);color:#fff;font-size:.74rem;font-weight:700;
  padding:3px 11px;border-radius:11px;margin-bottom:8px;}
.qtext{font-weight:700;font-size:.95rem;margin-bottom:12px;line-height:1.65;}
.options{display:flex;flex-direction:column;gap:7px;}
.opt-btn{width:100%;text-align:left;padding:10px 13px;border-radius:9px;
  border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:.89rem;
  color:var(--ink);line-height:1.65;transition:.15s;}
.opt-btn:hover:not(:disabled){background:var(--cream2);border-color:var(--terra);}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct{background:var(--good-bg)!important;border-color:var(--good-border)!important;font-weight:700;}
.opt-btn.wrong{background:var(--bad-bg)!important;border-color:var(--bad-border)!important;}
.result-badge{margin-top:12px;font-size:.9rem;font-weight:700;padding:6px 0 2px;}
.result-badge.correct{color:var(--good);}
.result-badge.wrong{color:var(--bad);}
.explain{display:none;margin-top:14px;border-top:1px dashed var(--border);padding-top:14px;}
.explain.show{display:block;}
.expl-section{margin-bottom:13px;}
.expl-label{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.4px;
  background:var(--terra-dark);color:#fff;padding:3px 9px;border-radius:9px;margin-bottom:6px;}
.expl-body{font-size:.85rem;color:var(--ink-soft);line-height:1.85;padding-left:2px;}
.expl-body b{color:var(--ink);}
.chain-box{background:#eaf4fb;border:1px dashed var(--terra);border-radius:9px;
  padding:9px 13px;font-size:.84rem;margin:5px 0 9px;line-height:1.95;color:var(--ink-soft);}
.chain-box .jp{color:var(--ink);font-weight:600;display:block;margin-bottom:3px;}
.opt-expl{border-radius:9px;padding:8px 12px;margin-bottom:6px;font-size:.84rem;line-height:1.7;}
.opt-expl.correct-e{background:var(--good-bg);border:1px solid var(--good-border);}
.opt-expl.wrong-e{background:var(--bad-bg);border:1px solid var(--bad-border);}
.opt-expl .key{font-weight:700;margin-right:4px;}
.opt-expl.correct-e .key{color:var(--good);}
.opt-expl.wrong-e .key{color:var(--bad);}
.opt-expl .jp-text{display:block;font-size:.83rem;margin:2px 0;color:var(--ink);}
.opt-expl .jp-text b{color:var(--terra-dark);}
.trap-tag{display:inline-block;font-size:.68rem;font-weight:700;background:var(--terra-dark);
  color:#fff;padding:1px 7px;border-radius:8px;margin-left:5px;}
.trap-tag.good{background:var(--good);}
.nav-buttons{display:flex;justify-content:space-between;margin-top:16px;}
.nav-buttons button{background:var(--terra);color:#fff;border:none;padding:9px 18px;
  border-radius:20px;cursor:pointer;font-weight:700;font-size:.85rem;}
.nav-buttons button:disabled{background:#ccc;cursor:not-allowed;}
.reset-btn{display:none;margin:14px auto 0;padding:9px 22px;background:var(--terra-dark);
  color:#fff;border:none;border-radius:20px;font-size:.85rem;font-weight:700;cursor:pointer;}
.reset-btn.show{display:block;}
.progress{font-size:.76rem;color:var(--ink-soft);text-align:center;margin-bottom:8px;}
.exp-toast{position:fixed;top:18%;left:50%;transform:translate(-50%,-10px);background:linear-gradient(180deg,#ffd25a,#f5a623);color:#5a3b22;font-family:'Baloo 2',sans-serif;font-weight:800;padding:10px 22px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:9999;text-align:center;pointer-events:none;animation:expPop .35s ease-out;}
.exp-toast-main{font-size:20px;line-height:1.2;}
.exp-toast-sub{font-size:12px;font-weight:700;margin-top:2px;opacity:.85;}
.exp-toast-big{background:linear-gradient(180deg,#ff9a56,#ff5b3a);color:#fff;box-shadow:0 8px 22px rgba(255,90,40,.5);}

<script>
const DATA = [{"source":"Mon10","bai":1,"date":"07/2010","title":"Mon10 - Bài 1 (07/2010)","passage":"ĐỌC MD10 - Trường văn (1) N1\n心理学は昔から心について研究してきたわけですが、実は肝心の感情（情動）についてはまだよ\nくわかっていないのです。えっ、感情こそ心理学が得意とするところではないのですか、と①不思議に思\nわれるかもしれません。しかし、現代の心理学が得意としているのは、どちらかというと、私たちが目や耳\nで周囲の世界をどのようにとらえるかという感覚や知覚の働きであり、どのようにものを考えるかといった\n認知と呼ばれる働きについてです。そうした働きと感情を一体化した心のプロセスが、私たちの②全体的\nな「生」の体験なのかもしれません。\n最近では脳科学やコンピュータの専門家と協力しながら、世界中の精鋭たちが心のメカニズムの\n研究に取り組んでいます。その成果がロボット工学などに応用されているわけです。人間と同じように見\nたり、聴いたり、歩いたり、話したりする精巧なロボットたちが作られています。しかし、まだ感情機能をも\nつに至っていないのはご存知のとおりです。ロボットもうれしそうな表情などをしてみせることはできます。\n犬型のペット・ロボットならしっぽを振る仕草もします。しかし、それらは表面的な動作を真似しているだけ\nで、感情の働きがそうさせているわけではありません。複雑な心の働きの中でも特に感情機能を解明す\nるのは難しく、それをうまく再現できないからです。\n感情は私たちの体験を豊かに裏打ちして（注１）、なにかを選んだり、しようとしたりする行動を駆\nり立てる（注２）動因にもなります。例えば、好き嫌いを理屈（論理）で説明することは難しいはずですが、\n実際の行動は簡単にやれます。ボーイフレンドやガールフレンドを論理や計算だけで選ぶ人はいない\nはずです。まあ、計算づくで（注３）結婚相手を決めようとする人もいるでしょうが、その裏には別の気持ち\nが動いていそうです。感情は私たちの思考や行動の土台になっていると考えることができそうです。その\nため、気持ちの落ち込みがひどいときには、普段何気なくやれていたことができなくなることがあるので\nす。\n（佐藤静『こころサポート』による）\n（注１）裏打ちして：土台として支えて\n（注２）駆り立てる：何かをせずにはいられないような気持ちにさせる\n（注３）計算づくで：自分の損にならないようにいろいろ考えて","questions":[{"q":"①不思議に思われるとあるが、人々は何を不思議に思うのか。","options":["心理学では感情機能についてまだ十分わかっていないこと","心理学では認知と感情の関係がまだ解明されていないこと","心理学は感情の働きを研究するのが得意だということ","心理学が昔から心について研究してきたということ"],"answer":0,"explain":"Mở bài: 「肝心の感情についてはまだよくわかっていない」→ Suy ra: người ta tưởng tâm lý học giỏi cảm xúc nhưng thực ra CHƯA rõ. ✅A khớp đúng. ❌C ngược nghĩa."},{"q":"筆者の言う②全体的な「生」の体験とは何か。","options":["心で感じとったことを、そのまま行動に移すような体験","身の回りの世界を目や耳で認識して考え、心で感じる体験","どのように周囲を見たり聴いたりして考えるかという体験","感覚や知覚で周囲の世界のものごとをとらえようとする体験"],"answer":1,"explain":"②全体的な「生」の体験 nối liền câu trước: cảm giác+tri giác+nhận thức HỢP NHẤT với cảm xúc. ✅B bao quát đủ cả nhận thức+cảm xúc. ❌A/C/D chỉ nói 1 phần."},{"q":"この文章では、ロボットを取り上げて何を説明しているか。","options":["ロボットの感情のメカニズムの複雑さ","最近のロボット工学の進歩のめざましさ","人間の動作や表情を再現することの難しさ","人間の感情の働きを解明することの難しさ"],"answer":3,"explain":"Đoạn robot lặp 3 lần しかし → kết: 「感情機能を解明するのは難しく、再現できない」. ✅D đúng trọng tâm. ❌B/C là chi tiết phụ gây nhiễu."},{"q":"筆者の述べている感情の働きを以下のようにまとめる場合、（ ）に入るものとして適切なのはどれか。 「私たち人間は、感情の働きによって（ ）。」","options":["何かをしたいと思い行動を起こす","ものごとを感覚でとらえようとする","相手の心を分析して理解しようとする","好き嫌いを論理的に考え判断する"],"answer":0,"explain":"Câu cuối: 「行動を駆り立てる動因」+「思考や行動の土台」. ✅A khớp. ❌D ngược nghĩa (bài nói cảm xúc, không phải lý luận logic)."}]},{"source":"Mon10","bai":2,"date":"12/2010","title":"Mon10 - Bài 2 (12/2010)","passage":"心は目に見えない。だから客観的に知ることはできない。ならば、心とか意識なんて面倒なこと\nを考えるよりも、目で見える、定規で測れるものだけを考えることにしよう。そう考える人がいても不思\n議ではない、行動主義 (注1) 心理学と呼ばれるこの流派では、サルやネズミなどにレバー(注2)押しな\nどの行動を訓練し、その行動から動物の心を探っていく。しかし動物に「まずはレバーを押してみてく\nださい」と頼むわけにはいかない。例えば、初めて実験室につれてこられたサルは、そもそもレバーに\nさえ気づかないからだ。\nでは、サルにどうやってレバーを押させるのか? ポイントは二つ。ひたすら待つ。そして少しず\nつ目標に近づける。\n例えば、サルが少しでもチラッとレバーを見たとする。そこですかさずエサを与える。これを何\n度か繰り返すと、サルの注意が次第にレバーに向いてくる。ここでいったんエサやりを止める。すると\nサルは、うろつきまわったりキョロキョロしたり、色々なことを試し始める。ここが我慢のしどころ。試行錯\n誤の中、サルの手がレバーに伸びるのをじっと待つ。そして手が少しでも伸びれば、すかさずエサを\n与える。こうして、適切なタイミングでエサをやりながら、少しずつ目標の行動に近づけていくのであ\nる。\n私はこのやり方を、大学院生の頃、助手の先生に教わった。それは教科書に書いてあるとお\nりのことだった。が、実際にやってみると、それは衝撃の体験だった。\nエサやりのボタンを右手に持ち、白黒のモニターごしに、サルの行動をじっと見つめる。私はエサに\n念じていた。\n「振り向け、レバーに振り向け」。伝わらない思いを伝えたい。ふいにサルがレバーに近づく。\nと、すかさず「エサやり」というメッセージを送る。それは紛れもなく (注3) コミュニケーションであった。\nこの訓練をずっとやっていると、徐々にサルの気持ちがつかめてくる。そして、気持ちがつか\nめてくると、訓練は格段に早く進む。行動だけを見よといいながら、その実 (注4) 、うまく訓練するには\nサルの心がつかめていなければならないのだ。心は行動からしかつかめない。しかしそれがつかめた\nとき、手の中にサルの心があるように思えてくる。\nそのとき私は、学問の本当に大事なことは、教科書には書いていないことを知ったのだった。\n(金沢創「心体観測」 2009年2月8日付朝日新聞日曜版による)\n(注1) 行動主義心理学 : 人間や動物などの行動を観察して研究する学問。\n(注2) レバー : 機器を操作するときにつかんで動かす捧。\n(注3) 紛れもなく :間違いなく。\n(注4) その実 : 実際には。","questions":[{"q":"サルにレバー押しをさせる目的は何か。","options":["サルを訓練して、人間の意図を読み取れるようにすること","サルを訓練して、動物だけが持つ見えない能力を開発すること","サルの行動を通して、動物に対する人間の心の動きを探ること","サルの行動を通して、目に見えない動物の心や意識を研究すること"],"answer":3,"explain":"①Khỉ chưa biết lever là gì → mục đích huấn luyện: dùng hành vi để dò tìm tâm/ý thức của ĐỘNG VẬT (không phải tâm người). ✅D."},{"q":"この実験室内の訓練で、人間はサルに対してどのように対応しているか。","options":["サルをレバーの近くに連れて行き、目標の行動をしたらすぐにエサをやる。","サルがレバーを押したらエサを指し示し、目標の行動をするまでじっと待つ。","サルにレバーを指し示し、人間が期待する次の行動をしたらすぐエサをやる。","サルがレバーを見たらエサをやり、人間が期待する次の行動をするまでじっと待つ。"],"answer":3,"explain":"Quy trình: thấy lever→cho ăn, rồi chờ đến hành động tiếp theo (đưa tay) mới cho ăn tiếp = shaping từng bước. ✅D."},{"q":"そのときとは、どんなときか。","options":["「エサやり」というメッセージを繰り返し送ることで人間とサルの行動の違いがわかったとき。","「エサやり」というメッセージを送る過程を通して、サルの心がつかめたと感じたとき。","レバー押しの訓練が進むにつれて、サルが筆者の心をわかってくれたと感じたとき。","レバー押しの訓練によって教科書には書かれていないサルの行動が解明されたとき。"],"answer":1,"explain":"そのとき = lúc cảm nhận được 'nắm được tâm khỉ' qua tín hiệu cho ăn. ✅B."},{"q":"筆者がこの訓練をしてわかったことは何か。","options":["動物を目標に近づける訓練では、「エサやり」を通して動物が人間に慣れることが大切だ。","動物を訓練するためには気持ちをつかむことが重要であり、それは自分で体験して初めてわかる。","動物の心理を探るためには、まず教科書に書いてあるとおりのことを実践することが大事だ。","動物の心をつかむには目に見える行動だけに注目することが大切だが、そのことは教科書に書いていな い。"],"answer":1,"explain":"Kết: 「教科書には書いていないことを知った」= phải tự trải nghiệm mới nắm được cảm xúc, không có trong sách. ✅B."}]},{"source":"Mon10","bai":3,"date":"07/2011","title":"Mon10 - Bài 3 (07/2011)","passage":"我が身が生涯に望み、知りうることは、世界中を旅行しようと、何をしようと、小さい。あきれるくら\nい小さいのだが、この小ささに耐えていかなければ、学問はただの大風呂敷（注1）になる。言葉の風呂\n敷はいくらでも広げられるから、そうやっているうちに自分は世界的に考えている、そのなかに世界のす\nべてを包める、①そんな錯覚に捕らえられる。木でいい家を建てる大工とか、米や野菜を立派に育てる\n農夫とかは、そういうことにはならない。世界的に木を削ったり、世界標準の稲を育てたりはできないか\nら、彼らはみな、自分の仕事において賢明である。我が身ひとつの能力でできることを知り抜いている。\n学問をすること、書物に学ぶことは、ほんとうは②これと少しも変わりはない。なぜなら、そうしたことはみ\nな、我が身ひとつが天地の間でしっかりと生きることだからだ。\n人は世界的にものを考えることなどはできない。それは錯覚であり、空想であり、愚かな思い上が\nりである。ただし、天地に向かって我が身を開いていることならできる。我が身ひとつでものを考え、もの\nを作っているほどの人間なら、それがどういう意味合いのことかは、もちろん知っている。人は誰でも自分\nの気質を背負って生まれる。学問する人にとって、この気質は、農夫に与えられる土壌のようなものであ\nる。土壌は天地に開かれていなければ、ひからびて（注2）不毛になる。\n与えられたこの土を耕し、水を引き、苗を植える。苗がみずから育つのを、毎日助ける。苗ととも\nに、自分のなかで何かが育つのを感じながら。学問や思想もまた、人の気質に植えられた苗のように育\nつしかないのではないか。子供は、勉強して自分の気質という土を耕し、水を引き、もらった苗を、書物の\n言葉を植えるのである。それは、子供自身が何とかやってみるほかはなく、そうやってこそ、子供は学ば\nれる書物とともに育つことができる。子供が勉強をするのは、自分の気質という土壌から、やがて実る精\n神の作物を育てるためである。「教養」とは、元来この作物を指して言うのであって、物識り（注3）たちの\n大風呂敷を指して言うのではない。\n（前田英樹『独学の精神』による）\n（注1）大風呂敷：実際より大きく見せたり言ったりすること\n（注2）ひからびて：乾ききって\n（注3）物識り：物事をよく知っている人","questions":[{"q":"①そんな錯覚に捕らえられるとはどういう意味か。","options":["自分は何でも知っていて世界を相手にできると思う。","言葉でどんなことでも伝えられるような気になる。","学問から得られることには限界がないと感じてしまう。","人間が世界から学べることはいかに大きいことかと思う。"],"answer":0,"explain":"①そんな錯覚 chỉ thẳng câu ngay trước: 「自分は世界的に考えている、世界のすべてを包める」= tưởng mình biết hết, đối diện được cả thế giới. ✅A. ❌B chỉ là phương tiện (lời nói) gây ra ảo tưởng, không phải nội dung ảo tưởng."},{"q":"②これとは何を指すか。","options":["自分にできることを把握したうえで仕事をすること。","自分が世界のために何ができるかを考えて仕事に励むこと。","できる限り多くの知識を得て自分の仕事に役立たせること。","人のためにできることは何かを考えたうえで仕事をすること。"],"answer":0,"explain":"②これ = 自分の仕事において賢明、我が身ひとつの能力でできることを知り抜いている (như nông dân/thợ mộc biết rõ năng lực mình). ✅A."},{"q":"この文章では、学問をするということをどのような例を使って説明しているか。","options":["与えられた土を耕し、よい苗を選んで植える。","与えられた土を耕し、よい作物になるように苗を育てる。","与えられた土壌を改善するために耕し続ける。","与えられた土壌を改善しながら世界標準の作物を育てる。"],"answer":1,"explain":"Ví dụ học vấn: 苗を植える、苗が育つのを助ける = trồng và giúp mạ tự lớn. ✅B (không phải 'cải tạo đất' như C/D)."},{"q":"筆者は「教養」をどのようなものだと考えているか。","options":["新たな気質を見いだすことができる学問や思想。","人それぞれの気質の中で育まれた学問や思想。","生きていくうえで必要な専門的な知識 。","書物や学問から得られた多くの知識。"],"answer":1,"explain":"教養 = 「気質に植えられた苗のように育つ学問や思想」= học vấn nuôi dưỡng theo khí chất riêng từng người. ✅D."}]},{"source":"Mon10","bai":4,"date":"12/2011","title":"Mon10 - Bài 4 (12/2011)","passage":"以下は、筆者が著書の中で「哲学の役割」について書いたものである。\nここで大切なのは、とりわけ科学の意義と限界をしっかりと見定めて、人間的知の全体をほんとに\n見渡しうる哲学的知の立場を我がものとすることにある。というのは、科学的知は、二つの限界を持ち、そ\nの限界内でしか意義を持たないからである。\n一つには、科学的知は、対象を突き放して、第三者的立場で、自分に関わりのない客観的事象\nとして眺め、しかも、必ずそのつど、特定の観点からだけ対象を扱い、自分が関心を持つ側面だけを取り\n上げ、それ以外の局面を捨象し、（注）決して対象の全体を見ようとはしないのである。だから、科学が進\nむと、細分化が必至となり、隣の研究室でやっていることが、お互いにはまったく分からなくなる。専門化\nと特殊化が、科学の運命であり、いかに学際化が叫ばれても、根本的には①この傾向には歯止めが利\nかない。それはちょうど、近代的病院で、病気を扱う諸部門が、外科や内科等々として、細かく分かれ、\n人間全体を扱ってくれる部署が存在しないのと、同様である。\n二つには、科学的知は、対象を、自分と無関係な事柄として扱う客観性がその特色をなしている\nので、そこでは、私たちが、自己として、主体的に決断して実践的に生きてゆく行為の問題を、本質的に\n扱うことができないのである。というのも、ある状況のなかで、いかに生きるべきかをよく考え、決断し、行\n為してゆくためには、来し方行く末をよく熟慮して、もはや無い過去と、いまだ無い将来とを視野に収め\nながら、現在の状況のなかに突き入ってゆかねばならない。しかし、そのような無いものを視野に収めな\nがら、記憶と期待の熱い思いを抱きつつ行為することは、知覚的に有る現在の事実に検証されることに\nよってのみ確実性を得ようとする科学の実証性とは、まったく別個の事柄だからである。客観的な事実確\n認のみを大事と考える科学の次元と、人生の岐路に立って、右すべきか左すべきかに思い悩む行為者\nの立場とは、別個の事柄である。②科学は、いかに生きるべきかという後者の問題を、本質的に扱うこと\nができないのである。\nしたがって、科学とは別に、存在の全体を視野に収め、世界のあり方の原理的全体を考慮して、\n世界観の知を育むと同時に、そのなかで、人間はいかに生きるべきであるのかという、人間の主体的な\n行為の根本を考究して、人生観の知を形成するところに、哲学的な知の本質的な成立根拠があることに\nなる。哲学が愛し求める真実の知とは、こうした人生観・世界観の根本的にほかならない。\n（渡邊 二郎 『現代の哲学』 による ）\n（注）捨象する:捨て去る","questions":[{"q":"科学的にものごとを見るということを、筆者はどのようにとらえているか。","options":["現在の事象の一部だけを取り上げて客観的な立場で検証する。","関心のある対象だけを客観的な立場で検証し未来を予測する。","過去の経験をもとにして客観的な立場で現在の状況を扱う。","人間的知の全体を客観的な立場からだけとらえる。"],"answer":0,"explain":"Khoa học: 「対象を突き放し...特定の観点からだけ対象を扱い、関心ある側面だけ取り上げ」= chỉ lấy 1 phần, nhìn khách quan từ góc cụ thể. ✅A."},{"q":"①この傾向とあるが、どのような傾向か","options":["近代的な研究を行う部門がさらに増えてきた。","特殊な研究対象が排除されるようになってきた。","研究対象をより実践的にとらえるようになってきた。","専門分野が以前より細かく分かれるようになってきた。"],"answer":3,"explain":"①この傾向 = 専門化と特殊化 (chuyên môn hóa, phân ngành nhỏ). ✅D."},{"q":"②科学は、いかに生きるべきかという後者の問題を、本質的に扱うことができないとあるがなぜか。","options":["客観的な事実確認を重視するものだから。","現在の行為だけを主体的に扱うものだから。","人間全体を解明することができないから。","人間の考えや行為の多くをまだ実証できないから。"],"answer":0,"explain":"②科学は...扱えない vì khoa học chỉ coi trọng xác thực bằng sự kiện khách quan HIỆN TẠI, không xử lý ký ức/kỳ vọng (quá khứ-tương lai). ✅A."},{"q":"哲学的知の重要性はどこにあるか。","options":["人間の生き方の根本を扱えること","主体的に考える方法を示せること","科学的な世界を視野に入れられること","世界のあり方を客観的にとらえられること"],"answer":0,"explain":"Kết: triết học giải quyết 「人間はいかに生きるべきか...人間の主体的な行為の根本」. ✅A."}]},{"source":"Mon10","bai":5,"date":"07/2012","title":"Mon10 - Bài 5 (07/2012)","passage":"理系の文章は明確な目的を持っている場合が多いので、その目的に応じて読者は文章を読む。\nこのため、目的に合致した文章は満足感を読者に与える。たとえば、「東京都の交通渋滞に関する\n調査報告書」はそれを知りたい人が読み、その内容が過不足なく記述されていれば100点の評価となる。\n調査内容が不十分であれば評価は下がり、満足感は少なくなる。\nしかし、もし著者と読者のあいだで、その文章を媒体として記述されていること以上の事柄が発見で\nきれば、読者にとって最高の満足感となる。言い換えると、読者が新しい知識を発見する喜びを支援す\nる、あるいはそのきっかけとなる文章こそが、100点以上の評価となる。それは著者と読者の①シナジー\n効果(二つのものから、それらの合計以上のものが生み出される効果)であり、それをもたらすには、著者\nは常に読者を意識し、読者とともに問題の解決にあたるという姿勢を持つことで文章に磨きがかかる。\nいくら仕事や理系の文章だからといって「AはBだ、覚えておけ』という姿勢の文章では読者の満足\n感は少ない。むしろ、読者は自分の無知を知り、自己嫌悪に陥り、一方、著者への親近感はなくなり、読\nむ気がしなくなる。文章の目的を達成するために大事なことは、読者が最後まで読んでくれることである。\nいくら素晴らしい内容が書かれていても、読者が読む気のしない文章は目的を果たすことができない。\n学生のレポートで、②それが一番よくわかる。なにしろ提出数が多いので、すべてを完全に理解しよ\nうとして読むことは不可能である。結局、最初の数行を読んで、あるいは全体を見渡して、読む気が起こ\nるかどうかが評価に大いに影響する。これは、上司に提出する企画書や、(注1) コンペに応募する提案\n書などでもまったく同じである。\nその意味で、人の読む気を誘う文章であるかどうかは重要である。では、読む気とは何か。それこそ\nがシナジー効果である。\n(中略)\n読者が自力で新しいことを発見することの支援はなかなか難しい。むしろ、自分の思考過程を深く\n分析し、読者と一緒に考えようという姿勢を持つことが最も重要である。読者に与える完全な解答はなく\nても、解答に向かうひたむきな姿勢を示すことができれば良いのだということである。言い換えれば、ごま\nかしがなく、技巧を弄ばず (注 2)、大げさにいえば著者の人生観を示すことで、真実に迫ろうという書き\n手の気持ちが読者に通じるのである。仕事の文章や理系の文章は、一般にはこういう行間の意味は不\n要と考えられているが、それでは(注3)無味乾燥の教科書文章となり、人の心に届かない。いくら人の③\n脳に届いても、心に届かないものは読む気がしなくなり、結局、読者の脳にも届かなくなる。\n(三木光範『理系発想の文章術』 による)\n(注1) コンペ : ここでは、仕事の依頼先を選ぶために企画を競争させるもの\n(注2) 弄ぶ: ここでは、必要でないのにむやみに使う\n(注3) 無味乾燥の: 味わいがなくてつまらない。","questions":[{"q":"①シナジー効果とあるが、読者にとってのシナジー効果とはどのようなものか。","options":["記述されている内容から、求めていた以上のことが得られる。","著者が伝えようとしている事柄を理解し、知識を増やす。","読むことを通して事実を知り、不十分な点を自覚する。","文章から足りない知識を補い、疑問を解消する。"],"answer":0,"explain":"シナジー効果 với người đọc = 「記述されていること以上の事柄が発見できる」= đạt nhiều hơn cả những gì viết ra. ✅A."},{"q":"②それが一番よくわかるとあるが、何が一番よくわかるのか。","options":["読み手に満足感を与えるのは難しいということ。","素晴らしい内容でなければ読んでもらえないこと。","読む気がしないものは終わりまで読んでもらえないこと。","読んですべてを理解してもらうことは不可能だということ。"],"answer":2,"explain":"②それ: báo cáo sinh viên nhiều quá → quyết định đọc tiếp hay không chỉ dựa vài dòng đầu = không đọc hết nếu chán. ✅C."},{"q":"③脳に届いても、心に届かないとはどういうことか。","options":["技巧には感心しても、内容には共感できない。","行間の意味は理解できても、内容には感動できない。","書き手の姿勢は理解できても、気迫までは感じられない。","内容は理解できても、書き手の気持ちは伝わってこない。"],"answer":3,"explain":"③脳に届いても心に届かない = hiểu nội dung (脳) nhưng KHÔNG cảm được tấm lòng người viết (心). ✅D."},{"q":"理系の文章の書き手はどのような姿勢を持つべきだと筆者は述べているか。","options":["読者の読む目的を分析し、読者に過不足のない情報を与えようとする。","読者を意識しつつ、真摯に解答を求めてその気持ちを伝えようとする。","読者に満足感を与えるよう、妥協せずに完全な解答を提供しようとする。","読者の読む気を最後まで誠うよう、読者の思考過程を深く分析しようとする。"],"answer":1,"explain":"Thái độ nên có: 読者を意識しつつ、真摯に解答を求めてその気持ちを伝える. ✅B."}]},{"source":"Mon10","bai":6,"date":"12/2012","title":"Mon10 - Bài 6 (12/2012)","passage":"まず、教育とは何か、ということから考えてみよう。さしあたってぼくは、教育とは、子どもを「社会\nの成員(大人)としてふさわしい存在」へと育て上げていくこと、と定義してみたい。\nどんな時代、どんな社会の人びとでも、子どもを大人に育て上げなくてはならなかった。そのさ\nいには、①社会の成員として「ふさわしい」あり方が何かしら想定されていて、それが教育の営みを導\nいていたはずだ。\nその「ふさわしさ」は、大きく二つに分けられるだろう。 一つは、働いて食べていけるために必要\nな能力、つまり農民なら農民としての、漁民ならば漁民としての、技能や知識。もう一つは、他の人び\nとのあいだでふさわしいふるまいができること一一基本的なルールを守り、他の人びとと協力する態勢\nをとれること、自分に与えられた役割を果たし、その責任をとれること等々、つまり、他者との関係能力\nである。では、現代社会においては、どういうことが「大人としてふさわしい」のだろうか?教育理念を構\n築するとは、このことをあらためて考え、かつ共有しようとすることに他ならない。\nだが、この「共有」ということはなかなかむずかしい。そこには、社会のあり方と人間の生き方をど\nのようなものとして思い描くか、つまりは、異なった社会観・人間観がさまざまに入り込み、衝突してくる\nからだ。\nたとえば、ぼくが最初にあげた「教育とは、子どもを社会の成員としてふさわしい存在にすること\nだ」という定義に対しても、②反発を覚える人がいるだろう。「それは、社会的期待に子供を添わせよう\nとするよくない発想だ。教育とはむしろ、子供の主体的な判断力を育てるものだ」というわけである。\nこの意見はしかし、「社会の秩序にただ従うだけでなく、主体的な判断のもとにみずからの人生\nをつくりあげ、社会のあり方をも批判的に検討する人間こそが社会の成員としてふさわしい」という近\n代的な人間観にもとづいている。これもまた、社会の側が子どもたちに寄せる「期待」の一種だと言わ\nざるをえない。そして子供を放置すれば主体的・批判的な人間になるはずもないから、そのように「育\nて上げ」ようとしなくてはならない。\nいずれにせよ、教育というものは、社会 (大人) の側が子供に寄せる期待、もっと強い言い方を\nすれば、ある種の強制から自由ではない、とぼくは考える。重要なことは、「この社会の一員、つまり大\n人として生きていくうえで何が必要な条件なのか」ということをきちんと見定め共有したうえでの強制で\nあるかどうか、という点なのだ。\n(苅谷剛彦・西研『考えあう技術一一教育と社会を哲学する」による)","questions":[{"q":"①社会の成員として「ふさわしい」あり方とはどのようなものか。","options":["子供を養い、社会において責任あるふるまいができること","自立するために必要な能力を身につけ、自由に生きていけること","いつの時代にも通用する技能や知識を備え、他者に尊敬されること","技能や知識を身につけ、他者とのあいだでうまく生きていけること"],"answer":3,"explain":"ふさわしさ chia 2 nhánh: 技能・知識(làm việc) + 他者との関係能力(quan hệ). ✅D bao quát cả 2 nhánh."},{"q":"教育理念を「共有」することがむずかしいのはなぜか。","options":["社会や人間について色々な考え方がありぶつかり合うから","教育者と一般社会の人びとが思い描く大人らしさは違うから","子どもの主体性について一致した見解が得られないから","社会のあり方や人びとの価値観が変化してきているから"],"answer":0,"explain":"Khó 'chia sẻ' vì: 異なった社会観・人間観がさまざまに入り込み、衝突 = nhiều quan điểm va chạm. ✅A."},{"q":"反発を覚える人の意見について、筆者はどのように考えているか。","options":["大人の期待を実現しようとするという点では筆者の考えと同じだ。","大人の期待を押し付けようとすることは教育理念にそぐわないものだ。","子どもの主体的な判断力がみずから育つと考えることは思い込みでしかない。","子どもの主体的な判断力を育てようとする点では筆者の考えと変わらない。"],"answer":0,"explain":"Tác giả coi ý kiến phản đối cũng là 1 dạng 期待 (kỳ vọng) giống cách nghĩ ban đầu của ông. ✅A."},{"q":"教育について、筆者の考えを表しているのはどれか。","options":["教育は社会の秩序に縛られない主体的な判断力を養うものだ。","教育は社会のあり方を批判的に検討できる能力を育てるものだ。","教育は強制から逃れられず、その強制は教育理念の共有が前提となる。","教育は強制から自由ではなく、社会の有力な教育観を受け入れざるをえない。"],"answer":2,"explain":"Kết: 教育は...強制から自由ではない、見定め共有したうえでの強制であるかどうか. ✅C."}]},{"source":"Mon10","bai":7,"date":"07/2013","title":"Mon10 - Bài 7 (07/2013)","passage":"自然は多種多様の生物群が存在することで、それなりの安定を維持している。そのなかの一種\nないし数種を撲滅することは、とりもなおさず全体のバランスをくずす結果になる。複雑な形の自然石\nかつみかさなってできた石垣から、一個ないし数個の石をひきぬいたらどうなるか。影響はたちまち全\n体におよび、石垣そのものの大規模な崩壊をおこすにちがいない。ちょうどそれとおなじである。しか\nも自然界の場合、構成それ自体が複雑であるゆえに、影響もいっぺんには表面化しない。ある部分\nはたちどころ (注1) に、べつの部分は長期間をおいたのちに、被害の進行をあらわにしてくる。人間\n自身の予想もしなかった個所へ、①意表をついた連鎖反応の結果がでてくるのである。Aなる (注2)\n害虫を除去する目的で、ある薬剤が使用されたとしよう。その目的はたっせられて、Bなる作物が虫害\nをまぬかれた。しかしその結果、おなじくAによって食い殺されていたCやDの種属が、抑制因子をとり\nのけられて爆発的に増加し、あらたな害虫となってBにおそいかかる。こういった例が多数あるのであ\nる。\n殺虫・殺菌の効能をもつ化学薬品が、いったん開発されてこのかたというもの、人間は文字ど\nおりなりふりかまわず(注3) 、ひたすらそれへの依存度を増し、つまり量質ともに強大化する方向へ\nつっぱしった。なぜそのようにしなければならなかったのか。最近の日本では、②このことをもいわゆる\n公害の一種にふくめ、製薬克本の営利主義一一すなわち企業の利益のため不必要な薬品を売りま\nくって乱用をすすめたことが、非難のまとになっている。しかしこれだけで片づけられるほど、事態の本\n質は単純でないのだ。上のような皮相的 (注4) 見解でわりきるには、現在の状況はあまりに絶望的で\nある。すでに③最初の出発点からして、人間の文明それ自体のなかに、かく (注5) ならざるをえない\n必然性がやど (注6) されていた。一企業の責任に帰するには、悲劇の根はいささか深すぎる。\n人間が今日のごとく高度文明をきずきえたのは、採集経済から脱して、牧畜さらに農耕という\n生産手段を発明したからである。それは換言すると、ある特定の土地を、牧場あるいは田畑として使\n用することである。さらに換言すると、人間の利用目的にかなう家畜・作物によって、それらの土地を\n独占させることでもある。ほんらいならばそこの土地には、家畜・作物いがいの各種生物が、当然のこ\nととして棲息 (注7) していた。人間はそれらの生物群にたいし、害獣・害鳥・害虫あるいは雑草といっ\nた汚名を一方的にかぶせ、強引に排除する手段にでた。こうして自然界のバランスがくずれたいわゆ\nる公害の起原は、工業とともにおきたのではなく、遠く牧畜ないし農耕のはじまりにさかのぼるのであ\nる。\n(レイチェル・カーソン著・青樹菜一訳『沈黙の著』 一筑波常治の「解説」による)\n(注1) たちどころに : たちまち (注2) なる : ここでは、という\n(注3) なりふりかまわず : ここでは、先のことも考えず\n(注4) 皮相的 : 表面的\n(注5) かく : このように (注6) やどす : 含む (注7) 棲息する : 生きる","questions":[{"q":"筆者は、①意表をついた連鎖反応をABCDを用いてどのように説明しているか。","options":["BをおそうAを除去した結果、あらたな強いAが発生してCやDをおそうようになる。","BをおそうAを除去した結果、Aに食い殺されていたCやDがBをおそうようになる。","BをおそうCやDを除去した結果、あらたなAが増加してBをおそうようになる。","BをおそうCやDを除去 した結果、CやDに食い殺されていたAがBをおそうようになる。"],"answer":1,"explain":"Chuỗi phản ứng: diệt A (hại B) → C,D (từng bị A ăn) bùng nổ tấn công B. ✅B."},{"q":"②このこととあるが、このこととは何か。","options":["化学薬品の開発","化学薬品の有用性","化学薬品の無効性","化学薬品の量と質の強大化"],"answer":3,"explain":"②このこと = 量質ともに強大化する方向 (gia tăng cả lượng và chất của hóa chất). ✅D."},{"q":"筆者が考える③最初の出発点とはいつのことか。","options":["人間が採集活動によって生活を営みはじめたころ","人間が土地を牧場や田畑として使用しはじめたころ","企業に資本が集まり、産業が発展しはじめたころ","文明が高度化し、工業が盛んになりはじめたころ"],"answer":1,"explain":"③最初の出発点 = từ khi loài người dùng đất làm đồng cỏ/ruộng (牧畜・農耕の始まり). ✅B."},{"q":"筆者によると、自然界のバランスがくずれた原因は何か。","options":["人間が生産手段を発明したこと","人間が薬剤開発のために各種生物群を利用してきたこと","人間が人間に利用価値のない生物群を排除してきたこと","人間が人間以外の生物群の存在を無視してきたこと"],"answer":2,"explain":"Nguyên nhân cân bằng tự nhiên vỡ: loại bỏ sinh vật không có giá trị sử dụng (害獣・害鳥・害虫として排除). ✅C."}]},{"source":"Mon10","bai":8,"date":"12/2013","title":"Mon10 - Bài 8 (12/2013)","passage":"音楽に限ったことではないが、芸術、文化などの名で呼ばれるものはどうしても、現実の政治\n経済や社会生活に関わることがらとは切り離されたものと考えられることが多く、また、そうであるがゆ\nえに価値を持つものとされてきたと言ったほうが、よいだろう。近年のように財政状況が悪化するなど、\n現実生活をめぐる状況が深刻になってくると、こういうものはしばしば不要不急な「無駄」として切り捨\nてられそうになる。他方で、荒れた世の中をしばし (注1) 忘れるためのオアシスのような場所としての\n意義が叫ばれるようになったりもするのだが、いずれにしても、その音楽を研究している立場のわれわ\nれはしばしば、「この世知辛い (注2) 世の中で、そんなことをやっていられるというのはうらやましいこ\nとです」などと言われ、①何とも複雑な心境になるのである。\nだが、コペルニクス的転回を遂げた (注3) と言っても、過言ではない近年の文化研究の進展\nの中で、政治や社会の話と切り離して文化が論じられるなどということが幻想である、というより、そのよ\nうな幻想自体、すでに一定の政治的社会的イデオロギーの刻印を帯びた (注4) ものにほかならな\nかったということが明らかにされてきた。いまや、音楽研究者の中にも、政治や社会から切り離された\n純粋な「音楽そのもの」がどこかに宙 (注5) に浮いたような形で存在しているなどと素朴に信じている\nような人は、誰もいないだろう。\n音楽研究に関わる人々の意識も変わり、研究の内実も大きく変わってきているにも関わらず、\nむしろ、音楽研究の世界の外側にいる人のほうが、音楽を「純粋」な形で囲い込みたがっているように\n思われるのは②皮肉なことだ。社会科学の最先端で議論をしている人が、音楽の話になったとたん\nに、30年前の音楽研究に戻ったかのような古典的なデータや図式でものを考えていることが明らかに\nなるような場面に、これまで、何度か出会ってきた。歴史学者などが中心になって、編んだ領域横断\n的な論集などで、音楽の部分だけはひどく浮世離れした (注6) 古めかしい論文が掲載されており、音\n楽研究の最近の成果と大きく切り離してしまっているようなこともしばしばある。ここ十数年で、音楽研\n究者の目に映る音楽の世界もずいぶんと変わっているのに、われわれの発信が不足しているため\nに、その面白さを十分に伝え切れていない。そんな気がするのである。\n(渡辺裕『音楽は社会を映す一考える耳「再論」』 による)\n(注1) しばし : しばらく\n(注2) 世知辛い : 暮らしにくい\n(注3) コペルニクス的転回を遂げる : 考え方がこれまでと根本的に変わる\n(注4) 刻印を帯びる : ここでは、 影響をうける。\n(注5) 宙 : 空中\n(注6) 浮き世離れした : 現実と懸け離れた。","questions":[{"q":"①何とも複雑な心境になるとあるが、なぜか。","options":["芸術や文化の価値が現実生活で高く評価されないから。","芸術や文化と社会生活との関係が希薄になっていくから。","芸術や文化の研究が現実生活に役立たないと思われているから。","芸術や文化が社会生活とは懸け離れていると思われているから。"],"answer":3,"explain":"①複雑な心境 vì nghệ thuật/văn hóa bị coi là tách biệt khỏi đời sống xã hội hiện thực. ✅D."},{"q":"筆者によると、近年の音楽研究者は、音楽をどのようにとらえているか。","options":["社会の状況が悪化したときに最も必要とされる。","ほかの芸術や文化と同等には論じられない。","現実生活と切り離した純粋なものである。","政治や社会に深く関わっている。"],"answer":3,"explain":"Nhà nghiên cứu âm nhạc gần đây: không ai còn tin âm nhạc 'thuần túy' tách biệt chính trị-xã hội nữa → gắn sâu với chính trị xã hội. ✅D."},{"q":"②皮肉なことだとあるが、何が皮肉なのか。","options":["音楽研究者以外の人の方が、音楽について、最先端の議論を従っていること。","音楽研究者以外の人の方が、音楽を特別なものとしたがっていること。","音楽研究者以外の人の方が、音楽を純粋に楽しんでいること。","音楽研究者以外の人の方が、音楽をよくわかっていること。"],"answer":1,"explain":"②皮肉 = người NGOÀI ngành lại muốn giữ âm nhạc 'đặc biệt/thuần túy' hơn người trong ngành. ✅B."},{"q":"現在の音楽研究者のあり方について、筆者はどのように述べているか。","options":["音楽の持つ普遍的な価値を社会によりわかりやすく伝えることが課題だ。","音楽研究の成果をこれまで以上に発信することが求められている。","最先端の音楽研究について議論していくことが重要である。","音楽に対する意識を変えて新たな研究に取り組むべきだ。"],"answer":1,"explain":"Cần làm: 発信が不足...面白さを十分に伝え切れていない → cần truyền tải thành quả nhiều hơn. ✅B."}]},{"source":"Mon10","bai":9,"date":"07/2014","title":"Mon10 - Bài 9 (07/2014)","passage":"アジアであれヨーロッパであれ、あるいは、三日であれ1カ月であれ、旅から帰って成田空港\n(注1) に着く。 (中略) 私はいつもバスではなくて列車で家まで帰る。\n都心に向かう列車には、旅から帰ってきた人と、これから旅する人たちが乗っている。話して\nいる人たちがいても、不思議に静かだ。帰る人の疲れと、旅する人の緊張が混ざり合ったような、ほか\nの路線ではなかなか味わえない静けさである。\n列車がトンネルを出ると、私は窓の外の景色を見る。空港からしばらくは、田園風景が続く。彼\n方まで続く田んぼは、季節によって一面の緑だったり茶色だったり、はられた水が空を映して青かった\nりする。山々が、遠くに見えたり近くに迫ってきたりする。冬枯れの景色でも、緑濃い初夏でも、自然の\n色彩が非常にやわらかいことに毎回あらためて気づかされて、そうして、①帰ってきたなあと実感す\nる。\nアジアにもヨーロッパにもそれ以外のどこにでも、豊かだったそうではなかったりする自然があ\nる。田舎を旅すればむせかえるような(注2)緑のなかを歩くことになる。見慣れた田んぼとそっくりな光\n景を見ることもある。葉の落ちた木々が針のような枝を空に突き刺す景色に見とれることもある。緑の\n多い町だとか、水墨画(注3)みたいだとか、その程度の感想は抱くが、その色彩について特別何も思\nわない。\n帰ってきて、車窓から景色をみて思うのだ。この国の色彩は本当にやわらかい、と。木々の緑\nも、四季(注4)に即した山の色も、川も空も。旅先で見てきた木々や空や海といったものが、なんと強烈\nな色を放っていたのかとこのときになって気づく。\n窓の外に緑が少なくなって、次第に家やビルが増えてくる。都心が近づくにつれ、どんどん建\n物や看板が増えてくる。さっきより「ああ、帰ってきた」がもう少しふくらむ。都心の、空の狭い、ごたつ\nいた(注5)風景をきれいだと思ったことは一度もないけれど、でも、帰ってくると毎回近しく(注6)思う。好\nきとか嫌いではなくて、私に含まれているかのような近しさを覚えるのだ。\n先だって、成田空港まで人を迎えにいった。旅のにおいをまだ濃厚に漂わせている人を到着\n口で迎え、いっしょに列車に乗り込んだ。旅の話を聞きながら、窓の外を眺めていて、ちょっとびっくり\nした。旅から帰って見る景色とぜんぜん違う。退屈な、見るべきところもない田園風景が広がっている\nのである。そうか、旅のあとじゃないと、ただの日常の光景なのか。都心が近づいてくる。窓の外に私\nが見ている光景と、旅から帰った人から見ている景色は、まったく違うんだろうなあと思った。\n旅というのは、空港に着いたときに終わるのではなくて、周囲の景色が、わざわざ目を凝らす\nこともない日常に戻ったときに終わるのだと知った。\n(角田光代『トランヴェール』 2 0 1 2 年3月号による)\n(注1) 成田空港 : 日本の国際空港\n(注2) むせかえるような : ここでは、圧倒されるような\n(注3) 水墨画 : 墨を使って、白黒の濃淡で描かれた絵\n(注4) 四季に即する : ここでは、四季によって変わる\n(注5) ごたつく : ごちゃごちゃする\n(注6) 近しい : ここでは、心理的に近い","questions":[{"q":"①帰ってきたなあと実感するのは、どんなときか。","options":["都心に向かう列車のなかで静けさを感じたとき。","日本の自然の色合いをあらためて意識したとき。","日本には緑が多いことにあらためて気づいたとき。","四季の変化が感じられるような色に気づいたとき。"],"answer":1,"explain":"①帰ってきたなあと実感する = khi nhận ra màu sắc tự nhiên Nhật Bản mềm mại (この国の色彩は本当にやわらかい). ✅B."},{"q":"外国を旅しているときの、筆者の自然に対する反応はどのようなものか。","options":["色彩の多様さに驚くことはあるが、特別よいとは感じない。","色彩が強烈だと思うことはあるが、見とれることはあまりない。","景色にひかれることはあるが、色彩に特別な印象は持たない。","懐かしい景色だと思うことはあるが、色彩がやわらかいとは思わない。"],"answer":2,"explain":"Khi du lịch nước ngoài: bị cuốn hút cảnh vật nhưng KHÔNG đặc biệt ấn tượng về màu sắc lúc đó (chỉ nhận ra sau khi về). ✅C."},{"q":"帰国したときに都心の風景を見て、筆者はどう感じるのか。","options":["自分の一部であるような親しみを感じる。","自分を受け入れてくれる優しさを感じる。","自分の好みに合っている場所だと感じる。","自分のふだんの生活に戻ったように感じる。"],"answer":0,"explain":"Về đến đô thị: 自分に含まれているかのような近しさ = cảm giác gần gũi như một phần bản thân. ✅A."},{"q":"筆者は、旅というものをどのようにとらえているのか。","options":["旅は、慣れ親しんだ景色のよさを再確認させてくれる。","旅は、見慣れた風景に新しい何かを発見することを可能にする。","旅は、旅先と慣れ親しんだ景色の違いに気づいたとき終わる。","旅は、見慣れた風景が再びありふれた日常になるまで続いている。"],"answer":3,"explain":"Kết: 旅は...日常に戻ったときに終わる = du lịch tiếp diễn đến khi cảnh quen thuộc thành đời thường trở lại. ✅D."}]},{"source":"Mon10","bai":10,"date":"12/2014","title":"Mon10 - Bài 10 (12/2014)","passage":"以下は、ある芸術家が書いた文章である。\n人間は動物とちがって、知的な活動、その情熱をもっている。おさなくたって、魂の衝動は強\nいのだ。だから子供は描きたがる。形、色にして確かめる。だが問題は自分のなかにあるものを外に\n突き出す、投げ出すという行為自体であって、決して出来上がりの効果ではない。\nだから子供は描きおわってしまったものはふり向きもしない。捨てられたって何とも思わないの\nだ、(中略)それを大事そうに拾いあげて、「これは面白い。」「坊やは才能がある。これをうまく伸ばせ\nば、将来えらい画家になるかもしれない。」などと、観賞したり評価するのは、いつでも大人で、子供自\n身は、もしほめられても、そんなものかなと聞いているだけである。\nだから「子供の絵」というような言い方の、根本に何か間違いがある、と私は思う。描いたものに\nは違いないが、「作品」ではない。その以前の、もっと根源的な何ものかなのである。\n「絵」などというから、大人の「絵画作品」と混同して考えてしまう。そこにズレがおこる。大人の\nは見せる芸であり、商品である。はじめから観賞すること、してもらうことを目的とし、結果を予測しなが\nら作り上げたものなのだ。\nいわゆる「絵描きさん」となると、描いている瞬間瞬間に、結果がわかっている。こうやれば、こ\nうなる。習練 (注1) と経験によって、色やタッチ (注2) の効果が計算できるし、生命の衝動、情熱、無\n目的な行動よりも、結果の方に神経が働いてしま う。出来ばえに、逆にひきずり回されているのだ。\nしかも、大向こう (注3) の気配まですでに見すかして、…こんな趣向は喜ばれるだろう、これは\nちょっとやりすぎかな、などと意識・無意識に、そんな手応えにあわせながら仕事をすすめている。評\n判をとり、買手がついてくれなければ食ってゆけないし、社会が許さない。 生活はきびしいのだ。無償\nの行為というわけにはいかない。\n明らかに「作品」つまり「商品」を作っているのである。\n大人の作品だって、本質的には生命力こそ肝要なのだ。自分の存在を純粋に外に投げ出\nす、突き出すアクションの質、強さによって、猛烈な魅力になる。\n私自身は、少なくともそのつもりである。よく、あなたの絵はわけがわからないと言われるが、\n「絵」でございます、というようなものは作りたくない。それ以前、そして以後のものをひたすらつきつけ\nる。――絵ではなく、芸術。そして出来るかぎり他の評価を無視したいと思っている。\n(岡本太郎『美しく怒れ』による)\n(注1) 習練 : 練習\n(注2) タッチ : ここでは、筆の使い方\n(注3) 大向こう : ここでは、観賞する人々","questions":[{"q":"捨てられたって何とも思わないのはなぜか。","options":["いつでも描きたいものが描けるから。","描きたいものが描けて納得したから。","描きたいという欲求が満たされたから。","最後まで描けたことに満足しているから。"],"answer":2,"explain":"Trẻ con không tiếc tranh bị vứt vì: hành vi 突き出す・投げ出す行為自体(tự thể hiện bản thân) đã hoàn thành, mong muốn được vẽ đã thỏa mãn. ✅C."},{"q":"子供の描いたものが「作品」ではないのはなぜか。","options":["大人ほどの表現力や情熱をもって描かれていないから。","観賞されることを目的として描かれていないから。","評価に値する出来上りになっていないから。","描いた本人が価値を認めていないから。"],"answer":1,"explain":"Tranh trẻ con không phải 'tác phẩm' vì KHÔNG nhằm mục đích được thưởng thức (観賞されることを目的としない). ✅B."},{"q":"「絵描きさん」について、筆者はどのように述べているか。","options":["かんぺきな出来ばえを求めている。","いつも同じような描き方をしている。","買い手の要望どおりに描いている。","買ってもらえるように描いている。"],"answer":3,"explain":"'絵描きさん' (họa sĩ chuyên nghiệp): tính toán hiệu ứng, để bán được, ý thức người mua. ✅D."},{"q":"筆者は芸術をどのようにとらえているか。","options":["人を引きつける魅力的なもの","情熱に突き動かされて作るもの","他人には理解できないようなもの","人間の生命力を巧みに表現するもの"],"answer":1,"explain":"Kết luận về nghệ thuật: câu cuối phủ định việc quan tâm đánh giá người khác (他の評価を無視したい) → cốt lõi là HÀNH ĐỘNG do đam mê/xung động thúc đẩy, không phải sức hút kết quả. ✅B."}]},{"source":"Mon10","bai":11,"date":"07/2015","title":"Mon10 - Bài 11 (07/2015)","passage":"私は、一人の作曲家として、色々な機会に、自分の作曲について語ってきた。しかしそれは、私\n自身が、自分の作曲についてよく知っている、ということを意味するわけではない。私の作曲には、言葉\nで説明できるような組織的な方法論はない。作曲するときの私は、単に、感覚に頼って、直観的に「これ\nが好い」と納得できる音の連なりを探し続ける。\nそして、「ここが曲の終わりだ」と感じるところにいたったとき、一つの曲の出来上がりとなる。ただ\nそれだけである。\n「これがよい」あるいは、「ここが曲の終わりだ」という感覚的な判断の根拠は、説明できない。そし\nて、①そのようにして作った曲が何であるのかについても、よく分からないのである。\nもっとも、私は、自分の作曲について本当に何も知らないというわけではない。そもそも、どうやっ\nて何を作るかということを全く知らずに物を作ることは、不可能である。例えば、もし、ガラスのことも、そし\nて、花瓶というものがどのようなものかも知らなければ、ガラスの花瓶を作ることはできない。 同様に、作\n曲の場合にも、素材である音と、その音の構成の仕方について知らなければ、そしてさらに、音楽という\nものがどのようなものなのかを知らなければ、曲を作ることなどできない。 作曲をするからには、作曲者\nは、当然、それらについて一応知っている。\n(中略)\n作曲は、必ず、何らかの伝統における「基本的な」知識を前提としている。だが、その「基本的な」\n知識をそのまま(大抵の場合、無意識的に) 受け入れて、その範囲で作曲する「保守的な」作曲家達がい\nる一方で、前衛主義に代表されるような、新たな音楽の可能性を求める作曲家達は、自らが出発点とし\nた伝統における「基本的な」知識の外に踏み出そうとする。そして、この伝統からの踏み出しーあるいは、\n「逸脱」と言うべきかもしれない一は、常に、実験的な性質を帯びる。つまり、非伝統的な素材を用いるこ\nとによって、あるいは、非伝統的な音構成法を試みることによって、伝統に由来する「基本的な」知識が\n告げる音楽というもののイメージから逸脱した未知のものが産み出される可能性があり、そして、この未知\nなるものを相変わらず「音楽」と呼ぶとしても、それがどのような意義と価値をもつ音楽なのかは、分らない\nのである。その意義と価値を判断するためには、そこに生まれてきた音楽そのものを吟味してみるほかは\nない。\n私が、自分自身の作曲について語り得ることは、まさにこのこと、つまり、自らが行った実験的な\n試みの結果として産み出された音楽についての吟味であり、言い換えれば、自分が行ったこととその結\n果についての自分自身による解釈なのである。\n(近藤譲「音楽という謎」による)","questions":[{"q":"①そのようにして作ったとあるが、どのように作ったのか。","options":["曲全体の出来上がりをイメージしながら作った。","曲の終わりを意識して納得できる音を探しながら作った。","美しいとされている音の連なりを組み合わせて作った。","音の連なりを理屈ではなく感覚的に選んで作った。"],"answer":3,"explain":"①そのようにして作った = 単に感覚に頼って直観的に「これが好い」と納得できる音を探す = chọn âm theo cảm giác, không lý luận. ✅D."},{"q":"筆者は、ガラスの花瓶の例を挙げて何を言おうとしているのか。","options":["音楽の素材として適している音があること。","作曲家はどのような仕事をしなければならないかということ。","作曲家は何の知識もなく曲を作ることはできないこと。","自身の作曲について知らなければいい曲はできないこと。"],"answer":2,"explain":"Ví dụ bình hoa thủy tinh: không thể sáng tác mà không biết kiến thức cơ bản về chất liệu. ✅C."},{"q":"新たな音楽の可能性を求める作曲家達の音楽とは、どのようなものか。","options":["伝統的なイメージから離れた実験的な音楽。","「基本的な」知識を知らずに作った未知の音楽。","「基本的な」知識を元にして作った新しい音楽。","非伝統的だが「保守的な」イメージを失わない音楽。"],"answer":0,"explain":"Nhà soạn nhạc tiên phong: âm nhạc thực nghiệm thoát khỏi hình ảnh truyền thống (伝統的なイメージから逸脱). ✅A."},{"q":"筆者によると、自分自身の作曲について語れることはどのようなことか。","options":["自身の曲の意義と価値。","自身の方法論についての解釈。","自身の試みと、曲についての解釈。","自身の作曲過程と、実験的音楽の可能性。"],"answer":2,"explain":"Điều tác giả có thể nói về sáng tác của mình: tự thử nghiệm + giải thích riêng về kết quả đó (吟味であり...自分自身による解釈). ✅C."}]},{"source":"Mon10","bai":12,"date":"12/2015","title":"Mon10 - Bài 12 (12/2015)","passage":"以下は、歴史学者について、歴史小説家との比較を中心に書かれた文章である。\n歴史学では、史実の究明にはもちろんのこと、新しい歴史像を提示する時にも史料(注1)的根拠が必要\nです。そして、この更料的根拠を基盤とするがゆえに、歴史学者の歴史観は、相互に批判可能なものです。\nこれは、物理や化学といった自然科学の世界で新理論を展開する場合に、その論拠、論理を他の学者にも\n検証可能な形で提示しなければならないことと同様です。\nしかし、小説にこうした論証を求めるのは無理というものです。最近は小説家に歴史研究者同様の姿勢\nを求める向きもあるようですが、これは筋違いとしか思えません。やはり、歴史研究と歴史小説は、そもそも\n目的も手段も違うものなのだとしか言いようがないのです。\nまた、あるいは、次のような話が参考になるでしようか。\nある時、理学部の天文学(注2)の先生に、「どうして彗星や小惑星などの新天体を発見する人には、ア\nマチュアの天文家が多いのですか」と聞いたことがありました。新聞でも報じられるような天体現象の発見\nに、意外と専門研究者が少ないことが気になっていたからです。\nすると天文学の先生は、「天文学の先端では、彗星などの発見よりは、大きな電波望遠鏡を使って、あ\nる一定の方向から地球に届く宇宙からの電波情報を継続的に受け取り、その数値の分析によって宇宙の大\nきさを推測したり、宇宙の成り立ちを究明したりしているのです」と教えてくれました。\n(中略)\n歴史学者と歴史小説家の違いも、これに近いものがあります。歴史小説家を歴史のアマチュアとするつ\nもりはありませんが、同じく歴史を扱いながらも、その立ち位置は違うものだと言えるでしょう。\n歴史小説では、誰もがよく知っている人物や事件をとりあげて小説にすることが多いようですが、歴史研\n究ではむしろ誰も知らないような人物や事件を入り口として史実を究明することがほとんどです。また、政争\nに誰がいかにして勝ったかというような政治のダイナミックな人間の動きよりは、制度的な政治システムの変\n遷を追究する方が研究手法としては主流です。そのため、歴史学者が世間一般の歴史ファンを驚かせるよ\nうな新説を立てる、というようなことは、稀なこととなるのです。\nもちろん、天文学者であれば研究機関に属していようが星に無関心でないのと同様に、歴史研究者も\nメジャーな歴史トピックに関心がないわけではありません。 しかし、一見地味な事例研究を積み重ねることに\nよって、それまでの通説を修正する新しい視点が見いだされていくことを、研究者は知っているのです。つま\nり、一足飛びに (注3) 通説を覆そうとして、特定の視点から史料を読むような真似 (注4) は禁物なのです。\n(山本博文『歴史をつかむ技法』 による)\n(注1) 史料 : 歴史を研究するための文献や遺物\n(注2) 天文学 : 宇宙と天体について研究する学問\n(注3) 一足飛びに : ここでは、手順を無視して一気に\n(注4) 真似 : ここでは、行動","questions":[{"q":"筆者によると、歴史学と自然科学の共通点は何か。","options":["研究の価値は新説を示すことで認められること。","新説の展開には、学者同士の相互批判が欠かせないこと。","新説の根拠を検証可能な形で検証するのは容易ではないこと。","他の学者が検証できるように、新説の根拠を示す必要があること。"],"answer":3,"explain":"Điểm chung sử học & khoa học tự nhiên: cần trình bày luận cứ để học giả khác kiểm chứng được (検証可能な形で提示). ✅D."},{"q":"天体現象の発見に専門研究者が少ないのは、なぜか。","options":["専門研究者は、新天体の発見には価値がないと考えているから。","専門研究者は、新天体の発見より宇宙そのものの探究を目的としているから。","専門研究者は、アマチュアの天文家との役割分担を意識しているから。","専門研究者は、アマチュアの天文家の発見を集約して宇宙全体を研究しているから。"],"answer":1,"explain":"Chuyên gia thiên văn ít tìm sao chổi vì hướng đến mục tiêu lớn hơn (phân tích dữ liệu vũ trụ tổng thể) hơn là phát hiện đơn lẻ. ✅B."},{"q":"歴史小説家について、筆者はどのように述べているか。","options":["制度的な政治システムを題材としている。","誰も知らない史実を面白く物語にしている。","有名な人物や出来事などを題材としている。","歴史学者が気づかないような視点で書いている。"],"answer":2,"explain":"Nhà văn lịch sử: lấy người/sự kiện nổi tiếng làm đề tài (誰もがよく知っている人物や事件). ✅C."},{"q":"歴史学者について、筆者はどのように述べているか。","options":["通説を覆すために、新しい史実を発見しようとしている。","通説に惑わされず、特定の視点から歴史をとらえようとしている。","個々の事例研究を踏まえて、史実を明らかにしようとしている。","知られていない史実をとりあげ、人々の歴史認識を改めようとしている。"],"answer":2,"explain":"Nhà sử học: tích lũy nghiên cứu case nhỏ để làm rõ sự thật, sửa thuyết cũ (地味な事例研究の積み重ね). ✅C."}]},{"source":"Mon10","bai":13,"date":"07/2016","title":"Mon10 - Bài 13 (07/2016)","passage":"視覚や聴覚などの情報処理においては、脳の働きの個人差は比較的少ない。丸いものを提示すれ\nば、脳はそれを丸いものとして認識する。丸いものを提示した時に、それを「丸」と認識する人と「三角」と\n認識する人が相半ばする (注1)ということはあり得ない。同様に、あるピッチの音を聴いた時に、その情報\n処理に個人差はあまり見られない。\nその一方で、ある事象に対する感情の反応においては、個人によるばらつきが大きくなるのが通例\n(注2) である。同じものを前にしても、全ての人がそれを好きだと感じたり、逆に全ての人がそれを嫌いだ\nと思うとは限らない。ある人が好きだと感じるものを、別の人が嫌いだと思うのはごく普通のことである。感\n情においては、脳の反応に大きな個人差が見られるのである。\nそもそも、感情の働きとは何であろうか?ひと昔前には、感情とはある特定の刺激に対する類型的な\n(注3) 反応であると考えられてきた。 大脳新皮質 (注4) が担っている理性の働きが環境の変化に応じて\n柔軟な情報処理を行うのに対して、「爬虫類の脳」とも呼ばれる古い脳の部位が重要な役割を担う感情\nは、一定の決まり切った反応をするものと思われていたのである。\nしかし、近年の脳科学の発達により、感情は、むしろ生きる上で避けることのできない不確実性に対\nする適応戦略であることが明らかになってきた。理性では割り切れない、結果がどうなるかわからないよう\nな生の状況において、それでも判断し、決断することを支えるための情報処理のメカニズムとして、感情\nは存在していると考えられるに至ったのである。\n(中略)感情が不確実性に対する適応であると考えると、その反応において個人差が生じるのは自然\nなことである。不確実な状況の下では、とるべき選択肢の「正解」は一つとは限らないからである。\nさまざまな人々が異なる戦略をとり、全体としてバラエティが増したほうが、人間という生物種全体とし\nては、むしろ適応的である。生死にかかわるような状況においては、たとえ、ある選択をした人が不幸に\nして死んでしまったとしても、別の選択をした人が生きのびれば生物種としては存続できるからである。\n全体が同じ選択肢を選んでしまっては、環境の変化や予想のできない事態に対して脆弱になって (注5)\nしまう。\n他人が異なる感情の反応を見せることを許容することの倫理的基礎は、まさにこの点にある。他人が\n自分と異なる感情の中にあることに反発するのは自然な心の動きであるが、とらわれて (注6) はいけな\nい。自他の差異に対して許容的であることが、すぐれて生命哲学上の原理にかなっているのである。\n(茂木健一郎「疾走する精神」による)\n(注1) 相半ばする : 同じくらいである\n(注2) 通例:一般的\n(注3) 類型的な : 型どおりの\n(注4) 大脳新皮質 : 脳の一部分\n(注5) 脆弱になる : もろくて弱くなる\n(注6) とらわれる : ここでは、ある考えに縛られる","questions":[{"q":"知覚の情報処理と感情の反応について、筆者はどのように述べているか。","options":["いずれも大きな個人差が見られる。","いずれも個人差はあまり見られない。","知覚の情報処理のほうが大きな個人差が見られる。","感情の反応のほうが大きな個人差が見られる。"],"answer":3,"explain":"Tri giác ít khác biệt cá nhân; cảm xúc khác biệt LỚN giữa các cá nhân (脳の反応に大きな個人差). ✅D."},{"q":"近年、感情の働きはどのようなものだと考えられるようになったか。","options":["避けられない状況を受け入れるためのもの。","避けられない状況において、理性を保つためのもの。","不確実な状況において、判断して決断するためのもの。","不確実な状況において、正解を求めるためのもの。"],"answer":2,"explain":"Quan điểm mới về cảm xúc: chiến lược thích nghi để phán đoán/quyết định trong tình huống bất định (判断し、決断することを支える). ✅C."},{"q":"個人差が生じることがどのようなことにつながるか。","options":["人間という生物種の存続。","人間と他の生物種との共存。","生死にかかわるような事態の減少。","環境の変化に対応できる生物種の増加。"],"answer":0,"explain":"Khác biệt cá nhân → duy trì sự tồn vong cả loài (生物種としては存続できる). ✅A."},{"q":"筆者の考えに合うのはどれか。","options":["人々が生きていくためには、感情の個人差を敏感に察知すべきだ。","人々が生きていく上では、感情の反応の個人差を受け入れたほうがいい。","感情の反応に個人差があることこそが、人間であることのあかしである。","感情の反応に個人差があることは、人間を取り巻く環境の変化によるものである。"],"answer":1,"explain":"Quan điểm tác giả: nên DUNG THỨ sự khác biệt cảm xúc của người khác (差異に対して許容的であることが...原理にかなっている). ✅B."}]},{"source":"Mon10","bai":14,"date":"12/2016","title":"Mon10 - Bài 14 (12/2016)","passage":"暮らしの中で身近な木といえば、街路樹と公園の樹木、そして住宅の庭の木あたりでしょうか。\nいずれも毎日目にはしているものの、あらためて意識することは少ないと思います。でも、例えばこれが\nすべて枯れてしまったとしたらどうでしょう。なんとも寂しく、無味乾燥な、あるいは何か病気を連想させ\nるようなイメージのまちになってしまうのではないでしょうか。また、昨今は、維持管理の面などから街路\n樹を植えないまちなどもあるようですが、一見近代的、未来都市的なイメージもしますが、うるおいやや\nすらぎのないまちのようにも見えます。このようにまちの樹木は、実はとても大きな役割を持っています。\nでは、この木々たちは、ただ植えるだけ、存在するだけでいいのでしょうか。そうではありませ\nん。そこに意味や意義がなければならないのです。わかりやすく言うと、街路樹の樹種を何にするかと\nいうようなことです。その土地の植生(注1) を踏まえ、その上に歴史性や未来性を重ね合わせる。季節\nの移ろいの中で、人々がその木をどのように眺めながら暮らしていくのか。そんな積み重ねの上にはじ\nめて「ここにはこの木を植えよう」ということになる。①それがその木がその場所に存在する意義です。\n住宅の庭木も同じです。単に自分の好みばかりでなく、その木が住宅街の小路をどのように演\n出するのか、まわりとの調和はどうなのか。そんなことを考えていくのがまちづくりの中の「木」です。昨\n今のガーデニングブームで、確かに個々の家の庭は立派になりました。花や木の種類もずいぶん増え\nて、ひと昔前には無かったような色や形も見られます。\nそして、ガーデニングをする人達の情報交流も盛んとなり、新たなコミュニティも生まれているよ\nうです。しかし、いまーつ自分の土地から外に広がっていない感じがします。道路や公園は地域にとっ\nての共有の庭であり、個々の部分と共有の部分が美しくなってこそはじめて全体が美しくなるのです。\n美しく楽しい庭を作っている人々には、②もっと欲張って美しく楽しいまちを作ってほしいと思います,\n「愛でる」という言葉があります。これは主に植物に対して使われます。 満開の桜や初夏の新緑、真夏\nの木陰や秋の紅葉・‥…・。私たちは折々に (注2) 木々を眺め、そこに日々の暮らしを重ね合わせた\nり、育ちゆく木々に子供達の明るい未来を願ったりしているのではないでしょうか。そしてそんな思いを\nこめて水やりや手入れをする。これが「愛でる」ということだと思うのです。その愛でる心と愛でられる\n木々があってはじめてよいまちとなるのです。\n(加藤美浩『まちづくりのススメ』による)\n(注1) その土地の植生 : その土地にどのような植物が生えているか\n(注2) 折々に : ここでは、機会があるごとに","questions":[{"q":"筆者によると、まちの樹木の大きな役割とは何か。","options":["人々に木が身近な存在であることを意識させる。","人々に未来都市的なイメージを与える。","人々を現実の煩わしさから逃れさせる。","人々を落ち着いた気持ちにさせる。"],"answer":3,"explain":"Vai trò cây trong thành phố: mang lại cảm giác êm dịu, bình yên (うるおいやすらぎ). ✅D."},{"q":"①それとはどういうことか。","options":["その土地に暮らす人々の好みに合わせた樹木を植えること。","その土地の特性と人々の暮らしを考慮し、樹木を植えること。","その土地の歴史的な樹木を大切にし、保存すること。","その土地の季節の移ろいを感じさせる樹木を大切にすること。"],"answer":1,"explain":"①それ = xem xét đặc tính vùng đất + cách sống người dân rồi mới chọn cây trồng (その土地の植生を踏まえ...). ✅B."},{"q":"②もっと欲張ってとあるが、筆者の気持ちと合うものはどれか。","options":["自分の好みだけではなく、まち全体との調和も考えてほしい。","ガーデニングをする人達同士で、もっと情報交換をしてほしい。","個々の庭の花や木が、さらに美しく育つようにしてほしい、","個々の庭よりも、まちの共有の部分のほうに力を入れてほしい。"],"answer":0,"explain":"②もっと欲張って = không chỉ theo sở thích cá nhân, mà hài hòa với CẢ THÀNH PHỐ (まわりとの調和). ✅A."},{"q":"筆者の考えに合うのはどれか。","options":["人々がまちの木々を愛でることで、 子供達が自然に関心を持つようになる。","人々がまちの木々を愛でることが、よいまちづくりにつながる。","人々がまちの木々の手入れを怠らなければ、よいまちになる。","人々が季節による木々の変化に関心を持つことで、愛でる心が生まれる。"],"answer":1,"explain":"Kết: 愛でる心と愛でられる木々があってはじめてよいまちとなる = lòng yêu cây góp phần tạo thành phố tốt đẹp. ✅B."}]},{"source":"Mon10","bai":15,"date":"07/2017","title":"Mon10 - Bài 15 (07/2017)","passage":"最寄り駅へと向かう途中、骨董屋さんの前を通る。\nその店が越して来たのは十年ほど前だろうか。はっきりした記憶はないのだが、夫のひとことで興味\nを持った。「毎日どんどん売れる商売じゃないだろうけど、それにしても客が入っているのを見たことない\nよね」という。確かにいつもひっそりと、主とおぼしき人は店の奥にじっと座っているばかり。宅配便の梱包\nされた包みがたくさん置かれていることから、ネット販売専門の店なのだろうか。夫はその後も①不思議\nがっていた。\nそれから一年ほどして、ふいに謎が解けた。\n面識はないが、時おり読んでいた同世代の女性のブログ(注1)にこの店を訪ねた話が載っていた。\n壊れてしまった陶器の修理を頼みに行ったというのである。漆 (注2) を使った金継ぎ、銀継ぎと呼ばれる\n手法で損なわれた部分を修復するのだが、その仕上がりは瑕跡ではなく、景色に見立てることができる\nほど美しい。\n思いがけない近所にそんな専門の工房 (注3) があったとは。 新鮮な驚きとともに、②ひと筋の光が\n射し込んで来る思いがした。我が家にも欠けたからといって捨てられず、破片をそっと薄紙に包んだまま\nにしているものがある。祖母が求め、そして壊してしまった十客揃いの小鉢 (注4) のひとつ。義父が好ん\nで使っていたという杯。 これらをもとの形にもどすことができたら、どんなに心和むことだろう。\nさっそく店を訪ねてみると、「やあ、いらっしゃい」と主はまるでなじみの客のように迎えてくれた。 作\n業の合間に手をゆるめて (注5) いることがあって、店の前の人の行き来を眺めている。「だから近所に住\nんでいる人のことはなんとなくわかるんです。」見ているのはこちらばかりと思ったら大間違いだ。\n③すっかり気が楽になって、こちらの事情を打ち明けた。\n(中略)\n買い替えた方が安あがりとわかっているものでも、使いつづけた愛着があって手放せないという人が\n増えている。一方で、高価な器を使うお料理屋さんが、段ボールいっぱい送りつけてくることもある。「前\nに修理したものがまた新たに壊れてもどってきたり。時々、どういう扱いをしてるのかなと思うことがありま\nすよ。」\n形あるものはいずれは壊れる。この道理があるから、歳月を経て伝えられたものに感謝の念も湧く\nし、儚さと美しさは同義でもある。うっかり手を滑らせる (注6) 瞬間は誰にもあり、取り返しのつかない (注\n7) 事実に直面すると、ため息が出るほど心に重い。\n金継ぎはそんな心の痛手までやさしくいたわってくれる伝統の技術だ。もしもの時に助けてくれる人\nがいると思うと心底有り難い。けれど、だからこそ指先には神経を使ってぞんざいな扱いはすまいと、見\n事に修復された器を手に思っている。\n(青木奈緒『暮しの手帖』2014年10-11月号による)\n(注1) ブログ : 日記形式のウェブサイト\n(注2) 漆を使った金継ぎ、銀継ぎと呼ばれる手法 : 陶器の修理方法の名称\n(注3) 工房 : ここでは、仕事場\n(注4) 十客揃いの小鉢 : 十個揃った小さな器\n(注5) 手をゆるめる : ここでは、休憩する\n(注6) 手を滑らせる: ここでは、落とす\n(注7) 取り返しのつかない : 元の状態に戻すことのできない","questions":[{"q":"①不思議がっていたとあるが、何を不思議がっていたか。","options":["宅配便の荷物が梱包されたまま置かれていること。","十年経っても店の様子が何も変わらないこと。","店なのに客がいるのを見たことがないこと。","店主を一度も見たことがないこと。"],"answer":2,"explain":"①不思議がっていた = lạ vì là tiệm nhưng chưa từng thấy khách ra vào (客が入っているのを見たことない). ✅C."},{"q":"②ひと筋の光が射し込んで来る思いがしたとあるが、なぜか。","options":["同世代の女性が自分と同じ思いを抱いていることがわかったから。","割れてしまった思い出深い陶器を直せそうだとわかったから。","不思議に思っていた店がどのような店かわかったから。","専門的な技術を近所で見られることがわかったから。"],"answer":1,"explain":"②光が射し込む = biết rằng món gốm vỡ quý giá (kỷ vật gia đình) có thể sửa được. ✅B."},{"q":"すっかり気が楽になってとあるが、なぜか。","options":["店主も自分のことを知っていて、親しく接してくれたから。","店主は話しづらい人だと思ったが、そうではなかったから。","店主が仕事の手を休めて話しかけてくれたから。","店主が以前と同じように接してくれたから。"],"answer":0,"explain":"③気が楽になって = chủ tiệm cũng biết về mình, đón tiếp thân thiện như khách quen (なじみの客のように迎えてくれた). ✅A."},{"q":"この文章で述べられている経験を通して、筆者が強く思ったのはどのようなことか。","options":["形あるものは壊れるからこそ、愛情を持って使いたい。","壊れるものには美しさがあり、作り手への感謝の念を忘れてはならない。","壊れたものは修復できても、壊れたときの心の痛手はなくならない。","壊れたものを直す技術があることに感謝しながら、大事に使いたい。"],"answer":3,"explain":"Cảm nhận xuyên suốt: biết ơn kỹ thuật sửa chữa, muốn trân trọng giữ gìn đồ vật cẩn thận hơn (指先には神経を使って...). ✅D."}]},{"source":"Mon10","bai":16,"date":"12/2017","title":"Mon10 - Bài 16 (12/2017)","passage":"互いに視線を向けるという場面では、サルと人間には大きな違いがある。\nサルにとって相手をじっと見つめるのは軽い威嚇(いかく)になり、強いサルの特権である。弱いサル\nは、見つめられたら決して見返してはいけない。挑戦したとみなされて攻撃を受ける羽目になるからだ。\n強いサルの視線を避けて横や下を向くか、歯をむき出して笑ったような表情をすればいい。\n強いサルは自分の優位性を確認できれば、それ以上威嚇(いかく)することはない。ただ、自分が強\nいサルの関心を引きそうな食物に手をかけていたら、すぐさまその場を退いたほうがいいだろう。\n競合する場面では、弱いサルが強いサルに譲るように誰もが期待しているからだ。それがサル社会\nのルールである。\n人間ではサルとは違ったことが起こる。時折「眼(がん)(注1)をつけただろう」とすごまれる(注2)ことが\nあるが、見つめるという行為はふつう威嚇(いかく)にはつながらない。むしろ、相手に積極的な関心を向\nけたり、許容や忠告、愛の表現であったりする。\n視線の向け方にも作法があり、目をかっと見開いたり、細めたり、丸くしたり、四角にしたり、横目や\n流し目、上目づかいや見下すなど、多種多様である。その作法は文化によっても、性別や年齢、身分や\n服装によっても違ってくる。それは人間にとって、顔と顔とを合わせ、視線を交わすことが重要なコミュニ\nケーションであるからだ。\n実際、言葉が発達した私たちの社会でも、重要なことは直接会って決めることが多いし、面接は人\n物を確かめる手段として重用されている。\n(中略)\nところが、現代の情報機器はこの視線の作法をあまり使わなくてもすむ社会をつくってしまった。\n人々は毎日インターネットやメールをのぞくために多くの時間を使っている。家族や親しい仲間とじっくり\n顔を合わせて、対話や協同作業を楽しむ時間を失いつつある。\nその結果、多様な視線の作法を忘れ、他人と視線を合わせることが億劫(おっくう)となっているので\nはないだろうか。だが、言葉は視線のコミュニケーションを代替できない。\n言葉は意味を、視線は感情を伝える。むしろ意味があいまいであるからこそ、視線は暖かくも冷たく\nもなりうるし、そこで受けた印象を後で変えることもできるのである。\n言葉は視覚で得た映像や画像を意味として切り取る。そして文字はその言葉を化石化する装置で\nある。それが持ち運び可能な効率的な手段だからこそ、人間は世界を言葉や文字で塗り替えた。だがそ\nのおかげで、私たちは豊かな心を育んできた視線による対面の世界を忘れようとしている。 それは皮肉\nにもサルのような視線を合わせない、優劣社会に移行することにつながるのではないか、と私は不安に\n思っている。\n(注1)眼(がん)をつける:相手の顔をにらむ\n(注2) すごむ:脅すような態度をとる","questions":[{"q":"筆者によると、サル社会のルールとは何か。","options":["強いサルも弱いサルも、挑戦されれば相手を攻撃する。","強いサルは、弱いサルを威嚇(いかく)することはない。","弱いサルは、強いサルに挑戦するようなことはしない。","弱いサルは、強いサルの関心を引こうとする。"],"answer":2,"explain":"Luật khỉ: khỉ yếu không bao giờ thách thức khỉ mạnh (弱いサルは見つめられたら決して見返してはいけない). ✅C."},{"q":"サルとは違ったこととは何か。","options":["視線以外の手段を使って気持ちを表現すること。","視線の向け方が場面によって決められること。","視線を向け続ければ威嚇(いかく)につながること。","視線を様々な意味に使い分けること。"],"answer":3,"explain":"Khác với khỉ: con người dùng ánh nhìn với NHIỀU Ý NGHĨA khác nhau (許容や忠告、愛の表現). ✅D."},{"q":"筆者は、視線の作法をどのようにとらえているか。","options":["お互いの感情をうまく伝え合うために必要なもの。","言葉によるコミュニケーションの代わりになるもの。","相手にいやな感情を伝えないようにするためのもの。","性別や年齢、身分や服装に惑わされないように使うもの。"],"answer":0,"explain":"視線の作法 cần thiết vì: 顔と顔を合わせ視線を交わすことが重要なコミュニケーション = truyền đạt cảm xúc lẫn nhau. ✅A."},{"q":"筆者の考えに合うものはどれか。","options":["情報機器を使用せずに感情を伝え合うことは難しくなってきている。","情報機器によるよりも対面のほうが、意味を伝え合うには効果的である。","情報機器の使用も視線を交わすことも、コミュニケーションに不可欠である。","情報機器の発達で、視線がコミュニケーションに果たす役割が見失われつつある。"],"answer":3,"explain":"Kết: thiết bị thông tin phát triển → vai trò ánh nhìn trong giao tiếp dần mất đi, lo ngại tiến tới xã hội kiểu khỉ (優劣社会). ✅D."}]},{"source":"Mon10","bai":17,"date":"07/2018","title":"Mon10 - Bài 17 (07/2018)","passage":"タレントがその私生活を自分からマスメディアに公表することは、いまではまったく珍しくなくなっ\nた。これまでマスメディアに私生活を暴露され憤慨してきた彼らが、自らの結婚や離婚、病気などにつ\nいて、自分からファクスでマスメディア に連絡する。もちろん一般の人びとにとっては、知らされてもほと\nんど関係ない話ばかりである。彼らの行動を自己宣伝や売名行為ととらえて眉(注1)をひそめる人も少\nなからずいる。一方でプライバシー保護を訴えておきながら、都合のいいときだけ私生活をさらけ出そう\nとする、というわけだ。\nだが別のとらえ方はこうである。彼らは先手(注2)を打とうとしているのだ。マスメディアに勝手に詮\n索 (注3) され、おもしろおかしく記事にされる前に、自分の方から情報公開してその出ばな(注4)をくじ\nこうという、いわば他人による勝手な物語化に対する予防措置である。\n(中略)\nマスメディアによって自分のイメージをつくられてしまいそうな人びとにとって、自分自身の情報を\n自らコントロールすることの重要度は高い。そうしなければ、他人によって勝手な<私>、自らの物語的\n分身、すなわちファンタジー・ダブルがつくられて、社会を独り歩きし始めることになりかねないからだ。\nそのためにマスメディアを利用しようとするのである。\n昨今、人びとはマスメディアに対抗する強力な情報発信ツールを手に入れた。それはインター\nネットであり、またそれを活用したウェブサイトやブログ(注5)である。人びとはそれらによってさまざまな\n自分の活動、知識や趣味、日常生活、そしてときには心境や悩みなどまで公表するようになった。<私\nづくり>の主導権を確保するうえでは、画期的な手段である。 実際の効果がどの程度かはわからない。\nだがイメージづくりのイニシアティヴをマスメディアに握られていた人びとにとって、自力で公に情報発\n信する有力な手段を手に入れたことに変わりはないだろう。人びとは、今度は自らの手でつくった自分\n自身の物語(ファンタジー・ダブル)を世に出そうとする。\nこれはごく一部の人びとの話だと思われるかもしれない。だがこのことからは、一般的にプライバ\nシーがどのように私たちの自己とかかわっているかをはっきり見て取ることができる。彼らに限らず、一\n般的にプライバシーとはく私づくり>のイニシアティヴの問題である。\n近代社会では、このイニシアティヴは基本的に各個人にあるとされてきた。自分自身がどのような\n人間になるか、そしてどのように生きるかは、その人自身の主体的な意思や選択にゆだねられる。これ\nは個人の人権の一つとされてきたのである。だがこの権利が奪われ、他人が勝手に個人の自己=<私>\nをつくろうとし始めるとき、私たちはプライバシー侵害を訴える。そして何とかく私づくり>のイニシアティ\nヴを自らのもとに引き戻そうとする。\n(注1) 眉をひそめる : 不快な気持ちを表情に出す\n(注 2) 先手を打つ: ここでは、先に動く\n(注3) 詮索する: 細かいところまで調べる\n(注4) 出ばなをくじく: 相手が始めようとしていることを妨げる\n(注5) ブログ: 日記形式のウェブサイト","questions":[{"q":"タレントが私生活を自分からマスメディアに公表することに対して、一般の人びとの間にはどのような意 見があると筆者は述べているか。","options":["プライバシーに対する姿勢が一貫していない。","プライバシー保護の流れに逆行していて好ましくない。","マスメディアに都合よく利用されているだけだ。","マスメディアを利用した情報は信じることができない。"],"answer":0,"explain":"Dư luận: vừa kêu gọi bảo vệ privacy vừa tự công khai khi có lợi → thái độ KHÔNG NHẤT QUÁN (プライバシー保護を訴えながら都合のいいときだけ公表). ✅A."},{"q":"筆者は、なぜタレントは自分から私生活を公表するようになったと考えているか。","options":["多くの情報を公表することで世間にさらに注目されたいから。","プライバシーを守っても自分の宣伝にならないと考えたから。","他人に勝手なイメージをつくられるのを未然に防ぎたいから。","自分のすべてを公表すれば自分を正しく理解してもらえると考えたから。"],"answer":2,"explain":"Lý do tự công khai: ngăn chặn TRƯỚC việc bị tạo hình ảnh sai (他人による勝手な物語化に対する予防措置、先手を打つ). ✅C."},{"q":"強力な情報発信ツールとあるが、筆者はなぜ強力だと考えるのか。","options":["自身の伝えたいイメージが確実に伝わっていくから。","自身についての情報を自力で世の中に発信できるから。","マスメディアより多くの人びとに情報を発信できるから。","マスメディアによる自身のよくないイメージを消せるから。"],"answer":1,"explain":"Công cụ mạnh vì: tự mình phát thông tin trực tiếp ra thế giới, không qua trung gian (自力で公に情報発信). ✅B."},{"q":"現代社会におけるぐ私づくり>について、筆者はどのように考えているか。","options":["＜私づくり＞において、人は主体的であろうとする。","＜私づくり＞において、個人の人権が守られるようになった。","＜私づくり＞の主導権が他人に奪われてしまっている。","＜私づくり＞の主導権を自身のもとに引き戻すことはできない。"],"answer":0,"explain":"Kết luận: 「く私づくり>のイニシアティヴを自らのもとに引き戻そうとする」= con người CHỦ ĐỘNG giành lại quyền tự quyết hình ảnh bản thân. ✅A."}]},{"source":"Mon10","bai":18,"date":"12/2021","title":"Mon10 - Bài 18 (12/2021)","passage":"以下は筆者が本の中で「哲学の役割」について書いたものである。\nここで、大切なのは、とりわけ科学の意義と限界をしっかりと見定めて、人間的知の全体を ほんとうに見\n渡しうる哲学的知の立場を我がのものとすることにある。というのは、科学的知 は、二つの限界を持ち、\nその限界内でしか意義を持たないからである。\n一つには、科学的知は、対象を突き放して、第三者的立場で、自分に関わりのない客観的事 象として\n眺め、しかも、必ずそのつど、特定の観点からだけ対象を扱い、自分が関心を持つ側 面だけを取り上\nげ、それ以外の局面を捨象し、けっして対象の全体を見ようとはしないのである。だから、科学が進むと、\n細分化が必至となり、隣の研究室でやっていることが、お互い にはまったくわからなくなる。専門化と特\n殊化が、科学の運命であり、いかに学際化が叫ばれ ても、根本的には①この傾向には歯止めが利かな\nい。それはちょうど、近代的病院で、病気を 扱う諸部門が、外科や内科等々として、細かく分かれ、人間\n全体を扱ってくれる部署は存在し ないのと、同様である。\n二つには、科学的知は、対象を、自分と無関係な事柄として扱う客観性がその特色をなして いるので、\nそこでは、私たちが、自己として、主体的に決断して実践的に生きてゆく行為の問 題を、本質的に扱うこ\nとができないのである。というのも、ある状況のなかで、いかに生きる べきかをよく考えて、決断し、行為し\nてゆくためには、来し方行く末をよく熟慮して、もはや 無い過去と、いまだ無い将来とを視野に収めなが\nら、現在の状況のなかにつき入ってゆかねば ならない。しかし、そのような無いものを視野に収めなが\nら、記憶と期待という熱い思いを抱 きつつ行為することは、知覚的に有る現在の事実に検証されることに\nよってのみ確実性を得よ うとする科学の実証性とは、まったく別個の事柄だからである。客観的な事実確\n認のみを大事 と考える科学の次元と、人生の岐路に立って、右すべきか左すべきかに思い悩む行為者\nの立場 とは、別個の事柄である。②科学は、いかに生きるべきかという後者の問題を、本質的に扱う こと\nができないのである。\nしたがって、科学とは別に、存在の全体を視野に収め、世界のあり方の原理的全体を考慮して、 世界\n観の知を育むと同時に、そのなかで、人間はいかに生きるであるかという、人間の主体的 な行為の根本\nを考究して、人生観の知を形成するところに、哲学的な知の本質的な成立根拠が あることになる。哲学\nが愛し求める真実の知とは、こうした人生観・世界観の根本的な知にほ かならない。\n(二郎『現代の哲学』による）\n(注) 捨象 (しゃしょう) する：捨て去ろ","questions":[{"q":"科学的にものごとを見るということを、筆者はどのようにとらえているか。","options":["現在の事象の一部だけを取り上げて、客観的な立場で検証する。","関心のある対象だけを客観的な立場で検証し、未来を予測する。","過去の経験をもとにして客観的な立場で現在の状況を扱う。","人間の知の全体を客観的な立場からだけとらえる。"],"answer":0,"explain":"(Bài trùng nội dung với Bài 4 - Triết học) Khoa học: chỉ lấy 1 phần hiện tượng, nhìn khách quan từ góc cụ thể. ✅A."},{"q":"①この傾向とあるが、どのような傾向か。","options":["近代的な研究を行う部門がさらに増えてきた。","特殊な研究対象が排除されるようになってきた。","研究対象をより実践的にとらえるようになってきた。","専門分野が以前より細かく分かれるようになってきた。"],"answer":3,"explain":"①この傾向 = chuyên môn hóa, phân ngành nhỏ. ✅D."},{"q":"②科学は、いかに生きるべきかという後者の問題を、本質的に扱うことができない とあるがなぜか。","options":["客観的な事実確認を重視するものだから。","現在の行為だけを主体的に扱うものだから。","人間全体を解明することができないから。","人間の考えや行為の多くをまだ実証できないから。"],"answer":0,"explain":"②科学は扱えない vì khoa học coi trọng xác thực bằng sự kiện khách quan hiện tại. ✅A."},{"q":"哲学的知の重要性はどこにあるか。","options":["人間の生き方の根本を扱えること。","主体的に考え方法を示せること。","科学的な世界を視野に入れられること","世界のあり方を客観的にとらえられること。"],"answer":0,"explain":"Triết học giải quyết gốc rễ cách sống con người. ✅A."}]},{"source":"Mon10","bai":19,"date":"07/2022","title":"Mon10 - Bài 19 (07/2022)","passage":"大学2回生(注1)の頃だったか、フランス語の文章を講読する授業に出席していたところ、なにかの折\nに先生が、「分かるものを読むのは読書ではなく、分からないものを読むのが読書です」、と仰った。\n(中略)\n先生の言葉を聞いて当時の私は、自分がそれまでに知った限られた知識を確認するだけの本を読む\nのではだめで、自分の知らない考え方や感じ方にふれることによって、自分の偏狭(注2)な物の見方を問\nい直さなければならない。と先生は言いたかったのだろうと思った。先生の言葉に私は感銘し、その時以\n来、当時の私にとってとりわけ難解であったフランス現代思想の哲学者や思想家の本を、理解できるよう\nになるまでとことん読むように心がけた。\nそんな読書を続けるうちに、はたして、難解な本を理解するだけの読書でいいのだろうかと自問するよう\nに なった。というのも、理解するということが、そもそも良いことかと問いかける哲学者や思想家の本を読\nんだ からだ。理解するとは、人であれ物であれ、その人やその物を理にかなった(注3)仕方で知る良い\n方法だ とたいていは言われる。\nしかしながら、理にかなった仕方で、その人の人格なり、その物の本質なりを知ることには、暴力的なと\nこ ろはなにもないのだろうか。理解するということは、唯一存在しているこの人やこの物を、その単独な在\nり方 ではなく、ほかの人やほかの物と共通する一般的な在り方で捉えることだ。私たちがなにかを知ろう\nとする 際に頼りとする概念や観念は、様々な在り方をする諸々 (注4)の存在に当てはまるから役に立つ。\n概念や観念は私たちが知ろうとする対象の在り方に力を加えるわけではないのだから、知る私たちと知\nられる対象の間に立つ中立的な光のようなものだと見なされている。的確な概念や観念をとおして諸々\nの 存在を理解するのは、正しい学間だとされてきた。\nしかしながら、たとえそれが正しくても、この人やこの物が持っている単独のなにかは、理解では捉えら\nれ ないまま、知それ自体のなかで忘却(注5) されてしまいがちだ。なにかを理解できるということは、たし\nかに 人間の優れた能力である。が、それは武器であり、この至高(注6)の武器の前では、およそ存在する\nもの はなんであれ、ほとんど抵抗することができないということを心得ていなければならない。\n(注1)2回生:2年生\n(注2)偏狭な: 偏っていて狭い\n(注3)理にかなった: 合理的な\n(注4)諸々の:ここでは、あらゆる\n(注5)忘却する: 忘れ去る\n(注6)至高:最高","questions":[{"q":"筆者は先生の言葉を聞いて、なんのために読書をするようになったか。","options":["難解な物の見方や考え方を理解するため。","自身の物の見方や考え方を再考するため。","自身の知識を増やすため","自身の知識が正しいかどうか、確認するため。"],"answer":1,"explain":"Sau lời thầy, tác giả đọc sách để xét lại cách nhìn HẸP HÒI của bản thân (自分の偏狭な物の見方を問い直す), không chỉ để hiểu sách khó. ✅B."},{"q":"理解するとはどういうことか。","options":["概念や観念に頼らず、人や物を中立的に捉えること。","概念や観念にとらわれず、人や物の本質を捉えること。","概念や観念を利用して、人や物を単独な在り方で捉えること。","概念や観念をとおして、様々な人や物を共通の枠組みで捉えること。"],"answer":3,"explain":"Hiểu = dùng khái niệm chung để nắm bắt nhiều sự vật theo MỘT KHUNG CHUNG (共通する一般的な在り方で捉える). ✅D."},{"q":"理解することの問題点について、筆者はどのように考えているか。","options":["学問としての正しい在り方に、疑問を持たなくなる。","諸々の存在を個別性や独自性でしか捉えらななる。","人や物の個別性や独自性が見えなくなるおそれがある。","人や物の本質に力を加えて、ゆかめてしまう可能性がある。"],"answer":2,"explain":"Vấn đề của 'hiểu': tính cá biệt/độc đáo riêng của sự vật dễ bị BỎ QUÊN khi quy về khung chung (個別性が捉えられないまま忘却されがち). ✅C."}]},{"source":"Mon10","bai":20,"date":"12/2022","title":"Mon10 - Bài 20 (12/2022)","passage":"以下は、森林を守るボランティア活軌をしている人が書いた文章である。\n世界的に森林や自然の維持、復元に対する関心が高まってきたとき、この気運(注1)を支えた初期 の\n理論は、人間中心主義的な森林・自然維持論、つまり人間の生存や未来にとって森林や自然の維持 は\n不可欠であるという理論であった。いわばそれは、人間のための森林・自然維持論であった。ところが、\nこの考え方は、たちまち暗礁に乗り上げる(注2)。\n第一に、人間のための森林・自然維持論であるかぎり、人間のための森林・自然の開発論を否定でき\nなくなる。なぜなら、どちらも「人間のための」という共通の基盤の上にたっている以上、その違いは価値\n観の違いにすぎず、人間の価値観を統一することなどできないばかりでなく、すべきでもないからであ\nる。\n第二に、「人間のための」といっても、その内容はさまざまである。農山村に暮らす人びとと都市の市民\nとでは、その感じ方は同じではないし、たとえば同じ山村に暮らす者でも、林業経営をしている者とそうで\nない者とでは、考え方が異なってくる。人と森の関係は多様である以上、どうすることが人間のための森\n林・自然の維持なのかと問われれば、その答えはさまざまである。\n第三に、「人間のための」という発想にたつかぎり、「人間のためにならない」自然は破壊してもよいと い\nうことになりかねない。\nこうした問題点があったために、「人間のための」論は、つまり人間中心的な森林・自然維持論は、たち\nまち破綻してしまった。自然保護思想の流れをみるなら、それに代わって生まれた理論は、自然中心主\n義的な考え方であった。それは、人間のためになろうとも、ならなかったとしても、自然はそれ自身のうち\nに生存権をもっており、その生存権は保障されなければならないというものであった。\nところが、この考え方にも問題点があった。なぜならこの理論では、原生林や原生的な自然を維持する\n理論としては有効でも、たとえば日本のような、長い歴史のなかで自然と人間とが相互に影響を与えな\nがら、それぞれが暮らしてきた地域の森林・自然の問題をよく説明できないからである。\n一例をあげれば、かつて農山村の人びとは、自分たちの暮らしを守るために、人家の近くに里山天然\n林をつくりだした。それは、徹底的に人間の手を加えた天然林である。(中略)\n森林ボランティアとは、自発的に森の中で仕事をする人びとである。そうである以上、私たちは、人間\n中心主義的な立場にたっことも、自然中心的な立場にたつこともできない。\nとすれば、どうすればよいのだろうか。この問いに対して、私たちは、森林・自然と人間の関係を持続的\nに維持していくことこそが重要だと考える。単純に人間の未来を守ることでも、森を守ることでもない。森\n林と人間の関係を維持することによって、森と人とが相互的な依存関係をもっている日本の森と人の営\nみを守っていくことである。\n(注1)気運:ここでは、意識の高まり\n(注2) 暗礁に乗り上げる:ここでは、進められなくなる","questions":[{"q":"「人間のための論」の問題点として、筆者の考えに合うのはどれか。","options":["人間のための森林・自然の維持に、結びついていないこと。","人間がいなければ、森林・自然は維持できないと考えていること。","農山村に暮らす人間の考え方が優先されすぎていること。","森林・自然の維持に対する考え方は、立場によって異なること。"],"answer":3,"explain":"Vấn đề 'thuyết nhân loại trung tâm': quan điểm về bảo vệ rừng khác nhau tùy lập trường mỗi người/vùng (人と森の関係は多様...答えはさまざま). ✅D."},{"q":"筆者によると、日本に関して、自然中心主義的な考え方が問題なのはなぜか。","options":["人間の介入によって、維持されてきた森林・自然もあるから。","人間が手を加えずに、原生林や原生的な自然を維持するのは難しいから。","自然の維持よりも人間の暮らしを守ることが優先されているから。","自然の生存権を保障することについて、人間の理解が得られないから。"],"answer":0,"explain":"'Thuyết tự nhiên trung tâm' có vấn đề ở Nhật vì: có rừng được DUY TRÌ nhờ chính sự can thiệp của con người (里山天然林、徹底的に人間の手を加えた). ✅A."},{"q":"筆者によると、森林ボランティアの役割とは何か。","options":["人間を中心として、森林・自然との関係を維持していくこと。","人間の営みを制限して、森林・自然との新たな関係を見付け出すこと。","森林・自然と人間が共存できる関係を維持していくこと。","森林・自然が持続できるように、できるだけ自然に任せること。"],"answer":2,"explain":"Vai trò tình nguyện viên rừng: duy trì quan hệ TƯƠNG HỖ giữa rừng-người, không đứng hẳn về phía nào (森林・自然と人間の関係を持続的に維持). ✅C."}]},{"source":"Mon10","bai":21,"date":"07/2023","title":"Mon10 - Bài 21 (07/2023)","passage":"以下は、筆者がほかの研究員とともに開発したロボットについて書かれた文章である。\n通常、ロボットに対するプログラミングは、センサから取得した情報に応じてロボットが何らかの反応を\nするようなものを作っていく。たとえば「障害物を察知したら避ける」といった具合のものである。しかし、 ・\n僕はロボピーがもっと適当に、意味のない動きも含めてさまざまな行動を取るようにしたのだ。\n300 以上の動作プログラムをし、動作パターンが次々にどういう順番で発現するかというルールを 700\n以上プログラムした。その結果複雑に、多様に動くロボットが実現された。ここまでやると、自分た ちでも\nプログラムがどう作用するかわからなくなる。何に反応して、どんな行動をするか予測不能にな った。\nそんなプログラミングをしておいたロボピーを研究室に置いていたら、何が起こったか。僕らがミー ティ\nングをしているとき、突然ロボピーは僕らの音声を認識し、「そうではないよ」と言って手をぶらぶら させな\nがらどこかへ向かって歩きだしたのだ。それを見て僕らは呆気にとられながらも、ロボピーに意 思を感じ\nてしまった。僕らの話を聞いていて、彼は思うところがあり、だからどこかへ行ってしまったのだ ろう、と。\nもちろんそれは、ロボピーの中のあるプログラムが、何かをきっかけに作動しただけのことだ。だがな に\nか首尾一貫したひとつの意思決定機構から生み出された行動であるかのように見えたのだ。\n僕はそのとき確信した。「心とは、観察する側の問題である」と。\n非常に単純な機械の動きに「心を感じますか」と問えば、感じると言う人は少ない。多少複雑でも、 原\n理を知っていれば「それは心ではない」と言う。しかし、人間は複雑である。いや、虫程度でもいい。 動き\nが相当以上に複雑なものに対しては、相手のことを一から、すべては理解しきれない。自分の頭の 中で\n完全に再現しきれない、解釈しきれない、理解しきれないほど複雑なもの、仕組みがよくわからな いくら\nい入りくんだものが目の前にあると、「こいつは、私の知らないところで勝手に独立して考え、動 いている\nのだろう」という想像が働く。その浮かんできた想像に名前をつけずにはいられなくなる。それ を「心」と呼\nんでいるのだ。\n心とは、複雑に動くモノに現実的にあるというより、その動きを見ている側が想像しているものなのだ。\nそしてその心は、見ている側の自分にもないと都合が悪い。とくに人間同士であればお互いに「心があ\nる」と感じてしまっている。だからひとはみな「自分には心がある」と思う。しかし心は、実は自分の中に い\nくら問い合わせ、内省してみてもしょうがない。相手を観察し、想像することでしかわからないものな の\nだ。","questions":[{"q":"ロボピーが、ほかのロボットと異なる点は何か。","options":["動作パターンが限られているので、ある程度動きが予測できる。","与えられた情報の一部を自分で判断して動くので、動きが予測できない。","どう動くかというプログラムを多数組み込んだので、動きが予測できない。","多様で複雑な動作をプログラムしたので、人間のように自然な動きができる。"],"answer":2,"explain":"Robopy khác robot khác: lập trình QUÁ NHIỀU pattern/rule (300+700) khiến hành động không thể dự đoán, không phải tự 'phán đoán' từ thông tin. ✅C."},{"q":"どこかへ向かって歩きだしたとあるが、その時筆者にはどのように思えたか。","options":["プログラムに間違いがあり、ロボピーに意思が生まれて動いた","プログラムが作動したのではなく、ロボピー自身が考えて動いた。","プログラムが作動して、意思があるかのようにロボピーが動いた。","プログラムが誤作動して、制作者の意図に反してロボピーが動いた。"],"answer":2,"explain":"Khi robot bước đi: chương trình tự kích hoạt nhưng TRÔNG NHƯ có ý chí (もちろんプログラムが作動しただけだが、意思決定機構から生み出された行動であるかのよう). ✅C."},{"q":"「心」について、筆者はどのように考えているか。","options":["あると思って観察すれば、複雑な動きの意図が理解できる。","実体がないので、あるとかないとか想像しても意味がない。","仕組みが複雑すぎるため、人間同士であっても想像できない。","理解しきれない複雑な動きを見たときに、人間が想像するものだ。"],"answer":3,"explain":"Kết luận về 'tâm': con người TƯỞNG TƯỢNG ra 'tâm' khi nhìn vận động quá phức tạp không thể hiểu hết (理解しきれないほど複雑なものを見ると想像が働く). ✅D."}]},{"source":"Mon10","bai":22,"date":"12/2023","title":"Mon10 - Bài 22 (12/2023)","passage":"以下は、報道写真を撮る人が書いた文章である。\n写真の発表の場が減ったことで、その未来を懸念する声が多いが、私は、そうは思わな い。音も動きも\nなく、数千分の一秒という高速で動きを止める写真は、テレビと比べると 臨場感では劣り、「伝えるための\nメディア」としては原始的なのかもしれない。しかし、テ レビのように用意された答えを差し出し、「こうで\nす」と押しつけるのとは違って、写真に は、すべてが提示されていないからこそ、それを補うための想像\n力が必要となる。(中略)\n写真の一瞬に込められた意味を想像すること。その瞬間の前と後、あるいは、写ってい ないものにまで\n思いをめぐらせること。さらに写っているものに、どう自分を重ね合わせ、 何を感じ取るかということ。想像\n力を伸びやかに働かせることで、私たちは周りに流され ずに、「いまの時代」を自分なりに感じ取ることが\nできるはずだ。\nしかし、想像力を呼び起こすためには、写真に「絵」としての力があることが必要条件 となる。最初に\n「絵画」の構成力や力強さといったものがあってこそ、人を惹きつけるこ とができるはずで、そこから何を\n感じてもらうかはその次のこととなる。\n写真を始めた頃、「名作」と呼ばれる写真をたくさん見るように努めた。ロバート・キャ パの「倒れし兵\n士」、カルティエ・ブレッソンの「水たまりを飛ぶ男」、ユージン・スミ スの「シュバイッツア博士」…………･･\n･。それらの写真を前に、「どうして名作なのか」と考え た。その時は、すぐには答えが見つからなかった\nが、いま思うのは、「名作とは見る人が、 それぞれに感じ取れるものがある写真」ということだ。悲しい時、\nうれしい時、その時々 の心のあり様によって、一枚の写真から感じるものは違ってくる。若い時に、私が\n感動し た写真でも、いま見ると、さほど感じないというものもあるし、逆に、若い頃は何も感じ なかった写\n真がいまになって心に迫ってくることもある。様々な人が、心のままに写真に 向き合い、そこからいろいろ\nなメッセージをくみとれる写真が、多くの人に支持され、時 を越えて残っていく名作なのだと思う。\n写真の力が失われていると嘆く人もいるが、いまはカメラ付き携帯電話が普及し、多く の場所で写真を\n撮ることができる時代でもある。その意味では、一億総カメラマンの時代 といえるのかもしれない。誰もが\n撮ることができる時代だからこそ、独自の視点で、他の人が見逃していたアングルで素晴らしい写真を撮\nることができれば、多くの人たちによさ が認めてもらえる環境が整ったといえるのではないだろうか。\n(注) アングル:角度","questions":[{"q":"写真とテレビの映像について、筆者の考えに合うのはどれか。","options":["想像力を働かせて写真を見れば、映像と同じような臨場感が得られる。","写真のほうが原始的だからこそ、見る人に簡潔に意味が伝わる。","写真は一瞬しか写し出されていないため、映像より見る人の想像力が必要だ。","写真は写っていないものがある分、見る人が自分を重ね合わせるのが難しい。"],"answer":2,"explain":"Ảnh vs Video: ảnh chỉ ghi 1 khoảnh khắc, thiếu thông tin → cần TƯỞNG TƯỢNG nhiều hơn so với video đầy đủ. ✅C."},{"q":"「名作」と呼ばれる写真について、筆者はどのように考えているか。","options":["若い時に価値が分からなくても、年を取るとよさが分かるようになる。","多くのメッセージを含んでおり、見る人に様々な感情を呼び起こす。","明確な一つのメッセージが伝わるような構成力や力強さがある。","見る人や心の状態によって、受け取るメッセージが違う。"],"answer":3,"explain":"'Tác phẩm để đời': tùy người xem & trạng thái tâm lý mà cảm nhận khác nhau mỗi lần xem lại (心のあり様によって感じるものは違ってくる). ✅D."},{"q":"写真について、筆者の考えに合うのはどれか。","options":["誰もがどこでも撮れる時代になり、心に迫るものを撮ることが難しくなっている。","想像力を生かせば、他の人が見逃していた視点で撮れる環境が整ってきている。","他の人にはない視点で想像力を呼び起こすものが撮れれば、力を持ち続ける。","技術の進歩 で誰でもよいものが撮れるようになり、力が再認識されている。"],"answer":2,"explain":"Ai cũng chụp được (camera điện thoại) nhưng góc nhìn ĐỘC ĐÁO, gợi tưởng tượng mới giữ được giá trị lâu dài. ✅B."}]},{"source":"Mon10","bai":23,"date":"07/2024","title":"Mon10 - Bài 23 (07/2024)","passage":"以下は、ある数学者が書いた文章である。\n数学というものは、解き方がわかってしまったあとで、力がつくことはない。解き方を身につける前の、 ま\nだ解き方のわからない間だけが、力をつけるチャンスである。解けるようになるのは同じでも、それま での\nあり方で、力が身につくかどうかが、きまってくる。\nそれに、おもしろいのも、本当は、まだ解けないで、いろいろと考えている間である。解けなきゃつまら\nないようだが、それは早く解こうとあせるからで、楽しみは解けるまでのほうにある。解けるようになった あ\nとは、むしろむなしい。だいたい、「答えのわかっている謎」なんて、意味がない。解き方がわからない か\nらこそ、問題の名にあたいするのだ。\nもちろん、まったく手がつかない(注1)のでは、おもしろくもないが、案外に、多少はわからないでも、う\nまく頭のなかに飼っておくと、そのうちに馴れてくれて、わかってきたりする。その、だんだん少しずつ、わ\nかりかけというのも、オツな(注2)ものだ。そのためには、それを飼っておく、頭の牧場がゆたかでなけれ\nばならない。本当のところは、数学の力というのは、いろいろとわかったことをためこむより、わからない の\nを飼っておける、その牧場のゆたかさのほうにあるのかもしれない。\nとくに、公式などをおぼえるのには、ぼくは反対である。それは簡単すぎて、少しもおもしろくないし、 お\nぼえたものは忘れるものだ。とくに、急いでおぼえたものは、早く忘れる。同じおぼえるにしても、なる べく\nなら時間をかけたほうが、長持ちする。\n(中略)\nこのごろは、テストでおどされる(注3)ことが多いので、わかること、解けることを急ぐ傾向にある。たし か\nに、テストなどでは、時間がかぎられているので、急ぐのも多少は仕方がない。しかしながら、時間を 制\n限されたときに急いでできるためには、時間の制限されていないときに、時間を気にしないでやって おい\nたほうがよい。テストで急ぐためには、テスト以外では急がないほうがよいのである。\nどんなやり方でも、わかって、問題が解けるようになる、という結果は同じかもしれない。しかし、ゆっ たり\nとやると、そのわかり方にコク(注4)が出てくるものだ。そして、その結果に達するまでの道筋を楽しむ こと\nで、力がつく。\n勉強を楽しむなんて、と思うかもしれないが、それは目的ばかり見てあせるからで、楽しむ気になれ\nば、なんだって楽しめるものだ。\n(注1) 手がつかない。ここでは、できない\n(注2) オツな:ここでは、おもしろい\n(注3) おどされる: ここでは、早く問題を解かされる\n(注4) コク:深み","questions":[{"q":"数学の問題を解くことについて、筆者の考えに合うのはどれか。","options":["早く解けなくても、解き方を身につけることが大切だ。","解けても解けなくても、問題に取り組むことが大切だ。","解けなかった問題が解けるようになったらおもしろくなる。","解き方のわからない問題を解こうとすることに意味がある。"],"answer":3,"explain":"Cố giải bài CHƯA biết cách giải mới có ý nghĩa/sức hút (解き方がわからないからこそ問題の名にあたいする), không phải mục tiêu giải nhanh. ✅D."},{"q":"頭のなかに飼っておくとはどういうことか。","options":["わかる問題を手がかりにして、わからない問題を考えること。","わかる問題とわからない問題を、頭のなかで区別しておくこと。","わからない問題をわかるまで解き続けていること。","わからない状態のまま、問題を頭のなかに残しておくこと。"],"answer":3,"explain":"頭の中に飼っておく = giữ trạng thái CHƯA HIỂU trong đầu, không vội tìm đáp án ngay (わからない状態のまま頭のなかに残しておく). ✅D."},{"q":"筆者によると、どのように勉強すればよいか。","options":["結果を急がずに、考えることを楽しむ。","結果に達することができれば、どんなやり方でもよい。","目的を忘れないで、あせらずに勉強を楽しめばよい。","自分に合ったやり方を探して、時間を気にせず取り組む。"],"answer":0,"explain":"Cách học nên có: không vội kết quả, tận hưởng QUÁ TRÌNH suy nghĩ (結果に達するまでの道筋を楽しむ). ✅A."}]},{"source":"Mon10","bai":24,"date":"12/2024","title":"Mon10 - Bài 24 (12/2024)","passage":"教育を仕事にしていると、面白いことがたくさんある。その中の一つに、「未熟さの効用」とでも 言うべき\n現象がある。知識や教育技術がたとえ未熟であったとしても、不思議と初めて受け持っ た授業が生徒と\nの間に一番濃い縁を結ぶことがよくある。\n通常の仕事は、経験を積み、技術が上がるほど、質が良くなる。教育の界でも、もちろん経 験知は有\n効に働く。ベテランの安定感は、たしかに大切だ。しかし、教育の場合は、若く未熟であ ることがむしろプ\nラスに働くケースがよくあるのも事実だ。初年度に受け持った学生たちのことが 鮮明に記憶に残り、その\n後のつき合いも深い、という経験が私にもある。\nこれはどういうことだろうか。まず考えられるのは、初年度の緊張感が、学生たちに新鮮な印象 を与え\nたということだ。慣れてくると手際が良くなる。すると、学生たちは、安心する一方で油断が 出る。レストラ\nンで手際のいいコックに料理を出してもらうような気分で、授業を受け始めてしまう のだ。授業を上手に\nサービスする側と、サービスされる側に、立場がはっきり分かれてしまう。先 生はいかにも先生らしく、生\n徒はいかにも生徒らしい。\nこうした関係は、安定はしているが、ときに新鮮さに欠ける。これに対して、初年度の教師が持 つ緊張\n感は、生徒にも伝染する。その緊張感の共有が、一つの同じ場を作り上げているのだとい う意識を生み\nだす。参加し作り上げる感覚が、生徒の方にも生まれる。それが思い出の濃さにも つながる。\nここで初年度というのは、教師になって初めての年度というだけではない。学校を替わって、教 師が新\nたな気持ちで臨むときも新鮮さが出る。あるいは新しい教科を担当し、一生懸命勉強し て多少の不安を\n持ちながらも勢いをつけて切り抜けていくときにも、印象深い授業ができやすい。\nただ単に未熟であることがいいわけではもちろんない。自分が未熟であることを自覚し、その 分精一杯\n準備し、情熱を持って語りかけるときに、未熟さがプラスに転じるのだ。\n教育において「新鮮さ」は決定的な重要性を持っている。いわゆる「教師臭さ」は、学ぶ側の 構えを鈍く\nさせてしまう。型どおりの教え方が染みついてしまっている、という印象を与えてしまう だけで大きなマイ\nナスになるのだ。「決まり切った感じ」を印象として与えないようにすることが大 切である。経験知を重ねる\n良さを残したまま、新鮮さを失わない。これは、もはや一つの技である。 「先生も自分たちと一緒に変化し\nてくれるのだ」という意識が学ぶ側に生まれると、場を一緒に 盛り上げる機運が高まる。","questions":[{"q":"筆者によると、教育の仕事は通常の仕事とどのような点で異なるか。","options":["知識や技術の高さよりも人格の良さの方が重視される。","知識や技術が十分でなくても良い結果を生むことがある。","経験の豊富なベテランより、若く未熟な方が好かれやすい。","経験を積み技術が上がっても、仕事の質が良くなるとは限らない。"],"answer":1,"explain":"Giáo dục khác công việc thường: kiến thức/kỹ năng CHƯA ĐỦ vẫn có thể tạo kết quả tốt (未熟さの効用、不思議と一番濃い縁を結ぶ). ✅B."},{"q":"筆者によると、初年度の教師の緊張感は学生たちにどのように影響するか。","options":["積極的に授業に参加し、教師の緊張感を和らげようとする。","教師の立場を理解し、生徒らしい態度で授業を受けようとする。","教師と一緒に授業を作っているのだという気持ちになる。","教師と緊張感が共有でき、心を開いていいのだと思うようになる。"],"answer":2,"explain":"Sự căng thẳng của giáo viên năm đầu lan sang học sinh → cảm thấy đang CÙNG xây dựng buổi học (緊張感の共有...参加し作り上げる感覚). ✅C."},{"q":"筆者によると、教育を仕事にしている人間にとって大切なことは何か。","options":["経験に満足することなく、自ら変化し続けようとすること。","新鮮さを失わないために、自ら新しい知識や技術を身につけること。","自らの足りなさを補いつつ、情熱を持って接すること。","自らの未熟さを隠さずに、学ぶ側が一体感を得やすくすること。"],"answer":0,"explain":"Quan trọng nhất: không hài lòng với kinh nghiệm cũ, TỰ MÌNH tiếp tục thay đổi giữ sự mới mẻ (経験知を重ねる良さを残したまま、新鮮さを失わない). ✅A."}]},{"source":"Mon12","bai":1,"date":"07/2010","title":"Mon12 - Bài 1 (07/2010)","passage":"ĐỌC MD12 - Trường văn (2) N1\n給与には外的報酬と内的報酬のふたつがある。\n外的報酬とは給与そのものやインセンティブ（賞励金）といったお金として受け取れるものであ\nる。それに対して内的報酬とは、給与の額には表れないが、その仕事を通して得られる満足の報酬と\nいったものである。\nたとえば、こんな給与はどうだろうか。\n外部の人と知り合う機会がある「出会い給与」、そこにいるだけで新しい情報に触れられる「情報\n供与」、専門的な技を習得できる「技磨き給与」、気の合った仲間と一緒にいられる「ふれあい給与」、そ\nして一流の人をそばで（注1）ウォッチできる「おそば給与」など、そんな給与の名称はないが、あると嬉\nしい給与である。\n私の場合、外的報酬よりも内的報酬を増やすことを心がけてきた。\nたしかに、同僚よりも低く評価されたショックは今でも忘れられないし、同期とのボーナスの差が\n何十万もあって愕然としたこともあった。\nしかし、生活が脅されるほどの額でもないと割り切れば、目に見えない給与を増やすほうが個人\n的な満足は高いことがわかったのである。\nまた、仕事を長く続けていくには、内的報酬がちゃんとなくてはつとまらないということもわかって\nきた。\n仕事をなし遂げたときの「達成感」や、自分が成長していることを実感できる「成長感」こそ仕事\nの原動力であって、他人からの評価という、自分の努力では（注2）いかんともしがたいものにとらわれす\nぎるのは得策ではないと気づいたのである。\n（中略）\nどんなに外的報酬が高くても内的報酬が極端に低い仕事だと、長く続けることはできない。ま\nた、①そこで得たお金は身につかないことが多い。\nいっぽう、内的報酬の高い仕事なら、もしかしたら将来（注3）ビッグな報酬に化けるかもしれな\nい。その可能性は充分にあると言っていい。たとえ戻ってこなかったとしても、続けていけるよさはある。\n私の友人に、編集部で十年間アルバイトを続けた人がいる。正社員に比べて給与は低く、ボーナスも、\n退職金ももちろんない。\nしかし、その後（注4）フリーになった友人は、正社員よりもはるかに多い報酬を得るようになっ\nた。アルバイトの十年間で技術を身につけ、人脈を培い、仕事の幅を広げた、②まさに内的報酬が外\n的報酬へと実を結んでいったのである。\n時価で給与を計るより、心の満足を含めたトータルかつ長期の視点で報酬をとらえないと、結局\nのところ給与は増えていかないのだと思う。\n（松永真理『シゴトのココロ』による）\n（注1）ウォッチできる：ここでは、観察できること\n（注2）いかんともしがたい：どうしようもない\n（注3）ビッグな：大きな\n（注4）フリー：フリーランスの略。特定の組織に所属せず自由に仕事をする人","questions":[{"q":".外的報酬と内的報酬の説明として本文と合っているものはどれか。","options":["外的報酬は給与として得られるものであり、内的報酬は長期的には満足感が得られないもの","外的報酬は仕事の幅を広げるのに必要なものであり、内的報酬は会社から評価され給与として得られる もの","外的報酬は将来の自分のために必要なものであり、内的報酬は自分の努力では得られないもの","外的報酬は他人から評価され得られるものであり、内的報酬は仕事を長く続けるために必要なもの"],"answer":3,"explain":"外的報酬 = được người khác đánh giá; 内的報酬 = cần thiết để duy trì công việc LÂU DÀI (仕事を長く続けていくには内的報酬がちゃんとなくてはつとまらない). ✅D."},{"q":"①そこで得たお金とあるが、そことは何を指しているか。","options":["やりがいのある仕事","内容に釣り合わない仕事","報酬の低い仕事","心の満足感を伴わない仕事"],"answer":3,"explain":"①そこ = công việc lương ngoại cao nhưng nội tại CỰC THẤP → 'tiền kiếm được không giữ được lâu' = công việc thiếu sự hài lòng tâm hồn. ✅D."},{"q":"②まさに内的報酬が外的報酬へと実を結んでいったとあるが、どういうことか。","options":["仕事に慣れて早く片づけられるようになり、同僚と同じ金額の収入を得た。","成長感や達成感を得るために働いてきたことが、高い収入につながった。","10年間アルバイトを続けて、正社員と同じ収入を得られるようになった。","ボーナスも退職金もないが、同じ会社で仕事を続けた結果、収入が増えた。"],"answer":1,"explain":"②内的報酬が外的報酬に実を結ぶ: bạn của tác giả làm vì thành tựu/trưởng thành (内的) → sau đó dẫn đến thu nhập cao (外的). ✅B."},{"q":"この文章で筆者が最も言いたいことはどれか。","options":["人脈や仕事の幅を広げて高い収入を得ることができれば、それが仕事の原動力になる。","見えないところで努力して仕事をすれば、他人が高く評価してくれ、いつか収入も高くなる。","大きな収入を得たいと考えるなら、アルバイトを続け高い技術や人脈を得ることが大切だ。","すぐに高い収入に結びつかなくても、心の満足感を重視して仕事を続けることが大切だ。"],"answer":3,"explain":"Ý chính: dù chưa có thu nhập cao NGAY, vẫn nên coi trọng sự hài lòng nội tâm để tiếp tục công việc lâu dài. ✅D."}]},{"source":"Mon12","bai":2,"date":"12/2010","title":"Mon12 - Bài 2 (12/2010)","passage":"例えば、 3年間ずっとノーミスでやってきた論田くんが、はじめてミスを出した。\n3年前からずっとその仕事ぶりを観てきた上司と、異動していきなり論田くんのミスに出くわした上司\nと、論田くんへの印象は同じだろうか?\n両者のミスの「情報占有率」がちがう。つまり、3年間のつきあいの中で、ミスが占める割合\nと、たった1回初めて論田くんと接した中で、ミスが占める割合と。\n相手は、貴方が過去からずっと積み上げてきたすべての情報で、貴方を判断するのでは\nない。結局は、そのとき相手が持っている情報だけで判断される。その中で、いい情報の占める割\n合が多ければ「いい人だ」となる。\nあなたが「優しい人」で10年間怒ったことがなかったとしても、10年ぶりに怒ったとき、たまた\nま出くわした初対面の相手にとっては、それが 100%だ。あなたを「恐い人」だと思う。自分にふさわ\nしい「メディアカ」を相手の中に刻むために、ちょっと「情報占有率」を意識してみるといい,コミュニ\nケーションでは、出会いからはじまって、相手から見たあなたの「メディアカ」が決まるまでの間が肝\n心だ。つまり、初めの方が慎重さきがいる。ここで、かっこつけるのでもなく、でも、あなた以下にも\nならず、等身大の (注1) あなたの良さが伝わるのが理想だ。\nいつも質の高い仕事をしているなら、はじめての仕事先に対し、決していつもの質を落とし\nてはいけない。ふだん静かな人なら、初対面の相手にも、奇をてらったり (注2) せず、普段どおり\n静かにしていればいい。自分にうそのないふるまいをする、ということは、初対面の相手にこそ大切\nだ。\nさて、ここで問題なのは、ふだんとても穏やかなあなたが、その日はたまたま嫌なことが重\nなり、攻撃的になっているという場合だ。自分にうそのないということで、相手にきついことを言って\nしまったらどうだろう。あなたにとっては、年に1 回の、「たまたま不機嫌な日」でも、相手にとって\nは、あなたに関する情報の100%になる。初対面の相手、まだ付き合いの浅い相手には、すこし慎\n重になって考えてほしい。\n何が、自分にうそのないふるまいか? 自分の正直な姿を伝えるとはどういうことか?\n日ごろ99 %穏やかなあなたなら、 1 %の異常よりも、いつもの穏やかさを伝えるほうが、結\n局は、正直な姿を伝えている。相手の中に、あなたの実像に近い「メディアカ」が形成されるから\nだ。初対面の相手にこそ、平常心でいること、普段どおりにやることが大切だ。\n(山田ズーニー『あなたの話はなぜ「通じない」のか』による)\n(注1) 等身大の : 誇張のない\n(注2) 奇をてらう : 変わったことをして、他人の気をひこうとする","questions":[{"q":"筆者によれば、上司にとって論田くんのミスの「情報占有率」が上がるのはどのような場合か。","options":["付き合いの長い上司との関係の中で、論田くんがミスを1回した場合","付き合いの長い上司との関係の中で、論田くんがミスを3回した場合","付き合いの短い上司との関係の中で、論田くんがミスを1回した場合","付き合いの短い上司との関係の中で、論田くんがミスを3回した場合"],"answer":3,"explain":"'Tỉ lệ chiếm thông tin' tăng cao nhất khi: quan hệ NGẮN + nhiều lần lỗi (3 lần) → tỉ lệ lỗi trong tổng thông tin biết về người đó tăng vọt. ✅D."},{"q":"自分にうそのないふるまいとはどのようなものか。","options":["その時々のすなおな気持ちを表すこと","いつも正直に自分の考えを伝えること","いつもどおりの姿を見せること","うそをつかず正直に話すこと"],"answer":2,"explain":"'Không giả tạo với bản thân' = thể hiện ĐÚNG NHƯ BÌNH THƯỜNG (いつもどおりの姿を見せる), không phải bộc lộ cảm xúc thoáng qua. ✅C."},{"q":"筆者は、なぜ初対面の相手に慎重になったほうがいいと述べているのか。","options":["普段どおりの態度では、相手に自分の良さを十分に伝えられないから","自分に関する一部の情報で相手がすべてを判断するかもしれないから","相手の性格が自分と合うかどうかがまだよくわかっていないから","初対面の相手には慎重な姿が実像だと思わせる必要があるから"],"answer":1,"explain":"Cần cẩn trọng với người mới gặp vì: họ chỉ có 1 PHẦN thông tin nhưng có thể đánh giá toàn bộ dựa vào đó (一部の情報ですべてを判断するかもしれない). ✅B."},{"q":"自分に「メディアカ」について、筆者はどのようにするのがよいと述べているか。","options":["相手に自分の「メディア」が正確に伝わるように意識する。","相手に普段の自分以上の「メディア」を伝えるようにする。","相手に刻まれた自分の「メディア」を気にせず平常心でいる。","相手に見せる自分の「メディア」を下げないように静かにしている。"],"answer":0,"explain":"Về 'mediaryoku': nên ý thức để nó được truyền tải CHÍNH XÁC, đúng thực tế đến người khác. ✅A."}]},{"source":"Mon12","bai":3,"date":"07/2011","title":"Mon12 - Bài 3 (07/2011)","passage":"最近、思想を表現する方法について考えることが多くなった。たとえば、文章は思想を表現\nする方法のひとつだけれど、その文章にもいろいろな表現形式がある。哲学の勉強をはじめた頃\nの私は、さまざまな形式のなかで論文という形式だけが、思想表現の方法にふさわしいと思ってい\nた。\nしかし、後に、この考え方を訂正しなければならなくなった。思想の表現として、論文が唯一\nの方法だということは絶対にない。私たちは、すぐれたエッセーや小説、詩をとおして、しばしば思\n想を学びとる。とすれば、思想を表現する文章のかたちは、自在であってよいはずである。\nところが、そう考えてもまだ問題はある。というのは、思想の表現形式は、文章というかたちを\nとるとは限らないのだから。絵でも彫刻でも、音楽でも、つまり実にさまざまなものを用いて、思想を\n表現するのは可能なはずである。そのなかには、かたちにならないものもある。\nたとえば私の村に暮らす人々のなかに、自然に対する深い思想をもっていない人など一人\nもいない。村の面積の96パーセントを森や川がしめるこの村で、自然に対する思想をもたなかった\nら、人は暮らしていけない。ところが村人は、＜自然について＞などという論文を書くことも、文章を\n書くこともないのである。そればかりか、自分の自然哲学を、絵や音楽で表現しようとも考えない。\nそんなふうにみていくと、村人は自然に対してだけではなく、農についての深い思想や、村\nとは何かという思想をももっているのに、それらを何らかのかたちで表現することも、またないのであ\nる。\nとすると、村人たちは、どんな方法で自分たちの思想を表現しているのであろうか。私は、そ\nれは、＜作法＞をとおしてではないかという気がする。\n（中略）\n考えてみれば、もともとは、作法は、思想と結びつきながら伝承されてきたものであった。たと\nえば昔は、食事の作法を厳しくしつけられた。食べ物を残すことはもちろんのこと、さわぎながら食\n事をすることも、けっしてしてはいけなかった。それは、食事は生命をいただくものだ、という厳かな\n思想があったからである。茶碗の中の米だけをみても、人間はおそらく何万という生命をいただか\nなければならない。だから、そういう人間のあり方を考えながら、いま自分の身体のなかへと移って\nくれる生命に感謝する。この思想が食事の作法をつくりだした。\nところが、近代から現代の思想は、このような、日々の暮らしとともにあった思想を無視したので\nある。その結果、思想は、文章という表現形式をもち、文章を書く思想家のものになった。そして、い\nつの間にか人間の上に君臨し、現実を支配する手段になっていった。\n(内山節『「里」という思想』による)","questions":[{"q":"かたちにならないものとして筆者が挙げているのはどれか。","options":["自然","生命","感謝","作法"],"answer":0,"explain":"'Cái không thành hình' = 作法 (lễ nghi/cách ứng xử) - cách biểu hiện tư tưởng KHÔNG có hình thức văn bản/tác phẩm cụ thể. ✅A."},{"q":"この文章中で筆者は、自分の村に暮らす人々がどんな思想をもっていると述べているか。","options":["自然の中で生きるための思想や、農業や村のあり方についての思想","自然を壊さずに暮らすために、農業や村人はどうあるべきかという思想","自然に対する感謝を表すために、村人としてどうするべきかという思想","自然を取り戻すための思想や、自然を利用する農業のあり方についての思想"],"answer":0,"explain":"Người dân làng có tư tưởng: sống hòa với tự nhiên + về nông nghiệp/làng xã (自然の中で生きる思想、農や村についての思想). ✅A."},{"q":"食事の作法は、次のどのような考え方と結びついているか。","options":["多くの労力がささげられて作られた食べ物が、いかに尊いものであるかという考え方","何かを食べないでは生きてはいけない人間のあり方が、いかに罪深いものであるかという考 え方","食事は農が生み出したものをいただくものであり、農業を営む村人への感謝が必要だという 考え方","食事は他の生命を自分の身体に取り入れるものであり、それらの生命に感謝しなければいけ ないという考え方"],"answer":3,"explain":"Tập tục ăn uống gắn với suy nghĩ: ăn = nhận lấy SINH MẠNG khác vào người mình → cần biết ơn (他の生命を自分の身体に取り入れる、感謝しなければいけない). ✅D."},{"q":"この文章中で筆者が述べていることはどれか。","options":["思想の表現は必ずしも文章や作品というかたちをとるとは限らず、かたちにならないものもあ る。","は絵や音楽のようなかたちに表わされるものと考えられてきたが、深い思想とはかたちになら ないものである。","思想の表現には絵や音楽などもあるし、かたちにならないものもあるが、文章で表現されたも のが最上のものである。","思想は文章や作品のようなかたちになったものが尊重されるが、生活と結びついた深い思想 はかたちにならないものである。"],"answer":0,"explain":"Kết: tư tưởng biểu hiện không nhất thiết có hình thức văn bản/tác phẩm, có loại không thành hình (かたちにならないものもある). ✅A."}]},{"source":"Mon12","bai":4,"date":"12/2011","title":"Mon12 - Bài 4 (12/2011)","passage":"眺めていると、東京の空には意外にたくさんの鳥が飛んでいる。カラスやスズメばかりではな\nい。カモメもいるし、僕には種類のよくわからない鳥もいる。それらは町人や人家に「適応」した都市\n鳥ではなく、野生の鳥である。そのような鳥が、コンクリートのビルの上を何事もないように飛び、何の\n屈託もなく、ビルの一角にとまる。まるで森や林の木の枝にとまるように。（中略）\nツバメが人家の軒先に巣をつくるのは、スズメを避けるためだということを明らかにした研究があ\nる。スズメはふだんはあまり人間を恐れないが、ひなを育てるときは人間を避ける。だから、人がひん\nぱんに出入りする店先などには巣をかけない。ツバメはそれを利用する。そういう店先の軒に巣をつ\nくれば、嫌なスズメはやってこない。昔、ツバメがたくさん巣をかけると、店は繁盛するといわれた。話\nは逆であって、繁盛している店にツバメが集まってくるのである。\n今、大都市にはツバメがめっきりすくなくなった。かつてのように、どの通りを歩いていても、子育\nてのために餌を持ち帰るツバメが飛び交う姿は見られなくなった。おそらくツバメたちは、町そのもの\nのつくりや、人間の存在が嫌いになったのではないだろう。町が人工的にきれいになりすぎて、餌に\nする虫があまりにも減ってしまったので、町ではひなも育てられなくなったから、都会には棲ま（注1）\nなくなったのである。\nこういう事例を見ていると、自然保護とか自然との共生ということについて、少し考え直す必要が\nあるのではないか、という気がしてくる。\n多くの動物たちはわれわれが思っていたよりもずっとしたたかである。自分たちの生活の基盤に\nなる条件さえそろっていれば、たとえその条件が人工のものであとうとも、そしてそこをたくさんの人\n間がうろうろしていようとも、平気で棲みついてしまう。カラスやツバメのように、人間がいることをむし\nろ利用しているものだって、けっして少ないとはいえない。都市周辺で急速に増えつつあるタヌキや\nキツネもその例である。人間がいるおかげで豊富な食物がたやすく手にはいるようになった。命がけ\nで食物を探す必要はなくなったのだ。\nけれど、都市化によってツバメは餌を失った。モンシロチョウ（注2）は日なたを失った。\n（注1）棲む：住む\n（注2）モンシロチョウ：チョウの一種類\n（注3）アメンボ：昆虫の名前\n（注4）富栄養化：栄養のある物質がたまり、小さい生物が異常発生する状態になること","questions":[{"q":"ツバメが人家の軒先に巣をつくる理由として適当なのはどれか。","options":["人家の軒先では、ツバメが子育てに必要な餌を得ることができるから","人家の軒先は、店の軒先ほど人の出入りがひんぱんではないから","ツバメの天敵であるスズメが、常に人間を恐れて近寄らないから","ツバメの嫌うスズメが、人のいるところではひなを育てないから"],"answer":3,"explain":"Chim nhạn làm tổ ở hiên nhà vì: chim sẻ (kẻ thù) KHÔNG nuôi con ở nơi có người (ひなを育てるときは人間を避ける). ✅D."},{"q":"筆者によると大都市でツバメが少なくなったのはなぜか。","options":["森や林が失われたから","巣をつくりにくくなったから","カラスやスズメが増えたから","食物を得るのが難しくなったから"],"answer":3,"explain":"Chim nhạn giảm ở đô thị: đô thị hóa làm MẤT nguồn thức ăn côn trùng (餌にする虫があまりにも減ってしまった). ✅D."},{"q":"多くの動物たちはわれわれが思っていたよりもずっとしたたかであるとあるが、どのような点でした たかだと筆者は考えているか。","options":["都会でもっても森や木があれば巣を作る。","生きるための条件が整えば都会で生活する。","都会であっても餌がなければ命がけで探す。","人間を避けることができれば、都会に棲みつく。"],"answer":1,"explain":"Động vật 'lì lợm': chỉ cần đủ điều kiện sống (dù nhân tạo) là sống được ở đô thị (生活の基盤になる条件さえそろっていれば). ✅B."},{"q":"この文章で筆者が言いたいことは何か。","options":["都会を去った動物たちが再び人間と共生できるような対策を立てる必要がある。","都会での生活は動物にとって実は利点が多いということを認識する必要がある。","自然との共生を考える際には、動物の生存に必須の条件を尊重すべきである。","動物たちの生活を守るために環境汚染を防止し、自然を保護すべきである。"],"answer":2,"explain":"Ý chính: khi nghĩ về cộng sinh tự nhiên, cần tôn trọng điều kiện sinh tồn THIẾT YẾU của động vật. ✅C."}]},{"source":"Mon12","bai":5,"date":"07/2012","title":"Mon12 - Bài 5 (07/2012)","passage":"うちの犬は頭がよくないけれどむやみに吠えない。これは犬種の性格である。もうひとつ、\n絶対に噛みつかない。これは訓練士に仕込まれた成果である。大きな犬なので幼児に噛みつい\nたら事件になってしまう。\n訓練士は二十代の女性でスクーターに乗ってやってきた。訓練時間は週に4 回、各3 0分\nである。半年近く経っても訓練が終わらないので、いつになったら卒業できるんですか、と尋ねた。\n家庭内での序列がはっきりしたら、と説明する。序列ねを、どういうことかな、とさらに質問すると、①\nお宅の坊ちゃんがまだ...。\n十年前なので息子は小学生である。体格的にも犬と息子に差がない。うちの大はまず僕、\nつぎに妻と気の強い娘に降参 (注1) したのだ。だが息子は軟体動物のようにふにゃふにゃしてい\nるとしている。紛てばかりいる。起きてもあくびばかりしている。両者は最下位争いを演じたまま四つ\nに組んで (注2) 決着がつかないらしい。\n動物は序列に敏感なのだ。 (中略)\n女性の訓練士が説明した。犬をかわいがっているつもりで甘やかし、②腕をがぶりと噛み\nつかれた飼い主がいた。甘やかせばつけ上がるだけ、自分が主人と信じ込んで飼い主をなめた結\n果である。 動物はつねに威嚇しながら序列を確認しているから、仲間同士は本気で喧嘩をしな\nい。 相手が強い、とわかれば争わない。 喧嘩したら互いに傷つき、厳しい自然界では生き残れな\nいから。さすがに血のめぐりの悪いわが家の犬も、ある日、息子にゴツンと頭を叩かれ、最下位が\n確定、平和的に棲み分けが決まり、予算オーバーの訓練は終了した。\n動物から教訓を得たわけではないが、家庭内でもタテマエとしての序列がないと混乱がは\nじまる。親父の権威の喪失が取り返しのつかないところまできたのは家父長制 (注3) を否定しすぎ\nた結果でもある。戦前は長子相続で、次男以下は相続権がなく女性にいたってはその他大勢の\n扱い、ひどいものだった。そういう状態を復活せよ、と述べているのではない。職場で女性がもっと\n管理職に進出できる環境は整えたほうがよいし、僕の経験からして共働きには賛成である。 家事も\n分担したほうがよい。だが③男女平等をはきちがえてはいけない。家庭は動物の巣に似た面があ\nる。権威としての父性、包容力(注4)の母性まで削り取ってはいけない。父親は筋肉質で髯をはや\nし、母親には柔らかな肌とやさしい笑顔があるように、それらしく演じ分けたほうがよい。頻発する家\n庭内暴力が役割構造の喪失と無縁ではないからである。\n(猪瀬直樹「家」 1 999年9月2 6日付朝日新聞朝刊による)\n(注1) 降参する:負ける\n(注2) 四つに組む:しっかり向き合って闘うこと\n(注3) 家父長制:男性の年長者が家族を支配するという制度\n(注4) 包容力:相手を寛大な気持ちで受け止める力","questions":[{"q":"①お宅の坊ちゃんがまだ…とあるが、「まだ」の後に続く言葉はどれか。","options":["小学生で、犬の訓練が苦手ですから","序列が犬より上になっていませんから","小学生で、訓練が終わっていませんから","きょうだいの序列を理解していませんから"],"answer":1,"explain":"①'còn chưa...' = thứ bậc của CON còn chưa cao hơn con chó trong nhà (序列が犬より上になっていない). ✅B."},{"q":"②腕をがぶりと噛みつかれた飼い主がいたとあるが、この大はどうして噛みついたか。","options":["この犬は自分の方が飼い主より上だと思っていたから","女性の訓練士に甘やかされて誰にでも噛みついていたから","強い相手に挑まなければ厳しい自然界では生きられないから","この犬は飼い主と自分の序列はまだ定まっていないと思ったから"],"answer":0,"explain":"②Chó cắn chủ vì: nghĩ MÌNH ở vị trí cao hơn chủ (自分の方が飼い主より上だと思っていた). ✅A."},{"q":"③男女平等をはきちがえてはいけないと言っているが、筆者は「はきちがえる」とどうなると考えて いるか。","options":["共働きが普通になり、父親が家事を分担するようになる。","父親と母親の家庭内での役割が混乱し、問題が生まれる。","職場で女性がもっと管理職に進出できるような環境になる。","家父長制が復活して戦前の社会のように人が序列化される。"],"answer":1,"explain":"③Hiểu lầm bình đẳng giới → vai trò cha-mẹ trong nhà bị RỐI LOẠN, sinh vấn đề (役割が混乱し問題が生まれる). ✅B."},{"q":"この文章で筆者が最も言いたいことは何か。","options":["犬には訓練によって家庭内での序列を教え込むことが必要である。","父親と母親の役割を明確にするために、家父長制を復活すべきである。","家庭の問題を解決するためには動物と同じく序列化が必要である。","親は家庭でそれぞれ父性や母性にもとづく役割を果たすべきである。"],"answer":3,"explain":"Ý chính: cha mẹ nên đóng đúng vai trò dựa trên tính phụ-mẫu tương ứng trong gia đình (父性・母性にもとづく役割を果たすべき). ✅D."}]},{"source":"Mon12","bai":6,"date":"12/2012","title":"Mon12 - Bài 6 (12/2012)","passage":"皆さんは、今朝起きてからいままでに、どんな広告を見たか覚えていますか。\n「広告はほとんどなかったと思うけど…」。いやいや、そんなことはありません。現在の時間\nが、朝会社に着いたばかりだったとしても、短い時間のうちにものすごい基の広告に触れているは\nずです。テレビCMで、新聞で、電車の中で、街中で…。何十、何百という数が、目の前を通り過ぎ\nたことでしょう。\nそのなかで、ぱっと思い出せるものはありますか。そう言われてみると、ほとんどといっていい\nくらい、記憶に残っていないのではないでしょうか。 (中略)\n「広告なんて誰も見ていない」\nこれは、僕が会社に入って間もない頃に実感したことです。会議で難しい用語が飛び交い、\n商品のアピールポイントや表現の話は白熱しているのですが、①もっと根本的なことにはなかなか\n触れられずにいる。目の前の仕事に深く入り込んでしまうと、「果たして、広告とは関心をもってもら\nえるものなのか」という、ぐっと引いた視線で見ることを忘れがちになってしまうのです。こうした大前\n提が見えないままに作られている広告が、非常に多いのではないでしょうか。\n広告を発信する側としては、伝えたいことはたくさんあって、一般の人たちは当然注目してく\nれるものと思い込みがちです。ところが、受け手側というのは、発信者側のそんな思いなど、ほとん\nど意に介し (注1) ていません。なぜなら、日常生活のなかでは、自分の身の回りの出来事や問題\nで精一杯になっているからです。人は自分の心にバリア (注2) を張っていて、無意識のうちに外部\n情報を遮断しています。ですから、伝えたい情報を相当きちんと整理したうえで、筋道を立てて戦\n略的に伝えることを考えないと、受け手の心のバリアを破って入り込むことなどできないのです。\n「振り向かせるためには、刺激的なものにすればいいんじゃないの?」\n②こういう意見もあるでしょう。でも、単に刺激的なだけでは、一瞬目を引くだけで終わってし\nまう。心の奥までは浸透していかないのです。たとえるなら、子どもが隠れていた物陰から出てき\nて、「わっ!」と驚かせるようなもの。驚かされた方は、怒ったり相手にしなかったりするかもしれませ\nん。相手の理解を得たり興味を引いたりしないと、本当に心を捉えたことにはならないのです。だか\nら、まず何が言いたいのかという主旨をはっきりさせ、そのうえでどんなトーンで伝えるのかという工\n夫をすることが大切です。\n(佐藤可土和『加藤可士和の超整理術』による)\n(注1) 意に介する : 気にする\n(注2) バリア : ここでは、壁","questions":[{"q":"①もっと根本的なことがあるが、どのようなことか。","options":["広告とは一体何なのかということ","広告とは必要なものなのかということ","広告の用語や表現が適切なのかということ","広告とは人に注目されるものなのかということ"],"answer":3,"explain":"①Vấn đề căn bản nhất bị bỏ qua: liệu quảng cáo có được người ta CHÚ Ý đến không (関心をもってもらえるものなのか). ✅D."},{"q":"筆者は、広告の受け手をどのようにとらえているか。","options":["自分のことで忙しくて、余計な情報を取り入れようとしない。","毎日の生活が忙しく、たくさんのことを覚えようとしない。","目にする広告が多すぎて、必要なものが選べなくなっている。","関心のもてない広告が多く、広告を見る必要性を感じていない。"],"answer":0,"explain":"Người nhận quảng cáo: quá bận với việc riêng → vô thức CHẶN thông tin bên ngoài (心にバリアを張り、無意識に外部情報を遮断). ✅A."},{"q":"筆者はの②こういう意見に対してどのように考えているか。","options":["刺激的な広告は、受け手の心の奥に入り込んでいきやすい。","刺激的な広告は、より刺激的にしていかないと受け手に伝わらない。","単に刺激的なだけの広告も、受け手を振り向かせるためには必要だ。","ただ刺激的な広告は、驚かせるだけで受け手の心には残らない。"],"answer":3,"explain":"②Quảng cáo gây sốc: chỉ làm giật mình thoáng qua, KHÔNG đọng lại trong tâm trí (心の奥までは浸透していかない). ✅D."},{"q":"広告の発信者に対して、筆者が言いたいことは何か。","options":["受け手の視点に立って商品をアピールすることが重要だ。","受け手の心をつかむような情報を発信し続けることが重要だ。","受け手に商品の魅力をいかにストレートに伝えるかが重要だ。","受け手に伝えたい情報をいかに整理して発信するかが重要だ。"],"answer":3,"explain":"Ý chí
