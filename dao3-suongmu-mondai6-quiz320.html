  .wrap{max-width:720px; margin:0 auto;}
  header{text-align:center; margin-bottom:20px;}
  header h1{font-size:1.4rem; margin:0 0 4px;}
  header p{color:var(--muted); margin:0; font-size:0.9rem;}

  /* SET SELECTOR */
  .set-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:20px;
  }
  @media(max-width:480px){.set-grid{grid-template-columns:repeat(2,1fr);}}
  .set-btn{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:14px 8px; text-align:center; cursor:pointer; font-family:inherit;
    transition:.15s;
  }
  .set-btn:hover{border-color:var(--accent2); transform:translateY(-1px);}
  .set-btn .set-num{display:block; font-weight:700; font-size:1.05rem; color:var(--accent);}
  .set-btn .set-range{display:block; font-size:0.78rem; color:var(--muted); margin-top:2px;}
  .back-link{
    display:inline-block; margin-bottom:14px; color:var(--accent2); cursor:pointer;
    font-size:0.9rem; text-decoration:underline;
  }

  .progress{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:10px 16px; margin-bottom:16px; font-size:0.85rem; color:var(--muted); flex-wrap:wrap; gap:6px;
  }
  .progress b{color:var(--ink);}
  .progress .set-label{color:var(--accent); font-weight:700;}
  .bar{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:20px;}
  .bar-fill{height:100%; background:var(--accent2); width:0%; transition:width .3s;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:22px 20px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .qnum{
    display:inline-block; background:var(--accent); color:#fff; font-weight:700;
    border-radius:6px; padding:2px 10px; font-size:0.85rem; margin-bottom:10px;
  }
  .sentence{font-size:1.25rem; line-height:2.1; margin:10px 0 18px;}
  .blank{
    display:inline-block; min-width:64px; border-bottom:2px solid var(--muted);
    text-align:center; margin:0 2px; color:var(--muted); font-size:0.95rem;
  }
  .blank.star{border-color:var(--accent); color:var(--accent); font-weight:700;}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:480px){.choices{grid-template-columns:1fr;}}
  .choice-btn{
    border:1.5px solid var(--line); background:#fdfcfa; border-radius:10px;
    padding:12px 14px; font-size:1.05rem; cursor:pointer; text-align:left;
    transition:.15s; font-family:inherit;
  }
  .choice-btn:hover{border-color:var(--accent2);}
  .choice-btn.correct{background:#eaf6ee; border-color:var(--right); color:var(--right); font-weight:700;}
  .choice-btn.wrong{background:#fbeceb; border-color:var(--wrong); color:var(--wrong); font-weight:700;}
  .choice-btn:disabled{cursor:default;}
  .explain{
    margin-top:16px; border-radius:10px; background:#fbf8f1;
    border:1px solid var(--line); font-size:0.92rem; line-height:1.7; display:none;
    padding:16px;
  }
  .explain.show{display:block;}
  .order-badge{
    display:inline-block; background:var(--accent2); color:#fff; font-weight:700;
    border-radius:8px; padding:5px 14px; font-size:0.95rem; margin-bottom:10px; margin-right:8px;
  }
  .grammar-badge{
    display:block; background:#fff3e0; border:1.5px solid #d98c2b; color:#8a5a16; font-weight:700;
    border-radius:8px; padding:8px 14px; font-size:0.93rem; margin-bottom:12px;
  }
  .grammar-badge span{font-weight:400; color:#6b4a14;}
  .explain .full{font-size:1.08rem; margin-bottom:8px; color:var(--ink);}
  .explain .vi{color:var(--accent2); margin-bottom:14px; font-style:italic;}
  .explain hr{border:none; border-top:1px dashed var(--line); margin:12px 0;}
  .step{margin-bottom:10px;}
  .step b{color:var(--ink);}
  .navrow{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  #topNavRow{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:8px 0 4px; margin-top:0 !important;
  }
  .navbtn{
    background:var(--accent2); color:#fff; border:none;
    padding:10px 18px; border-radius:8px; font-size:0.95rem; cursor:pointer;
  }
  .navbtn.secondary{background:#fff; color:var(--accent2); border:1.5px solid var(--accent2);}
  .navbtn:disabled{opacity:.4; cursor:not-allowed;}
  .navbtn.hidden{display:none;}
  .result{
    text-align:center; padding:40px 20px; background:var(--card); border-radius:14px;
    border:1px solid var(--line);
  }
  .result h2{margin-top:0;}
  .restart{
    background:var(--accent); color:#fff; border:none; padding:10px 22px;
    border-radius:8px; font-size:1rem; cursor:pointer; margin-top:12px;
  }
  .remember-box{
    background:#eef6f2; border:1px solid var(--accent2); border-radius:10px;
    padding:12px 16px; margin-top:16px; font-size:0.88rem; color:var(--accent2);
  }
  footer{text-align:center; color:var(--muted); font-size:0.8rem; margin-top:30px;}
  .exp-toast{position:fixed;top:18%;left:50%;transform:translate(-50%,-10px);background:linear-gradient(180deg,#ffd25a,#f5a623);color:#5a3b22;font-weight:800;padding:10px 22px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:9999;text-align:center;pointer-events:none;animation:expPop .35s ease-out;}
  .exp-toast-main{font-size:20px;line-height:1.2;}
  .exp-toast-sub{font-size:12px;font-weight:700;margin-top:2px;opacity:.85;}
  .exp-toast-big{background:linear-gradient(180deg,#ff9a56,#ff5b3a);color:#fff;box-shadow:0 8px 22px rgba(255,90,40,.5);}
  .exp-toast-big .exp-toast-main{font-size:24px;}
  .exp-toast-out{animation:expFade .5s ease-in forwards;}
  .combo-toast{position:fixed;top:76px;right:20px;background:#fef3c7;color:#d97706;border:1px solid #fcd34d;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;z-index:9998;opacity:0;transform:translateY(-8px);transition:all .3s;pointer-events:none;}
  .combo-toast.show{opacity:1;transform:translateY(0);}
  .coin-burst-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .coin-burst-card{position:relative;background:linear-gradient(180deg,#fff6d9,#ffe9b0);border:3px solid #f5a623;border-radius:24px;padding:26px 40px;box-shadow:0 20px 60px rgba(0,0,0,.45), 0 0 40px rgba(255,210,90,.6);text-align:center;animation:coinPop .5s cubic-bezier(.34,1.56,.64,1);}
  .coin-burst-icon{font-size:56px;animation:coinSpin .6s ease-out;}
  .coin-burst-text{font-weight:800;font-size:28px;color:#8b5e34;margin-top:6px;text-shadow:0 2px 0 #fff8e6;}
  .coin-burst-sub{font-size:13px;font-weight:700;color:#a3792a;margin-top:2px;}
  .coin-burst-out{animation:coinFadeOut .4s ease-in forwards;}
  .coin-particle{position:absolute;font-size:20px;left:50%;top:50%;animation:coinFly 900ms ease-out forwards;pointer-events:none;}
  @keyframes expPop{0%{transform:translate(-50%,10px) scale(.7);opacity:0;}60%{transform:translate(-50%,-14px) scale(1.08);opacity:1;}100%{transform:translate(-50%,-10px) scale(1);opacity:1;}}
  @keyframes expFade{0%{opacity:1;transform:translate(-50%,-10px) scale(1);}100%{opacity:0;transform:translate(-50%,-30px) scale(.9);}}
  @keyframes coinPop{0%{transform:scale(.3);opacity:0;}60%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);opacity:1;}}
  @keyframes coinSpin{0%{transform:rotateY(0deg) scale(.5);}100%{transform:rotateY(360deg) scale(1);}}

{n:81, pre:"結果が成功でも失敗でも、いずれにしろ", post:"だろう。", choices:["貴重な","と","経験","なる"], order:[1,3,2,4], star:3,

 steps:["Mảnh đầu câu (vị trí 1): 「距離」— khớp với phần câu 「...こんな近い」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「行く」— khớp với phần câu 「までもない。自転車で」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「なら」 rồi 「車で」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 車で"]},
{n:208, pre:"部屋が", post:"聞こえてきた。", choices:["大きな音楽が","静か","かと思えば","隣から"], order:[2,3,4,1], star:3,
 full:"部屋が静かかと思えば隣から大きな音楽が聞こえてきた。", vi:"Cứ nghĩ phòng yên tĩnh, thì lại nghe thấy tiếng nhạc to từ phòng bên cạnh.",

 grammar:"〜かと思えば (cứ nghĩ là... thì lại...)",

{n:209, pre:"電車では", post:"教わったことを覚えている。", choices:["小学校で","お年寄りに","譲るものだと","席を"], order:[2,4,3,1], star:3,
 full:"電車ではお年寄りに席を譲るものだと小学校で教わったことを覚えている。", vi:"Tôi vẫn còn nhớ đã được dạy từ tiểu học rằng nên nhường ghế cho người già trên tàu điện.",
 orderDisp:"2-4-3-1",
 grammar:"〜ものだと教わる (được dạy rằng nên...)",
 steps:["Mảnh đầu câu (vị trí 1): 「お年寄りに」— khớp với phần câu 「...電車では」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「小学校で」— khớp với phần câu 「教わったことを覚えて」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「席を」 rồi 「譲るものだと」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 譲るものだと"]},
{n:210, pre:"彼はお金のこととなると、", post:"になる。", choices:["人が","ような","変わった","性格"], order:[1,3,2,4], star:3,
 full:"彼はお金のこととなると、人が変わったような性格になる。", vi:"Khi nói đến tiền, anh ấy trở nên như thể là một người khác hẳn.",
 orderDisp:"1-3-2-4",

{n:211, pre:"店員にすすめられる", post:"、財布が空になった。", choices:["まま","高級レストランに","に","入ったら"], order:[1,3,2,4], star:3,
 full:"店員にすすめられるままに高級レストランに入ったら、財布が空になった。", vi:"Theo như được nhân viên giới thiệu mà vào nhà hàng cao cấp, kết quả là ví tiền trống rỗng.",

 grammar:"〜るがままに (theo đúng như..., cứ để cho...)",
 steps:["Mảnh đầu câu (vị trí 1): 「まま」— khớp với phần câu 「...員にすすめられる」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「入ったら」— khớp với phần câu 「、財布が空になった。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「に」 rồi 「高級レストランに」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 高級レストランに"]},
{n:212, pre:"たとえ", post:"、私はこの道を進む。", choices:["が","周りが","思おう","どう"], order:[2,4,3,1], star:3,
 full:"たとえ周りがどう思おうが、私はこの道を進む。", vi:"Dù người xung quanh có nghĩ thế nào, tôi vẫn sẽ đi theo con đường này.",
 orderDisp:"2-4-3-1",
 grammar:"たとえ〜うが (dù có... thì cũng — nhượng bộ mạnh)",
 steps:["Mảnh đầu câu (vị trí 1): 「周りが」— khớp với phần câu 「...たとえ」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「が」— khớp với phần câu 「、私はこの道を進む。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「どう」 rồi 「思おう」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 思おう"]},
{n:213, pre:"このアパートは駅から遠い上に、", post:"向かない。", choices:["に","家賃が","住むの","高すぎて"], order:[2,4,3,1], star:3,
 full:"このアパートは駅から遠い上に、家賃が高すぎて住むのに向かない。", vi:"Căn hộ này vừa xa nhà ga, vừa có giá thuê quá cao nên không thích hợp để sống.",

 grammar:"〜の上に (không chỉ... mà còn...) + 〜に向かない (không thích hợp với việc...)",
 steps:["Mảnh đầu câu (vị trí 1): 「家賃が」— khớp với phần câu 「...駅から遠い上に、」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「に」— khớp với phần câu 「向かない。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「高すぎて」 rồi 「住むの」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 住むの"]},
{n:214, pre:"経験不足ゆえのミスなので、", post:"優しく教えてくれた。", choices:["次は","と","注意しよう","先輩が"], order:[1,3,2,4], star:3,
 full:"経験不足ゆえのミスなので、次は注意しようと先輩が優しく教えてくれた。", vi:"Vì đây là lỗi do thiếu kinh nghiệm, người đi trước đã nhẹ nhàng dạy rằng lần sau hãy cẩn thận hơn.",

 steps:["Mảnh đầu câu (vị trí 1): 「次は」— khớp với phần câu 「...えのミスなので、」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「先輩が」— khớp với phần câu 「優しく教えてくれた。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「注意しよう」 rồi 「と」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = と"]},
{n:215, pre:"地方への転勤が決まったので、家族", post:"した。", choices:["とともに","こと","引っ越す","に"], order:[1,3,2,4], star:3,
 full:"地方への転勤が決まったので、家族とともに引っ越すことにした。", vi:"Vì đã quyết định chuyển công tác về địa phương, tôi đã quyết định chuyển nhà cùng gia đình.",

 grammar:"〜とともに (cùng với...) + 〜ことにした (quyết định làm...)",

{n:216, pre:"彼が優勝したのは、実力が", post:"勝ったのだ。", choices:["べくして","伴っていた","勝つ","からこそで"], order:[2,4,3,1], star:3,

 orderDisp:"2-4-3-1",
 grammar:"〜からこそ (chính vì...) + 〜べくして〜 (tất nhiên phải...)",
 steps:["Mảnh đầu câu (vị trí 1): 「伴っていた」— khớp với phần câu 「...したのは、実力が」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「べくして」— khớp với phần câu 「勝ったのだ。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「からこそで」 rồi 「勝つ」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = 勝つ"]},
{n:217, pre:"もっと早く病院に行っていれば、", post:"。", choices:["こんなに","悪く","ものを","ならなかった"], order:[1,2,4,3], star:3,
 full:"もっと早く病院に行っていれば、こんなに悪くならなかったものを。", vi:"Nếu đi viện sớm hơn thì đã không tệ đến mức này.",

{n:218, pre:"小さな工房が、世界的な", post:"成長した。", choices:["になる","ところ","まで","ブランド"], order:[4,1,2,3], star:3,

{n:219, pre:"無理なスケジュールで働き続けると、", post:"問題がある。", choices:["崩し","体調を","かねない","従業員は"], order:[4,2,1,3], star:3,

{n:220, pre:"若い", post:"だろうに。", choices:["勉強しておけばよかった","ころ","もっと","に"], order:[2,4,3,1], star:3,

{n:221, pre:"この作品はキャラクターのデザインから物語、", post:"。", choices:["素晴らしい","その音楽","まで","に至る"], order:[2,4,3,1], star:3,

 grammar:"〜から〜に至るまで (từ... cho đến tận...)",

{n:222, pre:"故郷の母が", post:"と言える。", choices:["作ってくれた","カレーの味","世界で一番おいしい","といったら"], order:[1,2,4,3], star:3,

 grammar:"Nといったら (nói đến N thì — nhấn mạnh)",
 steps:["Mảnh đầu câu (vị trí 1): 「作ってくれた」— khớp với phần câu 「...故郷の母が」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「世界で一番おいしい」— khớp với phần câu 「と言える。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「カレーの味」 rồi 「といったら」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = といったら"]},

{n:224, pre:"彼女が", post:"。", choices:["くれた","ただの","常識でしかない","アドバイスは"], order:[4,1,2,3], star:3,
 full:"彼女がアドバイスはくれたただの常識でしかない。", vi:"Lời khuyên cô ấy đưa ra chỉ là lẽ thường tình mà thôi.",

 steps:["Mảnh đầu câu (vị trí 1): 「アドバイスは」— khớp với phần câu 「...彼女が」ngay trước chỗ trống.","Mảnh cuối câu (vị trí 4): 「常識でしかない」— khớp với phần câu 「。」ngay sau chỗ trống.","Hai mảnh giữa (vị trí 2-3): 「くれた」 rồi 「ただの」 — ghép theo cấu trúc ngữ pháp/ý nghĩa nối tiếp giữa 2 mảnh này.","Vị trí ★ (số 3): = ただの"]},
{n:225, pre:"電気代が高かろう", post:"夏を過ごせない。", choices:["と","エアコン","なしでは","安かろうと"], order:[1,4,2,3], star:3,

{n:227, pre:"この成功は", post:"。", choices:["にほかならない","チーム全員の","結果","努力の"], order:[2,4,3,1], star:3,

{n:231, pre:"長い間", post:"上手に弾けたのだ。", choices:["発表会で","練習した","ピアノの","からこそ"], order:[2,4,3,1], star:3,

{n:232, pre:"大雨が", post:"外出してしまった。", choices:["にもかかわらず","彼は傘も","持たずに","降っている"], order:[4,1,2,3], star:3,

{n:235, pre:"子供たちは", post:"ボールを見つめていた。", choices:["理科の実験で","表情で","大きくなる","不思議げな"], order:[4,2,1,3], star:3,

{n:240, pre:"この一枚の写真が、", post:"秘めていることか。", choices:["思い出","多くの","を","いかに"], order:[4,2,1,3], star:3,

{n:242, pre:"失敗を恐れない", post:"、革新は生まれない。", choices:["なくして","挑戦","精神","の"], order:[2,4,3,1], star:3,

const TOTAL = window.QUIZ_DATA.length;
const SET_SIZE = 20;
const NUM_SETS = Math.ceil(TOTAL / SET_SIZE);

let currentSet = 0; // 0-indexed
let idxInSet = 0;
let score = 0;
let answered = false;
let setData = [];

function getSetData(setIndex){
  const start = setIndex * SET_SIZE;
  return window.QUIZ_DATA.slice(start, start + SET_SIZE);
}

const STORAGE_KEY = 'n1_mondai6_progress_320';

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({set:currentSet, idx:idxInSet, score:score}));
  }catch(e){ /* ignore if storage unavailable */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

const EVER_CORRECT_KEY = 'mondai6_320_ever_correct';
let everCorrect = new Set(JSON.parse(localStorage.getItem(EVER_CORRECT_KEY) || '[]'));
function reportToolProgress(correct, total) {
  try {
    const key = 'dc_tool_progress';
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    all['dao3-suongmu-mondai6-quiz320.html'] = { correct, total };
    localStorage.setItem(key, JSON.stringify(all));
  } catch (e) {}
}
reportToolProgress(everCorrect.size, TOTAL);

const EXP_PER_CORRECT = 5;
const COMBO_TARGET = 10;
const COMBO_BONUS = 50;
let comboCount = 0;
const HYPE_MESSAGES = ['Xuất sắc!', 'Đỉnh của chóp!', 'Cứ thế phát huy nhé!', 'Quá đỉnh!', 'N1 đang trong tầm tay!', 'Không gì cản được bạn!', 'Chuẩn không cần chỉnh!', 'Học vậy mới máu!'];

function loadLocalProfile() {
  try { const r = localStorage.getItem('dhtm_profile_v1'); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function saveLocalProfile(p) {
  try { localStorage.setItem('dhtm_profile_v1', JSON.stringify(p)); } catch (e) {}
}
function awardExp(amount) {
  const profile = loadLocalProfile();
  if (!profile) return false;
  let exp = (profile.exp || 0) + amount, level = profile.level || 1, expToNext = profile.expToNext || 100;
  let leveledUp = false;
  while (exp >= expToNext) { exp -= expToNext; level += 1; expToNext = Math.round(expToNext * 1.25); leveledUp = true; }
  profile.exp = exp; profile.level = level; profile.expToNext = expToNext;
  saveLocalProfile(profile);
  return leveledUp;
}
function pickHype() { return HYPE_MESSAGES[Math.floor(Math.random() * HYPE_MESSAGES.length)]; }
function showExpToast(mainText, subText, big) {
  document.querySelectorAll('.exp-toast').forEach(t => t.remove());
  const wrap = document.createElement('div');
  wrap.className = 'exp-toast' + (big ? ' exp-toast-big' : '');
  const line1 = document.createElement('div');
  line1.className = 'exp-toast-main';
  line1.textContent = mainText;
  const line2 = document.createElement('div');
  line2.className = 'exp-toast-sub';
  line2.textContent = subText;
  wrap.appendChild(line1);
  wrap.appendChild(line2);
  document.body.appendChild(wrap);
  setTimeout(() => { wrap.classList.add('exp-toast-out'); }, 900);
  setTimeout(() => { wrap.remove(); }, 1400);
}
function showComboToast(n) {
  let el = document.getElementById('combo-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'combo-toast';
    el.className = 'combo-toast';
    document.body.appendChild(el);
  }
  el.textContent = '🔥 Chuỗi ' + n + ' câu đúng';
  el.classList.add('show');
  clearTimeout(window._comboToastTimer);
  window._comboToastTimer = setTimeout(() => { el.classList.remove('show'); }, 1500);
}
function showCoinBurst(amount) {
  const overlay = document.createElement('div');
  overlay.className = 'coin-burst-overlay';
  const card = document.createElement('div');
  card.className = 'coin-burst-card';
  const icon = document.createElement('div');
  icon.className = 'coin-burst-icon';
  icon.textContent = '🪙';
  const text = document.createElement('div');
  text.className = 'coin-burst-text';
  text.textContent = '+' + amount + ' Xu!';
  const sub = document.createElement('div');
  sub.className = 'coin-burst-sub';
  sub.textContent = 'Nhặt được xu may mắn!';
  card.appendChild(icon);
  card.appendChild(text);
  card.appendChild(sub);
  overlay.appendChild(card);
  for (let i = 0; i < 14; i++) {
    const pt = document.createElement('div');
    pt.className = 'coin-particle';
    pt.textContent = '🪙';
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 140;
    pt.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    pt.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    overlay.appendChild(pt);
  }
  document.body.appendChild(overlay);
  setTimeout(() => { card.classList.add('coin-burst-out'); }, 1200);
  setTimeout(() => { overlay.remove(); }, 1700);
}
function maybeDropCoins() {
  if (Math.random() >= 0.35) return;
  const amount = 5 + Math.floor(Math.random() * 21);
  const profile = loadLocalProfile();
  if (profile) {
    profile.coins = (profile.coins || 0) + amount;
    saveLocalProfile(profile);
  }
  showCoinBurst(amount);
}
function onCorrectAnswer() {
  comboCount++;
  let gained = EXP_PER_CORRECT;
  let big = false;
  let sub = pickHype();
  if (comboCount >= 2) showComboToast(comboCount);
  if (comboCount > 0 && comboCount % COMBO_TARGET === 0) {
    gained += COMBO_BONUS;
    big = true;
    sub = 'Chuỗi ' + comboCount + ' câu đúng — Bùng nổ!';
  }
  const leveledUp = awardExp(gained);
  showExpToast('+' + gained + ' EXP', leveledUp ? 'LÊN CẤP! 🎉' : sub, big || leveledUp);
  maybeDropCoins();
}
function onWrongAnswer() {
  comboCount = 0;
}

function renderSetSelector(){
  let html = '';
  const saved = loadProgress();
  if(saved && saved.set>=0 && saved.set<NUM_SETS){
    const sStart = saved.set*SET_SIZE+1;
    const sQuestionNum = sStart + saved.idx;
    html += `<div class="remember-box" style="background:#fdf1ea; border-color:var(--accent);">
      📍 Lần trước bạn đang làm <b>Set ${saved.set+1}</b>, dừng ở <b>câu ${sQuestionNum}</b>.
      <div style="margin-top:10px;">
        <button class="navbtn" id="resumeBtn">Tiếp tục câu ${sQuestionNum} →</button>
        <button class="navbtn secondary" id="clearProgressBtn" style="margin-left:8px;">Xóa tiến độ</button>
      </div>
    </div>`;
  }
  html += '<div class="set-grid">';
  for(let s=0; s<NUM_SETS; s++){
    const start = s*SET_SIZE+1;
    const end = Math.min((s+1)*SET_SIZE, TOTAL);
    const isSaved = saved && saved.set===s;
    html += `<div class="set-btn" data-set="${s}" style="${isSaved?'border-color:var(--accent);':''}">
      <span class="set-num">Set ${s+1}</span>
      <span class="set-range">Câu ${start}–${end}</span>
      ${isSaved?'<span style="display:block;font-size:0.72rem;color:var(--accent);margin-top:2px;">● đang dừng đây</span>':''}
    </div>`;
  }
  html += '</div>';
  html += `<div class="remember-box">💡 Tiến độ được <b>tự động lưu</b> trong trình duyệt này — lần sau mở lại file sẽ thấy nút "Tiếp tục" ở câu bạn vừa dừng.</div>`;
  document.getElementById('setSelectArea').innerHTML = html;
  document.querySelectorAll('.set-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> startSet(parseInt(btn.dataset.set), 0));
  });
  if(saved){
    document.getElementById('resumeBtn').addEventListener('click', ()=> startSet(saved.set, saved.idx, saved.score||0));
    document.getElementById('clearProgressBtn').addEventListener('click', ()=>{
      clearProgress();
      renderSetSelector();
    });
  }
}

function startSet(setIndex, resumeIdx, resumeScore){
  currentSet = setIndex;
  setData = getSetData(setIndex);
  idxInSet = resumeIdx || 0;
  score = resumeScore || 0;
  document.getElementById('setSelectArea').style.display = 'none';
  document.getElementById('quizWrapArea').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  const start = currentSet*SET_SIZE+1;
  const end = Math.min((currentSet+1)*SET_SIZE, TOTAL);
  document.getElementById('setLabel').textContent = `Set ${currentSet+1} (câu ${start}–${end})`;
  document.getElementById('totalNum').textContent = setData.length;
  document.getElementById('scoreNum').textContent = score;
  render();
}

function backToSets(){
  document.getElementById('setSelectArea').style.display = 'block';
  document.getElementById('quizWrapArea').style.display = 'none';
  renderSetSelector();
}

function render(){
  const q = setData[idxInSet];
  answered = false;
  saveProgress();
  document.getElementById('curNum').textContent = idxInSet+1;
  document.getElementById('barFill').style.width = (idxInSet/setData.length*100)+'%';

  let blanksHtml = '';
  for(let p=1;p<=4;p++){
    blanksHtml += `<span class="blank ${p===q.star?'star':''}" id="slot${p}">${p===q.star?'★':'…'}</span>`;
  }

  const stepsHtml = q.steps.map((s,i)=>`<div class="step"><b>${i+1}.</b> ${s}</div>`).join('');
  const isFirst = idxInSet===0;

  document.getElementById('topNavRow').innerHTML = `
    <button class="navbtn secondary" id="prevBtnTop" ${isFirst?'disabled':''}>← Câu trước</button>
    <button class="navbtn hidden" id="nextBtnTop">Câu tiếp theo →</button>
  `;

  const html = `
    <div class="card">
      <span class="qnum">Câu ${q.n}</span>
      <div class="sentence">${q.pre}${blanksHtml}${q.post}</div>
      <div class="choices" id="choiceWrap">
        ${q.choices.map((c,i)=>`<button class="choice-btn" data-i="${i+1}">${i+1}. ${c}</button>`).join('')}
      </div>
      <div class="explain" id="explainBox">
        <div class="order-badge">Thứ tự đúng: ${q.orderDisp}</div>
        <div class="grammar-badge">📌 Cấu trúc/cụm cố định: <span>${q.grammar}</span></div>
        <div class="full">${q.full}</div>
        <div class="vi">🇻🇳 ${q.vi}</div>
        <hr>
        ${stepsHtml}
      </div>
      <div class="navrow">
        <button class="navbtn secondary" id="prevBtn" ${isFirst?'disabled':''}>← Câu trước</button>
        <button class="navbtn hidden" id="nextBtn">Câu tiếp theo →</button>
      </div>
    </div>
  `;
  document.getElementById('quizArea').innerHTML = html;

  document.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>onAnswer(btn, q));
  });
  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('nextBtnTop').addEventListener('click', next);
  document.getElementById('prevBtnTop').addEventListener('click', prev);
}

function onAnswer(btn, q){
  if(answered) return;
  answered = true;
  const picked = parseInt(btn.dataset.i);
  const correctChoiceNum = q.order[q.star-1];
  document.querySelectorAll('.choice-btn').forEach(b=>{
    const i = parseInt(b.dataset.i);
    if(i===correctChoiceNum) b.classList.add('correct');
    else if(i===picked) b.classList.add('wrong');
    b.disabled = true;
  });
  if(picked===correctChoiceNum) {
    score++;
    const globalIdx = currentSet*SET_SIZE+idxInSet;
    if(!everCorrect.has(globalIdx)){
      everCorrect.add(globalIdx);
      try{ localStorage.setItem(EVER_CORRECT_KEY, JSON.stringify([...everCorrect])); }catch(e){}
      reportToolProgress(everCorrect.size, TOTAL);
    }
    onCorrectAnswer();
  } else {
    onWrongAnswer();
  }
  document.getElementById('scoreNum').textContent = score;
  saveProgress();
  document.getElementById('explainBox').classList.add('show');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtnTop').classList.remove('hidden');
}

function next(){
  idxInSet++;
  if(idxInSet>=setData.length){ showResult(); return; }
  render();
}

function prev(){
  if(idxInSet<=0) return;
  idxInSet--;
  score = Math.max(0, score); // score not recalculated when going back, just informational
  render();
  // re-show explanation immediately since this question was already answered before
  const q = setData[idxInSet];
  const correctChoiceNum = q.order[q.star-1];
  document.querySelectorAll('.choice-btn').forEach(b=>{
    const i = parseInt(b.dataset.i);
    b.disabled = true;
    if(i===correctChoiceNum) b.classList.add('correct');
  });
  document.getElementById('explainBox').classList.add('show');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtnTop').classList.remove('hidden');
  answered = true;
}

function showResult(){
  document.getElementById('barFill').style.width = '100%';
  document.getElementById('quizArea').style.display='none';
  document.getElementById('topNavRow').innerHTML = '';
  clearProgress();
  const pct = Math.round(score/setData.length*100);
  document.getElementById('resultArea').style.display='block';
  const start = currentSet*SET_SIZE+1;
  const end = Math.min((currentSet+1)*SET_SIZE, TOTAL);
  document.getElementById('resultArea').innerHTML = `
    <div class="result">
      <h2>🎉 Hoàn thành Set ${currentSet+1}!</h2>
      <p style="font-size:1.4rem;">Điểm: <b>${score}</b> / ${setData.length} (${pct}%)</p>
      <p style="color:var(--muted);">Bạn đã hoàn thành câu ${start}–${end}.</p>
      <button class="restart" onclick="startSet(${currentSet})">Làm lại Set này</button>
      <button class="restart" style="background:var(--accent2); margin-left:8px;" onclick="backToSets()">Chọn Set khác</button>
    </div>
  `;
}

document.getElementById('backToSets').addEventListener('click', backToSets);
renderSetSelector();
</script>
<footer>JLPT N1 — Mondai 6 (文の文法②) · Bộ 320 câu — ĐẦY ĐỦ 320/320 câu · 16 set</footer>
