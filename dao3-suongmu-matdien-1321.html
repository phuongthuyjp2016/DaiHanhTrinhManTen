function selectWeek(w, el){
 curWeek=w; curSet=0;
 document.querySelectorAll('.wtab').forEach(t=>t.classList.remove('wactive'));
 el.classList.add('wactive');
 document.getElementById('ss').value=0;
 buildSetSelect();
 if(mode==='list') renderList();
 else startQuiz();
}
function getFiltered(){
 let qs = DATA;
 if(curWeek>0) qs=qs.filter(q=>q.w===curWeek);
 if(curSet>0) qs=qs.filter(q=>q.b===curSet);
 if(searchQ){
 const s=searchQ.toLowerCase();
 qs=qs.filter(q=>q.q.toLowerCase().includes(s)||q.c.toLowerCase().includes(s)||q.g.toLowerCase().includes(s)||q.m.toLowerCase().includes(s)||q.o.some(o=>o.toLowerCase().includes(s)));
 }
 return qs;
}

 document.getElementById('prog-wrap').style.display=m==='quiz'?'block':'none';

 updateProg();
 const saved=history[qIdx];
 const wc=WEEK_COLORS[q.w]||'bw1';
 const wl=WEEK_LABELS[q.w]||'';
 const sheetBadge = q.s==='N'?'NGỮ PHÁP':q.s==='B'?'BÀI 07-12':'TUẦN 3';
 const sheetColor = q.s==='N'?'bs':q.s==='B'?'bset':'bs';
 const optsHtml=q.o.map((o,i)=>{
 let cls='opt';
 if(saved!==null){
 if(i===q.a) cls+=' reveal';
 if(i===saved.chosen&&!saved.correct) cls+=' wrong';
 if(i===q.a&&saved.correct) cls+=' correct';
 }
 return `<button class="${cls}" id="opt-${i}" onclick="doAns(${i})" ${saved!==null?'disabled':''}><span class="on">${i+1}.</span>${o}</button>`;
 }).join('');
 const ansBadge=saved!==null?`<div class="ans-badge">✓ Đáp án: ${q.a+1}. ${q.o[q.a]}</div>`:'';
 const exShow=saved!==null?'show':'';
 const prevBtn=qIdx>0
 ?`<button class="bnav bprev" onclick="goPrev()">← Câu trước</button>`
 :`<button class="bnav bprev" disabled style="opacity:.3">← Câu trước</button>`;
 const nextBtns=saved!==null
 ?`<div class="qnav-r"><button class="bnav" onclick="doSkip()">Bỏ qua</button><button class="bnav bnext" onclick="doNext()">Câu tiếp →</button></div>`
 :`<div class="qnav-r"><button class="bnav" onclick="doSkip()">Bỏ qua →</button></div>`;
 document.getElementById('main').innerHTML=`
 <div class="qcard ${saved?(saved.correct?'cc':'wc'):''}" id="qcard">
 <div class="qhead">
 <span class="b bn">CÂU ${q.i}</span>
 <span class="b ${sheetColor}">${sheetBadge}</span>
 <span class="b ${wc}">${wl}</span>
 <span class="b bset">Bài ${q.b}</span>
 <span class="qpos">${qIdx+1} / ${quizList.length}</span>
 </div>
 <div class="qtext">${q.q}</div>
 <div class="opts">${optsHtml}</div>
 ${ansBadge}
 <div class="explain ${exShow}" id="ex">
 <div class="ex-row"><span class="ex-lbl">CẤU TRÚC</span><span class="ex-struct">${q.c||''}</span></div>
 <div class="ex-row"><span class="ex-lbl">NGỮ PHÁP</span><span class="ex-g">${q.g}</span></div>
 <div class="ex-row"><span class="ex-lbl">NGHĨA</span><span class="ex-m">${q.m}</span></div>
 <div class="ex-row"><span class="ex-lbl">BẪY JLPT</span><div class="ex-t">${q.t}</div></div>
 </div>
 </div>
 <div class="qnav" id="qnav">${prevBtn}${nextBtns}</div>`;
 answered=saved!==null;
}
function doAns(i){
 if(answered)return;
 answered=true;
 const q=quizList[qIdx];
 document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
 const card=document.getElementById('qcard');
 const isCorrect=(i===q.a);
 if(isCorrect){document.getElementById('opt-'+i).classList.add('correct');card.classList.add('cc');if(history[qIdx]===null)correct++;}
 else{document.getElementById('opt-'+i).classList.add('wrong');document.getElementById('opt-'+q.a).classList.add('reveal');card.classList.add('wc');if(history[qIdx]===null){wrong++;wrongList.push({...q,myAns:i});}}
 history[qIdx]={chosen:i,correct:isCorrect};
 const ab=`<div class="ans-badge">✓ Đáp án: ${q.a+1}. ${q.o[q.a]}</div>`;
 document.getElementById('ex').insertAdjacentHTML('beforebegin',ab);
 document.getElementById('ex').classList.add('show');
 document.getElementById('qnav').innerHTML=`
 <button class="bnav bprev" onclick="goPrev()" ${qIdx===0?'style="opacity:.3" disabled':''}>← Câu trước</button>
 <div class="qnav-r"><button class="bnav" onclick="doSkip()">Bỏ qua</button><button class="bnav bnext" onclick="doNext()">Câu tiếp →</button></div>`;
 updateHeader();
}
function doNext(){qIdx++;renderQ();}
function doSkip(){qIdx++;renderQ();}
function goPrev(){if(qIdx>0){qIdx--;renderQ();}}
function showScore(){
 const total=correct+wrong,pct=total>0?Math.round(correct/total*100):0;
 let rank='💪 Cần ôn thêm';
 if(pct>=90)rank='🏆 Xuất sắc!';else if(pct>=75)rank='⭐ Tốt lắm!';else if(pct>=60)rank='📚 Khá ổn';
 document.getElementById('pf').style.width='100%';
 document.getElementById('pl').textContent=quizList.length+' / '+quizList.length;
 let rvHtml='';
 if(wrongList.length>0){
 rvHtml=`<h3 style="color:#ef4444;margin:16px 0 9px;font-size:.88rem">❌ Câu sai (${wrongList.length})</h3>`;
 wrongList.forEach(q=>{
 const wl=WEEK_LABELS[q.w]||'';
 rvHtml+=`<div class="rcard">
 <div class="rmeta">${wl} · Bài ${q.b} · Câu ${q.i}</div>
 <div class="rq">${q.q}</div>
 <div class="rc">✅ Đúng: ${q.o[q.a]}</div>
 <div class="rw">❌ Bạn chọn: ${q.o[q.myAns]}</div>
 <div class="rbox">
 <div class="ex-row"><span class="ex-lbl">CẤU TRÚC</span><span class="ex-struct">${q.c||''}</span></div>
 <div class="ex-row" style="margin-top:5px"><span class="ex-lbl">NGỮ PHÁP</span><span class="ex-g">${q.g}</span></div>
 <div class="ex-row"><span class="ex-lbl">NGHĨA</span><span class="ex-m">${q.m}</span></div>
 <div class="ex-row"><span class="ex-lbl">BẪY JLPT</span><div class="ex-t">${q.t}</div></div>
 </div>
 </div>`;
 });
 }
 document.getElementById('main').innerHTML=`
 <div class="score-wrap">
 <div class="spct">${pct}%</div>
 <div class="srank">${rank}</div>
 <div class="sgrid">
 <div class="scell"><div class="sv">${total}</div><div class="sl">Đã làm</div></div>
 <div class="scell"><div class="sv sg">${correct}</div><div class="sl">Đúng</div></div>
 <div class="scell"><div class="sv sr">${wrong}</div><div class="sl">Sai</div></div>
 </div>
 <div class="sbtns">
 <button class="btn btn-on" onclick="startQuiz()">🔄 Làm lại</button>
 ${wrongList.length>0?'<button class="btn" onclick="reviewWrong()">📋 Ôn câu sai</button>':''}
 </div>
 </div>${rvHtml}`;
}
function reviewWrong(){
 if(!wrongList.length){alert('Không có câu sai! 🎉');return;}
 quizList=[...wrongList];qIdx=0;correct=0;wrong=0;wrongList=[];
 history=new Array(quizList.length).fill(null);
 updateHeader();updateProg();renderQ();
}
function doReviewWrong(){if(!wrongList.length){alert('Chưa có câu sai!');return;}reviewWrong();}
function renderList(){
 const qs=getFiltered();
 document.getElementById('tc').textContent=qs.length+' câu';
 if(!qs.length){document.getElementById('main').innerHTML='<div class="empty">🔍 Không tìm thấy kết quả</div>';return;}
 let html='';
 qs.forEach(q=>{
 const wc=WEEK_COLORS[q.w]||'bw1';
 const wl=WEEK_LABELS[q.w]||'';
 const sheetBadge=q.s==='N'?'NGỮ PHÁP':q.s==='B'?'BÀI 07-12':'TUẦN 3';
 const sheetColor=q.s==='N'?'bs':q.s==='B'?'bset':'bs';
 html+=`<div class="lcard">
 <div class="lmeta">
 <span class="b bn">CÂU ${q.i}</span>
 <span class="b ${sheetColor}">${sheetBadge}</span>
 <span class="b ${wc}">${wl}</span>
 <span class="b bset">Bài ${q.b}</span>
 </div>
 <div class="lq">${q.q}</div>
 <div class="lans">✅ ${q.a+1}. ${q.o[q.a]}</div>
 <div><span class="lstruct">${q.c||''}</span></div>
 <div class="lg">📖 ${q.g}</div>
 <div class="lm">🇻🇳 ${q.m}</div>
 <div class="lt">⚠️ ${q.t}</div>
 </div>`;
 });
 document.getElementById('main').innerHTML=html;
}
buildSetSelect();
document.getElementById('prog-wrap').style.display='block';
startQuiz();
function goToSet(s){
  curSet=s;
  const sel=document.getElementById('ss');
  if(sel) sel.value=s;
  switchMode('quiz');
}
function showSetNav(){
 const popup=document.getElementById('set-nav-popup');
 if(popup.style.display==='block'){popup.style.display='none';return;}
 const wk=curWeek||(quizList.length>0?quizList[Math.min(qIdx,quizList.length-1)]?.w:0)||0;
 if(!wk){popup.style.display='none';return;}
 const src=DATA.filter(q=>q.w===wk);
 const sheets=[...new Set(src.map(q=>q.s))];
 const WC={1:'bw1',2:'bw2',3:'bw3',4:'bw4',5:'bw5',6:'bw6',7:'bw7'};
 const wc=WC[wk]||'bw1';
 let h=`<div style="padding:10px 12px"><div style="font-size:.68rem;font-weight:800;color:#94a3b8;letter-spacing:.6px;margin-bottom:8px;text-transform:uppercase">TUẦN ${wk}</div><div style="display:flex;flex-direction:column;gap:4px">`;
 let baiNum=1;
 sheets.forEach(sh=>{
  const shSets=[...new Set(src.filter(q=>q.s===sh).map(q=>q.b))].sort((a,b)=>a-b);
  shSets.forEach(s=>{
   const ids=src.filter(q=>q.b===s).map(q=>q.i).sort((a,b)=>a-b);
   const rng=`Câu ${ids[0]}–${ids[ids.length-1]}`;
   const isCur=s===curSet;
   const bg=isCur?'#1a1f36':'#fff';
   const cl=isCur?'#fff':'#1a1f36';
   const fc=isCur?'rgba(255,255,255,.7)':'#64748b';
   h+=`<button onclick="goToSet(${s});document.getElementById('set-nav-popup').style.display='none'" style="padding:8px 12px;border-radius:8px;border:1.5px solid ${isCur?'#1a1f36':'#e2e8f0'};cursor:pointer;background:${bg};color:${cl};text-align:left;display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px">
    <span class="${wc}" style="padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:700;border:1px solid transparent;white-space:nowrap">Bài ${baiNum}</span>
    <span style="font-size:.73rem;color:${fc};white-space:nowrap">${rng}</span>
   </button>`;
   baiNum++;
  });
 });
 h+='</div></div>';
 popup.innerHTML=h;
 popup.style.display='block';
}
document.addEventListener('click',function(e){
  const popup=document.getElementById('set-nav-popup');
  const btn=document.getElementById('nav-set-btn');
  if(popup&&btn&&!popup.contains(e.target)&&!btn.contains(e.target)){
    popup.style.display='none';
  }
});
</script>
</body>
</html>
