const EXP_PER_CORRECT = 5;
const COMBO_TARGET = 10;
const COMBO_BONUS = 50;
let comboCount = 0;
const HYPE_MESSAGES = ['Xuất sắc!', 'Đỉnh của chóp!', 'Cứ thế phát huy nhé!', 'Quá đỉnh!', 'N1 đang trong tầm tay!', 'Không gì cản được bạn!', 'Chuẩn không cần chỉnh!', 'Học vậy mới máu!'];

function loadLocalProfile() {
  try { const r = localStorage.getItem('dhtm_profile_v1'); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function saveLocalProfile(p) {
  try { localStorage.setItem('dhtm_profile_v1', JSON.stringify(p)); } catch (e) {}
}
function awardExp(amount) {
  const profile = loadLocalProfile();
  if (!profile) return false;
  let exp = (profile.exp || 0) + amount, level = profile.level || 1, expToNext = profile.expToNext || 100;
  let leveledUp = false;
  while (exp >= expToNext) { exp -= expToNext; level += 1; expToNext = Math.round(expToNext * (level >= 10 ? 1.4 : 1.25)); leveledUp = true; }
  profile.exp = exp; profile.level = level; profile.expToNext = expToNext;
  saveLocalProfile(profile);
  return leveledUp;
}
function pickHype() { return HYPE_MESSAGES[Math.floor(Math.random() * HYPE_MESSAGES.length)]; }
function showExpToast(mainText, subText, big) {
  document.querySelectorAll('.exp-toast').forEach(t => t.remove());
  const wrap = document.createElement('div');
  wrap.className = 'exp-toast' + (big ? ' exp-toast-big' : '');
  const line1 = document.createElement('div');
  line1.className = 'exp-toast-main';
  line1.textContent = mainText;
  const line2 = document.createElement('div');
  line2.className = 'exp-toast-sub';
  line2.textContent = subText;
  wrap.appendChild(line1);
  wrap.appendChild(line2);
  document.body.appendChild(wrap);
  setTimeout(() => { wrap.classList.add('exp-toast-out'); }, 900);
  setTimeout(() => { wrap.remove(); }, 1400);
}
function showComboToast(n) {
  let el = document.getElementById('combo-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'combo-toast';
    el.className = 'combo-toast';
    document.body.appendChild(el);
  }
  el.textContent = '🔥 Chuỗi ' + n + ' câu đúng';
  el.classList.add('show');
  clearTimeout(window._comboToastTimer);
  window._comboToastTimer = setTimeout(() => { el.classList.remove('show'); }, 1500);
}
function showCoinBurst(amount) {
  const overlay = document.createElement('div');
  overlay.className = 'coin-burst-overlay';
  const card = document.createElement('div');
  card.className = 'coin-burst-card';
  const icon = document.createElement('div');
  icon.className = 'coin-burst-icon';
  icon.textContent = '🪙';
  const text = document.createElement('div');
  text.className = 'coin-burst-text';
  text.textContent = '+' + amount + ' Xu!';
  const sub = document.createElement('div');
  sub.className = 'coin-burst-sub';
  sub.textContent = 'Nhặt được xu may mắn!';
  card.appendChild(icon);
  card.appendChild(text);
  card.appendChild(sub);
  overlay.appendChild(card);
  for (let i = 0; i < 14; i++) {
    const pt = document.createElement('div');
    pt.className = 'coin-particle';
    pt.textContent = '🪙';
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 140;
    pt.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    pt.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    overlay.appendChild(pt);
  }
  document.body.appendChild(overlay);
  setTimeout(() => { card.classList.add('coin-burst-out'); }, 1200);
  setTimeout(() => { overlay.remove(); }, 1700);
}
function maybeDropCoins() {
  if (Math.random() >= 0.35) return;
  const amount = 5 + Math.floor(Math.random() * 21);
  const profile = loadLocalProfile();
  if (profile) {
    profile.coins = (profile.coins || 0) + amount;
    saveLocalProfile(profile);
  }
  showCoinBurst(amount);
}
function onCorrectAnswer() {
  comboCount++;
  let gained = EXP_PER_CORRECT;
  let big = false;
  let sub = pickHype();
  if (comboCount >= 2) showComboToast(comboCount);
  if (comboCount > 0 && comboCount % COMBO_TARGET === 0) {
    gained += COMBO_BONUS;
    big = true;
    sub = 'Chuỗi ' + comboCount + ' câu đúng — Bùng nổ!';
  }
  const leveledUp = awardExp(gained);
  showExpToast('+' + gained + ' EXP', leveledUp ? 'LÊN CẤP! 🎉' : sub, big || leveledUp);
  maybeDropCoins();
}
function onWrongAnswer() {
  comboCount = 0;
}

    33: {label:'Bài 33 — Câu 51–75',  group:'🟠 Tuần 6'},
    34: {label:'Bài 34 — Câu 76–100', group:'🟠 Tuần 6'},
    35: {label:'Bài 35 — Câu 101–125',group:'🟠 Tuần 6'},
    36: {label:'Bài 36 — Câu 126–150',group:'🟠 Tuần 6'},
    37: {label:'Bài 37 — Câu 1–25',   group:'🩵 Tuần 7'},
    38: {label:'Bài 38 — Câu 26–50',  group:'🩵 Tuần 7'},
    39: {label:'Bài 39 — Câu 51–75',  group:'🩵 Tuần 7'},
    40: {label:'Bài 40 — Câu 76–100', group:'🩵 Tuần 7'},
    41: {label:'Bài 41 — Câu 101–125',group:'🩵 Tuần 7'},
    42: {label:'Bài 42 — Câu 126–150',group:'🩵 Tuần 7'},
    43: {label:'Bài 43 — Câu 1–25',   group:'🌸 Tuần 8'},
    44: {label:'Bài 44 — Câu 26–50',  group:'🌸 Tuần 8'},
    45: {label:'Bài 45 — Câu 51–75',  group:'🌸 Tuần 8'},
    46: {label:'Bài 46 — Câu 76–100', group:'🌸 Tuần 8'},
    47: {label:'Bài 47 — Câu 101–125',group:'🌸 Tuần 8'},
    48: {label:'Bài 48 — Câu 126–150',group:'🌸 Tuần 8'},
    49: {label:'Bài 49 — Câu 1–25',   group:'⭐ Tuần 9'},
    50: {label:'Bài 50 — Câu 26–50',  group:'⭐ Tuần 9'},
    51: {label:'Bài 51 — Câu 51–75',  group:'⭐ Tuần 9'},
    52: {label:'Bài 52 — Câu 76–100', group:'⭐ Tuần 9'},
    53: {label:'Bài 53 — Câu 101–121',group:'⭐ Tuần 9'},
  };
 let lastGroup = '';
 sets.forEach(s => {
 const info = SET_INFO[s] || {label:`Bài ${s}`, group:'Khác'};
 if(info.group !== lastGroup){
 const og = document.createElement('optgroup');
 og.label = info.group;
 sel.appendChild(og);
 lastGroup = info.group;
 }
 const opt = document.createElement('option');
 opt.value = s;
 opt.textContent = info.label;
 sel.appendChild(opt);
 });
}
function selectWeek(w, el){
 curWeek=w; curSet=0;
 document.querySelectorAll('.wtab').forEach(t=>t.classList.remove('wactive'));
 el.classList.add('wactive');
 document.getElementById('ss').value=0;
 buildSetSelect();
 if(mode==='list') renderList();
 else startQuiz();
}
function getFiltered(){
 let qs = DATA;
 if(curWeek>0) qs=qs.filter(q=>q.w===curWeek);
 if(curSet>0) qs=qs.filter(q=>q.b===curSet);
 if(searchQ){
 const s=searchQ.toLowerCase();
 qs=qs.filter(q=>q.q.toLowerCase().includes(s)||q.c.toLowerCase().includes(s)||q.g.toLowerCase().includes(s)||q.m.toLowerCase().includes(s)||q.o.some(o=>o.toLowerCase().includes(s)));
 }
 return qs;
}
function onSearch(){searchQ=document.getElementById('si').value;if(mode==='list')renderList();}
function onSetChange(){curSet=parseInt(document.getElementById('ss').value);if(mode==='list')renderList();else startQuiz();}
function switchMode(m){
 mode=m;
 document.getElementById('btn-quiz').classList.toggle('btn-on',m==='quiz');
 document.getElementById('btn-list').classList.toggle('btn-on',m==='list');
 document.getElementById('prog-wrap').style.display=m==='quiz'?'block':'none';
 document.getElementById('qpicker').style.display=m==='quiz'?'flex':'none';
 if(m==='list') renderList(); else startQuiz();
}
const MATDIEN_PROGRESS_KEY='matdien1321_progress';
function saveMatdienProgress(){
 try{ localStorage.setItem(MATDIEN_PROGRESS_KEY, JSON.stringify({curWeek:curWeek,curSet:curSet,qIdx:qIdx,correct:correct,wrong:wrong,history:history,total:quizList.length})); }catch(e){}
}
function loadMatdienProgress(){
 try{ return JSON.parse(localStorage.getItem(MATDIEN_PROGRESS_KEY)||'null'); }catch(e){ return null; }
}
function clearMatdienProgress(){
 try{ localStorage.removeItem(MATDIEN_PROGRESS_KEY); }catch(e){}
 const el=document.getElementById('matdien-resume-banner');
 if(el) el.style.display='none';
}
function renderMatdienResumeBanner(){
 const el=document.getElementById('matdien-resume-banner');
 if(!el) return;
 const p=loadMatdienProgress();
 if(!p || p.qIdx<1 || p.qIdx>=p.total){ el.style.display='none'; return; }
 el.style.display='';
 el.innerHTML='<div class="resume-banner"><span>📍 Lần trước bạn đang làm dở, dừng ở câu <b>'+(p.qIdx+1)+'/'+p.total+'</b> (đúng '+p.correct+', sai '+p.wrong+')</span><div style="display:flex;gap:8px"><button class="resume-go" onclick="continueMatdien()">Tiếp tục →</button><button class="resume-clear" onclick="clearMatdienProgress()">Xóa</button></div></div>';
}
function continueMatdien(){
 const p=loadMatdienProgress();
 if(!p) return;
 curWeek=p.curWeek; curSet=p.curSet;
 document.querySelectorAll('.wtab').forEach(t=>t.classList.remove('wactive'));
 const wbtn=document.querySelector('.wtab[onclick*="selectWeek('+curWeek+',"]');
 if(wbtn) wbtn.classList.add('wactive');
 buildSetSelect();
 document.getElementById('ss').value=curSet;
 switchMode('quiz');
 startQuiz(p.qIdx, p.correct, p.wrong, p.history);
}
function startQuiz(resumeIdx, resumeCorrect, resumeWrong, resumeHistory){
 quizList=getFiltered();
 qIdx=resumeIdx||0;correct=resumeCorrect||0;wrong=resumeWrong||0;
 history=(resumeHistory && resumeHistory.length===quizList.length) ? resumeHistory : new Array(quizList.length).fill(null);
 wrongList=history.map((h,i)=> (h && !h.correct) ? Object.assign({},quizList[i],{myAns:h.chosen}) : null).filter(Boolean);
 answered=false;
 updateHeader();updateProg();renderQ();
}
function updateHeader(){
 const done=correct+wrong;
 document.getElementById('hc').textContent=correct;
 document.getElementById('hw').textContent=wrong;
 document.getElementById('hp').textContent=done>0?Math.round(correct/done*100)+'%':'0%';
}
function updateProg(){
 const pct=quizList.length>0?Math.round(qIdx/quizList.length*100):0;
 document.getElementById('pf').style.width=pct+'%';
 document.getElementById('pl').textContent=qIdx+' / '+quizList.length;
 document.getElementById('tc').textContent=getFiltered().length+' câu';
 renderPicker();
}
function jumpTo(i){qIdx=i;renderQ();}
function renderPicker(){
 const pk=document.getElementById('qpicker');
 if(mode!=='quiz'||quizList.length===0||curSet===0){pk.style.display='none';return;}
 pk.style.display='flex';
 let h='';
 quizList.forEach((q,i)=>{
  let cls='qpick';
  if(i===qIdx) cls+=' qp-cur';
  else if(history[i]!==null) cls+=history[i].correct?' qp-ok':' qp-wrong';
  h+=`<button class="${cls}" onclick="jumpTo(${i})">${q.i}</button>`;
 });
 pk.innerHTML=h;
 setTimeout(()=>{const cur=pk.querySelector('.qp-cur');if(cur)cur.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});},50);
}
function renderQ(){
 if(qIdx>=quizList.length){showScore();return;}
 if(qIdx<0)qIdx=0;
 if(qIdx>0){ const rb=document.getElementById('matdien-resume-banner'); if(rb) rb.style.display='none'; }
 const q=quizList[qIdx];
 updateProg();
 const saved=history[qIdx];
 const wc=WEEK_COLORS[q.w]||'bw1';
 const wl=WEEK_LABELS[q.w]||'';
 const sheetBadge = q.s==='N'?'NGỮ PHÁP':q.s==='B'?'BÀI 07-12':'TUẦN 3';
 const sheetColor = q.s==='N'?'bs':q.s==='B'?'bset':'bs';
 const optsHtml=q.o.map((o,i)=>{
 let cls='opt';
 if(saved!==null){
 if(i===q.a) cls+=' reveal';
 if(i===saved.chosen&&!saved.correct) cls+=' wrong';
 if(i===q.a&&saved.correct) cls+=' correct';
 }
 return `<button class="${cls}" id="opt-${i}" onclick="doAns(${i})" ${saved!==null?'disabled':''}><span class="on">${i+1}.</span>${o}</button>`;
 }).join('');
 const ansBadge=saved!==null?`<div class="ans-badge">✓ Đáp án: ${q.a+1}. ${q.o[q.a]}</div>`:'';
 const exShow=saved!==null?'show':'';
 const prevBtn=qIdx>0
 ?`<button class="bnav bprev" onclick="goPrev()">← Câu trước</button>`
 :`<button class="bnav bprev" disabled style="opacity:.3">← Câu trước</button>`;
 const nextBtns=saved!==null
 ?`<div class="qnav-r"><button class="bnav" onclick="doSkip()">Bỏ qua</button><button class="bnav bnext" onclick="doNext()">Câu tiếp →</button></div>`
 :`<div class="qnav-r"><button class="bnav" onclick="doSkip()">Bỏ qua →</button></div>`;
 document.getElementById('main').innerHTML=`
 <div class="qcard ${saved?(saved.correct?'cc':'wc'):''}" id="qcard">
 <div class="qhead">
 <span class="b bn">CÂU ${q.i}</span>
 <span class="b ${sheetColor}">${sheetBadge}</span>
 <span class="b ${wc}">${wl}</span>
 <span class="b bset">Bài ${q.b}</span>
 <span class="qpos">${qIdx+1} / ${quizList.length}</span>
 </div>
 <div class="qtext">${q.q}</div>
 <div class="opts">${optsHtml}</div>
 ${ansBadge}
 <div class="explain ${exShow}" id="ex">
 <div class="ex-row"><span class="ex-lbl">CẤU TRÚC</span><span class="ex-struct">${q.c||''}</span></div>
 <div class="ex-row"><span class="ex-lbl">NGỮ PHÁP</span><span class="ex-g">${q.g}</span></div>
 <div class="ex-row"><span class="ex-lbl">NGHĨA</span><span class="ex-m">${q.m}</span></div>
 <div class="ex-row"><span class="ex-lbl">BẪY JLPT</span><div class="ex-t">${q.t}</div></div>
 </div>
 </div>
 <div class="qnav" id="qnav">${prevBtn}${nextBtns}</div>`;
 answered=saved!==null;
}
function doAns(i){
 if(answered)return;
 answered=true;
 const q=quizList[qIdx];
 document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
 const card=document.getElementById('qcard');
 const isCorrect=(i===q.a);
 if(isCorrect){
   document.getElementById('opt-'+i).classList.add('correct');card.classList.add('cc');
   if(history[qIdx]===null)correct++;
   if(!everCorrect.has(q.i)){
     everCorrect.add(q.i);
     try{ localStorage.setItem(EVER_CORRECT_KEY, JSON.stringify([...everCorrect])); }catch(e){}
     reportToolProgress(everCorrect.size, DATA.length);
   }
   onCorrectAnswer();
 }
 else{
   document.getElementById('opt-'+i).classList.add('wrong');document.getElementById('opt-'+q.a).classList.add('reveal');card.classList.add('wc');
   if(history[qIdx]===null){wrong++;wrongList.push({...q,myAns:i});}
   onWrongAnswer();
 }
 history[qIdx]={chosen:i,correct:isCorrect};
 saveMatdienProgress();
 const ab=`<div class="ans-badge">✓ Đáp án: ${q.a+1}. ${q.o[q.a]}</div>`;
 document.getElementById('ex').insertAdjacentHTML('beforebegin',ab);
 document.getElementById('ex').classList.add('show');
 document.getElementById('qnav').innerHTML=`
 <button class="bnav bprev" onclick="goPrev()" ${qIdx===0?'style="opacity:.3" disabled':''}>← Câu trước</button>
 <div class="qnav-r"><button class="bnav" onclick="doSkip()">Bỏ qua</button><button class="bnav bnext" onclick="doNext()">Câu tiếp →</button></div>`;
 updateHeader();
}
function doNext(){qIdx++;saveMatdienProgress();renderQ();}
function doSkip(){qIdx++;saveMatdienProgress();renderQ();}
function goPrev(){if(qIdx>0){qIdx--;saveMatdienProgress();renderQ();}}
function showScore(){
 clearMatdienProgress();
 const total=correct+wrong,pct=total>0?Math.round(correct/total*100):0;
 let rank='💪 Cần ôn thêm';
 if(pct>=90)rank='🏆 Xuất sắc!';else if(pct>=75)rank='⭐ Tốt lắm!';else if(pct>=60)rank='📚 Khá ổn';
 document.getElementById('pf').style.width='100%';
 document.getElementById('pl').textContent=quizList.length+' / '+quizList.length;
 let rvHtml='';
 if(wrongList.length>0){
 rvHtml=`<h3 style="color:#ef4444;margin:16px 0 9px;font-size:.88rem">❌ Câu sai (${wrongList.length})</h3>`;
 wrongList.forEach(q=>{
 const wl=WEEK_LABELS[q.w]||'';
 rvHtml+=`<div class="rcard">
 <div class="rmeta">${wl} · Bài ${q.b} · Câu ${q.i}</div>
 <div class="rq">${q.q}</div>
 <div class="rc">✅ Đúng: ${q.o[q.a]}</div>
 <div class="rw">❌ Bạn chọn: ${q.o[q.myAns]}</div>
 <div class="rbox">
 <div class="ex-row"><span class="ex-lbl">CẤU TRÚC</span><span class="ex-struct">${q.c||''}</span></div>
 <div class="ex-row" style="margin-top:5px"><span class="ex-lbl">NGỮ PHÁP</span><span class="ex-g">${q.g}</span></div>
 <div class="ex-row"><span class="ex-lbl">NGHĨA</span><span class="ex-m">${q.m}</span></div>
 <div class="ex-row"><span class="ex-lbl">BẪY JLPT</span><div class="ex-t">${q.t}</div></div>
 </div>
 </div>`;
 });
 }
 document.getElementById('main').innerHTML=`
 <div class="score-wrap">
 <div class="spct">${pct}%</div>
 <div class="srank">${rank}</div>
 <div class="sgrid">
 <div class="scell"><div class="sv">${total}</div><div class="sl">Đã làm</div></div>
 <div class="scell"><div class="sv sg">${correct}</div><div class="sl">Đúng</div></div>
 <div class="scell"><div class="sv sr">${wrong}</div><div class="sl">Sai</div></div>
 </div>
 <div class="sbtns">
 <button class="btn btn-on" onclick="startQuiz()">🔄 Làm lại</button>
 ${wrongList.length>0?'<button class="btn" onclick="reviewWrong()">📋 Ôn câu sai</button>':''}
 </div>
 </div>${rvHtml}`;
}
function reviewWrong(){
 if(!wrongList.length){alert('Không có câu sai! 🎉');return;}
 quizList=[...wrongList];qIdx=0;correct=0;wrong=0;wrongList=[];
 history=new Array(quizList.length).fill(null);
 updateHeader();updateProg();renderQ();
}
function doReviewWrong(){if(!wrongList.length){alert('Chưa có câu sai!');return;}reviewWrong();}
function renderList(){
 const qs=getFiltered();
 document.getElementById('tc').textContent=qs.length+' câu';
 if(!qs.length){document.getElementById('main').innerHTML='<div class="empty">🔍 Không tìm thấy kết quả</div>';return;}
 let html='';
 qs.forEach(q=>{
 const wc=WEEK_COLORS[q.w]||'bw1';
 const wl=WEEK_LABELS[q.w]||'';
 const sheetBadge=q.s==='N'?'NGỮ PHÁP':q.s==='B'?'BÀI 07-12':'TUẦN 3';
 const sheetColor=q.s==='N'?'bs':q.s==='B'?'bset':'bs';
 html+=`<div class="lcard">
 <div class="lmeta">
 <span class="b bn">CÂU ${q.i}</span>
 <span class="b ${sheetColor}">${sheetBadge}</span>
 <span class="b ${wc}">${wl}</span>
 <span class="b bset">Bài ${q.b}</span>
 </div>
 <div class="lq">${q.q}</div>
 <div class="lans">✅ ${q.a+1}. ${q.o[q.a]}</div>
 <div><span class="lstruct">${q.c||''}</span></div>
 <div class="lg">📖 ${q.g}</div>
 <div class="lm">🇻🇳 ${q.m}</div>
 <div class="lt">⚠️ ${q.t}</div>
 </div>`;
 });
 document.getElementById('main').innerHTML=html;
}
buildSetSelect();
document.getElementById('prog-wrap').style.display='block';
startQuiz();
renderMatdienResumeBanner();
function goToSet(s){
  curSet=s;
  const sel=document.getElementById('ss');
  if(sel) sel.value=s;
  switchMode('quiz');
}
function showSetNav(){
 const popup=document.getElementById('set-nav-popup');
 if(popup.style.display==='block'){popup.style.display='none';return;}
 const wk=curWeek||(quizList.length>0?quizList[Math.min(qIdx,quizList.length-1)]?.w:0)||0;
 if(!wk){popup.style.display='none';return;}
 const src=DATA.filter(q=>q.w===wk);
 const sheets=[...new Set(src.map(q=>q.s))];
 const WC={1:'bw1',2:'bw2',3:'bw3',4:'bw4',5:'bw5',6:'bw6',7:'bw7'};
 const wc=WC[wk]||'bw1';
 let h=`<div style="padding:10px 12px"><div style="font-size:.68rem;font-weight:800;color:#333;letter-spacing:.6px;margin-bottom:8px;text-transform:uppercase">TUẦN ${wk}</div><div style="display:flex;flex-direction:column;gap:4px">`;
 let baiNum=1;
 sheets.forEach(sh=>{
  const shSets=[...new Set(src.filter(q=>q.s===sh).map(q=>q.b))].sort((a,b)=>a-b);
  shSets.forEach(s=>{
   const ids=src.filter(q=>q.b===s).map(q=>q.i).sort((a,b)=>a-b);
   const rng=`Câu ${ids[0]}–${ids[ids.length-1]}`;
   const isCur=s===curSet;
   const bg=isCur?'#1a1f36':'#fff';
   const cl=isCur?'#fff':'#1a1f36';
   const fc=isCur?'rgba(255,255,255,.7)':'#64748b';
   h+=`<button onclick="goToSet(${s});document.getElementById('set-nav-popup').style.display='none'" style="padding:8px 12px;border-radius:8px;border:1.5px solid ${isCur?'#1a1f36':'#e2e8f0'};cursor:pointer;background:${bg};color:${cl};text-align:left;display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px">
    <span class="${wc}" style="padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:700;border:1px solid transparent;white-space:nowrap">Bài ${baiNum}</span>
    <span style="font-size:.73rem;color:${fc};white-space:nowrap">${rng}</span>
   </button>`;
   baiNum++;
  });
 });
 h+='</div></div>';
 popup.innerHTML=h;
 popup.style.display='block';
}
document.addEventListener('click',function(e){
  const popup=document.getElementById('set-nav-popup');
  const btn=document.getElementById('nav-set-btn');
  if(popup&&btn&&!popup.contains(e.target)&&!btn.contains(e.target)){
    popup.style.display='none';
  }
});
</script>
