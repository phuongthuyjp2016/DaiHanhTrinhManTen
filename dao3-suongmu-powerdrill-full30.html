<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語パワードリル N1文法</title>

<style>

:root{
  --washi:#f6f1e7;
  --washi-deep:#efe7d6;
  --ink:#222220;
  --ink-soft:#222220;
  --hanko:#1f4e79;
  --hanko-deep:#163a58;
  --gold:#b08d3e;
  --line:#9dc0da;
  --ok:#2e7d4f;
  --ng:#b3402f;
  --card:#fffdf8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--washi);
  background-image:
    radial-gradient(circle at 10% 8%, rgba(176,141,62,0.07), transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(156,59,59,0.06), transparent 45%);
  color:var(--ink);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  min-height:100vh;
  padding-bottom:60px;
}
.wrap{max-width:880px;margin:0 auto;padding:0 18px;}

header.top{
  padding:38px 18px 26px;
  text-align:center;
  position:relative;
}
header.top .tag{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:11px;
  letter-spacing:.32em;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:10px;
}
header.top h1{
  font-size:clamp(26px,5vw,38px);
  margin:0 0 6px;
  letter-spacing:.04em;
  font-weight:600;
}
header.top .sub{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:13px;
  color:var(--ink-soft);
  letter-spacing:.02em;
}
.hanko-mark{
  position:absolute;
  top:18px;right:18px;
  width:46px;height:46px;
  border:2px solid var(--hanko);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--hanko);
  font-size:18px;
  font-weight:700;
  transform:rotate(-4deg);
  background:rgba(156,59,59,0.05);
}

nav.crumb{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:12px;
  color:var(--ink-soft);
  display:none;
  gap:6px;
  align-items:center;
  margin:0 0 18px;
}
nav.crumb button{
  background:none;border:none;color:var(--hanko);cursor:pointer;
  font-family:inherit;font-size:12px;padding:0;text-decoration:underline;
}

/* ---- Home screen ---- */
section#home{}
.section-label{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);margin:34px 0 12px;
  display:flex;align-items:center;gap:10px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:10px;
}
.tile{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:4px;
  padding:14px 10px 12px;
  text-align:center;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  font-family:"Helvetica Neue",Arial,sans-serif;
  position:relative;
}
.tile:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(60,40,20,.10);
  border-color:var(--hanko);
}
.tile .num{
  font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
  font-size:20px;font-weight:700;color:var(--ink);
}
.tile .lab{font-size:10px;color:var(--ink-soft);margin-top:2px;}
.tile .score-pill{
  margin-top:8px;font-size:10px;
  display:inline-block;padding:2px 8px;border-radius:20px;
  background:var(--washi-deep);color:var(--ink-soft);
}
.tile.done .score-pill{background:#e7efe7;color:var(--ok);}
.tile.train{background:#fbf7ec;}

/* ---- Quiz screen ---- */
section#quiz{display:none;}
.quiz-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:18px;flex-wrap:wrap;gap:10px;
}
.quiz-head h2{margin:0;font-size:24px;}
.quiz-head .meta{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--ink-soft);}

.part{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:6px;
  padding:20px 20px 6px;
  margin-bottom:22px;
}
.part-title{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:12px;color:var(--ink);font-weight:700;
  letter-spacing:.04em;
  margin:-20px -20px 16px;
  padding:10px 20px;
  background:#fff;
  border-bottom:2px solid var(--line);
  border-radius:5px 5px 0 0;
}
.passage{
  background:var(--washi-deep);
  border-left:3px solid var(--gold);
  padding:14px 16px;
  margin-bottom:18px;
  font-size:15px;
  line-height:1.9;
  white-space:pre-wrap;
  border-radius:2px;
}
.q-item{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.skip-btn{float:right;background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:11.5px;padding:3px 10px;border-radius:12px;cursor:pointer;font-family:inherit;}
.skip-btn:hover{border-color:var(--gold);color:var(--gold);}
.resume-banner{background:#fdf6e8;border:2px solid var(--gold);border-radius:6px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--ink);}
.resume-banner b{color:var(--hanko);}
.resume-banner button{border:none;border-radius:5px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;margin-top:8px;}
.resume-go{background:var(--gold);color:#fff;}
.resume-clear{background:#eee;color:#333;margin-left:8px;}
.q-item:last-child{border-bottom:none;}
.q-num{
  font-family:"Helvetica Neue",Arial,sans-serif;
  display:inline;
  font-size:15px;font-weight:700;
  color:var(--ink);
  margin-right:4px;
  vertical-align:baseline;
}
.q-text{font-size:16px;line-height:1.85;display:inline;font-weight:700;color:var(--ink);}
.opts{margin-top:10px;display:grid;gap:6px;}
.opt{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border:1px solid var(--line);border-radius:4px;
  cursor:pointer;font-size:14.5px;
  transition:background .12s, border-color .12s;
  background:#fffefb;
}
.opt:hover{border-color:var(--gold);}
.opt input{accent-color:var(--hanko);}
.opt .oi{
  font-family:"Helvetica Neue",Arial,sans-serif;
  width:18px;height:18px;border:1px solid var(--ink-soft);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;flex:0 0 auto;color:var(--ink-soft);
}
.opt.sel{border-color:var(--hanko);background:#fbf0ef;}
.opt.sel .oi{background:var(--hanko);border-color:var(--hanko);color:#fff;}
.opt.correct{border-color:var(--ok);background:#eef6ee;}
.opt.correct .oi{background:var(--ok);border-color:var(--ok);color:#fff;}
.opt.wrong{border-color:var(--ng);background:#fbecec;}
.opt.wrong .oi{background:var(--ng);border-color:var(--ng);color:#fff;}
.explain{
  margin-top:12px;
  background:#ffffff;
  border:1px solid #ddd;
  border-left:4px solid var(--ink);
  padding:14px 16px;
  border-radius:6px;
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:13px;
  line-height:1.8;
  color:var(--ink);
  display:none;
}
.explain.show{display:block;}
.ex-label{
  font-size:11px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink);
  margin:10px 0 3px;
}
.ex-label:first-child{margin-top:0;}
.ex-cau-truc{
  display:inline-block;
  background:transparent;color:#000;
  border:none;
  padding:0;
  font-size:15px;font-weight:900;letter-spacing:.01em;
  font-family:"Helvetica Neue",Arial,sans-serif;
  margin-bottom:2px;
}
.ex-ngu-phap{
  color:var(--ink);font-weight:600;font-size:13.5px;
  line-height:1.7;
}
.ex-nghia{color:var(--ink);font-size:13px;line-height:1.7;}
.ex-bay{
  background:#fff;
  border:1px solid #eee;
  border-left:3px solid #e09020;
  padding:10px 14px;
  border-radius:4px;
  font-size:13px;
  line-height:1.9;
  color:var(--ink);
}
.ex-bay-item{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #f0f0f0;}
.ex-bay-item:last-child{margin-bottom:0;border-bottom:none;}
.ex-assembled{
  background:#f0f4ff;border:1px solid #c0ccee;
  border-radius:6px;padding:12px 16px;
  font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
  font-size:15px;line-height:2.1;
  margin-bottom:2px;
}
.ex-slot{
  display:inline-block;
  background:#e8edff;border:1px solid #aab8ee;
  border-radius:4px;padding:2px 8px;margin:0 2px;
  font-size:14px;
}
.ex-slot.star{
  background:#fff0d0;border-color:#e09020;
  font-weight:700;color:#7a4a00;
}
.ex-pos-steps{display:grid;gap:6px;margin-top:2px;}
.ex-pos-step{
  background:#f8f8f8;border-left:3px solid #aab8ee;
  padding:6px 10px;border-radius:3px;
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:12.5px;line-height:1.6;
}
.ex-pos-step b{color:#2a44aa;}
.ex-pos-step.star-step{border-left-color:#e09020;background:#fff9f0;}
.ex-pos-step.star-step b{color:#7a4a00;}
/* ── 問題2 layout (3-step) ── */
.ord-top-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-family:"Helvetica Neue",Arial,sans-serif;}
.ord-badge-order{background:#2c2c2c;color:#fff;padding:4px 14px;border-radius:14px;font-size:12px;font-weight:700;letter-spacing:.05em;}
.ord-badge-star{background:#fff8e0;border:1.5px solid #c89820;color:#6b4a00;padding:4px 14px;border-radius:14px;font-size:12px;font-weight:700;}

.ord-sentence-box{background:#f5f7ff;border:1px solid #d0d8f0;border-radius:10px;padding:16px 18px;margin-bottom:18px;}
.ord-sentence{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:15.5px;line-height:2.3;flex-wrap:wrap;}
.ord-fixed{color:#aaa;}
.ord-piece{display:inline-block;background:#e8ecf8;border:1px solid #b8c4e4;border-radius:6px;padding:3px 10px;margin:2px 3px;font-size:14.5px;color:#1a1a2e;font-weight:600;}
.ord-star{background:#fff3cc;border-color:#c89820;color:#5a3800;font-weight:700;}
.ord-vi{margin-top:10px;padding-top:10px;border-top:1px solid #d8def0;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:#333;line-height:1.6;}

.ord-block{margin-bottom:18px;}
.ord-block-title{display:flex;align-items:center;gap:8px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:700;color:#111;margin-bottom:10px;}
.ord-step-dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:0 0 auto;}
.dot1{background:#6b7fa3;}.dot2{background:#b08d3e;}.dot3{background:#163a58;}

.ord-pair-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.ord-pair-divider{text-align:center;font-size:18px;color:#bbb;margin:4px 0;}
.ord-pc{border:1.5px solid #e0e0e0;border-radius:8px;padding:12px 14px;font-family:"Helvetica Neue",Arial,sans-serif;}
.ord-pc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.ord-pc-num{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:0 0 auto;}
.ord-pc-jp{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:14px;font-weight:700;color:#111;}
.ord-pc-con code{font-size:11px;background:#f2f2f2;color:#333;padding:2px 7px;border-radius:3px;display:inline-block;margin-top:3px;}
.ord-pc-exp{font-size:12px;color:#444;margin-top:4px;line-height:1.6;}

.ord-ends{display:grid;gap:8px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;}
.ord-end{background:#fafafa;border:1px solid #eee;border-radius:6px;padding:10px 14px;}
.ord-end-lbl{font-size:11px;font-weight:700;color:#888;margin-right:6px;letter-spacing:.04em;}
.ord-end-ctx{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:14px;font-weight:600;color:#1a1a2e;}

.ord-flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;background:#f8f8f8;border-radius:8px;padding:12px 14px;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:14px;}
.ord-flow-piece{background:#e8ecf8;border:1px solid #b8c4e4;border-radius:5px;padding:3px 10px;font-weight:600;color:#1a1a2e;}
.ord-flow-star{background:#fff3cc;border-color:#c89820;color:#5a3800;font-weight:700;}
.ord-flow-arr{color:#ccc;font-size:14px;}

.ord-gram-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:14px 16px;font-family:"Helvetica Neue",Arial,sans-serif;margin-top:4px;}
.ord-gram-title{font-size:13px;font-weight:700;color:#111;margin-bottom:10px;}
.ord-gram-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.ord-gram-row:last-child{margin-bottom:0;}
.ord-gram-lbl2{font-size:10px;font-weight:800;color:#999;letter-spacing:.1em;text-transform:uppercase;min-width:72px;}
.ord-gram-code2{font-size:12px;background:#f2f2f2;color:#222;padding:2px 8px;border-radius:4px;font-weight:600;}
.ord-gram-exp2{font-size:13.5px;color:#111;font-weight:500;}

/* ── 問題2 new layout ── */
.m2-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-family:"Helvetica Neue",Arial,sans-serif;}
.m2-order{background:#2c2c2c;color:#fff;padding:4px 14px;border-radius:14px;font-size:12px;font-weight:700;}
.m2-mau{background:#fff8e0;border:1.5px solid #c89820;color:#6b4a00;padding:4px 14px;border-radius:14px;font-size:12px;font-weight:700;}
.m2-sentence{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:15px;line-height:2;margin-bottom:12px;color:#222;}
.m2-vi{font-style:italic;color:#444;font-size:13px;line-height:1.7;margin-bottom:10px;font-family:"Helvetica Neue",Arial,sans-serif;}
.m2-hr{border:none;border-top:1px solid #e8e8e8;margin:12px 0;}
.m2-steps{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13.5px;line-height:1.8;display:grid;gap:10px;}
.m2-step{color:#222;}
.m2-step b{color:#111;}
.m2-note{color:#222;background:#f7f9fc;border:1px solid #e3e8f0;border-radius:8px;padding:12px 14px;}

.hint-box{
  margin-top:10px;
  background:#fdf8ec;
  border-left:3px solid var(--gold);
  padding:9px 14px 9px 26px;
  border-radius:4px;
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:13.5px;
  line-height:1.8;
  color:#111;
  font-weight:500;
  display:none;
  position:relative;
}
.hint-box::before{
  content:"🔑";
  position:absolute;left:8px;top:9px;
  font-size:13px;
}
.hint-box.show{display:block;}
.hint-sentence{
  font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
  font-size:15px;line-height:1.9;
  background:#fff;border:1px solid var(--line);
  border-radius:6px;padding:10px 14px;margin-bottom:12px;
  color:var(--ink);font-weight:600;
}
.hint-main{margin-bottom:4px;}
.hint-trap-label{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:12px;font-weight:800;letter-spacing:.04em;
  color:var(--hanko-deep);margin:14px 0 8px;
}
.hint-trap-cards{display:grid;gap:8px;}
.hint-trap-card{
  background:#fff;border:1px solid #e8ddc8;border-left:3px solid var(--ng);
  border-radius:6px;padding:10px 12px;
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:13px;line-height:1.7;color:#222;
}
.ab-row{display:flex;gap:10px;margin-top:10px;}
.ab-row .opt{flex:1;justify-content:center;text-align:center;}

.notebox{
  background:#fbf3e3;border:1px solid var(--gold);
  padding:12px 14px;border-radius:4px;font-size:13px;color:#6b531f;
  margin-bottom:18px;font-family:"Helvetica Neue",Arial,sans-serif;
}

.actions{
  display:flex;gap:12px;justify-content:center;margin:30px 0 10px;flex-wrap:wrap;
}
button.btn{
  font-family:"Helvetica Neue",Arial,sans-serif;
  border:none;padding:13px 30px;border-radius:30px;
  font-size:14px;letter-spacing:.03em;cursor:pointer;
  background:var(--hanko);color:#fff;
  transition:background .15s, transform .1s;
}
button.btn:hover{background:var(--hanko-deep);transform:translateY(-1px);}
button.btn.ghost{
  background:transparent;color:var(--ink);border:1px solid var(--ink-soft);
}
button.btn.ghost:hover{border-color:var(--hanko);color:var(--hanko);}

.score-banner{
  text-align:center;padding:22px;margin-bottom:24px;
  background:linear-gradient(135deg,#fff,#fbf3e3);
  border:1px solid var(--gold);border-radius:8px;
}
.score-banner .big{font-size:42px;font-weight:700;color:var(--hanko);}
.score-banner .small{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--ink-soft);margin-top:4px;}

footer{
  text-align:center;font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:11px;color:var(--ink-soft);margin-top:50px;padding:20px;
}
@media (max-width:480px){
  .tile{padding:12px 6px;}
  .part{padding:16px 14px 4px;}
}
</style>
</head>
<body>


<header class="top">
  <div class="hanko-mark">N1</div>
  <div class="tag">Nihongo Power Drill</div>
  <h1>日本語パワードリル 文法</h1>
  <div class="sub">全30回 + 集中トレーニング10回　インタラクティブ問題集</div>
</header>

<div class="wrap">
  <nav class="crumb" id="crumb"><button onclick="goHome()">⟵ 一覧へ戻る</button></nav>

  <section id="home">
    <input type="text" id="drillSearchInput" placeholder="🔍 Tìm theo câu hỏi hoặc số vòng..." style="width:100%;padding:9px 14px;border-radius:6px;border:1px solid var(--line);font-family:inherit;font-size:14px;margin-bottom:14px;box-sizing:border-box;background:var(--card);color:var(--ink);">
    <div id="drill-resume-banner" style="display:none"></div>
    <div class="section-label">文法 第1回〜第30回</div>
    <div class="grid" id="allRoundsGrid"></div>
    <div class="grid" id="roundGrid"></div>

    <div class="section-label">集中トレーニング</div>
    <div class="grid" id="trainGrid"></div>
  </section>

  <section id="quiz">
    <div class="quiz-head">
      <h2 id="quizTitle"></h2>
      <div class="meta" id="quizMeta"></div>
    </div>
    <div id="scoreArea"></div>
    <div id="quizBody"></div>
    <div class="actions">
      <button class="btn ghost" onclick="goHome()">一覧へ戻る</button>
      <button class="btn ghost" id="retryBtn" onclick="retryQuiz()">もう一度やる</button>
    </div>
  </section>
</div>

<footer>日本語パワードリル N1 文法（アスク出版）をもとに作成 / 自習用クイズ</footer>

<script>
/* ===== DATA injected below ===== */
const QUIZ_DATA={"rounds":[{"id":"r1","name":"第1回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"どんなに片づけた（　）、すぐにまた子どもたちが散らかしてしまう。","o":["ところが","ところで","としたら","とはいえ"],"a":2,"vi":"Dù có dọn dẹp kỹ đến đâu, bọn trẻ cũng sẽ lại bày bừa ra ngay lập tức.","hint":"Thấy「どんなに＋Vた形＿＿」→ chọn ところで\n✔ どんなに〜たところで〜ない =「dù có...mấy cũng chẳng ích gì」(cố định)"},{"q":"私が集合時間に遅れた（　）、みんなが新幹線に乗り遅れてしまった。","o":["ばかり","ばかりで","ばかりに","ばかりの"],"a":3,"vi":"Chỉ vì tôi đến muộn giờ tập trung mà mọi người đã lỡ chuyến tàu Shinkansen.","hint":"Câu có kết quả xấu ở sau →「ばかりに」\n✔ 〜ばかりに =「chỉ vì...mà」(nguyên nhân dẫn đến hậu quả xấu)\n✘ ばかりで/ばかりの không diễn tả nguyên nhân"},{"q":"その大臣は政治家に（　）発言をしたため、辞任することになった。","o":["ありながら","あるまいし","あるまじき","ありやしない"],"a":3,"vi":"Vị bộ trưởng đó đã phải từ chức vì có phát ngôn không xứng đáng với một chính trị gia.","hint":"Thấy「職業/地位＋に＿＿発言」→ chọn あるまじき\n✔ Nにあるまじき＋N =「không xứng với tư cách là...」(cố định)"},{"q":"彼女は人気のアイドルだが、歌は下手すぎて（　）。","o":["聞くほかはない","聞くにたえない","聞かずにはいられない","聞かずにはすまない"],"a":2,"vi":"Cô ấy là thần tượng nổi tiếng, nhưng hát thì dở đến mức không nghe nổi.","hint":"Thấy「下手すぎて＿＿」→ chọน にたえない\n✔ 〜にたえない =「không thể chịu đựng/không đáng để nghe」\n✘ 聞くほかはない = bất đắc dĩ phải nghe (nghĩa ngược lại)"},{"q":"新しい家に飾る絵を探しているが、なかなか（　）というものが見つからない。","o":["これか","これは","これさえ","これだけ"],"a":2,"vi":"Đang tìm bức tranh để treo trong nhà mới nhưng mãi không tìm được bức nào ưng ý (kiểu \"chính là cái này\").","hint":"Thấy「なかなか＿＿というものが見つからない」→ chọn これは\n✔ これはというもの =「thứ thực sự xứng đáng/ưng ý」(cụm cố định)"},{"q":"もう二度とたばこは吸う（　）誓った。","o":["まいと","ことなしに","までもなく","べからずと"],"a":1,"vi":"Tôi đã thề sẽ không bao giờ hút thuốc nữa.","hint":"Thấy「もう二度と〜＿＿誓った」→ chọn まいと\n✔ 〜まいと誓う =「thề sẽ không...」(ý chí phủ định + cam kết)"},{"q":"全品半額セール（　）、スーパーの前には早朝から行列ができていた。","o":["とあって","とすると","といっても","となっては"],"a":1,"vi":"Vì có chương trình giảm giá 50% toàn bộ sản phẩm nên trước cửa siêu thị đã xếp hàng dài từ sáng sớm.","hint":"Thấy「セール/特別な状況＿＿行列」→ chọn とあって\n✔ 〜とあって =「vì là (tình huống đặc biệt) nên...」\n✘ とすると là giả định, khác hoàn toàn"},{"q":"今期の売り上げ（　）、閉店せざるを得ないだろう。","o":["としては","ならでは","をよそには","いかんでは"],"a":4,"vi":"Tùy theo doanh thu kỳ này mà có thể sẽ phải đóng cửa tiệm.","hint":"Thấy「売り上げ＿＿閉店」→ chọn いかんでは\n✔ Nのいかんでは =「tùy theo...mà có thể」(kết quả phụ thuộc vào N)"},{"q":"この東京での公演（　）、全国各地で演奏会を開くことになった。","o":["において","をもって","にもまして","を皮切りに"],"a":4,"vi":"Lấy buổi biểu diễn ở Tokyo lần này làm khởi đầu, họ sẽ tổ chức các buổi hòa nhạc khắp cả nước.","hint":"Thấy「東京→全国に広がる」→ chọn を皮切りに\n✔ N＋を皮切りに =「lấy...làm khởi đầu (rồi mở rộng)」(cố định)"},{"q":"子どもが生まれる（　）今の家じゃ狭いから、引っ越しも考えなくては。","o":["だけでは","となると","にしたら","くらいなら"],"a":2,"vi":"Một khi có con thì căn nhà hiện tại sẽ chật, nên cũng phải tính đến chuyện chuyển nhà.","hint":"Thấy「子どもが生まれる＿＿狭い」→ chọn となると\n✔ 〜となると =「một khi đến giai đoạn...thì」(điều kiện kéo theo vấn đề)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"水着を着るたびに、___ ___ ★ ___ なかなか体重が減らない。","o":["思いながらも","までには","やせようと","次の夏"],"a":3,"order":[4,2,3,1],"vi_p2":"Mỗi khi mặc đồ bơi, tuy nghĩ 'đến hè năm sau phải gầy' nhưng cân cứ mãi không giảm.","hint":"Thấy「までには＿＿思いながらも」→ chọn やせようと\n✔ 〜(よ)うと思いながらも =「tuy có ý định làm...nhưng (thực tế) lại...」","note":"1. Ghép cặp cố định: 「やせようと」+「思いながらも」= 'tuy nghĩ sẽ giảm cân nhưng...' (V thể ý chí(よう)+と+思いながらも).\n2. Đầu câu (vị trí 1): 「次の夏」— danh từ chỉ thời gian, mở đầu mệnh đề phụ ngay sau dấu phẩy.\n3. Vị trí 2: 「までには」ghép ngay sau 次の夏 → 'trước khi đến hè năm sau' (N+までには).\n4. ★ (vị trí 3) = やせようと — phải đứng ngay trước 思いながらも để tạo cụm ý chí + nhượng bộ, rồi mới nối vào mệnh đề chính なかなか体重が減らない.\n📘 Ngữ pháp: 〜(よ)うと思いながらも = 'tuy có ý định làm...nhưng thực tế lại...'. Cấu trúc: V thể ý chí(よう) + と + 思いながらも. Diễn tả sự mâu thuẫn giữa ý định và thực tế."},{"q":"温暖化の問題は ___ ___ ★ ___ 考えなければ解決しない。","o":["ただ","のみならず","地球規模で","一国"],"a":2,"order":[1,4,2,3],"vi_p2":"Vấn đề nóng lên toàn cầu không thể giải quyết nếu chỉ một nước đơn lẻ nghĩ đến mà phải suy nghĩ ở quy mô toàn cầu.","hint":"Thấy「ただ一国＿＿地球規模で」→ chọn のみならず\n✔ ただNのみならず =「không chỉ N mà còn...」","note":"1. Ghép cặp cố định: 「一国」+「のみならず」= 'không chỉ một nước' (Nのみならず).\n2. Đầu câu (vị trí 1): 「ただ」— phó từ nhấn mạnh, luôn đứng trước danh từ bị giới hạn (ただN).\n3. Vị trí 2: 「一国」ghép sau ただ → 'chỉ một nước'.\n4. ★ (vị trí 2, sau 一国) = のみならず — vì phải đóng lại cụm ただ一国のみならず trước khi chuyển sang vế đối lập 地球規模で(考えなければ).\n📘 Ngữ pháp: N1のみならずN2も〜 = 'không chỉ N1 mà cả N2 cũng...'. Thường đi cùng ただ để nhấn mạnh phạm vi bị mở rộng. Ở đây: không chỉ một nước mà phải nghĩ ở quy mô toàn cầu."},{"q":"明日 ___ ___ ★ ___ 中止になることはないそうだ。","o":["雨が","降るまいが","試合が","降ろうが"],"a":2,"order":[1,4,2,3],"vi_p2":"Nghe nói ngày mai dù trời có mưa hay không thì trận đấu cũng sẽ không bị hủy.","hint":"Thấy「雨が降ろうが＿＿試合が」→ chọn 降るまいが\n✔ Vようが／Vまいが =「dù có...hay không...」","note":"1. Ghép cặp cố định: 「降ろうが」+「降るまいが」= 'dù mưa hay không mưa' (Vようが〜Vまいが: nhượng bộ song song, giống ~ても~なくても nhưng trang trọng hơn).\n2. Đầu câu (vị trí 1): 「雨が」— chủ ngữ chung cho cả cặp động từ 降ろうが/降るまいが.\n3. Cuối câu (vị trí 4): 「試合が」— chủ ngữ mới cho vế chính phía sau (中止になることはない).\n4. ★ (vị trí 2) = 降るまいが — đứng ngay sau 降ろうが để hoàn thành cặp nhượng bộ, trước khi chuyển chủ ngữ mới 試合が.\n📘 Ngữ pháp: Vようが(volitional)+Vまいが = 'dù có...hay không có... (thì cũng)'. まい là trợ động từ phủ định ý chí (~ない thể văn viết). Diễn tả: dù điều kiện thế nào, kết quả vẫn không đổi."},{"q":"車の運転ができれば ___ ___ ★ ___ 都会なら不自由はない。","o":["ないけれど","それに","できなくても","越したことは"],"a":1,"order":[2,4,1,3],"vi_p2":"Biết lái xe thì tốt nhất, nhưng dù không biết lái ở thành phố cũng không bất tiện gì.","hint":"Thấy「越したことは＿＿できなくても」→ chọn ないけれど\n✔ 〜に越したことはない =「không gì tốt hơn/tốt nhất là...」","note":"1. Ghép cặp cố định: 「それに」+「越したことは」= 'hơn nữa thì không gì bằng' (それに + Vに越したことは...).\n2. Đầu câu (vị trí 1): 「それに」— nối tiếp mệnh đề trước (車の運転ができれば) để dẫn vào cụm đánh giá.\n3. Cuối câu (vị trí 4): 「できなくても」— mở đầu mệnh đề sau dấu phẩy, đối lập với vế trước bằng ても.\n4. ★ (vị trí 3) = ないけれど — hoàn thành cụm cố định 越したことはない (phủ định của に越したことはある), rồi nối sang mệnh đề sau bằng けれど (nhưng).\n📘 Ngữ pháp: 〜に越したことはない = 'không gì tốt hơn là...', diễn tả điều lý tưởng nhất tuy không bắt buộc. けれど nối nhượng bộ nhẹ nhàng, giống が nhưng thân mật hơn."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"苦情を言うことは、本来何も悪いことではありません。むしろ、毅然とした態度でちゃんと苦情を言うのは、客として必要な能力なのだと思っています。\n苦情を言う目的とは、何でしょうか。次回買い物するときに、不利益や不都合がなく、気持ちよく買い物したいという希望を店に伝えることだと、私は考えています。自分がふだん買い物する店をよくしたいと【1】、苦情を言うのです。\n苦情を言うのは、店にとって不愉快なことを伝えるわけですから、ちょっと気がひけます。できたら、【2】ものでもあります。にもかかわらず、わざわざ苦情を言うのは、自分が次に来たときには気持ちよく買い物したいからです。\nこのとき、「自分は店をよくしてやっているんだ」という恩着せがましい考えを持つのはよくありません。この考えを持つ【3】、いずれ暴言を吐く「お客様」になっていくでしょうから。\n（森真一著『「お客様」がやかましい』筑摩書房刊）","items":[{"label":"1","o":["思うことからして","思うからといって","思っているからこそ","思っているからには"],"a":3,"hint":"Dạng câu hỏi: Nguyên nhân — kết quả (からこそ)\n\nQuan hệ A-B: A (muốn cửa hàng tốt lên) là NGUYÊN NHÂN trực tiếp, nhấn mạnh, dẫn đến B (phàn nàn).\n\nVế trước 「自分がふだん買い物する店をよくしたいと」là NGUYÊN NHÂN, vế sau「苦情を言うのです」là KẾT QUẢ → chọn ③ 思っているからこそ\n→ からこそ = 'chính vì...mà' (nhấn mạnh nguyên nhân dẫn thẳng đến kết quả)\n\nchỗ này là bẫy\n\n✗ からといって = 'dù nghĩ vậy nhưng chưa chắc' → cần vế sau phủ định, ở đây vế sau lại khẳng định\n\n✗ からには = 'đã như thế thì phải' (nghĩa vụ) → sai sắc thái\n\n✗ からして = nêu ví dụ điển hình → không tạo quan hệ nhân quả","sentence":"自分がふだん買い物する店をよくしたいと【1】、苦情を言うのです。"},{"label":"2","o":["していきたい","しておきたい","せずにはすまない","せずにすませたい"],"a":4,"hint":"Dạng câu hỏi: Liên kết câu (dùng câu sau để xác định)\n\nQuan hệ A-B: Câu sau có にもかかわらず (dù vậy) → chỗ trống phải là điều A muốn tránh, để tạo tương phản hợp lý với B.\n\nCâu SAU có 「にもかかわらず」(dù vậy) → chỗ trống phải mang nghĩa 'muốn tránh' để tạo tương phản hợp lý → chọn ④ せずにすませたい\n→ せずにすませたい = 'muốn không phải làm mà vẫn ổn' (khớp cảm xúc ngại nói ở đầu câu + tạo tương phản với にもかかわらず)\n\nchỗ này là bẫy\n\n✗ せずにはすまない = 'nhất định phải làm' → ngược nghĩa hoàn toàn, làm にもかかわらず vô nghĩa\n\n✗ していきたい/しておきたい → không hợp mạch 'ngại nói'\n\n📌 Áp dụng quy tắc liên kết câu: dùng câu SAU để xác định chỗ trống, không chỉ đọc câu chứa nó.","sentence":"できたら、【2】ものでもあります。"},{"label":"3","o":["手前","かぎり","ばかりに","ものなら"],"a":2,"hint":"Dạng câu hỏi: Điều kiện tiếp diễn (かぎり)\n\nQuan hệ A-B: A (còn giữ suy nghĩ ban ơn) là điều kiện tiếp diễn, B (trở thành khách hay quát tháo) là hệ quả chừng nào A còn đúng.\n\n「持つ【3】、いずれ〜になっていくでしょうから」→ cần từ diễn tả điều kiện TIẾP DIỄN → chọn ② かぎり\n→ かぎり = 'chừng nào còn...' (điều kiện tiếp diễn, khớp với いずれ〜だろう ở vế sau)\n\nchỗ này là bẫy\n\n✗ ばかりに = nguyên nhân cụ thể ĐÃ xảy ra 1 lần → không hợp câu đang suy đoán tương lai\n\n✗ ものなら = sai cấu trúc (cần Vれるものなら)\n\n✗ 手前 = vì thể diện/đã trót nói → không hợp","sentence":"この考えを持つ【3】、いずれ暴言を吐く「お客様」になっていくでしょうから。"}]}]},{"id":"r2","name":"第2回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"病気が初期に見つかったからいい（　）、もう少し発見が遅かったら命が危なかった。","o":["とばかりに","かと思いきや","というものの","ようなものの"],"a":4,"vi":"Tuy nói là may vì phát hiện bệnh sớm, nhưng nếu phát hiện muộn hơn một chút thì đã nguy hiểm đến tính mạng.","hint":"Thấy「からいい＿＿、もし〜たら危なかった」→ chọn ようなものの\n✔ 〜ようなものの =「may mà...nhưng nếu không thì」"},{"q":"夢を実現させるものは、努力（　）ほかにない。","o":["いかんで","を抜きに","をおいて","ならでは"],"a":3,"vi":"Thứ duy nhất giúp biến ước mơ thành hiện thực chính là nỗ lực, không có gì khác.","hint":"Thấy「努力＿＿ほかにない」→ chọn をおいて\n✔ N＋をおいてほかにない =「ngoài...ra không có gì khác」(cố định)"},{"q":"結果を聞く（　）息子の表情から、不合格だったことがわかった。","o":["どころか","はおろか","わけもなく","までもなく"],"a":4,"vi":"Chỉ cần nhìn vẻ mặt của con trai là biết ngay nó trượt, không cần phải hỏi kết quả.","hint":"Thấy「聞く＿＿表情からわかった」→ chọn までもなく\n✔ 〜までもなく =「không cần phải đến mức...」(kết quả rõ ràng không cần xác nhận)"},{"q":"うちの父（　）週末はゴルフばかりで、家族とのコミュニケーションがまったくない。","o":["ときたら","としたら","としても","といっても"],"a":1,"vi":"Nói đến bố tôi thì cuối tuần lúc nào cũng chỉ chơi golf, hoàn toàn không giao tiếp với gia đình.","hint":"Thấy「うちの父＿＿ゴルフばかり」→ chọn ときたら\n✔ N＋ときたら =「nói đến...thì」(dẫn dắt chủ đề để phê phán/than phiền)"},{"q":"部屋の中にどこから（　）涼しい風が入ってきた。","o":["とはいえ","ともなく","はいざ知らず","はさておき"],"a":2,"vi":"Có một làn gió mát thổi vào phòng từ đâu đó không rõ.","hint":"Thấy「どこから＿＿風」→ chọn ともなく\n✔ 〜ともなく =「không rõ từ đâu/không chủ ý」(hành động/sự vật xuất hiện mơ hồ)"},{"q":"毎年お正月をハワイで過ごす友人がうらやましい（　）だ。","o":["限り","至り","だらけ","ばかり"],"a":1,"vi":"Thật ghen tị với người bạn năm nào cũng đón Tết ở Hawaii.","hint":"Thấy「うらやましい＿＿だ」→ chọn 限り\n✔ 〜限りだ =「...đến vô cùng」(cảm xúc ở mức cao nhất)\n✘ だらけ = đầy ắp (vật chất), không dùng cho cảm xúc"},{"q":"引っ越しの（　）いろいろと手伝っていただき、ありがとうございました。","o":["折から","折には","機に","機会に"],"a":2,"vi":"Cảm ơn anh/chị đã giúp đỡ nhiều việc nhân dịp chuyển nhà.","hint":"Thấy「引っ越しの＿＿手伝っていただき」→ chọn 折には\n✔ 〜折には =「vào dịp/lúc...」(trang trọng)\n✘ 折から = đúng vào lúc đó (nhấn mạnh thời điểm ngẫu nhiên)"},{"q":"電気はつけっぱなし、服は出しっぱなしで、本当にだらしない（　）。","o":["までもない","に越したことない","ってわけがない","ったらありゃしない"],"a":4,"vi":"Điện thì cứ để bật, quần áo thì vứt bừa bãi, đúng là luộm thuộm hết chỗ nói.","hint":"Thấy「電気つけっぱなし、だらしない＿＿」→ chọn ったらありゃしない\n✔ 〜ったらありゃしない =「...thì không thể tả nổi」(phàn nàn cực mạnh, khẩu ngữ)"},{"q":"この店のパンは大人気で、棚に並ぶが（　）売り切れてしまう。","o":["最後","いなや","早いか","そばから"],"a":3,"vi":"Bánh mì của tiệm này rất hút khách, cứ bày lên kệ là bán hết ngay lập tức.","hint":"Thấy「棚に並ぶが＿＿売り切れ」→ chọn そばから\n✔ 〜そばから =「vừa mới...thì lại (ngay lập tức)」(hành động lặp nối tiếp)"},{"q":"彼はとても優秀な社員だが、どうも協調性に欠ける（　）。","o":["始末だ","にとどまらない","ぐらいのものだ","きらいがある"],"a":4,"vi":"Anh ấy là nhân viên rất giỏi, nhưng có khuynh hướng thiếu tinh thần hợp tác.","hint":"Thấy「どうも〜に欠ける＿＿」→ chọn きらいがある\n✔ 〜きらいがある =「có xu hướng (tiêu cực) là...」\n✘ 始末だ = kết quả tệ, thường có quá trình dẫn đến trước"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"チームの調子は ___ ___ ★ ___ 優勝するのは難しいだろう。","o":["つつある","徐々に","とはいえ","よくなり"],"a":1,"order":[2,4,1,3],"vi_p2":"Dù phong độ của đội đang dần dần cải thiện nhưng vô địch vẫn khó.","hint":"Thấy「よくなり＿＿とはいえ」→ chọn つつある\n✔ Vます形+つつある =「đang dần...」","note":"1. Ghép cặp cố định: 「よくなり」+「つつある」= 'đang dần tốt lên' (Vます形+つつある: diễn tả quá trình đang tiếp diễn).\n2. Đầu câu (vị trí 1): 「徐々に」— phó từ chỉ mức độ 'dần dần', bổ nghĩa cho よくなり phía sau.\n3. Vị trí 2: 「よくなり」ghép ngay sau 徐々に.\n4. ★ (vị trí 3) = つつある — đứng sau よくなり để hoàn thành cụm 'đang dần tốt lên', rồi nối bằng とはいえ (vị trí 4) sang vế nhượng bộ phía sau.\n📘 Ngữ pháp: Vます形+つつある = 'đang dần dần...' (nhấn mạnh quá trình biến đổi, trang trọng hơn ~ている). 〜とはいえ = 'tuy nói là...nhưng...', nối 2 mệnh đề đối lập."},{"q":"人気のレストランですから、二人 ___ ___ ★ ___ 予約できませんよ。","o":["なんて","ともかく","なら","十人"],"a":4,"order":[3,2,4,1],"vi_p2":"Vì là nhà hàng nổi tiếng, đừng nói 10 người, ngay 2 người cũng không đặt được đâu.","hint":"Thấy「二人なら＿＿＿＿予約できません」→ chọn 十人\n✔ AならともかくBなんて =「A thì còn được chứ B thì...」","note":"1. Ghép cặp cố định: 「なら」+「ともかく」= 'nếu là...thì còn tạm được, chứ...' (Nならともかく).\n2. Trước chỗ trống (cho sẵn): 「二人」— vế A được chấp nhận tạm.\n3. Vị trí 1-2: 「なら」rồi 「ともかく」ghép ngay sau 二人 → 二人ならともかく.\n4. Vị trí 3-4: 「十人」rồi 「なんて」— vế B (số lượng lớn hơn, bị phủ định mạnh).\n5. ★ (vị trí 3) = 十人 — danh từ mới làm chủ đề tương phản với 二人, đứng trước なんて.\n📘 Ngữ pháp: AならともかくB(なんて) = 'A thì còn được/còn tạm chấp nhận, chứ B thì...'. なんて sau B nhấn mạnh sắc thái coi thường/phủ định mạnh, thường đi với vế phủ định phía sau (ở đây là 予約できません)."},{"q":"毎日の家事が ___ ___ ★ ___ はじめてわかった。","o":["いかに","して","一人暮らしを","大変か"],"a":3,"order":[1,4,3,2],"vi_p2":"Sống một mình rồi mới hiểu ra rằng việc nhà hàng ngày vất vả đến thế nào.","hint":"Thấy「いかに大変か＿＿して」→ chọn 一人暮らしを\n✔ いかに〜か =「...biết bao／như thế nào」","note":"1. Ghép cặp cố định: 「いかに」+「大変か」= 'vất vả biết bao/đến mức nào' (いかに...か: nhấn mạnh nghi vấn gián tiếp về mức độ).\n2. Đầu câu (vị trí 1): 「いかに」mở đầu mệnh đề danh từ hóa 'việc nhà vất vả đến đâu'.\n3. Cuối câu (đã cho sẵn sau chỗ trống): 「して」ghép với はじめて (cho sẵn) → してはじめて.\n4. ★ (vị trí 3) = 一人暮らしを — làm tân ngữ của して (một人暮らしをする = sống một mình), đứng ngay trước して.\n📘 Ngữ pháp: いかに〜か = '...biết bao/như thế nào' (thể văn viết trang trọng của どんなに〜か). 〜てはじめて = 'chỉ sau khi...mới...', nhấn mạnh việc chỉ nhận ra/hiểu ra sau khi trải nghiệm."},{"q":"毎年とは ___ ___ ★ ___ 海外旅行をしたい。","o":["までも","一度は","何年かに","言わない"],"a":3,"order":[4,1,3,2],"vi_p2":"Không cần mỗi năm, nhưng vài năm một lần tôi muốn đi du lịch nước ngoài.","hint":"Thấy「言わないまでも＿＿一度は」→ chọn 何年かに\n✔ 〜とは言わないまでも =「không đến mức nói là...nhưng ít nhất」","note":"1. Ghép cặp cố định (đã cho sẵn trước chỗ trống): 「毎年とは」+「言わない」+「までも」= 'không đến mức nói là mỗi năm nhưng...' (Nとは言わないまでも).\n2. Cuối câu (vị trí 4): 「一度は」— hô ứng với までも để nêu mức tối thiểu chấp nhận được.\n3. ★ (vị trí 3) = 何年かに — đứng ngay trước 一度は để tạo cụm 何年かに一度は 'vài năm một lần', là mức tối thiểu được đề xuất thay cho 毎年.\n📘 Ngữ pháp: 〜とは言わないまでも = 'không đến mức nói là...nhưng ít nhất/chí ít cũng...' (nhượng bộ ở mức tối thiểu, hạ thấp yêu cầu ban đầu). 何年かに一度 = 'một lần trong vài năm' (数量詞+か+に+回数)."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"メールが【1-a】普及した【1-b】、手紙や電話がなくなるわけではないだろう。コミュニケーションの密度でいえば直接会って話をするのが一番だ。顔色でからだの調子が悪いのかなと思ったり、電話なら相手の声の調子からも情報を得ることができる。手紙やファックスの場合でも、筆跡から伝わるものがある。\nメールというのは極端に効率化されたメディアである【2】、伝わるのはそこに書かれた用件だけだ。だから用件を伝えるのが主要目的であるときに圧倒的に威力を発揮する。逆に用件そのものではなく、自分の感情や思いを伝えたいような場合は、それ以外のツールを用いたほうがいいかも知れない。ラブレターや海外からの絵葉書をメールで代用するのはおそらく無理【3】。\n（村上龍著『eメールの達人になる』集英社刊）","items":[{"label":"1","o":["a どれだけ／b からこそ","a どれだけ／b からといって","a いかにも／b からこそ","a いかにも／b からといって"],"a":2,"hint":"Dạng câu hỏi: Nhượng bộ + hô ứng phó từ-vị ngữ\n\nQuan hệ A-B: A (mức độ phổ biến của email) dù cao đến mấy cũng không phủ nhận B (thư/điện thoại không biến mất) — vị ngữ わけではない ở B quyết định liên từ ở A phải là からといって.\n\na: cần phó từ nhượng bộ đi cùng らても/だからといって → どれだけ (dù...đến mấy)\nb: vế cuối câu có 「わけではないだろう」(không hẳn) → cần からといって (dù...nhưng chưa chắc) để hô ứng, không phải からこそ (chính vì → tạo khẳng định, mâu thuẫn với わけではない)\n\nchỗ này là bẫy\n\n✗ いかにも = 'rõ ràng là' → không tạo được nhượng bộ\n\n📌 Mẫu hô ứng: phó từ nhượng bộ đầu câu quyết định vị ngữ phủ định cuối câu.","sentence":"メールが【1-a】普及した【1-b】、手紙や電話がなくなるわけではないだろう。"},{"label":"2","o":["だけで","だけに","だけは","だけでも"],"a":2,"hint":"Dạng câu hỏi: Nguyên nhân — kết quả (だけに)\n\nQuan hệ A-B: A (email là phương tiện tối ưu hóa cực đoan) là nguyên nhân, B (chỉ truyền tải đúng nội dung công việc) là kết quả tất yếu.\n\n「メール...効率化されたメディアである【2】、伝わるのは...だけだ」→ quan hệ NGUYÊN NHÂN-KẾT QUẢ → chọn ② だけに\n→ Nだけに = 'chính vì là...(nên tất yếu)' \n\nchỗ này là bẫy\n\n✗ だけで/だけは/だけでも → sai nghĩa, không tạo được quan hệ nhân quả","sentence":"メールというのは極端に効率化されたメディアである【2】、伝わるのはそこに書かれた用件だけだ。"},{"label":"3","o":["なのか","だろうか","もないだろうか","ではないだろうか"],"a":4,"hint":"Dạng câu hỏi: Hô ứng phó từ-vị ngữ (おそらく→だろう)\n\nQuan hệ A-B: Phó từ おそらく ở đầu bắt buộc vị ngữ cuối câu phải chứa だろう — không phải quan hệ A-B mà là cặp hô ứng cố định.\n\n「おそらく...無理【3】」→ おそらく BẮT BUỘC đi với だろう ([[9 mẫu hô ứng phó từ - vị ngữ cố định N1]] mẫu #4) → loại ngay ①なのか ③もないだろうか (không có だろう)\n→ ④ ではないだろうか = cách nói giảm/tu từ chuẩn văn viết học thuật, khớp おそらく\n\nchỗ này là bẫy\n\n✗ だろうか (②) → có だろう nhưng thiếu sắc thái phủ định-tu từ đặc trưng của văn nghị luận N1\n\n📌 Chỉ cần quét おそらく → だろう là loại được 2/4 đáp án trong vài giây, không cần đọc hiểu cả câu.","sentence":"ラブレターや海外からの絵葉書をメールで代用するのはおそらく無理【3】。"}]}]},{"id":"r3","name":"第3回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"この国の経済が回復するのは、いったいいつになる（　）。","o":["ものだ","こととは","ことやら","ものなら"],"a":3,"vi":"Kinh tế nước này không biết đến bao giờ mới phục hồi được.","hint":"Thấy「いったい〜＿＿」→ chọn ことやら\n✔ いったい〜ことやら =「không biết...thế nào」(băn khoăn, lo lắng)\n✘ ものだ = lẽ tất nhiên, khác nghĩa"},{"q":"こんな確かな証拠を見せられたら、彼も自分の罪を（　）だろう。","o":["認めざるを得ない","認めずにおかない","認めるには及ばない","認めるわけにはいかない"],"a":1,"vi":"Khi bị đưa ra bằng chứng xác thực thế này, chắc anh ta cũng phải thừa nhận tội của mình thôi.","hint":"Thấy「確かな証拠を見せられたら＿＿」→ chọn ざるを得ない\n✔ 〜ざるを得ない =「buộc phải...」(tình huống không cho phép từ chối)\n✘ わけにはいかない = về mặt đạo lý không thể làm"},{"q":"結婚も決まったし、宝くじにも当たったし、今年はいいこと（　）だ。","o":["並み","ずくめ","まみれ","っぱなし"],"a":2,"vi":"Vừa quyết định kết hôn, lại còn trúng số, năm nay toàn chuyện tốt lành.","hint":"Thấy「いいこと（全部）＿＿だ」→ chọn ずくめ\n✔ N＋ずくめ =「toàn là...」(tất cả đều thuộc loại đó)\n✘ まみれ = đầy bẩn/máu (vật cụ thể tiêu cực)"},{"q":"会社が悪い（　）部下が悪い（　）、彼はいつも文句ばかり言っている。","o":["だの／だの","なり／なり","にも／にも","といい／といい"],"a":1,"vi":"Anh ta lúc nào cũng than phiền, nào là công ty không tốt, nào là cấp dưới không ra gì.","hint":"Thấy「〜＿＿〜＿＿、いつも文句ばかり」→ chọn だの\n✔ 〜だの〜だの =「nào là...nào là...」(liệt kê than phiền)\n✘ なり〜なり = đề xuất lựa chọn (nghĩa tích cực)"},{"q":"隣の家の犬が朝から晩までほえるから、うるさくて（　）。","o":["すまない","やまない","かなわない","かまわない"],"a":3,"vi":"Con chó nhà hàng xóm sủa suốt từ sáng đến tối, ồn đến mức không chịu nổi.","hint":"Thấy「うるさくて＿＿」→ chọn かなわない\n✔ 〜てかなわない =「...quá, chịu không nổi」(cảm giác mệt mỏi/khó chịu)\n✘ やまない = không ngừng (cảm xúc tích cực hoặc liên tục)"},{"q":"けんかをして（　）、彼からは電話もメールもない。","o":["からには","からすると","からといって","からというもの"],"a":4,"vi":"Kể từ sau khi cãi nhau, anh ấy không gọi điện cũng chẳng nhắn tin gì cả.","hint":"Thấy「けんかをして＿＿電話もない」→ chọn からというもの\n✔ 〜てからというもの =「kể từ khi...thì (luôn luôn như vậy)」\n✘ からには = đã...thì (đương nhiên phải làm gì đó)"},{"q":"彼女は私の紹介したカフェが気に入った（　）、毎日のように行っているそうだ。","o":["がごとく","が早いか","とみえて","と思いきや"],"a":3,"vi":"Có vẻ cô ấy rất thích quán cà phê tôi giới thiệu nên ngày nào cũng ghé.","hint":"Thấy「毎日のように行っている＿＿」→ chọn とみえて\n✔ 〜とみえて =「có vẻ như là...」(suy luận từ hành động quan sát được)"},{"q":"息子は学校から帰る（　）、ランドセルを置いてゲームを始めた。","o":["なら","なり","ながら","なりに"],"a":2,"vi":"Con trai vừa về đến nhà là đặt cặp xuống rồi chơi game ngay.","hint":"Thấy「帰る＿＿ランドセルを置いてゲームを始めた」→ chọn なり\n✔ V辞書形＋なり =「vừa mới...là ngay lập tức」(hành động nối tiếp tức thì)"},{"q":"私に（　）、A党もB党も、政権を任せるには頼りない。","o":["至っては","ひきかえ","言わせれば","とどまらず"],"a":3,"vi":"Nếu để tôi nói thì cả đảng A lẫn đảng B đều không đáng tin để giao chính quyền.","hint":"Thấy「私に＿＿、A党もB党も頼りない」→ chọn 言わせれば\n✔ N＋に言わせれば =「nếu để...nói thì」(đưa ra ý kiến cá nhân)"},{"q":"市場調査の結果（　）、新しい店を出す場所を決めた。","o":["いかんで","なしには","に即して","を踏まえて"],"a":4,"vi":"Dựa trên kết quả khảo sát thị trường, họ đã quyết định địa điểm mở cửa hàng mới.","hint":"Thấy「調査結果＿＿、場所を決めた」→ chọn を踏まえて\n✔ N＋を踏まえて =「dựa trên cơ sở...」(lấy làm căn cứ hành động)\n✘ に即して = bám sát theo (quy tắc/tiêu chuẩn cụ thể)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"急いでいるとき ___ ___ ★ ___ するものだ。","o":["電車が遅れて","に","いたり","限って"],"a":1,"order":[2,4,1,3],"vi_p2":"Cứ đúng lúc đang vội là lại gặp chuyện tàu trễ hay gì đó — đời là vậy.","hint":"Thấy「ときに限って＿＿いたり」→ chọn 電車が遅れて\n✔ 〜に限って =「cứ đúng lúc/trường hợp...thì lại」","note":"1. Ghép cặp cố định (cho sẵn trước chỗ trống): 「急いでいるとき」+「に」+「限って」= 'ときに限って' (Nに限って: cụm cố định).\n2. Cuối câu (đã cho sẵn sau chỗ trống): 「いたり」+ するものだ → 〜たりするものだ.\n3. ★ (vị trí 3) = 電車が遅れて — mệnh đề làm ví dụ điển hình, ghép trước いたり để tạo 電車が遅れていたりする 'kiểu như tàu bị trễ'.\n📘 Ngữ pháp: 〜に限って = 'cứ đúng vào lúc/trường hợp...thì lại...' (mang sắc thái trớ trêu, không may). Vて形+いたりする = liệt kê một ví dụ điển hình trong số nhiều khả năng. 〜ものだ ở cuối diễn tả điều hiển nhiên/thường lệ trong đời."},{"q":"父は昔スポーツ選手だった ___ ___ ★ ___ あるといつも言っている。","o":["自信が","あって","体力には","だけ"],"a":3,"order":[4,2,3,1],"vi_p2":"Bố vốn là vận động viên ngày trước nên ông ấy luôn tự tin về thể lực của mình.","hint":"Thấy「だけあって＿＿自信が」→ chọn 体力には\n✔ 〜だけあって =「đúng là/không hổ danh là...」","note":"1. Ghép cặp cố định (cho sẵn trước chỗ trống): 「スポーツ選手だった」+「だけ」+「あって」= 'だけあって' (cụm cố định, giải thích lý do hợp lý).\n2. Cuối câu (vị trí 1, đã ghép với ある cho sẵn sau chỗ trống): 「自信が」+ ある = 自信がある 'có tự tin'.\n3. ★ (vị trí 3) = 体力には — bổ ngữ chỉ phạm vi 'về mặt thể lực', đứng đầu phần còn lại của mệnh đề, ngay sau だけあって.\n📘 Ngữ pháp: 〜だけあって = 'đúng là/không hổ danh là...' (nêu lý do hợp lý, chính đáng cho một kết quả đáng khen ở vế sau). Nには自信がある = 'tự tin về mặt N'."},{"q":"北海道は ___ ___ ★ ___ 暖かかった。","o":["と思いきや","寒いか","東京より","どんなに"],"a":1,"order":[4,2,1,3],"vi_p2":"Cứ tưởng Hokkaido lạnh lắm, ai ngờ còn ấm hơn Tokyo.","hint":"Thấy「どんなに寒いか＿＿東京より」→ chọn と思いきや\n✔ 〜と思いきや =「cứ tưởng là...ai ngờ/nào ngờ lại...」","note":"1. Ghép cặp cố định: 「どんなに」+「寒いか」= 'lạnh đến thế nào' (どんなに...か: nhấn mạnh mức độ trong mệnh đề danh từ hóa).\n2. Vị trí 3 (★): 「と思いきや」ghép ngay sau 寒いか → どんなに寒いかと思いきや 'cứ tưởng là lạnh lắm...'.\n3. Cuối câu (vị trí 4): 「東京より」— chuẩn so sánh cho tính từ 暖かかった ở cuối câu (kết quả trái ngược với dự đoán).\n4. ★ (vị trí 3) = と思いきや.\n📘 Ngữ pháp: 〜と思いきや = 'cứ tưởng là...(nhưng) ai ngờ/nào ngờ lại...' (kỳ vọng ban đầu bị thực tế đảo ngược, thường mang sắc thái bất ngờ)."},{"q":"携帯電話の普及率は10年前 ___ ___ ★ ___ 上がった。","o":["ほど","とは","ならない","比べものに"],"a":3,"order":[2,4,3,1],"vi_p2":"Tỷ lệ phổ cập điện thoại di động đã tăng đến mức không thể so sánh với 10 năm trước.","hint":"Thấy「とは比べものに＿＿ほど」→ chọn ならない\n✔ 〜とは比べものにならない =「không thể so sánh với...」","note":"1. Ghép cặp cố định (cho sẵn trước chỗ trống): 「10年前」+「とは」+「比べものに」= '10年前とは比べものに' (Nとは比べものに).\n2. ★ (vị trí 3) = ならない — hoàn thành cụm cố định 比べものにならない 'không thể so sánh được'.\n3. Vị trí 4: 「ほど」ghép ngay sau ならない → ならないほど 'đến mức không thể so sánh', bổ nghĩa cho 上がった ở cuối câu.\n📘 Ngữ pháp: 〜とは比べものにならない = 'không thể so sánh với...' (chênh lệch rất lớn). 〜ほど (sau một mệnh đề phủ định/động từ) = 'đến mức...', diễn tả mức độ cực đại của hành động/trạng thái phía sau."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"音楽の好きな人は、外国語の上達も早いものです。また逆に、外国語の習得の早い人のなかには、音楽好きが多いもの。英語の勉強でも、文法の公式を覚え、単語をがむしゃらに暗記している【1-a】、なかなか英語の〈こころ〉【1-b】つかめません。ある程度英語が読めるようになったら、あるいはこれまでの英語の勉強に行きづまったなら、英語の歌にとっぷりひたってみてはどうでしょう。英語のもつ独特のリズムが理屈抜きに体にしみ込み、にわかに英語が身近なものになるはずです。身体が英語のリズムで動きはじめると、言葉は自然にあとからついて出てくるものです。\nどこの国の【2-a】にも、その国の【2-b】のいちばん美しいところが反映されています。そのうえ民謡や古謡、童謡には、その文化圏の人びとが何世紀にもわたって【3】夢や喜びや悲しみが込められているので、たとえ小さなわらべ歌一つからも、その国の長い歴史や風土の持つ雰囲気がじかに伝わってきます。\n（河野一郎著『英語の歌』岩波書店刊）","items":[{"label":"1","o":["a だけでは／b すら","a くらいなら／b すら","a だけでは／b までは","a くらいなら／b までは"],"a":3,"hint":"Dạng câu hỏi: Hô ứng phó từ-vị ngữ (だけでは~までは)\n\nQuan hệ A-B: A (chỉ học thuộc công thức/từ vựng) không đủ để đạt B (nắm được tận 'hồn cốt' của tiếng Anh) — だけでは và までは hô ứng nhau.\n\na: 「暗記している【1-a】、なかなか〜つかめません」→ cần だけでは (chỉ...thì không đủ), không phải くらいなら (thà...còn hơn, cần 2 lựa chọn để so sánh)\nb: つかめません (không nắm được) + までは (không đạt tới mức) → cặp hô ứng 'chỉ làm A thôi thì không đạt đến tận B'\n\nchỗ này là bẫy\n\n✗ すら (ngay cả...cũng) → không hợp, câu không có ý 'ngay cả điều tối thiểu'","sentence":"英語の勉強でも、文法の公式を覚え、単語をがむしゃらに暗記している【1-a】、なかなか英語の〈こころ〉【1-b】つかめません。"},{"label":"2","o":["a 言葉／b リズム","a 言葉／b 歌","a 歌／b リズム","a 歌／b 言葉"],"a":4,"hint":"Dạng câu hỏi: Liên kết câu trước (chủ đề đang bàn)\n\nQuan hệ A-B: Câu ngay trước đang nói về 歌 (bài hát) → A phải là 歌 (vật chứa), B là 言葉 (ngôn ngữ, cái được phản ánh cái đẹp).\n\n→ 'Trong bài hát (歌) của bất kỳ nước nào cũng phản ánh phần đẹp nhất của ngôn ngữ (言葉) nước đó'\n\nchỗ này là bẫy\n\n✗ Nếu không đọc câu trước sẽ dễ chọn nhầm đáp án có a=言葉 (①②)\n\n✗ b=リズム (③) sai vì vế sau cần thứ được phản ánh cái đẹp = ngôn ngữ, không phải nhịp điệu\n\n📌 Áp dụng liên kết câu TRƯỚC: câu ngay trước đang nói về 「英語の歌にとっぷりひたって」(đắm mình trong BÀI HÁT tiếng Anh) → chủ đề đang là 歌 (không phải 言葉) → 2-a=歌, 2-b=言葉","sentence":"どこの国の【2-a】にも、その国の【2-b】のいちばん美しいところが反映されています。"},{"label":"3","o":["抱いた","抱きぬいた","抱いてやまない","抱きつづけてきた"],"a":4,"hint":"Dạng câu hỏi: Hô ứng trạng ngữ — động từ\n\nQuan hệ A-B: A (何世紀にもわたって: trải qua hàng thế kỷ) là trạng ngữ chỉ thời gian kéo dài, bắt buộc động từ ở B phải ở dạng tiếp diễn liên tục (~つづけてきた).\n\n「何世紀にもわたって【3】夢や喜びや悲しみが込められている」→ cụm chỉ thời gian kéo dài 何世紀にもわたって cần động từ TIẾP DIỄN LIÊN TỤC → chọn ④ 抱きつづけてきた\n→ Vつづけてきた = tiếp diễn liên tục từ quá khứ đến nay, khớp hô ứng với 何世紀にもわたって\n\nchỗ này là bẫy\n\n✗ 抱いた = quá khứ đơn (1 lần) → không hợp 'trải qua nhiều thế kỷ'\n\n✗ 抱きぬいた = hoàn thành/chịu đựng đến cùng 1 việc → không phải tiếp diễn qua thời gian\n\n✗ 抱いてやまない = cảm xúc mãnh liệt HIỆN TẠI của người nói → sai với ngữ cảnh lịch sử khách quan","sentence":"そのうえ民謡や古謡、童謡には、その文化圏の人びとが何世紀にもわたって【3】夢や喜びや悲しみが込められているので、たとえ小さなわらべ歌一つからも、その国の長い歴史や風土の持つ雰囲気がじかに伝わってきます。"}]}]},{"id":"r4","name":"第4回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"会社が経営不振で、退職（　）。","o":["には及ばなかった","を禁じ得なかった","を余儀なくされた","するべくもなかった"],"a":3,"vi":"Vì công ty làm ăn khó khăn nên anh ấy buộc phải nghỉ việc.","hint":"Thấy「経営不振で退職＿＿」→ chọn を余儀なくされた\n✔ 〜を余儀なくされる =「bị buộc phải...」(ngoài ý muốn, do hoàn cảnh ép buộc)"},{"q":"仕事も趣味も、やはり健康（　）のことだと思う。","o":["あって","あれば","あったら","あると"],"a":1,"vi":"Tôi nghĩ dù là công việc hay sở thích thì cũng phải có sức khỏe mới làm được.","hint":"Thấy「仕事も趣味も、健康＿＿のことだ」→ chọn あって\n✔ 健康あってのこと =「nhờ có sức khỏe mới có thể...」(cố định)\n✘ あれば = nếu có (điều kiện đơn thuần)"},{"q":"父の機嫌がよかったので、妹は、今がチャンス（　）おこづかいをねだった。","o":["とみえて","とばかりに","と思いきや","において"],"a":2,"vi":"Vì bố đang vui nên em gái nhân cơ hội đó xin tiền tiêu vặt.","hint":"Thấy「今がチャンス＿＿おこづかいをねだった」→ chọn とばかりに\n✔ 〜とばかりに =「như muốn nói đây là cơ hội」(hành động thể hiện suy nghĩ ngầm)"},{"q":"友人に真実を（　）悩んでいる。","o":["告げようか告げまいか","告げようと告げまいと","告げようが告げまいが","告げようとどうしようと"],"a":1,"vi":"Đang phân vân không biết có nên nói sự thật với bạn hay không.","hint":"Thấy「告げようか告げまいか」→ đây là cấu trúc cố định\n✔ 〜うか〜まいか =「nên...hay không nên...」(phân vân giữa 2 lựa chọn)"},{"q":"同じような製品がありすぎて、どれを選んだらいい（　）悩んでしまう。","o":["ですら","からには","こそあれ","ものやら"],"a":4,"vi":"Có quá nhiều sản phẩm giống nhau nên không biết chọn cái nào, cứ băn khoăn mãi.","hint":"Thấy「どれを選んだらいい＿＿悩んでしまう」→ chọn ものやら\n✔ 〜ものやら =「không biết...nên làm gì」(lúng túng, không quyết được)"},{"q":"水泳は子どもから高齢者（　）、あらゆる年代の人が楽しめます。","o":["に加え","といえども","に至るまで","にもまして"],"a":3,"vi":"Bơi lội là môn mà mọi lứa tuổi, từ trẻ em đến người cao tuổi, đều có thể tận hưởng.","hint":"Thấy「子どもから高齢者＿＿あらゆる年代」→ chọn に至るまで\n✔ AからN＋に至るまで =「từ A cho đến tận...」(trải rộng toàn bộ phạm vi)"},{"q":"一国の首相（　）、発言には重大な責任がともなうものだ。","o":["ならでは","ともなると","はさておき","じゃあるまいし"],"a":2,"vi":"Đã là thủ tướng một nước thì phát ngôn nào cũng kéo theo trách nhiệm nặng nề.","hint":"Thấy「一国の首相＿＿責任がともなう」→ chọn ともなると\n✔ N＋ともなると =「một khi đã là (địa vị cao) thì」\n✘ ならでは = đặc trưng riêng, nghĩa khác"},{"q":"コンサートのチケットは発売が開始される（　）またたく間に売り切れた。","o":["とたん","と思うと","とみると","やいなや"],"a":4,"vi":"Vé concert vừa mở bán là hết veo trong nháy mắt.","hint":"Thấy「発売が開始される＿＿売り切れた」→ chọn やいなや\n✔ V辞書形＋やいなや =「vừa mới...thì ngay lập tức」\n✘ とたん = tương tự nhưng dùng た形"},{"q":"彼女の歌声は今もなお多くの人を魅了（　）。","o":["しかねない","極まりない","してやまない","にあたらない"],"a":3,"vi":"Giọng hát của cô ấy đến giờ vẫn mãi mê hoặc rất nhiều người.","hint":"Thấy「今もなお多くの人を魅了＿＿」→ chọn してやまない\n✔ Vて形＋やまない =「mãi không ngừng (mê hoặc, yêu mến...)」(cảm xúc/hành động không dứt)"},{"q":"この旅館はサービスのよさと料理の質（　）、利用客からの評価が非常に高い。","o":["をよそに","が相まって","にひきかえ","までもなく"],"a":2,"vi":"Nhà nghỉ này được đánh giá rất cao nhờ sự kết hợp giữa dịch vụ tốt và chất lượng món ăn.","hint":"Thấy「サービスのよさと料理の質＿＿評価が高い」→ chọn が相まって\n✔ A＋と＋B＋が相まって =「A kết hợp với B tạo nên...」(cố định)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"この作品が最優秀賞というのは、___ ___ ★ ___ と言えるだろう。","o":["して","取った","まさに","取るべく"],"a":1,"order":[3,4,1,2],"vi_p2":"Tác phẩm này giành giải nhất là hoàn toàn xứng đáng, đúng là phải thắng mới thắng."},{"q":"今の成績 ___ ___ ★ ___ も危ないだろう。","o":["卒業","就職","からすると","はおろか"],"a":4,"order":[3,2,4,1],"vi_p2":"Với thành tích hiện tại, không chỉ xin việc mà ngay cả tốt nghiệp cũng nguy."},{"q":"英語なら ___ ___ ★ ___ わかりません。","o":["ドイツ語","さっぱり","ともかく","となると"],"a":4,"order":[3,1,4,2],"vi_p2":"Tiếng Anh thì còn được, nhưng hễ nói đến tiếng Đức thì tôi mù tịt."},{"q":"買うのは高いし、___ ___ ★ ___ 、どうしたらいいかなあ。","o":["ならないし","借りたら","返さなきゃ","借りたで"],"a":3,"order":[2,4,3,1],"vi_p2":"Mua thì đắt, mà mượn thì phải trả — chẳng biết phải làm sao đây."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"自分はうまく働くことができないなどと言って、働こう【1-a】就職しよう【1-b】しない若者たちが、2004年頃から社会問題として取り上げられるようになった。彼らは「ニート」と呼ばれる。彼らの多くは、仕事をしない理由を「目標が持てないから」だと言う。しかし、このような若者たちを指導しているAさんはこう言う。「何はともあれ、朝、起きることだ」と。\n毎朝決まった時間に起きて顔を洗い、服を着替え、朝食をとる。どんな職業に就くのか、働く意味は何なのかを考えるの【2】、まず単純な毎日の一歩が踏み出せるかどうかが大切なのだと言う。確かにその通りだと思う。\n働く目的を説き、社会人としての自覚を促すのではなく、朝起きるという生活習慣を、頭ではなく身体に覚えさせる。「朝、起きる」という基本中の基本の生活習慣が身に【3】、次の行為へとつながっていくのだ。「働く」ということは、その先にあるのである。","items":[{"label":"1","o":["a とも／b とも","a にも／b とは","a とも／b とは","a にも／b にも"],"a":1,"hint":"Dạng câu hỏi: Mẫu hô ứng mới: Vようとは(しない)\n\nQuan hệ A-B: A (働こう) và B (就職しよう) là 2 hành động liệt kê song song, cùng bị phủ định ý định bởi cụm cố định とは+しない ở cuối.\n\na+b: 「働こう【1-a】就職しよう【1-b】しない」→ mẫu cố định Vようとは(しない) = 'không hề có ý định làm gì' → chọn ③ a=とも, b=とは\n→ とも ở vế đầu tạo liệt kê song song, とは+しない ở vế cuối là cụm cố định phủ định ý định\n\nchỗ này là bẫy\n\n✗ にも (②④) cần vị ngữ dạng KHẢ NĂNG PHỦ ĐỊNH (Vられない) phía sau, câu này chỉ có しない thường → loại ngay không cần đọc hiểu trọn nghĩa\n\n📌 Điểm ngữ pháp tinh tế nhất trong round này — đề xuất bổ sung vào bảng 9 mẫu hô ứng làm mẫu #10.","sentence":"自分はうまく働くことができないなどと言って、働こう【1-a】就職しよう【1-b】しない若者たちが、2004年頃から社会問題として取り上げられるようになった。"},{"label":"2","o":["に及ばず","はさておき","を踏まえて","にとどまらず"],"a":2,"hint":"Dạng câu hỏi: Thay thế / chuyển trọng tâm (はさておき)\n\nQuan hệ A-B: A (suy nghĩ về nghề nghiệp/ý nghĩa công việc) bị GẠT SANG BÊN để nhường chỗ cho B (bước đơn giản mỗi ngày) — quan hệ thay thế, không phải nhân quả.\n\n「どんな職業に就くのか...考えるの【2】、まず単純な毎日の一歩が...大切」→ quan hệ THAY THẾ/chuyển trọng tâm → chọn ② はさておき\n→ はさておき = 'tạm gác...sang bên' (nhóm Thay thế/ngoại lệ, cùng chức năng với ただし/もっとも)\n\nchỗ này là bẫy\n\n✗ を踏まえて = 'dựa trên' → NGƯỢC nghĩa hoàn toàn (câu đang nói KHÔNG dựa vào việc suy nghĩ đó)\n\n✗ にとどまらず = 'không chỉ...mà còn' → sai vì không có ý mở rộng phạm vi\n\n✗ に及ばず → sai collocation","sentence":"どんな職業に就くのか、働く意味は何なのかを考えるの【2】、まず単純な毎日の一歩が踏み出せるかどうかが大切なのだと言う。"},{"label":"3","o":["つけるべく","ついてこそ","ついたからこそ","つけたなりに"],"a":2,"hint":"Dạng câu hỏi: Điều kiện then chốt (てこそ)\n\nQuan hệ A-B: A (thói quen 'thức dậy' đã thấm vào người) là điều kiện THEN CHỐT để B (hành vi tiếp theo) có thể tiếp diễn — てこそ hợp hơn からこそ vì B là hành động tương lai tiếp diễn.\n\n「生活習慣が身に【3】、次の行為へとつながっていくのだ」→ động từ tự động 身につく + cần điều kiện then chốt cho hành động TIẾP DIỄN → chọn ② ついてこそ\n→ てこそ = điều kiện then chốt, hợp khi vế sau là hành động tiếp diễn tương lai (つながっていく)\n\nchỗ này là bẫy\n\n✗ ついたからこそ → gần đúng nhưng からこそ nhấn lý do ĐÃ xảy ra dẫn kết quả ĐÃ có, yếu hơn てこそ ở đây\n\n✗ つけるべく/つけたなりに → sai vì dùng động từ chủ động つける, câu gốc dùng tự động từ 身につく","sentence":"「朝、起きる」という基本中の基本の生活習慣が身に【3】、次の行為へとつながっていくのだ。"}]}]},{"id":"r5","name":"第5回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[],"missing_note":"⚠️ 問題1（10問）の原文がスキャン資料から欠落しています。答えのみ参考: 1-4 2-2 3-1 4-2 5-2 6-1 7-2 8-2 9-4 10-1"},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"慎重な ___ ___ ★ ___ まったく危険を顧みない。","o":["きたら","ひきかえ","弟に","兄と"],"a":4,"order":[3,2,4,1],"vi_p2":"Trái ngược với người em thận trọng, anh trai thì hoàn toàn không sợ nguy hiểm."},{"q":"いかに父が ___ ___ ★ ___ 、そんな高い山に一人で登るのは無理だろう。","o":["若者","健康","といえども","じゃあるまいし"],"a":1,"order":[2,3,1,4],"vi_p2":"Dù bố còn khỏe đi nữa, ông ấy đâu còn trẻ, leo một mình lên núi cao như vậy là không thể."},{"q":"山一面に咲く桜はここ ___ ___ ★ ___ が訪れる。","o":["多くの観光客","ならではの","眺め","とあって"],"a":4,"order":[2,3,4,1],"vi_p2":"Hoa anh đào nở khắp sườn núi chính là nét đẹp độc đáo nơi đây, thu hút đông đảo du khách."},{"q":"お互いに率直に ___ ___ ★ ___ はずがない。","o":["理解しあえる","には","なし","話し合うこと"],"a":2,"order":[4,3,2,1],"vi_p2":"Không thể có chuyện hiểu nhau nếu hai bên không thẳng thắn ngồi nói chuyện với nhau."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"恋とは楽しいものだろうか、辛く苦しいものだろうか。\nその答えが「どちらも」であるのは【1】だろう。どんな時代のどんな小説や映画を見ても、恋は、あるときは楽しく、またあるときは、辛く苦しいものだ。\n恋が辛いのはなぜか。Aさんのことが【2】のに、Aさんが同じように自分を好きになってくれない、それどころか、別の人と付き合っている。このように、自分がどれだけ強い気持ちを持っていても、それが相手に届かないことが、恋を辛くさせている原因だ。\nでは、恋は実れば楽しいだけかというと、そんなことはない。「相手がいつまでも私のことを好きでいてくれるだろうか」「ひょっとしたら、相手は私ほど自分のことを好きじゃないかもしれない」など、恋人に【3】、やはり悩みはつきないのである。","items":[{"label":"1","o":["言うほかない","言うまでもない","言わざるを得ない","言わねばならない"],"a":2,"hint":"Dạng câu hỏi: Đánh giá hiển nhiên (言うまでもない)\n\nQuan hệ A-B: A (câu trả lời là 'cả hai') là điều HIỂN NHIÊN, B (dẫn chứng khắp thời đại) là bằng chứng xác nhận tính hiển nhiên đó.\n\n「その答えが「どちらも」であるのは【1】だろう」+ câu SAU đưa dẫn chứng khắp mọi thời đại → chọn ② 言うまでもない\n→ 言うまでもない = 'hiển nhiên, không cần nói' — khớp việc câu sau CHỨNG MINH tính phổ quát\n\nchỗ này là bẫy\n\n✗ 言わざるを得ない = 'buộc phải nói' (miễn cưỡng) → sai sắc thái\n\n✗ 言わねばならない = 'phải nói' (nghĩa vụ) → không liên quan\n\n✗ 言うほかない = 'chỉ còn cách nói' → sai sắc thái","sentence":"その答えが「どちらも」であるのは【1】だろう。"},{"label":"2","o":["好きでかなわない","好きとは限らない","好きでたまらない","好きなわけではない"],"a":3,"hint":"Dạng câu hỏi: Cụm cố định cảm xúc (好きでたまらない)\n\nQuan hệ A-B: Không phải quan hệ A-B logic mà là cụm cố định diễn tả cảm xúc yêu thích ở mức cực đại, đi kèm động từ だ.\n\n「Aさんのことが【2】のに、Aさんが...好きになってくれない」→ cảm xúc mãnh liệt một chiều → chọn ③ 好きでたまらない\n→ 好きでたまらない = cụm cố định 'thích đến mức không chịu nổi'\n\nchỗ này là bẫy\n\n✗ 好きでかなわない → かなわない thường dùng cho cảm giác khó chịu THỂ CHẤT (暑くてかなわない), ít dùng cho yêu thích\n\n✗ 好きとは限らない/好きなわけではない → cả hai đều mang nghĩa PHỦ ĐỊNH tình cảm, ngược hẳn ngữ cảnh","sentence":"Aさんのことが【2】のに、Aさんが同じように自分を好きになってくれない、それどころか、別の人と付き合っている。"},{"label":"3","o":["なったが最後","なったらなったで","なりもしないうちから","なるにつけならないにつけ"],"a":2,"hint":"Dạng câu hỏi: Liên kết câu trước + kết quả phát sinh\n\nQuan hệ A-B: Câu trước đặt câu hỏi phủ định (yêu thành công có phải chỉ vui không? Không phải) → A (đã thành người yêu) vẫn kéo theo B (nỗi lo mới phát sinh).\n\n→ なったらなったで = 'một khi đã thành như vậy thì (lại nảy sinh vấn đề khác)'\n\nchỗ này là bẫy\n\n✗ なったが最後 = sắc thái tiêu cực mạnh 'hết đường quay lại' → quá nặng so với ngữ cảnh\n\n✗ なりもしないうちから = 'từ khi còn chưa thành' → sai vì câu nói về trạng thái ĐÃ thành người yêu\n\n✗ なるにつけならないにつけ → cần cặp đối lập rõ ràng, câu chỉ có 1 vế nên sai cấu trúc\n\n📌 Câu TRƯỚC đặt câu hỏi tu từ: 「恋は実れば楽しいだけかというと、そんなことはない」(yêu thành công thì chỉ vui thôi à? Không phải vậy) → chỗ trống 3 phải khớp ý phát sinh vấn đề mới SAU KHI đã đạt được → chọn ② なったらなったで","sentence":"「相手がいつまでも私のことを好きでいてくれるだろうか」「ひょっとしたら、相手は私ほど自分のことを好きじゃないかもしれない」など、恋人に【3】、やはり悩みはつきないのである。"}]}]},{"id":"r6","name":"第6回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"不慣れな（　）、失礼がありましたらご指摘くださいませ。","o":["こととて","そばから","ながらに","ものだから"],"a":1,"vi":"Vì chưa quen việc nên nếu có gì thất lễ, xin hãy chỉ bảo cho tôi.","hint":"Thấy「不慣れな＿＿失礼がありましたら」→ chọn こととて\n✔ 〜こととて =「vì là (lý do)...mà」(giải thích/xin lỗi, trang trọng)"},{"q":"今回はだめだったが、次回の会議ではきっと自分の企画を（　）。","o":["通すに限る","通してみせる","通してやまない","通さざるを得ない"],"a":2,"vi":"Lần này thất bại, nhưng lần họp tới chắc chắn tôi sẽ cho mọi người thấy là tôi sẽ thông qua được kế hoạch của mình.","hint":"Thấy「きっと＿＿」với quyết tâm mạnh → chọn 通してみせる\n✔ Vて形＋みせる =「quyết sẽ làm cho được」(quyết tâm thực hiện đến cùng)"},{"q":"あの学生は注意されても、反省するどころか怒り出す（　）。","o":["限りだ","始末だ","に至る","ものがある"],"a":2,"vi":"Học sinh đó dù bị nhắc nhở, chẳng những không hối lỗi mà còn nổi giận, đến mức như vậy đấy.","hint":"Thấy「反省するどころか怒り出す＿＿」→ chọn 始末だ\n✔ 〜始末だ =「rốt cuộc đến mức (tệ)...」(kết quả xấu sau diễn biến ngược kỳ vọng)"},{"q":"この壮大な景色は訪れた者を感動（　）。","o":["させかねない","させんばかりだ","させずにはおかない","させて仕方がない"],"a":3,"vi":"Khung cảnh hùng vĩ này chắc chắn sẽ khiến bất cứ ai ghé thăm cũng phải xúc động.","hint":"Thấy「壮大な景色は訪れた者を感動＿＿」→ chọn させずにはおかない\n✔ 〜させずにはおかない =「chắc chắn sẽ khiến...」(tác động mạnh, không thể tránh khỏi)"},{"q":"どこの国（　）、親が子どもを思う気持ちは変わらない。","o":["であれ","であろうか","ならでは","なりとも"],"a":1,"vi":"Dù là nước nào đi nữa, tình cảm cha mẹ dành cho con cái cũng không thay đổi.","hint":"Thấy「どこの国＿＿、親の気持ちは変わらない」→ chọn であれ\n✔ N＋であれ =「dù là...đi nữa」(bất kể điều kiện nào)"},{"q":"この団体は、飲み水（　）ないような地域で支援活動を続けている。","o":["こそ","すら","だけ","ほど"],"a":2,"vi":"Tổ chức này vẫn tiếp tục hoạt động hỗ trợ ở những vùng mà ngay cả nước uống cũng thiếu thốn.","hint":"Thấy「飲み水＿＿ないような地域」→ chọn すら\n✔ N＋すら＋ない =「ngay cả...cũng không」(nhấn mạnh điều tối thiểu cũng thiếu)\n✘ こそ = nhấn mạnh khẳng định (nghĩa ngược)"},{"q":"国（　）被災地の復興にあたっている。","o":["にあって","において","をあげて","をもって"],"a":3,"vi":"Cả đất nước đang dốc toàn lực để phục hồi vùng bị thiên tai.","hint":"Thấy「国＿＿被災地の復興」→ chọn をあげて\n✔ N＋をあげて =「dốc toàn bộ...để」(cố định: 国をあげて、全力をあげて)\n✘ において = chỉ vị trí/phạm vi"},{"q":"腰痛の治療（　）、九州へ温泉旅行に行くことにした。","o":["に限って","に加えて","を兼ねて","を踏まえて"],"a":3,"vi":"Tôi quyết định đi du lịch suối nước nóng ở Kyushu, kết hợp luôn việc chữa đau lưng.","hint":"Thấy「腰痛の治療＿＿温泉旅行」→ chọn を兼ねて\n✔ N＋を兼ねて =「kết hợp luôn việc...」(một chuyến đi hai mục đích)\n✘ に加えて = thêm vào (không nhất thiết cùng lúc)"},{"q":"銀行に行き（　）お弁当を買ってきます。","o":["限り","がてら","かたがた","かたわら"],"a":2,"vi":"Tôi sẽ nhân tiện đi ngân hàng mua luôn cơm hộp về.","hint":"Thấy「銀行に行き＿＿お弁当を買う」→ chọn がてら\n✔ Vます形＋がてら =「nhân tiện...」(làm thêm việc phụ khi đang làm việc chính)\n✘ かたわら = hoạt động song song dài hạn"},{"q":"祖父は日本中の山（　）山に登ったことがあると、いつも自慢している。","o":["という","というか","といわず","といったら"],"a":1,"vi":"Ông tôi lúc nào cũng tự hào kể rằng đã từng leo hết ngọn núi này đến ngọn núi khác khắp Nhật Bản.","hint":"Thấy「山＿＿山に登った」→ chọn という\n✔ N＋という＋N =「N nào cũng...」(cố định: 山という山、店という店)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"この映画の主役は ___ ___ ★ ___ だろう。","o":["いない","ほかに","おいて","彼を"],"a":2,"order":[4,3,2,1],"vi_p2":"Vai chính của bộ phim này không ai khác ngoài anh ấy."},{"q":"彼の作る歌はメロディーの ___ ___ ★ ___ 、詩も感動的だ。","o":["さること","も","美しさ","ながら"],"a":1,"order":[3,2,1,4],"vi_p2":"Bài hát anh ấy viết, chưa nói đến giai điệu tuyệt đẹp, lời thơ cũng rất cảm động."},{"q":"もう少しスピードを出していたら ___ ___ ★ ___ よ。","o":["けが","こんな","すまなかった","だけじゃ"],"a":4,"order":[2,1,4,3],"vi_p2":"Nếu chạy thêm một chút nữa thì không phải chỉ bị thương thế này thôi đâu nhé."},{"q":"好き嫌いはともかく、彼女の実力 ___ ___ ★ ___ だろう。","o":["を","は","得ない","認めざる"],"a":1,"order":[2,4,1,3],"vi_p2":"Dù thích hay không, thực lực của cô ấy là điều không thể phủ nhận."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"四カ月【1】の再会になる。夏休みになったら遊びに行くから、絶対に行くから、と三上くんが転校する前に約束をした。夏休み初日の今日、早起きをして列車に乗った。夕方の列車で帰るまで、半日たっぷり遊べる。ラジオ体操の皆勤賞は初日でアウトになってしまったが、後悔はない。三上くんに会える。やっと会える。四年生の頃、二人はクラスでいちばんの仲良しだった。\n列車は駅の構内に入った。少年はボックスシートからデッキに移った。ポイントを通過する【2】、列車は左右に大きく揺れる。両足を踏ん張って体を支え、またシャツの胸ポケットに手をあてて、あー、あー、あー、と声を出して喉の調子を整えた。ホームであいつに会ったら「ひさしぶり！」と大きな声で言って【3-a】か。それとも、わざわざ遊びに来て【3-b】んだし、ちょっと照れくさいし、あいつから話しかけてくるまで黙っていようか……。\n（重松清著『南小、フォーエバー』文藝春秋刊『小学五年生』所収）","items":[{"label":"1","o":["あたり","おき","ごと","ぶり"],"a":4,"hint":"Dạng câu hỏi: Mẫu thời gian tái diễn (ぶり)\n\nQuan hệ A-B: Không phải quan hệ A-B mà là hậu tố chỉ 'sau khoảng thời gian X, việc gì đó xảy ra lại lần đầu'.\n\n「四カ月【1】の再会」→ chọn ④ ぶり\n→ ぶり = 'sau khoảng thời gian X, (việc gì đó xảy ra lại lần đầu)' — khớp 'cuộc tái ngộ sau 4 tháng'\n\nchỗ này là bẫy\n\n✗ あたり = khoảng chừng/xung quanh → sai\n\n✗ おき/ごと = chỉ tần suất lặp lại đều đặn (1日おきに, 3日ごとに) → không hợp vì đây không phải chu kỳ lặp lại","sentence":"四カ月【1】の再会になる。"},{"label":"2","o":["たびに","とたんに","ついでに","ところに"],"a":1,"hint":"Dạng câu hỏi: Tần suất lặp lại (たびに)\n\nQuan hệ A-B: A (mỗi lần tàu qua điểm ghi) là điều kiện lặp lại, B (tàu lắc mạnh) là hệ quả xảy ra MỖI LẦN A xảy ra.\n\n「ポイントを通過する【2】、列車は左右に大きく揺れる」→ hiện tượng LẶP LẠI mỗi lần → chọn ① たびに\n→ たびに = 'mỗi khi...' (quy luật lặp lại)\n\nchỗ này là bẫy\n\n✗ とたんに = tức thì, 1 lần cụ thể → sai vì đây là hiện tượng lặp đi lặp lại\n\n✗ ついでに/ところに → sai nghĩa hoàn toàn","sentence":"ポイントを通過する【2】、列車は左右に大きく揺れる。"},{"label":"3","o":["a おこう／b おいた","a やろう／b やった","a くれよう／b くれた","a もらおう／b もらった"],"a":2,"hint":"Dạng câu hỏi: Cho-nhận (授受): てやる\n\nQuan hệ A-B: Chủ thể (cậu bé) là người THỰC HIỆN hành động (nói to/đến chơi) CHO bạn mình — không phải quan hệ A-B mà là xác định chủ thể cho-nhận.\n\n「言って【3-a】か」+「わざわざ遊びに来て【3-b】んだし」→ chủ thể (cậu bé) tự làm hành động CHO bạn mình → chọn ② やろう/やった (てやる)\n→ てやる = chủ thể là người CHO (làm việc gì đó cho ai, hơi trẻ con/thân mật)\n\nchỗ này là bẫy\n\n✗ おこう/おいた (ておく) = làm trước/chuẩn bị sẵn → sai nghĩa\n\n✗ くれよう/くれた (てくれる) = người KHÁC làm cho mình → sai chiều, ở đây chính cậu bé là người thực hiện hành động\n\n✗ もらおう/もらった (てもらう) = mình NHẬN hành động từ người khác → sai chiều\n\n📌 Đây là dạng câu hỏi 授受 (cho-nhận) theo đúng [[Xác định chủ thể cấu trúc cho-nhận và ý đồ sai khiến trong câu đục lỗ N1]]: xác định chủ thể là người CHO → てやる.","sentence":"ホームであいつに会ったら「ひさしぶり！」と大きな声で言って【3-a】か。\nそれとも、わざわざ遊びに来て【3-b】んだし、ちょっと照れくさいし、あいつから話しかけてくるまで黙っていようか……。"}]}]},{"id":"r7","name":"第7回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"このような名誉ある賞がもらえるとは、予想（　）しませんでした。","o":["きり","こそ","だに","ながら"],"a":3,"vi":"Tôi hoàn toàn không ngờ lại được nhận một giải thưởng vinh dự thế này.","hint":"Thấy「予想＿＿しませんでした」→ chọn だに\n✔ V辞書形＋だに＋しない =「ngay cả (nghĩ đến) cũng không」(cố định: 予想だにしない)\n✘ きり = chỉ...thôi"},{"q":"一日（　）あの日のことを忘れたことはありません。","o":["たらず","ならず","たりとも","なりとも"],"a":3,"vi":"Không một ngày nào tôi quên chuyện hôm đó.","hint":"Thấy「一日＿＿忘れたことはない」→ chọン たりとも\n✔ 一日たりとも〜ない =「dù chỉ một ngày cũng không」(nhấn mạnh tuyệt đối)"},{"q":"市民が安心して暮らせるように努力するのが、市長（　）者の務めだ。","o":["たる","ごとき","あっての","ゆえの"],"a":1,"vi":"Việc cố gắng để người dân sống yên ổn chính là bổn phận của một người làm thị trưởng.","hint":"Thấy「市長＿＿者の務め」→ chọn たる\n✔ N＋たる＋N =「là người có tư cách/địa vị là...」(文語 trang trọng)"},{"q":"その女の子は店に入りにくそうに、入り口の前を（　）している。","o":["行きつ戻りつ","行っては戻っては","行くにつけ戻るにつけ","行くなり戻るなり"],"a":1,"vi":"Cô bé đó có vẻ ngại vào cửa hàng nên cứ đi tới đi lui trước cửa.","hint":"Thấy「入り口の前を＿＿している」→ chọn 行きつ戻りつ\n✔ 行きつ戻りつ = cụm cố định「đi đi lại lại」(Vます形つ〜Vます形つ)"},{"q":"心身ともに健康で、充実した毎日が送れることが幸せ（　）。","o":["にたえない","にかたくない","でなくてなんだろう","といったらありはしない"],"a":3,"vi":"Có một cuộc sống mạnh khỏe cả thể chất lẫn tinh thần, ngày nào cũng đầy đặn, thì còn gì hạnh phúc bằng.","hint":"Thấy「幸せ＿＿」kèm ý khẳng định mạnh → chọん でなくてなんだろう\n✔ N＋でなくてなんだろう =「nếu không phải là...thì là gì」(khẳng định gián tiếp cực mạnh)"},{"q":"新入社員（　）、まだそんな初歩的なミスをするなんて、どういうことだ。","o":["なりに","はおろか","ともなると","ではあるまいし"],"a":4,"vi":"Đâu phải là nhân viên mới mà còn mắc lỗi sơ đẳng như vậy, thật không hiểu nổi.","hint":"Thấy「新入社員＿＿初歩的なミスをするなんて」→ chọn ではあるまいし\n✔ N＋ではあるまいし =「đâu phải là (trẻ con/người mới)...」(phê phán vì không xứng với vị trí/tuổi tác)"},{"q":"ここで起きた悲劇は涙（　）語れない。","o":["ながらに","なくても","なしには","をおいて"],"a":3,"vi":"Bi kịch xảy ra ở đây không thể kể lại mà không rơi nước mắt.","hint":"Thấy「涙＿＿語れない」→ chọn なしには\n✔ N＋なしには〜ない =「không có...thì không thể」(cố định: 涙なしには語れない)"},{"q":"頭も性格もいい上に話がおもしろい（　）、誰からも好かれるだろう。","o":["あげく","とあれば","ところで","からして"],"a":2,"vi":"Nếu vừa đẹp trai tốt tính lại vừa nói chuyện thú vị thì ai cũng quý thôi.","hint":"Thấy「〜おもしろい＿＿誰からも好かれる」→ chọn とあれば\n✔ 〜とあれば =「nếu là (điều kiện tốt) thì (kết quả tất nhiên)」"},{"q":"人生を楽しめるかどうかは、ものごとのとらえ方（　）だ。","o":["いかん","ごとし","じまい","まじき"],"a":1,"vi":"Có vui được với cuộc sống hay không tùy thuộc vào cách nhìn nhận sự việc của mỗi người.","hint":"Thấy「ものごとのとらえ方＿＿だ」→ chọn いかん\n✔ N＋いかん（だ） =「tùy thuộc vào...」(N quyết định kết quả)\n✘ ごとし = so sánh, nghĩa khác"},{"q":"買ってきたケーキを自分で作った（　）彼にあげた。","o":["ものを","こととて","ことにして","ものだから"],"a":3,"vi":"Tôi đã tặng anh ấy chiếc bánh mua sẵn, coi như (giả vờ) là tự tay mình làm.","hint":"Thấy「自分で作った＿＿彼にあげた」(ý giả vờ/coi như) → chọn ことにして\n✔ 〜ことにする =「quyết định coi như là.../giả vờ là...」→ ở đây nghĩa là giả vờ như tự tay làm\n✘ こととて =「vì là...」(lý do, mang sắc thái xin lỗi) → không hợp vì câu không phải giải thích lý do"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"加害者本人からの ___ ___ ★ ___ あり得ないだろう。","o":["なくして","和解","は","謝罪"],"a":2,"order":[4,1,2,3],"vi_p2":"Hòa giải là điều không thể có nếu không có lời xin lỗi từ chính người gây hại."},{"q":"店主はその男を見る ___ ___ ★ ___ ドアを閉めた。","o":["帰れ","ばかりに","と","やいなや"],"a":3,"order":[4,1,3,2],"vi_p2":"Người chủ tiệm vừa nhìn thấy người đàn ông đó là lập tức đóng cửa ra hiệu bảo đi về."},{"q":"進学の際には保証人がいるらしい。誰に ___ ___ ★ ___ 。","o":["もの","いい","やら","頼んだら"],"a":1,"order":[4,2,1,3],"vi_p2":"Nghe nói khi nhập học phải có người bảo lãnh. Không biết nhờ ai đây."},{"q":"スタイルを気にするのは、決して ___ ___ ★ ___ ではない。","o":["だけ","こと","に限った","女性"],"a":3,"order":[4,1,3,2],"vi_p2":"Việc để ý đến vóc dáng không chỉ là chuyện riêng của phụ nữ."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"ロボットと人間の違いは【1】。1970年代に盲導犬ロボットや介護ロボットの研究開発が盛んに行われたことがある。しかしその当時は、技術レベルがまだ低かった【2】、当事者たちに受け入れてもらうことはできなかった。目の不自由な人たちからは、「ロボットの研究者たちはわれわれの気持ちを理解していない」「われわれと心が通わない盲導犬ロボットの開発などはまったく意味がない」と非難された。また、病院の看護師さんからは、「ロボットには心がないからわれわれの代わりをすることはできない」と決めつけられたりもした。今ではロボットの技術も格段に進歩したし、医療、福祉に関する社会の情勢も変化した。しかし、基本的な問題が解決された【3】。生き物である盲導犬や看護師と人工物であるロボットとでは本質的な違いがあり、両者の間には越えがたい壁があるようである。\n（長田正著『ロボットは人間になれるか』PHP研究所刊）","items":[{"label":"1","o":["何であろうか","何があろうか","何をするのか","何をしようか"],"a":1,"hint":"Dạng câu hỏi: Câu hỏi tu từ mở bài\n\nQuan hệ A-B: Không có quan hệ A-B — đây là câu hỏi tu từ đặt vấn đề, cần thể nghi vấn suy đoán trang trọng ~であろうか.\n\n「ロボットと人間の違いは【1】」(mở đầu bài, câu hỏi tu từ) → chọn ① 何であろうか\n→ 何であろうか = 'là gì nhỉ' (nghi vấn suy đoán trang trọng, văn viết)\n\nchỗ này là bẫy\n\n✗ 何があろうか = sai vì chủ ngữ 違い (sự khác biệt) cần động từ である, không phải ある\n\n✗ 何をするのか/何をしようか = sai, 違い không phải hành động","sentence":"ロボットと人間の違いは【1】。"},{"label":"2","o":["からこそ","だけあって","のみならず","こともあって"],"a":4,"hint":"Dạng câu hỏi: Nguyên nhân gián tiếp (こともあって)\n\nQuan hệ A-B: A (kỹ thuật còn thấp) là MỘT TRONG NHIỀU lý do dẫn đến B (không được chấp nhận) — nguyên nhân nhẹ nhàng, không khẳng định tuyệt đối như からこそ.\n\n「技術レベルがまだ低かった【2】、当事者たちに受け入れてもらうことはできなかった」→ chọn ④ こともあって\n→ こともあって = 'cũng vì có việc (1 trong nhiều lý do) đó mà...' (giải thích nguyên nhân nhẹ nhàng, gián tiếp)\n\nchỗ này là bẫy\n\n✗ からこそ = 'chính vì' — quá mạnh/khẳng định so với sắc thái liệt kê lý do ở đây\n\n✗ だけあって = 'đúng là...(nên xứng đáng)' — dùng khi khen ngợi tương xứng, sai ngữ cảnh\n\n✗ のみならず = 'không chỉ...mà còn' — sai hoàn toàn, không phải tăng tiến","sentence":"しかしその当時は、技術レベルがまだ低かった【2】、当事者たちに受け入れてもらうことはできなかった。"},{"label":"3","o":["ことなどない","だけではない","わけではない","と言えなくもない"],"a":3,"hint":"Dạng câu hỏi: Phủ định một phần (わけではない)\n\nQuan hệ A-B: A (vấn đề cơ bản đã giải quyết) bị phủ định MỘT PHẦN bởi わけではない, mở đường cho B (câu sau: vẫn còn bức tường khó vượt).\n\n「基本的な問題が解決された【3】」+ câu sau nói vẫn còn 'bức tường khó vượt' → chọn ③ わけではない\n→ わけではない = 'không có nghĩa là...' (phủ định một phần/nhẹ nhàng)\n\nchỗ này là bẫy\n\n✗ ことなどない = sai thì, không phải nói kinh nghiệm\n\n✗ だけではない = sai cấu trúc logic (không phải liệt kê thêm)\n\n✗ と言えなくもない = khẳng định nhẹ — ngược hướng với ý phủ định cần có","sentence":"しかし、基本的な問題が解決された【3】。"}]}]},{"id":"r8","name":"第8回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"十分ではないが、まずまずの結果だ。これなら成功（　）。","o":["極まりない","と言いかねない","と言えなくもない","せざるを得ない"],"a":3,"vi":"Tuy chưa thật xuất sắc nhưng kết quả cũng tạm ổn. Có thể nói đây cũng coi như thành công.","hint":"Thấy「まずまずの結果だ。成功＿＿」→ chọn と言えなくもない\n✔ 〜と言えなくもない = phủ định kép = khẳng định nhẹ「cũng có thể nói là...」"},{"q":"お休み（　）申し訳ありませんが、少々伺いたいことがありまして……。","o":["がてらに","ながらに","のそばから","のところを"],"a":4,"vi":"Xin lỗi vì đã làm phiền lúc anh/chị đang nghỉ ngơi, nhưng tôi có vài điều muốn hỏi…","hint":"Thấy「お休み＿＿申し訳ない」→ chọn のところを\n✔ 〜のところを =「đúng lúc đang...mà (vẫn làm phiền)」(công thức xin lỗi trang trọng)"},{"q":"両親は私が嘘をついていると知って（　）、黙って許してくれた。","o":["いながら","いようか","いたごとく","いたとみえて"],"a":1,"vi":"Bố mẹ có vẻ biết tôi nói dối nhưng vẫn im lặng cho qua.","hint":"Thấy「知って＿＿黙って許した」→ chọn いたとみえて\n✔ 〜とみえて =「có vẻ như」+ た = quá khứ「có vẻ đã biết」"},{"q":"尊敬する先生からこのようなお褒めの言葉をいただき、光栄（　）。","o":["にすぎません","の至りです","でやみません","にあたりません"],"a":2,"vi":"Nhận được lời khen như vậy từ vị thầy đáng kính, tôi cảm thấy vô cùng vinh dự.","hint":"Thấy「光栄＿＿」→ chọn の至りです\n✔ N＋の至りです =「thật là vô cùng...」(cực độ, trang trọng: 光栄の至り、感謝の至り)"},{"q":"中学生（　）、大学生にもなってこの漢字が読めないとは恥ずかしい。","o":["はおろか","をよそに","にひきかえ","ならいざ知らず"],"a":4,"vi":"Đừng nói là học sinh cấp 2, ngay cả là sinh viên đại học mà không đọc được chữ Hán này thì thật xấu hổ.","hint":"Thấy「中学生＿＿大学生にも読めない」→ chọn はおろか\n✔ N＋はおろか =「đừng nói là...」(mức thấp hơn còn không được, mức cao hơn càng không)\n✘ にひきかえ = tương phản hai đối tượng"},{"q":"このグラフに示される（　）、前回とは異なる数値が測定された。","o":["ごとく","どころか","ばかりに","そばから"],"a":1,"vi":"Đúng như biểu đồ này cho thấy, lần này đo được số liệu khác với lần trước.","hint":"Thấy「グラフに示される＿＿数値が測定された」→ chọn ごとく\n✔ 〜ごとく =「như (được chỉ ra)...」(so sánh, văn viết)\n✘ どころか = đừng nói là (nghĩa khác)"},{"q":"どんな事情があったにせよ、暴力は（　）行為だ。","o":["許すべからざる","許すに足る","許しかねない","許さざるを得ない"],"a":1,"vi":"Dù có lý do gì đi nữa, bạo lực vẫn là hành vi không thể tha thứ.","hint":"Thấy「どんな事情があったにせよ、暴力は＿＿行為だ」→ chọん べからざる\n✔ V辞書形＋べからざる＋N =「(hành vi) không thể tha thứ/không được phép」(văn viết cứng)"},{"q":"こんなつまらない仕事ばかりさせられる（　）、会社なんかやめてやる。","o":["こととて","ことやら","くらいなら","ものやら"],"a":3,"vi":"Nếu cứ phải làm những công việc vô vị thế này thì thà nghỉ việc còn hơn.","hint":"Thấy「こんな仕事ばかり＿＿、やめてやる」→ chọn くらいなら\n✔ 〜くらいなら〜ほうがまし =「thà...còn hơn」(so sánh 2 thứ, thứ đang nói bực bội)"},{"q":"名医（　）治せない病気もある。","o":["なりに","たるもの","だからこそ","といえども"],"a":4,"vi":"Dù là bác sĩ giỏi cũng có những bệnh không chữa được.","hint":"Thấy「名医＿＿治せない病気もある」→ chọn といえども\n✔ N/S＋といえども =「dù là...đi nữa」(thừa nhận điều kiện cao rồi đưa ra ngoại lệ)"},{"q":"日本に住んでいた3年間、結局一度も富士山に（　）だった。","o":["登らずじまい","登ること抜き","登ることなし","登ったが最後"],"a":1,"vi":"Suốt 3 năm sống ở Nhật, rốt cuộc tôi chưa một lần leo núi Phú Sĩ.","hint":"Thấy「結局一度も＿＿だった」→ chọน ずじまい\n✔ V否定ず＋じまい =「rốt cuộc đã không...」(dự định mà không thực hiện được)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"部長 ___ ___ ★ ___ 少なかれストレスを抱えているものだ。","o":["と","なる","とも","多かれ"],"a":1,"order":[3,2,1,4],"vi_p2":"Đã là trưởng phòng thì ai cũng phải chịu áp lực nhiều hay ít."},{"q":"質問されても、事情が ___ ___ ★ ___ ない。","o":["以上","答えようが","わからない","答えようにも"],"a":4,"order":[3,1,4,2],"vi_p2":"Dù bị hỏi, vì không biết tình huống nên dù muốn trả lời cũng không thể trả lời."},{"q":"住所変更だけで、こんなにたくさん ___ ___ ★ ___ ありゃしない。","o":["面倒くさい","なんて","といったら","手続きがいる"],"a":1,"order":[4,2,1,3],"vi_p2":"Chỉ để thay đổi địa chỉ mà thủ tục nhiêu khê đến thế này thì thật không thể nói nổi."},{"q":"校長先生がドイツを ___ ___ ★ ___ ことから、交流が始まったそうだ。","o":["見学した","旅行した","その学校を","折に"],"a":3,"order":[2,4,3,1],"vi_p2":"Nghe nói việc giao lưu bắt đầu từ chuyến tham quan trường đó nhân dịp hiệu trưởng đi du lịch Đức."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"私なりの読書の楽しみ方をご紹介します。本を読むとき、その作者が自分の隣で自分だけに向かって語りかけていると想像しながら読むのです。小説なら朗読会、実用書なら個人レッスン、エッセイならさしずめ作者とのおしゃべり【1】。\n前書きや奥付の情報を手がかりに作者の姿を思い描きながら読む、というのもまた楽しい時間です。今はその気になれば、インターネットで画像検索することもできますが、そこまでするよりは、自分で勝手に想像したほうが楽しいと私は思っています。\n【2】、私の周りには、「本は高いから買わない」と言う人がいます。作者が長い時間をかけて培ってきた知識や、長い時間をかけて作り上げた空想の世界が、わずか数百枚の紙の中に詰まっているのです。いくら【3】ということはないと思うし、実際はそれが数百円から手に入るのですから、少しでも興味のある本があったら買わない手はないでしょう。","items":[{"label":"1","o":["にちがいないでしょう","といったらないでしょう","というわけでしょうか","といったところでしょうか"],"a":4,"hint":"Dạng câu hỏi: Ước lượng, ví von (~といったところ)\n\nQuan hệ A-B: A (さしずめ: nói ngay/tóm lại) yêu cầu cách diễn đạt ƯỚC LƯỢNG ở B (khoảng chừng như cuộc trò chuyện) — không phải khẳng định chắc chắn.\n\n「エッセイならさしずめ作者とのおしゃべり【1】」→ さしずめ (nói ngay/tóm lại) cần đi với cách nói ước lượng → chọn ④ といったところでしょうか\n→ といったところでしょうか = 'có thể nói là khoảng chừng như...' khớp さしずめ\n\nchỗ này là bẫy\n\n✗ にちがいないでしょう = quá khẳng định, không hợp さしずめ (ước lượng)\n\n✗ といったらないでしょう = sai cấu trúc (khác với cụm cảm thán mức cực đại thật)\n\n✗ というわけでしょうか = sai, không hợp mạch liệt kê ví von","sentence":"小説なら朗読会、実用書なら個人レッスン、エッセイならさしずめ作者とのおしゃべり【1】。"},{"label":"2","o":["信じずとも","信じがたいことに","信じられないまでも","信じるとは限らないが"],"a":2,"hint":"Dạng câu hỏi: Mở đầu điều đáng ngạc nhiên\n\nQuan hệ A-B: A (mở đầu câu) phải báo hiệu B (điều tác giả thấy khó tin: người nói sách đắt không mua) là điều đáng ngạc nhiên với chính tác giả.\n\n「【2】、私の周りには『本は高いから買わない』と言う人がいます」→ mở đầu điều đáng ngạc nhiên → chọn ② 信じがたいことに\n→ 信じがたいことに = 'điều khó tin là...' (mở đầu câu diễn tả điều đáng ngạc nhiên)\n\nchỗ này là bẫy\n\n✗ 信じずとも/信じられないまでも/信じるとは限らないが → đều sai cấu trúc mở đầu câu kiểu này","sentence":"【2】、私の周りには、「本は高いから買わない」と言う人がいます。"},{"label":"3","o":["安いほどよい","安くても安すぎる","高いほどよい","高くても高すぎる"],"a":4,"hint":"Dạng câu hỏi: Mẫu cố định nhượng bộ\n\nQuan hệ A-B: A (giá cả dù cao đến mấy) và B (không phải là quá đắt) tạo thành mẫu cố định いくら~ても~ということはない.\n\n「いくら【3】ということはないと思うし」→ mẫu cố định いくら〜ても〜ということはない → chọn ④ 高くても高すぎる\n→ 'dù đắt đến mấy cũng không phải là quá đắt' — khớp mạch khen giá trị sách xứng đáng dù giá cao\n\nchỗ này là bẫy\n\n✗ 安いほどよい/高いほどよい = sai hoàn toàn cấu trúc và nghĩa (không khớp いくら〜ても)\n\n✗ 安くても安すぎる = sai hướng, bài đang nói về giá ĐẮT chứ không phải rẻ","sentence":"いくら【3】ということはないと思うし、実際はそれが数百円から手に入るのですから、少しでも興味のある本があったら買わない手はないでしょう。"}]}]},{"id":"r9","name":"第9回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"真相が明らかになったからには、会長も責任をとって辞任（　）だろう。","o":["せずにはおかない","せずにはすまない","を禁じ得ない","を余儀なくする"],"a":2,"vi":"Một khi sự thật đã sáng tỏ, chắc chắn chủ tịch cũng sẽ phải từ chức để chịu trách nhiệm.","hint":"Thấy「からには〜＿＿だろう」→ chọn せずにはおかない\n✔ 〜ずにはおかない =「chắc chắn sẽ...」(hệ quả tất yếu không tránh khỏi)"},{"q":"私は借金を（　）いい車を買いたいとは思わない。","o":["してこそ","してまで","したところで","したからには"],"a":2,"vi":"Tôi không nghĩ là mình muốn mua xe đẹp đến mức phải đi vay nợ.","hint":"Thấy「借金を＿＿いい車を買いたくない」→ chọn してまで\n✔ Vて形＋まで =「đến mức phải...」(thủ đoạn quá đáng/cực đoan)\n✘ してこそ = chính nhờ...mới (tích cực)"},{"q":"娘は「こんなものいらない」と（　）、ぬいぐるみを放り投げた。","o":["言わんばかりに","言わんがために","言おうと言うまいと","言うものとして"],"a":1,"vi":"Con gái vừa nói \"Cái này con không cần\" vừa ném con thú nhồi bông đi như muốn nói rõ thái độ.","hint":"Thấy「こんなものいらない＿＿、ぬいぐるみを放り投げた」→ chọn 言わんばかりに\n✔ 〜んばかりに =「như muốn nói rằng...」(hành động thể hiện ngầm điều chưa nói ra)"},{"q":"四月（　）夜は冷えるから、外出時は上着を着ていったほうがいい。","o":["にせよ","ときたら","とはいえ","にひきかえ"],"a":3,"vi":"Tuy là tháng tư nhưng buổi tối vẫn lạnh, nên khi ra ngoài tốt nhất nên mặc thêm áo khoác.","hint":"Thấy「四月＿＿夜は冷える」→ chọn とはいえ\n✔ 〜とはいえ =「tuy nói là...nhưng」(thừa nhận sự thật rồi đưa ra điều ngược lại)\n✘ にせよ = dù là (nhượng bộ điều kiện)"},{"q":"以前銀行に勤めていた（　）、彼は金融には詳しい。","o":["だけあって","ばかりに","ことだから","せいで"],"a":1,"vi":"Vì từng làm ở ngân hàng nên anh ấy am hiểu về tài chính.","hint":"Thấy「以前銀行に勤めていた＿＿詳しい」→ chọn だけあって\n✔ 〜だけあって =「đúng là...xứng đáng」(lý do + kết quả tương xứng)\n✘ せいで = vì (nguyên nhân xấu, dùng khi kết quả tiêu cực)"},{"q":"彼女は努力に努力（　）、今の地位を築き上げた。","o":["を重ねて","を兼ねて","と相まって","もかまわず"],"a":1,"vi":"Cô ấy đã nỗ lực không ngừng để xây dựng được vị trí như ngày hôm nay.","hint":"Thấy「努力に努力＿＿今の地位」→ chọん を重ねて\n✔ N（動作）にN＋を重ねる =「lặp đi lặp lại, chồng chất」(cố định: 努力に努力を重ねる)"},{"q":"A社は投資するに（　）、将来性のある企業だ。","o":["至る","足る","至らない","足りない"],"a":2,"vi":"Công ty A là một doanh nghiệp có triển vọng, đáng để đầu tư.","hint":"Thấy「A社は投資するに＿＿企業だ」→ chọn 足る\n✔ V辞書形＋に足る =「đáng để...」(có đủ giá trị/tư cách)\n✘ 至る = đạt đến (nghĩa khác)"},{"q":"ほかの家は（　）、うちでは子どもがトイレ掃除をするのが決まりだ。","o":["いざ知らず","ものともせず","かかわらず","とどまらず"],"a":1,"vi":"Nhà khác thì tôi không biết, nhưng nhà tôi thì quy định trẻ con phải dọn nhà vệ sinh.","hint":"Thấy「ほかの家は＿＿うちでは」→ chọン はいざ知らず\n✔ N＋はいざ知らず =「...thì không biết, nhưng (nhà tôi thì)」(đặt vấn đề rồi nói về mình)"},{"q":"負けたという結果は（　）、今日の試合の内容はすばらしかった。","o":["おろか","及ばず","さておき","踏まえて"],"a":3,"vi":"Tạm gác kết quả thua cuộc sang một bên, nội dung trận đấu hôm nay thực sự rất hay.","hint":"Thấy「負けたという結果は＿＿内容はすばらしかった」→ chọン さておき\n✔ N＋はさておき =「tạm gác...sang một bên」(bỏ qua chủ đề để nói điều khác)"},{"q":"理由によらず、遅刻した者は試験を受けることはできない（　）。","o":["始末だ","つもりだ","ものとする","というところだ"],"a":3,"vi":"Bất kể lý do gì, người đến muộn đều không được phép vào thi.","hint":"Thấy「〜受けることはできない＿＿」→ chọン ものとする\n✔ V辞書形＋ものとする =「quy định là phải...」(điều khoản/quy tắc, văn bản pháp lý)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"この町は、交通の便 ___ ___ ★ ___ いい環境だ。","o":["には","悪いが","こそ","子育て"],"a":4,"order":[3,2,4,1],"vi_p2":"Thị trấn này tuy giao thông bất tiện nhưng là môi trường tốt để nuôi con."},{"q":"苦しんだ ___ ___ ★ ___ 、他人に譲りわたす気になれない。","o":["末に","作品","作り上げた","だけに"],"a":2,"order":[1,3,2,4],"vi_p2":"Đây là tác phẩm đã đổ không biết bao mồ hôi nước mắt mới tạo ra được, nên không muốn nhường cho ai."},{"q":"あなたが ___ ___ ★ ___ はもう変えられない。","o":["が","この決定","いかに","反対しよう"],"a":1,"order":[3,4,1,2],"vi_p2":"Dù bạn phản đối thế nào thì quyết định này cũng không thể thay đổi được nữa rồi."},{"q":"私財を投じて ___ ___ ★ ___ 監督の姿に心を打たれた。","o":["映画を","まで","という","完成させよう"],"a":4,"order":[2,1,4,3],"vi_p2":"Tôi rất cảm phục tấm lòng của đạo diễn khi bỏ cả tiền túi ra để hoàn thành bộ phim."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"コミュニケーションが欠落すると、例えば学生なら学校自体に興味がなくなり、すなわち学力低下に繋がります。同じくサラリーマンなら、会社での居心地が悪くなる上に効率も下がり、仕事力の低下に繋がります。\nコミュニケーションとは、本音を引き出す【1】重要なものである以上に、有意義な社会生活を送るために不可欠なものなのです。\nそもそも、人間が地球の中心となる生き物になれたのは、集団で生活してきたからです。集団で生活してきた【2】、ライオンやトラなどの一対一だったら負けてしまうような生き物との戦いにも勝ち、生き延びることができた。そして、【3-a】勝って生き延びることができた【3-b】、ディスカッションというコミュニケーションを取り、勝つための作戦を立てたからです。原始の頃より、孤立しては生きられないという事実を、人間はちゃんとわかっていたのです。\n（田原総一朗著『田原式つい本音を言わせてしまう技術』幻冬舎刊　※一部省略あり）","items":[{"label":"1","o":["上で","あげく","一方","かわりに"],"a":1,"hint":"Dạng câu hỏi: Liên kết 2 khía cạnh (一方)\n\nQuan hệ A-B: A (công cụ khơi ra suy nghĩ thật) và B (thứ không thể thiếu cho đời sống xã hội) là 2 vai trò của cùng một khái niệm communication, nối bằng 一方.\n\n「コミュニケーションとは、本音を引き出す【1】重要なものである以上に…不可欠」→ liên kết 2 khía cạnh của communication → chọn ③ 一方\n→ 一方 = 'một mặt là...(mặt khác/hơn nữa là)' nối 2 vai trò của communication\n\nchỗ này là bẫy\n\n✗ 上で = sai ngữ pháp vị trí (cần Vた上で)\n\n✗ あげく = 'cuối cùng (sau vất vả)' — sai nghĩa hoàn toàn\n\n✗ かわりに = 'thay vì' — sai nghĩa","sentence":"コミュニケーションとは、本音を引き出す【1】重要なものである以上に、有意義な社会生活を送るために不可欠なものなのです。"},{"label":"2","o":["以上","からこそ","とはいえ","ばかりに"],"a":2,"hint":"Dạng câu hỏi: Nguyên nhân — kết quả tích cực (からこそ)\n\nQuan hệ A-B: A (sống theo bầy đàn) là NGUYÊN NHÂN trực tiếp dẫn đến B (thắng và sống sót) — kết quả TỐT nên chọn からこそ, không phải ばかりに (luôn đi với hậu quả xấu).\n\n「集団で生活してきた【2】、ライオンやトラ…にも勝ち、生き延びることができた」→ NGUYÊN NHÂN-KẾT QUẢ tích cực → chọn ② からこそ\n→ からこそ = chính vì...mà (kết quả TỐT — sống sót, thắng)\n\nchỗ này là bẫy\n\n✗ 以上 = cần cấu trúc nghĩa vụ Vる以上は, không khớp\n\n✗ とはいえ = tạo tương phản không hợp (câu này không có tương phản)\n\n✗ ばかりに = luôn đi với HẬU QUẢ XẤU, ở đây kết quả là tích cực nên sai","sentence":"集団で生活してきた【2】、ライオンやトラなどの一対一だったら負けてしまうような生き物との戦いにも勝ち、生き延びることができた。"},{"label":"3","o":["a いくら／b からといって","a なぜ／b のかといえば","a たしかに／b かもしれませんが","a たとえ／b としても"],"a":2,"hint":"Dạng câu hỏi: Tự hỏi — tự đáp (なぜ~のかといえば)\n\nQuan hệ A-B: A là câu hỏi tu từ 'tại sao lại thắng và sống sót', B (câu sau kết thúc bằng からです) là câu trả lời — mẫu hỏi-đáp cố định.\n\n「【3-a】勝って生き延びることができた【3-b】、ディスカッション…からです」→ mẫu tự hỏi-tự đáp → chọn ② なぜ/のかといえば\n→ なぜ〜のかといえば〜からです = 'nếu nói tại sao... thì (là vì)...' rất phổ biến trong văn nghị luận\n\nchỗ này là bẫy\n\n✗ いくら/からといって, たとえ/としても = sai hoàn toàn cấu trúc và nghĩa (nhượng bộ, không phải hỏi-đáp)\n\n✗ たしかに/かもしれませんが = sai, không khớp mạch hỏi-đáp","sentence":"そして、【3-a】勝って生き延びることができた【3-b】、ディスカッションというコミュニケーションを取り、勝つための作戦を立てたからです。"}]}]},{"id":"r10","name":"第10回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"どれほど金を稼いでも死んで（　）。あの世には持っていけないのだから。","o":["しまえばそれまでだ","しまうまでもない","しまってかなわない","しまうったらありゃしない"],"a":1,"vi":"Dù kiếm được bao nhiêu tiền, một khi chết đi là hết, vì không thể mang theo sang thế giới bên kia.","hint":"Thấy「死んで＿＿あの世には持っていけない」→ chọn しまえばそれまでだ\n✔ 〜ばそれまでだ =「nếu...thì coi như hết, chấm dứt mọi chuyện」"},{"q":"すみません。あれはただの冗談で、怒らせる（　）なんてなかったんです。","o":["かい","べき","わけ","つもり"],"a":4,"vi":"Xin lỗi, đó chỉ là một câu đùa, tôi hoàn toàn không có ý định làm anh/chị giận.","hint":"Thấy「怒らせる＿＿なんてなかった」→ chọn つもり\n✔ V辞書形＋つもり（はなかった） =「không có ý định...」"},{"q":"主役が舞台に登場したとたん、割れ（　）拍手が起きた。","o":["かねない","つつある","てばかりの","んばかりの"],"a":4,"vi":"Ngay khi diễn v
