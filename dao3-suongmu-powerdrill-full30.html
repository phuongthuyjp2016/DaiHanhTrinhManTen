<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語パワードリル N1 文法 — 全30回 クイズ</title>
<style>
:root{
  --washi:#f6f1e7;
  --washi-deep:#efe7d6;
  --ink:#222220;
  --ink-soft:#5a5650;
  --hanko:#9c3b3b;
  --hanko-deep:#7c2c2c;
  --gold:#b08d3e;
  --line:#d8cdb4;
  --ok:#3c6e47;
  --ng:#9c3b3b;
  --card:#fffdf8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--washi);
  background-image:
    radial-gradient(circle at 10% 8%, rgba(176,141,62,0.07), transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(156,59,59,0.06), transparent 45%);
  color:var(--ink);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  min-height:100vh;
  padding-bottom:60px;
}
.wrap{max-width:880px;margin:0 auto;padding:0 18px;}

header.top{
  padding:38px 18px 26px;
  text-align:center;
  position:relative;
}
header.top .tag{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:11px;
  letter-spacing:.32em;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:10px;
}
header.top h1{
  font-size:clamp(26px,5vw,38px);
  margin:0 0 6px;
  letter-spacing:.04em;
  font-weight:600;
}
header.top .sub{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:13px;
  color:var(--ink-soft);
  letter-spacing:.02em;
}
.hanko-mark{
  position:absolute;
  top:18px;right:18px;
  width:46px;height:46px;
  border:2px solid var(--hanko);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--hanko);
  font-size:18px;
  font-weight:700;
  transform:rotate(-4deg);
  background:rgba(156,59,59,0.05);
}

nav.crumb{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:12px;
  color:var(--ink-soft);
  display:none;
  gap:6px;
  align-items:center;
  margin:0 0 18px;
}
nav.crumb button{
  background:none;border:none;color:var(--hanko);cursor:pointer;
  font-family:inherit;font-size:12px;padding:0;text-decoration:underline;
}

/* ---- Home screen ---- */
section#home{}
.section-label{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);margin:34px 0 12px;
  display:flex;align-items:center;gap:10px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:10px;
}
.tile{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:4px;
  padding:14px 10px 12px;
  text-align:center;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  font-family:"Helvetica Neue",Arial,sans-serif;
  position:relative;
}
.tile:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(60,40,20,.10);
  border-color:var(--hanko);
}
.tile .num{
  font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
  font-size:20px;font-weight:700;color:var(--ink);
}
.tile .lab{font-size:10px;color:var(--ink-soft);margin-top:2px;}
.tile .score-pill{
  margin-top:8px;font-size:10px;
  display:inline-block;padding:2px 8px;border-radius:20px;
  background:var(--washi-deep);color:var(--ink-soft);
}
.tile.done .score-pill{background:#e7efe7;color:var(--ok);}
.tile.train{background:#fbf7ec;}

/* ---- Quiz screen ---- */
section#quiz{display:none;}
.quiz-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:18px;flex-wrap:wrap;gap:10px;
}
.quiz-head h2{margin:0;font-size:24px;}
.quiz-head .meta{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--ink-soft);}

.part{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:6px;
  padding:20px 20px 6px;
  margin-bottom:22px;
}
.part-title{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:12px;color:var(--hanko);font-weight:700;
  letter-spacing:.04em;
  margin-bottom:14px;
  padding-bottom:8px;
  border-bottom:1px dashed var(--line);
}
.passage{
  background:var(--washi-deep);
  border-left:3px solid var(--gold);
  padding:14px 16px;
  margin-bottom:18px;
  font-size:15px;
  line-height:1.9;
  white-space:pre-wrap;
  border-radius:2px;
}
.q-item{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.q-item:last-child{border-bottom:none;}
.q-num{
  font-family:"Helvetica Neue",Arial,sans-serif;
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:var(--washi);
  font-size:11px;margin-right:8px;vertical-align:middle;
}
.q-text{font-size:16px;line-height:1.85;display:inline;}
.opts{margin-top:10px;display:grid;gap:6px;}
.opt{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border:1px solid var(--line);border-radius:4px;
  cursor:pointer;font-size:14.5px;
  transition:background .12s, border-color .12s;
  background:#fffefb;
}
.opt:hover{border-color:var(--gold);}
.opt input{accent-color:var(--hanko);}
.opt .oi{
  font-family:"Helvetica Neue",Arial,sans-serif;
  width:18px;height:18px;border:1px solid var(--ink-soft);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;flex:0 0 auto;color:var(--ink-soft);
}
.opt.sel{border-color:var(--hanko);background:#fbf0ef;}
.opt.sel .oi{background:var(--hanko);border-color:var(--hanko);color:#fff;}
.opt.correct{border-color:var(--ok);background:#eef6ee;}
.opt.correct .oi{background:var(--ok);border-color:var(--ok);color:#fff;}
.opt.wrong{border-color:var(--ng);background:#fbecec;}
.opt.wrong .oi{background:var(--ng);border-color:var(--ng);color:#fff;}
.explain{
  margin-top:10px;
  background:#f1f6f1;
  border-left:3px solid var(--ok);
  padding:10px 14px;
  border-radius:2px;
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:13px;
  line-height:1.7;
  color:#2f4a35;
  display:none;
}
.explain b{color:var(--ok);}
.explain.show{display:block;}
.explain.bad{background:#fbecec;border-left-color:var(--ng);color:#5a2a2a;}
.explain.bad b{color:var(--ng);}
.hint-box{
  margin-top:10px;
  background:#fdf8ec;
  border-left:3px solid var(--gold);
  padding:9px 14px;
  border-radius:2px;
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:12.5px;
  line-height:1.7;
  color:#5a4a1a;
  display:none;
}
.hint-box.show{display:block;}
.ab-row{display:flex;gap:10px;margin-top:10px;}
.ab-row .opt{flex:1;justify-content:center;text-align:center;}

.notebox{
  background:#fbf3e3;border:1px solid var(--gold);
  padding:12px 14px;border-radius:4px;font-size:13px;color:#6b531f;
  margin-bottom:18px;font-family:"Helvetica Neue",Arial,sans-serif;
}

.actions{
  display:flex;gap:12px;justify-content:center;margin:30px 0 10px;flex-wrap:wrap;
}
button.btn{
  font-family:"Helvetica Neue",Arial,sans-serif;
  border:none;padding:13px 30px;border-radius:30px;
  font-size:14px;letter-spacing:.03em;cursor:pointer;
  background:var(--hanko);color:#fff;
  transition:background .15s, transform .1s;
}
button.btn:hover{background:var(--hanko-deep);transform:translateY(-1px);}
button.btn.ghost{
  background:transparent;color:var(--ink);border:1px solid var(--ink-soft);
}
button.btn.ghost:hover{border-color:var(--hanko);color:var(--hanko);}

.score-banner{
  text-align:center;padding:22px;margin-bottom:24px;
  background:linear-gradient(135deg,#fff,#fbf3e3);
  border:1px solid var(--gold);border-radius:8px;
}
.score-banner .big{font-size:42px;font-weight:700;color:var(--hanko);}
.score-banner .small{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--ink-soft);margin-top:4px;}

footer{
  text-align:center;font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:11px;color:var(--ink-soft);margin-top:50px;padding:20px;
}
@media (max-width:480px){
  .tile{padding:12px 6px;}
  .part{padding:16px 14px 4px;}
}
</style>
</head>
<body>

<header class="top">
  <div class="hanko-mark">N1</div>
  <div class="tag">Nihongo Power Drill</div>
  <h1>日本語パワードリル 文法</h1>
  <div class="sub">全30回 + 集中トレーニング10回　インタラクティブ問題集</div>
</header>

<div class="wrap">
  <nav class="crumb" id="crumb"><button onclick="goHome()">⟵ 一覧へ戻る</button></nav>

  <section id="home">
    <div class="section-label">文法 第1回〜第30回</div>
    <div class="grid" id="roundGrid"></div>

    <div class="section-label">集中トレーニング</div>
    <div class="grid" id="trainGrid"></div>
  </section>

  <section id="quiz">
    <div class="quiz-head">
      <h2 id="quizTitle"></h2>
      <div class="meta" id="quizMeta"></div>
    </div>
    <div id="scoreArea"></div>
    <div id="quizBody"></div>
    <div class="actions">
      <button class="btn ghost" onclick="goHome()">一覧へ戻る</button>
      <button class="btn ghost" id="retryBtn" onclick="retryQuiz()">もう一度やる</button>
    </div>
  </section>
</div>

<footer>日本語パワードリル N1 文法（アスク出版）をもとに作成 / 自習用クイズ</footer>

<script>
/* ===== DATA injected below ===== */
const QUIZ_DATA={"rounds":[{"id":"r1","name":"第1回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"どんなに片づけた（　）、すぐにまた子どもたちが散らかしてしまう。","o":["ところが","ところで","としたら","とはいえ"],"a":2,"vi":"Dù có dọn dẹp kỹ đến đâu, bọn trẻ cũng sẽ lại bày bừa ra ngay lập tức.","hint":"「どんなに〜ても」ペア → 前に「た形」があれば「ところで」(dù...cũng vô ích)。「ところが」は逆接、「としたら」は仮定と区別する。"},{"q":"私が集合時間に遅れた（　）、みんなが新幹線に乗り遅れてしまった。","o":["ばかり","ばかりで","ばかりに","ばかりの"],"a":3,"vi":"Chỉ vì tôi đến muộn giờ tập trung mà mọi người đã lỡ chuyến tàu Shinkansen.","hint":"後ろに悪い結果 → 「〜ばかりに」が原因強調。選択肢に「ばかりに/ばかりで/ばかりの」→ 結果が悪いなら「に」。"},{"q":"その大臣は政治家に（　）発言をしたため、辞任することになった。","o":["ありながら","あるまいし","あるまじき","ありやしない"],"a":3,"vi":"Vị bộ trưởng đó đã phải từ chức vì có phát ngôn không xứng đáng với một chính trị gia.","hint":"「政治家に___発言」→ 職業/地位＋に＋「あるまじき」の固定パターン。「不適切な発言」に対する強い批判表現。"},{"q":"彼女は人気のアイドルだが、歌は下手すぎて（　）。","o":["聞くほかはない","聞くにたえない","聞かずにはいられない","聞かずにはすまない"],"a":2,"vi":"Cô ấy là thần tượng nổi tiếng, nhưng hát thì dở đến mức không nghe nổi.","hint":"「下手すぎて___」→ 程度が激しくて耐えられない→「聞くにたえない」。「聞くほかはない」は仕方なく聞く。"},{"q":"新しい家に飾る絵を探しているが、なかなか（　）というものが見つからない。","o":["これか","これは","これさえ","これだけ"],"a":2,"vi":"Đang tìm bức tranh để treo trong nhà mới nhưng mãi không tìm được bức nào ưng ý (kiểu \"chính là cái này\").","hint":"「なかなか___というものが見つからない」→ 探しているものを指す「これは」。「これだけ」「これさえ」は量/条件を表す。"},{"q":"もう二度とたばこは吸う（　）誓った。","o":["まいと","ことなしに","までもなく","べからずと"],"a":1,"vi":"Tôi đã thề sẽ không bao giờ hút thuốc nữa.","hint":"「もう二度と〜___誓った」→ 決意の否定→「まい」(しないという意志)＋「と誓った」の固定コロケーション。"},{"q":"全品半額セール（　）、スーパーの前には早朝から行列ができていた。","o":["とあって","とすると","といっても","となっては"],"a":1,"vi":"Vì có chương trình giảm giá 50% toàn bộ sản phẩm nên trước cửa siêu thị đã xếp hàng dài từ sáng sớm.","hint":"「半額セール___行列」→ 特別な状況（セール）が原因→「とあって」（理由・背景）。「とすると」は仮定。"},{"q":"今期の売り上げ（　）、閉店せざるを得ないだろう。","o":["としては","ならでは","をよそには","いかんでは"],"a":4,"vi":"Tùy theo doanh thu kỳ này mà có thể sẽ phải đóng cửa tiệm.","hint":"「売り上げ___閉店」→ 売り上げ次第で結果が変わる→「いかんでは」(tùy theo)。「としては」は立場を表す。"},{"q":"この東京での公演（　）、全国各地で演奏会を開くことになった。","o":["において","をもって","にもまして","を皮切りに"],"a":4,"vi":"Lấy buổi biểu diễn ở Tokyo lần này làm khởi đầu, họ sẽ tổ chức các buổi hòa nhạc khắp cả nước.","hint":"「東京での公演___全国」→ 最初の出来事を起点に広がる→「を皮切りに」の固定表現。「において」は場所のみ。"},{"q":"子どもが生まれる（　）今の家じゃ狭いから、引っ越しも考えなくては。","o":["だけでは","となると","にしたら","くらいなら"],"a":2,"vi":"Một khi có con thì căn nhà hiện tại sẽ chật, nên cũng phải tính đến chuyện chuyển nhà.","hint":"「子どもが生まれる___狭い」→ 条件が成立したら問題が生じる→「となると」。「だけでは」は不十分の意。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"水着を着るたびに、___ ___ ★ ___ なかなか体重が減らない。","o":["思いながらも","までには","やせようと","次の夏"],"a":3},{"q":"温暖化の問題は ___ ___ ★ ___ 考えなければ解決しない。","o":["ただ","のみならず","地球規模で","一国"],"a":2},{"q":"明日 ___ ___ ★ ___ 中止になることはないそうだ。","o":["雨が","降るまいが","試合が","降ろうが"],"a":2},{"q":"車の運転ができれば ___ ___ ★ ___ 都会なら不自由はない。","o":["ないけれど","それに","できなくても","越したことは"],"a":1}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"苦情を言うことは、本来何も悪いことではありません。むしろ、毅然とした態度でちゃんと苦情を言うのは、客として必要な能力なのだと思っています。\n苦情を言う目的とは、何でしょうか。次回買い物するときに、不利益や不都合がなく、気持ちよく買い物したいという希望を店に伝えることだと、私は考えています。自分がふだん買い物する店をよくしたいと【1】、苦情を言うのです。\n苦情を言うのは、店にとって不愉快なことを伝えるわけですから、ちょっと気がひけます。できたら、【2】ものでもあります。にもかかわらず、わざわざ苦情を言うのは、自分が次に来たときには気持ちよく買い物したいからです。\nこのとき、「自分は店をよくしてやっているんだ」という恩着せがましい考えを持つのはよくありません。この考えを持つ【3】、いずれ暴言を吐く「お客様」になっていくでしょうから。\n（森真一著『「お客様」がやかましい』筑摩書房刊）","items":[{"label":"1","o":["思うことからして","思うからといって","思っているからこそ","思っているからには"],"a":3},{"label":"2","o":["していきたい","しておきたい","せずにはすまない","せずにすませたい"],"a":4},{"label":"3","o":["手前","かぎり","ばかりに","ものなら"],"a":2}]}]},{"id":"r2","name":"第2回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"病気が初期に見つかったからいい（　）、もう少し発見が遅かったら命が危なかった。","o":["とばかりに","かと思いきや","というものの","ようなものの"],"a":4,"vi":"Tuy nói là may vì phát hiện bệnh sớm, nhưng nếu phát hiện muộn hơn một chút thì đã nguy hiểm đến tính mạng.","hint":"「からいい___、〜危なかった」→ 前半は良かった逆接+後半悪い仮定→「ようなものの」(may mà...nhưng nếu)。"},{"q":"夢を実現させるものは、努力（　）ほかにない。","o":["いかんで","を抜きに","をおいて","ならでは"],"a":3,"vi":"Thứ duy nhất giúp biến ước mơ thành hiện thực chính là nỗ lực, không có gì khác.","hint":"「努力___ほかにない」→「〜をおいてほかにない」の固定表現。「〜をおいて」=しか/しかない、唯一性を表す。"},{"q":"結果を聞く（　）息子の表情から、不合格だったことがわかった。","o":["どころか","はおろか","わけもなく","までもなく"],"a":4,"vi":"Chỉ cần nhìn vẻ mặt của con trai là biết ngay nó trượt, không cần phải hỏi kết quả.","hint":"「結果を聞く___表情からわかった」→ 聞くことが不要なほど明らか→「までもなく」。「まで」は程度を超えた。"},{"q":"うちの父（　）週末はゴルフばかりで、家族とのコミュニケーションがまったくない。","o":["ときたら","としたら","としても","といっても"],"a":1,"vi":"Nói đến bố tôi thì cuối tuần lúc nào cũng chỉ chơi golf, hoàn toàn không giao tiếp với gia đình.","hint":"「うちの父___ゴルフばかり」→ 人の困った特徴を話題にする→「ときたら」(nói đến...thì)。批判のニュアンス。"},{"q":"部屋の中にどこから（　）涼しい風が入ってきた。","o":["とはいえ","ともなく","はいざ知らず","はさておき"],"a":2,"vi":"Có một làn gió mát thổi vào phòng từ đâu đó không rõ.","hint":"「どこから___風」→ 出所が不明な自然現象→「ともなく」。「はいざ知らず」は知らないことを前置きする別の用法。"},{"q":"毎年お正月をハワイで過ごす友人がうらやましい（　）だ。","o":["限り","至り","だらけ","ばかり"],"a":1,"vi":"Thật ghen tị với người bạn năm nào cũng đón Tết ở Hawaii.","hint":"「うらやましい___だ」→「〜の限りだ」=感情の極致表現。「だらけ」は汚れ/欠点の充満、「至り」は別の極致表現。"},{"q":"引っ越しの（　）いろいろと手伝っていただき、ありがとうございました。","o":["折から","折には","機に","機会に"],"a":2,"vi":"Cảm ơn anh/chị đã giúp đỡ nhiều việc nhân dịp chuyển nhà.","hint":"「引っ越しの___手伝っていただき」→ そのタイミングを指す丁寧表現→「折には」(nhân dịp)。「折から」はその時期。"},{"q":"電気はつけっぱなし、服は出しっぱなしで、本当にだらしない（　）。","o":["までもない","に越したことない","ってわけがない","ったらありゃしない"],"a":4,"vi":"Điện thì cứ để bật, quần áo thì vứt bừa bãi, đúng là luộm thuộm hết chỗ nói.","hint":"「だらしない___」→ 体言に直接つく口語の極端強調→「ったらありゃしない」。「までもない」は不要を表す。"},{"q":"この店のパンは大人気で、棚に並ぶが（　）売り切れてしまう。","o":["最後","いなや","早いか","そばから"],"a":3,"vi":"Bánh mì của tiệm này rất hút khách, cứ bày lên kệ là bán hết ngay lập tức.","hint":"「棚に並ぶが___売り切れ」→ 並ぶと同時に売り切れ→「が早いか」(vừa...thì ngay)。「いなや」も近いが「が早いか」は主体に注目。"},{"q":"彼はとても優秀な社員だが、どうも協調性に欠ける（　）。","o":["始末だ","にとどまらない","ぐらいのものだ","きらいがある"],"a":4,"vi":"Anh ấy là nhân viên rất giỏi, nhưng có khuynh hướng thiếu tinh thần hợp tác.","hint":"「どうも___欠ける」→ 無意識の傾向・癖を表す→「きらいがある」。「始末だ」は悪い結果に使う。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"チームの調子は ___ ___ ★ ___ 優勝するのは難しいだろう。","o":["つつある","徐々に","とはいえ","よくなり"],"a":1},{"q":"人気のレストランですから、二人 ___ ___ ★ ___ 予約できませんよ。","o":["なんて","ともかく","なら","十人"],"a":4},{"q":"毎日の家事が ___ ___ ★ ___ はじめてわかった。","o":["いかに","して","一人暮らしを","大変か"],"a":3},{"q":"毎年とは ___ ___ ★ ___ 海外旅行をしたい。","o":["までも","一度は","何年かに","言わない"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"メールが【1-a】普及した【1-b】、手紙や電話がなくなるわけではないだろう。コミュニケーションの密度でいえば直接会って話をするのが一番だ。顔色でからだの調子が悪いのかなと思ったり、電話なら相手の声の調子からも情報を得ることができる。手紙やファックスの場合でも、筆跡から伝わるものがある。\nメールというのは極端に効率化されたメディアである【2】、伝わるのはそこに書かれた用件だけだ。だから用件を伝えるのが主要目的であるときに圧倒的に威力を発揮する。逆に用件そのものではなく、自分の感情や思いを伝えたいような場合は、それ以外のツールを用いたほうがいいかも知れない。ラブレターや海外からの絵葉書をメールで代用するのはおそらく無理【3】。\n（村上龍著『eメールの達人になる』集英社刊）","items":[{"label":"1","o":["a どれだけ／b からこそ","a どれだけ／b からといって","a いかにも／b からこそ","a いかにも／b からといって"],"a":2},{"label":"2","o":["だけで","だけに","だけは","だけでも"],"a":2},{"label":"3","o":["なのか","だろうか","もないだろうか","ではないだろうか"],"a":4}]}]},{"id":"r3","name":"第3回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"この国の経済が回復するのは、いったいいつになる（　）。","o":["ものだ","こととは","ことやら","ものなら"],"a":3,"vi":"Kinh tế nước này không biết đến bao giờ mới phục hồi được.","hint":"「いったい___ことやら」→ 「いったい」がセット→ 疑問・不安→「ことやら」(không biết...thế nào)。「ものだ」は当然性。"},{"q":"こんな確かな証拠を見せられたら、彼も自分の罪を（　）だろう。","o":["認めざるを得ない","認めずにおかない","認めるには及ばない","認めるわけにはいかない"],"a":1,"vi":"Khi bị đưa ra bằng chứng xác thực thế này, chắc anh ta cũng phải thừa nhận tội của mình thôi.","hint":"「確かな証拠を見せられたら___」→ 状況的に否応なく→「ざるを得ない」(buộc phải)。「わけにはいかない」は社会的禁止。"},{"q":"結婚も決まったし、宝くじにも当たったし、今年はいいこと（　）だ。","o":["並み","ずくめ","まみれ","っぱなし"],"a":2,"vi":"Vừa quyết định kết hôn, lại còn trúng số, năm nay toàn chuyện tốt lành.","hint":"「結婚も決まったし、宝くじも当たったし___」→ 良いことが全て→「ずくめ」(toàn là điều tốt)。「まみれ」は汚れに使う。"},{"q":"会社が悪い（　）部下が悪い（　）、彼はいつも文句ばかり言っている。","o":["だの／だの","なり／なり","にも／にも","といい／といい"],"a":1,"vi":"Anh ta lúc nào cũng than phiền, nào là công ty không tốt, nào là cấp dưới không ra gì.","hint":"「会社が悪い___部下が悪い___、文句ばかり」→ 不満を並べる→「だの〜だの」(nào là...nào là)。「なり〜なり」は選択肢。"},{"q":"隣の家の犬が朝から晩までほえるから、うるさくて（　）。","o":["すまない","やまない","かなわない","かまわない"],"a":3,"vi":"Con chó nhà hàng xóm sủa suốt từ sáng đến tối, ồn đến mức không chịu nổi.","hint":"「うるさくて___」→ 状態が耐えられない→「かなわない」(chịu không nổi)。「すまない」は謝罪/義務感。"},{"q":"けんかをして（　）、彼からは電話もメールもない。","o":["からには","からすると","からといって","からというもの"],"a":4,"vi":"Kể từ sau khi cãi nhau, anh ấy không gọi điện cũng chẳng nhắn tin gì cả.","hint":"「けんかをして___電話もない」→ けんかの後から継続的に→「からというもの」(kể từ khi)。「からには」は義務の条件。"},{"q":"彼女は私の紹介したカフェが気に入った（　）、毎日のように行っているそうだ。","o":["がごとく","が早いか","とみえて","と思いきや"],"a":3,"vi":"Có vẻ cô ấy rất thích quán cà phê tôi giới thiệu nên ngày nào cũng ghé.","hint":"「毎日のように行っている___」→ 行動から推測→「とみえて」(có vẻ như)。「が早いか」は即時性。"},{"q":"息子は学校から帰る（　）、ランドセルを置いてゲームを始めた。","o":["なら","なり","ながら","なりに"],"a":2,"vi":"Con trai vừa về đến nhà là đặt cặp xuống rồi chơi game ngay.","hint":"「帰る___ランドセルを置いて」→ 帰宅と同時に次の動作→「なり」(vừa mới...là). 「ながら」は同時進行。"},{"q":"私に（　）、A党もB党も、政権を任せるには頼りない。","o":["至っては","ひきかえ","言わせれば","とどまらず"],"a":3,"vi":"Nếu để tôi nói thì cả đảng A lẫn đảng B đều không đáng tin để giao chính quyền.","hint":"「私に___A党もB党も頼りない」→ 自分の意見を述べる→「言わせれば」(nếu để tôi nói thì)。「至っては」は程度の極み。"},{"q":"市場調査の結果（　）、新しい店を出す場所を決めた。","o":["いかんで","なしには","に即して","を踏まえて"],"a":4,"vi":"Dựa trên kết quả khảo sát thị trường, họ đã quyết định địa điểm mở cửa hàng mới.","hint":"「調査結果___店を出す場所を決めた」→ データを根拠に行動→「を踏まえて」(dựa trên)。「に即して」も近いが「踏まえて」は判断根拠。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"急いでいるとき ___ ___ ★ ___ するものだ。","o":["電車が遅れて","に","いたり","限って"],"a":1},{"q":"父は昔スポーツ選手だった ___ ___ ★ ___ あるといつも言っている。","o":["自信が","あって","体力には","だけ"],"a":3},{"q":"北海道は ___ ___ ★ ___ 暖かかった。","o":["と思いきや","寒いか","東京より","どんなに"],"a":1},{"q":"携帯電話の普及率は10年前 ___ ___ ★ ___ 上がった。","o":["ほど","とは","ならない","比べものに"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"音楽の好きな人は、外国語の上達も早いものです。また逆に、外国語の習得の早い人のなかには、音楽好きが多いもの。英語の勉強でも、文法の公式を覚え、単語をがむしゃらに暗記している【1-a】、なかなか英語の〈こころ〉【1-b】つかめません。ある程度英語が読めるようになったら、あるいはこれまでの英語の勉強に行きづまったなら、英語の歌にとっぷりひたってみてはどうでしょう。英語のもつ独特のリズムが理屈抜きに体にしみ込み、にわかに英語が身近なものになるはずです。身体が英語のリズムで動きはじめると、言葉は自然にあとからついて出てくるものです。\nどこの国の【2-a】にも、その国の【2-b】のいちばん美しいところが反映されています。そのうえ民謡や古謡、童謡には、その文化圏の人びとが何世紀にもわたって【3】夢や喜びや悲しみが込められているので、たとえ小さなわらべ歌一つからも、その国の長い歴史や風土の持つ雰囲気がじかに伝わってきます。\n（河野一郎著『英語の歌』岩波書店刊）","items":[{"label":"1","o":["a だけでは／b すら","a くらいなら／b すら","a だけでは／b までは","a くらいなら／b までは"],"a":3},{"label":"2","o":["a 言葉／b リズム","a 言葉／b 歌","a 歌／b リズム","a 歌／b 言葉"],"a":4},{"label":"3","o":["抱いた","抱きぬいた","抱いてやまない","抱きつづけてきた"],"a":4}]}]},{"id":"r4","name":"第4回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"会社が経営不振で、退職（　）。","o":["には及ばなかった","を禁じ得なかった","を余儀なくされた","するべくもなかった"],"a":3,"vi":"Vì công ty làm ăn khó khăn nên anh ấy buộc phải nghỉ việc.","hint":"「経営不振で退職___」→ 望まぬ状況に追い込まれた受身→「を余儀なくされた」(bị buộc phải)。主語が意志なく退職。"},{"q":"仕事も趣味も、やはり健康（　）のことだと思う。","o":["あって","あれば","あったら","あると"],"a":1,"vi":"Tôi nghĩ dù là công việc hay sở thích thì cũng phải có sức khỏe mới làm được.","hint":"「仕事も趣味も___のことだ」→「健康___のこと」→「あっての」固定(健康あってのこと)。「あれば」は単純条件。"},{"q":"父の機嫌がよかったので、妹は、今がチャンス（　）おこづかいをねだった。","o":["とみえて","とばかりに","と思いきや","において"],"a":2,"vi":"Vì bố đang vui nên em gái nhân cơ hội đó xin tiền tiêu vặt.","hint":"「今がチャンス___おこづかいをねだった」→ 好機と判断して行動→「とばかりに」(như muốn nói đây là cơ hội)。"},{"q":"友人に真実を（　）悩んでいる。","o":["告げようか告げまいか","告げようと告げまいと","告げようが告げまいが","告げようとどうしようと"],"a":1,"vi":"Đang phân vân không biết có nên nói sự thật với bạn hay không.","hint":"「告げようか告げまいか」→ 「か〜か」の迷い→ 固定表現「〜うか〜まいか」(nên...hay không nên)。「まいと」は決意。"},{"q":"同じような製品がありすぎて、どれを選んだらいい（　）悩んでしまう。","o":["ですら","からには","こそあれ","ものやら"],"a":4,"vi":"Có quá nhiều sản phẩm giống nhau nên không biết chọn cái nào, cứ băn khoăn mãi.","hint":"「どれを選んだらいい___悩んでしまう」→ 判断できない困惑→「ものやら」(không biết cái gì)。「ものを」は惜しむ。"},{"q":"水泳は子どもから高齢者（　）、あらゆる年代の人が楽しめます。","o":["に加え","といえども","に至るまで","にもまして"],"a":3,"vi":"Bơi lội là môn mà mọi lứa tuổi, từ trẻ em đến người cao tuổi, đều có thể tận hưởng.","hint":"「子どもから高齢者___あらゆる年代」→ 極端な両端を結ぶ→「に至るまで」(cho đến tận)。「に加え」は追加の意。"},{"q":"一国の首相（　）、発言には重大な責任がともなうものだ。","o":["ならでは","ともなると","はさておき","じゃあるまいし"],"a":2,"vi":"Đã là thủ tướng một nước thì phát ngôn nào cũng kéo theo trách nhiệm nặng nề.","hint":"「一国の首相___発言には責任」→ 地位が高い人に対する期待→「ともなると」(một khi đã trở thành)。「ならでは」は特有性。"},{"q":"コンサートのチケットは発売が開始される（　）またたく間に売り切れた。","o":["とたん","と思うと","とみると","やいなや"],"a":4,"vi":"Vé concert vừa mở bán là hết veo trong nháy mắt.","hint":"「発売が開始される___またたく間に売り切れ」→ 開始と同時→「やいなや」(vừa...thì ngay). 「とたん」とほぼ同じだが「やいなや」は辞書形に接続。"},{"q":"彼女の歌声は今もなお多くの人を魅了（　）。","o":["しかねない","極まりない","してやまない","にあたらない"],"a":3,"vi":"Giọng hát của cô ấy đến giờ vẫn mãi mê hoặc rất nhiều người.","hint":"「今もなお多くの人を魅了___」→ 継続的な強い感情・愛情→「してやまない」(mãi không ngừng)。「しかねない」は可能性。"},{"q":"この旅館はサービスのよさと料理の質（　）、利用客からの評価が非常に高い。","o":["をよそに","が相まって","にひきかえ","までもなく"],"a":2,"vi":"Nhà nghỉ này được đánh giá rất cao nhờ sự kết hợp giữa dịch vụ tốt và chất lượng món ăn.","hint":"「サービスのよさと料理の質___評価が高い」→ 二つの要素が合わさって→「が相まって」(kết hợp cùng nhau)。固定コロケーション。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"この作品が最優秀賞というのは、___ ___ ★ ___ と言えるだろう。","o":["して","取った","まさに","取るべく"],"a":1},{"q":"今の成績 ___ ___ ★ ___ も危ないだろう。","o":["卒業","就職","からすると","はおろか"],"a":4},{"q":"英語なら ___ ___ ★ ___ わかりません。","o":["ドイツ語","さっぱり","ともかく","となると"],"a":4},{"q":"買うのは高いし、___ ___ ★ ___ 、どうしたらいいかなあ。","o":["ならないし","借りたら","返さなきゃ","借りたで"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"自分はうまく働くことができないなどと言って、働こう【1-a】就職しよう【1-b】しない若者たちが、2004年頃から社会問題として取り上げられるようになった。彼らは「ニート」と呼ばれる。彼らの多くは、仕事をしない理由を「目標が持てないから」だと言う。しかし、このような若者たちを指導しているAさんはこう言う。「何はともあれ、朝、起きることだ」と。\n毎朝決まった時間に起きて顔を洗い、服を着替え、朝食をとる。どんな職業に就くのか、働く意味は何なのかを考えるの【2】、まず単純な毎日の一歩が踏み出せるかどうかが大切なのだと言う。確かにその通りだと思う。\n働く目的を説き、社会人としての自覚を促すのではなく、朝起きるという生活習慣を、頭ではなく身体に覚えさせる。「朝、起きる」という基本中の基本の生活習慣が身に【3】、次の行為へとつながっていくのだ。「働く」ということは、その先にあるのである。","items":[{"label":"1","o":["a とも／b とも","a にも／b とは","a とも／b とは","a にも／b にも"],"a":3},{"label":"2","o":["に及ばず","はさておき","を踏まえて","にとどまらず"],"a":2},{"label":"3","o":["つけるべく","ついてこそ","ついたからこそ","つけたなりに"],"a":2}]}]},{"id":"r5","name":"第5回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[],"missing_note":"⚠️ 問題1（10問）の原文がスキャン資料から欠落しています。答えのみ参考: 1-4 2-2 3-1 4-2 5-2 6-1 7-2 8-2 9-4 10-1"},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"慎重な ___ ___ ★ ___ まったく危険を顧みない。","o":["きたら","ひきかえ","弟に","兄と"],"a":4},{"q":"いかに父が ___ ___ ★ ___ 、そんな高い山に一人で登るのは無理だろう。","o":["若者","健康","といえども","じゃあるまいし"],"a":1},{"q":"山一面に咲く桜はここ ___ ___ ★ ___ が訪れる。","o":["多くの観光客","ならではの","眺め","とあって"],"a":4},{"q":"お互いに率直に ___ ___ ★ ___ はずがない。","o":["理解しあえる","には","なし","話し合うこと"],"a":2}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"恋とは楽しいものだろうか、辛く苦しいものだろうか。\nその答えが「どちらも」であるのは【1】だろう。どんな時代のどんな小説や映画を見ても、恋は、あるときは楽しく、またあるときは、辛く苦しいものだ。\n恋が辛いのはなぜか。Aさんのことが【2】のに、Aさんが同じように自分を好きになってくれない、それどころか、別の人と付き合っている。このように、自分がどれだけ強い気持ちを持っていても、それが相手に届かないことが、恋を辛くさせている原因だ。\nでは、恋は実れば楽しいだけかというと、そんなことはない。「相手がいつまでも私のことを好きでいてくれるだろうか」「ひょっとしたら、相手は私ほど自分のことを好きじゃないかもしれない」など、恋人に【3】、やはり悩みはつきないのである。","items":[{"label":"1","o":["言うほかない","言うまでもない","言わざるを得ない","言わねばならない"],"a":2},{"label":"2","o":["好きでかなわない","好きとは限らない","好きでたまらない","好きなわけではない"],"a":3},{"label":"3","o":["なったが最後","なったらなったで","なりもしないうちから","なるにつけならないにつけ"],"a":2}]}]},{"id":"r6","name":"第6回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"不慣れな（　）、失礼がありましたらご指摘くださいませ。","o":["こととて","そばから","ながらに","ものだから"],"a":1,"vi":"Vì chưa quen việc nên nếu có gì thất lễ, xin hãy chỉ bảo cho tôi.","hint":"「不慣れな___失礼がありましたら」→ 不慣れな理由を謙遜説明→「こととて」(vì là/do...mà)。「そばから」は逆行反復。"},{"q":"今回はだめだったが、次回の会議ではきっと自分の企画を（　）。","o":["通すに限る","通してみせる","通してやまない","通さざるを得ない"],"a":2,"vi":"Lần này thất bại, nhưng lần họp tới chắc chắn tôi sẽ cho mọi người thấy là tôi sẽ thông qua được kế hoạch của mình.","hint":"「きっと自分の企画を___」→ 強い決意で実現させる→「通してみせる」(quyết sẽ...cho được)。「通すに限る」は推薦。"},{"q":"あの学生は注意されても、反省するどころか怒り出す（　）。","o":["限りだ","始末だ","に至る","ものがある"],"a":2,"vi":"Học sinh đó dù bị nhắc nhở, chẳng những không hối lỗi mà còn nổi giận, đến mức như vậy đấy.","hint":"「反省するどころか怒り出す___」→ 悪化する事態の結末→「始末だ」(rốt cuộc dẫn đến kết quả tệ)。「限りだ」は感情の極み。"},{"q":"この壮大な景色は訪れた者を感動（　）。","o":["させかねない","させんばかりだ","させずにはおかない","させて仕方がない"],"a":3,"vi":"Khung cảnh hùng vĩ này chắc chắn sẽ khiến bất cứ ai ghé thăm cũng phải xúc động.","hint":"「訪れた者を感動___」→ 必ず感動させる→「させずにはおかない」(chắc chắn sẽ khiến). 主語が原因、人が感動。"},{"q":"どこの国（　）、親が子どもを思う気持ちは変わらない。","o":["であれ","であろうか","ならでは","なりとも"],"a":1,"vi":"Dù là nước nào đi nữa, tình cảm cha mẹ dành cho con cái cũng không thay đổi.","hint":"「どこの国___親が子どもを思う気持ち」→ 国を問わず同じ→「であれ」(dù là nước nào đi nữa)。"},{"q":"この団体は、飲み水（　）ないような地域で支援活動を続けている。","o":["こそ","すら","だけ","ほど"],"a":2,"vi":"Tổ chức này vẫn tiếp tục hoạt động hỗ trợ ở những vùng mà ngay cả nước uống cũng thiếu thốn.","hint":"「飲み水___ないような地域」→ 水さえもない極限状態→「すら」(ngay cả...cũng không)。「こそ」は肯定強調。"},{"q":"国（　）被災地の復興にあたっている。","o":["にあって","において","をあげて","をもって"],"a":3,"vi":"Cả đất nước đang dốc toàn lực để phục hồi vùng bị thiên tai.","hint":"「国___被災地の復興」→ 国全体を挙げて→「をあげて」固定(dốc toàn bộ). 「において」は場所の枠組み。"},{"q":"腰痛の治療（　）、九州へ温泉旅行に行くことにした。","o":["に限って","に加えて","を兼ねて","を踏まえて"],"a":3,"vi":"Tôi quyết định đi du lịch suối nước nóng ở Kyushu, kết hợp luôn việc chữa đau lưng.","hint":"「腰痛の治療___温泉旅行」→ 二つの目的を兼ねる→「を兼ねて」(kết hợp luôn). 「に加えて」は追加のみ。"},{"q":"銀行に行き（　）お弁当を買ってきます。","o":["限り","がてら","かたがた","かたわら"],"a":2,"vi":"Tôi sẽ nhân tiện đi ngân hàng mua luôn cơm hộp về.","hint":"「銀行に行き___弁当を買う」→ 移動の途中に別の用事→「がてら」(nhân tiện). 「かたわら」は長期的な並行活動。"},{"q":"祖父は日本中の山（　）山に登ったことがあると、いつも自慢している。","o":["という","というか","といわず","といったら"],"a":1,"vi":"Ông tôi lúc nào cũng tự hào kể rằng đã từng leo hết ngọn núi này đến ngọn núi khác khắp Nhật Bản.","hint":"「山___山に登った」→ 「〜という〜」の繰り返しで「全て」を表す→「という」固定表現。「というか」は言い換え。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"この映画の主役は ___ ___ ★ ___ だろう。","o":["いない","ほかに","おいて","彼を"],"a":2},{"q":"彼の作る歌はメロディーの ___ ___ ★ ___ 、詩も感動的だ。","o":["さること","も","美しさ","ながら"],"a":1},{"q":"もう少しスピードを出していたら ___ ___ ★ ___ よ。","o":["けが","こんな","すまなかった","だけじゃ"],"a":4},{"q":"好き嫌いはともかく、彼女の実力 ___ ___ ★ ___ だろう。","o":["を","は","得ない","認めざる"],"a":1}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"四カ月【1】の再会になる。夏休みになったら遊びに行くから、絶対に行くから、と三上くんが転校する前に約束をした。夏休み初日の今日、早起きをして列車に乗った。夕方の列車で帰るまで、半日たっぷり遊べる。ラジオ体操の皆勤賞は初日でアウトになってしまったが、後悔はない。三上くんに会える。やっと会える。四年生の頃、二人はクラスでいちばんの仲良しだった。\n列車は駅の構内に入った。少年はボックスシートからデッキに移った。ポイントを通過する【2】、列車は左右に大きく揺れる。両足を踏ん張って体を支え、またシャツの胸ポケットに手をあてて、あー、あー、あー、と声を出して喉の調子を整えた。ホームであいつに会ったら「ひさしぶり！」と大きな声で言って【3-a】か。それとも、わざわざ遊びに来て【3-b】んだし、ちょっと照れくさいし、あいつから話しかけてくるまで黙っていようか……。\n（重松清著『南小、フォーエバー』文藝春秋刊『小学五年生』所収）","items":[{"label":"1","o":["あたり","おき","ごと","ぶり"],"a":4},{"label":"2","o":["たびに","とたんに","ついでに","ところに"],"a":1},{"label":"3","o":["a おこう／b おいた","a やろう／b やった","a くれよう／b くれた","a もらおう／b もらった"],"a":2}]}]},{"id":"r7","name":"第7回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"このような名誉ある賞がもらえるとは、予想（　）しませんでした。","o":["きり","こそ","だに","ながら"],"a":3,"vi":"Tôi hoàn toàn không ngờ lại được nhận một giải thưởng vinh dự thế này.","hint":"「予想___しませんでした」→ 「予想___する」→「予想だにしない」固定(không hề ngờ). 「だに」は「さえ」の文語。"},{"q":"一日（　）あの日のことを忘れたことはありません。","o":["たらず","ならず","たりとも","なりとも"],"a":3,"vi":"Không một ngày nào tôi quên chuyện hôm đó.","hint":"「一日___忘れたことはない」→ 「一日たりとも」固定(dù chỉ một ngày cũng). 「ならず」は「一日ならず」と別の意味。"},{"q":"市民が安心して暮らせるように努力するのが、市長（　）者の務めだ。","o":["たる","ごとき","あっての","ゆえの"],"a":1,"vi":"Việc cố gắng để người dân sống yên ổn chính là bổn phận của một người làm thị trưởng.","hint":"「市長___者の務め」→ 職名＋「たる」→ その地位にある人物の修飾→「たる」(là người có tư cách là). "},{"q":"その女の子は店に入りにくそうに、入り口の前を（　）している。","o":["行きつ戻りつ","行っては戻っては","行くにつけ戻るにつけ","行くなり戻るなり"],"a":1,"vi":"Cô bé đó có vẻ ngại vào cửa hàng nên cứ đi tới đi lui trước cửa.","hint":"「入り口の前を___している」→ 動作の反復描写→「行きつ戻りつ」固定表現(đi đi lại lại)。「行っては戻っては」も近いが「行きつ戻りつ」がより慣用的。"},{"q":"心身ともに健康で、充実した毎日が送れることが幸せ（　）。","o":["にたえない","にかたくない","でなくてなんだろう","といったらありはしない"],"a":3,"vi":"Có một cuộc sống mạnh khỏe cả thể chất lẫn tinh thần, ngày nào cũng đầy đặn, thì còn gì hạnh phúc bằng.","hint":"「充実した毎日が送れることが幸せ___」→ 修辞疑問で断定強調→「でなくてなんだろう」(nếu không phải là...thì là gì)。"},{"q":"新入社員（　）、まだそんな初歩的なミスをするなんて、どういうことだ。","o":["なりに","はおろか","ともなると","ではあるまいし"],"a":4,"vi":"Đâu phải là nhân viên mới mà còn mắc lỗi sơ đẳng như vậy, thật không hiểu nổi.","hint":"「新入社員___初歩的なミスをするなんて」→「新入社員じゃあるまいし」固定(đâu phải nhân viên mới mà). 地位への期待を前提に批判。"},{"q":"ここで起きた悲劇は涙（　）語れない。","o":["ながらに","なくても","なしには","をおいて"],"a":3,"vi":"Bi kịch xảy ra ở đây không thể kể lại mà không rơi nước mắt.","hint":"「涙___語れない」→ 「涙なしには」固定コロケーション(không thể kể mà không rơi nước mắt). 「なしには〜ない」のセット。"},{"q":"頭も性格もいい上に話がおもしろい（　）、誰からも好かれるだろう。","o":["あげく","とあれば","ところで","からして"],"a":2,"vi":"Nếu vừa đẹp trai tốt tính lại vừa nói chuyện thú vị thì ai cũng quý thôi.","hint":"「〜おもしろい___誰からも好かれる」→ 条件が整ったら当然の結果→「とあれば」(nếu là...thì). 「とあれば」は良い条件の帰結。"},{"q":"人生を楽しめるかどうかは、ものごとのとらえ方（　）だ。","o":["いかん","ごとし","じまい","まじき"],"a":1,"vi":"Có vui được với cuộc sống hay không tùy thuộc vào cách nhìn nhận sự việc của mỗi người.","hint":"「とらえ方___だ」→ 〜次第で決まる→「いかん」(tùy theo). 「ごとし」は比喩。"},{"q":"買ってきたケーキを自分で作った（　）彼にあげた。","o":["ものを","こととて","ことにして","ものだから"],"a":2,"vi":"Vì tự tay làm chiếc bánh đã mua sẵn nên tôi đã tặng nó cho anh ấy (như thể đó là việc đáng thông cảm).","hint":"「自分で作った___あげた」→ 「こととて」=という理由・事情で。自分が作ったという「理由」を釈明的に述べる。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"加害者本人からの ___ ___ ★ ___ あり得ないだろう。","o":["なくして","和解","は","謝罪"],"a":2},{"q":"店主はその男を見る ___ ___ ★ ___ ドアを閉めた。","o":["帰れ","ばかりに","と","やいなや"],"a":3},{"q":"進学の際には保証人がいるらしい。誰に ___ ___ ★ ___ 。","o":["もの","いい","やら","頼んだら"],"a":1},{"q":"スタイルを気にするのは、決して ___ ___ ★ ___ ではない。","o":["だけ","こと","に限った","女性"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"ロボットと人間の違いは【1】。1970年代に盲導犬ロボットや介護ロボットの研究開発が盛んに行われたことがある。しかしその当時は、技術レベルがまだ低かった【2】、当事者たちに受け入れてもらうことはできなかった。目の不自由な人たちからは、「ロボットの研究者たちはわれわれの気持ちを理解していない」「われわれと心が通わない盲導犬ロボットの開発などはまったく意味がない」と非難された。また、病院の看護師さんからは、「ロボットには心がないからわれわれの代わりをすることはできない」と決めつけられたりもした。今ではロボットの技術も格段に進歩したし、医療、福祉に関する社会の情勢も変化した。しかし、基本的な問題が解決された【3】。生き物である盲導犬や看護師と人工物であるロボットとでは本質的な違いがあり、両者の間には越えがたい壁があるようである。\n（長田正著『ロボットは人間になれるか』PHP研究所刊）","items":[{"label":"1","o":["何であろうか","何があろうか","何をするのか","何をしようか"],"a":1},{"label":"2","o":["からこそ","だけあって","のみならず","こともあって"],"a":4},{"label":"3","o":["ことなどない","だけではない","わけではない","と言えなくもない"],"a":3}]}]},{"id":"r8","name":"第8回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"十分ではないが、まずまずの結果だ。これなら成功（　）。","o":["極まりない","と言いかねない","と言えなくもない","せざるを得ない"],"a":3,"vi":"Tuy chưa thật xuất sắc nhưng kết quả cũng tạm ổn. Có thể nói đây cũng coi như thành công.","hint":"「まずまずの結果だ。成功___」→ 完全否定ではなく一定肯定→「と言えなくもない」(cũng có thể nói là...được). 二重否定＝弱い肯定。"},{"q":"お休み（　）申し訳ありませんが、少々伺いたいことがありまして……。","o":["がてらに","ながらに","のそばから","のところを"],"a":4,"vi":"Xin lỗi vì đã làm phiền lúc anh/chị đang nghỉ ngơi, nhưng tôi có vài điều muốn hỏi…","hint":"「お休み___申し訳ない」→ 相手が休んでいる最中に邪魔する→「のところを」(đúng lúc...mà lại làm phiền). 固定丁寧表現。"},{"q":"両親は私が嘘をついていると知って（　）、黙って許してくれた。","o":["いながら","いようか","いたごとく","いたとみえて"],"a":4,"vi":"Bố mẹ có vẻ biết tôi nói dối nhưng vẫn im lặng cho qua.","hint":"「知って___黙って許してくれた」→ 知っていた証拠から推測→「いたとみえて」(có vẻ như biết). 「とみえて」の過去形。"},{"q":"尊敬する先生からこのようなお褒めの言葉をいただき、光栄（　）。","o":["にすぎません","の至りです","でやみません","にあたりません"],"a":2,"vi":"Nhận được lời khen như vậy từ vị thầy đáng kính, tôi cảm thấy vô cùng vinh dự.","hint":"「光栄___」→ 「光栄の至りです」固定表現(vô cùng vinh dự)。謙遜した最上級の表現。「の至りです」は感謝・謙遜の慣用句。"},{"q":"中学生（　）、大学生にもなってこの漢字が読めないとは恥ずかしい。","o":["はおろか","をよそに","にひきかえ","ならいざ知らず"],"a":1,"vi":"Đừng nói là học sinh cấp 2, ngay cả là sinh viên đại học mà không đọc được chữ Hán này thì thật xấu hổ.","hint":"「中学生___大学生にも読めないとは」→「中学生はおろか」=中学生は言うまでもなく→「はおろか」(đừng nói là). Từ mức thấp hơn đến cao hơn đều không được。"},{"q":"このグラフに示される（　）、前回とは異なる数値が測定された。","o":["ごとく","どころか","ばかりに","そばから"],"a":1,"vi":"Đúng như biểu đồ này cho thấy, lần này đo được số liệu khác với lần trước.","hint":"「グラフに示される___」→ 比喩・例示で「示すように」→「ごとく」(như/giống như). 「どころか」は強い逆接。"},{"q":"どんな事情があったにせよ、暴力は（　）行為だ。","o":["許すべからざる","許すに足る","許しかねない","許さざるを得ない"],"a":1,"vi":"Dù có lý do gì đi nữa, bạo lực vẫn là hành vi không thể tha thứ.","hint":"「どんな事情があったにせよ___行為だ」→ 文語的な禁止→「べからざる」=べきでない(không thể tha thứ được). 「行為」に直前修飾。"},{"q":"こんなつまらない仕事ばかりさせられる（　）、会社なんかやめてやる。","o":["こととて","ことやら","くらいなら","ものやら"],"a":3,"vi":"Nếu cứ phải làm những công việc vô vị thế này thì thà nghỉ việc còn hơn.","hint":"「くらいなら会社なんかやめてやる」→「〜くらいなら〜ほうがましだ」パターン(thà...còn hơn). 不満がある前提。"},{"q":"名医（　）治せない病気もある。","o":["なりに","たるもの","だからこそ","といえども"],"a":4,"vi":"Dù là bác sĩ giỏi cũng có những bệnh không chữa được.","hint":"「名医___治せない病気もある」→ 優れた人でも例外がある→「といえども」(dù là...đi nữa). 「なりに」は程度の適合。"},{"q":"日本に住んでいた3年間、結局一度も富士山に（　）だった。","o":["登らずじまい","登ること抜き","登ることなし","登ったが最後"],"a":1,"vi":"Suốt 3 năm sống ở Nhật, rốt cuộc tôi chưa một lần leo núi Phú Sĩ.","hint":"「結局一度も___だった」→ 3年間ずっとできなかった→「ずじまい」固定(rốt cuộc không). 「一度も〜ない」のセット。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"部長 ___ ___ ★ ___ 少なかれストレスを抱えているものだ。","o":["と","なる","とも","多かれ"],"a":3},{"q":"質問されても、事情が ___ ___ ★ ___ ない。","o":["以上","答えようが","わからない","答えようにも"],"a":4},{"q":"住所変更だけで、こんなにたくさん ___ ___ ★ ___ ありゃしない。","o":["面倒くさい","なんて","といったら","手続きがいる"],"a":3},{"q":"校長先生がドイツを ___ ___ ★ ___ ことから、交流が始まったそうだ。","o":["見学した","旅行した","その学校を","折に"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"私なりの読書の楽しみ方をご紹介します。本を読むとき、その作者が自分の隣で自分だけに向かって語りかけていると想像しながら読むのです。小説なら朗読会、実用書なら個人レッスン、エッセイならさしずめ作者とのおしゃべり【1】。\n前書きや奥付の情報を手がかりに作者の姿を思い描きながら読む、というのもまた楽しい時間です。今はその気になれば、インターネットで画像検索することもできますが、そこまでするよりは、自分で勝手に想像したほうが楽しいと私は思っています。\n【2】、私の周りには、「本は高いから買わない」と言う人がいます。作者が長い時間をかけて培ってきた知識や、長い時間をかけて作り上げた空想の世界が、わずか数百枚の紙の中に詰まっているのです。いくら【3】ということはないと思うし、実際はそれが数百円から手に入るのですから、少しでも興味のある本があったら買わない手はないでしょう。","items":[{"label":"1","o":["にちがいないでしょう","といったらないでしょう","というわけでしょうか","といったところでしょうか"],"a":2},{"label":"2","o":["信じずとも","信じがたいことに","信じられないまでも","信じるとは限らないが"],"a":2},{"label":"3","o":["安いほどよい","安くても安すぎる","高いほどよい","高くても高すぎる"],"a":4}]}]},{"id":"r9","name":"第9回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"真相が明らかになったからには、会長も責任をとって辞任（　）だろう。","o":["せずにはおかない","せずにはすまない","を禁じ得ない","を余儀なくする"],"a":1,"vi":"Một khi sự thật đã sáng tỏ, chắc chắn chủ tịch cũng sẽ phải từ chức để chịu trách nhiệm.","hint":"「からには___だろう」→「からには〜はずだ/だろう」の論理帰結→「せずにはおかない」(chắc chắn sẽ). 必然の強調。"},{"q":"私は借金を（　）いい車を買いたいとは思わない。","o":["してこそ","してまで","したところで","したからには"],"a":2,"vi":"Tôi không nghĩ là mình muốn mua xe đẹp đến mức phải đi vay nợ.","hint":"「借金を___いい車を買いたくない」→ 極端な手段を使ってまで→「してまで」(đến mức phải). 「してこそ」は逆に必要性強調。"},{"q":"娘は「こんなものいらない」と（　）、ぬいぐるみを放り投げた。","o":["言わんばかりに","言わんがために","言おうと言うまいと","言うものとして"],"a":1,"vi":"Con gái vừa nói \"Cái này con không cần\" vừa ném con thú nhồi bông đi như muốn nói rõ thái độ.","hint":"「こんなものいらない___ぬいぐるみを放り投げた」→ 言葉の代わりの強い行動表現→「言わんばかりに」(như muốn nói rằng). "},{"q":"四月（　）夜は冷えるから、外出時は上着を着ていったほうがいい。","o":["にせよ","ときたら","とはいえ","にひきかえ"],"a":3,"vi":"Tuy là tháng tư nhưng buổi tối vẫn lạnh, nên khi ra ngoài tốt nhất nên mặc thêm áo khoác.","hint":"「四月___夜は冷える」→ 4月であることを認めつつ逆の事実→「とはいえ」(tuy là...nhưng). 「にせよ」も近いが「とはいえ」は事実の引用。"},{"q":"以前銀行に勤めていた（　）、彼は金融には詳しい。","o":["だけあって","ばかりに","ことだから","せいで"],"a":4,"vi":"Vì từng làm ở ngân hàng nên anh ấy am hiểu về tài chính.","hint":"「以前銀行に勤めていた___詳しい」→ 経歴の理由で能力がある→「だけあって」がより自然だが選択肢に「せいで」→ ✕負のため→正しくは「だけあって」。「せいで」は負の理由にのみ使う。注意！"},{"q":"彼女は努力に努力（　）、今の地位を築き上げた。","o":["を重ねて","を兼ねて","と相まって","もかまわず"],"a":1,"vi":"Cô ấy đã nỗ lực không ngừng để xây dựng được vị trí như ngày hôm nay.","hint":"「努力に努力___今の地位」→「努力に努力を重ねる」固定コロケーション(nỗ lực không ngừng). "},{"q":"A社は投資するに（　）、将来性のある企業だ。","o":["至る","足る","至らない","足りない"],"a":2,"vi":"Công ty A là một doanh nghiệp có triển vọng, đáng để đầu tư.","hint":"「投資するに___企業だ」→ 「〜に足る」=するだけの価値がある(đáng để). 「至る」は到達を表す動詞。"},{"q":"ほかの家は（　）、うちでは子どもがトイレ掃除をするのが決まりだ。","o":["いざ知らず","ものともせず","かかわらず","とどまらず"],"a":1,"vi":"Nhà khác thì tôi không biết, nhưng nhà tôi thì quy định trẻ con phải dọn nhà vệ sinh.","hint":"「ほかの家は___うちでは」→ 他の家は知らないが→「はいざ知らず」(nhà khác thì không biết, nhưng). 対比強調。"},{"q":"負けたという結果は（　）、今日の試合の内容はすばらしかった。","o":["おろか","及ばず","さておき","踏まえて"],"a":3,"vi":"Tạm gác kết quả thua cuộc sang một bên, nội dung trận đấu hôm nay thực sự rất hay.","hint":"「負けたという結果は___内容はすばらしかった」→ 結果は置いておいて→「はさておき」(tạm gác...sang). 「及ばず」は「及ばない」の副詞形で別意。"},{"q":"理由によらず、遅刻した者は試験を受けることはできない（　）。","o":["始末だ","つもりだ","ものとする","というところだ"],"a":3,"vi":"Bất kể lý do gì, người đến muộn đều không được phép vào thi.","hint":"「受けることはできない___」→ 規則・規定を文語的に明示→「ものとする」(quy định là...phải). 「つもりだ」は主観的意図。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"この町は、交通の便 ___ ___ ★ ___ いい環境だ。","o":["には","悪いが","こそ","子育て"],"a":3},{"q":"苦しんだ ___ ___ ★ ___ 、他人に譲りわたす気になれない。","o":["末に","作品","作り上げた","だけに"],"a":2},{"q":"あなたが ___ ___ ★ ___ はもう変えられない。","o":["が","この決定","いかに","反対しよう"],"a":3},{"q":"私財を投じて ___ ___ ★ ___ 監督の姿に心を打たれた。","o":["映画を","まで","という","完成させよう"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"コミュニケーションが欠落すると、例えば学生なら学校自体に興味がなくなり、すなわち学力低下に繋がります。同じくサラリーマンなら、会社での居心地が悪くなる上に効率も下がり、仕事力の低下に繋がります。\nコミュニケーションとは、本音を引き出す【1】重要なものである以上に、有意義な社会生活を送るために不可欠なものなのです。\nそもそも、人間が地球の中心となる生き物になれたのは、集団で生活してきたからです。集団で生活してきた【2】、ライオンやトラなどの一対一だったら負けてしまうような生き物との戦いにも勝ち、生き延びることができた。そして、【3-a】勝って生き延びることができた【3-b】、ディスカッションというコミュニケーションを取り、勝つための作戦を立てたからです。原始の頃より、孤立しては生きられないという事実を、人間はちゃんとわかっていたのです。\n（田原総一朗著『田原式つい本音を言わせてしまう技術』幻冬舎刊　※一部省略あり）","items":[{"label":"1","o":["上で","あげく","一方","かわりに"],"a":3},{"label":"2","o":["以上","からこそ","とはいえ","ばかりに"],"a":2},{"label":"3","o":["a いくら／b からといって","a なぜ／b のかといえば","a たしかに／b かもしれませんが","a たとえ／b としても"],"a":2}]}]},{"id":"r10","name":"第10回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"どれほど金を稼いでも死んで（　）。あの世には持っていけないのだから。","o":["しまえばそれまでだ","しまうまでもない","しまってかなわない","しまうったらありゃしない"],"a":1,"vi":"Dù kiếm được bao nhiêu tiền, một khi chết đi là hết, vì không thể mang theo sang thế giới bên kia.","hint":"「死んで___あの世には持っていけない」→「死ねばそれまでだ」固定(chết đi là hết). 「しまえばそれまでだ」形式。"},{"q":"すみません。あれはただの冗談で、怒らせる（　）なんてなかったんです。","o":["かい","べき","わけ","つもり"],"a":4,"vi":"Xin lỗi, đó chỉ là một câu đùa, tôi hoàn toàn không có ý định làm anh/chị giận.","hint":"「怒らせる___なんてなかった」→「つもりはなかった」→「つもり」(có ý định). 「わけ」は理由・当然性。"},{"q":"主役が舞台に登場したとたん、割れ（　）拍手が起きた。","o":["かねない","つつある","てばかりの","んばかりの"],"a":4,"vi":"Ngay khi diễn viên chính xuất hiện trên sân khấu, tiếng vỗ tay vang lên như muốn xé toạc cả khán phòng.","hint":"「割れ___拍手が起きた」→「割れんばかりの」固定慣用句(như muốn vỡ tung). 「〜んばかり」=まるで〜しそうなほど。"},{"q":"昔この地方で行われていた祭りを半世紀（　）復活させた。","o":["おきに","すぎに","ぶりに","ゆえに"],"a":3,"vi":"Họ đã khôi phục lại lễ hội từng được tổ chức ở vùng này sau nửa thế kỷ gián đoạn.","hint":"「半世紀___復活させた」→ 時間の経過後に再び→「ぶりに」(sau...năm mới lại). 「おきに」は定期的な間隔。"},{"q":"おしゃべりな彼女に秘密でも（　）、たちまち学校中に広まってしまう。","o":["話すといったら","話そうものなら","話したらいざ知らず","話してからというもの"],"a":2,"vi":"Nếu lỡ kể bí mật cho cô ấy thì chuyện sẽ lan khắp trường ngay lập tức.","hint":"「秘密でも___たちまち広まってしまう」→「〜ものなら〜てしまう」パターン(nếu lỡ...thì). 悪い仮定の強調。"},{"q":"この映画は子ども向けの作品ながら、十分大人の鑑賞（　）ものだ。","o":["に至る","にたえる","に足りない","にあたらない"],"a":2,"vi":"Bộ phim này tuy là tác phẩm dành cho trẻ em nhưng cũng hoàn toàn xứng đáng để người lớn thưởng thức.","hint":"「子ども向けながら大人の鑑賞___もの」→ 鑑賞に値する→「にたえる」(xứng đáng để). 「に至る」は到達。"},{"q":"結果は引き分け（　）、内容では圧倒的にAチームが勝っていたと思う。","o":["つつ","ながら","にひきかえ","にもまして"],"a":3,"vi":"So với kết quả hòa, nội dung trận đấu thì đội A áp đảo hơn hẳn.","hint":"「結果は引き分け___内容では圧倒的に」→ 結果と内容が対照的→「にひきかえ」(trái ngược với). 「ながら」は同一主体。"},{"q":"その子は母親の顔を見る（　）泣き出した。","o":["なり","より","ゆえ","そばから"],"a":1,"vi":"Đứa bé vừa nhìn thấy mặt mẹ là òa khóc ngay.","hint":"「顔を見る___泣き出した」→ 見ると同時に泣いた→「なり」(vừa...là). 「そばから」は逆行反復。"},{"q":"郵便局員は毎日30キロ（　）道のりをバイクでやって来る。","o":["たる","ごとき","からある","ながらの"],"a":3,"vi":"Nhân viên bưu điện ngày nào cũng chạy xe máy đi quãng đường dài tới hơn 30km.","hint":"「30キロ___道のり」→ 約30キロ以上の距離→「からある」固定(lên tới...)(số lượng lớn). 「たる」は「である」の文語。"},{"q":"この難しい手術ができるのは、渡辺先生（　）のものだ。","o":["限り","ぐらい","だけ","ならでは"],"a":4,"vi":"Chỉ có bác sĩ Watanabe mới làm được ca phẫu thuật khó này.","hint":"「渡辺先生___のものだ」→ その人物にしかできない→「ならでは」(chỉ riêng...mới có). 「ぐらい」は程度推量。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"今後の方針は ___ ___ ★ ___ 、ホームページにて発表します。","o":["踏まえて","うえで","検討した","調査結果を"],"a":1},{"q":"真冬にここから見える富士山の ___ ___ ★ ___ ほどだ。","o":["美しさ","がない","といったら","たとえよう"],"a":3},{"q":"忙しいのは知っていたが、___ ___ ★ ___ 誘ってみることにした。","o":["だめで","だと思い","もともと","誘うだけ"],"a":3},{"q":"文学新人賞を取り、これで ___ ___ ★ ___ 、それほどでもなかった。","o":["かと","売れる","本が","思いきや"],"a":4}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"どうしても時間がないと言う人でも、一日に15分くらいは捻出できるだろう。(中略)\n「時間がない」と嘆く前に、まずは一日15分間の勉強を始めてみる。なかには、時間が【1】できる勉強というのもある。\nたとえば、国語辞典の読書。国語辞典を一時間ぶっ続けで読むのは苦痛だが、一回五分で一日三回ずつくらいなら意外と面白く読めるものだ。\nある大学生は、新聞のコラムを毎日書き写すことを日課にしているという。A紙に掲載されている海外特派員が書いている200字程度のコラムだが、書き写し始めて一年近くになる。\n「時間【2】五分くらいのものですが、コラムというのは短いだけにまとめ方がうまいんです。だから、文章の勉強にもなるし、海外の情勢にも強くなる。【3】一石二鳥ですよ。五分なら休憩時間でもできますから、長続きできたんだと思います」\n新聞には良質のコラムがいくつもあるから、そのなかから毎日三本ずつ書き写していけば、きっと何かがつかめるはずだ。\n（本郷陽二著『頭がいい人の一日15分勉強法』経済界刊　※一部省略あり）","items":[{"label":"1","o":["短いながらも","短いからこそ","長いながらも","長いからこそ"],"a":1},{"label":"2","o":["にして","ときたら","によらず","に即して"],"a":1},{"label":"3","o":["ただし","まさに","いかにも","すなわち"],"a":2}]}]},{"id":"r11","name":"第11回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"無口なご主人（　）、奥さんは明るくてよくしゃべる。","o":["とはいえ","にひきかえ","はまだしも","ではあるまいし"],"a":2,"vi":"Trái ngược với ông chồng ít nói, bà vợ lại vui vẻ và rất hay nói chuyện.","hint":"「無口なご主人___奥さんは明るい」→ 正反対の対比→「にひきかえ」(trái lại với). 「とはいえ」は同一主体の逆接。"},{"q":"出入り口につき、ここに車を止める（　）。","o":["ものか","に限る","べからず","までもない"],"a":3,"vi":"Vì là lối ra vào nên cấm đỗ xe ở đây.","hint":"「出入り口につき___」→ 掲示・規則→「べからず」(cấm không được)。文語的な禁止表現。看板によく使われる。"},{"q":"仕事がたまり、ここ数週間（　）残業続きだ。","o":["といえず","ともなく","というもの","といえども"],"a":4,"vi":"Công việc dồn lại nên mấy tuần nay cứ phải tăng ca liên tục.","hint":"「ここ数週間___残業続き」→ 数週間ということを認めつつも→「といえども」(dù là...đi nữa). 「ともなく」は無意識の動作。"},{"q":"お世話になった方に、ご挨拶（　）結婚を報告する手紙を書いた。","o":["ながら","かたがた","のかたわら","のかわりに"],"a":2,"vi":"Tôi đã viết thư báo tin kết hôn, nhân tiện gửi lời cảm ơn người đã giúp đỡ mình.","hint":"「ご挨拶___結婚を報告」→ 挨拶という用件に結婚報告も兼ねる→「かたがた」(nhân tiện/kết hợp). 「のかたわら」は長期並行。"},{"q":"事件後、その工場の不衛生（　）実態が明らかになった。","o":["極まる","に限る","並みの","に足る"],"a":1,"vi":"Sau vụ việc, thực trạng mất vệ sinh đến cực điểm của nhà máy đó đã bị phơi bày.","hint":"「不衛生___実態」→ 「不衛生極まる」固定(cực kỳ mất vệ sinh). 「〜極まる」はい形容詞・な形容詞に直接接続。「極まりない」も同義。"},{"q":"災害発生当時は混乱した状況（　）、情報が正確に伝わらなかった。","o":["ならでは","にあって","によって","をもって"],"a":2,"vi":"Lúc thiên tai xảy ra, trong tình trạng hỗn loạn nên thông tin không được truyền đạt chính xác.","hint":"「混乱した状況___情報が伝わらなかった」→「状況にあって」固定(trong hoàn cảnh...mà). 「をもって」は手段/方法。"},{"q":"市民の協力により、ついに犯人を逮捕する（　）。","o":["始末だ","にあたった","に至った","に及んだ"],"a":3,"vi":"Nhờ sự hợp tác của người dân, cuối cùng họ đã bắt được hung thủ.","hint":"「ついに犯人を逮捕する___」→「〜するに至った」= その段階に到達した(đã đi đến mức). 「に及んだ」は「に至った」に近いが「逮捕する」には「至った」が自然。"},{"q":"現在の政治体制が続けば、いずれ暴動が（　）だろう。","o":["起きるに足りない","起きないもの","起きないではすまない","起きるまい"],"a":4,"vi":"Nếu thể chế chính trị hiện nay cứ tiếp diễn, sớm muộn gì bạo loạn cũng sẽ xảy ra.","hint":"「いずれ暴動が___だろう」→ 否定推量→「起きるまい」(chắc sẽ không xảy ra). 「まい」=否定の推量/意志。"},{"q":"空港に集まったファンたちは、声を（　）その歌手の名を叫んでいた。","o":["限りに","重ねて","極めて","ものともせず"],"a":1,"vi":"Đám fan tụ tập ở sân bay đã gào hết cỡ tên ca sĩ đó.","hint":"「声を___叫んでいた」→「声を限りに」固定慣用句(hét to hết cỡ). 「声を極めて」は不自然。"},{"q":"曲がり角を一本間違えた（　）大幅に遅刻してしまった。","o":["ものを","からこそ","ばかりに","だけあって"],"a":3,"vi":"Chỉ vì đi nhầm một ngã rẽ mà tôi đã bị trễ giờ rất nhiều.","hint":"「一本間違えた___大幅に遅刻」→ たった一つのミスが悪い結果に→「ばかりに」(chỉ vì...mà). 前の行動が原因の強調。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"昨日は疲れ果ててベッドに ___ ___ ★ ___ 眠ってしまった。","o":["が","倒れこむ","早いか","あっという間に"],"a":1},{"q":"病院が嫌いな父は、病院に行く ___ ___ ★ ___ ましだとまで言う。","o":["死んだ","なら","くらい","ほうが"],"a":3},{"q":"彼はなにごとも ___ ___ ★ ___ きらいがある。","o":["判断が","すぎて","遅れる","考え"],"a":3},{"q":"原作の小説 ___ ___ ★ ___ 、映画版もなかなかおもしろかった。","o":["も","及ばない","には","ながら"],"a":2}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"ある時期を境に、兄は父を避けるようになった。当の父はとくに気にしていない素振りを見せていたが、母は何度も心配して私に相談してきた。私【1】、兄は父のことを嫌っていたわけではない。いや、【2】、私以上に父のことを尊敬していたように思う。\n思えば、父は昔から厳しい人だった。家族に対しても、部下に対しても、そして何より、自分に厳しい人だった。田舎から上京して一代で会社を築いただけあって、いつもギラギラと獲物を狙う獣のような鋭さがあった。\n【3】私が5年生ぐらいのことだったかと思う。兄と二人で留守番をしているとき、正月すら家に帰ってこない父の文句を私がこぼすと、兄は、「誰のおかげで飯が食えると思ってるんだ！」と、顔を真っ赤にして私を怒鳴りつけたのだ。まさかそんな反応が返ってくるとは思ってもいなかったので、私は驚いて泣き出してしまった。このときのことは、父も母も知らない。","items":[{"label":"1","o":["なりに","が思うに","とすると","ならいざ知らず"],"a":2},{"label":"2","o":["それどころか","それに限らず","それにもかかわらず","それにもまして"],"a":1},{"label":"3","o":["あれが確か","あれが確かに","あれは確か","あれは確かに"],"a":3}]}]},{"id":"r12","name":"第12回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"そのビルの建設に周辺住民が反対することは、想像（　）。","o":["の限りだ","に及ばない","に難くない","してやまない"],"a":3,"vi":"Việc người dân xung quanh phản đối xây tòa nhà đó cũng dễ hiểu thôi.","hint":"「想像___」→「想像に難くない」固定(không khó để tưởng tượng). 「に難くない」は頭脳の推測動詞(想像・理解・推測)と組み合わせる。"},{"q":"何十年も前の古いルールは、現状（　）改正すべきだと思う。","o":["に即して","につれて","にひきかえ","とあれば"],"a":1,"vi":"Tôi nghĩ những quy định cũ từ mấy chục năm trước nên được sửa đổi cho phù hợp với tình hình hiện tại.","hint":"「現状___改正すべき」→ 現状に合わせて改正→「に即して」(bám sát/dựa theo). 「に即した」は修飾形。「につれて」は変化の伴走。"},{"q":"材料がない（　）なんとか工夫して、日本でも自国の料理を作っています。","o":["うえに","ことに","なりに","ところが"],"a":3,"vi":"Dù không có nguyên liệu, họ vẫn cố gắng xoay xở theo cách riêng để làm món ăn quê hương ngay tại Nhật.","hint":"「材料がない___工夫して」→ 材料がない状況なりに工夫→「なりに」(theo cách riêng phù hợp). 制約の中での最善を表す。"},{"q":"渋滞しているといっても遠くはないので、到着まで3,40分（　）でしょう。","o":["いかん","どころ","というもの","といったところ"],"a":4,"vi":"Tuy có tắc đường nhưng không xa lắm, nên ước chừng 30-40 phút nữa là tới.","hint":"「3,40分___でしょう」→ 大体この程度→「といったところ」(khoảng chừng...thôi). 軽い見積もり表現。"},{"q":"どんなことがあっても、患者の命だけは（　）。","o":["守りかねない","守らねばならない","守らざるを得ない","守らないことはない"],"a":2,"vi":"Dù có chuyện gì xảy ra, mạng sống của bệnh nhân là điều bắt buộc phải bảo vệ.","hint":"「どんなことがあっても___」→ 義務の強調→「守らねばならない」(bắt buộc phải). 「べし」より一般的な強い義務表現。"},{"q":"この島のお年寄りたちの笑顔は穏やかなこと（　）。","o":["極まる","それまでだ","禁じ得ない","このうえない"],"a":4,"vi":"Nụ cười hiền hòa của các cụ già trên đảo này thật không gì sánh bằng.","hint":"「穏やかなこと___」→「〜こと___」の形で感情の極大を表す→「このうえない」(không gì hơn được). 「それまでだ」は終わりを示す。"},{"q":"君の実力をもってすれば、あの選手など恐れるに（　）。","o":["至らない","たえない","足りない","難くない"],"a":3,"vi":"Với thực lực của bạn, đối thủ đó chẳng đáng sợ chút nào.","hint":"「あの選手など恐れるに___」→「恐れるに足りない」固定(không đáng sợ). 「〜に足りない」=する価値・必要がない。"},{"q":"彼女の英語は、わずかに発音のくせ（　）、ほぼ完ぺきなものだ。","o":["にせよ","こそあれ","こそすれ","にしたって"],"a":2,"vi":"Tiếng Anh của cô ấy chỉ hơi có chút giọng địa phương thôi, còn lại gần như hoàn hảo.","hint":"「発音のくせ___ほぼ完ぺき」→ 欠点があるとしても→「こそあれ」(tuy có...nhưng). 「〜こそあれ〜ない」の形。"},{"q":"新商品がヒットしたおかげで、あの会社は倒産に（　）すんだ。","o":["よらず","至らずに","及ばずに","とどまらず"],"a":2,"vi":"Nhờ sản phẩm mới bán chạy mà công ty đó đã thoát khỏi nguy cơ phá sản.","hint":"「倒産に___すんだ」→「倒産に至らずにすんだ」= 倒産という結果にならずに済んだ. 「至らずに」は否定目標到達。"},{"q":"そんなことはここではよくあることで、驚く（　）。","o":["べからず","わけではない","にはあたらない","に越したことはない"],"a":3,"vi":"Chuyện đó ở đây vốn thường xảy ra, chẳng có gì đáng ngạc nhiên cả.","hint":"「よくあることで、驚く___」→「驚くにはあたらない」固定(không đáng ngạc nhiên). 「〜には/にはあたらない」。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"妻は一度ふとんに入った ___ ___ ★ ___ と絶対に目を覚まさない。","o":["何が","が","あろう","最後"],"a":1},{"q":"火を使う際は、___ ___ ★ ___ 十分気をつけてください。","o":["ように","たりとも","一瞬","目を離さない"],"a":4},{"q":"言葉の使い方を間違えていた ___ ___ ★ ___ ことを言ってしまった。","o":["ない","失礼","極まり","ばかりに"],"a":3},{"q":"この山のような資料、いつ ___ ___ ★ ___ 。","o":["こと","読み終わる","になったら","やら"],"a":1}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"ダイエットによる減量には、思わぬ落とし穴もまっている。ダイエットに失敗したときが怖いのである。\nダイエットだけでやせると、体脂肪と同時に、【1】筋肉もおちていく。そこでダイエットをやめると、運動をしていないために筋肉がやせたまま、脂肪だけがもとにもどる。これをくりかえしていくうちに、【2-a】はへらずに【2-b】だけが相対的に衰えていくという恐ろしい状態におちいる。\n体重をおとすのは大事業であり、大変な体力と気力がいる。このような状態になってもう一度ダイエットに挑戦するために必要な筋肉まで失っては、二度とやせることができなくなってしまう。体重はさらにふえ、高齢者ではそのまま寝たきりとなってしまう人もいる。\nこれが、一般にリバウンドとよばれる現象である。リバウンドは、単に体重が【3】という点に注意したい。\n（岡田正彦著『人はなぜ太るのか―肥満を科学する』岩波書店刊）","items":[{"label":"1","o":["多かれ少なかれ","多からず少なからず","多くても少なくても","多かろうが少なかろうが"],"a":1},{"label":"2","o":["a 体重／b 脂肪","a 体重／b 筋肉","a 筋肉／b 体重","a 脂肪／b 体重"],"a":3},{"label":"3","o":["もとにもどるだけである","もとにもどるだけではない","もとにもどらないだけである","もとにもどらないだけではない"],"a":2}]}]},{"id":"r13","name":"第13回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"大臣が記者会見で突然、本日（　）辞任すると発表した。","o":["が最後","に限って","をもって","を皮切りに"],"a":1,"vi":"Trong buổi họp báo, bộ trưởng bất ngờ tuyên bố sẽ từ chức ngay hôm đó.","hint":"「本日___辞任する」→「本日が最後」= 本日限りで. 「をもって」が近いが「が最後辞任する」= 本日を最後に辞任(quyết định hôm nay là lần cuối). "},{"q":"親が留学を許してくれないなら、黙って行く（　）。","o":["ことか","ほどだ","までだ","ものか"],"a":4,"vi":"Nếu bố mẹ không cho đi du học thì tôi cũng sẽ lén đi thôi (làm sao mà chịu im lặng được).","hint":"「黙って行く___」→ 強い反問・反発→「ものか」(làm gì mà...đâu có!). 修辞的否定疑問。「までだ」は諦めの結論。"},{"q":"この番組では、（　）深海の世界を美しい映像とともにご紹介します。","o":["知りぬく","知られざる","知りかねる","知られがちな"],"a":2,"vi":"Chương trình này sẽ giới thiệu thế giới biển sâu chưa từng được biết đến qua những thước phim đẹp.","hint":"「___深海の世界」→ まだ知られていない→「知られざる」(chưa được biết đến)。「ざる」は文語否定「〜ない」。"},{"q":"日が長くなり、すっかり春（　）きましたね。","o":["びて","めいて","げになって","がちになって"],"a":2,"vi":"Ngày dài ra, đã thấy rõ không khí mùa xuân rồi nhỉ.","hint":"「すっかり春___きた」→「〜めく」=その季節/状態らしくなる(mang dáng dấp mùa xuân). 動詞化接尾辞「めく」。"},{"q":"日本語は文法の難しさ（　）、漢字が多くて大変だ。","o":["と思いきや","にひきかえ","に先駆けて","もさることながら"],"a":4,"vi":"Tiếng Nhật không chỉ ngữ pháp khó mà chữ Hán còn nhiều, rất vất vả.","hint":"「文法の難しさ___漢字が多い」→「〜もさることながら」固定= はもちろんのこと(không chỉ...mà còn). 先述の事柄も当然として追加。"},{"q":"この活動が社会に認められたことは、まことに喜び（　）。","o":["にたえません","にたりません","にあたりません","にかたくありません"],"a":1,"vi":"Việc hoạt động này được xã hội công nhận thật khiến tôi vô cùng vui mừng.","hint":"「喜び___」→「喜びにたえない」固定(vô cùng vui mừng, không kìm được). 「たえません」=堪えられないほど強い感情(trang trọng)。"},{"q":"相手（　）悪気はなかったんだから、もう許してあげなよ。","o":["ったら","あっての","であれ","にしたって"],"a":4,"vi":"Đối phương cũng đâu có ác ý gì, thôi thì tha thứ cho người ta đi.","hint":"「相手___悪気はなかった」→ 相手でさえ→「にしたって」(dù là...cũng). 「って」は「でも」の口語形。"},{"q":"眼鏡（　）コンタクト（　）、長時間の使用は目に負担がかかる。","o":["であれ／であれ","だに／だに","につけ／につけ","なり／なり"],"a":1,"vi":"Dù là kính mắt hay kính áp tròng, đeo lâu cũng gây hại cho mắt.","hint":"「眼鏡___コンタクト___」→ 二つを同列で→「であれ〜であれ」固定(dù là...hay là...). AであれBであれ=どちらにせよ。"},{"q":"その店へは一度行っただけで、場所（　）店の名前も忘れてしまった。","o":["はおろか","ばかりに","はさておき","からして"],"a":1,"vi":"Chỉ đến cửa hàng đó đúng một lần nên đừng nói địa chỉ, ngay cả tên cửa hàng tôi cũng quên mất rồi.","hint":"「場所___店の名前も忘れた」→ 場所以上に名前も→「はおろか」(đừng nói là...ngay cả...cũng). 程度が上がる。"},{"q":"兄は教師として働く（　）、小説を書き続けている。","o":["うちに","がてら","かたわら","ついでに"],"a":3,"vi":"Anh trai vừa làm giáo viên vừa tiếp tục viết tiểu thuyết.","hint":"「教師として働く___小説を書く」→ 本業と並行する継続的な別活動→「かたわら」(vừa...vừa, song song lâu dài)。「がてら」は一時的な兼務。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"合否 ___ ___ ★ ___ 、面接の結果はメールで連絡されるそうだ。","o":["に","の","かかわらず","いかん"],"a":4},{"q":"5年間 ___ ___ ★ ___ も大変だ。","o":["もの","準備","となると","海外勤務"],"a":2},{"q":"商品の欠陥は利用者の安全にかかわる ___ ___ ★ ___ すまないだろう。","o":["公表せず","だけに","には","問題"],"a":3},{"q":"簡単な漢字 ___ ___ ★ ___ 自分がいやになる。","o":["覚える","忘れてしまう","すら","そばから"],"a":4}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"世の中には「偶然は必然だ」と言う人もいるだろうし「偶然なんてただの偶然でしかない」と言う人もいるだろう。でも、ふと今まで歩いてきた道のりを振り返ると、偶然は起こるべくして起きたのかもしれないと【1】。何かがあったから、その次の何かに繋がってゆくこと。たとえ、その時には嫌な経験でも、それを体験したからこそ次の新しい段階や出会いに繋がる事もある。もしくは、その経験を【2】、その後まったく同じ物事や人に出会っても、自分の心がそれを見逃して素通りしてしまうかもしれない。\n尊敬するある大人が教えてくれた。\n「自分の所へやってきた出来事を、自分がきちんとキャッチできずに通り越してしまったら、その人にとってその出来事は全く【3】よ」\nすぐにはその意味がよくわからなかったけれど、最近少しその意味が体感できるようになった気がする。\n（小澤征良著『そら いろいろ』新潮社刊）","items":[{"label":"1","o":["思わない方がいい","思うべきではない","思わずにいられない","思うとは限らない"],"a":3},{"label":"2","o":["しないからこそ","していなければ","していないから","していないにせよ"],"a":2},{"label":"3","o":["起こらなくて当然なんだ","起こらなくても仕方ないんだ","起こらなかったも同然なんだ","起こらなかったことにするんだ"],"a":3}]}]},{"id":"r14","name":"第14回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"いかに疲れて（　）、お客様の前では笑顔を忘れないように。","o":["いつつも","いながらも","いようとも","いようにも"],"a":3,"vi":"Dù có mệt đến đâu, cũng đừng quên nụ cười trước mặt khách hàng.","hint":"「いかに疲れて___笑顔を忘れない」→「いかに〜ようとも」固定(dù có...đến mấy đi nữa). 「いかに」がある場合「ようとも」とセット。"},{"q":"どんなにロボット技術が発達（　）、介護の現場では人間の力が必要だ。","o":["しようが","してこそ","をよそに","にもまして"],"a":1,"vi":"Dù công nghệ robot có phát triển đến đâu, lĩnh vực chăm sóc người già vẫn cần đến con người.","hint":"「どんなに発達___介護には人間が必要」→ 程度に関わらず逆の結果→「しようが」(dù có...đến mấy). 「しようとも」と同義。"},{"q":"言葉ができる（　）、何の計画もなしに海外に行くのは無謀だ。","o":["こそすれ","こととて","ならでは","ならまだしも"],"a":2,"vi":"Dù biết ngôn ngữ, nhưng đi nước ngoài mà chẳng có kế hoạch gì thì thật liều lĩnh.","hint":"「言葉ができる___無謀だ」→ 逆に言えば「言葉ができるからこそリスクを軽視している」釈明→「こととて」(vì là...mà). "},{"q":"若くして事故に遭ってしまったその人に、同情（　）。","o":["の至りだ","に難くない","にたえない","を禁じ得ない"],"a":4,"vi":"Thật không kìm được nỗi xót xa khi nhìn người trẻ tuổi đó gặp tai nạn.","hint":"「同情___」→「同情を禁じ得ない」固定コロケーション(không kìm được lòng thương xót). 「感情を禁じ得ない」パターン。"},{"q":"小さな兄弟が助け合って生きる姿に、思わず（　）しまった。","o":["泣かれて","泣かせて","泣かされて","泣いてやって"],"a":3,"vi":"Tôi đã không kìm được nước mắt khi thấy hai anh em nhỏ giúp đỡ lẫn nhau để sống.","hint":"「思わず___しまった」→「泣かされてしまった」= 感動させられた→「使役受身」泣かされる(bị khiến phải khóc). 「泣かせて」は自分が他人を泣かせる。"},{"q":"この店の和菓子は手作り（　）味で本当にうまい。","o":["に限る","極まる","なりの","ならではの"],"a":4,"vi":"Bánh kẹo truyền thống của tiệm này ngon vì có hương vị riêng chỉ tự tay làm mới có.","hint":"「手作り___味」→「手作りならではの味」固定(hương vị chỉ hàng tự làm mới có). 「〜ならではの」=その固有の特性。"},{"q":"人に（　）にするのではなく、自分の頭で考えるべきだ。","o":["言われるがまま","言われながら","言われるともなし","言われっぱなし"],"a":1,"vi":"Không nên chỉ làm theo những gì người khác bảo, mà phải tự suy nghĩ bằng đầu óc của mình.","hint":"「人に___にするのではなく」→「言われるがまま」固定(làm theo y như được chỉ bảo). 「がまま」=そのまま従う。"},{"q":"気が強いあの人（　）、私が何か言っても言い返してくるだろう。","o":["にしたって","のことだから","にもかかわらず","ならいざ知らず"],"a":1,"vi":"Người đó tính khí mạnh, dù tôi có nói gì cũng sẽ cãi lại thôi.","hint":"「あの人___言い返してくる」→ その人の性質から当然→「にしたって」(kể cả...cũng). 「にしても」と同義の口語形。"},{"q":"窓を開ける（　）、さわやかな風が吹き込んだ。","o":["だに","なり","にあって","とばかりに"],"a":2,"vi":"Vừa mở cửa sổ ra là có làn gió mát thổi vào.","hint":"「窓を開ける___風が吹き込んだ」→ 開けると同時に→「なり」(vừa...là). 直後の結果を表す瞬時性。"},{"q":"調査の結果を分析（　）、こんなにデータが少なくてはやりようがない。","o":["しようが","しようと","しように も","しようかしまいか"],"a":3,"vi":"Dù có muốn phân tích kết quả khảo sát thì cũng chẳng làm được gì khi dữ liệu quá ít như thế này.","hint":"「分析___やりようがない」→「しようにも〜ない」= やろうとしてもできない(dù muốn...cũng không thể). 「〜ようにも〜ない」固定。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"高層ビルの最上階で火災 ___ ___ ★ ___ おそろしい。","o":["考える","など","に遭う","だに"],"a":4},{"q":"念願のペットを ___ ___ ★ ___ 思ったより世話が大変で苦労している。","o":["飼ったら","飼ったは","飼ったで","いいが"],"a":1},{"q":"店であの絵を一目 ___ ___ ★ ___ なってしまった。","o":["というもの","たまらなく","欲しくて","見てから"],"a":2},{"q":"人に言われず ___ ___ ★ ___ じゃないと、本当の仕事とは言えない。","o":["動く","とも","ぐらい","自分から"],"a":2}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"「最近の若い人は……」なんて言うまいと思っていたが、どうも私には、最近の若い人の対外的なコミュニケーション力が、昔と比べて低いように【1】。\n私が子どもの頃、今のように核家族で一人っ子なんていう家庭はほとんどなかった。兄弟は4,5人いて当たり前、当然、兄弟ゲンカは日常茶飯事、おじいさんやおばあさんも含めて、家の中には常時10人近い人がいるというのが普通だった。そうでなくても、隣近所は家族同然で、子どもが家の外で悪さを【2】、すぐに近所の誰かから親に伝わる仕組みになっていた。\nこのように周りには常に他者がいるという状況の中で、子どもながらに、世の中は自分の思い通りにならないことだらけだということを嫌【3】思い知らされ、次第に、自分の気持ちのコントロールのしかたや、上の人や外の人たちとのつきあい方を身に付けていった。昔は人づきあいの訓練が、家庭や地域の中で自然になされていた気がする。","items":[{"label":"1","o":["思えてならない","思っていられない","思わざるを得ない","思うよりほかない"],"a":1},{"label":"2","o":["しようにも","したがために","しようものなら","するまでもなく"],"a":3},{"label":"3","o":["ともなく","というほど","といえども","といったところで"],"a":2}]}]},{"id":"r15","name":"第15回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"この地図はいいかげんで、わかりにくい（　）ない。","o":["といえども","といえば","といっても","といったら"],"a":4,"vi":"Tấm bản đồ này vẽ ẩu, không thể nói hết là khó hiểu đến mức nào.","hint":"「わかりにくい___ない」→「〜といったらない」固定(không thể nói hết là...đến mức nào). 「ない」で終わる否定の強調慣用句。"},{"q":"喫茶店で隣の席の人の話を聞く（　）聞いていたら、知り合いの名前が出てきた。","o":["ことなく","ともなく","とばかりに","までもなく"],"a":2,"vi":"Trong quán cà phê, tôi tình cờ nghe được câu chuyện của người bàn bên và bất ngờ nghe thấy tên người quen.","hint":"「聞く___聞いていたら」→ 意図せずに聞いた→「ともなく」(không chủ ý mà). 「ことなく」は〜ずに、「ばかりに」は原因。"},{"q":"こんな管理体制では事故が起きて当然だ。この事故は（　）起こったのだ。","o":["起ればこそ","起ころうとして","起るまじとして","起るべくして"],"a":4,"vi":"Với cơ chế quản lý lỏng lẻo thế này thì việc xảy ra tai nạn cũng là điều tất yếu phải xảy ra.","hint":"「この事故は___起こったのだ」→「起こるべくして起こった」固定(tất yếu phải xảy ra). 「べくして」は必然性の強調。"},{"q":"この文章は何が言いたい（　）さっぱりわからない。","o":["ながら","なりに","のなら","のやら"],"a":4,"vi":"Bài văn này chẳng hiểu muốn nói gì, tôi hoàn toàn không hiểu nổi.","hint":"「何が言いたい___さっぱりわからない」→ 不明・疑問の宙吊り→「のやら」(không biết...thế nào). 「のなら」は仮定。"},{"q":"手紙を（　）消し（　）消ししているうちに、朝になってしまった。","o":["書いては／書いては","書こうと／書こうと","書きつつ／書きつつ","書くまいと／書くまいと"],"a":1,"vi":"Tôi cứ viết thư rồi xóa, viết rồi lại xóa, đến khi xong thì trời đã sáng.","hint":"「手紙を___消し___消し」→ 反復動作→「〜ては〜ては」固定(lặp đi lặp lại). 「書いては消し」のペア動詞。"},{"q":"当店のポイントサービスは、今年度（　）終了いたします。","o":["限りで","を兼ねて","にあって","次第で"],"a":1,"vi":"Dịch vụ tích điểm của cửa hàng sẽ kết thúc từ năm nay trở đi.","hint":"「今年度___終了」→「〜限りで終了」固定(kể từ năm nay sẽ kết thúc). 期限を明示する「〜限りで」。「次第で」は条件次第。"},{"q":"地元の人（　）見たことがないようなめずらしい鳥の撮影に成功した。","o":["でこそ","ですら","なりに","ゆえに"],"a":2,"vi":"Họ đã chụp được ảnh một loài chim hiếm mà ngay cả người địa phương cũng chưa từng thấy.","hint":"「地元の人___見たことがない鳥」→ 地元の人でさえも→「ですら」(ngay cả...cũng). 「でこそ」は肯定強調で逆。"},{"q":"比較（　）、新型の機種は古いものよりもはるかに性能がいい。","o":["するべく","したからには","しようものなら","するまでもなく"],"a":4,"vi":"Không cần so sánh cũng biết loại máy mới có hiệu năng tốt hơn hẳn loại cũ.","hint":"「比較___性能がいい」→ 言うまでもなく明らか→「するまでもなく」(không cần phải so sánh). 「べく」は目的。"},{"q":"最近の小学生（　）、携帯は持つわ化粧はするわで、昔とは大違いだ。","o":["とあれば","ときたら","としたら","のわりに"],"a":2,"vi":"Học sinh tiểu học bây giờ thì khỏi phải nói, vừa dùng điện thoại vừa trang điểm, khác hẳn ngày xưa.","hint":"「最近の小学生___携帯・化粧」→ 驚くべき特徴を持ち出す批判的話題→「ときたら」(nói đến...thì). 「とあれば」は条件。"},{"q":"そんなに疑うんなら、自宅（　）自由に捜索してください。","o":["からなにから","なりなんなり","やらなんやら","よりなにより"],"a":2,"vi":"Nếu nghi ngờ vậy thì cứ tự do lục soát nhà tôi, hay làm gì cũng được.","hint":"「自宅___捜索してください」→ 自宅でも他でも何でもどうぞ→「なりなんなり」(hay gì cũng được)。選択の開放表現。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"調査 ___ ___ ★ ___ 事故の原因を究明した。","o":["を","に","重ねて","調査"],"a":3},{"q":"行きたくなくても ___ ___ ★ ___ 得ない。","o":["とあれば","を","行かざる","上司の命令"],"a":3},{"q":"今さら ___ ___ ★ ___ しょうがないじゃないか。","o":["ああだの","言った","こうだの","ところで"],"a":2},{"q":"彼の歌声は、その場にいるすべての人を ___ ___ ★ ___ 美しかった。","o":["には","ほど","おかない","ひきつけず"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"日本の料理ほど微妙で、繊細なものはない。それは原料に加工するのではなく、たとえば木工が、自然の木の材質を生かすのと同じように、魚や野菜が本来持っている味を、いわば内部からひきだすことにかかっているように思われる。材料が新鮮なら、醤油か塩で食べるに【1】。そういう点では、西洋料理や中国料理とは本質的に違っており、日本には料理がないといわれる所以でもある。\nたしかに私たちの国では、外国のような調理法は【2】。海の幸、山の幸に、恵まれすぎていたからだ。そこに彼らとはまったく別な味わい方が生れた。四季折々のシュンを尊ぶこと、包丁さばきから器のえらび方、その盛りつけ【3】、自然の味を生かすことに細心の注意がはらわれる。\n（白洲正子著『日本のたくみ』新潮社刊）","items":[{"label":"1","o":["難くない","たえない","あたらない","越したことはない"],"a":1},{"label":"2","o":["発達してきた","発達しすぎた","発達しなかった","発達させなかった"],"a":3},{"label":"3","o":["と相まって","に至るまで","に限って","をはじめとして"],"a":4}]}]},{"id":"r16","name":"第16回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"経歴から見てどんな厳しい人（　）、とても気さくで明るい人だった。","o":["ときたら","とみると","かのごとく","かと思いきや"],"a":4,"vi":"Cứ tưởng là người nghiêm khắc nhìn từ lý lịch, nhưng hóa ra lại rất thân thiện và vui vẻ.","hint":"「どんな厳しい人___気さくだった」→ 予想を裏切る実態→「かと思いきや」(cứ tưởng là...nhưng hóa ra). 予想の否定。"},{"q":"答案用紙に名前を書くのを忘れてしまったので、もう合格は望む（　）。","o":["べからず","べくもない","には及ばない","には至らない"],"a":2,"vi":"Vì quên ghi tên vào bài thi nên không còn hy vọng đậu nữa rồi.","hint":"「もう合格は望む___」→「望むべくもない」=望むことができない(không thể mong được). 「べくもない」固定。"},{"q":"一人でも多くの顧客を獲得（　）、社員一丸となって営業活動を行っている。","o":["せんがため","せんばかりの","するがゆえ","するごとく"],"a":1,"vi":"Để giành được càng nhiều khách hàng càng tốt, toàn thể nhân viên đang đồng lòng đẩy mạnh hoạt động kinh doanh.","hint":"「顧客を獲得___社員一丸」→ 目的のために全力→「せんがため」(để mà... mục đích cổ văn). 「〜んがため」強い意図。"},{"q":"この作曲家は難病に苦しみ（　）、数々の名曲を残した。","o":["にせよ","ながらも","はおろか","のみならず"],"a":2,"vi":"Nhà soạn nhạc này dù mắc bệnh hiểm nghèo vẫn để lại nhiều tác phẩm để đời.","hint":"「難病に苦しみ___名曲を残した」→ 逆境を超えての達成→「ながらも」(tuy...nhưng vẫn). 「にせよ」は条件的。"},{"q":"周囲の非難を（　）、監督は独自の戦術でチームを勝利に導いた。","o":["踏まえて","禁じ得ず","ものともせず","余儀なくされ"],"a":3,"vi":"Bất chấp sự chỉ trích từ xung quanh, huấn luyện viên đã dẫn dắt đội bằng chiến thuật riêng để giành chiến thắng.","hint":"「非難を___監督は勝利」→ 障害を物ともせず→「ものともせず」(bất chấp). 「禁じ得ず」は感情抑制。"},{"q":"親は子どものことを心配（　）うるさいことも言うのだ。","o":["するべく","しこそすれ","すればこそ","するからには"],"a":2,"vi":"Cha mẹ chỉ lo lắng nên mới hay nói những điều khó nghe với con cái.","hint":"「心配___うるさいことも言う」→「心配しこそすれ」固定= 心配はするものの(chỉ lo lắng, không có gì khác). 「こそすれ〜ない」パターン。"},{"q":"彼とはもう長くつきあっているが、いざ結婚（　）迷ってしまう。","o":["につけ","とあれば","となると","にしては"],"a":3,"vi":"Tuy đã quen nhau lâu nhưng hễ nói đến chuyện kết hôn là anh ấy lại do dự.","hint":"「いざ結婚___迷ってしまう」→「いざ〜となると」固定(mỗi khi đến lúc...thực sự thì). 実際の局面になると逡巡。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"その男は私を見るなり、まるで幽霊 ___ ___ ★ ___ 驚いて逃げていった。","o":["見た","でも","のごとく","か"],"a":4},{"q":"あの工場からの排水が環境破壊 ___ ___ ★ ___ 。","o":["という","なんだ","のだろう","でなくて"],"a":1},{"q":"海外勤務の息子が家に帰ってくるのは、年に一度 ___ ___ ★ ___ だ。","o":["といった","ないか","ところ","あるか"],"a":1}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"捨てなきゃいけない――これが、現代に生きている私たちにとっての至上命題だ。\n今の暮らしにはモノが溢れ、【1】増えつづける。職場には書類が山積みだし、家庭では収納スペースがいくらあってもモノをしまいきれない。ただでさえ狭いスペースが、モノの増殖によってさらに狭くなり、なんとかしなきゃと【2】モノに囲まれて暮らしているのが現状だ。内心、全部捨てたらどんなにすっきりするだろう、と思っている人も【3】。\n一方で、1990年代をとおしてエコロジー志向が浸透し、地球にやさしい暮らしをしよう、モノをリサイクルしよう、ゴミを出さないようにしよう、という動きが定着している。また、平成不況と呼ばれた91年に始まる不況も、すでに十年めに入った。稼ぎ手のリストラや、百貨店やスーパーの倒産・閉店が相次ぐ【4】わかるように、家計は引き締められている。不要なモノを買う余裕は、それほどないはずである。\n【5】、暮らしのなかにはモノが溢れかえっている。なぜなのだろう。どうして、モノは減らないのだ。\n（辰巳渚著『「捨てる！」技術』宝島社刊）","items":[{"label":"1","o":["捨てたら捨てたで","捨てても拾っても","捨てても捨てても","捨てたり拾ったり"],"a":3},{"label":"2","o":["思いつつ","思っては","思いかけて","思ってまで"],"a":1},{"label":"3","o":["少ないだろう","少ない限りだ","少なくないはずだ","少なくないからだ"],"a":3},{"label":"4","o":["こととて","ことからも","ものだから","ものゆえに"],"a":2},{"label":"5","o":["それなのに","それゆえに","そればかりか","だからこそ"],"a":1}]}]},{"id":"r17","name":"第17回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"毎日こんなに大量の食べ物が捨てられているなんて、もったいない（　）だ。","o":["至り","限り","極み","始末"],"a":4,"vi":"Bao nhiêu đồ ăn bị vứt bỏ mỗi ngày như thế này, thật quá lãng phí.","hint":"「もったいない___だ」→「もったいない始末だ」= こんな嘆かわしい事態(quá lãng phí đến mức đáng tiếc). 「始末だ」は悪い状況の結末。"},{"q":"犯人がどんな罰を（　）、被害者の心の傷はずっと残るだろう。","o":["受けたなら","受けようと","受けこそすれ","受けたつもりでも"],"a":2,"vi":"Dù thủ phạm có nhận hình phạt thế nào, vết thương lòng của nạn nhân vẫn sẽ còn mãi.","hint":"「どんな罰を___傷はずっと残る」→ 仮定の条件に無関係→「受けようと」(dù có...đi nữa). 「〜ようと」は譲歩の仮定。"},{"q":"彼女の演技は未熟であるが（　）、今後の成長が楽しみだ。","o":["ゆえに","よそに","ながらも","ばかりに"],"a":3,"vi":"Diễn xuất của cô ấy tuy còn non nhưng rất đáng mong đợi trong tương lai.","hint":"「未熟であるが___成長が楽しみ」→ 欠点を認めつつ逆接→「ながらも」(tuy...nhưng vẫn). 「が」はここで逆接機能。"},{"q":"妹はさっきから鏡の前でポーズをとって、モデルにでもなった（　）だろうか。","o":["ふり","もの","つもり","ごとく"],"a":4,"vi":"Em gái cứ tạo dáng trước gương từ nãy đến giờ, không biết có phải đang tưởng tượng mình là người mẫu hay không.","hint":"「モデルにでもなった___だろうか」→「まるで〜ごとく」比喩表現(cứ như là). 「ごとく」は文語的な比喩。"},{"q":"日本語の勉強を始めて1カ月（　）2カ月では、新聞を読むのは難しい。","o":["と","や","すら","なら"],"a":4,"vi":"Mới học tiếng Nhật được 1-2 tháng thì khó mà đọc được báo.","hint":"「1カ月___2カ月では新聞を読めない」→ 「1カ月なら2カ月」= 極端な比較→「なら」. 「や」は列挙。"},{"q":"部下の苦労を（　）部長はまた方針を変えた。","o":["知ろうにも","知ったところで","知らないなりに","知りもしないで"],"a":2,"vi":"Dù trưởng phòng có biết nỗi vất vả của cấp dưới thì cũng vẫn đổi phương châm như cũ.","hint":"「知った___また方針を変えた」→「〜たところで〜ない」パターン(dù có biết...cũng không thay đổi). 知識が結果に影響しない。"},{"q":"つまらないことで夫婦げんかばかりして、父も父（　）母も母だ。","o":["だの","なら","なり","やら"],"a":1,"vi":"Vì cãi nhau vài chuyện vặt vãnh mà cả hai vợ chồng cứ trách móc lẫn nhau mãi.","hint":"「父も父___母も母」→「〜だの〜だの」= 複数の要素を挙げて批判. 「父も父だの母も母だの」→「父はそれとして、母もまた…」"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"窓の外を ___ ___ ★ ___ いたら、バイクがトラックにぶつかった。","o":["なしに","とも","見る","見て"],"a":1},{"q":"平日なら ___ ___ ★ ___ 入園まで1時間は待つことになるだろう。","o":["連休とも","いざ","なると","知らず"],"a":3},{"q":"携帯電話 ___ ___ ★ ___ 、大げさに騒ぎすぎだよ。","o":["なくしても","なんか","じゃあるまいし","死ぬわけ"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"僕は、5年前に今の会社に【1】、まとまった休暇を取ったことはなかった。僕の会社では、社員は1年に1度長期休暇を取ることが認められている。しかし、僕は、特にやりたいこともなかったし、長い休みが【2】、暇をもてあますだけだろうと思っていたから、これまでずっと長期休暇を取らずにきた。\nしかし、先日、僕は入社以来はじめて長期休暇を申請した。僕にそうさせたのは、ある風景写真だった。仕事帰りに立ち寄った本屋で偶然手にした一冊の雑誌。そこに掲載されていた一枚の写真を見た【3】、僕はどうしてもその場所に行ってみたいという気持ちになった。行かなくてはいけないとさえ思った。自分でもうまく説明できない、不思議な感覚だった。そして、その思いは日に日に強くなり、ついに、1週間の休暇を願い出ることにしたのだ。\nちょうど大きなプロジェクトが始まったばかりで仕事が忙しく、さぞかし迷惑がられるだろう【4】、上司はあっさり許可してくれた。それどころか、「君は働きすぎじゃないかと心配していたところだよ。仕事のことは心配しなくていい。ゆっくり休んでリフレッシュしなさい」と笑顔で言われ、正直かなり驚いた。\n【5】、こうして僕は、あの写真の地を訪れるための時間を手に入れた。夏休みとあって、予約を取るのに苦労したものの、何とか航空券も確保した。24時間後には太平洋の上を飛んでいるはずである。こんなにワクワクした気分を味わうのは何年ぶりだろう。今夜はなかなか眠れそうにないが、明日の朝は早起きしなければならない。そろそろ寝るとしよう。","items":[{"label":"1","o":["就職するなり","就職したからといって","就職したところで","就職してからというもの"],"a":4},{"label":"2","o":["あればこそ","あったものの","あったところで","あるからといって"],"a":2},{"label":"3","o":["とたん","ついでに","どころか","とあれば"],"a":1},{"label":"4","o":["といえども","と思いつつ","ものなら","と思いきや"],"a":4},{"label":"5","o":["すなわち","とはいえ","せっかく","ともかく"],"a":1}]}]},{"id":"r18","name":"第18回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"新型車の発売（　）、各地で試乗会が開かれた。","o":["を境に","に至って","を皮切りに","に先駆けて"],"a":3,"vi":"Nhân dịp ra mắt xe mới, các buổi lái thử đã được tổ chức khắp nơi.","hint":"「新型車の発売___試乗会が開かれた」→ 発売を起点に→「を皮切りに」(lấy...làm khởi đầu). 「を境に」は変化の境目。"},{"q":"叱られるか（　）、逆に「よくやった」と褒められたので驚いた。","o":["に反して","といえども","と思いきや","と思いつつ"],"a":3,"vi":"Cứ tưởng sẽ bị mắng, ai ngờ lại được khen \"làm tốt lắm\" nên rất bất ngờ.","hint":"「叱られるか___褒められた」→ 予想と逆の展開→「と思いきや」(cứ tưởng...nhưng hóa ra). 「に反して」は予想とは逆の事実。"},{"q":"会場では招待客を迎える（　）、着々と準備が進められている。","o":["べき","べく","ところに","ところを"],"a":2,"vi":"Tại hội trường, mọi người đang khẩn trương chuẩn bị để đón khách mời.","hint":"「招待客を迎える___準備が進められている」→ 目的のための準備→「べく」(để mà...mục đích). 「べく」は「ために」の文語的表現。"},{"q":"子どもの騒ぐ声がうるさくて、テレビの音も聞こえ（　）。","o":["やしない","ないったらない","ないものやら","ない限りだ"],"a":2,"vi":"Tiếng trẻ con ồn ào đến mức không nghe rõ cả tiếng tivi.","hint":"「音も聞こえ___」→「聞こえないったらない」固定(không thể nào nghe được). 「〜ないったらない」=不可能の口語強調。"},{"q":"山の中で道に迷ってしまい、食べ物（　）水もないまま歩き続けた。","o":["ともなく","なくして","はおろか","はいざ知らず"],"a":1,"vi":"Trong núi bị lạc đường, anh ấy cứ đi mãi mà không có cả đồ ăn lẫn nước uống.","hint":"「食べ物___水もない」→ 二つとも欠如した状況→「ともなく」(không có cả...lẫn). 「食べ物ともなく水もない」=両方ない。"},{"q":"客が（　）、閉店時間前に店を閉めるわけにはいかない。","o":["いようといまいと","いようかいるまいか","いるともいないとも","いるなりいないなり"],"a":1,"vi":"Dù khách có đến hay không, cũng không thể đóng cửa trước giờ quy định.","hint":"「客が___閉店時間前に閉めるわけにはいかない」→ 客の有無に関わらず→「いようといまいと」(dù có khách hay không). 双方の条件に無関係。"},{"q":"両社はその事業での協力を（　）、長年の間、親密な関係を続けてきた。","o":["契機に","限りに","もって","ものともせず"],"a":1,"vi":"Lấy việc hợp tác trong dự án đó làm cơ hội, hai công ty đã duy trì quan hệ thân thiết suốt nhiều năm.","hint":"「協力を___関係を続けた」→「〜を契機に」固定(lấy...làm cơ hội/bước ngoặt). 「を機に」よりやや硬い表現。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"住む部屋は、安ければ ___ ___ ★ ___ 、広さと環境も重要だ。","o":["越した","それに","ないが","ことは"],"a":4},{"q":"彼との結婚を両親が認めてくれないなら ___ ___ ★ ___ 。","o":["ことだ","までの","家を","出る"],"a":2},{"q":"彼は代議士の ___ ___ ★ ___ 政治家を目指して勉強している。","o":["自らも","かたわら","をする","秘書"],"a":2}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"相手に質問しておきながら、相手が答えを言うと、「それは違う」「そんなのナンセンスだ」などと、即座にその答えを否定してしまう人がいます。このような人は他人に質問する資格がありません。もちろん誰かを育てようとしていて、わざと相手の答えを否定することはありますし、厳しい交渉においては相手の主張を即座に否定しなければならない場面もあります。しかし、常に相手の答えを否定し、自分の考えのみを【1】、何も質問などする必要がありません。自分の考えだけ話していればいいのです。\nこのような人は、自分の考えの方が相手の考えよりも優れていることを証明【2】相手の答えを否定する傾向にあります。相手の答えを「それはすばらしい」などと言うと自分が劣っているような感じになってしまって自尊心が傷つくので、「その考えは間違っている。正しい答えを教えてあげよう」【3】相手の答えを否定してしまうのです。\n相手の答えを即座に否定してしまう人は、それによって自分の優秀さを証明【4】ことを知らなければなりません。むしろ相手は気分を害してしまい、「人の気持ちも理解できないわからず屋だ」と感じ、離れていってしまうでしょう。\n相手に質問を【5】、相手の答えをじっくり聞き、その答えを受け入れるようにしましょう。相手の答えを否定したくなったら、「ここで答えを否定することにより、相手はどんな気分になるだろう。また、私たちが話し合っていることに対してプラスになるだろうか」と自問してから発言するように心がけましょう。\n（谷原誠著『人を動かす質問力』角川書店刊）","items":[{"label":"1","o":["述べるのだから","述べるに際して","述べるのであれば","述べるはずだから"],"a":3},{"label":"2","o":["するなりに","しこそすれ","する限りに","したいがために"],"a":4},{"label":"3","o":["とみえて","とばかりに","ともなく","とすべく"],"a":2},{"label":"4","o":["しなくはない","したことにはならない","することになる","できないこともない"],"a":2},{"label":"5","o":["したからには","するくらいなら","してからというもの","することのないように"],"a":1}]}]},{"id":"r19","name":"第19回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"バレーボールの選手になりたいなら、身長は高い（　）だろう。","o":["といわんばかり","といったらない","に越したことはない","に限ったことではない"],"a":3,"vi":"Nếu muốn trở thành vận động viên bóng chuyền thì chiều cao càng cao càng tốt.","hint":"「身長は高い___だろう」→「〜に越したことはない」固定(không gì bằng...tốt nhất là). 「高ければ高いほどいい」の意。"},{"q":"結婚してから、彼は以前（　）まじめに働くようになった。","o":["と相まって","にもまして","ならいざ知らず","としたところで"],"a":2,"vi":"Sau khi kết hôn, anh ấy làm việc chăm chỉ hơn cả trước đây.","hint":"「以前___まじめに働く」→ 以前との比較・上回り→「にもまして」(hơn cả trước đây). 比較の基準を超える強調。"},{"q":"私が書いた論文は、先輩の論文の足元にも（　）ものだった。","o":["及ばない","すまない","たえない","足りない"],"a":1,"vi":"Luận văn tôi viết còn kém xa so với luận văn của tiền bối.","hint":"「足元にも___ものだった」→「足元にも及ばない」固定慣用句(không theo kịp được). 「〜の足元にも及ばない」で「遥かに劣る」。"},{"q":"この記事は、取材に決して手を抜かない彼（　）はじめて書けたのだろう。","o":["にして","にせよ","をおいて","をもって"],"a":1,"vi":"Bài báo này chắc chỉ có anh ấy - người không bao giờ làm việc lấy lệ - mới viết nổi.","hint":"「彼___はじめて書けた」→「〜にして初めて」= その人だからこそできた(chính nhờ...mới). 「にして」は状態・条件の強調。"},{"q":"このめがねをかけると、まるで映像が目の前にある（　）見える。","o":["とみえて","かのように","とばかりに","かと思いきや"],"a":2,"vi":"Đeo chiếc kính này vào, cảm giác như hình ảnh hiện ngay trước mắt.","hint":"「まるで映像が目の前にある___見える」→「まるで〜かのように」固定(như thể là...vậy). 「まるで」がセット。"},{"q":"問題は以前から指摘されていたが、今日（　）まったく改善されていない。","o":["限りで","に至るまで","はさておき","はもとより"],"a":2,"vi":"Vấn đề đã được chỉ ra từ trước nhưng đến giờ vẫn chưa được cải thiện chút nào.","hint":"「今日___まったく改善されていない」→「今日に至るまで」固定(đến tận hôm nay vẫn). 時間の継続強調。「はさておき」は無関係を示す。"},{"q":"何日も眠れず、（　）悩んで、仕事をやめることにした。","o":["悩みに","悩まずとも","悩もうにも","悩むともなく"],"a":1,"vi":"Mất ngủ nhiều đêm liền, suy nghĩ mãi rồi quyết định nghỉ việc.","hint":"「___悩んで」→「悩みに悩む」固定の強調反復(悩み重ねる)(suy nghĩ mãi). 動詞を名詞化して繰り返す強調パターン。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"救命士 ___ ___ ★ ___ も冷静さを保つことが求められる。","o":["に","は","緊急時","あって"],"a":3},{"q":"いくら忙しくても、時間がない ___ ___ ★ ___ 趣味があるはずだ。","o":["なら","できる","ない","なりに"],"a":4},{"q":"母は父が亡くなってから ___ ___ ★ ___ 泣いている。","o":["という","は","父を思い出して","もの"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"ひとり暮らしを始めてから料理をする機会が【1】しまった。自分ひとりだけのためだと思うと面倒になり、つい外食ですませたり、作る【2】なるべく短時間で簡単にできるものを選ぶようになる。たまには凝った料理に挑戦してみようと思うこともあるが、たいてい作っている過程で味見をしすぎ、お腹がいっぱいになってしまうから、さあ、出来上がりましたという瞬間の感激が薄れて面白味に欠ける。その上、できた料理が必ず余ってしまい、何日も連続して同じものを食べなくてはならなくなるのは辛い。\n料理の腕というものは、その料理を【3】相手があってこそ磨かれるもののようだ。「うまい」「まずい」と反応されて初めて次回への意欲にも、反省にもつながる。自分が食欲のないときでさえ、飢えた家族のためには台所に【4】。必然、レパートリーはふえ、上手な手順を身につけることになるのだろう。\n学生時代にはまったく料理と縁のなかった友人が、\n「主婦って大変なのよ」\nと言いながら、メキメキと腕を上げ、おいしい手料理を披露してくれたりすると、羨望のまなざしを向けてしまう。\n「私【5】昔は、母の手伝いをしながらずいぶん色々な料理を覚えたものなんだけど」\nと言いたいところだが、その料理も作らなければ意味はない。\n（阿川佐和子著『メダカの花嫁学校』文藝春秋刊）","items":[{"label":"1","o":["めっきり減って","かえって増えて","めったにしなくなって","たちまち増えて"],"a":1},{"label":"2","o":["にかけて","にしても","にすれば","につけ"],"a":2},{"label":"3","o":["食べられる","食べさせる","食べさせられる","食べられてしまう"],"a":2},{"label":"4","o":["立たざるを得ない","立つどころではない","立たずにはいられない","立つことにはならない"],"a":1},{"label":"5","o":["こそ","であれ","だって","ときたら"],"a":3}]}]},{"id":"r20","name":"第20回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"家族の協力（　）、この作品を完成させることはできなかった。","o":["でなくて","なしには","ことなしに","ではあるまいし"],"a":2,"vi":"Nếu không có sự hợp tác của gia đình thì tác phẩm này đã không thể hoàn thành.","hint":"「家族の協力___完成できなかった」→「〜なしには〜ない」固定(nếu không có...thì không thể). 「なくして」も同義だが「なしには」が慣用的。"},{"q":"明日の会には（　）、開始時間には間に合わないだろう。","o":["行かずとも","行かずには","行けないまでも","行けなくはないが"],"a":4,"vi":"Tuy không phải là không thể đi họp ngày mai, nhưng chắc sẽ không kịp giờ bắt đầu.","hint":"「___開始時間には間に合わない」→「行けなくはないが」= 行けないわけではないが(không phải là không thể đi, nhưng). 二重否定の弱い可能性。"},{"q":"弁護士（　）者が、犯罪にかかわっていたとは驚きだ。","o":["ごとき","に至る","くらいの","ともあろう"],"a":4,"vi":"Thật bất ngờ khi một người làm luật sư lại dính líu đến tội phạm.","hint":"「弁護士___者が犯罪に」→「〜ともあろう者が」固定(một người danh tiếng như...mà lại). 高い地位に期待しての驚き・批判。"},{"q":"父は何を食べても、おいしい（　）まずい（　）言わない。","o":["とて／とて","とも／とも","なり／なり","やら／やら"],"a":2,"vi":"Bố tôi ăn gì cũng không khen ngon cũng chẳng chê dở, chẳng nói gì cả.","hint":"「おいしい___まずい___言わない」→「〜とも〜とも言わない」固定(không nói là...hay là...). 両方を言わない表現。"},{"q":"帰国する前にもう一度クラスの友達に会いたいと思いながら、結局（　）。","o":["会えずじまいだった","会わざるを得なかった","会わんばかりだった","会えないでもなかった"],"a":1,"vi":"Dù muốn gặp lại bạn cùng lớp trước khi về nước, rốt cuộc tôi vẫn không gặp được.","hint":"「会いたいと思いながら結局___」→「〜ずじまいだった」固定(rốt cuộc không). 〜したかったのにできなかった後悔。"},{"q":"決勝戦のプレッシャーは、他の試合とは（　）ならないほどだった。","o":["比べものに","比べようが","比べずには","比べるべくも"],"a":1,"vi":"Áp lực của trận chung kết không thể so sánh được với các trận khác.","hint":"「___ならないほどだった」→「比べものにならない」固定慣用句(không thể so sánh). 「比べものに」は固定表現の一部。"},{"q":"彼女が出て行こうとすると、彼は「行くな」と（　）強く抱きしめた。","o":["いえども","思いきや","ばかりに","ごとく"],"a":3,"vi":"Khi cô ấy định bước ra, anh ấy đã ôm chặt cô như muốn nói \"đừng đi\".","hint":"「行くな___強く抱きしめた」→ 言葉の代わりの行動表現→「とばかりに」(như muốn nói rằng). 行動が言葉を代弁。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"久しぶりの実家では ___ ___ ★ ___ で迎えてくれた。","o":["誕生日でも","ずくめ","ないのに","ごちそう"],"a":4},{"q":"会場は混雑のため中に入れず、係員に ___ ___ ★ ___ 列に並んだ。","o":["まま","が","に","言われる"],"a":1},{"q":"利用者の ___ ___ ★ ___ 見直しが必要になるかもしれない。","o":["商品の","反応","では","いかん"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"グループで山に行くと、つい、まわりに頼りがちになりますが、いつも自分が主体でないとだめです。歩くのは自分。リーダーがどんなにベテランでも、ただ一緒にいるという【1】、その人と手をつないで歩くわけじゃないし、おんぶしてもらうわけでもありません。主人公はいつも自分なんです。\nひとりの【2】で一日の行程やコースタイムの配分などを気にしていれば、精神面で楽になるし、ずいぶんたくさんのことが学べます。\nたとえば出発前に地図を見ておけば、どこで登りが続くか、どこが急な下りかなど、一日の行程できつそうな場所が分かるので、心づもりができます。このあたりが休憩に適しているな、お昼はここかなと自分【3】プランを描いておけば、リーダーの判断と比べることもできます。地図を読む力もつきます。(中略)\n【4】ひとりで行くほうが力がつくのではないか、あるいは、山はひとりで登りたいという人がいるかもしれませんが、事故を防ぐためには単独でないほうがいいと思います。何かあっても助けを求めることができませんからね。\nわたし自身はどうかというと、ひとりだと山を楽しむ気分にあまりなれません。危険度が高まるし、風の向きや現在地の確認など常に注意を払う必要があるから、気が休まらないのです。誰かと一緒のほうが、ずっとリラックスできます。「かわいい花と出会えてよかったねー」と【5-a】、「本当ねー」と【5-b】人がいたほうがいい。ひとりで「いいねー」と言ってもしょうがないですよね。\n（田部井淳子著『いつでも山を』小学館刊　※一部省略あり）","items":[{"label":"1","o":["こととて","ことなしに","だけとはいえ","だけのことで"],"a":4},{"label":"2","o":["せい","つもり","ふり","わけ"],"a":2},{"label":"3","o":["なりに","あっての","に即して","として"],"a":1},{"label":"4","o":["それから","それでも","それとも","それなら"],"a":2},{"label":"5","o":["a 言ったら／b 言ってあげる","a 言ったら／b 言ってくれる","a 言ってあげたら／b 言う","a 言ってくれたら／b 言う"],"a":2}]}]},{"id":"r21","name":"第21回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"明日、知事から何か重大な発表がある（　）。","o":["限りだ","とされる","に至った","とのことだ"],"a":4,"vi":"Nghe nói ngày mai thống đốc sẽ có thông báo quan trọng.","hint":"「重大な発表がある___」→ 伝聞情報の伝達→「とのことだ」(nghe nói là). 「とされる」は評価・認定を表す受身。"},{"q":"いくら走った（　）、もう1時半の電車には間に合わないだろう。","o":["ゆえに","わりに","ところで","ものだから"],"a":3,"vi":"Dù có chạy thế nào cũng không kịp chuyến tàu 1 giờ rưỡi nữa.","hint":"「いくら走った___間に合わない」→「〜たところで〜ない」パターン(dù có...đi nữa cũng vô ích). 「ゆえに」は理由。"},{"q":"この化粧品に入っている成分は、肌の老化を防ぐと（　）。","o":["している","させている","されている","させられている"],"a":1,"vi":"Thành phần trong mỹ phẩm này được cho là có tác dụng ngăn ngừa lão hóa da.","hint":"「老化を防ぐと___」→ 一般的な主張・定説→「されている/とされている」(được cho là). 「させている」は使役。"},{"q":"バイクで転倒して、背中（　）足（　）、全身傷だらけになった。","o":["なり／なり","につけ／につけ","というか／というか","といわず／といわず"],"a":1,"vi":"Bị ngã xe máy, lưng cũng bị thương, chân cũng bị thương, toàn thân đầy vết thương.","hint":"「背中___足___全身傷だらけ」→ 全ての部位を区別なく→「といわず〜といわず」固定(không kể...hay...đều). "},{"q":"姉（　）、僕には男性としての魅力がまったくないらしい。","o":["からして","のことだから","いかんによらず","から言わせれば"],"a":3,"vi":"Bất kể chị tôi nói gì, hình như tôi hoàn toàn không có sức hút với phái nam.","hint":"「姉___僕には魅力がない」→ 姉の言葉を根拠にすると→「いかんによらず」(bất kể) ではなく「から言わせれば」正解. 前後関係に注意。"},{"q":"科学の力で新たな生命を作り出すなど、考える（　）恐ろしい。","o":["さえ","だに","のみ","ばかりに"],"a":4,"vi":"Chỉ riêng việc nghĩ đến chuyện tạo ra sự sống mới bằng khoa học thôi cũng đã thấy đáng sợ rồi.","hint":"「考える___恐ろしい」→「考えるだに恐ろしい」固定(chỉ mới nghĩ đến thôi đã thấy kinh). 「だに」=「さえ」の文語強調。"},{"q":"「申し訳ない」と（　）問題じゃないだろう。ちゃんと弁償してくれ。","o":["謝ってすむ","謝ってくれる","謝ったところで","謝ったといえども"],"a":3,"vi":"Chỉ nói \"xin lỗi\" thôi thì chưa giải quyết được vấn đề. Hãy đền bù đàng hoàng đi.","hint":"「謝ったところで問題じゃない」→「〜たところで〜ない」パターン(dù có xin lỗi...cũng không giải quyết được). "}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"いくら探してもないところを ___ ___ ★ ___ に違いない。","o":["置いてきた","かばんに入れた","みると","つもりで"],"a":1},{"q":"戦争は新たに ___ ___ ★ ___ 解決にもならない。","o":["こそすれ","何の","憎しみを","生み"],"a":2},{"q":"あの有名な教授 ___ ___ ★ ___ 心強いことだ。","o":["とは","までも","が","協力してくれる"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"人がほかの生きものと違うのは、文字や言葉で意思を伝え合えることです。人は、この能力のおかげで、ほかの生きものには見られない繁栄をとげてきました。ところが今日では「話すのは好きだが、書くのは苦手」という人がふえました。とくに若い人たちの間でそうした声が多く【1】。\n人はこれまで、主として文字によって、時代と地域をこえて、文化を伝え、歴史を残してきたのです。したがって、いかなる地域【2-a】、いかなる時代【2-b】、文字の重要性が減るとは思われません。その文字によってつくられるのが文章です。ですから、文字が嫌いだ、文章は得意でない、というのは、私たちの現在を未来につなぐ上で、大変困った事態だと考えられます。\n【3】、学校や社会では、このところ文章力の向上策が注目され、入学試験や入社試験でも、文章力の有無が問われるようになってきました。私は新聞記者として、自分で文章を書くほか、ほかの人の文章も数多く読んできました。ことにカルチャーセンターや大学で文章表現のクラスを持ってから、いっそう文章づくりにかかわるようになりました。(中略)\n人は、文章をまとめることで自分をしっかりと認識できます。自分が分かると、自分の周囲の状況、【4-a】地域社会、【4-b】日本、ひいては世界の状況も理解できるようになります。その点、文章づくりは、自分と世界を結ぶ基盤ともいえます。\n文章は決してむずかしいものではありません。事前に「何を、どう書くか」考え、【5】「ひとつひとつの文章を短く」記してゆけばよいのです。こうしてできた、分かりやすく、正確で、品位のある文章は、書いた人の心から、まわりの人々の心へ素直に伝わってゆきます。\n（猪狩章著『心に届く文章づくり』岩波書店刊　※一部省略あり）","items":[{"label":"1","o":["聞けます","聞かれます","聞こえます","聞かされます"],"a":1},{"label":"2","o":["a とも／b とも","a なり／b なり","a であれ／b であれ","a といい／b といい"],"a":3},{"label":"3","o":["しかし","なぜなら","それとも","そこで"],"a":3},{"label":"4","o
