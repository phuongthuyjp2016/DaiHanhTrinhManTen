":["a ついで／b さらには","a および／b ましてや","a くわえて／b なおさら","a それにもまして／b なお"],"a":2},{"label":"5","o":["それにつれて","それによって","それに従って","それに伴って"],"a":2}]}]},{"id":"r22","name":"第22回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"真夏（　）、こんな寒い日にTシャツ1枚で出かけるなんて、どうかしてるよ。","o":["とばかりに","もかまわず","のことだから","じゃあるまいし"],"a":4,"vi":"Đâu phải đang giữa mùa hè mà mặc mỗi áo phông ra ngoài trong cái lạnh thế này, có vấn đề gì không vậy.","hint":"「真夏___こんな寒い日」→「真夏じゃあるまいし」固定(đâu phải đang giữa mùa hè). 状況の否定からの批判。"},{"q":"弟の部屋は何か月も掃除していないから、汚いったら（　）。","o":["ありゃしない","きりがない","もんじゃない","ものともしない"],"a":1,"vi":"Phòng của em trai mấy tháng nay không dọn, bẩn đến mức không thể tả nổi.","hint":"「汚いったら___」→「〜ったらありゃしない」固定口語(không thể tả nổi sự...đó). ったら+ありゃしない。"},{"q":"引っ越しの準備をしなければならないが、いったい何から始めたらいい（　）。","o":["ものを","ものやら","ものでもない","ものともなく"],"a":2,"vi":"Phải chuẩn bị chuyển nhà nhưng chẳng biết nên bắt đầu từ đâu.","hint":"「何から始めたらいい___」→ 途方に暮れての疑問→「ものやら」(không biết phải làm gì). 「ものを」は惜しむ逆接。"},{"q":"海に近いこの地方（　）新鮮な魚料理を、どうぞお楽しみください。","o":["のごとき","なくしての","ならではの","にあっての"],"a":3,"vi":"Mời thưởng thức món cá tươi đặc trưng chỉ vùng biển này mới có.","hint":"「この地方___新鮮な魚料理」→ その地方にしかない特産→「ならではの」(đặc sản chỉ...mới có). "},{"q":"彼は美人と（　）、必ず声をかけるような男だ。","o":["いえども","みえて","みると","ばかりに"],"a":1,"vi":"Anh ta dù gặp gái đẹp cũng nhất định sẽ bắt chuyện làm quen.","hint":"「美人と___声をかける」→ 逆接・譲歩→「いえども」(dù là...cũng). 「みると」は見た後の即時動作。"},{"q":"その映画のラストシーンは、音楽の美しさ（　）、非常に感動的だった。","o":["とあって","に即して","と相まって","にもまして"],"a":3,"vi":"Cảnh cuối phim đó rất xúc động nhờ kết hợp với phần nhạc nền tuyệt đẹp.","hint":"「音楽の美しさ___感動的だった」→「〜と相まって」固定(kết hợp với). 二つの要素が合わさった結果。"},{"q":"王妃の寝室は天井から床まで豪華に飾られ、まさに贅沢の（　）だった。","o":["極み","至り","いかん","ごとき"],"a":1,"vi":"Phòng ngủ của hoàng hậu được trang trí xa hoa từ trần đến sàn, đúng là đỉnh điểm của sự xa xỉ.","hint":"「まさに贅沢の___だった」→「贅沢の極みだった」固定(đỉnh điểm của sự xa xỉ). 「〜の極み」は極致表現。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"彼は困難にあう ___ ___ ★ ___ 乗り越えてきた。","o":["せずに","苦労を","ものとも","たびに"],"a":3},{"q":"このたびの訃報は、___ ___ ★ ___ ほかありません。","o":["驚くより","突然の","あまりに","こととて"],"a":2},{"q":"どんなに ___ ___ ★ ___ 人はいつかは死ぬ。","o":["とも","限り","抵抗しよう","生きている"],"a":1}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"いつの頃からか、紙袋オバサンと呼ばれている。どんなときでも紙袋をぶらさげているからだ。最初のうちは気づかなかったが、出先で人に会い、「あなたって本当に紙袋が好きなのね」などと溜息まじりの声を【1】以来自覚するようになった。「なんとかその、紙袋なしで出かけるってことはできないものかねえ」とあからさまに非難されたこともある。しかし、それは私にとって、難しい相談だ。\n【2】荷物が多いのがいけない。一日にいくつもの用事を果たそうとするとなおさらのこと。仕事に関する資料、本、原稿、ノート、化粧道具一式（家でお化粧をすれば必要ないのだが、切羽詰まって時間がなくなり、出先でやろうと思うから、結局いつも持って出かける【3】）、なんだかんだで持ち物が増え、とうていハンドバッグに入りきらない。豆のような小型のバッグ一つで歩いている女性を見かけると、どうしてそんな器用なことができるのか聞きたくなる。\nなんとか紙袋を持たないようにと、ハンドバッグ自体を大きくしてみたこともある。【4】なぜか、バッグが大型になればなったぶん、入れるものは増える。溢れた荷物はやはり、紙袋に入れる【5】のである。\n（阿川佐和子著『無意識過剰』文藝春秋刊）","items":[{"label":"1","o":["出して","出した","出されて","出された"],"a":2},{"label":"2","o":["すなわち","そもそも","なぜなら","なるほど"],"a":2},{"label":"3","o":["ことになる","ようになる","こともある","こともない"],"a":1},{"label":"4","o":["そのため","それとも","ところが","ところで"],"a":3},{"label":"5","o":["しかなくなる","べきではない","こともなくなる","わけはなくなる"],"a":1}]}]},{"id":"r23","name":"第23回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"兄は入学試験が（　）、まったく勉強していない。","o":["終らんがため","終るやいなや","終ったからには","終ってからというもの"],"a":3,"vi":"Từ khi anh trai thi xong đại học, anh ấy chẳng học hành gì cả.","hint":"「入学試験が___まったく勉強していない」→「〜からには〜するはずだ」だが逆→「終ったからには」= 終わった以上(đã...thì đương nhiên). 後半が期待に反する実態。"},{"q":"内部情報が流出する（　）原因を徹底的に調査しなければならない。","o":["からの","なりの","による","に至った"],"a":4,"vi":"Phải điều tra kỹ nguyên nhân dẫn đến việc rò rỉ thông tin nội bộ.","hint":"「流出する___原因を調査」→ 流出という事態への到達→「に至った」(đã đi đến mức). 動作の達成点。「にした」は意図的。"},{"q":"山田さんは話を誇張する（　）から、すべてを信じないほうがいい。","o":["までもない","ものがある","きらいがある","にとどまらない"],"a":3,"vi":"Anh Yamada có khuynh hướng phóng đại câu chuyện nên tốt nhất đừng tin hết những gì anh ấy nói.","hint":"「誇張するから、信じないほうが」→ 習慣的傾向のネガティブ表現→「きらいがある」(có khuynh hướng). 「ものがある」は印象。"},{"q":"スペイン語を多少（　）習ったのなら、あいさつぐらいは言えるだろう。","o":["たりとも","ともなく","ながらに","なりとも"],"a":4,"vi":"Nếu đã học tiếng Tây Ban Nha dù chỉ chút ít thì cũng nói được vài câu chào hỏi chứ.","hint":"「多少___習ったのなら」→ わずかでもいいから→「なりとも」(dù chỉ...cũng, ít nhất). 「ともなく」は無意識。"},{"q":"友人が海外に引っ越したので、旅行（　）遊びに行くことにした。","o":["がてら","ついで","かねがね","ともども"],"a":1,"vi":"Vì bạn chuyển ra nước ngoài sống nên tôi quyết định nhân tiện đi du lịch ghé thăm bạn.","hint":"「旅行___遊びに行く」→ 旅行という本来の目的に遊びを兼ねる→「がてら」(nhân tiện). 「かたわら」は長期並行。"},{"q":"読んでくれる人（　）雑誌だから、読者の声を大切にしていきたい。","o":["ゆえの","あっての","ながらの","ならではの"],"a":4,"vi":"Vì đây là tạp chí dành riêng cho độc giả trung thành nên chúng tôi muốn trân trọng ý kiến của họ.","hint":"「読んでくれる人___雑誌」→ その読者があってこそ成り立つ→「ならではの」(đặc trưng chỉ...mới có). "},{"q":"最終面接での印象（　）、二人のうちどちらが合格するかが決まるだろう。","o":["いかんで","からして","を兼ねて","をもって"],"a":1,"vi":"Tùy vào ấn tượng ở vòng phỏng vấn cuối cùng mà sẽ quyết định ai trong hai người trúng tuyển.","hint":"「印象___どちらが合格するか」→ 印象次第で結果が変わる→「いかんで」(tùy theo). 「からして」は「から見ると」。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"校長は健康 ___ ___ ★ ___ で退職されるそうだ。","o":["今年","上の","限り","問題から"],"a":3},{"q":"彼がゴールを決めた瞬間、満員の ___ ___ ★ ___ 歓声が起こった。","o":["の","割れん","ばかり","観衆から"],"a":2},{"q":"システムの欠陥は ___ ___ ★ ___ いたはずだ。","o":["までもなく","今さら","わかって","指摘される"],"a":1}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"幸福とは一言で言ってしまえば、欲求の充足という【1】でしょう。食べたいものを食べる。やりたいことをやる。とても単純なものかもしれない。ただし、それらはあくまでも自分の中から生まれてきたもので【2】。人が食べているから食べる。みんながやっているから自分もやる。モノマネの欲求で充足は得られないのです。\n結局は自分に正直になるしかない。いまの自分が何を求めているのか。いま本当にやりたいことは何なのか。それを自らが【3】ことです。そしてそこには必ず矛盾が生じてくるもの。いまやっていることと反対のことに興味が出たり、少し前までは興味があったのにすぐに無くなったりする。でも、それをも含めて自分に正直であればいいのです。\n私はこよなく自然を愛しています。都会から離れて、自然に包まれてのんびりと暮したい。そんな欲求がある。【4】、東京生まれの自分が田舎に住めるはずはない。ガサガサと忙しいのが性に合っている自分が、のんびりと暮すことはできない。矛盾した二つの欲求が、私の中には存在しているわけです。\n人は皆、思い惑いながら生きています。自分が何者か分からず、悩みながら生きている。でも、その姿こそがありのままの自分なのです。【5】ものを追いかけることは止めて、いまある自分に目を向ける。幸せを創り出すには、それが最も近道ではないでしょうか。\n（小椋佳著『幸福は見つけるものではなく、創り出すもの』PHP研究所刊『幸福論』所収）","items":[{"label":"1","o":["ことにする","ことになる","ものがある","ものとする"],"a":3},{"label":"2","o":["なくもない","あるわけがない","なくてはならない","あってはならない"],"a":1},{"label":"3","o":["考え得る","考え抜く","考え込む","考えたがる"],"a":2},{"label":"4","o":["その上で","その一方で","それはさておき","それにもまして"],"a":2},{"label":"5","o":["ありがちな","ありようがない","ありかねない","ありもしない"],"a":4}]}]},{"id":"r24","name":"第24回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"いかに後悔（　）、時間を前に戻すことはできない。","o":["したら","しようが","せんがため","せずとも"],"a":2,"vi":"Dù có hối hận đến đâu cũng không thể quay ngược thời gian.","hint":"「いかに後悔___時間は戻らない」→「いかに〜しようが」固定(dù có...đến mấy). 「いかに」は「どんなに」の文語。"},{"q":"自分より若い人たちが真剣に働く姿を見て、自分の甘さを痛感（　）。","o":["させた","された","させられた","してみせた"],"a":3,"vi":"Nhìn những người trẻ hơn mình làm việc nghiêm túc, tôi đã thấm thía sự thiếu cố gắng của bản thân.","hint":"「甘さを痛感___」→ 状況が自分に強いる感情→「させられた」使役受身(bị khiến phải nhận ra). 「させた」は自分が他に。"},{"q":"彼の態度を見れば、この企画に興味がないことは、（　）わかる。","o":["聞かずとも","聞くともなしに","聞かんばかりに","聞くべくもなく"],"a":1,"vi":"Chỉ cần nhìn thái độ của anh ấy là biết ngay anh ấy không hứng thú với dự án này, chẳng cần phải hỏi.","hint":"「態度を見れば___わかる」→ 聞かなくてもわかる→「聞かずとも」(không cần phải hỏi cũng). 「聞くともなしに」は無意識に聞く。"},{"q":"向こうのミスにもかかわらず、あたかもこちらが間違えた（　）非難された。","o":["が早いか","かのごとく","ならまだしも","ではあるまいし"],"a":2,"vi":"Dù lỗi là của bên kia, họ vẫn bị chỉ trích như thể chính họ đã sai vậy.","hint":"「あたかもこちらが間違えた___非難された」→「あたかも〜かのごとく」固定(như thể là...vậy). 「あたかも」がセット。"},{"q":"当社の企業理念を理解し、それに（　）行動がとれる人材を募集します。","o":["際した","即した","先駆けた","かこつけた"],"a":2,"vi":"Chúng tôi tuyển nhân tài hiểu được triết lý kinh doanh và hành động phù hợp với điều đó.","hint":"「それに___行動がとれる」→ 方針・規則に合わせて→「即した」(phù hợp/bám sát theo). 「際した」は場面・タイミング。"},{"q":"この店の弁当は、量（　）質（　）、文句のつけどころがない。","o":["だの／だの","なり／なり","やら／やら","といい／といい"],"a":4,"vi":"Cơm hộp ở tiệm này cả về lượng lẫn chất đều không chê vào đâu được.","hint":"「量___質___文句のつけどころがない」→「〜といい〜といい」固定(cả...lẫn...đều). 両方を挙げての評価。"},{"q":"鉄道マニアの彼は、めずらしい列車が見られる（　）どこへでも出かけていく。","o":["が最後","とあれば","といえど","と思いきや"],"a":2,"vi":"Người đam mê tàu hỏa đó hễ có cơ hội xem chuyến tàu hiếm là đi bất cứ đâu.","hint":"「見られる___どこへでも」→ その条件が成立すれば行動する→「とあれば」(nếu là...thì). "}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"有名大学の入学試験 ___ ___ ★ ___ なかった。","o":["多さ","受験者の","といったら","だけあって"],"a":3},{"q":"お金をもらって ___ ___ ★ ___ 文句を言わずにやるべきだ。","o":["何であれ","仕事が","からには","働く"],"a":3},{"q":"もはや優勝は ___ ___ ★ ___ 10位以内には入りたい。","o":["べくも","せめて","望む","ないが"],"a":1}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"「天才」を辞書でひくと、「天性の才能」とあります。「天性」というのが、「生まれつき備わった」とか「天から与えられた」というような意味であることは、皆さんご存知でしょう。\nこの「天才」の原義【1】、私は皆さんに問いかけたいと思います。\n本当に、「天才」とは、「生まれつき備わった才能」を指す言葉なのでしょうか。\n多くの人は、「天才」と聞くと、モーツァルトやエジソン、アインシュタインなどの名を挙げるのではないかと思います。もっと最近の例でいうと、例えば、米国の有名なコンピューター会社の創業者は、現代において、天才の名【2】人物の一人だと言えるでしょう。彼は、20歳のときに自宅のガレージで現在のパソコンの基礎ともいえるものを作り上げ（実際に設計をしたのは別の人物ですが）、その後、20代の若さで世界でもトップクラスの億万長者になりました。彼の名を挙げると、たぶんほとんどの人が「彼は天才だ。普通の人とは違う」と言うに違いありません。\nでも、【3】。\nたしかに、彼に「優れた能力がある」ことは事実かもしれませんが、それが「生まれつき備わっていたかどうか」は、【4】のではありませんか。また、仮に小さい頃、人よりも秀でた能力を持っていたとしても、自分自身の後天的な努力なしにその能力を何十年も維持できるわけがないではありませんか。\nつまり、「天才」という言葉は、時として、「どうせ生まれつきの差なのだから仕方ない」とか、「彼らの才能【5】、自分なんて……」などというあきらめの言葉になり得るのではないか、と私は思うのです。","items":[{"label":"1","o":["とあって","と相まって","をおいて","を踏まえて"],"a":3},{"label":"2","o":["にとどまらない","にあるまじき","を前提としている","をほしいままにしている"],"a":1},{"label":"3","o":["考えてもみてください","考えたらどうですか","考えようとしてください","考えないものだろうか"],"a":1},{"label":"4","o":["確かめずにすむ","確かめやしない","確かめようがない","確かめないまでもない"],"a":3},{"label":"5","o":["にして","によらず","にひきかえ","にもまして"],"a":3}]}]},{"id":"r25","name":"第25回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"病気になった（　）会社を休んで遊びに行った。","o":["つもりで","かのごとき","ことにして","ことだから"],"a":3,"vi":"Anh ấy giả vờ bị bệnh để nghỉ làm đi chơi.","hint":"「病気になった___休んで遊びに行った」→ 偽りの状況を設定→「ことにして」(giả vờ là, coi như là). 「かのごとき」は比喩。"},{"q":"この小説は面白味に欠ける。発想からして平凡（　）。","o":["至りだ","極みだ","極まりない","じゃあるまい"],"a":2,"vi":"Cuốn tiểu thuyết này thiếu sự thú vị. Ngay từ ý tưởng đã thấy tầm thường.","hint":"「発想からして平凡___」→「〜の極みだ」固定(là đỉnh điểm của sự...)(cực kỳ tầm thường). 「極み」は名詞形。"},{"q":"行かないと文句を言われるし、行ったら（　）責められるし、どうすればいいんだ。","o":["行くやら","行ったで","行ったり","行っては"],"a":2,"vi":"Không đi thì bị trách, mà đi rồi cũng bị trách, biết phải làm sao đây.","hint":"「行ったら___責められる」→ 行った場合も批判される→「行ったで」口語(dù đã đi thì...vẫn). 「ったで」は「〜ても」の口語形。"},{"q":"大人たちの話を聞いて、この子たちも子ども（　）状況を理解したようだ。","o":["まま","手前","並みに","ながらに"],"a":4,"vi":"Nghe người lớn nói chuyện, bọn trẻ cũng đã hiểu phần nào tình hình theo cách của trẻ con.","hint":"「子ども___状況を理解した」→ 子どもなりの理解→「ながらに」固定(theo cách của một đứa trẻ). 「子どもながらに」固定。"},{"q":"反対するならする（　）、ちゃんとした理由を言ってほしい。","o":["なりに","ものの","そばから","かたがた"],"a":2,"vi":"Nếu đã phản đối thì cứ phản đối, nhưng hãy nói lý do cho đàng hoàng.","hint":"「反対するならする___理由を言って」→ 反対はいいが→「ものの」(tuy...nhưng). 「もの」系の逆接。"},{"q":"海外とは（　）、春休みはどこか旅行に行きたい。","o":["言うばかりか","言わないまでも","言うことなしに","言わないほどに"],"a":2,"vi":"Tuy không hẳn là đi nước ngoài, nhưng tôi muốn đi du lịch đâu đó vào kỳ nghỉ xuân.","hint":"「海外とは___旅行に行きたい」→ 海外とまでは言わないが→「言わないまでも」(tuy không đến mức...nhưng ít nhất). "},{"q":"けがは軽症で、入院する（　）ということだ。","o":["に至らない","に限らない","に足りない","には及ばない"],"a":1,"vi":"Vết thương nhẹ nên không đến mức phải nhập viện.","hint":"「入院する___ということだ」→「入院するには至らない」固定(không đến mức phải nhập viện). 「に至らない」は目標地点に未達。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"私有地 ___ ___ ★ ___ 。","o":["べからず","につき","立ち入る","断りなく"],"a":3},{"q":"せっかく買ったのに、買った ___ ___ ★ ___ ったらない。","o":["なんて","きり","使わない","もったいない"],"a":2},{"q":"お忙しい ___ ___ ★ ___ までいただき、恐縮です。","o":["お土産","ところを","ばかりか","訪ねてくださった"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"私たちのような外国人にとって、アフリカで自家用車は必需品だ。公共輸送機関が発達していないから、自分の車で動きまわるしかないのである。\nナイロビには路線バスが【1】あるのだが、本数が少ないうえに時間が不正確で、まったくあてにならない。そのため庶民は「マタツ」という乗合タクシーを利用している。日本製のマイクロバスだが、14人乗りの【2】32,3人は詰め込んで走る。助手席には4人、最後部シートには6,7人が折り重なり、天井につかえた首を横に曲げたままの立ち乗り客もいる。\n運転手の収入が歩合制なので、彼らは飛ばし【3】飛ばす。車の列が渋滞してくると、マタツは突如、反対車線を走り出す。向こうからトラックが【4-a】がバスが【4-b】が、ぎりぎりですれ違いながら走る。乗客は運を天に任せ、目をつぶっている。もちろんマタツ事故は多く、そのたびに大勢の死傷者が出る。とても日常的な交通手段にする気にはなれない。というわけで車が必要になる。\n【5】も1台では不便だ。私が仕事で車を使ってしまうと、家族は買い物や学校に行くための足がなくなる。歩いて買い物に行けるような便利さはないから、どうしても2台が必要だ。そしてとにかく、毎日よく走る。1台が1年で2万キロぐらい走ってしまう。\n（松本仁一著『アフリカを食べる/アフリカで寝る』朝日新聞出版刊）","items":[{"label":"1","o":["あることは","あることも","ないことは","ないことも"],"a":3},{"label":"2","o":["ときに","もとに","場面に","ところに"],"a":4},{"label":"3","o":["て","に","や","つつ"],"a":1},{"label":"4","o":["a 来た／b 来た","a 来よう／b 来よう","a 来よう／b 来るまい","a 来るだろう／b 来ないだろう"],"a":3},{"label":"5","o":["あの車","その車","どの車","なんの車"],"a":2}]}]},{"id":"r26","name":"第26回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"ときどき宝くじを買っているが、残念ながら当たった（　）。","o":["ためしがない","はずがない","までもない","に至らない"],"a":1,"vi":"Thỉnh thoảng vẫn mua vé số nhưng tiếc là chưa từng trúng lần nào.","hint":"「当たった___」→「〜たためしがない」固定(chưa từng có lần nào). 「一度も〜ない」の経験否定表現。"},{"q":"国の料理を（　）、日本ではなかなか材料が手に入らない。","o":["作るべく","作ってこそ","作ろうにも","作らんがため"],"a":3,"vi":"Dù muốn nấu món ăn quê hương, cũng khó tìm được nguyên liệu ở Nhật.","hint":"「作ろう___材料が手に入らない」→「〜ようにも〜ない」固定(dù muốn...cũng không thể). 「作ろうにも作れない」のパターン。"},{"q":"コンビニは、日曜（　）年末年始（　）買い物ができて便利だ。","o":["だの／だの","といい／といい","やら／やら","であろうと／であろうと"],"a":4,"vi":"Cửa hàng tiện lợi rất tiện vì dù chủ nhật hay dịp Tết cũng đều mua sắm được.","hint":"「日曜___年末年始___買い物できる」→ どちらの日でも→「であろうと〜であろうと」固定(dù là...hay là...). "},{"q":"試作品は改良に改良（　）、ついに実用化にこぎつけた。","o":["を兼ね","を重ね","にたえ","に先駆け"],"a":2,"vi":"Sản phẩm thử nghiệm đã được cải tiến hết lần này đến lần khác, cuối cùng cũng được đưa vào sản xuất thực tế.","hint":"「改良に改良___実用化」→「〜に〜を重ねる」固定強調(liên tục lặp lại). 「改良を重ねる」の強調形。"},{"q":"薦められた本を読む（　）読んだが、よく理解できなかった。","o":["こそ","なり","には","まで"],"a":3,"vi":"Cuốn sách được giới thiệu thì có đọc, nhưng vẫn chưa hiểu rõ lắm.","hint":"「読む___読んだが」→「〜こそ〜が」の強調形→「読むには読んだ」= 読んだことは読んだ. 「には〜が」は制限的認定。"},{"q":"私（　）こんな簡単な漢字を忘れてしまうなんて……。","o":["ともなると","としても","というもの","としたことが"],"a":4,"vi":"Một người như tôi mà lại quên cả chữ Hán đơn giản thế này…","hint":"「私___こんな漢字を忘れるなんて」→「私としたことが」固定(một người như tôi mà lại). 自己批判的な驚き表現。"},{"q":"そんなに言うなら、信じる（　）証拠を見せてくれ。","o":["にたる","にわたる","にたえない","にやまない"],"a":1,"vi":"Nếu nói chắc vậy thì hãy đưa bằng chứng đáng tin cho tôi xem.","hint":"「信じる___証拠を見せて」→「〜に足る証拠」固定(bằng chứng đáng để tin). 「〜に足る」=する価値がある。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"この監督はこれまで ___ ___ ★ ___ 心に残る映画を製作してきた。","o":["こそ","ものの","とらなかった","賞"],"a":3},{"q":"まだ全員そろっていませんが、___ ___ ★ ___ 、会議を始めましょう。","o":["だし","こと","過ぎている","時間も"],"a":2},{"q":"従業員の幸せを願う ___ ___ ★ ___ のことだろう。","o":["経営者","のは","当然","たる者"],"a":4}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"夢【1】、見るのが当然なのだそうだ。それが正常。夢も見ないでぐっすり眠ったという人も、めざめた時に忘れているだけで、やはり見ているのだという。\nもっとも、眠れればのことだが……。\nその青年は、その夜、なぜか寝つきが悪かった。ベッドの上で何度も寝がえりをくりかえすが、いっこうに【2】。なぜだろう。あれこれ考えてみるが、【3】原因が思い当らない。彼は独身の、平凡な会社員だった。健康も、まあまあ。\nなにか会社で失敗をやっただろうか。きょう一日をふりかえってみたが、べつになかった。(中略)自分はなにか不快な心境にあるのだろうか。しかし、それもなかった。新聞にはいろいろな事件がのっている。これは許せない。さあ腹を立てろという調子の文章だが、それは毎度のことで、なれっこになっている。また事実、このところさして刺激的な事件はなかった。不快さはない。\n健康上で気になることもない。老後の設計の心配など、まだ先の先の話だ。(中略)\nなにもなしだ。となると、気候のせいかもしれなかった。夕方ごろから、急に暑くなりはじめた。【4】、冷房を入れるほどでもない。中途はんぱな暑苦しさ。彼は毛布をかけたり、はずしたりした。\nむりに眠ろうとするからいけないんだ。そう考えてもみた。あす、特に重要な仕事があるわけでもない。たまには遅刻したって、どうという【5】。それでいいんだ……。\n（星新一著『重なった情景』角川文庫刊『ごたごた気流』所収　※一部省略あり）","items":[{"label":"1","o":["ときたら","といえども","というものは","というからには"],"a":3},{"label":"2","o":["眠りたくない","眠くならない","眠りようがない","眠れないものだ"],"a":4},{"label":"3","o":["これといって","それとなく","これにしたって","それにもまして"],"a":1},{"label":"4","o":["それゆえ","それどころか","というか","といって"],"a":4},{"label":"5","o":["ことである","ものである","こともない","ものもない"],"a":3}]}]},{"id":"r27","name":"第27回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"人の金を盗むとは、警察官（　）行為だ。","o":["たる","ともあろう","にあるまじき","でありながらの"],"a":3,"vi":"Ăn cắp tiền của người khác là hành vi không xứng đáng với một cảnh sát.","hint":"「警察官___行為だ」→「職名・地位＋にあるまじき」固定(không xứng với tư cách là). 「にあるまじき」は地位に対する批判的修飾。"},{"q":"社員同士の懇親（　）一泊二日の研修旅行を実施します。","o":["を機に","とともに","を兼ねて","を踏まえて"],"a":3,"vi":"Chúng tôi sẽ tổ chức chuyến du lịch nghỉ dưỡng 2 ngày 1 đêm, kết hợp luôn việc giao lưu giữa nhân viên.","hint":"「懇親___研修旅行」→「〜を兼ねて」固定(kết hợp luôn việc). 社員親睦という目的に研修を兼ねる。"},{"q":"当社の最新技術（　）すれば、このぐらいのものは簡単に製作できます。","o":["にして","にあって","をおいて","をもって"],"a":4,"vi":"Với công nghệ tiên tiến nhất của công ty, việc sản xuất cái này khá đơn giản.","hint":"「最新技術___すれば」→「〜をもってすれば」固定(với...thì). 手段・能力の活用を示す慣用句。"},{"q":"この器は飾っておいたりしないでください。（　）価値があるんですから。","o":["使ってこそ","使ってすら","使わずして","使わずとも"],"a":1,"vi":"Xin đừng chỉ trưng bày món đồ này. Vì chính nhờ sử dụng nó mới có giá trị.","hint":"「使って___価値がある」→「〜てこそ」固定(chính nhờ...mới có giá trị). 使うことで初めて価値が生まれる。"},{"q":"その政治家の無責任な発言には、憤りを（　）。","o":["至らない","禁じ得ない","願ってやまない","ものともしない"],"a":2,"vi":"Phát ngôn vô trách nhiệm của vị chính trị gia đó khiến người ta không khỏi phẫn nộ.","hint":"「憤りを___」→「(感情)を禁じ得ない」固定(không kìm được). 「禁じ得ない」= 感情を抑えきれない。"},{"q":"他の人が参加を（　）、私は絶対に行きます。","o":["やめようがやめまいが","やめようかやめるまいか","やめるやらやめないやら","やめるだのやめないだの"],"a":1,"vi":"Dù người khác có tham gia hay không, tôi chắc chắn sẽ đi.","hint":"「参加を___私は絶対に行く」→ 他人の行動に無関係→「やめようがやめまいが」固定(dù có...hay không). 「〜うが〜まいが」。"},{"q":"この祭りは、地域住民（　）、全国から参加者が集まる大イベントとなった。","o":["からある","はおろか","はもとより","ならまだしも"],"a":3,"vi":"Lễ hội này đã trở thành sự kiện lớn thu hút người tham gia từ khắp cả nước, chứ không chỉ riêng người dân địa phương.","hint":"「地域住民___全国から参加」→「〜はもとより」(はもちろん) + さらに広い範囲(đương nhiên là...chưa kể đến). 「はおろか」は逆の下から上。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"あいつときたら、社長でも ___ ___ ★ ___ なんだ。","o":["いったい","つもり","何様の","あるまいし"],"a":3},{"q":"また失敗してしまったが、結果を ___ ___ ★ ___ はない。","o":["限り","みる","いなく","進歩して"],"a":1},{"q":"いくら欲しくても ___ ___ ★ ___ 買えない。","o":["こう","に","買う","高くては"],"a":4}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"毎日忙しくて、なかなか自分の時間がとれない。やりたいことはいろいろあるが、もともと時間のやりくりが下手な私は、仕事のある平日に自分の時間をつくるなんてとてもできない。読みたい本も、見たい映画も、行きたい店も、部屋の片付けも、ぜんぶ「休みになったら……」と思い、どんどん後回しにしてしまう。\nするとどうなるかというと、休みの前日になって、「あれもやらなきゃ、これもやらなきゃ」と、平日の間【1】たまったやるべきことをリストに書き出し、それらを消化すべく、30分刻みで細かく計画を立てるはめになる。ところが、当日になると、結局、計画の半分も実行できないうちに夜になって、ベッドの中で自分の立てた計画表を見返し【2】、自分の実行力のなさにがっかりする。これが、少し前までの私のお決まりのパターンだった。\nしかし、あるとき気がついた。計画を立てるから、実行できなかったときにがっかりするのだ。【3-a】実行できないのなら、【3-b】計画など立てなければいいのではないか。\n【4】、休みの前日、明日何をするか、まったく考えないことにした。\n目覚まし時計もかけない。寝たいだけ寝る。朝食の準備もしない。映画も調べない。明日自分が何をするか、どこへ行くかなんて、朝起きたときの気分【5】だ。\nすると不思議なことに、一日かけて本を1冊読んだとか、風呂場のそうじをしたとか、そういう小さなことを何か一つしただけでも、これまでにはない満足感が得られることがわかった。できもしない計画など立てなければ、それなりに充実した休日を過ごせるのだ。","items":[{"label":"1","o":["たまりに","たまるに","たまって","たまれば"],"a":3},{"label":"2","o":["たが","とて","ては","にて"],"a":2},{"label":"3","o":["a どうせ／b はじめから","a どうせ／b なにより","a いったい／b どうせ","a いくら／b どうせ"],"a":1},{"label":"4","o":["つまり","そこで","いかにも","ちなみに"],"a":2},{"label":"5","o":["限り","次第","頼り","なり"],"a":1}]}]},{"id":"r28","name":"第28回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"彼は会社を経営する（　）、地域のサッカーチームの監督としても活躍してきた。","o":["あまり","うえで","かたわら","そばから"],"a":3,"vi":"Anh ấy vừa điều hành công ty vừa hoạt động làm huấn luyện viên đội bóng đá địa phương.","hint":"「会社を経営する___監督としても活躍」→ 本業と並行する別の長期活動→「かたわら」(song song lâu dài). 「がてら」は一時的兼務。"},{"q":"きちんと話さなければならないとき（　）、緊張でうまく話せなくなる。","o":["に至って","に及んで","に限って","はさておき"],"a":2,"vi":"Mỗi khi cần phải nói chuyện đàng hoàng là tôi lại căng thẳng không nói nên lời.","hint":"「きちんと話さなければならないとき___緊張」→「〜に及んで/〜に至って」=その場面になって初めて(đến lúc...mới). 「に限って」は例外パターン。"},{"q":"その医師は80歳（　）なお現役で診療にあたっている。","o":["として","にして","ときたら","にしては"],"a":2,"vi":"Vị bác sĩ đó dù đã 80 tuổi vẫn còn đang hành nghề.","hint":"「80歳___現役」→「〜にして」= その状態でありながら(ngay cả ở tuổi...vẫn). 年齢/状態が強調される。"},{"q":"近いうちに、ご無沙汰のお詫び（　）ごあいさつに参ります。","o":["ながら","かたがた","ついでに","かたわら"],"a":2,"vi":"Trong thời gian gần đây, tôi sẽ đến thăm hỏi và xin lỗi vì lâu nay chưa liên lạc.","hint":"「お詫び___ごあいさつ」→「お詫びかたがたごあいさつ」固定(nhân tiện xin lỗi và chào hỏi). 「かたがた」は2つの目的の兼務表現。"},{"q":"夜まで雨は降らないだろうが、傘を持っていくに（　）。","o":["あたらない","かたくない","とどまらない","越したことはない"],"a":4,"vi":"Tuy đến tối chắc trời không mưa, nhưng mang theo ô vẫn hơn.","hint":"「傘を持っていくに___」→「〜に越したことはない」固定(không gì bằng mang theo). 予防的な推薦表現。"},{"q":"国会議員が海外視察（　）豪華な観光旅行をしたことが問題となっている。","o":["と相まって","にかこつけて","のかいもなく","をせんがため"],"a":2,"vi":"Việc nghị sĩ quốc hội lấy cớ thị sát nước ngoài để đi du lịch sang trọng đang gây tranh cãi.","hint":"「海外視察___観光旅行」→ 視察を口実に→「にかこつけて」(lấy cớ là, viện cớ). 「にこつけて」→「にかこつけて」。"},{"q":"他の人の反応を見ても、これでいい（　）悪い（　）、どうもわからない。","o":["だの／だの","といい／といい","のやら／のやら","といわず／といわず"],"a":3,"vi":"Nhìn phản ứng của người khác cũng không rõ là tốt hay xấu, tôi thực sự không hiểu nổi.","hint":"「いい___悪い___どうもわからない」→「〜のやら〜のやら」固定(không biết...hay là...). 二択の判断ができない宙吊り表現。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"高校を卒業してからここ ___ ___ ★ ___ 運動をしていない。","o":["ほとんど","数年","という","もの"],"a":4},{"q":"彼は前の車が ___ ___ ★ ___ 無理な追い越しをした。","o":["遅いと","スピードを","あげて","みると"],"a":1},{"q":"祭りの会場は、地元の ___ ___ ★ ___ 、大勢の人でにぎわった。","o":["外国人観光客","子どもから","まで","に至る"],"a":4}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"「カラオケに行きましょう」と誘われて、「いやあ、声には自信がなくて」と断る。よくある会話だ。このように「自信がない」という言い方は、スポーツ、料理、文章【1-a】よく使われるものだった。営業マンが「営業ですか？いやあ、自信がなくて」と言ったり、教師が「子どもの教育には自信がないんですよ」と言ったり、とその人にとって重要なこと、核心にふれることで簡単に「自信がない」と答えると、無責任と【2】。(中略)\nいつの頃からか「顔に自信がない」「スタイルに自信がない」と、自分の外見について「自信がない」と口にする人が増えた。「顔」や「スタイル」はかなり本人の核心に近いことであるが、まだ【3-a】ではなくてあくまで【3-b】の問題であるので、それほど抵抗なく自信のなさを表明しやすいのかもしれない。\nところが最近、趣味でも外見でもなく、「自分に自信がない」といった言い方をする人が目につくようになってきた。(中略)そういう人に「何に自信が持てないんですか」ときいても、「具体的に何かに、【4】、とにかく何に対しても自信が持てないんです」「自信【5】自分が好きになれると思うのですが、今のままの自分はきらいです」などと漠然とした答えが返ってくることが多い。もちろん、「仕事に対しても自信が持てない」と躊躇なく言い切る。\n（香山リカ著『「悩み」の正体』岩波書店刊　※一部省略あり）","items":[{"label":"1","o":["a や／b で","a など／b で","a や／b によって","a など／b によって"],"a":2},{"label":"2","o":["思われまいか","思われやしないだろうか","思われかねなかった","思われずにはおかなかった"],"a":3},{"label":"3","o":["a 内面／b 表面","a 見た目／b 気持ち","a 顔／b スタイル","a 外見／b 核心"],"a":4},{"label":"4","o":["ということに加えて","ということじゃなくて","ということではないので","ということにかかわらず"],"a":2},{"label":"5","o":["さえ持てば","を持てないまでも","を持ったところで","があろうがなかろうが"],"a":1}]}]},{"id":"r29","name":"第29回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"我々（　）一般庶民は、あんな高級マンションには一生住めそうもない。","o":["ごとく","のごとき","並みの","なりの"],"a":3,"vi":"Những người dân thường như chúng tôi thì chắc cả đời cũng không thể sống trong căn hộ cao cấp như vậy.","hint":"「我々___一般庶民」→「一般庶民並みの」(ngang với người dân thường). 「並みの」=そのレベル相当の。「のごとき」は比喩。"},{"q":"その女性は、新幹線に乗り込む（　）、すぐにバッグからパソコンを取り出した。","o":["なりに","が早いか","と思いきや","までもなく"],"a":2,"vi":"Người phụ nữ đó vừa lên tàu Shinkansen là lập tức lấy máy tính ra khỏi túi ngay.","hint":"「乗り込む___すぐにパソコンを取り出した」→ 乗った瞬間に→「が早いか」(vừa...thì ngay). 「なりに」は程度の適合。"},{"q":"父は頑固で、言い出した（　）絶対に考えを変えない。","o":["が最後","とたん","とあっては","に至っては"],"a":1,"vi":"Bố tôi rất bướng bỉnh, một khi đã nói gì là tuyệt đối không đổi ý.","hint":"「言い出した___考えを変えない」→「言い出したが最後」固定(một khi đã nói ra là). 動作後の不可逆性強調。"},{"q":"タバコは健康に害を及ぼし（　）、いい影響は与えない。","o":["兼ねて","こそすれ","次第で","ずくめで"],"a":2,"vi":"Thuốc lá chỉ gây hại cho sức khỏe chứ chẳng mang lại lợi ích gì.","hint":"「健康に害を及ぼし___」→「〜こそすれ〜ない」固定(chỉ có thể...chứ không). 害あれど益なし。「兼ねて」は目的兼務。"},{"q":"返信する（　）次のメールが来て、いつまでたっても出かけられない。","o":["がてら","そばから","ものなら","からこそ"],"a":2,"vi":"Vừa trả lời tin nhắn xong là tin nhắn mới lại đến ngay, chẳng bao giờ đi ra ngoài được.","hint":"「返信する___次のメールが来て」→ 返信するたびに続く→「そばから」(vừa...thì lại). 行動が間断なく続く。"},{"q":"これだけの機能があるから値段も高いかと（　）、それほどでもなかった。","o":["思いきや","思うやいなや","言えども","言わんばかりに"],"a":1,"vi":"Cứ tưởng có nhiều tính năng thế này thì giá sẽ cao, nhưng hóa ra cũng không đắt lắm.","hint":"「値段も高いかと___それほどでも」→ 予想を裏切られた驚き→「思いきや」(cứ tưởng...nhưng hóa ra). "},{"q":"いくら隠したところで、（　）そんな嘘はばれてしまうだろう。","o":["遅かれ早かれ","遅くも早くも","遅いやら早いやら","遅いなり早いなり"],"a":1,"vi":"Dù có giấu giếm thế nào, sớm muộn gì lời nói dối đó cũng sẽ bị lộ ra thôi.","hint":"「いくら隠したところで___ばれてしまう」→「遅かれ早かれ」固定慣用句(sớm hay muộn). 時間の問題で必ず起きる。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"川沿いの田畑は ___ ___ ★ ___ たちまち水没してしまう。","o":["でも","ものなら","降ろう","大雨"],"a":2},{"q":"一流プレーヤーが勢ぞろいする ___ ___ ★ ___ いられない。","o":["ファン","とあれば","としては","行かずには"],"a":4},{"q":"いくら子ども ___ ___ ★ ___ ならない。","o":["からには","約束した","守らねば","とはいえ"],"a":3}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"今、人々の間の交流が急激にさかんになったことによって、言葉に有史以来の異変が二つおこっていると言われている。\n一つ目の異変は、下の方の、名も知れぬ言葉が、たいへんな勢いで絶滅しつつあるということである。今地球に六千ぐらいの言葉があるといわれているが、そのうちの八割以上が今世紀の末までには絶滅するであろうと予測されている。歴史の中で、あまたの言葉が【1】消えていったが、今、言葉は、生まれるよりも勢いよく消えつつある。激しい環境の変化の中で、自然界ではありえなかった勢いで生物が絶滅しつつある【2】、都市への人口集中や伝達手段の発達や国家の強制によって、言葉は、かつてない勢いで消えつつある。\n二つ目の異変は、今までには存在しなかった、すべての言葉のさらに上にある、世界全域で流通する言葉が生まれたということである。\nそれが今〈普遍語〉となりつつある英語に【3】。\n英語がほかの言葉を押しのけて一人〈普遍語〉となりつつあるのは、歴史の偶然と必然とが【4】である。英語という言葉そのものに原因はない。思うに、英語という言葉は、ほかの言葉を〈母語〉【5-a】人間にとって、決して学びやすい言葉ではない。もとはゲルマン系の言葉にフランス語がまざり、ごちゃごちゃしている上に、文法も単純ではないし、そもそも単語の数が実に多い。慣用句も多い。おまけにスペリングと発音との関係がしばしば不規則である。さらに、発音そのものが、それを〈母語〉【5-b】多くの人にとって非常にむずかしい。\n（水村美苗著『日本語が亡びるとき―英語の世紀の中で』筑摩書房刊）","items":[{"label":"1","o":["生まれては","生まれるなり","生まれようが","生まれるとみえて"],"a":1},{"label":"2","o":["ことから","くらいなら","ともなると","のと同様"],"a":3},{"label":"3","o":["難くない","あたらない","とどまらない","ほかならない"],"a":3},{"label":"4","o":["絡み合ったもの","絡み合うところ","絡み合ってのこと","絡み合わんがため"],"a":3},{"label":"5","o":["a とする／b としない","a とする／b とならない","a となる／b としない","a となる／b とならない"],"a":4}]}]},{"id":"r30","name":"第30回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"水分は人間が生きていくのに（　）ものだ。","o":["欠くべからざる","欠くよりほかない","欠かずにすまない","欠かざるを得ない"],"a":1,"vi":"Nước là thứ không thể thiếu để con người sống được.","hint":"「生きていくのに___ものだ」→「欠くべからざる」固定(không thể thiếu được). 「べからざる」=「べきでない」の連体形。"},{"q":"社長は1000万円（　）スポーツカーを何台も集めている。","o":["からある","からする","こそあれ","こそすれ"],"a":1,"vi":"Vị giám đốc sưu tầm rất nhiều xe thể thao có giá lên tới cả chục triệu yên.","hint":"「1000万円___スポーツカー」→ 数量が膨大であることを強調→「からある」固定(lên tới/những). 大きな数値の強調。"},{"q":"100年前にいったい誰がこの絵を描いたのか、現代（　）もまだ判明していない。","o":["を経て","に至って","を通して","に即して"],"a":2,"vi":"Đến tận bây giờ, sau cả trăm năm, vẫn chưa rõ ai là người vẽ bức tranh này.","hint":"「現代___もまだ判明していない」→「現代に至っても」= 今の時代になっても(đến tận bây giờ vẫn). 「を通して」は通じて全体。"},{"q":"明日のイベントは、当日の天候（　）、中止になるおそれがあります。","o":["いかんでは","からすれば","ばかりには","に応じて"],"a":1,"vi":"Tùy theo thời tiết hôm đó, sự kiện ngày mai có thể sẽ bị hủy.","hint":"「天候___中止になるおそれ」→「天候いかんでは」固定(tùy theo thời tiết). 「いかんでは」=次第では。"},{"q":"そんな高い修理代を払う（　）、新しいのを買ったほうがましだ。","o":["限り","ときたら","にしたら","くらいなら"],"a":4,"vi":"Nếu phải trả tiền sửa đắt như vậy thì thà mua cái mới còn hơn.","hint":"「そんな高い修理代を払う___新しいのを買ったほうがましだ」→「〜くらいなら〜ほうがまし」固定(thà...còn hơn). "},{"q":"植物や動物など、何かの命を奪う（　）人間は生きていけない。","o":["ともなく","ことなしに","なくして","ならでは"],"a":3,"vi":"Con người không thể sống mà không tước đi sinh mạng của thực vật hay động vật khác.","hint":"「何かの命を奪う___生きていけない」→「〜なくして〜ない」固定(nếu không có...thì không thể). 「なくして(は)」=なしには。"},{"q":"この工場は規模（　）小さいが、年商は数十億円に上る。","o":["こそ","だの","さえも","ですら"],"a":1,"vi":"Nhà máy này quy mô tuy nhỏ nhưng doanh thu hàng năm lên tới vài chục tỷ yên.","hint":"「規模___小さいが年商は高い」→「こそ」= 規模は確かに小さいが(tuy là...nhưng). 「〜こそ〜が」逆接の強調。"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"亡くなった祖父の顔は ___ ___ ★ ___ だった。","o":["かのごとく","穏やかな","表情","眠っている"],"a":3},{"q":"会計のときに店員の ___ ___ ★ ___ ものだった。","o":["態度は","極まる","不愉快","とった"],"a":3},{"q":"この地方が寒いのは ___ ___ ★ ___ を通して気候は温暖だと言える。","o":["1カ月","1年","くらい","のもので"],"a":1}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"長い間、私にとって趣味というか楽しみは、読書しかなかった。私は昭和二十年代の終わりの生まれで、それ以前に生まれた人も含めて、他に選べる趣味や楽しみが少なかったのも理由のひとつだろう。(中略)学生時代、書類の趣味の欄に書くのは、読んで【1】、いちばん多く書かれていたのは「読書」だったのではないか。(中略)\nところが最近は、本を読む人がどんどん減ってきている。減っているとは以前から聞いていたが、盛り返す【2】ますます先細りらしい。かつては若い人が本を読まなくなった理由は、漫画のせいだといわれていた。活字本の敵は漫画だった。年輩の文芸書の編集者が、\n「最近の若い人は漫画しか買わないからねえ」\nと嘆いているのを何度聞いたかわからない。しかし本好きの立場から【3】、漫画本も本のうちで、活字ばかり読んでいたわけではない。漫画でも素晴らしいもの、楽しいもの、面白いものがたくさんあり、活字本と区別してはいなかった。しかし売る側としては、活字の敵は漫画だと位置づけていたのである。\nしかし今は漫画の売り上げの減少のほうが著しいと聞いた。若い人は漫画【4】買わなくなった。理由は携帯電話が普及したせいだという。本を手にしない人によると、ページをめくるのが面倒くさい。漫画は絵と文字を読むのが活字本より面倒なのだそうだ。携帯電話でメールをやりとりするから、文章力が上がるのではといっている人もいたが、もともとの語彙や表現力がなかったら、いくら文章を【5】、それで文章力が上がるとは思えない。\n（群ようこ著『世間のドクダミ』筑摩書房刊　※一部省略あり）","items":[{"label":"1","o":["いたらいたで","いこうかいくまいか","いようがいまいか","いるだのいないだの"],"a":3},{"label":"2","o":["が早いか","そばから","ともなしに","どころか"],"a":4},{"label":"3","o":["いってもらうと","いってあげると","いわせてもらうと","いわせてあげると"],"a":3},{"label":"4","o":["はおろか","ほども","すら","しか"],"a":4},{"label":"5","o":["作るくらいなら","作ったとしても","作るならまだしも","作ったとなったら"],"a":2}]}]}],"trainings":[{"id":"t1","name":"集中トレーニング①助詞（1）","items":[{"q":"私たちのチームは実戦（a に　b を）即した練習方法を取り入れている。","a":"に","b":"を","ans":"a","vi":"Đội chúng tôi áp dụng phương pháp luyện tập bám sát thực chiến."},{"q":"田中さんに出会ったあの日（a に　b を）境に私の生活は大きく変わった。","a":"に","b":"を","ans":"a","vi":"Lấy ngày gặp anh Tanaka làm bước ngoặt, cuộc sống của tôi đã thay đổi rất nhiều."},{"q":"月末（a と　b に）あって、銀行はとても込んでいた。","a":"と","b":"に","ans":"a","vi":"Vì là cuối tháng nên ngân hàng rất đông khách."},{"q":"あの名作が20年の時（a と　b を）経て、映画になってよみがえる！","a":"と","b":"を","ans":"b","vi":"Tác phẩm kinh điển đó, sau 20 năm, đã được dựng lại thành phim!"},{"q":"まさか彼があんな聞く（a に　b を）堪えない言葉を口にしようとは。","a":"に","b":"を","ans":"a","vi":"Không ngờ anh ta lại thốt ra những lời khó nghe đến vậy."},{"q":"この状況（a と　b に）あって、今までと同じ生活を維持するのは難しい。","a":"と","b":"に","ans":"b","vi":"Trong tình huống này, rất khó để duy trì cuộc sống như trước."},{"q":"周囲の心配（a に　b を）よそに、父は山登りを続けている。","a":"に","b":"を","ans":"b","vi":"Bất chấp sự lo lắng của mọi người xung quanh, bố vẫn tiếp tục leo núi."},{"q":"以上（a に　b を）もちまして、本日は終了とさせていただきます。","a":"に","b":"を","ans":"b","vi":"Đến đây tôi xin phép kết thúc buổi hôm nay."},{"q":"その証言が事実だ（a と　b を）すると、捜査をやり直さなければならないだろう。","a":"と","b":"を","ans":"a","vi":"Nếu lời khai đó là sự thật thì phải điều tra lại từ đầu."},{"q":"町工場（a と　b を）いえども、その技術は世界レベルだ。","a":"と","b":"を","ans":"a","vi":"Dù là xưởng nhỏ ở thị trấn, công nghệ của họ vẫn đạt đẳng cấp thế giới."}]},{"id":"t2","name":"集中トレーニング②助詞（2）","items":[{"q":"うちの子（a が　b と）きたら、30歳にもなって料理ひとつ作れないんです。","a":"が","b":"と","ans":"b","vi":"Nói đến con tôi thì đã 30 tuổi rồi mà vẫn không nấu nổi một món ăn."},{"q":"この会が発足（a に　b を）至った経緯をご説明いたします。","a":"に","b":"を","ans":"a","vi":"Tôi xin giải thích quá trình dẫn đến việc thành lập hội này."},{"q":"これまでの様々な事例（a に　b を）踏まえて、解決策を考えていきたい。","a":"に","b":"を","ans":"b","vi":"Tôi muốn suy nghĩ giải pháp dựa trên các trường hợp thực tế từ trước đến nay."},{"q":"この歯医者は技術（a が　b も）さることながら、患者への対応がとてもよい。","a":"が","b":"も","ans":"b","vi":"Phòng khám nha khoa này không chỉ giỏi chuyên môn mà còn rất chu đáo với bệnh nhân."},{"q":"コンサートは東京（a が　b を）皮切りに、世界10都市で行われる予定だ。","a":"が","b":"を","ans":"b","vi":"Buổi hòa nhạc dự kiến sẽ bắt đầu từ Tokyo rồi lan ra 10 thành phố trên thế giới."},{"q":"美しい映像と音楽（a とが　b とを）相まって、素晴らしい作品に仕上がった。","a":"とが","b":"とを","ans":"a","vi":"Hình ảnh đẹp kết hợp với âm nhạc đã tạo nên một tác phẩm tuyệt vời."},{"q":"担当者の対応のあまりのひどさに、怒り（a に　b を）禁じ得なかった。","a":"に","b":"を","ans":"b","vi":"Tôi không kìm được giận dữ trước thái độ tệ hại của người phụ trách."},{"q":"今日の駅前の人の多さ（a と　b を）いったらなかったよ。何かあったのかな。","a":"と","b":"を","ans":"a","vi":"Hôm nay trước ga đông người không thể tả nổi. Không biết có chuyện gì vậy nhỉ."},{"q":"やっとレポートが提出できた！　評価（a は　b も）どうあれ、期限内に出せてよかった。","a":"は","b":"も","ans":"a","vi":"Cuối cùng cũng nộp được báo cáo! Dù được đánh giá thế nào cũng mừng vì kịp hạn."},{"q":"A氏は国会議員（a と　b に）あるまじき発言をして、各方面から非難を浴びている。","a":"と","b":"に","ans":"b","vi":"Ông A đã có phát ngôn không xứng đáng với một nghị sĩ quốc hội, bị chỉ trích từ nhiều phía."}]},{"id":"t3","name":"集中トレーニング③助詞（3）","items":[{"q":"投票率が低いのは今回の選挙（a に　b を）限ったことではない。","a":"に","b":"を","ans":"a","vi":"Tỷ lệ bỏ phiếu thấp không chỉ riêng ở cuộc bầu cử lần này."},{"q":"私に買う気がない（a と　b を）みると、その店員は急に態度が悪くなった。","a":"と","b":"を","ans":"a","vi":"Thấy tôi không có ý định mua, người bán hàng đột nhiên thay đổi thái độ."},{"q":"この本は、内容（a は　b を）さておき、表紙のデザインがきれいなので、つい手に取りたくなる。","a":"は","b":"を","ans":"a","vi":"Cuốn sách này, tạm gác nội dung sang một bên, bìa sách đẹp đến mức khiến người ta muốn cầm lên xem."},{"q":"今日（a に　b を）限りに、木村さんとはもう会えなくなってしまう。","a":"に","b":"を","ans":"b","vi":"Từ hôm nay trở đi sẽ không còn gặp được anh Kimura nữa."},{"q":"他の人がいなくなったので、私はここぞ（a と　b に）ばかりに、彼女に話しかけた。","a":"と","b":"に","ans":"a","vi":"Vì không còn ai khác nên tôi đã nhân cơ hội đó bắt chuyện với cô ấy."},{"q":"チーム発足（a と　b に）先駆けて、公式ホームページを立ち上げた。","a":"と","b":"に","ans":"b","vi":"Họ đã lập trang web chính thức trước cả khi đội được thành lập."},{"q":"果物を買うならこの店（a に　b を）限る。なにより新鮮で値段も高くない。","a":"に","b":"を","ans":"a","vi":"Nếu mua trái cây thì chỉ nên mua ở tiệm này. Vừa tươi vừa không đắt."},{"q":"海外の友人が来る（a が　b と）あれば、いまからプランを立てていろいろなところを案内したい。","a":"が","b":"と","ans":"b","vi":"Nếu bạn ở nước ngoài đến chơi thì tôi muốn lên kế hoạch dẫn đi tham quan nhiều nơi."},{"q":"目標のベスト4（a が　b は）おろか、ベスト16にも入れなかった。","a":"が","b":"は","ans":"b","vi":"Đừng nói lọt vào top 4, ngay cả top 16 cũng không vào nổi."},{"q":"その話がショックだった（a が　b と）みえて、彼女は何も言わずに帰ってしまった。","a":"が","b":"と","ans":"b","vi":"Có vẻ chuyện đó khiến cô ấy sốc nên cô ấy đã về mà không nói gì."}]},{"id":"t4","name":"集中トレーニング④「こと」と「もの」","items":[{"q":"今のは見なかった（a こと　b もの）にしてください。","a":"こと","b":"もの","ans":"a","vi":"Xin hãy coi như chưa thấy chuyện vừa rồi."},{"q":"手術をせずに、どうにか薬で治せない（a こと　b もの）でしょうか。","a":"こと","b":"もの","ans":"b","vi":"Liệu có thể chữa khỏi bằng thuốc mà không cần phẫu thuật không?"},{"q":"そこまで言われれば、参加しない（a こと　b もの）でもないけれど、どうしようかなあ。","a":"こと","b":"もの","ans":"b","vi":"Nếu bị nói đến mức đó thì cũng không phải là không tham gia, nhưng phải làm sao đây."},{"q":"料理上手な松井さんの（a こと　b もの）だから、お子さんの誕生日にはごちそうをたくさん作るんでしょうね。","a":"こと","b":"もの","ans":"a","vi":"Vì là chị Matsui giỏi nấu ăn nên chắc sẽ làm nhiều món ngon cho sinh nhật con đấy."},{"q":"きちんと名前を書いて、他の人のと間違える（a こと　b もの）のないようにしてください。","a":"こと","b":"もの","ans":"a","vi":"Hãy ghi rõ tên để tránh nhầm lẫn với người khác."},{"q":"一度行ったことがあるとはいえ、地図を持っていくに越した（a こと　b もの）はない。","a":"こと","b":"もの","ans":"a","vi":"Dù đã từng đi một lần, mang theo bản đồ vẫn tốt hơn."},{"q":"ひとこと言ってくれたら、協力した（a こと　b もの）を。","a":"こと","b":"もの","ans":"b","vi":"Giá mà nói một tiếng thì tôi đã giúp rồi."},{"q":"賞与の支給については、当社の規定による（a こと　b もの）とする。","a":"こと","b":"もの","ans":"b","vi":"Về việc chi trả tiền thưởng sẽ áp dụng theo quy định của công ty."},{"q":"親にあれこれ言われたくなかったら、家を出て独立する（a こと　b もの）だね。","a":"こと","b":"もの","ans":"a","vi":"Nếu không muốn bị bố mẹ can thiệp thì hãy ra ở riêng đi."},{"q":"この1週間という（a こと　b もの）、忙しくてほとんど寝ていない。","a":"こと","b":"もの","ans":"b","vi":"Suốt 1 tuần nay, tôi bận đến mức gần như không ngủ."}]},{"id":"t5","name":"集中トレーニング⑤副詞（1）","items":[{"q":"めったに怒らない山本さんが、（a さすが　b さすがに）今回ばかりは怒りをあらわにした。","a":"さすが","b":"さすがに","ans":"b","vi":"Anh Yamamoto vốn hiếm khi nổi giận, vậy mà lần này lại thể hiện rõ sự tức giận."},{"q":"（a さすが　b さすがの）ダンサーだけあって、体が柔らかい。","a":"さすが","b":"さすがの","ans":"a","vi":"Đúng là vũ công có khác, cơ thể rất mềm dẻo."},{"q":"気をつけていたのに（a まさしく　b まんまと）だまされてしまった。","a":"まさしく","b":"まんまと","ans":"b","vi":"Dù đã cẩn thận vậy mà vẫn bị lừa ngon ơ."},{"q":"就職も決まらないのに（a ましてや　b またしても）結婚なんて、まだまだ先の話です。","a":"ましてや","b":"またしても","ans":"a","vi":"Công việc còn chưa ổn định mà đã nói đến chuyện kết hôn thì còn quá sớm."},{"q":"佐藤さんの娘さんなんですね。（a どうりで　b よほど）よく似ているわけだ。","a":"どうりで","b":"よほど","ans":"a","vi":"Ra là con gái anh Sato à. Thảo nào giống vậy."},{"q":"（a いざ　b さて）となったら私が責任をとりますから、安心してください。","a":"いざ","b":"さて","ans":"a","vi":"Khi thực sự cần thiết, tôi sẽ chịu trách nhiệm, anh/chị cứ yên tâm."},{"q":"その指輪が（a まさに　b よほど）気に入ったらしく、彼女は何度も指輪をした手を眺めていた。","a":"まさに","b":"よほど","ans":"b","vi":"Có vẻ cô ấy rất thích chiếc nhẫn đó nên cứ ngắm tay đeo nhẫn mãi."},{"q":"年長者は（a とかく　b いかにも）若い人のすることを批判しがちだ。","a":"とかく","b":"いかにも","ans":"a","vi":"Người lớn tuổi thường có xu hướng phê phán hành động của người trẻ."},{"q":"あの人の言うことも（a 一概に　b 一様に）否定できない。","a":"一概に","b":"一様に","ans":"a","vi":"Lời người đó nói cũng không thể phủ nhận hoàn toàn."},{"q":"この答えも（a あながち　b あやうく）間違いとは言えないんじゃないでしょうか。","a":"あながち","b":"あやうく","ans":"a","vi":"Câu trả lời này cũng không hẳn là sai đâu nhỉ."}]},{"id":"t6","name":"集中トレーニング⑥副詞（2）","items":[{"q":"（a どうせ　b どうも）優勝できないのなら、参加したって無駄だ。","a":"どうせ","b":"どうも","ans":"a","vi":"Đằng nào cũng không vô địch được thì tham gia cũng vô ích thôi."},{"q":"ボーっと考え事をしていて（a あいにく　b あやうく）ホームから落ちるところだった。","a":"あいにく","b":"あやうく","ans":"b","vi":"Đang mải suy nghĩ vẩn vơ nên suýt nữa ngã khỏi sân ga."},{"q":"（a てっきり　b めっきり）あの二人はつきあってるんだと思っていた。","a":"てっきり","b":"めっきり","ans":"a","vi":"Cứ đinh ninh là hai người đó đang hẹn hò."},{"q":"（a まさか　b かりに）その話が真実でも、私は彼女の友達であることをやめない。","a":"まさか","b":"かりに","ans":"b","vi":"Dù chuyện đó có là sự thật, tôi cũng sẽ không thôi làm bạn với cô ấy."},{"q":"あんなに練習したのに1回戦で負けてしまって、（a さぞ　b もしや）くやしかったことだろう。","a":"さぞ","b":"もしや","ans":"a","vi":"Tập luyện vất vả vậy mà thua ngay vòng đầu, chắc hẳn cô ấy rất tiếc nuối."},{"q":"（a どうせ　b どんなに）謝られても、今となってはもう遅いんです。","a":"どうせ","b":"どんなに","ans":"b","vi":"Dù có xin lỗi thế nào thì giờ cũng đã muộn rồi."},{"q":"（a たかが　b わずか）試験の順位が少し下がったくらいでそんなに落ち込むことはない。","a":"たかが","b":"わずか","ans":"a","vi":"Chỉ tụt vài hạng trong kỳ thi thôi mà, không cần phải buồn đến vậy."},{"q":"彼の欠場は、（a ただ　b むしろ）チームの問題のみならず、ファンの期待をも裏切ることになる。","a":"ただ","b":"むしろ","ans":"a","vi":"Việc anh ấy vắng mặt không chỉ là vấn đề của đội mà còn phụ lòng mong đợi của người hâm mộ."},{"q":"（a ろくに　b めったに）見もしないでマンションを買うなんて、信じられない。","a":"ろくに","b":"めったに","ans":"a","vi":"Không xem kỹ gì mà đã mua căn hộ, thật không thể tin nổi."},{"q":"そんなに動揺するということは、（a かりに　b もしや）彼は何か隠しているのではあるまいか。","a":"かりに","b":"もしや","ans":"b","vi":"Anh ấy hoang mang đến vậy, có lẽ đang giấu chuyện gì đó chăng."}]},{"id":"t7","name":"集中トレーニング⑦似ている表現（1）","items":[{"q":"うまくいったとは言えない（a ながらに　b ながらも）、なんとか質問に答えることだけはできた。","a":"ながらに","b":"ながらも","ans":"b","vi":"Tuy chưa thể nói là suôn sẻ, nhưng ít ra cũng trả lời được câu hỏi."},{"q":"その子は子ども（a なり　b なりに）、精一杯、母親を励ましているのだった。","a":"なり","b":"なりに","ans":"b","vi":"Đứa trẻ đó, theo cách của một đứa trẻ, đang cố hết sức động viên mẹ."},{"q":"弟が試合に出る（a とあって　b とあっては）、応援に行かないわけにはいかない。","a":"とあって","b":"とあっては","ans":"b","vi":"Em trai sẽ thi đấu nên không thể không đi cổ vũ."},{"q":"彼女は涙を流し（a ながら　b ながらに）、今までの苦労を話し始めた。","a":"ながら","b":"ながらに","ans":"a","vi":"Cô ấy vừa rơi nước mắt vừa bắt đầu kể về những vất vả đã trải qua."},{"q":"この金庫はいくら開けようとした（a ところで　b ところに）、このカードがなければ決して開くまい。","a":"ところで","b":"ところに","ans":"a","vi":"Dù có cố mở két sắt thế nào, nếu không có thẻ này thì chắc chắn không mở được."},{"q":"この子は生まれ（a ながらに　b ながらも）人の心を読む不思議な力を持っていた。","a":"ながらに","b":"ながらも","ans":"a","vi":"Đứa trẻ này từ khi sinh ra đã có khả năng kỳ lạ là đọc được lòng người."},{"q":"ただ座っていないで、少しは手伝う（a なり　b なりに）してほしい。","a":"なり","b":"なりに","ans":"a","vi":"Đừng chỉ ngồi không, hãy giúp một tay đi."},{"q":"勉強を始めようとした（a ところで　b ところに）友人から電話があり、出かけることになった。","a":"ところで","b":"ところに","ans":"b","vi":"Đúng lúc định học bài thì bạn gọi điện đến, thế là lại đi chơi mất."},{"q":"さすが世界大会（a とあって　b とあっては）、どの試合も目が離せない。","a":"とあって","b":"とあっては","ans":"a","vi":"Đúng là giải đấu thế giới, trận nào cũng không thể rời mắt."},{"q":"会う（a なり　b なりに）、年齢や職業を聞くなんて失礼だ。","a":"なり","b":"なりに","ans":"a","vi":"Vừa gặp đã hỏi tuổi với nghề nghiệp thì thật bất lịch sự."}]},{"id":"t8","name":"集中トレーニング⑧似ている表現（2）","items":[{"q":"家にある薬を飲んだら熱が下がったので、病院に行かずに（a すんだ　b すませた）。","a":"すんだ","b":"すませた","ans":"a","vi":"Uống thuốc ở nhà thì hạ sốt nên không cần phải đi bệnh viện."},{"q":"あの無神経な大臣が失言をしたことは、驚くには（a 至らない　b あたらない）。","a":"至らない","b":"あたらない","ans":"b","vi":"Việc vị bộ trưởng vô tâm đó lỡ lời cũng chẳng có gì đáng ngạc nhiên."},{"q":"わざわざ来て手伝ってもらうには（a 及ばない　b 至らない）。","a":"及ばない","b":"至らない","ans":"a","vi":"Không cần phải đến tận nơi giúp đỡ đâu."},{"q":"彼がこれまでした失敗を数え挙げれば（a 足りない　b きりがない）。","a":"足りない","b":"きりがない","ans":"b","vi":"Nếu kể hết những lần thất bại của anh ấy thì không bao giờ hết."},{"q":"一方的に責められたら、こちらも説明（a しそうもない　b しようがない）。","a":"しそうもない","b":"しようがない","ans":"b","vi":"Nếu bị trách một chiều thì bên này cũng chẳng biết giải thích sao nữa."},{"q":"入院中の同級生が早く快復することを願って（a すまない　b やまない）。","a":"すまない","b":"やまない","ans":"b","vi":"Mong bạn cùng lớp đang nằm viện sớm bình phục."},{"q":"関係者がどれほど悲しんでいるか、想像に（a 難くない　b やまない）。","a":"難くない","b":"やまない","ans":"a","vi":"Không khó để tưởng tượng những người liên quan đau buồn đến mức nào."},{"q":"どんな資格であれ、持っているに（a 及ばない　b 越したことはない）。","a":"及ばない","b":"越したことはない","ans":"b","vi":"Dù là bằng cấp gì, có vẫn tốt hơn không."},{"q":"ここまで話が進んでしまったらもう断り（a そうにない　b ようがない）。こうなったら引き受けるしかない。","a":"そうにない","b":"ようがない","ans":"b","vi":"Chuyện đã đến nước này rồi thì không thể từ chối được nữa. Đành phải nhận thôi."},{"q":"以上のように改善がなされたことから、今後は解決に向かうと（a 言えそう　b 言えよう）。","a":"言えそう","b":"言えよう","ans":"b","vi":"Như đã cải thiện ở trên, có thể nói tình hình sẽ tiến triển tốt trong thời gian tới."}]},{"id":"t9","name":"集中トレーニング⑨使役・受身","items":[{"q":"彼はいろいろ言い訳しているが、私に（a 言うと　b 言わせると）、準備が足りなかっただけだ。","a":"言うと","b":"言わせると","ans":"b","vi":"Anh ta bao biện đủ kiểu, nhưng theo tôi thấy thì chỉ là do chuẩn bị chưa kỹ thôi."},{"q":"本日は19時で営業を終了と（a して　b させて）いただきます。","a":"して","b":"させて","ans":"b","vi":"Hôm nay cửa hàng sẽ đóng cửa lúc 19 giờ."},{"q":"この仕事、彼に（a やって　b やらせて）みればうまく行くかもしれませんよ。","a":"やって","b":"やらせて","ans":"b","vi":"Việc này, nếu để anh ấy làm thử thì biết đâu lại ổn đấy."},{"q":"彼の巧みな技に、誰もが（a 驚かず　b 驚かれず）にはいられなかった。","a":"驚かず","b":"驚かれず","ans":"a","vi":"Trước kỹ thuật điêu luyện của anh ấy, ai cũng phải trầm trồ."},{"q":"この絵は人を感動（a せず　b させず）にはおかない何かを持っている。","a":"せず","b":"させず","ans":"b","vi":"Bức tranh này có sức mạnh khiến người xem không thể không xúc động."},{"q":"息子を大学に合格（a せん　b させん）がために、母親は必死だった。","a":"せん","b":"させん","ans":"b","vi":"Người mẹ đã cố gắng hết sức để con trai thi đỗ đại học."},{"q":"経営状況の悪化は、私達に計画の変更を余儀なく（a させた　b された）。","a":"させた","b":"された","ans":"a","vi":"Tình hình kinh doanh xấu đi buộc chúng tôi phải thay đổi kế hoạch."},{"q":"そんな大事なことをだまっていたなんて、笑い事では（a すませない　b すまされない）ぞ。","a":"すませない","b":"すまされない","ans":"b","vi":"Giấu chuyện quan trọng như vậy thì không thể cho qua như chuyện đùa được đâu."},{"q":"条件によっては、情報を（a 教えさせられない　b 教えてやらない）こともない。","a":"教えさせられない","b":"教えてやらない","ans":"b","vi":"Tùy điều kiện, cũng không phải là không thể tiết lộ thông tin."},{"q":"悪いんだけど、ちょっと（a 頼まれて　b 頼まされて）くれないか？","a":"頼まれて","b":"頼まされて","ans":"a","vi":"Phiền bạn một chút, giúp tôi việc này được không?"}]},{"id":"t10","name":"集中トレーニング⑩くり返しの文型","items":[{"q":"来る（X）来ない（X）、とにかく一度連絡をください。","a":"にせよ","b":"といわず","ans":"a","vi":"Dù đến hay không đến, dù sao cũng hãy liên lạc một lần."},{"q":"会員（X）非会員（X）、チケットの購入には予約が必要です。","a":"なり","b":"であれ","ans":"b","vi":"Dù là hội viên hay không phải hội viên, mua vé đều cần đặt trước."},{"q":"その本、もう読まないなら、捨てる（X）誰かにあげる（X）すれば？","a":"なり","b":"やら","ans":"a","vi":"Cuốn sách đó nếu không đọc nữa thì vứt đi hay cho ai đó cũng được mà?"},{"q":"弟は、テレビを見（X）ゲームをし、ゲームをし（X）テレビを見、という怠惰な生活を続けている。","a":"つ","b":"ては","ans":"b","vi":"Em trai cứ xem tivi rồi chơi game, chơi game rồi lại xem tivi, sống một cuộc sống lười biếng như vậy."},{"q":"母は、中華料理（X）フランス料理（X）、料理なら何でも作れる。","a":"とも","b":"といわず","ans":"a","vi":"Mẹ tôi nấu được đủ món, từ món Trung Hoa đến món Pháp."},{"q":"彼女はいつも彼のことが嫌い（X）もう別れる（X）言いながら、何年もつきあっている。","a":"だの","b":"といい","ans":"a","vi":"Cô ấy lúc nào cũng nói ghét anh ta, rồi đòi chia tay, vậy mà vẫn yêu nhau suốt mấy năm."},{"q":"あの二人はいつも抜き（X）抜かれ（X）しながら1位を争っている。","a":"つ","b":"ながら","ans":"a","vi":"Hai người đó lúc nào cũng giành nhau vị trí số 1, kẻ vượt lên người bị vượt qua liên tục."},{"q":"見てもいない映画の感想を聞かれても、いい（X）悪い（X）言いようがない。","a":"とも","b":"やら","ans":"a","vi":"Bị hỏi cảm nghĩ về bộ phim chưa từng xem thì biết nói hay hay dở thế nào."},{"q":"この店の料理は、味（X）見た目（X）、どこにも文句のつけようがないほどすばらしい。","a":"であれ","b":"といい","ans":"b","vi":"Món ăn của quán này cả hương vị lẫn hình thức đều không chê vào đâu được."},{"q":"嫌いな女優に似ていると言われ、喜んでいい（X）悲しんでいい（X）、複雑な心境だ。","a":"にせよ","b":"のやら","ans":"b","vi":"Bị nói là giống nữ diễn viên mình ghét, không biết nên vui hay buồn, tâm trạng thật phức tạp."}]}]};

    const totalQ = r.parts.reduce((s,p)=>s+p.items.length,0);
    const key = 'r_'+r.id;
    const done = RESULTS[key];
    const div = document.createElement('div');
    div.className = 'tile' + (done? ' done':'');
    div.innerHTML = `<div class="num">${r.name.replace('第','').replace('回','')}</div>
      <div class="lab">回 ・ ${totalQ}問</div>
      ${done? `<div class="score-pill">${done.score}/${done.total}</div>` : `<div class="score-pill">未挑戦</div>`}`;
    div.onclick = ()=>openRound(r.id);
    rg.appendChild(div);
  });

  const tg = document.getElementById('trainGrid');
  tg.innerHTML = '';
  QUIZ_DATA.trainings.forEach(t=>{
    const key = 't_'+t.id;
    const done = RESULTS[key];
    const div = document.createElement('div');
    div.className = 'tile train' + (done? ' done':'');
    div.innerHTML = `<div class="num" style="font-size:15px">${t.name}</div>
      ${done? `<div class="score-pill">${done.score}/${done.total}</div>` : `<div class="score-pill">未挑戦</div>`}`;
    div.onclick = ()=>openTraining(t.id);
    tg.appendChild(div);
  });
}

function goHome(){
  document.getElementById('home').style.display='block';
  document.getElementById('quiz').style.display='none';
  document.getElementById('crumb').style.display='none';
  buildHome();
  window.scrollTo(0,0);
}

function openRound(id){
  const r = QUIZ_DATA.rounds.find(x=>x.id===id);
  state = {mode:'round', id, answers:{}, submitted:false};
  renderRound(r);
  showQuiz();
}
function openTraining(id){
  const t = QUIZ_DATA.trainings.find(x=>x.id===id);
  state = {mode:'train', id, answers:{}, submitted:false};
  renderTraining(t);
  showQuiz();
}
function showQuiz(){
  document.getElementById('home').style.display='none';
  document.getElementById('quiz').style.display='block';
  document.getElementById('crumb').style.display='flex';
  document.getElementById('scoreArea').innerHTML='';
  window.scrollTo(0,0);
}

function qid(partIdx, itemIdx){ return partIdx+'_'+itemIdx; }

function renderRound(r){
  document.getElementById('quizTitle').textContent = r.name;
  const totalQ = r.parts.reduce((s,p)=>s+p.items.length,0);
  document.getElementById('quizMeta').textContent = totalQ + '問';
  let html = '';
  r.parts.forEach((part,pIdx)=>{
    html += `<div class="part" data-part="${pIdx}"><div class="part-title">${part.title}</div>`;
    if(part.missing_note){
      html += `<div class="notebox">${part.missing_note}</div>`;
    }
    if(part.type==='reading' && part.passage){
      html += `<div class="passage">${escapeHtml(part.passage)}</div>`;
    }
    part.items.forEach((it,iIdx)=>{
      const id = qid(pIdx,iIdx);
      const label = part.type==='reading' ? ('【'+it.label+'】') : (iIdx+1);
      const qtext = part.type==='order' ? it.q.replace('___','＿＿').replace('★','【★】') : it.q;
      const correctText = it.o[it.a-1];
      const optsJson = escapeAttr(JSON.stringify(it.o));
      const viText = it.vi ? escapeAttr(it.vi) : '';
      const hintText = it.hint ? escapeAttr(it.hint) : '';
      html += `<div class="q-item" data-q="${id}" data-correct-text="${escapeAttr(correctText)}" data-ptype="${part.type}" data-opts="${optsJson}" data-vi="${viText}" data-hint="${hintText}">
        <span class="q-num">${label}</span><span class="q-text">${escapeHtml(qtext)}</span>
        <div class="opts">`;
      it.o.forEach((opt,oIdx)=>{
        html += optHtml(id,oIdx,opt,it.a-1);
      });
      html += `</div><div class="hint-box" id="hint_${id}"></div><div class="explain" id="exp_${id}"></div></div>`;
    });
    html += `</div>`;
  });
  document.getElementById('quizBody').innerHTML = html;
  attachOptHandlers();
}

function renderTraining(t){
  document.getElementById('quizTitle').textContent = t.name;
  document.getElementById('quizMeta').textContent = t.items.length + '問';
  let html = `<div class="part"><div class="part-title">（　）の中のaとbのうち、文に合うほうを選びましょう。</div>`;
  t.items.forEach((it,iIdx)=>{
    const id = '0_'+iIdx;
    const correctText = it.ans==='a' ? it.a : it.b;
    const optsJson = escapeAttr(JSON.stringify([it.a,it.b]));
    const viText = it.vi ? escapeAttr(it.vi) : '';
    html += `<div class="q-item" data-q="${id}" data-correct-text="${escapeAttr(correctText)}" data-ptype="ab" data-opts="${optsJson}" data-vi="${viText}" data-hint="">
      <span class="q-num">${iIdx+1}</span><span class="q-text">${escapeHtml(it.q)}</span>
      <div class="ab-row">
        ${optHtmlAB(id,'a',it.a,it.ans)}
        ${optHtmlAB(id,'b',it.b,it.ans)}
      </div><div class="hint-box" id="hint_${id}"></div><div class="explain" id="exp_${id}"></div></div>`;
  });
  html += `</div>`;
  document.getElementById('quizBody').innerHTML = html;
  attachOptHandlers();
}

function optHtml(qidStr, idx, text, correctIdx){
  const isCorrect = idx===correctIdx;
  return `<label class="opt" data-qid="${qidStr}" data-val="${idx}" data-correct="${isCorrect}">
    <span class="oi">${idx+1}</span><span>${escapeHtml(text)}</span>
  </label>`;
}
function optHtmlAB(qidStr, letter, text, correctLetter){
  const isCorrect = letter===correctLetter;
  return `<label class="opt" data-qid="${qidStr}" data-val="${letter}" data-correct="${isCorrect}">
    <span class="oi">${letter}</span><span>${escapeHtml(text)}</span>
  </label>`;
}

function attachOptHandlers(){
  document.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qidStr = el.getAttribute('data-qid');
      if(state.answers[qidStr] !== undefined) return; // đã trả lời rồi, khóa lại
      const val = el.getAttribute('data-val');
      state.answers[qidStr] = val;

      const group = document.querySelectorAll(`.opt[data-qid="${qidStr}"]`);
      group.forEach(o=>{
        o.style.pointerEvents = 'none';
        if(o.getAttribute('data-correct')==='true'){
          o.classList.add('correct');
        }
      });
      const isCorrect = el.getAttribute('data-correct')==='true';
      if(!isCorrect) el.classList.add('wrong');
      else el.classList.add('sel');

      const qItem = el.closest('.q-item');
      const correctText = qItem.getAttribute('data-correct-text');
      const ptype = qItem.getAttribute('data-ptype');
      const selectedText = el.querySelector('span:last-child').textContent;
      let optsList = [];
      try{ optsList = JSON.parse(qItem.getAttribute('data-opts')||'[]'); }catch(e){}
      const viText = qItem.getAttribute('data-vi') || '';
      const hintText = qItem.getAttribute('data-hint') || '';
      if(hintText) showHint(qidStr, hintText);
      showExplain(qidStr, correctText, ptype, optsList, viText, selectedText);

      updateLiveScore();
    });
  });
  updateLiveScore();
}

function countTotalAnswered(){
  let total=0, answered=0, score=0;
  if(state.mode==='round'){
    const r = QUIZ_DATA.rounds.find(x=>x.id===state.id);
    r.parts.forEach((part,pIdx)=>{
      part.items.forEach((it,iIdx)=>{
        total++;
        const id = qid(pIdx,iIdx);
        if(state.answers[id]!==undefined){
          answered++;
          if(parseInt(state.answers[id])===it.a-1) score++;
        }
      });
    });
  } else {
    const t = QUIZ_DATA.trainings.find(x=>x.id===state.id);
    t.items.forEach((it,iIdx)=>{
      total++;
      const id = '0_'+iIdx;
      if(state.answers[id]!==undefined){
        answered++;
        if(state.answers[id]===it.ans) score++;
      }
    });
  }
  return {total,answered,score};
}

function updateLiveScore(){
  const {total,answered,score} = countTotalAnswered();
  const area = document.getElementById('scoreArea');
  if(answered===0){ area.innerHTML=''; return; }
  const done = answered>=total;
  area.innerHTML = `
    <div class="score-banner" style="${done?'':'opacity:.92'}">
      <div class="big">${score} / ${answered}${done?'':` <span style="font-size:18px;color:var(--ink-soft)">（${answered}/${total}問 回答済み）</span>`}</div>
      <div class="small">${done? '全問終了！　緑＝正解　赤＝あなたの誤答' : '回答するたびに自動で正解が表示されます'}</div>
    </div>`;
  if(done){
    state.submitted = true;
    const key = (state.mode==='round'?'r_':'t_')+state.id;
    RESULTS[key] = {score,total};
    saveResults();
  }
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s){
  return escapeHtml(s).replace(/"/g,'&quot;');
}

function fallbackExplain(ptype){
  if(ptype==='order') return '語順問題：前後の文脈とつながる自然な日本語になるように並べ替えます。';
  if(ptype==='reading') return '文章問題：直前直後の文脈の流れに最も合う表現を選びます。';
  return '文脈から判断して、最も自然な表現を選びましょう。';
}

function showHint(qidStr, hintText){
  const box = document.getElementById('hint_'+qidStr);
  if(!box || !hintText) return;
  box.innerHTML = escapeHtml(hintText);
  box.classList.add('show');
}

function showExplain(qidStr, correctText, ptype, optsList, viText, selectedText){
  const box = document.getElementById('exp_'+qidStr);
  if(!box) return;

  let html = '';
  if(viText){
    html += `<div style="margin-bottom:8px;"><b>意味（nghĩa câu）：</b>${escapeHtml(viText)}</div>`;
  }
  html += `<div style="margin-bottom:6px;"><b>正解：${escapeHtml(correctText)}</b></div>`;

  if(optsList && optsList.length){
    const sorted = [...optsList].sort((a,b)=>{
      if(a===correctText) return -1;
      if(b===correctText) return 1;
      return 0;
    });
    html += `<div style="display:grid;gap:6px;">`;
    sorted.forEach((opt,i)=>{
      const isCorrect = opt===correctText;
      const isSelected = opt===selectedText;
      const exp = GRAM_EXP[opt] || fallbackExplain(ptype);
      const con = GRAM_CON[opt] || '';
      const marker = isCorrect ? '◎' : (isSelected ? '✕' : '・');
      const style = isCorrect ? 'color:var(--ok);font-weight:700;' : (isSelected ? 'color:var(--ng);font-weight:700;' : 'color:var(--ink-soft);');
      const conTag = con ? `<span style="display:inline-block;margin-left:6px;background:${isCorrect?'#e7f0e7':'#f4f0e8'};border-radius:3px;padding:0 6px;font-size:11px;color:${isCorrect?'#3c6e47':'#6b5a2a'};font-family:monospace;letter-spacing:.02em;">${escapeHtml(con)}</span>` : '';
      html += `<div style="line-height:1.7"><span style="${style}">${marker} ${escapeHtml(opt)}</span>${conTag}<br><span style="padding-left:18px;font-size:12.5px;">${escapeHtml(exp)}</span></div>`;
    });
    html += `</div>`;
  }

  box.innerHTML = html;
  box.classList.add('show');
}

function retryQuiz(){
  if(state.mode==='round') openRound(state.id);
  else openTraining(state.id);
}

buildHome();
</script>
</body>
</html>
