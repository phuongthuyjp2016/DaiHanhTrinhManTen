let state = { mode:null, id:null, answers:{}, submitted:false };
const RESULTS = JSON.parse(localStorage_safe_get());

function localStorage_safe_get(){
  try{ return localStorage.getItem('jpdrill_results') || '{}'; }catch(e){ return '{}'; }
}
function saveResults(){
  try{ localStorage.setItem('jpdrill_results', JSON.stringify(RESULTS)); }catch(e){}
}

const EVER_CORRECT_KEY = 'jpdrill_ever_correct';
let everCorrect = new Set(JSON.parse(localStorage.getItem(EVER_CORRECT_KEY) || '[]'));
function reportToolProgress(correct, total) {
  try {
    const key = 'dc_tool_progress';
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    all['dao3-suongmu-powerdrill-full30.html'] = { correct, total };
    localStorage.setItem(key, JSON.stringify(all));
  } catch (e) {}
}
reportToolProgress(everCorrect.size, 570);

const EXP_PER_CORRECT = 5;
const COMBO_TARGET = 10;
const COMBO_BONUS = 50;
let comboCount = 0;
const HYPE_MESSAGES = ['Xuất sắc!', 'Đỉnh của chóp!', 'Cứ thế phát huy nhé!', 'Quá đỉnh!', 'N1 đang trong tầm tay!', 'Không gì cản được bạn!', 'Chuẩn không cần chỉnh!', 'Học vậy mới máu!'];

function loadLocalProfile() {
  try { const r = localStorage.getItem('dhtm_profile_v1'); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function saveLocalProfile(p) {
  try { localStorage.setItem('dhtm_profile_v1', JSON.stringify(p)); } catch (e) {}
}
function awardExp(amount) {
  const profile = loadLocalProfile();
  if (!profile) return false;
  let exp = (profile.exp || 0) + amount, level = profile.level || 1, expToNext = profile.expToNext || 100;
  let leveledUp = false;
  while (exp >= expToNext) { exp -= expToNext; level += 1; expToNext = Math.round(expToNext * (level >= 10 ? 1.4 : 1.25)); leveledUp = true; }
  profile.exp = exp; profile.level = level; profile.expToNext = expToNext;
  saveLocalProfile(profile);
  return leveledUp;
}
function pickHype() { return HYPE_MESSAGES[Math.floor(Math.random() * HYPE_MESSAGES.length)]; }
function showExpToast(mainText, subText, big) {
  document.querySelectorAll('.exp-toast').forEach(t => t.remove());
  const wrap = document.createElement('div');
  wrap.className = 'exp-toast' + (big ? ' exp-toast-big' : '');
  const line1 = document.createElement('div');
  line1.className = 'exp-toast-main';
  line1.textContent = mainText;
  const line2 = document.createElement('div');
  line2.className = 'exp-toast-sub';
  line2.textContent = subText;
  wrap.appendChild(line1);
  wrap.appendChild(line2);
  document.body.appendChild(wrap);
  setTimeout(() => { wrap.classList.add('exp-toast-out'); }, 900);
  setTimeout(() => { wrap.remove(); }, 1400);
}
function showComboToast(n) {
  let el = document.getElementById('combo-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'combo-toast';
    el.className = 'combo-toast';
    document.body.appendChild(el);
  }
  el.textContent = '🔥 Chuỗi ' + n + ' câu đúng';
  el.classList.add('show');
  clearTimeout(window._comboToastTimer);
  window._comboToastTimer = setTimeout(() => { el.classList.remove('show'); }, 1500);
}
function showCoinBurst(amount) {
  const overlay = document.createElement('div');
  overlay.className = 'coin-burst-overlay';
  const card = document.createElement('div');
  card.className = 'coin-burst-card';
  const icon = document.createElement('div');
  icon.className = 'coin-burst-icon';
  icon.textContent = '🪙';
  const text = document.createElement('div');
  text.className = 'coin-burst-text';
  text.textContent = '+' + amount + ' Xu!';
  const sub = document.createElement('div');
  sub.className = 'coin-burst-sub';
  sub.textContent = 'Nhặt được xu may mắn!';
  card.appendChild(icon);
  card.appendChild(text);
  card.appendChild(sub);
  overlay.appendChild(card);
  for (let i = 0; i < 14; i++) {
    const pt = document.createElement('div');
    pt.className = 'coin-particle';
    pt.textContent = '🪙';
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 140;
    pt.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    pt.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    overlay.appendChild(pt);
  }
  document.body.appendChild(overlay);
  setTimeout(() => { card.classList.add('coin-burst-out'); }, 1200);
  setTimeout(() => { overlay.remove(); }, 1700);
}
function maybeDropCoins() {
  if (Math.random() >= 0.35) return;
  const amount = 5 + Math.floor(Math.random() * 21);
  const profile = loadLocalProfile();
  if (profile) {
    profile.coins = (profile.coins || 0) + amount;
    saveLocalProfile(profile);
  }
  showCoinBurst(amount);
}
function onCorrectAnswer() {
  comboCount++;
  let gained = EXP_PER_CORRECT;
  let big = false;
  let sub = pickHype();
  if (comboCount >= 2) showComboToast(comboCount);
  if (comboCount > 0 && comboCount % COMBO_TARGET === 0) {
    gained += COMBO_BONUS;
    big = true;
    sub = 'Chuỗi ' + comboCount + ' câu đúng — Bùng nổ!';
  }
  const leveledUp = awardExp(gained);
  showExpToast('+' + gained + ' EXP', leveledUp ? 'LÊN CẤP! 🎉' : sub, big || leveledUp);
  maybeDropCoins();
}
function onWrongAnswer() {
  comboCount = 0;
}

let drillSearchQuery = '';
function roundMatchesSearch(r, q){
  if(r.name.toLowerCase().includes(q)) return true;
  return r.parts.some(part=>
    (part.passage && part.passage.toLowerCase().includes(q)) ||
    part.items.some(it=> (it.q&&it.q.toLowerCase().includes(q)) || (it.o&&it.o.some(o=>o.toLowerCase().includes(q))))
  );
}
function trainingMatchesSearch(t, q){
  if(t.name.toLowerCase().includes(q)) return true;
  return t.items.some(it=> (it.q||'').toLowerCase().includes(q) || (it.a||'').toLowerCase().includes(q) || (it.b||'').toLowerCase().includes(q));
}function buildHome(){
  const q = drillSearchQuery;
  const ag = document.getElementById('allRoundsGrid');
  if(q){
    ag.innerHTML = '';
  } else {
    const doneAll = RESULTS['all'];
    ag.innerHTML = `<div class="tile" style="grid-column:1/-1;text-align:left;display:flex;align-items:center;justify-content:space-between;">
      <div><div class="num" style="font-size:16px">🔀 Làm tất cả 30 vòng</div><div class="lab">Toàn bộ câu hỏi, liên tục</div></div>
      ${doneAll? `<div class="score-pill">${doneAll.score}/${doneAll.total}</div>` : ''}
    </div>`;
    ag.querySelector('.tile').onclick = ()=>openAllRounds();
    renderDrillResumeBanner();
  }
  const rg = document.getElementById('roundGrid');
  rg.innerHTML = '';
  const filteredRounds = q ? QUIZ_DATA.rounds.filter(r=>roundMatchesSearch(r,q)) : QUIZ_DATA.rounds;
  filteredRounds.forEach(r=>{
    const totalQ = r.parts.reduce((s,p)=>s+p.items.length,0);
    const key = 'r_'+r.id;
    const done = RESULTS[key];
    const div = document.createElement('div');
    div.className = 'tile' + (done? ' done':'');
    div.innerHTML = `<div class="num">${r.name.replace('第','').replace('回','')}</div>
      <div class="lab">回 ・ ${totalQ}問</div>
      ${done? `<div class="score-pill">${done.score}/${done.total}</div>` : `<div class="score-pill">未挑戦</div>`}`;
    div.onclick = ()=>openRound(r.id);
    rg.appendChild(div);
  });

  const tg = document.getElementById('trainGrid');
  tg.innerHTML = '';
  const filteredTrainings = q ? QUIZ_DATA.trainings.filter(t=>trainingMatchesSearch(t,q)) : QUIZ_DATA.trainings;
  filteredTrainings.forEach(t=>{
    const key = 't_'+t.id;
    const done = RESULTS[key];
    const div = document.createElement('div');
    div.className = 'tile train' + (done? ' done':'');
    div.innerHTML = `<div class="num" style="font-size:15px">${t.name}</div>
      ${done? `<div class="score-pill">${done.score}/${done.total}</div>` : `<div class="score-pill">未挑戦</div>`}`;
    div.onclick = ()=>openTraining(t.id);
    tg.appendChild(div);
  });
  if(q && filteredRounds.length===0 && filteredTrainings.length===0){
    rg.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#333;padding:24px;">Không tìm thấy vòng/bài luyện nào chứa từ khóa này.</div>';
  }
}

function qid(partIdx, itemIdx){ return partIdx+'_'+itemIdx; }

function renderRound(r){
  document.getElementById('quizTitle').textContent = r.name;
  const totalQ = r.parts.reduce((s,p)=>s+p.items.length,0);
  document.getElementById('quizMeta').textContent = totalQ + '問';
  let html = '';
  r.parts.forEach((part,pIdx)=>{
    html += `<div class="part" data-part="${pIdx}"><div class="part-title">${part.title}</div>`;
    if(part.missing_note){
      html += `<div class="notebox">${part.missing_note}</div>`;
    }
    if(part.type==='reading' && part.passage){
      html += `<div class="passage">${escapeHtml(part.passage)}</div>`;
    }
    part.items.forEach((it,iIdx)=>{
      const id = qid(pIdx,iIdx);
      const label = part.type==='reading' ? ('【'+it.label+'】') : (iIdx+1);
      const qraw = it.q;
      const qtext = part.type==='order' ? it.q.replace(/___/g,'＿＿').replace('★','【★】') : it.q;
      const correctText = it.o[it.a-1];
      const optsJson = escapeAttr(JSON.stringify(it.o));
      const viText = (part.type==='order') ? (it.vi_p2 ? escapeAttr(it.vi_p2) : '') : (it.vi ? escapeAttr(it.vi) : '');
      const hintText = it.hint ? escapeAttr(it.hint) : '';
      const noteText = it.note ? escapeAttr(it.note) : '';
      const orderJson = it.order ? escapeAttr(JSON.stringify(it.order)) : '';
      const sentenceText = it.sentence ? escapeAttr(it.sentence) : '';
      html += `<div class="q-item" data-q="${id}" data-correct-text="${escapeAttr(correctText)}" data-ptype="${part.type}" data-opts="${optsJson}" data-vi="${viText}" data-hint="${hintText}" data-note="${noteText}" data-order="${orderJson}" data-qraw="${escapeAttr(qraw)}" data-sentence="${sentenceText}">
        <button class="skip-btn" onclick="skipQItem('${id}')">Bỏ qua</button>
        <span class="q-num">${label}.</span><span class="q-text">${escapeHtml(qtext)}</span>
        <div class="opts">`;
      it.o.forEach((opt,oIdx)=>{
        html += optHtml(id,oIdx,opt,it.a-1);
      });
      html += `</div><div class="hint-box" id="hint_${id}"></div><div class="explain" id="exp_${id}"></div></div>`;
    });
    html += `</div>`;
  });
  document.getElementById('quizBody').innerHTML = html;
  attachOptHandlers();
}

function renderTraining(t){
  document.getElementById('quizTitle').textContent = t.name;
  document.getElementById('quizMeta').textContent = t.items.length + '問';
  let html = `<div class="part"><div class="part-title">（　）の中のaとbのうち、文に合うほうを選びましょう。</div>`;

      <button class="skip-btn" onclick="skipQItem('${id}')">Bỏ qua</button>
      <span class="q-num">${iIdx+1}.</span><span class="q-text">${escapeHtml(it.q)}</span>

function optHtml(qidStr, idx, text, correctIdx){
  const isCorrect = idx===correctIdx;
  return `<label class="opt" data-qid="${qidStr}" data-val="${idx}" data-correct="${isCorrect}">
    <span class="oi">${idx+1}</span><span>${escapeHtml(text)}</span>
  </label>`;
}
function optHtmlAB(qidStr, letter, text, correctLetter){
  const isCorrect = letter===correctLetter;
  return `<label class="opt" data-qid="${qidStr}" data-val="${letter}" data-correct="${isCorrect}">
    <span class="oi">${letter}</span><span>${escapeHtml(text)}</span>
  </label>`;
}

function attachOptHandlers(){
  document.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qidStr = el.getAttribute('data-qid');
      if(state.answers[qidStr] !== undefined) return; // đã trả lời rồi, khóa lại
      const val = el.getAttribute('data-val');
      state.answers[qidStr] = val;

      const group = document.querySelectorAll(`.opt[data-qid="${qidStr}"]`);
      group.forEach(o=>{
        o.style.pointerEvents = 'none';
        if(o.getAttribute('data-correct')==='true'){
          o.classList.add('correct');
        }
      });
      const isCorrect = el.getAttribute('data-correct')==='true';
      if(!isCorrect) { el.classList.add('wrong'); onWrongAnswer(); }
      else {
        el.classList.add('sel');
        const globalQid = state.mode==='all' ? ('round_'+qidStr) : (state.mode+'_'+state.id+'_'+qidStr);
        if(!everCorrect.has(globalQid)){
          everCorrect.add(globalQid);
          try{ localStorage.setItem(EVER_CORRECT_KEY, JSON.stringify([...everCorrect])); }catch(e){}
          reportToolProgress(everCorrect.size, 570);
        }
        onCorrectAnswer();
      }

      const qItem = el.closest('.q-item');
      const correctText = qItem.getAttribute('data-correct-text');
      const ptype = qItem.getAttribute('data-ptype');
      const selectedText = el.querySelector('span:last-child').textContent;
      let optsList = [];
      try{ optsList = JSON.parse(qItem.getAttribute('data-opts')||'[]'); }catch(e){}
      const viText = qItem.getAttribute('data-vi') || '';
      const hintText = qItem.getAttribute('data-hint') || '';
      const sentenceText = qItem.getAttribute('data-sentence') || '';
      if(hintText) showHint(qidStr, hintText, sentenceText);

      if(ptype==='order'){
        let order=[];
        try{ order=JSON.parse(qItem.getAttribute('data-order')||'[]'); }catch(e){}
        const qraw = qItem.getAttribute('data-qraw') || '';
        const viP2 = qItem.getAttribute('data-vi') || '';
        const noteText = qItem.getAttribute('data-note') || '';
        showExplainOrder(qidStr, correctText, optsList, order, qraw, viP2, noteText);
      } else if(ptype!=='reading'){
        showExplain(qidStr, correctText, ptype, optsList, viText, selectedText);
      }

      updateLiveScore();
      saveDrillProgress();
    });
  });
  updateLiveScore();
}

function skipQItem(qidStr){
  if(state.answers[qidStr] !== undefined) return;
  state.answers[qidStr] = '__skip__';
  const group = document.querySelectorAll(`.opt[data-qid="${qidStr}"]`);
  group.forEach(o=>{
    o.style.pointerEvents = 'none';
    if(o.getAttribute('data-correct')==='true'){ o.classList.add('correct'); }
  });
  const qItem = document.querySelector(`.q-item[data-q="${qidStr}"]`);
  if(qItem){
    const correctText = qItem.getAttribute('data-correct-text');
    const ptype = qItem.getAttribute('data-ptype');
    let optsList = [];
    try{ optsList = JSON.parse(qItem.getAttribute('data-opts')||'[]'); }catch(e){}
    const viText = qItem.getAttribute('data-vi') || '';
    showExplain(qidStr, correctText, ptype, optsList, viText, '');
  }
  updateLiveScore();
  saveDrillProgress();
}

function reapplyAnsweredState(){
  Object.keys(state.answers).forEach(qidStr=>{
    const val = state.answers[qidStr];
    const group = document.querySelectorAll(`.opt[data-qid="${qidStr}"]`);
    if(!group.length) return;
    group.forEach(o=>{
      o.style.pointerEvents = 'none';
      if(o.getAttribute('data-correct')==='true') o.classList.add('correct');
      else if(o.getAttribute('data-val')===val) o.classList.add('wrong');
    });
    const qItem = document.querySelector(`.q-item[data-q="${qidStr}"]`);
    if(!qItem) return;
    const correctText = qItem.getAttribute('data-correct-text');
    const ptype = qItem.getAttribute('data-ptype');
    let optsList = [];
    try{ optsList = JSON.parse(qItem.getAttribute('data-opts')||'[]'); }catch(e){}
    const viText = qItem.getAttribute('data-vi') || '';
    const hintText = qItem.getAttribute('data-hint') || '';
    if(hintText) showHint(qidStr, hintText);
    let selectedText = '';
    if(val !== '__skip__'){
      const selEl = document.querySelector(`.opt[data-qid="${qidStr}"][data-val="${val}"]`);
      if(selEl) selectedText = selEl.querySelector('span:last-child').textContent;
    }
    showExplain(qidStr, correctText, ptype, optsList, viText, selectedText);
  });
  updateLiveScore();
}

  const answeredCount = p ? Object.keys(p.answers||{}).length : 0;

    <div><button class="resume-go" onclick="continueDrill()">Tiếp tục →</button><button class="resume-clear" onclick="clearDrillProgress()">Xóa</button></div></div>`;

function continueDrill(){
  const p = loadDrillProgress();
  if(!p) return;
  if(p.mode==='round') openRound(p.id, p.answers);
  else if(p.mode==='all') openAllRounds(p.answers);
  else openTraining(p.id, p.answers);
}

function countTotalAnswered(){
  let total=0, answered=0, score=0;
  if(state.mode==='round'){
    const r = QUIZ_DATA.rounds.find(x=>x.id===state.id);
    r.parts.forEach((part,pIdx)=>{
      part.items.forEach((it,iIdx)=>{
        total++;
        const id = qid(pIdx,iIdx);
        if(state.answers[id]!==undefined){
          answered++;
          if(parseInt(state.answers[id])===it.a-1) score++;
        }
      });
    });
  } else if(state.mode==='all'){
    QUIZ_DATA.rounds.forEach(r=>{
      r.parts.forEach((part,pIdx)=>{
        part.items.forEach((it,iIdx)=>{
          total++;
          const id = r.id+'_'+pIdx+'_'+iIdx;
          if(state.answers[id]!==undefined){
            answered++;
            if(parseInt(state.answers[id])===it.a-1) score++;
          }
        });
      });
    });
  } else {
    const t = QUIZ_DATA.trainings.find(x=>x.id===state.id);
    t.items.forEach((it,iIdx)=>{
      total++;
      const id = '0_'+iIdx;
      if(state.answers[id]!==undefined){
        answered++;
        if(state.answers[id]===it.ans) score++;
      }
    });
  }
  return {total,answered,score};
}

function updateLiveScore(){
  const {total,answered,score} = countTotalAnswered();
  const area = document.getElementById('scoreArea');
  if(answered===0){ area.innerHTML=''; return; }
  const done = answered>=total;
  area.innerHTML = `
    <div class="score-banner" style="${done?'':'opacity:.92'}">
      <div class="big">${score} / ${answered}${done?'':` <span style="font-size:18px;color:var(--ink-soft)">（${answered}/${total}問 回答済み）</span>`}</div>
      <div class="small">${done? '全問終了！　緑＝正解　赤＝あなたの誤答' : '回答するたびに自動で正解が表示されます'}</div>
    </div>`;
  if(done){
    state.submitted = true;
    const key = state.mode==='round' ? 'r_'+state.id : (state.mode==='all' ? 'all' : 't_'+state.id);
    RESULTS[key] = {score,total};
    saveResults();
    clearDrillProgress();
  }
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s){
  return escapeHtml(s).replace(/"/g,'&quot;');
}

function fallbackExplain(ptype){
  if(ptype==='order') return '語順問題：前後の文脈とつながる自然な日本語になるように並べ替えます。';
  if(ptype==='reading') return '文章問題：直前直後の文脈の流れに最も合う表現を選びます。';
  return '文脈から判断して、最も自然な表現を選びましょう。';
}

// ──────── shared text formatter (✔ / ✘ / 📘 highlighting) ────────
function formatExplainText(text){
  return escapeHtml(text)
    .replace(/\n/g,'<br>')
    // ✔ line: Japanese part (before =) → green, Vietnamese part (after =) → black
    .replace(/(✔\s*)([^=<]+)(=)([^<]*)/g, (_,mark,jpn,eq,viet)=>
      `<span style="color:var(--ok);font-weight:600">${mark}${jpn}${eq}</span><span style="color:#111;font-weight:500">${viet}</span>`)
    // ✘ lines → red
    .replace(/(✘[^<]*)/g,'<span style="color:var(--ng)">$1</span>')
    // 📘 grammar-point lines → highlighted block
    .replace(/(📘[^<]*)/g,'<span style="color:#1a5fb4;font-weight:600">$1</span>');
}

// ──────── 問題2 (★並べ替え) explanation ────────
function showExplainOrder(qidStr, correctText, opts, order, qraw, viP2, noteText){
  const box = document.getElementById('exp_'+qidStr);
  if(!box) return;

  const pieces = order.map(n=>opts[n-1]);
  let starSlot=-1;
  for(let i=0;i<pieces.length;i++) if(pieces[i]===correctText){starSlot=i;break;}
  const starOptNum = order[starSlot];

  const fixedParts = qraw.split(/___|\u2605/).map(s=>s.trim()).filter((_,i,a)=>i===0||i===a.length-1);
  const prefix = fixedParts[0]||'';
  const suffix = fixedParts[fixedParts.length-1]||'';
  const orderStr = order.join('-');

  let assembled = prefix ? escapeHtml(prefix) : '';
  pieces.forEach((p,i)=>{
    const isStar=(i===starSlot);
    assembled += isStar
      ? '【<span style="color:#b3402f;font-weight:700;">★' + escapeHtml(p) + '</span>】'
      : '【' + escapeHtml(p) + '】';
  });
  if(suffix) assembled += escapeHtml(suffix);

  const head=pieces[0], mid1=pieces[1], mid2=pieces[2], tail=pieces[3];

  let stepsHtml;
  if(noteText){
    // Giải thích chi tiết viết sẵn cho từng câu: ghép cặp, lý do vị trí, ngữ pháp trọng tâm
    stepsHtml = '<div class="m2-steps m2-note">' + formatExplainText(noteText) + '</div>';
  } else {
    const s1 = '<div class="m2-step"><b>1. Mảnh đầu câu (vị trí 1):</b> “' + escapeHtml(head) + '” — khớp với phần câu ngay trước chỗ trống.</div>';
    const s2 = '<div class="m2-step"><b>2. Mảnh cuối câu (vị trí 4):</b> “' + escapeHtml(tail) + '” — khớp với phần câu ngay sau chỗ trống.</div>';
    const s3 = '<div class="m2-step"><b>3. Hai mảnh giữa (2-3):</b> “' + escapeHtml(mid1) + '” rồi “' + escapeHtml(mid2) + '” — ghép theo cấu trúc ngữ pháp/ý nghĩa.</div>';
    const s4 = '<div class="m2-step"><b>4. Vị trí ★ (số ' + starOptNum + '):</b> = <span style="color:#b3402f;font-weight:700;">' + escapeHtml(correctText) + '</span></div>';
    stepsHtml = '<div class="m2-steps">' + s1 + s2 + s3 + s4 + '</div>';
  }
  const viHtml = viP2 ? '<div class="m2-vi">' + escapeHtml(viP2) + '</div>' : '';

  box.innerHTML =
    '<div class="m2-badges">'+
    '<span class="m2-order">Thứ tự đúng: ' + orderStr + '</span>'+
    '<span class="m2-mau">📌 Mẫu: <b>' + escapeHtml(correctText) + '</b></span>'+
    '</div>'+
    '<div class="m2-sentence">' + assembled + '</div>'+
    viHtml+
    '<hr class="m2-hr">'+
    stepsHtml;
  box.classList.add('show');
}
// ──────── showHint ────────
function showHint(qidStr, hintText, sentenceText){
  const box = document.getElementById('hint_'+qidStr);
  if(!box || !hintText) return;

  let html = '';
  if(sentenceText){
    html += `<div class="hint-sentence">${escapeHtml(sentenceText).replace(/\n/g,'<br>')}</div>`;
  }

  const trapLabel = 'chỗ này là bẫy';
  const trapIdx = hintText.indexOf(trapLabel);
  const mainText = trapIdx>=0 ? hintText.slice(0, trapIdx).trim() : hintText.trim();
  const trapText = trapIdx>=0 ? hintText.slice(trapIdx + trapLabel.length).trim() : '';

  html += `<div class="hint-main">${formatExplainText(mainText)}</div>`;

  if(trapText){
    const cards = trapText.split(/\n\n+/).map(s=>s.trim()).filter(Boolean);
    html += `<div class="hint-trap-label">⚠️ Chỗ này là bẫy</div><div class="hint-trap-cards">`;
    cards.forEach(seg=>{
      html += `<div class="hint-trap-card">${formatExplainText(seg)}</div>`;
    });
    html += `</div>`;
  }

  box.innerHTML = html;
  box.classList.add('show');
}

function showExplain(qidStr, correctText, ptype, optsList, viText, selectedText){
  const box = document.getElementById('exp_'+qidStr);
  if(!box) return;

  const correctExp = GRAM_EXP[correctText] || fallbackExplain(ptype);
  const correctCon = GRAM_CON[correctText] || '';

  // Wrong options (not the correct one)
  const wrongOpts = optsList.filter(o => o !== correctText);

  let html = '';

  // 1. CẤU TRÚC
  if(correctCon){
    html += `<div class="ex-label">Cấu trúc</div>`;
    html += `<div><span class="ex-cau-truc">${escapeHtml(correctCon)}</span></div>`;
  }

  // 2. NGỮ PHÁP
  html += `<div class="ex-label">Ngữ pháp</div>`;
  // NGỮ PHÁP: Japanese part → green, Vietnamese part → black
  const colonIdx = correctExp.indexOf(': ');
  const nguPhapHtml = (colonIdx > 0 && colonIdx < correctExp.length * 0.6)
    ? `<span style="color:var(--ink);font-weight:800;">${escapeHtml(correctExp.slice(0,colonIdx+1))}</span><span style="color:var(--ink);font-weight:600;"> ${escapeHtml(correctExp.slice(colonIdx+2))}</span>`
    : `<span style="font-weight:600;">${escapeHtml(correctExp)}</span>`;
  html += `<div class="ex-ngu-phap">${nguPhapHtml}</div>`;

  // 3. NGHĨA
  if(viText){
    html += `<div class="ex-label">Nghĩa</div>`;
    html += `<div class="ex-nghia">${escapeHtml(viText)}</div>`;
  }

  // 4. BẪY JLPT (wrong options)
  if(wrongOpts.length){
    html += `<div class="ex-label" style="color:#b3402f;">Bẫy JLPT</div>`;
    html += `<div class="ex-bay">`;
    wrongOpts.forEach((opt,i)=>{
      const isSelected = opt === selectedText;
      const exp = GRAM_EXP[opt] || fallbackExplain(ptype);
      const con = GRAM_CON[opt] || '';
      const mark = isSelected ? '✕ ' : '';
      const nameStyle = isSelected
        ? 'color:var(--ng);font-weight:700;font-size:14px;'
        : 'color:#1a1a2e;font-weight:700;font-size:14px;';
      const conStr = con ? con : '';
      html += `<div class="ex-bay-item">
        <span style="${nameStyle}">${mark}${escapeHtml(opt)}</span>
        ${conStr ? `<span style="margin-left:8px;font-size:13px;font-weight:700;color:#111;font-family:'Hiragino Mincho ProN','Noto Serif JP',serif;">${escapeHtml(conStr)}</span>` : ''}
        <br><span style="color:#444;font-size:12.5px;">— ${escapeHtml(exp)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  box.innerHTML = html;
  box.classList.add('show');
}

function retryQuiz(){
  if(state.mode==='round') openRound(state.id);
  else if(state.mode==='all') openAllRounds();
  else openTraining(state.id);
}
