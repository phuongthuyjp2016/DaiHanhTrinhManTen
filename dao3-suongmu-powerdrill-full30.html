}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"いつの頃からか、紙袋オバサンと呼ばれている。どんなときでも紙袋をぶらさげているからだ。最初のうちは気づかなかったが、出先で人に会い、「あなたって本当に紙袋が好きなのね」などと溜息まじりの声を【1】以来自覚するようになった。「なんとかその、紙袋なしで出かけるってことはできないものかねえ」とあからさまに非難されたこともある。しかし、それは私にとって、難しい相談だ。\n【2】荷物が多いのがいけない。一日にいくつもの用事を果たそうとするとなおさらのこと。仕事に関する資料、本、原稿、ノート、化粧道具一式（家でお化粧をすれば必要ないのだが、切羽詰まって時間がなくなり、出先でやろうと思うから、結局いつも持って出かける【3】）、なんだかんだで持ち物が増え、とうていハンドバッグに入りきらない。豆のような小型のバッグ一つで歩いている女性を見かけると、どうしてそんな器用なことができるのか聞きたくなる。\nなんとか紙袋を持たないようにと、ハンドバッグ自体を大きくしてみたこともある。【4】なぜか、バッグが大型になればなったぶん、入れるものは増える。溢れた荷物はやはり、紙袋に入れる【5】のである。\n（阿川佐和子著『無意識過剰』文藝春秋刊）","items":[{"label":"1","o":["出して","出した","出されて","出された"],"a":3,"hint":"Dạng câu hỏi: Mốc thời gian (~た以来)\n\nQuan hệ A-B: A (người khác đã thốt ra lời than) là MỐC thời gian, B (bắt đầu tự nhận thức) là trạng thái tiếp diễn từ mốc đó.\n\n「溜息まじりの声を【1】以来自覚するようになった」→ mốc thời gian bằng Vた以来 → chọn ② 出した\n→ Vた以来 = 'kể từ khi... đã...' cần dạng quá khứ hoàn chỉnh\n\nchỗ này là bẫy\n\n✗ 出して (thể て) = sai vì cần nối tiếp hành động khác, không hợp trước 以来\n\n✗ 出されて/出された (bị động) = sai vì đây chỉ đơn thuần mô tả sự kiện làm mốc thời gian, không cần sắc thái bị động","sentence":"最初のうちは気づかなかったが、出先で人に会い、「あなたって本当に紙袋が好きなのね」などと溜息まじりの声を【1】以来自覚するようになった。"},{"label":"2","o":["すなわち","そもそも","なぜなら","なるほど"],"a":2,"hint":"Dạng câu hỏi: Truy về gốc rễ (そもそも)\n\nQuan hệ A-B: A (đồ đạc quá nhiều) được B (tác giả) truy về NGUYÊN NHÂN GỐC RỄ của cả vấn đề, mở đầu đoạn phân tích mới.\n\n「【2】荷物が多いのがいけない」→ truy về gốc rễ vấn đề → chọn ② そもそも\n→ そもそも = 'vốn dĩ, xét đến cùng' (mở đầu giải thích nguyên nhân gốc rễ)\n\nchỗ này là bẫy\n\n✗ すなわち = 'tức là' (diễn giải lại câu trước) — sai, đây là nguyên nhân MỚI\n\n✗ なぜなら = cần theo sau lý do giải thích trực tiếp câu TRƯỚC — sai vị trí (câu này mở đầu đoạn phân tích mới)\n\n✗ なるほど = 'quả nhiên, ra là vậy' — sai nghĩa hoàn toàn","sentence":"【2】荷物が多いのがいけない。"},{"label":"3","o":["ことになる","ようになる","こともある","こともない"],"a":1,"hint":"Dạng câu hỏi: Kết luận tất yếu (~ことになる)\n\nQuan hệ A-B: A (lười trang điểm ở nhà, lý do vừa nêu) dẫn đến B (rốt cuộc luôn mang theo đồ trang điểm) — kết luận logic tức thời.\n\n「結局いつも持って出かける【3】)」→ kết luận tất yếu → chọn ① ことになる\n→ ことになる = 'kết quả là thành ra...' (kết luận tất yếu từ lý do vừa nêu)\n\nchỗ này là bẫy\n\n✗ ようになる = thay đổi DẦN theo thời gian — sai sắc thái (đây là kết luận logic tức thời)\n\n✗ こともある/こともない = 'cũng có khi có/không' — sai nghĩa, không khớp mạch khẳng định chắc chắn","sentence":"仕事に関する資料、本、原稿、ノート、化粧道具一式（家でお化粧をすれば必要ないのだが、切羽詰まって時間がなくなり、出先でやろうと思うから、結局いつも持って出かける【3】）、なんだかんだで持ち物が増え、とうていハンドバッグに入りきらない。"},{"label":"4","o":["そのため","それとも","ところが","ところで"],"a":3,"hint":"Dạng câu hỏi: Tương phản bất ngờ (ところが)\n\nQuan hệ A-B: A (làm túi to hơn để đựng vừa — mục đích) hoàn toàn TRÁI VỚI kết quả B (túi càng to đồ đựng càng nhiều) — phá vỡ kỳ vọng.\n\n「ハンドバッグ自体を大きくしてみたこともある。【4】なぜか、バッグが大型になれば…入れるものは増える」→ tương phản bất ngờ → chọn ③ ところが\n→ ところが = 'thế nhưng, vậy mà' (làm túi to hơn để đựng vừa, nhưng kết quả ngược lại)\n\nchỗ này là bẫy\n\n✗ そのため = 'vì vậy' (nguyên nhân-kết quả THUẬN) — NGƯỢC nghĩa hoàn toàn\n\n✗ それとも = 'hay là' — sai nghĩa hoàn toàn\n\n✗ ところで = 'à mà, nhân tiện' (chuyển chủ đề) — sai nghĩa","sentence":"【4】なぜか、バッグが大型になればなったぶん、入れるものは増える。"},{"label":"5","o":["しかなくなる","べきではない","こともなくなる","わけはなくなる"],"a":1,"hint":"Dạng câu hỏi: Không còn lựa chọn nào khác (~しかなくなる)\n\nQuan hệ A-B: A (đồ đạc tràn ra) dẫn đến B (CHỈ CÒN CÁCH duy nhất là cho vào túi giấy) — không còn lựa chọn khác.\n\n「溢れた荷物はやはり、紙袋に入れる【5】のである」→ không còn lựa chọn nào khác → chọn ① しかなくなる\n→ しかなくなる = 'trở thành chỉ còn cách...' \n\nchỗ này là bẫy\n\n✗ べきではない = 'không nên' — sai nghĩa hoàn toàn\n\n✗ こともなくなる = 'cũng không còn việc' — sai nghĩa\n\n✗ わけはなくなる = 'không thể nào là' — sai nghĩa/cấu trúc","sentence":"溢れた荷物はやはり、紙袋に入れる【5】のである。"}]}]},{"id":"r23","name":"第23回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"兄は入学試験が（　）、まったく勉強していない。","o":["終らんがため","終るやいなや","終ったからには","終ってからというもの"],"a":4,"vi":"Từ khi anh trai thi xong đại học, anh ấy chẳng học hành gì cả.","hint":"Thấy「入学試験が＿＿まったく勉強していない」→ chọン からには\n✔ Vた形＋からには =「đã...thì (đương nhiên phải)」\n✘ てからというもの = kể từ khi (liên tục)"},{"q":"内部情報が流出する（　）原因を徹底的に調査しなければならない。","o":["からの","なりの","による","に至った"],"a":4,"vi":"Phải điều tra kỹ nguyên nhân dẫn đến việc rò rỉ thông tin nội bộ.","hint":"Thấy「流出する＿＿原因を調査しなければならない」→ chọン に至った\n✔ V辞書形＋に至った =「đã đi đến mức (cần điều tra)」(đạt kết quả cần hành động)"},{"q":"山田さんは話を誇張する（　）から、すべてを信じないほうがいい。","o":["までもない","ものがある","きらいがある","にとどまらない"],"a":3,"vi":"Anh Yamada có khuynh hướng phóng đại câu chuyện nên tốt nhất đừng tin hết những gì anh ấy nói.","hint":"Thấy「誇張する＿＿から、信じないほうがいい」→ chọン きらいがある\n✔ V辞書形＋きらいがある =「có xu hướng (tiêu cực)」\n✘ ものがある = cảm giác có điều gì đó (ấn tượng mơ hồ)"},{"q":"スペイン語を多少（　）習ったのなら、あいさつぐらいは言えるだろう。","o":["たりとも","ともなく","ながらに","なりとも"],"a":4,"vi":"Nếu đã học tiếng Tây Ban Nha dù chỉ chút ít thì cũng nói được vài câu chào hỏi chứ.","hint":"Thấy「スペイン語を多少＿＿習ったのなら」→ chọン なりとも\n✔ N/数量＋なりとも =「dù chỉ...cũng (ít nhất)」\n✘ たりとも = phủ định tuyệt đối (dù chỉ một chút cũng không)"},{"q":"友人が海外に引っ越したので、旅行（　）遊びに行くことにした。","o":["がてら","ついで","かねがね","ともども"],"a":1,"vi":"Vì bạn chuyển ra nước ngoài sống nên tôi quyết định nhân tiện đi du lịch ghé thăm bạn.","hint":"Thấy「旅行＿＿遊びに行く」→ chọン がてら\n✔ V/N＋がてら =「nhân tiện...」(kết hợp 2 việc trong cùng chuyến đi)"},{"q":"読んでくれる人（　）雑誌だから、読者の声を大切にしていきたい。","o":["ゆえの","あっての","ながらの","ならではの"],"a":2,"vi":"Vì đây là tạp chí dành riêng cho độc giả trung thành nên chúng tôi muốn trân trọng ý kiến của họ.","hint":"Thấy「読んでくれる人＿＿雑誌」→ chọン あっての\n✔ N1＋あっての＋N2 =「nhờ có N1 mới có N2」(N1 là điều kiện tồn tại của N2)"},{"q":"最終面接での印象（　）、二人のうちどちらが合格するかが決まるだろう。","o":["いかんで","からして","を兼ねて","をもって"],"a":1,"vi":"Tùy vào ấn tượng ở vòng phỏng vấn cuối cùng mà sẽ quyết định ai trong hai người trúng tuyển.","hint":"Thấy「印象＿＿どちらが合格するか決まる」→ chọン いかんで\n✔ Nの＋いかんで =「tùy theo...mà」(N quyết định kết quả)\n✘ からして = xét ngay từ... (đánh giá ban đầu)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"校長は健康 ___ ___ ★ ___ で退職されるそうだ。","o":["今年","上の","限り","問題から"],"a":1,"order":[2,4,1,3],"vi_p2":"Nghe nói hiệu trưởng sẽ nghỉ hưu năm nay vì lý do sức khỏe."},{"q":"彼がゴールを決めた瞬間、満員の ___ ___ ★ ___ 歓声が起こった。","o":["の","割れん","ばかり","観衆から"],"a":3,"order":[4,2,3,1],"vi_p2":"Ngay khoảnh khắc anh ấy ghi bàn, tiếng歓呼 từ khán giả chật cứng vang lên như muốn vỡ sân."},{"q":"システムの欠陥は ___ ___ ★ ___ いたはずだ。","o":["までもなく","今さら","わかって","指摘される"],"a":1,"order":[2,4,1,3],"vi_p2":"Lỗ hổng hệ thống đáng lẽ đã được phát hiện từ trước, không cần phải chỉ ra bây giờ nữa."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"幸福とは一言で言ってしまえば、欲求の充足という【1】でしょう。食べたいものを食べる。やりたいことをやる。とても単純なものかもしれない。ただし、それらはあくまでも自分の中から生まれてきたもので【2】。人が食べているから食べる。みんながやっているから自分もやる。モノマネの欲求で充足は得られないのです。\n結局は自分に正直になるしかない。いまの自分が何を求めているのか。いま本当にやりたいことは何なのか。それを自らが【3】ことです。そしてそこには必ず矛盾が生じてくるもの。いまやっていることと反対のことに興味が出たり、少し前までは興味があったのにすぐに無くなったりする。でも、それをも含めて自分に正直であればいいのです。\n私はこよなく自然を愛しています。都会から離れて、自然に包まれてのんびりと暮したい。そんな欲求がある。【4】、東京生まれの自分が田舎に住めるはずはない。ガサガサと忙しいのが性に合っている自分が、のんびりと暮すことはできない。矛盾した二つの欲求が、私の中には存在しているわけです。\n人は皆、思い惑いながら生きています。自分が何者か分からず、悩みながら生きている。でも、その姿こそがありのままの自分なのです。【5】ものを追いかけることは止めて、いまある自分に目を向ける。幸せを創り出すには、それが最も近道ではないでしょうか。\n（小椋佳著『幸福は見つけるものではなく、創り出すもの』PHP研究所刊『幸福論』所収）","items":[{"label":"1","o":["ことにする","ことになる","ものがある","ものとする"],"a":2,"hint":"Dạng câu hỏi: Định nghĩa nhẹ, mở (~というものがある)\n\nQuan hệ A-B: A (hạnh phúc, nói ngắn gọn) được B định nghĩa MỞ, nhẹ nhàng là 'việc thỏa mãn ham muốn' — không khẳng định cứng nhắc.\n\n「幸福とは一言で言ってしまえば、欲求の充足という【1】でしょう」→ định nghĩa nhẹ nhàng → chọn ③ ものがある\n→ Nというものがある = 'có lẽ là điều/thứ gọi là N' (định nghĩa mở, nhẹ nhàng)\n\nchỗ này là bẫy\n\n✗ ことにする = 'quyết định là' — sai nghĩa\n\n✗ ことになる = 'sẽ trở thành' (hơi cứng nhắc hơn ngữ cảnh định nghĩa mở này)\n\n✗ ものとする = 'quy định là' (mang tính luật lệ trang trọng) — quá cứng nhắc cho văn triết lý cá nhân","sentence":"幸福とは一言で言ってしまえば、欲求の充足という【1】でしょう。"},{"label":"2","o":["なくもない","あるわけがない","なくてはならない","あってはならない"],"a":3,"hint":"⚠️ CẦN ĐỐI CHIẾU LẠI VỚI SÁCH GỐC: dữ liệu cho đáp án ① なくもない (phủ định kép nhẹ), nhưng mạch ただし + あくまでも (nhấn mạnh dứt khoát) trước chỗ trống gợi ý cần một khẳng định MẠNH hơn kiểu なくてはならない (③, 'phải có, bắt buộc là'). Có thể あくまでも ở đây đang bổ nghĩa cho '自分の中から' (nhấn 'chỉ từ chính bản thân' làm nguồn gốc) chứ không nhấn mạnh cả mệnh đề, khiến なくもない (lối nói khiêm tốn kiểu Nhật, 'cũng không phải là không...') vẫn hợp lý — nhưng nên xác minh lại với bản gốc trước khi học tủ cấu trúc này.","sentence":"ただし、それらはあくまでも自分の中から生まれてきたもので【2】。"},{"label":"3","o":["考え得る","考え抜く","考え込む","考えたがる"],"a":2,"hint":"Dạng câu hỏi: Mức độ suy nghĩ sâu (考え抜く)\n\nQuan hệ A-B: A (điều bản thân đang thực sự muốn) cần được B (tự mình) SUY NGHĨ ĐẾN TẬN CÙNG, không phải hời hợt.\n\n「それを自らが【3】ことです」→ suy nghĩ đến tận cùng, thấu đáo → chọn ② 考え抜く\n→ 考え抜く = 'suy nghĩ đến tận cùng' — khớp mạch cần tự vấn bản thân sâu sắc\n\nchỗ này là bẫy\n\n✗ 考え得る = 'có thể nghĩ ra' (khả năng) — sai sắc thái, không nhấn độ sâu\n\n✗ 考え込む = 'chìm đắm trong suy nghĩ' (trạng thái băn khoăn/bế tắc) — sai sắc thái so với chủ động suy nghĩ đến cùng\n\n✗ 考えたがる = 'muốn nghĩ' — sai nghĩa","sentence":"それを自らが【3】ことです。"},{"label":"4","o":["その上で","その一方で","それはさておき","それにもまして"],"a":2,"hint":"Dạng câu hỏi: Đối chiếu 2 khía cạnh mâu thuẫn (その一方で)\n\nQuan hệ A-B: A (ham muốn sống hòa mình với thiên nhiên) và B (thực tế sinh ra ở Tokyo, không thể sống ở quê) là 2 MẶT MÂU THUẪN trong cùng một người.\n\n「そんな欲求がある。【4】、東京生まれの自分が田舎に住めるはずはない」→ đối chiếu 2 khía cạnh mâu thuẫn trong cùng 1 người → chọn ② その一方で\n→ その一方で = 'mặt khác' — khớp chủ đề 'mâu thuẫn 2 ham muốn' của cả đoạn\n\nchỗ này là bẫy\n\n✗ その上で = 'trên cơ sở đó' — sai nghĩa\n\n✗ それはさておき = 'tạm gác sang bên' — sai, câu sau vẫn tiếp tục bàn cùng chủ đề\n\n✗ それにもまして = 'hơn thế nữa' (tăng tiến) — sai, đây là đối lập chứ không phải tăng tiến","sentence":"【4】、東京生まれの自分が田舎に住めるはずはない。"},{"label":"5","o":["ありがちな","ありようがない","ありかねない","ありもしない"],"a":4,"hint":"Dạng câu hỏi: Phủ định sự tồn tại (ありもしない)\n\nQuan hệ A-B: A (những thứ VỐN DĨ KHÔNG TỒN TẠI — ảo tưởng) là điều B (tác giả) khuyên nên ngừng đuổi theo, để quay về thực tại bản thân.\n\n「【5】ものを追いかけることは止めて、いまある自分に目を向ける」→ nhấn mạnh phủ định sự tồn tại → chọn ④ ありもしない\n→ ありもしない = 'vốn dĩ không hề tồn tại' — khớp mạch 'ngừng chạy theo ảo tưởng, quay về thực tại'\n\nchỗ này là bẫy\n\n✗ ありがちな = 'thường có, hay gặp' — sai nghĩa hoàn toàn\n\n✗ ありようがない = 'không có cách nào tồn tại được' (nói về phương thức) — sai sắc thái\n\n✗ ありかねない = 'có thể xảy ra (điều không hay)' — sai nghĩa hoàn toàn","sentence":"【5】ものを追いかけることは止めて、いまある自分に目を向ける。"}]}]},{"id":"r24","name":"第24回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"いかに後悔（　）、時間を前に戻すことはできない。","o":["したら","しようが","せんがため","せずとも"],"a":2,"vi":"Dù có hối hận đến đâu cũng không thể quay ngược thời gian.","hint":"Thấy「いかに後悔＿＿時間は戻らない」→ chọン しようが\n✔ いかに＋V意向形＋が =「dù có...đến mấy đi nữa」(cố định: いかに〜しようが)"},{"q":"自分より若い人たちが真剣に働く姿を見て、自分の甘さを痛感（　）。","o":["させた","された","させられた","してみせた"],"a":3,"vi":"Nhìn những người trẻ hơn mình làm việc nghiêm túc, tôi đã thấm thía sự thiếu cố gắng của bản thân.","hint":"Thấy「自分の甘さを痛感＿＿」→ chọン させられた\n✔ V使役受身「させられる」=「bị (tình huống) khiến phải nhận ra」\n✘ させた = mình chủ động làm người khác"},{"q":"彼の態度を見れば、この企画に興味がないことは、（　）わかる。","o":["聞かずとも","聞くともなしに","聞かんばかりに","聞くべくもなく"],"a":1,"vi":"Chỉ cần nhìn thái độ của anh ấy là biết ngay anh ấy không hứng thú với dự án này, chẳng cần phải hỏi.","hint":"Thấy「態度を見れば＿＿わかる」→ chọン 聞かずとも\n✔ V否定ず＋とも =「dù không (hỏi) cũng (đã rõ)」\n✘ 聞くともなしに = nghe mà không chủ ý"},{"q":"向こうのミスにもかかわらず、あたかもこちらが間違えた（　）非難された。","o":["が早いか","かのごとく","ならまだしも","ではあるまいし"],"a":2,"vi":"Dù lỗi là của bên kia, họ vẫn bị chỉ trích như thể chính họ đã sai vậy.","hint":"Thấy「あたかもこちらが間違えた＿＿非難された」→ chọン かのごとく\n✔ あたかも〜かのごとく = cụm cố định「như thể là...vậy」(văn viết)"},{"q":"当社の企業理念を理解し、それに（　）行動がとれる人材を募集します。","o":["際した","即した","先駆けた","かこつけた"],"a":2,"vi":"Chúng tôi tuyển nhân tài hiểu được triết lý kinh doanh và hành động phù hợp với điều đó.","hint":"Thấy「それに＿＿行動がとれる人材」→ chọン 即した\n✔ N＋に即した＋N =「phù hợp/bám sát theo...」\n✘ 際した = vào dịp/lúc (thời điểm)"},{"q":"この店の弁当は、量（　）質（　）、文句のつけどころがない。","o":["だの／だの","なり／なり","やら／やら","といい／といい"],"a":4,"vi":"Cơm hộp ở tiệm này cả về lượng lẫn chất đều không chê vào đâu được.","hint":"Thấy「量＿＿質＿＿文句のつけどころがない」→ chọン といい〜といい\n✔ N1といいN2といい =「cả N1 lẫn N2 đều...」(liệt kê toàn diện)"},{"q":"鉄道マニアの彼は、めずらしい列車が見られる（　）どこへでも出かけていく。","o":["が最後","とあれば","といえど","と思いきや"],"a":2,"vi":"Người đam mê tàu hỏa đó hễ có cơ hội xem chuyến tàu hiếm là đi bất cứ đâu.","hint":"Thấy「めずらしい列車が見られる＿＿どこへでも」→ chọン とあれば\n✔ S/N＋とあれば =「nếu là (điều kiện đó) thì」(sẵn sàng làm bất cứ gì)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"有名大学の入学試験 ___ ___ ★ ___ なかった。","o":["多さ","受験者の","といったら","だけあって"],"a":1,"order":[4,2,1,3],"vi_p2":"Đây là kỳ thi vào đại học danh tiếng nên số lượng thí sinh không thể nói được là bao nhiêu."},{"q":"お金をもらって ___ ___ ★ ___ 文句を言わずにやるべきだ。","o":["何であれ","仕事が","からには","働く"],"a":2,"order":[4,3,2,1],"vi_p2":"Đã nhận tiền thì dù là việc gì cũng phải làm, không được than phiền."},{"q":"もはや優勝は ___ ___ ★ ___ 10位以内には入りたい。","o":["べくも","せめて","望む","ないが"],"a":4,"order":[3,1,4,2],"vi_p2":"Vô địch thì không thể rồi, nhưng ít nhất cũng muốn vào top 10."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"「天才」を辞書でひくと、「天性の才能」とあります。「天性」というのが、「生まれつき備わった」とか「天から与えられた」というような意味であることは、皆さんご存知でしょう。\nこの「天才」の原義【1】、私は皆さんに問いかけたいと思います。\n本当に、「天才」とは、「生まれつき備わった才能」を指す言葉なのでしょうか。\n多くの人は、「天才」と聞くと、モーツァルトやエジソン、アインシュタインなどの名を挙げるのではないかと思います。もっと最近の例でいうと、例えば、米国の有名なコンピューター会社の創業者は、現代において、天才の名【2】人物の一人だと言えるでしょう。彼は、20歳のときに自宅のガレージで現在のパソコンの基礎ともいえるものを作り上げ（実際に設計をしたのは別の人物ですが）、その後、20代の若さで世界でもトップクラスの億万長者になりました。彼の名を挙げると、たぶんほとんどの人が「彼は天才だ。普通の人とは違う」と言うに違いありません。\nでも、【3】。\nたしかに、彼に「優れた能力がある」ことは事実かもしれませんが、それが「生まれつき備わっていたかどうか」は、【4】のではありませんか。また、仮に小さい頃、人よりも秀でた能力を持っていたとしても、自分自身の後天的な努力なしにその能力を何十年も維持できるわけがないではありませんか。\nつまり、「天才」という言葉は、時として、「どうせ生まれつきの差なのだから仕方ない」とか、「彼らの才能【5】、自分なんて……」などというあきらめの言葉になり得るのではないか、と私は思うのです。","items":[{"label":"1","o":["とあって","と相まって","をおいて","を踏まえて"],"a":4,"hint":"Dạng câu hỏi: Nền tảng lập luận (を踏まえて)\n\nQuan hệ A-B: A (nghĩa gốc của từ 'thiên tài') là CƠ SỞ để B (tác giả) đặt câu hỏi/vấn đề tiếp theo cho độc giả.\n\n「この『天才』の原義【1】、私は皆さんに問いかけたいと思います」→ lấy định nghĩa gốc làm nền tảng → chọn ④ を踏まえて\n→ を踏まえて = 'dựa trên cơ sở của...'\n\nchỗ này là bẫy\n\n✗ とあって = 'vì là (tình huống đặc biệt)' — sai nghĩa\n\n✗ と相まって = 'kết hợp với' — sai nghĩa\n\n✗ をおいて (Nをおいて他にない) = sai cấu trúc/nghĩa ở đây","sentence":"この「天才」の原義【1】、私は皆さんに問いかけたいと思います。"},{"label":"2","o":["にとどまらない","にあるまじき","を前提としている","をほしいままにしている"],"a":4,"hint":"Dạng câu hỏi: Thành ngữ mang danh trọn vẹn (~をほしいままにしている)\n\nQuan hệ A-B: A (người sáng lập công ty máy tính) là một trong những người B ĐƯỢC/MANG DANH THIÊN TÀI một cách trọn vẹn — thành ngữ, không phải quan hệ nhân quả.\n\n「天才の名【2】人物の一人だと言えるでしょう」→ thành ngữ 'mang danh trọn vẹn' → chọn ④ をほしいままにしている\n→ Nをほしいままにする = 'tha hồ có được N' (thành ngữ, dùng cho danh tiếng/quyền lực)\n\nchỗ này là bẫy\n\n✗ にとどまらない = cần vế N khác đi kèm để so sánh mở rộng — sai cấu trúc ở đây\n\n✗ にあるまじき = mang nghĩa phê phán mạnh 'không xứng với' — sai nghĩa (đây là khen, không phải phê phán)\n\n✗ を前提としている = 'lấy...làm tiền đề' — sai nghĩa","sentence":"もっと最近の例でいうと、例えば、米国の有名なコンピューター会社の創業者は、現代において、天才の名【2】人物の一人だと言えるでしょう。"},{"label":"3","o":["考えてもみてください","考えたらどうですか","考えようとしてください","考えないものだろうか"],"a":1,"hint":"Dạng câu hỏi: Mời gọi suy ngẫm (chuyển sang phản biện)\n\nQuan hệ A-B: Không phải quan hệ A-B mà là cách chuyển ý: từ A (mọi người đều đồng ý anh ta là thiên tài) sang B (mời độc giả thử nghĩ lại) trong văn nghị luận.\n\n「でも、【3】」(chuyển sang lập luận phản biện) → chọn ① 考えてもみてください\n→ 考えてもみてください = 'xin hãy thử nghĩ xem' (mẫu quen thuộc mời độc giả suy ngẫm trong văn nghị luận)\n\nchỗ này là bẫy\n\n✗ 考えたらどうですか = 'sao không thử nghĩ xem' — sai sắc thái, giống lời khuyên cá nhân hơn văn nghị luận\n\n✗ 考えようとしてください = không tự nhiên về ngữ pháp\n\n✗ 考えないものだろうか = sai sắc thái/cấu trúc trong ngữ cảnh mời gọi này","sentence":"でも、【3】。"},{"label":"4","o":["確かめずにすむ","確かめやしない","確かめようがない","確かめないまでもない"],"a":3,"hint":"Dạng câu hỏi: Bất khả thi về phương pháp (~ようがない)\n\nQuan hệ A-B: A (việc có bẩm sinh sẵn có hay không) là điều B KHÔNG CÓ CÁCH NÀO xác minh được — bất khả thi phương pháp, không phải nhân quả.\n\n「それが『生まれつき備わっていたかどうか』は、【4】のではありませんか」→ bất khả thi về phương pháp → chọn ③ 確かめようがない\n→ Vようがない = 'không có cách nào để...'\n\nchỗ này là bẫy\n\n✗ 確かめずにすむ = 'không cần xác minh cũng ổn' — sai nghĩa hoàn toàn\n\n✗ 確かめやしない = 'chẳng thèm xác minh' (chủ động không làm, khẩu ngữ) — sai sắc thái (đây là KHÔNG THỂ, không phải không muốn)\n\n✗ 確かめないまでもない = phủ định kép rối, không khớp nghĩa cần thiết","sentence":"たしかに、彼に「優れた能力がある」ことは事実かもしれませんが、それが「生まれつき備わっていたかどうか」は、【4】のではありませんか。"},{"label":"5","o":["にして","によらず","にひきかえ","にもまして"],"a":3,"hint":"Dạng câu hỏi: Tương phản đảo ngược (にひきかえ)\n\nQuan hệ A-B: A (tài năng của họ) và B (bản thân mình) được ĐỐI CHIẾU TƯƠNG PHẢN đảo ngược — にひきかえ so sánh 2 đối tượng ngược chiều.\n\n「彼らの才能【5】、自分なんて……』などというあきらめの言葉」→ so sánh tương phản đảo ngược → chọn ③ にひきかえ\n→ にひきかえ = 'trái ngược lại với, so với...thì ngược lại'\n\nchỗ này là bẫy\n\n✗ にして = 'vào lúc/tính ra là' — sai nghĩa ở đây\n\n✗ によらず = 'không phân biệt/bất kể' — sai nghĩa\n\n✗ にもまして = so sánh tăng tiến CÙNG CHIỀU — sai sắc thái (đây cần đảo ngược, không phải tăng tiến)","sentence":"つまり、「天才」という言葉は、時として、「どうせ生まれつきの差なのだから仕方ない」とか、「彼らの才能【5】、自分なんて……」などというあきらめの言葉になり得るのではないか、と私は思うのです。"}]}]},{"id":"r25","name":"第25回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"病気になった（　）会社を休んで遊びに行った。","o":["つもりで","かのごとき","ことにして","ことだから"],"a":3,"vi":"Anh ấy giả vờ bị bệnh để nghỉ làm đi chơi.","hint":"Thấy「病気になった＿＿休んで遊びに行った」→ chọン ことにして\n✔ V辞書形/た形の＋ことにして =「giả vờ/coi như là...」(thực tế khác với vỏ bọc)"},{"q":"この小説は面白味に欠ける。発想からして平凡（　）。","o":["至りだ","極みだ","極まりない","じゃあるまい"],"a":3,"vi":"Cuốn tiểu thuyết này thiếu sự thú vị. Ngay từ ý tưởng đã thấy tầm thường.","hint":"Thấy「発想からして平凡＿＿」→ chọン 極まりない\n✔ な形語幹＋極まりない =「cực kỳ...」(cố định: 平凡極まりない, 失礼極まりない)"},{"q":"行かないと文句を言われるし、行ったら（　）責められるし、どうすればいいんだ。","o":["行くやら","行ったで","行ったり","行っては"],"a":2,"vi":"Không đi thì bị trách, mà đi rồi cũng bị trách, biết phải làm sao đây.","hint":"Thấy「行ったら＿＿責められる」→ chọン 行ったで\n✔ Vた形＋で（口語） =「dù đã...thì cũng (vẫn bị)」(khẩu ngữ tương đương 〜ても)"},{"q":"大人たちの話を聞いて、この子たちも子ども（　）状況を理解したようだ。","o":["まま","手前","並みに","ながらに"],"a":4,"vi":"Nghe người lớn nói chuyện, bọn trẻ cũng đã hiểu phần nào tình hình theo cách của trẻ con.","hint":"Thấy「子ども＿＿状況を理解した」→ chọン ながらに\n✔ N＋ながらに =「vẫn giữ nguyên trạng thái là...」(cố định: 子どもながらに、生まれながらに)"},{"q":"反対するならする（　）、ちゃんとした理由を言ってほしい。","o":["なりに","ものの","そばから","かたがた"],"a":1,"vi":"Nếu đã phản đối thì cứ phản đối, nhưng hãy nói lý do cho đàng hoàng.","hint":"Thấy「反対するならする＿＿理由を言って」→ chọン なりに\n✔ V/N＋なりに =「nếu đã...thì hãy làm theo cách phù hợp」\n✘ ものの = tuy...nhưng (nhượng bộ)"},{"q":"海外とは（　）、春休みはどこか旅行に行きたい。","o":["言うばかりか","言わないまでも","言うことなしに","言わないほどに"],"a":2,"vi":"Tuy không hẳn là đi nước ngoài, nhưng tôi muốn đi du lịch đâu đó vào kỳ nghỉ xuân.","hint":"Thấy「海外とは＿＿旅行に行きたい」→ chọン 言わないまでも\n✔ 〜ないまでも =「tuy không đến mức...nhưng (ít nhất)」(giảm nhẹ yêu cầu)"},{"q":"けがは軽症で、入院する（　）ということだ。","o":["に至らない","に限らない","に足りない","には及ばない"],"a":4,"vi":"Vết thương nhẹ nên không đến mức phải nhập viện.","hint":"Thấy「入院する＿＿ということだ」→ chọン に至らない\n✔ V辞書形＋に至らない =「không đến mức (phải)...」(chưa tới mức nghiêm trọng)\n✘ に足りない = không đáng để (giá trị/tư cách)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"私有地 ___ ___ ★ ___ 。","o":["べからず","につき","立ち入る","断りなく"],"a":3,"order":[2,4,3,1],"vi_p2":"Đất tư nhân, cấm vào nếu không có phép."},{"q":"せっかく買ったのに、買った ___ ___ ★ ___ ったらない。","o":["なんて","きり","使わない","もったいない"],"a":1,"order":[2,3,1,4],"vi_p2":"Mua về rồi để đó chẳng dùng gì thì lãng phí quá."},{"q":"お忙しい ___ ___ ★ ___ までいただき、恐縮です。","o":["お土産","ところを","ばかりか","訪ねてくださった"],"a":3,"order":[2,4,3,1],"vi_p2":"Dù đang bận, anh/chị vẫn đến thăm rồi còn mang quà, thật không biết nói gì cho xứng."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"私たちのような外国人にとって、アフリカで自家用車は必需品だ。公共輸送機関が発達していないから、自分の車で動きまわるしかないのである。\nナイロビには路線バスが【1】あるのだが、本数が少ないうえに時間が不正確で、まったくあてにならない。そのため庶民は「マタツ」という乗合タクシーを利用している。日本製のマイクロバスだが、14人乗りの【2】32,3人は詰め込んで走る。助手席には4人、最後部シートには6,7人が折り重なり、天井につかえた首を横に曲げたままの立ち乗り客もいる。\n運転手の収入が歩合制なので、彼らは飛ばし【3】飛ばす。車の列が渋滞してくると、マタツは突如、反対車線を走り出す。向こうからトラックが【4-a】がバスが【4-b】が、ぎりぎりですれ違いながら走る。乗客は運を天に任せ、目をつぶっている。もちろんマタツ事故は多く、そのたびに大勢の死傷者が出る。とても日常的な交通手段にする気にはなれない。というわけで車が必要になる。\n【5】も1台では不便だ。私が仕事で車を使ってしまうと、家族は買い物や学校に行くための足がなくなる。歩いて買い物に行けるような便利さはないから、どうしても2台が必要だ。そしてとにかく、毎日よく走る。1台が1年で2万キロぐらい走ってしまう。\n（松本仁一著『アフリカを食べる/アフリカで寝る』朝日新聞出版刊）","items":[{"label":"1","o":["あることは","あることも","ないことは","ないことも"],"a":1,"hint":"Dạng câu hỏi: Phủ định kép nhượng bộ (~ないことは(ない))\n\nQuan hệ A-B: A (Nairobi có xe buýt tuyến cố định — nhưng không đáng kể) và B (số chuyến ít, không đúng giờ) — ないことはない thừa nhận A có nhưng CHẤT LƯỢNG KÉM.\n\n「ナイロビには路線バスが【1】あるのだが、本数が少ないうえに…あてにならない」→ phủ định kép nhượng bộ → chọn ③ ないことは\n→ ないことは(ない) = 'không phải là không có' (có nhưng hàm ý không đáng kể) — khớp mạch 'có nhưng chất lượng kém' tiếp theo\n\nchỗ này là bẫy\n\n✗ あることは/あることも = khẳng định trực tiếp — không tạo được sắc thái nhượng bộ dè dặt trước khi chê\n\n✗ ないことも (thiếu ない cuối để hoàn thành ないことはない) = không hoàn chỉnh cấu trúc","sentence":"ナイロビには路線バスが【1】あるのだが、本数が少ないうえに時間が不正確で、まったくあてにならない。"},{"label":"2","o":["ときに","もとに","場面に","ところに"],"a":4,"hint":"Dạng câu hỏi: Mẫu cố định chênh lệch sức chứa (Nのところに)\n\nQuan hệ A-B: A (sức chứa quy định: 14 người) và B (thực tế nhồi nhét: 32-33 người) được nối bằng ところに để NHẤN MẠNH CHÊNH LỆCH giữa quy định và thực tế.\n\n「日本製のマイクロバスだが、14人乗りの【2】32,3人は詰め込んで走る」→ mẫu cố định 'vào chỗ vốn nhỏ mà nhồi nhét' → chọn ④ ところに\n→ Nのところに〜詰め込む = nhấn mạnh chênh lệch giữa sức chứa quy định và thực tế\n\nchỗ này là bẫy\n\n✗ ときに/もとに/場面に = sai nghĩa/cấu trúc, không tạo được sắc thái 'chỗ vốn dành cho ít người'","sentence":"日本製のマイクロバスだが、14人乗りの【2】32,3人は詰め込んで走る。"},{"label":"3","o":["て","に","や","つつ"],"a":2,"hint":"Dạng câu hỏi: Lặp động từ nhấn mạnh cường độ (Vて+V)\n\nQuan hệ A-B: A và B là CÙNG MỘT ĐỘNG TỪ (飛ばす) lặp lại nối bằng て để nhấn mạnh cường độ/liên tục của hành động chạy ẩu.\n\n「運転手の収入が歩合制なので、彼らは飛ばし【3】飛ばす」→ lặp động từ nhấn mạnh cường độ → chọn ① て\n→ 飛ばして飛ばす = 'cứ phóng rồi lại phóng' (lặp động từ nối bằng て để nhấn cường độ/liên tục, giống 泣いて泣いて)\n\nchỗ này là bẫy\n\n✗ に = cần điều kiện đặc biệt khác (mẫu 待ちに待った dùng thể ます+に, không khớp cấu trúc câu này)\n\n✗ や/つつ = sai nghĩa hoàn toàn, không liên quan","sentence":"運転手の収入が歩合制なので、彼らは飛ばし【3】飛ばす。"},{"label":"4","o":["a 来た／b 来た","a 来よう／b 来よう","a 来よう／b 来るまい","a 来るだろう／b 来ないだろう"],"a":2,"hint":"Dạng câu hỏi: Nhượng bộ đôi (~ようが~まいが)\n\nQuan hệ A-B: A (xe tải có đến) và B (xe buýt có đến) đều ở dạng NHƯỢNG BỘ ĐÔI 'dù có hay không có' (来ようが来るまいが), không phân biệt kết quả.\n\n「向こうからトラックが【4-a】がバスが【4-b】が、ぎりぎりですれ違いながら走る」→ mẫu Vようが Vまいが (dù có...hay không) → chọn ③ 来よう/来るまい\n→ 来ようが来るまいが = 'dù có đến hay không đến' — nhượng bộ đôi\n\nchỗ này là bẫy\n\n✗ 来た/来た = cùng thì quá khứ, không tạo được cặp đối lập 'có/không'\n\n✗ 来よう/来よう = cả 2 đều ý chí khẳng định, thiếu phủ định để tạo tương phản\n\n✗ 来るだろう/来ないだろう = gần đúng nghĩa nhưng SAI CẤU TRÚC (cần dạng ý chí+まい, không phải だろう/ないだろう)","sentence":"向こうからトラックが【4-a】がバスが【4-b】が、ぎりぎりですれ違いながら走る。"},{"label":"5","o":["あの車","その車","どの車","なんの車"],"a":2,"hint":"Dạng câu hỏi: Từ chỉ thị (指示語): その\n\nQuan hệ A-B: A (chiếc xe vừa được nhắc ở câu ngay trước) là THÔNG TIN MỚI → B phải dùng その theo quy tắc こそあど, không phải quan hệ nhân quả.\n\n「【5】も1台では不便だ」→ vật vừa nhắc ở câu trước, thông tin mới → chọn ② その車\n→ その車 = quy tắc こそあど: thông tin MỚI vừa nhắc ở câu ngay trước → dùng その (không phải あの vì chưa phải 'chuyện cũ')\n\nchỗ này là bẫy\n\n✗ あの車 = 'đã biết từ trước/xa' — sai vì đây là thông tin MỚI vừa nhắc\n\n✗ どの車 = nghi vấn — sai hoàn toàn, câu này không phải câu hỏi\n\n✗ なんの車 = sai ngữ pháp trong ngữ cảnh này\n\n📌 Dạng câu hỏi 指示語 theo đúng [[Quy tắc chọn từ chỉ thị こそあど theo thời gian và khoảng cách thông tin]].","sentence":"【5】も1台では不便だ。"}]}]},{"id":"r26","name":"第26回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"ときどき宝くじを買っているが、残念ながら当たった（　）。","o":["ためしがない","はずがない","までもない","に至らない"],"a":1,"vi":"Thỉnh thoảng vẫn mua vé số nhưng tiếc là chưa từng trúng lần nào.","hint":"Thấy「当たった＿＿」→ chọン ためしがない\n✔ Vた形＋ためしがない =「chưa từng có lần...」(kinh nghiệm tuyệt đối chưa có)\n✘ はずがない = không thể nào (logic phủ định)"},{"q":"国の料理を（　）、日本ではなかなか材料が手に入らない。","o":["作るべく","作ってこそ","作ろうにも","作らんがため"],"a":3,"vi":"Dù muốn nấu món ăn quê hương, cũng khó tìm được nguyên liệu ở Nhật.","hint":"Thấy「作ろう＿＿材料が手に入らない」→ chọン にも\n✔ V意向形＋にも＋Vない =「dù muốn...cũng không thể」(ý muốn nhưng hoàn cảnh cản trở)"},{"q":"コンビニは、日曜（　）年末年始（　）買い物ができて便利だ。","o":["だの／だの","といい／といい","やら／やら","であろうと／であろうと"],"a":4,"vi":"Cửa hàng tiện lợi rất tiện vì dù chủ nhật hay dịp Tết cũng đều mua sắm được.","hint":"Thấy「日曜＿＿年末年始＿＿買い物できる」→ chọン であろうと〜であろうと\n✔ N1であろうとN2であろうと =「dù là N1 hay N2...」(bất kể điều kiện nào)"},{"q":"試作品は改良に改良（　）、ついに実用化にこぎつけた。","o":["を兼ね","を重ね","にたえ","に先駆け"],"a":2,"vi":"Sản phẩm thử nghiệm đã được cải tiến hết lần này đến lần khác, cuối cùng cũng được đưa vào sản xuất thực tế.","hint":"Thấy「改良に改良＿＿実用化」→ chọン を重ね\n✔ N（動作）にN＋を重ねる =「lặp đi lặp lại (nỗ lực)」(cố định: 改良に改良を重ねる)"},{"q":"薦められた本を読む（　）読んだが、よく理解できなかった。","o":["こそ","なり","には","まで"],"a":3,"vi":"Cuốn sách được giới thiệu thì có đọc, nhưng vẫn chưa hiểu rõ lắm.","hint":"Thấy「薦められた本を読む＿＿読んだが」→ chọン こそ\n✔ 〜こそ〜が =「có...là có đấy nhưng (vẫn có vấn đề)」(thừa nhận có làm nhưng không đủ)"},{"q":"私（　）こんな簡単な漢字を忘れてしまうなんて……。","o":["ともなると","としても","というもの","としたことが"],"a":4,"vi":"Một người như tôi mà lại quên cả chữ Hán đơn giản thế này…","hint":"Thấy「私＿＿こんな漢字を忘れるなんて」→ chọン としたことが\n✔ N（高地位/kỳ vọng cao）＋としたことが =「một người như...mà lại」(tự trách/ngạc nhiên về bản thân)"},{"q":"そんなに言うなら、信じる（　）証拠を見せてくれ。","o":["にたる","にわたる","にたえない","にやまない"],"a":1,"vi":"Nếu nói chắc vậy thì hãy đưa bằng chứng đáng tin cho tôi xem.","hint":"Thấy「信じる＿＿証拠を見せて」→ chọン にたる\n✔ V辞書形＋にたる＋N =「(bằng chứng) đáng để tin」(có đủ tư cách/giá trị)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"この監督はこれまで ___ ___ ★ ___ 心に残る映画を製作してきた。","o":["こそ","ものの","とらなかった","賞"],"a":3,"order":[4,1,3,2],"vi_p2":"Đạo diễn này dù chưa từng đoạt giải nhưng những bộ phim để lại đều đọng lại trong lòng người xem."},{"q":"まだ全員そろっていませんが、___ ___ ★ ___ 、会議を始めましょう。","o":["だし","こと","過ぎている","時間も"],"a":2,"order":[4,3,2,1],"vi_p2":"Đã muộn giờ rồi, thôi bắt đầu họp đi dù chưa đủ mặt."},{"q":"従業員の幸せを願う ___ ___ ★ ___ のことだろう。","o":["経営者","のは","当然","たる者"],"a":4,"order":[2,1,4,3],"vi_p2":"Mong muốn hạnh phúc cho nhân viên là điều đương nhiên của một người làm lãnh đạo."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"夢【1】、見るのが当然なのだそうだ。それが正常。夢も見ないでぐっすり眠ったという人も、めざめた時に忘れているだけで、やはり見ているのだという。\nもっとも、眠れればのことだが……。\nその青年は、その夜、なぜか寝つきが悪かった。ベッドの上で何度も寝がえりをくりかえすが、いっこうに【2】。なぜだろう。あれこれ考えてみるが、【3】原因が思い当らない。彼は独身の、平凡な会社員だった。健康も、まあまあ。\nなにか会社で失敗をやっただろうか。きょう一日をふりかえってみたが、べつになかった。(中略)自分はなにか不快な心境にあるのだろうか。しかし、それもなかった。新聞にはいろいろな事件がのっている。これは許せない。さあ腹を立てろという調子の文章だが、それは毎度のことで、なれっこになっている。また事実、このところさして刺激的な事件はなかった。不快さはない。\n健康上で気になることもない。老後の設計の心配など、まだ先の先の話だ。(中略)\nなにもなしだ。となると、気候のせいかもしれなかった。夕方ごろから、急に暑くなりはじめた。【4】、冷房を入れるほどでもない。中途はんぱな暑苦しさ。彼は毛布をかけたり、はずしたりした。\nむりに眠ろうとするからいけないんだ。そう考えてもみた。あす、特に重要な仕事があるわけでもない。たまには遅刻したって、どうという【5】。それでいいんだ……。\n（星新一著『重なった情景』角川文庫刊『ごたごた気流』所収　※一部省略あり）","items":[{"label":"1","o":["ときたら","といえども","というものは","というからには"],"a":3,"hint":"Dạng câu hỏi: Khái quát hóa khái niệm (~というものは)\n\nQuan hệ A-B: Không phải quan hệ A-B cụ thể mà là mở đầu ĐỊNH NGHĨA KHÁI QUÁT về khái niệm 'giấc mơ' nói chung.\n\n「夢【1】、見るのが当然なのだそうだ」→ mở đầu định nghĩa/nhận định tổng quát → chọn ③ というものは\n→ というものは = 'nói chung về...' (khái quát hóa 1 khái niệm, văn viết)\n\nchỗ này là bẫy\n\n✗ ときたら = thường mang sắc thái than phiền về ai/cái gì cụ thể — sai sắc thái ở văn cảnh khái quát trung tính\n\n✗ といえども = nhượng bộ — sai nghĩa\n\n✗ というからには = 'đã là...thì (phải)' (nghĩa vụ) — sai nghĩa","sentence":"夢【1】、見るのが当然なのだそうだ。"},{"label":"2","o":["眠りたくない","眠くならない","眠りようがない","眠れないものだ"],"a":2,"hint":"Dạng câu hỏi: Cảm thán về thực trạng khách quan (~ものだ)\n\nQuan hệ A-B: A (trở mình nhiều lần trên giường) không giúp đạt B (ngủ được) — ものだ nhấn cảm thán về thực trạng khách quan không như ý.\n\n「何度も寝がえりをくりかえすが、いっこうに【2】」→ cảm thán về thực trạng khách quan → chọn ④ 眠れないものだ\n→ 眠れないものだ = 'quả thực là không ngủ được' (ものだ nhấn cảm thán)\n\nchỗ này là bẫy\n\n✗ 眠りたくない = 'không muốn ngủ' (ý chí chủ động) — sai, đây là không THỂ chứ không phải không MUỐN\n\n✗ 眠くならない = gần nghĩa nhưng không hợp collocation với ものだ bằng 眠れない (khả năng)\n\n✗ 眠りようがない = khá gần nghĩa nhưng ngữ pháp よう+がない thường đi với động từ khác, kém tự nhiên hơn trong văn kể chuyện này","sentence":"ベッドの上で何度も寝がえりをくりかえすが、いっこうに【2】。"},{"label":"3","o":["これといって","それとなく","これにしたって","それにもまして"],"a":1,"hint":"Dạng câu hỏi: Thành ngữ phủ định cụ thể (これといって~ない)\n\nQuan hệ A-B: A (thử nghĩ đủ điều) không tìm ra B (nguyên nhân CỤ THỂ, ĐẶC BIỆT nào) — これといって luôn đi kèm phủ định.\n\n「あれこれ考えてみるが、【3】原因が思い当らない」→ thành ngữ cố định + phủ định → chọn ① これといって\n→ これといって〜ない = 'không có gì đặc biệt/cụ thể là...' (luôn đi kèm phủ định)\n\nchỗ này là bẫy\n\n✗ それとなく = 'một cách kín đáo' — sai nghĩa hoàn toàn\n\n✗ これにしたって = 'dù là cái này đi nữa' — sai nghĩa/cấu trúc\n\n✗ それにもまして = 'hơn thế nữa' — sai nghĩa","sentence":"あれこれ考えてみるが、【3】原因が思い当らない。"},{"label":"4","o":["それゆえ","それどころか","というか","といって"],"a":4,"hint":"Dạng câu hỏi: Giảm nhẹ mức độ câu trước (~といって~ほどでもない)\n\nQuan hệ A-B: A (trời nóng lên đột ngột) được B GIẢM NHẹ MỨC ĐỘ: chưa đến mức phải bật điều hòa — といって nối 2 câu để hạ tông.\n\n「急に暑くなりはじめた。【4】、冷房を入れるほどでもない」→ giảm nhẹ mức độ câu trước → chọn ④ といって\n→ 〜。といって、〜ほどでもない = 'tuy nói là... (nhưng) cũng chưa đến mức...'\n\nchỗ này là bẫy\n\n✗ それゆえ = 'do đó' (nhân quả thuận) — sai hướng nghĩa\n\n✗ それどころか = 'chứ đừng nói...mà còn ngược lại' (đảo chiều MẠNH) — sai, câu sau chỉ giảm nhẹ chứ không đảo chiều hoàn toàn\n\n✗ というか = 'hay nói cách khác' (điều chỉnh trong CÙNG 1 câu) — sai vị trí ngữ pháp khi nối 2 câu riêng biệt","sentence":"【4】、冷房を入れるほどでもない。"},{"label":"5","o":["ことである","ものである","こともない","ものもない"],"a":3,"hint":"Dạng câu hỏi: Thành ngữ 'không sao cả' (どうということもない)\n\nQuan hệ A-B: A (thỉnh thoảng đi trễ) được B đánh giá là 'chẳng có gì to tát' — thành ngữ cố định, không phải quan hệ nhân quả.\n\n「たまには遅刻したって、どうという【5】」→ thành ngữ cố định → chọn ③ こともない\n→ どうということもない = 'chẳng có gì to tát, không sao cả' (thành ngữ cố định)\n\nchỗ này là bẫy\n\n✗ ことである/ものである = khẳng định trực tiếp — sai, cần phủ định của thành ngữ\n\n✗ ものもない = sai từ (thành ngữ chuẩn dùng こと, không phải もの trong cụm này)","sentence":"たまには遅刻したって、どうという【5】。"}]}]},{"id":"r27","name":"第27回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"人の金を盗むとは、警察官（　）行為だ。","o":["たる","ともあろう","にあるまじき","でありながらの"],"a":3,"vi":"Ăn cắp tiền của người khác là hành vi không xứng đáng với một cảnh sát.","hint":"Thấy「警察官＿＿行為だ」→ chọン にあるまじき\n✔ N＋にあるまじき＋N =「không xứng với tư cách là...」(cố định phê phán địa vị)\n✘ たる = N+たる+N cũng dùng cho địa vị nhưng nghĩa trung tính/tích cực"},{"q":"社員同士の懇親（　）一泊二日の研修旅行を実施します。","o":["を機に","とともに","を兼ねて","を踏まえて"],"a":3,"vi":"Chúng tôi sẽ tổ chức chuyến du lịch nghỉ dưỡng 2 ngày 1 đêm, kết hợp luôn việc giao lưu giữa nhân viên.","hint":"Thấy「懇親＿＿研修旅行を実施」→ chọン を兼ねて\n✔ N＋を兼ねて =「kết hợp luôn mục đích...」\n✘ を機に = nhân dịp (không nhất thiết cùng lúc)"},{"q":"当社の最新技術（　）すれば、このぐらいのものは簡単に製作できます。","o":["にして","にあって","をおいて","をもって"],"a":4,"vi":"Với công nghệ tiên tiến nhất của công ty, việc sản xuất cái này khá đơn giản.","hint":"Thấy「最新技術＿＿すれば製作できる」→ chọン をもって\n✔ N＋をもってすれば =「với (năng lực/công nghệ)...thì」(cố định nhấn mạnh phương tiện)"},{"q":"この器は飾っておいたりしないでください。（　）価値があるんですから。","o":["使ってこそ","使ってすら","使わずして","使わずとも"],"a":1,"vi":"Xin đừng chỉ trưng bày món đồ này. Vì chính nhờ sử dụng nó mới có giá trị.","hint":"Thấy「使って＿＿価値がある」→ chọン こそ\n✔ Vて形＋こそ =「chính nhờ...mới (có giá trị)」(nhấn mạnh điều kiện cốt lõi)"},{"q":"その政治家の無責任な発言には、憤りを（　）。","o":["至らない","禁じ得ない","願ってやまない","ものともしない"],"a":2,"vi":"Phát ngôn vô trách nhiệm của vị chính trị gia đó khiến người ta không khỏi phẫn nộ.","hint":"Thấy「憤りを＿＿」→ chọン 禁じ得ない\n✔ 感情N＋を禁じ得ない =「không kìm được (phẫn nộ/xúc động)」(cố định: 憤り・涙・笑い)"},{"q":"他の人が参加を（　）、私は絶対に行きます。","o":["やめようがやめまいが","やめようかやめるまいか","やめるやらやめないやら","やめるだのやめないだの"],"a":1,"vi":"Dù người khác có tham gia hay không, tôi chắc chắn sẽ đi.","hint":"Thấy「参加を＿＿私は絶対に行く」→ chọン やめようがやめまいが\n✔ V意向形＋が〜まいが =「dù có...hay không」(hành động của người khác không ảnh hưởng)"},{"q":"この祭りは、地域住民（　）、全国から参加者が集まる大イベントとなった。","o":["からある","はおろか","はもとより","ならまだしも"],"a":3,"vi":"Lễ hội này đã trở thành sự kiện lớn thu hút người tham gia từ khắp cả nước, chứ không chỉ riêng người dân địa phương.","hint":"Thấy「地域住民＿＿全国から参加」→ chọン はもとより\n✔ N＋はもとより =「...đương nhiên rồi, chưa kể đến (phạm vi rộng hơn)」\n✘ はおろか = đừng nói là (từ mức thấp lên cao, thường tiêu cực)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"あいつときたら、社長でも ___ ___ ★ ___ なんだ。","o":["いったい","つもり","何様の","あるまいし"],"a":3,"order":[4,1,3,2],"vi_p2":"Thằng đó chứ, đâu phải là giám đốc mà cứ ra vẻ ta đây như vậy."},{"q":"また失敗してしまったが、結果を ___ ___ ★ ___ はない。","o":["限り","みる","いなく","進歩して"],"a":4,"order":[2,1,4,3],"vi_p2":"Lại thất bại nữa, nhưng nhìn kết quả thì cũng không phải là không có tiến bộ."},{"q":"いくら欲しくても ___ ___ ★ ___ 買えない。","o":["こう","に","買う","高くては"],"a":3,"order":[1,4,3,2],"vi_p2":"Dù muốn đến mấy, giá cao như thế này thì muốn mua cũng không mua được."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"毎日忙しくて、なかなか自分の時間がとれない。やりたいことはいろいろあるが、もともと時間のやりくりが下手な私は、仕事のある平日に自分の時間をつくるなんてとてもできない。読みたい本も、見たい映画も、行きたい店も、部屋の片付けも、ぜんぶ「休みになったら……」と思い、どんどん後回しにしてしまう。\nするとどうなるかというと、休みの前日になって、「あれもやらなきゃ、これもやらなきゃ」と、平日の間【1】たまったやるべきことをリストに書き出し、それらを消化すべく、30分刻みで細かく計画を立てるはめになる。ところが、当日になると、結局、計画の半分も実行できないうちに夜になって、ベッドの中で自分の立てた計画表を見返し【2】、自分の実行力のなさにがっかりする。これが、少し前までの私のお決まりのパターンだった。\nしかし、あるとき気がついた。計画を立てるから、実行できなかったときにがっかりするのだ。【3-a】実行できないのなら、【3-b】計画など立てなければいいのではないか。\n【4】、休みの前日、明日何をするか、まったく考えないことにした。\n目覚まし時計もかけない。寝たいだけ寝る。朝食の準備もしない。映画も調べない。明日自分が何をするか、どこへ行くかなんて、朝起きたときの気分【5】だ。\nすると不思議なことに、一日かけて本を1冊読んだとか、風呂場のそうじをしたとか、そういう小さなことを何か一つしただけでも、これまでにはない満足感が得られることがわかった。できもしない計画など立てなければ、それなりに充実した休日を過ごせるのだ。","items":[{"label":"1","o":["たまりに","たまるに","たまって","たまれば"],"a":1,"hint":"Dạng câu hỏi: Nối động từ liên tiếp (thể て)\n\nQuan hệ A-B: A (việc cần làm) TÍCH TỤ LẠI (たまって) rồi B (được viết ra thành danh sách) — nối 2 hành động liên tiếp bằng thể て.\n\n「平日の間【1】たまったやるべきことをリストに書き出し」→ nối với động từ chính phía sau → chọn ③ たまって\n→ たまって (thể て) nối 'việc dồn lại rồi (thì) viết ra'\n\nchỗ này là bẫy\n\n✗ たまりに/たまるに = sai ngữ pháp (thiếu điều kiện lặp động từ cho mẫu ますに)\n\n✗ たまれば = 'nếu tích tụ thì' (giả định) — sai vì đây là sự việc ĐÃ xảy ra thực tế, không phải giả định","sentence":"するとどうなるかというと、休みの前日になって、「あれもやらなきゃ、これもやらなきゃ」と、平日の間【1】たまったやるべきことをリストに書き出し、それらを消化すべく、30分刻みで細かく計画を立てるはめになる。"},{"label":"2","o":["たが","とて","ては","にて"],"a":3,"hint":"⚠️ Điểm ngữ pháp cần đối chiếu thêm: đáp án ② とて sau 見返し (dạng liên dụng/masu-stem của 見返す) — có thể là cách dùng とて cổ/văn viết gắn sau thể liên dụng để tạo sắc thái nhượng bộ nhẹ trước がっかりする. Nên tra thêm ví dụ thực tế của mẫu 'Vます+とて' trong tài liệu ngữ pháp N1 khác để củng cố trước khi học thuộc.\n\n✗ たが = sai ngữ pháp trực tiếp sau masu-stem\n\n✗ ては = 'mỗi khi...(là lại)' — không khớp mạch (đây là hành động 1 lần cụ thể tối đó, không lặp lại theo chu kỳ)\n\n✗ にて = trợ từ chỉ nơi chốn/phương tiện trang trọng — sai vị trí/nghĩa hoàn toàn ở đây","sentence":"ところが、当日になると、結局、計画の半分も実行できないうちに夜になって、ベッドの中で自分の立てた計画表を見返し【2】、自分の実行力のなさにがっかりする。"},{"label":"3","o":["a どうせ／b はじめから","a どうせ／b なにより","a いったい／b どうせ","a いくら／b どうせ"],"a":1,"hint":"Dạng câu hỏi: Buông xuôi + nhấn mốc bắt đầu (どうせ~はじめから)\n\nQuan hệ A-B: A (đằng nào cũng không thực hiện được — buông xuôi どうせ) dẫn đến B (đừng lập kế hoạch NGAY TỪ ĐẦU — はじめから).\n\n「【3-a】実行できないのなら、【3-b】計画など立てなければいい」→ buông xuôi + nhấn mốc bắt đầu → chọn ① どうせ/はじめから\n→ どうせ = 'dù sao thì cũng' (buông xuôi), はじめから = 'ngay từ đầu'\n\nchỗ này là bẫy\n\n✗ なにより = 'hơn hết thảy' — sai nghĩa/vị trí\n\n✗ いったい = 'rốt cuộc là' (nghi vấn) — sai, câu này không phải câu hỏi\n\n✗ いくら (cần いくら〜ても) = sai vì thiếu ても theo sau ở vị trí 3-a","sentence":"【3-a】実行できないのなら、【3-b】計画など立てなければいいのではないか。"},{"label":"4","o":["つまり","そこで","いかにも","ちなみに"],"a":2,"hint":"Dạng câu hỏi: Chuyển sang hành động mới (そこで)\n\nQuan hệ A-B: A (nhận ra vấn đề: lập kế hoạch → thất vọng) dẫn đến B (quyết định hành động mới: không nghĩ trước việc ngày mai) qua そこで.\n\n「【4】、休みの前日、明日何をするか、まったく考えないことにした」→ hành động MỚI dựa trên nhận thức vừa có → chọn ② そこで\n→ そこで = 'vì vậy, do đó' (chuyển sang quyết định cụ thể)\n\nchỗ này là bẫy\n\n✗ つまり = 'tức là' (diễn giải lại) — sai, đây là hành động MỚI chứ không phải diễn giải lại\n\n✗ いかにも = 'quả đúng là' — sai nghĩa hoàn toàn\n\n✗ ちなみに = 'nhân tiện nói thêm' — sai nghĩa","sentence":"【4】、休みの前日、明日何をするか、まったく考えないことにした。"},{"label":"5","o":["限り","次第","頼り","なり"],"a":2,"hint":"Dạng câu hỏi: Phụ thuộc hoàn toàn vào 1 yếu tố (~次第)\n\nQuan hệ A-B: A (làm gì, đi đâu vào ngày mai) HOÀN TOÀN PHỤ THUỘC vào B (tâm trạng lúc thức dậy) — N次第だ.\n\n「明日自分が何をするか…気分【5】だ」→ phụ thuộc hoàn toàn vào 1 yếu tố → chọn ② 次第\n→ N次第だ = 'tùy thuộc vào N'\n\nchỗ này là bẫy\n\n✗ 限り = 'trong phạm vi/chừng nào còn' — sai nghĩa\n\n✗ 頼り = 'chỗ dựa' (danh từ, không phải cấu trúc 'tùy thuộc') — sai cách dùng\n\n✗ なり = 'ngay khi vừa...' hoặc liệt kê lựa chọn — sai nghĩa hoàn toàn","sentence":"明日自分が何をするか、どこへ行くかなんて、朝起きたときの気分【5】だ。"}]}]},{"id":"r28","name":"第28回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"彼は会社を経営する（　）、地域のサッカーチームの監督としても活躍してきた。","o":["あまり","うえで","かたわら","そばから"],"a":3,"vi":"Anh ấy vừa điều hành công ty vừa hoạt động làm huấn luyện viên đội bóng đá địa phương.","hint":"Thấy「会社を経営する＿＿監督としても活躍」→ chọン かたわら\n✔ N/Vの＋かたわら =「vừa...vừa (song song dài hạn)」\n✘ がてら = nhân tiện (ngắn hạn, một lần)"},{"q":"きちんと話さなければならないとき（　）、緊張でうまく話せなくなる。","o":["に至って","に及んで","に限って","はさておき"],"a":3,"vi":"Mỗi khi cần phải nói chuyện đàng hoàng là tôi lại căng thẳng không nói nên lời.","hint":"Thấy「きちんと話さなければならないとき＿＿緊張」→ chọン に限って\n✔ N/V普通形＋に限って =「chỉ riêng lúc...thì lại (trái kỳ vọng)」(nghịch lý: đúng lúc cần nhất lại không được)"},{"q":"その医師は80歳（　）なお現役で診療にあたっている。","o":["として","にして","ときたら","にしては"],"a":2,"vi":"Vị bác sĩ đó dù đã 80 tuổi vẫn còn đang hành nghề.","hint":"Thấy「80歳＿＿現役」→ chọン にして\n✔ N（年齢/境遇）＋にして =「ngay cả ở (tuổi đó) vẫn...」(nhấn mạnh điều bất thường)\n✘ として = với tư cách là (thông thường)"},{"q":"近いうちに、ご無沙汰のお詫び（　）ごあいさつに参ります。","o":["ながら","かたがた","ついでに","かたわら"],"a":2,"vi":"Trong thời gian gần đây, tôi sẽ đến thăm hỏi và xin lỗi vì lâu nay chưa liên lạc.","hint":"Thấy「お詫び＿＿ごあいさつに参ります」→ chọン かたがた\n✔ N＋かたがた =「nhân tiện (2 việc trang trọng cùng lúc)」(cố định: お詫びかたがたご挨拶)"},{"q":"夜まで雨は降らないだろうが、傘を持っていくに（　）。","o":["あたらない","かたくない","とどまらない","越したことはない"],"a":4,"vi":"Tuy đến tối chắc trời không mưa, nhưng mang theo ô vẫn hơn.","hint":"Thấy「傘を持っていくに＿＿」→ chọン 越したことはない\n✔ V辞書形＋に越したことはない =「không gì bằng (mang theo)」(phòng hơn tránh)"},{"q":"国会議員が海外視察（　）豪華な観光旅行をしたことが問題となっている。","o":["と相まって","にかこつけて","のかいもなく","をせんがため"],"a":2,"vi":"Việc nghị sĩ quốc hội lấy cớ thị sát nước ngoài để đi du lịch sang trọng đang gây tranh cãi.","hint":"Thấy「海外視察＿＿観光旅行」→ chọン にかこつけて\n✔ N＋にかこつけて =「lấy cớ là...」(mục đích thật khác mục đích tuyên bố)"},{"q":"他の人の反応を見ても、これでいい（　）悪い（　）、どうもわからない。","o":["だの／だの","といい／といい","のやら／のやら","といわず／といわず"],"a":3,"vi":"Nhìn phản ứng của người khác cũng không rõ là tốt hay xấu, tôi thực sự không hiểu nổi.","hint":"Thấy「いい＿＿悪い＿＿どうもわからない」→ chọン のやら〜のやら\n✔ 〜やら〜やら =「không biết là...hay là...」(phân vân, không rõ ràng)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"高校を卒業してからここ ___ ___ ★ ___ 運動をしていない。","o":["ほとんど","数年","という","もの"],"a":3,"order":[2,4,3,1],"vi_p2":"Từ khi tốt nghiệp cấp 3 đến nay mấy năm rồi, gần như chưa tập thể dục lần nào."},{"q":"彼は前の車が ___ ___ ★ ___ 無理な追い越しをした。","o":["遅いと","スピードを","あげて","みると"],"a":2,"order":[1,4,2,3],"vi_p2":"Thấy xe phía trước chạy chậm là anh ấy tăng tốc vượt xe một cách liều lĩnh."},{"q":"祭りの会場は、地元の ___ ___ ★ ___ 、大勢の人でにぎわった。","o":["外国人観光客","子どもから","まで","に至る"],"a":4,"order":[2,1,4,3],"vi_p2":"Hội trường lễ hội đông đảo từ trẻ em địa phương cho đến khách du lịch nước ngoài."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"「カラオケに行きましょう」と誘われて、「いやあ、声には自信がなくて」と断る。よくある会話だ。このように「自信がない」という言い方は、スポーツ、料理、文章【1-a】よく使われるものだった。営業マンが「営業ですか？いやあ、自信がなくて」と言ったり、教師が「子どもの教育には自信がないんですよ」と言ったり、とその人にとって重要なこと、核心にふれることで簡単に「自信がない」と答えると、無責任と【2】。(中略)\nいつの頃からか「顔に自信がない」「スタイルに自信がない」と、自分の外見について「自信がない」と口にする人が増えた。「顔」や「スタイル」はかなり本人の核心に近いことであるが、まだ【3-a】ではなくてあくまで【3-b】の問題であるので、それほど抵抗なく自信のなさを表明しやすいのかもしれない。\nところが最近、趣味でも外見でもなく、「自分に自信がない」といった言い方をする人が目につくようになってきた。(中略)そういう人に「何に自信が持てないんですか」ときいても、「具体的に何かに、【4】、とにかく何に対しても自信が持てないんです」「自信【5】自分が好きになれると思うのですが、今のままの自分はきらいです」などと漠然とした答えが返ってくることが多い。もちろん、「仕事に対しても自信が持てない」と躊躇なく言い切る。\n（香山リカ著『「悩み」の正体』岩波書店刊　※一部省略あり）","items":[{"label":"1","o":["a や／b で","a など／b で","a や／b によって","a など／b によって"],"a":2,"hint":"Dạng câu hỏi: Liệt kê mở + phạm vi (など~で)\n\nQuan hệ A-B: A (thể thao, nấu ăn, viết văn — liệt kê VÀ CÒN NHIỀU LĨNH VỰC KHÁC) là PHẠM VI mà B (cách nói 'không tự tin') thường được dùng.\n\n「スポーツ、料理、文章【1-a】よく使われる」→ liệt kê mở (còn nhiều lĩnh vực khác) + phạm vi → chọn ② など/で\n→ など = 'vân vân' (liệt kê không đầy đủ), で = 'trong (phạm vi lĩnh vực)'\n\nchỗ này là bẫy\n\n✗ や (thay など) = thường dùng liệt kê 2-3 thứ rồi dừng hẳn, thiếu sắc thái 'còn nhiều lĩnh vực khác nữa'\n\n✗ によって (thay で) = 'bởi, do, tùy theo' — sai nghĩa, で chỉ PHẠM VI chứ không phải 'do/bởi'","sentence":"このように「自信がない」という言い方は、スポーツ、料理、文章【1-a】よく使われるものだった。"},{"label":"2","o":["思われまいか","思われやしないだろうか","思われかねなかった","思われずにはおかなかった"],"a":3,"hint":"Dạng câu hỏi: Khả năng ở thì quá khứ (~かねなかった)\n\nQuan hệ A-B: A (dễ dàng trả lời 'không tự tin') CÓ THỂ ĐÃ dẫn đến B (bị nghĩ là vô trách nhiệm) — かねない diễn tả khả năng, ở bối cảnh quá khứ khớp だった câu trước.\n\n「簡単に『自信がない』と答えると、無責任と【2】」(bối cảnh QUÁ KHỨ) → chọn ③ 思われかねなかった\n→ 思われかねなかった = 'có thể đã bị nghĩ là...' (khả năng xảy ra điều không hay, ở thì QUÁ KHỨ khớp だった câu trước)\n\nchỗ này là bẫy\n\n✗ 思われまいか = sai cấu trúc/nghĩa (nghi vấn phủ định ý chí)\n\n✗ 思われやしないだろうか = sai THÌ (hiện tại/tương lai, không khớp bối cảnh quá khứ đã lập)\n\n✗ 思われずにはおかなかった = khẳng định MẠNH (chắc chắn) — sai sắc thái so với かねない (chỉ là khả năng)","sentence":"営業マンが「営業ですか？いやあ、自信がなくて」と言ったり、教師が「子どもの教育には自信がないんですよ」と言ったり、とその人にとって重要なこと、核心にふれることで簡単に「自信がない」と答えると、無責任と【2】。"},{"label":"3","o":["a 内面／b 表面","a 見た目／b 気持ち","a 顔／b スタイル","a 外見／b 核心"],"a":1,"hint":"Dạng câu hỏi: Liên kết ngược về khái niệm đã nêu (核心/外見)\n\nQuan hệ A-B: A ('khuôn mặt', 'vóc dáng' — 2 ví dụ cụ thể) CHƯA PHẢI LÀ B (核心 - cốt lõi, đã nhắc ở đoạn mở bài) mà chỉ là 外見 (ngoại hình).\n\n「『顔』や『スタイル』は…核心に近いことであるが、まだ【3-a】ではなくてあくまで【3-b】の問題」→ liên kết với 核心 đã nhắc ở đoạn đầu bài → chọn ④ 外見/核心\n→ 3-a phủ định 'core' (核心), 3-b khẳng định 'chỉ là ngoại hình' (外見)\n\nchỗ này là bẫy\n\n✗ 内面/表面, 見た目/気持ち = sai nghĩa/không khớp từ 核心 đã dùng ở đoạn trước\n\n✗ 顔/スタイル = đây là 2 VÍ DỤ CỤ THỂ vừa nêu, không phải khái niệm KHÁI QUÁT cần cho câu kết luận này","sentence":"「顔」や「スタイル」はかなり本人の核心に近いことであるが、まだ【3-a】ではなくてあくまで【3-b】の問題であるので、それほど抵抗なく自信のなさを表明しやすいのかもしれない。"},{"label":"4","o":["ということに加えて","ということじゃなくて","ということではないので","ということにかかわらず"],"a":2,"hint":"Dạng câu hỏi: Phủ định để dẫn tới ý đúng hơn (~じゃなくて)\n\nQuan hệ A-B: A (cụ thể ở việc gì đó) bị PHỦ ĐỊNH để nhường chỗ cho B (nói chung, không tự tin vào bất cứ điều gì) qua とにかく.\n\n「具体的に何かに、【4】、とにかく何に対しても自信が持てない」→ phủ định để dẫn tới ý đúng hơn → chọn ② ということじゃなくて\n→ ということじゃなくて = 'không phải là...' (phủ định, dẫn tới とにかく phía sau)\n\nchỗ này là bẫy\n\n✗ ということに加えて = 'thêm vào việc' — sai nghĩa (không phải bổ sung mà là phủ định)\n\n✗ ということではないので = 'vì không phải là' (nguyên nhân) — sai cấu trúc, cần liên từ chuyển ý chứ không phải lý do\n\n✗ ということにかかわらず = 'bất kể có phải là...hay không' — sai nghĩa","sentence":"(中略)そういう人に「何に自信が持てないんですか」ときいても、「具体的に何かに、【4】、とにかく何に対しても自信が持てないんです」「自信【5】自分が好きになれると思うのですが、今のままの自分はきらいです」などと漠然とした答えが返ってくることが多い。"},{"label":"5","o":["さえ持てば","を持てないまでも","を持ったところで","があろうがなかろうが"],"a":1,"hint":"Dạng câu hỏi: Điều kiện tối thiểu đủ (さえ~ば)\n\nQuan hệ A-B: A (CHỈ CẦN có được tự tin) là điều kiện TỐI THIỂU ĐỦ để đạt B (thích được bản thân mình).\n\n「自信【5】自分が好きになれると思う」→ điều kiện tối thiểu đủ → chọn ① さえ持てば\n→ さえ〜ば = 'chỉ cần...là' (điều kiện tối thiểu đủ để đạt kết quả mong muốn)\n\nchỗ này là bẫy\n\n✗ を持てないまでも = 'dù chưa đến mức có được...' — sai, không khớp mạch điều kiện đơn giản\n\n✗ を持ったところで = 'dù có được...đi nữa (cũng không)' — NGƯỢC nghĩa hoàn toàn\n\n✗ があろうがなかろうが = 'dù có hay không cũng (không thay đổi)' — NGƯỢC nghĩa hoàn toàn","sentence":"(中略)そういう人に「何に自信が持てないんですか」ときいても、「具体的に何かに、【4】、とにかく何に対しても自信が持てないんです」「自信【5】自分が好きになれると思うのですが、今のままの自分はきらいです」などと漠然とした答えが返ってくることが多い。"}]}]},{"id":"r29","name":"第29回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"我々（　）一般庶民は、あんな高級マンションには一生住めそうもない。","o":["ごとく","のごとき","並みの","なりの"],"a":2,"vi":"Những người dân thường như chúng tôi thì chắc cả đời cũng không thể sống trong căn hộ cao cấp như vậy.","hint":"Thấy「我々＿＿一般庶民」→ chọン 並みの\n✔ N＋並みの =「ngang với mức (bình thường)...」(so sánh mức độ)\n✘ のごとき = như là (so sánh tu từ)"},{"q":"その女性は、新幹線に乗り込む（　）、すぐにバッグからパソコンを取り出した。","o":["なりに","が早いか","と思いきや","までもなく"],"a":2,"vi":"Người phụ nữ đó vừa lên tàu Shinkansen là lập tức lấy máy tính ra khỏi túi ngay.","hint":"Thấy「新幹線に乗り込む＿＿パソコンを取り出した」→ chọン が早いか\n✔ V辞書形＋が早いか =「vừa mới...thì ngay lập tức」(tức thì, hành động kế tiếp gần như đồng thời)\n✘ なりに = theo cách phù hợp (nghĩa khác)"},{"q":"父は頑固で、言い出した（　）絶対に考えを変えない。","o":["が最後","とたん","とあっては","に至っては"],"a":1,"vi":"Bố tôi rất bướng bỉnh, một khi đã nói gì là tuyệt đối không đổi ý.","hint":"Thấy「言い出した＿＿考えを変えない」→ chọン が最後\n✔ Vた形＋が最後 =「một khi đã...thì (không thể quay đầu)」(cố định: 言い出したが最後)"},{"q":"タバコは健康に害を及ぼし（　）、いい影響は与えない。","o":["兼ねて","こそすれ","次第で","ずくめで"],"a":2,"vi":"Thuốc lá chỉ gây hại cho sức khỏe chứ chẳng mang lại lợi ích gì.","hint":"Thấy「健康に害を及ぼし＿＿いい影響は与えない」→ chọン こそすれ\n✔ Vます形＋こそすれ〜ない =「chỉ có thể...chứ không...」(chỉ hướng tiêu cực, không có tích cực)"},{"q":"返信する（　）次のメールが来て、いつまでたっても出かけられない。","o":["がてら","そばから","ものなら","からこそ"],"a":2,"vi":"Vừa trả lời tin nhắn xong là tin nhắn mới lại đến ngay, chẳng bao giờ đi ra ngoài được.","hint":"Thấy「返信する＿＿次のメールが来て」→ chọン そばから\n✔ V辞書形/た形＋そばから =「vừa mới...thì lại (ngay, liên tục)」(hành động bị phá vỡ ngay lập tức)"},{"q":"これだけの機能があるから値段も高いかと（　）、それほどでもなかった。","o":["思いきや","思うやいなや","言えども","言わんばかりに"],"a":1,"vi":"Cứ tưởng có nhiều tính năng thế này thì giá sẽ cao, nhưng hóa ra cũng không đắt lắm.","hint":"Thấy「値段も高いかと＿＿それほどでもなかった」→ chọン 思いきや\n✔ 〜かと思いきや =「cứ tưởng...nhưng hóa ra」(kết quả trái kỳ vọng)"},{"q":"いくら隠したところで、（　）そんな嘘はばれてしまうだろう。","o":["遅かれ早かれ","遅くも早くも","遅いやら早いやら","遅いなり早いなり"],"a":1,"vi":"Dù có giấu giếm thế nào, sớm muộn gì lời nói dối đó cũng sẽ bị lộ ra thôi.","hint":"Thấy「いくら隠したところで＿＿ばれる」→ chọン 遅かれ早かれ\n✔ 遅かれ早かれ = cụm cố định「sớm hay muộn (thì cũng sẽ)」"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"川沿いの田畑は ___ ___ ★ ___ たちまち水没してしまう。","o":["でも","ものなら","降ろう","大雨"],"a":3,"order":[4,1,3,2],"vi_p2":"Ruộng đồng dọc sông hễ mưa lớn một chút là ngập ngay lập tức."},{"q":"一流プレーヤーが勢ぞろいする ___ ___ ★ ___ いられない。","o":["ファン","とあれば","としては","行かずには"],"a":3,"order":[2,1,3,4],"vi_p2":"Đã là fan mà nghe tin cầu thủ đỉnh tập trung đầy đủ thì không thể không đến được."},{"q":"いくら子ども ___ ___ ★ ___ ならない。","o":["からには","約束した","守らねば","とはいえ"],"a":1,"order":[4,2,1,3],"vi_p2":"Dù là trẻ con, đã hứa thì phải giữ lời."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"今、人々の間の交流が急激にさかんになったことによって、言葉に有史以来の異変が二つおこっていると言われている。\n一つ目の異変は、下の方の、名も知れぬ言葉が、たいへんな勢いで絶滅しつつあるということである。今地球に六千ぐらいの言葉があるといわれているが、そのうちの八割以上が今世紀の末までには絶滅するであろうと予測されている。歴史の中で、あまたの言葉が【1】消えていったが、今、言葉は、生まれるよりも勢いよく消えつつある。激しい環境の変化の中で、自然界ではありえなかった勢いで生物が絶滅しつつある【2】、都市への人口集中や伝達手段の発達や国家の強制によって、言葉は、かつてない勢いで消えつつある。\n二つ目の異変は、今までには存在しなかった、すべての言葉のさらに上にある、世界全域で流通する言葉が生まれたということである。\nそれが今〈普遍語〉となりつつある英語に【3】。\n英語がほかの言葉を押しのけて一人〈普遍語〉となりつつあるのは、歴史の偶然と必然とが【4】である。英語という言葉そのものに原因はない。思うに、英語という言葉は、ほかの言葉を〈母語〉【5-a】人間にとって、決して学びやすい言葉ではない。もとはゲルマン系の言葉にフランス語がまざり、ごちゃごちゃしている上に、文法も単純ではないし、そもそも単語の数が実に多い。慣用句も多い。おまけにスペリングと発音との関係がしばしば不規則である。さらに、発音そのものが、それを〈母語〉【5-b】多くの人にとって非常にむずかしい。\n（水村美苗著『日本語が亡びるとき―英語の世紀の中で』筑摩書房刊）","items":[{"label":"1","o":["生まれては","生まれるなり","生まれようが","生まれるとみえて"],"a":1,"hint":"Dạng câu hỏi: Chu kỳ lặp lại (Vては+V)\n\nQuan hệ A-B: A (sinh ra) và B (biến mất) LẶP ĐI LẶP LẠI theo chu kỳ qua suốt lịch sử — không phải 1 lần mà nhiều vòng lặp.\n\n「歴史の中で、あまたの言葉が【1】消えていった」→ lặp lại chu kỳ nhiều lần → chọn ① 生まれては\n→ 生まれては消える (Vては+V) = nhấn mạnh tính lặp đi lặp lại theo chu kỳ qua lịch sử\n\nchỗ này là bẫy\n\n✗ 生まれるなり = tức thì, 1 lần — sai vì đây là hiện tượng LẶP LẠI nhiều lần\n\n✗ 生まれようが = cần cặp đối lập まいが — sai cấu trúc\n\n✗ 生まれるとみえて = 'có vẻ như' (suy đoán) — sai nghĩa","sentence":"歴史の中で、あまたの言葉が【1】消えていったが、今、言葉は、生まれるよりも勢いよく消えつつある。"},{"label":"2","o":["ことから","くらいなら","ともなると","のと同様"],"a":4,"hint":"Dạng câu hỏi: So sánh tương đồng giữa 2 hiện tượng (~のと同様)\n\nQuan hệ A-B: A (tốc độ tuyệt chủng sinh vật chưa từng có trong tự nhiên) được B (tốc độ ngôn ngữ biến mất) SO SÁNH TƯƠNG ĐỒNG, không phải quan hệ nhân quả.\n\n「自然界ではありえなかった勢いで生物が絶滅しつつある【2】、都市への人口集中…によって、言葉は…消えつつある」→ so sánh TƯƠNG ĐỒNG giữa 2 hiện tượng → chọn ④ のと同様\n→ のと同様 = 'giống như, tương tự với việc...' (tuyệt chủng sinh vật ↔ biến mất ngôn ngữ)\n\nchỗ này là bẫy\n\n✗ ことから = 'từ việc...' (căn cứ/lý do) — sai, đây là SO SÁNH chứ không phải nhân quả\n\n✗ くらいなら = sai nghĩa hoàn toàn\n\n✗ ともなると = 'một khi đã đến mức/giai đoạn' — sai nghĩa","sentence":"激しい環境の変化の中で、自然界ではありえなかった勢いで生物が絶滅しつつある【2】、都市への人口集中や伝達手段の発達や国家の強制によって、言葉は、かつてない勢いで消えつつある。"},{"label":"3","o":["難くない","あたらない","とどまらない","ほかならない"],"a":4,"hint":"Dạng câu hỏi: Khẳng định duy nhất (~にほかならない)\n\nQuan hệ A-B: A ('ngôn ngữ phổ quát' đang hình thành) KHÔNG GÌ KHÁC CHÍNH LÀ B (tiếng Anh) — khẳng định mạnh, duy nhất.\n\n「それが今〈普遍語〉となりつつある英語に【3】」→ khẳng định mạnh, duy nhất → chọn ④ ほかならない\n→ にほかならない = 'không gì khác chính là...' (khẳng định mạnh)\n\nchỗ này là bẫy\n\n✗ 難くない (Vるに難くない) = 'không khó để' — sai nghĩa/cấu trúc hoàn toàn\n\n✗ あたらない (Vるにあたらない) = 'không đáng để' — sai nghĩa\n\n✗ とどまらない = cần vế N khác đi kèm để so sánh mở rộng — sai cấu trúc ở đây","sentence":"それが今〈普遍語〉となりつつある英語に【3】。"},{"label":"4","o":["絡み合ったもの","絡み合うところ","絡み合ってのこと","絡み合わんがため"],"a":3,"hint":"Dạng câu hỏi: Giải thích nguyên nhân qua hành động (~てのこと)\n\nQuan hệ A-B: A (tiếng Anh trở thành ngôn ngữ phổ quát) LÀ DO B (sự đan xen giữa ngẫu nhiên và tất yếu của lịch sử) — てのこと giải thích bản chất/nguyên nhân.\n\n「英語が…〈普遍語〉となりつつあるのは、歴史の偶然と必然とが【4】である」→ giải thích nguyên nhân/bản chất qua hành động → chọn ③ 絡み合ってのこと\n→ Vて+のこと = 'là do việc...' (giải thích nguyên nhân)\n\nchỗ này là bẫy\n\n✗ 絡み合ったもの = danh từ hóa đơn thuần, thiếu sắc thái NGUYÊN NHÂN như てのこと\n\n✗ 絡み合うところ = sai nghĩa/cấu trúc\n\n✗ 絡み合わんがため = 'để mà đan xen' (mục đích, dạng cổ) — sai nghĩa hoàn toàn (đây là giải thích nguyên nhân ĐÃ xảy ra, không phải mục đích)","sentence":"英語がほかの言葉を押しのけて一人〈普遍語〉となりつつあるのは、歴史の偶然と必然とが【4】である。"},{"label":"5","o":["a とする／b としない","a とする／b とならない","a となる／b としない","a となる／b とならない"],"a":1,"hint":"Dạng câu hỏi: Quan hệ khách quan (となる/とならない)\n\nQuan hệ A-B: A (một ngôn ngữ LÀ tiếng mẹ đẻ của người này) và B (KHÔNG LÀ tiếng mẹ đẻ của người khác) — quan hệ khách quan, dùng tự động từ となる chứ không phải とする chủ động.\n\n「ほかの言葉を〈母語〉【5-a】人間にとって…」「それを〈母語〉【5-b】多くの人にとって非常にむずかしい」→ mối quan hệ khách quan (tự động từ) → chọn ④ となる/とならない\n→ となる = 'trở thành, là' (tự động từ, quan hệ khách quan 'ngôn ngữ này LÀ tiếng mẹ đẻ của người này')\n\nchỗ này là bẫy\n\n✗ とする/としない (tha động từ, 'coi N là...') = sai chủ thể — đây không phải ai đó CHỦ ĐỘNG coi ngôn ngữ là tiếng mẹ đẻ, mà là quan hệ khách quan\n\n✗ Trộn とする(a)/とならない(b) ở option ② = không nhất quán loại động từ (tự động/tha động) giữa 2 vế cần đối xứng","sentence":"思うに、英語という言葉は、ほかの言葉を〈母語〉【5-a】人間にとって、決して学びやすい言葉ではない。\nさらに、発音そのものが、それを〈母語〉【5-b】多くの人にとって非常にむずかしい。"}]}]},{"id":"r30","name":"第30回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"水分は人間が生きていくのに（　）ものだ。","o":["欠くべからざる","欠くよりほかない","欠かずにすまない","欠かざるを得ない"],"a":1,"vi":"Nước là thứ không thể thiếu để con người sống được.","hint":"Thấy「生きていくのに＿＿ものだ」→ chọン 欠くべからざる\n✔ V辞書形べからざる＋N =「không thể thiếu được」(cố định: 欠くべからざる存在・もの)"},{"q":"社長は1000万円（　）スポーツカーを何台も集めている。","o":["からある","からする","こそあれ","こそすれ"],"a":2,"vi":"Vị giám đốc sưu tầm rất nhiều xe thể thao có giá lên tới cả chục triệu yên.","hint":"Thấy「1000万円＿＿スポーツカー」→ chọン からある\n✔ 数量＋からある =「lên tới...」(nhấn mạnh số lượng lớn/giá cao)\n✘ からする = cũng tương tự nhưng thiên về giá tiền (からする cũng chấp nhận được)"},{"q":"100年前にいったい誰がこの絵を描いたのか、現代（　）もまだ判明していない。","o":["を経て","に至って","を通して","に即して"],"a":2,"vi":"Đến tận bây giờ, sau cả trăm năm, vẫn chưa rõ ai là người vẽ bức tranh này.","hint":"Thấy「現代＿＿もまだ判明していない」→ chọン に至って\n✔ 現代に至っても =「cho đến tận thời đại này vẫn」(đến mốc thời gian cao nhất mà vẫn chưa)"},{"q":"明日のイベントは、当日の天候（　）、中止になるおそれがあります。","o":["いかんでは","からすれば","ばかりには","に応じて"],"a":1,"vi":"Tùy theo thời tiết hôm đó, sự kiện ngày mai có thể sẽ bị hủy.","hint":"Thấy「当日の天候＿＿中止になるおそれ」→ chọン いかんでは\n✔ N＋いかんでは =「tùy theo...mà có thể」(kết quả phụ thuộc)\n✘ に応じて = linh hoạt thích ứng theo (khác sắc thái)"},{"q":"そんな高い修理代を払う（　）、新しいのを買ったほうがましだ。","o":["限り","ときたら","にしたら","くらいなら"],"a":4,"vi":"Nếu phải trả tiền sửa đắt như vậy thì thà mua cái mới còn hơn.","hint":"Thấy「そんな高い修理代を払う＿＿新しいのを買ったほうがましだ」→ chọン くらいなら\n✔ 〜くらいなら〜ほうがましだ =「thà...còn hơn」(so sánh 2 lựa chọn, cái đang nói không đáng)"},{"q":"植物や動物など、何かの命を奪う（　）人間は生きていけない。","o":["ともなく","ことなしに","なくして","ならでは"],"a":2,"vi":"Con người không thể sống mà không tước đi sinh mạng của thực vật hay động vật khác.","hint":"Thấy「何かの命を奪う＿＿生きていけない」→ chọン ことなしに\n✔ V辞書形の＋ことなしに =「mà không...」(điều kiện phủ định cần thiết)\n✘ なくして = tương tự nhưng dùng với danh từ"},{"q":"この工場は規模（　）小さいが、年商は数十億円に上る。","o":["こそ","だの","さえも","ですら"],"a":1,"vi":"Nhà máy này quy mô tuy nhỏ nhưng doanh thu hàng năm lên tới vài chục tỷ yên.","hint":"Thấy「規模＿＿小さいが年商は高い」→ chọン こそ\n✔ N＋こそ〜が =「N thì (đúng là)...nhưng」(thừa nhận rồi đưa ra điều ngược lại)\n✘ ですら = ngay cả (nhấn mạnh bất ngờ)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"亡くなった祖父の顔は ___ ___ ★ ___ だった。","o":["かのごとく","穏やかな","表情","眠っている"],"a":2,"order":[4,1,2,3],"vi_p2":"Khuôn mặt ông nội vừa mất trông thanh thản như đang ngủ vậy."},{"q":"会計のときに店員の ___ ___ ★ ___ ものだった。","o":["態度は","極まる","不愉快","とった"],"a":3,"order":[4,1,3,2],"vi_p2":"Thái độ của nhân viên thu ngân thật sự vô lễ đến mức không thể nói được."},{"q":"この地方が寒いのは ___ ___ ★ ___ を通して気候は温暖だと言える。","o":["1カ月","1年","くらい","のもので"],"a":4,"order":[1,3,4,2],"vi_p2":"Vùng này tuy lạnh nhưng chỉ khoảng một tháng thôi, nhìn chung khí hậu cả năm ôn hoà."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"長い間、私にとって趣味というか楽しみは、読書しかなかった。私は昭和二十年代の終わりの生まれで、それ以前に生まれた人も含めて、他に選べる趣味や楽しみが少なかったのも理由のひとつだろう。(中略)学生時代、書類の趣味の欄に書くのは、読んで【1】、いちばん多く書かれていたのは「読書」だったのではないか。(中略)\nところが最近は、本を読む人がどんどん減ってきている。減っているとは以前から聞いていたが、盛り返す【2】ますます先細りらしい。かつては若い人が本を読まなくなった理由は、漫画のせいだといわれていた。活字本の敵は漫画だった。年輩の文芸書の編集者が、\n「最近の若い人は漫画しか買わないからねえ」\nと嘆いているのを何度聞いたかわからない。しかし本好きの立場から【3】、漫画本も本のうちで、活字ばかり読んでいたわけではない。漫画でも素晴らしいもの、楽しいもの、面白いものがたくさんあり、活字本と区別してはいなかった。しかし売る側としては、活字の敵は漫画だと位置づけていたのである。\nしかし今は漫画の売り上げの減少のほうが著しいと聞いた。若い人は漫画【4】買わなくなった。理由は携帯電話が普及したせいだという。本を手にしない人によると、ページをめくるのが面倒くさい。漫画は絵と文字を読むのが活字本より面倒なのだそうだ。携帯電話でメールをやりとりするから、文章力が上がるのではといっている人もいたが、もともとの語彙や表現力がなかったら、いくら文章を【5】、それで文章力が上がるとは思えない。\n（群ようこ著『世間のドクダミ』筑摩書房刊　※一部省略あり）","items":[{"label":"1","o":["いたらいたで","いこうかいくまいか","いようがいまいか","いるだのいないだの"],"a":3,"hint":"Dạng câu hỏi: Nhượng bộ đôi tiếp diễn (~ていようがいまいが)\n\nQuan hệ A-B: A (có đang đọc sách) và B (không đang đọc sách) đều DẪN ĐẾN CÙNG một kết luận (mục sở thích ghi 'đọc sách' là phổ biến nhất) — nhượng bộ đôi.\n\n「書類の趣味の欄に書くのは、読んで【1】、いちばん多く書かれていたのは『読書』」→ nhượng bộ đôi về trạng thái tiếp diễn → chọn ③ いようがいまいか\n→ Vていようがいまいが = 'dù có đang đọc hay không đang đọc' (nhượng bộ đôi)\n\nchỗ này là bẫy\n\n✗ いたらいたで = 'một khi đã đọc rồi thì (lại)' — sai cấu trúc/nghĩa\n\n✗ いこうかいくまいか = dạng ý chí (đi hay không đi) — sai, câu này cần dạng tiếp diễn chứ không phải ý chí\n\n✗ いるだのいないだの = 'nào là có nào là không' (liệt kê than phiền) — sai sắc thái/cấu trúc","sentence":"(中略)学生時代、書類の趣味の欄に書くのは、読んで【1】、いちばん多く書かれていたのは「読書」だったのではないか。"},{"label":"2","o":["が早いか","そばから","ともなしに","どころか"],"a":4,"hint":"Dạng câu hỏi: Phủ định mạnh, nhấn tình huống tệ hơn (どころか)\n\nQuan hệ A-B: A (phục hồi doanh số) hoàn toàn KHÔNG XẢY RA, thay vào đó B (ngày càng thu hẹp thêm) — どころか phủ định mạnh A để nhấn B tệ hơn.\n\n「盛り返す【2】ますます先細りらしい」→ phủ định mạnh vế trước, nhấn tình huống tệ hơn → chọn ④ どころか\n→ 盛り返すどころか = 'chứ đừng nói là phục hồi' (どころか: phủ định mạnh + nhấn tình huống ngược lại/tệ hơn)\n\nchỗ này là bẫy\n\n✗ が早いか = 'vừa mới...là ngay lập tức' — sai nghĩa hoàn toàn\n\n✗ そばから = 'vừa...thì đã lại...' (lặp nhanh) — sai nghĩa ở đây\n\n✗ ともなしに = 'một cách vô định' — sai nghĩa","sentence":"減っているとは以前から聞いていたが、盛り返す【2】ますます先細りらしい。"},{"label":"3","o":["いってもらうと","いってあげると","いわせてもらうと","いわせてあげると"],"a":3,"hint":"Dạng câu hỏi: Cho-nhận/sai khiến khiêm nhường (させてもらう)\n\nQuan hệ A-B: Chủ thể (tác giả) TỰ XIN PHÉP được nói B (ý kiến từ lập trường người yêu sách) — xác định chủ thể xin phép, không phải quan hệ A-B logic.\n\n「しかし本好きの立場から【3】、漫画本も本のうちで」→ tự xin phép bày tỏ ý kiến cá nhân (khiêm nhường) → chọn ③ いわせてもらうと\n→ いわせてもらうと = 'nếu được cho phép nói (khiêm tốn)...' (tác giả tự xin phép nói)\n\nchỗ này là bẫy\n\n✗ いってもらうと = 'nếu (ai đó khác) nói cho...' — sai chủ thể\n\n✗ いってあげると/いわせてあげると = 'nếu (tôi) nói/cho phép AI ĐÓ nói' — sai chủ thể/hướng hoàn toàn\n\n📌 Dạng câu hỏi 授受・使役: chủ thể là NGƯỜI NÓI tự xin phép được nói → thể sai khiến-thụ động khiêm nhường させてもらう.","sentence":"しかし本好きの立場から【3】、漫画本も本のうちで、活字ばかり読んでいたわけではない。"},{"label":"4","o":["はおろか","ほども","すら","しか"],"a":3,"hint":"⚠️ CẦN ĐỐI CHIẾU LẠI VỚI SÁCH GỐC: dữ liệu cho đáp án ④ しか ('chỉ mua manga'), nhưng mạch đoạn văn đang nói doanh số MANGA cũng đang giảm (若い人は漫画を買わなくなった đơn giản), nên về ngữ nghĩa 'ngay cả manga cũng không mua nữa' (すら/はおろか) có vẻ hợp lý hơn. Nên xác minh lại với sách gốc 群ようこ『世間のドクダミ』trước khi học tủ câu này.","sentence":"若い人は漫画【4】買わなくなった。"},{"label":"5","o":["作るくらいなら","作ったとしても","作るならまだしも","作ったとなったら"],"a":2,"hint":"Dạng câu hỏi: Nhượng bộ mạnh (いくら~としても)\n\nQuan hệ A-B: A (viết văn bản nhiều đến mấy — nhượng bộ mạnh いくら~としても) vẫn KHÔNG dẫn đến B (khả năng viết văn tăng lên) nếu thiếu vốn từ/diễn đạt.\n\n「もともとの語彙や表現力がなかったら、いくら文章を【5】、それで文章力が上がるとは思えない」→ mẫu いくら〜としても → chọn ② 作ったとしても\n→ いくら〜としても = 'dù có...đến mấy đi nữa cũng (không)...'\n\nchỗ này là bẫy\n\n✗ 作るくらいなら = cần 2 vế so sánh lựa chọn — sai cấu trúc\n\n✗ 作るならまだしも = 'nếu là...thì còn tạm được, nhưng' — sai cấu trúc (không khớp いくら)\n\n✗ 作ったとなったら = 'một khi đã viết ra thì' (giả định kết quả) — sai nghĩa/cấu trúc","sentence":"携帯電話でメールをやりとりするから、文章力が上がるのではといっている人もいたが、もともとの語彙や表現力がなかったら、いくら文章を【5】、それで文章力が上がるとは思えない。"}]}]}],"trainings":[{"id":"t1","name":"集中トレーニング①助詞（1）","items":[{"q":"私たちのチームは実戦（a に　b を）即した練習方法を取り入れている。","a":"に","b":"を","ans":"a","vi":"Đội chúng tôi áp dụng phương pháp luyện tập bám sát thực chiến."},{"q":"田中さんに出会ったあの日（a に　b を）境に私の生活は大きく変わった。","a":"に","b":"を","ans":"b","vi":"Lấy ngày gặp anh Tanaka làm bước ngoặt, cuộc sống của tôi đã thay đổi rất nhiều."},{"q":"月末（a と　b に）あって、銀行はとても込んでいた。","a":"と","b":"に","ans":"a","vi":"Vì là cuối tháng nên ngân hàng rất đông khách."},{"q":"あの名作が20年の時（a と　b を）経て、映画になってよみがえる！","a":"と","b":"を","ans":"b","vi":"Tác phẩm kinh điển đó, sau 20 năm, đã được dựng lại thành phim!"},{"q":"まさか彼があんな聞く（a に　b を）堪えない言葉を口にしようとは。","a":"に","b":"を","ans":"a","vi":"Không ngờ anh ta lại thốt ra những lời khó nghe đến vậy."},{"q":"この状況（a と　b に）あって、今までと同じ生活を維持するのは難しい。","a":"と","b":"に","ans":"b","vi":"Trong tình huống này, rất khó để duy trì cuộc sống như trước."},{"q":"周囲の心配（a に　b を）よそに、父は山登りを続けている。","a":"に","b":"を","ans":"b","vi":"Bất chấp sự lo lắng của mọi người xung quanh, bố vẫn tiếp tục leo núi."},{"q":"以上（a に　b を）もちまして、本日は終了とさせていただきます。","a":"に","b":"を","ans":"b","vi":"Đến đây tôi xin phép kết thúc buổi hôm nay."},{"q":"その証言が事実だ（a と　b を）すると、捜査をやり直さなければならないだろう。","a":"と","b":"を","ans":"a","vi":"Nếu lời khai đó là sự thật thì phải điều tra lại từ đầu."},{"q":"町工場（a と　b を）いえども、その技術は世界レベルだ。","a":"と","b":"を","ans":"a","vi":"Dù là xưởng nhỏ ở thị trấn, công nghệ của họ vẫn đạt đẳng cấp thế giới."}]},{"id":"t2","name":"集中トレーニング②助詞（2）","items":[{"q":"うちの子（a が　b と）きたら、30歳にもなって料理ひとつ作れないんです。","a":"が","b":"と","ans":"b","vi":"Nói đến con tôi thì đã 30 tuổi rồi mà vẫn không nấu nổi một món ăn."},{"q":"この会が発足（a に　b を）至った経緯をご説明いたします。","a":"に","b":"を","ans":"a","vi":"Tôi xin giải thích quá trình dẫn đến việc thành lập hội này."},{"q":"これまでの様々な事例（a に　b を）踏まえて、解決策を考えていきたい。","a":"に","b":"を","ans":"b","vi":"Tôi muốn suy nghĩ giải pháp dựa trên các trường hợp thực tế từ trước đến nay."},{"q":"この歯医者は技術（a が　b も）さることながら、患者への対応がとてもよい。","a":"が","b":"も","ans":"b","vi":"Phòng khám nha khoa này không chỉ giỏi chuyên môn mà còn rất chu đáo với bệnh nhân."},{"q":"コンサートは東京（a が　b を）皮切りに、世界10都市で行われる予定だ。","a":"が","b":"を","ans":"b","vi":"Buổi hòa nhạc dự kiến sẽ bắt đầu từ Tokyo rồi lan ra 10 thành phố trên thế giới."},{"q":"美しい映像と音楽（a とが　b とを）相まって、素晴らしい作品に仕上がった。","a":"とが","b":"とを","ans":"a","vi":"Hình ảnh đẹp kết hợp với âm nhạc đã tạo nên một tác phẩm tuyệt vời."},{"q":"担当者の対応のあまりのひどさに、怒り（a に　b を）禁じ得なかった。","a":"に","b":"を","ans":"b","vi":"Tôi không kìm được giận dữ trước thái độ tệ hại của người phụ trách."},{"q":"今日の駅前の人の多さ（a と　b を）いったらなかったよ。何かあったのかな。","a":"と","b":"を","ans":"a","vi":"Hôm nay trước ga đông người không thể tả nổi. Không biết có chuyện gì vậy nhỉ."},{"q":"やっとレポートが提出できた！　評価（a は　b も）どうあれ、期限内に出せてよかった。","a":"は","b":"も","ans":"a","vi":"Cuối cùng cũng nộp được báo cáo! Dù được đánh giá thế nào cũng mừng vì kịp hạn."},{"q":"A氏は国会議員（a と　b に）あるまじき発言をして、各方面から非難を浴びている。","a":"と","b":"に","ans":"b","vi":"Ông A đã có phát ngôn không xứng đáng với một nghị sĩ quốc hội, bị chỉ trích từ nhiều phía."}]},{"id":"t3","name":"集中トレーニング③助詞（3）","items":[{"q":"投票率が低いのは今回の選挙（a に　b を）限ったことではない。","a":"に","b":"を","ans":"a","vi":"Tỷ lệ bỏ phiếu thấp không chỉ riêng ở cuộc bầu cử lần này."},{"q":"私に買う気がない（a と　b を）みると、その店員は急に態度が悪くなった。","a":"と","b":"を","ans":"a","vi":"Thấy tôi không có ý định mua, người bán hàng đột nhiên thay đổi thái độ."},{"q":"この本は、内容（a は　b を）さておき、表紙のデザインがきれいなので、つい手に取りたくなる。","a":"は","b":"を","ans":"a","vi":"Cuốn sách này, tạm gác nội dung sang một bên, bìa sách đẹp đến mức khiến người ta muốn cầm lên xem."},{"q":"今日（a に　b を）限りに、木村さんとはもう会えなくなってしまう。","a":"に","b":"を","ans":"b","vi":"Từ hôm nay trở đi sẽ không còn gặp được anh Kimura nữa."},{"q":"他の人がいなくなったので、私はここぞ（a と　b に）ばかりに、彼女に話しかけた。","a":"と","b":"に","ans":"a","vi":"Vì không còn ai khác nên tôi đã nhân cơ hội đó bắt chuyện với cô ấy."},{"q":"チーム発足（a と　b に）先駆けて、公式ホームページを立ち上げた。","a":"と","b":"に","ans":"b","vi":"Họ đã lập trang web chính thức trước cả khi đội được thành lập."},{"q":"果物を買うならこの店（a に　b を）限る。なにより新鮮で値段も高くない。","a":"に","b":"を","ans":"a","vi":"Nếu mua trái cây thì chỉ nên mua ở tiệm này. Vừa tươi vừa không đắt."},{"q":"海外の友人が来る（a が　b と）あれば、いまからプランを立てていろいろなところを案内したい。","a":"が","b":"と","ans":"b","vi":"Nếu bạn ở nước ngoài đến chơi thì tôi muốn lên kế hoạch dẫn đi tham quan nhiều nơi."},{"q":"目標のベスト4（a が　b は）おろか、ベスト16にも入れなかった。","a":"が","b":"は","ans":"b","vi":"Đừng nói lọt vào top 4, ngay cả top 16 cũng không vào nổi."},{"q":"その話がショックだった（a が　b と）みえて、彼女は何も言わずに帰ってしまった。","a":"が","b":"と","ans":"b","vi":"Có vẻ chuyện đó khiến cô ấy sốc nên cô ấy đã về mà không nói gì."}]},{"id":"t4","name":"集中トレーニング④「こと」と「もの」","items":[{"q":"今のは見なかった（a こと　b もの）にしてください。","a":"こと","b":"もの","ans":"a","vi":"Xin hãy coi như chưa thấy chuyện vừa rồi."},{"q":"手術をせずに、どうにか薬で治せない（a こと　b もの）でしょうか。","a":"こと","b":"もの","ans":"b","vi":"Liệu có thể chữa khỏi bằng thuốc mà không cần phẫu thuật không?"},{"q":"そこまで言われれば、参加しない（a こと　b もの）でもないけれど、どうしようかなあ。","a":"こと","b":"もの","ans":"b","vi":"Nếu bị nói đến mức đó thì cũng không phải là không tham gia, nhưng phải làm sao đây."},{"q":"料理上手な松井さんの（a こと　b もの）だから、お子さんの誕生日にはごちそうをたくさん作るんでしょうね。","a":"こと","b":"もの","ans":"a","vi":"Vì là chị Matsui giỏi nấu ăn nên chắc sẽ làm nhiều món ngon cho sinh nhật con đấy."},{"q":"きちんと名前を書いて、他の人のと間違える（a こと　b もの）のないようにしてください。","a":"こと","b":"もの","ans":"a","vi":"Hãy ghi rõ tên để tránh nhầm lẫn với người khác."},{"q":"一度行ったことがあるとはいえ、地図を持っていくに越した（a こと　b もの）はない。","a":"こと","b":"もの","ans":"a","vi":"Dù đã từng đi một lần, mang theo bản đồ vẫn tốt hơn."},{"q":"ひとこと言ってくれたら、協力した（a こと　b もの）を。","a":"こと","b":"もの","ans":"b","vi":"Giá mà nói một tiếng thì tôi đã giúp rồi."},{"q":"賞与の支給については、当社の規定による（a こと　b もの）とする。","a":"こと","b":"もの","ans":"b","vi":"Về việc chi trả tiền thưởng sẽ áp dụng theo quy định của công ty."},{"q":"親にあれこれ言われたくなかったら、家を出て独立する（a こと　b もの）だね。","a":"こと","b":"もの","ans":"a","vi":"Nếu không muốn bị bố mẹ can thiệp thì hãy ra ở riêng đi."},{"q":"この1週間という（a こと　b もの）、忙しくてほとんど寝ていない。","a":"こと","b":"もの","ans":"b","vi":"Suốt 1 tuần nay, tôi bận đến mức gần như không ngủ."}]},{"id":"t5","name":"集中トレーニング⑤副詞（1）","items":[{"q":"めったに怒らない山本さんが、（a さすが　b さすがに）今回ばかりは怒りをあらわにした。","a":"さすが","b":"さすがに","ans":"b","vi":"Anh Yamamoto vốn hiếm khi nổi giận, vậy mà lần này lại thể hiện rõ sự tức giận."},{"q":"（a さすが　b さすがの）ダンサーだけあって、体が柔らかい。","a":"さすが","b":"さすがの","ans":"a","vi":"Đúng là vũ công có khác, cơ thể rất mềm dẻo."},{"q":"気をつけていたのに（a まさしく　b まんまと）だまされてしまった。","a":"まさしく","b":"まんまと","ans":"b","vi":"Dù đã cẩn thận vậy mà vẫn bị lừa ngon ơ."},{"q":"就職も決まらないのに（a ましてや　b またしても）結婚なんて、まだまだ先の話です。","a":"ましてや","b":"またしても","ans":"a","vi":"Công việc còn chưa ổn định mà đã nói đến chuyện kết hôn thì còn quá sớm."},{"q":"佐藤さんの娘さんなんですね。（a どうりで　b よほど）よく似ているわけだ。","a":"どうりで","b":"よほど","ans":"b","vi":"Ra là con gái anh Sato à. Thảo nào giống vậy."},{"q":"（a いざ　b さて）となったら私が責任をとりますから、安心してください。","a":"いざ","b":"さて","ans":"a","vi":"Khi thực sự cần thiết, tôi sẽ chịu trách nhiệm, anh/chị cứ yên tâm."},{"q":"その指輪が（a まさに　b よほど）気に入ったらしく、彼女は何度も指輪をした手を眺めていた。","a":"まさに","b":"よほど","ans":"b","vi":"Có vẻ cô ấy rất thích chiếc nhẫn đó nên cứ ngắm tay đeo nhẫn mãi."},{"q":"年長者は（a とかく　b いかにも）若い人のすることを批判しがちだ。","a":"とかく","b":"いかにも","ans":"a","vi":"Người lớn tuổi thường có xu hướng phê phán hành động của người trẻ."},{"q":"あの人の言うことも（a 一概に　b 一様に）否定できない。","a":"一概に","b":"一様に","ans":"a","vi":"Lời người đó nói cũng không thể phủ nhận hoàn toàn."},{"q":"この答えも（a あながち　b あやうく）間違いとは言えないんじゃないでしょうか。","a":"あながち","b":"あやうく","ans":"a","vi":"Câu trả lời này cũng không hẳn là sai đâu nhỉ."}]},{"id":"t6","name":"集中トレーニング⑥副詞（2）","items":[{"q":"（a どうせ　b どうも）優勝できないのなら、参加したって無駄だ。","a":"どうせ","b":"どうも","ans":"a","vi":"Đằng nào cũng không vô địch được thì tham gia cũng vô ích thôi."},{"q":"ボーっと考え事をしていて（a あいにく　b あやうく）ホームから落ちるところだった。","a":"あいにく","b":"あやうく","ans":"b","vi":"Đang mải suy nghĩ vẩn vơ nên suýt nữa ngã khỏi sân ga."},{"q":"（a てっきり　b めっきり）あの二人はつきあってるんだと思っていた。","a":"てっきり","b":"めっきり","ans":"a","vi":"Cứ đinh ninh là hai người đó đang hẹn hò."},{"q":"（a まさか　b かりに）その話が真実でも、私は彼女の友達であることをやめない。","a":"まさか","b":"かりに","ans":"b","vi":"Dù chuyện đó có là sự thật, tôi cũng sẽ không thôi làm bạn với cô ấy."},{"q":"あんなに練習したのに1回戦で負けてしまって、（a さぞ　b もしや）くやしかったことだろう。","a":"さぞ","b":"もしや","ans":"a","vi":"Tập luyện vất vả vậy mà thua ngay vòng đầu, chắc hẳn cô ấy rất tiếc nuối."},{"q":"（a どうせ　b どんなに）謝られても、今となってはもう遅いんです。","a":"どうせ","b":"どんなに","ans":"b","vi":"Dù có xin lỗi thế nào thì giờ cũng đã muộn rồi."},{"q":"（a たかが　b わずか）試験の順位が少し下がったくらいでそんなに落ち込むことはない。","a":"たかが","b":"わずか","ans":"a","vi":"Chỉ tụt vài hạng trong kỳ thi thôi mà, không cần phải buồn đến vậy."},{"q":"彼の欠場は、（a ただ　b むしろ）チームの問題のみならず、ファンの期待をも裏切ることになる。","a":"ただ","b":"むしろ","ans":"a","vi":"Việc anh ấy vắng mặt không chỉ là vấn đề của đội mà còn phụ lòng mong đợi của người hâm mộ."},{"q":"（a ろくに　b めったに）見もしないでマンションを買うなんて、信じられない。","a":"ろくに","b":"めったに","ans":"a","vi":"Không xem kỹ gì mà đã mua căn hộ, thật không thể tin nổi."},{"q":"そんなに動揺するということは、（a かりに　b もしや）彼は何か隠しているのではあるまいか。","a":"かりに","b":"もしや","ans":"b","vi":"Anh ấy hoang mang đến vậy, có lẽ đang giấu chuyện gì đó chăng."}]},{"id":"t7","name":"集中トレーニング⑦似ている表現（1）","items":[{"q":"うまくいったとは言えない（a ながらに　b ながらも）、なんとか質問に答えることだけはできた。","a":"ながらに","b":"ながらも","ans":"b","vi":"Tuy chưa thể nói là suôn sẻ, nhưng ít ra cũng trả lời được câu hỏi."},{"q":"その子は子ども（a なり　b なりに）、精一杯、母親を励ましているのだった。","a":"なり","b":"なりに","ans":"b","vi":"Đứa trẻ đó, theo cách của một đứa trẻ, đang cố hết sức động viên mẹ."},{"q":"弟が試合に出る（a とあって　b とあっては）、応援に行かないわけにはいかない。","a":"とあって","b":"とあっては","ans":"b","vi":"Em trai sẽ thi đấu nên không thể không đi cổ vũ."},{"q":"彼女は涙を流し（a ながら　b ながらに）、今までの苦労を話し始めた。","a":"ながら","b":"ながらに","ans":"a","vi":"Cô ấy vừa rơi nước mắt vừa bắt đầu kể về những vất vả đã trải qua."},{"q":"この金庫はいくら開けようとした（a ところで　b ところに）、このカードがなければ決して開くまい。","a":"ところで","b":"ところに","ans":"a","vi":"Dù có cố mở két sắt thế nào, nếu không có thẻ này thì chắc chắn không mở được."},{"q":"この子は生まれ（a ながらに　b ながらも）人の心を読む不思議な力を持っていた。","a":"ながらに","b":"ながらも","ans":"a","vi":"Đứa trẻ này từ khi sinh ra đã có khả năng kỳ lạ là đọc được lòng người."},{"q":"ただ座っていないで、少しは手伝う（a なり　b なりに）してほしい。","a":"なり","b":"なりに","ans":"a","vi":"Đừng chỉ ngồi không, hãy giúp một tay đi."},{"q":"勉強を始めようとした（a ところで　b ところに）友人から電話があり、出かけることになった。","a":"ところで","b":"ところに","ans":"b","vi":"Đúng lúc định học bài thì bạn gọi điện đến, thế là lại đi chơi mất."},{"q":"さすが世界大会（a とあって　b とあっては）、どの試合も目が離せない。","a":"とあって","b":"とあっては","ans":"a","vi":"Đúng là giải đấu thế giới, trận nào cũng không thể rời mắt."},{"q":"会う（a なり　b なりに）、年齢や職業を聞くなんて失礼だ。","a":"なり","b":"なりに","ans":"a","vi":"Vừa gặp đã hỏi tuổi với nghề nghiệp thì thật bất lịch sự."}]},{"id":"t8","name":"集中トレーニング⑧似ている表現（2）","items":[{"q":"家にある薬を飲んだら熱が下がったので、病院に行かずに（a すんだ　b すませた）。","a":"すんだ","b":"すませた","ans":"a","vi":"Uống thuốc ở nhà thì hạ sốt nên không cần phải đi bệnh viện."},{"q":"あの無神経な大臣が失言をしたことは、驚くには（a 至らない　b あたらない）。","a":"至らない","b":"あたらない","ans":"b","vi":"Việc vị bộ trưởng vô tâm đó lỡ lời cũng chẳng có gì đáng ngạc nhiên."},{"q":"わざわざ来て手伝ってもらうには（a 及ばない　b 至らない）。","a":"及ばない","b":"至らない","ans":"a","vi":"Không cần phải đến tận nơi giúp đỡ đâu."},{"q":"彼がこれまでした失敗を数え挙げれば（a 足りない　b きりがない）。","a":"足りない","b":"きりがない","ans":"b","vi":"Nếu kể hết những lần thất bại của anh ấy thì không bao giờ hết."},{"q":"一方的に責められたら、こちらも説明（a しそうもない　b しようがない）。","a":"しそうもない","b":"しようがない","ans":"b","vi":"Nếu bị trách một chiều thì bên này cũng chẳng biết giải thích sao nữa."},{"q":"入院中の同級生が早く快復することを願って（a すまない　b やまない）。","a":"すまない","b":"やまない","ans":"b","vi":"Mong bạn cùng lớp đang nằm viện sớm bình phục."},{"q":"関係者がどれほど悲しんでいるか、想像に（a 難くない　b やまない）。","a":"難くない","b":"やまない","ans":"a","vi":"Không khó để tưởng tượng những người liên quan đau buồn đến mức nào."},{"q":"どんな資格であれ、持っているに（a 及ばない　b 越したことはない）。","a":"及ばない","b":"越したことはない","ans":"b","vi":"Dù là bằng cấp gì, có vẫn tốt hơn không."},{"q":"ここまで話が進んでしまったらもう断り（a そうにない　b ようがない）。こうなったら引き受けるしかない。","a":"そうにない","b":"ようがない","ans":"b","vi":"Chuyện đã đến nước này rồi thì không thể từ chối được nữa. Đành phải nhận thôi."},{"q":"以上のように改善がなされたことから、今後は解決に向かうと（a 言えそう　b 言えよう）。","a":"言えそう","b":"言えよう","ans":"b","vi":"Như đã cải thiện ở trên, có thể nói tình hình sẽ tiến triển tốt trong thời gian tới."}]},{"id":"t9","name":"集中トレーニング⑨使役・受身","items":[{"q":"彼はいろいろ言い訳しているが、私に（a 言うと　b 言わせると）、準備が足りなかっただけだ。","a":"言うと","b":"言わせると","ans":"b","vi":"Anh ta bao biện đủ kiểu, nhưng theo tôi thấy thì chỉ là do chuẩn bị chưa kỹ thôi."},{"q":"本日は19時で営業を終了と（a して　b させて）いただきます。","a":"して","b":"させて","ans":"b","vi":"Hôm nay cửa hàng sẽ đóng cửa lúc 19 giờ."},{"q":"この仕事、彼に（a やって　b やらせて）みればうまく行くかもしれませんよ。","a":"やって","b":"やらせて","ans":"b","vi":"Việc này, nếu để anh ấy làm thử thì biết đâu lại ổn đấy."},{"q":"彼の巧みな技に、誰もが（a 驚かず　b 驚かれず）にはいられなかった。","a":"驚かず","b":"驚かれず","ans":"a","vi":"Trước kỹ thuật điêu luyện của anh ấy, ai cũng phải trầm trồ."},{"q":"この絵は人を感動（a せず　b させず）にはおかない何かを持っている。","a":"せず","b":"させず","ans":"b","vi":"Bức tranh này có sức mạnh khiến người xem không thể không xúc động."},{"q":"息子を大学に合格（a せん　b させん）がために、母親は必死だった。","a":"せん","b":"させん","ans":"b","vi":"Người mẹ đã cố gắng hết sức để con trai thi đỗ đại học."},{"q":"経営状況の悪化は、私達に計画の変更を余儀なく（a させた　b された）。","a":"させた","b":"された","ans":"a","vi":"Tình hình kinh doanh xấu đi buộc chúng tôi phải thay đổi kế hoạch."},{"q":"そんな大事なことをだまっていたなんて、笑い事では（a すませない　b すまされない）ぞ。","a":"すませない","b":"すまされない","ans":"b","vi":"Giấu chuyện quan trọng như vậy thì không thể cho qua như chuyện đùa được đâu."},{"q":"条件によっては、情報を（a 教えさせられない　b 教えてやらない）こともない。","a":"教えさせられない","b":"教えてやらない","ans":"b","vi":"Tùy điều kiện, cũng không phải là không thể tiết lộ thông tin."},{"q":"悪いんだけど、ちょっと（a 頼まれて　b 頼まされて）くれないか？","a":"頼まれて","b":"頼まされて","ans":"a","vi":"Phiền bạn một chút, giúp tôi việc này được không?"}]},{"id":"t10","name":"集中トレーニング⑩くり返しの文型","items":[{"q":"来る（X）来ない（X）、とにかく一度連絡をください。","a":"にせよ","b":"といわず","ans":"a","vi":"Dù đến hay không đến, dù sao cũng hãy liên lạc một lần."},{"q":"会員（X）非会員（X）、チケットの購入には予約が必要です。","a":"なり","b":"であれ","ans":"b","vi":"Dù là hội viên hay không phải hội viên, mua vé đều cần đặt trước."},{"q":"その本、もう読まないなら、捨てる（X）誰かにあげる（X）すれば？","a":"なり","b":"やら","ans":"a","vi":"Cuốn sách đó nếu không đọc nữa thì vứt đi hay cho ai đó cũng được mà?"},{"q":"弟は、テレビを見（X）ゲームをし、ゲームをし（X）テレビを見、という怠惰な生活を続けている。","a":"つ","b":"ては","ans":"b","vi":"Em trai cứ xem tivi rồi chơi game, chơi game rồi lại xem tivi, sống một cuộc sống lười biếng như vậy."},{"q":"母は、中華料理（X）フランス料理（X）、料理なら何でも作れる。","a":"とも","b":"といわず","ans":"b","vi":"Mẹ tôi nấu được đủ món, từ món Trung Hoa đến món Pháp."},{"q":"彼女はいつも彼のことが嫌い（X）もう別れる（X）言いながら、何年もつきあっている。","a":"だの","b":"といい","ans":"a","vi":"Cô ấy lúc nào cũng nói ghét anh ta, rồi đòi chia tay, vậy mà vẫn yêu nhau suốt mấy năm."},{"q":"あの二人はいつも抜き（X）抜かれ（X）しながら1位を争っている。","a":"つ","b":"ながら","ans":"a","vi":"Hai người đó lúc nào cũng giành nhau vị trí số 1, kẻ vượt lên người bị vượt qua liên tục."},{"q":"見てもいない映画の感想を聞かれても、いい（X）悪い（X）言いようがない。","a":"とも","b":"やら","ans":"a","vi":"Bị hỏi cảm nghĩ về bộ phim chưa từng xem thì biết nói hay hay dở thế nào."},{"q":"この店の料理は、味（X）見た目（X）、どこにも文句のつけようがないほどすばらしい。","a":"であれ","b":"といい","ans":"b","vi":"Món ăn của quán này cả hương vị lẫn hình thức đều không chê vào đâu được."},{"q":"嫌いな女優に似ていると言われ、喜んでいい（X）悲しんでいい（X）、複雑な心境だ。","a":"にせよ","b":"のやら","ans":"b","vi":"Bị nói là giống nữ diễn viên mình ghét, không biết nên vui hay buồn, tâm trạng thật phức tạp."}]}]};
