iên chính xuất hiện trên sân khấu, tiếng vỗ tay vang lên như muốn xé toạc cả khán phòng.","hint":"Thấy「割れ＿＿拍手」→ chọn んばかりの\n✔ V意向形ん＋ばかりの＋N =「như sắp...đến nơi」(cố định: 割れんばかりの拍手)"},{"q":"昔この地方で行われていた祭りを半世紀（　）復活させた。","o":["おきに","すぎに","ぶりに","ゆえに"],"a":3,"vi":"Họ đã khôi phục lại lễ hội từng được tổ chức ở vùng này sau nửa thế kỷ gián đoạn.","hint":"Thấy「半世紀＿＿復活」→ chọン ぶりに\n✔ 時間＋ぶりに =「sau...mới lại」(khoảng cách thời gian dài)\n✘ おきに = cách đều đặn định kỳ"},{"q":"おしゃべりな彼女に秘密でも（　）、たちまち学校中に広まってしまう。","o":["話すといったら","話そうものなら","話したらいざ知らず","話してからというもの"],"a":2,"vi":"Nếu lỡ kể bí mật cho cô ấy thì chuyện sẽ lan khắp trường ngay lập tức.","hint":"Thấy「秘密でも＿＿たちまち広まる」→ chọン 話そうものなら\n✔ V意向形＋ものなら =「nếu lỡ mà...thì (hậu quả nghiêm trọng)」"},{"q":"この映画は子ども向けの作品ながら、十分大人の鑑賞（　）ものだ。","o":["に至る","にたえる","に足りない","にあたらない"],"a":2,"vi":"Bộ phim này tuy là tác phẩm dành cho trẻ em nhưng cũng hoàn toàn xứng đáng để người lớn thưởng thức.","hint":"Thấy「子ども向けながら大人の鑑賞＿＿もの」→ chọん にたえる\n✔ V辞書形＋にたえる =「xứng đáng để...」(có đủ chất lượng)\n✘ に至る = đạt đến, nghĩa khác"},{"q":"結果は引き分け（　）、内容では圧倒的にAチームが勝っていたと思う。","o":["つつ","ながら","にひきかえ","にもまして"],"a":2,"vi":"So với kết quả hòa, nội dung trận đấu thì đội A áp đảo hơn hẳn.","hint":"Thấy「結果は引き分け＿＿内容ではAチームが勝っていた」→ chọン にひきかえ\n✔ N/S＋にひきかえ =「trái ngược với...」(đối lập hai vế rõ ràng)"},{"q":"その子は母親の顔を見る（　）泣き出した。","o":["なり","より","ゆえ","そばから"],"a":1,"vi":"Đứa bé vừa nhìn thấy mặt mẹ là òa khóc ngay.","hint":"Thấy「顔を見る＿＿泣き出した」→ chọン なり\n✔ V辞書形＋なり =「vừa mới...là ngay」(tức thì)\n✘ そばから = lặp đi lặp lại"},{"q":"郵便局員は毎日30キロ（　）道のりをバイクでやって来る。","o":["たる","ごとき","からある","ながらの"],"a":3,"vi":"Nhân viên bưu điện ngày nào cũng chạy xe máy đi quãng đường dài tới hơn 30km.","hint":"Thấy「30キロ＿＿道のり」→ chọン からある\n✔ 数量＋からある＋N =「tới hơn...」(số lượng lớn, nhấn mạnh)"},{"q":"この難しい手術ができるのは、渡辺先生（　）のものだ。","o":["限り","ぐらい","だけ","ならでは"],"a":2,"vi":"Chỉ có bác sĩ Watanabe mới làm được ca phẫu thuật khó này.","hint":"Thấy「渡辺先生＿＿のものだ」→ chọン ならでは\n✔ N＋ならでは（の） =「chỉ riêng...mới có」(đặc trưng độc nhất)\n✘ ぐらい = khoảng chừng"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"今後の方針は ___ ___ ★ ___ 、ホームページにて発表します。","o":["踏まえて","うえで","検討した","調査結果を"],"a":3,"order":[4,1,3,2],"vi_p2":"Phương hướng sắp tới sẽ được thông báo trên trang web sau khi dựa trên kết quả khảo sát để thảo luận."},{"q":"真冬にここから見える富士山の ___ ___ ★ ___ ほどだ。","o":["美しさ","がない","といったら","たとえよう"],"a":4,"order":[1,3,4,2],"vi_p2":"Vẻ đẹp của núi Phú Sĩ nhìn từ đây vào giữa mùa đông thật sự không có từ nào tả nổi."},{"q":"忙しいのは知っていたが、___ ___ ★ ___ 誘ってみることにした。","o":["だめで","だと思い","もともと","誘うだけ"],"a":2,"order":[1,3,2,4],"vi_p2":"Biết là bận nhưng nghĩ 'thử rủ coi sao', nên quyết định mời thử xem."},{"q":"文学新人賞を取り、これで ___ ___ ★ ___ 、それほどでもなかった。","o":["かと","売れる","本が","思いきや"],"a":1,"order":[3,2,1,4],"vi_p2":"Mới giành giải văn học tân nhân, cứ tưởng sách sẽ bán chạy, ai ngờ cũng không hơn là bao."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"どうしても時間がないと言う人でも、一日に15分くらいは捻出できるだろう。(中略)\n「時間がない」と嘆く前に、まずは一日15分間の勉強を始めてみる。なかには、時間が【1】できる勉強というのもある。\nたとえば、国語辞典の読書。国語辞典を一時間ぶっ続けで読むのは苦痛だが、一回五分で一日三回ずつくらいなら意外と面白く読めるものだ。\nある大学生は、新聞のコラムを毎日書き写すことを日課にしているという。A紙に掲載されている海外特派員が書いている200字程度のコラムだが、書き写し始めて一年近くになる。\n「時間【2】五分くらいのものですが、コラムというのは短いだけにまとめ方がうまいんです。だから、文章の勉強にもなるし、海外の情勢にも強くなる。【3】一石二鳥ですよ。五分なら休憩時間でもできますから、長続きできたんだと思います」\n新聞には良質のコラムがいくつもあるから、そのなかから毎日三本ずつ書き写していけば、きっと何かがつかめるはずだ。\n（本郷陽二著『頭がいい人の一日15分勉強法』経済界刊　※一部省略あり）","items":[{"label":"1","o":["短いながらも","短いからこそ","長いながらも","長いからこそ"],"a":2,"hint":"Dạng câu hỏi: Nhượng bộ (ながらも)\n\nQuan hệ A-B: A (thời gian ngắn) tuy vậy vẫn cho phép B (loại học có thể làm được) xảy ra — quan hệ nhượng bộ, không phải nhân quả.\n\n「時間が【1】できる勉強というのもある」→ chọn ① 短いながらも\n→ 短いながらも = 'dù (thời gian) ngắn' — khớp chủ đề bài (học 15 phút/ngày)\n\nchỗ này là bẫy\n\n✗ 短いからこそ = sai vì không tạo quan hệ nhân quả hợp lý ở đây (không phải VÌ ngắn nên học được, mà là DÙ ngắn vẫn học được)\n\n✗ 長いながらも/長いからこそ = sai hoàn toàn hướng nghĩa (chủ đề là thời gian NGẮN)","sentence":"なかには、時間が【1】できる勉強というのもある。"},{"label":"2","o":["にして","ときたら","によらず","に即して"],"a":1,"hint":"Dạng câu hỏi: Quy đổi mức độ (にして)\n\nQuan hệ A-B: A (thời gian) được quy đổi/tính ra chỉ còn B (khoảng 5 phút) — nhấn mạnh mức độ nhỏ của con số.\n\n「時間【2】五分くらいのもの」→ chọn ① にして\n→ Nにして = 'tính ra thì/xét về mặt...(chỉ là)' nhấn mạnh mức độ nhỏ của con số\n\nchỗ này là bẫy\n\n✗ ときたら = thường mang sắc thái than phiền — sai sắc thái\n\n✗ によらず = 'không phân biệt' — sai nghĩa\n\n✗ に即して = 'dựa theo, bám sát' — sai nghĩa","sentence":"「時間【2】五分くらいのものですが、コラムというのは短いだけにまとめ方がうまいんです。"},{"label":"3","o":["ただし","まさに","いかにも","すなわち"],"a":2,"hint":"Dạng câu hỏi: Khẳng định trực tiếp (まさに)\n\nQuan hệ A-B: A (vừa học viết văn vừa nắm tình hình quốc tế) được B (đánh giá là) 'đúng thật là một công đôi việc' — まさに nhấn mạnh khẳng định của người nói.\n\n「だから、文章の勉強にもなるし…【3】一石二鳥ですよ」→ chọn ② まさに\n→ まさに = 'đúng thật là' — nhấn mạnh khẳng định trực tiếp\n\nchỗ này là bẫy\n\n✗ ただし = 'tuy nhiên' — sai, tạo tương phản không hợp\n\n✗ いかにも = gần nghĩa nhưng thiên về ấn tượng bề ngoài 'trông có vẻ đúng', yếu hơn まさに ở đây\n\n✗ すなわち = 'tức là' (diễn giải lại) — sai vì 一石二鳥 là ĐÁNH GIÁ/KẾT LUẬN chứ không phải định nghĩa lại","sentence":"【3】一石二鳥ですよ。"}]}]},{"id":"r11","name":"第11回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"無口なご主人（　）、奥さんは明るくてよくしゃべる。","o":["とはいえ","にひきかえ","はまだしも","ではあるまいし"],"a":2,"vi":"Trái ngược với ông chồng ít nói, bà vợ lại vui vẻ và rất hay nói chuyện.","hint":"Thấy「無口なご主人＿＿奥さんは明るい」→ chọン にひきかえ\n✔ N＋にひきかえ =「trái ngược với...」(đối lập hai đối tượng rõ ràng)"},{"q":"出入り口につき、ここに車を止める（　）。","o":["ものか","に限る","べからず","までもない"],"a":3,"vi":"Vì là lối ra vào nên cấm đỗ xe ở đây.","hint":"Thấy「出入り口につき＿＿」→ chọン べからず\n✔ V辞書形＋べからず =「cấm không được...」(biển báo, quy định cứng)\n✘ に限る = tốt nhất là (gợi ý)"},{"q":"仕事がたまり、ここ数週間（　）残業続きだ。","o":["といえず","ともなく","というもの","といえども"],"a":3,"vi":"Công việc dồn lại nên mấy tuần nay cứ phải tăng ca liên tục.","hint":"Thấy「ここ数週間＿＿残業続き」→ chọン というもの\n✔ 期間＋というもの =「suốt khoảng thời gian...」(nhấn mạnh thời gian liên tục)"},{"q":"お世話になった方に、ご挨拶（　）結婚を報告する手紙を書いた。","o":["ながら","かたがた","のかたわら","のかわりに"],"a":2,"vi":"Tôi đã viết thư báo tin kết hôn, nhân tiện gửi lời cảm ơn người đã giúp đỡ mình.","hint":"Thấy「ご挨拶＿＿結婚を報告」→ chọン かたがた\n✔ N＋かたがた =「nhân tiện kết hợp (2 mục đích)」(trang trọng)\n✘ のかたわら = hoạt động song song dài hạn"},{"q":"事件後、その工場の不衛生（　）実態が明らかになった。","o":["極まる","に限る","並みの","に足る"],"a":1,"vi":"Sau vụ việc, thực trạng mất vệ sinh đến cực điểm của nhà máy đó đã bị phơi bày.","hint":"Thấy「不衛生＿＿実態」→ chọン 極まる\n✔ な形語幹＋極まる（な形容詞化） =「cực kỳ...」(cố định: 不衛生極まる実態)"},{"q":"災害発生当時は混乱した状況（　）、情報が正確に伝わらなかった。","o":["ならでは","にあって","によって","をもって"],"a":2,"vi":"Lúc thiên tai xảy ra, trong tình trạng hỗn loạn nên thông tin không được truyền đạt chính xác.","hint":"Thấy「混乱した状況＿＿情報が伝わらなかった」→ chọン にあって\n✔ N＋にあって =「trong hoàn cảnh/tình huống...」\n✘ をもって = bằng phương tiện/mốc thời gian"},{"q":"市民の協力により、ついに犯人を逮捕する（　）。","o":["始末だ","にあたった","に至った","に及んだ"],"a":3,"vi":"Nhờ sự hợp tác của người dân, cuối cùng họ đã bắt được hung thủ.","hint":"Thấy「ついに犯人を逮捕する＿＿」→ chọン に至った\n✔ V辞書形＋に至った =「đã đi đến mức/giai đoạn」(đạt được kết quả sau quá trình)"},{"q":"現在の政治体制が続けば、いずれ暴動が（　）だろう。","o":["起きるに足りない","起きないもの","起きないではすまない","起きるまい"],"a":3,"vi":"Nếu thể chế chính trị hiện nay cứ tiếp diễn, sớm muộn gì bạo loạn cũng sẽ xảy ra.","hint":"Thấy「いずれ暴動が＿＿だろう」→ chọン 起きるまい\n✔ V辞書形＋まい =「chắc sẽ không...」(phủ định suy đoán, văn viết)\n✘ 起きないものだろう = cầu mong không xảy ra"},{"q":"空港に集まったファンたちは、声を（　）その歌手の名を叫んでいた。","o":["限りに","重ねて","極めて","ものともせず"],"a":1,"vi":"Đám fan tụ tập ở sân bay đã gào hết cỡ tên ca sĩ đó.","hint":"Thấy「声を＿＿叫んでいた」→ chọン 限りに\n✔ 声を限りに = cụm cố định「hét to hết cỡ」"},{"q":"曲がり角を一本間違えた（　）大幅に遅刻してしまった。","o":["ものを","からこそ","ばかりに","だけあって"],"a":3,"vi":"Chỉ vì đi nhầm một ngã rẽ mà tôi đã bị trễ giờ rất nhiều.","hint":"Thấy「一本間違えた＿＿大幅に遅刻」→ chọン ばかりに\n✔ Vた形＋ばかりに =「chỉ vì...mà (dẫn đến hậu quả xấu)」\n✘ だけあって = kết quả tương xứng (tích cực)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"昨日は疲れ果ててベッドに ___ ___ ★ ___ 眠ってしまった。","o":["が","倒れこむ","早いか","あっという間に"],"a":3,"order":[2,1,3,4],"vi_p2":"Hôm qua mệt quá, vừa ngã lưng xuống giường là đã ngủ thiếp đi trong nháy mắt."},{"q":"病院が嫌いな父は、病院に行く ___ ___ ★ ___ ましだとまで言う。","o":["死んだ","なら","くらい","ほうが"],"a":1,"order":[3,2,1,4],"vi_p2":"Bố ghét bệnh viện, ông ấy còn nói thà chết còn hơn phải đến bệnh viện."},{"q":"彼はなにごとも ___ ___ ★ ___ きらいがある。","o":["判断が","すぎて","遅れる","考え"],"a":1,"order":[4,2,1,3],"vi_p2":"Anh ấy có xu hướng suy nghĩ quá nhiều mọi việc nên ra quyết định thường chậm."},{"q":"原作の小説 ___ ___ ★ ___ 、映画版もなかなかおもしろかった。","o":["も","及ばない","には","ながら"],"a":4,"order":[3,2,4,1],"vi_p2":"Tuy không sánh được bằng tiểu thuyết gốc, nhưng bản phim cũng khá hay."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"ある時期を境に、兄は父を避けるようになった。当の父はとくに気にしていない素振りを見せていたが、母は何度も心配して私に相談してきた。私【1】、兄は父のことを嫌っていたわけではない。いや、【2】、私以上に父のことを尊敬していたように思う。\n思えば、父は昔から厳しい人だった。家族に対しても、部下に対しても、そして何より、自分に厳しい人だった。田舎から上京して一代で会社を築いただけあって、いつもギラギラと獲物を狙う獣のような鋭さがあった。\n【3】私が5年生ぐらいのことだったかと思う。兄と二人で留守番をしているとき、正月すら家に帰ってこない父の文句を私がこぼすと、兄は、「誰のおかげで飯が食えると思ってるんだ！」と、顔を真っ赤にして私を怒鳴りつけたのだ。まさかそんな反応が返ってくるとは思ってもいなかったので、私は驚いて泣き出してしまった。このときのことは、父も母も知らない。","items":[{"label":"1","o":["なりに","が思うに","とすると","ならいざ知らず"],"a":2,"hint":"Dạng câu hỏi: Mở đầu ý kiến cá nhân (が思うに)\n\nQuan hệ A-B: A (tôi) là chủ thể phát biểu quan điểm cho B (anh trai không ghét bố) — 私が思うに mở đầu nhận định chủ quan.\n\n「私【1】、兄は父のことを嫌っていたわけではない」→ mở đầu ý kiến cá nhân → chọn ② が思うに\n→ 私が思うに = 'theo tôi nghĩ thì'\n\nchỗ này là bẫy\n\n✗ なりに = 'theo cách riêng của...' — không khớp nghĩa 'theo tôi nghĩ', なりに đi với hành động/cách làm chứ không phải quan điểm mở đầu câu\n\n✗ とすると = 'nếu như vậy thì' (giả định) — sai nghĩa hoàn toàn\n\n✗ ならいざ知らず = cần 2 đối tượng so sánh tương phản, ở đây chỉ có 1 → sai","sentence":"私【1】、兄は父のことを嫌っていたわけではない。"},{"label":"2","o":["それどころか","それに限らず","それにもかかわらず","それにもまして"],"a":1,"hint":"Dạng câu hỏi: Đảo ngược kỳ vọng (それどころか)\n\nQuan hệ A-B: A (không ghét bố — phủ định nhẹ) bị LẬT NGƯỢC hoàn toàn thành B (tôn trọng hơn cả tôi — khẳng định mạnh) — それどころか nhấn sự đảo chiều bất ngờ.\n\n「いや、【2】、私以上に父のことを尊敬していたように思う」→ đảo ngược từ 'không ghét' thành 'tôn trọng hơn cả tôi' → chọn ① それどころか\n→ それどころか = 'không những thế mà ngược lại còn...' — nhấn mạnh sự đảo ngược/tăng cấp bất ngờ\n\nchỗ này là bẫy\n\n✗ それに限らず = sai nghĩa, không hợp mạch đảo ngược\n\n✗ それにもかかわらず = 'dù vậy' (nhượng bộ) — sai, 2 câu không phải quan hệ nhượng bộ\n\n✗ それにもまして = tăng cấp thuần túy, yếu hơn それどころか (thiếu yếu tố 'lật ngược kỳ vọng' từ phủ định sang khẳng định mạnh)","sentence":"いや、【2】、私以上に父のことを尊敬していたように思う。"},{"label":"3","o":["あれが確か","あれが確かに","あれは確か","あれは確かに"],"a":3,"hint":"Dạng câu hỏi: Phân biệt phó từ 確か / 確かに\n\nQuan hệ A-B: A (mở đầu hồi tưởng, は) đi với 確か (phó từ 'hình như') để khớp B (かと思う: chỉ là ước đoán, không chắc chắn) — 確かに (khẳng định chắc chắn) sẽ mâu thuẫn với B.\n\n「【3】私が5年生ぐらいのことだったかと思う」→ mở đầu hồi tưởng + かと思う (không chắc chắn) → chọn ③ あれは確か\n→ あれは確か = 'cái đó, chắc là...' (は mở đầu chủ đề hồi ức + 確か phó từ 'hình như' khớp かと思う)\n\nchỗ này là bẫy\n\n✗ あれが確か = dùng が (nhấn mạnh chủ ngữ) không tự nhiên bằng は khi mở đầu đoạn hồi ức\n\n✗ あれが確かに/あれは確かに = 確かに (khẳng định chắc chắn) MÂU THUẪN với かと思う (chỉ là ước đoán) ở cuối câu — đây là điểm ngữ pháp tinh tế cần phân biệt 確か (hình như) và 確かに (đúng là)","sentence":"【3】私が5年生ぐらいのことだったかと思う。"}]}]},{"id":"r12","name":"第12回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"そのビルの建設に周辺住民が反対することは、想像（　）。","o":["の限りだ","に及ばない","に難くない","してやまない"],"a":3,"vi":"Việc người dân xung quanh phản đối xây tòa nhà đó cũng dễ hiểu thôi.","hint":"Thấy「反対することは、想像＿＿」→ chọン に難くない\n✔ V辞書形＋に難くない =「không khó để (tưởng tượng/hiểu)」(cố định với: 想像・理解・推測)"},{"q":"何十年も前の古いルールは、現状（　）改正すべきだと思う。","o":["に即して","につれて","にひきかえ","とあれば"],"a":1,"vi":"Tôi nghĩ những quy định cũ từ mấy chục năm trước nên được sửa đổi cho phù hợp với tình hình hiện tại.","hint":"Thấy「現状＿＿改正すべき」→ chọン に即して\n✔ N＋に即して =「bám sát/dựa theo...」(theo sát tiêu chuẩn/thực tế)\n✘ を踏まえて = dựa trên kết quả/dữ liệu đã có"},{"q":"材料がない（　）なんとか工夫して、日本でも自国の料理を作っています。","o":["うえに","ことに","なりに","ところが"],"a":3,"vi":"Dù không có nguyên liệu, họ vẫn cố gắng xoay xở theo cách riêng để làm món ăn quê hương ngay tại Nhật.","hint":"Thấy「材料がない＿＿工夫して作っている」→ chọン なりに\n✔ N/V普通形＋なりに =「theo cách riêng phù hợp với hoàn cảnh...」"},{"q":"渋滞しているといっても遠くはないので、到着まで3,40分（　）でしょう。","o":["いかん","どころ","というもの","といったところ"],"a":4,"vi":"Tuy có tắc đường nhưng không xa lắm, nên ước chừng 30-40 phút nữa là tới.","hint":"Thấy「到着まで3,40分＿＿でしょう」→ chọン といったところ\n✔ 〜といったところ（だ） =「chỉ ở mức khoảng...thôi」(ước lượng nhẹ)"},{"q":"どんなことがあっても、患者の命だけは（　）。","o":["守りかねない","守らねばならない","守らざるを得ない","守らないことはない"],"a":2,"vi":"Dù có chuyện gì xảy ra, mạng sống của bệnh nhân là điều bắt buộc phải bảo vệ.","hint":"Thấy「どんなことがあっても、患者の命だけは＿＿」→ chọン 守らねばならない\n✔ V否定ね＋ばならない =「bắt buộc phải...」(nghĩa vụ mạnh)"},{"q":"この島のお年寄りたちの笑顔は穏やかなこと（　）。","o":["極まる","それまでだ","禁じ得ない","このうえない"],"a":4,"vi":"Nụ cười hiền hòa của các cụ già trên đảo này thật không gì sánh bằng.","hint":"Thấy「穏やかなこと＿＿」→ chọン このうえない\n✔ 〜こと＋このうえない =「...đến mức không gì hơn được」(cực độ tích cực)"},{"q":"君の実力をもってすれば、あの選手など恐れるに（　）。","o":["至らない","たえない","足りない","難くない"],"a":3,"vi":"Với thực lực của bạn, đối thủ đó chẳng đáng sợ chút nào.","hint":"Thấy「あの選手など恐れるに＿＿」→ chọン 至らない（足りない）\n✔ V辞書形＋に足りない =「không đáng để...」(không có giá trị/tư cách)\n✘ たえない = không chịu nổi (cảm giác)"},{"q":"彼女の英語は、わずかに発音のくせ（　）、ほぼ完ぺきなものだ。","o":["にせよ","こそあれ","こそすれ","にしたって"],"a":2,"vi":"Tiếng Anh của cô ấy chỉ hơi có chút giọng địa phương thôi, còn lại gần như hoàn hảo.","hint":"Thấy「発音のくせ＿＿ほぼ完ぺきなものだ」→ chọン こそあれ\n✔ 〜こそあれ〜ない =「tuy có...nhưng không (điều tiêu cực)」"},{"q":"新商品がヒットしたおかげで、あの会社は倒産に（　）すんだ。","o":["よらず","至らずに","及ばずに","とどまらず"],"a":2,"vi":"Nhờ sản phẩm mới bán chạy mà công ty đó đã thoát khỏi nguy cơ phá sản.","hint":"Thấy「倒産に＿＿すんだ」→ chọン 至らずに\n✔ V辞書形＋に至らずに =「mà không đến mức (kết quả xấu)」"},{"q":"そんなことはここではよくあることで、驚く（　）。","o":["べからず","わけではない","にはあたらない","に越したことはない"],"a":3,"vi":"Chuyện đó ở đây vốn thường xảy ra, chẳng có gì đáng ngạc nhiên cả.","hint":"Thấy「驚く＿＿」→ chọン にはあたらない\n✔ V辞書形＋にはあたらない =「không đáng phải (ngạc nhiên)」(phủ nhận mức độ cần thiết)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"妻は一度ふとんに入った ___ ___ ★ ___ と絶対に目を覚まさない。","o":["何が","が","あろう","最後"],"a":1,"order":[2,4,1,3],"vi_p2":"Vợ tôi mà đã chui vào chăn rồi thì dù có gì xảy ra cũng tuyệt đối không thức dậy nữa."},{"q":"火を使う際は、___ ___ ★ ___ 十分気をつけてください。","o":["ように","たりとも","一瞬","目を離さない"],"a":4,"order":[3,2,4,1],"vi_p2":"Khi dùng lửa, hãy chú ý thật kỹ, đừng rời mắt dù chỉ một giây."},{"q":"言葉の使い方を間違えていた ___ ___ ★ ___ ことを言ってしまった。","o":["ない","失礼","極まり","ばかりに"],"a":3,"order":[4,2,3,1],"vi_p2":"Chỉ vì dùng từ sai mà đã nói ra những điều thô lỗ cực kỳ."},{"q":"この山のような資料、いつ ___ ___ ★ ___ 。","o":["こと","読み終わる","になったら","やら"],"a":1,"order":[3,2,1,4],"vi_p2":"Đống tài liệu như núi này, không biết đến bao giờ mới đọc xong được đây."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"ダイエットによる減量には、思わぬ落とし穴もまっている。ダイエットに失敗したときが怖いのである。\nダイエットだけでやせると、体脂肪と同時に、【1】筋肉もおちていく。そこでダイエットをやめると、運動をしていないために筋肉がやせたまま、脂肪だけがもとにもどる。これをくりかえしていくうちに、【2-a】はへらずに【2-b】だけが相対的に衰えていくという恐ろしい状態におちいる。\n体重をおとすのは大事業であり、大変な体力と気力がいる。このような状態になってもう一度ダイエットに挑戦するために必要な筋肉まで失っては、二度とやせることができなくなってしまう。体重はさらにふえ、高齢者ではそのまま寝たきりとなってしまう人もいる。\nこれが、一般にリバウンドとよばれる現象である。リバウンドは、単に体重が【3】という点に注意したい。\n（岡田正彦著『人はなぜ太るのか―肥満を科学する』岩波書店刊）","items":[{"label":"1","o":["多かれ少なかれ","多からず少なからず","多くても少なくても","多かろうが少なかろうが"],"a":1,"hint":"Dạng câu hỏi: Thành ngữ cố định (多かれ少なかれ)\n\nQuan hệ A-B: Không phải quan hệ A-B mà là thành ngữ cố định 'ít nhiều, dù nhiều hay ít' — học thuộc nguyên cụm, không biến đổi.\n\n「体脂肪と同時に、【1】筋肉もおちていく」→ thành ngữ cố định → chọn ① 多かれ少なかれ\n→ 多かれ少なかれ = 'ít nhiều, dù nhiều hay ít' (thành ngữ cố định, học thuộc, không biến đổi)\n\nchỗ này là bẫy\n\n✗ 多からず少なからず = 'không nhiều không ít' (nghĩa khác hẳn) — sai\n\n✗ 多くても少なくても/多かろうが少なかろうが = không phải thành ngữ chuẩn cho ngữ cảnh này","sentence":"ダイエットだけでやせると、体脂肪と同時に、【1】筋肉もおちていく。"},{"label":"2","o":["a 体重／b 脂肪","a 体重／b 筋肉","a 筋肉／b 体重","a 脂肪／b 体重"],"a":2,"hint":"⚠️ CẦN ĐỐI CHIẾU LẠI VỚI SÁCH GỐC: dữ liệu cho đáp án ③ 筋肉／体重, nhưng suy luận từ logic đoạn văn (chu kỳ yo-yo: mỗi lần dừng ăn kiêng chỉ có MỠ quay lại, CƠ không hồi phục) gợi ý cặp đúng về ngữ nghĩa nên là 'a=脂肪(mỡ không giảm ròng qua nhiều chu kỳ)/b=筋肉(cơ cứ yếu dần)' — không khớp với bất kỳ đáp án nào trong 4 lựa chọn đã cho. Có thể nguồn gốc (sách 岡田正彦『人はなぜ太るのか』) có bản in khác, hoặc dữ liệu trích xuất có sai sót. KHÔNG dùng câu này để học tủ — nên tìm đoạn gốc trong sách để xác minh trước khi ôn.","sentence":"これをくりかえしていくうちに、【2-a】はへらずに【2-b】だけが相対的に衰えていくという恐ろしい状態におちいる。"},{"label":"3","o":["もとにもどるだけである","もとにもどるだけではない","もとにもどらないだけである","もとにもどらないだけではない"],"a":2,"hint":"Dạng câu hỏi: Phủ định một phần, nhấn luận điểm chính (だけではない)\n\nQuan hệ A-B: A (rebound chỉ đơn thuần là quay lại mức cũ) bị phủ định để khẳng định B (còn TỆ HƠN — tỷ lệ cơ giảm) là luận điểm chính của cả bài.\n\n「リバウンドは、単に体重が【3】という点に注意したい」→ khớp luận điểm chính (rebound không chỉ là quay lại, mà TỆ HƠN) → chọn ② もとにもどるだけではない\n→ もとにもどるだけではない = 'không chỉ đơn thuần là quay lại mức cũ' (mà còn kèm vấn đề nghiêm trọng hơn — tỷ lệ cơ giảm)\n\nchỗ này là bẫy\n\n✗ もとにもどるだけである = phủ nhận luận điểm chính của cả bài — sai\n\n✗ もとにもどらない... (2 đáp án còn lại) = sai hướng nghĩa hoàn toàn (bài nói CÓ quay lại, kèm theo vấn đề, không phải KHÔNG quay lại)","sentence":"リバウンドは、単に体重が【3】という点に注意したい。"}]}]},{"id":"r13","name":"第13回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"大臣が記者会見で突然、本日（　）辞任すると発表した。","o":["が最後","に限って","をもって","を皮切りに"],"a":3,"vi":"Trong buổi họp báo, bộ trưởng bất ngờ tuyên bố sẽ từ chức ngay hôm đó.","hint":"Thấy「本日＿＿辞任すると発表した」→ chọン をもって\n✔ 本日をもって =「lấy hôm nay làm mốc (kết thúc)」(cố định: 〜をもって終了/辞任)"},{"q":"親が留学を許してくれないなら、黙って行く（　）。","o":["ことか","ほどだ","までだ","ものか"],"a":3,"vi":"Nếu bố mẹ không cho đi du học thì tôi cũng sẽ lén đi thôi (làm sao mà chịu im lặng được).","hint":"Thấy「黙って行く＿＿」= thể hiện quyết tâm/phản kháng → chọン までだ\n✔ V辞書形＋までだ =「chỉ còn cách...thôi」(giải pháp duy nhất còn lại)\n✘ ものか = tuyệt đối không (phủ nhận cảm xúc)"},{"q":"この番組では、（　）深海の世界を美しい映像とともにご紹介します。","o":["知りぬく","知られざる","知りかねる","知られがちな"],"a":2,"vi":"Chương trình này sẽ giới thiệu thế giới biển sâu chưa từng được biết đến qua những thước phim đẹp.","hint":"Thấy「＿＿深海の世界」→ chọン 知られざる\n✔ Vれ＋ざる＋N =「chưa được...」(phủ định văn viết: 知られざる = chưa được biết đến)"},{"q":"日が長くなり、すっかり春（　）きましたね。","o":["びて","めいて","げになって","がちになって"],"a":2,"vi":"Ngày dài ra, đã thấy rõ không khí mùa xuân rồi nhỉ.","hint":"Thấy「すっかり春＿＿きましたね」→ chọン めいて\n✔ N＋めいて =「mang dáng dấp/khí vị của...」(cố định: 春めいて = mang hơi xuân)"},{"q":"日本語は文法の難しさ（　）、漢字が多くて大変だ。","o":["と思いきや","にひきかえ","に先駆けて","もさることながら"],"a":4,"vi":"Tiếng Nhật không chỉ ngữ pháp khó mà chữ Hán còn nhiều, rất vất vả.","hint":"Thấy「文法の難しさ＿＿漢字が多い」→ chọン もさることながら\n✔ N＋もさることながら =「...đã đành (đương nhiên), nhưng còn (thêm điều khác)」"},{"q":"この活動が社会に認められたことは、まことに喜び（　）。","o":["にたえません","にたりません","にあたりません","にかたくありません"],"a":1,"vi":"Việc hoạt động này được xã hội công nhận thật khiến tôi vô cùng vui mừng.","hint":"Thấy「喜び＿＿」cảm xúc tích cực mạnh → chọン にたえません\n✔ N＋にたえません =「không kìm được (niềm vui/xúc động)」(trang trọng)"},{"q":"相手（　）悪気はなかったんだから、もう許してあげなよ。","o":["ったら","あっての","であれ","にしたって"],"a":4,"vi":"Đối phương cũng đâu có ác ý gì, thôi thì tha thứ cho người ta đi.","hint":"Thấy「相手＿＿悪気はなかった」→ chọン にしたって\n✔ N＋にしたって =「dù là...cũng」(khẩu ngữ của にしても)\n✘ であれ = văn viết/trang trọng hơn"},{"q":"眼鏡（　）コンタクト（　）、長時間の使用は目に負担がかかる。","o":["であれ／であれ","だに／だに","につけ／につけ","なり／なり"],"a":1,"vi":"Dù là kính mắt hay kính áp tròng, đeo lâu cũng gây hại cho mắt.","hint":"Thấy「眼鏡＿＿コンタクト＿＿長時間の使用は」→ chọン であれ〜であれ\n✔ N1であれN2であれ =「dù là N1 hay N2...」(liệt kê điều kiện bất kỳ)"},{"q":"その店へは一度行っただけで、場所（　）店の名前も忘れてしまった。","o":["はおろか","ばかりに","はさておき","からして"],"a":1,"vi":"Chỉ đến cửa hàng đó đúng một lần nên đừng nói địa chỉ, ngay cả tên cửa hàng tôi cũng quên mất rồi.","hint":"Thấy「場所＿＿店の名前も忘れた」→ chọン はおろか\n✔ N＋はおろか =「đừng nói là...」(mức thấp hơn cũng không, nghiêm trọng hơn)"},{"q":"兄は教師として働く（　）、小説を書き続けている。","o":["うちに","がてら","かたわら","ついでに"],"a":3,"vi":"Anh trai vừa làm giáo viên vừa tiếp tục viết tiểu thuyết.","hint":"Thấy「教師として働く＿＿小説を書き続けている」→ chọン かたわら\n✔ N/Vの＋かたわら =「vừa...vừa (song song dài hạn)」\n✘ がてら = nhân tiện (một lần, ngắn hạn)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"合否 ___ ___ ★ ___ 、面接の結果はメールで連絡されるそうだ。","o":["に","の","かかわらず","いかん"],"a":1,"order":[2,4,1,3],"vi_p2":"Dù kết quả thế nào thì nghe nói kết quả phỏng vấn sẽ được thông báo qua email."},{"q":"5年間 ___ ___ ★ ___ も大変だ。","o":["もの","準備","となると","海外勤務"],"a":3,"order":[1,4,3,2],"vi_p2":"Năm năm công tác nước ngoài thì việc chuẩn bị cũng rất vất vả."},{"q":"商品の欠陥は利用者の安全にかかわる ___ ___ ★ ___ すまないだろう。","o":["公表せず","だけに","には","問題"],"a":1,"order":[4,2,1,3],"vi_p2":"Sản phẩm có khuyết điểm liên quan đến an toàn người dùng thì không thể không công bố."},{"q":"簡単な漢字 ___ ___ ★ ___ 自分がいやになる。","o":["覚える","忘れてしまう","すら","そばから"],"a":4,"order":[3,1,4,2],"vi_p2":"Ngay cả chữ Hán đơn giản cũng vừa nhớ xong là quên ngay, thật bực mình với bản thân."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"世の中には「偶然は必然だ」と言う人もいるだろうし「偶然なんてただの偶然でしかない」と言う人もいるだろう。でも、ふと今まで歩いてきた道のりを振り返ると、偶然は起こるべくして起きたのかもしれないと【1】。何かがあったから、その次の何かに繋がってゆくこと。たとえ、その時には嫌な経験でも、それを体験したからこそ次の新しい段階や出会いに繋がる事もある。もしくは、その経験を【2】、その後まったく同じ物事や人に出会っても、自分の心がそれを見逃して素通りしてしまうかもしれない。\n尊敬するある大人が教えてくれた。\n「自分の所へやってきた出来事を、自分がきちんとキャッチできずに通り越してしまったら、その人にとってその出来事は全く【3】よ」\nすぐにはその意味がよくわからなかったけれど、最近少しその意味が体感できるようになった気がする。\n（小澤征良著『そら いろいろ』新潮社刊）","items":[{"label":"1","o":["思わない方がいい","思うべきではない","思わずにいられない","思うとは限らない"],"a":3,"hint":"Dạng câu hỏi: Cảm xúc trào ra tự nhiên (~ずにいられない)\n\nQuan hệ A-B: A (sự tình cờ có thể xảy ra tất yếu) khiến B (người viết) không thể không nghĩ như vậy — cảm xúc tự nhiên, không cưỡng lại được.\n\n「偶然は起こるべくして起きたのかもしれないと【1】」→ cảm xúc trào ra tự nhiên → chọn ③ 思わずにいられない\n→ 思わずにいられない = 'không thể không nghĩ' (cảm xúc tự nhiên, không kìm được)\n\nchỗ này là bẫy\n\n✗ 思わない方がいい = 'tốt hơn là không nên nghĩ' — sai, đảo ngược khuyến nghị\n\n✗ 思うべきではない = 'không nên nghĩ' (nghĩa vụ đạo đức) — sai sắc thái\n\n✗ 思うとは限らない = 'không hẳn là nghĩ' — phủ định nhẹ, không khớp cảm xúc mạnh","sentence":"でも、ふと今まで歩いてきた道のりを振り返ると、偶然は起こるべくして起きたのかもしれないと【1】。"},{"label":"2","o":["しないからこそ","していなければ","していないから","していないにせよ"],"a":2,"hint":"Dạng câu hỏi: Điều kiện giả định phủ định (~ていなければ)\n\nQuan hệ A-B: A (nếu KHÔNG trải nghiệm điều đó — giả định) dẫn đến B (sau này gặp lại có thể bỏ lỡ, lướt qua).\n\n「もしくは、その経験を【2】、その後…見逃して素通りしてしまうかもしれない」→ điều kiện giả định phủ định → chọn ② していなければ\n→ していなければ = 'nếu không (trải nghiệm)...' (giả định)\n\nchỗ này là bẫy\n\n✗ しないからこそ = nguyên nhân đã xảy ra, không phải giả định — sai\n\n✗ していないから = nguyên nhân đơn thuần, thiếu tính giả định của ば\n\n✗ していないにせよ = nhượng bộ 'dù không...' — sai, câu này không phải nhượng bộ","sentence":"もしくは、その経験を【2】、その後まったく同じ物事や人に出会っても、自分の心がそれを見逃して素通りしてしまうかもしれない。"},{"label":"3","o":["起こらなくて当然なんだ","起こらなくても仕方ないんだ","起こらなかったも同然なんだ","起こらなかったことにするんだ"],"a":3,"hint":"Dạng câu hỏi: So sánh tương đương (も同然)\n\nQuan hệ A-B: A (sự việc bị bỏ lỡ, không nắm bắt được) được B coi là 'cũng như là chưa từng xảy ra' — も同然 mang tính khách quan, không chủ động phủ nhận.\n\n「自分がきちんとキャッチできずに通り越してしまったら、その出来事は全く【3】よ」→ chọn ③ 起こらなかったも同然なんだ\n→ も同然だ = 'cũng như là, tương đương với' — 'coi như chưa từng xảy ra' (khách quan, do bỏ lỡ)\n\nchỗ này là bẫy\n\n✗ 起こらなくて当然なんだ = 'đương nhiên là không xảy ra' — sai nghĩa (không phải nói về tính đương nhiên)\n\n✗ 起こらなくても仕方ないんだ = 'dù không xảy ra cũng đành chịu' — sai nghĩa hoàn toàn\n\n✗ 起こらなかったことにするんだ = 'CHỦ ĐỘNG coi như không xảy ra' — sai vì も同然 mang tính khách quan, không chủ động phủ nhận","sentence":"「自分の所へやってきた出来事を、自分がきちんとキャッチできずに通り越してしまったら、その人にとってその出来事は全く【3】よ」\nすぐにはその意味がよくわからなかったけれど、最近少しその意味が体感できるようになった気がする。"}]}]},{"id":"r14","name":"第14回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"いかに疲れて（　）、お客様の前では笑顔を忘れないように。","o":["いつつも","いながらも","いようとも","いようにも"],"a":3,"vi":"Dù có mệt đến đâu, cũng đừng quên nụ cười trước mặt khách hàng.","hint":"Thấy「いかに疲れて＿＿笑顔を忘れない」→ chọン いながらも\n✔ いかに〜ようとも/〜ながらも =「dù có...đến mấy đi nữa」\n✘ いようとも cũng đúng nhưng「いながらも」tự nhiên hơn trong văn nói"},{"q":"どんなにロボット技術が発達（　）、介護の現場では人間の力が必要だ。","o":["しようが","してこそ","をよそに","にもまして"],"a":1,"vi":"Dù công nghệ robot có phát triển đến đâu, lĩnh vực chăm sóc người già vẫn cần đến con người.","hint":"Thấy「どんなにロボット技術が発達＿＿人間が必要」→ chọン しようが\n✔ V意向形＋（し）ようが =「dù có...đi nữa」(譲歩)\n✘ しようにも = dù muốn...cũng không thể (bất lực)"},{"q":"言葉ができる（　）、何の計画もなしに海外に行くのは無謀だ。","o":["こそすれ","こととて","ならでは","ならまだしも"],"a":4,"vi":"Dù biết ngôn ngữ, nhưng đi nước ngoài mà chẳng có kế hoạch gì thì thật liều lĩnh.","hint":"Thấy「言葉ができる＿＿海外に行くのは無謀」→ chọン ならまだしも\n✔ 〜ならまだしも =「nếu là...thì còn tạm được, nhưng」(so sánh hai trường hợp)"},{"q":"若くして事故に遭ってしまったその人に、同情（　）。","o":["の至りだ","に難くない","にたえない","を禁じ得ない"],"a":4,"vi":"Thật không kìm được nỗi xót xa khi nhìn người trẻ tuổi đó gặp tai nạn.","hint":"Thấy「同情＿＿」cảm xúc không kìm được → chọン を禁じ得ない\n✔ N＋を禁じ得ない =「không kìm được (cảm xúc)」(cố định: 同情・涙・笑いを禁じ得ない)"},{"q":"小さな兄弟が助け合って生きる姿に、思わず（　）しまった。","o":["泣かれて","泣かせて","泣かされて","泣いてやって"],"a":3,"vi":"Tôi đã không kìm được nước mắt khi thấy hai anh em nhỏ giúp đỡ lẫn nhau để sống.","hint":"Thấy「思わず＿＿しまった」→ chọン 泣かされて\n✔ 使役受身「泣かされる」=「bị (cảnh vật) khiến phải khóc」\n✘ 泣かせて = mình khiến người khác khóc"},{"q":"この店の和菓子は手作り（　）味で本当にうまい。","o":["に限る","極まる","なりの","ならではの"],"a":4,"vi":"Bánh kẹo truyền thống của tiệm này ngon vì có hương vị riêng chỉ tự tay làm mới có.","hint":"Thấy「手作り＿＿味」→ chọン ならではの\n✔ N＋ならではの＋N =「đặc trưng chỉ...mới có」(cố định: 手作りならではの味)"},{"q":"人に（　）にするのではなく、自分の頭で考えるべきだ。","o":["言われるがまま","言われながら","言われるともなし","言われっぱなし"],"a":1,"vi":"Không nên chỉ làm theo những gì người khác bảo, mà phải tự suy nghĩ bằng đầu óc của mình.","hint":"Thấy「人に＿＿にするのではなく」→ chọン 言われるがまま\n✔ Vれる＋がまま =「cứ làm theo y như được bảo」(hoàn toàn phục tùng)"},{"q":"気が強いあの人（　）、私が何か言っても言い返してくるだろう。","o":["にしたって","のことだから","にもかかわらず","ならいざ知らず"],"a":2,"vi":"Người đó tính khí mạnh, dù tôi có nói gì cũng sẽ cãi lại thôi.","hint":"Thấy「気が強いあの人＿＿言い返してくる」→ chọン のことだから\n✔ N＋のことだから =「vì là (người/tính cách đó) nên chắc chắn」"},{"q":"窓を開ける（　）、さわやかな風が吹き込んだ。","o":["だに","なり","にあって","とばかりに"],"a":2,"vi":"Vừa mở cửa sổ ra là có làn gió mát thổi vào.","hint":"Thấy「窓を開ける＿＿風が吹き込んだ」→ chọン なり\n✔ V辞書形＋なり =「vừa...là ngay lập tức」(tức thì)"},{"q":"調査の結果を分析（　）、こんなにデータが少なくてはやりようがない。","o":["しようが","しようと","しように も","しようかしまいか"],"a":3,"vi":"Dù có muốn phân tích kết quả khảo sát thì cũng chẳng làm được gì khi dữ liệu quá ít như thế này.","hint":"Thấy「分析＿＿やりようがない」→ chọン しようにも\n✔ V意向形＋にも＋Vない =「dù muốn...cũng không thể」(hoàn cảnh cản trở)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"高層ビルの最上階で火災 ___ ___ ★ ___ おそろしい。","o":["考える","など","に遭う","だに"],"a":1,"order":[3,2,1,4],"vi_p2":"Chỉ nghĩ đến việc bị hỏa hoạn ở tầng cao nhất tòa nhà chọc trời thôi đã rùng mình rồi."},{"q":"念願のペットを ___ ___ ★ ___ 思ったより世話が大変で苦労している。","o":["飼ったら","飼ったは","飼ったで","いいが"],"a":1,"order":[2,4,1,3],"vi_p2":"Nuôi được thú cưng như mong muốn rồi mới biết việc chăm sóc vất vả hơn tưởng tượng."},{"q":"店であの絵を一目 ___ ___ ★ ___ なってしまった。","o":["というもの","たまらなく","欲しくて","見てから"],"a":3,"order":[4,1,3,2],"vi_p2":"Thoáng thấy bức tranh đó trong tiệm là từ đó không ngừng muốn có nó."},{"q":"人に言われず ___ ___ ★ ___ じゃないと、本当の仕事とは言えない。","o":["動く","とも","ぐらい","自分から"],"a":1,"order":[2,4,1,3],"vi_p2":"Muốn được coi là người làm việc thật sự thì phải tự chủ động làm chứ không phải chờ người khác bảo."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"「最近の若い人は……」なんて言うまいと思っていたが、どうも私には、最近の若い人の対外的なコミュニケーション力が、昔と比べて低いように【1】。\n私が子どもの頃、今のように核家族で一人っ子なんていう家庭はほとんどなかった。兄弟は4,5人いて当たり前、当然、兄弟ゲンカは日常茶飯事、おじいさんやおばあさんも含めて、家の中には常時10人近い人がいるというのが普通だった。そうでなくても、隣近所は家族同然で、子どもが家の外で悪さを【2】、すぐに近所の誰かから親に伝わる仕組みになっていた。\nこのように周りには常に他者がいるという状況の中で、子どもながらに、世の中は自分の思い通りにならないことだらけだということを嫌【3】思い知らされ、次第に、自分の気持ちのコントロールのしかたや、上の人や外の人たちとのつきあい方を身に付けていった。昔は人づきあいの訓練が、家庭や地域の中で自然になされていた気がする。","items":[{"label":"1","o":["思えてならない","思っていられない","思わざるを得ない","思うよりほかない"],"a":1,"hint":"Dạng câu hỏi: Cảm xúc chủ quan trào ra (~てならない)\n\nQuan hệ A-B: A (năng lực giao tiếp của giới trẻ thấp hơn xưa) khiến B (người viết) cứ cảm thấy như vậy, không kìm được — mẫu てならない.\n\n「コミュニケーション力が…低いように【1】」→ cảm xúc chủ quan trào ra tự nhiên → chọn ① 思えてならない\n→ 思えてならない = 'cứ cảm thấy như vậy, không thể không cảm thấy' (mẫu てならない)\n\nchỗ này là bẫy\n\n✗ 思っていられない = 'không thể cứ nghĩ mãi vậy' — sai nghĩa\n\n✗ 思わざるを得ない = 'buộc phải nghĩ' (ép buộc khách quan, khác sắc thái cảm xúc tự nhiên của てならない)\n\n✗ 思うよりほかない = 'chỉ còn cách nghĩ vậy' — sai sắc thái","sentence":"「最近の若い人は……」なんて言うまいと思っていたが、どうも私には、最近の若い人の対外的なコミュニケーション力が、昔と比べて低いように【1】。"},{"label":"2","o":["しようにも","したがために","しようものなら","するまでもなく"],"a":3,"hint":"Dạng câu hỏi: Giả định hành động xấu + hậu quả nhanh (~ものなら)\n\nQuan hệ A-B: A (nếu trẻ con lỡ làm gì xấu ngoài đường — giả định) ngay lập tức dẫn đến B (hàng xóm báo cho bố mẹ biết).\n\n「子どもが家の外で悪さを【2】、すぐに近所の誰かから親に伝わる」→ giả định hành động xấu + hậu quả nhanh → chọn ③ しようものなら\n→ しようものなら = 'nếu mà lỡ làm...' (giả định + hậu quả nghiêm trọng/nhanh theo sau)\n\nchỗ này là bẫy\n\n✗ しようにも = cần vế sau là khả năng phủ định — sai cấu trúc\n\n✗ したがために = nguyên nhân ĐÃ xảy ra 1 lần cụ thể — sai thì (đây là giả định chung)\n\n✗ するまでもなく = 'không cần phải làm' — sai nghĩa hoàn toàn","sentence":"そうでなくても、隣近所は家族同然で、子どもが家の外で悪さを【2】、すぐに近所の誰かから親に伝わる仕組みになっていた。"},{"label":"3","o":["ともなく","というほど","といえども","といったところで"],"a":2,"hint":"Dạng câu hỏi: Thành ngữ mức độ cực đại (嫌というほど)\n\nQuan hệ A-B: A (thế giới đầy điều không như ý) khiến B (đứa trẻ) thấm thía ĐẾN MỨC PHÁT CHÁN — cụm cố định 嫌というほど.\n\n「思い通りにならないことだらけだということを嫌【3】思い知らされ」→ thành ngữ cố định → chọn ② というほど\n→ 嫌というほど = 'đến phát chán, quá đủ rồi' (thành ngữ cố định, mức độ cực đại gây khó chịu)\n\nchỗ này là bẫy\n\n✗ ともなく = 'một cách không chủ ý' — sai nghĩa\n\n✗ といえども = nhượng bộ trang trọng — sai cấu trúc/nghĩa\n\n✗ といったところで = 'dù có nói...cũng không' — sai nghĩa","sentence":"このように周りには常に他者がいるという状況の中で、子どもながらに、世の中は自分の思い通りにならないことだらけだということを嫌【3】思い知らされ、次第に、自分の気持ちのコントロールのしかたや、上の人や外の人たちとのつきあい方を身に付けていった。"}]}]},{"id":"r15","name":"第15回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"この地図はいいかげんで、わかりにくい（　）ない。","o":["といえども","といえば","といっても","といったら"],"a":4,"vi":"Tấm bản đồ này vẽ ẩu, không thể nói hết là khó hiểu đến mức nào.","hint":"Thấy「わかりにくい＿＿ない」→ chọン といったらない\n✔ N/い形＋といったらない =「...thì không thể nói hết được mức độ」(nhấn mạnh cực độ)"},{"q":"喫茶店で隣の席の人の話を聞く（　）聞いていたら、知り合いの名前が出てきた。","o":["ことなく","ともなく","とばかりに","までもなく"],"a":2,"vi":"Trong quán cà phê, tôi tình cờ nghe được câu chuyện của người bàn bên và bất ngờ nghe thấy tên người quen.","hint":"Thấy「聞く＿＿聞いていたら」→ chọン ともなく\n✔ V辞書形＋ともなく =「không chủ ý mà (nghe/nhìn...)」(hành động vô thức)"},{"q":"こんな管理体制では事故が起きて当然だ。この事故は（　）起こったのだ。","o":["起ればこそ","起ころうとして","起るまじとして","起るべくして"],"a":4,"vi":"Với cơ chế quản lý lỏng lẻo thế này thì việc xảy ra tai nạn cũng là điều tất yếu phải xảy ra.","hint":"Thấy「この事故は＿＿起こったのだ」→ chọン 起るべくして\n✔ V辞書形べくして＋Vた =「đã xảy ra một cách tất yếu」(cố định: 起こるべくして起こった)"},{"q":"この文章は何が言いたい（　）さっぱりわからない。","o":["ながら","なりに","のなら","のやら"],"a":4,"vi":"Bài văn này chẳng hiểu muốn nói gì, tôi hoàn toàn không hiểu nổi.","hint":"Thấy「何が言いたい＿＿わからない」→ chọン のやら\n✔ 疑問詞＋Vの＋やら =「không biết...thế nào」(mơ hồ, không hiểu)\n✘ のなら = nếu là (giả định)"},{"q":"手紙を（　）消し（　）消ししているうちに、朝になってしまった。","o":["書いては／書いては","書こうと／書こうと","書きつつ／書きつつ","書くまいと／書くまいと"],"a":1,"vi":"Tôi cứ viết thư rồi xóa, viết rồi lại xóa, đến khi xong thì trời đã sáng.","hint":"Thấy「手紙を＿＿消し＿＿消し」→ chọン 書いては〜消しては\n✔ Vて形は〜Vて形は =「cứ...lại (lặp đi lặp lại)」"},{"q":"当店のポイントサービスは、今年度（　）終了いたします。","o":["限りで","を兼ねて","にあって","次第で"],"a":1,"vi":"Dịch vụ tích điểm của cửa hàng sẽ kết thúc từ năm nay trở đi.","hint":"Thấy「今年度＿＿終了」→ chọン 限りで\n✔ N（時間）＋限りで =「kể từ (mốc thời gian này) sẽ kết thúc」"},{"q":"地元の人（　）見たことがないようなめずらしい鳥の撮影に成功した。","o":["でこそ","ですら","なりに","ゆえに"],"a":2,"vi":"Họ đã chụp được ảnh một loài chim hiếm mà ngay cả người địa phương cũng chưa từng thấy.","hint":"Thấy「地元の人＿＿見たことがない鳥」→ chọン ですら\n✔ N＋ですら =「ngay cả...cũng」(nhấn mạnh người/thứ đáng lẽ phải biết mà cũng không)"},{"q":"比較（　）、新型の機種は古いものよりもはるかに性能がいい。","o":["するべく","したからには","しようものなら","するまでもなく"],"a":4,"vi":"Không cần so sánh cũng biết loại máy mới có hiệu năng tốt hơn hẳn loại cũ.","hint":"Thấy「比較＿＿性能がいい」→ chọン するまでもなく\n✔ V辞書形＋までもなく =「không cần phải đến mức...」(đã rõ ràng)"},{"q":"最近の小学生（　）、携帯は持つわ化粧はするわで、昔とは大違いだ。","o":["とあれば","ときたら","としたら","のわりに"],"a":2,"vi":"Học sinh tiểu học bây giờ thì khỏi phải nói, vừa dùng điện thoại vừa trang điểm, khác hẳn ngày xưa.","hint":"Thấy「最近の小学生＿＿携帯・化粧」→ chọン ときたら\n✔ N＋ときたら =「nói đến...thì」(dẫn dắt chủ đề để than phiền/chỉ trích)"},{"q":"そんなに疑うんなら、自宅（　）自由に捜索してください。","o":["からなにから","なりなんなり","やらなんやら","よりなにより"],"a":2,"vi":"Nếu nghi ngờ vậy thì cứ tự do lục soát nhà tôi, hay làm gì cũng được.","hint":"Thấy「自宅＿＿捜索してください」→ chọン なりなんなり\n✔ N＋なりなんなり =「...hay gì cũng được」(mở rộng lựa chọn hoàn toàn)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"調査 ___ ___ ★ ___ 事故の原因を究明した。","o":["を","に","重ねて","調査"],"a":1,"order":[2,4,1,3],"vi_p2":"Điều tra đi điều tra lại nhiều lần để tìm ra nguyên nhân vụ tai nạn."},{"q":"行きたくなくても ___ ___ ★ ___ 得ない。","o":["とあれば","を","行かざる","上司の命令"],"a":3,"order":[4,1,3,2],"vi_p2":"Dù không muốn đi, đã là lệnh của cấp trên thì không thể không đi."},{"q":"今さら ___ ___ ★ ___ しょうがないじゃないか。","o":["ああだの","言った","こうだの","ところで"],"a":2,"order":[1,3,2,4],"vi_p2":"Bây giờ có nói đủ thứ thì cũng chẳng được gì rồi."},{"q":"彼の歌声は、その場にいるすべての人を ___ ___ ★ ___ 美しかった。","o":["には","ほど","おかない","ひきつけず"],"a":3,"order":[4,1,3,2],"vi_p2":"Giọng hát của anh ấy đẹp đến mức không thể không làm tất cả mọi người trong khán phòng xúc động."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"日本の料理ほど微妙で、繊細なものはない。それは原料に加工するのではなく、たとえば木工が、自然の木の材質を生かすのと同じように、魚や野菜が本来持っている味を、いわば内部からひきだすことにかかっているように思われる。材料が新鮮なら、醤油か塩で食べるに【1】。そういう点では、西洋料理や中国料理とは本質的に違っており、日本には料理がないといわれる所以でもある。\nたしかに私たちの国では、外国のような調理法は【2】。海の幸、山の幸に、恵まれすぎていたからだ。そこに彼らとはまったく別な味わい方が生れた。四季折々のシュンを尊ぶこと、包丁さばきから器のえらび方、その盛りつけ【3】、自然の味を生かすことに細心の注意がはらわれる。\n（白洲正子著『日本のたくみ』新潮社刊）","items":[{"label":"1","o":["難くない","たえない","あたらない","越したことはない"],"a":4,"hint":"Dạng câu hỏi: Khuyến nghị mạnh nhất (~に越したことはない)\n\nQuan hệ A-B: A (nguyên liệu tươi) là điều kiện, B (ăn với nước tương/muối) là lựa chọn TỐT NHẤT không gì hơn khi A đúng.\n\n「材料が新鮮なら、醤油か塩で食べるに【1】」→ chọn ④ 越したことはない\n→ Vるに越したことはない = 'không gì tốt hơn là...' (khuyến nghị mạnh)\n\nchỗ này là bẫy\n\n✗ 難くない (Vるに難くない) = 'không khó để...' — sai nghĩa hoàn toàn\n\n✗ たえない (Vるにたえない) = 'không chịu nổi khi...' — sai nghĩa\n\n✗ あたらない (Vるにあたらない) = 'không đáng để...' — sai nghĩa","sentence":"材料が新鮮なら、醤油か塩で食べるに【1】。"},{"label":"2","o":["発達してきた","発達しすぎた","発達しなかった","発達させなかった"],"a":3,"hint":"Dạng câu hỏi: Nguyên nhân — kết quả (tự động từ phủ định)\n\nQuan hệ A-B: A (thiên nhiên ưu đãi quá mức về hải sản/núi rừng) là nguyên nhân khiến B (cách chế biến kiểu nước ngoài) đã KHÔNG cần phát triển.\n\n「たしかに…外国のような調理法は【2】。海の幸、山の幸に、恵まれすぎていたからだ」→ NGUYÊN NHÂN-KẾT QUẢ → chọn ③ 発達しなかった\n→ 'vì được thiên nhiên ưu đãi quá mức nên KHÔNG cần phát triển kỹ thuật chế biến phức tạp'\n\nchỗ này là bẫy\n\n✗ 発達してきた/発達しすぎた = ngược nghĩa hoàn toàn (khẳng định thay vì phủ định)\n\n✗ 発達させなかった = tha động từ (cần chủ thể chủ động ngăn cản) — sai vì đây là hiện tượng tự nhiên, không phải ai chủ động ngăn","sentence":"たしかに私たちの国では、外国のような調理法は【2】。"},{"label":"3","o":["と相まって","に至るまで","に限って","をはじめとして"],"a":2,"hint":"Dạng câu hỏi: Mở đầu liệt kê (をはじめとして)\n\nQuan hệ A-B: A (một khía cạnh đầu tiên: tôn trọng mùa) là ĐẠI DIỆN mở đầu cho B (chuỗi liệt kê tiếp theo: cách dùng dao, chọn bát đĩa, cách bày biện).\n\nliệt kê nhiều khía cạnh rồi kết luận chung → chọn ④ をはじめとして\n→ をはじめとして = 'bắt đầu từ...(và nhiều thứ khác nữa)' mở đầu/đại diện cho danh sách liệt kê\n\nchỗ này là bẫy\n\n✗ と相まって = 'kết hợp với' — sai vì đây là liệt kê, không phải kết hợp 2 yếu tố\n\n✗ に至るまで = 'cho đến tận' — sai vị trí ngữ pháp trong câu này\n\n✗ に限って = 'chỉ riêng' — sai nghĩa hoàn toàn","sentence":"四季折々のシュンを尊ぶこと、包丁さばきから器のえらび方、その盛りつけ【3】、自然の味を生かすことに細心の注意がはらわれる。"}]}]},{"id":"r16","name":"第16回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"経歴から見てどんな厳しい人（　）、とても気さくで明るい人だった。","o":["ときたら","とみると","かのごとく","かと思いきや"],"a":4,"vi":"Cứ tưởng là người nghiêm khắc nhìn từ lý lịch, nhưng hóa ra lại rất thân thiện và vui vẻ.","hint":"Thấy「どんな厳しい人＿＿気さくだった」→ chọン かと思いきや\n✔ 〜かと思いきや =「cứ tưởng là...nhưng hóa ra (ngược lại)」"},{"q":"答案用紙に名前を書くのを忘れてしまったので、もう合格は望む（　）。","o":["べからず","べくもない","には及ばない","には至らない"],"a":2,"vi":"Vì quên ghi tên vào bài thi nên không còn hy vọng đậu nữa rồi.","hint":"Thấy「もう合格は望む＿＿」→ chọン べくもない\n✔ V辞書形（す→す）べくもない =「không thể nào...được」(hoàn toàn vô vọng)"},{"q":"一人でも多くの顧客を獲得（　）、社員一丸となって営業活動を行っている。","o":["せんがため","せんばかりの","するがゆえ","するごとく"],"a":1,"vi":"Để giành được càng nhiều khách hàng càng tốt, toàn thể nhân viên đang đồng lòng đẩy mạnh hoạt động kinh doanh.","hint":"Thấy「顧客を獲得＿＿、社員一丸」→ chọン せんがため\n✔ V意向形ん＋がため（に） =「để mà...」(mục đích mạnh, cổ văn/trang trọng)"},{"q":"この作曲家は難病に苦しみ（　）、数々の名曲を残した。","o":["にせよ","ながらも","はおろか","のみならず"],"a":2,"vi":"Nhà soạn nhạc này dù mắc bệnh hiểm nghèo vẫn để lại nhiều tác phẩm để đời.","hint":"Thấy「難病に苦しみ＿＿名曲を残した」→ chọン ながらも\n✔ V/い/な普通形＋ながらも =「tuy...nhưng vẫn」(nghịch cảnh vượt qua)"},{"q":"周囲の非難を（　）、監督は独自の戦術でチームを勝利に導いた。","o":["踏まえて","禁じ得ず","ものともせず","余儀なくされ"],"a":3,"vi":"Bất chấp sự chỉ trích từ xung quanh, huấn luyện viên đã dẫn dắt đội bằng chiến thuật riêng để giành chiến thắng.","hint":"Thấy「周囲の非難を＿＿監督は勝利に導いた」→ chọン ものともせず\n✔ N＋をものともせず =「bất chấp...」(không coi trở ngại là trở ngại)"},{"q":"親は子どものことを心配（　）うるさいことも言うのだ。","o":["するべく","しこそすれ","すればこそ","するからには"],"a":3,"vi":"Cha mẹ chỉ lo lắng nên mới hay nói những điều khó nghe với con cái.","hint":"Thấy「心配＿＿うるさいことも言う」→ chọン しこそすれ\n✔ V/Nこそすれ〜ない =「chỉ có...chứ không...」(chỉ cái này, không có cái kia)"},{"q":"彼とはもう長くつきあっているが、いざ結婚（　）迷ってしまう。","o":["につけ","とあれば","となると","にしては"],"a":3,"vi":"Tuy đã quen nhau lâu nhưng hễ nói đến chuyện kết hôn là anh ấy lại do dự.","hint":"Thấy「いざ結婚＿＿迷ってしまう」→ chọン となると\n✔ いざ〜となると =「mỗi khi đến lúc thực sự...thì」(khác với dự tính)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"その男は私を見るなり、まるで幽霊 ___ ___ ★ ___ 驚いて逃げていった。","o":["見た","でも","のごとく","か"],"a":4,"order":[2,1,4,3],"vi_p2":"Người đàn ông đó vừa nhìn thấy tôi đã chạy trốn như thể nhìn thấy ma."},{"q":"あの工場からの排水が環境破壊 ___ ___ ★ ___ 。","o":["という","なんだ","のだろう","でなくて"],"a":1,"order":[4,2,1,3],"vi_p2":"Chất thải từ nhà máy đó nếu không phải là phá hoại môi trường thì là gì?"},{"q":"海外勤務の息子が家に帰ってくるのは、年に一度 ___ ___ ★ ___ だ。","o":["といった","ないか","ところ","あるか"],"a":1,"order":[4,2,1,3],"vi_p2":"Con trai đi làm nước ngoài về nhà, chỉ một năm một lần, nhiều lắm thì vậy thôi."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"捨てなきゃいけない――これが、現代に生きている私たちにとっての至上命題だ。\n今の暮らしにはモノが溢れ、【1】増えつづける。職場には書類が山積みだし、家庭では収納スペースがいくらあってもモノをしまいきれない。ただでさえ狭いスペースが、モノの増殖によってさらに狭くなり、なんとかしなきゃと【2】モノに囲まれて暮らしているのが現状だ。内心、全部捨てたらどんなにすっきりするだろう、と思っている人も【3】。\n一方で、1990年代をとおしてエコロジー志向が浸透し、地球にやさしい暮らしをしよう、モノをリサイクルしよう、ゴミを出さないようにしよう、という動きが定着している。また、平成不況と呼ばれた91年に始まる不況も、すでに十年めに入った。稼ぎ手のリストラや、百貨店やスーパーの倒産・閉店が相次ぐ【4】わかるように、家計は引き締められている。不要なモノを買う余裕は、それほどないはずである。\n【5】、暮らしのなかにはモノが溢れかえっている。なぜなのだろう。どうして、モノは減らないのだ。\n（辰巳渚著『「捨てる！」技術』宝島社刊）","items":[{"label":"1","o":["捨てたら捨てたで","捨てても拾っても","捨てても捨てても","捨てたり拾ったり"],"a":3,"hint":"Dạng câu hỏi: Nhượng bộ lặp động từ (~ても~ても)\n\nQuan hệ A-B: A (hành động vứt đồ, lặp lại nhiều lần) không ngăn được B (đồ đạc tiếp tục tăng lên) — vô ích dù cố gắng nhiều lần.\n\n「モノが溢れ、【1】増えつづける」→ dù cố gắng nhiều lần vẫn vô ích → chọn ③ 捨てても捨てても\n→ Vても lặp lại = 'dù vứt đi vứt đi (nhiều lần)' vẫn vô ích\n\nchỗ này là bẫy\n\n✗ 捨てたら捨てたで = sai cấu trúc/nghĩa ở đây (không nói về hệ quả sau khi vứt)\n\n✗ 捨てても拾っても/捨てたり拾ったり = liên quan 'nhặt lại' (拾う) — lạc đề hoàn toàn, không có ai nhặt đồ trong bài","sentence":"今の暮らしにはモノが溢れ、【1】増えつづける。"},{"label":"2","o":["思いつつ","思っては","思いかけて","思ってまで"],"a":1,"hint":"Dạng câu hỏi: Đồng thời mâu thuẫn (~つつ)\n\nQuan hệ A-B: A (nghĩ phải xử lý đồ đạc) và B (vẫn sống bao quanh bởi đồ đạc, không xử lý) diễn ra ĐỒNG THỜI, mâu thuẫn nhau.\n\n「なんとかしなきゃと【2】モノに囲まれて暮らしている」→ 2 việc mâu thuẫn diễn ra đồng thời → chọn ① 思いつつ\n→ 思いつつ = 'trong khi nghĩ...' (nghĩ phải xử lý NHƯNG vẫn không xử lý)\n\nchỗ này là bẫy\n\n✗ 思っては = 'mỗi khi nghĩ (là lại...)' — sai sắc thái (không phải lặp theo chu kỳ)\n\n✗ 思いかけて = 'vừa mới bắt đầu nghĩ' — sai nghĩa\n\n✗ 思ってまで = 'đến mức phải nghĩ' — sai nghĩa hoàn toàn","sentence":"ただでさえ狭いスペースが、モノの増殖によってさらに狭くなり、なんとかしなきゃと【2】モノに囲まれて暮らしているのが現状だ。"},{"label":"3","o":["少ないだろう","少ない限りだ","少なくないはずだ","少なくないからだ"],"a":3,"hint":"Dạng câu hỏi: Suy đoán chắc chắn (~はずだ)\n\nQuan hệ A-B: A (muốn vứt hết cho thoải mái) là suy nghĩ THẦM KÍN, B (số người nghĩ vậy) được suy đoán chắc chắn là KHÔNG ÍT.\n\n「全部捨てたら…と思っている人も【3】」→ suy đoán chắc chắn KHÔNG ÍT người → chọn ③ 少なくないはずだ\n→ 少なくないはずだ = 'chắc hẳn không ít'\n\nchỗ này là bẫy\n\n✗ 少ないだろう = NGƯỢC nghĩa hoàn toàn với ý tác giả (nhiều người có suy nghĩ này)\n\n✗ 少ない限りだ = sai cấu trúc (限りだ đi sau tính từ cảm xúc: うれしい限りだ)\n\n✗ 少なくないからだ = 'vì không ít' (giải thích lý do) — sai, câu này không giải thích lý do cho câu trước","sentence":"内心、全部捨てたらどんなにすっきりするだろう、と思っている人も【3】。"},{"label":"4","o":["こととて","ことからも","ものだから","ものゆえに"],"a":2,"hint":"Dạng câu hỏi: Dùng làm căn cứ (~ことからも)\n\nQuan hệ A-B: A (cửa hàng bách hóa/siêu thị liên tục đóng cửa) là BẰNG CHỨNG cho B (chi tiêu gia đình đang bị thắt chặt).\n\n「百貨店やスーパーの倒産・閉店が相次ぐ【4】わかるように」→ dùng sự việc làm bằng chứng → chọn ② ことからも\n→ Nことからも+わかるように = 'cũng có thể thấy rõ từ việc...' (dùng làm căn cứ/bằng chứng)\n\nchỗ này là bẫy\n\n✗ こととて = 'vì là chuyện...' (lý do, trang trọng/cổ) — sai sắc thái\n\n✗ ものだから/ものゆえに = 'vì là...' (nguyên nhân) — sai cấu trúc, không hợp với わかるように (cần CĂN CỨ chứ không phải lý do)","sentence":"稼ぎ手のリストラや、百貨店やスーパーの倒産・閉店が相次ぐ【4】わかるように、家計は引き締められている。"},{"label":"5","o":["それなのに","それゆえに","そればかりか","だからこそ"],"a":1,"hint":"Dạng câu hỏi: Tương phản bất ngờ (それなのに)\n\nQuan hệ A-B: A (xu hướng tiết kiệm, thắt chặt chi tiêu) và B (đồ đạc vẫn tràn ngập) hoàn toàn TRÁI NGƯỢC nhau, phá vỡ kỳ vọng logic.\n\n「【5】、暮らしのなかにはモノが溢れかえっている。なぜなのだろう」→ tương phản bất ngờ → chọn ① それなのに\n→ それなのに = 'vậy mà, thế nhưng' (phá vỡ kỳ vọng logic — câu trước nói về xu hướng tiết kiệm)\n\nchỗ này là bẫy\n\n✗ それゆえに = 'do đó' (nguyên nhân-kết quả THUẬN) — NGƯỢC nghĩa hoàn toàn\n\n✗ そればかりか = 'không những thế mà còn' (tăng tiến CÙNG CHIỀU) — sai, đây là tương phản\n\n✗ だからこそ = 'chính vì thế nên' — sai hướng nghĩa\n\n📌 Thuộc nhóm 'Tương phản bất ngờ' trong [[Khung phân loại từ nối N1, N2 theo nhóm chức năng ngữ nghĩa]] (だが、ところが、しかし、それなのに、それでも).","sentence":"【5】、暮らしのなかにはモノが溢れかえっている。"}]}]},{"id":"r17","name":"第17回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"毎日こんなに大量の食べ物が捨てられているなんて、もったいない（　）だ。","o":["至り","限り","極み","始末"],"a":2,"vi":"Bao nhiêu đồ ăn bị vứt bỏ mỗi ngày như thế này, thật quá lãng phí.","hint":"Thấy「もったいない＿＿だ」→ chọン 始末\n✔ 〜始末だ =「rốt cuộc dẫn đến tình trạng (đáng tiếc)」\n✘ 限りだ = cảm xúc ở mức cao (không nhất thiết tiêu cực)"},{"q":"犯人がどんな罰を（　）、被害者の心の傷はずっと残るだろう。","o":["受けたなら","受けようと","受けこそすれ","受けたつもりでも"],"a":2,"vi":"Dù thủ phạm có nhận hình phạt thế nào, vết thương lòng của nạn nhân vẫn sẽ còn mãi.","hint":"Thấy「どんな罰を＿＿傷はずっと残る」→ chọン 受けようと\n✔ V意向形＋と =「dù có...đi nữa」(譲歩, nhượng bộ điều kiện)"},{"q":"彼女の演技は未熟であるが（　）、今後の成長が楽しみだ。","o":["ゆえに","よそに","ながらも","ばかりに"],"a":1,"vi":"Diễn xuất của cô ấy tuy còn non nhưng rất đáng mong đợi trong tương lai.","hint":"Thấy「未熟であるが＿＿成長が楽しみ」→ chọン ながらも\n✔ 普通形＋ながらも =「tuy...nhưng vẫn」(thừa nhận điểm yếu + kỳ vọng)"},{"q":"妹はさっきから鏡の前でポーズをとって、モデルにでもなった（　）だろうか。","o":["ふり","もの","つもり","ごとく"],"a":3,"vi":"Em gái cứ tạo dáng trước gương từ nãy đến giờ, không biết có phải đang tưởng tượng mình là người mẫu hay không.","hint":"Thấy「モデルにでもなった＿＿だろうか」→ chọン もの（ごとく）\n✔ 〜ごとく/ものごとく =「cứ như là...」(so sánh hành vi)\n✘ つもり = có ý định (chủ quan)"},{"q":"日本語の勉強を始めて1カ月（　）2カ月では、新聞を読むのは難しい。","o":["と","や","すら","なら"],"a":2,"vi":"Mới học tiếng Nhật được 1-2 tháng thì khó mà đọc được báo.","hint":"Thấy「1カ月＿＿2カ月では新聞が読めない」→ chọン すら\n✔ N＋すら =「ngay cả...cũng」(nhấn mạnh điều kiện tối thiểu)\n✘ や = liệt kê đơn thuần"},{"q":"部下の苦労を（　）部長はまた方針を変えた。","o":["知ろうにも","知ったところで","知らないなりに","知りもしないで"],"a":4,"vi":"Dù trưởng phòng có biết nỗi vất vả của cấp dưới thì cũng vẫn đổi phương châm như cũ.","hint":"Thấy「苦労を＿＿また方針を変えた」→ chọン 知ったところで\n✔ Vた形＋ところで〜ない =「dù có biết...cũng (không thay đổi)」"},{"q":"つまらないことで夫婦げんかばかりして、父も父（　）母も母だ。","o":["だの","なら","なり","やら"],"a":2,"vi":"Vì cãi nhau vài chuyện vặt vãnh mà cả hai vợ chồng cứ trách móc lẫn nhau mãi.","hint":"Thấy「父も父＿＿母も母」→ chọン なり\n✔ 〜なり〜なり (くり返し強調) =「bố thì bố vậy, mẹ thì mẹ vậy」(trách móc cả hai)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"窓の外を ___ ___ ★ ___ いたら、バイクがトラックにぶつかった。","o":["なしに","とも","見る","見て"],"a":1,"order":[3,2,1,4],"vi_p2":"Mắt cứ nhìn ra ngoài cửa sổ lơ đơ không chủ ý thì bỗng thấy xe máy đâm vào xe tải."},{"q":"平日なら ___ ___ ★ ___ 入園まで1時間は待つことになるだろう。","o":["連休とも","いざ","なると","知らず"],"a":1,"order":[2,4,1,3],"vi_p2":"Ngày thường thì còn được, nhưng đã là kỳ nghỉ liên tiếp thì chờ vào cổng có khi đến một tiếng."},{"q":"携帯電話 ___ ___ ★ ___ 、大げさに騒ぎすぎだよ。","o":["なくしても","なんか","じゃあるまいし","死ぬわけ"],"a":4,"order":[2,1,4,3],"vi_p2":"Mất điện thoại cũng không phải là chết, sao mà ầm ĩ quá vậy."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"僕は、5年前に今の会社に【1】、まとまった休暇を取ったことはなかった。僕の会社では、社員は1年に1度長期休暇を取ることが認められている。しかし、僕は、特にやりたいこともなかったし、長い休みが【2】、暇をもてあますだけだろうと思っていたから、これまでずっと長期休暇を取らずにきた。\nしかし、先日、僕は入社以来はじめて長期休暇を申請した。僕にそうさせたのは、ある風景写真だった。仕事帰りに立ち寄った本屋で偶然手にした一冊の雑誌。そこに掲載されていた一枚の写真を見た【3】、僕はどうしてもその場所に行ってみたいという気持ちになった。行かなくてはいけないとさえ思った。自分でもうまく説明できない、不思議な感覚だった。そして、その思いは日に日に強くなり、ついに、1週間の休暇を願い出ることにしたのだ。\nちょうど大きなプロジェクトが始まったばかりで仕事が忙しく、さぞかし迷惑がられるだろう【4】、上司はあっさり許可してくれた。それどころか、「君は働きすぎじゃないかと心配していたところだよ。仕事のことは心配しなくていい。ゆっくり休んでリフレッシュしなさい」と笑顔で言われ、正直かなり驚いた。\n【5】、こうして僕は、あの写真の地を訪れるための時間を手に入れた。夏休みとあって、予約を取るのに苦労したものの、何とか航空券も確保した。24時間後には太平洋の上を飛んでいるはずである。こんなにワクワクした気分を味わうのは何年ぶりだろう。今夜はなかなか眠れそうにないが、明日の朝は早起きしなければならない。そろそろ寝るとしよう。","items":[{"label":"1","o":["就職するなり","就職したからといって","就職したところで","就職してからというもの"],"a":4,"hint":"Dạng câu hỏi: Mốc thời gian + tính liên tục (~てからというもの)\n\nQuan hệ A-B: A (vào công ty 5 năm trước) là MỐC bắt đầu, B (chưa từng nghỉ dài) là trạng thái LIÊN TỤC kéo dài từ mốc đó đến nay.\n\n「5年前に今の会社に【1】、まとまった休暇を取ったことはなかった」→ mốc thời gian + tính liên tục → chọn ④ 就職してからというもの\n→ てからというもの = 'kể từ khi...(thì luôn/liên tục)' — khớp với 'chưa từng nghỉ dài' (liên tục 5 năm)\n\nchỗ này là bẫy\n\n✗ 就職するなり = tức thì 1 lần — sai, đây là khoảng thời gian 5 năm\n\n✗ 就職したからといって/就職したところで = sai nghĩa/cấu trúc hoàn toàn","sentence":"僕は、5年前に今の会社に【1】、まとまった休暇を取ったことはなかった。"},{"label":"2","o":["あればこそ","あったものの","あったところで","あるからといって"],"a":3,"hint":"Dạng câu hỏi: Nhượng bộ trên sự thật đã có (~ものの)\n\nQuan hệ A-B: A (công ty THẬT SỰ có chế độ nghỉ dài, đã nêu ở câu trước) nhưng B (tác giả vẫn không lấy vì sợ rảnh rỗi) — ものの nhượng bộ dựa trên sự thật, khác ところで (giả định).\n\n→ ものの = concessive dựa trên SỰ THẬT đã có (khác ところで vốn dùng cho giả định 'dù có...đi nữa')\n\nchỗ này là bẫy\n\n✗ あればこそ = 'chính vì có...' (nguyên nhân khẳng định) — sai hướng, câu này cần tương phản chứ không phải nguyên nhân\n\n✗ あったところで = 'dù có...đi nữa' — nghe gần đúng nhưng sai vì đây không phải giả định, mà là tương phản với 1 CHẾ ĐỘ THẬT đã tồn tại\n\n✗ あるからといって = 'dù có...nhưng chưa chắc' — sai thì (あった quá khứ mới đúng vì chế độ này đã tồn tại từ trước)\n\n📌 Câu TRƯỚC đã xác lập: 'công ty CHO PHÉP nghỉ dài 1 lần/năm' (sự thật, không phải giả định) → 'あったものの' = 'tuy CÓ THẬT (chế độ nghỉ dài đó) nhưng...' → chọn ② あったものの","sentence":"しかし、僕は、特にやりたいこともなかったし、長い休みが【2】、暇をもてあますだけだろうと思っていたから、これまでずっと長期休暇を取らずにきた。"},{"label":"3","o":["とたん","ついでに","どころか","とあれば"],"a":1,"hint":"Dạng câu hỏi: Tức thì (とたん)\n\nQuan hệ A-B: A (vừa nhìn thấy tấm ảnh) ngay lập tức dẫn đến B (muốn đến nơi đó bằng mọi giá) — quan hệ tức thì, không có khoảng cách thời gian.\n\n「一枚の写真を見た【3】、僕はどうしてもその場所に行ってみたいという気持ちになった」→ tức thì → chọn ① とたん\n→ 見たとたん = 'vừa mới nhìn thấy là ngay lập tức...'\n\nchỗ này là bẫy\n\n✗ ついでに = nhân tiện — sai nghĩa\n\n✗ どころか = 'chứ đừng nói...' — sai nghĩa hoàn toàn\n\n✗ とあれば = 'nếu là...(thì sẽ)' giả định — sai cấu trúc (đây là sự việc đã xảy ra)","sentence":"そこに掲載されていた一枚の写真を見た【3】、僕はどうしてもその場所に行ってみたいという気持ちになった。"},{"label":"4","o":["といえども","と思いつつ","ものなら","と思いきや"],"a":4,"hint":"Dạng câu hỏi: Kỳ vọng bị đảo ngược (と思いきや)\n\nQuan hệ A-B: A (tưởng sẽ bị phiền/khó chịu — kỳ vọng) hoàn toàn TRÁI NGƯỢC với B (sếp đồng ý dễ dàng) — と思いきや khớp それどころか ở câu sau.\n\n「さぞかし迷惑がられるだろう【4】、上司はあっさり許可してくれた」→ kỳ vọng bị đảo ngược, khớp それどころか câu sau → chọn ④ と思いきや\n→ と思いきや = 'cứ tưởng là...nhưng không ngờ lại...' \n\nchỗ này là bẫy\n\n✗ といえども = nhượng bộ trang trọng — sai\n\n✗ と思いつつ = 'trong khi nghĩ là' (đồng thời, không đảo ngược bất ngờ) — thiếu sắc thái 'hóa ra ngược lại'\n\n✗ ものなら = sai cấu trúc hoàn toàn","sentence":"ちょうど大きなプロジェクトが始まったばかりで仕事が忙しく、さぞかし迷惑がられるだろう【4】、上司はあっさり許可してくれた。"},{"label":"5","o":["すなわち","とはいえ","せっかく","ともかく"],"a":4,"hint":"Dạng câu hỏi: Tóm tắt kết quả (すなわち)\n\nQuan hệ A-B: A (mở đoạn mới) TÓM TẮT LẠI kết quả của B (đoạn trước: sếp đồng ý bất ngờ) bằng すなわち.\n\n「【5】、こうして僕は、あの写真の地を訪れるための時間を手に入れた」→ mở đoạn mới tóm tắt kết quả → chọn ① すなわち\n→ すなわち = 'tức là, nói tóm lại' — tóm tắt kết quả đoạn trước (sếp đồng ý bất ngờ)\n\nchỗ này là bẫy\n\n✗ とはいえ = 'tuy nói vậy nhưng' — sai, không có tương phản ở đây\n\n✗ せっかく = sai vị trí ngữ pháp (thường bổ nghĩa trực tiếp cho mệnh đề sau, không đứng đầu câu tóm tắt kiểu này)\n\n✗ ともかく = 'dù sao đi nữa' — sai sắc thái, không khớp mạch tóm tắt kết quả","sentence":"【5】、こうして僕は、あの写真の地を訪れるための時間を手に入れた。"}]}]},{"id":"r18","name":"第18回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"新型車の発売（　）、各地で試乗会が開かれた。","o":["を境に","に至って","を皮切りに","に先駆けて"],"a":4,"vi":"Nhân dịp ra mắt xe mới, các buổi lái thử đã được tổ chức khắp nơi.","hint":"Thấy「新型車の発売＿＿試乗会が開かれた」→ chọン を皮切りに\n✔ N＋を皮切りに =「lấy...làm khởi đầu (rồi mở rộng)」\n✘ を境に = lấy làm ranh giới (thay đổi trước/sau)"},{"q":"叱られるか（　）、逆に「よくやった」と褒められたので驚いた。","o":["に反して","といえども","と思いきや","と思いつつ"],"a":3,"vi":"Cứ tưởng sẽ bị mắng, ai ngờ lại được khen \"làm tốt lắm\" nên rất bất ngờ.","hint":"Thấy「叱られるか＿＿褒められた」→ chọン と思いきや\n✔ 〜と思いきや =「cứ tưởng...nhưng hóa ra」(kết quả bất ngờ ngược chiều)"},{"q":"会場では招待客を迎える（　）、着々と準備が進められている。","o":["べき","べく","ところに","ところを"],"a":2,"vi":"Tại hội trường, mọi người đang khẩn trương chuẩn bị để đón khách mời.","hint":"Thấy「招待客を迎える＿＿準備が進められている」→ chọン べく\n✔ V辞書形べく =「để mà...」(mục đích, văn viết/trang trọng hơn ために)"},{"q":"子どもの騒ぐ声がうるさくて、テレビの音も聞こえ（　）。","o":["やしない","ないったらない","ないものやら","ない限りだ"],"a":1,"vi":"Tiếng trẻ con ồn ào đến mức không nghe rõ cả tiếng tivi.","hint":"Thấy「テレビの音も聞こえ＿＿」→ chọン ないったらない\n✔ V/い形＋ないったらない =「...không thể nghe/chịu được mức độ nào」(phàn nàn cực mạnh khẩu ngữ)"},{"q":"山の中で道に迷ってしまい、食べ物（　）水もないまま歩き続けた。","o":["ともなく","なくして","はおろか","はいざ知らず"],"a":3,"vi":"Trong núi bị lạc đường, anh ấy cứ đi mãi mà không có cả đồ ăn lẫn nước uống.","hint":"Thấy「食べ物＿＿水もない」→ chọン ともなく\n✔ 食べ物ともなく水もなく =「không có cả...lẫn...」(hai thứ đều thiếu)"},{"q":"客が（　）、閉店時間前に店を閉めるわけにはいかない。","o":["いようといまいと","いようかいるまいか","いるともいないとも","いるなりいないなり"],"a":1,"vi":"Dù khách có đến hay không, cũng không thể đóng cửa trước giờ quy định.","hint":"Thấy「客が＿＿閉店時間前に閉めるわけにはいかない」→ chọン いようといまいと\n✔ V意向形＋といまいと =「dù có...hay không」(bất kể điều kiện nào)"},{"q":"両社はその事業での協力を（　）、長年の間、親密な関係を続けてきた。","o":["契機に","限りに","もって","ものともせず"],"a":1,"vi":"Lấy việc hợp tác trong dự án đó làm cơ hội, hai công ty đã duy trì quan hệ thân thiết suốt nhiều năm.","hint":"Thấy「協力を＿＿長年の間、関係を続けた」→ chọン 契機に\n✔ N＋を契機に =「lấy...làm cơ hội/bước ngoặt」(sự kiện tạo ra thay đổi lâu dài)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"住む部屋は、安ければ ___ ___ ★ ___ 、広さと環境も重要だ。","o":["越した","それに","ないが","ことは"],"a":4,"order":[2,1,4,3],"vi_p2":"Phòng ở thì rẻ tốt nhất, nhưng diện tích và môi trường cũng quan trọng không kém."},{"q":"彼との結婚を両親が認めてくれないなら ___ ___ ★ ___ 。","o":["ことだ","までの","家を","出る"],"a":2,"order":[3,4,2,1],"vi_p2":"Nếu bố mẹ không chịu chấp nhận chuyện kết hôn với anh ấy thì chỉ còn cách tự ra ở riêng."},{"q":"彼は代議士の ___ ___ ★ ___ 政治家を目指して勉強している。","o":["自らも","かたわら","をする","秘書"],"a":2,"order":[4,3,2,1],"vi_p2":"Anh ấy vừa làm thư ký cho nghị sĩ vừa tự học để trở thành chính trị gia."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"相手に質問しておきながら、相手が答えを言うと、「それは違う」「そんなのナンセンスだ」などと、即座にその答えを否定してしまう人がいます。このような人は他人に質問する資格がありません。もちろん誰かを育てようとしていて、わざと相手の答えを否定することはありますし、厳しい交渉においては相手の主張を即座に否定しなければならない場面もあります。しかし、常に相手の答えを否定し、自分の考えのみを【1】、何も質問などする必要がありません。自分の考えだけ話していればいいのです。\nこのような人は、自分の考えの方が相手の考えよりも優れていることを証明【2】相手の答えを否定する傾向にあります。相手の答えを「それはすばらしい」などと言うと自分が劣っているような感じになってしまって自尊心が傷つくので、「その考えは間違っている。正しい答えを教えてあげよう」【3】相手の答えを否定してしまうのです。\n相手の答えを即座に否定してしまう人は、それによって自分の優秀さを証明【4】ことを知らなければなりません。むしろ相手は気分を害してしまい、「人の気持ちも理解できないわからず屋だ」と感じ、離れていってしまうでしょう。\n相手に質問を【5】、相手の答えをじっくり聞き、その答えを受け入れるようにしましょう。相手の答えを否定したくなったら、「ここで答えを否定することにより、相手はどんな気分になるだろう。また、私たちが話し合っていることに対してプラスになるだろうか」と自問してから発言するように心がけましょう。\n（谷原誠著『人を動かす質問力』角川書店刊）","items":[{"label":"1","o":["述べるのだから","述べるに際して","述べるのであれば","述べるはずだから"],"a":3,"hint":"Dạng câu hỏi: Điều kiện giả định (~のであれば)\n\nQuan hệ A-B: A (nếu chỉ định nói ra ý kiến riêng — giả định điều kiện) dẫn đến B (không cần phải hỏi gì cả).\n\n「自分の考えのみを【1】、何も質問などする必要がありません」→ điều kiện giả định → chọn ③ 述べるのであれば\n→ のであれば = 'nếu là trường hợp...' (giả định điều kiện)\n\nchỗ này là bẫy\n\n✗ 述べるのだから = nguyên nhân, không phải điều kiện giả định\n\n✗ 述べるに際して = 'vào lúc...' (thời điểm) — sai nghĩa\n\n✗ 述べるはずだから = 'vì chắc chắn sẽ...' — sai nghĩa","sentence":"しかし、常に相手の答えを否定し、自分の考えのみを【1】、何も質問などする必要がありません。"},{"label":"2","o":["するなりに","しこそすれ","する限りに","したいがために"],"a":4,"hint":"Dạng câu hỏi: Động cơ mạnh (~したいがために)\n\nQuan hệ A-B: A (muốn chứng minh mình hơn đối phương) là ĐỘNG CƠ MẠNH thúc đẩy B (xu hướng phủ định câu trả lời đối phương).\n\n「自分の考えの方が…優れていることを証明【2】相手の答えを否定する傾向」→ động cơ mạnh → chọn ④ したいがために\n→ したいがために = 'vì muốn...' (động cơ/mục đích mạnh)\n\nchỗ này là bẫy\n\n✗ するなりに = 'theo cách riêng khi làm' — sai nghĩa\n\n✗ しこそすれ = Vこそすれ〜ない (nhấn mạnh làm A chứ không B) — sai cấu trúc hoàn toàn\n\n✗ する限りに = 'trong phạm vi làm' — sai nghĩa","sentence":"このような人は、自分の考えの方が相手の考えよりも優れていることを証明【2】相手の答えを否定する傾向にあります。"},{"label":"3","o":["とみえて","とばかりに","ともなく","とすべく"],"a":2,"hint":"Dạng câu hỏi: Thái độ ngầm qua trích dẫn (とばかりに)\n\nQuan hệ A-B: A (câu trích dẫn chưa nói thành lời: 'để tôi dạy cho đáp án đúng') thể hiện THÁI ĐỘ NGẦM dẫn đến hành động B (phủ định câu trả lời đối phương).\n\n「正しい答えを教えてあげよう」【3】相手の答えを否定してしまうのです」→ thái độ ngầm thể hiện qua trích dẫn → chọn ② とばかりに\n→ とばかりに = 'như muốn nói rằng...' (hành động thể hiện ý chưa nói thành lời)\n\nchỗ này là bẫy\n\n✗ とみえて = 'có vẻ như' (suy đoán từ quan sát bên ngoài) — sai, đây là thái độ ngầm chứ không phải suy đoán\n\n✗ ともなく = 'một cách vô định' — sai nghĩa\n\n✗ とすべく = 'để mà...' (mục đích) — sai cấu trúc","sentence":"正しい答えを教えてあげよう」【3】相手の答えを否定してしまうのです。"},{"label":"4","o":["しなくはない","したことにはならない","することになる","できないこともない"],"a":2,"hint":"Dạng câu hỏi: Phủ định kết quả logic (~ことにはならない)\n\nQuan hệ A-B: A (ngay lập tức phủ định câu trả lời đối phương) KHÔNG CÓ NGHĨA LÀ đã đạt được B (chứng minh sự ưu tú của bản thân) — phủ định suy luận sai lầm.\n\n「それによって自分の優秀さを証明【4】ことを知らなければなりません」→ phủ định kết quả logic → chọn ② したことにはならない\n→ したことにはならない = 'không có nghĩa là đã chứng minh được...'\n\nchỗ này là bẫy\n\n✗ しなくはない = phủ định kép nhẹ, khẳng định gián tiếp — sai hướng hoàn toàn\n\n✗ することになる = 'sẽ thành ra là chứng minh được' — NGƯỢC nghĩa hoàn toàn\n\n✗ できないこともない = 'cũng không phải không thể' — sai nghĩa, không khớp mạch phê phán","sentence":"相手の答えを即座に否定してしまう人は、それによって自分の優秀さを証明【4】ことを知らなければなりません。"},{"label":"5","o":["したからには","するくらいなら","してからというもの","することのないように"],"a":1,"hint":"Dạng câu hỏi: Nghĩa vụ sau cam kết (~からには)\n\nQuan hệ A-B: A (đã hỏi đối phương rồi — hành động đã cam kết) kéo theo NGHĨA VỤ B (phải lắng nghe kỹ và chấp nhận câu trả lời).\n\n「相手に質問を【5】、相手の答えをじっくり聞き…受け入れる」→ nghĩa vụ sau cam kết → chọn ① したからには\n→ したからには = 'đã làm... thì (đương nhiên phải)...'\n\nchỗ này là bẫy\n\n✗ するくらいなら = cần 2 vế so sánh — sai cấu trúc\n\n✗ してからというもの = 'kể từ khi...(luôn luôn)' — sai sắc thái, đây là nghĩa vụ logic chứ không phải thói quen liên tục\n\n✗ することのないように = 'để không xảy ra việc hỏi' — sai nghĩa, ngược với ý khuyến khích nên hỏi","sentence":"相手に質問を【5】、相手の答えをじっくり聞き、その答えを受け入れるようにしましょう。"}]}]},{"id":"r19","name":"第19回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"バレーボールの選手になりたいなら、身長は高い（　）だろう。","o":["といわんばかり","といったらない","に越したことはない","に限ったことではない"],"a":3,"vi":"Nếu muốn trở thành vận động viên bóng chuyền thì chiều cao càng cao càng tốt.","hint":"Thấy「身長は高い＿＿だろう」→ chọン に越したことはない\n✔ V/い/な普通形＋に越したことはない =「không gì bằng...」(càng nhiều/cao càng tốt)"},{"q":"結婚してから、彼は以前（　）まじめに働くようになった。","o":["と相まって","にもまして","ならいざ知らず","としたところで"],"a":2,"vi":"Sau khi kết hôn, anh ấy làm việc chăm chỉ hơn cả trước đây.","hint":"Thấy「以前＿＿まじめに働くようになった」→ chọン にもまして\n✔ N＋にもまして =「hơn cả (trước)...」(so sánh vượt qua mức tham chiếu)"},{"q":"私が書いた論文は、先輩の論文の足元にも（　）ものだった。","o":["及ばない","すまない","たえない","足りない"],"a":1,"vi":"Luận văn tôi viết còn kém xa so với luận văn của tiền bối.","hint":"Thấy「足元にも＿＿ものだった」→ chọン 及ばない\n✔ 〜の足元にも及ばない = cụm cố định「không theo kịp, kém xa」"},{"q":"この記事は、取材に決して手を抜かない彼（　）はじめて書けたのだろう。","o":["にして","にせよ","をおいて","をもって"],"a":1,"vi":"Bài báo này chắc chỉ có anh ấy - người không bao giờ làm việc lấy lệ - mới viết nổi.","hint":"Thấy「決して手を抜かない彼＿＿はじめて書けた」→ chọン にして\n✔ N＋にして =「ngay cả ở (trạng thái/tư cách) đó」(nhấn mạnh điều kiện đặc biệt)"},{"q":"このめがねをかけると、まるで映像が目の前にある（　）見える。","o":["とみえて","かのように","とばかりに","かと思いきや"],"a":2,"vi":"Đeo chiếc kính này vào, cảm giác như hình ảnh hiện ngay trước mắt.","hint":"Thấy「まるで映像が目の前にある＿＿見える」→ chọン かのように\n✔ まるで〜かのように = cụm cố định「như thể là...vậy」"},{"q":"問題は以前から指摘されていたが、今日（　）まったく改善されていない。","o":["限りで","に至るまで","はさておき","はもとより"],"a":2,"vi":"Vấn đề đã được chỉ ra từ trước nhưng đến giờ vẫn chưa được cải thiện chút nào.","hint":"Thấy「今日＿＿まったく改善されていない」→ chọン に至るまで\n✔ 今日に至るまで =「cho đến tận hôm nay」(cố định, nhấn mạnh kéo dài đến hiện tại)\n✘ はさておき = tạm gác sang một bên"},{"q":"何日も眠れず、（　）悩んで、仕事をやめることにした。","o":["悩みに","悩まずとも","悩もうにも","悩むともなく"],"a":1,"vi":"Mất ngủ nhiều đêm liền, suy nghĩ mãi rồi quyết định nghỉ việc.","hint":"Thấy「＿＿悩んで」với động từ lặp → chọン 悩みに\n✔ 動詞名詞形＋に＋同動詞名詞形 = kiểu lặp để nhấn mạnh「suy nghĩ mãi, lo mãi」(悩みに悩む)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"救命士 ___ ___ ★ ___ も冷静さを保つことが求められる。","o":["に","は","緊急時","あって"],"a":1,"order":[2,3,1,4],"vi_p2":"Nhân viên cứu thương dù trong tình huống khẩn cấp vẫn phải giữ được bình tĩnh."},{"q":"いくら忙しくても、時間がない ___ ___ ★ ___ 趣味があるはずだ。","o":["なら","できる","ない","なりに"],"a":4,"order":[1,3,4,2],"vi_p2":"Dù bận đến mấy, chắc chắn vẫn có sở thích phù hợp với thời gian ít ỏi của mình."},{"q":"母は父が亡くなってから ___ ___ ★ ___ 泣いている。","o":["という","は","父を思い出して","もの"],"a":3,"order":[1,4,3,2],"vi_p2":"Kể từ khi bố mất, mẹ hay nhớ đến bố rồi khóc."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"ひとり暮らしを始めてから料理をする機会が【1】しまった。自分ひとりだけのためだと思うと面倒になり、つい外食ですませたり、作る【2】なるべく短時間で簡単にできるものを選ぶようになる。たまには凝った料理に挑戦してみようと思うこともあるが、たいてい作っている過程で味見をしすぎ、お腹がいっぱいになってしまうから、さあ、出来上がりましたという瞬間の感激が薄れて面白味に欠ける。その上、できた料理が必ず余ってしまい、何日も連続して同じものを食べなくてはならなくなるのは辛い。\n料理の腕というものは、その料理を【3】相手があってこそ磨かれるもののようだ。「うまい」「まずい」と反応されて初めて次回への意欲にも、反省にもつながる。自分が食欲のないときでさえ、飢えた家族のためには台所に【4】。必然、レパートリーはふえ、上手な手順を身につけることになるのだろう。\n学生時代にはまったく料理と縁のなかった友人が、\n「主婦って大変なのよ」\nと言いながら、メキメキと腕を上げ、おいしい手料理を披露してくれたりすると、羨望のまなざしを向けてしまう。\n「私【5】昔は、母の手伝いをしながらずいぶん色々な料理を覚えたものなんだけど」\nと言いたいところだが、その料理も作らなければ意味はない。\n（阿川佐和子著『メダカの花嫁学校』文藝春秋刊）","items":[{"label":"1","o":["めっきり減って","かえって増えて","めったにしなくなって","たちまち増えて"],"a":1,"hint":"Dạng câu hỏi: Mức độ thay đổi rõ rệt (めっきり)\n\nQuan hệ A-B: A (sống một mình) là nguyên nhân khiến B (cơ hội nấu ăn) GIẢM HẲN, rõ rệt — khớp các câu sau (ngại nấu, ăn ngoài).\n\n「ひとり暮らしを始めてから料理をする機会が【1】しまった」→ khớp các câu sau (ngại nấu, ăn ngoài) → chọn ① めっきり減って\n→ めっきり減って = 'giảm hẳn, giảm rõ rệt'\n\nchỗ này là bẫy\n\n✗ かえって増えて/たちまち増えて = NGƯỢC nghĩa hoàn toàn (tăng lên)\n\n✗ めったにしなくなって = gần nghĩa nhưng sai ngữ pháp (めったに〜ない thường đi với động từ, không hợp với 機会が làm chủ ngữ)","sentence":"ひとり暮らしを始めてから料理をする機会が【1】しまった。"},{"label":"2","o":["にかけて","にしても","にすれば","につけ"],"a":2,"hint":"Dạng câu hỏi: Nhượng bộ (~にしても)\n\nQuan hệ A-B: A (dù có nấu ăn đi chăng nữa) vẫn dẫn đến B (chọn món nhanh gọn, đơn giản) — nhượng bộ, không phải điều kiện.\n\n「作る【2】なるべく短時間で簡単にできるものを選ぶ」→ nhượng bộ → chọn ② にしても\n→ Vるにしても = 'dù có...thì cũng...'\n\nchỗ này là bẫy\n\n✗ にかけて = 'về mặt (chuyên môn)' — sai nghĩa ở đây\n\n✗ にすれば = 'nếu xét theo góc độ của (người)' — sai chủ ngữ/nghĩa\n\n✗ につけ = 'mỗi khi' — sai nghĩa","sentence":"自分ひとりだけのためだと思うと面倒になり、つい外食ですませたり、作る【2】なるべく短時間で簡単にできるものを選ぶようになる。"},{"label":"3","o":["食べられる","食べさせる","食べさせられる","食べられてしまう"],"a":2,"hint":"Dạng câu hỏi: Sai khiến thuần (使役: させる)\n\nQuan hệ A-B: Chủ thể (người nấu ăn) CHỦ ĐỘNG khiến B (người ăn) ăn món đó — xác định chủ thể thực hiện hành động sai khiến, không phải quan hệ A-B logic.\n\n「料理の腕は、その料理を【3】相手があってこそ磨かれる」→ chủ thể (người nấu) CHỦ ĐỘNG khiến người khác ăn → chọn ② 食べさせる\n→ 食べさせる = thể sai khiến thuần, 'khiến/cho ai đó ăn'\n\nchỗ này là bẫy\n\n✗ 食べられる = bị động/khả năng — sai chủ thể\n\n✗ 食べさせられる = bị động của sai khiến 'bị bắt phải ăn' — sai chủ thể hoàn toàn\n\n✗ 食べられてしまう = bị động 'bị ăn mất' — sai nghĩa\n\n📌 Dạng câu hỏi 使役 (sai khiến) theo đúng [[Xác định chủ thể cấu trúc cho-nhận và ý đồ sai khiến trong câu đục lỗ N1]]: người nấu là chủ thể THỰC HIỆN hành động khiến người khác ăn → thể sai khiến thuần.","sentence":"料理の腕というものは、その料理を【3】相手があってこそ磨かれるもののようだ。"},{"label":"4","o":["立たざるを得ない","立つどころではない","立たずにはいられない","立つことにはならない"],"a":1,"hint":"Dạng câu hỏi: Ép buộc do hoàn cảnh khách quan (~ざるを得ない)\n\nQuan hệ A-B: A (gia đình đang đói — hoàn cảnh khách quan) BUỘC B (bản thân) phải đứng vào bếp dù không có cảm giác thèm ăn.\n\n「自分が食欲のないときでさえ、飢えた家族のためには台所に【4】」→ ép buộc do hoàn cảnh khách quan → chọn ① 立たざるを得ない\n→ ざるを得ない = 'không thể không..., buộc phải...' (do hoàn cảnh)\n\nchỗ này là bẫy\n\n✗ 立つどころではない = 'không phải lúc để đứng bếp' — sai nghĩa hoàn toàn\n\n✗ 立たずにはいられない = cảm xúc/ý chí cá nhân thôi thúc — khác sắc thái với ざるを得ない (bắt buộc từ hoàn cảnh khách quan vì gia đình đói)\n\n✗ 立つことにはならない = 'không có nghĩa là phải đứng' — sai nghĩa hoàn toàn","sentence":"自分が食欲のないときでさえ、飢えた家族のためには台所に【4】。"},{"label":"5","o":["こそ","であれ","だって","ときたら"],"a":3,"hint":"Dạng câu hỏi: Nhấn mạnh bản thân cũng không ngoại lệ (だって)\n\nQuan hệ A-B: Không phải quan hệ A-B mà là trợ từ だって nhấn mạnh 'tôi CŨNG vậy' trong văn nói.\n\n「私【5】昔は、母の手伝いをしながら…料理を覚えたものなんだけど」→ 'tôi cũng vậy' → chọn ③ だって\n→ 私だって = 'tôi cũng vậy' (だって: nhấn mạnh bản thân cũng không ngoại lệ, văn nói)\n\nchỗ này là bẫy\n\n✗ こそ = 'chính là' (nhấn mạnh khẳng định) — sai sắc thái\n\n✗ であれ = 'dù là...' (nhượng bộ) — sai nghĩa\n\n✗ ときたら = thường phê bình người KHÁC — sai chủ ngữ/sắc thái","sentence":"「私【5】昔は、母の手伝いをしながらずいぶん色々な料理を覚えたものなんだけど」\nと言いたいところだが、その料理も作らなければ意味はない。"}]}]},{"id":"r20","name":"第20回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"家族の協力（　）、この作品を完成させることはできなかった。","o":["でなくて","なしには","ことなしに","ではあるまいし"],"a":2,"vi":"Nếu không có sự hợp tác của gia đình thì tác phẩm này đã không thể hoàn thành.","hint":"Thấy「家族の協力＿＿完成できなかった」→ chọン なしには\n✔ N＋なしには〜ない =「nếu không có...thì không thể」(điều kiện tiên quyết)"},{"q":"明日の会には（　）、開始時間には間に合わないだろう。","o":["行かずとも","行かずには","行けないまでも","行けなくはないが"],"a":4,"vi":"Tuy không phải là không thể đi họp ngày mai, nhưng chắc sẽ không kịp giờ bắt đầu.","hint":"Thấy「明日の会には＿＿間に合わないだろう」→ chọン 行けなくはないが\n✔ V可能ない形＋くはないが = phủ định nhẹ「không phải là không thể đi, nhưng...」"},{"q":"弁護士（　）者が、犯罪にかかわっていたとは驚きだ。","o":["ごとき","に至る","くらいの","ともあろう"],"a":4,"vi":"Thật bất ngờ khi một người làm luật sư lại dính líu đến tội phạm.","hint":"Thấy「弁護士＿＿者が犯罪に」→ chọン ともあろう\n✔ N＋ともあろう者が =「là người có địa vị như...mà lại」(phê phán mạnh vì không xứng)"},{"q":"父は何を食べても、おいしい（　）まずい（　）言わない。","o":["とて／とて","とも／とも","なり／なり","やら／やら"],"a":2,"vi":"Bố tôi ăn gì cũng không khen ngon cũng chẳng chê dở, chẳng nói gì cả.","hint":"Thấy「おいしい＿＿まずい＿＿言わない」→ chọン とも〜とも\n✔ 〜とも〜とも言わない =「không nói là...hay là...」(cả hai đều không bình luận)"},{"q":"帰国する前にもう一度クラスの友達に会いたいと思いながら、結局（　）。","o":["会えずじまいだった","会わざるを得なかった","会わんばかりだった","会えないでもなかった"],"a":1,"vi":"Dù muốn gặp lại bạn cùng lớp trước khi về nước, rốt cuộc tôi vẫn không gặp được.","hint":"Thấy「会いたいと思いながら結局＿＿」→ chọン 会えずじまいだった\n✔ V否定ず＋じまいだった =「rốt cuộc đã không...」(tiếc nuối, dự định không thực hiện được)"},{"q":"決勝戦のプレッシャーは、他の試合とは（　）ならないほどだった。","o":["比べものに","比べようが","比べずには","比べるべくも"],"a":1,"vi":"Áp lực của trận chung kết không thể so sánh được với các trận khác.","hint":"Thấy「他の試合とは＿＿ならないほどだった」→ chọン 比べものに\n✔ 比べものにならない = cụm cố định「không thể so sánh được」"},{"q":"彼女が出て行こうとすると、彼は「行くな」と（　）強く抱きしめた。","o":["いえども","思いきや","ばかりに","ごとく"],"a":3,"vi":"Khi cô ấy định bước ra, anh ấy đã ôm chặt cô như muốn nói \"đừng đi\".","hint":"Thấy「行くな＿＿強く抱きしめた」→ chọン とばかりに\n✔ S（引用）＋とばかりに =「như muốn nói rằng (đừng đi)」(hành động thay lời nói)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"久しぶりの実家では ___ ___ ★ ___ で迎えてくれた。","o":["誕生日でも","ずくめ","ないのに","ごちそう"],"a":4,"order":[1,3,4,2],"vi_p2":"Về nhà bố mẹ lâu ngày, dù không phải sinh nhật họ vẫn đón tiếp toàn món ngon."},{"q":"会場は混雑のため中に入れず、係員に ___ ___ ★ ___ 列に並んだ。","o":["まま","が","に","言われる"],"a":1,"order":[4,2,1,3],"vi_p2":"Vì hội trường quá đông không vào được, tôi cứ theo lời nhân viên mà xếp hàng."},{"q":"利用者の ___ ___ ★ ___ 見直しが必要になるかもしれない。","o":["商品の","反応","では","いかん"],"a":3,"order":[2,4,3,1],"vi_p2":"Tùy theo phản ứng của người dùng mà có thể phải xem xét lại sản phẩm."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"グループで山に行くと、つい、まわりに頼りがちになりますが、いつも自分が主体でないとだめです。歩くのは自分。リーダーがどんなにベテランでも、ただ一緒にいるという【1】、その人と手をつないで歩くわけじゃないし、おんぶしてもらうわけでもありません。主人公はいつも自分なんです。\nひとりの【2】で一日の行程やコースタイムの配分などを気にしていれば、精神面で楽になるし、ずいぶんたくさんのことが学べます。\nたとえば出発前に地図を見ておけば、どこで登りが続くか、どこが急な下りかなど、一日の行程できつそうな場所が分かるので、心づもりができます。このあたりが休憩に適しているな、お昼はここかなと自分【3】プランを描いておけば、リーダーの判断と比べることもできます。地図を読む力もつきます。(中略)\n【4】ひとりで行くほうが力がつくのではないか、あるいは、山はひとりで登りたいという人がいるかもしれませんが、事故を防ぐためには単独でないほうがいいと思います。何かあっても助けを求めることができませんからね。\nわたし自身はどうかというと、ひとりだと山を楽しむ気分にあまりなれません。危険度が高まるし、風の向きや現在地の確認など常に注意を払う必要があるから、気が休まらないのです。誰かと一緒のほうが、ずっとリラックスできます。「かわいい花と出会えてよかったねー」と【5-a】、「本当ねー」と【5-b】人がいたほうがいい。ひとりで「いいねー」と言ってもしょうがないですよね。\n（田部井淳子著『いつでも山を』小学館刊　※一部省略あり）","items":[{"label":"1","o":["こととて","ことなしに","だけとはいえ","だけのことで"],"a":4,"hint":"Dạng câu hỏi: Lý do đơn thuần, nhỏ nhặt (~だけのことで)\n\nQuan hệ A-B: A (chỉ đơn thuần cùng đi với leader) KHÔNG dẫn đến B (nắm tay người đó mà đi) — だけのことで + わけじゃない phủ định liên hệ giữa A và B.\n\n「リーダーがどんなにベテランでも、ただ一緒にいるという【1】、その人と手をつないで歩くわけじゃない」→ chọn ④ だけのことで\n→ だけのことで = 'chỉ đơn thuần vì (lý do nhỏ) đó thôi (mà)' + わけじゃない câu sau\n\nchỗ này là bẫy\n\n✗ こととて/ことなしに = sai sắc thái/nghĩa hoàn toàn\n\n✗ だけとはいえ = gần nghĩa nhưng không tự nhiên bằng だけのことで trong collocation với わけじゃない","sentence":"リーダーがどんなにベテランでも、ただ一緒にいるという【1】、その人と手をつないで歩くわけじゃないし、おんぶしてもらうわけでもありません。"},{"label":"2","o":["せい","つもり","ふり","わけ"],"a":2,"hint":"Dạng câu hỏi: Tâm thế giả định (~つもり)\n\nQuan hệ A-B: Không phải quan hệ A-B logic mà là mô tả TÂM THẾ: giữ tinh thần 'như một mình' (ひとりのつもりで) dù đang đi nhóm.\n\n「ひとりの【2】で一日の行程やコースタイムの配分などを気にしていれば」→ tâm thế tự chủ dù đi nhóm → chọn ② つもり\n→ ひとりのつもりで = 'với tâm thế như thể một mình'\n\nchỗ này là bẫy\n\n✗ せい = 'lỗi tại' — sai nghĩa hoàn toàn\n\n✗ ふり = 'giả vờ' — sai nghĩa (đây là thái độ THẬT, không phải giả vờ)\n\n✗ わけ = 'lý do/ý nghĩa' — sai nghĩa/cấu trúc","sentence":"ひとりの【2】で一日の行程やコースタイムの配分などを気にしていれば、精神面で楽になるし、ずいぶんたくさんのことが学べます。"},{"label":"3","o":["なりに","あっての","に即して","として"],"a":1,"hint":"Dạng câu hỏi: Theo cách riêng của bản thân (~なりに)\n\nQuan hệ A-B: A (bản thân, dù không chuyên nghiệp) vẫn tự vẽ ra B (kế hoạch) THEO CÁCH RIÊNG của mình.\n\n「お昼はここかなと自分【3】プランを描いておけば」→ chọn ① なりに\n→ 自分なりに = 'theo cách riêng của bản thân' (dù không chuyên nghiệp)\n\nchỗ này là bẫy\n\n✗ あっての (N1あってのN2) = sai cấu trúc\n\n✗ に即して = 'dựa theo, bám sát' — sai nghĩa\n\n✗ として = 'với tư cách là' — sai nghĩa","sentence":"このあたりが休憩に適しているな、お昼はここかなと自分【3】プランを描いておけば、リーダーの判断と比べることもできます。"},{"label":"4","o":["それから","それでも","それとも","それなら"],"a":4,"hint":"Dạng câu hỏi: Nhượng bộ trước phản biện (それでも)\n\nQuan hệ A-B: A (có thể có người nghĩ đi một mình sẽ giỏi hơn) DÙ VẬY B (tác giả) vẫn khuyên không nên đi một mình để tránh tai nạn.\n\n「【4】ひとりで行くほうが力がつくのではないか…と思う人がいるかもしれませんが、事故を防ぐためには単独でないほうがいい」→ nhượng bộ trước khi đưa quan điểm ngược → chọn ② それでも\n→ それでも = 'dù vậy' (chuẩn bị đưa quan điểm ngược lại bằng が phía sau)\n\nchỗ này là bẫy\n\n✗ それから = 'sau đó' (thời gian) — sai nghĩa\n\n✗ それとも = 'hay là' (lựa chọn) — sai nghĩa/cấu trúc\n\n✗ それなら = 'nếu vậy thì' — sai, không phải kết luận thuận theo","sentence":"(中略)\n【4】ひとりで行くほうが力がつくのではないか、あるいは、山はひとりで登りたいという人がいるかもしれませんが、事故を防ぐためには単独でないほうがいいと思います。"},{"label":"5","o":["a 言ったら／b 言ってあげる","a 言ったら／b 言ってくれる","a 言ってあげたら／b 言う","a 言ってくれたら／b 言う"],"a":2,"hint":"Dạng câu hỏi: Cho-nhận (授受): てくれる\n\nQuan hệ A-B: Chủ thể của hành động ĐÁP LẠI (nói 'đúng vậy') là NGƯỜI KHÁC, làm CHO người nói nghe — xác định chủ thể cho-nhận, không phải quan hệ A-B logic.\n\n「かわいい花と出会えてよかったねー」と【5-a】、「本当ねー」と【5-b】人がいたほうがいい」→ NGƯỜI KHÁC đáp lại CHO mình → chọn ② 言ったら/言ってくれる\n→ てくれる = người khác làm CHO mình (đáp lại lời mình nói)\n\nchỗ này là bẫy\n\n✗ 言ってあげる = 'tôi nói cho ai đó' — sai chủ thể, ở đây cần người KHÁC nói cho MÌNH nghe\n\n✗ 言ってあげたら/言ってくれたら (③④) = đảo vị trí てあげる/てくれる vào vế đầu sai — vế đầu chỉ là tôi tự nói ra, không cần trợ động từ cho-nhận\n\n📌 Dạng câu hỏi 授受 theo đúng Framework: chủ thể hành động ĐÁP LẠI là người khác, làm CHO người nói → てくれる.","sentence":"「かわいい花と出会えてよかったねー」と【5-a】、「本当ねー」と【5-b】人がいたほうがいい。"}]}]},{"id":"r21","name":"第21回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"明日、知事から何か重大な発表がある（　）。","o":["限りだ","とされる","に至った","とのことだ"],"a":4,"vi":"Nghe nói ngày mai thống đốc sẽ có thông báo quan trọng.","hint":"Thấy「重大な発表がある＿＿」→ chọン とのことだ\n✔ S普通形＋とのことだ =「nghe nói là...」(truyền đạt thông tin gián tiếp)\n✘ とされる = được coi là (đánh giá khách quan)"},{"q":"いくら走った（　）、もう1時半の電車には間に合わないだろう。","o":["ゆえに","わりに","ところで","ものだから"],"a":3,"vi":"Dù có chạy thế nào cũng không kịp chuyến tàu 1 giờ rưỡi nữa.","hint":"Thấy「いくら走った＿＿間に合わない」→ chọン ところで\n✔ Vた形＋ところで〜ない =「dù có...đi nữa cũng vô ích」"},{"q":"この化粧品に入っている成分は、肌の老化を防ぐと（　）。","o":["している","させている","されている","させられている"],"a":3,"vi":"Thành phần trong mỹ phẩm này được cho là có tác dụng ngăn ngừa lão hóa da.","hint":"Thấy「〜を防ぐと＿＿」→ chọン されている\n✔ 受身「〜とされている」=「được cho là...」(định luận khoa học/chung)\n✘ させている = khiến cho...đang (nghĩa khác)"},{"q":"バイクで転倒して、背中（　）足（　）、全身傷だらけになった。","o":["なり／なり","につけ／につけ","というか／というか","といわず／といわず"],"a":4,"vi":"Bị ngã xe máy, lưng cũng bị thương, chân cũng bị thương, toàn thân đầy vết thương.","hint":"Thấy「背中＿＿足＿＿全身傷だらけ」→ chọン といわず〜といわず\n✔ N1といわずN2といわず =「không kể...hay là...」(bất kể bộ phận nào cũng vậy)"},{"q":"姉（　）、僕には男性としての魅力がまったくないらしい。","o":["からして","のことだから","いかんによらず","から言わせれば"],"a":4,"vi":"Bất kể chị tôi nói gì, hình như tôi hoàn toàn không có sức hút với phái nam.","hint":"Thấy「姉＿＿僕には魅力がない」→ chọン から言わせれば\n✔ N＋に言わせれば =「nếu để...nói thì」(đưa ra nguồn nhận xét)\n✘ いかんによらず = bất kể thế nào (không liên quan đến người nói)"},{"q":"科学の力で新たな生命を作り出すなど、考える（　）恐ろしい。","o":["さえ","だに","のみ","ばかりに"],"a":2,"vi":"Chỉ riêng việc nghĩ đến chuyện tạo ra sự sống mới bằng khoa học thôi cũng đã thấy đáng sợ rồi.","hint":"Thấy「考える＿＿恐ろしい」→ chọン だに\n✔ V辞書形＋だに＋感情 =「chỉ mới (nghĩ đến) thôi đã...」(cố định: 考えるだに恐ろしい)\n✘ さえ = ngay cả (mức thấp nhất)"},{"q":"「申し訳ない」と（　）問題じゃないだろう。ちゃんと弁償してくれ。","o":["謝ってすむ","謝ってくれる","謝ったところで","謝ったといえども"],"a":1,"vi":"Chỉ nói \"xin lỗi\" thôi thì chưa giải quyết được vấn đề. Hãy đền bù đàng hoàng đi.","hint":"Thấy「謝ったところで問題じゃない」→ chọン 謝ったところで\n✔ Vた形＋ところで〜ない =「dù có xin lỗi...cũng không giải quyết được」"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"いくら探してもないところを ___ ___ ★ ___ に違いない。","o":["置いてきた","かばんに入れた","みると","つもりで"],"a":4,"order":[3,2,4,1],"vi_p2":"Tìm mãi không thấy, nhìn lại thì chắc là vừa cho vào túi mà để quên ở nhà rồi."},{"q":"戦争は新たに ___ ___ ★ ___ 解決にもならない。","o":["こそすれ","何の","憎しみを","生み"],"a":1,"order":[3,4,1,2],"vi_p2":"Chiến tranh chỉ sinh ra thêm hận thù chứ không giải quyết được gì."},{"q":"あの有名な教授 ___ ___ ★ ___ 心強いことだ。","o":["とは","までも","が","協力してくれる"],"a":4,"order":[2,3,4,1],"vi_p2":"Ngay cả giáo sư nổi tiếng kia cũng hợp tác thì thật đáng tin tưởng."}]},{"type":"reading","title":"問題3 次の文章を読んで、空欄に入る最もよいものを選びなさい。","passage":"人がほかの生きものと違うのは、文字や言葉で意思を伝え合えることです。人は、この能力のおかげで、ほかの生きものには見られない繁栄をとげてきました。ところが今日では「話すのは好きだが、書くのは苦手」という人がふえました。とくに若い人たちの間でそうした声が多く【1】。\n人はこれまで、主として文字によって、時代と地域をこえて、文化を伝え、歴史を残してきたのです。したがって、いかなる地域【2-a】、いかなる時代【2-b】、文字の重要性が減るとは思われません。その文字によってつくられるのが文章です。ですから、文字が嫌いだ、文章は得意でない、というのは、私たちの現在を未来につなぐ上で、大変困った事態だと考えられます。\n【3】、学校や社会では、このところ文章力の向上策が注目され、入学試験や入社試験でも、文章力の有無が問われるようになってきました。私は新聞記者として、自分で文章を書くほか、ほかの人の文章も数多く読んできました。ことにカルチャーセンターや大学で文章表現のクラスを持ってから、いっそう文章づくりにかかわるようになりました。(中略)\n人は、文章をまとめることで自分をしっかりと認識できます。自分が分かると、自分の周囲の状況、【4-a】地域社会、【4-b】日本、ひいては世界の状況も理解できるようになります。その点、文章づくりは、自分と世界を結ぶ基盤ともいえます。\n文章は決してむずかしいものではありません。事前に「何を、どう書くか」考え、【5】「ひとつひとつの文章を短く」記してゆけばよいのです。こうしてできた、分かりやすく、正確で、品位のある文章は、書いた人の心から、まわりの人々の心へ素直に伝わってゆきます。\n（猪狩章著『心に届く文章づくり』岩波書店刊　※一部省略あり）","items":[{"label":"1","o":["聞けます","聞かれます","聞こえます","聞かされます"],"a":2,"hint":"Dạng câu hỏi: Khả năng mở rộng trong văn phê bình (聞ける)\n\nQuan hệ A-B: A (những tiếng nói/ý kiến như vậy) là điều B (người đọc) CÓ THỂ BẮT GẶP/nghe thấy trong xã hội — cách dùng 聞ける mở rộng của văn nghị luận.\n\n「とくに若い人たちの間でそうした声が多く【1】」→ chọn ① 聞けます\n→ 聞ける (khả năng) ở văn nghị luận thường dùng để nói 'có thể bắt gặp/nghe thấy (những ý kiến/quan điểm như vậy) trong xã hội' — cách dùng mở rộng phổ biến trong văn phê bình\n\nchỗ này là bẫy\n\n✗ 聞かれます (bị động) = ít tự nhiên hơn trong cách diễn đạt này\n\n✗ 聞こえます (tự động từ, nghe thấy vật lý) = thiên về âm thanh thực tế vang đến tai, kém tự nhiên hơn khi mô tả 'ý kiến xã hội xuất hiện nhiều'\n\n✗ 聞かされます (bị động sai khiến, 'bị bắt nghe') = sai hoàn toàn, không ai ép người đọc nghe cả","sentence":"とくに若い人たちの間でそうした声が多く【1】。"},{"label":"2","o":["a とも／b とも","a なり／b なり","a であれ／b であれ","a といい／b といい"],"a":3,"hint":"Dạng câu hỏi: Liệt kê nhượng bộ (~であれ~であれ)\n\nQuan hệ A-B: A (bất kể vùng nào) và B (bất kể thời đại nào) đều liệt kê theo mẫu Nであれ, Nであれ — 'dù là N nào'.\n\n「いかなる地域【2-a】、いかなる時代【2-b】、文字の重要性が減るとは思われません」→ mẫu いかなるN であれ (bất kể) → chọn ③ であれ/であれ\n→ Nであれ、Nであれ = 'dù là N nào, dù là N nào' (liệt kê nhượng bộ, đi cùng いかなる/どんな)\n\nchỗ này là bẫy\n\n✗ とも/とも = thường đi sau tính từ/động từ ý chí, không tự nhiên gắn trực tiếp sau danh từ kiểu này\n\n✗ なり/なり = 'N này hay N kia' (liệt kê lựa chọn cụ thể) — sai sắc thái 'bất kể'\n\n✗ といい/といい = liệt kê 2 khía cạnh để đánh giá chung — sai sắc thái 'bất kể mọi trường hợp'","sentence":"したがって、いかなる地域【2-a】、いかなる時代【2-b】、文字の重要性が減るとは思われません。"},{"label":"3","o":["しかし","なぜなら","それとも","そこで"],"a":4,"hint":"Dạng câu hỏi: Chuyển sang hành động cụ thể (そこで)\n\nQuan hệ A-B: A (nhận thức về tầm quan trọng của viết văn) dẫn đến B (biện pháp cụ thể: chú trọng nâng cao năng lực viết) — quan hệ nhân quả chuyển sang hành động.\n\n「【3】、学校や社会では…文章力の向上策が注目され」→ chuyển sang hành động cụ thể → chọn ④ そこで\n→ そこで = 'vì vậy, do đó' (chuyển sang biện pháp cụ thể)\n\nchỗ này là bẫy\n\n✗ しかし = 'nhưng' — sai, không có tương phản\n\n✗ なぜなら = giải thích lý do cho câu TRƯỚC — sai hướng\n\n✗ それとも = 'hay là' — sai nghĩa hoàn toàn","sentence":"【3】、学校や社会では、このところ文章力の向上策が注目され、入学試験や入社試験でも、文章力の有無が問われるようになってきました。"},{"label":"4","o":["a ついで／b さらには","a および／b ましてや","a くわえて／b なおさら","a それにもまして／b なお"],"a":1,"hint":"Dạng câu hỏi: Liệt kê tăng tiến (および~ましてや)\n\nQuan hệ A-B: A (cộng đồng địa phương — bước đầu, liệt kê ngang hàng) rồi tăng tiến mạnh hơn đến B (Nhật Bản) trước khi đến ひいては (thế giới).\n\n「自分の周囲の状況、【4-a】地域社会、【4-b】日本、ひいては世界の状況も理解できる」→ liệt kê tăng tiến từ nhỏ đến lớn → chọn ② および/ましてや\n→ および = liệt kê ngang hàng (bước đầu: cộng đồng địa phương), ましてや = tăng tiến mạnh hơn (bước tiếp: Nhật Bản) trước ひいては (thế giới)\n\nchỗ này là bẫy\n\n✗ ①③④ = các cặp còn lại không tạo được đúng chuỗi tăng tiến 3 bước (địa phương → quốc gia → thế giới) tự nhiên bằng および+ましてや","sentence":"自分が分かると、自分の周囲の状況、【4-a】地域社会、【4-b】日本、ひいては世界の状況も理解できるようになります。"},{"label":"5","o":["それにつれて","それによって","それに従って","それに伴って"],"a":3,"hint":"Dạng câu hỏi: Phương tiện / căn cứ (それによって)\n\nQuan hệ A-B: A (suy nghĩ trước 'viết gì, viết thế nào') là PHƯƠNG TIỆN để thực hiện B (viết từng câu ngắn gọn) — それによって chỉ cách thức, không phải thay đổi song song.\n\n「事前に『何を、どう書くか』考え、【5】『ひとつひとつの文章を短く』記してゆけばよい」→ dùng bước 1 làm PHƯƠNG TIỆN cho bước 2 → chọn ② それによって\n→ それによって = 'bằng phương pháp/dựa vào điều đó' (phương tiện/căn cứ)\n\nchỗ này là bẫy\n\n✗ それにつれて/それに従って/それに伴って = đều mang nghĩa '2 việc thay đổi song song theo nhau' — sai vì đây không phải sự thay đổi dần dần mà là dùng bước 1 làm phương tiện cho bước 2","sentence":"事前に「何を、どう書くか」考え、【5】「ひとつひとつの文章を短く」記してゆけばよいのです。"}]}]},{"id":"r22","name":"第22回","parts":[{"type":"single","title":"問題1 次の文の（　）に入れるのに最もよいものを選びなさい。","items":[{"q":"真夏（　）、こんな寒い日にTシャツ1枚で出かけるなんて、どうかしてるよ。","o":["とばかりに","もかまわず","のことだから","じゃあるまいし"],"a":4,"vi":"Đâu phải đang giữa mùa hè mà mặc mỗi áo phông ra ngoài trong cái lạnh thế này, có vấn đề gì không vậy.","hint":"Thấy「真夏＿＿こんな寒い日にTシャツ」→ chọン じゃあるまいし\n✔ N＋じゃあるまいし =「đâu phải là (mùa hè)...mà」(phê phán vì không hợp lý)"},{"q":"弟の部屋は何か月も掃除していないから、汚いったら（　）。","o":["ありゃしない","きりがない","もんじゃない","ものともしない"],"a":1,"vi":"Phòng của em trai mấy tháng nay không dọn, bẩn đến mức không thể tả nổi.","hint":"Thấy「汚いったら＿＿」→ chọン ありゃしない\n✔ い形/V＋ったらありゃしない =「...thì không thể tả nổi」(khẩu ngữ phàn nàn cực mạnh)"},{"q":"引っ越しの準備をしなければならないが、いったい何から始めたらいい（　）。","o":["ものを","ものやら","ものでもない","ものともなく"],"a":2,"vi":"Phải chuẩn bị chuyển nhà nhưng chẳng biết nên bắt đầu từ đâu.","hint":"Thấy「何から始めたらいい＿＿」→ chọン ものやら\n✔ 疑問詞＋V普通形＋ものやら =「không biết phải...gì/thế nào」(lúng túng không quyết được)"},{"q":"海に近いこの地方（　）新鮮な魚料理を、どうぞお楽しみください。","o":["のごとき","なくしての","ならではの","にあっての"],"a":3,"vi":"Mời thưởng thức món cá tươi đặc trưng chỉ vùng biển này mới có.","hint":"Thấy「この地方＿＿新鮮な魚料理」→ chọン ならではの\n✔ N＋ならではの＋N =「đặc trưng chỉ...mới có」"},{"q":"彼は美人と（　）、必ず声をかけるような男だ。","o":["いえども","みえて","みると","ばかりに"],"a":3,"vi":"Anh ta dù gặp gái đẹp cũng nhất định sẽ bắt chuyện làm quen.","hint":"Thấy「美人と＿＿必ず声をかける」→ chọン みると\n✔ Vと＋みると =「hễ...là」(khi gặp điều kiện, hành động tự nhiên xảy ra)\n✘ いえども = dù là (nhượng bộ)"},{"q":"その映画のラストシーンは、音楽の美しさ（　）、非常に感動的だった。","o":["とあって","に即して","と相まって","にもまして"],"a":3,"vi":"Cảnh cuối phim đó rất xúc động nhờ kết hợp với phần nhạc nền tuyệt đẹp.","hint":"Thấy「音楽の美しさ＿＿感動的だった」→ chọン と相まって\n✔ A＋と＋Bが相まって =「A kết hợp cùng B tạo nên...」(cố định)"},{"q":"王妃の寝室は天井から床まで豪華に飾られ、まさに贅沢の（　）だった。","o":["極み","至り","いかん","ごとき"],"a":1,"vi":"Phòng ngủ của hoàng hậu được trang trí xa hoa từ trần đến sàn, đúng là đỉnh điểm của sự xa xỉ.","hint":"Thấy「まさに贅沢の＿＿だった」→ chọン 極み\n✔ N＋の極み =「đỉnh điểm/cực độ của...」(cố định: 贅沢の極み、感謝の極み)"}]},{"type":"order","title":"問題2 次の文の ★ に入る最もよいものを選びなさい。","items":[{"q":"彼は困難にあう ___ ___ ★ ___ 乗り越えてきた。","o":["せずに","苦労を","ものとも","たびに"],"a":3,"order":[4,2,3,1],"vi_p2":"Mỗi khi gặp khó khăn anh ấy lại vượt qua mà không nản lòng."},{"q":"このたびの訃報は、___ ___ ★ ___ ほかありません。","o":["驚くより","突然の","あまりに","こととて"],"a":4,"order":[3,2,4,1],"vi_p2":"Tin buồn này đến quá đột ngột, không biết phải làm gì ngoài việc đau lòng."},{"q":"どんなに ___ ___ ★ ___ 人はいつかは死ぬ。","o":["とも","限り","抵抗しよう","生きている"],"a":4,"order":[3,1,4,2],"vi_p2":"Dù kháng cự thế nào, con người sống thì rồi ai cũng sẽ chết."
